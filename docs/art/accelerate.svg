<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Accelerate</title>
  <!-- Craft. A delta-wing ship with a canopy, a spine and twin engines,
       climbing through deep space, with two afterimages of where it was a
       moment ago. The afterimages use a smoothed silhouette without the
       notched tail, so three copies read as motion rather than as a staircase. -->
  <defs>
    <radialGradient id="void" cx="0.62" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#1A2450"/>
      <stop offset="0.6" stop-color="#090B16"/>
      <stop offset="1" stop-color="#040509"/>
    </radialGradient>
    <linearGradient id="lead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9DB8FF"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FFC04D"/>
      <stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#9DB8FF" stop-opacity="0.38"/><stop offset="0.55" stop-color="#3D72FF" stop-opacity="0.12"/><stop offset="1" stop-color="#3D72FF" stop-opacity="0"/></radialGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/><stop offset="1" stop-color="#9DB8FF" stop-opacity="0.25"/></linearGradient></defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#void)"/>
    <g fill="#FFFFFF" opacity="0.55">
      <circle cx="46" cy="52" r="1.3"/>
      <circle cx="196" cy="206" r="1.1"/>
      <circle cx="220" cy="120" r="1"/>
      <circle cx="120" cy="30" r="0.9"/>
      <circle cx="30" cy="150" r="0.9"/>
    </g>
    <circle cx="150" cy="104" r="96" fill="url(#bloom)"/><g fill="#FFFFFF"><circle cx="27.2" cy="129.7" r="0.63" opacity="0.57"/><circle cx="29.9" cy="34.7" r="0.98" opacity="0.76"/><circle cx="42.2" cy="64.9" r="1.16" opacity="0.82"/><circle cx="236.6" cy="24.6" r="1.37" opacity="0.49"/><circle cx="46.9" cy="40.9" r="0.88" opacity="0.76"/><circle cx="55.2" cy="146.6" r="1.18" opacity="0.54"/><circle cx="27.6" cy="61.0" r="1.21" opacity="0.56"/><circle cx="69.7" cy="145.0" r="1.07" opacity="0.79"/><circle cx="237.5" cy="40.9" r="0.98" opacity="0.73"/><circle cx="48.7" cy="125.5" r="0.64" opacity="0.68"/><circle cx="40" cy="206" r="1.6"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.6s" begin="0s" repeatCount="indefinite"/></circle><circle cx="226" cy="222" r="1.4"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="4.4s" begin="1.2s" repeatCount="indefinite"/></circle><circle cx="24" cy="92" r="1.3"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="5.2s" begin="2.1s" repeatCount="indefinite"/></circle></g><g transform="translate(156 98) rotate(45)">
      <path d="M 0 -66 L 11 -24 L 46 42 L 0 30 L -46 42 L -11 -24 Z" transform="translate(0 112) scale(0.8)" fill="#2F5BFF" opacity="0.26"/>
      <path d="M 0 -66 L 11 -24 L 46 42 L 0 30 L -46 42 L -11 -24 Z" transform="translate(0 58) scale(0.9)" fill="#3D72FF" opacity="0.52"/>
      <circle cx="-11" cy="40" r="14" fill="url(#spark)"/>
      <circle cx="11" cy="40" r="14" fill="url(#spark)"/>
      <path d="M 0 -66 L 11 -24 L 46 42 L 30 50 L 11 36 L 0 42 L -11 36 L -30 50 L -46 42 L -11 -24 Z" fill="url(#lead)"/>
      <path d="M 0 -66 L 11 -24 L 46 42 L 30 50 L 11 36 L 0 42 Z" fill="#1B2B66" opacity="0.2"/>
      <rect x="-1" y="-44" width="2" height="80" fill="#7F9BFF" opacity="0.55"/>
      <ellipse cx="0" cy="-24" rx="5.6" ry="11.5" fill="#16204A"/>
      <ellipse cx="-1.6" cy="-28" rx="1.8" ry="4.2" fill="#FFFFFF" opacity="0.75"/>
    </g>
  </g>
<rect x="1.5" y="1.5" width="253" height="253" rx="55" fill="none" stroke="url(#edge)" stroke-width="2"/></svg>
