/* folding rows: a hairline between them, a small chevron at the right */

.cv-cols.has-code { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

.cv-h { font-size: var(--fs-md); margin: 0 0 var(--s3); }
.cv-col .lab, .sbody .lab { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); margin: var(--s4) 0 var(--s1); }

.cv-say { background: var(--ink); color: var(--bg); border-radius: var(--radius-lg); margin-top: var(--s4); }

}

   (the light tokens' values: surface, ink, muted, rule) */

figure.trk { --faint: #a2a09a; --dim: #6b6a65; --line: #c3c0b7; --ink: #1a1a19; --live: #fffdf5; }
table { width: 100%; border-collapse: collapse; margin: var(--s1) 0; font-size: var(--fs-sm); }
th, td { text-align: left; padding: var(--s2) var(--s3) var(--s2) 0; border-bottom: var(--hair); vertical-align: top; }
th { font-weight: var(--w-strong); color: var(--muted); font-size: var(--fs-xs); }
td:first-child { font-weight: var(--w-strong); }
.tnote { font-size: var(--fs-sm); color: var(--muted); margin: var(--s2) 0 var(--s6); }

/* sessions */
.session .meta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); margin-top: calc(-1 * var(--s3)); }
.chip { color: var(--muted); }
.chip.done { color: var(--ok); }
.session .intro { color: var(--soft); margin: var(--s3) 0; }
.session > h3 { margin: var(--s6) 0 var(--s2); }
.step { border-top: var(--hair); }
.step > summary { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: var(--s3); align-items: start; padding: var(--s3) var(--s6) var(--s3) 0; }
.step > summary .st { font-weight: var(--w-strong); }
.step > summary:hover .st { color: var(--accent); }
.step > summary .sm { color: var(--muted); font-size: var(--fs-sm); padding-top: 2px; white-space: nowrap; }
.tick { width: 18px; height: 18px; border-radius: var(--radius-sm); border: 1.5px solid var(--muted); background: transparent; color: var(--surface);
  display: grid; place-items: center; font-size: var(--fs-xs); margin-top: 3px; padding: 0; }
.tick.on { background: var(--ok); border-color: var(--ok); }
.sbody { padding: 0 0 var(--s5) 30px; }
.sbody > p.d, .sbody > p.point { margin: 0 0 var(--s1); }
.reading { margin: 0; padding: 0; list-style: none; }
.reading li { margin: 0 0 var(--s2); padding-left: var(--s3); position: relative; }
.reading li::before { content: ""; position: absolute; left: 0; top: .75em; width: 5px; height: 1.5px; background: var(--muted); }
.reading a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.reading a:hover { text-decoration-color: var(--ink); }
.reading .w { color: var(--muted); font-size: var(--fs-sm); margin-left: var(--s2); white-space: nowrap; }
.reading .why { display: block; color: var(--soft); font-size: var(--fs-sm); margin-top: 2px; }
.sbody figure { margin: var(--s4) 0 var(--s2); }
details.say { margin-top: var(--s4); }
details.say > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--accent); }
details.say > summary::-webkit-details-marker { display: none; }
details.say > summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin-top: -3px; }
details.say[open] > summary::after { transform: rotate(-135deg); margin-top: 3px; }
details.say > summary:hover { text-decoration: underline; text-underline-offset: 3px; }
details.item > .sbody { padding-left: 0; }
@media (max-width: 700px) { .sbody { padding-left: 0; } }
.session-end { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-top: var(--s5); }
.pager { display: flex; justify-content: space-between; gap: var(--s4); margin-top: var(--s6); padding-top: var(--s4); border-top: var(--hair); }
.pager a { display: flex; flex-direction: column; color: var(--ink); font-weight: var(--w-strong); max-width: 48%; }
.pager a span { font-weight: var(--w-regular); font-size: var(--fs-sm); color: var(--muted); }
.pager a.next { text-align: right; margin-left: auto; }
.pager a:hover { color: var(--accent); text-decoration: none; }

/* quiz: one question at a time */
.dq { padding: var(--s5) var(--s5) var(--s4); }
.dq .dots { display: flex; gap: var(--s1); margin-bottom: var(--s4); }
.dq .dots i { width: 20px; height: 3px; border-radius: 2px; background: var(--rule); }
.dq .dots i.on { background: var(--accent); }
.dq .dots i.got { background: var(--ok); }
.dq .qq { font-size: var(--fs-lg); font-weight: var(--w-strong); line-height: var(--lh-tight); }
.dq .model { margin-top: var(--s4); padding-left: var(--s3); border-left: 2px solid var(--ok); color: var(--soft); }
.dq .model b { display: block; font-size: var(--fs-sm); color: var(--ok); font-weight: var(--w-strong); }
.dq .row { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s4); align-items: center; }
.dq .row .grow { flex: 1; }
.dq .close { background: none; border: 0; color: var(--muted); font-size: var(--fs-sm); }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 var(--s4) var(--s7); }
  nav.side { display: none; }
  main { padding-top: var(--s5); }
  .top-in { padding: 0 var(--s4); gap: var(--s2); }
  .top .loopname, .prog, .count { display: none; }
  .tabs { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs a { padding: 2px 6px 0; white-space: nowrap; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
@media (prefers-reduced-motion: reduce) { details > summary::after { transition: none; } }

<script type="application/json" id="loop-data">{"id": "coframe", "title": "Coframe, Agent Platform Engineer", "subtitle": "Recruiter screen, 15 minutes", "when": "Thursday 1 October, 2:20 to 2:35 PM Eastern, Google Meet", "when_iso": "2026-10-01T14:20:00-04:00", "who": "Neesha Malik, Founding Talent at Coframe. She runs hiring: she screens, then pitches candidates to the team herself. Iris Chao (Talent Operations) scheduled the call.", "format": "Fifteen minutes on Google Meet. A recruiter screen: no coding, no design. She checks the resume is real, hears how you talk about your work, tells you about Coframe, and decides whether you go on to the technical rounds.", "bar": "Crisp, and in outcomes: what changed for users and what you owned. Senior means short answers with a number in them, then stopping. Talk to her as a recruiter, not as an engineer.", "sessions": [], "scripts": [{"id": "intro", "title": "Tell me about yourself", "length": "about 90 seconds", "when": "The opener. She is checking the resume is real and how clearly you tell it. It should land on why this role.", "probes": ["What does alfred_ do?", "What do you own there?", "Why are you looking?", "Why Coframe?"], "say": ["Sure. I started out in computer science research at UIC, where I worked on applied ML and LLM systems. That gave me a pretty strong foundation in actually building and evaluating these systems, rather than just using the models.", "From there I joined WheelPrice, which was a much more startup-oriented environment. I was working across the stack and got a lot more exposure to shipping things that were actually being used by customers. It was a small engineering team, so I had to be pretty broad — backend, AI, infrastructure, and product work all kind of blended together.", "After that I joined alfred_, where I've been working as a founding LLM engineer. It's an AI assistant, and my work has become much more focused on reliability and evaluation — things like building the eval harness, production failure detection, working memory, and making sure agent changes actually improve the product rather than just looking better on a benchmark.", "The common thread through all of that has really been building AI systems in environments where you don't have a perfectly defined problem in front of you. You have to figure out what's broken, decide what to build, and then own it through production.", "And that's pretty much why Coframe is interesting to me. At alfred_ I've ended up working on the layer underneath the agent: the evals, the reliability, the infrastructure it runs on. The Agent Platform role is that layer, at a company where the whole product is agents."], "swaps": [{"when": "If she asks what alfred_ is, in a line", "line": "An AI executive assistant that works over text message. It handles people's email and calendar end to end, for 5,000-plus active users."}, {"when": "If she asks what you own", "line": "The reliability side of the agent: the eval harness, the scanner that catches production failures, working memory, and a lot of the infrastructure it runs on."}], "land": "Research, then shipping products, then the layer under a production agent. Coframe is that layer where the whole product is agents.", "notes": ["Paragraphs 1 to 4 are your words, unchanged from ZenML. Only the last line is new, pointed at Coframe.", "About ninety seconds. Stop after the last line and let her pick where to go.", "Numbers if she asks: 5,000-plus active users at alfred_; 10 to 20 thousand daily readers on the WheelPrice blog."], "never": ["Never mention alfred_'s funding, a crunch, or colleagues' names.", "No filler: 'so to say', 'essentially', 'in a sense'."]}, {"id": "intro-short", "title": "The thirty-second version", "length": "about 30 seconds", "when": "If she says 'briefly', or the call starts late. Same arc, outcomes only.", "probes": ["Give me the short version.", "What do you do now?"], "say": ["I'm a founding LLM engineer at alfred_, an AI executive assistant that works over text message. It handles people's email and calendar end to end, for 5,000-plus active users.", "I own a lot of what sits under the agent: the eval harness, a scanner that catches production failures, working memory, and the reliability work.", "Before that I shipped products at WheelPrice, a small startup, and did applied ML and LLM research at UIC.", "The Agent Platform role is pretty much the layer I already work at, and I'd like to build it where the whole product is agents."], "land": "Founding LLM engineer, the layer under a production agent, and this role is that layer.", "notes": ["New, in your voice, from his brief's pitch. Four sentences; stop after the last one."]}, {"id": "why-coframe", "title": "Why Coframe? Why this role?", "length": "about 60 seconds", "when": "Straight after the intro, or when she finishes her pitch. She wants to hear you know what they do and why it fits you.", "probes": ["What do you know about us?", "Why Agent Platform and not Agent Engineer?", "What would you want to work on first?", "Are you talking to other companies?"], "say": ["Honestly, a couple of things. The first is that at Coframe the agents are the product. From what I read, your agents design, code, test and ship website experiments for companies like Dropbox, Replit and Intuit. So the platform they run on isn't a side project; everything else stands on it.", "The second is the role itself. The posting talks about long-running agent execution, stop-and-resume, isolated environments, tracing and evaluation. That's pretty much the layer I've been working at, at alfred_: the agent loop, the workers for long jobs, the eval harness and the failure scanner. I've built it for one assistant. Here it would serve every agent you run, including the ones working on your own codebase.", "And I like that the work gets measured. Your product is judged on conversion lift, which is a real number, and I think that's the right pressure for an agent platform.", "So it's a problem I already care about, with a lot more agents on top of it."], "swaps": [{"when": "If she asks what stood out from what you read", "line": "The post on predicting experiment winners. They judged each pair of designs in both orders so a model couldn't score on position bias, and they said openly that accuracy dropped on production data. That's the kind of eval honesty I care about."}, {"when": "If she asks why platform and not agent engineer", "line": "The agent engineers build what the agents do. The platform is what they run on: execution, isolation, tracing, evals. At alfred_ the part I've owned most is the second one, so that's where I'd add the most."}], "land": "The agents are the product, and the platform is the layer I already work at.", "notes": ["New, in your voice. Facts from the posting and Coframe's own posts (Sources): agents that design, code, debug and deploy tests, landing pages and personalization; customers Dropbox, Replit and Intuit; agents also contribute to Coframe's own codebase.", "Say 'from what I read', not 'I know'."], "never": ["Don't quote their revenue claims as fact. If you use one, 'they report'."]}, {"id": "leave", "title": "Why are you looking to leave alfred_?", "length": "about 45 seconds", "when": "You are exploring while employed. Make that clear without sounding defensive.", "probes": ["Is something wrong at alfred_?", "You've only been there since April. Why move so soon?", "Will you leave us quickly too?"], "say": ["There's nothing particularly wrong with alfred_. I've actually learned a lot there and I still enjoy the work.", "I'm mostly looking at what I want the next few years of my career to look like. At alfred_, I've had a lot of ownership because it's a small team, and that's been great. But the work is ultimately internal to one product.", "What I'm increasingly interested in is the platform underneath agents: the execution, evaluation and reliability layer that a lot of agents depend on, not one. That's why this role caught my attention. It's very close to problems I've already been solving, but the platform is the thing I'd be building.", "So it's less “I need to get away from Alfred” and more “I've found a direction I want to go deeper into.”"], "swaps": [{"when": "If she asks bluntly: why not stay?", "line": "I could. And that's why I'm being selective about what I talk to. I'm not looking to leave just to change companies. It has to give me a meaningfully different scope, and going from one agent to a platform that every agent runs on does."}, {"when": "If she asks: only since April, why so soon?", "line": "Fair question. It's been a very dense six months, and the reliability pieces I built there are running. I'm not in a rush; I'm talking to very few places, because the scope has to be genuinely different."}], "land": "Less “get away from alfred_”, more “a direction I want to go deeper into”.", "notes": ["Paragraphs 1, 2 and 4 are your words, unchanged. Paragraph 3 named Kitaru's developer infrastructure; it now names the agent platform.", "Pay, visa and start date are prepared in chat, not on this public page."]}, {"id": "now", "title": "What are you working on right now?", "length": "about 60 seconds", "when": "One concrete production story, told for someone who isn't an engineer. Outcome first, then how, then the number.", "probes": ["What was the result?", "What was your part?", "How do you know it worked?"], "say": ["Right now most of my work is about making sure a change to our agent actually makes it better, not worse.", "The clearest example: we rewrote how the agent handles back-and-forth conversations. That's too big a change to test by trying it a few times. So I built a way to replay real user tasks against the new version before it ships: a little over a hundred cases, each one taken from a real failure in production, each running the real agent against a frozen copy of that user's email and calendar.", "That's how we signed off the rewrite. We could point at exactly which cases got better and which got worse, and the agent got to the same results in fewer steps: about 2.5 tool calls per task, down to 2.2.", "And the cases keep coming from production. A scanner reads real conversations every day and flags the ones that went wrong, so the test set grows with what users actually hit."], "swaps": [{"when": "If she wants a win users felt", "line": "Texts about important emails used to arrive about ninety seconds after the email. The delay was a timer, not the work, so I made the text go out the moment it's queued. It's about three seconds now."}, {"when": "If she asks what 'tool calls per task' means", "line": "How many actions the agent takes to finish a job. Fewer, for the same result, means it found the answer more directly."}], "land": "We shipped a full rewrite of the agent with evidence it got better, because every change runs against real cases first.", "notes": ["New, in your voice, from the bench story. Keep the words 'SQLite', 'snapshot' and 'harness mode' out of it unless she asks how.", "Facts: a little over a hundred cases; the scanner runs daily; 2.5 to 2.2 tool calls per completed task; it signed off the multi-turn orchestration rewrite; notifications about 90 seconds to about 3."]}, {"id": "alfred-day", "title": "What does your day-to-day look like at alfred_?", "length": "about 60 seconds", "when": "How much you code, what 'founding LLM engineer' means, what you personally own.", "probes": ["How much do you actually code?", "What does “founding LLM engineer” mean?", "What did you personally own?"], "say": ["It's pretty varied, which is one of the things I like about the role.", "A typical piece of work might start with a production failure. I'll look at the conversation and the tool trace, figure out whether it's a model problem, a tool problem, or something in our orchestration or memory layer.", "If it's something we need to reproduce, I'll add it to the eval harness. The harness takes a snapshot of the relevant user environment — email, calendar, whatever the task needs — and lets the actual agent code run against that state. So we're testing the same tool paths we use in production rather than mocking the whole agent.", "Then I'll usually build the fix, run the regression set, and look at whether we've actually improved the behavior without breaking something else.", "I've also worked on the production failure scanner, working memory, reliability infrastructure, and some of the cost and orchestration pieces.", "So it's a mix of debugging production behavior, building infrastructure, writing product code, and figuring out what we should build next."], "swaps": [{"when": "If she asks “how much coding?”", "line": "A lot. I'm usually in the codebase every day. The difference is that because we're a small team, the coding is usually preceded by figuring out what the right thing to build is."}], "land": "The coding is usually preceded by figuring out what the right thing to build is.", "notes": ["Your own words, unchanged from ZenML.", "For a recruiter, the swap line is the one to keep: it says senior without saying senior."]}, {"id": "background", "title": "Walk me through your background", "length": "about 60 seconds", "when": "The resume, in order, with a reason for each move. She is checking the dates and titles line up.", "probes": ["What did you do at UIC?", "Why did you leave WheelPrice?", "Why alfred_?", "Are you a job hopper?"], "say": ["At UIC I did my master's and worked in a research lab on applied ML and LLM systems. One project, MetaRAG, a retrieval framework for enterprise knowledge, ran in a production code-translation use case at about ten thousand queries a day, and the paper was accepted at IEEE CAI. Another was multi-agent reasoning for medicine.", "Then WheelPrice. It was two engineers, so I owned a lot: a blog and content system that got to 10 to 20 thousand daily readers, and an AI fitment assistant that could only answer through tools against verified data.", "But the work I kept enjoying most was the AI systems side, and there it was one of many hats. alfred_ was a founding team with an agent in production and real users, and the reliability of that agent was mine to own. So it was a move toward depth in the same direction, not away from anything."], "swaps": [{"when": "If she asks whether you're a job hopper", "line": "Fair question. Both moves were toward the same thing, more depth in AI systems and more ownership, and each one widened the scope. This one would make the platform the whole job."}, {"when": "If she asks the dates", "line": "WheelPrice from July 2025 to March 2026; alfred_ since April 2026."}], "land": "Research, then broad ownership at a two-person startup, then depth in agents in production.", "notes": ["From your WheelPrice and MetaRAG answers, in your voice. Say it plainly and move on.", "If she asks for MetaRAG's numbers: 82.5% precision, 0.925 Hit@10, 25% fewer hallucinations."]}, {"id": "logistics", "title": "Logistics she will ask", "length": "a line each", "when": "Usually near the end. Your answers are in chat, not on this public page. How to handle each is below.", "probes": ["Where are you based, and would you relocate?", "The role is on site. Does that work?", "What are you looking for in compensation?", "Do you need sponsorship?", "When could you start?", "Are you interviewing elsewhere?"], "say": [], "land": "Say each once, in one sentence, then go back to the role.", "notes": ["**Location and relocation:** one sentence with your answer from chat; if she asks about timing, give it, then stop.", "**On site:** the posting says on site in the SF Bay Area and 'primarily in-person'. Ask her to confirm the office and the days, then answer in one sentence.", "**Compensation:** have your number ready; say it once; ask about the range for the role. Don't negotiate on this call.", "**Work authorization:** only if she asks. One sentence, then back to the role.", "**Start date:** your answer from chat, in one line.", "**Other interviews:** 'A few conversations, and I'm being selective.' No names."], "never": ["Don't raise work authorization, pay or relocation before she does.", "Don't explain or justify a logistics answer; the explanation invites the next question."]}], "drills": [{"id": "intro", "prompt": "Tell me about yourself.", "target": "90 seconds", "seconds": 90, "ref": "#say-intro"}, {"id": "intro-short", "prompt": "Tell me about yourself, briefly.", "target": "30 seconds", "seconds": 30, "ref": "#say-intro-short"}, {"id": "why-coframe", "prompt": "Why Coframe, and why Agent Platform?", "target": "60 seconds", "seconds": 60, "ref": "#say-why-coframe"}, {"id": "leave", "prompt": "Why leave alfred_ after six months?", "target": "45 seconds", "seconds": 45, "ref": "#say-leave"}, {"id": "now", "prompt": "What are you working on right now? For someone who isn't an engineer.", "target": "60 seconds", "seconds": 60, "ref": "#say-now"}], "qa": [{"group": "Coframe and the role", "blurb": "What they do, and how the posting maps to your work.", "items": [{"q": "What do you know about Coframe?", "short": "What Coframe does", "tests": "Did you prepare?", "a": ["Coframe builds agents that optimize websites. They come up with ideas, design and code the variations, test them on real traffic, and personalize what each visitor sees, without the customer's engineers having to build each test. Customers include Dropbox, Replit and Intuit; Replit reported a 410% conversion lift on its enterprise funnel.", "What I found interesting technically is the work with OpenAI on a model fine-tuned for UI code, with your own benchmark for it, and the recent post on predicting experiment winners, which was pretty honest about how much accuracy drops on production data.", "And from the posting, the agents aren't only in the product. They also work on Coframe's own codebase and internal workflows, which is what the platform supports."], "land": "Agents that design, build and test website experiments; the platform serves those and the company's own.", "notes": ["From Coframe's site, blog and posting (Sources). Seed round of $9.3 million in October 2024, led by Khosla Ventures and NFDG; the posting says pre-Series A. The CEO is Josh Payne, who co-founded Autograph before.", "Their values: Agency, Velocity, Truth-seeking, Growth."], "id": "q-what-do-you-know-about-coframe"}, {"q": "How does your background fit the Agent Platform role?", "short": "The posting, mapped to your work", "tests": "Is the resume real, and does it match what they need?", "a": ["Most of it maps to what I already do. The posting asks for infrastructure for long-running agents, tracing and evaluation, safe execution, and judgement on cost and reliability. At alfred_ I've worked on each of those for one agent in production, used by 5,000-plus people.", "Where I haven't worked yet is remote browsers and sandboxed code execution, and I'd rather say that plainly. The instincts carry over: the eval harness already runs the real agent in an isolated copy of the user's world with no path to live systems."], "land": "Each of the posting's asks, done for one production agent; the gaps named first.", "parts": [{"title": "What the posting asks, and where you've done it", "items": ["**Long-running execution, durable workers, stateful workflows:** quick turns run in Supabase edge functions; long work runs in containers on Railway, fed from one Postgres with pgmq queues and pg_cron schedules.", "**Deploying and operating agents in production:** the agent loop on LangGraph with its own tools node, 12 steps on SMS and 50 on the web, for 5,000-plus active users.", "**Tracing, observability, evaluation, monitoring:** the production failure scanner over real conversations; an eval harness on a snapshot of the user's world; a little over a hundred cases.", "**Isolated environments:** in the harness the real agent runs against its own copy of the world, with no path to a live system, reset between cases.", "**Memory and planning:** working memory, the user's open loops, which the agent fetches with a tool when it needs them.", "**Security and reliability judgement:** no risk score; a code floor confirms every send and irreversible delete, whatever the model thinks. Row-level security in Postgres.", "**Cost:** per-user LLM cost cut about 30% by replacing per-message model calls with a deterministic matcher for email rules.", "**Testing before deploy:** a change runs against the cases it touches before it ships; the full set runs nightly.", "**Engineering productivity:** Claude Code every day with project instructions, skills and hooks; an MCP connector that lets Claude use alfred_'s tools.", "**Platforms for non-engineers:** the closest is the rules engine, where users write email rules in plain language from chat."]}, {"title": "Not done yet: say so", "items": ["Remote browsers, sandboxed code execution, and serverless compute at Coframe's scale.", "A platform used by several teams: yours has been one product."]}], "notes": ["For a recruiter, say the first paragraph and stop. The list is for when she reads a line of the posting back to you."], "id": "q-how-does-your-background-fit-the-agent-platform-role"}, {"q": "Have you built infrastructure for long-running agents?", "short": "Long-running agents", "tests": "The posting's first line, in plain words.", "a": ["Yes, for one product. A quick reply to a text runs in a short serverless function. Anything long, like reading through someone's whole inbox, goes onto a queue and runs on workers in containers, with scheduled jobs as a backstop so nothing gets dropped.", "The lesson that stuck was about timing: our email-to-text notifications waited on a timer, about ninety seconds. Triggering on the event instead took it to about three."], "land": "Short work in functions, long work on queued workers, a schedule as the backstop.", "notes": ["Underneath, if an engineer asks: Supabase edge functions for the turn, containers on Railway, pgmq and pg_cron in one Postgres, claiming with SKIP LOCKED."], "id": "q-have-you-built-infrastructure-for-long-running-agents"}]}, {"group": "Your work, in plain words", "blurb": "Your strongest work, a hard problem, evals and a failure, each told outcome first.", "items": [{"q": "What's the project you're proudest of?", "short": "Strongest project", "tests": "Can you pick one and say why it mattered?", "a": ["The eval harness at alfred_. When I joined, nobody could say whether a new version of the agent was better than the old one; people tried it and had opinions.", "Now every real failure in production can become a test case, and a big change runs against a little over a hundred of them before it ships. It's how we signed off a full rewrite of how the agent handles conversations."], "land": "It turned 'we think it's better' into evidence.", "id": "q-what-s-the-project-you-re-proudest-of"}, {"q": "Tell me about a hard problem you solved in production.", "short": "A hard production problem", "tests": "Ownership, and whether you fix the cause or the symptom.", "a": ["Our assistant keeps track of what people owe others, from their inbox. The model kept inventing email threads, or getting who owes whom backwards, which is the worst thing an assistant can do to trust.", "Instead of prompting harder, I changed the design. The model now only picks from a list of real items and writes the sentence; code attaches the real ids. It can't invent a thread anymore, and tests enforce that. A whole class of mistake is gone rather than rarer."], "land": "Make the mistake impossible by design, not less likely by prompting.", "id": "q-tell-me-about-a-hard-problem-you-solved-in-production"}, {"q": "What's your experience with evaluation and reliability?", "short": "Evals and reliability", "tests": "The role's core, said so a non-engineer follows.", "a": ["It's most of what I do. Three pieces: a scanner that reads real conversations every day and flags the ones that went wrong; a test set built from those real failures; and a way to replay the real agent against a frozen copy of the user's world, so we can compare versions fairly.", "And safety rules in code, not in the model: the agent always asks before it sends an email or deletes something that can't be undone."], "land": "Find real failures, turn them into tests, and gate the risky actions in code.", "id": "q-what-s-your-experience-with-evaluation-and-reliability"}, {"q": "Tell me about a failure you learned from.", "short": "A failure you learned from", "tests": "Honesty, and what changed afterwards.", "a": ["Our test set passed an answer that was actually wrong. A user asked for a ledger of every financial event across their accounts, and the agent produced a clean one that left out two refunds. Every check we had passed, because we checked the shape of the answer, not whether it was complete.", "A user noticed, not us. The fix was to check against what we know is true: our snapshot knows how many events are in that window, so the test now asserts every one appears. I think about 'does it look right' versus 'is it right' a lot more since."], "land": "Check against ground truth you hold, not against how the answer looks.", "id": "q-tell-me-about-a-failure-you-learned-from"}]}, {"group": "How you work", "blurb": "Small teams, what you want next, and AI tools.", "items": [{"q": "How do you work in a small team?", "short": "Small teams", "tests": "Ownership without a backlog.", "a": ["I'm comfortable with nobody handing me a backlog. On a small team you look at what's breaking and what's being asked, and you decide.", "If I disagree, I make my case once, with evidence, ideally a real example or a quick prototype, and then commit to whatever we decide. Small teams can't afford relitigating."], "land": "Decide from what's breaking; argue once with evidence, then commit.", "id": "q-how-do-you-work-in-a-small-team"}, {"q": "What are you looking for next?", "short": "What you want next", "tests": "Does the role fit where you're headed?", "a": ["Owning the platform layer that a lot of agents run on, rather than one agent. And staying close enough to agents in production that I know what breaks before most teams hit it.", "A small, fast team where the agents are the product is pretty much the quickest way I know to get there."], "land": "The layer many agents run on, close to where they break.", "id": "q-what-are-you-looking-for-next"}, {"q": "How do you use AI tools day to day?", "short": "AI tools, day to day", "tests": "Fluent with them, and careful.", "a": ["Heavily, with scaffolding: Claude Code with project instructions and skills for the jobs I repeat, a review pass, and a check that runs the real thing instead of trusting that it compiled.", "I let it drive on the well-tested, boring parts and take over on permissions, concurrency and database changes. And I don't trust an agent's own report of what it did, which is the same instinct as our product's guard against the agent claiming actions it never took."], "land": "Heavily, with checks; never trust a self-report, from a model or from yourself.", "id": "q-how-do-you-use-ai-tools-day-to-day"}]}], "ask": [], "ask3": [{"id": "process", "title": "For Neesha, and the process", "when": "At the end, first. Around minute eleven.", "why": "She decides whether to pitch you. Asking how she decides, and inviting a concern, is what senior candidates do: it shows you want to meet the bar, not only pass the call.", "how": ["Ask one, then listen fully.", "If she raises a concern, answer it in two sentences; don't argue it."], "items": [{"to": "Neesha", "q": "What does the rest of the loop look like after today, and roughly what's the timeline?", "loop": "Your first question at the end, always.", "why": "Practical, and shows you're planning to go further."}, {"to": "Neesha", "q": "When you bring someone to the team, what makes them stand out?", "loop": "After the timeline, if there's a minute.", "why": "It tells you what to lead with in the next round."}, {"to": "Neesha", "q": "Is there anything in my background you'd want me to make clearer before you put me forward?", "loop": "Last, before she closes.", "why": "Inviting a concern while there's time to answer it is the most senior move on a screen."}]}, {"id": "team", "title": "About the Agent Platform team", "when": "If she has sold the role and there's time. One question.", "why": "It shows you think about scope and how the work gets judged. If she doesn't know, that's fine: ask who in the loop would.", "how": ["Bridge from her pitch: 'You mentioned X...'", "If she says it's a question for the team, ask who you'd meet."], "items": [{"to": "Neesha", "q": "What does the platform team own, compared with the engineers building the agents themselves?", "loop": "After she describes the role.", "why": "Scope first: it shows you know there are two roles and where the line sits."}, {"to": "Neesha", "q": "What's the hardest problem on the agent platform right now?", "loop": "If she's technical enough to answer; otherwise save it for the team.", "why": "You want the hard problem, not the perks."}, {"to": "Neesha", "q": "How do agents get checked before a change ships, and how do you catch a regression after?", "loop": "Save for the technical rounds if she hesitates.", "why": "Your strongest area, asked as curiosity."}, {"to": "Neesha", "q": "How big is the team, and who would I work with most?", "loop": "Any time she mentions the team.", "why": "Plain and useful; tells you the size of the job."}]}, {"id": "company", "title": "About the company", "when": "Only if she opens the door, or there's time left over.", "why": "It shows you think about the customer, not only the code. Keep it to one.", "how": ["One question, then let her talk."], "items": [{"to": "Neesha", "q": "What do customers actually buy: the experiments, the lift, or the time saved?", "loop": "After she mentions a customer.", "why": "Commercial sense; it tells you what the platform is measured against."}, {"to": "Neesha", "q": "Beyond the product, where do agents run inside Coframe today: your own codebase, go-to-market?", "loop": "If she talks about how the company works.", "why": "The posting says the platform serves both; you read it."}, {"to": "Neesha", "q": "What's next for the product over the next year?", "loop": "Last, if nothing else fits.", "why": "Shows you're thinking about staying, not only joining."}]}], "traps": [["Going deep technically", "She is listening for outcomes and scope. Leave out frameworks, queues and table names unless she asks how."], ["Rambling past ninety seconds", "Stop after the last line of the intro. Fifteen minutes has no room for a three-minute answer."], ["Raising work authorization first", "Only if she asks. One sentence, then back to the role."], ["Bluffing about Coframe", "Say 'from what I read'. If you don't know, ask; she is there to tell you."], ["Confusing her with someone else", "Another Neesha Malik works at a different company in New York. Nothing about her applies; use only what Coframe publishes."], ["Quoting their numbers as fact", "Revenue and lift figures are theirs: 'they report'."], ["Funding, crunch, colleagues' names", "Never, about alfred_."]], "tables": [], "admire": "", "kitaruLead": "", "figures": [], "mockHow": "Say 'run the Coframe mock, 15 minutes' in chat: Neesha screens, sells the role, then asks for your questions.", "mocks": [], "planKicker": "Before the call", "mechTitle": "", "designLink": null, "extra": "The posting and everything Coframe publishes are under <b>What this rests on<\/b> on the Prep tab. Your own system at depth is on the <a href=\"../ALFRED.html\" target=\"_blank\" rel=\"noopener\">alfred_ page<\/a>.", "emphasis": [], "own": null, "showUp": [["Join two minutes early.", "The Meet link from the invite, camera and sound checked, the job post and this page open in another tab."], ["Fifteen minutes is about eight of you.", "Intro in ninety seconds, why Coframe in sixty, then her questions and her pitch. Around minute eleven, your two questions. She closes."], ["Outcomes and scope, not architecture.", "5,000-plus active users; a rewrite of the agent signed off by the eval harness; texts that arrive in three seconds instead of ninety. Leave LangGraph, pgmq and edge functions out unless she asks."], ["Stop after the pitch.", "After the intro, stop and let her pull the thread she cares about. A short answer invites the next question; a long one uses up her fifteen minutes."], ["Let her sell.", "When she describes Coframe, listen, then ask one follow-up about what she said. Selling the role is half her job, and interest in it counts."], ["Logistics: one line each.", "Location, office days, pay, work authorization, start date: your answers are in chat. Say each once, plainly, then go back to the role."], ["Close with next steps.", "Ask what the rest of the loop looks like, and whether anything in your background needs making clearer for the team."]], "prepLead": "Fifteen minutes. Read how to show up, then say your story out loud: the intro in ninety seconds and in thirty, why Coframe, why leave, and the one story. The banks are for the questions after.", "storyBlurb": "Your career in ninety seconds and in thirty, why Coframe, why leave alfred_, what you are working on, your days at alfred_, the background, and logistics.", "sources": [{"label": "Agent Platform Engineer: the job post (Ashby)", "url": "https://jobs.ashbyhq.com/Coframe/9edc35b8-e381-4c93-b9d9-ed6ac5c578de", "why": "On site in the SF Bay Area (Burlingame on the posting). Infrastructure for long-running agents, isolated execution, tracing and evaluation, durable workers and remote browsers, CI/CD, and internal platforms for non-engineering teams. Names Dropbox, Replit and Intuit as customers."}, {"label": "Agent Engineer: the sibling role's post (Ashby)", "url": "https://jobs.ashbyhq.com/Coframe/c20a12c1-0aa6-4e37-80ef-63b3fbd48d47", "why": "The engineers who build what the agents do. The platform role builds what they run on."}, {"label": "Coframe: company site", "url": "https://coframe.com/", "why": "Agents that generate, test and personalize website variations: copy, code and visuals. Case studies for Replit and StartEngine."}, {"label": "Coframe careers: values", "url": "https://coframe.com/careers", "why": "Agency, Velocity, Truth-seeking, Growth. 'A small, talent-dense team'."}, {"label": "Coframe and OpenAI: a UI code generation model and benchmark (1 October 2024)", "url": "https://coframe.com/post/coframe-openai-ui-code-generation-model", "why": "A fine-tuned GPT-4o vision model for on-brand UI code; BrandBench, an LLM-as-judge benchmark of 194 held-out sites; 26% better than the base model."}, {"label": "Predicting website experiment winners (7 August 2026)", "url": "https://coframe.com/post/predicting-website-experiment-winners", "why": "Each design pair judged in both orders so a model gets no credit for position bias; 57.28% on the benchmark, 36 to 40% on production data, and they say so."}, {"label": "Replit case study (23 March 2026)", "url": "https://coframe.com/post/driving-410-conversion-lift-for-replit", "why": "410% conversion lift on the enterprise funnel; experiments shipped in hours, not sprints."}, {"label": "Coframe acquires Haystacks (4 March 2026)", "url": "https://coframe.com/post/coframe-acquires-haystacks", "why": "Names the AI Growth Agent: ideas, design, engineering, QA and analysis end to end. Mentions Dropbox and Replit."}, {"label": "Coframe raises $9.3 million seed (Yahoo Finance, 29 October 2024)", "url": "https://finance.yahoo.com/news/coframe-raises-9-million-websites-130406581.html", "why": "Led by Khosla Ventures and NFDG (Nat Friedman and Daniel Gross). Josh Payne is the CEO."}, {"label": "Coframe appoints a Chief Business Officer (press release, 3 November 2025)", "url": "https://natlawreview.com/press-releases/coframe-appoints-scott-tieman-chief-business-officer-accelerate-growth-and", "why": "Josh Payne previously co-founded Autograph. Expanding into e-commerce, retail, travel and financial services."}]}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; o.rev = o.rev || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }
    var sm = el("summary", "", '<span class="qt">' + inl(title) + "</span>" + (meta ? '<span class="qm">' + meta + "</span>" : ""));
    d.appendChild(sm); d.appendChild(body);
    return d;
  }
  function bulk(host) {
    var b = el("div", "bulk");
    var o = el("button", "", "Open all"), c = el("button", "", "Close all");
    o.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = true; }); });
    c.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = false; }); });
    b.appendChild(o); b.appendChild(c);
    host.appendChild(b);
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });
    (s.study || []).forEach(function (_, i) { k.push(s.id + ":s" + i); });
    return k;
  }
  function isDone(t, s) { return !!t.done[s.id]; }
  function link(tab, anchor) { return "#/" + tab + (anchor ? "/" + anchor : ""); }
  /* A drill's reference is either a route already or an anchor on the prep tab. */
  function prepRef(r) { return r.indexOf("#/") === 0 ? r : link("prep", r.replace(/^#/, "")); }

  /* ---------------------------------------------------------------- tabs */
  var TABS = [
    { id: "overview", label: "Overview", show: function () { return true; } },
    { id: "prep", label: "Prep", show: function () { return LOOP.scripts.length || LOOP.drills.length || LOOP.qa.length || LOOP.ask.length || (LOOP.ask3 || []).length; } },
    { id: "design", label: "Design", show: function () { return LOOP.tables.length || LOOP.figures.length; } },
    { id: "own", label: (LOOP.own && LOOP.own.tab) || "Yours", show: function () { return !!LOOP.own; } },
    { id: "sessions", label: "Sessions", show: function () { return LOOP.sessions.length; } },
    { id: "mocks", label: "Mocks", show: function () { return !!LOOP.mockHow; } }
  ].filter(function (t) { return t.show(); });
  var main = document.getElementById("main");
  var side = document.getElementById("side");
  var nav = [];            /* side links for the current tab: [anchor, label, sub] */

  function heading(host, id, kicker, title, sub) {
    var s = el("section", "block"); s.id = id;
    if (title) { s.appendChild(el("h2", "", esc(title))); }
    if (kicker) { s.appendChild(el("p", "hsub", esc(kicker))); }
    host.appendChild(s);
    nav.push([id, title || kicker, !!sub]);
    return s;
  }

  /* ---------------------------------------------------------------- overview */
  function tabOverview(host) {
    var s = el("section", "block"); s.id = "brief";
    s.appendChild(el("h1", "", esc(LOOP.title)));
    s.appendChild(el("p", "hsub", esc(LOOP.subtitle)));
    s.appendChild(el("p", "lead", esc(LOOP.format)));
    var dl = el("dl", "facts");
    dl.innerHTML = "<dt>When</dt><dd>" + esc(LOOP.when) + "</dd><dt>Who</dt><dd>" + esc(LOOP.who) + "</dd>";
    s.appendChild(dl);
    if (LOOP.bar) { s.appendChild(el("p", "bar", "<b>The bar.</b> " + inl(LOOP.bar))); }
    if (LOOP.extra) { s.appendChild(el("div", "lead", LOOP.extra)); }
    host.appendChild(s);
    nav.push(["brief", "The brief"]);
    if (!LOOP.sessions.length) { return; }

    var p = heading(host, "plan", LOOP.planKicker || "", "The plan");
    var t = tracker();
    var days = {}, order = [];
    LOOP.sessions.forEach(function (x) {
      if (!days[x.day]) { days[x.day] = []; order.push(x.day); }
      days[x.day].push(x);
    });
    var wrap = el("div", "days");
    order.forEach(function (d) {
      var box = el("div", "day");
      box.appendChild(el("h3", "", esc(d)));
      days[d].forEach(function (x) {
        var a = el("a", "srow" + (isDone(t, x) ? " done" : ""));
        a.href = link("sessions", x.id);
        a.innerHTML = '<span class="dot"></span><span><span class="nm">' + esc(x.name) +
          '</span><span class="bl">' + esc(x.blurb.replace(/^(Friday|Saturday|Sunday)[^.]*\.\s*/, "")) + '</span></span><span class="hrs">' + esc(x.len) + "</span>";
        box.appendChild(a);
      });
      wrap.appendChild(box);
    });
    p.appendChild(wrap);
    var go = el("div", "acts");
    TABS.filter(function (x) { return x.id !== "overview"; }).forEach(function (x) {
      var a = el("a", "btn", esc(x.label)); a.href = link(x.id); go.appendChild(a);
    });
    p.appendChild(go);
  }

  /* ---------------------------------------------------------------- prep: a hub
     The tab is short: how to show up, then the banks as rows, then drills, questions to
     ask, traps and sources. A bank opens in the one-screen panel. */
  function prepBanks() {
    var banks = [];
    if (LOOP.scripts.length) {
      banks.push({ id: "say", title: "Your story, in the words to say it", blurb: LOOP.storyBlurb || "", items: LOOP.scripts.map(function (x) {
        return { id: "say-" + x.id, q: x.title, short: x.short || x.title, tests: x.when, a: x.say, land: x.land, never: x.never, notes: x.notes,
          probes: x.probes, swaps: x.swaps, learn: x.figs ? { figs: x.figs } : null,
          meta: x.length ? x.length.charAt(0).toUpperCase() + x.length.slice(1) + "." : "",
          drill: LOOP.drills.some(function (d) { return d.id === x.id; }) ? x.id : null };
      }) });
    }
    LOOP.qa.forEach(function (g, gi) {
      banks.push({ id: "qa-" + gi, title: g.group, blurb: g.blurb || "", items: g.items });
    });
    return banks;
  }
  function findPrep(banks, id) {

  function drills(s) {

      acts.appendChild(start); acts.appendChild(save); acts.appendChild(see);
      body.appendChild(acts);
      var list = el("div", "attempts");
      body.appendChild(list);
      var t0 = null, tick = null, secs = 0;
      function fmt(n) { return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); }
      start.addEventListener("click", function () {
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; return; }
        t0 = Date.now(); secs = 0; start.textContent = "Stop";
        tick = setInterval(function () {
          secs = Math.round((Date.now() - t0) / 1000);
          timer.textContent = fmt(secs);
          timer.classList.toggle("over", secs > d.seconds);
        }, 250);
        ta.focus();
      });
      function draw() {
        list.innerHTML = "";
        (own().drills[d.id] || []).slice().reverse().forEach(function (at) {
          list.appendChild(el("div", "at", "<small>" + esc(at.at) + (at.secs ? ", " + fmt(at.secs) : "") + "</small>" + esc(at.text)));
        });
      }
      save.addEventListener("click", function () {
        if (!ta.value.trim()) { ta.focus(); return; }
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; }
        var st = own();
        var arr = st.drills[d.id] || [];
        arr.push({ at: stamp(), secs: secs, text: ta.value.trim() });
        st.drills[d.id] = arr.slice(-3);
        writeJSON(OWN, st);
        ta.value = ""; timer.textContent = "0:00"; timer.classList.remove("over"); secs = 0;
        draw();
      });
      draw();
      var n = (own().drills[d.id] || []).length;
      s.appendChild(item("drill-" + d.id, d.prompt, "Aim for " + esc(d.target) + (n ? ". " + n + " saved" : ""), body));

  /* Figures come from ../figures/figures.js by key, the same registry the tracker draws from. */

  /* What an item rests on: its figures, what to read (with minutes), and where it sits in

  function learn(body, x) {

    var read = el("ul", "reading"), seen = {};

        (r.m ? '<span class="w">' + r.m + " min</span>" : "") + (r.why ? '<span class="why">' + inl(r.why) + "</span>" : "")));
    });
    if (read.children.length) { body.appendChild(el("div", "lab", "Read")); body.appendChild(read); }

  function sayToggle(label, node) {

  /* A step opens to what it is, what to read, where it sits in the system design guide
     and the figure that draws it. What you would say stays shut until you have tried. */
  function stepNode(key, it, isStudy) {
    var t = tracker();
    var row = el("details", "step");
    var sm = el("summary");
    var tick = el("button", "tick" + (t.steps[key] ? " on" : ""), t.steps[key] ? "&#10003;" : "");
    tick.setAttribute("aria-label", "Mark done: " + it.t);
    tick.addEventListener("click", function (e) {
      e.preventDefault(); e.stopPropagation();
      var tt = tracker();
      if (tt.steps[key]) { delete tt.steps[key]; delete tt.steps[key + ":at"]; }
      else { tt.steps[key] = true; tt.steps[key + ":at"] = stamp(); }
      writeJSON(TRACKER, tt);
      tick.classList.toggle("on", !!tt.steps[key]);
      tick.innerHTML = tt.steps[key] ? "&#10003;" : "";
      progress();
    });
    sm.appendChild(tick);
    sm.appendChild(el("span", "st", inl(it.t)));
    var mins = it.m || (it.do || []).reduce(function (a, d) { return a + (d.m || 0); }, 0);
    sm.appendChild(el("span", "sm", mins ? mins + " min" : ""));
    row.appendChild(sm);

    var body = el("div", "sbody");
    if (!isStudy && it.d) { body.appendChild(el("p", "d", inl(it.d))); }
    learn(body, { figs: it.figs || [] });

    var pre = [];
    if (isStudy && it.do) {
      it.do.forEach(function (d) {
        pre.push({ url: d.url, label: d.a, m: d.m, why: d.where });
      });
    }
    if (!isStudy && (it.where || it.url)) { pre.push(it.url ? { url: it.url, label: it.where || it.url } : { book: it.where }); }
    learn(body, { figs: [], read: pre.concat(isStudy ? (it.res || []) : (it.links || []), it.read || []), sdLinks: it.sdLinks });
    var say = isStudy ? it.say : it.ans;
    if (say) { body.appendChild(sayToggle(isStudy ? "The idea, in the words you would use" : "What you would say", transcript(Array.isArray(say) ? say : [say], "", ""))); }
    row.appendChild(body);
    return row;
  }

  /* ---------------------------------------------------------------- mocks */
  /* A mock reads in two parts: the read (how it went, what landed, what to fix first),
     then the conversation, one exchange at a time. Each exchange shows who asked what and
     what you said, with a verdict; it opens to why, how to approach it, and the answer to
     say, behind the same toggle the Prep tab uses. */
  var VERDICT = { landed: "Landed", partly: "Partly", missed: "Missed", gap: "Gap: you did not have an answer" };
  function tabMocks(host) {
    var s = heading(host, "mock", "Run in chat", "Mock interviews");
    s.appendChild(el("p", "lead", inl(LOOP.mockHow)));
    if (!LOOP.mocks.length) {
      s.appendChild(el("p", "when", "None yet. After a mock in chat, its read and its exchanges appear here. The latest two are kept."));
    }
    LOOP.mocks.slice(-2).reverse().forEach(function (m, mi) { drawMock(host, m, mi); });
  }
  function drawMock(host, m, mi) {
    var pre = m.id || "m" + mi;
    var s = heading(host, pre, m.when, m.title);
    var ex = m.exchanges || [];
    if (!ex.length && m.critique) { s.appendChild(el("p", "", inl(m.critique))); return; }
    var tally = {};
    ex.forEach(function (x) { tally[x.verdict] = (tally[x.verdict] || 0) + 1; });
    s.appendChild(el("p", "mk-tally", ["landed", "partly", "missed", "gap"].filter(function (k) { return tally[k]; })
      .map(function (k) { return '<span class="vd vd-' + k + '"></span>' + tally[k] + " " + (k === "gap" ? "gaps" : k); }).join('<span class="sep"></span>') +
      '<span class="sep"></span>' + ex.length + " exchanges"));
    (m.read || []).forEach(function (p) { s.appendChild(el("p", "mk-read", inl(p))); });
    if (m.landed && m.landed.length) {
      s.appendChild(el("h3", "mk-h", "What landed"));
      var ul = el("ul", "mk-list");
      m.landed.forEach(function (t) { ul.appendChild(el("li", "", inl(t))); });
      s.appendChild(ul);
    }
    if (m.fix && m.fix.length) {
      s.appendChild(el("h3", "mk-h", "Fix these first"));
      var ol = el("ol", "mk-list mk-fix");
      m.fix.forEach(function (f) {
        var li = el("li", "", inl(f.t) + " ");
        var at = ex.findIndex(function (x) { return x.id === f.ref; });
        if (at >= 0) { li.appendChild(openLink("See turn " + (at + 1), m, at)); }
        ol.appendChild(li);
      });
      s.appendChild(ol);
    }
    /* The turns, one line each; the conversation itself opens in one screen. */
    var c = heading(host, pre + "-talk", "Every turn, in one screen", "The conversation");
    var go = el("button", "btn primary", "Open the conversation");
    go.addEventListener("click", function () { openConvo(m, 0); });
    c.appendChild(el("div", "acts")).appendChild(go);
    var list = el("ol", "turns");
    ex.forEach(function (x, i) {
      var li = el("li");
      var b = el("button", "turn");
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) +
        '</span><span class="tw spk-' + esc((x.who || "").toLowerCase()) + '">' + esc(x.who) + "</span>";
      b.addEventListener("click", function () { openConvo(m, i); });
      li.appendChild(b); list.appendChild(li);
    });
    c.appendChild(list);
  }
  function openLink(text, m, i) {
    var a = el("button", "linkish", esc(text));
    a.addEventListener("click", function () { openConvo(m, i); });
    return a;
  }

  /* One screen, shared by mocks and the Prep banks: a list on the left, the chosen item on
     the right. The item's header is small; under it, the light column is for understanding
     and the dark sheet is what to say, each scrolling on its own. Arrows move; Escape closes. */
  var convo = document.getElementById("convo");
  function panelSection(host, label, nodes) {
    if (!nodes.length) { return; }
    host.appendChild(el("div", "lab", label));
    nodes.forEach(function (n) { host.appendChild(n); });
  }
  function panelList(items, cls) {
    if (!items || !items.length) { return []; }
    var u = el("ul", "mk-list " + (cls || ""));
    items.forEach(function (t) { u.appendChild(el("li", "", inl(t))); });
    return [u];
  }
  /* o: { title, sub, label, count, row(i) -> html for the rail, draw(i, pane), start } */
  function openPanel(o) {
    var cur = o.start || 0;
    convo.innerHTML = "";
    convo.setAttribute("aria-label", o.label || o.title);
    var shell = el("div", "cv");
    var rail = el("nav", "cv-rail");
    rail.appendChild(el("div", "cv-title", "<b>" + esc(o.title) + "</b>" + (o.sub ? "<span>" + esc(o.sub) + "</span>" : "")));
    var rows = [];
    for (var i = 0; i < o.count; i++) {
      (function (i) {
        var b = el("button", "turn");
        b.innerHTML = o.row(i);
        b.addEventListener("click", function () { show(i); });
        rail.appendChild(b);
        rows.push(b);
      }(i));
    }
    rail.appendChild(el("div", "cv-keys", "Up and down arrows move. Escape closes."));
    var pane = el("section", "cv-pane");
    var close = el("button", "cv-close", "Close");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", function () { convo.close(); });
    shell.appendChild(rail); shell.appendChild(pane);
    convo.appendChild(close); convo.appendChild(shell);
    function show(i) {
      cur = i;
      rows.forEach(function (b, j) { b.classList.toggle("on", j === i); if (j === i) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); } });
      rows[i].scrollIntoView({ block: "nearest" });
      pane.innerHTML = "";
      o.draw(i, pane, function () { rows[i].innerHTML = o.row(i); });
      [].forEach.call(pane.querySelectorAll(".cv-col"), function (c) { c.scrollTop = 0; });
    }
    convo.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = cur + (e.key === "ArrowDown" ? 1 : -1);
        if (n >= 0 && n < o.count) { show(n); rows[n].focus(); }
      }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    rows[cur].focus();
  }
  function panelCols(pane, leftTitle, rightTitle) {
    var cols = el("div", "cv-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "cv-col cv-say");
    left.appendChild(el("h3", "cv-h", leftTitle));
    right.appendChild(el("h3", "cv-h", rightTitle));
    cols.appendChild(left); cols.appendChild(right);
    pane.appendChild(cols);
    return { left: left, right: right, cols: cols };
  }

  /* A mock: what they asked and how it landed; what you said; what to say. */
  function openConvo(m, start) {
    var ex = m.exchanges;
    openPanel({
      title: m.title, sub: m.when, label: "Mock conversation", count: ex.length, start: start,
      row: function (i) {
        var x = ex[i];
        return '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) + "</span>";
      },
      draw: function (i, pane) {
        var x = ex[i], who = (x.who || "").toLowerCase();
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q spk-" + who, '<span class="ex-who">Turn ' + (i + 1) + " of " + ex.length + ", " + esc(x.who) + "</span>" + inl(x.q)));
        head.appendChild(el("p", "cv-verdict", '<span class="vd vd-' + esc(x.verdict) + '"></span><b>' + esc(VERDICT[x.verdict] || x.verdict) + ".</b> " + inl(x.why || "")));
        if (x.tests) { head.appendChild(el("p", "cv-tests", "<b>They were testing:</b> " + inl(x.tests))); }
        pane.appendChild(head);
        var c = panelCols(pane, "What you said", "What to say");
        panelSection(c.left, "In short", (x.said || []).map(function (p) { return el("p", "ex-said", inl(p)); }));
        panelSection(c.left, "What worked", panelList(x.good, "mk-good"));
        panelSection(c.left, "What did not", panelList(x.bad, "mk-bad"));
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.say && x.say.length) { c.right.appendChild(transcript(x.say, "You", "")); }
        panelSection(c.right, "How to approach it", panelList(x.approach));
        (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.right.appendChild(f); } });
        var links = [];
        if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
        if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
        if (links.length) { c.right.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      }
    });
  }

  /* A Prep bank: what it is and what sits under it on the light side; what to say on the
     dark sheet. Each item can be marked revised; the mark is kept in this page's storage. */
  function isRevised(id) { return !!own().rev[id]; }
  function setRevised(id, on) {
    var o = own();
    if (on) { o.rev[id] = stamp(); } else { delete o.rev[id]; }
    writeJSON(OWN, o);
  }
  function openBank(bank, start) {
    var its = bank.items;
    openPanel({
      title: bank.title, sub: its.length + " questions", label: bank.title, count: its.length, start: start,
      row: function (i) {
        return '<span class="n">' + (i + 1) + '</span><span class="vd ' + (isRevised(its[i].id) ? "vd-landed" : "vd-open") + '"></span><span class="tl">' + esc(its[i].short || its[i].q) + "</span>";
      },
      draw: function (i, pane, redrawRow) {
        var x = its[i];
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q", '<span class="ex-who">' + esc(bank.title) + ", " + (i + 1) + " of " + its.length + "</span>" + inl(x.q)));
        if (x.tests) { head.appendChild(el("p", "cv-verdict", "<b>They are testing:</b> " + inl(x.tests))); }
        var rv = el("button", "linkish cv-rev");
        function label() { rv.innerHTML = isRevised(x.id) ? '<span class="vd vd-landed"></span>Revised. Undo' : "Mark as revised"; }
        label();
        rv.addEventListener("click", function () { setRevised(x.id, !isRevised(x.id)); label(); redrawRow(); drawHubCounts(); });
        head.appendChild(el("p", "cv-tests")).appendChild(rv);
        pane.appendChild(head);
        var c = panelCols(pane, "Understand it", "What to say");
        panelSection(c.left, "What they may probe", panelList(x.probes));
        /* A big design question carries its own board: titled sections, read in order. */
        (x.parts || []).forEach(function (p) {
          c.left.appendChild(el("h4", "cv-part", inl(p.title)));
          if (p.lead) { c.left.appendChild(el("p", "cv-part-lead", inl(p.lead))); }
          panelList(p.items).forEach(function (u) { c.left.appendChild(u); });
          /* A worked example: code, shown as written. */
          if (p.code) { var pre = el("pre", "cv-code"); pre.appendChild(el("code", "", esc(p.code))); c.left.appendChild(pre); }
          if (p.after) { panelList(p.after).forEach(function (u) { c.left.appendChild(u); }); }
        });
        panelSection(c.left, "The nuance", panelList(x.notes));
        panelSection(c.left, "Avoid", panelList(x.never, "mk-bad"));
        learn(c.left, x.learn || {});
        if (x.drill) { c.left.appendChild(el("p", "ex-links", '<a href="' + link("prep", "drill-" + x.drill) + '">Practise it aloud, timed</a>')); }
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.a && x.a.length) { c.right.appendChild(transcript(x.a, "You", "")); }
        /* Lines to swap in: a short answer for each probe, said the same way. */
        if (x.swaps && x.swaps.length) {
          c.right.appendChild(el("div", "lab", "Lines you can swap in"));
          x.swaps.forEach(function (w) {
            c.right.appendChild(el("div", "swap", '<span class="sw-when">' + inl(w.when) + '</span><span class="sw-line">' + emph(inl(w.line)) + "</span>"));
          });
        }
        if (x.meta) { c.right.appendChild(el("p", "cv-meta", esc(x.meta))); }
        if (c.left.querySelector(".cv-code")) { c.cols.classList.add("has-code"); }
      }
    });
  }

  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    return { tab: tab, anchor: p[1] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = link(t.id);
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = [];
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "mocks") { tabMocks(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    drawTabs(r.tab); drawSide(r.tab); progress();
    var key = r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var c = document.getElementById("count");
    if (!LOOP.when_iso) { c.textContent = "Date to be set"; return; }
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
</html>
