      nav.push(["s-" + x.id, x.name, false, link("sessions", x.id), i === idx, isDone(t, x)]);
    });
    var x = LOOP.sessions[idx];
    var box = el("div", "session"); box.id = "s-" + x.id;
    box.appendChild(el("h2", "", esc(x.name)));
    var meta = el("div", "meta");
    meta.innerHTML = "<span>" + esc(x.day) + ", session " + (idx + 1) + " of " + LOOP.sessions.length + "</span><span>" + esc(x.len) + "</span>" + (isDone(t, x) ? '<span class="chip done">Done ' + esc(t.done[x.id]) + "</span>" : "");
    box.appendChild(meta);
    if (x.intro) { box.appendChild(el("p", "intro", inl(x.intro))); }
    (x.figs || []).forEach(function (k, i) { var f = figNode(k, i + 1); if (f) { box.appendChild(f); } });
    x.steps.forEach(function (st, i) { box.appendChild(stepNode(x.id + ":" + i, st, false)); });
    if (x.study && x.study.length) {
      box.appendChild(el("h3", "", "What to know for it"));
      x.study.forEach(function (it, i) { box.appendChild(stepNode(x.id + ":s" + i, it, true)); });
    }
    var end = el("div", "session-end");
    if (x.quiz.length) {
      var q = el("button", "btn primary", "Quiz this session, " + x.quiz.length + " questions");
      q.addEventListener("click", function () { openQuiz(x); });
      end.appendChild(q);
    }
    var d = el("button", "btn", isDone(t, x) ? "Mark not done" : "Mark the whole session done");
    d.addEventListener("click", function () { toggleSession(x); });
    end.appendChild(d);
    box.appendChild(end);
    var pager = el("div", "pager");
    var prev = LOOP.sessions[idx - 1], next = LOOP.sessions[idx + 1];
    pager.innerHTML = (prev ? '<a href="' + link("sessions", prev.id) + '"><span>Previous</span>' + esc(prev.name) + "</a>" : '<a href="' + link("overview", "plan") + '"><span>Back to</span>The plan</a>') +
      (next ? '<a class="next" href="' + link("sessions", next.id) + '"><span>Next</span>' + esc(next.name) + "</a>" : '<a class="next" href="' + link("mocks") + '"><span>Then</span>A mock interview</a>');
    box.appendChild(pager);
    host.appendChild(box);
  }

  /* Figures come from ../figures/figures.js by key, the same registry the tracker draws from. */
  function figNode(k, n) {
    var f = window.FIGURES && FIGURES.DIA[k];
    if (!f) { return null; }
    var fig = el("figure", f.fixed ? "" : "trk");
    fig.setAttribute("data-fig", k);
    if (n) { fig.appendChild(el("div", "fh", "Figure " + n + ". " + esc(f.title))); }
    fig.appendChild(el("div", "", f.svg()));
    fig.appendChild(el("figcaption", "", f.cap));
    return fig;
  }
  /* What an item rests on: its figures, what to read (with minutes), and where it sits in
     the system design guide. Shared by session steps and Prep questions. */
  function learn(body, x) {
    (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { body.appendChild(f); } });
    var read = el("ul", "reading"), seen = {};
    (x.read || []).forEach(function (r) {
      var k = r.url || r.book || r.label;
      if (!k || seen[k]) { return; }
      seen[k] = 1;
      read.appendChild(el("li", "", (r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + inl(r.label || r.url) + "</a>" : inl(r.book || r.label)) +
        (r.m ? '<span class="w">' + r.m + " min</span>" : "") + (r.why ? '<span class="why">' + inl(r.why) + "</span>" : "")));
    });
    if (read.children.length) { body.appendChild(el("div", "lab", "Read")); body.appendChild(read); }
    if (x.sdLinks && x.sdLinks.length) {
      body.appendChild(el("div", "lab", "In your system design guide"));
      var sd = el("ul", "reading");
      x.sdLinks.forEach(function (q) {
        sd.appendChild(el("li", "", '<a href="' + esc(q.href) + '" target="_blank" rel="noopener">' + esc(q.label) + "</a>" +
          (q.why ? '<span class="why">' + inl(q.why) + "</span>" : "")));
      });
      body.appendChild(sd);
    }
  }
  /* A step that asks you to say, explain or answer something gets a box: typed or dictated
     (Win+H), saved in the tracker's own answers so the tracker shows it too. Optional. */
  var SAYS = /out loud|say|saying|record yourself|explain|in your own words|answer the|talk through|walk through/i;
  function mineBox(key, prompt) {
    var box = el("div", "mine"), id = "mine-" + key.replace(/[^a-z0-9]/gi, "-");
    var lb = el("label", "", inl(prompt)); lb.setAttribute("for", id);
    var ta = el("textarea"); ta.id = id;
    ta.placeholder = "Your answer. Say it, then type or dictate it here (Win+H). Optional; saved as you go.";
    var t0 = tracker(), rec = (t0.answers || {})[key];
    ta.value = rec && rec.text ? rec.text : "";
    var st = el("div", "mine-st", rec && rec.at ? "Saved " + esc(rec.at) : "");
    var timer = null;
    ta.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(function () {
        var t = tracker(), v = ta.value.trim();
        t.answers = t.answers || {};
        if (v) { t.answers[key] = { text: v, at: stamp() }; st.textContent = "Saved " + t.answers[key].at; }
        else { delete t.answers[key]; st.textContent = ""; }
        writeJSON(TRACKER, t);
      }, 500);
    });
    box.appendChild(lb); box.appendChild(ta); box.appendChild(st);
    return box;
  }
  function sayToggle(label, node) {
    var d = el("details", "say");
    d.appendChild(el("summary", "", esc(label)));
    d.appendChild(node);
    return d;
  }
  /* A step opens to what it is, what to read, where it sits in the system design guide
     and the figure that draws it. What you would say stays shut until you have tried. */
  /* The question the answer box answers: the step's done-when, else its title, explained. */
  function promptOf(it) {
    var p = String(it.out || "Explain in your own words. " + it.t).replace(/[.\s]+$/, "");
    return (/^[a-z]+\b/.test(p) ? p.charAt(0).toUpperCase() + p.slice(1) : p) + (/[?!]$/.test(p) ? "" : QWORD.test(p) ? "?" : ".");
  }
  var QWORD = /^(how|what|why|when|which|who|where|do|does|did|can|could|is|are|should|would|will)\b/i;
  /* Key points: the term before the first colon in bold. */
  function ptsList(pts) {
    var ul = el("ul", "pts");
    pts.forEach(function (q) {
      var m = /^([^:]{2,60}):\s+([\s\S]+)$/.exec(String(q));
      ul.appendChild(el("li", "", m ? "<b>" + inl(m[1]) + "</b> " + inl(m[2]) : inl(q)));
    });
    return ul;
  }
  function stepNode(key, it, isStudy) {
    var t = tracker();
    var row = el("details", "step");
    row.setAttribute("name", "step");
    row.addEventListener("toggle", function () { if (row.open) { glideTo(row); } });
    var sm = el("summary");
    var tick = el("button", "tick" + (t.steps[key] ? " on" : ""), t.steps[key] ? "&#10003;" : "");
    tick.setAttribute("aria-label", "Mark done: " + it.t);
    tick.addEventListener("click", function (e) {
      e.preventDefault(); e.stopPropagation();
      var tt = tracker();
      if (tt.steps[key]) { delete tt.steps[key]; delete tt.steps[key + ":at"]; }
      else { tt.steps[key] = true; tt.steps[key + ":at"] = stamp(); }
      writeJSON(TRACKER, tt);
      tick.classList.toggle("on", !!tt.steps[key]);
      tick.innerHTML = tt.steps[key] ? "&#10003;" : "";
      progress();
    });
    sm.appendChild(tick);
    sm.appendChild(el("span", "st", inl(it.t)));
    var mins = it.m || (it.do || []).reduce(function (a, d) { return a + (d.m || 0); }, 0);
    sm.appendChild(el("span", "sm", mins ? mins + " min" : ""));
    row.appendChild(sm);

    var body = el("div", "cv-cols pq-cols sbody2"), left = el("div", "cv-col cv-said"), work = el("div", "pq-work");
    body.appendChild(left); body.appendChild(work);
    if (!isStudy && it.d) { left.appendChild(el("p", "d", inl(it.d))); }
    if (it.pts && it.pts.length) { left.appendChild(ptsList(it.pts)); }
    learn(left, { figs: it.figs || [] });

    var pre = [];
    if (isStudy && it.do) {
      it.do.forEach(function (d) {
        pre.push({ url: d.url, label: d.a, m: d.m, why: d.where });
      });
    }
    if (!isStudy && (it.where || it.url)) { pre.push(it.url ? { url: it.url, label: it.where || it.url } : { book: it.where }); }
    learn(left, { figs: [], read: pre.concat(isStudy ? (it.res || []) : (it.links || []), it.read || []), sdLinks: it.sdLinks });
    var say = isStudy ? it.say : it.ans;
    if (say || it.out || SAYS.test(it.t || "")) { work.appendChild(mineBox(key, promptOf(it))); }
    if (say) { work.appendChild(sayToggle(isStudy ? "The idea, in the words you would use" : "What you would say", transcript(Array.isArray(say) ? say : [say], "", ""))); }
    if (!work.children.length) { work.remove(); body.classList.add("one"); }
    row.appendChild(body);
    return row;
  }

  function toggleSession(x) {
    var t = tracker();
    if (t.done[x.id]) {
      delete t.done[x.id];
    } else {
      stepKeys(x).forEach(function (k) { if (!t.steps[k]) { t.steps[k] = true; t.steps[k + ":at"] = stamp(); } });
      if (x.hasTrackerQuiz && !(t.quiz[x.id] && t.quiz[x.id].passed)) {
        t.quiz[x.id] = { score: 0, passed: true, at: stamp(), missed: [], via: "interview page" };
      }
      t.done[x.id] = stamp();
    }
    writeJSON(TRACKER, t);
    route();
  }

  /* ---------------------------------------------------------------- mocks */
  /* A mock reads in two parts: the read (how it went, what landed, what to fix first),
     then the conversation, one exchange at a time. Each exchange shows who asked what and
     what you said, with a verdict; it opens to why, how to approach it, and the answer to
     say, behind the same toggle the Prep tab uses. */
  var VERDICT = { landed: "Landed", partly: "Partly", missed: "Missed", gap: "Gap: you did not have an answer" };
  function tabMocks(host) {
    var s = heading(host, "mock", "Run in chat", "Mock interviews");
    s.appendChild(el("p", "lead", inl(LOOP.mockHow)));
    if (!LOOP.mocks.length) {
      s.appendChild(el("p", "when", "None yet. After a mock in chat, its read and its exchanges appear here. The latest two are kept."));
    }
    LOOP.mocks.slice(-2).reverse().forEach(function (m, mi) { drawMock(host, m, mi); });
  }
  function drawMock(host, m, mi) {
    var pre = m.id || "m" + mi;
    var s = heading(host, pre, m.when, m.title);
    var ex = m.exchanges || [];
    if (!ex.length && m.critique) { s.appendChild(el("p", "", inl(m.critique))); return; }
    var tally = {};
    ex.forEach(function (x) { tally[x.verdict] = (tally[x.verdict] || 0) + 1; });
    s.appendChild(el("p", "mk-tally", ["landed", "partly", "missed", "gap"].filter(function (k) { return tally[k]; })
      .map(function (k) { return '<span class="vd vd-' + k + '"></span>' + tally[k] + " " + (k === "gap" ? "gaps" : k); }).join('<span class="sep"></span>') +
      '<span class="sep"></span>' + ex.length + " exchanges"));
    (m.read || []).forEach(function (p) { s.appendChild(el("p", "mk-read", inl(p))); });
    if (m.landed && m.landed.length) {
      s.appendChild(el("h3", "mk-h", "What landed"));
      var ul = el("ul", "mk-list");
      m.landed.forEach(function (t) { ul.appendChild(el("li", "", inl(t))); });
      s.appendChild(ul);
    }
    if (m.fix && m.fix.length) {
      s.appendChild(el("h3", "mk-h", "Fix these first"));
      var ol = el("ol", "mk-list mk-fix");
      m.fix.forEach(function (f) {
        var li = el("li", "", inl(f.t) + " ");
        var at = ex.findIndex(function (x) { return x.id === f.ref; });
        if (at >= 0) { li.appendChild(openLink("See turn " + (at + 1), m, at)); }
        ol.appendChild(li);
      });
      s.appendChild(ol);
    }
    /* The turns, one line each; the conversation itself opens in one screen. */
    var c = heading(host, pre + "-talk", "Every turn, in one screen", "The conversation");
    var go = el("button", "btn primary", "Open the conversation");
    go.addEventListener("click", function () { openConvo(m, 0); });
    c.appendChild(el("div", "acts")).appendChild(go);
    var list = el("ol", "turns");
    ex.forEach(function (x, i) {
      var li = el("li");
      var b = el("button", "turn");
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) +
        '</span><span class="tw spk-' + esc((x.who || "").toLowerCase()) + '">' + esc(x.who) + "</span>";
      b.addEventListener("click", function () { openConvo(m, i); });
      li.appendChild(b); list.appendChild(li);
    });
    c.appendChild(list);
  }
  function openLink(text, m, i) {
    var a = el("button", "linkish", esc(text));
    a.addEventListener("click", function () { openConvo(m, i); });
    return a;
  }

  /* One screen, shared by mocks and the Prep banks: a list on the left, the chosen item on
     the right. The item's header is small; under it, the light column is for understanding
     and the dark sheet is what to say, each scrolling on its own. Arrows move; Escape closes. */
  var convo = document.getElementById("convo");
  function panelSection(host, label, nodes) {
    if (!nodes.length) { return; }
    host.appendChild(el("div", "lab", label));
    nodes.forEach(function (n) { host.appendChild(n); });
  }
  function panelList(items, cls) {
    if (!items || !items.length) { return []; }
    var u = el("ul", "mk-list " + (cls || ""));
    items.forEach(function (t) { u.appendChild(el("li", "", inl(t))); });
    return [u];
  }
  /* o: { title, sub, label, count, row(i) -> html for the rail, draw(i, pane), start } */
  function openPanel(o) {
    var cur = o.start || 0;
    convo.innerHTML = "";
    convo.setAttribute("aria-label", o.label || o.title);
    var shell = el("div", "cv");
    var rail = el("nav", "cv-rail");
    rail.appendChild(el("div", "cv-title", "<b>" + esc(o.title) + "</b>" + (o.sub ? "<span>" + esc(o.sub) + "</span>" : "")));
    var rows = [];
    for (var i = 0; i < o.count; i++) {
      (function (i) {
        var b = el("button", "turn");
        b.innerHTML = o.row(i);
        b.addEventListener("click", function () { show(i); });
        rail.appendChild(b);
        rows.push(b);
      }(i));
    }
    rail.appendChild(el("div", "cv-keys", "Up and down arrows move. Escape closes."));
    var pane = el("section", "cv-pane");
    var close = el("button", "cv-close", "Close");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", function () { convo.close(); });
    shell.appendChild(rail); shell.appendChild(pane);
    convo.appendChild(close); convo.appendChild(shell);
    function show(i) {
      cur = i;
      rows.forEach(function (b, j) { b.classList.toggle("on", j === i); if (j === i) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); } });
      rows[i].scrollIntoView({ block: "nearest" });
      pane.innerHTML = "";
      o.draw(i, pane, function () { rows[i].innerHTML = o.row(i); });
      [].forEach.call(pane.querySelectorAll(".cv-col"), function (c) { c.scrollTop = 0; });
    }
    convo.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = cur + (e.key === "ArrowDown" ? 1 : -1);
        if (n >= 0 && n < o.count) { show(n); rows[n].focus(); }
      }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    rows[cur].focus();
  }
  function panelCols(pane, leftTitle, rightTitle) {
    var cols = el("div", "cv-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "cv-col cv-say");
    left.appendChild(el("h3", "cv-h", leftTitle));
    right.appendChild(el("h3", "cv-h", rightTitle));
    cols.appendChild(left); cols.appendChild(right);
    pane.appendChild(cols);
    return { left: left, right: right, cols: cols };
  }

  /* A mock: what they asked and how it landed; what you said; what to say. */
  function openConvo(m, start) {
    var ex = m.exchanges;
    openPanel({
      title: m.title, sub: m.when, label: "Mock conversation", count: ex.length, start: start,
      row: function (i) {
        var x = ex[i];
        return '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) + "</span>";
      },
      draw: function (i, pane) {
        var x = ex[i], who = (x.who || "").toLowerCase();
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q spk-" + who, '<span class="ex-who">Turn ' + (i + 1) + " of " + ex.length + ", " + esc(x.who) + "</span>" + inl(x.q)));
        head.appendChild(el("p", "cv-verdict", '<span class="vd vd-' + esc(x.verdict) + '"></span><b>' + esc(VERDICT[x.verdict] || x.verdict) + ".</b> " + inl(x.why || "")));
        if (x.tests) { head.appendChild(el("p", "cv-tests", "<b>They were testing:</b> " + inl(x.tests))); }
        pane.appendChild(head);
        var c = panelCols(pane, "What you said", "What to say");
        panelSection(c.left, "In short", (x.said || []).map(function (p) { return el("p", "ex-said", inl(p)); }));
        panelSection(c.left, "What worked", panelList(x.good, "mk-good"));
        panelSection(c.left, "What did not", panelList(x.bad, "mk-bad"));
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.say && x.say.length) { c.right.appendChild(transcript(x.say, "You", "")); }
        panelSection(c.right, "How to approach it", panelList(x.approach));
        (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.right.appendChild(f); } });
        var links = [];
        if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
        if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
        if (links.length) { c.right.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      }
    });
  }

  /* A Prep question can be marked revised; the mark is kept in this page's storage. */
  function isRevised(id) { return !!own().rev[id]; }
  function setRevised(id, on) {
    var o = own();
    if (on) { o.rev[id] = stamp(); } else { delete o.rev[id]; }
    writeJSON(OWN, o);
  }
  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    if (tab === "overview" && p[0] && p[0] !== "overview" && LOOP.learn && p[1]) {
      var to = null;
      learnModules().forEach(function (m) { m.topics.forEach(function (t) { if ((t.was || []).indexOf(p[1]) >= 0 || t.id === p[1]) { to = t.id; } }); });
      if (to) { history.replaceState(null, "", link("learn", to)); return { tab: "learn", anchor: to }; }
    }
    return { tab: tab, anchor: p[1] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = link(t.id);
      if (t.id === current) { a.setAttribute("aria-current", "page"); }

  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = [];
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "rounds") { tabRounds(main); }
      else if (r.tab === "research") { tabResearch(main); }
      else if (r.tab === "learn") { tabLearn(main, r.anchor); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "mocks") { tabMocks(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    drawTabs(r.tab); drawSide(r.tab); progress();
    var key = r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var c = document.getElementById("count");
    if (!LOOP.when_iso) { c.textContent = "Date to be set"; return; }
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
