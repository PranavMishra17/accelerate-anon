 the outcome the customer cares about (tickets, time saved, suggestions accepted), not model scores.", "Expect the usual traps, from Chip Huyen's list: using generative AI where it is not needed, blaming the AI for a bad product, starting too complex, trusting early success, and skipping human evaluation."], "figs": [], "production": ["Per GitHub's engineering blog, Copilot began as a chat prototype and was moved into the editor because it proved useful in almost every situation there; GitHub used acceptance rate and characters retained to judge whether extra context helped.", "Per Honeycomb's engineering blog, its Query Assistant turns a question into a query the user can refine, was built in about a month with scope cut hard, and used non-destructive output, output validation, no chat UI and per-user rate limits against prompt injection."], "mine": ["WheelPrice: an embeddable fitment assistant limited to four tools over verified data, built to cut fitment-related support tickets.", "MockFlow-AI: a live voice interview platform where code owns the interview flow and the model only phrases each move."], "res": [{"kind": "video", "req": true, "label": "Building Blocks for LLM Systems & Products", "url": "https://www.youtube.com/watch?v=LzeC1AQ-U5o", "yt": {"id": "LzeC1AQ-U5o", "ch": "AI Engineer"}, "m": 17, "why": "Eugene Yan on the building blocks of a real LLM product: evals, retrieval, caching, guardrails, defensive UX and feedback."}, {"kind": "video", "req": false, "label": "Building LLM Applications for Production", "url": "https://www.youtube.com/watch?v=spamOhG7BOA", "yt": {"id": "spamOhG7BOA", "ch": "AAIF Live (Chip Huyen)"}, "m": 35, "why": "Chip Huyen on what changes between a demo and production: ambiguity, evaluation, cost and latency."}, {"kind": "article", "label": "Common pitfalls when building generative AI applications (Chip Huyen)", "url": "https://huyenchip.com/2025/01/16/ai-engineering-pitfalls.html", "m": 8, "why": "Six traps in two pages; each one is a good thing to say you have avoided."}, {"kind": "article", "label": "All the Hard Stuff Nobody Talks About When Building Products with LLMs (Honeycomb)", "url": "https://www.honeycomb.io/blog/hard-stuff-nobody-talks-about-llm", "m": 13, "why": "A real shipped feature, with its context, latency, prompt injection and compliance problems stated plainly."}], "mcq": [{"q": "A PM asks for an AI feature that 'answers customer questions about wheel fitment'. What is the best first step?", "o": ["Pick the largest available model", "Write the system prompt", "Collect real customer questions with correct answers, define what good looks like, and check how many a lookup alone could answer", "Fine-tune a model on the product catalogue", "Build a chat widget"], "a": 2, "why": "Real examples set the bar and show where a model is needed at all. Fitment data can be looked up, so the model may only need to parse messy input."}, {"q": "Which rollout plan for a new AI feature is strongest?", "o": ["Launch to everyone and watch complaints", "Flag it on for a small group, keep a non-AI fallback and a kill switch, and track the customer outcome", "Launch to all users but only in the evening", "Run it internally forever", "Launch after the model's benchmark score passes a threshold"], "a": 1, "why": "A flag limits the damage, a fallback keeps the product working, and the outcome metric says whether the feature helps. Benchmarks and complaints say little about that."}, {"q": "Your offline eval score rises 5 points after a change, but support tickets about the feature also rise. What is the best reading?", "o": ["Tickets always lag, so ignore them", "The eval is right and customers are wrong", "The model needs a larger context window", "Both measures are noise", "The eval set probably does not represent real use, so look at the real failures and add them to it"], "a": 4, "why": "Real customers are the ground truth. A rising score with rising tickets means the eval is measuring something else; turn the real failures into eval cases."}, {"q": "When should a task not be handed to an LLM?", "o": ["Whenever it involves language", "When the input is messy", "When a user is waiting", "When rules or a lookup solve it accurately, as with fitment checked against a table", "When the answer is more than one sentence"], "a": 3, "why": "A deterministic path is cheaper, faster and testable. Use the model only for the judgment part, such as parsing a messy listing into fields the lookup can use."}], "open": {"q": "How would you add AI to an existing product?", "probe": "Customer Obsession: do you start from the problem and the outcome, not the model?", "a": ["Start from a customer problem that is slow, repetitive or hard to search, not from the model.", "Ask whether code or search solves it first; use the model where judgment on language is needed.", "Build an eval set from real examples before the feature.", "Ship to a small group behind a flag with a fallback, and measure the outcome the customer cares about.", "Example: the WheelPrice assistant answered from verified product data through tools, and said so when the data was partial."]}, "say": ["I'd start from the customer, not the model: where are people spending time on something repetitive, or struggling to find something? Then I'd ask whether plain code or search solves it first, and use the model only where you actually need judgment on language.", "Before building, I'd collect real examples and turn them into an eval set, so we know what good looks like. Then ship it to a small group behind a flag, with a fallback so the product still works when the model is slow or wrong, and measure the outcome the customer cares about. At WheelPrice the customer assistant answered from our verified product data through tools, never from the model's memory, because a wrong fitment answer costs the customer money, and when the data for a car was only partly there, it said so."], "avoid": ["Starting from 'we should use an LLM' instead of from a customer problem.", "Launching to everyone with no flag, no fallback and no eval set.", "Reporting model scores as success instead of the customer outcome."], "links": [{"url": "../BASELINE.html#/ai/tool-calling", "label": "Baseline: Tool calling", "why": "The WheelPrice pattern: the model picks a tool, your code answers from verified data."}, {"url": "../SYSTEM%20DESIGN.html#/designs/faq-assistant/requirements", "label": "Guide: a grounded FAQ assistant", "why": "A full design for adding an assistant to an existing product."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Guide: Eval suites as release gates", "why": "The eval set before the feature, drawn as a gate."}, {"url": "../BASELINE.html#/ai/evaluation", "label": "Baseline: Evaluation", "why": "Offline sets and online metrics, the two halves of knowing it works."}]}], "day": "Tue 3 Nov"}, {"id": "ft", "title": "7. Fine-tuning", "blurb": "When to tune instead of prompting or retrieving, and how LoRA makes tuning cheap.", "topics": [{"id": "f-when", "title": "Fine-tune, RAG or prompt?", "brief": "Prompt first, add retrieval when the model lacks facts, and fine-tune when you need a behaviour, a format or a cheaper model that prompting cannot reach.", "points": ["The ladder: write evals, then prompt (clear instructions, examples), then add retrieval for missing knowledge, then fine-tune for behaviour. Each step costs more to build and maintain than the one before.", "Prompt when the model can already do the task and you need to steer it. It is the fastest to change and needs no data beyond a few examples.", "RAG when the answer depends on facts that are private, fresh or need a citation. The facts stay in your data, so updating a document updates the answer.", "Fine-tune when you need a consistent format or style, a narrow skill, shorter prompts, or a smaller cheaper model doing one task. You train on examples of the exact input and output you want; AWS suggests starting with 50 to 100 high-quality ones.", "Fine-tuning is a poor way to add knowledge: one study found models learn new facts slowly that way and, once learned, those examples raise hallucination; another found RAG beat fine-tuning for old and new knowledge.", "Fine-tuning has upkeep: the tuned model is tied to its base model, so you re-train and re-evaluate when the base changes or the data drifts. Decide with your own eval, not a rule of thumb. The approaches also combine: tune for style, retrieve for facts."], "figs": [], "production": ["Per OpenAI's model optimization guide, the flow is evals first, then prompting, and fine-tuning only for some use cases, such as consistent formatting, shorter prompts, or a smaller cheaper model for one task.", "Per AWS's announcement, Amazon Bedrock lets you fine-tune Claude 3 Haiku on your own labelled examples for classification, structured output and tool use, and advises starting with 50 to 100 high-quality rows.", "Per the same OpenAI guide, fine-tuned models stay available for inference only until their base models are deprecated, which is the upkeep cost in one sentence."], "mine": ["MetaRAG (IEEE CAI 2026, first author): improved answers by changing retrieval, not the model: 82.5% precision and 20% fewer hallucinations than baseline RAG.", "alfred_: replaced per-message LLM calls in the email-rules engine with a deterministic three-stage matcher, cutting per-user LLM cost 40% at parity accuracy: sometimes the cheapest rung is no model.", "WheelPrice: fine-tuned a YOLO model to locate wheels in photos for a fitment visualizer (a vision model, not an LLM)."], "res": [{"kind": "video", "req": true, "label": "RAG vs. Fine Tuning", "url": "https://www.youtube.com/watch?v=00Q0G84kq3M", "yt": {"id": "00Q0G84kq3M", "ch": "IBM Technology"}, "m": 9, "why": "The two options side by side in under ten minutes."}, {"kind": "video", "req": false, "label": "A Survey of Techniques for Maximizing LLM Performance", "url": "https://www.youtube.com/watch?v=ahnGLM-RC1Y", "yt": {"id": "ahnGLM-RC1Y", "ch": "OpenAI"}, "m": 46, "why": "OpenAI's own decision framework, from a DevDay talk. Long: the first half covers the ladder."}, {"kind": "article", "label": "Model optimization (OpenAI docs)", "url": "https://developers.openai.com/api/docs/guides/model-optimization", "m": 8, "why": "Evals, prompting, then fine-tuning, and what fine-tuning is good for."}, {"kind": "article", "label": "Does fine-tuning LLMs on new knowledge encourage hallucinations? (Gekhman et al.)", "url": "https://arxiv.org/abs/2405.05904", "m": 12, "why": "The evidence for why fine-tuning is the wrong tool for facts. Read the abstract and introduction."}], "mcq": [{"q": "A support bot must answer from policy documents that change weekly, and quote the source. What should you use?", "o": ["Fine-tune on the policies every week", "Retrieval over the documents, with citations", "A longer system prompt with no retrieval", "A bigger model, since it knows more policies", "Lower the temperature to zero"], "a": 1, "why": "Changing, private knowledge that needs a source is the case for RAG. Fine-tuning would need retraining every week and cannot cite."}, {"q": "A classification step runs a large model five million times a day with a long prompt full of examples. Accuracy is fine; cost and latency are the problem. What is the strongest option to test?", "o": ["Fine-tune a smaller model on labelled examples so the long prompt goes away", "Add retrieval to the prompt", "Raise the maximum output tokens", "Add a multi-agent vote", "Increase the temperature"], "a": 0, "why": "This is a behaviour problem at scale. A small tuned model can learn the task without the long prompt, cutting cost and latency. Test it against the current setup on your eval."}, {"q": "A team fine-tunes on 2,000 documents of internal facts, and the model now states plausible but wrong figures about them. What is the best explanation and next step?", "o": ["The learning rate was too low; train longer on the same data", "The model is too small; fine-tune a bigger one on the same facts", "Fine-tuning is poor at adding facts and can raise hallucination; use retrieval for the facts and check with evals", "Temperature is too high; set it to zero", "The documents need to be shorter"], "a": 2, "why": "Studies find new facts are learned slowly through fine-tuning and then increase hallucination. Keep facts in retrieval and use tuning for behaviour."}, {"q": "Which is a good reason NOT to fine-tune yet?", "o": ["You have no eval set, so you cannot tell whether the tuned model is better", "You want a consistent JSON format", "You want a smaller model for one narrow task", "Your prompts are long and repeated on every call", "You have thousands of labelled examples"], "a": 0, "why": "Without an eval you cannot measure a gain or catch a regression. The other options are the situations where fine-tuning is worth testing."}], "open": {"q": "When would you fine-tune a model instead of using RAG or better prompts?", "probe": "A decision ladder with reasons, and honesty about experience.", "a": ["Climb a ladder with evals from the start: prompt, then RAG, then fine-tune.", "RAG for knowledge that is private, fresh or needs a citation; updating a document updates the answer.", "Fine-tune for behaviour: a strict format, a style, a narrow skill, shorter prompts, or a smaller cheaper model.", "Not for adding facts: models learn them slowly and it can raise hallucination; RAG beat it in comparisons.", "Upkeep, and an example with a number: MetaRAG's 20% fewer hallucinations came from retrieval, not tuning."]}, "say": ["I'd go up a ladder, and start with evals so I can tell whether a step helped. First, a better prompt with a few examples. If the model is missing facts, because they're private, change often, or need a source, I add retrieval. Only if the problem is behaviour that prompting can't fix do I consider fine-tuning: a strict output format, a style, a narrow task, or getting a smaller, cheaper model to do one job well. Fine-tuning is a poor way to add knowledge. Research shows models learn new facts slowly that way and it can raise hallucinations, and retrieval did better in the comparisons.", "Fine-tuning also has upkeep: you retrain and re-evaluate when the base model changes or the data drifts, so I'd want a measured gap first. Most of my experience is on the other rungs. In MetaRAG I got about twenty percent fewer hallucinations than baseline RAG by improving retrieval, and at alfred_ I cut per-user LLM cost forty percent by replacing per-message model calls with a deterministic matcher. I did fine-tune a YOLO model at WheelPrice, which is vision, but the lesson was the same: start with the cheapest thing that the eval says works."], "avoid": ["Saying fine-tuning teaches the model your documents: it teaches behaviour, and facts are better kept in retrieval.", "Reaching for fine-tuning before you have an eval set to prove it helped."], "links": [{"url": "../BASELINE.html#/ai/fine-tuning-vs-prompting", "label": "Baseline: When fine-tuning beats prompting", "why": "The decision in a few lines."}, {"url": "../BASELINE.html#/ai/rag", "label": "Baseline: Retrieval-augmented generation", "why": "The other side of the choice."}, {"url": "../BASELINE.html#/ml/fine-tuning-lora", "label": "Baseline: Fine-tuning and LoRA", "why": "What fine-tuning actually changes."}, {"url": "../CODING.html#lora", "label": "Coding page: fine-tuning with LoRA", "why": "Look at the diagram and the remember list."}]}, {"id": "f-lora", "title": "LoRA and parameter-efficient tuning", "brief": "LoRA freezes the base model and trains two small matrices beside each chosen weight, so a task adapter is tiny to train, store and swap, and costs nothing extra at inference once merged.", "points": ["The idea: instead of updating a big weight matrix W (d x k), train a low-rank update. The layer computes W'x = Wx + (alpha / r) B A x, with B (d x r) and A (r x k). Only A and B train; W stays frozen.", "The numbers: for d = k = 4096 and r = 8, A and B hold 8 x (4096 + 4096) = 65,536 parameters against 16.8 million in W, about 0.4%. The LoRA paper reports about 10,000 times fewer trainable parameters and 3 times less GPU memory than full fine-tuning of GPT-3 175B.", "Setup: B starts at zero, so training begins from the base model's behaviour. The rank r sets capacity (8 or 16 are common) and alpha scales the update. Apply it to all layers, MLPs included: at the same parameter count, attention-only LoRA does worse.", "Inference: merge W + (alpha / r) B A into one matrix and there is no added latency, or keep adapters separate and swap them per request on one base model.", "QLoRA: keep the frozen base in 4-bit (NormalFloat) and train LoRA adapters on top, with paged optimizers. It fine-tuned a 65B model on one 48 GB GPU. Raschka measured about 33% less memory for about 39% more training time, with little change in quality.", "Limits: LoRA matches full fine-tuning on small to medium datasets, but falls behind when the data exceeds its capacity (low ranks hit this sooner) and at large batch sizes. Its best learning rate is about 10x the full fine-tuning one. Like any fine-tune, it teaches behaviour better than facts."], "figs": ["lora"], "production": ["Per Apple's foundation models report, Apple Intelligence trains small LoRA adapters (rank 16, tens of megabytes for the roughly 3B on-device model) for tasks such as summarization, and loads and swaps them on the fly over one frozen base model.", "Per vLLM's documentation, one server can serve many LoRA adapters on a single base model, chosen per request by putting the adapter's name in the model field."], "mine": ["Quantization in production: an INT8 TorchScript audio inference service at 150ms p95 for assistant-patient voice interaction (UIC VARE Lab), the serving side of the same memory-versus-quality trade-off.", "WheelPrice: fine-tuned a YOLO model to locate wheels in photos for a fitment visualizer."], "res": [{"kind": "video", "req": true, "label": "What is Low-Rank Adaptation (LoRA) | explained by the inventor", "url": "https://www.youtube.com/watch?v=DhRoTONcyZE", "yt": {"id": "DhRoTONcyZE", "ch": "Edward Hu"}, "m": 8, "why": "The inventor of LoRA explains the idea in under eight minutes."}, {"kind": "video", "req": false, "label": "LoRA: Low-Rank Adaptation of Large Language Models - Explained visually + PyTorch code from scratch", "url": "https://www.youtube.com/watch?v=PXWYUTMt-AU", "yt": {"id": "PXWYUTMt-AU", "ch": "Umar Jamil"}, "m": 27, "why": "Longer and visual: the maths, the code from scratch, and why the rank is small."}, {"kind": "article", "label": "LoRA Without Regret (Thinking Machines)", "url": "https://thinkingmachines.ai/blog/lora/", "m": 25, "why": "When LoRA matches full fine-tuning, where it falls short, and which layers and learning rate to use."}, {"kind": "article", "label": "Practical tips for finetuning LLMs using LoRA (Sebastian Raschka)", "url": "https://magazine.sebastianraschka.com/p/practical-tips-for-finetuning-llms", "m": 20, "why": "Measured choices: rank, alpha, layers, and the QLoRA memory-for-time trade."}], "mcq": [{"q": "For a 4096 x 4096 weight matrix, LoRA with rank 8 trains roughly how many parameters for that matrix?", "o": ["About 16.8 million", "About 65,000 (8 x 8192)", "8", "4,096", "About 1 million"], "a": 1, "why": "A is 8 x 4096 and B is 4096 x 8, so r(d + k) = 8 x 8192 = 65,536, about 0.4% of the 16.8 million in W."}, {"q": "You merge a trained LoRA update into the base weights. What changes at inference?", "o": ["Latency doubles because two paths run", "You need two models in memory", "The model must be re-quantized", "No added latency, but that merged copy can no longer swap adapters", "The rank doubles"], "a": 3, "why": "Merging folds (alpha / r) B A into W, so the forward pass is the same size as the base. Keep adapters separate if you want to swap them per request."}, {"q": "What does QLoRA do differently from LoRA?", "o": ["It keeps the frozen base in 4-bit precision and trains LoRA adapters on top, saving memory", "It trains every weight in 4-bit", "It removes the need for adapters", "It raises the rank automatically", "It trains only the final layer"], "a": 0, "why": "QLoRA quantizes the frozen base (NormalFloat 4-bit) and backpropagates into the adapters, which cut memory enough to tune a 65B model on one 48 GB GPU."}, {"q": "A team applies LoRA only to the attention query and value matrices and is short on accuracy at its parameter budget. Which change does the evidence support?", "o": ["Drop the rank to 1 on every layer", "Freeze the MLPs even harder", "Apply LoRA to all layers, MLPs included", "Lower the learning rate by 10x", "Train for several more epochs on the same data"], "a": 2, "why": "At matched parameter counts, attention-only LoRA underperforms LoRA on the MLP layers, which hold most of the parameters."}], "open": {"q": "What is LoRA and why would you use it?", "probe": "The mechanism with the parameter math, and the limits.", "a": ["Freeze the pretrained weights and train a low-rank update beside them: W + (alpha / r) B A.", "The math: r(d + k) parameters instead of d x k; about 0.4% for r = 8 and a 4096-wide layer.", "B starts at zero; merge for no inference latency, or keep adapters separate and swap them per request.", "QLoRA: 4-bit frozen base plus adapters; 65B on one 48 GB GPU, about a third less memory for about 39% more time.", "Limits: behaviour not facts, capacity on very large datasets; apply to all layers."]}, "say": ["LoRA is a way to fine-tune a big model without updating all of its weights. You freeze the pretrained weights, and next to a weight matrix you train two small matrices, A and B, whose product is a low-rank update. The rank is small, often eight or sixteen, so for a four-thousand-wide layer you train about sixty-five thousand numbers instead of sixteen million. B starts at zero, so training begins from the base model's behaviour, and after training you can merge the update into the weights, so there's no extra latency at inference.", "That makes it cheap to train, and an adapter is tiny, so one base model can serve many tasks by swapping adapters, which is what Apple does on device. QLoRA goes further: keep the frozen base in 4-bit and train the adapters on top, which got a 65-billion-parameter model onto one 48 GB GPU. The catch is the usual one with fine-tuning: it's good for behaviour, format and narrow tasks, not for adding facts, and it can fall behind full fine-tuning on a very large dataset. On my side I know the quantization half from serving: at UIC I deployed an INT8 audio model at 150 milliseconds p95."], "avoid": ["Saying LoRA makes inference faster or compresses the model: it cuts training cost, and once merged, inference is unchanged.", "Saying LoRA adds knowledge reliably: like any fine-tune it shapes behaviour, and facts belong in retrieval."], "links": [{"url": "../BASELINE.html#/ml/fine-tuning-lora", "label": "Baseline: Fine-tuning and LoRA", "why": "Continue training, often by training a small add-on."}, {"url": "../CODING.html#lora", "label": "Coding page: fine-tuning with LoRA", "why": "Look at the diagram and the remember list."}, {"url": "../BASELINE.html#/inference/quantization", "label": "Baseline: Quantization", "why": "The 4-bit half of QLoRA, from the serving side."}]}], "day": "Thu 5 Nov"}, {"id": "stories", "title": "8. Your stories with GenAI tools", "blurb": "Amazon's scheduling email says you may be asked about your experience with GenAI tools. Two stories, in your words.", "topics": [{"id": "g-tool-wrong", "title": "A time a GenAI tool got it wrong", "brief": "The situation, how you caught it, what you did, what you do differently now. About two minutes.", "points": ["Situation: the tool, the task, why you used it.", "Caught: the check you ran that showed it was wrong, not luck.", "Did: verified, redid, changed how you use it.", "Effect: time saved or lost, and the habit you kept.", "Candidates: a deep research run where a second, checking pass refuted 17 of 18 claims from the first; a coding agent reporting a test passed or a function existed when it did not."], "open": {"q": "Tell me about a time a GenAI tool gave you something wrong. What did you do?", "probe": "That you use the tools critically, not blindly.", "a": ["The tool and the task, in one sentence.", "How you noticed: the check, the evidence.", "What you did about it.", "What you changed for next time, and the effect."]}, "say": [], "avoid": ["A story where you trusted the output and it shipped.", "Blaming the tool without saying what you changed."], "mine": ["Yours to tell: in chat, say capture genai-wrong and tell it the way you remember it; it goes in word for word."]}, {"id": "g-tool-win", "title": "A time a GenAI tool made you faster", "brief": "What the tool took on, what you kept for yourself, the effect with a number, what you would change.", "points": ["Situation: the task the tool took on, well specified (a migration, tests, a refactor already decided).", "Kept: the design, the review, the check against real data.", "Effect: hours saved, how much shipped.", "Change: what you would do differently next time."], "open": {"q": "How has a GenAI tool changed your outcome or speed? Give me an example.", "probe": "From Amazon's own email: situation, what went well, what you would do differently, the effect.", "a": ["The task and why it suited the tool.", "What you kept: design and checking.", "The effect with a number.", "What you would do differently."]}, "say": [], "avoid": ["Claiming it wrote the system for you.", "No number for the effect."], "mine": ["Yours to tell: in chat, say capture genai-win. The general answer to how you use AI tools is on Prep."]}], "day": "Sun 1 and Mon 2 Nov, in chat"}]}, "tabs": ["overview", "plan", "daily", "learn", "lld", "lp", "prep", "rounds", "card"], "plan": {"title": "Weeks 6 and 7, then the loop", "lead": "Two weeks of the wildcard, day by day, then the loop week. Weeks 4 and 5 stay where they are; their two mathematics sessions are on weekends here, because you said you would finish them. Tick items as you go. The problems are in Daily two, the design drills in LLD, the stories on Leadership.", "split": [["Coding", "about 45%", "The daily two, the problems reported from 2026 loops, and pattern revision on the coding page."], ["Leadership stories", "about 20%", "One story most days, then drilled under follow-ups. They come up in every round."], ["GenAI", "about 15%", "One module of the GenAI tab a day, in order; two tool-use stories in your words."], ["Object-oriented design", "about 15%", "Four drills from a blank page with their extension follow-ups; one evening of HLD-lite as insurance."], ["The full loop", "about 5%", "One self-run loop, timed, in a plain editor with no running code."]], "weeks": [{"id": "week6", "title": "Week 6: shake off the rust", "note": "Two to three hours a day. Overjoy on Thursday and the Mercor screen on Friday share these days.", "days": [{"date": "2026-10-22", "hours": "2 h", "focus": "Overjoy call today. Start small and start daily.", "items": [{"k": "daily", "t": "The daily two", "href": "#/daily/2026-10-22", "m": "35 min"}, {"k": "design", "t": "LLD foundations: do it as w5d in the plan (it reads this page's part 1), then tick both", "href": "../index.html#/s/w5d", "m": "75 min"}, {"k": "story", "t": "Read the Leadership tab: the rules and the sixteen", "href": "#/lp", "m": "20 min"}, {"k": "other", "t": "Mercor: the coding problems you started", "href": "mercor.html#/coding/problems", "m": "40 min"}]}, {"date": "2026-10-23", "hours": "1.5 h", "focus": "Mercor screen at 6 PM Eastern. Keep Amazon light today.", "items": [{"k": "daily", "t": "The daily two", "href": "#/daily/2026-10-23", "m": "35 min"}, {"k": "revise", "t": "Coding page: trees", "href": "../CODING.html#trees", "m": "20 min"}, { wo rounds a day.", "days": [{"date": "2026-11-05", "hours": "3 h", "focus": "Four days out. Sharp, not new.", "items": [{"k": "daily", "t": "The daily two", "href": "#/daily/2026-11-05", "m": "35 min"}, {"k": "revise", "t": "Redo two problems you found hardest (daily two or reported)", "href": "#/daily", "m": "40 min"}, {"k": "design", "t": "One design from a blank page", "href": "#/lld", "m": "40 min"}, {"k": "genai", "t": "GenAI tab: module 7, fine-tuning; then your two tool-use stories aloud", "href": "#/learn/m-ft", "m": "40 min"}]}, {"date": "2026-11-06", "hours": "3 h", "focus": "Three days out. Last full day.", "items": [{"k": "revise", "t": "Two mediums out loud, timed, in a plain editor", "href": "../CODING.html", "m": "60 min"}, {"k": "design", "t": "One design from a blank page", "href": "#/lld", "m": "40 min"}, {"k": "story", "t": "Three stories aloud with their follow-ups", "href": "#/lp/lp-stories", "m": "30 min"}, {"k": "genai", "t": "GenAI tab: Test me on everything, then explain your two weakest topics aloud", "href": "#/learn", "m": "30 min"}, {"k": "loop", "t": "Install Zoom on the interview device; open the LiveCode link with the ad blocker off", "href": "", "m": "15 min"}]}, {"date": "2026-11-07", "hours": "2 h", "focus": "Weekend: keep warm, do not cram.", "items": [{"k": "revise", "t": "Redo two problems you found hardest", "href": "#/daily", "m": "40 min"}, {"k": "design", "t": "One design from a blank page", "href": "#/lld", "m": "40 min"}, {"k": "story", "t": "Two stories aloud with their follow-ups", "href": "#/lp/lp-stories", "m": "30 min"}]}, {"date": "2026-11-08", "hours": "1.5 h", "focus": "Light. The loop is tomorrow.", "items": [{"k": "loop", "t": "Read the Loop day card", "href": "#/card", "m": "20 min"}, {"k": "revise", "t": "One medium, out loud", "href": "../CODING.html", "m": "30 min"}, {"k": "loop", "t": "Sleep early", "href": "", "m": ""}]}, {"date": "2026-11-09", "hours": "", "focus": "Loop day 1.", "items": [{"k": "loop", "t": "The Loop day card, nothing new", "href": "#/card", "m": ""}, {"k": "loop", "t": "Tonight: rest; reread the card and two stories you have not told yet", "href": "#/card", "m": "20 min"}, {"k": "loop", "t": "Sleep early", "href": "", "m": ""}]}, {"date": "2026-11-10", "hours": "", "focus": "Loop day 2.", "items": [{"k": "loop", "t": "The Loop day card, nothing new", "href": "#/card", "m": ""}]}]}]}, "lp": {"lead": "About half the decision. Every interviewer carries two or three principles; the behavioral round probes three or four stories for five to ten minutes each. What wins is depth and truth: your own actions, a number, and what you would do differently, holding up under five layers of why.", "rules": ["Eight deep stories, not sixteen thin ones: each two to three minutes, each able to carry two or three principles.", "I, not we: say what you did. 'We' is the most common way a good story scores low.", "A number in the result: latency, cost, users, time saved, errors removed. If there is no number, say what changed and how you knew.", "What you would do differently: every story, one line. It is how 'learn and be curious' shows.", "Never the same story twice in one loop: interviewers compare notes. The matrix below sorts every story by hub, so any question finds a story you have not spent yet.", "Situation in under 30 seconds: most of the time goes to your actions and the decisions inside them."], "capture": ["Each story starts as your own telling, in chat. That telling is kept word for word under View your transcript. The answer above it is the same story shaped to two minutes of STAR, using only your telling and your own work; what does not fit two minutes moves into the follow-ups.", "A follow-up with no answer is one only you can answer. Tell it in chat (`capture` and the story's id, for example `capture blog`) and it goes in, in your words."], "probe": {"lead": "Two or three principle questions per interviewer, about 25 minutes each with follow-ups. Your first telling is about two minutes; the rest is them digging. The Bar Raiser is a trained interviewer from another team who can ask about any principle and may stay on one story for 15 minutes or more.", "points": ["Situation first: why it mattered, what the goal was, what would have happened if nobody acted. Say the goal clearly, because the last question compares your result against it.", "Then your actions: what you did versus the team, your biggest contribution, the hardest obstacle, which decisions you challenged and how you got buy-in.", "Then the result: why those numbers, what other results mattered, what trade-off you accepted. Expect 'I'm concerned about the time it took' or 'the volume': answer with the number and the trade-off, not a defence.", "Layers of why: how did you know it was the cause, what else did you consider, what would have proved you wrong. Have the root cause, the component names and one number ready for every story.", "Another example: 'What other story shows this?' or 'something more recent?' tests a pattern, not a one-off. That is why every hub keeps two stories.", "Interruptions are normal: they cut in to ask how you knew something, or say you answered a softer question. Answer the sharper question; do not restart the story.", "The close: what you would do differently, would you make the same call again, how you would do it at Amazon. Name a changed mechanism (a check, a monitor, an earlier test), not 'communicate more'.", "What sinks a story: 'we' with no 'I', no number, blaming someone, a hypothetical instead of a real case, a hero story with no tension, a conflict that arrives late.", "When you do not know: say the limit plainly and offer a second story on the same principle. A short honest answer beats a padded one, once."]}, "hubs": [{"id": "cust", "name": "Customer", "lps": ["cust", "trust"], "asks": ["A time you used customer feedback to drive an improvement.", "A customer wanted one thing, but you felt they needed something else.", "You saw around the corner and gave customers something they did not know they needed.", "Balancing the needs of the customer against the needs of the business."]}, {"id": "own", "name": "Ownership", "lps": ["own", "scale"], "asks": ["You took on something significant outside your area of responsibility.", "A hard decision to sacrifice short-term gain for a longer-term goal.", "You saw you would miss a commitment: how you found the risk and told people.", "You protected users from a risk nobody had asked about."]}, {"id": "deep", "name": "Dive deep", "lps": ["deep", "right"], "asks": ["You went down several layers to understand a problem. What information proved most valuable?", "You linked two or more problems and found the underlying issue.", "It took asking why five times to reach the root cause.", "A decision where the data was not enough and you relied on judgment."]}, {"id": "simp", "name": "Simplify and frugality", "lps": ["invent", "frugal"], "asks": ["A complex problem you solved with a simple solution.", "A trade-off between quality and cost: how you weighed it.", "A creative solution that needed no extra resources.", "The usual approach was not going to work. What did you do instead?"]}, {"id": "std", "name": "High standards", "lps": ["std", "results"], "asks": ["You would not compromise on a great outcome when others felt it was good enough.", "You improved something that was already getting good feedback.", "You were unsatisfied with the status quo and changed it.", "A goal that took a long time to reach. How did you stay on it?"]}, {"id": "act", "name": "Speed and results", "lps": ["bias", "results", "big"], "asks": ["A calculated risk where speed was critical. How did you limit the risk?", "A tight deadline with no time to consider every option.", "Moving forward versus gathering more information: what you did.", "You saw a chance to do something much bigger than the first ask."]}, {"id": "back", "name": "Conflict", "lps": ["backbone", "trust", "hire", "employer"], "asks": ["You strongly disagreed with your manager on something important.", "You took an unpopular stance and were the outlier.", "You felt strongly but lost the argument. What did you do after?", "You needed the cooperation of a peer who was resistant."]}, {"id": "fail", "name": "Failure and learning", "lps": ["trust", "learn", "right"], "asks": ["A significant professional failure. What led to the wrong decision?", "An error in judgment in the last year or two, and its impact.", "You took on work outside your comfort area and found it rewarding.", "The coolest thing you learned on your own that made you better at your job."]}], "principles": [{"id": "cust", "name": "Customer Obsession", "top": true, "plain": "Start from what the customer needs and work backwards; earn and keep their trust, even when it costs you.", "probe": "A real customer, what they needed, what you changed because of it, and how you knew it worked.", "asks": ["Tell me about a time you went above and beyond for a customer.", "A time you put the customer's need ahead of what was convenient for the team.", "A difficult customer, and what you did."]}, {"id": "own", "name": "Ownership", "top": true, "plain": "Act for the long term, beyond your own task; never say 'that's not my job'.", "probe": "Something outside your remit you took on, why, and what it cost you.", "asks": ["A time you did something that wasn't your responsibility.", "A time you took on a problem nobody owned.", "A personal sacrifice to meet a deadline; did you tell your lead?"]}, {"id": "invent", "name": "Invent and Simplify", "plain": "Find simpler ways; take ideas from anywhere; accept being misunderstood for a while.", "probe": "The complex thing before, the simple thing after, and why simple was right.", "asks": ["A simple solution to a complex problem.", "A time you invented something new to solve a problem."]}, {"id": "right", "name": "Are Right, A Lot", "plain": "Good judgment: seek views that disagree with yours, and change your mind when the evidence says so.", "probe": "A call you made with others against it, how you tested it, and a time you were wrong.", "asks": ["A time you made a decision with incomplete information.", "A time you were wrong. What did you do?"]}, {"id": "learn", "name": "Learn and Be Curious", "top": true, "plain": "Keep learning; go after new things and what you do not understand yet.", "probe": "How you learned it fast, and what you do differently since.", "asks": ["A time you had to learn something quickly.", "Your biggest failure and what you learned."]}, {"id": "hire", "name": "Hire and Develop the Best", "plain": "Raise the bar of the people around you; coach and help others grow.", "probe": "Someone you helped get better, how, and what changed for them.", "asks": ["A time you helped a teammate grow.", "A time you gave someone hard feedback."]}, {"id": "std", "name": "Insist on the Highest Standards", "top": true, "plain": "Keep the bar high when it would be easier not to; fix problems so they stay fixed.", "probe": "Where you refused 'good enough', what it cost, and the evidence it was worth it.", "asks": ["A time you refused to compromise on quality despite a deadline.", "A time you cut corners under pressure.", "A time you pushed back on a solution others thought was good enough."]}, {"id": "big", "name": "Think Big", "plain": "Set a bold direction that inspires results; look around corners.", "probe": "A plan bigger than the ask, how you sold it, what it led to.", "asks": ["A time you proposed something more ambitious than asked.", "A long-term vision you pushed for."]}, {"id": "bias", "name": "Bias for Action", "top": true, "plain": "Speed matters; many decisions are reversible, so act on them without endless study, and take calculated risks.", "probe": "What you decided fast, with what information, and how you limited the risk.", "asks": ["A time you made a quick decision with little information.", "A time you acted before you had all the data.", "A decision under a tight deadline."]}, {"id": "frugal", "name": "Frugality", "plain": "More with less: constraints breed resourcefulness; no points for headcount or budget.", "probe": "What you did not spend, and what you got anyway.", "asks": ["A time you delivered with limited resources.", "A time you cut a cost."]}, {"id": "trust", "name": "Earn Trust", "plain": "Listen, speak candidly, admit your mistakes, treat others respectfully.", "probe": "A mistake you owned in front of people, and how trust came back.", "asks": ["A time you made a mistake. How did you handle it?", "A time you had to rebuild trust."]}, {"id": "deep", "name": "Dive Deep", "top": true, "plain": "Stay connected to the details; audit often; be skeptical when numbers and stories differ.", "probe": "The detail everyone missed, how you found it, and the data.", "asks": ["A time you dug into details to solve a problem others couldn't.", "A time the data told a different story than people believed."]}, {"id": "backbone", "name": "Have Backbone; Disagree and Commit", "top": true, "plain": "Challenge decisions you disagree with, respectfully, even when it is uncomfortable; once decided, commit fully.", "probe": "Who disagreed, what you said, what happened, and whether you committed when you lost.", "asks": ["A time you disagreed with your manager.", "A time you committed to a decision you disagreed with.", "An independent decision your manager questioned."]}, {"id": "results", "name": "Deliver Results", "top": true, "plain": "Focus on what matters and deliver it on time with quality; rise to setbacks.", "probe": "The goal, the obstacle, what you did, the result in numbers, and a time you missed.", "asks": ["A time you delivered under significant pressure.", "A time you missed a deadline.", "Your proudest project."]}, {"id": "employer", "name": "Strive to be Earth's Best Employer", "plain": "Make the work environment better, safer and more inclusive for the people around you.", "probe": "A specific thing you did for a teammate or the team's way of working.", "asks": ["A time you improved how your team works.", "A time you supported a teammate who was struggling."]}, {"id": "scale", "name": "Success and Scale Bring Broad Responsibility", "plain": "Think about the effects of your work beyond the obvious: on users, privacy, security, the wider world.", "probe": "A second-order effect you caught and acted on.", "asks": ["A time you considered the wider impact of a decision.", "A time you protected users from a risk nobody had asked about."]}]}, "card": {"title": "Loop day", "lead": "Read it the night before and in each break. Keep it out of your eyeline in the rounds.", "bar": [["Clarify", 5], ["Approach", 5], ["Code and dry-run", 25], ["Follow-ups", 10], ["Story", 15]], "rounds": [{"name": "Coding 1", "first": ["Restate the problem in one sentence.", "Ask: size, duplicates, empty, sorted, ties, what to return.", "Say the brute force and its cost, then the better idea. Get a nod."], "show": "Working code by minute 35, a dry run out loud, the cost said before they ask."}, {"name": "Coding 2", "first": ["Treat it as a fresh start: the last round is scored on its own.", "Clarify, then translate the Amazon story into the pattern in the first three minutes.", "Brute force first if the better idea is not there yet."], "show": "If you finish early, a harder second problem often follows. That is good news."}, {"name": "Design or GenAI", "firstLabel": "First minutes", "first": ["Design: ask who uses it and the two or three things they must do; write the requirements where they can see them.", "GenAI: the mechanism in a sentence, then what you built, the check you ran, the number.", "Either way, a LeetCode problem or LP questions may follow."], "show": "Design: for each extension say which class changes. GenAI: never open a tool; your own failures and checks beat definitions."}, {"name": "Behavioral", "firstLabel": "Every story", "first": ["Situation in under 30 seconds.", "I, not we: the decision inside each action.", "A number, then what you would do differently. Stop at three minutes."], "show": "Three or four stories, each dug into for five to ten minutes. If you do not remember a detail, say so."}], "between": ["Stand up, water, breathe. The last round is over.", "Cross off the stories you spent.", "Read the next round's column, nothing else."], "rules": ["No AI, no second screen, no notes in view.", "No silence: think out loud, even when stuck.", "Never invent a detail in a story."]}, "live": [], "liveLead": [], "takehomes": [], "watch": null, "timeline": null}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; o.rev = o.rev || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }
    var sm = el("summary", "", '<span class="qt">' + inl(title) + "</span>" + (meta ? '<span class="qm">' + meta + "</span>" : ""));
    d.appendChild(sm); d.appendChild(body);
    return d;
  }
  function bulk(host) {
    var b = el("div", "bulk");
    var o = el("button", "", "Open all"), c = el("button", "", "Close all");
    o.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = true; }); });
    c.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = false; }); });
    b.appendChild(o); b.appendChild(c);
    host.appendChild(b);
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });
    (s.study || []).forEach(function (_, i) { k.push(s.id + ":s" + i); });
    return k;
  }
  function isDone(t, s) { return !!t.done[s.id]; }
  function link(tab, anchor) { return "#/" + tab + (anchor ? "/" + anchor : ""); }
  /* A drill's reference is either a route already or an anchor on the prep tab. */
  function prepRef(r) { return r.indexOf("#/") === 0 ? r : link("prep", r.replace(/^#/, "")); }

  /* ---------------------------------------------------------------- tabs */
  var TABS = [
    { id: "overview", label: "Overview", show: function () { return true; } },

    { id: "learn", label: (LOOP.learn && LOOP.learn.label) || "Learn", show: function () { return !!(LOOP.learn && LOOP.learn.modules); } },
    { id: "prep", label: "Prep", show: function () { return LOOP.scripts.length || LOOP.drills.length || LOOP.qa.length || LOOP.ask.length || (LOOP.ask3 || []).length; } },
    { id: "rounds", label: "Rounds", show: function () { return (LOOP.rounds || []).length; } },
    { id: "research", label: "Research", show: function () { return !!LOOP.research; } },
    { id: "design", label: "Design", show: function () { return LOOP.tables.length || LOOP.figures.length; } },
    { id: "own", label: (LOOP.own && LOOP.own.tab) || "Yours", show: function () { return !!LOOP.own; } },
    { id: "sessions", label: "Sessions", show: function () { return LOOP.sessions.length; } },
    { id: "live", label: "Live build", show: function () { return (LOOP.live || []).length || (LOOP.takehomes || []).length; } },

    { id: "lld", label: "LLD", show: function () { return cdParts("lld").length; } },
    { id: "concurrency", label: "Concurrency", show: function () { return cdParts("concurrency").length; } },
    { id: "daily", label: "Daily two", show: function () { return !!(window.LOOP_DAILY && LOOP_DAILY.days.length); } },
    { id: "lp", label: "Leadership", show: function () { return !!LOOP.lp; } },
    { id: "card", label: "Loop day", show: function () { return !!LOOP.card; } }
  ].filter(function (t) { return t.show() && (!LOOP.tabs || LOOP.tabs.indexOf(t.id) >= 0); })
    .sort(function (a, b) { return LOOP.tabs ? LOOP.tabs.indexOf(a.id) - LOOP.tabs.indexOf(b.id) : 0; });
  var main = document.getElementById("main");
  var side = document.getElementById("side");
  var nav = [];            /* side links for the current tab: [anchor, label, sub] */

  function heading(host, id, kicker, title, sub) {

    if (title) { s.appendChild(el("h2", "", esc(title))); }
    if (kicker) { s.appendChild(el("p", "hsub", esc(kicker))); }

  }

  /* ---------------------------------------------------------------- overview
     The call, the company, the role from its posting, how to show up, how to prepare. */
  function tabOverview(host) {
    var s = el("section", "block"); s.id = "brief";
    s.appendChild(el("h1", "", esc(LOOP.title)));
    s.appendChild(el("p", "hsub", esc(LOOP.subtitle)));
    s.appendChild(el("p", "lead", esc(LOOP.format)));
    var P = LOOP.posting;
    var dl = el("dl", "facts");
    dl.innerHTML = "<dt>When</dt><dd>" + esc(LOOP.when) + "</dd><dt>Who</dt><dd>" + esc(LOOP.who) + "</dd>" +
      (P && P.url ? '<dt>Posting</dt><dd><a href="' + esc(P.url) + '" target="_blank" rel="noopener">' + esc(P.label || "The job description") + "</a></dd>" : "");
    s.appendChild(dl);
    host.appendChild(s);
    nav.push(["brief", "The call"]);
    onePage(host);

    if (LOOP.company && LOOP.company.length) {
      var c = heading(host, "company", "", "The company");
      LOOP.company.forEach(function (p) { c.appendChild(el("p", "lead", inl(p))); });
    }
    if (P) {
      var r = heading(host, "role", "", "The role");
      if (P.lead) { r.appendChild(el("p", "lead", inl(P.lead))); }

        var fd = el("dl", "facts wide");
        P.facts.forEach(function (f) { fd.appendChild(el("dt", "", esc(f[0]))); fd.appendChild(el("dd", "", inl(f[1]))); });
        r.appendChild(fd);
      }
      var cols = el("div", "role-cols");
      [["What you would do", P.does], ["What they look for", P.wants]].forEach(function (k) {

        box.appendChild(el("h3", "", esc(k[0])));

        cols.appendChild(box);
      });
      r.appendChild(cols);
      if (P.url) { r.appendChild(el("p", "lead", '<a href="' + esc(P.url) + '" target="_blank" rel="noopener">Read the full posting</a>' + (P.checked ? ", checked " + esc(P.checked) + "." : "."))); }
    }
    if (LOOP.showUp && LOOP.showUp.length) {
      var u = heading(host, "show-up", "", "How to show up");
      var ol = el("ol", "showup");
      LOOP.showUp.forEach(function (x) { ol.appendChild(el("li", "", "<b>" + inl(x[0]) + "</b> " + inl(x[1]))); });
      u.appendChild(ol);
    }
    var p = heading(host, "plan", "", "How to prepare");
    if (LOOP.bar) { p.appendChild(el("p", "bar", "<b>The bar.</b> " + inl(LOOP.bar))); }
    if (LOOP.extra) { p.appendChild(el("div", "lead", LOOP.extra)); }
    if (LOOP.sessions.length) {
      var t = tracker(), days = {}, order = [];
      LOOP.sessions.forEach(function (x) {
        if (!days[x.day]) { days[x.day] = []; order.push(x.day); }
        days[x.day].push(x);
      });
      var wrap = el("div", "days");
      order.forEach(function (d) {
        var box = el("div", "day");
        box.appendChild(el("h3", "", esc(d)));
        days[d].forEach(function (x) {
          var a = el("a", "srow" + (isDone(t, x) ? " done" : ""));
          a.href = TABS.some(function (tb) { return tb.id === "sessions"; }) ? link("sessions", x.id) : "../index.html#/w/" + x.id;
          if (!TABS.some(function (tb) { return tb.id === "sessions"; })) { a.target = "_blank"; a.rel = "noopener"; }
          a.innerHTML = '<span class="dot"></span><span><span class="nm">' + esc(x.name) +
            '</span><span class="bl">' + esc(x.blurb.replace(/^(Friday|Saturday|Sunday)[^.]*\.\s*/, "")) + '</span></span><span class="hrs">' + esc(x.len) + "</span>";
          box.appendChild(a);
        });
        wrap.appendChild(box);
      });
      p.appendChild(wrap);
    }
    var go = el("div", "acts");
    TABS.filter(function (x) { return x.id !== "overview"; }).forEach(function (x) {
      var a = el("a", "btn", esc(x.label)); a.href = link(x.id); go.appendChild(a);

    p.appendChild(go);
    /* the company in public: a dated timeline, the team, how the product fits, questions it raises */
    if (LOOP.timeline) {

      var ol = el("ol", "tl-list");
      (T.events || []).forEach(function (e) {

      if (T.team && T.team.length) {

        var tb = el("table", "tl-team");
        tb.innerHTML = "<thead><tr><th>Who</th><th>Role</th><th>What they have put out</th></tr></thead>";
        var body = el("tbody");
        T.team.forEach(function (m) {
          body.appendChild(el("tr", "", "<td>" + (m.url ? '<a href="' + esc(m.url) + '" target="_blank" rel="noopener">' + esc(m.name) + "</a>" : esc(m.name)) +
            "</td><td>" + esc(m.role) + "</td><td>" + inl(m.note || "") + "</td>"));

        tb.appendChild(body); ts.appendChild(tb);

    }
    /* extra viewing for the round, last on the page */
    if (LOOP.watch && window.Res) {
      [].concat(LOOP.watch).forEach(function (W, wi) {
        var w = heading(host, "watch" + (wi ? "-" + wi : ""), "", W.title);

  /* ---------------------------------------------------------------- prep: the question bank

  function scriptItem(x) {

    return banks;
  }
  function prepBody(x) {

    (x.parts || []).forEach(function (p) {

      if (p.lead) { left.appendChild(el("p", "cv-part-lead", inl(p.lead))); }

  /* ---------------------------------------------------------------- learn: one path, judged
     LOOP.learn = { lead, onepage, modules: [{ id, title, blurb, sessions, table?, topics: [{ id, title,
     brief, points, figs, production, read, mcq, open, say, avoid, was }] }] }. A private module
     (window.LOOP_PRIVATE[loop id].modules) is appended when present. Each topic opens to four
     steps: Learn, Check (multiple choice, with I don't know and a guess flag), Explain (an open
     question, then the model answer and a self-rating), Say (shut until Explain is tried).
     A topic's level (Know, Partly, Not yet) comes from its latest answers and the rating. */
  var LEARN_KEY = "loop.learn.v1";
  function learnStore() {
    try { var all = JSON.parse(localStorage.getItem(LEARN_KEY) || "{}"); return all[LOOP.id] || { mcq: {}, rate: {}, tried: {} }; }
    catch (err) { console.error("Could not read learning progress", err); return { mcq: {}, rate: {}, tried: {} }; }
  }
  function learnSave(st) {
    try { var all = JSON.parse(localStorage.getItem(LEARN_KEY) || "{}"); all[LOOP.id] = st; localStorage.setItem(LEARN_KEY, JSON.stringify(all)); }
    catch (err) { console.error("Could not save learning progress", err); }
  }
  function learnModules() {
    var mods = ((LOOP.learn && LOOP.learn.modules) || []).slice();
    var priv = window.LOOP_PRIVATE && window.LOOP_PRIVATE[LOOP.id];
    if (priv && priv.modules) { mods = mods.concat(priv.modules); }
    return mods;

  function allTopics() {

  var LEVELS = { know: "Know", partly: "Partly", notyet: "Not yet" };
  function levelOf(t, st) {
    st = st || learnStore();

    (t.mcq || []).forEach(function (q, i) {

      if (!r) { return; }
      any = true; n += 1;
      if (r.ok && !r.guess) { ok += 1; }

    var rate = st.rate[t.id];
    if (!any && !rate) { return null; }
    var all = (t.mcq || []).length;
    var s = n ? ok / n : null;
    if (rate === "notyet" || (s !== null && s < 0.5)) { return "notyet"; }
    if (rate === "know" && (s === null || (s === 1 && n === all))) { return "know"; }
    if (!rate && s === 1 && n === all) { return "know"; }
    return "partly";
  }

  /* Jump the reader to a node's top, just under the sticky bar; no animation. */

  /* ctx: { refresh, index, total, prev, next, open(topic, step), startStep } */
  /* A system design from the guide, shown whole inside a topic: the guide in embed mode (no top bar or design

  function designFrame(id) {

  /* The open topic, Accelerate's way: a bar (where you are, previous and next), then two panes.
     Left, the material: brief, points, figures, the design, production, code, resources.
     Right, your work: check yourself, the open question with your answer box, then what you would say,
     shut until you have tried. A topic with a system design takes the full width for the design. */
  function learnBody(t, ctx) {
    var wrap = el("div", "ln");
    var bar = el("div", "ln-bar"), side = el("div", "ln-nav");
    bar.appendChild(el("span", "ln-bar-t", ""));

    pv.disabled = !ctx.prev; nv.disabled = !ctx.next;

  /* One button by a session's title: copies the session's NotebookLM links (x.nlm, gathered at
     build time by site/nlm.js exactly as the tracker's button does), one per line, for
     NotebookLM's Website source. A session without them falls back to its own links. */
  function notebookButton(x) {
    var urls = x.nlm || [], seen = {};
    if (!x.nlm) (function walk(v) {
      if (typeof v === "string") {
        var u = v.replace(/#.*$/, ""), id = u.replace(/\/$/, "");
        if (/^https?:\/\//.test(u) && !/^https?:\/\/(localhost|127\.|\[::1\])/.test(u) && !seen[id]) { seen[id] = 1; urls.push(u); }
      } else if (v && typeof v === "object") {
        for (var k in v) { if (Object.prototype.hasOwnProperty.call(v, k)) { walk(v[k]); } }
      }
    })([x.steps, x.study || []]);
    if (!urls.length) { return null; }
    var label = "Copy " + urls.length + (urls.length === 1 ? " link" : " links") + " for NotebookLM";
    var cp = el("button", "btn nlm-copy", label);
    cp.title = "Paste into NotebookLM: Add source, Website";
    cp.addEventListener("click", function () {
      var text = urls.join("\n");
      function done() { cp.textContent = "Copied"; setTimeout(function () { cp.textContent = label; }, 1500); }
      function fallback() {
        var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); done(); } catch (e) { cp.textContent = "Copy failed"; }
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, fallback); } else { fallback(); }
    });
    return cp;
  }

    rail.appendChild(el("div", "cv-keys", "Up and down arrows move. Escape closes."));
    var pane = el("section", "cv-pane");
    var close = el("button", "cv-close", "Close");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", function () { convo.close(); });
    shell.appendChild(rail); shell.appendChild(pane);
    convo.appendChild(close); convo.appendChild(shell);
    function show(i) {
      cur = i;
      rows.forEach(function (b, j) { b.classList.toggle("on", j === i); if (j === i) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); } });
      rows[i].scrollIntoView({ block: "nearest" });
      pane.innerHTML = "";
      o.draw(i, pane, function () { rows[i].innerHTML = o.row(i); });
      [].forEach.call(pane.querySelectorAll(".cv-col"), function (c) { c.scrollTop = 0; });
    }
    convo.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = cur + (e.key === "ArrowDown" ? 1 : -1);
        if (n >= 0 && n < o.count) { show(n); rows[n].focus(); }
      }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    rows[cur].focus();
  }
  function panelCols(pane, leftTitle, rightTitle) {
    var cols = el("div", "cv-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "cv-col cv-say");
    left.appendChild(el("h3", "cv-h", leftTitle));
    right.appendChild(el("h3", "cv-h", rightTitle));
    cols.appendChild(left); cols.appendChild(right);
    pane.appendChild(cols);
    return { left: left, right: right, cols: cols };
  }

  /* A mock: what they asked and how it landed; what you said; what to say. */
  function openConvo(m, start) {
    var ex = m.exchanges;
    openPanel({
      title: m.title, sub: m.when, label: "Mock conversation", count: ex.length, start: start,
      row: function (i) {
        var x = ex[i];
        return '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) + "</span>";
      },
      draw: function (i, pane) {
        var x = ex[i], who = (x.who || "").toLowerCase();
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q spk-" + who, '<span class="ex-who">Turn ' + (i + 1) + " of " + ex.length + ", " + esc(x.who) + "</span>" + inl(x.q)));
        head.appendChild(el("p", "cv-verdict", '<span class="vd vd-' + esc(x.verdict) + '"></span><b>' + esc(VERDICT[x.verdict] || x.verdict) + ".</b> " + inl(x.why || "")));
        if (x.tests) { head.appendChild(el("p", "cv-tests", "<b>They were testing:</b> " + inl(x.tests))); }
        pane.appendChild(head);
        var c = panelCols(pane, "What you said", "What to say");
        panelSection(c.left, "In short", (x.said || []).map(function (p) { return el("p", "ex-said", inl(p)); }));
        panelSection(c.left, "What worked", panelList(x.good, "mk-good"));
        panelSection(c.left, "What did not", panelList(x.bad, "mk-bad"));
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.say && x.say.length) { c.right.appendChild(transcript(x.say, "You", "")); }
        panelSection(c.right, "How to approach it", panelList(x.approach));
        (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.right.appendChild(f); } });
        var links = [];
        if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
        if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
        if (links.length) { c.right.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      }
    });
  }

  /* A Prep question can be marked revised; the mark is kept in this page's storage. */
  function isRevised(id) { return !!own().rev[id]; }
  function setRevised(id, on) {
    var o = own();
    if (on) { o.rev[id] = stamp(); } else { delete o.rev[id]; }
    writeJSON(OWN, o);
  }
  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    if (tab === "overview" && p[0] && p[0] !== "overview" && LOOP.learn && p[1]) {
      var to = null;
      learnModules().forEach(function (m) { m.topics.forEach(function (t) { if ((t.was || []).indexOf(p[1]) >= 0 || t.id === p[1]) { to = t.id; } }); });
      if (to) { history.replaceState(null, "", link("learn", to)); return { tab: "learn", anchor: to }; }
    }
    return { tab: tab, anchor: p[1] || null, sub: p[2] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = (t.id !== current && lastHash(t.id)) || link(t.id);
      a.addEventListener("click", function () { restoreNext = true; });
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = []; document.body.removeAttribute("data-wide");
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "rounds") { tabRounds(main); }
      else if (r.tab === "research") { tabResearch(main); }
      else if (r.tab === "learn") { tabLearn(main, r.anchor); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "live") { tabLive(main); }
      else if (r.tab === "mocks") { if (cdParts("mocks").length) { tabCoding(main, r.anchor, "mocks"); } tabMocks(main); }
      else if (r.tab === "coding") { tabCoding(main, r.anchor); }
      else if (r.tab === "lld") { tabCoding(main, r.anchor, "lld"); }
      else if (r.tab === "concurrency") { tabCoding(main, r.anchor, "concurrency"); }
      else if (r.tab === "daily") { tabDaily(main, r.anchor, r.sub); }
      else if (r.tab === "lp") { tabLp(main, r.anchor); }
      else if (r.tab === "plan") { tabPlan(main, r.anchor); }
      else if (r.tab === "card") { tabCard(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    curTab = r.tab; document.body.setAttribute("data-tab", r.tab);
    var lh = cdState().lastHash || {}; lh[r.tab] = location.hash; cdSave("lastHash", lh);
    drawTabs(r.tab); drawSide(r.tab); drawToday(); progress();
    var key = /^(daily|plan|coding|lld)$/.test(r.tab) ? location.hash : r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    var back = restoreNext && POS[location.hash] != null; restoreNext = false;
    if (back) { var y = POS[location.hash]; requestAnimationFrame(function () { window.scrollTo({ top: y, behavior: "instant" }); }); }
    else if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var c = document.getElementById("count");
    if (!LOOP.when_iso) { c.textContent = "Date to be set"; return; }
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
</html>
