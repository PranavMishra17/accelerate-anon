dialog.ln-test { border: 0; border-radius: var(--radius-lg); padding: 0; max-width: min(720px, 94vw); width: 100%; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-float); }

.ln-test-box { padding: var(--s4) var(--s5); max-height: 86vh; overflow: auto; }

@media (max-width: 760px) { .pq-cols, .pq-cols.has-code, .role-cols { grid-template-columns: minmax(0, 1fr); } .pq-cols .cv-col { padding: var(--s3); } }

.banks { border-top: var(--hair); margin-top: var(--s1); }
.bank { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--s4); width: 100%; text-align: left; background: none; border: 0;
  border-bottom: var(--hair); padding: var(--s3) 0; color: var(--ink); }

/* the turn list: one row per turn, on the page and in the panel's rail */
main .turns { list-style: none; margin: var(--s4) 0 0; padding: 0; border-top: var(--hair); max-width: none; }

  background: none; border: 0; border-bottom: var(--hair); padding: var(--s2) var(--s1); color: var(--ink); }

/* dialogs float, so they alone carry a shadow */
dialog { width: min(640px, 94vw); border: 0; border-radius: var(--radius-lg); padding: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-float); }
dialog::backdrop { background: rgba(10, 10, 14, .55); }

/* the one-screen panel, shared by mocks and the Prep banks: the list on the left; the item's
   header; then understanding on the page and what to say on a sunken tint, each scrolling on its own */
dialog.convo { width: min(1320px, 96vw); height: min(880px, 92vh); max-width: none; max-height: none; overflow: hidden; }

.cv-title b { font-weight: var(--w-strong); }
.cv-title span { display: block; color: var(--muted); font-size: var(--fs-xs); margin-top: var(--s1); }
.cv-rail .turn { grid-template-columns: 20px 14px minmax(0, 1fr); border-radius: var(--radius); border-bottom: 0; margin-top: 1px; font-size: var(--fs-sm); line-height: var(--lh-tight); padding: 6px var(--s2); }

.cv-rail .turn.on .tl { font-weight: var(--w-strong); }
.cv-keys { margin-top: auto; padding: var(--s3) var(--s2) 0; font-size: var(--fs-xs); color: var(--muted); }

.cv-pane { display: flex; flex-direction: column; min-height: 0; }
.cv-head { padding: var(--s4) 96px var(--s3) var(--s5); border-bottom: var(--hair); flex: none; }
.cv-verdict { margin: var(--s2) 0 0 var(--s4); font-size: var(--fs-sm); color: var(--soft); }
.cv-verdict b { color: var(--ink); font-weight: var(--w-strong); }
.cv-tests { margin: var(--s1) 0 0 var(--s4); font-size: var(--fs-sm); color: var(--muted); }
.cv-tests b { color: var(--soft); font-weight: var(--w-strong); }
.cv-cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--s2); flex: 1; min-height: 0; padding: 0 var(--s4) var(--s4) 0; }
.cv-cols.has-code { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

.cv-col.cv-say { scrollbar-color: var(--muted) transparent; }
.cv-h { font-size: var(--fs-md); margin: 0 0 var(--s3); }

.vp-lab { font-size: var(--fs-sm); color: var(--muted); font-weight: var(--w-strong); }
.vp { font: inherit; font-size: var(--fs-sm); padding: 2px var(--s3); border: var(--hair); border-radius: var(--radius-sm); background: transparent; color: var(--soft); cursor: pointer; }

.meta .nlm-copy { margin-left: auto; }
.stepsheet .lab { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); margin: var(--s3) 0 var(--s1); }
.cv-col .lab, .sbody .lab { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); margin: var(--s4) 0 var(--s1); }
.cv-part { font-size: var(--fs-md); margin: var(--s5) 0 var(--s1); padding-top: var(--s3); border-top: var(--hair); }

  font-family: var(--mono); font-size: var(--fs-code); line-height: 1.6; color: var(--code-ink); white-space: pre; }

/* what to say: the one inverse sheet on the screen (dark on the light theme), so the words to
   say never read like the notes beside them. Its labels are the sheet's own ink, dimmed. */

/* figures are drawn for a light ground, so they sit on the light surface on every theme
   (the light tokens' values: surface, ink, muted, rule) */
figure { margin: var(--s5) 0 var(--s6); padding: var(--s4); background: #FFFDF8; color: #1D1B17; border: 1px solid #E5DDCD; border-radius: var(--radius-lg); overflow-x: auto; }

figure.trk { --faint: #a2a09a; --dim: #6b6a65; --line: #c3c0b7; --ink: #1a1a19; --live: #fffdf5; }
table { width: 100%; border-collapse: collapse; margin: var(--s1) 0; font-size: var(--fs-sm); }
th, td { text-align: left; padding: var(--s2) var(--s3) var(--s2) 0; border-bottom: var(--hair); vertical-align: top; }
th { font-weight: var(--w-strong); color: var(--muted); font-size: var(--fs-xs); }
td:first-child { font-weight: var(--w-strong); }
.tnote { font-size: var(--fs-sm); color: var(--muted); margin: var(--s2) 0 var(--s6); }

/* sessions */
.session .meta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); margin-top: calc(-1 * var(--s3)); }
.chip { color: var(--muted); }
.chip.done { color: var(--ok); }
.session .intro { color: var(--soft); margin: var(--s3) 0; }
.session > h3 { margin: var(--s6) 0 var(--s2); }
.step { border-top: var(--hair); }
.step > summary { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: var(--s3); align-items: start; padding: var(--s3) var(--s6) var(--s3) 0; }
.step > summary .st { font-weight: var(--w-strong); }
.step > summary:hover .st { color: var(--accent); }
.step > summary .sm { color: var(--muted); font-size: var(--fs-sm); padding-top: 2px; white-space: nowrap; }
.tick { width: 18px; height: 18px; border-radius: var(--radius-sm); border: 1.5px solid var(--muted); background: transparent; color: var(--surface);
  display: grid; place-items: center; font-size: var(--fs-xs); margin-top: 3px; padding: 0; }
.tick.on { background: var(--ok); border-color: var(--ok); }
.sbody { padding: 0 0 var(--s5) 30px; }
.step { scroll-margin-top: calc(var(--top) + var(--s2)); }
.sbody2 { margin: 0 0 var(--s5); grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); }
.sbody2 > .cv-said { padding: 0 var(--s4) 0 30px; }
.sbody2 > .cv-said > p.d { margin: 0 0 var(--s3); }
.pts { margin: 0 0 var(--s3); padding-left: var(--s5); }
.pts li { margin: 0 0 var(--s2); padding-left: var(--s1); }
.pts li b { font-weight: var(--w-strong); color: var(--ink); }
.pq-work { align-self: start; position: sticky; top: calc(var(--top) + var(--s3)); background: var(--surface); border: var(--hair); border-radius: var(--radius-lg); padding: var(--s4); }
.pq-work .mine { margin-top: 0; }
.pq-work details.say .transcript { margin-top: var(--s3); }
@media (max-width: 760px) { .sbody2 > .cv-said { padding: 0; } .pq-work { position: static; } }
.sbody > p.d, .sbody > p.point { margin: 0 0 var(--s1); }
.reading { margin: 0; padding: 0; list-style: none; }
.reading li { margin: 0 0 var(--s2); padding-left: var(--s3); position: relative; }
.reading li::before { content: ""; position: absolute; left: 0; top: .75em; width: 5px; height: 1.5px; background: var(--muted); }
.reading a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.reading a:hover { text-decoration-color: var(--ink); }
.reading .w { color: var(--muted); font-size: var(--fs-sm); margin-left: var(--s2); white-space: nowrap; }
.reading .why { display: block; color: var(--soft); font-size: var(--fs-sm); margin-top: 2px; }
.sbody figure { margin: var(--s4) 0 var(--s2); }
details.say { margin-top: var(--s4); }
details.say > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--accent); }

details.say[open] > summary::after { transform: rotate(-135deg); margin-top: 3px; }
details.say > summary:hover { text-decoration: underline; text-underline-offset: 3px; }
details.item > .sbody { padding-left: 0; }
@media (max-width: 700px) { .sbody { padding-left: 0; } }
.session-end { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-top: var(--s5); }

<script type="application/json" id="loop-data">{"id": "amazon", "title": "Amazon, Software Development Engineer", "subtitle": "The loop: four rounds, Monday 9 and Tuesday 10 November", "when": "Monday 9 and Tuesday 10 November 2026, on Zoom with LiveCode; exact times confirmed no later than two business days before", "when_iso": "2026-11-09", "who": "Four interviewers, one of them a Bar Raiser from outside the team (Amazon does not say which). Scheduling through Amazon Student Programs.", "format": "Four 60-minute rounds on Zoom, coding in Amazon LiveCode (the interviewer sees the editor live, no screen share), often with no way to run code. Not confirmed for your loop: two coding rounds are near certain; the other two are the Bar Raiser and one of an object-oriented design round, a GenAI round (leadership questions, GenAI concepts, then a LeetCode problem) or a hiring-manager round with GenAI questions. Leadership principle questions in every round. No AI tools.", "bar": "A medium solved to working, dry-run code in 25 to 30 minutes while talking, then two more layers of follow-up; GenAI answers drawn from what you built; a design you can extend without rewriting; and eight deep, true stories that survive five layers of why.", "sessions": [], "scripts": [{"id": "intro", "title": "Tell me about yourself", "length": "about 45 seconds", "when": "The start of most rounds; the Bar Raiser may skip it.", "probes": ["What do you own at alfred_?", "What are you proudest of?"], "say": ["I'm currently a founding LLM engineer at alfred_, where I work across AI agent reliability, memory architecture, evaluation infrastructure, and automation for a product with 5,000-plus active users. A big part of my work has been taking ambiguous problems and building the systems underneath them that make AI actually work reliably in production.", "Before that, I worked at an early-stage startup called WheelPrice and did AI research at UIC. What I enjoy most is working across the stack, understanding a real problem, and building something that solves it end to end, and that's a big part of why I'm excited about Amazon: building for customers at a scale where every decision shows up."], "swaps": [{"when": "In a coding round, keep it to two sentences", "line": "I'm a founding LLM engineer at alfred_, an AI assistant with 5,000-plus users; I own the agent's reliability, memory and evaluation. Before that, WheelPrice and research at UIC."}], "land": "Production systems end to end, and why Amazon: customers at scale.", "notes": ["The first paragraph and the first two sentences of the second are yours from INTRO.md, unchanged. The last clause is new for Amazon: make it yours."]}, {"id": "why-amazon", "title": "Why Amazon?", "length": "about 30 seconds", "when": "Possible in any round, often the hiring manager.", "probes": ["Why not stay at a startup?", "Which team would you want?"], "vname": "A", "say": ["Two reasons. I've spent the last year owning systems end to end at a startup, and what I want next is to do that at a scale where the engineering bar is the product: where a design gets reviewed hard, and a mistake reaches millions of people, so you learn to build it right.", "And the way Amazon works, writing things down, owning what you ship, working backwards from the customer, is already how I try to work. I'd like to learn it from people who do it best."], "variants": [{"name": "B, the customer", "land": "Customer obsession at a scale you cannot get anywhere else.", "say": ["Honestly, the customer part. At alfred_ I've seen how much one small change in reliability changes how people trust a product, with a few thousand users. Amazon is that lesson at a scale nobody else has.", "I want to be an engineer who's had to build for that, and I think the bar here would make me better faster than anywhere."]}, {"name": "C, last year", "land": "You came this far before; you want to finish it.", "say": ["I went through this process last year, and the interviews were the part I enjoyed most: the depth of the follow-ups, the way the questions were about what I actually did.", "Since then I've owned a production AI system end to end, and I'd like to bring that here."]}], "land": "Scale and a hard engineering bar, and a way of working you already share.", "notes": ["Written in your voice; INTRO.md has no Amazon line. Make it yours. Version C only if last year comes up naturally."]}, {"id": "ai-tools", "title": "How do you use AI tools in your development work?", "length": "about 60 seconds", "when": "Reported in some 2026 hiring-manager rounds. A conversation; never open a tool.", "probes": ["Where do they fail?", "How do you check what they write?", "Would you trust AI-written code in production?"], "say": ["Every day, but as a tool I check, not an author I trust. I use coding agents for the parts that are well specified: a migration, a test scaffold, a refactor I've already decided on. I read every diff, and nothing ships without tests or a real run against production-shaped data.", "Where they fail is the same place my own agent at work fails: they're confident about things they never checked. They'll say a function exists or a test passed when it didn't. So I ask for evidence, the command and its output, and I keep the design decisions myself.", "Building an AI product also taught me to measure it like a product: an eval set of real cases before a change ships, not a vibe check."], "land": "AI speeds up the well-specified parts; the design and the checking stay yours.", "notes": ["Your own practice; adjust to what you actually do. Never offer to use AI in the loop."]}, {"id": "last-year", "title": "You interviewed with us last year. What happened?", "length": "about 20 seconds", "when": "Possible if an interviewer sees your history.", "probes": ["What did you learn from it?"], "say": ["I did the loop last year and it went well, but the role was affected by headcount changes, so it didn't turn into an offer. Since then I've been a founding engineer on a production AI product, and I'm glad to be back."], "land": "Brief, factual, forward.", "notes": ["From the dossier: you cleared the technical bar and lost the offer to layoffs. Confirm the exact facts and wording before you use this."]}, {"id": "leave", "title": "Why leave alfred_?", "length": "about 30 seconds", "when": "If asked.", "probes": [], "say": ["I’m not looking to leave because there’s something fundamentally wrong with alfred_. The reason I'm exploring is more about the direction I want to take my career", "I've learned a lot at alfred_ and have had the opportunity to own important parts of a production AI product from the ground up. I've gradually moved beyond just building agent features and into building the systems around the agent — evaluations, observability, memory, reliability", "I'm still there and not looking to leave just for the sake of moving. I'm exploring roles where I can apply that experience to a broader range of problems, work directly with customers, and grow as an engineer who can own both the technical solution and its business outcome. Amazon seems particularly aligned with that."], "vname": "Yours", "variants": [{"name": "B, the bar", "land": "From a startup's speed to a large company's engineering bar.", "say": ["Nothing's wrong at alfred_. I've owned a lot of the system there, and moved fast. What I want next is the other half: building at a scale and with a review bar where the craft gets pushed, by people who've done it for years."]}], "land": "Not away from alfred_; toward scale and a harder bar.", "notes": ["Your words from INTRO.md; only the company name changed."]}, {"id": "logistics", "title": "Logistics they may ask", "length": "a line each", "when": "Usually the recruiter, not the loop. Your answers are in chat, not on this page.", "probes": ["Location?", "Start date?", "Work authorization?"], "say": [], "land": "One sentence each.", "notes": ["Location, start date, work authorization: your answers from chat."]}], "drills": [{"id": "intro", "prompt": "Tell me about yourself.", "target": "45 seconds", "seconds": 45, "ref": "#say-intro"}, {"id": "why-amazon", "prompt": "Why Amazon?", "target": "30 seconds", "seconds": 30, "ref": "#say-why-amazon"}, {"id": "ai-tools", "prompt": "How do you use AI tools in your development work?", "target": "60 seconds", "seconds": 60, "ref": "#say-ai-tools"}], "qa": [], "ask": [], "ask3": [{"id": "clarify", "title": "In the round: clarifying", "when": "At the start of every problem and design. Short, on the problem.", "why": "Clarifying is scored. It also stops you solving the wrong problem.", "how": ["Input size and range; duplicates; empty input; sorted or not; ties; what exactly to return.", "Design round: actors, core use cases, scale, concurrency, money, what is out of scope."], "items": [{"to": "Interviewer", "q": "Before I start, can I check the input: how large can it get, can values repeat, and what should I return if it's empty?", "loop": "Every coding problem.", "why": "Three facts that change the solution."}, {"to": "Interviewer", "q": "Who uses this system, and what are the two or three things they must be able to do? What can I leave out for now?", "loop": "The design round, first minute.", "why": "Eliciting requirements is the test when none are given."}]}, {"id": "collab", "title": "At the end of a round: about the work", "when": "When they ask for your questions. One.", "why": "Shows you want the job, not only the offer.", "how": ["Ask one, listen, and say in a sentence what you would bring."], "items": [{"to": "Any interviewer", "q": "What's a problem your team is working on right now that you find interesting?", "loop": "Coding rounds.", "why": "Engineers like talking about their work."}, {"to": "Hiring manager", "q": "What does a new engineer on your team own in the first six months?", "loop": "If the manager runs a round.", "why": "The real job."}, {"to": "Any interviewer", "q": "How do you decide when something is ready to ship on your team: what has to be true?", "loop": "The design round.", "why": "Insist on the Highest Standards, asked back."}]}, {"id": "contribute", "title": "Closing", "when": "The last minute of each round.", "why": "A clean exit; each round is scored on its own.", "how": ["Thank them, one line on what you enjoyed, then let them close. Then reset before the next round: water, stand up, breathe."], "items": [{"to": "Any interviewer", "q": "Thanks, I enjoyed working through that with you.", "loop": "Every round.", "why": "Nothing more is needed."}]}], "traps": [], "tables": [], "admire": "", "kitaruLead": "", "figures": [], "mockHow": "", "mocks": [], "planKicker": "The next two weeks", "mechTitle": "", "designLink": null, "extra": "<b>Start with the Plan tab: it says what to do today.<\/b> Every day has the daily two (35 minutes), a problem reported from a 2026 loop, a module of the GenAI tab, and a story or a design. Two to three hours a day until 31 October, four or more from 1 November.", "emphasis": [], "own": null, "showUp": [["Think out loud from the first second.", "Silence is the most reported way to fail a coding round. Say the brute force, get a nod, then improve. A 2026 candidate froze for five minutes, coded the brute force, found the better answer late, and still got the offer."], ["Clarify first, and say you are doing it.", "Input size, duplicates, empty input, sorted or not, what to return. In the design round, the requirements are often not given on purpose: asking for them is part of the score."], ["Dry-run before you say done.", "There may be no way to run code. Walk a small example through your code out loud, then state time and space without being asked."], ["Expect three layers.", "After the solve: make it faster, change a constraint (a stream, duplicates, out-of-order times), then justify. That is where rounds are won."], ["Spend each story once.", "Interviewers compare notes. Keep the matrix on the Loop day card and cross off what you used."], ["GenAI questions: answer from what you built.", "If a round turns to GenAI, it is talk, not code: hallucinations, RAG, how you check AI output, how you use the tools. Give the mechanism, then what you did and the number. The coding in that round is still LeetCode."], ["No AI, anywhere.", "Amazon's rule for the live rounds. If an interviewer asks how you use AI tools at work, answer it as a conversation; never open one."]], "prepLead": "Your intro, why Amazon, the AI-tools answer, last year, and the questions to ask. The GenAI round has its own tab; the stories are on Leadership.", "storyBlurb": "Your intro, why Amazon, the AI-tools question, last year, and logistics.", "sources": [{"label": "Amazon: how we hire", "url": "https://www.amazon.jobs/content/en/how-we-hire", "why": "The official shape: four to six interviews of 45 to 60 minutes, the Bar Raiser, the leadership principles, STAR."}, {"label": "Amazon: leadership principles", "url": "https://www.amazon.jobs/content/en/our-workplace/leadership-principles", "why": "The sixteen, in Amazon's words."}, {"label": "Amazon: SDE 2026 (US) posting", "url": "https://www.amazon.jobs/en/jobs/3177934/software-development-engineer-2026-us", "why": "The role asks you to use and build GenAI tools for developer productivity: why GenAI questions appear at all."}, {"label": "Amazon: software development interview topics", "url": "https://www.amazon.jobs/content/en/how-we-hire/interview-prep/software-development-topics", "why": "Object-oriented design is on Amazon's own topic list; generative AI is not named there."}, {"label": "A 2026 university-hire loop with a GenAI round", "url": "https://medium.com/@kamaan551/amazon-sde-1-interview-experience-2026-all-4-rounds-the-new-genai-round-and-a-1-month-wait-208de067d1d4", "why": "Final round May 2026: rotting oranges; Course Schedule II and domino tiling; a hybrid round of Ownership and Dive Deep stories, GenAI concepts and Next Permutation; a Bar Raiser with a Celebrity variant. No design round."}, {"label": "An AUTA SDE I loop, April 2026", "url": "https://leetcode.com/discuss/post/8430457/amazon-sde-1auta-interview-experience-20-eqxs/", "why": "Coding with a heap; a streaming logger design (Chain of Responsibility); a hiring-manager round of GenAI questions then Merge and Insert Interval; a Bar Raiser of seven or eight LP questions."}, {"label": "A 2026 SDE I loop with a GenAI fluency round", "url": "https://leetcode.com/discuss/post/7623949/amazon-sde-1-application-interview-exper-92xt/", "why": "The round labelled GenAI was a LeetCode problem: all nodes at distance K, in O(n). Offer."}, {"label": "A 2026 SDE I loop with a file-system design", "url": "https://medium.com/@shivam.edu4348/amazon-sde-1-interview-experience-182cf3f46460", "why": "October 2026: design a file management system with no requirements given; a hiring-manager round on how he used GenAI."}, {"label": "A 2026 SDE I offer with a cart design", "url": "https://medium.com/@guptasameer533/how-i-cracked-amazon-sde-1-off-campus-in-2026-my-interview-experience-75c3dd67e844", "why": "August 2026: a shopping cart with percentage, flat and no discount, scored on SOLID and code quality. No GenAI questions."}, {"label": "Hello Interview: Amazon L4 (SDE I) guide", "url": "https://www.hellointerview.com/guides/amazon/l4", "why": "For L4 the design interview covers object-oriented design instead of large-scale systems."}, {"label": "TechPrep: Amazon interview process", "url": "https://www.techprep.app/blog/amazon-interview-process", "why": "System design is aimed at SDE II and above; at SDE I the design round tends to be object-oriented."}, {"label": "ITPro: Amazon's AI rule for interviews", "url": "https://www.itpro.com/business/careers-and-training/amazon-bans-ai-tools-during-job-interviews", "why": "Press report of Amazon's guidance: no GenAI tools in interviews unless explicitly permitted."}, {"label": "Lodely: Amazon interview questions", "url": "https://www.lodely.com/companies-interview-questions/amazon", "why": "181 tracked questions: about 78% medium; trees, graphs and heaps lead."}, {"label": "Stackademic: a 2025 new-grad loop", "url": "https://stackademic.com/blog/my-amazon-software-development-engineer-new-grad-interview-experience", "why": "Strong technical rounds, rejected on story depth: the post-mortem behind 'treat LP as half'."}], "company": ["Your loop is four rounds of 60 minutes, and Amazon has not said what each one is. Two coding rounds and a Bar Raiser are near certain. The fourth varies across the 2026 reports: an object-oriented (low-level) design round in some, a GenAI round in the closest match to your pipeline (leadership questions, then GenAI concepts, then a LeetCode problem), a hiring-manager round with GenAI questions in others. No 2026 SDE I report had a full high-level system design round. So the plan is DSA first, then GenAI answers, then design, with stories in every round. One line to your recruiter can settle the fourth slot.", "Leadership principles are about half the decision. Each interviewer is assigned two or three principles; coding rounds spend 10 to 15 minutes on them, the behavioral round all of it, with each story probed for five to ten minutes. One interviewer is a Bar Raiser from outside the team, who can run any round and whose view carries the most weight in the debrief.", "Coding: about 78% of tracked Amazon questions are medium, often dressed as an Amazon scenario (product categories as a tree, delivery routes as a graph). Trees, graphs and heaps lead, then hash-map designs (LRU, time-based store), stacks, greedy, and dynamic programming when it lands. A fast, clean medium often earns a harder second problem.", "No AI tools in any live round: Amazon's guidance forbids them unless explicitly permitted, and a former Bar Raiser told GeekWire that using one gets you no-hired. The only AI-assisted task was in the online assessment, which is behind you. GenAI questions are another matter: most 2026 SDE I reports had them, as a round or 15 to 20 minutes of one. They are talk, not code: hallucinations, RAG, how you check AI output, how you use the tools, a time a tool got it wrong. Prep has the GenAI round question by question."], "posting": {"url": "https://www.amazon.jobs/content/en/how-we-hire", "label": "Amazon: how we hire", "lead": "Software Development Engineer, new grad, through Amazon Student Programs: the L4 (SDE I) loop.", "facts": [["Rounds", "4 x 60 minutes over 9 and 10 November, Zoom and LiveCode"], ["Coding", "2 rounds, medium with harder follow-ups"], ["The fourth round", "Not confirmed: object-oriented design, GenAI, or the hiring manager with GenAI questions"], ["Behavioral", "The Bar Raiser, plus LP in every round"], ["GenAI", "Concepts and your own use of the tools, talked through"], ["AI tools", "Not allowed"]], "does": ["Solve medium problems in a shared editor, talking, and dry-run them without running code.", "Explain how LLMs fail and how you build and check systems around them, from your own work.", "If there is a design round: design classes for a concrete system (parking lot, file system, cart) and extend them.", "Tell true stories with your own actions and numbers, and hold up under follow-ups."], "wants": ["Clean, working code and stated complexity.", "Requirements asked for, not assumed.", "Ownership, customer obsession, diving deep, backbone: in stories, not adjectives."]}, "rounds": [{"title": "2026 loop: four rounds", "when": "Monday 9 and Tuesday 10 November 2026 (scheduled 22 October; times to come)", "who": "Four interviewers, one a Bar Raiser", "format": "Coding, coding, the Bar Raiser, and one of: object-oriented design, a GenAI round, or the hiring manager with GenAI questions (not confirmed). LP in every round.", "outcome": "Not yet held.", "notes": ["From the invitation: GenAI tools not allowed unless explicitly permitted.", "From the scheduling email (22 Oct): you may be asked about your experience with GenAI tools. Prepare a few examples: the situation, what went well, what you would do differently, and how it changed your outcome or speed.", "Zoom on the device you will use (camera, headphones); a waiting room of up to 10 minutes. LiveCode: open the link from the email, wait for the interviewer to open the session, refresh; turn the ad blocker off.", "Research, 29 Oct: across about fifteen 2026 SDE I reports, every loop had coding and a Bar Raiser; GenAI questions appeared in most (a full round in the closest match to your pipeline, 15 to 20 minutes of a hiring-manager round in others) and their coding was always LeetCode; a design round appeared in some, always object-oriented (file system, cart with discounts, a logger). Ask the recruiter which the fourth slot is."], "asked": []}, {"title": "2025 loop: three rounds", "when": "2025", "who": "Three interviewers; by your account the first was a Bar Raiser", "format": "Three one-hour rounds on Chime and LiveCode: one half behavioral, half coding or design; one pure leadership deep-dive; one object-oriented design.", "outcome": "Cleared the technical bar; the offer was lost to layoffs, per the dossier. Confirm the wording you want to use.", "notes": ["Your behavioral prep from last year (Amazon Behavioral Interview Preparation, PDF, August 2025) had eight story groups; they are candidates in the story bank, to be retold in your words."], "asked": []}], "research": null, "learn": {"label": "GenAI", "lead": "<b>Your strongest round, brushed up in order.<\/b> Seven modules from how an LLM works to production, then your two tool-use stories. Each topic: learn it (with what you built on it and where it lives elsewhere in Accelerate), check yourself, explain the interview question aloud, then compare with what you would say. The plan gives you one module a day. The squares show where you stand.", "modules": [{"id": "llm", "title": "1. How LLMs work", "blurb": "Tokens, attention, training stages, sampling and why models hallucinate: the mechanism behind every later topic.", "topics": [{"id": "l-tokens", "title": "Tokens and tokenization", "brief": "The model never sees characters: it sees integer ids of subword pieces, and what you pay for or are limited by is counted in them.", "points": ["Token: a piece of text from a fixed vocabulary of roughly 100,000 to 200,000 pieces, often a word, part of a word or a few bytes. In English a token is about four characters, or three quarters of a word. Other languages and code usually cost more tokens for the same meaning.", "BPE (byte-pair encoding): start from single bytes, count adjacent pairs across a huge corpus, merge the most frequent pair into a new symbol, and repeat until the vocabulary is full. Encoding replays those merges in order. Common words become one token; rare words split into pieces.", "Why bytes: byte-level BPE can encode any string, so there is never an unknown token. An emoji or a typo only becomes more, smaller pieces.", "Odd behaviour starts here: the model sees pieces, not letters, so counting the letters in a word, reversing a string or exact arithmetic on long numbers is unreliable. A leading space or a capital letter changes the token ids, so the same word can be different tokens.", "Why engineers care: price, latency and the context limit are all counted in tokens, and every model family has its own tokenizer. Count with the provider's tokenizer or token-count endpoint, never by words.", "Vocabulary size is a trade-off: a bigger vocabulary gives fewer tokens for the same text (cheaper, more fits in the window) but a larger embedding and output layer, and rare tokens that are seen too seldom to be learned well."], "figs": ["bpeMerge"], "production": ["Per Meta's Llama 3 announcement, the model moved to a tokenizer with a 128K-token vocabulary because it encodes language more efficiently, so the same text takes fewer tokens.", "OpenAI publishes tiktoken, a fast open-source BPE tokenizer for its models (see the project's GitHub README), so developers can count tokens before they send a request."], "mine": [], "res": [{"kind": "video", "req": true, "label": "Byte Pair Encoding Tokenization", "url": "https://www.youtube.com/watch?v=HEikzVL-lZU", "yt": {"id": "HEikzVL-lZU", "ch": "Hugging Face"}, "m": 5, "why": "The merge loop in five minutes: start here."}, {"kind": "video", "req": false, "label": "Let's build the GPT Tokenizer", "url": "https://www.youtube.com/watch?v=zduSFxRajkE", "yt": {"id": "zduSFxRajkE", "ch": "Andrej Karpathy"}, "m": 134, "why": "Optional and long: skim the parts on why tokenization causes spelling and arithmetic failures."}, {"kind": "article", "label": "Byte-Pair Encoding tokenization (Hugging Face LLM course)", "url": "https://huggingface.co/learn/llm-course/chapter6/5", "m": 15, "why": "How BPE is trained and applied, with a worked example."}, {"kind": "article", "label": "Karpathy's minbpe lecture notes: LLM tokenization", "url": "https://cdn.jsdelivr.net/gh/karpathy/minbpe@master/lecture.md", "m": 20, "why": "The written version of the lecture, including why tokens explain many model quirks."}], "mcq": [{"q": "A user pastes a 3,000-word English document and a 3,000-word Hindi document. Both count against a limit measured in tokens. What is the likely difference?", "o": ["The Hindi one is refused above 1,000 words", "Both use 3,000 tokens, because tokens are counted per word", "The Hindi one likely takes more tokens, because the merges were learned mostly from English text, so its words split into more pieces", "The English one takes more tokens, because English words are longer", "Both use the same number of tokens, because tokens are counted in bytes"], "a": 2, "why": "A tokenizer's merges follow the frequencies in its training text. Text that is rare there splits into more, smaller pieces, so it costs more tokens for the same meaning."}, {"q": "Why is a model often unreliable at counting the letter r in 'strawberry'?", "o": ["It reads subword tokens, not letters, so the individual letters are not directly visible to it", "Its attention only covers the first ten characters", "Softmax rounds small counts to zero", "Temperature is too high by default", "It has never seen the word strawberry"], "a": 0, "why": "The word arrives as one or a few token ids. Letter-level facts have to be inferred from what the model learned about those ids, which is why code should do character-level work."}, {"q": "A team doubles the tokenizer vocabulary and retrains. What is the most direct effect on the same English text?", "o": ["Output becomes more accurate", "Attention cost grows four times", "Nothing changes, since the vocabulary is only a lookup table", "Fewer tokens for the same text, but a larger embedding table and output layer", "More tokens, because rare words split further"], "a": 3, "why": "More merges mean longer pieces, so the same text needs fewer tokens. The price is more parameters in the embedding and output layers and sparser training signal for rare tokens."}, {"q": "Byte-level BPE never produces an unknown token. Why?", "o": ["It stores every possible word", "Any string is a sequence of bytes, and all 256 byte values are in the base vocabulary", "It skips characters it does not recognise", "It replaces rare characters with spaces", "It translates unusual text into English first"], "a": 1, "why": "Merges only combine symbols that already exist, and the base symbols are the 256 bytes, so any input can always be encoded, if only as many small pieces."}], "open": {"q": "What is a token, and why should an engineer care about tokens?", "probe": "That you tie tokens to cost, limits and odd model behaviour, not only to a definition.", "a": ["A token is a piece of text from a fixed vocabulary, between a character and a word; about three quarters of a word in English.", "Built by byte-pair encoding: merge the most frequent adjacent pair, repeat.", "Cost, latency and the context limit are all counted in tokens, and each provider has its own tokenizer.", "Other languages and code cost more tokens for the same meaning.", "Model quirks follow: it sees pieces, not letters, so counting letters or exact long arithmetic goes to code."]}, "say": ["A token is the unit the model actually reads and writes. It isn't a word or a letter, it's a piece of text from a fixed vocabulary, somewhere between a character and a whole word. In English it works out to roughly three quarters of a word. The vocabulary is built with byte-pair encoding: start from bytes, keep merging the most frequent pair, and common words end up as one token while rare ones split into pieces.", "I care about it for three reasons. Cost, latency and the context limit are all counted in tokens, and every provider has its own tokenizer, so I count with theirs, not by words. Other languages and code usually cost more tokens for the same meaning. And it explains odd behaviour: the model sees pieces, not letters, so counting letters in a word or doing exact arithmetic on long numbers is unreliable. I don't ask the model to do that, I use code."], "avoid": ["Saying a token is a word, or that tokens are the same across providers.", "Stopping at the definition without tying it to cost, limits and model quirks."], "links": [{"url": "../BASELINE.html#/nlp/tokenization", "label": "Baseline: Tokenization: BPE, WordPiece, SentencePiece", "why": "The plain-language map of how text becomes pieces."}, {"url": "../CODING.html#bpe", "label": "Coding page: A tokenizer: byte-pair encoding", "why": "Look at the merge diagram and the remember list; no need to read the code."}, {"url": "../index.html#/w/wc27", "label": "Tracker: LLM fundamentals and the Transformer, lightly", "why": "The session where tokens, attention and training are taught together."}]}, {"id": "l-transformer", "title": "The transformer and attention", "brief": "A transformer turns token ids into vectors and lets every token look back at the others, weighting what it finds, layer after layer; that lookback is attention, and it is where the quadratic cost comes from.", "points": ["Embed, then stack blocks: token ids become vectors, position information is added, then N identical blocks follow. Each block is attention, then a feed-forward network, with residual connections and layer norm around both. The last layer scores every vocabulary token as the next one.", "Attention: every token makes a query Q, a key K and a value V. The output is softmax(QK^T / sqrt(d_k)) V. The query is scored against every key, softmax turns the scores into weights, and the result is the weighted mix of the values. Q asks, K advertises, V is what gets passed on.", "Why divide by sqrt(d_k): a dot product sums d_k terms, so its variance grows with d_k. Large scores push softmax towards one-hot, where the gradient is almost zero and training stalls. Dividing keeps the scores near unit variance.", "Why it is quadratic: QK^T holds a score for every pair of tokens, an n by n matrix for n tokens, so score compute and memory grow as n^2. Double the context and attention costs four times. FlashAttention gives the same exact result by working in tiles on fast on-chip memory, so it cuts memory traffic, not the n^2 arithmetic.", "Decoder-only and causal: GPT-style models mask future positions, so token i attends only to tokens up to i. That lets one training sequence teach n next-token predictions at once, and at inference lets the model keep old keys and values (the KV cache) instead of recomputing the past.", "Many heads, many layers: several attention patterns run in parallel in smaller subspaces, so one head can track syntax and another a long-range reference. The feed-forward layers hold most of the parameters and are where much of the factual recall is thought to sit."], "figs": ["transformerBlock", "qkvAttention"], "production": ["Per Meta's Llama 3 announcement, both the 8B and 70B models use grouped query attention, a variant that shares key and value heads across query heads so the KV cache is smaller at inference.", "The FlashAttention paper (Dao et al., 2022) describes an exact attention algorithm that tiles the computation to cut reads and writes to GPU memory; it is a standard attention kernel in common training and serving stacks."], "mine": [], "res": [{"kind": "video", "req": true, "label": "Transformers, the tech behind LLMs | Deep Learning Chapter 5", "url": "https://www.youtube.com/watch?v=wjZofJX0v4M", "yt": {"id": "wjZofJX0v4M", "ch": "3Blue1Brown"}, "m": 27, "why": "The whole pipeline from tokens to next-token probabilities, drawn."}, {"kind": "video", "req": false, "label": "Attention in transformers, step-by-step | Deep Learning Chapter 6", "url": "https://www.youtube.com/watch?v=eMlx5fFNoYc", "yt": {"id": "eMlx5fFNoYc", "ch": "3Blue1Brown"}, "m": 26, "why": "Queries, keys, values and the n by n score matrix, step by step."}, {"kind": "article", "label": "The Illustrated Transformer", "url": "https://jalammar.github.io/illustrated-transformer/", "m": 25, "why": "The standard picture book of the architecture."}, {"kind": "article", "label": "Attention? Attention!", "url": "https://lilianweng.github.io/posts/2018-06-24-attention/", "m": 30, "why": "A tour of attention variants; read for the scaled dot-product and multi-head sections."}], "mcq": [{"q": "A model's context goes from 8K to 32K tokens. By roughly how much does the attention score computation grow per layer?", "o": ["4 times", "16 times", "2 times", "Not at all, because of the KV cache", "64 times"], "a": 1, "why": "The context is 4 times longer and every token is scored against every other, so the n by n score matrix has 16 times as many entries."}, {"q": "Why are the attention scores divided by sqrt(d_k)?", "o": ["To make the weights add up to one", "To make attention run faster", "To mask future tokens", "To normalise the value vectors", "So scores do not grow with d_k and saturate the softmax, which would leave almost no gradient"], "a": 4, "why": "A dot product over d_k dimensions has variance proportional to d_k. Without the scaling, softmax would collapse to near one-hot and training would stall."}, {"q": "What does the causal mask do, and what does it make possible?", "o": ["It blocks attention to later positions, so one sequence trains n next-token predictions at once and old keys and values can be cached", "It removes padding tokens", "It forces each head to look at a different token", "It stops attention from looking at the first token", "It lets the model read the whole sentence in both directions"], "a": 0, "why": "Because position i never sees later tokens, its keys and values do not change when new tokens arrive, which is exactly what the KV cache stores."}, {"q": "FlashAttention is faster than a naive implementation. What does it change?", "o": ["It approximates attention by dropping low-score pairs", "It cuts the arithmetic from n^2 to n log n", "It uses fewer heads", "It computes the same result in tiles on fast on-chip memory and never writes the full n by n matrix to slow memory", "It caches values between requests"], "a": 3, "why": "Attention on a GPU is usually limited by memory traffic. Tiling keeps the work in fast memory. The result is exact and the arithmetic is still quadratic."}], "open": {"q": "Explain how attention works and why it scales quadratically with sequence length.", "probe": "The mechanism in your own words, then the cost and what is done about it.", "a": ["Each token makes a query, key and value; scores are query-key dot products, scaled by sqrt(d_k), softmaxed into weights over the values.", "The scaling stops large dot products from saturating softmax and killing the gradient.", "Every token is scored against every other, so n tokens make an n by n matrix: double the context, four times the work.", "FlashAttention keeps the maths exact but tiles it so the matrix never goes to slow memory; the KV cache stops past keys and values being recomputed.", "So long prompts are slow and costly, and you keep context tight."]}, "say": ["Attention is how each token looks back at the others. Every token produces a query, a key and a value. The query is scored against every key with a dot product, divided by the square root of the key dimension, run through a softmax to get weights, and the output is the weighted sum of the values. So the model decides, per token, which earlier tokens matter. The scaling matters: without it the dot products grow with the dimension, softmax saturates and the gradients vanish.", "It's quadratic because every token is compared with every other one, so for n tokens you build an n by n score matrix. Double the context and the attention work goes up four times. FlashAttention computes the same exact result in tiles so that matrix never goes out to slow memory, which fixes the memory traffic but not the n squared arithmetic. In practice that's why long prompts are slow and expensive, and why I keep prompts tight instead of stuffing everything in."], "avoid": ["Saying attention is linear because of the KV cache: the cache saves recomputation, the score work per new token still grows with length.", "Reciting the formula without saying what the scaling is for."], "links": [{"url": "../BASELINE.html#/ml/transformers", "label": "Baseline: Transformers and attention", "why": "Every token takes a weighted mix of the others, in plain words."}, {"url": "../BASELINE.html#/nlp/attention", "label": "Baseline: Attention, the details interviews probe", "why": "The reasons behind scaling, heads, positions and norms."}, {"url": "../CODING.html#transformer", "label": "Coding page: Attention and a transformer block", "why": "Look at the block diagram and the remember list; skip the code."}, {"url": "../index.html#/s/w4c", "label": "Tracker: Embeddings and attention, at mechanism level", "why": "The session that teaches this at mechanism level."}]}, {"id": "l-lifecycle", "title": "From predictor to assistant", "brief": "A base model only continues text; instruction tuning, then preference tuning with RLHF or DPO (and, for reasoning models, reinforcement learning on checkable tasks) turn it into something that follows instructions and behaves.", "points": ["Pretraining: predict the next token over trillions of tokens of text and code. This is where knowledge and language ability come from, and almost all the compute goes. The result, the base model, continues text; it does not follow instructions.", "Supervised fine-tuning (instruction tuning): train on thousands to hundreds of thousands of curated prompt and ideal-response pairs. It teaches the assistant role and the format, not new facts. Same loss as pretraining, far less data.", "RLHF: people rank pairs of answers, a reward model learns those rankings, and the model is optimised against it, classically with PPO plus a KL penalty that keeps it close to the tuned model. It teaches what people prefer. The risk is pleasing the reward model: confident tone, flattery, agreeing with the user.", "DPO: skip the reward model and the RL loop. Train directly on (chosen, rejected) pairs with a classification-style loss that raises the likelihood of the chosen answer relative to a frozen reference model. Simpler and more stable, which is why it is common in open models.", "Reasoning models add reinforcement learning against checkable rewards, such as a correct maths answer or passing tests, so the model learns to produce longer chains of thought. Checkable rewards are harder to game than a learned reward model, but they only cover tasks you can check.", "None of the stages installs a truth check. Preference tuning can even make a model more willing to guess. That is why you fine-tune for behaviour and retrieve for facts, and why hallucination is fixed in the system around the model."], "figs": ["llmLifecycle"], "production": ["OpenAI's InstructGPT paper (2022) reported that labellers preferred outputs from a 1.3B-parameter model trained with RLHF over the 175B-parameter GPT-3, the usual evidence that alignment tuning matters as much as size for usefulness.", "Per Meta's Llama 3 announcement, its post-training combined supervised fine-tuning, rejection sampling, PPO and DPO."], "mine": [], "res": [{"kind": "video", "req": true, "label": "Large Language Models explained briefly", "url": "https://www.youtube.com/watch?v=LPZh9BOjkQs", "yt": {"id": "LPZh9BOjkQs", "ch": "3Blue1Brown"}, "m": 8, "why": "Pretraining, then human feedback, in eight minutes."}, {"kind": "video", "req": false, "label": "Reinforcement Learning from Human Feedback (RLHF) Explained", "url": "https://www.youtube.com/watch?v=T_X4XFwKX8k", "yt": {"id": "T_X4XFwKX8k", "ch": "IBM Technology"}, "m": 12, "why": "The reward model and the RL step, explained plainly."}, {"kind": "article", "label": "Illustrating Reinforcement Learning from Human Feedback (RLHF)", "url": "https://huggingface.co/blog/rlhf", "m": 20, "why": "The three stages with diagrams."}, {"kind": "article", "label": "Direct Preference Optimization: Your Language Model is Secretly a Reward Model", "url": "https://arxiv.org/abs/2305.18290", "m": 15, "why": "Read the abstract and introduction for why DPO removes the reward model."}], "mcq": [{"q": "A base model is asked 'What is the capital of France?' and replies with three more quiz questions. Which stage is missing?", "o": ["More pretraining on bigger data", "A higher temperature", "Instruction tuning on prompt and response pairs", "A larger context window", "A retrieval step"], "a": 2, "why": "The base model continues text in the style it saw. Instruction tuning teaches it that a question is a request to answer."}, {"q": "In RLHF, what is the KL penalty for?", "o": ["It keeps the tuned model close to the reference model, so it does not drift into outputs that merely fool the reward model", "It makes responses shorter", "It reduces the cost of training the reward model", "It forces refusals on unsafe requests", "It balances the classes in the preference data"], "a": 0, "why": "Optimising hard against a learned reward finds its blind spots. The penalty limits how far the policy can move from the supervised model."}, {"q": "What does DPO remove compared with classic RLHF?", "o": ["The preference data", "The reference model", "The supervised fine-tuning stage", "The separate reward model and the reinforcement learning loop", "Any need for human or AI judgments"], "a": 3, "why": "DPO still needs chosen and rejected pairs and a reference model. It turns the preference objective into a direct loss, so no reward model and no RL loop."}, {"q": "Why can preference tuning make a model more likely to answer confidently when it does not know?", "o": ["It deletes facts from the weights", "Raters and reward models tend to favour confident, complete-sounding answers, so guessing can be rewarded over admitting uncertainty", "It shrinks the context window", "It raises the sampling temperature", "It adds noise to the embeddings"], "a": 1, "why": "The tuning signal is what people prefer, not what is true. If a confident guess is scored above 'I don't know', the model learns to guess."}], "open": {"q": "How is an LLM like ChatGPT trained, from raw text to an assistant?", "probe": "That you know the stages and what each one adds and does not add.", "a": ["Pretraining: next-token prediction on a huge corpus; knowledge and most of the compute; the result only continues text.", "Instruction tuning on prompt and response pairs: the assistant role and format.", "Preference tuning: RLHF with a reward model and PPO, or DPO directly on chosen and rejected pairs.", "Reasoning models add reinforcement learning on checkable tasks.", "No stage adds a truth check, so hallucination is handled in the system around the model."]}, "say": ["There are roughly three stages. Pretraining is next-token prediction over a huge amount of text and code, and that's where nearly all the knowledge and the compute go. The result is a base model, and it only continues text, it doesn't follow instructions. Then instruction tuning: you train on prompt and ideal-response pairs, which teaches it the assistant format and role, not new facts.", "The third stage is preference tuning. In RLHF, people rank pairs of answers, a reward model learns those rankings, and the model is optimised against it with a penalty that keeps it near the tuned model. DPO gets to the same place without a reward model or an RL loop, straight from chosen and rejected pairs, so it's simpler and common. Reasoning models add reinforcement learning on things you can check, like maths answers or passing tests. The thing I'd add is that none of this installs a truth check. Tuning for what people prefer can even reward confident guessing, which is why I fix hallucination in the system around the model: retrieval, validation and evals."], "avoid": ["Saying RLHF teaches the model facts: it shapes behaviour and preferences.", "Naming PPO and DPO without saying what problem each solves."], "links": [{"url": "../BASELINE.html#/nlp/llm-training", "label": "Baseline: How an LLM is made: pretraining to preference tuning", "why": "What each stage adds, in order."}, {"url": "../BASELINE.html#/ml/preference-tuning", "label": "Baseline: RLHF and preference tuning", "why": "Reward models, PPO and DPO in plain words."}, {"url": "../BASELINE.html#/ml/pretraining", "label": "Baseline: Pretraining and scaling", "why": "Next-token prediction and why loss falls with scale."}, {"url": "../index.html#/w/wc27", "label": "Tracker: LLM fundamentals and the Transformer, lightly", "why": "Where the lifecycle is taught in the plan."}]}, {"id": "l-sampling", "title": "Sampling and determinism", "brief": "The model outputs a probability for every next token and sampling settings decide how one is picked; temperature 0 makes output repeatable in principle, but it is neither true nor perfectly repeatable in practice.", "points": ["The loop: the model scores every token in the vocabulary, softmax turns the scores into probabilities, decoding picks one token, appends it, and repeats. Generation is that loop, one token at a time.", "Temperature divides the scores before softmax: p_i = softmax(z_i / T). Low T sharpens the distribution towards the top token; high T flattens it. T near 0 is greedy decoding, always the top token. Low for extraction, classification and code; higher for brainstorming.", "Top-k keeps the k most likely tokens. Top-p (nucleus sampling) keeps the smallest set whose probabilities add up to p, so the pool grows when the model is unsure and shrinks when it is sure. Both cut the long tail of bad tokens. Change temperature or top-p, not both at once.", "Temperature 0 is not truth: greedy picks the most likely token, which is the most plausible one, not the correct one. A wrong answer at temperature 0 comes back the same wrong way every time, and greedy decoding can also fall into repetition.", "Temperature 0 is not even guaranteed repeatable. In Thinking Machines' test, 1,000 temperature-0 completions of one prompt from a 235B model gave 80 different outputs. The cause is that kernels are not batch-invariant: results depend on how many requests share the batch, which changes with server load, and a tiny numeric difference flips a near-tie between two tokens.", "So design for variation: tests assert on properties (valid schema, the id exists) and not on exact strings, evals sample several runs, and anything that must be exact is computed by code and not sampled."], "figs": [], "production": ["Thinking Machines' 2025 post 'Defeating Nondeterminism in LLM Inference' measured 80 distinct completions from 1,000 temperature-0 runs of Qwen3-235B-A22B-Instruct-2507, and showed that batch-invariant kernels made all 1,000 identical, at a cost in speed.", "Holtzman et al. (2019), 'The Curious Case of Neural Text Degeneration', introduced nucleus (top-p) sampling after showing that greedy and beam search give repetitive, dull text; that is why APIs expose top-p."], "mine": ["MockFlow-AI: the hiring-verdict judge runs at temperature 0, but the final verdict is computed deterministically in code from evidence-cited scores across 5 competencies, and the judge was calibrated against a 50-item human gold set (weighted Cohen's kappa 0.82)."], "res": [{"kind": "video", "req": true, "label": "LLM Prompt Engineering with Random Sampling: Temperature, Top-k, Top-p", "url": "https://www.youtube.com/watch?v=-BBulGM6xF0", "yt": {"id": "-BBulGM6xF0", "ch": "DataMListic"}, "m": 8, "why": "Temperature, top-k and top-p with the distributions drawn."}, {"kind": "video", "req": false, "label": "Temperature? Top-p? Top-k? A practical guide to AI parameters", "url": "https://www.youtube.com/watch?v=-KEUQEoyje8", "yt": {"id": "-KEUQEoyje8", "ch": "Probably Private"}, "m": 19, "why": "Optional: which setting to reach for in practice."}, {"kind": "article", "label": "How to generate text: different decoding methods (Hugging Face)", "url": "https://huggingface.co/blog/how-to-generate", "m": 20, "why": "Greedy, beam, top-k and top-p side by side, with the repetition problem."}, {"kind": "article", "label": "Defeating Nondeterminism in LLM Inference (Thinking Machines)", "url": "https://thinkingmachines.ai/blog/defeating-nondeterminism-in-llm-inference/", "m": 25, "why": "The real reason temperature 0 is not repeatable: batch invariance."}], "mcq": [{"q": "You lower the temperature from 1.0 to 0.2. What happens to the next-token distribution?", "o": ["It becomes flatter, so rare tokens become likelier", "It becomes sharper, so the most likely tokens get more of the probability", "Top-k drops to 1", "The scores are clipped to the range 0 to 1", "The model reads more of the context"], "a": 1, "why": "Dividing the scores by a small T before softmax widens the gaps between them, so the top tokens take more of the probability mass."}, {"q": "A summariser at temperature 0 gives the wrong number every time. What does that show?", "o": ["The temperature was too low, and raising it will fix the number", "The seed is wrong", "The model is overfit to that prompt", "Repeatable is not correct: greedy picks the most likely token, so a plausible wrong answer comes back wrong every time", "The context window was exceeded"], "a": 3, "why": "Temperature controls randomness, not truth. Fixing a wrong number means giving the model the source or checking the output in code."}, {"q": "Two runs of the same prompt at temperature 0 on a busy provider return different text. What is the most likely cause?", "o": ["Results depend on batch size and kernel numerics, which vary with server load and can flip a near-tie between tokens", "Temperature 0 means sampling from the top 2 tokens", "The model weights changed between the two requests", "The tokenizer is random", "Top-p overrides temperature"], "a": 0, "why": "Each forward pass is deterministic, but the numbers a request gets depend on how it was batched. A tiny difference can change which of two almost-equal tokens wins, and the text diverges from there."}, {"q": "With top-p set to 0.9, when does the candidate pool get larger?", "o": ["When the temperature is below 1", "When the prompt is long", "When the top tokens are very confident", "When max_tokens is raised", "When the model is unsure, so many tokens are needed to reach 90% of the probability"], "a": 4, "why": "Top-p keeps the smallest set of tokens that adds up to 0.9. A flat distribution needs many tokens to get there, a peaked one needs only one or two."}], "open": {"q": "What is temperature, and is setting it to zero enough to make an LLM app deterministic or correct?", "probe": "The mechanism, and that you know repeatable is not the same as true.", "a": ["Temperature rescales the scores before softmax: low sharpens, high flattens; zero is greedy.", "Top-p keeps the smallest set of tokens that reaches probability p, so the pool adapts to confidence.", "Zero is not true: greedy returns the most plausible token, so a wrong answer is consistently wrong.", "Zero is not guaranteed repeatable: batching and kernels vary with load; 80 different outputs from 1,000 runs in one public test.", "So compute anything exact in code, test properties, and calibrate any judge, as in MockFlow-AI."]}, "say": ["At every step the model gives a probability for each possible next token, and decoding picks one. Temperature divides the scores before the softmax, so low temperature sharpens the distribution and high temperature flattens it. At zero it's greedy: always the top token. Top-p keeps only the smallest set of tokens whose probabilities add up to p, so the pool adapts to how sure the model is. I use low temperature for extraction and code, higher for brainstorming.", "But temperature zero doesn't mean true, and it doesn't even mean identical. It picks the most likely token, which is the plausible one, so a wrong answer comes back the same wrong way every time. And in practice results can still differ, because the numbers depend on how requests are batched on the server. One public test got 80 different outputs from 1,000 runs at temperature zero. So I don't rely on it. In MockFlow-AI the hiring verdict judge runs at temperature zero, but the verdict itself is computed in code from evidence-cited scores, and I checked the judge against a 50-item human set, weighted kappa 0.82."], "avoid": ["Saying temperature 0 makes the model deterministic or accurate.", "Mixing up temperature and top-p, or saying both should always be tuned together."], "links": [{"url": "../BASELINE.html#/nlp/decoding", "label": "Baseline: Decoding: greedy, beam, temperature, top-p", "why": "How probabilities become text and what each setting is for."}, {"url": "../BASELINE.html#/ai/evaluation", "label": "Baseline: Evaluation: offline sets and online metrics", "why": "How to test something that varies from run to run."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Guide: Eval suites as release gates", "why": "Why variation means you gate releases on an eval set, not on a few runs."}]}, {"id": "l-halluc", "title": "Hallucinations: why they happen", "brief": "A hallucination is fluent output that the sources or the facts do not support; it happens because the model is trained to produce plausible text, not to check it.", "points": ["What it is: fluent, confident text that is false or unsupported, such as an invented citation, an API that does not exist, or a number the source does not contain. Two kinds: in-context, where it contradicts the source it was given, and extrinsic, where it states something the world does not support.", "Why it happens: next-token prediction rewards plausible continuations and has no truth check. A fact seen many times is learned; a fact seen once or never leaves no pattern to lean on, so the model produces something that looks right. Roughly, the share of facts seen only once sets a floor on how often it will guess wrong (Kalai et al., 2025).", "Training pushes towards guessing: most benchmarks give no credit for 'I don't know', so a model that guesses scores higher than one that abstains. Preference tuning adds to it if raters favour confident answers.", "Context causes it too: missing or stale context, the relevant passage buried in the middle of a long prompt, conflicting passages, or a question that assumes something false.", "What does not fix it: temperature 0 gives the same wrong answer every time; a bigger model hallucinates less often, not never; telling it 'do not hallucinate' helps a little at best.", "What does: ground it with retrieval or a tool, constrain the output with a schema or a pick from options, check it in code, give it an explicit not-found path, and measure on an eval set. It is a system problem, not a prompt problem."], "figs": [], "production": ["In Moffatt v. Air Canada (British Columbia Civil Resolution Tribunal, February 2024), the airline's website chatbot gave a passenger wrong bereavement-fare information and the tribunal held the airline responsible for it.", "In Mata v. Avianca (US District Court, Southern District of New York, 2023), lawyers filed a brief citing cases that ChatGPT had invented, and the court sanctioned them."], "mine": ["MetaRAG (IEEE CAI 2026, first author): better retrieval alone gave 20% fewer hallucinations than baseline RAG.", "alfred_: re-architected agent memory to ground recall in verified state, cutting fabricated-recall and false-confirmation incidents by 80%; the eval harness replays production scenarios nightly across 12 failure classes."], "res": [{"kind": "video", "req": true, "label": "Why Large Language Models Hallucinate", "url": "https://www.youtube.com/watch?v=cfqtFvWOfg0", "yt": {"id": "cfqtFvWOfg0", "ch": "IBM Technology"}, "m": 10, "why": "A clear short explanation of causes and mitigations."}, {"kind": "video", "req": false, "label": "Why do AI models hallucinate?", "url": "https://www.youtube.com/watch?v=005JLRt3gXI", "yt": {"id": "005JLRt3gXI", "ch": "Claude"}, "m": 5, "why": "A five-minute view from a model lab."}, {"kind": "article", "label": "Extrinsic Hallucinations in LLMs (Lilian Weng)", "url": "https://lilianweng.github.io/posts/2024-07-07-hallucination/", "m": 40, "why": "Definitions, causes and detection methods; skim the headings and read the causes."}, {"kind": "article", "label": "Why Language Models Hallucinate (Kalai et al., arXiv)", "url": "https://arxiv.org/abs/2509.04664", "m": 15, "why": "Read the abstract and introduction: guessing is rewarded by how models are trained and scored."}], "mcq": [{"q": "A model invents a plausible-looking citation for a paper that does not exist. Which explanation fits best?", "o": ["Its temperature was too high", "The tokenizer split the title wrongly", "Training rewards plausible continuations, and with no stored fact to draw on it produced text that looks like a citation", "Attention ran out of memory", "It was fine-tuned on too little data"], "a": 2, "why": "Citations have a recognisable shape. With no learned fact behind it, the model completes the shape. Nothing in the objective checks that the paper exists."}, {"q": "Why can a benchmark that scores only accuracy encourage hallucination?", "o": ["A guess on an uncertain question can earn points while 'I don't know' earns none, so training and tuning favour guessing", "It lowers the temperature", "It makes the context window longer", "It removes retrieval", "It rewards short answers"], "a": 0, "why": "If abstaining and being wrong both score zero, guessing can only help. That is the incentive Kalai et al. argue for changing in how benchmarks score."}, {"q": "Your assistant gives a wrong answer at temperature 0, the same way every time. What is the best next step?", "o": ["Raise the temperature to explore other answers", "Switch to a larger model and stop there", "Add 'do not hallucinate' to the prompt", "Check whether the facts were in its context; if not, ground it with retrieval or a tool, add a not-found path, and measure on an eval set", "Increase max_tokens"], "a": 3, "why": "A repeatable wrong answer points to a missing fact or a missing check. Fix the system around the model and prove the fix on an eval set."}, {"q": "Which of these is an in-context hallucination?", "o": ["Stating the wrong year for an event that is not in the prompt", "A summary that says revenue fell when the supplied report says it rose", "Declining to answer", "A correct answer in the wrong language", "Repeating a sentence twice"], "a": 1, "why": "In-context means the output contradicts or goes beyond the source the model was given. The summary conflicts with the report in its own prompt."}], "open": {"q": "What is a hallucination, and why do LLMs hallucinate?", "probe": "That you know the mechanism, not only the buzzword; expect 'does a bigger model fix it?' and 'is temperature zero enough?'", "a": ["Fluent, confident output that the input or the facts do not support: an invented citation, an API that does not exist.", "The model predicts the next likely token and nothing checks truth; for a fact it never learned it produces the most plausible one.", "Training and benchmarks reward guessing over saying 'I don't know'.", "Missing, stale or badly placed context makes it worse; temperature 0 and a bigger model do not remove it.", "The fix is the system: ground, constrain, check in code, allow not-found, measure."]}, "say": ["A hallucination is when the model says something fluent and confident that isn't supported by what it was given or by fact. The reason is pretty much built in: it's trained to predict the next likely token, and nothing in that checks truth. For a fact it saw once or never, there's no pattern to lean on, so it gives you the most plausible-sounding answer. Training makes it worse in one way: benchmarks give no credit for saying I don't know, so guessing scores better than abstaining.", "Turning temperature to zero doesn't fix it, it makes it consistently wrong, and a bigger model hallucinates less often, not never. So I treat it as a system problem: give it the facts through retrieval or a tool, constrain what it can say, check the output in code, let it say not found, and measure. In my MetaRAG research, better retrieval alone cut hallucinations about 20% against baseline RAG. And at alfred_ I re-architected agent memory to ground recall in verified state, which cut fabricated recall and false confirmations by 80%."], "avoid": ["Saying temperature 0 or a bigger model solves it.", "Treating hallucination as a bug to be patched with a prompt line instead of a system problem."], "links": [{"url": "../BASELINE.html#/ai/hallucination", "label": "Baseline: Hallucination", "why": "The plain-language map: causes and the layers of defence."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/grounding/refusal", "label": "Guide: Explicit refusal paths", "why": "The not-found path, drawn."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/grounding/citations", "label": "Guide: Enforced citations and verification", "why": "How to make every claim point to a source."}, {"url": "../CODING.html#rag", "label": "Coding page: RAG over a parser's output", "why": "Look at the diagram of grounding; no need to read the code."}]}], "day": "Thu 29 Oct"}, {"id": "prompt", "title": "2. Prompting and structured output", "blurb": "How to ask, how to get data back that code can use, and how to fill the context window well.", "topics": [{"id": "p-prompt", "title": "What works in prompting", "brief": "A prompt is an instruction to a reader with no context: state the task, the format and the way out, show examples, and treat the prompt as code that changes only with an eval run.", "points": ["Be specific: the task, who the answer is for, the output format, what done looks like, and what to say when the answer is not in the data. Write for a smart reader who has seen none of your context.", "Give the data, do not hope: paste the documents or call a tool. Put long documents first and the question and instructions last; Anthropic's docs report up to 30% better answers in their tests when the query comes at the end of complex multi-document inputs.", "Show, do not describe: three to five examples of the exact input and output beat a paragraph of description, especially for format and style. Make them varied, and wrap them in tags so they are not read as instructions.", "Separate with delimiters: put instructions, documents and examples under XML-style tags or clear headings, so the model can tell what is data and what is an order, and you can refer to a part by name.", "Let it think when the task needs it: for multi-step reasoning ask for the reasoning before the answer, or use a model's thinking mode; for a simple extraction skip it and save tokens. In structured output, put the reasoning field before the answer field.", "Prompts are code: keep them in the repo, version them, and change them only with an eval run, because an edit that fixes one case often breaks three others. And know the limit: a prompt cannot give the model a fact it lacks or a guarantee; for those use retrieval and a schema."], "figs": [], "production": ["Anthropic's prompting best-practices guide for Claude recommends three to five examples wrapped in tags, and long documents placed above the query.", "Per Claude Code's documentation, project instructions live in a CLAUDE.md file kept in the repository and are loaded at the start of every session, which is a prompt treated as a versioned file."], "mine": ["alfred_: built the eval harness from scratch: production-scenario replay with hybrid deterministic and LLM-as-judge scoring across 12 failure classes in nightly replays, so a prompt or model change is run against real failures before it ships."], "res": [{"kind": "video", "req": true, "label": "Prompting 101 | Code w/ Claude", "url": "https://www.youtube.com/watch?v=ysPbXH0LpIE", "yt": {"id": "ysPbXH0LpIE", "ch": "Anthropic"}, "m": 25, "why": "A worked example of building a prompt up, from the people who write the guidance."}, {"kind": "video", "req": false, "label": "The prompting playbook", "url": "https://www.youtube.com/watch?v=G2B0YWuJUgI", "yt": {"id": "G2B0YWuJUgI", "ch": "Claude"}, "m": 34, "why": "Optional: more techniques and patterns for current models."}, {"kind": "article", "label": "Prompting best practices (Anthropic docs)", "url": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "m": 25, "why": "The reference page: clarity, examples, tags, thinking; read the general principles and the long-context tips."}, {"kind": "article", "label": "Prompt Engineering (Lilian Weng)", "url": "https://lilianweng.github.io/posts/2023-03-15-prompt-engineering/", "m": 30, "why": "The techniques and their trade-offs, with the research behind them."}], "mcq": [{"q": "Your extraction prompt returns a made-up value when the field is missing from the document. What is the best first fix?", "o": ["Raise the temperature", "Add more documents", "Use a bigger model", "Say exactly what to output when the field is absent, for example null, and add an example of that case", "Ask the model to be more careful"], "a": 3, "why": "Without a way out, the model fills the slot with something plausible. A defined not-found value plus an example makes the right behaviour easy to copy."}, {"q": "Why put a long document before the question in the prompt?", "o": ["Anthropic's tests found better answers on long multi-document inputs when the question comes last, so the model reads the material and then the task", "The model ignores the first tokens", "It reduces the token count", "It switches caching on", "Instructions placed last are skipped"], "a": 0, "why": "With a long input, the task statement closest to where the model starts answering is easiest to use. Anthropic reports up to 30% better responses in tests."}, {"q": "You edit a prompt to fix one failing case. What should you do before shipping?", "o": ["Nothing, a prompt change is low risk", "Test three random cases by hand", "Run the whole eval set and compare per case against the old prompt", "Ask the model whether the new prompt is better", "Lower the temperature"], "a": 2, "why": "A prompt edit changes behaviour everywhere. Only a fixed eval set shows which cases got better and which got worse."}, {"q": "When do examples in the prompt help most compared with a longer description?", "o": ["When the context window is too small", "When you want shorter output", "When facts are missing from the data", "Never, because descriptions are always clearer", "When the format or style is hard to describe but easy to show"], "a": 4, "why": "Examples pin down format, tone and edge cases in a way prose often cannot. They do not add missing facts."}], "open": {"q": "What actually works in prompt engineering, and where does it stop working?", "probe": "Practical habits and a sense of the limits, not tricks.", "a": ["Be specific about the task, the format and what to do when the answer is not there.", "Give the data, long documents first and the question last.", "Three to five varied examples beat a paragraph; separate parts with tags.", "Ask for structured output and validate it; let it reason first when the task needs it.", "Treat prompts as code with an eval run per change; a prompt cannot add facts, so use retrieval for those."]}, "say": ["Honestly, most of it's being specific. Say exactly what the task is, what format you want, and what to do when the answer isn't there, because if you don't give it a way out, it'll make something up. Give it the data instead of hoping it knows, and with long documents I put them first and the question last. And two or three examples of the exact output beat a paragraph describing it.", "For anything a program consumes, I ask for structured output against a schema and validate it in code. And I treat prompts like code: they're versioned, and I don't change one without running the eval set, because a prompt change that fixes one case quietly breaks three others more often than you'd think. At alfred_ the eval harness I built replays real production scenarios every night, so that's how I'd know. The limit is that a prompt can't add a fact the model doesn't have, so for that it's retrieval."], "avoid": ["Listing tricks ('think step by step', 'you are an expert') with no mention of evals.", "Claiming a good prompt removes hallucination or guarantees a format."], "links": [{"url": "../BASELINE.html#/ai/prompting", "label": "Baseline: Prompting", "why": "Clear instructions, examples and room to think."}, {"url": "../BASELINE.html#/ai/context-engineering", "label": "Baseline: Context engineering", "why": "Prompting is one part of deciding which tokens the model sees."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Guide: Eval suites as release gates", "why": "How a prompt change is gated by an eval run."}
