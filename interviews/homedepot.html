dialog.ln-test { border: 0; border-radius: var(--radius-lg); padding: 0; max-width: min(720px, 94vw); width: 100%; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-float); }

.ln-test-box { padding: var(--s4) var(--s5); max-height: 86vh; overflow: auto; }

@media (max-width: 760px) { .pq-cols, .pq-cols.has-code, .role-cols { grid-template-columns: minmax(0, 1fr); } .pq-cols .cv-col { padding: var(--s3); } }

.banks { border-top: var(--hair); margin-top: var(--s1); }
.bank { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--s4); width: 100%; text-align: left; background: none; border: 0;
  border-bottom: var(--hair); padding: var(--s3) 0; color: var(--ink); }

/* the turn list: one row per turn, on the page and in the panel's rail */
main .turns { list-style: none; margin: var(--s4) 0 0; padding: 0; border-top: var(--hair); max-width: none; }

  background: none; border: 0; border-bottom: var(--hair); padding: var(--s2) var(--s1); color: var(--ink); }

/* dialogs float, so they alone carry a shadow */
dialog { width: min(640px, 94vw); border: 0; border-radius: var(--radius-lg); padding: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-float); }
dialog::backdrop { background: rgba(10, 10, 14, .55); }

/* the one-screen panel, shared by mocks and the Prep banks: the list on the left; the item's
   header; then understanding on the page and what to say on a sunken tint, each scrolling on its own */
dialog.convo { width: min(1320px, 96vw); height: min(880px, 92vh); max-width: none; max-height: none; overflow: hidden; }

.cv-title b { font-weight: var(--w-strong); }
.cv-title span { display: block; color: var(--muted); font-size: var(--fs-xs); margin-top: var(--s1); }
.cv-rail .turn { grid-template-columns: 20px 14px minmax(0, 1fr); border-radius: var(--radius); border-bottom: 0; margin-top: 1px; font-size: var(--fs-sm); line-height: var(--lh-tight); padding: 6px var(--s2); }

.cv-rail .turn.on .tl { font-weight: var(--w-strong); }
.cv-keys { margin-top: auto; padding: var(--s3) var(--s2) 0; font-size: var(--fs-xs); color: var(--muted); }

.cv-pane { display: flex; flex-direction: column; min-height: 0; }
.cv-head { padding: var(--s4) 96px var(--s3) var(--s5); border-bottom: var(--hair); flex: none; }
.cv-verdict { margin: var(--s2) 0 0 var(--s4); font-size: var(--fs-sm); color: var(--soft); }
.cv-verdict b { color: var(--ink); font-weight: var(--w-strong); }
.cv-tests { margin: var(--s1) 0 0 var(--s4); font-size: var(--fs-sm); color: var(--muted); }
.cv-tests b { color: var(--soft); font-weight: var(--w-strong); }
.cv-cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--s2); flex: 1; min-height: 0; padding: 0 var(--s4) var(--s4) 0; }
.cv-cols.has-code { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

.cv-col.cv-say { scrollbar-color: var(--muted) transparent; }
.cv-h { font-size: var(--fs-md); margin: 0 0 var(--s3); }

.vp-lab { font-size: var(--fs-sm); color: var(--muted); font-weight: var(--w-strong); }
.vp { font: inherit; font-size: var(--fs-sm); padding: 2px var(--s3); border: var(--hair); border-radius: var(--radius-sm); background: transparent; color: var(--soft); cursor: pointer; }

.meta .nlm-copy { margin-left: auto; }
.stepsheet .lab { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); margin: var(--s3) 0 var(--s1); }
.cv-col .lab, .sbody .lab { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); margin: var(--s4) 0 var(--s1); }
.cv-part { font-size: var(--fs-md); margin: var(--s5) 0 var(--s1); padding-top: var(--s3); border-top: var(--hair); }

  font-family: var(--mono); font-size: var(--fs-code); line-height: 1.6; color: var(--code-ink); white-space: pre; }

/* what to say: the one inverse sheet on the screen (dark on the light theme), so the words to
   say never read like the notes beside them. Its labels are the sheet's own ink, dimmed. */

/* figures are drawn for a light ground, so they sit on the light surface on every theme
   (the light tokens' values: surface, ink, muted, rule) */
figure { margin: var(--s5) 0 var(--s6); padding: var(--s4); background: #FFFDF8; color: #1D1B17; border: 1px solid #E5DDCD; border-radius: var(--radius-lg); overflow-x: auto; }

figure.trk { --faint: #a2a09a; --dim: #6b6a65; --line: #c3c0b7; --ink: #1a1a19; --live: #fffdf5; }
table { width: 100%; border-collapse: collapse; margin: var(--s1) 0; font-size: var(--fs-sm); }
th, td { text-align: left; padding: var(--s2) var(--s3) var(--s2) 0; border-bottom: var(--hair); vertical-align: top; }
th { font-weight: var(--w-strong); color: var(--muted); font-size: var(--fs-xs); }
td:first-child { font-weight: var(--w-strong); }
.tnote { font-size: var(--fs-sm); color: var(--muted); margin: var(--s2) 0 var(--s6); }

/* sessions */
.session .meta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); margin-top: calc(-1 * var(--s3)); }
.chip { color: var(--muted); }
.chip.done { color: var(--ok); }
.session .intro { color: var(--soft); margin: var(--s3) 0; }
.session > h3 { margin: var(--s6) 0 var(--s2); }
.step { border-top: var(--hair); }
.step > summary { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: var(--s3); align-items: start; padding: var(--s3) var(--s6) var(--s3) 0; }
.step > summary .st { font-weight: var(--w-strong); }
.step > summary:hover .st { color: var(--accent); }
.step > summary .sm { color: var(--muted); font-size: var(--fs-sm); padding-top: 2px; white-space: nowrap; }
.tick { width: 18px; height: 18px; border-radius: var(--radius-sm); border: 1.5px solid var(--muted); background: transparent; color: var(--surface);
  display: grid; place-items: center; font-size: var(--fs-xs); margin-top: 3px; padding: 0; }
.tick.on { background: var(--ok); border-color: var(--ok); }
.sbody { padding: 0 0 var(--s5) 30px; }
.step { scroll-margin-top: calc(var(--top) + var(--s2)); }
.sbody2 { margin: 0 0 var(--s5); grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); }
.sbody2 > .cv-said { padding: 0 var(--s4) 0 30px; }
.sbody2 > .cv-said > p.d { margin: 0 0 var(--s3); }
.pts { margin: 0 0 var(--s3); padding-left: var(--s5); }
.pts li { margin: 0 0 var(--s2); padding-left: var(--s1); }
.pts li b { font-weight: var(--w-strong); color: var(--ink); }
.pq-work { align-self: start; position: sticky; top: calc(var(--top) + var(--s3)); background: var(--surface); border: var(--hair); border-radius: var(--radius-lg); padding: var(--s4); }
.pq-work .mine { margin-top: 0; }
.pq-work details.say .transcript { margin-top: var(--s3); }
@media (max-width: 760px) { .sbody2 > .cv-said { padding: 0; } .pq-work { position: static; } }
.sbody > p.d, .sbody > p.point { margin: 0 0 var(--s1); }
.reading { margin: 0; padding: 0; list-style: none; }
.reading li { margin: 0 0 var(--s2); padding-left: var(--s3); position: relative; }
.reading li::before { content: ""; position: absolute; left: 0; top: .75em; width: 5px; height: 1.5px; background: var(--muted); }
.reading a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.reading a:hover { text-decoration-color: var(--ink); }
.reading .w { color: var(--muted); font-size: var(--fs-sm); margin-left: var(--s2); white-space: nowrap; }
.reading .why { display: block; color: var(--soft); font-size: var(--fs-sm); margin-top: 2px; }
.sbody figure { margin: var(--s4) 0 var(--s2); }
details.say { margin-top: var(--s4); }
details.say > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--accent); }

details.say[open] > summary::after { transform: rotate(-135deg); margin-top: 3px; }
details.say > summary:hover { text-decoration: underline; text-underline-offset: 3px; }
details.item > .sbody { padding-left: 0; }
@media (max-width: 700px) { .sbody { padding-left: 0; } }
.session-end { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-top: var(--s5); }

<script type="application/json" id="loop-data">{"id": "homedepot", "title": "The Home Depot, Principal Data Scientist - CX", "subtitle": "Round 1: recruiter call with Kristen Bernal", "when": "Date to be set (Kristen is sending the invite)", "when_iso": "", "who": "Kristen Bernal, Senior Recruiting Partner, Marketing and Online Data Science, Corporate Talent Acquisition.", "format": "A recruiter call, likely 30 minutes: your background, why this role, level and fit, logistics, and the process from here.", "bar": "Can she put you in front of the hiring manager? She reached out for agentic AI, machine learning and stakeholder work. Show that the job's core, agents that resolve customer needs with evaluation and reliability behind them, is what you do every day, and handle the level question calmly.", "sessions": [], "scripts": [{"id": "intro", "title": "Tell me about yourself", "length": "about 45 seconds", "when": "First. The short one, then stop.", "probes": ["What do you own at alfred_?", "How big is the team?"], "say": ["I'm currently a founding LLM engineer at alfred_, where I work across AI agent reliability, memory architecture, evaluation infrastructure, and automation for a product with 5,000-plus active users. A big part of my work has been taking ambiguous problems and building the systems underneath them that make AI actually work reliably in production.", "Before that, I worked at an early-stage startup called WheelPrice and did AI research at UIC. What I enjoy most is working across the stack, understanding a real problem, and building something that solves it end to end. That's what caught my attention about this role: agents that actually resolve what a customer needs, with the evaluation and reliability behind them to trust that at Home Depot's scale."], "land": "Production agent reliability and evaluation, and why this role: agents that resolve customer needs, at scale.", "notes": ["Yours from INTRO.md, unchanged except the last sentence, which replaces the Mercor line: make it yours."]}, {"id": "why-hd", "title": "Why Home Depot, why this role?", "length": "about 30 seconds", "when": "Almost certainly.", "probes": ["What do you know about our AI work?", "Why a large company after a startup?"], "vname": "A, the problem", "say": ["Honestly, it's the problem. The posting talks about agents that use the reasoning an experienced associate would, so a customer can sort out something complicated on their own. That's exactly the hard part I work on: understanding what someone actually needs, deciding the next action, and knowing when the agent should not act alone. Doing that for millions of customers a month, across chat, SMS and voice, is a much bigger version of it."], "land": "The associate's judgment, built into self-service, at Home Depot's scale.", "variants": [{"name": "B, scale and stakes", "land": "Millions of real questions, where reliability and cost to serve are measured.", "say": ["I think it's the scale. Magic Apron is in every store now and answering millions of questions a month, and you're moving from answering to actually resolving things across chat, SMS and phone. At that scale reliability and cost to serve aren't side concerns, they're the job, and that's where I've spent most of my time at alfred_: making an agent dependable, and measuring it, not just making it work in a demo."]}, {"name": "C, the craft", "land": "Evaluation, monitoring and the next action: the parts you already own.", "say": ["What stood out in the posting is how much of it is about rigor: evaluation, experimentation, monitoring, reliability, and how a workflow decides the next action. That's pretty much my day. At alfred_ I built the gate that decides what an agent may do alone and an eval bench that replays real conversations, and I'd like to bring that to a team where the customer base and the data are this large."]}]}, {"id": "level", "title": "The posting asks for 10 years. How do you see yourself fitting?", "length": "about 30 seconds", "when": "Likely, or raise it yourself near the end as a question about level.", "probes": ["How many years of experience do you have?", "Have you led other data scientists?"], "vname": "A, scope first", "say": ["Fair question. In years I'm earlier than that, but as a founding engineer I've owned the production agent systems end to end: the architecture, the evaluation, the reliability, and the decisions with the product side about what the agent is allowed to do. That's the core of what this posting describes. I'm open on level; I'd rather be in the right seat on this team than hold out for a title."], "land": "Scope over years, and open on level.", "variants": [{"name": "B, ask her", "land": "Turn it into her read of the search.", "say": ["In years I'm earlier than the posting, but the work it describes, agents that pick the next action, evaluation, production reliability, is what I own today. How is the team thinking about level for this search? I'd be glad to be considered for whichever level fits."]}, {"name": "C, the evidence", "land": "Three concrete things you've owned.", "say": ["Honestly, I'd point to what I've owned rather than the count. I rebuilt how our agent decides what it may do on its own, built the evaluation that replays real user conversations, and took a new engine to all of our SMS traffic with measured results. If the team needs someone at a different level to start, I'm open to that conversation."]}], "notes": ["Don't argue with the number, and don't apologise for it. The recruiter reached out to you; let her say how flexible the level is."]}, {"id": "leave", "title": "Why leave alfred_?", "length": "about 30 seconds", "when": "Likely.", "probes": [], "vname": "Yours", "say": ["I’m not looking to leave because there’s something fundamentally wrong with alfred_. The reason I'm exploring is more about the direction I want to take my career", "I've learned a lot at alfred_ and have had the opportunity to own important parts of a production AI product from the ground up. I've gradually moved beyond just building agent features and into building the systems around the agent — evaluations, observability, memory, reliability", "I'm still there and not looking to leave just for the sake of moving. I'm exploring roles where I can apply that experience to a broader range of problems, work directly with customers, and grow as an engineer who can own both the technical solution and its business outcome."], "land": "Not away from alfred_; toward a broader version of the same work.", "variants": [{"name": "B, scale", "land": "From a small user base to customer AI at real scale.", "say": ["Nothing's wrong at alfred_; I've owned a lot of the production system there. What I want next is the same work at a scale where the data is rich and the impact is measurable, where an agent improving resolution by a few points means real customers and real cost. That's hard to get at a small startup."]}, {"name": "C, leading", "land": "Toward technical leadership: mentoring and shaping how a team builds agents.", "say": ["I've spent the last year building the systems around our agent, the evaluation, memory, the reliability work. The next step for me is doing that with a team: shaping how several people build and evaluate agents, mentoring, and working with the business on what to build. A data science team at Home Depot is a good place for that."]}], "notes": ["Version Yours is INTRO.md word for word, minus its last sentence, which named Mercor."]}, {"id": "next", "title": "What are you looking for next?", "length": "about 40 seconds", "when": "Possible.", "probes": ["Where do you see yourself in a few years?"], "vname": "A, real stakes", "say": ["Short term, I want to be somewhere the agentic engineering is actually at the frontier — not a demo, but running against real stakes, where getting it wrong has weight. That's the fastest way I know to get good, seriously good, at this.", "Long term, I want to understand this domain and this kind of engineering deeply enough that I can actually lead it — see where the real bottlenecks are, and push us toward the better one before it costs months. But I don't want that to mean stepping back from the actual work."], "land": "Real stakes now; lead the work later, still hands-on.", "variants": [{"name": "B, technical leadership", "land": "Hands-on technical leadership, which is what Principal means here.", "say": ["I want to grow into technical leadership without leaving the work: setting how a team evaluates and ships agents, mentoring, and being the person the business can bring a hard customer problem to. Over a few years, to be the one who calls the technical direction on customer AI and still builds it."]}, {"name": "C, three things", "land": "Real customers, rigor, and people to learn from.", "say": ["Honestly, three things: real customers at real volume, so the work is measured; a team that takes evaluation and reliability seriously; and people I can learn from on the data science and business side. Longer term, to lead this kind of work."]}], "notes": ["Version A is your goals from INTRO.md, unchanged."]}, {"id": "logistics", "title": "Logistics she will ask", "length": "a line each", "when": "Almost certainly on a recruiter call. Your answers are in chat, not on this page.", "probes": ["Onsite in Atlanta: are you open to relocating?", "Work authorization?", "Compensation expectations?", "Start date?"], "say": [], "land": "One sentence each, then back to the work.", "notes": ["Location, relocation, start date, pay and work authorization: your answers from chat."]}], "drills": [{"id": "intro", "prompt": "Tell me about yourself.", "target": "45 seconds", "seconds": 45, "ref": "#say-intro"}, {"id": "why-hd", "prompt": "Why this role at Home Depot?", "target": "30 seconds", "seconds": 30, "ref": "#say-why-hd"}, {"id": "level", "prompt": "The posting asks for 10 years. How do you see yourself fitting?", "target": "30 seconds", "seconds": 30, "ref": "#say-level"}], "qa": [], "ask": [], "ask3": [{"id": "clarify", "title": "While she talks: clarifying", "when": "When she describes the role or team. One or two, on her words.", "why": "Pins down what the role really is before you pitch yourself against it.", "how": ["Ask on what she just said: 'when you said X, is that...'"], "items": [{"to": "Kristen", "q": "Is the focus mainly the customer-facing agents, like the chat, SMS and voice support, or broader CX data science too?", "loop": "When she describes the team.", "why": "Tells you which project to lead with."}, {"to": "Kristen", "q": "Is this a new seat, or replacing someone, and who would I report to?", "loop": "When she mentions the team.", "why": "Scope and the hiring manager."}, {"to": "Kristen", "q": "How is the team thinking about level for this search?", "loop": "If level comes up.", "why": "Lets her tell you how flexible the 10 years is."}]}, {"id": "collab", "title": "Before the end: collaborating", "when": "When she asks if you have questions. One.", "why": "Shows you think about the hiring problem with her.", "how": ["Ask one, listen, then tie her answer to one thing you've done."], "items": [{"to": "Kristen", "q": "What has been hardest to find for this role so far, and what made you reach out to me?", "loop": "First choice.", "why": "Tells you what to stress with the hiring manager."}, {"to": "Kristen", "q": "What does the hiring manager care about most: building the agents, evaluating them, or working with the business side?", "loop": "Second.", "why": "Shapes how you prepare the next round."}]}, {"id": "contribute", "title": "At the end: next steps", "when": "The last two minutes.", "why": "Leaves with a clear process and timeline.", "how": ["Two at most, then close, in your words from INTRO.md: “Really appreciate you taking the time today. This was helpful — honestly, the more I hear about what the team is working on, the more excited I am about the fit. Looking forward to hearing about next steps whenever you have them.”"], "items": [{"to": "Kristen", "q": "What does the full interview process look like from here, and the rough timeline?", "loop": "First.", "why": "Your question from INTRO.md."}, {"to": "Kristen", "q": "Is there anything in my background you'd want me to make clearer for the hiring manager?", "loop": "Last.", "why": "Surfaces any concern while you can still answer it."}]}], "traps": [], "tables": [], "admire": "", "kitaruLead": "", "figures": [], "mockHow": "", "mocks": [], "planKicker": "Before the call", "mechTitle": "", "designLink": null, "extra": "<b>Twenty minutes of prep.<\/b> 1. Your intro out loud (45 seconds). 2. Why Home Depot and the level answer: read the versions, pick yours. 3. Your projects: the short V8 version; the eval bench if she asks how you measure quality. 4. Pick one question from each tier.", "emphasis": [], "own": null, "showUp": [["The job is your job.", "The posting's focus is agents that apply 'the reasoning, context, and decision-making patterns used by skilled associates' so customers resolve complex needs themselves, with evaluation (hallucination, groundedness, cost and latency) behind them. That is what you build at alfred_. Say it in their words: intent, the next action, tools and data, evaluation."], ["Handle level calmly.", "The minimum is 10 years. Don't volunteer a number against it; describe scope: you own production agent systems end to end as a founding engineer, for 5,000+ users. Then ask how they're thinking about level for this search."], ["Know their AI.", "Magic Apron (March 2025), now in all 2,000+ US stores and answering millions of questions a month; conversational AI across SMS, chat and phone and AI voice agents being tested in stores (Google Cloud, January 2026); Blueprint Takeoffs for Pros."], ["Stakeholders are a fifth of the job.", "20% business collaboration and 20% project leadership and mentoring. Have one example of working with non-engineers: the founders and the product side at alfred_, deciding what the agent may do alone."], ["Logistics stay short.", "Onsite in Atlanta, start date, pay, work authorization: your answers are in chat. One sentence each."]], "prepLead": "Your intro, why this role, the level answer, your projects, and questions in three tiers.", "storyBlurb": "Your intro, why Home Depot, the level question, why leave alfred_, what you want next, and logistics.", "sources": [{"label": "The posting: Principal Data Scientist - CX (Req189365)", "url": "https://homedepot.wd5.myworkdayjobs.com/CareerDepot/job/STORE-SUPPORT-CENTER-ATLANTA---9090/Principal-Data-Scientist---CX_Req189365", "why": "Agentic workflows for customer self-service, evaluation and reliability, technical leadership; onsite in Atlanta; 10 years minimum."}, {"label": "Home Depot and Google Cloud: agentic AI tools (Jan 2026)", "url": "https://corporate.homedepot.com/news/partnerships/home-depot-and-google-cloud-launch-agentic-ai-tools-help-customers-and-associates", "why": "Project-level Magic Apron, conversational AI across SMS, chat and phone, voice agents in test, a materials list builder for Pros."}, {"label": "Retail Dive: Magic Apron in stores (Sep 2026)", "url": "https://www.retaildive.com/news/the-home-depot-extends-ai-assistance-stores/829240/", "why": "All 2,000+ US stores; text, voice and image; millions of questions a month."}, {"label": "Home Depot: Blueprint Takeoffs (Nov 2025)", "url": "https://corporate.homedepot.com/news/company/home-depot-launches-ai-powered-blueprint-takeoffs", "why": "AI material lists and quotes from blueprints for Pros, in days rather than weeks."}, {"label": "Retail Dive: tech leadership consolidated (2026)", "url": "https://www.retaildive.com/news/home-depot-leadership-tech-innovation/827161/", "why": "800 Atlanta tech roles cut in January; store, supply chain and Pro tech consolidated under the CTO, who leads enterprise agentic AI."}, {"label": "Home Depot: About", "url": "https://corporate.homedepot.com/a   var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {

      if (inStrong) { return part; }

  /* ---------------------------------------------------------------- learn: one path, judged
     LOOP.learn = { lead, onepage, modules: [{ id, title, blurb, sessions, table?, topics: [{ id, title,
     brief, points, figs, production, read, mcq, open, say, avoid, was }] }] }. A private module
     (window.LOOP_PRIVATE[loop id].modules) is appended when present. Each topic opens to four
     steps: Learn, Check (multiple choice, with I don't know and a guess flag), Explain (an open
     question, then the model answer and a self-rating), Say (shut until Explain is tried).
     A topic's level (Know, Partly, Not yet) comes from its latest answers and the rating. */
  var LEARN_KEY = "loop.learn.v1";
  function learnStore() {
    try { var all = JSON.parse(localStorage.getItem(LEARN_KEY) || "{}"); return all[LOOP.id] || { mcq: {}, rate: {}, tried: {} }; }
    catch (err) { console.error("Could not read learning progress", err); return { mcq: {}, rate: {}, tried: {} }; }
  }
  function learnSave(st) {
    try { var all = JSON.parse(localStorage.getItem(LEARN_KEY) || "{}"); all[LOOP.id] = st; localStorage.setItem(LEARN_KEY, JSON.stringify(all)); }
    catch (err) { console.error("Could not save learning progress", err); }
  }
  function learnModules() {
    var mods = ((LOOP.learn && LOOP.learn.modules) || []).slice();
    var priv = window.LOOP_PRIVATE && window.LOOP_PRIVATE[LOOP.id];
    if (priv && priv.modules) { mods = mods.concat(priv.modules); }
    return mods;

  function allTopics() {

  var LEVELS = { know: "Know", partly: "Partly", notyet: "Not yet" };
  function levelOf(t, st) {
    st = st || learnStore();

    (t.mcq || []).forEach(function (q, i) {

      if (!r) { return; }
      any = true; n += 1;
      if (r.ok && !r.guess) { ok += 1; }

    var rate = st.rate[t.id];
    if (!any && !rate) { return null; }
    var all = (t.mcq || []).length;
    var s = n ? ok / n : null;
    if (rate === "notyet" || (s !== null && s < 0.5)) { return "notyet"; }
    if (rate === "know" && (s === null || (s === 1 && n === all))) { return "know"; }
    if (!rate && s === 1 && n === all) { return "know"; }
    return "partly";
  }
  function levelDot(lv) { return '<span class="lv lv-' + (lv || "none") + '" title="' + (lv ? LEVELS[lv] : "Not judged yet") + '"></span>'; }

  /* Jump the reader to a node's top, just under the sticky bar; no animation. */

  /* ctx: { refresh, index, total, prev, next, open(topic, step), startStep } */
  /* A system design from the guide, shown whole inside a topic: the guide in embed mode (no top bar or design

  /* The open topic, Accelerate's way: a bar (where you are, previous and next), then two panes.

  function learnBody(t, ctx) {

    panelSection(host, "In production", panelList(t.production));
    (t.code || []).forEach(function (c) {

  /* One button by a session's title: copies the session's NotebookLM links (x.nlm, gathered at
     build time by site/nlm.js exactly as the tracker's button does), one per line, for
     NotebookLM's Website source. A session without them falls back to its own links. */
  function notebookButton(x) {
    var urls = x.nlm || [], seen = {};
    if (!x.nlm) (function walk(v) {
      if (typeof v === "string") {
        var u = v.replace(/#.*$/, ""), id = u.replace(/\/$/, "");
        if (/^https?:\/\//.test(u) && !/^https?:\/\/(localhost|127\.|\[::1\])/.test(u) && !seen[id]) { seen[id] = 1; urls.push(u); }
      } else if (v && typeof v === "object") {
        for (var k in v) { if (Object.prototype.hasOwnProperty.call(v, k)) { walk(v[k]); } }
      }
    })([x.steps, x.study || []]);
    if (!urls.length) { return null; }
    var label = "Copy " + urls.length + (urls.length === 1 ? " link" : " links") + " for NotebookLM";
    var cp = el("button", "btn nlm-copy", label);
    cp.title = "Paste into NotebookLM: Add source, Website";
    cp.addEventListener("click", function () {
      var text = urls.join("\n");
      function done() { cp.textContent = "Copied"; setTimeout(function () { cp.textContent = label; }, 1500); }
      function fallback() {
        var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); done(); } catch (e) { cp.textContent = "Copy failed"; }
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, fallback); } else { fallback(); }
    });
    return cp;
  }

  /* ---------------------------------------------------------------- a long loop's own tabs

  function isoToday() {

  /* -------- Daily two: one problem at a time, the problem left and your work right */

        panelSection(c.left, "What worked", panelList(x.good, "mk-good"));
        panelSection(c.left, "What did not", panelList(x.bad, "mk-bad"));
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.say && x.say.length) { c.right.appendChild(transcript(x.say, "You", "")); }
        panelSection(c.right, "How to approach it", panelList(x.approach));
        (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.right.appendChild(f); } });
        var links = [];
        if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
        if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
        if (links.length) { c.right.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      }
    });
  }

  /* A Prep question can be marked revised; the mark is kept in this page's storage. */
  function isRevised(id) { return !!own().rev[id]; }
  function setRevised(id, on) {
    var o = own();
    if (on) { o.rev[id] = stamp(); } else { delete o.rev[id]; }
    writeJSON(OWN, o);
  }
  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    if (tab === "overview" && p[0] && p[0] !== "overview" && LOOP.learn && p[1]) {
      var to = null;
      learnModules().forEach(function (m) { m.topics.forEach(function (t) { if ((t.was || []).indexOf(p[1]) >= 0 || t.id === p[1]) { to = t.id; } }); });
      if (to) { history.replaceState(null, "", link("learn", to)); return { tab: "learn", anchor: to }; }
    }
    return { tab: tab, anchor: p[1] || null, sub: p[2] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = (t.id !== current && lastHash(t.id)) || link(t.id);
      a.addEventListener("click", function () { restoreNext = true; });
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = []; document.body.removeAttribute("data-wide");
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "rounds") { tabRounds(main); }
      else if (r.tab === "research") { tabResearch(main); }
      else if (r.tab === "learn") { tabLearn(main, r.anchor); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "live") { tabLive(main); }
      else if (r.tab === "mocks") { if (cdParts("mocks").length) { tabCoding(main, r.anchor, "mocks"); } tabMocks(main); }
      else if (r.tab === "coding") { tabCoding(main, r.anchor); }
      else if (r.tab === "lld") { tabCoding(main, r.anchor, "lld"); }
      else if (r.tab === "concurrency") { tabCoding(main, r.anchor, "concurrency"); }
      else if (r.tab === "daily") { tabDaily(main, r.anchor, r.sub); }
      else if (r.tab === "lp") { tabLp(main, r.anchor); }
      else if (r.tab === "plan") { tabPlan(main, r.anchor); }
      else if (r.tab === "card") { tabCard(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    curTab = r.tab; document.body.setAttribute("data-tab", r.tab);
    var lh = cdState().lastHash || {}; lh[r.tab] = location.hash; cdSave("lastHash", lh);
    drawTabs(r.tab); drawSide(r.tab); drawToday(); progress();
    var key = /^(daily|plan|coding|lld)$/.test(r.tab) ? location.hash : r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    var back = restoreNext && POS[location.hash] != null; restoreNext = false;
    if (back) { var y = POS[location.hash]; requestAnimationFrame(function () { window.scrollTo({ top: y, behavior: "instant" }); }); }
    else if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var c = document.getElementById("count");
    if (!LOOP.when_iso) { c.textContent = "Date to be set"; return; }
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
</html>
