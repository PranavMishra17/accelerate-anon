], "production": ["Commure's agents cover scheduling, rescheduling, cancellations, confirmations, FAQs and intake, integrated with the EHR and telephony in real time", "A common split for a 45-minute round: about 3 minutes of requirements, 10 for the high-level design, the rest on two deep dives", "Phone systems keep a fallback route for every failure (overflow to an agent queue or voicemail), and an AI front door needs the same"], "mcq": [{"q": "In the first three minutes of the design round, what should you pin down before drawing boxes?", "o": ["Which model and speech vendors to use", "The database schema for appointments", "How many replicas to run at launch", "Which call types are in scope, what goes to staff, and the volume and latency targets", "Which FHIR version the health system's EHR supports"], "a": 3, "why": "Scope, handoff and numbers drive everything after. Vendors, schemas and replicas are answers to questions you have not asked yet."}, {"q": "Why draw the path of one call before any box for scale?", "o": ["Latency, dispatch, write-back and handoff all hang off that path", "Interviewers grade the diagram by its first box", "Scale is out of scope in voice design rounds", "One call is enough to compute the replica count", "It avoids having to discuss the EHR integration"], "a": 0, "why": "The single-call path is the skeleton. Scale is the same path multiplied, and its weak points only show once the path is drawn."}, {"q": "Which requirement most changes the design if you miss it?", "o": ["The agent should sound human", "Calls should finish within two minutes", "Every call should be fully automated", "Transcripts should be searchable by staff", "Every call must be answered, so failures fall through to a human queue"], "a": 4, "why": "A patient line cannot go silent. That one requirement adds a fallback route, health checks on vendors and the EHR, and a staff handoff path."}], "open": {"q": "Design a voice agent that answers a health system's patient calls. Start with requirements.", "probe": "Whether he scopes before building, and treats the human fallback as a requirement.", "a": ["In scope: scheduling, rescheduling, cancellations, confirmations, FAQs, intake", "Out: clinical questions and anything uncertain, handed to staff", "Every call answered: a human fallback when anything fails", "Numbers: about 800 calls a day, about 6 at once in the peak hour, about 25 in a burst", "A latency target for first audio and turns, then the path of one call"]}, "say": ["I'd start with what the agent does and what it never does. Scheduling, changes, confirmations, FAQs and intake are in; anything clinical goes to a person.", "Then the numbers. For a system at around 800 calls a day that's maybe 6 calls at once at peak and 25 in a burst, so this is a latency problem more than a scale problem.", "And one requirement I'd say out loud: every call gets answered, so if anything breaks the call falls through to staff."], "avoid": ["Jumping to vendor names before scope and numbers"], "was": [], "res": [{"kind": "video", "req": false, "label": "AI Voice Agents For Healthcare Practices: How It Works", "url": "https://www.youtube.com/watch?v=5kesK0mhqDk", "m": 19, "yt": {"id": "5kesK0mhqDk", "ch": "Brendan Jowett"}, "why": "The call types a healthcare voice agent handles and what stays with staff."}, {"kind": "video", "req": false, "label": "How Voice AI Systems Really Work: The Complete Architecture Guide", "url": "https://www.youtube.com/watch?v=rpqvo74ursk", "m": 16, "yt": {"id": "rpqvo74ursk", "ch": "Quincy McCants "}, "why": "The path of one call through a voice system, before any scale boxes."}, {"kind": "read", "req": true, "label": "Commure: voice AI for patient call automation", "url": "https://www.commure.com/blog-agents/voice-ai-systems-patient-call-automation", "m": 10, "why": "What they automate and what they hand to staff, in their own words"}]}, {"id": "design-hld", "title": "The high-level design", "brief": "The call comes in over SIP into a room per call; a worker runs a fast agent on the call and a heavier agent in parallel; tools read and write the schedule through an integration layer in front of the EHR; a handoff path transfers to staff with a summary; every call leaves a record. The nuance: the agent never answers schedule questions from the model, only from a tool reading the EHR at call time.", "points": ["Telephony: the health system's number routes over a SIP trunk into a room per call; a worker is dispatched into it", "Agents: a fast agent answers on the call while a heavier agent works the same request in parallel", "Tools: read slots, hold, book, cancel and look up FAQs, all through an integration layer, never from model memory", "Integration layer: one booking interface for the agent, with an adapter per EHR behind it", "Handoff: a warm transfer to staff with a short summary, so the patient does not repeat themselves", "Call record: transcript, actions, outcome and timings, for audit and for improving the agent"], "figs": ["callPath", "voiceParallel"], "production": ["Commure describes its agents as integrated with the EHR and telephony in real time, so the agent works from the live schedule", "Warm transfer with a whispered or on-screen summary is standard in contact centres and cuts handle time for staff", "An adapter per EHR keeps vendor differences (FHIR APIs, vendor scheduling APIs, HL7 v2 messages) out of the agent", "In the agent he owns, the lean and main agents run in parallel so the caller hears something fast and the heavy work still happens"], "mcq": [{"q": "Where should the agent get open appointment times from?", "o": ["The model's context, loaded with the week's schedule at call start", "A tool that reads the EHR's schedule at call time", "A nightly copy of the schedule cached in the worker", "The model's memory of earlier calls", "The patient portal, read during the call"], "a": 1, "why": "Slots change by the minute. Reading them through a tool at call time keeps the answer true and keeps the model from inventing times."}, {"q": "Why put an integration layer between the agent's tools and the EHR?", "o": ["The EHR only accepts calls from servers inside the hospital", "It lets the model write queries against the EHR safely", "Each EHR differs, so the agent sees one booking interface and adapters map it per vendor", "FHIR is too slow for live calls, so the layer caches every booking", "It removes the need for a business associate agreement"], "a": 2, "why": "Health systems run different EHRs with different scheduling APIs. An adapter layer keeps the agent and its tests the same across them."}, {"q": "A caller asks something the agent should not handle. What does a good handoff look like?", "o": ["A warm transfer to staff with a short summary, so the patient does not repeat themselves", "End the call and text the clinic's number", "Send the caller to a voicemail box for staff", "Keep the caller talking while the model searches for an answer", "A cold transfer to the main line, with the reason logged"], "a": 0, "why": "The handoff is part of the product. A summary carried to staff saves the patient time and the staff member a second intake."}], "open": {"q": "Draw the high-level design. Where does the schedule come from, and what happens when the agent cannot help?", "probe": "Whether the boxes are the right ones and the agent is grounded in live data.", "a": ["SIP into a room per call; a worker dispatched into it", "A fast agent on the call, a heavier agent in parallel", "Tools through an integration layer to the EHR, read at call time", "Warm transfer to staff with a summary when the agent cannot help", "A record per call for audit and improvement"]}, "say": ["The call comes in over SIP into its own room, and a worker joins it. That's the same shape as the agent I own.", "The agent never answers from memory. Slots come from a tool reading the EHR during the call, through a layer that hides which EHR it is.", "When it can't help, it hands off warm, with a summary, so the patient isn't starting over."], "avoid": ["Implying you have integrated an EHR: say how you would"], "was": [], "res": [{"kind": "keep", "src": "site", "req": true, "label": "Guide: the patient-call design's deep dives", "url": "../SYSTEM%20DESIGN.html#/designs/voice-agent/deepdives", "m": 15, "why": "Parallel agents, turn-taking, write-back and evals for this design"}, {"kind": "video", "req": false, "label": "Voice Agent Pipeline Explained: VAD, STT, LLM and TTS", "url": "https://www.youtube.com/watch?v=SPB2T-eLrOg", "m": 11, "why": "The loop the high-level design is built around.", "yt": {"id": "SPB2T-eLrOg", "ch": "LiveKit"}}]}, {"id": "design-writeback", "title": "Booking without double booking", "brief": "The write path is hold the slot, read it back, confirm, then commit with an idempotency key, so a retry or a hang-up never books twice. The nuance: many EHR scheduling APIs offer neither a hold nor idempotency keys. Then the read-back is a race you settle at commit, and the idempotency is a ledger you keep yourself, with a read before any retry.", "points": ["Read back: date, time, provider and location are said to the patient before anything is written", "No hold: if the API cannot hold a slot, re-check it at commit and offer the next one on conflict", "Idempotency: key the commit on the call and the slot; if the EHR has no key support, keep your own ledger of attempts", "Unknown outcome: after a timeout, read the patient's appointments before retrying, never write blind", "Rules in code: visit type, new or established patient, provider and length decide valid slots, so the tool only offers those"], "figs": ["idempotencyKey"], "production": ["FHIR R4 models scheduling with Schedule, Slot and Appointment resources; Epic, Oracle Health and athenahealth publish FHIR APIs, but scheduling write support varies by vendor and site", "Where FHIR writes are missing, integrations fall back to the vendor's own scheduling APIs or HL7 v2 scheduling messages", "Idempotency keys as payment APIs use them: the first result is stored under the key and returned for every retry", "In the agent he owns, writes go through an execution layer with idempotency and are confirmed by the person first"], "mcq": [{"q": "The EHR's API cannot hold a slot, and the patient takes 20 seconds to confirm. What do you do at commit?", "o": ["Book it anyway, since the read-back counts as a hold", "Skip the read-back so the window is shorter", "Book first, read back, and cancel if the patient says no", "Block the provider's calendar for the length of the call", "Re-check availability as part of the commit, and offer the next slot if it was taken"], "a": 4, "why": "Without a hold, someone else can take the slot during the read-back. Checking at commit turns a silent double booking into a short apology and a new offer.", "pair": "hold-vs-key"}, {"q": "The booking request times out. What do you do before retrying?", "o": ["Retry at once with a new idempotency key", "Read the patient's appointments to see if it landed, and retry with the same key only if not", "Tell the patient it failed and ask them to call back", "Retry three times, then hand off to staff", "Assume it booked and confirm it to the patient"], "a": 1, "why": "A timeout means the outcome is unknown. A read settles it; a retry with the same key is safe; a new key or a blind retry risks a second booking.", "pair": "hold-vs-key"}, {"q": "Where should a rule like 'new patients need a 40-minute slot' live?", "o": ["In the system prompt, so the model filters slots", "In the FAQ knowledge base the agent searches", "With staff, who fix wrong bookings afterwards", "In code in the scheduling tool, which only offers valid slots", "In the notes field for each provider in the EHR"], "a": 3, "why": "A rule the model is asked to follow is a rule it can break. A tool that never offers an invalid slot cannot be talked out of it."}], "open": {"q": "How do you make sure a retried or interrupted booking never double-books a slot, given EHR APIs that may not support holds?", "probe": "Idempotency and race handling against a real, imperfect external system.", "a": ["Read back the booking and get a yes before any write", "Hold the slot if the API allows; if not, re-check at commit and offer the next slot", "Commit with an idempotency key; keep a ledger if the EHR has none", "On a timeout, read the patient's appointments before any retry", "Encode scheduling rules in the tool, not the prompt"]}, "say": ["The way I'd do it: read the booking back, get a yes, then commit with an idempotency key so a retry can't book twice.", "The catch is a lot of EHR APIs can't hold a slot, so I'd re-check at commit and offer the next one if it's gone. And after a timeout I'd read before I retry.", "I haven't integrated an EHR, but this is the same write path I run in the agent I own: draft, confirm, then an idempotent write."], "avoid": ["Claiming to know a specific EHR's API in depth"], "was": [], "res": [{"kind": "keep", "src": "site", "req": true, "label": "Session wc23: Your voice agent at depth", "url": "../index.html#/w/wc23", "m": 25, "why": "Step 2: the write path in your own agent, draft, restate, confirm"}, {"kind": "video", "req": false, "label": "Idempotency - What it is and How to Implement it", "url": "https://www.youtube.com/watch?v=XAccGbtl3Z8", "m": 9, "why": "The retry-safe commit step.", "yt": {"id": "XAccGbtl3Z8", "ch": "Alex Hyett"}}]}, {"id": "design-safety", "title": "Keeping a patient call safe", "brief": "Decide in code what the agent may do and hand everything else to a person: clinical questions, emergencies and anything it is unsure of. Verify who is calling before saying anything about their care. Under HIPAA, the audio, transcript and call record are PHI, so every vendor that touches them needs a business associate agreement. He has not built under HIPAA; this is how he would approach it.", "points": ["Scope in code: an allowlist of actions; anything outside it, or below a confidence bar, goes to staff", "Clinical line: symptoms and medical questions go to clinical staff; emergency words trigger an instruction to call 911 and a transfer", "Identity: verify the caller (for example name and date of birth) before revealing or changing anything about their appointments", "PHI: audio, transcripts and call records hold PHI; telephony, speech and model vendors that process them each need a business associate agreement", "Minimum necessary: give the model and the logs only the PHI the task needs, and keep it out of application logs", "Learn from calls: flag the calls that went wrong, turn them into test cases, and gate every change on them"], "figs": ["thresholdBands", "benchLoop"], "production": ["HIPAA's Security Rule asks for access controls, audit controls and transmission security; encryption in transit and at rest is standard practice", "Many model and speech providers offer business associate agreements and zero data retention terms for healthcare customers; only vendors under one touch call data", "An audit trail of every action (who, what, when, from which call) is what a covered entity needs when a patient disputes a booking", "Confidence bands: act when sure, confirm when unsure, hand off below the floor"], "mcq": [{"q": "A caller says they have had chest pain since this morning and want an appointment. What should the agent do?", "o": ["Book the earliest slot, since that is the request", "Ask follow-up questions to judge severity, then book", "Tell them to call 911 if it is an emergency, and transfer to clinical staff", "Answer from the model's medical knowledge, then book", "Book the slot and flag it for a nurse to review later"], "a": 2, "why": "Triage is clinical work. The agent's job is to recognise the signal, give the emergency instruction and get a clinician on the line."}, {"q": "Which of these is PHI under HIPAA?", "o": ["A call recording in which a patient gives their name and reason for the visit", "A clinic's public opening hours", "Daily call counts with no identifiers", "The agent's system prompt", "The list of a clinic's providers and specialties"], "a": 0, "why": "PHI is health information tied to an identifiable person. A recording with a name and a reason for visit is exactly that; aggregate counts are not.", "pair": "phi-baa"}, {"q": "You want to use a new speech-to-text vendor on patient calls. What must be in place first?", "o": ["Patient consent on every call before any vendor is used", "Nothing, if the vendor deletes audio within 30 days", "Nothing, since transcription is not storage", "An on-premises deployment, since HIPAA bans cloud vendors", "A business associate agreement, because the vendor will process PHI"], "a": 4, "why": "Any vendor that creates, receives or processes PHI on the health system's behalf is a business associate (or a subcontractor of one) and needs a BAA. HIPAA does not ban cloud vendors.", "pair": "phi-baa"}], "open": {"q": "How would you keep a patient call from going wrong, and how do you handle PHI in this design?", "probe": "Patient-centred judgement, and whether he is honest about what he has and has not done.", "a": ["Code decides what the agent may do; clinical, urgent and uncertain calls go to people", "Answer from the schedule through tools, and confirm before any write", "Verify identity before discussing a patient's care", "Treat audio, transcripts and records as PHI: BAAs with every vendor, minimum necessary, no PHI in logs, an audit trail", "Turn real failures into test cases and gate changes on them"]}, "say": ["Decide in code what the agent may do, and hand everything else to a person: clinical questions, anything it isn't sure of. Answer from the schedule through tools, never from the model's memory, and confirm a booking back to the patient before writing it.", "Then learn from real calls: flag the ones that went wrong, turn them into test cases, and run every change against them before it ships. That's how I work at alfred_.", "I haven't built under HIPAA, so I'd say how I'd approach it: the audio and transcripts are PHI, every vendor touching them needs a BAA, and the model and logs only see what the task needs."], "avoid": ["Implying you have shipped HIPAA-regulated systems", "Reciting HIPAA rule numbers you cannot explain under a follow-up"], "was": ["q-how-would-you-keep-a-patient-call-from-going-wrong"], "res": [{"kind": "video", "req": true, "label": "HIPAA Training 101: Who Needs HIPAA Business Associate Agreements?", "url": "https://www.youtube.com/watch?v=vlPHweVIk-0", "m": 2, "yt": {"id": "vlPHweVIk-0", "ch": "Compliancy Group"}, "why": "A two minute answer to who needs a BAA, which covers every vendor touching call audio."}, {"kind": "keep", "src": "site", "req": true, "label": "Guide: the patient-call design's deep dives", "url": "../SYSTEM%20DESIGN.html#/designs/voice-agent/deepdives", "m": 15, "why": "Write-back without double booking, and evals"}]}, {"id": "design-pitch", "title": "Your story for Commure", "brief": "Three short drills: an intro in 90 seconds, why Commure in 60, your voice work in two minutes, alfred_'s live agent first and MockFlow-AI second. The nuance is honesty: you have not worked in healthcare, and the strongest answer says so, then shows what transfers (a live agent doing real work safely) and how you would learn the rest.", "points": ["Intro: 90 seconds; who you are, what you own, why voice agents", "Why Commure: their agents finish the job and write back to the EHR, the hardest version of the agent you already own", "Voice work: alfred_'s live agent first (SIP and WebRTC into LiveKit, safe writes), then MockFlow-AI, built from scratch", "Honesty: no HIPAA or EHR work in production; say how you would approach it", "Close: confirm next steps, and ask one real question about their agents"], "figs": [], "production": ["Commure's agents answer patient calls end to end: scheduling, rescheduling, cancellations, confirmations, FAQs and intake", "Commure reports around 30 to 80% of calls resolved without staff (vendor-reported); a good question is how that varies by call type", "Their stated values are speed, ownership, plain communication and care for the patient on the call; each story should show one"], "mcq": [{"q": "The recruiter asks whether you have healthcare experience. Which answer is best?", "o": ["Imply alfred_ handles medical data, so it counts", "No production healthcare work; then what transfers, and how you would approach HIPAA and the EHR", "Yes, since calendars and appointments are much the same", "No, and move on to the next question", "A detailed tour of HIPAA rules to show you know them"], "a": 1, "why": "An honest no with a clear bridge is credible and matches their value of plain communication. A stretched yes falls apart at the first follow-up."}, {"q": "Which 'why Commure' fits their stated values best?", "o": ["Voice AI is the fastest growing part of AI right now", "Commure is well funded with a strong brand", "I want to move into healthcare to learn the domain", "Their agents finish the job and write back to the EHR, the hard version of what I own, measured by patients seen", "The role is remote friendly and pays well"], "a": 3, "why": "It ties their product to your work and to the patient outcome. The others are about you or the market, not about them."}, {"q": "In a 15-minute recruiter screen, how deep should the voice-work answer go?", "o": ["Ten minutes covering the whole architecture", "One sentence, since recruiters are not technical", "About two minutes: what you own, one design choice and why, then room for questions", "A walk through the code structure", "Mostly MockFlow-AI, since it is the newer system"], "a": 2, "why": "A screen checks fit and clarity. Two minutes with one concrete design choice shows depth without eating the call."}], "open": {"q": "Tell me about yourself, and why Commure?", "probe": "Clarity, fit with the r <script>

(function () {

  /* ---------------------------------------------------------------- storage */

    if (!isStudy && (it.where || it.url)) { pre.push(it.url ? { url: it.url, label: it.where || it.url } : { book: it.where }); }
    learn(left, { figs: [], read: pre.concat(isStudy ? (it.res || []) : (it.links || []), it.read || []), sdLinks: it.sdLinks });
    var say = isStudy ? it.say : it.ans;
    if (say || it.out || SAYS.test(it.t || "")) { work.appendChild(mineBox(key, promptOf(it))); }
    if (say) { work.appendChild(sayToggle(isStudy ? "The idea, in the words you would use" : "What you would say", transcript(Array.isArray(say) ? say : [say], "", ""))); }
    if (!work.children.length) { work.remove(); body.classList.add("one"); }
    row.appendChild(body);
    return row;
  }

  function toggleSession(x) {
    var t = tracker();
    if (t.done[x.id]) {
      delete t.done[x.id];
    } else {
      stepKeys(x).forEach(function (k) { if (!t.steps[k]) { t.steps[k] = true; t.steps[k + ":at"] = stamp(); } });
      if (x.hasTrackerQuiz && !(t.quiz[x.id] && t.quiz[x.id].passed)) {
        t.quiz[x.id] = { score: 0, passed: true, at: stamp(), missed: [], via: "interview page" };
      }
      t.done[x.id] = stamp();
    }
    writeJSON(TRACKER, t);
    route();
  }

  /* ---------------------------------------------------------------- mocks */
  /* A mock reads in two parts: the read (how it went, what landed, what to fix first),
     then the conversation, one exchange at a time. Each exchange shows who asked what and
     what you said, with a verdict; it opens to why, how to approach it, and the answer to
     say, behind the same toggle the Prep tab uses. */
  var VERDICT = { landed: "Landed", partly: "Partly", missed: "Missed", gap: "Gap: you did not have an answer" };
  function tabMocks(host) {
    var s = heading(host, "mock", "Run in chat", "Mock interviews");
    s.appendChild(el("p", "lead", inl(LOOP.mockHow)));
    if (!LOOP.mocks.length) {
      s.appendChild(el("p", "when", "None yet. After a mock in chat, its read and its exchanges appear here. The latest two are kept."));
    }
    LOOP.mocks.slice(-2).reverse().forEach(function (m, mi) { drawMock(host, m, mi); });
  }
  function drawMock(host, m, mi) {
    var pre = m.id || "m" + mi;
    var s = heading(host, pre, m.when, m.title);
    var ex = m.exchanges || [];
    if (!ex.length && m.critique) { s.appendChild(el("p", "", inl(m.critique))); return; }
    var tally = {};
    ex.forEach(function (x) { tally[x.verdict] = (tally[x.verdict] || 0) + 1; });
    s.appendChild(el("p", "mk-tally", ["landed", "partly", "missed", "gap"].filter(function (k) { return tally[k]; })
      .map(function (k) { return '<span class="vd vd-' + k + '"></span>' + tally[k] + " " + (k === "gap" ? "gaps" : k); }).join('<span class="sep"></span>') +
      '<span class="sep"></span>' + ex.length + " exchanges"));
    (m.read || []).forEach(function (p) { s.appendChild(el("p", "mk-read", inl(p))); });
    if (m.landed && m.landed.length) {
      s.appendChild(el("h3", "mk-h", "What landed"));
      var ul = el("ul", "mk-list");
      m.landed.forEach(function (t) { ul.appendChild(el("li", "", inl(t))); });
      s.appendChild(ul);
    }
    if (m.fix && m.fix.length) {
      s.appendChild(el("h3", "mk-h", "Fix these first"));
      var ol = el("ol", "mk-list mk-fix");
      m.fix.forEach(function (f) {
        var li = el("li", "", inl(f.t) + " ");
        var at = ex.findIndex(function (x) { return x.id === f.ref; });
        if (at >= 0) { li.appendChild(openLink("See turn " + (at + 1), m, at)); }
        ol.appendChild(li);
      });
      s.appendChild(ol);
    }
    /* The turns, one line each; the conversation itself opens in one screen. */
    var c = heading(host, pre + "-talk", "Every turn, in one screen", "The conversation");
    var go = el("button", "btn primary", "Open the conversation");
    go.addEventListener("click", function () { openConvo(m, 0); });
    c.appendChild(el("div", "acts")).appendChild(go);
    var list = el("ol", "turns");
    ex.forEach(function (x, i) {
      var li = el("li");
      var b = el("button", "turn");
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) +
        '</span><span class="tw spk-' + esc((x.who || "").toLowerCase()) + '">' + esc(x.who) + "</span>";
      b.addEventListener("click", function () { openConvo(m, i); });
      li.appendChild(b); list.appendChild(li);
    });
    c.appendChild(list);
  }
  function openLink(text, m, i) {
    var a = el("button", "linkish", esc(text));
    a.addEventListener("click", function () { openConvo(m, i); });
    return a;
  }

  /* One screen, shared by mocks and the Prep banks: a list on the left, the chosen item on
     the right. The item's header is small; under it, the light column is for understanding
     and the dark sheet is what to say, each scrolling on its own. Arrows move; Escape closes. */
  var convo = document.getElementById("convo");
  function panelSection(host, label, nodes) {
    if (!nodes.length) { return; }
    host.appendChild(el("div", "lab", label));
    nodes.forEach(function (n) { host.appendChild(n); });
  }
  function panelList(items, cls) {
    if (!items || !items.length) { return []; }
    var u = el("ul", "mk-list " + (cls || ""));
    items.forEach(function (t) { u.appendChild(el("li", "", inl(t))); });
    return [u];
  }
  /* o: { title, sub, label, count, row(i) -> html for the rail, draw(i, pane), start } */
  function openPanel(o) {
    var cur = o.start || 0;
    convo.innerHTML = "";
    convo.setAttribute("aria-label", o.label || o.title);
    var shell = el("div", "cv");
    var rail = el("nav", "cv-rail");
    rail.appendChild(el("div", "cv-title", "<b>" + esc(o.title) + "</b>" + (o.sub ? "<span>" + esc(o.sub) + "</span>" : "")));
    var rows = [];
    for (var i = 0; i < o.count; i++) {
      (function (i) {
        var b = el("button", "turn");
        b.innerHTML = o.row(i);
        b.addEventListener("click", function () { show(i); });
        rail.appendChild(b);
        rows.push(b);
      }(i));
    }
    rail.appendChild(el("div", "cv-keys", "Up and down arrows move. Escape closes."));
    var pane = el("section", "cv-pane");
    var close = el("button", "cv-close", "Close");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", function () { convo.close(); });
    shell.appendChild(rail); shell.appendChild(pane);
    convo.appendChild(close); convo.appendChild(shell);
    function show(i) {
      cur = i;
      rows.forEach(function (b, j) { b.classList.toggle("on", j === i); if (j === i) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); } });
      rows[i].scrollIntoView({ block: "nearest" });
      pane.innerHTML = "";
      o.draw(i, pane, function () { rows[i].innerHTML = o.row(i); });
      [].forEach.call(pane.querySelectorAll(".cv-col"), function (c) { c.scrollTop = 0; });
    }
    convo.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = cur + (e.key === "ArrowDown" ? 1 : -1);
        if (n >= 0 && n < o.count) { show(n); rows[n].focus(); }
      }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    rows[cur].focus();
  }
  function panelCols(pane, leftTitle, rightTitle) {
    var cols = el("div", "cv-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "cv-col cv-say");
    left.appendChild(el("h3", "cv-h", leftTitle));
    right.appendChild(el("h3", "cv-h", rightTitle));
    cols.appendChild(left); cols.appendChild(right);
    pane.appendChild(cols);
    return { left: left, right: right, cols: cols };
  }

  /* A mock: what they asked and how it landed; what you said; what to say. */
  function openConvo(m, start) {
    var ex = m.exchanges;
    openPanel({
      title: m.title, sub: m.when, label: "Mock conversation", count: ex.length, start: start,
      row: function (i) {
        var x = ex[i];
        return '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) + "</span>";
      },
      draw: function (i, pane) {
        var x = ex[i], who = (x.who || "").toLowerCase();
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q spk-" + who, '<span class="ex-who">Turn ' + (i + 1) + " of " + ex.length + ", " + esc(x.who) + "</span>" + inl(x.q)));
        head.appendChild(el("p", "cv-verdict", '<span class="vd vd-' + esc(x.verdict) + '"></span><b>' + esc(VERDICT[x.verdict] || x.verdict) + ".</b> " + inl(x.why || "")));
        if (x.tests) { head.appendChild(el("p", "cv-tests", "<b>They were testing:</b> " + inl(x.tests))); }
        pane.appendChild(head);
        var c = panelCols(pane, "What you said", "What to say");
        panelSection(c.left, "In short", (x.said || []).map(function (p) { return el("p", "ex-said", inl(p)); }));
        panelSection(c.left, "What worked", panelList(x.good, "mk-good"));
        panelSection(c.left, "What did not", panelList(x.bad, "mk-bad"));
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.say && x.say.length) { c.right.appendChild(transcript(x.say, "You", "")); }
        panelSection(c.right, "How to approach it", panelList(x.approach));
        (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.right.appendChild(f); } });
        var links = [];
        if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
        if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
        if (links.length) { c.right.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      }
    });
  }

  /* A Prep question can be marked revised; the mark is kept in this page's storage. */
  function isRevised(id) { return !!own().rev[id]; }
  function setRevised(id, on) {
    var o = own();
    if (on) { o.rev[id] = stamp(); } else { delete o.rev[id]; }
    writeJSON(OWN, o);
  }
  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    if (tab === "overview" && p[0] && p[0] !== "overview" && LOOP.learn && p[1]) {
      var to = null;
      learnModules().forEach(function (m) { m.topics.forEach(function (t) { if ((t.was || []).indexOf(p[1]) >= 0 || t.id === p[1]) { to = t.id; } }); });
      if (to) { history.replaceState(null, "", link("learn", to)); return { tab: "learn", anchor: to }; }
    }
    return { tab: tab, anchor: p[1] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = link(t.id);
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = [];
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "rounds") { tabRounds(main); }
      else if (r.tab === "research") { tabResearch(main); }
      else if (r.tab === "learn") { tabLearn(main, r.anchor); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "mocks") { tabMocks(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    drawTabs(r.tab); drawSide(r.tab); progress();
    var key = r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var c = document.getElementById("count");
    if (!LOOP.when_iso) { c.textContent = "Date to be set"; return; }
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
</html>
