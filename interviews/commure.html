 "o": ["Edge functions cannot make outbound network calls", "A call lasts minutes and needs warm models and an open media connection, beyond a function's limits", "Edge functions cannot read environment variables", "Edge functions always respond more slowly than containers", "LiveKit cannot dispatch to anything but a container"], "a": 1, "why": "Functions are bounded in wall clock, CPU and memory and are torn down after the request. A call is long and stateful.", "pair": "function-vs-worker"}, {"q": "Which job fits an edge function best?", "o": ["Holding a WebSocket to a speech model for a whole call", "Keeping a voice activity model warm in memory", "Running a 20-minute batch transcription", "A quick authorization check that returns a scoped token", "Consuming a queue continuously"], "a": 3, "why": "Short, stateless request and response is what functions do well. The others outlive a request or need warm state.", "pair": "function-vs-worker"}, {"q": "What does a long-running worker cost you that an edge function does not?", "o": ["You pay for it while it sits idle", "It cannot keep state between requests", "It must finish within 2 s of CPU", "It cannot scale past one instance", "It cannot open outbound connections"], "a": 0, "why": "A function scales to zero between requests. A worker stays up, which is the point and the cost."}], "open": {"q": "Draw where each piece of a voice agent runs. Why is the agent a container and not a serverless function?", "probe": "Whether you choose infrastructure by lifetime and state, with reasons.", "a": ["Edge function: short, stateless, time-limited, scales to zero", "Worker: holds a call for minutes, warm models, open connections", "Auth check as a function; the agent as a worker", "Trade-off: workers cost money idle and need drain on deploy", "Example: Supabase functions cap CPU at 2 s and memory at 256 MB, so a call can't live there"]}, "say": ["The way I decide is lifetime and state. If the work is shorter than the request and holds no state, it's a function. A call lasts minutes and needs warm models and an open media connection, so it's a long-running worker. In alfred_ the voice agent is a Python worker, and its only door to the backend is an authorize function with a short time budget. That split is pretty much the rule in practice."], "avoid": ["Saying functions are slow: the limit is lifetime and state, not speed"], "was": [], "res": [{"kind": "video", "req": false, "label": "Supabase Edge Functions Explained", "url": "https://www.youtube.com/watch?v=za_loEtS4gs", "m": 7, "yt": {"id": "za_loEtS4gs", "ch": "Supabase"}, "why": "What an edge function is and its short-lived, request-bound model."}, {"kind": "video", "req": false, "label": "Edge functions VS Serverless functions", "url": "https://www.youtube.com/watch?v=M2KUAb1FH1Y", "m": 8, "yt": {"id": "M2KUAb1FH1Y", "ch": "Tuomo Kankaanpää"}, "why": "Compares the two runtimes by lifetime and limits."}, {"kind": "read", "req": true, "label": "Supabase: Edge Functions limits", "url": "https://supabase.com/docs/guides/functions/limits", "m": 3, "why": "The exact limits that rule out holding a call"}, {"kind": "read", "req": false, "label": "LiveKit: server lifecycle", "url": "https://docs.livekit.io/agents/server/lifecycle", "m": 3, "why": "Capacity, load balancing and drain on deploy"}]}, {"id": "backend-pushpull", "title": "Push and pull, and at-least-once", "brief": "Pull: jobs sit in a queue and workers claim them; in Postgres, SKIP LOCKED lets many workers grab different rows without waiting, and a lease with a heartbeat turns a crash into a retry. Push: a dispatcher hands work to a worker it chose, as LiveKit does with calls. The nuance: leases give at-least-once delivery, so a job can run twice, and every effect it has must be safe to repeat.", "points": ["SKIP LOCKED: each worker skips rows others hold, so no two take the same job and none wait", "Lease: claimed_at plus a timeout; a heartbeat extends it while the worker is alive", "At-least-once: a job may run twice, never zero times; effects must be idempotent", "Push: a dispatcher picks the worker; fits live sessions that can't wait", "Pull: workers pick the work; fits jobs that can wait, retry and survive a crash"], "figs": ["skipLocked", "queue"], "production": ["Postgres: FOR UPDATE SKIP LOCKED in the locking clause, the basis of most Postgres-backed job queues", "AWS SQS standard queues: at-least-once delivery, so consumers must be idempotent", "Kleppmann: a lease alone is unsafe after a long pause; fencing tokens stop a stale worker from writing", "Crunchy Data: message queuing in native Postgres, without a separate broker"], "mcq": [{"q": "What does SKIP LOCKED add over a plain SELECT ... FOR UPDATE?", "o": ["It deletes the row once a worker claims it", "It locks the whole table so only one worker runs", "Workers skip rows others have locked instead of waiting, so they claim different jobs in parallel", "It guarantees each job runs exactly once", "It retries a failed job automatically"], "a": 2, "why": "Plain FOR UPDATE makes the second worker wait on the first. SKIP LOCKED moves it on to the next free row."}, {"q": "A worker sends a reminder SMS, then crashes before marking the job done. With leases, what happens?", "o": ["The job is lost because the worker held the lock", "The database rolls back the SMS", "The job stays locked forever", "The queue marks it done because the send succeeded", "The lease expires, another worker claims the job, and the SMS goes again unless the send is idempotent"], "a": 4, "why": "The queue only knows the job was not marked done. It retries, and the effect repeats unless it is keyed.", "pair": "at-least-once"}, {"q": "Which delivery guarantee does a lease-based queue give you?", "o": ["Exactly once, because the row is locked", "At least once: a job may run twice, never zero times", "At most once: a crashed job is dropped", "Exactly once, if heartbeats are frequent enough", "Strict order, one job at a time"], "a": 1, "why": "A crash after the effect and before the commit means a rerun. Exactly once has to be built on top with idempotency.", "pair": "at-least-once"}], "open": {"q": "Our reminder calls and SMS run from a job queue. A worker dies halfway through. What happens, and how do you keep a patient from getting two reminders?", "probe": "Leases, at-least-once delivery, and making effects safe to repeat.", "a": ["Workers claim rows with SKIP LOCKED under a lease with a heartbeat", "The dead worker's lease expires; another claims the job", "That is at-least-once: the job can run twice", "So the send is idempotent: a key per reminder, stored with the result", "Contrast: live calls are pushed to a worker, not queued, because they can't wait"]}, "say": ["Workers claim jobs with SKIP LOCKED, under a lease with a heartbeat. If one dies, the lease runs out and another worker picks the job up. That means a job can run twice, so whatever it does has to be safe to repeat. I'd key each reminder so a second run finds the first result and stops. Calls are different: they're pushed straight to a worker, because they can't wait in a queue."], "avoid": ["Claiming a queue gives exactly-once delivery"], "was": [], "res": [{"kind": "video", "req": true, "label": "How to implement Work Queues with Relational Databases and SQL SKIP LOCKED", "url": "https://www.youtube.com/watch?v=xzmd6cVoggc", "m": 8, "why": "Many workers claim different rows without waiting on each other.", "yt": {"id": "xzmd6cVoggc", "ch": "Vlad Mihalcea"}}, {"kind": "read", "req": true, "label": "Postgres: the locking clause", "url": "https://www.postgresql.org/docs/current/sql-select.html#SQL-FOR-UPDATE-SHARE", "m": 3, "why": "What SKIP LOCKED does, from the source"}, {"kind": "video", "req": false, "label": "Do You Really Need Redis? Building a Postgres-Native Job Queue with SKIP LOCKED", "url": "https://www.youtube.com/watch?v=dZNxn3FOYmw", "m": 6, "why": "A claim, a lease and a retry in a small job table.", "yt": {"id": "dZNxn3FOYmw", "ch": "myDBA"}}, {"kind": "read", "req": false, "label": "Kleppmann: how to do distributed locking", "url": "https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html", "m": 15, "why": "Leases and fencing tokens"}]}, {"id": "backend-idempotency", "title": "Idempotency: a retry must not do it twice", "brief": "Retries happen because you can't tell a lost request from a lost response: the booking may exist and only the reply timed out. An idempotency key makes the retry safe: the client sends the same key every attempt, the server stores key and result in the same transaction as the effect, and a repeat returns the stored result. The nuance: if the key and the effect are written separately, a crash between them brings back the double booking.", "points": ["Lost request or lost response: a timeout can't tell you which, so you retry", "Same key: the client sends one key on every attempt of one action", "Same transaction: key, result and effect commit together", "Repeat: a request with a known key returns the stored result and does nothing new", "Layers: tool calls, drafts and sends, and session setup can each be keyed", "Confirm before acting: a write the caller cares about is drafted, then confirmed, then executed once"], "figs": ["idempotencyKey"], "production": ["Stripe: clients send an Idempotency-Key header; the first result, success or error, is saved and replayed for repeats, and keys expire after 24 hours", "Brandur Leach: Stripe-like keys in Postgres, with recovery points so a request interrupted halfway can resume", "Agent tools: an execution layer keys each write so a retried tool call replays the stored result instead of acting twice"], "mcq": [{"q": "A booking request to the EHR times out. What do you know?", "o": ["Nothing certain: the booking may have been made and only the reply lost", "The booking failed, so it is safe to resend without a key", "The booking succeeded, so do not retry", "The EHR is down and all calls should stop", "The idempotency key has expired"], "a": 0, "why": "A timeout means no answer, not a no. That uncertainty is why retries need a key.", "pair": "lost-response"}, {"q": "Why must the idempotency key be stored in the same transaction as the effect?", "o": ["It makes the key lookup faster", "Keys must be encrypted together with the effect", "Postgres cannot index keys outside a transaction", "A crash between separate writes leaves an effect with no key, so the retry does it again", "It lets two different requests share one key"], "a": 3, "why": "Atomicity is the whole guarantee. Either the effect and its key both exist, or neither does."}, {"q": "A retry arrives with the same key as a booking that already succeeded. What should the server return?", "o": ["An error saying the key was already used", "A new booking with a new confirmation number", "The stored result of the first attempt, without booking again", "A 202 telling the client to poll later", "Nothing, and drop the request silently"], "a": 2, "why": "The client needs the answer it missed. Returning the stored result gives it that without a second effect.", "pair": "lost-response"}], "open": {"q": "How does a retried booking avoid booking twice?", "probe": "The write-back safety every voice agent needs, and where the transaction boundary goes.", "a": ["A timeout can't tell a lost request from a lost response, so you retry", "The client sends the same idempotency key on every attempt", "The server stores key and result in the same transaction as the booking", "A repeat with that key returns the stored result and books nothing", "Against an EHR that has no keys: record intent first, then check for the booking before retrying"]}, "say": ["You can't tell a lost request from a lost response, so you retry. The client sends the same idempotency key on every attempt, and the server stores the key and the result in the same transaction as the booking. A repeat with that key gets the stored result back and nothing is booked again. In alfred_ tools go through an execution layer with idempotency on writes, so a retried action replays instead of acting twice, and sends are drafted, then confirmed by the person. For an EHR booking I'd apply the same idea, and check how the EHR itself handles retries."], "avoid": ["Implying you have written bookings into an EHR in production: say how you would approach it"], "was": ["q-how-does-a-retried-booking-avoid-booking-twice"], "res": [{"kind": "video", "req": true, "label": "Idempotency - What it is and How to Implement it", "url": "https://www.youtube.com/watch?v=XAccGbtl3Z8", "m": 9, "why": "Why a retry can run twice and how a key makes the second a no-op.", "yt": {"id": "XAccGbtl3Z8", "ch": "Alex Hyett"}}, {"kind": "read", "req": true, "label": "Stripe: idempotent requests", "url": "https://docs.stripe.com/api/idempotent_requests", "m": 4, "why": "The rules in four minutes"}, {"kind": "video", "req": false, "label": "Build a robust Payments service using Idempotency Keys", "url": "https://www.youtube.com/watch?v=m6DtqSb1BDM", "m": 17, "why": "The key stored with its result, in a payments design.", "yt": {"id": "m6DtqSb1BDM", "ch": "Arpit Bhayani"}}, {"kind": "read", "req": false, "label": "Brandur Leach: implementing Stripe-like idempotency keys in Postgres", "url": "https://brandur.org/idempotency-keys", "m": 20, "why": "The full design, with the transaction boundaries"}]}, {"id": "backend-timeouts", "title": "Timeouts, budgets and retries", "brief": "Every network call needs a timeout, and each one must fit inside its caller's budget, or the outer layer gives up before the inner one reports. When something fails you retry with exponential backoff and jitter, so clients that failed together don't retry together. The nuance: whether to fail open or closed when a check can't run is a product decision, and it should be written in code.", "points": ["Timeout: every network call has one; no call waits forever", "Nested budgets: an inner timeout is shorter than its caller's, so the inner step fails and reports first", "Backoff with jitter: spreads retries out so they don't arrive as one wave", "Retry storms: retries arrive exactly when the service has least capacity", "Fail closed: when the answer is no, deny", "Fail open: when the checker itself is down, allow, if the risk of letting a call through is lower than dropping every call"], "figs": ["retry"], "production": ["AWS Builders' Library: capped exponential backoff with jitter, and retrying at one layer only so retries don't multiply up the stack", "Circuit breakers: stop calling a dependency that keeps failing and fail fast until it recovers", "Short auth budgets: a voice worker's authorize call gets a few seconds at most, since the caller is waiting on the line"], "mcq": [{"q": "Why add jitter to exponential backoff?", "o": ["To make each retry faster than the last", "To cap the number of retries", "To skip retries for calls that are not idempotent", "To keep timeouts inside the caller's budget", "So clients that failed together do not retry together in one wave"], "a": 4, "why": "Backoff alone keeps synchronised clients synchronised. Randomness spreads them out.", "pair": "backoff-vs-jitter"}, {"q": "The service the authorization step depends on is unreachable. When is failing open acceptable?", "o": ["Always, because availability beats correctness", "When letting a call through is less risky than dropping every call, and that choice is written down", "Never, because security checks must always fail closed", "Only when the caller has called before", "Only after one round of retries has failed"], "a": 1, "why": "It depends on what an unchecked call can do. A scoped, short-lived token can make failing open on a down checker a reasonable choice; a definite no still fails closed."}, {"q": "A handler has a 5 s budget, and its caller waits 8 s for it. Why that order?", "o": ["A longer outer timeout makes the inner call faster", "The outer timeout should always equal the inner one", "The inner step should keep retrying until the outer one expires", "Each inner timeout fits inside its caller's, so the inner step fails and reports before the outer one gives up", "The order does not matter as long as both exist"], "a": 3, "why": "If the outer layer gives up first, it can't tell a slow success from a failure, and may retry work that completed.", "pair": "backoff-vs-jitter"}], "open": {"q": "Mid-call, the agent's lookup against the scheduling system starts timing out. What should the system do?", "probe": "Timeouts that fit a budget, safe retries, and failing deliberately.", "a": ["A timeout on the call that fits the turn's budget, with a filler so the line isn't silent", "Retry with backoff and jitter, only if the call is idempotent", "If it keeps failing, a circuit breaker stops hammering the system", "Decide the failure mode: offer a callback or a human rather than guess", "Write the fail-open or fail-closed choice in code, and alert on it"]}, "say": ["Every call gets a timeout that fits inside the turn's budget, and the agent says something natural while it waits. I'd retry with backoff and jitter, but only if the call is safe to repeat. If it keeps failing, stop hammering it and offer the patient a callback or a person, rather than guess. In alfred_ the worker's authorize call has a short time budget for the same reason: the caller is waiting on the line."], "avoid": ["Saying you'd retry until it works: unbounded retries are how a slow service goes down"], "was": [], "res": [{"kind": "video", "req": true, "label": "How API Retries Cause Outages (Backoff and Jitter Explained)", "url": "https://www.youtube.com/watch?v=1fTUlTqm_Vk", "m": 6, "why": "Why naive retries pile onto a struggling service, and the backoff fix.", "yt": {"id": "1fTUlTqm_Vk", "ch": "CodeAnimated"}}, {"kind": "read", "req": true, "label": "AWS Builders' Library: timeouts, retries and backoff with jitter", "url": "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/", "m": 10, "why": "The standard reference, with the reasoning"}]}, {"id": "backend-scaling", "title": "Scaling a service that holds live calls", "brief": "Start from calls, not users. Little's law says calls in progress equal arrival rate times call length, so 225 calls in a peak hour at 3 minutes each is about 11 at once, and a burst of four times that is about 45. Each call is a process doing CPU work, so calls per container is the number to load-test, and you scale out with replicas. The nuance: what bites first is often not the worker but cold starts, provider rate limits and the auth budget under load.", "points": ["Little's law: concurrent calls = arrivals per unit time x average duration", "Peak and burst: size for the burst, not the daily average", "Calls per container: the number you load-test, since each call costs CPU", "Scale out: replicas, with the dispatcher sending each new call to a worker with room", "Cold starts: prewarm models and precompile imports before the first call", "What bites first: CPU per call, model provider rate limits, and the auth budget under load"], "figs": ["queueOverload"], "production": ["LiveKit server options: a load function and load threshold stop a server taking new jobs when it is busy", "Railway scaling: horizontal replicas behind a load balancer with no sticky sessions, so call routing comes from the dispatcher", "Prewarm: load voice activity and turn models once per process before the first call, so the greeting isn't late", "Load testing: measure calls per container and provider limits before a launch, not after"], "mcq": [{"q": "225 calls arrive in the peak hour and each lasts 3 minutes. About how many are in progress on average?", "o": ["About 4", "About 45", "About 11", "About 75", "About 225"], "a": 2, "why": "225 × 3 / 60 is about 11. About 45 is what you might size for in a four-times burst.", "pair": "littles-law"}, {"q": "Why does a voice worker scale out rather than up?", "o": ["Each call is a process doing CPU work, so capacity grows with containers", "Bigger machines cannot run Python workers", "LiveKit only allows one call per machine", "Scaling up requires sticky sessions", "Memory, not CPU, is the limit per call"], "a": 0, "why": "Per-call CPU adds up linearly. Adding containers adds capacity in the same unit, and one bigger box is one bigger failure."}, {"q": "The first call after each deploy waits several seconds before the greeting. What is the best fix?", "o": ["Raise the end-of-turn wait", "Add a jitter buffer", "Add more replicas", "Retry the dispatch with backoff", "Prewarm models and precompile imports before the worker accepts calls"], "a": 4, "why": "That is a cold start: imports and model loads on the first job. More replicas would only multiply the cold starts."}], "open": {"q": "A health system wants our agents on every location's main line next month. How would you size the infrastructure?", "probe": "Little's law, load testing, and what fails first.", "a": ["Start from calls: arrivals in the peak hour and average call length", "Little's law gives concurrent calls; size for a burst above the average", "Load-test calls per container, then pick replicas with headroom", "Kill cold starts with prewarm and precompiled imports", "Check what bites first: provider rate limits, the auth budget, CPU per call"]}, "say": ["I'd start from calls, not users. Arrivals in the peak hour times the average call length gives calls in progress, that's Little's law, and then I'd size for a burst well above that. Each call is a process doing CPU work, so I'd load-test calls per container and scale out with replicas. Then I'd check the things that bite first: cold starts, the model provider's rate limits, and the auth budget under load. I'd describe alfred_'s setup as sized for its expected peak, not as traffic it has handled."], "avoid": ["Quoting user numbers or traffic you haven't handled: say what it is sized for"], "was": [], "res": [{"kind": "video", "req": true, "label": "Little's Law Explained | L = λ × W | Queueing Theory and System Design", "url": "https://www.youtube.com/watch?v=fYjiS2ogcoE", "m": 6, "why": "Calls in progress equal arrival rate times call length.", "yt": {"id": "fYjiS2ogcoE", "ch": "Industry Ready Coder"}}, {"kind": "read", "req": true, "label": "LiveKit: server options", "url": "https://docs.livekit.io/agents/server/options", "m": 10, "why": "load_fnc and load_threshold"}, {"kind": "video", "req": false, "label": "How to scale WebSockets to millions of connections", "url": "https://www.youtube.com/watch?v=vXJsJ52vwAA", "m": 14, "why": "What changes when every connection is long-lived and stateful.", "yt": {"id": "vXJsJ52vwAA", "ch": "Ably Realtime"}}, {"kind": "read", "req": false, "label": "Railway: scaling", "url": "https://docs.railway.com/reference/scaling", "m": 6, "why": "Replicas and load balancing"}, {"kind": "keep", "src": "aieng", "req": false, "label": "AI Engineering from Scratch: cold-start mitigation", "url": "https://aiengineeringfromscratch.com/lesson?path=phases%2F17-infrastructure-and-production%2F10-cold-start-mitigation", "m": 30, "why": "Why the first call is slow and what to do"}]}]}, {"id": "async", "title": "Python async for real-time backends", "blurb": "Explain and write the asyncio that holds live calls: the loop, tasks, queues, cancellation for barge-in, and what never to do on the loop.", "sessions": ["wc22"], "topics": [{"id": "async-event-loop", "title": "One thread, many calls", "brief": "asyncio runs many tasks on one thread. A task runs until it awaits something that is not ready, then the event loop runs another task that is. Nothing runs in parallel: one process holds several calls because most of a call is waiting, and the waits overlap.", "points": ["Coroutine: calling an async def function makes a coroutine object and runs nothing until it is awaited or wrapped in a task", "Task: asyncio.create_task schedules a coroutine to run alongside the current one; awaiting the task collects its result", "Await: the only place a task gives up the thread, so code between two awaits runs without interruption", "I/O bound: async pays off when work is mostly waiting (audio frames, model tokens, tool replies); CPU work gains nothing from it", "Weak references: the loop keeps only weak references to tasks, so keep your own reference or a fire-and-forget task can be garbage collected mid-flight"], "figs": ["eventLoop"], "production": ["livekit-agents, a common framework for Python voice workers, is built on asyncio: a call's audio, model stream and tool calls are tasks on one loop", "FastAPI runs async def endpoints on the event loop and plain def endpoints in a threadpool (AnyIO's default limit is 40 threads)", "uvicorn can run on uvloop, a faster drop-in event loop built on libuv; the programming model stays the same"], "mcq": [{"q": "A worker holds eight calls in one asyncio process on one thread. What lets it serve all eight?", "o": ["The loop runs each coroutine on its own CPU core, in parallel", "asyncio preempts each task every few milliseconds, like an OS scheduler", "Each call mostly awaits I/O, and the loop runs another ready task at every await", "The GIL is released inside async def functions, so coroutines run side by side", "Each create_task call starts a hidden thread that the loop supervises"], "a": 2, "why": "asyncio is cooperative: tasks switch only at await. It works because the waits of different calls overlap, not because anything runs at the same time."}, {"q": "You call fetch_slots(), an async def function, without await and without create_task. What happens?", "o": ["It runs in the background and its result is discarded", "A coroutine object is made, nothing runs, and Python warns it was never awaited", "It runs synchronously and blocks until it returns", "It is scheduled on the loop and starts at the next await", "It raises TypeError at once because async functions need await"], "a": 1, "why": "Calling a coroutine function only builds the coroutine. It runs when awaited or wrapped in a task; otherwise you get 'coroutine was never awaited'."}, {"q": "Why is `if key not in pending: pending[key] = fut` safe in asyncio without a lock, but unsafe once an await sits between the check and the set?", "o": ["Dict operations are atomic in CPython, so the await makes no difference", "asyncio wraps each dict access in an internal lock that await releases", "Tasks run in creation order, so the first task always reaches the set first", "Tasks switch only at await, so with none in between no other task can run there", "Each coroutine works on a copy of shared state until it awaits"], "a": 3, "why": "Between two awaits a task cannot be interrupted by another task. Put an await between check and set and a second task can pass the same check.", "pair": "await-atomicity"}], "open": {"q": "Our worker runs several live calls in one Python process. Walk me through how that works, and what can go wrong.", "probe": "Whether he understands cooperative scheduling and its one big failure mode.", "a": ["One thread, one event loop; every call is a set of tasks", "A task runs until it awaits something not ready; the loop then runs another ready task", "It works because a call is mostly waiting: audio frames, tokens, tool replies", "What goes wrong: anything that does not await (a sync library, CPU work) freezes every call on that process", "So I/O uses async clients, CPU work goes to a thread or process, and I watch loop lag"]}, "say": ["I think the key word is cooperative. Everything runs on one thread, and tasks only take turns at an await.", "It works for calls because a call is mostly waiting, on audio, on the model, on a tool, so the waits overlap.", "The worker in the voice agent I own is Python on livekit-agents, so this is the model I work in every day.", "The flip side is one blocking call stalls every call on that process, so that is the first thing I look for."], "avoid": ["Saying asyncio runs calls in parallel: it is concurrency on one thread, and they will probe the difference"], "was": ["q-how-does-one-python-process-hold-several-live-calls"], "res": [{"kind": "video", "req": true, "label": "Asyncio Finally Explained: What the Event Loop Really Does", "url": "https://www.youtube.com/watch?v=RIVcqT2OGPA", "m": 14, "why": "One thread, tasks that yield at await, and what the loop does in between.", "yt": {"id": "RIVcqT2OGPA", "ch": "ArjanCodes"}}, {"kind": "read", "req": true, "label": "FastAPI: async def against def", "url": "https://fastapi.tiangolo.com/async/", "m": 10, "why": "The plainest explanation of concurrency against parallelism, and why def runs in a threadpool"}, {"kind": "video", "req": false, "label": "AsyncIO, await, and async - Concurrency in Python", "url": "https://www.youtube.com/watch?v=K56nNuBEd0c", "m": 10, "why": "A second, gentler pass over await and cooperative switching.", "yt": {"id": "K56nNuBEd0c", "ch": "Socratica"}}, {"kind": "read", "req": false, "label": "Python docs: coroutines and tasks, creating tasks", "url": "https://docs.python.org/3/library/asyncio-task.html#creating-tasks", "m": 10, "why": "create_task, and the warning to keep a reference to every task"}]}, {"id": "async-together", "title": "Gather, TaskGroup and queues", "brief": "gather and TaskGroup both run awaitables together and wait for them. The difference people miss is failure: gather leaves the other tasks running when one fails, TaskGroup cancels them. Between pipeline stages a bounded asyncio.Queue gives backpressure, but a live phone stream cannot be slowed, so real-time stages drop old frames instead of blocking the reader.", "points": ["asyncio.gather: runs awaitables together and returns results in order; the first exception reaches the awaiter, but the other tasks are not cancelled", "return_exceptions=True: gather returns exceptions as results instead of raising, so one failure does not hide the others", "TaskGroup (3.11+): an async with block; if one task fails the rest are cancelled, and errors come out as an ExceptionGroup, handled with except*", "asyncio.Queue(maxsize=n): put waits when full and get waits when empty; that wait is the backpressure", "Real-time source: a microphone or phone stream cannot wait, so a full queue there means drop the oldest frames or shed load, never stall the reader"], "figs": ["queue", "queueOverload"], "production": ["The Python docs' worker pool: N consumer tasks on one asyncio.Queue, with queue.join() waiting until every item is marked task_done()", "Fan-out inside a turn: calendar and contacts lookups under one TaskGroup, so when one fails the sibling is cancelled instead of left running", "Live media uses bounded buffers with a drop policy: a WebRTC jitter buffer holds tens of milliseconds of audio and discards late packets rather than growing"], "mcq": [{"q": "A turn fetches calendar and contacts with asyncio.gather and default arguments. The contacts call raises. What happens to the calendar call?", "o": ["It is cancelled at once, and gather raises the contacts error", "It is cancelled, and both errors come out as an ExceptionGroup", "gather waits for it to finish, then raises the contacts error", "It keeps running; gather raises the contacts error but does not cancel it", "gather returns the calendar result and None for contacts"], "a": 3, "why": "With default arguments gather propagates the first exception to the awaiter and leaves the other awaitables running. Cancelling siblings is what TaskGroup adds.", "pair": "gather-vs-taskgroup"}, {"q": "Same turn inside `async with asyncio.TaskGroup()`. The contacts task raises ValueError. What do you get?", "o": ["The calendar task finishes, then the block raises the bare ValueError", "The calendar task is cancelled, and the block raises an ExceptionGroup holding the ValueError", "The calendar task keeps running after the block exits", "The block exits normally and the error is only logged", "The calendar task is cancelled, and the bare ValueError is raised"], "a": 1, "why": "TaskGroup cancels the remaining tasks when one fails and raises an ExceptionGroup, which you handle with except* ValueError.", "pair": "gather-vs-taskgroup"}, {"q": "Speech to text falls behind the stage feeding it audio. The queue between them has no maxsize. What happens?", "o": ["put() starts waiting once the consumer lags, slowing the producer", "asyncio drops the oldest frames when memory runs low", "The queue raises QueueFull and the producer task crashes", "The loop gives the slow consumer extra turns until it catches up", "Frames pile up, the transcript lags further behind, and memory grows without limit"], "a": 4, "why": "An unbounded queue never pushes back. Overload shows up late, as lag and then memory exhaustion, instead of early, as a waiting producer."}, {"q": "A bounded queue is fed by a live phone stream and fills up. Which policy fits?", "o": ["Drop the oldest frames, or shed the call, so the stream reader never stalls", "await put() so the phone stream slows to match the consumer", "Raise maxsize until the queue never fills in testing", "Move the queue into a thread so it can grow without blocking", "Use put_nowait and let QueueFull end the call"], "a": 0, "why": "Backpressure only works when the producer can wait. A caller keeps talking regardless, so stale audio is dropped and fresh audio kept."}], "open": {"q": "You have audio in, transcription, the model and speech out in one process. How do you connect them, and what happens when one stage falls behind?", "probe": "Whether he knows backpressure, and where it does not apply.", "a": ["Each stage is a task; stages are joined by asyncio.Queue or async streams", "Bounded queues, so a slow stage makes the one before it wait instead of hiding the overload", "At the live edge nothing can wait: drop the oldest audio or shed the call", "Run the stages under one TaskGroup, so one failing stage cancels the rest of that call", "Watch queue depth per stage: a growing queue names the slow stage"]}, "say": ["The way I'd do it, each stage is a task and a bounded queue sits between them, so a slow stage pushes back instead of quietly piling up.", "The exception is the edge where audio comes in. A caller doesn't slow down because we're behind, so there I'd drop old frames.", "And I'd put one call's stages in a TaskGroup, so if one dies the rest go with it. Pretty much, fail the whole call cleanly, not half of it."], "avoid": ["Saying gather cancels the other tasks on failure: that is TaskGroup"], "was": [], "res": [{"kind": "video", "req": true, "label": "3 ways asyncio.gather breaks concurrent code, and how TaskGroup fixes it", "url": "https://www.youtube.com/watch?v=44WqX9uqmFA", "m": 5, "why": "The failure case: gather leaves siblings running.", "yt": {"id": "44WqX9uqmFA", "ch": "Maksym Shemet"}}, {"kind": "read", "req": true, "label": "Python docs: task groups", "url": "https://docs.python.org/3/library/asyncio-task.html#task-groups", "m": 8, "why": "Exactly how TaskGroup cancels siblings and raises ExceptionGroup"}, {"kind": "video", "req": false, "label": "How To Use TASK GROUPS In Python 3.11 (NEW FEATURE!)", "url": "https://www.youtube.com/watch?v=8KyIK7srLds", "m": 9, "why": "TaskGroup in use, with a failing child.", "yt": {"id": "8KyIK7srLds", "ch": "Indently"}}, {"kind": "read", "req": false, "label": "Python docs: asyncio queues", "url": "https://docs.python.org/3/library/asyncio-queue.html", "m": 6, "why": "maxsize, put and get, and the worker pool example"}]}, {"id": "async-cancel", "title": "Timeouts, cancellation and barge-in", "brief": "task.cancel() asks a task to stop: CancelledError is raised inside it at the await where it is suspended, so it can clean up in finally. Barge-in is exactly this: the caller speaks, the speaking task is cancelled. The trap is a timeout that cancels work you meant to keep: a filler needs a wait that does not cancel the tool.", "points": ["task.cancel(): a request, not a kill; CancelledError is raised at the await where the task is suspended, and a task busy in CPU code stops only when it next awaits", "CancelledError: a BaseException since 3.8, so except Exception does not catch it; clean up in finally, and re-raise if you do catch it", "asyncio.timeout(5): a context manager (3.11+) that cancels the block when it runs over and raises TimeoutError; wait_for does the same for one awaitable", "asyncio.wait(timeout=...): returns done and pending sets and cancels nothing, which is what a filler needs", "shield: protects the inner awaitable when the outer await is cancelled; the waiter stops, the work goes on"], "figs": ["turnTaking"], "production": ["Filler pattern: start the tool as a task, asyncio.wait on it for 1.2 s, speak 'Let me check' if it is still pending, then keep awaiting the same task under a 5 s total timeout", "LiveKit's agent framework treats interruption as a session setting: when the caller talks over the agent, playback stops and the agent listens", "A cancelled write may already have reached the server, so a booking cut off by a timeout is retried with the same idempotency key, never assumed to have failed", "TaskGroup and asyncio.timeout both depend on CancelledError propagating; Python 3.11 added Task.uncancel() for this bookkeeping, and swallowing the error breaks both"], "mcq": [{"q": "The caller interrupts. You call speak_task.cancel() while it is awaiting the next audio chunk. What happens?", "o": ["The task stops instantly mid-word, and its finally block is skipped", "The task finishes the current sentence, then exits normally", "CancelledError is raised at that await on the next loop turn, so finally can stop the audio", "cancel() blocks the caller until the task has fully stopped", "TimeoutError is raised inside the task for the speaker to handle"], "a": 2, "why": "cancel() schedules CancelledError into the task at the await where it waits. It returns at once, and the task cleans up in finally on its next turn."}, {"q": "You want 'Let me check' if a tool takes over 1.2 s, and then the tool's result. Which approach does that?", "o": ["await asyncio.wait_for(task, 1.2), speak the filler on TimeoutError, then await task again", "asyncio.wait({task}, timeout=1.2), speak the filler if it is pending, then await the same task", "async with asyncio.timeout(1.2): await task, and retry the tool after the filler", "Cancel the task after 1.2 s, speak the filler, then start a new task", "await asyncio.sleep(1.2) before starting the tool, then speak and await it"], "a": 1, "why": "wait_for and asyncio.timeout cancel the task when time runs out, so the tool dies. asyncio.wait only reports what is done and cancels nothing.", "pair": "wait-vs-wait-for"}, {"q": "Your speaking coroutine wraps its body in `except Exception: log()`. Barge-in cancels it. What happens?", "o": ["The handler catches CancelledError and the task keeps speaking", "The handler logs it, and the task exits as cancelled", "Python raises RuntimeError because the task swallowed a cancel", "The handler does not run, since CancelledError is a BaseException; finally still runs", "The cancel waits until the except block finishes"], "a": 3, "why": "Since Python 3.8 CancelledError derives from BaseException, so broad except Exception handlers no longer swallow cancellation by accident."}, {"q": "A tool call that books a slot is cut off by its 5 s timeout. What should the agent assume?", "o": ["It failed, so tell the caller and offer to try again", "It succeeded, because the request left before the timeout", "asyncio rolled back the HTTP request when it cancelled the task", "Nothing reached the server, since cancellation stops the socket write", "It may or may not have booked: retry with the same idempotency key, or check first"], "a": 4, "why": "Cancellation stops your waiting, not the server. The outcome is unknown, so the safe moves are an idempotent retry or a read before speaking.", "pair": "wait-vs-wait-for"}], "open": {"q": "How would you implement barge-in and a 'let me check' filler in an asyncio voice worker?", "probe": "Whether he can turn cancellation semantics into correct call behaviour.", "a": ["Speaking is its own task; when voice activity says the caller is talking, cancel it", "Its finally block stops playback and records what was actually said", "A tool call is a task; asyncio.wait for 1.2 s, filler if pending, then keep awaiting under a total timeout", "Never wait_for the tool with the filler delay: that cancels the tool", "A write cut off by a timeout has an unknown outcome: retry idempotently or check before speaking"]}, "say": ["Barge-in is cancellation. The agent speaking is a task, and when the caller starts talking I cancel it and stop the audio in a finally.", "For the filler I race a timer against the tool, but with asyncio.wait, not wait_for, because wait_for would kill the tool at 1.2 seconds.", "And if a write times out I don't know whether it happened. In the agent I own, writes go through idempotency, so a retry replays instead of acting twice."], "avoid": ["Saying cancel() kills the task immediately: it raises at the next await, and CPU-bound code cannot be interrupted"], "was": [], "res": [{"kind": "read", "req": true, "label": "Python docs: task cancellation", "url": "https://docs.python.org/3/library/asyncio-task.html#task-cancellation", "m": 8, "why": "Where CancelledError lands, and why it must be re-raised"}, {"kind": "video", "req": false, "label": "asyncio 6/20: Task Cancellation and Timeouts", "url": "https://www.youtube.com/watch?v=N61G0HM3_6s", "m": 4, "why": "Where CancelledError lands and how timeouts use it.", "yt": {"id": "N61G0HM3_6s", "ch": "DevStoriesEU"}}, {"kind": "read", "req": false, "label": "Python docs: timeouts", "url": "https://docs.python.org/3/library/asyncio-task.html#timeouts", "m": 6, "why": "asyncio.timeout and wait_for, and that both cancel on expiry"}]}, {"id": "async-blocking", "title": "Never block the loop", "brief": "Everything on the loop shares one thread, so one synchronous call freezes every call on that process, not only its own. It hides in testing because one call at a time feels fine. The fix depends on the work: async clients for I/O, a thread for blocking libraries, a process for pure-Python CPU work, because the GIL still applies inside threads.", "points": ["Blocking call: requests.get, time.sleep, a sync database driver or a large file read inside async def holds the thread until it returns", "asyncio.to_thread (3.9+): runs a blocking function in the default thread pool and awaits it; right for blocking I/O and C code that releases the GIL", "Process pool: loop.run_in_executor with a ProcessPoolExecutor for pure-Python CPU work, which threads would still serialize on the GIL", "Debug mode: asyncio.run(debug=True) or PYTHONASYNCIODEBUG=1 logs any callback slower than 100 ms (loop.slow_callback_duration)", "Symptom: stutter, late fillers and timeouts on every call at once, not on one"], "figs": ["eventLoop"], "production": ["Async clients: httpx.AsyncClient or aiohttp instead of requests, asyncpg instead of a sync Postgres driver", "FastAPI: a sync library is safe in a plain def endpoint (threadpool) and blocks the loop inside async def", "Prewarming: load models such as voice activity detection at process start, not on the first call; livekit-agents offers a prewarm hook for this", "The default thread pool has min(32, cpu_count + 4) workers since Python 3.8, so a burst of to_thread calls queues behind it"], "mcq": [{"q": "A coroutine calls requests.get() for a 2 s lookup. Four other calls are live on the process. What do they experience?", "o": ["All four freeze for those 2 s: no audio frames, no tokens, no timers", "Nothing, because the loop switches tasks while requests waits on the socket", "Nothing, because the GIL is released during network I/O", "A slight slowdown while the loop shares time with the request", "asyncio detects the blocking call and moves it to a thread"], "a": 0, "why": "requests releases the GIL for other threads, but the loop is one thread and it is stuck inside requests. No other task can run until it returns."}, {"q": "Voice activity detection written in pure Python takes 30 ms a frame and stalls the loop. Which fix lets it run truly in parallel with the loop?", "o": ["Make it async def so the loop can switch away from it", "Add await asyncio.sleep(0) after every frame", "Run it with asyncio.to_thread so it runs alongside the loop", "Raise loop.slow_callback_duration so it stops being flagged", "Run it in a ProcessPoolExecutor through run_in_executor"], "a": 4, "why": "Pure-Python CPU work in a thread still contends for the GIL with the loop. A separate process has its own interpreter and runs in parallel.", "pair": "thread-vs-process"}, {"q": "Resampling with numpy stalls the loop for 20 ms a frame. Why is asyncio.to_thread a reasonable fix here?", "o": ["to_thread runs the function in a separate process", "numpy releases the GIL in its C loops, so the thread works while the loop serves tasks", "numpy calls become async once they run in a thread", "Python threads always run truly in parallel", "to_thread slices the work into 100 ms chunks for the loop"], "a": 1, "why": "Threads help CPU work only when that work releases the GIL, as numpy and many audio and inference libraries do in native code.", "pair": "thread-vs-process"}], "open": {"q": "A requests.get() inside a coroutine passed every test. Why is it a production bug, and how would you find others like it?", "probe": "Whether he connects one blocking call to every call on the process, and knows the tooling.", "a": ["It is synchronous, so the loop thread waits inside it and every task on the process stops", "Tests run one call at a time, so nobody else is waiting to notice", "Fix: an async client, or asyncio.to_thread if the library has no async version", "Find others: debug mode logs callbacks over 100 ms; measure loop lag under several concurrent test calls", "CPU-heavy work (resampling, detection) goes to a thread if it releases the GIL, a process if not"]}, "say": ["It works in testing because only one call is running. In production that one call freezes every other call on the process for as long as the request takes.", "I'd swap in an async client, or push it to a thread if there isn't one.", "To find the rest I'd turn on asyncio debug mode, which flags anything over 100 milliseconds, and load the worker with several calls at once. One blocking line is enough to hurt everyone."], "avoid": ["Saying to_thread fixes any CPU work: pure-Python CPU work still fights the GIL"], "was": [], "res": [{"kind": "video", "req": true, "label": "Why Is Your Python Async Loop Freezing?", "url": "https://www.youtube.com/watch?v=MOYBOOwPKyw", "m": 5, "why": "One blocking call stalls every task on the loop.", "yt": {"id": "MOYBOOwPKyw", "ch": "Alex | Code Sphere Academy"}}, {"kind": "read", "req": true, "label": "Python docs: developing with asyncio, running blocking code", "url": "https://docs.python.org/3/library/asyncio-dev.html#running-blocking-code", "m": 10, "why": "Debug mode, slow callback logging, and the blocking code rule"}, {"kind": "video", "req": false, "label": "Advanced AsyncIO in Python | Locks, Semaphores and Executors", "url": "https://www.youtube.com/watch?v=Lo19buebJjM", "m": 12, "why": "Sending blocking work to an executor.", "yt": {"id": "Lo19buebJjM", "ch": "SP Learning Labs"}}, {"kind": "read", "req": false, "label": "Python docs: running code in thread or process pools", "url": "https://docs.python.org/3/library/asyncio-eventloop.html#executing-code-in-thread-or-process-pools", "m": 5, "why": "run_in_executor with thread and process pools"}]}, {"id": "async-build", "title": "Build it: a small call orchestrator", "brief": "The practical round may have you build a small backend live. The orchestrator puts the earlier topics together: a queue from a fake caller, one agent loop, a speaking task that new speech cancels, tool calls with a filler and a timeout, and a keyed send a retry cannot repeat. The nuance is a decision you state out loud: what happens to a running tool when the caller talks over it.", "points": ["Shape: a fake caller puts utterances on an asyncio.Queue; one agent loop task takes them and decides", "Speaking: a task that emits words with small sleeps; new speech cancels it and finally stops the audio", "Tool call: create_task, wait 1.2 s, filler if pending, then await under a 5 s total timeout", "Keyed send: put the future in a dict under the draft id before awaiting, so a concurrent retry awaits the same result instead of sending again", "Interrupt policy: speaking is always cancelled; a read can keep running; a write never goes ahead without a fresh yes", "Timestamps: log time.monotonic() on every event, so latency is read, not guessed"], "figs": ["voicePipeline", "idempotencyKey"], "production": ["FastAPI WebSockets: one async endpoint per connection, with receive and send as separate tasks so a slow send never stops reads", "websockets keepalive: the library pings every 20 s by default and closes the connection if no pong arrives within 20 s, which is how a dead peer is noticed", "Idempotency keys as payment APIs use them: the server stores the first result under the key and returns it for any retry", "time.monotonic() for latency, never time.time(), which can jump when the system clock is adjusted"], "mcq": [{"q": "Your send writes the result under the draft id only after `await send()` returns. Two retries arrive close together. What can happen?", "o": ["Nothing: asyncio runs one task at a time, so the second waits for the first", "The second raises KeyError because the key is being written", "Both pass the not-in-dict check before either finishes, so it sends twice", "The dict is locked during the await, so the second blocks", "The loop cancels the second send as a duplicate"], "a": 2, "why": "The await inside send lets the second task run between the first task's check and its write. Storing the future before awaiting closes the gap.", "pair": "await-atomicity"}, {"q": "The caller says 'actually, Tuesday' while a slot lookup runs and the agent speaks a filler. Which handling is most defensible?", "o": ["Cancel both and replay the original request with Tuesday added", "Ignore the speech until the tool finishes, then ask again", "Let the filler finish so the caller knows they were heard", "Cancel the speech at once, and handle the new utterance while the read finishes or is dropped", "Cancel the lookup but keep speaking so there is no dead air"], "a": 3, "why": "Speech always yields to the caller. A read is harmless to finish or discard; the new utterance is the next turn and may change the request."}, {"q": "Why time events with time.monotonic() instead of time.time() in the orchestrator?", "o": ["monotonic never goes backwards, so a clock adjustment cannot corrupt a latency", "monotonic has nanosecond resolution on every platform", "time.time() blocks the event loop while it reads the clock", "monotonic is synchronized across processes, so logs line up", "time.time() has one-second resolution on Linux"], "a": 0, "why": "Wall-clock time can jump with NTP or manual changes. A monotonic clock only moves forward, which is what a duration needs."}], "open": {"q": "Build a small orchestrator: a fake caller, an agent that calls a slow tool, and barge-in. Talk me through the design before you code.", "probe": "Whether he structures async code clearly and states the edge-case decisions instead of leaving them to chance.", "a": ["A queue from the fake caller; one agent loop task; speaking as its own task", "Tool calls as tasks: wait 1.2 s, filler, then a 5 s total timeout", "New speech cancels speaking; reads may finish; writes need a fresh confirmation", "Sends keyed by draft id, with the future stored before the await", "Monotonic timestamps on every event so the timing is visible"]}, "say": ["I'd start with the shape: a queue from the caller, one loop for the agent, and speaking as its own task so it can be cancelled.", "Every tool call is a task with a filler at about a second and a hard timeout.", "Before I code it I'd say the policy out loud: speech always stops for the caller, a read can finish, a write needs a fresh yes. That's the part I'd want an interviewer to push on."], "avoid": ["Reaching for a framework in a live build: plain asyncio shows you understand the moving parts"], "was": [], "res": [{"kind": "read", "req": true, "label": "FastAPI: WebSockets", "url": "https://fastapi.tiangolo.com/advanced/websockets/", "m": 5, "why": "The small server they may ask you to put in front of it"}, {"kind": "video", "req": true, "label": "Real-Time Agent Applications with WebSockets and FastAPI", "url": "https://www.youtube.com/watch?v=svABzOASrzg", "m": 19, "why": "A streaming agent behind a WebSocket, end to end.", "yt": {"id": "svABzOASrzg", "ch": "The Neural Maze"}}, {"kind": "video", "req": false, "label": "AsyncIO Queues", "url": "https://www.youtube.com/watch?v=ZSmfMr_mXpE", "m": 6, "why": "The bounded queue between a producer and a worker.", "yt": {"id": "ZSmfMr_mXpE", "ch": "Base2"}}, {"kind": "read", "req": false, "label": "websockets: keepalive", "url": "https://websockets.readthedocs.io/en/stable/topics/keepalive.html", "m": 5, "why": "Pings, timeouts and detecting a dead connection"}, {"kind": "keep", "src": "aieng", "req": false, "label": "AI Engineering from Scratch: the voice assistant pipeline", "url": "https://aiengineeringfromscratch.com/lesson?path=phases%2F06-speech-and-audio%2F12-voice-assistant-pipeline", "m": 120, "why": "A fuller voice pipeline to compare with yours, if time allows"}]}]}, {"id": "own", "title": "Your voice agent at depth", "blurb": "Draw your own voice agent cold, walk one call and its write path, defend the parallel agents, size it on a whiteboard and explain how it is tested.", "sessions": ["wc23"], "topics": [{"id": "own-hld", "title": "The design, drawn cold", "brief": "Two doors lead into one LiveKit room per call: phone over a SIP trunk, web over WebRTC. A Python worker on livekit-agents joins the room and runs the agent. The nuance people miss is trust: the worker is not given the backend, only an authorize function that hands it a short-lived, scoped token that can never send on the user's behalf.", "points": ["Two doors: phone calls arrive over a SIP trunk into LiveKit, web calls over WebRTC; both land in one room per call", "Worker: a Python process on livekit-agents is dispatched into the room and runs the agent", "Authorize: the worker's only door to the backend, on a short time budget; it returns a short-lived, scoped token", "Token scope: enough to read and draft, never to send on the user's behalf", "Tools: every tool runs through an execution layer with idempotency on writes", "Arrows: label what crosses each one (signalling, audio, a token, a tool call); that is what the interviewer reads"], "figs": ["alfredVoiceHld", "callPath"], "production": ["LiveKit SIP turns an inbound call from a SIP trunk into a participant in a room, so phone and browser callers look the same to the agent", "LiveKit agent dispatch sends a worker job into the room when the call starts, instead of the worker polling for work", "Short-lived, narrowly scoped tokens are the standard way to give a less trusted runtime access: a leak is bounded by scope and minutes", "MockFlow-AI, his second voice system, was built from scratch on the same LiveKit base: sub-400ms end to end, Deepgram Nova-2 for speech, Silero for voice activity"], "mcq": [{"q": "Why does the worker get a short-lived, scoped token from an authorize function instead of a service key to the backend?", "o": ["Service keys cannot be used from a Python worker", "A misbehaving or compromised worker can do only what the token allows, and only for minutes", "LiveKit requires a fresh backend token before audio can flow", "The token caches the user's data, so tool calls get faster", "It lets the worker skip checking who the caller is"], "a": 1, "why": "The worker runs model-driven code on a live call. Scoping its access to a narrow, expiring token bounds the damage of any bug or compromise."}, {"q": "What does one room per call give the design?", "o": ["A shared channel where one agent hears every call and multiplexes them", "A recording store that replaces the call record", "A queue that holds calls until a worker frees up", "An isolated session per call that the worker joins, so calls share no state", "A separate SIP trunk endpoint for every phone number"], "a": 3, "why": "The room is the unit of isolation: one call's audio, participants and agent live together, and a failure stays inside that call."}, {"q": "Phone and web calls arrive by different routes. Where should they converge?", "o": ["At the room: SIP and WebRTC both become participants, so one worker path serves both", "At the model: each door runs its own agent with a shared prompt", "At the database: each door writes transcripts and a job merges them", "At the SIP trunk: web calls are converted to phone calls first", "At the authorize function, which proxies the audio to the worker"], "a": 0, "why": "Converging at the media layer means one agent, one tool path and one test surface, whatever the door."}], "open": {"q": "Draw the voice agent you own on the whiteboard. What crosses each arrow, and where is the trust boundary?", "probe": "Whether he knows his own system cold, including why the boundaries are where they are.", "a": ["Phone over a SIP trunk and web over WebRTC, into one LiveKit room per call", "A Python worker on livekit-agents is dispatched into the room", "The worker's only door to the backend is the authorize function, on a short budget", "It gets a short-lived, scoped token: read and draft, never send", "Tools go through an execution layer with idempotency on writes"]}, "say": ["I own alfred_'s voice agent end to end. Phone calls come in over a SIP trunk into LiveKit, web calls over WebRTC, and every call gets its own room.", "A Python worker on livekit-agents joins the room and runs the agent.", "The part I'd point at is the trust boundary. The worker only talks to the backend through an authorize function, and what it gets back is a short-lived token that can never send anything on the user's behalf."], "avoid": ["Quoting user counts or traffic: describe what it is sized for"], "was": [], "res": [{"kind": "video", "req": true, "label": "AI Voice Agent Course #1: Voice Agent Architecture (LiveKit and Python)", "url": "https://www.youtube.com/watch?v=3SA6J8xIoYk", "m": 11, "yt": {"id": "3SA6J8xIoYk", "ch": "AgenticXLab"}, "why": "The pieces of a LiveKit and Python voice agent drawn in one pass."}, {"kind": "video", "req": false, "label": "How Voice AI Systems Really Work: The Complete Architecture Guide", "url": "https://www.youtube.com/watch?v=rpqvo74ursk", "m": 16, "yt": {"id": "rpqvo74ursk", "ch": "Quincy McCants "}, "why": "A full architecture walk-through of a voice AI system to compare with your own drawing."}]}, {"id": "own-call", "title": "One call, and the write path", "brief": "Walk one call aloud: dispatch, authorize, greet, the turn loop, a write, the end. The nuance is that writes are where a voice agent hurts people. A half-heard instruction must never become an action, so the agent drafts, reads it back, waits for a yes, and the execution layer makes a retry replay instead of acting twice.", "points": ["Start: dispatch into the room, authorize inside its budget, then greet", "Turn loop: detect the end of the caller's turn, answer, run tools through the execution layer with a timeout and a filler", "Write path: draft, read back the key fields, the person confirms, then it executes once", "Code floors: the confirm flow is enforced in code, so the model cannot talk its way past a confirmation", "Idempotency: a retried write returns the first result instead of acting again", "Hang-up: with nothing executing before a yes, a call that drops mid-write leaves at most an unconfirmed draft"], "figs": ["alfredVoiceCall", "idempotencyKey"], "production": ["Read-back before commit is the norm in phone banking and ordering: restate the fields that matter, then ask for an explicit yes", "Idempotency keys as payment APIs use them: the first result is stored under the key and returned for every retry", "MockFlow-AI keeps the flow in code too: the conversation moves through stages in a state machine, and the model can only move it by calling a transition tool", "A filler on slow tools and a hard timeout on every tool keep silence short while work runs"], "mcq": [{"q": "A caller says 'send it' after a half-heard request. What makes the design safe?", "o": ["The model is prompted to be careful before sending", "Low transcription confidence blocks the send", "The send waits 30 seconds so the caller can cancel", "A second model reviews every send before it goes", "The agent can only draft; it reads the draft back and executes once after a yes"], "a": 4, "why": "Safety comes from the shape of the path, not from asking the model to be careful: no action exists until a restated draft is confirmed.", "pair": "confirm-vs-idempotent"}, {"q": "The network drops right after the execution layer performed a write, and the worker retries. What happens?", "o": ["The write happens twice, and a cleanup job removes the duplicate", "The retry fails, and the agent apologizes to the caller", "The retry carries the same key, so the first result comes back and nothing happens twice", "The worker asks for confirmation again, then writes again", "The user's account is locked until a person reviews it"], "a": 2, "why": "Confirmation stops wrong actions; idempotency stops repeated ones. A retry with the same key replays the stored result.", "pair": "confirm-vs-idempotent"}, {"q": "The caller hangs up between the read-back and the yes. What is the right end state?", "o": ["Execute it, since the caller heard the read-back", "Nothing executed; at most an unconfirmed draft remains", "Execute after a timeout unless the caller calls back", "Queue it for the main agent to send later", "Delete every trace of the draft so nothing leaks"], "a": 1, "why": "Silence is not consent. Without a yes nothing runs, and the draft is there if the person wants to finish it later."}], "open": {"q": "Walk me through one call on your agent, from the phone ringing to hang-up. Then: what stops it acting on a half-heard instruction?", "probe": "Whether he can narrate the flow in order and knows where the safety lives.", "a": ["Dispatch into the room, authorize within its budget, greet", "Turn loop: end of turn, answer, tools through the execution layer with timeout and filler", "A write is a draft, read back, confirmed, then executed once", "Confirmation is enforced in code; retries replay through idempotency", "A hang-up before the yes leaves only a draft"]}, "say": ["The call is dispatched into its room, the worker authorizes, and it greets. Then it's a loop: wait for the end of the turn, answer, call tools when it needs them.", "Writes are the part I'm careful about. The agent drafts, reads it back, and only after the person says yes does it execute, and the execution layer makes a retry replay instead of acting twice.", "So a half-heard 'send it' can't turn into an email. The confirmation lives in code, not in the prompt."], "avoid": ["Saying the prompt makes it safe: the safety is in code, and they will ask what happens when the model ignores the prompt"], "was": [], "res": [{"kind": "video", "req": true, "label": "Voice Agent Pipeline Explained: VAD, STT, LLM and TTS", "url": "https://www.youtube.com/watch?v=SPB2T-eLrOg", "m": 11, "yt": {"id": "SPB2T-eLrOg", "ch": "LiveKit"}, "why": "The turn loop of a voice agent, stage by stage."}, {"kind": "video", "req": false, "label": "Production Voice AI Workflows: Consent and Escalations", "url": "https://www.youtube.com/watch?v=bc9kI5TRhX4", "m": 13, "yt": {"id": "bc9kI5TRhX4", "ch": "LiveKit and codeSTACKr"}, "why": "Consent and escalation steps around a live call in a real LiveKit build."}]}, {"id": "own-parallel", "title": "The lean agent and the main agent in parallel", "brief": "A lean agent answers on the call while the main agent works the same request in parallel, so the caller hears something fast and the heavy work still happens. The alternative, letting the lean agent escalate by tool call, adds a model round trip on exactly the turns that are already slow. The price is a background run on every turn and the work of tying two runs to one turn.", "points": ["What: each turn goes to the lean voice agent and to the main agent at the same time", "Why: an escalation tool call costs an extra model round trip, on the turns that are already slowest", "Reads: whichever agent has the answer first speaks", "Writes: they wait for the main agent's draft and the person's confirmation", "Costs: a background run on every turn, correlating two runs, what to say during a long wait, and delivering a result after a hang-up"], "figs": ["voiceParallel"], "production": ["LiveKit's tool design guidance: keep tools fast under voice latency, and keep the caller informed while slow work runs", "It is speculative execution: start work before you know it is needed and discard it if not, the same trade as hedged requests", "At ten times the traffic: start the main agent only for intents that can need it, or cancel it once the lean agent has answered", "Correlation: carry one turn id through both runs, so a late answer lands on the right turn or is dropped"], "mcq": [{"q": "Why send every turn to both agents instead of letting the lean agent call an escalation tool when it needs help?", "o": ["An escalation tool call adds a model round trip on the turns that are already slowest", "The lean agent cannot call tools at all", "Running both agents halves the total model cost", "The main agent cannot be reached through a tool call", "Parallel runs make the lean agent's own answers more accurate"], "a": 0, "why": "Escalation means the lean agent must first decide, then call, then wait. Starting the main agent at once removes that serial step where latency hurts most.", "pair": "parallel-vs-escalate"}, {"q": "What is the main cost of running both agents on every turn?", "o": ["Twice the audio bandwidth per call", "The caller hears two voices answering", "Writes can execute twice", "A background run on every turn, including the ones the lean agent handles alone", "Time to first audio doubles"], "a": 3, "why": "Only one agent speaks and writes go through confirmation and idempotency. What you pay for is wasted background work on easy turns.", "pair": "parallel-vs-escalate"}, {"q": "Traffic grows tenfold. What is the first change you would make to the parallel design?", "o": ["Drop the lean agent and send every turn to the main agent", "Make the main agent wait for an escalation tool call", "Add a third agent to choose between the two answers", "Cache every main agent answer per caller", "Start the main agent only for intents that can need it, or cancel it once the lean agent answers"], "a": 4, "why": "That keeps the latency win on hard turns while removing most of the wasted background runs on easy ones."}], "open": {"q": "Why does your voice agent run two agents on every turn? What does it cost, and how would you change it at ten times the traffic?", "probe": "Whether he can defend a design choice and its costs, not only describe it.", "a": ["What: the lean agent and the main agent both get every turn", "Why: escalating by tool call adds a model round trip on the slow turns", "Policy: reads, first answer wins; writes wait for the main agent and a confirmation", "Cost: a background run per turn, correlation, long waits, results after hang-up", "At scale: gate the main agent by intent, or cancel it once the lean agent answers"]}, "say": ["Every turn goes to a lean agent on the call and to the main agent at the same time. The caller hears something fast, and the heavy work still happens.", "The other way is to let the voice agent escalate with a tool call, but that adds a model round trip on exactly the turns that are already slow.", "It isn't free. There's a background run on every turn, even the easy ones, so at more traffic I'd only start the main agent for intents that can need it. That's the trade I'd make again."], "avoid": ["Giving a seconds-saved number as measured: describe the reason, not a figure you cannot back"], "was": [], "res": [{"kind": "video", "req": true, "label": "Fix Voice Agent Tool Call Latency With Async Function Tools", "url": "https://www.youtube.com/watch?v=AQZOIr3511U", "m": 7, "yt": {"id": "AQZOIr3511U", "ch": "LiveKit and codeSTACKr"}, "why": "Keeping the caller hearing something while slow work runs in the background."}, {"kind": "video", "req": false, "label": "Reduce the Latency of your Voice Agent", "url": "https://www.youtube.com/watch?v=jnedfk5PL2A", "m": 14, "yt": {"id": "jnedfk5PL2A", "ch": "LiveKit"}, "why": "Where voice agent latency comes from and the levers that cut it."}, {"kind": "read", "req": true, "label": "LiveKit: tool loop design", "url": "https://docs.livekit.io/agents/logic/tools/design", "m": 8, "why": "Keeping tools fast under voice latency, the constraint behind the parallel design"}]}, {"id": "own-sizing", "title": "Sizing, on a whiteboard", "brief": "Start from calls, not users. Calls in the peak hour times average duration gives calls at once (Little's law); a burst factor goes on top; then a load test sets calls per worker, and that sets replicas. The nuance: the limit is usually CPU per call and model provider rate limits, not servers, and his own system is described by what it is sized for, never by traffic.", "points": ["Little's law: calls at once equals arrival rate times average duration", "Peak hour: size for the busiest hour (often 10 to 15% of the day's calls), not the daily average", "Burst: multiply the peak-hour average by a burst factor of about 3 to 4 for minute-level spikes", "Per worker: each call does CPU work (audio, voice activity detection), so calls per container is load-tested, not guessed", "What breaks first: CPU per call, model provider rate limits, the authorize budget under load, and background runs from the parallel design"], "figs": ["queueOverload"], "production": ["Commure reports one health system at 200K+ calls a year (vendor-reported): about 800 a working day, 120 in a 15% peak hour, about 6 at once at 3 minutes each, about 25 in a burst", "Load test one worker with simulated calls until time to first audio or audio quality degrades; that point, not CPU percent, sets calls per container", "Model providers limit requests and tokens per minute; a design with two agents per turn doubles requests, so it meets that limit first", "Scale on concurrent calls per worker and keep warm spare capacity, since a cold container costs seconds on a live call"], "mcq": [{"q": "120 calls arrive in the peak hour and average 3 minutes. On average, how many are live at once?", "o": ["40", "2", "6", "360", "120"], "a": 2, "why": "Arrival rate is 2 a minute; times 3 minutes is 6 (Little's law). Then add a burst factor before sizing."}, {"q": "Why size from calls in the peak hour rather than from daily active users?", "o": ["Concurrency comes from arrival rate and duration, and the peak hour sets the arrival rate", "User counts are private, while call counts are not", "Little's law only works with hourly data", "Providers bill per call, not per user", "Daily users understate load because each user calls several times"], "a": 0, "why": "Users only matter through how many calls they make and when. The peak-hour arrival rate times duration is the number that fills workers."}, {"q": "What do you load-test to decide how many containers to run?", "o": ["Requests per second on the authorize function", "The model's tokens per second", "Memory per container at idle", "Daily calls per container", "Calls per container before time to first audio or audio quality degrades"], "a": 4, "why": "Voice workers fail by sounding bad before they fail by crashing, so the limit is the call count where the gates start to slip."}], "open": {"q": "How would you size the infrastructure for a voice agent taking one health system's phone calls?", "probe": "Capacity thinking from first principles, with honest numbers.", "a": ["Start from calls: Commure reports about 800 a working day for one system (vendor-reported)", "Peak hour at about 15%: 120 calls; at 3 minutes, Little's law gives about 6 at once", "A burst factor of about 4: about 25 at once", "Load-test calls per container; at 8 a container that is 4, plus headroom", "Watch CPU per call, provider rate limits and the authorize budget as it grows"]}, "say": ["I start from calls, not users. Take the busiest hour, multiply by how long a call lasts, and Little's law gives you how many are live at once.", "For one health system at around 800 calls a day, that's about 6 at once in the peak hour and maybe 25 in a burst.", "Then I'd load-test one worker to see how many calls it holds before audio slips, and that gives the replica count. For the agent I own I talk about what it's sized for, and the method is the same."], "avoid": ["Quoting alfred_ user or call numbers: describe what it is sized for, and use the method"], "was": ["q-how-would-you-size-a-voice-agent-s-infrastructure"], "res": [{"kind": "video", "req": true, "label": "Little's Law Explained | L = λ × W | Queueing Theory and System Design", "url": "https://www.youtube.com/watch?v=fYjiS2ogcoE", "m": 6, "why": "Calls at once equal arrival rate times call length.", "yt": {"id": "fYjiS2ogcoE", "ch": "Industry Ready Coder"}}, {"kind": "keep", "src": "site", "req": false, "label": "Session wc21: The backend under a live agent", "url": "../index.html#/w/wc21", "m": 20, "why": "Step 5: scaling a service that holds live calls"}]}, {"id": "own-evals", "title": "Evals for a voice agent", "brief": "A scenario harness tests the voice agent in three layers: text, audio and live, with gates on audio quality, time to first audio, barge-in and dead air. A configuration ships only if it clears every gate. The nuance: most voice failures are timing and audio, which a text-only eval cannot see, and real failures from production should come back as new scenarios.", "points": ["Text layer: scenarios check the right tool with the right arguments, cheap enough to run on every change", "Audio layer: synthetic caller audio through the real speech stack, where turn detection and transcription errors appear", "Live layer: calls through the real phone path, the only place telephony and network behave like production", "Gates: audio quality, time to first audio, barge-in and dead air as thresholds; a configuration that misses any gate does not ship", "Failure loop: a production failure scanner finds the calls that went wrong, and each becomes a scenario"], "figs": ["evalHarness", "benchLoop"], "production": ["Gate on percentiles, not averages: a p95 time to first audio catches the slow calls people remember", "Repeat each scenario several times: one passing run of a stochastic agent is not evidence", "Simulated callers with background noise and network jitter catch failures that clean test audio hides", "Behaviour that must happen on time, like a filler or a timeout, belongs in code, where a test can pin it, not in the prompt"], "mcq": [{"q": "Every text-layer scenario passes, but callers say the agent talks over them. Why did the evals miss it?", "o": ["The text scenarios used a different model", "Talking over a caller is a timing and turn-taking failure that only audio and live layers can see", "The prompt differs between text and voice modes", "Text scenarios run too fast, so slowing them would catch it", "The scenarios were too short to include an interruption"], "a": 1, "why": "Text mode has no audio, no voice activity and no end-of-turn detection, so barge-in and overlap cannot fail there.", "pair": "text-vs-audio"}, {"q": "Which failure would a text-layer scenario catch?", "o": ["Two seconds of dead air while a tool runs", "The agent keeps talking after the caller interrupts", "Speech to text mishears a name in a noisy room", "The agent calls the booking tool with the wrong date", "Time to first audio creeps up after a provider change"], "a": 3, "why": "Text scenarios test reasoning and tool use: which tool, with which arguments. Timing and audio need the other layers.", "pair": "text-vs-audio"}, {"q": "Configuration A scores higher on answer quality but fails the barge-in gate. Configuration B passes every gate with lower quality. Which ships?", "o": ["A, because quality matters more than one gate", "A, with a prompt line asking it to stop when interrupted", "B, because a configuration must clear every gate before quality is compared", "Both, splitting traffic to decide later", "Neither, until the two barge-in scores are averaged"], "a": 2, "why": "Gates are floors, not weights. A configuration that talks over callers is not a candidate however good its answers are."}], "open": {"q": "How do you evaluate a voice agent, and what would block a release?", "probe": "Whether he knows voice evals differ from chat evals, and treats them as a release gate.", "a": ["Three layers: text for tools and arguments, audio for the speech stack, live for the phone path", "Gates on audio quality, time to first audio, barge-in and dead air", "A configuration ships only if it clears every gate; quality is compared after", "Percentiles, not averages, and several runs per scenario", "A failure scanner on production calls feeds new scenarios back in"]}, "say": ["For the voice agent I own there's a scenario harness in three layers: text, audio and live.", "Text catches the wrong tool or the wrong argument. Audio and live catch what actually goes wrong on calls, which is mostly timing: slow first audio, talking over people, dead air. Those are gates, and a change that misses one doesn't ship.", "Then a failure scanner finds the bad calls in production, and those become new scenarios. That's the loop."], "avoid": ["Quoting a scenario count, pass rate or call numbers you cannot back on the spot"], "was": ["q-how-do-you-evaluate-a-voice-agent"], "res": [{"kind": "keep", "src": "site", "req": true, "label": "Session wc23: Your voice agent at depth", "url": "../index.html#/w/wc23", "m": 25, "why": "Step 5: evals and what went wrong"}]}]}, {"id": "design", "title": "Designing a patient-call voice agent", "blurb": "Design an AI agent for a health system's phone line in 45 minutes, with safe EHR write-back and a HIPAA-aware approach, then tell your story for Commure.", "sessions": ["wc24"], "topics": [{"id": "design-requirements", "title": "Requirements and numbers first", "brief": "Spend the first few minutes on scope and numbers: which call types the agent handles (scheduling, rescheduling, cancellations, confirmations, FAQs, intake), what always goes to staff, the call volume and the latency target. Then draw the path of one call before any box for scale. The requirement people miss: every call must be answered, so the design needs a path to a human when the agent fails.", "points": ["Scope: scheduling, rescheduling, cancellations, confirmations, FAQs and intake; clinical questions go to staff", "Every call answered: if the agent, a vendor or the EHR fails, the call falls through to a human queue, never to silence", "Numbers: about 800 calls a working day for one system (Commure's figure) gives about 6 at once in the peak hour, about 25 in a burst", "Latency: a target for time to first audio and turn latency, stated up front, because it shapes every later choice", "Order: requirements, entities, API, then the path of one call, then two deep dives you choose"], "figs": ["callPath"
