MockFlow-AI, real healthcare work at UIC, and a clear reason for the move. A recruiter would pass you on the strength of that.", "The delivery is what costs you. Almost every answer opened with mechanism before outcome, wandered through a list, and trailed off instead of landing. The voice answer, the one that matters most for this role, went into Supabase functions and Railway workers before it said whether the agent is live or yours. Fix the order and the endings, and the same facts sound twice as strong."], "landed": ["'Me building it from scratch': plain and believable.", "The parallel heavy agent came through as a real design choice, even to a non-engineer.", "Why Commure: the UIC clinical work and the 30 percent of unanswered calls, said as 'from what I can read'.", "TypeScript for the web app, Python for the workers: honest and precise."], "fix": [{"t": "Outcome first, one detail, then stop. A recruiter asks what, whether it is live, and whether it is yours; answer those before any mechanism.", "ref": "x2"}, {"t": "One set of facts for the voice agent: live for whom, and how many use it daily. The mock said a cohort and about 50 a day; the page says live for everyone and over a thousand.", "ref": "x3"}, {"t": "Open the intro on voice and healthcare, not WheelPrice's SEO blog.", "ref": "x1"}, {"t": "Answer every part of a two-part question, a sentence each. Skipping one reads as dodging.", "ref": "x6"}, {"t": "End every answer with a closing sentence instead of trailing off: 'So that's the work I want to do more of.'", "ref": "x4"}], "exchanges": [{"id": "x1", "label": "Background and why now", "who": "Audrey", "q": "Why don't you walk me through your background, and what's got you looking right now?", "tests": "Can you tell your story in a minute, and does it point at this role?", "said": ["Founding engineer at alfred_, an executive assistant over work apps, 5,000-plus subscribers. Making agents reliable in production; owned many verticals: memory, the eval harness, orchestration, delegation, and voice. Before that WheelPrice, a two-person engineering team: full stack, an SEO blog, a computer vision feature, a fitment assistant. Wanted a founding seat to get into agentic systems. Now wants a larger engineering surface and an established product with traction."], "verdict": "partly", "why": "The arc and the why-now were right, but voice, the whole reason for this role, came as the last item in a list, and the WheelPrice detail took the space healthcare should have had.", "good": ["A real number early: 5,000-plus subscribers.", "A clean why-now at the end: a larger surface, a product with traction."], "bad": ["Voice buried in a list of five verticals.", "UIC and healthcare missing from the intro of a healthcare role.", "SEO blog and fitment assistant: true, irrelevant here.", "Restarts and filler: 'roughly about', 'largely', 'as well as well as'."], "approach": ["Four sentences: who you are now, the voice agent you own, the healthcare thread, why this move. Stop and let her pick."], "say": ["I'm a founding engineer at alfred_, an AI assistant over email, calendar and work apps, with 5,000-plus subscribers. I own making the agent reliable in production, and for the last few months that's meant voice: I built and own our voice agent, which people call from their phones.", "Before that I was at WheelPrice, a two-person engineering team, shipping across the stack, and before that at UIC, where I built ML systems with clinicians in the health sciences.", "What I want next is that same work on a product that already has real traction, and a patient on the other end of the call is about as real as it gets."], "ref": "#say-intro", "land": "Founding engineer, voice agent I own, healthcare at UIC, why this move. Then stop."}, {"id": "x2", "label": "The voice agent", "who": "Audrey", "q": "What have you actually built on the voice side at alfred_? Is it live, are people using it? And what part of it is yours?", "tests": "Three plain questions: what, is it live, is it yours.", "said": ["It runs as a function in the Supabase backend with wrapped tools; a heavy agent behind web and SMS. The voice agent is still in development, rolled out to a cohort of paying users. Python workers on Railway claim the call; a cascaded pipeline plus GPT realtime. The voice agent has core tools; the heavy agent reads the same request and runs without waiting for delegation, and when the voice agent can't do it, it answers from the heavy agent's result."], "verdict": "missed", "why": "None of her three questions was answered first. She got the architecture, which she said went over her head, and the status came out as 'still in development', which undersells a thing people use daily.", "good": ["The parallel heavy agent is the distinctive idea, and it was in there."], "bad": ["Mechanism before outcome: Supabase, wrappers, Railway, cascaded pipeline.", "'Still in development' as the status line.", "'Mine' never said in this answer."], "approach": ["Answer her three questions in order: what it does, that it's live and who uses it, that you built it. Then one design choice in a sentence. Offer depth for the engineers."], "say": ["Yes. You can call alfred_ from your phone, or tap the mic in the web app, and talk to the same assistant that knows your email and calendar. I built it and I own it end to end, and paying users call it every day.", "The one design choice I'd point to: the agent on the call stays lean so it answers fast, and every request also goes to our main agent in parallel, so when something needs real work there's no extra wait. Happy to go deeper with the engineers."], "ref": "#say-voice", "land": "What it does, live and used daily, I built it; one design choice; offer depth."}, {"id": "x3", "label": "Ownership and usage", "who": "Audrey", "q": "Was that you building it from scratch, or one of several people? And roughly how many people use it today?", "tests": "A straight answer with a number.", "said": ["Built from scratch; a team of four but the engineering is largely end to end. A web voice mode that works the same way over a live WebSocket. About 50 daily active users, scaled gradually since last month, soon released to the whole cohort."], "verdict": "partly", "why": "Direct and honest, with a number. But the number contradicts the prep page, and 'I own it end to end' came last instead of first.", "good": ["'Me building it from scratch' as the first words.", "A number and a trajectory: 50 a day, growing, wider release soon."], "bad": ["The web socket detail is for engineers.", "Inconsistent with the page: live for everyone and over a thousand daily. Pick the true one and say it every time."], "approach": ["First words answer the question; second sentence is the number and the direction; stop."], "say": ["Me, from scratch. We're four people and I own voice end to end, phone and web. It's with a cohort of paying users now, about 50 a day, growing since last month, and we're opening it to everyone soon."], "land": "Me, from scratch; the number; where it's heading."}, {"id": "x4", "label": "Why Commure and healthcare", "who": "Audrey", "q": "What is it about Commure, and about doing this in healthcare, that made you apply?", "tests": "Have you read about us, and is the interest real?", "said": ["Worked as a research software engineer at UIC with the health sciences department, alongside medical professionals. From the website, 30 percent of patient calls never get answered. Real-time voice is the hardest version of the work you like: latency, interruptions, now capable agents and realtime models. Comfortable shipping it to production reliably, the larger part of this year. Wants to spend the next few years going deeper."], "verdict": "landed", "why": "Your best answer: a personal link to healthcare, one fact from their site said carefully, and why the work suits you. It only lost points for the ending.", "good": ["UIC with clinicians: real, and she noticed.", "'From what I can read': their number, not yours.", "Reliability in production as your angle."], "bad": ["Didn't say what their agents do (book, reschedule, write back to the EHR), which shows you read past the headline.", "Trailed off: 'getting more in depth nuances, correct'."], "approach": ["Their problem in a line, your link to it, the work you like, then a closing sentence."], "say": ["From what I read, about 30 percent of patient calls never get answered, and your agents pick up and actually finish the job: they book, reschedule, and write it back to the EHR. That's a real person on the other end.", "I've worked with clinicians at UIC, so the domain isn't new, and real-time voice that takes actions safely is exactly what I do at alfred_. So it's the work I want to go deeper on, in a place where it matters."], "ref": "#say-why-commure", "land": "Their problem, your link to it, a closing sentence."}, {"id": "x5", "label": "Python and a side project", "who": "Audrey", "q": "How much of your day-to-day is Python? And is there a voice side project you'd point the engineers to?", "tests": "Python for a Python-first role, and one thing they can look at.", "said": ["The web app is TypeScript; the Railway workers are Python: workflow workers, long-running agents and the voice agents. A hands-on approach, end to end then the nuances. MockFlow-AI, a real-time voice assistant: streaming models, STT, interruption handling, which helped reach an MVP fast at alfred_. FastAPI and Django back ends and ML research too."], "verdict": "partly", "why": "The Python split was honest and clear. MockFlow-AI was named without what it is, a number, or that it's live, which is what makes it worth looking up.", "good": ["TypeScript web, Python workers: precise.", "MockFlow-AI tied to how you shipped alfred_'s MVP fast."], "bad": ["'Hands-on approach with the current coding setup' said nothing.", "No number for MockFlow-AI: under 400 ms, live.", "'Pretty handy' undersold it."], "approach": ["One line on where your Python is; one line on MockFlow-AI with its number."], "say": ["Our web app is TypeScript, but everything that runs agents is Python: the voice workers, the workflow workers, the long-running agents. Before that, FastAPI backends and ML research in Python.", "And MockFlow-AI: a real-time voice interview platform I built from scratch on LiveKit, under 400 milliseconds end to end, and live. Most of what I knew on day one of alfred_'s voice agent came from it."], "land": "Where your Python is; MockFlow-AI with its number."}, {"id": "x6", "label": "Logistics", "who": "Audrey", "q": "On site in Mountain View, work authorization, compensation.", "tests": "Short, complete answers so the process can move.", "said": ["Answers kept in chat, not on this page."], "verdict": "partly", "why": "On site was a clear yes, but it came wrapped in a paragraph, and the second half of a two-part question was skipped twice. On a real call, a skipped work authorization question stops the process until it's answered.", "good": ["The first answer was clear and immediate."], "bad": ["Two-part question, one part answered.", "A paragraph where one sentence was asked for."], "approach": ["One sentence per item, in the order asked, then hand it back. The answers themselves stay in chat."], "say": ["[On site and relocation: one sentence.] [Work authorization: one sentence.] [Pay: one sentence, anchored to the posting's range, asking about the full package.] Then: 'Happy to answer anything else on that by email.'"], "land": "A sentence each, in the order asked."}, {"id": "x7", "label": "Your questions", "who": "Audrey", "q": "What questions do you have for me?", "tests": "Curiosity, and whether you're thinking about the job itself.", "said": ["Where this role sits after the recent acquisitions and how it works with the product. Then next steps and the team."], "verdict": "partly", "why": "Good instincts, but the first question came out tangled, and the strongest closer was missing: asking whether anything in your background needs making clearer.", "good": ["Asking about the team and the next steps."], "bad": ["'Especially with the recent acquisitions where this particular role is in the team' was hard to follow.", "No closing question that invites her concerns."], "approach": ["Two short questions, then the closer."], "say": ["Commure has a few product lines now. Where does the voice agents team sit, and who would I work with most day to day?", "What do the technical rounds look like, and roughly what's the timeline?", "And is there anything in my background you'd want me to make clearer for the team?"], "land": "Team, process, then invite her concerns."}]}], "planKicker": "Before the call", "mechTitle": "", "designLink": null, "extra": "<b>Work in this order.<\/b> For Monday's fifteen minutes: the first Learn module, your story, explained aloud and compared. For the round after: the other six modules in order, the call path, the conversation loop, the backend, Python async, your voice agent and the design; check yourself on each and 'Test me' until the weak squares turn. Then say 'run the Commure mock' in chat.", "emphasis": [], "own": null, "showUp": [["Know the product in one line.", "AI call center agents that pick up every patient call: scheduling, rescheduling, cancellations, confirmations, FAQs and intake, written back to Epic, Cerner or Athena. Clinical questions go to staff."], ["Lead with alfred_'s voice agent.", "You own it end to end and it is live for everyone: phone over SIP and the web over WebRTC into LiveKit, one Python worker, a lean agent on the call with the main agent started in parallel on every turn. Reads answer fast; writes wait and the person confirms. That is Commure's job: call orchestration, conversation state, tool execution and write-back."], ["Then MockFlow-AI.", "The one you built from scratch and have live: LiveKit, under 400 ms, stages that move only by tool call, and an LLM-as-judge calibrated against human grades."], ["Say Python.", "The role is Python first. Your Python: FastAPI services, the UIC backend, the eval tooling, PyTorch. alfred_'s product code is TypeScript; say so if asked."], ["Outcomes, then stop.", "A recruiter wants what changed and what you owned, with a number. Leave the architecture for the technical rounds."], ["Logistics: one line each.", "The posting says Mountain View, on site five days. Pay, relocation, work authorization, start date: your answers are in chat."], ["Close with next steps.", "Ask what the technical rounds look like, and whether anything in your background needs making clearer."]], "prepLead": "Say comes last. Start with the <b>Understand first<\/b> bank: four questions that everything else rests on, each with its figure and the session that teaches it. Then the design, then your story out loud with the timer.", "storyBlurb": "Your intro, why Commure, the healthcare voice story, and logistics.", "sources": [{"label": "Software Engineer, Voice Agents: the job post (Ashby)", "url": "https://jobs.ashbyhq.com/commure/0e3440aa-4ddc-4a43-b4c3-804e60a1b2ff", "why": "The official posting. Its text is read from the mirror below."}, {"label": "The same posting, full text (freehire mirror)", "url": "https://freehire.me/jobs/software-engineer-voice-agents-commure-kvlqymic", "why": "Python backend for real-time voice agents: call orchestration, conversation state, tool execution, EHR write-back; low-latency telephony, ASR, LLM and TTS; Epic, Cerner, Athena. 2 to 4 years; async and real-time; testing, LLM evaluation, observability. Mountain View, on site; $130K to $180K."}, {"label": "Commure Agents: product page", "url": "https://www.commure.com/agents", "why": "69+ EHRs; 50% less manual call volume and $650K+ saved per 100 providers (their figures)."}, {"label": "Commure launches Commure Agents (press release, 25 June 2025)", "url": "https://www.commure.com/press-releases/commure-launches-commure-agents---ai-assistants-that-fully-automate-physician-workflows", "why": "AI Call Center Agents, Orchestrator and Engage. Tanay Tandon is the CEO; HCA and Tenet named."}, {"label": "Voice AI for patient call automation (Commure guide)", "url": "https://www.commure.com/blog-agents/voice-ai-systems-patient-call-automation", "why": "What gets automated and what doesn't: triage, authorizations and medication questions stay with people. Write-back so nothing is entered twice; escalation rules; PHI under a BAA."}, {"label": "Best voice AI agents in healthcare (Commure)", "url": "https://www.commure.com/blog-agents/best-voice-ai-agents-in-healthcare", "why": "One deployment: 45+ locations, 225+ providers, 200K+ inbound calls a year, abandonment at or under 3%. Configured during implementation, not plug-and-play."}, {"label": "How AI agents expand call center capacity (Commure)", "url": "https://www.commure.com/blog/how-ai-agents-expand-call-center-capacity-and-patient-access", "why": "30 to 80% of inbound calls resolved without staff, depending on the workflow."}, {"label": "Commure raises $70M at a $7B valuation (TBPN, 19 May 2026)", "url": "https://www.tbpndigest.com/story/2026-05-19/commure-raises-70m-at-7b-valuation-to-deploy-ai-agents-across-the-full-healthcare-administrative-stack", "why": "Led by General Catalyst with Sequoia; hiring 40 to 50 engineers for an AI-native EMR and voice agents."}, {"label": "Commure to acquire Augmedix (Healthcare Dive)", "url": "https://www.healthcaredive.com/news/commure-acquire-augmedix-ai-documentation/721978/", "why": "About $139M, July 2024: now the Ambient AI scribe line. Commure merged with Athelas in 2023."}, {"label": "Inside Commure: culture (Commure blog)", "url": "https://www.commure.com/blog/inside-commure-building-healthcares-future-starts-with-culture", "why": "Speed above all, high ownership and output, working shoulder to shoulder with customers, clear communication."}, {"label": "Commure: company site", "url": "https://www.commure.com", "why": "130+ health systems; '30% of patient calls never get answered' (their figure); Ambient AI, Dictation, revenue cycle, Agents."}], "company": ["Commure builds what they call the AI operating system for healthcare: Ambient AI and Dictation for documentation, Agents for patient and revenue workflows, and revenue cycle automation, on one platform integrated with 60+ EHRs. They report 500,000+ clinicians across 500+ organizations and over 200 million patient interactions.", "They raised $70M at a $7B valuation in May 2026, merged with Athelas in 2023 and bought Augmedix in 2024. The team works directly alongside clinicians, deploys daily, and values speed and ownership."], "posting": {"url": "https://jobs.ashbyhq.com/commure/0e3440aa-4ddc-4a43-b4c3-804e60a1b2ff", "label": "Software Engineer, Voice Agents, on Ashby", "checked": "1 October 2026", "lead": "Health system call centers can't keep up: they report that 85% of patients who can't get through never call back. The voice agents pick up every call and handle it end to end: scheduling, rescheduling, cancellations, confirmations, FAQs and intake, integrated with the EHR and telephony in real time. This role builds the systems they run on. Mid-level, on a small team that ships every day.", "facts": [["Where", "Mountain View, CA, on site five days a week"], ["Pay", "$130K to $180K, plus equity (the posting)"], ["Level", "Mid-level; 2 to 4 years of backend experience"]], "does": ["Python backend services for real-time voice agents: call orchestration, conversation state, tool execution and EHR write-back.", "Low-latency pipelines joining telephony, ASR, LLMs and TTS into one conversational loop.", "Integrations with Epic, Cerner, athena and others for scheduling, eligibility and intake.", "APIs, data models and event-driven workflows, designed with senior engineers.", "Features patient access teams actually use, with AI, product and operations.", "Own the quality of what you ship: latency, reliability, observability, release readiness."], "wants": ["2 to 4 years of backend work, mostly in Python.", "Production services, APIs and data models shipped.", "An intuition for how people talk to voice and text assistants.", "Async, event-driven or real-time systems, or the wish to grow into them.", "Testing, LLM evaluation, observability and reliability.", "A patient-centered mindset, a bias for action and ownership."]}, "rounds": [], "research": null, "learn": {"lead": "One path for Commure: Monday's screen first, then the groundwork for the round after it (practical Python builds, a system design round, then leadership). Each topic: learn it, check yourself with multiple choice, explain the open question aloud, then compare and rate yourself. The squares show where you stand.", "modules": [{"id": "you", "title": "You: Monday's screen", "blurb": "Fifteen minutes: your story, why Commure and voice, the voice agent you own, logistics. Explain each aloud, then compare.", "sessions": [], "extras": ["drills", "ask"], "topics": [{"id": "you-intro", "title": "Tell me about yourself", "brief": "Research, shipping, production agents, and now a live voice agent I own.", "points": ["They may ask: What does alfred_ do?", "They may ask: What did you build at UIC?", "They may ask: Why voice agents?"], "production": [], "say": [], "avoid": [], "mcq": [], "was": ["say-intro"], "open": {"q": "Tell me about yourself", "probe": "The opener. Land on healthcare and real-time voice.", "a": ["Sure. I started out in computer science research at UIC, where I worked on applied ML and LLM systems. That gave me a pretty strong foundation in actually building and evaluating these systems, rather than just using the models.", "From there I joined WheelPrice, which was a much more startup-oriented environment. I was working across the stack and got a lot more exposure to shipping things that were actually being used by customers. It was a small engineering team, so I had to be pretty broad — backend, AI, infrastructure, and product work all kind of blended together.", "After that I joined alfred_, where I've been working as a founding LLM engineer. It's an AI assistant, and my work has become much more focused on reliability and evaluation — things like building the eval harness, production failure detection, working memory, and making sure agent changes actually improve the product rather than just looking better on a benchmark.", "The common thread through all of that has really been building AI systems in environments where you don't have a perfectly defined problem in front of you. You have to figure out what's broken, decide what to build, and then own it through production.", "And for the last few months that's meant voice: I own alfred_'s voice agent, which people call from their phones, and before that I built a real-time voice platform on LiveKit from scratch. So an agent that actually answers patients' calls and finishes the job is pretty much where I want to be."]}}, {"id": "you-why-commure", "title": "Why Commure? Why voice agents?", "brief": "Every patient call answered and finished; real-time voice plus actions in the EHR; healthcare I've worked in.", "points": ["They may ask: What do you know about us?", "They may ask: Why healthcare?", "They may ask: Why not a general voice AI company?"], "production": ["If she asks what stood out: That clinical questions go to staff by design. Knowing what an agent shouldn't handle is most of what makes it safe."], "say": [], "avoid": ["Don't quote their savings figures as fact: 'they report'."], "mcq": [], "was": ["say-why-commure"], "open": {"q": "Why Commure? Why voice agents?", "probe": "After the intro, or after her pitch.", "a": ["A couple of things. From what I read, around 30% of patient calls never get answered, and each one is someone trying to see a doctor. Your agents pick up every call and actually finish the job: they book, reschedule, do intake, and write it back to Epic or Athena. That's a real problem with a real person on the other end.", "Second, it's the hardest version of the work I like. Real-time voice, where latency and interruptions matter, plus an agent that takes actions in a system of record, where a wrong booking is worse than no booking. I do exactly that at alfred_: I own our voice agent, phone and web, and it works in people's real email and calendars, where a wrong action is worse than no action.", "And healthcare isn't new to me: my research is on multi-agent medical reasoning, and at the UIC lab I worked on voice for patients in the hospital.", "So it's a problem I care about, in a domain I've worked in, at a company that's already deployed at scale."]}}, {"id": "you-voice", "title": "Your voice work: alfred_ first, then MockFlow-AI", "brief": "A live voice agent I own, phone and web, with a lean agent on the call and heavy work in parallel; and one I built from scratch.", "points": ["They may ask: What did you own?", "They may ask: Is it live?", "They may ask: How fast is it?", "They may ask: How many users?"], "production": ["If she asks how that maps to EHR write-back: It's the same policy: on the call, the agent can look things up fast, but a write waits for the careful path, gets read back, and the person confirms. For Commure that's a booking in Epic instead of an email.", "If she asks how many users: alfred_ has 5,000-plus subscribers, and over a thousand use the phone agent daily. Every call leaves a record with its timing and cost, so we can see what's actually happening.", "If she asks about healthcare: My research is multi-agent medical reasoning, TeamMedAgents, and at the UIC lab I deployed an INT8 audio model at 150 milliseconds p95 for patient voice interaction on the hospital network."], "say": [], "avoid": [], "mcq": [], "was": ["say-voice"], "open": {"q": "Your voice work: alfred_ first, then MockFlow-AI", "probe": "When she asks what you've done that's closest to the role. Outcome first, then one design choice, then stop.", "a": ["The closest is alfred_'s voice agent, which I own end to end and which is live for everyone. You call alfred_ from your phone, or tap the mic in the web app, and talk to the same assistant that knows your email and calendar. Calls come in over a SIP trunk into LiveKit, the web joins over WebRTC, and one Python worker serves both.", "The design choice I'd point to: the agent on the call is deliberately lean, a small set of tools and two quick model calls, so it stays responsive. Every time the caller says something, the same request also goes, in parallel, to our main agent, the one behind chat and SMS. So when a request needs real work, there's no escalation step and no extra two to three seconds of silence. Reads it answers fast; anything that writes waits for the main agent, and the person confirms. It never acts on a half-heard instruction.", "Before alfred_, I built MockFlow-AI from scratch: a real-time voice interview platform on LiveKit, under 400 milliseconds end to end, where the conversation moves between stages only when the model calls a tool, so it can't drift. It's live, and it grades its own interviews with a judge I calibrated against human scores."]}}, {"id": "you-fit", "title": "How does your background fit the role", "brief": "Real-time voice, tool execution and evals, done; EHRs and call-center telephony named as new.", "points": ["Lead with what you've shipped in voice."], "production": [], "mcq": [], "say": [], "avoid": [], "open": {"q": "How does your background fit the role?", "probe": "Is the resume real, and does it match?", "a": ["Most of it maps directly. The posting asks for Python backends for real-time voice agents, conversation state and tool execution, low-latency pipelines from telephony through ASR, the LLM and TTS, and quality: testing, LLM evaluation and observability.", "I own a live voice agent end to end, phone and web, and I built another from scratch on LiveKit, with the evals and tool execution behind both. What I haven't done is EHR integrations like Epic or telephony at call-center scale, and I'd rather say that plainly."]}, "was": ["q-how-does-your-background-fit-the-role"]}, {"id": "you-logistics", "title": "Logistics she will ask", "brief": "Say each once, then back to the role.", "points": ["They may ask: The role is on site in Mountain View, five days. Does that work?", "They may ask: Would you relocate?", "They may ask: Compensation?", "They may ask: Work authorization?"], "production": [], "say": [], "avoid": [], "mcq": [], "was": ["say-logistics"]}]}, {"id": "call", "title": "How a call reaches the agent", "blurb": "Trace a call from the phone network to a Python process holding it, and say why each hop exists.", "sessions": ["wc19"], "topics": [{"id": "call-sip-rtp", "title": "Signalling and media travel apart", "brief": "A phone call is two flows. SIP sets the call up and tears it down (INVITE, 180 Ringing, 200 OK, BYE) and carries no sound; the audio goes separately as RTP packets over UDP. The nuance people miss: UDP is chosen because late audio is worthless, so a lost 20 ms packet is dropped, never resent.", "points": ["SIP: signalling only; it asks for, rings, answers and ends the call, and carries no audio", "RTP: the audio itself, on a separate path, usually over UDP", "G.711 mu-law: 8,000 samples a second at 8 bits, 64 kbit/s, cut into 20 ms packets, so 50 packets a second each way", "UDP over TCP: a resent packet arrives too late to play, so losing 20 ms beats stalling the stream", "SIP trunk: the link between the phone network and your software; the media server turns its packets into an audio track code can read", "8 kHz: why phone audio sounds thin, and why speech models on a phone path get narrowband input"], "figs": ["callPath"], "production": ["Twilio Elastic SIP Trunking: origination brings calls from the phone network to your SIP endpoint; termination sends calls out", "Twilio Media Streams: another way in, delivering call audio as 8 kHz mu-law over a WebSocket instead of a SIP stack", "LiveKit SIP service: terminates the trunk and publishes the caller as a participant with an audio track", "Codecs: G.711 on the phone network, Opus on WebRTC; the media server transcodes between them"], "mcq": [{"q": "A caller's audio keeps breaking up, but the call never drops. Which flow is most likely in trouble?", "o": ["The SIP INVITE that set the call up", "The SIP BYE that will end the call", "The RTP stream carrying the audio packets", "The 200 OK that answered the call", "The SIP registration of the trunk"], "a": 2, "why": "Once a call is set up, SIP goes quiet until hang-up. Choppy audio on a live call lives in the RTP media path.", "pair": "sip-vs-rtp"}, {"q": "Why does call audio usually travel over UDP rather than TCP?", "o": ["A resent packet would arrive too late to play, so dropping it is better", "UDP encrypts the audio and TCP does not", "TCP cannot carry binary audio payloads", "UDP guarantees packets arrive in order", "SIP trunks only accept UDP for signalling"], "a": 0, "why": "TCP would stall the stream waiting for a resend. In live audio a missing 20 ms is barely heard, a stall is.", "pair": "sip-vs-rtp"}, {"q": "What does the 8 kHz sample rate of a phone call mean for a voice agent?", "o": ["The agent has 8 ms to answer each packet", "Each packet holds 8,000 samples", "The call can carry at most eight participants", "Nothing above 4 kHz survives, so speech models get thinner input than on web", "Phone audio needs no jitter buffer, unlike web audio"], "a": 3, "why": "The highest frequency captured is half the sample rate. Models trained on wideband audio lose detail on a phone line."}], "open": {"q": "A patient dials the clinic. Walk me through what is on the wire before our agent hears the first word.", "probe": "Whether you know what each protocol is for, not only its name.", "a": ["SIP over the trunk sets the call up: INVITE, ringing, 200 OK", "Audio flows separately as RTP over UDP, G.711 at 8 kHz, 20 ms packets", "UDP because late audio is useless: drop, don't resend", "The media server's SIP service turns the packets into an audio track", "Trade-off to name: 8 kHz is cheap and universal but costs recognition accuracy"]}, "say": ["I think of a call as two things. SIP sets it up through the trunk: invite, ringing, answer, and later bye. The audio goes separately as RTP over UDP, 20 ms packets, because a late packet is useless, so you drop it rather than wait. On a phone line that audio is 8 kHz, which is why speech models do a bit worse on calls than on the web."], "avoid": ["Saying SIP carries the audio: it only sets the call up and tears it down"], "was": [], "res": [{"kind": "video", "req": true, "label": "Introducing SIP and RTP in VoIP", "url": "https://www.youtube.com/watch?v=VlQ3XQiCJGM", "m": 6, "why": "Signalling and media as two separate flows, in one short pass.", "yt": {"id": "VlQ3XQiCJGM", "ch": "Matt Explains Systems"}}, {"kind": "read", "req": true, "label": "Twilio: Elastic SIP Trunking, origination and termination", "url": "https://www.twilio.com/docs/sip-trunking", "m": 10, "why": "What a SIP trunk is and which way calls flow through it"}, {"kind": "video", "req": false, "label": "SIP, SDP, and RTP Work | Introduction to VoIP (Part 3)", "url": "https://www.youtube.com/watch?v=1is1PwQKo8w", "m": 12, "why": "The INVITE, 200 OK, ACK exchange and where the audio addresses are agreed.", "yt": {"id": "1is1PwQKo8w", "ch": "Network Direction"}}, {"kind": "read", "req": false, "label": "TelcoBridges: VoIP codec guide, the G.711 and Opus parts", "url": "https://telcobridges.com/learning/sip-trunking/voip-codec-guide/", "m": 6, "why": "Where the 64 kbit/s and the 8 kHz come from"}]}, {"id": "call-webrtc", "title": "How a browser joins: WebRTC", "brief": "A browser can't open raw UDP to anyone it likes, and most users sit behind NAT. WebRTC handles both: an SDP offer and answer describe codecs and addresses, ICE tries candidate paths, STUN finds the public address, and TURN relays as a last resort. The nuance: TURN and the jitter buffer both buy reliability with latency.", "points": ["SDP: the offer and answer saying which codecs and addresses each side supports", "ICE: tries candidate paths, a direct address first, then the public address a STUN server reports", "TURN: relays every packet when no direct path works (strict NAT, firewalls); costs latency and bandwidth", "DTLS-SRTP: WebRTC media is always encrypted", "Opus at 48 kHz: the usual web codec, far fuller than a phone line", "Jitter buffer: holds a few tens of milliseconds so uneven arrival does not become clicks and gaps"], "figs": ["callPath"], "production": ["LiveKit client SDK: the browser gets a room token from your backend, then connects to the SFU over WebRTC", "Signalling is the application's job: WebRTC defines SDP but not how it travels, so LiveKit carries it over its own WebSocket", "Adaptive jitter buffers: grow when the network is uneven and shrink when it settles, trading delay for smoothness"], "mcq": [{"q": "A web caller on a strict corporate network only connects through TURN. What changes for that call?", "o": ["The audio switches from Opus to G.711", "Every packet goes through a relay, adding latency and bandwidth cost", "The media is no longer encrypted", "SDP negotiation is skipped", "The jitter buffer is switched off"], "a": 1, "why": "TURN is the fallback relay. The call still works and stays encrypted, but every packet takes the extra hop.", "pair": "stun-vs-turn"}, {"q": "What does a STUN server do in a WebRTC connection?", "o": ["Relays every media packet between the two peers", "Encrypts the media stream with SRTP", "Carries the SDP offer and answer", "Mixes several audio streams into one", "Tells a client the public address its NAT presents, so a direct path can be tried"], "a": 4, "why": "STUN only reports your public address. Relaying is TURN's job; carrying SDP is the signalling channel's.", "pair": "stun-vs-turn"}, {"q": "Why would an engineer accept extra delay from a jitter buffer?", "o": ["It gives the model time to finish generating", "It is needed to decrypt DTLS-SRTP", "Packets arrive unevenly, and a short hold turns that into smooth playback", "It lets the SFU mix streams before forwarding", "It lowers the bandwidth Opus needs"], "a": 2, "why": "Network arrival times vary. A few tens of milliseconds of buffer hides that variation from the listener."}], "open": {"q": "The patient app gets a 'talk to us' button. What has to happen for that browser to reach our agent, and what goes wrong on a hospital network?", "probe": "NAT traversal and what it costs, in plain words.", "a": ["Backend issues a room token; the browser connects to the media server", "SDP offer and answer agree codecs and addresses", "ICE tries direct, then STUN's public address, then TURN", "Locked-down networks often force TURN: more latency and relay bandwidth", "Opus at 48 kHz and a jitter buffer give better audio than the phone line"]}, "say": ["The browser and the server swap SDP, which is pretty much what codecs and addresses each side can use. Then ICE tries paths: direct, then the public address STUN finds, and TURN as a relay if nothing else works. On a locked-down hospital network I'd expect TURN, so a bit more latency. In alfred_ web calls come in over WebRTC into the same kind of room as phone calls."], "avoid": ["Calling STUN a relay: STUN reports your address, TURN relays"], "was": [], "res": [{"kind": "video", "req": true, "label": "How WebRTC Works, Explained Simply (2026)", "url": "https://www.youtube.com/watch?v=ymANT2RGXeg", "m": 5, "why": "The whole picture for a voice-agent builder: offer, answer, NAT, media.", "yt": {"id": "ymANT2RGXeg", "ch": "Voice AI Space"}}, {"kind": "read", "req": true, "label": "WebRTC for the Curious: ch. 3 Connecting", "url": "https://webrtcforthecurious.com/docs/03-connecting/", "m": 20, "why": "NAT, STUN, TURN and ICE candidates"}, {"kind": "video", "req": false, "label": "ICE, STUN and TURN (WebRTC Tips by WebRTC.ventures)", "url": "https://www.youtube.com/watch?v=AjLFvHuG0cE", "m": 5, "why": "Why a direct path often fails and what STUN and TURN each do about it.", "yt": {"id": "AjLFvHuG0cE", "ch": "WebRTC.ventures"}}, {"kind": "read", "req": false, "label": "WebRTC for the Curious: ch. 2 Signaling", "url": "https://webrtcforthecurious.com/docs/02-signaling/", "m": 12, "why": "SDP, offer and answer, in plain words"}]}, {"id": "call-room", "title": "The agent is a participant in a room", "brief": "A media server sits between everyone on a call. An MCU decodes and mixes every stream; an SFU forwards packets without decoding. LiveKit is an SFU organised as rooms, and the agent joins as one more participant: it subscribes to the caller's audio and publishes its own. The nuance: the SIP service turns a phone call into a participant too, so one agent serves phone and web.", "points": ["MCU: decodes every stream and mixes them into one; expensive in CPU", "SFU: forwards packets without decoding; each participant publishes tracks and subscribes to the ones it wants", "Room: one call's space, holding its participants and their tracks", "Agent as participant: subscribes to the caller's audio track, publishes its own", "Phone and web: both arrive as participants, so the agent code is the same; only codec and sample rate differ", "Stateful: a call is pinned to one server for its whole life, unlike a stateless request"], "figs": ["callPath", "alfredVoiceHld"], "production": ["LiveKit: rooms, participants and tracks are the whole model; the SIP service and the agent framework both join rooms as participants", "SFU over MCU: most real-time platforms forward rather than mix, because forwarding needs no decoding", "Stateful routing: a live session is pinned to one server, the pattern behind the guide's stateful servers technique"], "mcq": [{"q": "Why can one agent worker serve both phone and web callers?", "o": ["The browser converts its audio to SIP before joining", "The phone network supports WebRTC natively", "Both arrive as room participants with an audio track, so the agent sees the same thing", "The worker runs two code paths behind a flag", "The SFU mixes both into one stream for the agent"], "a": 2, "why": "The SIP service makes the phone caller a participant. From the agent's side a caller is a track to subscribe to, wherever it came from."}, {"q": "An SFU and an MCU both sit in the middle of a call. What does the SFU avoid doing?", "o": ["Decoding and mixing every stream, which costs CPU", "Encrypting the media", "Keeping any state about the call", "Forwarding packets between participants", "Grouping participants into rooms"], "a": 0, "why": "An SFU copies packets to subscribers without decoding them. Mixing is the MCU's expensive step.", "pair": "sfu-vs-mcu"}, {"q": "Inside a room, how does the agent hear the caller?", "o": ["The SFU posts a mixed audio file to a webhook", "The caller's phone streams to the agent's IP over TCP", "It polls the media server for new recordings", "It reads the audio from the SIP INVITE body", "It subscribes to the caller's published audio track"], "a": 4, "why": "Participants publish tracks and subscribe to others'. The agent is a participant, so it subscribes like anyone else.", "pair": "sfu-vs-mcu"}], "open": {"q": "Our agents take phone calls and calls from the patient app. How would you structure that so you don't build two agents?", "probe": "Whether you see the agent as a participant, and where phone and web actually differ.", "a": ["Put every call in a room on an SFU", "The SIP service turns a phone call into a participant; the browser joins over WebRTC", "The agent joins as a participant: subscribe to the caller, publish its own audio", "Differences stay at the edge: 8 kHz G.711 against 48 kHz Opus", "Trade-off: one codebase, but test both audio paths, since phone audio is harder for speech models"]}, "say": ["I'd make the agent a participant in a room. The media server turns a phone call from the SIP trunk into a participant, and a browser joins the same kind of room over WebRTC. The agent subscribes to the caller's audio and publishes its own, so it doesn't care where the caller came from. That's how alfred_ runs one worker for phone and web. Only the codec and sample rate differ."], "avoid": ["Describing the agent as a side service the media server calls: it is a participant in the room"], "was": [], "res": [{"kind": "video", "req": true, "label": "Group calling architectures in WebRTC: MCU, SFU and P2P", "url": "https://www.youtube.com/watch?v=d2N0d6CKrbk", "m": 4, "why": "Mesh, MCU and SFU side by side, from a WebRTC authority.", "yt": {"id": "d2N0d6CKrbk", "ch": "Tsahi Levent-Levi"}}, {"kind": "read", "req": true, "label": "LiveKit: rooms, participants and tracks", "url": "https://docs.livekit.io/intro/basics/rooms-participants-tracks/", "m": 5, "why": "The model the agent lives inside"}, {"kind": "video", "req": false, "label": "SFUs and MCUs (WebRTC Tips from WebRTC.ventures)", "url": "https://www.youtube.com/watch?v=tHHpLraJKpQ", "m": 18, "why": "A slower walk through what an SFU forwards and why it scales better.", "yt": {"id": "tHHpLraJKpQ", "ch": "WebRTC.ventures"}}, {"kind": "read", "req": false, "label": "BlogGeek.me: SFU", "url": "https://bloggeek.me/webrtcglossary/sfu/", "m": 5, "why": "The SFU and MCU comparison table"}]}, {"id": "call-dispatch", "title": "A call gets a process, not a queue row", "brief": "Work that can wait goes in a queue: a worker claims a row with SKIP LOCKED, and if it dies another picks the row up later. A call can't wait and can't move: its audio is bound to one process for minutes, with a frame every 20 ms. So the media server pushes the call to a worker with spare capacity, which runs it in its own process. The nuance: capacity is CPU per call, so you scale out by adding workers.", "points": ["Pull: a worker claims a job row with SELECT ... FOR UPDATE SKIP LOCKED; fine for work that can wait and retry", "Push: when a room is created, the dispatcher hands the job to a registered worker with spare capacity", "One job, one process: each call runs in its own child process for its whole life", "No moving a call: if that process dies, the live call loses its agent; nothing replays it later", "Capacity: CPU, because voice activity, turn detection and audio handling run per call", "Scale out: more worker containers, with the dispatcher balancing new calls across them"], "figs": ["skipLocked"], "production": ["LiveKit agent dispatch: a SIP dispatch rule creates a room per inbound call and dispatches the named agent into it", "LiveKit server options: each job runs in its own process; prewarm loads models before the first job; a load threshold stops new jobs when a server is busy", "Postgres SKIP LOCKED: the pull side, enough for many job queues without a separate broker"], "mcq": [{"q": "An SMS reply and a phone call both reach your backend. Why queue one and dispatch the other?", "o": ["SMS needs a database and calls do not", "The SMS can wait and be retried from a row; the call is a live stream pinned to one process", "Call audio is too large to store in a Postgres row", "Queues cannot run more than one worker at a time", "SKIP LOCKED does not work for audio data"], "a": 1, "why": "Pull suits work that tolerates delay and retry. A call needs a process now and for its whole length.", "pair": "push-vs-pull"}, {"q": "What most limits how many calls one worker container can hold?", "o": ["Disk space for recordings", "The number of SIP trunks", "CPU, because voice activity, turn detection and audio run per call", "Database connections per call", "The model provider's context window"], "a": 2, "why": "Each call is a process doing audio work every 20 ms. That CPU load is what you load-test per container."}, {"q": "A worker crashes in the middle of its work. How does a live call differ from a queued job?", "o": ["The call loses its agent; the job's lease expires and another worker retries it", "Both are retried by another worker from the start", "The call moves to another worker without the caller noticing", "The job is lost and the call is retried", "Neither is affected, because state is in Postgres"], "a": 0, "why": "A job's state lives in a row, so it survives the worker. A call's state is the live stream in that process.", "pair": "push-vs-pull"}], "open": {"q": "Why not put incoming calls on a job queue like the rest of our background work?", "probe": "Push against pull, and the backend reasoning behind a voice system.", "a": ["Queues fit work that can wait: claim with SKIP LOCKED, retry on crash", "A call can't wait and can't move: audio bound to one process, a frame every 20 ms", "So the media server pushes the call to a worker with capacity, one process per call", "Capacity is CPU per call: load-test calls per container, scale out with replicas", "Cost: a crash drops that call, so drain workers on deploy instead of killing them"]}, "say": ["Work that can wait goes in a queue. A worker claims a row with SKIP LOCKED, and if it dies, another one picks it up. A call can't wait and can't move: its audio is bound to one process for minutes. So the media server dispatches it straight to a worker with room, and it runs in its own process. Capacity is CPU per call, so you scale by adding workers."], "avoid": ["Saying a crashed call is retried like a job: the stream lives in that process"], "was": ["q-why-does-a-call-get-its-own-process-instead-of-a-row-in-a-jo"], "res": [{"kind": "read", "req": true, "label": "LiveKit: agent dispatch", "url": "https://docs.livekit.io/agents/server/agent-dispatch", "m": 10, "why": "Including dispatch from inbound SIP calls"}, {"kind": "read", "req": false, "label": "Prisma: you don't need a job queue, Postgres already has SKIP LOCKED", "url": "https://www.prisma.io/blog/you-dont-need-a-job-queue-postgres-already-has-skip-locked", "m": 8, "why": "The pull side, for contrast"}]}, {"id": "call-path", "title": "The whole path, said in a minute", "brief": "Put the pieces in order: signalling sets the call up, media flows separately, the media server makes the caller a participant, a room is created per call and an agent dispatched into it, and the agent reaches the backend through one authorization step. The nuance: the hop you stumble on when you say it aloud is the hop an interviewer will ask about.", "points": ["Phone: carrier to SIP trunk to the media server's SIP service, one room per call", "Web: the backend checks the login and issues a room token; the browser joins over WebRTC", "Dispatch: room created, agent dispatched, the worker runs the call in its own process", "Backend door: one authorize step says who is calling and returns a short-lived, scoped token", "Name each hop's idea: signalling, media, room, dispatch, authorization"], "figs": ["alfredVoiceCall", "alfredVoiceHld"], "production": ["LiveKit inbound call workflow: identify the SIP caller from the participant's attributes, then let the agent answer", "LiveKit SIP trunk setup: an inbound trunk accepts calls; a dispatch rule decides which room and agent each call gets", "Scoped, short-lived tokens: the worker holds only what one call needs, and it expires"], "mcq": [{"q": "The media server has accepted an inbound SIP call. What happens next?", "o": ["The agent publishes its greeting audio", "The browser exchanges SDP with the SFU", "The worker claims the call from a job queue", "A dispatch rule creates a room and an agent is dispatched into it", "The authorize step mints a room token for a browser"], "a": 3, "why": "The dispatch rule maps the call to a room and an agent. The agent can only greet once it is in the room."}, {"q": "Why give the voice worker a short-lived, scoped token rather than a service key?", "o": ["Service keys are too slow to verify", "Scoped tokens lower audio latency", "LiveKit refuses workers that hold service keys", "It lets the worker send on the user's behalf without asking", "If a call or the worker is compromised, the damage is limited to that call and expires"], "a": 4, "why": "Least privilege per call: a leaked token does little and stops working soon. A service key would open everything."}], "open": {"q": "What happens between the phone ringing and the agent speaking?", "probe": "Do you know what each piece is for, not only its name?", "a": ["SIP over the trunk sets the call up; RTP carries the audio separately over UDP", "The media server makes the caller a participant in a room, one room per call", "A worker is dispatched into the room and runs the call in its own process", "It authorizes first: who is calling, what they may do, a short-lived token", "It subscribes to the caller's audio and publishes its greeting"]}, "say": ["Two things travel separately. SIP sets the call up through the trunk, and the audio comes as RTP packets over UDP. In alfred_ the call lands in LiveKit, one room per call, and a Python worker joins it as one more participant. Before it does anything it calls one authorize function with a short time budget, which says who is calling and hands back a short-lived, scoped token. Then it subscribes to the caller's audio and publishes its own."], "avoid": ["Implying you have connected a voice agent to an EHR in production: say how you would approach it"], "was": ["q-what-happens-between-the-phone-ringing-and-the-agent-speakin"], "res": [{"kind": "video", "req": true, "label": "Add a Phone Number to Your Voice Agent in 60 Seconds", "url": "https://www.youtube.com/watch?v=KJ1CgZ0iZbY", "m": 6, "why": "A trunk, a number and a dispatch rule: the three settings that put a call in a room.", "yt": {"id": "KJ1CgZ0iZbY", "ch": "LiveKit"}}, {"kind": "read", "req": true, "label": "LiveKit: inbound call workflow", "url": "https://docs.livekit.io/telephony/accepting-calls/workflow-setup", "m": 8, "why": "Identifying SIP callers and agents answering calls"}, {"kind": "read", "req": false, "label": "LiveKit: SIP trunk setup and dispatch rules", "url": "https://docs.livekit.io/telephony/start/sip-trunk-setup", "m": 8, "why": "The two settings that put a call in a room"}]}]}, {"id": "loop", "title": "The conversation loop: hearing, thinking, speaking", "blurb": "Reason about one turn stage by stage: when the caller is done, what each stage costs, and how the agent stops when talked over.", "sessions": ["wc20"], "topics": [{"id": "loop-audio", "title": "Audio as numbers, and what speech models read", "brief": "Sound in a computer is a list of samples, and the sample rate caps the highest frequency at half the rate (Nyquist), so 8 kHz phone audio holds nothing above 4 kHz. Speech models rarely read raw samples: speech-to-text reads a log-mel spectrogram and writes text tokens, and text-to-speech runs the other way, ending in a vocoder. The nuance: a model trained on wideband audio loses detail it relied on when it hears a phone line.", "points": ["Sample rate: samples per second; the highest frequency kept is half of it", "Phone against web: 8 kHz keeps up to 4 kHz; web audio is 16 to 48 kHz", "Frames: 10 to 20 ms chunks, the unit every downstream stage works on", "Log-mel spectrogram: energy per frequency band over time, on a scale that matches hearing; what Whisper's encoder reads", "Speech-to-text: encoder-decoder transformer, spectrogram in, text tokens out; streaming models emit words before the utterance ends", "Text-to-speech: text to acoustic features or audio tokens, then a vocoder or codec decoder to a waveform; streaming TTS emits audio in chunks"], "figs": ["nyquist", "spectrogramReading"], "production": ["Whisper: an encoder-decoder transformer trained on 680,000 hours of weakly supervised audio, reading 80-channel log-mel spectrograms", "Phone paths: speech providers offer telephony-tuned models because 8 kHz mu-law audio differs from the wideband audio most models train on", "Neural TTS: a front end normalises text, an acoustic model predicts features, a vocoder renders sound (Soniox's overview)"], "mcq": [{"q": "A speech model trained on 16 kHz audio does worse on phone calls. What is the main reason?", "o": ["Phone audio is 8 kHz, so nothing above 4 kHz survives and detail the model learned on is gone", "Phone audio arrives in larger frames the model cannot split", "Phone calls are encrypted, which distorts the samples", "Phone audio is stereo and the model expects mono", "Phone calls have more background noise than any web call"], "a": 0, "why": "Nyquist: the highest frequency kept is half the sample rate. The model's training audio had information the call does not."}, {"q": "What does a speech-to-text model like Whisper take as input?", "o": ["The raw waveform, one sample per input token", "Text tokens from a phonetic dictionary", "The RTP packets as they arrive", "A log-mel spectrogram: energy per frequency band over time", "One feature vector for the whole utterance"], "a": 3, "why": "The encoder reads a log-mel spectrogram; the decoder writes text tokens, like translating audio to text.", "pair": "stt-vs-tts"}, {"q": "In text-to-speech, what turns the model's acoustic output into sound?", "o": ["The spectrogram is played through the speaker as is", "A vocoder or codec decoder that produces the waveform", "The encoder of an encoder-decoder transformer", "The voice activity detector", "The jitter buffer on the receiving side"], "a": 1, "why": "TTS predicts acoustic features or audio tokens first. A separate vocoder or decoder renders the waveform.", "pair": "stt-vs-tts"}], "open": {"q": "Our agent's transcripts are noticeably worse on phone calls than in the app. Why might that be, and what would you check?", "probe": "Whether you understand sample rate and what the model was trained on.", "a": ["Phone audio is 8 kHz G.711, so nothing above 4 kHz and some compression loss", "Models trained on wideband audio lose cues they rely on", "Check per-channel error rates on real calls, not a blended number", "Try a telephony-tuned model or one trained on 8 kHz input", "Trade-off: a phone-specific model means two configurations to maintain and test"]}, "say": ["Phone audio is 8 kHz, so anything above 4 kHz is gone, and it's compressed on top. Most speech models are trained on wider-band audio, so they lose detail they rely on. The way I'd check it is to split error rates by phone and web on real calls. Then try a model tuned for telephony on the phone path."], "avoid": ["Going into the maths of the spectrogram: the shape and where latency comes from are enough"], "was": [], "res": [{"kind": "video", "req": true, "label": "Sampling Rate and Bit Depth Explained: 8k, 16k, 44.1k, 48k", "url": "https://www.youtube.com/watch?v=fM_jMlhfU0Y", "m": 8, "why": "Why 8 kHz phone audio tops out at 4 kHz, and what a rate mismatch does.", "yt": {"id": "fM_jMlhfU0Y", "ch": "Audio Under The Hood"}}, {"kind": "read", "req": true, "label": "Voice AI and Voice Agents: an illustrated primer", "url": "https://voiceaiandvoiceagents.com/#latency", "m": 10, "why": "The whole loop in one place; start at latency"}, {"kind": "video", "req": false, "label": "Seeing Voices: 1 - Intro to Spectrograms", "url": "https://www.youtube.com/watch?v=37zCgCdV468", "m": 9, "why": "The picture of sound that speech models actually read.", "yt": {"id": "37zCgCdV468", "ch": "Jay Alammar"}}, {"kind": "read", "req": false, "label": "arXiv: Whisper paper, abstract and Approach", "url": "https://arxiv.org/abs/2212.04356", "m": 20, "why": "What goes in, what comes out"}]}, {"id": "loop-turn", "title": "Knowing when the caller has finished", "brief": "Two different questions. Voice activity detection asks whether there is speech in this frame; end-of-turn detection asks whether the caller has finished their thought. Silence alone is a bad signal because people pause mid-sentence, so you add a turn-detection model that reads the words. The nuance: the wait you pick is the whole feel of the agent, too short cuts people off, too long makes every reply slow.", "points": ["VAD: is there speech in this frame; a small model such as Silero run on every frame", "End of turn: have they finished; a separate decision from VAD", "Endpointing: wait a set silence before ending the turn; simple, but pauses fool it", "Turn-detection model: reads the words so far as well as the silence, so 'my number is' does not end a turn", "The trade-off: short wait interrupts people, long wait makes every reply feel slow", "Preemptive generation: start the reply before the turn is certain and throw it away if they keep talking"], "figs": ["turnTaking"], "production": ["LiveKit turn detection: VAD, speech-to-text endpointing, a turn-detector model, realtime model detection, or manual control", "LiveKit endpointing: a minimum and maximum delay, with the turn detector deciding where in that window to answer", "Silero VAD: per its README, about 1 ms per 30 ms chunk on one CPU thread, cheap enough for every frame", "Deepgram endpointing: the streaming service marks a final transcript after a set silence, configurable per request"], "mcq": [{"q": "What question does voice activity detection answer?", "o": ["Has the caller finished their thought?", "Which words were spoken?", "Is there speech in this frame?", "Who is speaking on the line?", "Is the caller interrupting the agent?"], "a": 2, "why": "VAD is per frame and knows nothing about meaning. Deciding the turn is over is a separate step.", "pair": "vad-vs-eot"}, {"q": "Callers keep getting cut off when they pause to think mid-sentence. What is the best first change?", "o": ["Lower the VAD threshold so it hears quieter speech", "Shorten the silence needed before a turn ends", "Switch the codec from G.711 to Opus", "Make the jitter buffer larger", "Use a turn-detection model that reads the words, not silence alone"], "a": 4, "why": "The pause is real silence, so VAD is right and still ends the turn. Only something that reads the words can tell a thinking pause from an ending.", "pair": "vad-vs-eot"}, {"q": "What does preemptive generation trade away to make replies faster?", "o": ["Some wasted model calls, since a draft is discarded when the caller keeps talking", "Transcript accuracy, in exchange for lower cost", "A longer end-of-turn wait, in exchange for fewer interruptions", "Audio quality, in exchange for bandwidth", "Tool calls, in exchange for a smaller prompt"], "a": 0, "why": "Starting before the turn is certain hides model time, at the cost of throwing some work away."}], "open": {"q": "Elderly patients say our agent keeps talking over them. How would you fix it without making the agent feel slow for everyone else?", "probe": "VAD against end of turn, and treating the wait as a measured trade-off.", "a": ["Separate the two decisions: VAD says speech, end of turn says done", "Add a turn-detection model that reads the words, not silence alone", "Widen the endpointing window rather than raising one fixed wait", "Start generating preemptively so a longer wait costs less", "Measure interruptions and time to first audio on recorded calls before and after"]}, "say": ["I'd first separate the two questions. VAD only says someone is speaking right now. Whether they're done is a different call, and silence alone gets it wrong because people pause mid-sentence. So I'd use a turn-detection model that reads the words, and start generating early so a slightly longer wait doesn't cost much. Then I'd measure interruptions and time to first audio on real calls, not guess."], "avoid": ["Treating VAD and end-of-turn detection as the same thing"], "was": [], "res": [{"kind": "video", "req": true, "label": "Turn-Taking in Voice AI: How Agents Know When to Talk (2026)", "url": "https://www.youtube.com/watch?v=Difvy2uosKw", "m": 5, "why": "Why silence alone fails and what a turn detector adds.", "yt": {"id": "Difvy2uosKw", "ch": "Voice AI Space"}}, {"kind": "read", "req": true, "label": "LiveKit: turn detection", "url": "https://docs.livekit.io/agents/logic/turns", "m": 8, "why": "The five strategies side by side"}, {"kind": "video", "req": false, "label": "Voice Activity Detection | The key to realtime voice chat - Silero VAD", "url": "https://www.youtube.com/watch?v=HUbYXGeR8_c", "m": 9, "why": "What a VAD answers per audio chunk, as against end of turn.", "yt": {"id": "HUbYXGeR8_c", "ch": "HelloWrld"}}, {"kind": "read", "req": false, "label": "Voice AI primer: turn detection", "url": "https://voiceaiandvoiceagents.com/#turn-detection", "m": 10, "why": "Why silence alone fails"}]}, {"id": "loop-latency", "title": "Streaming every stage, and the latency budget", "brief": "If each stage waited for the one before, a reply would take seconds. So every stage streams into the next: partial transcripts, streamed tokens, sentences chunked into speech while the model still writes. The number that matters is time to first audio, from the caller stopping to the agent's first sound, about 1 to 1.5 s as a design budget. The nuance: you settle latency arguments with per-stage timings on real turns, not with the budget.", "points": ["Streaming: every stage feeds the next before the previous one finishes", "Time to first audio: what the caller feels, not total reply time", "Budget: end of turn 300 to 500 ms, final transcript 100 to 200, first token 300 to 500, first audio 100 to 200, network 100 to 150", "Total: about 1 to 1.5 s; these are targets, not measurements", "Critical path: keep the model there small; slow work, like a record lookup, runs while the agent says something natural", "Measure per stage: log each stage per turn so you know which one grew"], "figs": ["voicePipeline", "voiceParallel"], "production": ["Deepgram: interim results stream while you speak; endpointing marks the final transcript", "LiveKit turn tuning: endpointing delay and preemptive generation are the two main levers on time to first audio", "Streaming TTS: synthesis starts on the first sentence, so first audio arrives while the rest is generated (Picovoice)", "Parallel agents: a fast agent answers while a heavier one works the same request, so the caller hears something quickly"], "mcq": [{"q": "Which latency number does the caller actually feel?", "o": ["Total time to generate the full reply", "Model tokens per second", "Transcript word error rate", "Time from the caller stopping to the agent's first audio", "Round-trip time of one RTP packet"], "a": 3, "why": "Once the agent is speaking, the rest of the reply can arrive while it talks. The silence before the first sound is what feels slow."}, {"q": "Why start text-to-speech before the model has finished its answer?", "o": ["TTS needs the full text to plan prosody, so it should start early", "Speaking the first sentence while the rest is written takes generation time out of time to first audio", "It lowers the cost of the model call", "It lets the turn detector run faster", "It removes the need for a jitter buffer"], "a": 1, "why": "Streaming overlaps the stages. Without it, the whole generation time sits in front of the first sound."}, {"q": "Turns that used to take about 1 s to first audio now take 2.5 s. What do you do first?", "o": ["Switch to a realtime speech-to-speech model", "Shorten the end-of-turn wait", "Look at per-stage timings for those turns to find which stage grew", "Add more worker containers", "Cut the system prompt in half"], "a": 2, "why": "Every other option is a guess about which stage is slow. Per-stage timings tell you."}], "open": {"q": "Walk me through one turn of a voice call, and where the time goes.", "probe": "Real-time depth: streaming, the metric that matters, and measuring instead of guessing.", "a": ["End of turn decides they're done: 300 to 500 ms, the number that makes it feel conversational", "Final transcript 100 to 200 ms; first model token 300 to 500", "Streaming TTS gives first audio in 100 to 200 ms; the phone line adds 100 to 150", "About 1 to 1.5 s to first audio; a slow lookup gets a natural filler, not dead air", "These are targets; log every stage per turn so the argument is settled with data"]}, "say": ["The caller stops, and end-of-turn detection decides they're done, about 300 to 500 ms. The transcript is final about 100 to 200 ms later, a small model starts answering in 300 to 500, and streaming speech gives first audio 100 to 200 after that, plus the phone line. So about 1 to 1.5 seconds to first audio. In alfred_ a lean agent answers on the call while the main agent works the same request in parallel, so the caller hears something fast and the heavy work still happens. And my scenario harness gates on time to first audio, so I'm not guessing.", "What's hard is that every stage adds up, so everything streams and the model on the critical path stays small. On MockFlow-AI, a voice interview platform I built on LiveKit, streaming every stage is how it runs under 400 ms end to end."], "avoid": ["Quoting one latency number without saying where it starts and stops"], "was": ["q-walk-me-through-one-turn-of-a-voice-call-and-the-latency-bud", "q-what-s-hard-about-latency-in-a-voice-agent"], "res": [{"kind": "video", "req": true, "label": "Voice Agent Pipeline Explained: VAD, STT, LLM and TTS", "url": "https://www.youtube.com/watch?v=SPB2T-eLrOg", "m": 11, "why": "Each stage streams into the next, and where the milliseconds go.", "yt": {"id": "SPB2T-eLrOg", "ch": "LiveKit"}}, {"kind": "read", "req": true, "label": "LiveKit: turn-taking tuning", "url": "https://docs.livekit.io/agents/logic/turns/tuning", "m": 10, "why": "Endpointing delay and preemptive generation"}, {"kind": "read", "req": false, "label": "Deepgram: endpointing and interim results", "url": "https://developers.deepgram.com/docs/understand-endpointing-interim-results", "m": 8, "why": "Partial against final transcripts"}]}, {"id": "loop-interrupt", "title": "Interruptions, backchannels and silence", "brief": "People talk over agents. On a barge-in the agent must stop its audio within a couple of hundred milliseconds, cancel what it was about to say, and listen. But 'mm-hm' is a backchannel that means keep going, and a cough is noise. The nuance: anything that must happen every time, like a filler during a slow lookup or a check-in on a quiet line, belongs in a timer in code, not in the prompt.", "points": ["Barge-in: stop audio fast, cancel the pending reply, listen", "Backchannel: 'mm-hm' means keep talking; a minimum speech duration filters it out", "False interruption: a cough or a door; resume where you were", "Echo cancellation: the agent's own voice coming back through the handset must not interrupt it", "Silence rules: a filler when a lookup runs long, a check-in when the line goes quiet, a graceful hangup later", "Code, not prompt: timers fire every time; a prompted filler only usually happens"], "figs": ["turnTaking"], "production": ["LiveKit adaptive interruption handling: tells real interruptions from backchannels instead of stopping on any sound", "OpenAI Realtime: on interruption the server truncates the assistant's audio item so the transcript matches what the caller heard", "Cancellation as a pattern: barge-in is a priority cancel of in-flight work, the same idea as the guide's priority and cancellation technique"], "mcq": [{"q": "A caller says 'mm-hm' while the agent explains how to prepare for a procedure. What should the agent do?", "o": ["Stop and listen, since any speech is a barge-in", "Stop, apologise and repeat the sentence", "End the TTS stream and start a new turn", "Ask the caller to repeat themselves", "Keep talking: it is a backchannel"], "a": 4, "why": "A backchannel says 'I'm listening, go on'. Stopping for it makes the agent jumpy.", "pair": "barge-vs-backchannel"}, {"q": "The caller says 'wait, no, Thursday' over the agent. What must happen?", "o": ["Stop audio within a couple of hundred ms, cancel the pending reply, and listen", "Finish the current sentence, then listen", "Lower the volume and keep going", "Queue the caller's words for after the reply", "Restart the turn from the greeting"], "a": 0, "why": "That is real speech changing the request. Anything already generated is now wrong and must be cancelled.", "pair": "barge-vs-backchannel"}, {"q": "A lookup takes 3 s. Why put the 'let me check' filler on a timer in code rather than in the prompt?", "o": ["Code fillers sound more natural than model speech", "The model cannot produce short phrases", "Timers cut the model's token cost to zero", "It must happen every time, and a prompt only makes it likely", "Prompts cannot mention tools"], "a": 3, "why": "A model follows instructions most of the time. Behaviour that must never be skipped belongs in deterministic code."}], "open": {"q": "A patient interrupts the agent halfway through reading their appointment details. What should happen, and how do you avoid stopping for every 'okay'?", "probe": "Barge-in as cancellation, and the line between interruption and backchannel.", "a": ["Real speech: stop audio fast, cancel the pending reply, listen", "Truncate what the agent said so the history matches what the caller heard", "Backchannels and short noises: a minimum speech duration, keep going or resume", "Echo cancellation so the agent never interrupts itself", "Test it: barge-in and false interruptions as scenarios, not anecdotes"]}, "say": ["If it's real speech, the agent stops talking within a couple of hundred milliseconds, cancels what it was about to say, and listens. If it's 'okay' or 'mm-hm', that's the caller saying keep going, so a minimum speech duration filters it out, and after a cough it resumes. Fillers and check-ins I'd put on timers in code, because they have to happen every time. My scenario harness has a gate on barge-in and on dead air for exactly this."], "avoid": ["Saying the agent should stop on any sound: that makes it jumpy"], "was": [], "res": [{"kind": "read", "req": true, "label": "LiveKit: adaptive interruption handling", "url": "https://docs.livekit.io/agents/logic/turns/adaptive-interruption-handling", "m": 6, "why": "Real interruptions against backchannels"}, {"kind": "video", "req": true, "label": "TEN Framework: Voice AI That Can Actually Be Interrupted", "url": "https://www.youtube.com/watch?v=ES3HhoYCtIc", "m": 8, "why": "What stopping mid-sentence takes: cancel audio, drop the plan, keep the context.", "yt": {"id": "ES3HhoYCtIc", "ch": "Better Stack"}}, {"kind": "video", "req": false, "label": "Turn-Taking in Voice AI: How Agents Know When to Talk (2026)", "url": "https://www.youtube.com/watch?v=Difvy2uosKw", "m": 5, "why": "Interruption against backchannel, from the agent's side.", "yt": {"id": "Difvy2uosKw", "ch": "Voice AI Space"}}, {"kind": "read", "req": false, "label": "OpenAI: Realtime conversations", "url": "https://developers.openai.com/api/docs/guides/realtime-conversations", "m": 10, "why": "Interruption and truncation"}]}, {"id": "loop-cascade", "title": "Realtime speech-to-speech or a cascade", "brief": "A cascade is three models in a row, speech-to-text, a text model, text-to-speech, so you control each stage, get a transcript at every step and can put your own turn detection in front. A realtime speech-to-speech model takes audio in and gives audio out: lower latency and more natural prosody, but tool calling and transcripts come on the provider's terms. The nuance: keep both behind one seam and let evals pick, because the answer changes with each model release.", "points": ["Cascade: control, a transcript at every step, any text model, your own turn detection", "Realtime: lower latency and natural speech, less control", "One seam: both arms behind one interface, picked per call from config", "Evals decide: the same scenarios on both arms, gated on quality and time to first audio", "Config risk: on some providers the realtime session config is all or nothing, so one unsupported option can silently drop turn detection", "Allowlist: keep a measured list of supported realtime options per model version"], "figs": ["voiceParallel", "voicePipeline"], "production": ["OpenAI Realtime: speech to speech over WebRTC or WebSocket, with server-side turn detection", "Pipecat: a cascade framework where you place your own VAD and turn detection in front of speech-to-text", "LiveKit Agents: supports both a realtime model and a speech-to-text, LLM, TTS pipeline behind the same agent session"], "mcq": [{"q": "When would you choose a cascade over a realtime speech-to-speech model?", "o": ["When latency matters more than anything else", "When you need your own turn detection, a specific text model and a transcript at every step", "When you want the most natural prosody", "When you want fewer moving parts", "When you want the provider to own tool calling"], "a": 1, "why": "A cascade buys control and visibility at each stage, at the cost of some latency and naturalness.", "pair": "cascade-vs-realtime"}, {"q": "A realtime voice session worked in testing, then turn detection silently stopped after a config change. What is the likely cause?", "o": ["The VAD model ran out of memory", "The SIP trunk changed codec", "An unsupported option made the provider drop the whole session config", "The jitter buffer grew too large", "The model's context window filled up"], "a": 2, "why": "Some providers reject a session update as a whole. One bad field and the turn detection settings go with it, with no loud error."}, {"q": "You have a realtime arm and a cascade arm behind one seam. How should you decide which ships?", "o": ["Pick the one with the lower list price", "Ship the newest model", "Ask a few people which sounds better", "Pick realtime, because it has lower latency", "Run both through the same eval scenarios and let the measured results decide"], "a": 4, "why": "Latency, task success and audio quality trade against each other, and change with every release. A gate on the same scenarios makes it a measured choice.", "pair": "cascade-vs-realtime"}], "open": {"q": "Would you build our scheduling agent on a realtime speech-to-speech model or a cascade? Defend it.", "probe": "Trade-off reasoning, and whether you'd let measurement decide.", "a": ["Realtime: lower latency, natural speech; cascade: control, transcripts, own turn detection", "Scheduling needs reliable tool calls and an audit trail of what was heard", "Keep both behind one seam, picked per call from config", "Run the same scenarios on both, gated on task success and time to first audio", "Watch config risk: an all-or-nothing session update can drop turn detection silently"]}, "say": ["I wouldn't pick one up front. Realtime gives lower latency and more natural speech; a cascade gives control, a transcript at every step, and my own turn detection. For scheduling, reliable tool calls and a clear record of what was heard matter a lot. So I'd keep both behind one seam, run the same scenarios on both, and let the gates on task success and time to first audio decide."], "avoid": ["Implying you have shipped on a particular realtime provider in healthcare: say how you would choose"], "was": [], "res": [{"kind": "video", "req": true, "label": "Cascaded vs Speech-to-Speech Voice Agents, Explained (2026)", "url": "https://www.youtube.com/watch?v=gPEyGpf-0sM", "m": 4, "why": "The trade: control and transcripts against latency and prosody.", "yt": {"id": "gPEyGpf-0sM", "ch": "Voice AI Space"}}, {"kind": "video", "req": false, "label": "Voice AI Architecture: Cascade vs Speech-Native vs Interaction", "url": "https://www.youtube.com/watch?v=XsY_zFmci6k", "m": 10, "why": "A longer look at the three architectures.", "yt": {"id": "XsY_zFmci6k", "ch": "VIDEU"}}, {"kind": "read", "req": true, "label": "OpenAI: Realtime, getting started", "url": "https://developers.openai.com/api/docs/guides/realtime", "m": 5, "why": "What speech to speech looks like as an API"}, {"kind": "read", "req": false, "label": "Pipecat: speech input and turn detection", "url": "https://docs.pipecat.ai/pipecat/learn/speech-input", "m": 10, "why": "The cascade side, and where turn detection sits"}, {"kind": "keep", "src": "aieng", "req": false, "label": "AI Engineering from Scratch: voice agents with Pipecat and LiveKit", "url": "https://aiengineeringfromscratch.com/lesson?path=phases%2F14-agent-engineering%2F22-voice-agents-pipecat-livekit", "m": 60, "why": "Both frameworks built end to end"}]}]}, {"id": "backend", "title": "The backend under a live agent", "blurb": "Explain where each piece of a voice agent runs and defend it: workers, queues, idempotent writes, timeouts and capacity.", "sessions": ["wc21"], "topics": [{"id": "backend-worker", "title": "Edge functions against long-running workers", "brief": "An edge function is a short-lived invocation: a request comes in, an isolate handles it within a time and memory limit, and it scales to zero. A long-running worker is a process you keep alive: it can hold a call for minutes, keep models warm and keep connections open. The nuance: the rule is about lifetime and state, not speed; if the work outlives a request or needs warm state, it needs a worker.", "points": ["Process and container: a running program with its own memory; a container packages a process with its files", "Edge function: short, stateless, time-limited, scales to zero; ideal for request and response", "Worker: long-lived, holds state and connections, and you pay for it while idle", "Rule of thumb: shorter than the request and stateless, use a function; outlives the request or needs warm state, use a worker", "Voice: the authorization check fits a function; the agent holding the call needs a worker"], "figs": ["alfredVoiceHld"], "production": ["Supabase Edge Functions: 2 s of CPU time per request, a 150 to 400 s wall clock, and 256 MB of memory", "Railway services: either a long-running container or a scheduled job, the choice this topic is about", "LiveKit server lifecycle: a worker advertises its capacity for load balancing and drains live calls on deploy"], "mcq": [{"q": "Why can't the voice agent itself run as an edge function?",
