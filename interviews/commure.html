cipant in a room; a browser joins the same kind of room over WebRTC. The agent joins as one more participant, subscribes to the caller's audio track and publishes its own. That's why one worker serves phone and web."], "land": "Signalling sets it up, media flows separately, and the agent is a participant in the room.", "figs": ["callPath"], "learn": {"read": [{"url": "../index.html#/w/wc19", "label": "Session wc19: How a voice call reaches an agent", "why": "SIP, RTP, WebRTC, the SFU and dispatch, step by step."}], "figs": ["callPath"], "sdLinks": []}, "id": "q-what-happens-between-the-phone-ringing-and-the-agent-speakin"}, {"q": "Why does a call get its own process instead of a row in a job queue?", "short": "Push and pull", "tests": "The backend reasoning behind your own system.", "a": ["Work that can wait goes in a queue: a worker claims a row with SKIP LOCKED, and if it dies, another picks it up. That's how alfred_'s SMS turns run.", "A call can't wait and can't move: its audio is bound to one process for minutes, with a frame every 20 ms. So the media server dispatches the call straight to a worker with capacity, which runs it in its own process. Capacity is CPU per call, so you scale by adding workers."], "land": "Pull for work that can wait and be retried; push for a live session pinned to a process.", "figs": ["skipLocked"], "learn": {"read": [{"url": "../index.html#/w/wc21", "label": "Session wc21: The backend under a live agent", "why": "Processes and edge functions, push and pull, idempotency, timeouts, scaling."}, {"url": "../index.html#/w/wc19", "label": "Session wc19: How a voice call reaches an agent", "why": "Step 3: dispatch."}], "figs": ["skipLocked"], "sdLinks": []}, "id": "q-why-does-a-call-get-its-own-process-instead-of-a-row-in-a-jo"}, {"q": "How does a retried booking avoid booking twice?", "short": "Idempotency", "tests": "The write-back safety every voice agent needs.", "a": ["You can't tell a lost request from a lost response, so you retry. The client sends the same idempotency key on every attempt; the server stores the key and the result in the same transaction as the booking, and a repeat with that key returns the stored result without booking again.", "In alfred_ it's at three levels: tool calls replay a stored execution for ten minutes, one draft sends once, and a retried authorize reuses the session for the same call."], "land": "Same key every attempt; key and result stored with the effect; a repeat returns the stored result.", "figs": ["idempotencyKey"], "learn": {"read": [{"url": "../index.html#/w/wc21", "label": "Session wc21: The backend under a live agent", "why": "Step 2: idempotency."}], "figs": ["idempotencyKey"], "sdLinks": []}, "id": "q-how-does-a-retried-booking-avoid-booking-twice"}, {"q": "How does one Python process hold several live calls?", "short": "The event loop", "tests": "Python async, for a Python-first role.", "a": ["asyncio runs many tasks on one thread; each gives control back at every await. Most of a call is waiting on audio frames, model tokens and tool replies, so the waits overlap.", "The rule that follows: never block the loop. One synchronous call or a burst of CPU work stalls every call on that process, so CPU work like resampling goes to a thread or another process. Barge-in is task cancellation."], "land": "One thread, turns at every await, never block the loop, cancel to barge in.", "figs": ["eventLoop"], "learn": {"read": [{"url": "../index.html#/w/wc22", "label": "Session wc22: Python async for real-time backends", "why": "The event loop, cancellation, and a small orchestrator you build."}], "figs": ["eventLoop"], "sdLinks": []}, "id": "q-how-does-one-python-process-hold-several-live-calls"}]}, {"group": "The posting, mapped to your work", "blurb": "Each line of the posting and where you've done it. Say the first answer; the rest are for when she reads a line back.", "items": [{"q": "How does your background fit the role?", "short": "The fit, in one answer", "tests": "Is the resume real, and does it match?", "a": ["Most of it maps directly. The posting asks for Python backends for real-time voice agents, conversation state and tool execution, low-latency pipelines from telephony through ASR, the LLM and TTS, and quality: testing, LLM evaluation and observability.", "I own a live voice agent end to end, phone and web, and I built another from scratch on LiveKit, with the evals and tool execution behind both. What I haven't done is EHR integrations like Epic or telephony at call-center scale, and I'd rather say that plainly."], "land": "Real-time voice, tool execution and evals, done; EHRs and call-center telephony named as new.", "parts": [{"title": "Where you've done each line", "items": ["**Python backends:** the UIC Python and Postgres backend; FastAPI services; the eval tooling.", "**Real-time voice pipeline:** alfred_'s voice agent: SIP trunk and WebRTC into LiveKit, one Python worker, noise isolation, VAD and end-of-turn detection, streaming STT and TTS or a realtime model behind one seam. MockFlow-AI: Deepgram, Silero VAD, under 400 ms.", "**Call orchestration and conversation state:** the lean voice agent on the call with the main agent in parallel on every turn; an explicit interruption policy; idle check-ins and graceful exits in code.", "**Tool execution:** voice tools through the same MCP server as chat: mostly reads plus draft writes, the person confirms; MockFlow-AI's stage machine with tool-driven transitions.", "**Write-back safely:** at alfred_ code confirms every send and irreversible delete, whatever the model thinks.", "**LLM evaluation:** voice evals in three layers (text scenarios in CI, simulated noisy callers nightly, replay of real calls); the eval harness, scenario replay, deterministic checks plus an LLM judge, 12 failure classes, nightly; MockFlow-AI's judge at weighted kappa 0.82 against human grades.", "**Observability and reliability:** a replayable record per call (per-turn timing, hashed config, what it declined, cost); the production failure scanner over real conversations.", "**Healthcare:** UIC hospital deployment; TeamMedAgents, multi-agent medical reasoning."]}, {"title": "Not done yet: say so", "items": ["Epic, Cerner or Athena integrations.", "Telephony at contact-center volume: yours is a consumer assistant's line, not a health system's call center.", "HIPAA compliance work beyond a research setting."]}], "id": "q-how-does-your-background-fit-the-role"}, {"q": "How would you keep a patient call from going wrong?", "short": "Safety on a live call", "tests": "Patient-centred judgement.", "a": ["Decide in code what the agent may do, and hand everything else to a person: clinical questions, anything it isn't sure of. Answer from the schedule through tools, never from the model's memory, and confirm a booking back to the patient before writing it.", "Then learn from real calls: flag the ones that went wrong, turn them into test cases, and run every change against them before it ships. That's how I work at alfred_."], "land": "Code decides what the agent may do; real failures become tests.", "learn": {"read": [{"url": "../index.html#/w/wc23", "label": "Session wc23: Your voice agent at depth", "why": "Step 2: the write path, draft, restate, confirm."}, {"url": "../SYSTEM%20DESIGN.html#/designs/voice-agent/deepdives", "label": "Guide: the patient-call design's deep dives", "why": "Write-back without double booking."}], "figs": ["idempotencyKey"], "sdLinks": []}, "figs": ["idempotencyKey"], "id": "q-how-would-you-keep-a-patient-call-from-going-wrong"}, {"q": "What's hard about latency in a voice agent?", "short": "Latency", "tests": "Real-time depth, in plain words.", "a": ["Every stage adds up: speech recognition, the model, speech synthesis, and the phone line. So everything streams, so no stage waits for the whole of the one before, and the model on the critical path stays small. Slow work, like an EHR lookup, runs while the agent says something natural.", "In MockFlow-AI moving from polling to streaming was most of the win: about five times faster, under 400 milliseconds."], "land": "Stream every stage, keep the critical path small, cover slow lookups.", "learn": {"read": [{"url": "../index.html#/w/wc20", "label": "Session wc20: The conversation loop", "why": "Step 3: streaming every stage and the budget."}], "figs": ["voicePipeline"], "sdLinks": []}, "figs": ["voicePipeline"], "id": "q-what-s-hard-about-latency-in-a-voice-agent"}, {"q": "Walk me through one turn of a voice call, and the latency budget.", "short": "One turn, timed", "tests": "Real-time depth; for the technical rounds more than for her.", "a": ["The caller stops talking. Noise isolation, voice activity and end-of-turn detection decide they're done, about 300 to 500 ms: that's the number that makes it feel like a conversation. The streaming transcript is final about 100 to 200 ms later.", "A fast model starts answering, first token about 300 to 500 ms, and at the same moment the heavy agent has already started on the same request. Streaming speech out gives first audio in about 100 to 200 ms, and the phone line adds about 100 to 150.", "So first audio is about 1 to 1.5 seconds after they stop. If a lookup is running and nothing has been said for about a second, the worker, not the model, says 'let me check'."], "land": "About 1 to 1.5 s to first audio, timed stage by stage; the filler is code.", "learn": {"read": [{"url": "../index.html#/w/wc20", "label": "Session wc20: The conversation loop", "why": "Steps 2 to 4: end of turn, the budget, interruptions."}], "figs": ["turnTaking"], "sdLinks": []}, "figs": ["turnTaking"], "notes": ["These are design targets. At alfred_ every turn logs the stages, so the argument about where time goes is settled with data."], "id": "q-walk-me-through-one-turn-of-a-voice-call-and-the-latency-bud"}, {"q": "How would you size a voice agent's infrastructure?", "short": "Sizing, on a whiteboard", "tests": "Capacity thinking.", "a": ["Start from calls, not users. alfred_ has over a thousand daily active phone users; at about 1.5 calls each that's around 1,500 calls a day.", "If 15% land in the peak hour, that's about 225 calls at 3 minutes each; Little's law, 225 times 3 over 60, is about 11 at once on average and about 45 in a burst. Each call is a process doing CPU work, so calls per container is the number to load-test; at about 8 a container, that's about 12 replicas at peak."], "land": "Calls in the peak hour times duration: Little's law, a burst factor, then load-test one worker.", "learn": {"read": [{"url": "../index.html#/w/wc21", "label": "Session wc21: The backend under a live agent", "why": "Step 5: scaling a service that holds live calls."}], "figs": [], "sdLinks": []}, "notes": ["For Commure's scale, one health system they report takes 200K+ calls a year, about 800 a working day: the same arithmetic gives about 6 at once in the peak hour and about 25 in a burst."], "id": "q-how-would-you-size-a-voice-agent-s-infrastructure"}, {"q": "How do you evaluate a voice agent?", "short": "Evals for voice", "tests": "The posting's 'LLM evaluation' line.", "a": ["Three layers, built before tuning. Text-mode scenarios in CI, where a wrong tool or a wrong argument fails the build. Simulated callers with background noise and network jitter, nightly. And replay of real calls.", "Every call leaves a replayable record: the timing of every turn, the exact config, what the agent declined to do, and the cost. When something sounds wrong on a call, we can see why."], "land": "CI scenarios, simulated noisy callers, real-call replay; a record per call.", "learn": {"read": [{"url": "../index.html#/w/wc23", "label": "Session wc23: Your voice agent at depth", "why": "Step 5: evals and what went wrong."}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-evaluate-a-voice-agent"}]}], "ask": [], "ask3": [{"id": "audrey", "title": "For Audrey", "when": "At the end. One or two.", "why": "Practical questions about the process and the team.", "how": ["Ask one, then listen."], "items": [{"to": "Audrey", "q": "What do the technical rounds look like, and roughly what's the timeline?", "loop": "First.", "why": "Tells you what to prepare."}, {"to": "Audrey", "q": "How big is the voice agents team, and who would I work with most?", "loop": "Middle.", "why": "Scope."}, {"to": "Audrey", "q": "What makes someone stand out on this team?", "loop": "If there's time.", "why": "What to lead with next."}, {"to": "Audrey", "q": "Is there anything in my background you'd want me to make clearer?", "loop": "Last.", "why": "Invites a concern while you can answer it."}]}, {"id": "team", "title": "For the team, later", "when": "The technical rounds.", "why": "Keep for engineers.", "how": ["Save these."], "items": [{"to": "Engineer", "q": "How do you evaluate a change to the agent before it reaches patients?", "loop": "Early.", "why": "Your strongest area."}, {"to": "Engineer", "q": "Where does latency go today: ASR, the model, TTS or the phone line?", "loop": "Middle.", "why": "Real-time depth."}, {"to": "Engineer", "q": "How do you handle an EHR write that fails halfway through a call?", "loop": "Middle.", "why": "Reliability of actions."}]}], "traps": [["Claiming EHR or telephony at scale", "You run a consumer assistant's phone line, not a health system's call center, and haven't integrated Epic. Say so, then say what carries over."], ["Naming internals", "Say 'our main agent, the one behind chat and SMS'. Function names and schemas stay out of a recruiter call."], ["Calling alfred_ Python", "alfred_'s product code is TypeScript. Your Python is UIC, FastAPI, evals and PyTorch."], ["Quoting their numbers as fact", "Savings and resolution rates are theirs: 'they report'."], ["Going deep technically", "A recruiter screen: outcomes and scope."], ["Raising logistics first", "Only if she asks."], ["Funding, crunch, colleagues' names", "Never, about alfred_."]], "tables": [], "admire": "", "kitaruLead": "", "figures": [], "mockHow": "Say 'run the Commure mock' in chat: Audrey screens, sells the role, then asks for your questions.", "mocks": [{"id": "m1", "title": "Mock 1: Audrey, recruiter screen", "when": "Thursday 1 October 2026, 13:46 to 14:00, 14 minutes", "read": ["The material is there: a live voice agent you built and own, a lean agent on the call with the heavy agent running in parallel, MockFlow-AI, real healthcare work at UIC, and a clear reason for the move. A recruiter would pass you on the strength of that.", "The delivery is what costs you. Almost every answer opened with mechanism before outcome, wandered through a list, and trailed off instead of landing. The voice answer, the one that matters most for this role, went into Supabase functions and Railway workers before it said whether the agent is live or yours. Fix the order and the endings, and the same facts sound twice as strong."], "landed": ["'Me building it from scratch': plain and believable.", "The parallel heavy agent came through as a real design choice, even to a non-engineer.", "Why Commure: the UIC clinical work and the 30 percent of unanswered calls, said as 'from what I can read'.", "TypeScript for the web app, Python for the workers: honest and precise."], "fix": [{"t": "Outcome first, one detail, then stop. A recruiter asks what, whether it is live, and whether it is yours; answer those before any mechanism.", "ref": "x2"}, {"t": "One set of facts for the voice agent: live for whom, and how many use it daily. The mock said a cohort and about 50 a day; the page says live for everyone and over a thousand.", "ref": "x3"}, {"t": "Open the intro on voice and healthcare, not WheelPrice's SEO blog.", "ref": "x1"}, {"t": "Answer every part of a two-part question, a sentence each. Skipping one reads as dodging.", "ref": "x6"}, {"t": "End every answer with a closing sentence instead of trailing off: 'So that's the work I want to do more of.'", "ref": "x4"}], "exchanges": [{"id": "x1", "label": "Background and why now", "who": "Audrey", "q": "Why don't you walk me through your background, and what's got you looking right now?", "tests": "Can you tell your story in a minute, and does it point at this role?", "said": ["Founding engineer at alfred_, an executive assistant over work apps, 5,000-plus subscribers. Making agents reliable in production; owned many verticals: memory, the eval harness, orchestration, delegation, and voice. Before that WheelPrice, a two-person engineering team: full stack, an SEO blog, a computer vision feature, a fitment assistant. Wanted a founding seat to get into agentic systems. Now wants a larger engineering surface and an established product with traction."], "verdict": "partly", "why": "The arc and the why-now were right, but voice, the whole reason for this role, came as the last item in a list, and the WheelPrice detail took the space healthcare should have had.", "good": ["A real number early: 5,000-plus subscribers.", "A clean why-now at the end: a larger surface, a product with traction."], "bad": ["Voice buried in a list of five verticals.", "UIC and healthcare missing from the intro of a healthcare role.", "SEO blog and fitment assistant: true, irrelevant here.", "Restarts and filler: 'roughly about', 'largely', 'as well as well as'."], "approach": ["Four sentences: who you are now, the voice agent you own, the healthcare thread, why this move. Stop and let her pick."], "say": ["I'm a founding engineer at alfred_, an AI assistant over email, calendar and work apps, with 5,000-plus subscribers. I own making the agent reliable in production, and for the last few months that's meant voice: I built and own our voice agent, which people call from their phones.", "Before that I was at WheelPrice, a two-person engineering team, shipping across the stack, and before that at UIC, where I built ML systems with clinicians in the health sciences.", "What I want next is that same work on a product that already has real traction, and a patient on the other end of the call is about as real as it gets."], "ref": "#say-intro", "land": "Founding engineer, voice agent I own, healthcare at UIC, why this move. Then stop."}, {"id": "x2", "label": "The voice agent", "who": "Audrey", "q": "What have you actually built on the voice side at alfred_? Is it live, are people using it? And what part of it is yours?", "tests": "Three plain questions: what, is it live, is it yours.", "said": ["It runs as a function in the Supabase backend with wrapped tools; a heavy agent behind web and SMS. The voice agent is still in development, rolled out to a cohort of paying users. Python workers on Railway claim the call; a cascaded pipeline plus GPT realtime. The voice agent has core tools; the heavy agent reads the same request and runs without waiting for delegation, and when the voice agent can't do it, it answers from the heavy agent's result."], "verdict": "missed", "why": "None of her three questions was answered first. She got the architecture, which she said went over her head, and the status came out as 'still in development', which undersells a thing people use daily.", "good": ["The parallel heavy agent is the distinctive idea, and it was in there."], "bad": ["Mechanism before outcome: Supabase, wrappers, Railway, cascaded pipeline.", "'Still in development' as the status line.", "'Mine' never said in this answer."], "approach": ["Answer her three questions in order: what it does, that it's live and who uses it, that you built it. Then one design choice in a sentence. Offer depth for the engineers."], "say": ["Yes. You can call alfred_ from your phone, or tap the mic in the web app, and talk to the same assistant that knows your email and calendar. I built it and I own it end to end, and paying users call it every day.", "The one design choice I'd point to: the agent on the call stays lean so it answers fast, and every request also goes to our main agent in parallel, so when something needs real work there's no extra wait. Happy to go deeper with the engineers."], "ref": "#say-voice", "land": "What it does, live and used daily, I built it; one design choice; offer depth."}, {"id": "x3", "label": "Ownership and usage", "who": "Audrey", "q": "Was that you building it from scratch, or one of several people? And roughly how many people use it today?", "tests": "A straight answer with a number.", "said": ["Built from scratch; a team of four but the engineering is largely end to end. A web voice mode that works the same way over a live WebSocket. About 50 daily active users, scaled gradually since last month, soon released to the whole cohort."], "verdict": "partly", "why": "Direct and honest, with a number. But the number contradicts the prep page, and 'I own it end to end' came last instead of first.", "good": ["'Me building it from scratch' as the first words.", "A number and a trajectory: 50 a day, growing, wider release soon."], "bad": ["The web socket detail is for engineers.", "Inconsistent with the page: live for everyone and over a thousand daily. Pick the true one and say it every time."], "approach": ["First words answer the question; second sentence is the number and the direction; stop."], "say": ["Me, from scratch. We're four people and I own voice end to end, phone and web. It's with a cohort of paying users now, about 50 a day, growing since last month, and we're opening it to everyone soon."], "land": "Me, from scratch; the number; where it's heading."}, {"id": "x4", "label": "Why Commure and healthcare", "who": "Audrey", "q": "What is it about Commure, and about doing this in healthcare, that made you apply?", "tests": "Have you read about us, and is the interest real?", "said": ["Worked as a research software engineer at UIC with the health sciences department, alongside medical professionals. From the website, 30 percent of patient calls never get answered. Real-time voice is the hardest version of the work you like: latency, interruptions, now capable agents and realtime models. Comfortable shipping it to production reliably, the larger part of this year. Wants to spend the next few years going deeper."], "verdict": "landed", "why": "Your best answer: a personal link to healthcare, one fact from their site said carefully, and why the work suits you. It only lost points for the ending.", "good": ["UIC with clinicians: real, and she noticed.", "'From what I can read': their number, not yours.", "Reliability in production as your angle."], "bad": ["Didn't say what their agents do (book, reschedule, write back to the EHR), which shows you read past the headline.", "Trailed off: 'getting more in depth nuances, correct'."], "approach": ["Their problem in a line, your link to it, the work you like, then a closing sentence."], "say": ["From what I read, about 30 percent of patient calls never get answered, and your agents pick up and actually finish the job: they book, reschedule, and write it back to the EHR. That's a real person on the other end.", "I've worked with clinicians at UIC, so the domain isn't new, and real-time voice that takes actions safely is exactly what I do at alfred_. So it's the work I want to go deeper on, in a place where it matters."], "ref": "#say-why-commure", "land": "Their problem, your link to it, a closing sentence."}, {"id": "x5", "label": "Python and a side project", "who": "Audrey", "q": "How much of your day-to-day is Python? And is there a voice side project you'd point the engineers to?", "tests": "Python for a Python-first role, and one thing they can look at.", "said": ["The web app is TypeScript; the Railway workers are Python: workflow workers, long-running agents and the voice agents. A hands-on approach, end to end then the nuances. MockFlow-AI, a real-time voice assistant: streaming models, STT, interruption handling, which helped reach an MVP fast at alfred_. FastAPI and Django back ends and ML research too."], "verdict": "partly", "why": "The Python split was honest and clear. MockFlow-AI was named without what it is, a number, or that it's live, which is what makes it worth looking up.", "good": ["TypeScript web, Python workers: precise.", "MockFlow-AI tied to how you shipped alfred_'s MVP fast."], "bad": ["'Hands-on approach with the current coding setup' said nothing.", "No number for MockFlow-AI: under 400 ms, live.", "'Pretty handy' undersold it."], "approach": ["One line on where your Python is; one line on MockFlow-AI with its number."], "say": ["Our web app is TypeScript, but everything that runs agents is Python: the voice workers, the workflow workers, the long-running agents. Before that, FastAPI backends and ML research in Python.", "And MockFlow-AI: a real-time voice interview platform I built from scratch on LiveKit, under 400 milliseconds end to end, and live. Most of what I knew on day one of alfred_'s voice agent came from it."], "land": "Where your Python is; MockFlow-AI with its number."}, {"id": "x6", "label": "Logistics", "who": "Audrey", "q": "On site in Mountain View, work authorization, compensation.", "tests": "Short, complete answers so the process can move.", "said": ["Answers kept in chat, not on this page."], "verdict": "partly", "why": "On site was a clear yes, but it came wrapped in a paragraph, and the second half of a two-part question was skipped twice. On a real call, a skipped work authorization question stops the process until it's answered.", "good": ["The first answer was clear and immediate."], "bad": ["Two-part question, one part answered.", "A paragraph where one sentence was asked for."], "approach": ["One sentence per item, in the order asked, then hand it back. The answers themselves stay in chat."], "say": ["[On site and relocation: one sentence.] [Work authorization: one sentence.] [Pay: one sentence, anchored to the posting's range, asking about the full package.] Then: 'Happy to answer anything else on that by email.'"], "land": "A sentence each, in the order asked."}, {"id": "x7", "label": "Your questions", "who": "Audrey", "q": "What questions do you have for me?", "tests": "Curiosity, and whether you're thinking about the job itself.", "said": ["Where this role sits after the recent acquisitions and how it works with the product. Then next steps and the team."], "verdict": "partly", "why": "Good instincts, but the first question came out tangled, and the strongest closer was missing: asking whether anything in your background needs making clearer.", "good": ["Asking about the team and the next steps."], "bad": ["'Especially with the recent acquisitions where this particular role is in the team' was hard to follow.", "No closing question that invites her concerns."], "approach": ["Two short questions, then the closer."], "say": ["Commure has a few product lines now. Where does the voice agents team sit, and who would I work with most day to day?", "What do the technical rounds look like, and roughly what's the timeline?", "And is there anything in my background you'd want me to make clearer for the team?"], "land": "Team, process, then invite her concerns."}]}], "planKicker": "Before the call", "mechTitle": "", "designLink": null, "extra": "<b>Work in this order.<\/b> For Monday's fifteen minutes, the Prep tab's story is enough. For the round after: 1. Understand: six sessions on the Plan tab, each teaching what a thing is and why before anything to say. 2. Design: the guide's <a href=\"../SYSTEM%20DESIGN.html#/designs/voice-agent\" target=\"_blank\" rel=\"noopener\">voice agent for patient calls<\/a>, in six steps, and your own voice agent on the <a href=\"../ALFRED.html#l-voice\" target=\"_blank\" rel=\"noopener\">alfred_ page<\/a>, Voice 1 and Voice 2. 3. Say: the Prep tab, last, once every sentence is one you could explain. Refresh the basics on Baseline: <a href=\"../BASELINE.html#/audio\" target=\"_blank\" rel=\"noopener\">Audio and speech<\/a>, <a href=\"../BASELINE.html#/backend\" target=\"_blank\" rel=\"noopener\">Backend<\/a>, <a href=\"../BASELINE.html#/systems\" target=\"_blank\" rel=\"noopener\">Systems<\/a>, <a href=\"../BASELINE.html#/distributed\" target=\"_blank\" rel=\"noopener\">Distributed systems<\/a>.", "emphasis": [], "own": null, "showUp": [["Know the product in one line.", "AI call center agents that pick up every patient call: scheduling, rescheduling, cancellations, confirmations, FAQs and intake, written back to Epic, Cerner or Athena. Clinical questions go to staff."], ["Lead with alfred_'s voice agent.", "You own it end to end and it is live for everyone: phone over SIP and the web over WebRTC into LiveKit, one Python worker, a lean agent on the call with the main agent started in parallel on every turn. Reads answer fast; writes wait and the person confirms. That is Commure's job: call orchestration, conversation state, tool execution and write-back."], ["Then MockFlow-AI.", "The one you built from scratch and have live: LiveKit, under 400 ms, stages that move only by tool call, and an LLM-as-judge calibrated against human grades."], ["Say Python.", "The role is Python first. Your Python: FastAPI services, the UIC backend, the eval tooling, PyTorch. alfred_'s product code is TypeScript; say so if asked."], ["Outcomes, then stop.", "A recruiter wants what changed and what you owned, with a number. Leave the architecture for the technical rounds."], ["Logistics: one line each.", "The posting says Mountain View, on site five days. Pay, relocation, work authorization, start date: your answers are in chat."], ["Close with next steps.", "Ask what the technical rounds look like, and whether anything in your background needs making clearer."]], "prepLead": "Say comes last. Start with the <b>Understand first<\/b> bank: four questions that everything else rests on, each with its figure and the session that teaches it. Then the design, then your story out loud with the timer.", "storyBlurb": "Your intro, why Commure, the healthcare voice story, and logistics.", "sources": [{"label": "Software Engineer, Voice Agents: the job post (Ashby)", "url": "https://jobs.ashbyhq.com/commure/0e3440aa-4ddc-4a43-b4c3-804e60a1b2ff", "why": "The official posting. Its text is read from the mirror below."}, {"label": "The same posting, full text (freehire mirror)", "url": "https://freehire.me/jobs/software-engineer-voice-agents-commure-kvlqymic", "why": "Python backend for real-time voice agents: call orchestration, conversation state, tool execution, EHR write-back; low-latency telephony, ASR, LLM and TTS; Epic, Cerner, Athena. 2 to 4 years; async and real-time; testing, LLM evaluation, observability. Mountain View, on site; $130K to $180K."}, {"label": "Commure Agents: product page", "url": "https://www.commure.com/agents", "why": "69+ EHRs; 50% less manual call volume and $650K+ saved per 100 providers (their figures)."}, {"label": "Commure launches Commure Agents (press release, 25 June 2025)", "url": "https://www.commure.com/press-releases/commure-launches-commure-agents---ai-assistants-that-fully-automate-physician-workflows", "why": "AI Call Center Agents, Orchestrator and Engage. Tanay Tandon is the CEO; HCA and Tenet named."}, {"label": "Voice AI for patient call automation (Commure guide)", "url": "https://www.commure.com/blog-agents/voice-ai-systems-patient-call-automation", "why": "What gets automated and what doesn't: triage, authorizations and medication questions stay with people. Write-back so nothing is entered twice; escalation rules; PHI under a BAA."}, {"label": "Best voice AI agents in healthcare (Commure)", "url": "https://www.commure.com/blog-agents/best-voice-ai-agents-in-healthcare", "why": "One deployment: 45+ locations, 225+ providers, 200K+ inbound calls a year, abandonment at or under 3%. Configured during implementation, not plug-and-play."}, {"label": "How AI agents expand call center capacity (Commure)", "url": "https://www.commure.com/blog/how-ai-agents-expand-call-center-capacity-and-patient-access", "why": "30 to 80% of inbound calls resolved without staff, depending on the workflow."}, {"label": "Commure raises $70M at a $7B valuation (TBPN, 19 May 2026)", "url": "https://www.tbpndigest.com/story/2026-05-19/commure-raises-70m-at-7b-valuation-to-deploy-ai-agents-across-the-full-healthcare-administrative-stack", "why": "Led by General Catalyst with Sequoia; hiring 40 to 50 engineers for an AI-native EMR and voice agents."}, {"label": "Commure to acquire Augmedix (Healthcare Dive)", "url": "https://www.healthcaredive.com/news/commure-acquire-augmedix-ai-documentation/721978/", "why": "About $139M, July 2024: now the Ambient AI scribe line. Commure merged with Athelas in 2023."}, {"label": "Inside Commure: culture (Commure blog)", "url": "https://www.commure.com/blog/inside-commure-building-healthcares-future-starts-with-culture", "why": "Speed above all, high ownership and output, working shoulder to shoulder with customers, clear communication."}, {"label": "Commure: company site", "url": "https://www.commure.com", "why": "130+ health systems; '30% of patient calls never get answered' (their figure); Ambient AI, Dictation, revenue cycle, Agents."}], "company": ["Commure builds what they call the AI operating system for healthcare: Ambient AI and Dictation for documentation, Agents for patient and revenue workflows, and revenue cycle automation, on one platform integrated with 60+ EHRs. They report 500,000+ clinicians across 500+ organizations and over 200 million patient interactions.", "They raised $70M at a $7B valuation in May 2026, merged with Athelas in 2023 and bought Augmedix in 2024. The team works directly alongside clinicians, deploys daily, and values speed and ownership."], "posting": {"url": "https://jobs.ashbyhq.com/commure/0e3440aa-4ddc-4a43-b4c3-804e60a1b2ff", "label": "Software Engineer, Voice Agents, on Ashby", "checked": "1 October 2026", "lead": "Health system call centers can't keep up: they report that 85% of patients who can't get through never call back. The voice agents pick up every call and handle it end to end: scheduling, rescheduling, cancellations, confirmations, FAQs and intake, integrated with the EHR and telephony in real time. This role builds the systems they run on. Mid-level, on a small team that ships every day.", "facts": [["Where", "Mountain View, CA, on site five days a week"], ["Pay", "$130K to $180K, plus equity (the posting)"], ["Level", "Mid-level; 2 to 4 years of backend experience"]], "does": ["Python backend services for real-time voice agents: call orchestration, conversation state, tool execution and EHR write-back.", "Low-latency pipelines joining telephony, ASR, LLMs and TTS into one conversational loop.", "Integrations with Epic, Cerner, athena and others for scheduling, eligibility and intake.", "APIs, data models and event-driven workflows, designed with senior engineers.", "Features patient access teams actually use, with AI, product and operations.", "Own the quality of what you ship: latency, reliability, observability, release readiness."], "wants": ["2 to 4 years of backend work, mostly in Python.", "Production services, APIs and data models shipped.", "An intuition for how people talk to voice and text assistants.", "Async, event-driven or real-time systems, or the wish to grow into them.", "Testing, LLM evaluation, observability and reliability.", "A patient-centered mindset, a bias for action and ownership."]}, "rounds": []}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; o.rev = o.rev || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }
    var sm = el("summary", "", '<span class="qt">' + inl(title) + "</span>" + (meta ? '<span class="qm">' + meta + "</span>" : ""));
    d.appendChild(sm); d.appendChild(body);
    return d;
  }
  function bulk(host) {
    var b = el("div", "bulk");
    var o = el("button", "", "Open all"), c = el("button", "", "Close all");
    o.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = true; }); });
    c.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = false; }); });
    b.appendChild(o); b.appendChild(c);
    host.appendChild(b);
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });
    (s.study || []).forEach(function (_, i) { k.push(s.id + ":s" + i); });
    return k;
  }
  function isDone(t, s) { return !!t.done[s.id]; }
  function link(tab, anchor) { return "#/" + tab + (anchor ? "/" + anchor : ""); }
  /* A drill's reference is either a route already or an anchor on the prep tab. */
  function prepRef(r) { return r.indexOf("#/") === 0 ? r : link("prep", r.replace(/^#/, "")); }

  /* ---------------------------------------------------------------- tabs */
  var TABS = [
    { id: "overview", label: "Overview", show: function () { return true; } },

    bulk(s);

      acts.appendChild(start); acts.appendChild(save); acts.appendChild(see);
      body.appendChild(acts);
      var list = el("div", "attempts");

      var t0 = null, tick = null, secs = 0;
      function fmt(n) { return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); }
      start.addEventListener("click", function () {
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; return; }

    var end = el("div", "session-end");
    if (x.quiz.length) {
      var q = el("button", "btn primary", "Quiz this session, " + x.quiz.length + " questions");
      q.addEventListener("click", function () { openQuiz(x); });
      end.appendChild(q);
    }
    var d = el("button", "btn", isDone(t, x) ? "Mark not done" : "Mark the whole session done");
    d.addEventListener("click", function () { toggleSession(x); });
    end.appendChild(d);
    box.appendChild(end);
    var pager = el("div", "pager");
    var prev = LOOP.sessions[idx - 1], next = LOOP.sessions[idx + 1];
    pager.innerHTML = (prev ? '<a href="' + link("sessions", prev.id) + '"><span>Previous</span>' + esc(prev.name) + "</a>" : '<a href="' + link("overview", "plan") + '"><span>Back to</span>The plan</a>') +
      (next ? '<a class="next" href="' + link("sessions", next.id) + '"><span>Next</span>' + esc(next.name) + "</a>" : '<a class="next" href="' + link("mocks") + '"><span>Then</span>A mock interview</a>');
    box.appendChild(pager);
    host.appendChild(box);
  }

  /* Figures come from ../figures/figures.js by key, the same registry the tracker draws from. */
  function figNode(k, n) {
    var f = window.FIGURES && FIGURES.DIA[k];
    if (!f) { return null; }
    var fig = el("figure", f.fixed ? "" : "trk");
    fig.setAttribute("data-fig", k);
    if (n) { fig.appendChild(el("div", "fh", "Figure " + n + ". " + esc(f.title))); }
    fig.appendChild(el("div", "", f.svg()));
    fig.appendChild(el("figcaption", "", f.cap));
    return fig;
  }
  /* What an item rests on: its figures, what to read (with minutes), and where it sits in
     the system design guide. Shared by session steps and Prep questions. */
  function learn(body, x) {
    (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { body.appendChild(f); } });
    var read = el("ul", "reading"), seen = {};
    (x.read || []).forEach(function (r) {
      var k = r.url || r.book || r.label;
      if (!k || seen[k]) { return; }
      seen[k] = 1;
      read.appendChild(el("li", "", (r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + inl(r.label || r.url) + "</a>" : inl(r.book || r.label)) +
        (r.m ? '<span class="w">' + r.m + " min</span>" : "") + (r.why ? '<span class="why">' + inl(r.why) + "</span>" : "")));
    });
    if (read.children.length) { body.appendChild(el("div", "lab", "Read")); body.appendChild(read); }
    if (x.sdLinks && x.sdLinks.length) {
      body.appendChild(el("div", "lab", "In your system design guide"));
      var sd = el("ul", "reading");
      x.sdLinks.forEach(function (q) {
        sd.appendChild(el("li", "", '<a href="' + esc(q.href) + '" target="_blank" rel="noopener">' + esc(q.label) + "</a>" +
          (q.why ? '<span class="why">' + inl(q.why) + "</span>" : "")));
      });
      body.appendChild(sd);
    }
  }
  /* A step that asks you to say, explain or answer something gets a box: typed or dictated
     (Win+H), saved in the tracker's own answers so the tracker shows it too. Optional. */
  var SAYS = /out loud|say|saying|record yourself|explain|in your own words|answer the|talk through|walk through/i;
  function mineBox(key) {
    var box = el("div", "mine"), id = "mine-" + key.replace(/[^a-z0-9]/gi, "-");
    var lb = el("label", "", "Your answer"); lb.setAttribute("for", id);
    var ta = el("textarea"); ta.id = id;
    ta.placeholder = "Say it, then type or dictate it here (Win+H). Optional; saved as you go.";
    var t0 = tracker(), rec = (t0.answers || {})[key];
    ta.value = rec && rec.text ? rec.text : "";
    var st = el("div", "mine-st", rec && rec.at ? "Saved " + esc(rec.at) : "");
    var timer = null;
    ta.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(function () {
        var t = tracker(), v = ta.value.trim();
        t.answers = t.answers || {};
        if (v) { t.answers[key] = { text: v, at: stamp() }; st.textContent = "Saved " + t.answers[key].at; }
        else { delete t.answers[key]; st.textContent = ""; }
        writeJSON(TRACKER, t);
      }, 500);
    });
    box.appendChild(lb); box.appendChild(ta); box.appendChild(st);
    return box;
  }
  function sayToggle(label, node) {
    var d = el("details", "say");
    d.appendChild(el("summary", "", esc(label)));
    d.appendChild(node);
    return d;
  }
  /* A step opens to what it is, what to read, where it sits in the system design guide
     and the figure that draws it. What you would say stays shut until you have tried. */
  function stepNode(key, it, isStudy) {
    var t = tracker();
    var row = el("details", "step");
    var sm = el("summary");
    var tick = el("button", "tick" + (t.steps[key] ? " on" : ""), t.steps[key] ? "&#10003;" : "");
    tick.setAttribute("aria-label", "Mark done: " + it.t);
    tick.addEventListener("click", function (e) {
      e.preventDefault(); e.stopPropagation();
      var tt = tracker();
      if (tt.steps[key]) { delete tt.steps[key]; delete tt.steps[key + ":at"]; }
      else { tt.steps[key] = true; tt.steps[key + ":at"] = stamp(); }
      writeJSON(TRACKER, tt);
      tick.classList.toggle("on", !!tt.steps[key]);
      tick.innerHTML = tt.steps[key] ? "&#10003;" : "";
      progress();
    });
    sm.appendChild(tick);
    sm.appendChild(el("span", "st", inl(it.t)));
    var mins = it.m || (it.do || []).reduce(function (a, d) { return a + (d.m || 0); }, 0);
    sm.appendChild(el("span", "sm", mins ? mins + " min" : ""));
    row.appendChild(sm);

    var body = el("div", "sbody");
    if (!isStudy && it.d) { body.appendChild(el("p", "d", inl(it.d))); }
    learn(body, { figs: it.figs || [] });

    var pre = [];
    if (isStudy && it.do) {
      it.do.forEach(function (d) {
        pre.push({ url: d.url, label: d.a, m: d.m, why: d.where });
      });
    }
    if (!isStudy && (it.where || it.url)) { pre.push(it.url ? { url: it.url, label: it.where || it.url } : { book: it.where }); }
    learn(body, { figs: [], read: pre.concat(isStudy ? (it.res || []) : (it.links || []), it.read || []), sdLinks: it.sdLinks });
    var say = isStudy ? it.say : it.ans;
    if (say || SAYS.test(it.t || "")) { body.appendChild(mineBox(key)); }
    if (say) { body.appendChild(sayToggle(isStudy ? "The idea, in the words you would use" : "What you would say", transcript(Array.isArray(say) ? say : [say], "", ""))); }
    row.appendChild(body);
    return row;
  }

  function toggleSession(x) {
    var t = tracker();
    if (t.done[x.id]) {
      delete t.done[x.id];
    } else {
      stepKeys(x).forEach(function (k) { if (!t.steps[k]) { t.steps[k] = true; t.steps[k + ":at"] = stamp(); } });
      if (x.hasTrackerQuiz && !(t.quiz[x.id] && t.quiz[x.id].passed)) {
        t.quiz[x.id] = { score: 0, passed: true, at: stamp(), missed: [], via: "interview page" };
      }
      t.done[x.id] = stamp();
    }
    writeJSON(TRACKER, t);
    route();
  }

  /* ---------------------------------------------------------------- mocks */
  /* A mock reads in two parts: the read (how it went, what landed, what to fix first),
     then the conversation, one exchange at a time. Each exchange shows who asked what and
     what you said, with a verdict; it opens to why, how to approach it, and the answer to
     say, behind the same toggle the Prep tab uses. */
  var VERDICT = { landed: "Landed", partly: "Partly", missed: "Missed", gap: "Gap: you did not have an answer" };
  function tabMocks(host) {
    var s = heading(host, "mock", "Run in chat", "Mock interviews");
    s.appendChild(el("p", "lead", inl(LOOP.mockHow)));
    if (!LOOP.mocks.length) {
      s.appendChild(el("p", "when", "None yet. After a mock in chat, its read and its exchanges appear here. The latest two are kept."));
    }
    LOOP.mocks.slice(-2).reverse().forEach(function (m, mi) { drawMock(host, m, mi); });
  }
  function drawMock(host, m, mi) {
    var pre = m.id || "m" + mi;
    var s = heading(host, pre, m.when, m.title);
    var ex = m.exchanges || [];
    if (!ex.length && m.critique) { s.appendChild(el("p", "", inl(m.critique))); return; }
    var tally = {};
    ex.forEach(function (x) { tally[x.verdict] = (tally[x.verdict] || 0) + 1; });
    s.appendChild(el("p", "mk-tally", ["landed", "partly", "missed", "gap"].filter(function (k) { return tally[k]; })
      .map(function (k) { return '<span class="vd vd-' + k + '"></span>' + tally[k] + " " + (k === "gap" ? "gaps" : k); }).join('<span class="sep"></span>') +
      '<span class="sep"></span>' + ex.length + " exchanges"));
    (m.read || []).forEach(function (p) { s.appendChild(el("p", "mk-read", inl(p))); });
    if (m.landed && m.landed.length) {
      s.appendChild(el("h3", "mk-h", "What landed"));
      var ul = el("ul", "mk-list");
      m.landed.forEach(function (t) { ul.appendChild(el("li", "", inl(t))); });
      s.appendChild(ul);
    }
    if (m.fix && m.fix.length) {
      s.appendChild(el("h3", "mk-h", "Fix these first"));
      var ol = el("ol", "mk-list mk-fix");
      m.fix.forEach(function (f) {
        var li = el("li", "", inl(f.t) + " ");
        var at = ex.findIndex(function (x) { return x.id === f.ref; });
        if (at >= 0) { li.appendChild(openLink("See turn " + (at + 1), m, at)); }
        ol.appendChild(li);
      });
      s.appendChild(ol);
    }
    /* The turns, one line each; the conversation itself opens in one screen. */
    var c = heading(host, pre + "-talk", "Every turn, in one screen", "The conversation");
    var go = el("button", "btn primary", "Open the conversation");
    go.addEventListener("click", function () { openConvo(m, 0); });
    c.appendChild(el("div", "acts")).appendChild(go);
    var list = el("ol", "turns");
    ex.forEach(function (x, i) {
      var li = el("li");
      var b = el("button", "turn");
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) +
        '</span><span class="tw spk-' + esc((x.who || "").toLowerCase()) + '">' + esc(x.who) + "</span>";
      b.addEventListener("click", function () { openConvo(m, i); });
      li.appendChild(b); list.appendChild(li);
    });
    c.appendChild(list);
  }
  function openLink(text, m, i) {
    var a = el("button", "linkish", esc(text));
    a.addEventListener("click", function () { openConvo(m, i); });
    return a;
  }

  /* One screen, shared by mocks and the Prep banks: a list on the left, the chosen item on
     the right. The item's header is small; under it, the light column is for understanding
     and the dark sheet is what to say, each scrolling on its own. Arrows move; Escape closes. */
  var convo = document.getElementById("convo");
  function panelSection(host, label, nodes) {
    if (!nodes.length) { return; }
    host.appendChild(el("div", "lab", label));
    nodes.forEach(function (n) { host.appendChild(n); });
  }
  function panelList(items, cls) {
    if (!items || !items.length) { return []; }
    var u = el("ul", "mk-list " + (cls || ""));
    items.forEach(function (t) { u.appendChild(el("li", "", inl(t))); });
    return [u];
  }
  /* o: { title, sub, label, count, row(i) -> html for the rail, draw(i, pane), start } */
  function openPanel(o) {
    var cur = o.start || 0;
    convo.innerHTML = "";
    convo.setAttribute("aria-label", o.label || o.title);
    var shell = el("div", "cv");
    var rail = el("nav", "cv-rail");
    rail.appendChild(el("div", "cv-title", "<b>" + esc(o.title) + "</b>" + (o.sub ? "<span>" + esc(o.sub) + "</span>" : "")));
    var rows = [];
    for (var i = 0; i < o.count; i++) {
      (function (i) {
        var b = el("button", "turn");
        b.innerHTML = o.row(i);
        b.addEventListener("click", function () { show(i); });
        rail.appendChild(b);
        rows.push(b);
      }(i));
    }
    rail.appendChild(el("div", "cv-keys", "Up and down arrows move. Escape closes."));
    var pane = el("section", "cv-pane");
    var close = el("button", "cv-close", "Close");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", function () { convo.close(); });
    shell.appendChild(rail); shell.appendChild(pane);
    convo.appendChild(close); convo.appendChild(shell);
    function show(i) {
      cur = i;
      rows.forEach(function (b, j) { b.classList.toggle("on", j === i); if (j === i) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); } });
      rows[i].scrollIntoView({ block: "nearest" });
      pane.innerHTML = "";
      o.draw(i, pane, function () { rows[i].innerHTML = o.row(i); });
      [].forEach.call(pane.querySelectorAll(".cv-col"), function (c) { c.scrollTop = 0; });
    }
    convo.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = cur + (e.key === "ArrowDown" ? 1 : -1);
        if (n >= 0 && n < o.count) { show(n); rows[n].focus(); }
      }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    rows[cur].focus();
  }
  function panelCols(pane, leftTitle, rightTitle) {
    var cols = el("div", "cv-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "cv-col cv-say");
    left.appendChild(el("h3", "cv-h", leftTitle));
    right.appendChild(el("h3", "cv-h", rightTitle));
    cols.appendChild(left); cols.appendChild(right);
    pane.appendChild(cols);
    return { left: left, right: right, cols: cols };
  }

  /* A mock: what they asked and how it landed; what you said; what to say. */
  function openConvo(m, start) {
    var ex = m.exchanges;
    openPanel({
      title: m.title, sub: m.when, label: "Mock conversation", count: ex.length, start: start,
      row: function (i) {
        var x = ex[i];
        return '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) + "</span>";
      },
      draw: function (i, pane) {
        var x = ex[i], who = (x.who || "").toLowerCase();
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q spk-" + who, '<span class="ex-who">Turn ' + (i + 1) + " of " + ex.length + ", " + esc(x.who) + "</span>" + inl(x.q)));
        head.appendChild(el("p", "cv-verdict", '<span class="vd vd-' + esc(x.verdict) + '"></span><b>' + esc(VERDICT[x.verdict] || x.verdict) + ".</b> " + inl(x.why || "")));
        if (x.tests) { head.appendChild(el("p", "cv-tests", "<b>They were testing:</b> " + inl(x.tests))); }
        pane.appendChild(head);
        var c = panelCols(pane, "What you said", "What to say");
        panelSection(c.left, "In short", (x.said || []).map(function (p) { return el("p", "ex-said", inl(p)); }));
        panelSection(c.left, "What worked", panelList(x.good, "mk-good"));
        panelSection(c.left, "What did not", panelList(x.bad, "mk-bad"));
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.say && x.say.length) { c.right.appendChild(transcript(x.say, "You", "")); }
        panelSection(c.right, "How to approach it", panelList(x.approach));
        (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.right.appendChild(f); } });
        var links = [];
        if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
        if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
        if (links.length) { c.right.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      }
    });
  }

  /* A Prep question can be marked revised; the mark is kept in this page's storage. */
  function isRevised(id) { return !!own().rev[id]; }
  function setRevised(id, on) {
    var o = own();
    if (on) { o.rev[id] = stamp(); } else { delete o.rev[id]; }
    writeJSON(OWN, o);
  }
  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    return { tab: tab, anchor: p[1] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = link(t.id);
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = [];
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "rounds") { tabRounds(main); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "mocks") { tabMocks(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    drawTabs(r.tab); drawSide(r.tab); progress();
    var key = r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var c = document.getElementById("count");
    if (!LOOP.when_iso) { c.textContent = "Date to be set"; return; }
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
</html>
