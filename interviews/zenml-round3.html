gainst new agent versions, with tools answered from a snapshot of the user's world. Happy to go into either."], "ref": "#say-intro", "land": "Three sentences: what alfred_ is with one number, what you own, and the one piece closest to their work. Then stop."}, {"id": "x2", "label": "What pass through means", "who": "Alex", "q": "You said that if the agent calls a tool that isn't in the snapshot, you send an error or a pass through. What does pass through mean in your harness? Does that call hit Gmail for real, and how would you know afterwards?", "tests": "Provenance. Can a reader of your results tell recorded from live, or invented?", "said": ["It never leaves the machine. The agent gets an empty result back, with an indication that it's the wrong tool; those calls are marked so the snapshot can be enriched."], "verdict": "partly", "why": "'Never leaves the machine' is the right first sentence. The empty result is the problem, and you described it as a feature.", "good": ["Clear that nothing reaches a live provider.", "You mark out-of-snapshot calls, which is the start of provenance."], "bad": ["Earlier you said 'error or pass through', here 'empty result with an indication', later 'no error, just null'. Three versions of one behaviour.", "An empty result is a plausible answer, so the agent can act on it as a fact."], "approach": ["Answer the literal question first: no, it cannot reach Gmail, because the harness flag routes every provider call to the snapshot.", "Then volunteer the limit in the same breath: 'what the agent gets back is the weak spot.' Interviewers push hardest on what you defend and ease off what you name."], "say": ["It never leaves the machine. With the harness flag on, every provider call goes to the snapshot, so there is no path to Gmail at all.", "What the agent gets back is the weak spot, honestly. Today a call outside the snapshot returns an empty result, and every such call is logged against the run. An empty result is a plausible answer, though. The agent can read it as 'there are no meeting notes', which is the harness telling it something false.", "What I'd do instead: return an explicit 'not in this snapshot' error the agent can't mistake for data, and treat any run that hit one as harness-limited, not as a pass or a fail."], "figs": ["harnessSeam"], "land": "It cannot reach Gmail. What it gets back is the weak spot, and I'd make that an explicit error."}, {"id": "x3", "label": "The empty result is a lie", "who": "Hamza", "q": "In production there probably were notes, so the harness taught the agent something false and it acted reasonably on it. How does your scoring tell 'the agent made a bad call' from 'the agent made a good call on a lie the harness told it'?", "tests": "Do you own your harness's failure modes, or defend them?", "said": ["Out-of-snapshot calls are marked. With rich enough aggregation it rarely happens; I haven't seen it. The north star is tool calls per completed task, and irrelevant calls add latency."], "verdict": "missed", "why": "You answered a different question (how often), then moved to the metric. 'I haven't seen it' reads as 'I never looked', which is the opposite of the signal you want.", "good": ["You do mark the calls, which is the raw material for a real answer."], "bad": ["'I have not seen it': rare is not the same as measured.", "Went sideways to the north-star metric instead of down into the scoring.", "Missed the chance to connect it to Kitaru's provenance gap, the critique you plan to make."], "approach": ["Agree with the premise out loud: 'you're right, those two runs look identical in the output.'", "Then the mechanism: mark the node, keep marked runs out of the headline number, and look at them separately.", "Close by tying it to their world: it's the same problem as a passthrough node without a mocked mark. That turns a weakness into your strongest critique."], "say": ["You're right, in the output those two runs look identical, and today my metric can't tell them apart on its own.", "What I have is the mark: every call outside the snapshot is logged against the run. The fix I'd make is to use it in scoring. A run that touched an out-of-snapshot call is harness-limited, so it's excluded from the headline number and goes to a separate list, and that list is the backlog for enriching the snapshot.", "It's the same problem as a passthrough node in Kitaru that carries no mocked mark: a reader can't tell a recorded answer from an invented or live one. In both systems every answer should carry how it was served."], "figs": ["kitaruPolicy"], "prep": "A tool the snapshot doesn't cover", "land": "Those runs look identical today. Marked runs leave the headline number, and it's Kitaru's provenance gap in my own harness.", "prepId": "q-a-tool-the-snapshot-doesn-t-cover-what-does-the-agent-get-ba"}, {"id": "x4", "label": "What counts as done", "who": "Hamza", "q": "An agent that gets your empty set and wraps up confidently has used fewer calls, so on your metric it looks more efficient. Who decides 'completed'? An assertion against the snapshot, a judge, something else? Be concrete.", "tests": "Is your headline metric gameable, and do you know how?", "said": ["Completion means the task was done: the email found and the todo list created. Failed runs are a separate class that is tracked."], "verdict": "partly", "why": "True but generic. He asked for the mechanism and got the definition, so it took another question to reach the real answer.", "good": ["Failed runs are counted separately, not averaged in."], "bad": ["No mechanism: who or what decides 'done'.", "Did not say that calls per task is only computed over runs that pass, the one fact that answers his worry."], "approach": ["When told 'be concrete', give one worked example with the check named: which rows the assertion reads, what it expects.", "Then show you know the metric's blind spot and what sits next to it.", "Structure behind it: requirements, what is frozen, how it runs, how it is scored. Outcome and final state come before trajectory."], "say": ["Deterministic assertions against the snapshot decide it. For 'make a todo list from this email', the snapshot knows which email is the right one and what its action items are, so the run passes if the agent read that email and the created tasks match those items.", "More generally, pass or fail is the final state against a goal state, not the path: two runs can take different routes to the same right result, and both pass. The path is scored separately.", "Tool calls per completed task is only computed over runs that pass those assertions, so an agent that wraps up early on an empty result doesn't get a better number, it gets a failed run. We moved 2.5 to 2.2 on that metric for the same outcomes.", "On its own it would reward guessing over clarifying, which is why it sits next to a count of false completion claims."], "figs": ["completeness"], "prep": "What makes a run count as done", "land": "Assertions against the snapshot decide done, and the efficiency metric only counts runs that pass.", "prepId": "q-what-makes-a-run-count-as-done"}, {"id": "x5", "label": "Four items, three created", "who": "Alex", "q": "The email has four action items. The agent creates a todo list with three. Pass or fail, and what piece of code or which model makes that call?", "tests": "Completeness, and whether you have the refunds lesson ready.", "said": ["A pass for the completion metric. Ground truth per instance is known, so completeness is a second, orthogonal score, and three of four is measured there. Judging has moved to Claude Code."], "verdict": "partly", "why": "The two-score design is right. But 'pass' for a todo list missing an item is the refunds bug you already fixed, and you didn't use that story.", "good": ["Ground truth held per instance: the strongest part of your design.", "Separating completion from completeness."], "bad": ["Called it a pass; for an enumerable answer, a missing item should fail the assertion.", "Didn't reach for the refunds story, which is exactly this case with a real outcome.", "Said the judge is Claude Code without saying which parts are assertions and which are judged."], "approach": ["Decide first: enumerable or not. Four action items is a set you can count, so it is an assertion, not a judgement.", "Then the story that proves you learned it the hard way: the ledger that left out two refunds."], "say": ["It fails, and code decides it, not a model. Action items are enumerable: the snapshot knows there are four, so the case asserts that all four appear. Three of four is a fail on that assertion, and a 0.75 on the completeness score we track across the bench.", "We learned that the hard way. A ledger request produced a clean, well-formed ledger that left out two refunds, and every surface check passed. After that, anything enumerable from the fixture is asserted against it.", "A model only judges what can't be counted, like whether a meeting brief is useful, and those cases stay out of automated gating."], "figs": ["completeness"], "ref": "#say-refunds", "prep": "Four action items, the agent creates three", "land": "Enumerable means asserted: three of four fails, and the refunds bug is why.", "prepId": "q-four-action-items-the-agent-creates-three-pass-or-fail"}, {"id": "x6", "label": "Did the judge move?", "who": "Alex", "q": "Claude Code judging on Tuesday and Claude Code judging on Friday won't always agree. How do you know the judge didn't move when your pass rate moves?", "tests": "Is the judge measured, or trusted?", "said": ["No calibration yet for the completeness judge; the harness is local and it's my gut. Ground truth stays fixed. The bench reruns on tool, agent or subtask changes, and the reconciler appends new production cases."], "verdict": "partly", "why": "The honesty landed. But in your intro you said the judge was calibrated, so without naming two judges it sounded like a contradiction.", "good": ["'No calibration yet, it's my gut' is exactly the kind of limit they respect.", "Ground truth fixed across runs."], "bad": ["Two judges, one word: the scanner's judge is calibrated, the completeness judge is not. Say which.", "No concrete way to detect drift, and there is a cheap one."], "approach": ["Separate the two judges in your first sentence.", "Then one mechanism that detects judge drift without new labels: re-judge frozen outputs.", "Add pass^k when they push on noise: for a gating case, report whether it passes every time in k runs, not once."], "say": ["There are two judges, and they're in different states. The scanner's judge, which decides whether a production flag is a real bug, is calibrated: weekly against fresh human labels, about three in four agreement.", "The completeness judge on the bench isn't calibrated yet. Where the answer is enumerable I've replaced it with assertions, so it only judges what can't be counted.", "To tell judge drift from agent change I'd keep a frozen set of past outputs and re-judge it whenever the judge's model or prompt changes. The outputs didn't change, so if the verdicts moved, the judge moved. And the judge's model and prompt are pinned per bench run."], "figs": ["passk"], "prep": "How do you know the judge is still right", "land": "Two judges: the scanner's is calibrated, the completeness one is not yet. Re-judge frozen outputs to catch drift.", "prepId": "q-how-do-you-know-the-judge-is-still-right"}, {"id": "x7", "label": "A better prompt misses everything", "who": "Hamza", "q": "A customer imports a few hundred Langfuse traces, improves the system prompt, and the agent now searches the CRM with a cleaner query. Every search misses the recording; with on_miss set to fail, half the cohort dies. 'Your tool punishes me for improving my agent.' What do we build?", "tests": "Product judgement on their central problem. They argue about this internally.", "said": ["A fake or mock world, maybe a simulated user, but I'd rather not go into that. A read-tool policy that executes against the user's environment if they provide one. Not exactly sure."], "verdict": "gap", "why": "You jumped to the biggest idea, simulation, and backed away from it. The answer was on your Prep tab.", "good": ["Splitting reads from writes is the right instinct; it just came out as an afterthought."], "bad": ["Started with the hardest option and then declined to discuss it.", "No order: what first, what next, what last.", "'Not exactly sure' before trying the smallest version."], "approach": ["Say the reframe first: a miss is information, the agent's behaviour changed. That buys you ten seconds and shows judgement.", "Then build up in order of cost: the miss experience (diff and accept), then policy by effect (reads, writes), then the world model for the few sessions that fork.", "If you blank, say 'let me start with what the user sees' and describe the screen.", "Say what you would not rebuild: the runner, the sandbox and the replay layer work. Your value is the layer above: production traces into cases, stateful environments, outcome and policy scoring."], "say": ["First, a miss is information: it means the agent's behaviour changed, which is what they were measuring. So the goal isn't to avoid misses, it's to stop a miss from killing the run and make it cheap to resolve.", "The first thing I'd build is the miss experience. Show the recorded call next to what the new agent sent. If they're equivalent, one action accepts it and writes a static alias, so the next replay hits. It's deterministic and auditable, and every accepted pair is labelled data for matching later.", "Second, policy by effect. A read that misses can fall through to the customer's own environment, marked live on the node. A write that misses fails closed on a fork, never passthrough.", "And the honest limit: that fixes rephrasing, not an agent that takes a different path. For those few sessions, promote the trace into a small queryable world, which is what my bench does. The common case stays free."], "figs": ["missFlow", "kitaruKey"], "ref": "#say-miss", "prep": "A better prompt misses every recording", "land": "A miss is information. Make it cheap to resolve, then split reads from writes, then a world for the few sessions that fork.", "prepId": "q-a-better-prompt-misses-every-recording-what-do-we-build"}, {"id": "x8", "label": "What the screen shows", "who": "Alex", "q": "Forget the perfect system. Tomorrow morning the customer sees half the runs died. What should that screen show them, so the miss is useful instead of a red X?", "tests": "Can you think like the user, concretely?", "said": ["The recorded call against what the agent did. Then last-turn replay, a stateful world across turns, a simulated user. Not really sure."], "verdict": "gap", "why": "Your first sentence was the answer. Then you recited the multi-turn options, which were answering a different question.", "good": ["'The recorded call against what the agent did' is exactly right."], "bad": ["Kept talking after the right answer, into material from another question.", "Nothing about what the user can do on that screen."], "approach": ["When your first sentence is right, stop and build on it: what is on the screen, what can they do there.", "Think of one row per miss, grouped, because a few hundred red rows is not usable."], "say": ["The misses grouped by tool, with a count, so they see '140 misses on search_crm' rather than 140 red rows.", "Open one and it's a diff: the recorded arguments next to what the new agent sent, the recorded result under it, and where in the session it happened.", "And on that row, the actions: accept as equivalent, which maps the new arguments to the recorded result; run this one call live, marked as live; or leave it failed. Accept applies to the whole group, so one decision clears the 140."], "figs": ["missFlow"], "land": "Misses grouped by tool, the recorded call next to what the agent sent, and the actions on that row."}, {"id": "x9", "label": "Which button", "who": "Hamza", "q": "The customer looks at the diff and says 'yes, those are the same search, just phrased better.' What button do they press, and what does it change for the next replay?", "tests": "Can you land a design all the way down to data?", "said": ["It would play out, but I'm not really sure and a bit lost."], "verdict": "gap", "why": "This is the static alias, the last step of your own miss script.", "good": [], "bad": ["No attempt at the mechanism. Even a rough one ('we remember the mapping') beats 'I'm lost'."], "approach": ["Name the button, then the data it writes, then what the next replay does with it. Three sentences.", "If you blank, buy time honestly: 'give me a second', then start from 'the next replay needs to hit, so something has to map the new call to the old result.'"], "say": ["'Accept as equivalent.' It writes a static alias for that tool: these new arguments map to that recorded call's result, scoped to this cohort.", "On the next replay the lookup checks the alias before it misses, so those calls hit, and the node is stamped 'served by alias' so nobody mistakes it for an exact match.", "And every accepted pair is a labelled example of 'different arguments, same meaning', which is what you'd need to train or tune fuzzy matching later, and test it in shadow first."], "figs": ["missFlow"], "prep": "The customer says the two searches are the same", "land": "Accept writes a static alias; the next replay hits, and the node says it was served by alias.", "prepId": "q-the-customer-says-the-two-searches-are-the-same-what-button-"}, {"id": "x10", "label": "Your questions for them", "who": "Hamza", "q": "Before we let you go, what questions do you have for us?", "tests": "Curiosity, and whether you've thought about their business.", "said": ["I'd love to understand the product more, and what you need from a product engineer specifically."], "verdict": "partly", "why": "A fine question, but generic. You have eight prepared ones that show you've read the product.", "good": ["Asking about the role itself is reasonable."], "bad": ["It could be asked of any company.", "Only one question. Ask one, listen, then one more."], "approach": ["Lead with the one that shows you read the source, then one about the role.", "One at a time, then wait."], "say": ["Where do you see Kitaru sitting against observability tools long term: is replay the wedge, or the product?", "And for the role: what would you want someone in this seat to have shipped by the end of the first month?"], "ref": "#ask", "land": "One question that shows you read the product, then one about the role. One at a time."}]}], "planKicker": "Friday to Sunday", "mechTitle": "Kitaru, mechanism by mechanism", "designLink": {"text": "The worked design, six steps and five deep dives:", "label": "Kitaru in your system design guide", "href": "../SYSTEM%20DESIGN.html#/designs/kitaru"}, "extra": "", "emphasis": ["frozen snapshot of the user's world", "only the call out to", "Only the provider call is swapped", "the only thing swapped", "harness mode", "harness flag", "SQLite snapshot", "twelve failure types", "three out of four", "a little over a hundred cases", "twenty-five real instances", "three people named Michael", "path it never took", "tool calls per completed task", "multi-turn orchestration", "append-only", "ground truth", "pinning an expected answer", "freezing a world rather than a transcript", "freezes the transcript", "froze the world", "fail in opposite directions", "promoted into a small queryable world", "a miss is information", "static alias", "shadow", "stamped on the node", "provenance", "the agent's clock isn't", "anti-fabrication", "tool-execution record", "tool-execution ledger", "at-least-once", "idempotent", "exactly-once", "FOR UPDATE SKIP LOCKED", "CREATE DATABASE ... TEMPLATE", "backstop", "SECURITY DEFINER", "PUBLIC", "row-level security", "fidelity", "execution truth", "a framework, a runtime for stateful agents, and the observability-and-eval product", "our own tables in Supabase Postgres", "divergence", "I never instrumented it", "estimate", "5,000-plus", "WheelPrice", "INFORMS Analytics+", "MockFlow-AI", "MetaRAG", "not looking to urgently leave", "Three doors, one brain", "no send path", "three layers", "byte-identical", "effects ledger", "fail closed", "no side door", "Volunteer the limit"], "own": {"tab": "alfred_", "kicker": "The system you own", "title": "alfred_, fresh in your head", "lead": ["They will ask about your day-to-day, and every Kitaru question has an alfred_ answer next to it. Two loops share one tool layer: an agent the user talks to over SMS, web and MCP, and a background pipeline that acts on mail alone and never sends.", "Open one part at a time: the point, the figure, then say it before you open the answer."], "parts": [{"id": "doors", "title": "Three doors, one brain, one tool package", "meta": "about 45 seconds", "point": "SMS, web and MCP converge on packages/tools; the pipeline is its own row; everything is one Supabase project.", "figs": ["alfredHld"], "sd": [{"v": "alfred", "a": "hld", "why": "The full high-level design, 23 boxes."}], "say": ["Three doors, one brain, one tool package. SMS goes through a webhook and a job queue because the reply can take longer than a webhook should. Web streams directly. MCP runs single tools as the user, behind an allowlist.", "The background pipeline is a separate row: ingestion stages mail, triage decides, the executor and the worker act, notify tells the user, and a reconciler checks the provider afterwards.", "Everything is one Supabase project: Postgres with row-level security, pg_cron for schedules, pgmq for the event bus, and Deno edge functions for compute. That is a deliberate choice for a small team; the trade-off is that one database carries every workload."], "learn": {"figs": ["alfredHld"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/hld", "label": "alfred_, high-level design", "why": "The full high-level design, 23 boxes."}]}}, {"id": "turn", "title": "One chat turn, in layer order", "meta": "about 40 seconds", "point": "Acknowledge fast, then lease, trace, prompt, loop, guard, reply. The layer order is the senior signal.", "figs": ["alfredTurn"], "sd": [{"v": "alfred", "a": "dataflow", "why": "The turn and the pipeline, step by step."}], "say": ["For chat: acknowledge the webhook, enqueue a job, and let the turn function take a lease on the conversation, open a trace, build a cached prompt, run a bounded loop where every tool call goes through the wrapper stack, then filter tone and send.", "Retries come from three places, so I need three layers: dedupe the webhook, lease the conversation, and key every write. A lock in memory would guard nothing across a provider call."], "learn": {"figs": ["alfredTurn"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/dataflow", "label": "alfred_, data flow", "why": "The turn and the pipeline, step by step."}]}}, {"id": "wrap", "title": "What one tool call passes through", "meta": "about 30 seconds", "point": "No surface calls execute(). One wrapper stack decides preview, confirmation and replay from what the tool declares; Kitaru's hook sits at the same seam.", "figs": ["alfredWrap"], "sd": [{"v": "alfred", "a": "deepdives", "why": "Action safety without a risk score."}], "say": ["I do not gate on a risk score. Every tool declares what class of side effect it has, and one wrapper stack around every call decides whether it previews, confirms, or replays. On top of that, the background executor has no send path at all.", "It is the same seam Kitaru's adapter hooks. We execute there; Kitaru answers from the recording there. The difference is that every write we have goes through it, so there is no side door."], "learn": {"figs": ["alfredWrap"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/deepdives", "label": "alfred_, deep dives", "why": "Action safety without a risk score."}]}}, {"id": "pipe", "title": "The pipeline acts on mail, and never sends", "meta": "about 40 seconds", "point": "Nine steps, two model calls, and only one function that sends, after approval.", "figs": ["alfredPipe"], "sd": [{"v": "alfred", "a": "dataflow", "why": "The nine steps, tagged code or model."}], "say": ["This is a pipeline, so I will list the steps and mark which ones are model calls. Nine steps, two model calls: triage and drafting. Everything that touches the provider is code.", "Silent actions are archive, label, move. Drafts wait for the user. Sending is a separate function that only runs after approval, and a reconciler verifies every silent effect against the provider afterwards."], "learn": {"figs": ["alfredPipe"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/dataflow", "label": "alfred_, data flow", "why": "The nine steps, tagged code or model."}]}}, {"id": "cost", "title": "Cost is a cache layout", "meta": "about 30 seconds", "point": "The shared prefix is about 107k tokens a call, so Block 1 is byte-identical for every user and cached for an hour.", "figs": [], "sd": [{"v": "alfred", "a": "deepdives", "why": "The cost dive, with the measured hit rates."}], "say": ["Cost is a cache layout problem. The shared prefix is about a hundred thousand tokens, so it has to be byte-identical across users and cached for an hour, with the per-user part in its own slot.", "Measured on the first model call of each turn: 91.4% cached inside five minutes, 62% outside it. A test guards the byte-identical block, because one formatter change broke it on main."], "learn": {"figs": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/deepdives", "label": "alfred_, deep dives", "why": "The cost dive, with the measured hit rates."}]}}, {"id": "quality", "title": "Production failures become eval cases", "meta": "about 30 seconds", "point": "The scanner turns real failing turns into cases, and the effects ledger, not the reply text, decides whether an action happened.", "figs": ["benchLoop"], "sd": [{"v": "alfred", "a": "deepdives", "why": "The quality-gate dive."}], "say": ["For quality, real failing turns get scanned, classified, and promoted into the eval suite, so the regression set is what users actually do.", "Two rules a whiteboard design forgets: a refusal is not an outcome, so check the retry; and the effects ledger, not the assistant's text, decides whether an action happened."], "learn": {"figs": ["benchLoop"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/deepdives", "label": "alfred_, deep dives", "why": "The quality-gate dive."}]}}, {"id": "ceiling", "title": "The honest ceiling: one Postgres", "meta": "about 20 seconds", "point": "Volunteer the limit before they find it, with the signal that would make you split it.", "figs": [], "sd": [{"v": "alfred", "a": "deepdives", "why": "One Postgres for everything."}], "say": ["It is one Postgres. That is right for this team size, isolated in the schema: partitioned event tables, partial indexes on hot statuses, SKIP LOCKED consumers.", "The day chat latency moves with triage batch size is the day the pipeline gets its own instance."], "learn": {"figs": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/deepdives", "label": "alfred_, deep dives", "why": "One Postgres for everything."}]}}], "numbers": [["Edge functions", "about 370 Deno functions, about 250 cron registrations, one Postgres"], ["Chat volume", "about 310 turns a day fleet-wide, one every 4.6 minutes"], ["Prompt prefix", "about 107k cacheable tokens a call; 4 blocks, 3 cache breakpoints"], ["Cache hit", "91.4% inside 5 minutes at $0.38 per Mtok; 62% outside it at $1.04"], ["Agent loop", "at most 12 steps a turn"], ["Pipeline", "9 steps, 2 model calls, 1 send path"], ["Accounts", "up to six Gmail, Outlook or IMAP accounts a user"]], "compare_figs": ["alfredVsKitaru"], "compare": {"head": ["Question", "alfred_", "Kitaru"], "rows": [["Where a tool call is caught", "`compose()` around every call; no surface calls execute()", "The adapter hook, on registered function tools only"], ["Default for a write", "Preview, confirm, then an idempotency key", "passthrough: the real tool runs"], ["What proves an action happened", "The `turn_effects` ledger, and a reconciler that checks the provider", "The mocked attribute, absent on passthrough"], ["Retries and repeats", "Event dedupe, a conversation lease, idempotency keys", "An occurrence counter: read, await, then write"], ["Where traces live", "Own tables in Postgres, read by the scanner", "A SessionNode tree, imported from trace stores"], ["Replay for evals", "Real failures replayed against a frozen world", "A cohort replayed from the call log"]]}, "bridges": [{"id": "b-prov", "title": "Provenance: what you would bring from alfred_", "point": "The effects ledger is the record Kitaru lacks.", "say": ["In alfred_ we never trusted the assistant's text to say an action happened; the effects ledger did. A replay node should carry the same: which policy answered it, and whether anything left the process. That turns the provenance gap into a field."]}, {"id": "b-writes", "title": "Side effects: why passthrough would not have passed your review", "point": "A write is declared as a write, and a fork should fail closed on it.", "say": ["Our write tools declare a capability class and carry an idempotency key, so a default that runs the real tool would not have passed review. On a forked replay I would default writes to fail closed, and let a read fall through only if it is marked safe."]}, {"id": "b-import", "title": "Import: the traces you already have", "point": "Your turn traces and tool executions are what Kitaru's importer would ingest; the scanner picks which are worth replaying.", "say": ["Our turn traces and tool executions are exactly what an importer would ingest. The part I would keep is the scanner: most traces are not worth replaying, and picking the failing ones is where the value was."]}]}, "showUp": [["Headline first, then stop.", "About 45 seconds, then offer the depth: 'I can go into the bench or the memory work.' The first answer sets the pace for ninety minutes; in the mock it ran over three."], ["Answer the person asking.", "Hamza, the co-founder, wants your story, your judgement, why this move and what you would cut. Alex, their Founding DevEx Engineer, wants the mechanism, the API shape, and what the user types and sees."], ["Say the limit before they find it.", "In the mock, defending the empty result cost more than the gap itself. 'That's a gap, and here is what I'd do' is the senior answer. Their own value is Be honest: 'provide candid feedback and own your actions'."], ["When lost, go to what the user sees.", "The screen, the click, what changes next time. It rescues any design question; it would have rescued the miss question."], ["Buy time honestly.", "'Give me a second' is fine. 'Essentially', 'so to say', 'in a sense' are not."], ["Numbers, unprompted.", "5,000-plus users, about 25 real instances per task, 2.5 to 2.2 tool calls per task, about three in four genuine flags, a little over a hundred cases."], ["Show their words as habits, never quote them.", "Their post asks for 'end-to-end in days, not weeks', 'a Slack conversation into a merged PR before lunch', 'product taste for developer tools', 'low ego, high standards'. Tell a story that shows each; do not recite the post."], ["The public half is part of the job.", "Lennart and Michael both raised it. Have your YouTube channel, LinkedIn, the INFORMS talk and MockFlow-AI's launch video ready, and your first post about Kitaru in one sentence."], ["Care that Kitaru wins.", "They are founders. Admire one thing specifically (the selector design), then critique one thing as a question. Energy for the product reads as fit."], ["Leave twenty minutes.", "At minute 70 of 90, turn to your questions. One at a time, then wait."]], "prepLead": "Start with how to show up. Then open a bank: each question shows what they are testing, the nuance, figures and reading on the light side, and what to say on the dark sheet. Mark each one revised as you go.", "storyBlurb": "Intro, why this seat, the bench in two and five minutes, the refunds case, the miss, the critique, the close.", "sources": [{"label": "Product Engineer, ZenML/Kitaru: the job post (closed to applications)", "url": "https://careers.crane.vc/companies/zenml-2/jobs/74821580-product-engineer-zenml-kitaru-f-m-d-full-time", "why": "What they asked for, in their words: ship end to end in days, build for Python developers, close the loop on UX, AI-first and craft-first."}, {"label": "ZenML: company and values", "url": "https://www.zenml.io/company", "why": "Challenge everything, Empathize, Be efficient, Enable others, Be honest. Alex is listed as Founding DevEx Engineer."}, {"label": "ZenML careers", "url": "https://www.zenml.io/careers", "why": "No hierarchies, full ownership, open source as the way to build software."}, {"label": "Introducing Kitaru (1 April 2026)", "url": "https://www.zenml.io/blog/kitaru-launch", "why": "The launch as a durable execution layer for Python agents: crash recovery, human-in-the-loop, replay from any checkpoint."}, {"label": "Alex Strick van Linschoten's blog", "url": "https://alexstrick.com/", "why": "He writes in public about MLOps and engineering; read two recent technical posts."}, {"label": "ZenML's LLMOps Database", "url": "https://www.zenml.io/llmops-database", "why": "About 2,100 production case studies: how ZenML does public, useful content."}, {"label": "interviewing.io: a senior engineer's guide to the system design interview", "url": "https://interviewing.io/guides/system-design-interview/part-three", "why": "Clarifying: requirements first, and write down what you are told to assume."}, {"label": "Hello Interview: what your system design interviewer is really judging", "url": "https://hellointerview.substack.com/p/what-your-system-design-interviewer", "why": "Clarifying: the prompt is vague on purpose."}, {"label": "HBS Online: questions to ask before joining a startup", "url": "https://online.hbs.edu/blog/post/startup-interview-questions", "why": "Contributing: what success looks like, and whether the plan is concrete."}, {"label": "The Muse: questions software engineers should ask", "url": "https://www.themuse.com/advice/software-engineer-questions-to-ask-interview-find-the-right-fit", "why": "Collaborating: code review and design practice as a window on the culture."}]}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; o.rev = o.rev || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }
    var sm = el("summary", "", '<span class="qt">' + inl(title) + "</span>" + (meta ? '<span class="qm">' + meta + "</span>" : ""));
    d.appendChild(sm); d.appendChild(body);
    return d;
  }
  function bulk(host) {
    var b = el("div", "bulk");
    var o = el("button", "", "Open all"), c = el("button", "", "Close all");
    o.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = true; }); });
    c.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = false; }); });
    b.appendChild(o); b.appendChild(c);
    host.appendChild(b);
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });
    (s.study || []).forEach(function (_, i) { k.push(s.id + ":s" + i); });
    return k;
  }
  function isDone(t, s) { return !!t.done[s.id]; }
  function link(tab, anchor) { return "#/" + tab + (anchor ? "/" + anchor : ""); }
  /* A drill's reference is either a route already or an anchor on the prep tab. */
  function prepRef(r) { return r.indexOf("#/") === 0 ? r : link("prep", r.replace(/^#/, "")); }

  /* ---------------------------------------------------------------- tabs */
  var TABS = [
    { id: "overview", label: "Overview", show: function () { return true; } },
    { id: "prep", label: "Prep", show: function () { return LOOP.scripts.length || LOOP.drills.length || LOOP.qa.length || LOOP.ask.length || (LOOP.ask3 || []).length; } },
    { id: "design", label: "Design", show: function () { return LOOP.tables.length || LOOP.figures.length; } },
    { id: "own", label: (LOOP.own && LOOP.own.tab) || "Yours", show: function () { return !!LOOP.own; } },
    { id: "sessions", label: "Sessions", show: function () { return LOOP.sessions.length; } },
    { id: "mocks", label: "Mocks", show: function () { return !!LOOP.mockHow; } }
  ].filter(function (t) { return t.show(); });
  var main = document.getElementById("main");
  var side = document.getElementById("side");
  var nav = [];            /* side links for the current tab: [anchor, label, sub] */

  function heading(host, id, kicker, title, sub) {
    var s = el("section", "block"); s.id = id;
    if (kicker) { s.appendChild(el("div", "kicker", esc(kicker))); }
    if (title) { s.appendChild(el("h2", "", esc(title))); }
    host.appendChild(s);
    nav.push([id, title || kicker, !!sub]);
    return s;
  }

  /* ---------------------------------------------------------------- overview */
  function tabOverview(host) {
    var s = el("section", "block"); s.id = "brief";
    s.appendChild(el("div", "kicker", esc(LOOP.subtitle)));
    s.appendChild(el("h1", "", esc(LOOP.title)));
    s.appendChild(el("p", "lead", esc(LOOP.format)));
    var dl = el("dl", "facts");
    dl.innerHTML = "<dt>When</dt><dd>" + esc(LOOP.when) + "</dd><dt>Who</dt><dd>" + esc(LOOP.who) + "</dd>";
    s.appendChild(dl);
    if (LOOP.bar) { s.appendChild(el("p", "bar", "<b>The bar.</b> " + inl(LOOP.bar))); }
    if (LOOP.extra) { s.appendChild(el("div", "lead", LOOP.extra)); }
    host.appendChild(s);
    nav.push(["brief", "The brief"]);
    if (!LOOP.sessions.length) { return; }

    var p = heading(host, "plan", LOOP.planKicker || "", "The plan");
    var t = tracker();
    var days = {}, order = [];
    LOOP.sessions.forEach(function (x) {
      if (!days[x.day]) { days[x.day] = []; order.push(x.day); }
      days[x.day].push(x);
    });
    var wrap = el("div", "days");
    order.forEach(function (d) {
      var box = el("div", "day");
      box.appendChild(el("h3", "", esc(d)));
      days[d].forEach(function (x) {
        var a = el("a", "srow" + (isDone(t, x) ? " done" : ""));
        a.href = link("sessions", x.id);
        a.innerHTML = '<span class="dot"></span><span><span class="nm">' + esc(x.name) +
          '</span><span class="bl">' + esc(x.blurb.replace(/^(Friday|Saturday|Sunday)[^.]*\.\s*/, "")) + '</span></span><span class="hrs">' + esc(x.len) + "</span>";
        box.appendChild(a);
      });
      wrap.appendChild(box);
    });
    p.appendChild(wrap);
    var go = el("div", "acts");
    TABS.filter(function (x) { return x.id !== "overview"; }).forEach(function (x) {
      var a = el("a", "btn", esc(x.label)); a.href = link(x.id); go.appendChild(a);
    });
    p.appendChild(go);
  }

  /* ---------------------------------------------------------------- prep: a hub
     The tab is short: how to show up, then the banks as rows, then drills, questions to
     ask, traps and sources. A bank opens in the one-screen panel. */
  function prepBanks() {
    var banks = [];
    if (LOOP.scripts.length) {
      banks.push({ id: "say", title: "Your story, in the words to say it", blurb: LOOP.storyBlurb || "", items: LOOP.scripts.map(function (x) {
        return { id: "say-" + x.id, q: x.title, short: x.title, tests: x.when, a: x.say, land: x.land, never: x.never, notes: x.notes,
          meta: x.length ? x.length.charAt(0).toUpperCase() + x.length.slice(1) + "." : "",
          drill: LOOP.drills.some(function (d) { return d.id === x.id; }) ? x.id : null };
      }) });
    }
    LOOP.qa.forEach(function (g, gi) {
      banks.push({ id: "qa-" + gi, title: g.group, blurb: g.blurb || "", items: g.items });
    });
    return banks;
  }
  function findPrep(banks, id) {
    for (var b = 0; b < banks.length; b++) {
      for (var i = 0; i < banks[b].items.length; i++) { if (banks[b].items[i].id === id) { return { bank: banks[b], i: i }; } }
    }
    return null;
  }
  var hubCounts = [];
  function drawHubCounts() {
    hubCounts.forEach(function (h) {
      var n = h.bank.items.filter(function (x) { return isRevised(x.id); }).length;
      h.node.innerHTML = h.bank.items.length + " questions" + (n ? '<span class="sep"></span><span class="rv">' + n + " revised</span>" : "");
    });
  }
  function tabPrep(host) {
    var banks = prepBanks();
    hubCounts = [];
    var s = heading(host, "prep", LOOP.prepKicker || "The day before", "Prep");
    if (LOOP.prepLead) { s.appendChild(el("p", "lead", inl(LOOP.prepLead))); }

    if (LOOP.showUp && LOOP.showUp.length) {
      var u = heading(host, "show-up", "Before the first question", "How to show up");
      var ol = el("ol", "showup");
      LOOP.showUp.forEach(function (x) { ol.appendChild(el("li", "", "<b>" + inl(x[0]) + "</b> " + inl(x[1]))); });
      u.appendChild(ol);
    }

    var h = heading(host, "banks", "Open one, study it in one screen", "Question banks");
    var f = el("input", "filter"); f.type = "search"; f.placeholder = "Search every bank, for example YouTube, lease, SQLite, first post";
    h.appendChild(f);
    var found = el("div", "found"); h.appendChild(found);
    var rows = el("div", "banks");
    banks.forEach(function (b) {
      var r = el("button", "bank");
      r.innerHTML = '<span class="bt">' + esc(b.title) + "</span>" + (b.blurb ? '<span class="bb">' + inl(b.blurb) + "</span>" : "");
      var cnt = el("span", "bc"); r.appendChild(cnt);
      hubCounts.push({ bank: b, node: cnt });
      r.addEventListener("click", function () { openBank(b, 0); });
      rows.appendChild(r);
    });
    h.appendChild(rows);
    drawHubCounts();
    f.addEventListener("input", function () {
      var v = f.value.trim().toLowerCase();
      found.innerHTML = "";
      rows.hidden = !!v;
      if (!v) { return; }
      var hits = 0;
      banks.forEach(function (b) {
        b.items.forEach(function (x, i) {
          var text = (x.q + " " + (x.a || []).join(" ") + " " + (x.notes || []).join(" ")).toLowerCase();
          if (text.indexOf(v) < 0 || hits >= 14) { return; }
          hits++;
          var r = el("button", "hit", '<span class="hb">' + esc(b.title) + "</span>" + inl(x.q));
          r.addEventListener("click", function () { openBank(b, i); });
          found.appendChild(r);
        });
      });
      if (!hits) { found.appendChild(el("p", "when", "Nothing matches.")); }
    });

    /* The rest folds shut, one line each, so the page is how to show up and the banks. */
    function fold(id, title, sub) {
      var d = el("details", "fold"); d.id = id;
      d.appendChild(el("summary", "", '<span class="ft">' + esc(title) + '</span><span class="fs">' + esc(sub) + "</span>"));
      var body = el("div", "fold-body"); d.appendChild(body);
      host.appendChild(d);
      nav.push([id, title]);
      return body;
    }
    if (LOOP.drills.length) { drills(fold("practise", "Practise aloud", LOOP.drills.length + " timed questions, out loud")); }
    var three = LOOP.ask3 || [];
    if (three.length) {
      /* Questions you ask, as three Cs: when, why and how for each kind, then each question
         with who to ask, how to loop it in, and what it shows. */
      var n3 = three.reduce(function (n, k) { return n + k.items.length; }, 0);
      var a3 = fold("ask", "Questions to ask: clarify, contribute, collaborate", n3 + " questions, in three kinds");
      three.forEach(function (k) {
        var sec = el("div", "c3"); sec.id = "ask-" + k.id;
        sec.appendChild(el("h3", "c3-t", esc(k.title) + '<span class="c3-w">' + inl(k.when) + "</span>"));
        sec.appendChild(el("p", "c3-why", inl(k.why)));
        var how = el("ul", "mk-list c3-how");
        k.how.forEach(function (t) { how.appendChild(el("li", "", inl(t))); });
        sec.appendChild(how);
        k.items.forEach(function (x) {
          sec.appendChild(el("div", "c3-q",
            '<span class="to">' + esc(x.to) + '</span><span class="q">' + inl(x.q) + "</span>" +
            '<span class="lp"><b>Loop it in.</b> ' + inl(x.loop) + "</span>" +
            '<span class="wy"><b>What it shows.</b> ' + inl(x.why) + "</span>"));
        });
        a3.appendChild(sec);
      });
    } else if (LOOP.ask.length) {
      var a = fold("ask", "Questions to ask", LOOP.ask.length + " questions, one at a time, then wait");
      LOOP.ask.forEach(function (x) { a.appendChild(el("div", "ask", '<span class="to">' + esc(x.to) + "</span><span>" + inl(x.q) + "</span>")); });
    }
    if (LOOP.traps.length) {
      var t = fold("traps", "Traps", LOOP.traps.length + " things that cost points before");
      LOOP.traps.forEach(function (x) { t.appendChild(el("div", "trap", "<b>" + esc(x[0]) + "</b><span>" + inl(x[1]) + "</span>")); });
    }
    if (LOOP.sources && LOOP.sources.length) {
      var so = fold("sources", "What this rests on", LOOP.sources.length + " checked links: the job post, their values, the launch");
      var ul = el("ul", "reading");
      LOOP.sources.forEach(function (x) {
        ul.appendChild(el("li", "", '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + inl(x.label) + "</a>" + (x.why ? '<span class="why">' + inl(x.why) + "</span>" : "")));
      });
      so.appendChild(ul);
    }
    /* A link to one question (#/prep/<id>) opens its bank at that question. */
    var want = parse().anchor, hit = want && findPrep(banks, want);
    if (hit) { setTimeout(function () { openBank(hit.bank, hit.i); }, 0); }
  }

  function drills(s) {
    s.appendChild(el("p", "lead", "Open one. Start the timer, answer out loud with Win+H dictating into the box, stop, save. Then read the script and say what you missed. The last three attempts are kept."));
    bulk(s);
    LOOP.drills.forEach(function (d) {
      var body = el("div", "sbody drill-body");
      var head = el("div", "acts"); head.style.marginTop = "0";
      var timer = el("span", "timer", "0:00");
      head.appendChild(el("span", "t", "Aim for " + esc(d.target)));
      head.appendChild(timer);
      body.appendChild(head);
      var ta = el("textarea"); ta.placeholder = "Press Win+H and speak, or type. What you actually said, not what you meant to say.";
      body.appendChild(ta);
      var acts = el("div", "acts");
      var start = el("button", "btn primary", "Start timer");
      var save = el("button", "btn", "Save attempt");
      var see = el("a", "btn", "Read the script"); see.href = prepRef(d.ref);
      acts.appendChild(start); acts.appendChild(save); acts.appendChild(see);
      body.appendChild(acts);
      var list = el("div", "attempts");
      body.appendChild(list);
      var t0 = null, tick = null, secs = 0;
      function fmt(n) { return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); }
      start.addEventListener("click", function () {
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; return; }
        t0 = Date.now(); secs = 0; start.textContent = "Stop";
        tick = setInterval(function () {
          secs = Math.round((Date.now() - t0) / 1000);
          timer.textContent = fmt(secs);
          timer.classList.toggle("over", secs > d.seconds);
        }, 250);
        ta.focus();
      });
      function draw() {
        list.innerHTML = "";
        (own().drills[d.id] || []).slice().reverse().forEach(function (at) {
          list.appendChild(el("div", "at", "<small>" + esc(at.at) + (at.secs ? ", " + fmt(at.secs) : "") + "</small>" + esc(at.text)));
        });
      }
      save.addEventListener("click", function () {
        if (!ta.value.trim()) { ta.focus(); return; }
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; }
        var st = own();
        var arr = st.drills[d.id] || [];
        arr.push({ at: stamp(), secs: secs, text: ta.value.trim() });
        st.drills[d.id] = arr.slice(-3);
        writeJSON(OWN, st);
        ta.value = ""; timer.textContent = "0:00"; timer.classList.remove("over"); secs = 0;
        draw();
      });
      draw();
      var n = (own().drills[d.id] || []).length;
      s.appendChild(item("drill-" + d.id, d.prompt, "Aim for " + esc(d.target) + (n ? ". " + n + " saved" : ""), body));
    });
  }

  function tabOwn(host) {

      var table = el("table");

        A.compare.rows.map(function (r) { return "<tr>" + r.map(function (x) { return "<td>" + inl(x) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody>";
      c.appendChild(table);

  /* ---------------------------------------------------------------- sessions, one at a time */
  function tabSessions(host, which) {
    var t = tracker();
    var idx = 0;
    LOOP.sessions.forEach(function (x, i) { if (x.id === which) { idx = i; } });
    if (!which) {
      var firstOpen = LOOP.sessions.findIndex(function (x) { return !isDone(t, x); });
      idx = firstOpen < 0 ? 0 : firstOpen;
    }
    LOOP.sessions.forEach(function (x, i) {
      nav.push(["s-" + x.id, x.name, false, link("sessions", x.id), i === idx, isDone(t, x)]);
    });
    var x = LOOP.sessions[idx];
    var box = el("div", "session"); box.id = "s-" + x.id;
    box.appendChild(el("div", "kicker", esc(x.day) + ", session " + (idx + 1) + " of " + LOOP.sessions.length));
    box.appendChild(el("h2", "", esc(x.name)));
    var meta = el("div", "meta");
    meta.innerHTML = "<span>" + esc(x.len) + "</span>" + (isDone(t, x) ? '<span class="chip done">Done ' + esc(t.done[x.id]) + "</span>" : "");
    box.appendChild(meta);
    if (x.intro) { box.appendChild(el("p", "intro", inl(x.intro))); }
    (x.figs || []).forEach(function (k, i) { var f = figNode(k, i + 1); if (f) { box.appendChild(f); } });
    bulk(box);
    x.steps.forEach(function (st, i) { box.appendChild(stepNode(x.id + ":" + i, st, false)); });
    if (x.study && x.study.length) {
      box.appendChild(el("h3", "", "What to know for it"));
      x.study.forEach(function (it, i) { box.appendChild(stepNode(x.id + ":s" + i, it, true)); });
    }
    var end = el("div", "session-end");
    if (x.quiz.length) {
      var q = el("button", "btn primary", "Quiz this session, " + x.quiz.length + " questions");
      q.addEventListener("click", function () { openQuiz(x); });
      end.appendChild(q);
    }
    var d = el("button", "btn", isDone(t, x) ? "Mark not done" : "Mark the whole session done");
    d.addEventListener("click", function () { toggleSession(x); });

    box.appendChild(end);
    var pager = el("div", "pager");
    var prev = LOOP.sessions[idx - 1], next = LOOP.sessions[idx + 1];
    pager.innerHTML = (prev ? '<a href="' + link("sessions", prev.id) + '"><span>Previous</span>' + esc(prev.name) + "</a>" : '<a href="' + link("overview", "plan") + '"><span>Back to</span>The plan</a>') +
      (next ? '<a class="next" href="' + link("sessions", next.id) + '"><span>Next</span>' + esc(next.name) + "</a>" : '<a class="next" href="' + link("mocks") + '"><span>Then</span>A mock interview</a>');
    box.appendChild(pager);
    host.appendChild(box);
  }

  /* Figures come from ../figures/figures.js by key, the same registry the tracker draws from. */
  function figNode(k, n) {
    var f = window.FIGURES && FIGURES.DIA[k];
    if (!f) { return null; }
    var fig = el("figure", f.fixed ? "" : "trk");
    fig.setAttribute("data-fig", k);
    if (n) { fig.appendChild(el("div", "fh", "Figure " + n + ". " + esc(f.title))); }
    fig.appendChild(el("div", "", f.svg()));
    fig.appendChild(el("figcaption", "", f.cap));
    return fig;
  }
  /* What an item rests on: its figures, what to read (with minutes), and where it sits in
     the system design guide. Shared by session steps and Prep questions. */
  function learn(body, x) {
    (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { body.appendChild(f); } });
    var read = el("ul", "reading"), seen = {};
    (x.read || []).forEach(function (r) {
      var k = r.url || r.book || r.label;
      if (!k || seen[k]) { return; }
      seen[k] = 1;
      read.appendChild(el("li", "", (r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + inl(r.label || r.url) + "</a>" : inl(r.book || r.label)) +
        (r.m ? '<span class="w">' + r.m + " min</span>" : "") + (r.why ? '<span class="why">' + inl(r.why) + "</span>" : "")));
    });
    if (read.children.length) { body.appendChild(el("div", "lab", "Read")); body.appendChild(read); }
    if (x.sdLinks && x.sdLinks.length) {
      body.appendChild(el("div", "lab", "In your system design guide"));
      var sd = el("ul", "reading");
      x.sdLinks.forEach(function (q) {
        sd.appendChild(el("li", "", '<a href="' + esc(q.href) + '" target="_blank" rel="noopener">' + esc(q.label) + "</a>" +
          (q.why ? '<span class="why">' + inl(q.why) + "</span>" : "")));
      });
      body.appendChild(sd);
    }
  }
  function sayToggle(label, node) {
    var d = el("details", "say");
    d.appendChild(el("summary", "", esc(label)));
    d.appendChild(node);
    return d;
  }
  /* A step opens to what it is, what to read, where it sits in the system design guide
     and the figure that draws it. What you would say stays shut until you have tried. */
  function stepNode(key, it, isStudy) {
    var t = tracker();
    var row = el("details", "step");
    var sm = el("summary");
    var tick = el("button", "tick" + (t.steps[key] ? " on" : ""), t.steps[key] ? "&#10003;" : "");
    tick.setAttribute("aria-label", "Mark done: " + it.t);
    tick.addEventListener("click", function (e) {
      e.preventDefault(); e.stopPropagation();
      var tt = tracker();
      if (tt.steps[key]) { delete tt.steps[key]; delete tt.steps[key + ":at"]; }
      else { tt.steps[key] = true; tt.steps[key + ":at"] = stamp(); }
      writeJSON(TRACKER, tt);
      tick.classList.toggle("on", !!tt.steps[key]);
      tick.innerHTML = tt.steps[key] ? "&#10003;" : "";
      progress();
    });
    sm.appendChild(tick);
    sm.appendChild(el("span", "st", inl(it.t)));
    var mins = it.m || (it.do || []).reduce(function (a, d) { return a + (d.m || 0); }, 0);
    sm.appendChild(el("span", "sm", mins ? mins + " min" : ""));
    row.appendChild(sm);

    var body = el("div", "sbody");
    if (!isStudy && it.d) { body.appendChild(el("p", "d", inl(it.d))); }
    learn(body, { figs: it.figs || [] });

    var pre = [];
    if (isStudy && it.do) {
      it.do.forEach(function (d) {
        pre.push({ url: d.url, label: d.a, m: d.m, why: d.where });
      });
    }
    if (!isStudy && (it.where || it.url)) { pre.push(it.url ? { url: it.url, label: it.where || it.url } : { book: it.where }); }
    learn(body, { figs: [], read: pre.concat(isStudy ? (it.res || []) : (it.links || []), it.read || []), sdLinks: it.sdLinks });
    var say = isStudy ? it.say : it.ans;
    if (say) { body.appendChild(sayToggle(isStudy ? "The idea, in the words you would use" : "What you would say", transcript(Array.isArray(say) ? say : [say], "", ""))); }
    row.appendChild(body);
    return row;
  }

  function toggleSession(x) {
    var t = tracker();
    if (t.done[x.id]) {
      delete t.done[x.id];
    } else {
      stepKeys(x).forEach(function (k) { if (!t.steps[k]) { t.steps[k] = true; t.steps[k + ":at"] = stamp(); } });
      if (x.hasTrackerQuiz && !(t.quiz[x.id] && t.quiz[x.id].passed)) {
        t.quiz[x.id] = { score: 0, passed: true, at: stamp(), missed: [], via: "interview page" };
      }
      t.done[x.id] = stamp();
    }
    writeJSON(TRACKER, t);
    route();
  }

  /* ---------------------------------------------------------------- mocks */
  /* A mock reads in two parts: the read (how it went, what landed, what to fix first),
     then the conversation, one exchange at a time. Each exchange shows who asked what and
     what you said, with a verdict; it opens to why, how to approach it, and the answer to
     say, behind the same toggle the Prep tab uses. */
  var VERDICT = { landed: "Landed", partly: "Partly", missed: "Missed", gap: "Gap: you did not have an answer" };
  function tabMocks(host) {
    var s = heading(host, "mock", "Run in chat", "Mock interviews");
    s.appendChild(el("p", "lead", inl(LOOP.mockHow)));
    if (!LOOP.mocks.length) {
      s.appendChild(el("p", "when", "None yet. After a mock in chat, its read and its exchanges appear here. The latest two are kept."));
    }
    LOOP.mocks.slice(-2).reverse().forEach(function (m, mi) { drawMock(host, m, mi); });
  }
  function drawMock(host, m, mi) {
    var pre = m.id || "m" + mi;
    var s = heading(host, pre, m.when, m.title);
    var ex = m.exchanges || [];
    if (!ex.length && m.critique) { s.appendChild(el("p", "", inl(m.critique))); return; }
    var tally = {};
    ex.forEach(function (x) { tally[x.verdict] = (tally[x.verdict] || 0) + 1; });
    s.appendChild(el("p", "mk-tally", ["landed", "partly", "missed", "gap"].filter(function (k) { return tally[k]; })
      .map(function (k) { return '<span class="vd vd-' + k + '"></span>' + tally[k] + " " + (k === "gap" ? "gaps" : k); }).join('<span class="sep"></span>') +
      '<span class="sep"></span>' + ex.length + " exchanges"));
    (m.read || []).forEach(function (p) { s.appendChild(el("p", "mk-read", inl(p))); });
    if (m.landed && m.landed.length) {
      s.appendChild(el("h3", "mk-h", "What landed"));
      var ul = el("ul", "mk-list");
      m.landed.forEach(function (t) { ul.appendChild(el("li", "", inl(t))); });
      s.appendChild(ul);
    }
    if (m.fix && m.fix.length) {
      s.appendChild(el("h3", "mk-h", "Fix these first"));
      var ol = el("ol", "mk-list mk-fix");
      m.fix.forEach(function (f) {
        var li = el("li", "", inl(f.t) + " ");
        var at = ex.findIndex(function (x) { return x.id === f.ref; });
        if (at >= 0) { li.appendChild(openLink("See turn " + (at + 1), m, at)); }
        ol.appendChild(li);
      });
      s.appendChild(ol);
    }
    /* The turns, one line each; the conversation itself opens in one screen. */
    var c = heading(host, pre + "-talk", "Every turn, in one screen", "The conversation");
    var go = el("button", "btn primary", "Open the conversation");
    go.addEventListener("click", function () { openConvo(m, 0); });
    c.appendChild(el("div", "acts")).appendChild(go);
    var list = el("ol", "turns");
    ex.forEach(function (x, i) {
      var li = el("li");
      var b = el("button", "turn");
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) +
        '</span><span class="tw spk-' + esc((x.who || "").toLowerCase()) + '">' + esc(x.who) + "</span>";
      b.addEventListener("click", function () { openConvo(m, i); });
      li.appendChild(b); list.appendChild(li);
    });
    c.appendChild(list);
  }
  function openLink(text, m, i) {
    var a = el("button", "linkish", esc(text));
    a.addEventListener("click", function () { openConvo(m, i); });
    return a;
  }

  /* One screen, shared by mocks and the Prep banks: a list on the left, the chosen item on
     the right. The item's header is small; under it, the light column is for understanding
     and the dark sheet is what to say, each scrolling on its own. Arrows move; Escape closes. */
  var convo = document.getElementById("convo");
  function panelSection(host, label, nodes) {
    if (!nodes.length) { return; }
    host.appendChild(el("div", "lab", label));
    nodes.forEach(function (n) { host.appendChild(n); });
  }
  function panelList(items, cls) {
    if (!items || !items.length) { return []; }
    var u = el("ul", "mk-list " + (cls || ""));
    items.forEach(function (t) { u.appendChild(el("li", "", inl(t))); });
    return [u];
  }
  /* o: { title, sub, label, count, row(i) -> html for the rail, draw(i, pane), start } */
  function openPanel(o) {
    var cur = o.start || 0;
    convo.innerHTML = "";
    convo.setAttribute("aria-label", o.label || o.title);
    var shell = el("div", "cv");
    var rail = el("nav", "cv-rail");
    rail.appendChild(el("div", "cv-title", "<b>" + esc(o.title) + "</b>" + (o.sub ? "<span>" + esc(o.sub) + "</span>" : "")));
    var rows = [];
    for (var i = 0; i < o.count; i++) {
      (function (i) {
        var b = el("button", "turn");
        b.innerHTML = o.row(i);
        b.addEventListener("click", function () { show(i); });
        rail.appendChild(b);
        rows.push(b);
      }(i));
    }
    rail.appendChild(el("div", "cv-keys", "Up and down arrows move. Escape closes."));
    var pane = el("section", "cv-pane");
    var close = el("button", "cv-close", "Close");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", function () { convo.close(); });
    shell.appendChild(rail); shell.appendChild(pane);
    convo.appendChild(close); convo.appendChild(shell);
    function show(i) {
      cur = i;
      rows.forEach(function (b, j) { b.classList.toggle("on", j === i); if (j === i) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); } });
      rows[i].scrollIntoView({ block: "nearest" });
      pane.innerHTML = "";
      o.draw(i, pane, function () { rows[i].innerHTML = o.row(i); });
      [].forEach.call(pane.querySelectorAll(".cv-col"), function (c) { c.scrollTop = 0; });
    }
    convo.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = cur + (e.key === "ArrowDown" ? 1 : -1);
        if (n >= 0 && n < o.count) { show(n); rows[n].focus(); }
      }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    rows[cur].focus();
  }
  function panelCols(pane, leftTitle, rightTitle) {
    var cols = el("div", "cv-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "cv-col cv-say");
    left.appendChild(el("h3", "cv-h", leftTitle));
    right.appendChild(el("h3", "cv-h", rightTitle));
    cols.appendChild(left); cols.appendChild(right);
    pane.appendChild(cols);
    return { left: left, right: right };
  }

  /* A mock: what they asked and how it landed; what you said; what to say. */
  function openConvo(m, start) {
    var ex = m.exchanges;
    openPanel({
      title: m.title, sub: m.when, label: "Mock conversation", count: ex.length, start: start,
      row: function (i) {
        var x = ex[i];
        return '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) + "</span>";
      },
      draw: function (i, pane) {
        var x = ex[i], who = (x.who || "").toLowerCase();
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q spk-" + who, '<span class="ex-who">Turn ' + (i + 1) + " of " + ex.length + ", " + esc(x.who) + "</span>" + inl(x.q)));
        head.appendChild(el("p", "cv-verdict", '<span class="vd vd-' + esc(x.verdict) + '"></span><b>' + esc(VERDICT[x.verdict] || x.verdict) + ".</b> " + inl(x.why || "")));
        if (x.tests) { head.appendChild(el("p", "cv-tests", "<b>They were testing:</b> " + inl(x.tests))); }
        pane.appendChild(head);
        var c = panelCols(pane, "What you said", "What to say");
        panelSection(c.left, "In short", (x.said || []).map(function (p) { return el("p", "ex-said", inl(p)); }));
        panelSection(c.left, "What worked", panelList(x.good, "mk-good"));
        panelSection(c.left, "What did not", panelList(x.bad, "mk-bad"));
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.say && x.say.length) { c.right.appendChild(transcript(x.say, "You", "")); }
        panelSection(c.right, "How to approach it", panelList(x.approach));
        (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.right.appendChild(f); } });
        var links = [];
        if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
        if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
        if (links.length) { c.right.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      }
    });
  }

  /* A Prep bank: what it is and what sits under it on the light side; what to say on the
     dark sheet. Each item can be marked revised; the mark is kept in this page's storage. */
  function isRevised(id) { return !!own().rev[id]; }
  function setRevised(id, on) {
    var o = own();
    if (on) { o.rev[id] = stamp(); } else { delete o.rev[id]; }
    writeJSON(OWN, o);
  }
  function openBank(bank, start) {
    var its = bank.items;
    openPanel({
      title: bank.title, sub: its.length + " questions", label: bank.title, count: its.length, start: start,
      row: function (i) {
        return '<span class="n">' + (i + 1) + '</span><span class="vd ' + (isRevised(its[i].id) ? "vd-landed" : "vd-open") + '"></span><span class="tl">' + esc(its[i].short || its[i].q) + "</span>";
      },
      draw: function (i, pane, redrawRow) {
        var x = its[i];
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q", '<span class="ex-who">' + esc(bank.title) + ", " + (i + 1) + " of " + its.length + "</span>" + inl(x.q)));
        if (x.tests) { head.appendChild(el("p", "cv-verdict", "<b>They are testing:</b> " + inl(x.tests))); }
        var rv = el("button", "linkish cv-rev");
        function label() { rv.innerHTML = isRevised(x.id) ? '<span class="vd vd-landed"></span>Revised. Undo' : "Mark as revised"; }
        label();
        rv.addEventListener("click", function () { setRevised(x.id, !isRevised(x.id)); label(); redrawRow(); drawHubCounts(); });
        head.appendChild(el("p", "cv-tests")).appendChild(rv);
        pane.appendChild(head);
        var c = panelCols(pane, "Understand it", "What to say");
        panelSection(c.left, "The nuance", panelList(x.notes));
        panelSection(c.left, "Avoid", panelList(x.never, "mk-bad"));
        learn(c.left, x.learn || {});
        if (x.drill) { c.left.appendChild(el("p", "ex-links", '<a href="' + link("prep", "drill-" + x.drill) + '">Practise it aloud, timed</a>')); }
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.a && x.a.length) { c.right.appendChild(transcript(x.a, "You", "")); }
        if (x.meta) { c.right.appendChild(el("p", "cv-meta", esc(x.meta))); }
      }
    });
  }

  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    return { tab: tab, anchor: p[1] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = link(t.id);
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = [];
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "mocks") { tabMocks(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    drawTabs(r.tab); drawSide(r.tab); progress();
    var key = r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    var c = document.getElementById("count");
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
</html>
