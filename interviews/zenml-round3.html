ld case never moves under you.", "Cases fed by real production failures.", "Efficiency counted only over runs that pass."]}, {"title": "3. What I'd change if I rebuilt it today", "items": ["Instrument authoring time from day one: I can only estimate it (three to four hours a case, then under an hour).", "Version the base snapshot and pin each case to a version, failing loudly on a mismatch.", "Return an explicit 'not in this snapshot' error instead of an empty result, and keep harness-limited runs out of the headline number.", "Stamp every tool answer with how it was served: snapshot, not in snapshot, or live.", "Postgres template databases instead of SQLite, for the real engine and row-level security.", "Report pass^k on gating cases, not a single run."]}, {"title": "4. What breaks at 10x, then 100x, in the order it breaks", "items": ["**Authoring is the wall, and it's human.** At tens of cases it's an investment; at hundreds it's someone's job; at thousands it isn't done. It arrives before any technical limit.", "**Schema drift.** Every production migration can rot old snapshots; the cost is cases times migration rate.", "**Redaction becomes a security surface.** At tens a person checks each snapshot; at hundreds it's automated, and automated redaction is never complete. A growing store of near-production data.", "**One runner.** The nightly run stretches past the night; SQLite is single-writer; nothing runs in parallel across machines.", "**Cost of repeats.** Cases times k model calls; the temptation is to cut k exactly when variance matters most.", "**The shared ceiling:** multi-turn. Freezing the world fixes effects across turns, not a user who would have said something else."]}, {"title": "5. How I'd scale it", "items": ["**Storage:** an immutable base world per intent, and a copy-on-write fork per run: a Postgres template clone, or an event log of writes on top of the base. Checkpoint the world at each turn so a run can branch from turn N.", "**Authoring:** automate snapshot building from the scanner. Pull the same-intent instances, union the tools, reconcile entities (the three-Michaels renaming, generalised), and have a human review rather than build.", "**Execution:** runs become rows in a queue; workers claim with SKIP LOCKED under a lease; an index from tool to cases so a change runs only what it touches; cases run in parallel.", "**Drift:** the world is versioned against the schema; fixtures migrate with the same migrations, or pin and fail loudly.", "**Redaction:** automated, with synthetic replacement of identities, plus access control, audit and retention on the fixture store.", "**Cost:** k runs only for cases that flake or flip between versions; recorded model answers for an unchanged baseline."]}, {"title": "6. How I'd productionize it for other teams", "items": ["A case becomes a record, not a file: intent, world version, user turns, assertions, owner.", "A 'promote this failure' action straight from the scanner, so a production failure becomes a case in minutes.", "A gate in CI: the touched subset on every PR, the full bench nightly, a per-case diff a reviewer can read.", "Provenance on every answer, so a result says what was real.", "The metrics that say it's healthy: authoring time, flake rate, coverage by intent, judge agreement over time."]}, {"title": "7. The trade-offs to say out loud", "items": ["Expensive authoring for answers that hold up on new paths.", "Speed (SQLite) against fidelity (Postgres).", "Coverage against cost (k runs).", "Determinism against realism: model calls stay live, on purpose."]}, {"title": "8. Deep dives, if they go down", "items": ["**World storage.** A file per task, a template database, or a base plus an event log. Pick: template clones for fidelity now, an event log when you need cheap branching and a state diff to score.", "**Building worlds without experts.** Union the tools of same-intent sessions, reconcile entities, fill gaps synthetically but mark them synthetic, human review last.", "**Drift.** Version worlds against the schema and fail loudly on a mismatch; a test that measures the wrong thing silently is worse than one that refuses to run."]}], "a": ["I built it the way it is because of where we were. One product, a small team, and one question: is the new version of the agent actually better? So I froze the user's world rather than the transcript, a SQLite snapshot per task built from about twenty-five real instances, and I swapped the provider rather than the tool, because most of our bugs lived in the seam between what a tool returned and how the model read it.", "If I rebuilt it today, I'd keep that core. What I'd change is mostly honesty and fidelity: measure authoring time from day one, version the snapshots and pin each case to a version, return an explicit 'not in this snapshot' instead of an empty result, and stamp every answer with how it was served. And I'd use Postgres template databases instead of SQLite, so I'm testing on the real engine.", "The first thing that breaks at scale isn't technical, it's authoring. A good snapshot is expert work, and at hundreds of cases that becomes someone's job. Then schema drift starts rotting old snapshots, and redaction turns into a security problem, because you're holding more and more near-production data.", "To scale it, I'd make the world an immutable base with a copy-on-write fork per run, checkpointed at every turn so you can branch. I'd automate building the worlds from the scanner so a person reviews instead of builds. And runs become a queue with leases, where a change only runs the cases it touches.", "And to productionize it, a case becomes a record rather than a file, with a one-click 'promote this failure' from the scanner, a CI gate on the touched subset, and provenance on every answer. The number I'd watch is authoring time, because that's the wall."], "swaps": [{"when": "If they ask what breaks first", "line": "Authoring. Not the database, not the runner. A good snapshot is expert work, and it stops scaling long before the infrastructure does."}, {"when": "If they ask what you'd never change", "line": "Swapping the provider and not the tool. That seam is where the bugs were, so that's the part that has to stay real."}, {"when": "If they ask how you'd know it's working at scale", "line": "Authoring time going down, flake rate staying flat, coverage by intent going up, and the judge's agreement with people not drifting."}, {"when": "If they ask SQLite or Postgres", "line": "SQLite was right for one runner and a small team. For other teams, template databases on Postgres: real engine, real RLS, still cheap to clone per run."}], "land": "Keep the seam, fix the honesty, and scale the authoring, because authoring is the wall.", "notes": ["Tell it as a story in five beats: why, what I'd change, what breaks, how I'd scale, how I'd productionize.", "Say the order of breaking out loud; it's the insight most people miss."], "figs": ["harnessSeam", "kitaruScale", "sqliteTemplate", "skipLocked"], "id": "q-your-eval-harness-why-this-shape-what-would-you-change-what-", "learn": {"figs": ["harnessSeam", "kitaruScale", "sqliteTemplate", "skipLocked"], "read": [], "sdLinks": []}}, {"q": "If Kitaru moved toward your design, with stateful worlds, fakes and multi-turn runs, what would it need?", "short": "Design 2: Kitaru with worlds and multi-turn", "tests": "Can you design an evolution of their system, respect what exists, and name the trade-offs? This is their roadmap question.", "probes": ["What changes in the infrastructure?", "Where does the world come from?", "How do you keep import free?", "How do fakes stay honest?", "How does multi-turn work when the agent diverges?", "What are the trade-offs?", "What would you build first?"], "parts": [{"title": "1. Requirements: what changes, what doesn't", "items": ["**Keep:** import stays free, and the recorded path stays the default for every session.", "**Add:** a session can be promoted into a world; the agent can call tools off the recorded path and get coherent answers; writes persist across turns within a run; a user side can respond when the agent diverges.", "**Non-functional:** every answer carries how it was served (recorded, alias, world, live, simulated); a run is reproducible from a world version and seeds; the server still never runs user code."]}, {"title": "2. New entities", "items": ["**World:** an immutable base built from a session and its same-intent neighbours, versioned.", "**Run state:** a copy-on-write fork of the world per run, checkpointed per turn.", "**Fake:** for each tool, how the world answers it: a query over the world's tables, generic or user-written.", "**Simulated user:** goal, constraints, persona, stop conditions, and a calibration score.", "**Promotion task:** builds a world from recordings; runs on the worker, next to the customer's data."]}, {"title": "3. Infrastructure changes", "items": ["**The adapter gets a resolver chain** instead of one lookup: exact recording, then alias, then the world's fake, then the policy (fail or live). Every node is stamped with which one answered.", "**A world store:** a base per world in the customer's blob store or Postgres, cloned per run; an event log of writes so a run's final state can be diffed against a goal.", "**Fakes in the SDK:** generic fakes for the common tools (email, calendar, CRM, search), and a way for users to write their own as Python functions over the world. This is the biggest new product surface.", "**The turn loop moves into the worker:** replay recorded user turns while the agent stays equivalent; at real divergence, hand over to the simulated user.", "**Checkpoints reuse the durable-execution heritage:** checkpoint the world with the flow, so a run can branch from turn N.", "**Scoring:** final world state against a goal state, plus trajectory and policy, reported as pass^k."]}, {"title": "4. Trade-offs", "items": ["**Cost:** a world costs compute and review. Promote only the sessions someone forks.", "**Fidelity:** a fake answers coherently but can be wrong in ways a recording never is. Provenance has to show it.", "**Determinism:** a simulated user is a second model in the loop. Hold it fixed across baseline and fork, and calibrate it.", "**SDK surface:** fakes per tool are a lot to maintain. Start with generic fakes for the three most common tools.", "**Data governance:** worlds built from production data live longer than a trace. Keep them on the customer's side, with retention."]}, {"title": "5. Deep dive: building a world from recordings", "items": ["**Problem:** a session only contains the calls it made; the new agent will ask for others.", "**Options:** union the calls of same-intent sessions (my bench); synthesise neighbours with a model; let the customer supply fixtures.", "**Pick:** union and entity reconciliation first; synthetic fill only where needed, marked synthetic on every node it answers."]}, {"title": "6. Deep dive: keeping fakes honest", "items": ["**Problem:** a fake can drift from the real tool and nobody would notice.", "**Pick:** calibrate every fake against its own recording. Replay the recorded calls through the fake; if it disagrees with what the real tool returned, it isn't trusted. It's the same idea as calibrating a judge."]}, {"title": "7. Deep dive: multi-turn when the agent diverges", "items": ["**Options:** truncate at the first divergence (cheap, blind to what came after); a simulated user from the session's goal (a full counterfactual, two models); the hybrid.", "**Pick:** the hybrid. Replay recorded user turns while the agent's replies stay equivalent, and hand over to the simulator only at real divergence.", "**Calibration:** run the simulator against the unchanged baseline; if it can't reproduce what the real user said, its behaviour on the new agent isn't evidence.", "**Open question:** how to define 'equivalent' between two agent replies."]}, {"title": "8. Deep dive: state and branching", "items": ["An immutable base, and an event log of writes per run: cheap forks, a free state diff for scoring, and a branch from any turn's checkpoint.", "Concurrency stays per run, so the occurrence-counter problem goes away inside a world: the world answers by query, not by ordinal."]}, {"title": "9. What I'd build first", "items": ["Provenance on every node and the alias step in the resolver chain: small, and it builds trust.", "Then promotion of a forked session into a world with generic fakes for two or three tools, each calibrated against its recording.", "Then the multi-turn hybrid, with a calibrated simulator."]}], "a": ["I'd keep what Kitaru already does well: import stays free and the recorded path stays the default. The change is that a session someone actually forks can be promoted into a world.", "In the infrastructure, the adapter stops being one lookup and becomes a chain: the exact recording, then an alias, then the world, then the policy. And every answer gets stamped with which one it came from, because the moment you have fakes, provenance stops being nice to have.", "The world itself would be an immutable base built from that session and other sessions with the same intent, which is exactly what I did by hand at alfred_, with a copy-on-write fork per run. Kitaru already checkpoints flows, so checkpointing the world with them gives you branching from any turn almost for free.", "The hard part is keeping fakes honest. I'd calibrate every fake against its own recording: replay the recorded calls through it, and if it disagrees with what the real tool returned, it isn't trusted. Same idea for the simulated user: run it against the unchanged baseline, and only trust it if it reproduces what the real user said.", "The trade-off is cost and fidelity. Worlds are expensive and fakes can be wrong in new ways, so you only pay for the sessions people fork, and you never let a simulated answer look like a real one. I'd build provenance and aliases first, then promotion with a couple of generic fakes, then multi-turn."], "swaps": [{"when": "If they ask where the world comes from", "line": "From the session itself plus other sessions with the same intent: union the tools they used, reconcile the entities, and only fill gaps synthetically, marked as synthetic."}, {"when": "If they ask how to keep import free", "line": "Nothing changes on import. A world is only built when someone forks a session and it starts missing."}, {"when": "If they ask about the biggest risk", "line": "A fake that's confidently wrong. That's why every fake is checked against its own recording before it's trusted, and every answer says it came from a fake."}, {"when": "If they ask what you'd build first", "line": "Provenance and aliases. They're small, they help today's users, and everything after depends on a reader trusting where an answer came from."}], "land": "Import stays free; promote only forked sessions into worlds; calibrate every fake and simulator against the recording.", "notes": ["Ask it back as a question at the end: whether stateful worlds are on their roadmap or deliberately out of scope.", "Respect what exists: say what you would not change before what you would add."], "figs": ["kitaruFreeze", "forkReplay", "missFlow", "multiturn"], "id": "q-if-kitaru-moved-toward-your-design-with-stateful-worlds-fake", "learn": {"figs": ["kitaruFreeze", "forkReplay", "missFlow", "multiturn"], "read": [], "sdLinks": []}}]}], "ask": [], "ask3": [{"id": "clarify", "title": "Clarifying", "when": "During the interview, before you answer or design.", "why": "Design prompts are vague on purpose: they are watching whether requirements drive your solution. A good clarifying question names the decision it changes. It is also the rescue when you blank: in the mock, the miss question needed one.", "how": ["Ask one to three before you design, each tied to a decision: 'because it decides X'.", "If they say 'you decide', pick, say why in one line, and write the assumption down.", "Do not ask what you can reason out yourself; that reads as stalling.", "Mid-answer, check the depth once: it keeps a long answer pointed at what they care about."], "items": [{"to": "Either", "q": "Are we reproducing a known failure, or testing a change?", "loop": "'Before I sketch, one question, because the design splits here: ...'", "why": "Replay for debugging and replay for evaluation freeze different things."}, {"to": "Either", "q": "Who is the user of this screen: the engineer who wrote the agent, or someone reviewing results?", "loop": "Use it the moment a question turns to UX: 'Let me start with who is looking at it.'", "why": "It turns 'what should the screen show' into something concrete. It is exactly where the mock went quiet."}, {"to": "Either", "q": "How big: a few dozen sessions, or a cohort of thousands?", "loop": "'Rough scale first, because it changes the answer: ...'", "why": "Scale decides between a world snapshot and a recorded call log."}, {"to": "Either", "q": "Can a replay reach production in this scenario, or is every effect behind the adapter?", "loop": "Before any side-effect answer: 'Is the tool's effect real here?'", "why": "Side-effect policy depends on it, and it shows you think about provenance first."}, {"to": "Either", "q": "Do you mean how it works today, or how I'd change it?", "loop": "When a question could be either: 'Today's version first, or where I'd take it?'", "why": "Clarifying the question itself saves a wrong three-minute answer."}, {"to": "Either", "q": "Is this the depth you want, or shall I go down on the storage?", "loop": "Once, about a minute into a long answer.", "why": "It hands them the steering wheel; interviewers take it gladly."}]}, {"id": "contribute", "title": "Contributing", "when": "At the end, first. About their problems and how you would add to them.", "why": "What you ask shows your preparation and judgement as much as your answers. Questions about success and their hard problems show you are thinking about impact, and the answer tells you whether the role has a concrete plan behind it.", "how": ["Ask about their hardest problem, not their perks.", "Bridge from something they said earlier: 'You mentioned X...'", "Listen fully. Then add one line from alfred_ if it helps, never a pitch: 'We hit a version of that; happy to share how it went.'", "One question, then wait. Two or three contributing questions at most."], "items": [{"to": "Hamza", "q": "What would you want someone in this seat to have shipped by the end of the first month?", "loop": "Lead with it: 'To picture the role concretely: ...'", "why": "Success in ninety days, made specific to a small team. Their answer is your first-month plan."}, {"to": "Hamza", "q": "Where do you see Kitaru against observability tools long term: is replay the wedge, or the product?", "loop": "After they describe the product or a customer: 'That makes me curious about the bigger picture: ...'", "why": "Strategy, asked as curiosity. Founders enjoy this one."}, {"to": "Alex", "q": "What's been the hardest thing to get right in the replay path?", "loop": "'You've seen more replays than anyone: ...'", "why": "It invites him to teach, and his answer is where you would start."}, {"to": "Either", "q": "When a forked replay misses for early users, is that the main support conversation, or a rare edge?", "loop": "If the miss came up earlier: 'Coming back to misses: ...'", "why": "It tests your own critique against their data, without calling it a bug."}, {"to": "Either", "q": "When an unchanged replay diverges because the model sampled differently, what do you show the user?", "loop": "After any talk of nondeterminism or cost.", "why": "It names a real open problem and shows you have read the product closely."}, {"to": "Hamza", "q": "Deciding which production behaviours become durable eval cases was the hard part for us. How are you thinking about that for Kitaru users?", "loop": "Best right after your bench story lands.", "why": "It turns your experience into their roadmap question."}]}, {"id": "collaborate", "title": "Collaborating", "when": "At the end, after contributing. How you would work together.", "why": "How a team designs, reviews and decides tells you whether you would thrive, and asking shows you already think like a teammate. Ask about real practice, not a description of the culture.", "how": ["Ask for a recent example rather than a policy: 'the last time...'", "Tie each to something from the job post you care about, without quoting it.", "Match the question to the person: Hamza on how decisions get made, Alex on how the work gets done."], "items": [{"to": "Hamza", "q": "How does a user's problem become shipped work here? Does a Slack thread go straight to a PR, or is there a planning step between?", "loop": "'I'm curious how the loop actually runs day to day: ...'", "why": "It checks the 'PRs, not tickets' pace they promise, and shows you want it."}, {"to": "Hamza", "q": "How does the public side work in practice? Who writes, and how would a product engineer's posts fit with developer relations?", "loop": "After the building-in-public question: 'On that, how does it work in practice: ...'", "why": "It shows you take the public half seriously and want to do it with the team, not alone."}, {"to": "Alex", "q": "What have you learned from early users about the first ten minutes, and what did the guided tour change?", "loop": "'Since you built the guided tour: ...'", "why": "It is his work; you would be collaborating on it from week one."}, {"to": "Alex", "q": "How do you review code here, especially agent-written code? What counts as blocking versus a nit?", "loop": "After talking about how you use coding agents.", "why": "Code review shows how a team gives feedback in general."}, {"to": "Hamza", "q": "The last time the team disagreed about what to ship, how did it get decided?", "loop": "Only if there is time; it is the most personal one.", "why": "It shows you care how decisions get made, and tells you how it would feel to disagree."}]}], "traps": [["Leading with history", "Headline first: the real agent against a frozen snapshot of the user's world, only the provider call swapped."], ["Dodging the authoring-cost question", "Say it's an estimate, then the number, then the basis."], ["Praising Kitaru when asked what's wrong", "Provenance, then time. If stuck, 'give me a second'."], ["Two questions in one breath", "One at a time, name the thing, then wait."], ["Vague numbers", "5,000+ users, 12 classes, about 3 in 4, 100+ cases, 25 to 30 minutes nightly, 90 to 3 seconds."], ["Going sideways when pushed", "Add a detail about the same system, not a second system."], ["Defending SQLite", "Name the fidelity gap, then CREATE DATABASE ... TEMPLATE."], ["Calling their gaps bugs", "Ask as questions; they maintain the code."], ["Citing their PRs or commits", "Never. Ask a normal question and let them bring it up."], ["Funding, crunch, internal version names, colleagues' names", "Never."], ["Running long", "At minute 70 of 90, hand them your questions."]], "tables": [{"title": "Tool policies", "note": "Resolution is by exact tool name, then the default.", "head": ["Policy", "What it does"], "rows": [["passthrough", "Runs the real tool. The default when no policy is set."], ["history", "The recorded result, by cache key, within a scope."], ["static", "Ordered cases, first match wins; exact or subset matching."], ["llm", "Modelled in the API; rejected at runtime by the PydanticAI adapter."]]}, {"title": "on_miss", "note": "Three values, and every one is a bad escape for an improved agent.", "head": ["Value", "What happens"], "rows": [["fail", "Raises; the node is recorded failed and the whole replay dies."], ["error_result", "The model gets a literal error and keeps running: you grade recovery from an error you invented."], ["passthrough", "Calls the real tool; the node carries no mocked attribute. The silent fidelity hole."]]}, {"title": "The cache key", "note": "sha256(tool_name + a null byte + canonical JSON: sorted keys, compact separators, allow_nan false). No fuzzy or subset matching on history.", "head": ["Change to the arguments", "Matches?"], "rows": [["Key order, JSON formatting", "Yes"], ["Whitespace inside a string", "No"], ["1 against 1.0, true against 1", "No"], ["NaN, infinity, unserialisable", "No key at all: straight to on_miss, no diagnostic"], ["Non-ASCII", "Within one adapter language only"]]}, {"title": "Repeated calls flip with scope", "note": "Ask about the concurrency point as a question: the counter is read, the lookup awaited, then the counter written.", "head": ["Scope", "Behaviour"], "rows": [["baseline", "The nth recorded node, ordered by started_at: ordered consumption, from completed and failed nodes."], ["agent, cohort version", "The latest completed node, the same one every time."]]}, {"title": "What always runs live", "note": "", "head": ["Thing", "Why it matters"], "rows": [["Model calls", "Every replay is billed and nondeterministic, even unchanged."], ["Anything outside a registered tool", "A bare HTTP call reaches production."], ["Provider-native tools", "Recorded but never checked against policy."], ["Earlier turns' tool calls", "Dropped: only the final turn re-executes."]]}, {"title": "Claims against the source", "note": "", "head": ["Claim", "Reality"], "rows": [["Replays never touch production", "The default policy is passthrough, and so is one on_miss value."], ["No card gets refunded twice", "True for registered function tools; native tools bypass."], ["Compare distributions across runs", "No repeat-count or aggregation exists."], ["Multi-turn replays faithfully", "Final turn only; earlier tool activity stripped."], ["No user code runs on the server", "Accurate."]]}], "admire": "The selector design is the bit I keep thinking about: storing a JSON path into the payload instead of copying text out, so a human judgement, an evaluator verdict and the UI all point at the same coordinates. I hand-rolled a worse version.", "kitaruLead": "Kitaru spawns your agent as an ordinary subprocess in your own environment, and an in-process adapter intercepts the agent framework's tool-execution hook, answering each tool call by a SHA-256 lookup against a recorded call log. The diagrams are from your teardown; the tables are the mechanisms they will probe.", "figures": ["kitaruPlanes", "kitaruReplay", "kitaruModel", "kitaruPolicy", "kitaruKey", "kitaruOrder", "kitaruTurns", "kitaruLive", "kitaruFreeze", "kitaruScale", "kitaruPosition"], "mockHow": "Full mocks run in the Claude Code chat. Say **'run the ZenML mock, 25 minutes'**. Hamza leads on your story, why this move and judgement; Alex goes down on mechanism and what the user sees. Each mock below starts with the read. Open the conversation to see every turn in one screen: the turns on the left, and for the one you pick, what they asked and how it landed, what you said, and what to say. Every gap also sits on the Prep tab.", "mocks": [{"id": "m1", "title": "Mock 1: Hamza and Alex", "when": "Sunday 27 September 2026, 10:12 to 10:38, 26 minutes", "read": ["The bench came across as real work: one snapshot per task, users merged into it with duplicate people renamed, the harness flag that swaps only the provider call. Alex said he wanted to think about it more, which is the reaction you want.", "It went wrong in two places. When they pushed on the empty result, you defended it instead of naming it as a gap, and that is the same provenance problem you plan to criticise in Kitaru. Then the design question on misses collapsed, although the answer is already on your Prep tab. Both are fixable by tomorrow: say the limit first, and when lost, go to what the user sees and clicks."], "landed": ["How the bench works, from the ground up, with a concrete example task.", "Honesty about the completeness judge: no calibration yet.", "Two numbers in the end: completion and completeness against ground truth you hold."], "fix": [{"t": "When you are lost on a design question, go to the smallest concrete thing: what the user sees, what they click, what changes next time.", "ref": "x7"}, {"t": "Name the limit before they do. An empty result is the harness inventing a fact.", "ref": "x3"}, {"t": "Lead with the numbers and one worked example; it took three turns to get concrete on the metric.", "ref": "x4"}, {"t": "Keep the two judges apart: the scanner's judge is calibrated, the completeness judge is not.", "ref": "x6"}, {"t": "Intro in 45 seconds: what you own, one number, the bench headline.", "ref": "x1"}], "exchanges": [{"id": "x1", "label": "What you own", "who": "Hamza", "q": "Tell us what you're working on right now at alfred_, and what part of it you actually own.", "tests": "Is the ownership real, and can you say it in under a minute?", "said": ["Founding engineer; making the agent reliable in production through eval infrastructure, memory and orchestration. 5,000-plus subscribers. A long account of working memory: one data model for work items that email, Slack and meeting notes reconcile into. Then the whole bench: scanner, calibrated judge, similar tasks across users, one SQLite snapshot per task, the harness flag."], "verdict": "partly", "why": "The content was right and specific, but it ran over three minutes with filler, and the bench detail arrived before they asked for it.", "good": ["Concrete ownership: eval, memory, orchestration.", "A real number: 5,000-plus subscribers.", "Working memory explained through your own project, a good hook for later."], "bad": ["Over three minutes; the first answer sets the pace for ninety.", "Filler: 'so to say', 'essentially', 'in a lot of degree'.", "You spent the bench story on the opener, so later answers repeated it."], "approach": ["Three sentences: what alfred_ is with one number, what you own, the one piece most relevant to them. Then stop and let them choose where to go.", "Offer the depth as a choice: 'I can go into the eval bench or the memory work, whichever is more useful.'"], "say": ["I'm a founding engineer at alfred_, an AI executive assistant over email, calendar and work apps, with 5,000-plus active users. I own making the agent reliable in production: the eval infrastructure, the memory architecture, and the orchestration underneath.", "Right now it's working memory: one model for every open work item, which email, Slack and meeting notes all reconcile into, so the agent can answer 'what's open today' from one place.", "The part closest to Kitaru is the eval bench I built: real production failures replayed against new agent versions, with tools answered from a snapshot of the user's world. Happy to go into either."], "ref": "#say-intro", "land": "Three sentences: what alfred_ is with one number, what you own, and the one piece closest to their work. Then stop."}, {"id": "x2", "label": "What pass through means", "who": "Alex", "q": "You said that if the agent calls a tool that isn't in the snapshot, you send an error or a pass through. What does pass through mean in your harness? Does that call hit Gmail for real, and how would you know afterwards?", "tests": "Provenance. Can a reader of your results tell recorded from live, or invented?", "said": ["It never leaves the machine. The agent gets an empty result back, with an indication that it's the wrong tool; those calls are marked so the snapshot can be enriched."], "verdict": "partly", "why": "'Never leaves the machine' is the right first sentence. The empty result is the problem, and you described it as a feature.", "good": ["Clear that nothing reaches a live provider.", "You mark out-of-snapshot calls, which is the start of provenance."], "bad": ["Earlier you said 'error or pass through', here 'empty result with an indication', later 'no error, just null'. Three versions of one behaviour.", "An empty result is a plausible answer, so the agent can act on it as a fact."], "approach": ["Answer the literal question first: no, it cannot reach Gmail, because the harness flag routes every provider call to the snapshot.", "Then volunteer the limit in the same breath: 'what the agent gets back is the weak spot.' Interviewers push hardest on what you defend and ease off what you name."], "say": ["It never leaves the machine. With the harness flag on, every provider call goes to the snapshot, so there is no path to Gmail at all.", "What the agent gets back is the weak spot, honestly. Today a call outside the snapshot returns an empty result, and every such call is logged against the run. An empty result is a plausible answer, though. The agent can read it as 'there are no meeting notes', which is the harness telling it something false.", "What I'd do instead: return an explicit 'not in this snapshot' error the agent can't mistake for data, and treat any run that hit one as harness-limited, not as a pass or a fail."], "figs": ["harnessSeam"], "land": "It cannot reach Gmail. What it gets back is the weak spot, and I'd make that an explicit error."}, {"id": "x3", "label": "The empty result is a lie", "who": "Hamza", "q": "In production there probably were notes, so the harness taught the agent something false and it acted reasonably on it. How does your scoring tell 'the agent made a bad call' from 'the agent made a good call on a lie the harness told it'?", "tests": "Do you own your harness's failure modes, or defend them?", "said": ["Out-of-snapshot calls are marked. With rich enough aggregation it rarely happens; I haven't seen it. The north star is tool calls per completed task, and irrelevant calls add latency."], "verdict": "missed", "why": "You answered a different question (how often), then moved to the metric. 'I haven't seen it' reads as 'I never looked', which is the opposite of the signal you want.", "good": ["You do mark the calls, which is the raw material for a real answer."], "bad": ["'I have not seen it': rare is not the same as measured.", "Went sideways to the north-star metric instead of down into the scoring.", "Missed the chance to connect it to Kitaru's provenance gap, the critique you plan to make."], "approach": ["Agree with the premise out loud: 'you're right, those two runs look identical in the output.'", "Then the mechanism: mark the node, keep marked runs out of the headline number, and look at them separately.", "Close by tying it to their world: it's the same problem as a passthrough node without a mocked mark. That turns a weakness into your strongest critique."], "say": ["You're right, in the output those two runs look identical, and today my metric can't tell them apart on its own.", "What I have is the mark: every call outside the snapshot is logged against the run. The fix I'd make is to use it in scoring. A run that touched an out-of-snapshot call is harness-limited, so it's excluded from the headline number and goes to a separate list, and that list is the backlog for enriching the snapshot.", "It's the same problem as a passthrough node in Kitaru that carries no mocked mark: a reader can't tell a recorded answer from an invented or live one. In both systems every answer should carry how it was served."], "figs": ["kitaruPolicy"], "prep": "A tool the snapshot doesn't cover", "land": "Those runs look identical today. Marked runs leave the headline number, and it's Kitaru's provenance gap in my own harness.", "prepId": "q-a-tool-the-snapshot-doesn-t-cover-what-does-the-agent-get-ba"}, {"id": "x4", "label": "What counts as done", "who": "Hamza", "q": "An agent that gets your empty set and wraps up confidently has used fewer calls, so on your metric it looks more efficient. Who decides 'completed'? An assertion against the snapshot, a judge, something else? Be concrete.", "tests": "Is your headline metric gameable, and do you know how?", "said": ["Completion means the task was done: the email found and the todo list created. Failed runs are a separate class that is tracked."], "verdict": "partly", "why": "True but generic. He asked for the mechanism and got the definition, so it took another question to reach the real answer.", "good": ["Failed runs are counted separately, not averaged in."], "bad": ["No mechanism: who or what decides 'done'.", "Did not say that calls per task is only computed over runs that pass, the one fact that answers his worry."], "approach": ["When told 'be concrete', give one worked example with the check named: which rows the assertion reads, what it expects.", "Then show you know the metric's blind spot and what sits next to it.", "Structure behind it: requirements, what is frozen, how it runs, how it is scored. Outcome and final state come before trajectory."], "say": ["Deterministic assertions against the snapshot decide it. For 'make a todo list from this email', the snapshot knows which email is the right one and what its action items are, so the run passes if the agent read that email and the created tasks match those items.", "More generally, pass or fail is the final state against a goal state, not the path: two runs can take different routes to the same right result, and both pass. The path is scored separately.", "Tool calls per completed task is only computed over runs that pass those assertions, so an agent that wraps up early on an empty result doesn't get a better number, it gets a failed run. We moved 2.5 to 2.2 on that metric for the same outcomes.", "On its own it would reward guessing over clarifying, which is why it sits next to a count of false completion claims."], "figs": ["completeness"], "prep": "What makes a run count as done", "land": "Assertions against the snapshot decide done, and the efficiency metric only counts runs that pass.", "prepId": "q-what-makes-a-run-count-as-done-and-how-is-it-scored"}, {"id": "x5", "label": "Four items, three created", "who": "Alex", "q": "The email has four action items. The agent creates a todo list with three. Pass or fail, and what piece of code or which model makes that call?", "tests": "Completeness, and whether you have the refunds lesson ready.", "said": ["A pass for the completion metric. Ground truth per instance is known, so completeness is a second, orthogonal score, and three of four is measured there. Judging has moved to Claude Code."], "verdict": "partly", "why": "The two-score design is right. But 'pass' for a todo list missing an item is the refunds bug you already fixed, and you didn't use that story.", "good": ["Ground truth held per instance: the strongest part of your design.", "Separating completion from completeness."], "bad": ["Called it a pass; for an enumerable answer, a missing item should fail the assertion.", "Didn't reach for the refunds story, which is exactly this case with a real outcome.", "Said the judge is Claude Code without saying which parts are assertions and which are judged."], "approach": ["Decide first: enumerable or not. Four action items is a set you can count, so it is an assertion, not a judgement.", "Then the story that proves you learned it the hard way: the ledger that left out two refunds."], "say": ["It fails, and code decides it, not a model. Action items are enumerable: the snapshot knows there are four, so the case asserts that all four appear. Three of four is a fail on that assertion, and a 0.75 on the completeness score we track across the bench.", "We learned that the hard way. A ledger request produced a clean, well-formed ledger that left out two refunds, and every surface check passed. After that, anything enumerable from the fixture is asserted against it.", "A model only judges what can't be counted, like whether a meeting brief is useful, and those cases stay out of automated gating."], "figs": ["completeness"], "ref": "#say-refunds", "prep": "What makes a run count as done", "land": "Enumerable means asserted: three of four fails, and the refunds bug is why.", "prepId": "q-what-makes-a-run-count-as-done-and-how-is-it-scored"}, {"id": "x6", "label": "Did the judge move?", "who": "Alex", "q": "Claude Code judging on Tuesday and Claude Code judging on Friday won't always agree. How do you know the judge didn't move when your pass rate moves?", "tests": "Is the judge measured, or trusted?", "said": ["No calibration yet for the completeness judge; the harness is local and it's my gut. Ground truth stays fixed. The bench reruns on tool, agent or subtask changes, and the reconciler appends new production cases."], "verdict": "partly", "why": "The honesty landed. But in your intro you said the judge was calibrated, so without naming two judges it sounded like a contradiction.", "good": ["'No calibration yet, it's my gut' is exactly the kind of limit they respect.", "Ground truth fixed across runs."], "bad": ["Two judges, one word: the scanner's judge is calibrated, the completeness judge is not. Say which.", "No concrete way to detect drift, and there is a cheap one."], "approach": ["Separate the two judges in your first sentence.", "Then one mechanism that detects judge drift without new labels: re-judge frozen outputs.", "Add pass^k when they push on noise: for a gating case, report whether it passes every time in k runs, not once."], "say": ["There are two judges, and they're in different states. The scanner's judge, which decides whether a production flag is a real bug, is calibrated: weekly against fresh human labels, about three in four agreement.", "The completeness judge on the bench isn't calibrated yet. Where the answer is enumerable I've replaced it with assertions, so it only judges what can't be counted.", "To tell judge drift from agent change I'd keep a frozen set of past outputs and re-judge it whenever the judge's model or prompt changes. The outputs didn't change, so if the verdicts moved, the judge moved. And the judge's model and prompt are pinned per bench run."], "figs": ["passk"], "prep": "How do you decide what becomes an eval case", "land": "Two judges: the scanner's is calibrated, the completeness one is not yet. Re-judge frozen outputs to catch drift.", "prepId": "q-how-do-you-decide-what-becomes-an-eval-case-and-is-the-judge"}, {"id": "x7", "label": "A better prompt misses everything", "who": "Hamza", "q": "A customer imports a few hundred Langfuse traces, improves the system prompt, and the agent now searches the CRM with a cleaner query. Every search misses the recording; with on_miss set to fail, half the cohort dies. 'Your tool punishes me for improving my agent.' What do we build?", "tests": "Product judgement on their central problem. They argue about this internally.", "said": ["A fake or mock world, maybe a simulated user, but I'd rather not go into that. A read-tool policy that executes against the user's environment if they provide one. Not exactly sure."], "verdict": "gap", "why": "You jumped to the biggest idea, simulation, and backed away from it. The answer was on your Prep tab.", "good": ["Splitting reads from writes is the right instinct; it just came out as an afterthought."], "bad": ["Started with the hardest option and then declined to discuss it.", "No order: what first, what next, what last.", "'Not exactly sure' before trying the smallest version."], "approach": ["Say the reframe first: a miss is information, the agent's behaviour changed. That buys you ten seconds and shows judgement.", "Then build up in order of cost: the miss experience (diff and accept), then policy by effect (reads, writes), then the world model for the few sessions that fork.", "If you blank, say 'let me start with what the user sees' and describe the screen.", "Say what you would not rebuild: the runner, the sandbox and the replay layer work. Your value is the layer above: production traces into cases, stateful environments, outcome and policy scoring."], "say": ["First, a miss is information: it means the agent's behaviour changed, which is what they were measuring. So the goal isn't to avoid misses, it's to stop a miss from killing the run and make it cheap to resolve.", "The first thing I'd build is the miss experience. Show the recorded call next to what the new agent sent. If they're equivalent, one action accepts it and writes a static alias, so the next replay hits. It's deterministic and auditable, and every accepted pair is labelled data for matching later.", "Second, policy by effect. A read that misses can fall through to the customer's own environment, marked live on the node. A write that misses fails closed on a fork, never passthrough.", "And the honest limit: that fixes rephrasing, not an agent that takes a different path. For those few sessions, promote the trace into a small queryable world, which is what my bench does. The common case stays free."], "figs": ["missFlow", "kitaruKey"], "ref": "#say-miss", "prep": "A better prompt misses every recording", "land": "A miss is information. Make it cheap to resolve, then split reads from writes, then a world for the few sessions that fork.", "prepId": "say-miss"}, {"id": "x8", "label": "What the screen shows", "who": "Alex", "q": "Forget the perfect system. Tomorrow morning the customer sees half the runs died. What should that screen show them, so the miss is useful instead of a red X?", "tests": "Can you think like the user, concretely?", "said": ["The recorded call against what the agent did. Then last-turn replay, a stateful world across turns, a simulated user. Not really sure."], "verdict": "gap", "why": "Your first sentence was the answer. Then you recited the multi-turn options, which were answering a different question.", "good": ["'The recorded call against what the agent did' is exactly right."], "bad": ["Kept talking after the right answer, into material from another question.", "Nothing about what the user can do on that screen."], "approach": ["When your first sentence is right, stop and build on it: what is on the screen, what can they do there.", "Think of one row per miss, grouped, because a few hundred red rows is not usable."], "say": ["The misses grouped by tool, with a count, so they see '140 misses on search_crm' rather than 140 red rows.", "Open one and it's a diff: the recorded arguments next to what the new agent sent, the recorded result under it, and where in the session it happened.", "And on that row, the actions: accept as equivalent, which maps the new arguments to the recorded result; run this one call live, marked as live; or leave it failed. Accept applies to the whole group, so one decision clears the 140."], "figs": ["missFlow"], "land": "Misses grouped by tool, the recorded call next to what the agent sent, and the actions on that row."}, {"id": "x9", "label": "Which button", "who": "Hamza", "q": "The customer looks at the diff and says 'yes, those are the same search, just phrased better.' What button do they press, and what does it change for the next replay?", "tests": "Can you land a design all the way down to data?", "said": ["It would play out, but I'm not really sure and a bit lost."], "verdict": "gap", "why": "This is the static alias, the last step of your own miss script.", "good": [], "bad": ["No attempt at the mechanism. Even a rough one ('we remember the mapping') beats 'I'm lost'."], "approach": ["Name the button, then the data it writes, then what the next replay does with it. Three sentences.", "If you blank, buy time honestly: 'give me a second', then start from 'the next replay needs to hit, so something has to map the new call to the old result.'"], "say": ["'Accept as equivalent.' It writes a static alias for that tool: these new arguments map to that recorded call's result, scoped to this cohort.", "On the next replay the lookup checks the alias before it misses, so those calls hit, and the node is stamped 'served by alias' so nobody mistakes it for an exact match.", "And every accepted pair is a labelled example of 'different arguments, same meaning', which is what you'd need to train or tune fuzzy matching later, and test it in shadow first."], "figs": ["missFlow"], "prep": "The customer says the two searches are the same", "land": "Accept writes a static alias; the next replay hits, and the node says it was served by alias.", "prepId": "q-the-customer-says-the-two-searches-are-the-same-what-button-"}, {"id": "x10", "label": "Your questions for them", "who": "Hamza", "q": "Before we let you go, what questions do you have for us?", "tests": "Curiosity, and whether you've thought about their business.", "said": ["I'd love to understand the product more, and what you need from a product engineer specifically."], "verdict": "partly", "why": "A fine question, but generic. You have eight prepared ones that show you've read the product.", "good": ["Asking about the role itself is reasonable."], "bad": ["It could be asked of any company.", "Only one question. Ask one, listen, then one more."], "approach": ["Lead with the one that shows you read the source, then one about the role.", "One at a time, then wait."], "say": ["Where do you see Kitaru sitting against observability tools long term: is replay the wedge, or the product?", "And for the role: what would you want someone in this seat to have shipped by the end of the first month?"], "ref": "#ask", "land": "One question that shows you read the product, then one about the role. One at a time."}]}], "planKicker": "Friday to Sunday", "mechTitle": "Kitaru, mechanism by mechanism", "designLink": {"text": "The worked design, six steps and five deep dives:", "label": "Kitaru in your system design guide", "href": "../SYSTEM%20DESIGN.html#/designs/kitaru"}, "extra": "", "emphasis": ["frozen snapshot of the user's world", "only the call out to", "Only the provider call is swapped", "the only thing swapped", "harness mode", "harness flag", "SQLite snapshot", "twelve failure types", "three out of four", "a little over a hundred cases", "twenty-five real instances", "three people named Michael", "path it never took", "tool calls per completed task", "multi-turn orchestration", "append-only", "ground truth", "pinning an expected answer", "freezing a world rather than a transcript", "freezes the transcript", "froze the world", "fail in opposite directions", "promoted into a small queryable world", "a miss is information", "static alias", "shadow", "stamped on the node", "provenance", "the agent's clock isn't", "anti-fabrication", "tool-execution record", "tool-execution ledger", "at-least-once", "idempotent", "exactly-once", "FOR UPDATE SKIP LOCKED", "CREATE DATABASE ... TEMPLATE", "backstop", "SECURITY DEFINER", "PUBLIC", "row-level security", "fidelity", "execution truth", "a framework, a runtime for stateful agents, and the observability-and-eval product", "our own tables in Supabase Postgres", "divergence", "I never instrumented it", "estimate", "5,000-plus", "WheelPrice", "INFORMS Analytics+", "MockFlow-AI", "MetaRAG", "not looking to urgently leave", "Three doors, one brain", "no send path", "three layers", "byte-identical", "effects ledger", "fail closed", "no side door", "Volunteer the limit"], "own": {"tab": "alfred_", "kicker": "The system you own", "title": "alfred_, fresh in your head", "lead": ["They will ask about your day-to-day, and every Kitaru question has an alfred_ answer next to it. Two loops share one tool layer: an agent the user talks to over SMS, web and MCP, and a background pipeline that acts on mail alone and never sends.", "Open one part at a time: the point, the figure, then say it before you open the answer."], "parts": [{"id": "doors", "title": "Three doors, one brain, one tool package", "meta": "about 45 seconds", "point": "SMS, web and MCP converge on packages/tools; the pipeline is its own row; everything is one Supabase project.", "figs": ["alfredHld"], "sd": [{"v": "alfred", "a": "hld", "why": "The full high-level design, 23 boxes."}], "say": ["Three doors, one brain, one tool package. SMS goes through a webhook and a job queue because the reply can take longer than a webhook should. Web streams directly. MCP runs single tools as the user, behind an allowlist.", "The background pipeline is a separate row: ingestion stages mail, triage decides, the executor and the worker act, notify tells the user, and a reconciler checks the provider afterwards.", "Everything is one Supabase project: Postgres with row-level security, pg_cron for schedules, pgmq for the event bus, and Deno edge functions for compute. That is a deliberate choice for a small team; the trade-off is that one database carries every workload."], "learn": {"figs": ["alfredHld"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/hld", "label": "alfred_, high-level design", "why": "The full high-level design, 23 boxes."}]}}, {"id": "turn", "title": "One chat turn, in layer order", "meta": "about 40 seconds", "point": "Acknowledge fast, then lease, trace, prompt, loop, guard, reply. The layer order is the senior signal.", "figs": ["alfredTurn"], "sd": [{"v": "alfred", "a": "dataflow", "why": "The turn and the pipeline, step by step."}], "say": ["For chat: acknowledge the webhook, enqueue a job, and let the turn function take a lease on the conversation, open a trace, build a cached prompt, run a bounded loop where every tool call goes through the wrapper stack, then filter tone and send.", "Retries come from three places, so I need three layers: dedupe the webhook, lease the conversation, and key every write. A lock in memory would guard nothing across a provider call."], "learn": {"figs": ["alfredTurn"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/dataflow", "label": "alfred_, data flow", "why": "The turn and the pipeline, step by step."}]}}, {"id": "wrap", "title": "What one tool call passes through", "meta": "about 30 seconds", "point": "No surface calls execute(). One wrapper stack decides preview, confirmation and replay from what the tool declares; Kitaru's hook sits at the same seam.", "figs": ["alfredWrap"], "sd": [{"v": "alfred", "a": "deepdives", "why": "Action safety without a risk score."}], "say": ["I do not gate on a risk score. Every tool declares what class of side effect it has, and one wrapper stack around every call decides whether it previews, confirms, or replays. On top of that, the background executor has no send path at all.", "It is the same seam Kitaru's adapter hooks. We execute there; Kitaru answers from the recording there. The difference is that every write we have goes through it, so there is no side door."], "learn": {"figs": ["alfredWrap"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/deepdives", "label": "alfred_, deep dives", "why": "Action safety without a risk score."}]}}, {"id": "pipe", "title": "The pipeline acts on mail, and never sends", "meta": "about 40 seconds", "point": "Nine steps, two model calls, and only one function that sends, after approval.", "figs": ["alfredPipe"], "sd": [{"v": "alfred", "a": "dataflow", "why": "The nine steps, tagged code or model."}], "say": ["This is a pipeline, so I will list the steps and mark which ones are model calls. Nine steps, two model calls: triage and drafting. Everything that touches the provider is code.", "Silent actions are archive, label, move. Drafts wait for the user. Sending is a separate function that only runs after approval, and a reconciler verifies every silent effect against the provider afterwards."], "learn": {"figs": ["alfredPipe"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/dataflow", "label": "alfred_, data flow", "why": "The nine steps, tagged code or model."}]}}, {"id": "cost", "title": "Cost is a cache layout", "meta": "about 30 seconds", "point": "The shared prefix is about 107k tokens a call, so Block 1 is byte-identical for every user and cached for an hour.", "figs": [], "sd": [{"v": "alfred", "a": "deepdives", "why": "The cost dive, with the measured hit rates."}], "say": ["Cost is a cache layout problem. The shared prefix is about a hundred thousand tokens, so it has to be byte-identical across users and cached for an hour, with the per-user part in its own slot.", "Measured on the first model call of each turn: 91.4% cached inside five minutes, 62% outside it. A test guards the byte-identical block, because one formatter change broke it on main."], "learn": {"figs": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/deepdives", "label": "alfred_, deep dives", "why": "The cost dive, with the measured hit rates."}]}}, {"id": "quality", "title": "Production failures become eval cases", "meta": "about 30 seconds", "point": "The scanner turns real failing turns into cases, and the effects ledger, not the reply text, decides whether an action happened.", "figs": ["benchLoop"], "sd": [{"v": "alfred", "a": "deepdives", "why": "The quality-gate dive."}], "say": ["For quality, real failing turns get scanned, classified, and promoted into the eval suite, so the regression set is what users actually do.", "Two rules a whiteboard design forgets: a refusal is not an outcome, so check the retry; and the effects ledger, not the assistant's text, decides whether an action happened."], "learn": {"figs": ["benchLoop"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/deepdives", "label": "alfred_, deep dives", "why": "The quality-gate dive."}]}}, {"id": "ceiling", "title": "The honest ceiling: one Postgres", "meta": "about 20 seconds", "point": "Volunteer the limit before they find it, with the signal that would make you split it.", "figs": [], "sd": [{"v": "alfred", "a": "deepdives", "why": "One Postgres for everything."}], "say": ["It is one Postgres. That is right for this team size, isolated in the schema: partitioned event tables, partial indexes on hot statuses, SKIP LOCKED consumers.", "The day chat latency moves with triage batch size is the day the pipeline gets its own instance."], "learn": {"figs": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/deepdives", "label": "alfred_, deep dives", "why": "One Postgres for everything."}]}}], "numbers": [["Edge functions", "about 370 Deno functions, about 250 cron registrations, one Postgres"], ["Chat volume", "about 310 turns a day fleet-wide, one every 4.6 minutes"], ["Prompt prefix", "about 107k cacheable tokens a call; 4 blocks, 3 cache breakpoints"], ["Cache hit", "91.4% inside 5 minutes at $0.38 per Mtok; 62% outside it at $1.04"], ["Agent loop", "at most 12 steps a turn"], ["Pipeline", "9 steps, 2 model calls, 1 send path"], ["Accounts", "up to six Gmail, Outlook or IMAP accounts a user"]], "compare_figs": ["alfredVsKitaru"], "compare": {"head": ["Question", "alfred_", "Kitaru"], "rows": [["Where a tool call is caught", "`compose()` around every call; no surface calls execute()", "The adapter hook, on registered function tools only"], ["Default for a write", "Preview, confirm, then an idempotency key", "passthrough: the real tool runs"], ["What proves an action happened", "The `turn_effects` ledger, and a reconciler that checks the provider", "The mocked attribute, absent on passthrough"], ["Retries and repeats", "Event dedupe, a conversation lease, idempotency keys", "An occurrence counter: read, await, then write"], ["Where traces live", "Own tables in Postgres, read by the scanner", "A SessionNode tree, imported from trace stores"], ["Replay for evals", "Real failures replayed against a frozen world", "A cohort replayed from the call log"]]}, "bridges": [{"id": "b-prov", "title": "Provenance: what you would bring from alfred_", "point": "The effects ledger is the record Kitaru lacks.", "say": ["In alfred_ we never trusted the assistant's text to say an action happened; the effects ledger did. A replay node should carry the same: which policy answered it, and whether anything left the process. That turns the provenance gap into a field."]}, {"id": "b-writes", "title": "Side effects: why passthrough would not have passed your review", "point": "A write is declared as a write, and a fork should fail closed on it.", "say": ["Our write tools declare a capability class and carry an idempotency key, so a default that runs the real tool would not have passed review. On a forked replay I would default writes to fail closed, and let a read fall through only if it is marked safe."]}, {"id": "b-import", "title": "Import: the traces you already have", "point": "Your turn traces and tool executions are what Kitaru's importer would ingest; the scanner picks which are worth replaying.", "say": ["Our turn traces and tool executions are exactly what an importer would ingest. The part I would keep is the scanner: most traces are not worth replaying, and picking the failing ones is where the value was."]}]}, "showUp": [["Headline first, then stop.", "About 45 seconds, then offer the depth: 'I can go into the bench or the memory work.' The first answer sets the pace for ninety minutes; in the mock it ran over three."], ["Answer the person asking.", "Hamza, the co-founder, wants your story, your judgement, why this move and what you would cut. Alex, their Founding DevEx Engineer, wants the mechanism, the API shape, and what the user types and sees."], ["Say the limit before they find it.", "In the mock, defending the empty result cost more than the gap itself. 'That's a gap, and here is what I'd do' is the senior answer. Their own value is Be honest: 'provide candid feedback and own your actions'."], ["When lost, go to what the user sees.", "The screen, the click, what changes next time. It rescues any design question; it would have rescued the miss question."], ["Buy time honestly.", "'Give me a second' is fine. 'Essentially', 'so to say', 'in a sense' are not."], ["Numbers, unprompted.", "5,000-plus users, about 25 real instances per task, 2.5 to 2.2 tool calls per task, about three in four genuine flags, a little over a hundred cases."], ["Show their words as habits, never quote them.", "Their post asks for 'end-to-end in days, not weeks', 'a Slack conversation into a merged PR before lunch', 'product taste for developer tools', 'low ego, high standards'. Tell a story that shows each; do not recite the post."], ["The public half is part of the job.", "Lennart and Michael both raised it. Have your YouTube channel, LinkedIn, the INFORMS talk and MockFlow-AI's launch video ready, and your first post about Kitaru in one sentence."], ["Care that Kitaru wins.", "They are founders. Admire one thing specifically (the selector design), then critique one thing as a question. Energy for the product reads as fit."], ["Leave twenty minutes.", "At minute 70 of 90, turn to your questions. One at a time, then wait."]], "prepLead": "Start with how to show up. Then open a bank: each question shows what they are testing, the nuance, figures and reading on the light side, and what to say on the dark sheet. Mark each one revised as you go.", "storyBlurb": "Your career, why this role, why leave alfred_, your days at alfred_ and WheelPrice, the bench, what you found in Kitaru, the comparison, the close.", "sources": [{"label": "Product Engineer, ZenML/Kitaru: the job post (closed to applications)", "url": "https://careers.crane.vc/companies/zenml-2/jobs/74821580-product-engineer-zenml-kitaru-f-m-d-full-time", "why": "What they asked for, in their words: ship end to end in days, build for Python developers, close the loop on UX, AI-first and craft-first."}, {"label": "ZenML: company and values", "url": "https://www.zenml.io/company", "why": "Challenge everything, Empathize, Be efficient, Enable others, Be honest. Alex is listed as Founding DevEx Engineer."}, {"label": "ZenML careers", "url": "https://www.zenml.io/careers", "why": "No hierarchies, full ownership, open source as the way to build software."}, {"label": "Introducing Kitaru (1 April 2026)", "url": "https://www.zenml.io/blog/kitaru-launch", "why": "The launch as a durable execution layer for Python agents: crash recovery, human-in-the-loop, replay from any checkpoint."}, {"label": "Alex Strick van Linschoten's blog", "url": "https://alexstrick.com/", "why": "He writes in public about MLOps and engineering; read two recent technical posts."}, {"label": "ZenML's LLMOps Database", "url": "https://www.zenml.io/llmops-database", "why": "About 2,100 production case studies: how ZenML does public, useful content."}, {"label": "interviewing.io: a senior engineer's guide to the system design interview", "url": "https://interviewing.io/guides/system-design-interview/part-three", "why": "Clarifying: requirements first, and write down what you are told to assume."}, {"label": "Hello Interview: what your system design interviewer is really judging", "url": "https://hellointerview.substack.com/p/what-your-system-design-interviewer", "why": "Clarifying: the prompt is vague on purpose."}, {"label": "HBS Online: questions to ask before joining a startup", "url": "https://online.hbs.edu/blog/post/startup-interview-questions", "why": "Contributing: what success looks like, and whether the plan is concrete."}, {"label": "The Muse: questions software engineers should ask", "url": "https://www.themuse.com/advice/software-engineer-questions-to-ask-interview-find-the-right-fit", "why": "Collaborating: code review and design practice as a window on the culture."}]}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; o.rev = o.rev || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }

    d.appendChild(sm); d.appendChild(body);
    return d;
  }

  /* ---------------------------------------------------------------- prep: a hub

  function prepBanks() {
    var banks = [];

      banks.push({ id: "say", title: "Your story, in the words to say it", blurb: LOOP.storyBlurb || "", items: LOOP.scripts.map(function (x) {
        return { id: "say-" + x.id, q: x.title, short: x.short || x.title, tests: x.when, a: x.say, land: x.land, never: x.never, notes: x.notes,
          probes: x.probes, swaps: x.swaps,
          meta: x.length ? x.length.charAt(0).toUpperCase() + x.length.slice(1) + "." : "",
          drill: LOOP.drills.some(function (d) { return d.id === x.id; }) ? x.id : null };
      }) });
    }
    LOOP.qa.forEach(function (g, gi) {
      banks.push({ id: "qa-" + gi, title: g.group, blurb: g.blurb || "", items: g.items });
    });
    return banks;
  }
  function findPrep(banks, id) {
    for (var b = 0; b < banks.length; b++) {
      for (var i = 0; i < banks[b].items.length; i++) { if (banks[b].items[i].id === id) { return { bank: banks[b], i: i }; } }
    }
    return null;
  }

    });

  function drills(s) {

      var t0 = null, tick = null, secs = 0;
      function fmt(n) { return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); }
      start.addEventListener("click", function () {
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; return; }

    pager.innerHTML = (prev ? '<a href="' + link("sessions", prev.id) + '"><span>Previous</span>' + esc(prev.name) + "</a>" : '<a href="' + link("overview", "plan") + '"><span>Back to</span>The plan</a>') +
