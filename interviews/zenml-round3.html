bigger question around how you actually operate and evaluate AI systems reliably, and that's where I think the interesting product problems are."}], "land": "I've already run into the problem you're solving, from the other side.", "notes": ["Your own words.", "Pairs with the role bank's first theme, which goes deeper on product engineering."]}, {"id": "leave", "title": "Why are you looking to leave alfred_?", "length": "about 45 seconds", "when": "You are exploring while employed. Make that clear without sounding defensive.", "probes": ["Is something wrong at alfred_?", "Are you unhappy?", "Why move so quickly?", "Are you going to leave us quickly too?", "Is this just compensation, sponsorship or title?"], "say": ["There's nothing particularly wrong with alfred_. I've actually learned a lot there and I still enjoy the work.", "I'm mostly looking at what I want the next few years of my career to look like. At alfred_, I've had a lot of ownership because it's a small team, and that's been great. But the work is ultimately internal to one product.", "What I'm increasingly interested in is building the infrastructure and developer experience that other engineers depend on. That's one of the reasons Kitaru caught my attention — it's very close to problems I've already been solving, but the product itself is the thing I'm building.", "So it's less “I need to get away from Alfred” and more “I've found a direction I want to go deeper into.”"], "swaps": [{"when": "If they ask bluntly: “So why not just stay at alfred_?”", "line": "I could. And that's why I'm being selective about what I talk to. I'm not looking to leave just to change companies. The opportunity has to give me a meaningfully different scope or learning curve. Kitaru does because I'm going from building this infrastructure for one AI product to building it as a product for other engineers."}], "land": "Less “get away from alfred_”, more “a direction I want to go deeper into”.", "notes": ["Your own words.", "Pay, visa and start date are prepared in chat, not on this public page."]}, {"id": "alfred-day", "title": "What does your day-to-day look like at alfred_?", "length": "about 60 seconds", "when": "How much you code, what 'founding LLM engineer' means, what you personally own.", "probes": ["How much do you actually code?", "What does “founding LLM engineer” mean?", "Are you mostly research, backend, or product?", "How independent are you?", "What did you personally own?"], "say": ["It's pretty varied, which is one of the things I like about the role.", "A typical piece of work might start with a production failure. I'll look at the conversation and the tool trace, figure out whether it's a model problem, a tool problem, or something in our orchestration or memory layer.", "If it's something we need to reproduce, I'll add it to the eval harness. The harness takes a snapshot of the relevant user environment — email, calendar, whatever the task needs — and lets the actual agent code run against that state. So we're testing the same tool paths we use in production rather than mocking the whole agent.", "Then I'll usually build the fix, run the regression set, and look at whether we've actually improved the behavior without breaking something else.", "I've also worked on the production failure scanner, working memory, reliability infrastructure, and some of the cost and orchestration pieces.", "So it's a mix of debugging production behavior, building infrastructure, writing product code, and figuring out what we should build next."], "swaps": [{"when": "If they ask “how much coding?”", "line": "A lot. I'm usually in the codebase every day. The difference is that because we're a small team, the coding is usually preceded by figuring out what the right thing to build is."}], "land": "The coding is usually preceded by figuring out what the right thing to build is.", "notes": ["Your own words. The swap line is the best single line for this role."]}, {"id": "wheelprice-leave", "title": "Why did you leave WheelPrice?", "length": "about 40 seconds", "when": "Performance, boredom, a failing company, or a pattern of short stays.", "probes": ["Was there a performance issue?", "Did you get bored?", "Did the company fail?", "Are you a job hopper?", "Why alfred_?"], "say": ["WheelPrice was a really good place to move fast. It was two engineers, so I owned a lot, and I learned a ton about shipping under real constraints.", "But the work I kept enjoying most was the AI systems side, and there it was one of many hats. I wanted to be somewhere that was the core of the job.", "alfred_ was exactly that: a founding team, an agent in production with real users, and the reliability of that agent was mine to own. So it was a move toward depth in the same direction, not away from anything."], "swaps": [{"when": "If they ask whether you're a job hopper", "line": "Fair question. Both moves were toward the same thing, more depth in AI systems and more ownership, and each one widened the scope. This one would make that the whole job."}, {"when": "If they ask whether the company failed or it was performance", "line": "No, neither. It was a good team; I left for the kind of work, not because of anything going wrong."}], "land": "A move toward depth in the same direction, not away from anything.", "notes": ["From your WheelPrice notes, in your voice. Say it plainly and move on; don't over-explain.", "Dates if asked: WheelPrice July 2025 to March 2026; alfred_ from April 2026."]}, {"id": "wheelprice-day", "title": "What did you do day-to-day at WheelPrice?", "length": "about 75 seconds", "when": "How broad your ownership was, AI versus traditional software, and whether it shipped.", "probes": ["How broad was your ownership?", "How much was AI versus traditional software?", "Did you actually ship production systems?", "How does it connect to your current work?"], "say": ["It was two engineers, so nobody handed me tickets. I'd notice a problem, propose something, and own it end to end.", "Four things mostly. A blog and content system from scratch, because we had a big social following and no search presence at all; it got to 10 to 20 thousand daily readers, and I took API response time from about 1.5 seconds to 300 milliseconds with caching and query work.", "Then an AI fitment assistant, because buying wheels is genuinely confusing: bolt pattern, offset, hub bore, diameter. The key decision was to constrain it. The agent could only answer through four tools against verified data, never from what the model thought it knew, and when the data was incomplete it had to say so.", "Third, an internal analytics dashboard. Everyone assumed people dropped off at the fitment check; the data showed the real cliff was checkout, mostly on mobile, where the payment page timed out. And a computer-vision wheel visualizer that we paused, because it wasn't going to be good enough soon enough to be worth it.", "The thread into what I do now is that assistant: constrain the model, ground every answer in real data, and make the data honest about its own gaps."], "swaps": [{"when": "If they ask about the hardest decision", "line": "Constraining the fitment assistant. The easy path was letting the model answer from training data. I made that structurally impossible; every answer had to come through a tool."}, {"when": "If they ask what you'd do differently", "line": "Cache from day one. A blog built to catch viral social traffic will see spikes; I added Redis after the first spike, when it should have been in the design."}, {"when": "If they ask about prioritising four projects on a two-person team", "line": "By impact. The assistant and the dashboard were cutting support load and fixing conversion, so they went first. The visualizer I paused on purpose rather than let it compete."}], "land": "Nobody handed me tickets: notice a problem, propose, own it end to end.", "notes": ["From your WheelPrice notes, in your voice.", "The constrained-agent story connects straight to alfred_'s anti-fabrication work."]}, {"id": "bench2", "title": "The bench, in two minutes", "length": "about 2 minutes", "probes": ["What started it?", "How do you find failures?", "What exactly is faked?", "How is a run scored?", "What did it change?"], "notes": ["Four beats, one number each: the problem (no way to compare versions), finding failures (twelve classes, about three in four genuine), replay (only the provider call swapped; about twenty-five instances per snapshot), outcome (signed off the orchestration rewrite).", "Headline first, every time. The mock ran long because the bench came before they asked for it.", "The two deeper stories live in Your work: the swap to SQLite, and multi-turn."], "figs": ["benchLoop", "benchAdapter"], "when": "Tell me about the eval harness. Headline first, every time.", "land": "The real agent against a frozen snapshot of the user's world; only the provider call swapped; scored on tool calls per completed task.", "say": ["When I joined alfred_, we had no reliable way to say whether a new version of the agent was better than the old one. People tried it and had opinions. So I built the loop that turns production failures into regression tests.", "It starts with a scanner over real conversations. Cheap deterministic signals flag anything that looks like one of twelve failure types, and an LLM judge, trained on a week of labels I did by hand, decides which flags are real. Roughly three out of four are genuine bugs. Real ones get fixed and promoted into a bench of a little over a hundred cases.", "Replay is the interesting part. The real agent runs in a harness mode. The tools execute normally, so ranking, filtering and formatting are the production code. Only the call out to Gmail, the calendar or an MCP server gets routed to a SQLite snapshot. And the snapshot isn't one recorded path: for a query type we pulled about twenty-five real instances and covered every tool the agent used across all of them, plus deliberate ambiguity, like three people named Michael.", "So the agent can take a path it never took in production and still get truthful answers. We score on tool calls per completed task and on assertions against the snapshot, run it nightly, and it's what we used to sign off a full rewrite of the agent's multi-turn orchestration."]}, {"id": "kitaru-read", "title": "What did you find out about Kitaru? Did you try it?", "length": "about 75 seconds", "when": "How seriously you prepared, and whether you understand the product from the inside.", "probes": ["Have you used Kitaru?", "What surprised you?", "What did you like?", "What would you change?"], "say": ["I didn't run it on a real agent, honestly. What I did was go through the source and the infrastructure, because I wanted to understand how it actually works rather than how the pages describe it.", "The shape that stuck with me is that the server never runs user code. It's a coordinator: tasks, configs, results. The worker runs in your own environment and spawns your agent as a normal subprocess, and an adapter inside it hooks the framework's tool execution, so every tool call is answered from the recording by a hash of the tool name and its arguments.", "The bit I keep thinking about is the selectors: storing a JSON path into the payload instead of copying text out, so a human judgement, an evaluator verdict and the UI all point at the same place. I hand-rolled a worse version of that.", "And the part I'd want to work on is what happens when the agent changes: exact matching means a better agent misses the recording, and that's the moment a user decides whether to trust the tool."], "swaps": [{"when": "If they ask why you didn't run it", "line": "I prioritised understanding the mechanism, because that's what I'd be changing. Running the example is the first thing I'd do in week one, on a real agent of mine."}, {"when": "If they ask what surprised you", "line": "How much it rests on one hash. It makes replay cheap and deterministic, and it's also exactly where it's brittle."}], "land": "I read it from the source; the server never runs user code, and the hash is both its strength and its edge.", "notes": ["Be straight that you did not run it. Reading the source is a strong signal; overstating use is a weak one.", "Ask about the gaps as questions, never call them bugs. The Kitaru bank has the details."]}, {"id": "compare", "title": "The comparison: your bench against Kitaru", "length": "about 30 seconds", "probes": ["How is your bench different from Kitaru?", "Which is better?", "Could they meet in the middle?"], "notes": ["Neither is better: they fail in opposite directions. Kitaru has free ingestion and brittle counterfactuals; your bench has robust counterfactuals and expensive authoring.", "The bridge: promote only the sessions someone forks into a queryable world. Backend depth has the full design (Design 2)."], "figs": ["kitaruFreeze"], "when": "Hold this until they ask how the two designs differ. It is the strongest closing move.", "land": "Kitaru froze the transcript, I froze the world; they fail in opposite directions. Promote on fork.", "say": ["Kitaru freezes the transcript, so ingestion is free and counterfactuals are brittle. We froze the world, so counterfactuals held up and ingestion was expensive. They fail in opposite directions.", "The interesting product question is whether a recorded session can be promoted into a small queryable world model on demand, so the common case stays free and only the sessions you actually fork on get upgraded into something the agent can explore."]}, {"id": "close", "title": "The close", "length": "about 20 seconds", "notes": ["Say it once, plainly, then ask about next steps: 'What are the next steps from here?'", "Don't summarise the interview back to them, and don't add a new pitch at the door."], "when": "The last minute. Then ask about next steps plainly.", "land": "I've built this in-house and know what it costs. I'd like to build it as the product.", "say": ["This is the first eval product whose source I've read and come away thinking the hard parts were hard for the right reasons. I've been on the other side of it: I know what it costs to build in-house and what it costs to keep. I'd like to build it as the product."]}], "drills": [{"id": "intro", "prompt": "Introduce yourself.", "target": "40 seconds", "seconds": 40, "ref": "#say-intro"}, {"id": "seat", "prompt": "Why this seat, and why now?", "target": "45 seconds", "seconds": 45, "ref": "#say-seat"}, {"id": "bench2", "prompt": "Tell me about your eval bench.", "target": "2 minutes", "seconds": 120, "ref": "#say-bench2"}, {"id": "refunds", "prompt": "When did your bench pass something that was actually broken?", "target": "75 seconds", "seconds": 75, "ref": "#say-refunds"}, {"id": "critique", "prompt": "Name one thing in Kitaru that's wrong or oversold.", "target": "60 seconds", "seconds": 60, "ref": "#say-critique"}, {"id": "miss", "prompt": "A prompt change causes a cache miss and the replay dies. What would you do?", "target": "90 seconds", "seconds": 90, "ref": "#say-miss"}, {"id": "sqlite", "prompt": "Why SQLite when production is Postgres?", "target": "60 seconds", "seconds": 60, "ref": "#qa"}, {"id": "halfway", "prompt": "A side-effecting tool call fails halfway. What happens?", "target": "60 seconds", "seconds": 60, "ref": "#qa"}, {"id": "langs", "prompt": "LangChain, LangGraph, LangSmith: what's the difference?", "target": "30 seconds", "seconds": 30, "ref": "#qa"}, {"id": "close", "prompt": "Close the interview.", "target": "20 seconds", "seconds": 20, "ref": "#say-close"}], "qa": [{"group": "The role: product engineer, in public", "blurb": "Six themes, each with what they may probe, the answer, and lines to swap in. Theme 1 is in your own words.", "items": [{"q": "Why product engineering, and why Kitaru?", "short": "Why product engineering, and why Kitaru", "tests": "Is this a real shift or a title change, and do you actually want to build for developers?", "probes": ["What does “product engineer” actually mean to you?", "Why not continue as an AI/backend engineer?", "Is this a real shift or just a title change?", "Why Kitaru specifically?", "Do you actually like building for developers?", "Can you move quickly without overengineering?", "What have you already done that's product-engineering-like?"], "a": ["I think product engineering is really about owning the problem rather than owning a particular layer of the stack.", "That's pretty much how my role at alfred_ has evolved. A lot of the work I enjoyed most started with a real product problem — we'd see something going wrong in production, I'd dig into what was actually happening, build whatever infrastructure we needed to reproduce it, fix it, and then make sure we could catch the same thing again.", "So I wasn't just responsible for the backend or the AI piece. I had to figure out what actually needed to be built and take it through to something the team could use.", "That's the direction I want to go further in. I still like going deep technically, but I don't want my ownership to stop at a particular service or layer. I want to start with the user problem and have enough range to change whatever needs changing.", "And Kitaru is a really natural fit for that because I've actually built a rough version of this problem myself. I've dealt with replay, stateful evals, tool execution, production traces, and the developer workflow around all of that. So I'm not coming at it as, “I want to work on developer tools because they sound interesting.” I've been the engineer who needed this product.", "That's probably the biggest reason I'm interested. The users are engineers like me, and I can feel pretty quickly when a developer product is making my life easier or getting in my way."], "swaps": [{"when": "If they push on “why now?”", "line": "I'm at a point where I want more ownership, not necessarily more specialization."}, {"when": "If they ask “what's different from being a backend engineer?”", "line": "I think the difference is where you start and where you stop. A backend engineer can own the service. A product engineer starts with the problem and stays with it until the workflow actually works."}, {"when": "If they push on moving fast vs. your systems-heavy background", "line": "I care about architecture, but I'm pretty pragmatic about it. At alfred_, I didn't build a distributed eval platform just because that would have been cleaner. SQLite was enough for the problem and the team we had. I like good architecture, but I don't want the architecture to become the product."}, {"when": "If they ask why developer tools", "line": "I like building things where the feedback loop is really short. If an API is awkward or something takes five steps instead of one, I experience that immediately. And when you fix it, you know pretty quickly whether it's actually better."}], "land": "I've been the engineer who needed this product.", "notes": ["Your own words. Say it, don't recite it.", "Their post: 'This is not a backend role or a frontend role', and not for 'specialists seeking deep focus in one stack area'. Your 'more ownership, not more specialization' answers both.", "'Product taste for developer tools: feel physical pain when an API is clunky'. Have one clunky API of your own ready as the example."], "id": "q-why-product-engineering-and-why-kitaru"}, {"q": "The public half: X, GitHub, posts and demos", "short": "The public half of the job", "tests": "Will you actually build in public, on X, like an engineer rather than a marketer? Lennart and Michael both raised it, and the current post puts it at the centre.", "probes": ["Are you active on X?", "What have you put out publicly so far?", "Have you done this for an employer before?", "What would your first post about Kitaru be?", "What's the difference between a useful thread and a viral one?", "How would you find the time for it while shipping?", "What's a weakness you're working on?"], "a": ["Honestly, I enjoy it, and I'm already around it. I'm on X a lot, but mostly reading: the people building agents and arguing about evals are there, and that's how I keep up. Where I actually post is LinkedIn and my YouTube channel, and whenever I'm building something of my own I talk about it while I'm building it. MockFlow-AI went out with a launch video, and I presented MetaRAG at INFORMS Analytics+ to 700-plus people.", "What I haven't done yet is do it on X, and do it professionally, for a company's product. That's the gap, and it's genuinely part of why this role is interesting to me.", "The way I think about it, for an open-source developer tool, talking about what you shipped is part of shipping it. The release, the docs, the example and the post are really one piece of work. If I ship a better miss experience and nobody knows it exists, I haven't really finished.", "And on X I'd rather be useful than loud: short demos on real traces, threads that come out of something I actually shipped or debugged, and real replies where people are stuck on evals. The posts I read are the ones that teach me something I can use on Monday."], "swaps": [{"when": "If they ask about X specifically", "line": "I read it every day, and I'd start posting from week one: a thread for every meaningful release, a short demo, and real replies in eval threads. Consistency over volume."}, {"when": "If they ask what separates a useful thread from a viral one", "line": "A viral thread gets attention; a useful one gets someone to try the thing on Monday. I'd optimise for the second and let the first happen sometimes."}, {"when": "If they ask what your first post would be", "line": "A walkthrough on real data. Take an agent, import a handful of traces, find a failure, change the prompt, replay, and show the one case that got fixed and the one that got worse. Five minutes, repo linked."}, {"when": "If they ask how you'd find the time", "line": "I'd tie it to releases. Every meaningful release gets its doc, its example and a short post, the same way it gets tests. Cadence, not inspiration."}, {"when": "If they ask for a weakness", "line": "Posting on X, professionally. I do the public side for my own projects, but not yet on a schedule for a company. That's the habit I'd build here first."}], "land": "For an open-source developer tool, talking about what you shipped is part of shipping it; on X, useful over loud.", "notes": ["The current post: 'lives and breathes on X and GitHub', 'creates value in public', 'Marketing without shipping is cosplay. Shipping without talking to the world is invisible.' Show you agree with a habit, not a slogan.", "Be honest that you read X more than you post there, and pair it with the week-one plan. That is their value Be honest in action.", "Have your best video or the talk ready to share on screen, and your GitHub open."], "figs": ["forkReplay"], "id": "q-the-public-half-x-github-posts-and-demos", "learn": {"figs": ["forkReplay"], "read": [], "sdLinks": []}}, {"q": "Explain Kitaru to someone who has never heard of it", "short": "Kitaru, explained", "tests": "Can you say what the product is, plainly, and where it fits?", "probes": ["Explain Kitaru in thirty seconds.", "Who is it for?", "How is it different from LangSmith or Braintrust?", "What's the hardest part of the product?"], "a": ["The way I'd put it: Kitaru turns agent traces into reliable evals. You ingest your production sessions, find the cohorts that matter, mock the tools away, and replay your real agent against them with a change, so you see what the change does to real sessions without touching production.", "So it's basically regression testing for agents, built from the traffic you already have.", "And because it grew out of durable execution, the same recording is what lets a crashed agent pick up from its last checkpoint instead of starting over."], "swaps": [{"when": "If they ask who it's for", "line": "Python engineers shipping agents who've been burned by a change that looked fine in a demo."}, {"when": "If they ask how it's different from LangSmith or Braintrust", "line": "Those are really good at showing you what happened. Kitaru lets you re-run it with a change and see what would have happened. It even imports traces from them, so it's more of a next step than a replacement."}, {"when": "If they ask what the hardest part is", "line": "Divergence. The better your change, the more your agent's calls differ from the recording, and every difference is a miss. That's the problem I'd want to work on."}], "land": "Regression testing for agents, built from the traffic you already have.", "notes": ["Their current words: 'turn agent traces into reliable evals: ingest production sessions, mine the high-signal cohorts, mock tools away, replay agents, ship with confidence.' The repo: 'Agent traces you can run, not just read.'", "Launch, April 2026: a durable execution layer for Python agents. The replay-eval framing came in August."], "figs": ["kitaruReplay"], "id": "q-explain-kitaru-to-someone-who-has-never-heard-of-it", "learn": {"figs": ["kitaruReplay"], "read": [], "sdLinks": []}}, {"q": "How you'd work here: the first month, what to build, and pace", "short": "How you'd work here", "tests": "Do you start with users, ship early, and move in days?", "probes": ["What would you do in your first month?", "How do you decide what to build when users ask for everything?", "Can you really ship in days, not weeks?", "How do you use coding agents, and when do you take over?", "What do you do with a vague request?"], "a": ["I'd start by using Kitaru the way a new user would, on a real agent of mine, and just write down every place I get stuck. At the same time I'd read through what users are actually asking in Slack and GitHub, and pick up small bugs, because that's the fastest way for me to learn a codebase: by shipping in it.", "By the end of the first month I'd want one visible improvement out of those notes, shipped with its doc and a short post. My guess is it'd be around the miss experience, because that's where replays hurt first. But I'd honestly ask you both which user problem is costing you the most and start there instead of my guess.", "On deciding what to build more generally, I lean on what actually breaks rather than what people guess will break. At alfred_ the production scanner did that for us, and it settled a lot of debates. For a developer tool, anything that stops someone getting their first replay working comes first, because that's where you lose people."], "swaps": [{"when": "If they ask whether you can really ship in days", "line": "Yeah. I'd rather put a two-day prototype in front of someone than spend two weeks on a design doc."}, {"when": "If they ask how you use coding agents", "line": "A lot, but with guardrails. I let them drive on the well-tested, boring parts and I take over on concurrency, permissions and migrations. And I read every line I merge, whoever wrote it."}, {"when": "If they ask about a vague request", "line": "I'd ask them to show me the session where it went wrong. A real example usually tells you what they actually need."}], "land": "Use it as a new user, ship small fixes to learn the code, then one visible improvement with its doc and post.", "notes": ["The post: 'Use Your Own Products'; 'Fix onboarding friction immediately through PRs, not tickets'; 'End-to-end in days, not weeks'.", "Ending with a question to them turns a plan into a conversation."], "id": "q-how-you-d-work-here-the-first-month-what-to-build-and-pace"}, {"q": "Working with people: reviews, feedback, disagreement", "short": "Working with people", "tests": "Low ego, high standards.", "probes": ["How do you give and take code review?", "Which of our values do you connect with?", "How do you handle disagreeing with a founder?", "How do you review code an agent wrote?"], "a": ["I try to be direct about the code and kind to the person. When I review, I say what I'd change and why, and I'm clear about what's a must-fix versus just my taste.", "On the other side, I'd genuinely rather be corrected than stay wrong. That's probably the biggest thing the eval work taught me. The whole bench only worked once we stopped trusting the agent's own account of what it did and checked the execution record instead.", "I try to hold myself to the same thing, including in an interview. I'd rather say “I don't know, here's how I'd find out” than bluff."], "swaps": [{"when": "If they ask which of their values", "line": "Be honest. Not as a slogan: the whole eval story is about not trusting an account over the record."}, {"when": "If they ask about agent-written code in review", "line": "Same bar as a colleague's. It's not a compiler, so it doesn't get trusted like one."}, {"when": "If they ask about disagreeing with a founder", "line": "I'd make my case once, with evidence, ideally a real example or a quick prototype, and then commit to whatever we decide. Small teams can't afford relitigating."}], "land": "Direct about the code, kind to the person; I'd rather be corrected than stay wrong.", "notes": ["The post, word for word: 'Direct in code reviews, kind in conversation. Prefer correction over being wrong.' Show it; don't quote it.", "Their five values: Challenge everything, Empathize, Be efficient, Enable others, Be honest. Pick one, tie it to a story."], "id": "q-working-with-people-reviews-feedback-disagreement"}, {"q": "Where do you want to be in two or three years?", "short": "Where you're headed", "tests": "Ambition that fits a small company.", "probes": ["Where do you want to be in two or three years?", "Do you want to manage people?", "Would you stay if Kitaru pivots again?"], "a": ["Where I want to be in two or three years is owning a product area of developer infrastructure end to end: the users, the code, and the story people tell about it.", "And staying close enough to agents in production that I know what breaks before most teams hit it. A small team that ships fast is the quickest way I know to get there."], "swaps": [{"when": "If they ask about managing people", "line": "Not as a goal in itself. I'd rather own a bigger problem than a bigger team; if the team grows around the problem, great."}, {"when": "If they ask about another pivot", "line": "The problem underneath doesn't pivot: teams need to know whether a change to their agent made it better. I'd want to be on that, whatever the positioning says."}], "land": "Owning a product area end to end, close to where agents break.", "notes": ["Why leave alfred_ is in your story bank, in your own words.", "'No layers, no politics' in the post: don't talk about titles."], "id": "q-where-do-you-want-to-be-in-two-or-three-years"}, {"q": "One week you ship, the next you write, the next you demo. How would you work like that?", "short": "The week's hat", "tests": "Can you switch modes without drama, and keep one loop running?", "probes": ["Have you worked across modes like this before?", "How do you decide what this week is?", "What stops it becoming chaos?", "What if nobody gives you a backlog?"], "a": ["I've pretty much been working like that already, just without the posting part being the job. At alfred_ one week is digging through production failures, the next is building the harness to catch them, the next is writing it up so the team actually uses it.", "What keeps it from being chaos is that it's one loop, not three jobs. What I hear from users becomes the next thing I build, and what I ship becomes the next thing I show. So the question each week is just: where is the loop stuck right now? If nobody knows about the feature, it's a writing week. If people are confused in demos, it's a product week.", "And I'm comfortable with nobody handing me a backlog. At a small team that's normal; you look at what's breaking and what's being asked, and you decide."], "swaps": [{"when": "If they ask how you'd pick the week", "line": "Wherever the loop is stuck. If something shipped and nobody knows, write. If demos keep hitting the same confusion, build."}, {"when": "If they ask about no backlog", "line": "That's how small teams work. I'd rather invent the week's job than wait for one."}], "land": "It's one loop, not three jobs: what I hear becomes product, what I ship becomes the next thing I show.", "notes": ["The post: 'Wear the week's hat', 'Feed the loop', 'High agency, low ego. You'll invent the week's job.'"], "id": "q-one-week-you-ship-the-next-you-write-the-next-you-demo-how-w"}, {"q": "Walk us through a live demo with a real agent builder.", "short": "A live customer demo", "tests": "Can you demo live and debug with a customer without hiding behind slides?", "probes": ["How would you structure a demo?", "What if it breaks in front of them?", "What do you take away from a demo?"], "a": ["I'd start from their world, not ours. Ideally their own traces, or at least an agent that looks like theirs. Then the shortest path to something they didn't know: import a handful of sessions, pick the cohort that's failing, mock the tools away, make one change, replay, and show the diff.", "If it breaks live, I'd debug it with them rather than skip it. That's honestly the best part of a demo for a developer tool: they see how you find a problem. Read the node that went wrong, see how it was served, fix or explain it.", "And afterwards the demo isn't over until it's turned into something: an issue, a fix, or a line in the next post. That's the 'feed the loop' part."], "swaps": [{"when": "If they ask what if it breaks", "line": "Debug it with them. A developer trusts a tool more after watching you find a problem in it than after a perfect run."}, {"when": "If they ask how you'd prepare", "line": "Rehearse the five-minute path on real data, and keep a recorded run as a fallback, not a replacement."}], "land": "Start from their world; the shortest path to something they didn't know; if it breaks, debug it with them.", "notes": ["The post: 'You can demo live and debug with a customer without hiding behind slides.'", "Their four verbs for Kitaru: ingest sessions, mine cohorts, mock tools away, replay."], "id": "q-walk-us-through-a-live-demo-with-a-real-agent-builder"}, {"q": "What does success look like for you at six months?", "short": "Six months", "tests": "Do you map to their four success points without reciting them?", "probes": ["What would you have shipped?", "What would people know you for?", "How would you know it's working?"], "a": ["I'd want three things to be true. First, a couple of features I owned that agent builders actually use. The miss experience and provenance are my guesses, but it'd be whatever the demos and issues say.", "Second, a steady public rhythm that people associate with useful takes: a post or demo for every meaningful release, and replies in the threads where people are actually fighting with evals. Not volume, usefulness.", "And third, that the demos and content are pulling in real signal on their own: conversations that turn into product changes, without someone else having to run that for me every week. If the bar for what we ship and say went up a bit because I was there, that's the one I'd care about most."], "swaps": [{"when": "If they ask how you'd measure it", "line": "Features in real use, replies and demos that turn into issues or conversations, and whether people bring up Kitaru when they talk about evals."}], "land": "Features builders use, a public rhythm known for useful takes, and demos that pull in real signal on their own.", "notes": ["Their four: a credible presence in the agent-builder conversation; features you owned that builders use; demo and content motion that creates pipeline and signal without a separate GTM person; taste went up because you were in the room."], "id": "q-what-does-success-look-like-for-you-at-six-months"}, {"q": "Where do agent builders hang out, and how do you keep up with the field?", "short": "Keeping up, and the ICP", "tests": "Are you already in the water?", "probes": ["Who is the user, exactly?", "How do you keep up?", "What have you tried before it was documented?"], "a": ["The people I think about are the ones wiring agents for real: LangGraph, Claude Code, custom runtimes like ours at alfred_, and the eval nerds who care whether a change actually made things better. They're on X and in GitHub issues.", "I keep up mostly by building. I use Claude Code every day with my own project instructions, skills and hooks, and at alfred_ we shipped an MCP connector so Claude can use our tools. When a new model or harness comes out, I'd rather try it on a real task that week than read the launch post.", "And I bring it back: if something changes how we should build or evaluate, it ends up in the code or in a write-up for the team, not just in my head."], "swaps": [{"when": "If they ask who the ICP is in a line", "line": "Engineers shipping agents to real users who've been burned by a change that looked fine in a demo."}], "land": "I keep up by building with it, and I bring what I learn back into the product.", "notes": ["The post: 'Already in the water', 'Learning on the job, by default', 'you try things before they're documented'."], "id": "q-where-do-agent-builders-hang-out-and-how-do-you-keep-up-with"}, {"q": "What have you shipped in open source that people use?", "short": "Open source", "tests": "OSS contributions people actually use (a nice-to-have in the post).", "probes": ["Have you contributed to a big project?", "What's on your GitHub?"], "a": ["Honestly, most of my open-source work is my own projects rather than contributions to big ones. My GitHub has things like MockFlow-AI, the voice mock-interview platform, and SnakeAI-MLOps, and my research is out there too: MetaRAG was accepted at IEEE CAI 2026.", "What I haven't done much of is contributing to a widely used project. Kitaru's adapters would be a pretty natural place to start, because I know exactly which seams matter from having built them myself."], "land": "Mostly my own projects and research; the adapters here would be a natural first contribution to a widely used one.", "notes": ["Don't claim usage numbers you don't have. The post says 'your GitHub history is part of how we found you': have it open."], "id": "q-what-have-you-shipped-in-open-source-that-people-use"}]}, {"group": "Product engineering on Kitaru", "blurb": "The work the job post names: adapters, onboarding, replay debugging, the miss experience. Compact.", "items": [{"q": "Design the adapter for a new agent framework.", "short": "A new framework adapter", "tests": "SDK design and developer experience.", "a": ["Start from what the framework already exposes: its tool-execution hook, its model-call hook, and how it represents a turn.", "The adapter does three things: record every tool call as a node with its cache key, answer calls on replay through the policy, and mark every node with how it was served. One line of setup for the user; the rest is configuration with good defaults.", "Then one shared contract suite every adapter must pass, against recorded fixtures, so adapters can't drift, canonical JSON especially, since that's where cross-adapter keys break."], "land": "Hook what the framework exposes; record, answer, mark how it was served; one line of setup; a shared contract suite.", "notes": ["The post names 'new framework adapters' as an example deliverable; frameworks it lists: PydanticAI, OpenAI SDK, Claude Agents SDK."], "figs": ["kitaruReplay", "kitaruKey"], "id": "q-design-the-adapter-for-a-new-agent-framework", "learn": {"figs": ["kitaruReplay", "kitaruKey"], "read": [], "sdLinks": []}}, {"q": "A user says their replay is broken. Walk me through it.", "short": "Debugging a user's replay", "tests": "User-driven iteration, same-day fixes.", "a": ["Get the session id and the replay id, not a description, and reproduce against their recording.", "Then read provenance node by node: which calls hit, which missed, which went live. Most breakages are one of four: a key mismatch, so show both canonical forms side by side; an adapter or framework version change; a tool with no policy; or the worker's environment differs from theirs.", "Fix it, add the case to the contract tests, change the error message or doc that would have saved them, and reply in their thread with the PR. Same day if it's small."], "land": "Reproduce from ids, read provenance node by node, fix, add the test, fix the message, reply with the PR.", "notes": ["The post: 'Engage actively in Slack and GitHub. Convert user confusion into same-day PRs.'"], "figs": ["kitaruPolicy"], "id": "q-a-user-says-their-replay-is-broken-walk-me-through-it", "learn": {"figs": ["kitaruPolicy"], "read": [], "sdLinks": []}}, {"q": "A better prompt misses every recording. What do we build?", "short": "A better prompt misses everything", "id": "say-miss", "tests": "Their central problem, as product judgement. (Mock 1 gap.)", "a": ["First, a miss is information: the agent's behaviour changed, which is what they were measuring. The goal isn't to avoid misses, it's to stop one from killing the run and make it cheap to resolve.", "First build: the miss experience. Misses grouped by tool with a count; open one and it's the recorded call next to what the new agent sent. If they're equivalent, one action accepts it as a static alias and the next replay hits. Deterministic, auditable, and every accepted pair is labelled data for matching later.", "Second: policy by effect. A read that misses can fall through to the customer's environment, marked live on the node. A write that misses fails closed on a fork, never passthrough.", "The limit: that fixes rephrasing, not a different path. For those few sessions, promote the trace into a small queryable world, which is what my bench does. The common case stays free."], "swaps": [{"when": "If they ask what button, and what changes next replay", "line": "'Accept as equivalent.' It writes a static alias: these new arguments map to that recorded result. The next replay checks aliases before it misses, and the node says 'served by alias' so nobody mistakes it for an exact match."}, {"when": "If they ask about fuzzy matching", "line": "Last, and carefully: shadow first, then suggest, then opt-in per tool, and every fuzzy hit stamped on the node. A silent false pass is the worst bug an eval product can ship."}], "land": "A miss is information. Make it cheap to resolve: diff, accept as an alias, then policy by effect.", "figs": ["missFlow", "kitaruKey", "zenEffects"], "learn": {"figs": ["missFlow", "kitaruKey", "zenEffects"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Divergence: the better the change, the worse the replay."}]}}, {"q": "The customer says the two searches are the same. What button, and what changes next replay?", "short": "Which button", "tests": "Can you land a design down to data? (Mock 1 gap.)", "a": ["'Accept as equivalent.' It writes a static alias for that tool: these new arguments map to that recorded call's result, scoped to the cohort, and it applies to the whole group of identical misses.", "Next replay the lookup checks aliases before it misses, so those calls hit, and the node is stamped 'served by alias', so nobody mistakes it for an exact match.", "Every accepted pair is a labelled example of 'different arguments, same meaning': the data you'd need to tune fuzzy matching later, shipped in shadow first."], "land": "Button, then the data it writes, then what the next replay does with it.", "figs": ["missFlow"], "learn": {"figs": ["missFlow"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "The productive miss, as a design option."}]}, "id": "q-the-customer-says-the-two-searches-are-the-same-what-button-"}, {"q": "What goes into the first ten minutes with Kitaru?", "short": "The first ten minutes", "tests": "Onboarding taste.", "a": ["One goal: a first replay that shows the user something they didn't know. Install, wrap an agent in one line, import or record a few sessions, replay with one change, see a diff.", "Every step that asks for a decision is a place people drop off, so defaults everywhere, and an example agent for people who don't have one ready. And measure it: time to first successful replay, and where people stop."], "swaps": [{"when": "If they ask what makes an error message good", "line": "It says what happened, why, and the next thing to type. For a miss: which tool, the recorded arguments next to the new ones, and the command to accept. A message that sends someone into the source is a bug in the product."}], "land": "A first replay that teaches the user something, with no decisions on the way; measure time to it.", "notes": ["Alex ships the Claude Code skills behind the guided tour: ask him what the tour changed."], "id": "q-what-goes-into-the-first-ten-minutes-with-kitaru"}, {"q": "How would you test an SDK across frameworks and versions?", "short": "Testing across frameworks", "tests": "Quality at speed.", "a": ["A small matrix: supported Python versions against each framework's oldest supported and newest release. Contract tests from recorded fixtures on every PR.", "A nightly run against the frameworks' newest releases, so a breaking change upstream shows up before a user reports it. And one end-to-end example per framework that runs the real quickstart, because for a new user the quickstart is the product."], "land": "A small matrix, contract tests per PR, nightly against upstream, and the quickstart as a test.", "notes": ["'Raise the bar: better tests, clearer interfaces, sharper documentation.'"], "id": "q-how-would-you-test-an-sdk-across-frameworks-and-versions"}]}, {"group": "Tools and the landscape", "blurb": "What you've built with and why you chose it, and the ecosystem Kitaru imports from. Compact.", "items": [{"q": "Why TypeScript and Deno at alfred_, and Python or TypeScript here?", "short": "TypeScript, Deno and Python", "tests": "Real reasons, and honesty about Kitaru being Python-first.", "a": ["At alfred_ it's TypeScript on Deno, running as edge functions next to Supabase Postgres. One language across the web app and the backend, typed tool schemas with zod, so a tool's contract is checked at the boundary, and functions that deploy in seconds with no servers to run.", "The trade-off is the ML ecosystem, which lives in Python. My research and ML work has been Python: PyTorch, FastAPI, Flask, and an INT8-quantised inference API at UIC.", "Your server and SDK are Python, and I'd say that plainly: I'm stronger in production TypeScript day to day, comfortable in Python, and the fastest way I close that gap is shipping in your codebase from week one."], "land": "TypeScript and Deno for one typed language next to Postgres; Python for ML; plain about which is sharper.", "notes": ["The post asks for '4+ years writing production Python'. Don't oversell; show you've shipped Python services (UIC APIs, FastAPI at WheelPrice)."], "id": "q-why-typescript-and-deno-at-alfred-and-python-or-typescript-h"}, {"q": "Why FastAPI, and why does Pydantic matter?", "short": "FastAPI and Pydantic", "tests": "Their stack, from your own use.", "a": ["I used FastAPI for the analytics backend at WheelPrice: requests validated by Pydantic before my code runs, the OpenAPI contract generated so the dashboard knew the API exactly, and async for several database queries at once.", "Kitaru's server is FastAPI with Pydantic models too, and the value is the same one I care about in agents: the contract is checked at the edge, so bad input fails loudly and early instead of deep inside."], "land": "Validate at the edge, generate the contract, fail early: the same instinct as typed tool schemas.", "notes": ["Their stack in the post: Python 3.11+, Pydantic, SQLAlchemy/SQLModel, FastAPI, asyncio."], "id": "q-why-fastapi-and-why-does-pydantic-matter"}, {"q": "Tell me about the queue: why Postgres, and how is it claimed?", "short": "A queue in Postgres", "tests": "Choice, then mechanism.", "a": ["Postgres, with pgmq for the event bus and pg_cron for schedules, because everything else already lived there: one database to back up, secure and reason about, and at our volume it's plenty. Kafka or SQS would have been a second system for a small team to run.", "Claiming is SELECT ... FOR UPDATE SKIP LOCKED, so two workers never take the same job. And a cron drain's worst case is its interval, which is exactly what we hit on notifications: about ninety seconds down to about three by triggering on the event, with cron kept as a backstop."], "swaps": [{"when": "If they ask when you'd move off Postgres", "line": "The day queue load moves chat latency. Until then, one database is a feature for a small team."}], "land": "Postgres because everything already lived there; SKIP LOCKED to claim; the event as trigger, cron as backstop.", "figs": ["skipLocked"], "learn": {"figs": ["skipLocked"], "read": [{"label": "Postgres docs: the locking clause, FOR UPDATE SKIP LOCKED", "url": "https://www.postgresql.org/docs/current/sql-select.html", "m": 9}, {"label": "Crunchy Data: a queue in plain Postgres with SKIP LOCKED", "url": "https://www.crunchydata.com/blog/message-queuing-using-native-postgresql", "m": 10}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/contention/claim-skip-locked", "label": "Technique: Queue claiming with SKIP LOCKED", "why": "The idiom to name."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/real-time/polling", "label": "Technique: Polling and long polling", "why": "Why a cron drain's worst case is its interval."}]}, "id": "q-tell-me-about-the-queue-why-postgres-and-how-is-it-claimed"}, {"q": "What's the difference between LangChain, LangGraph and LangSmith?", "short": "LangChain, LangGraph, LangSmith", "tests": "Do you know the ecosystem Kitaru imports from?", "a": ["LangChain is the open-source framework: model wrappers, prompts, tools and the glue between them. LangGraph is its orchestration layer for stateful agents: a graph over shared state, with checkpointers for persistence and human-in-the-loop. LangSmith is the commercial platform around both: tracing, datasets, evals, deployment, and one of the trace sources Kitaru imports from.", "In a line: a framework, a runtime for stateful agents, and the observability-and-eval product."], "land": "Framework, runtime, platform.", "learn": {"figs": [], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/transcript-checkpoint", "label": "Technique: Transcript checkpoint every turn", "why": "What LangGraph's checkpointers are, in the guide's terms."}]}, "id": "q-what-s-the-difference-between-langchain-langgraph-and-langsm"}, {"q": "LangGraph, or your own agent loop?", "short": "A framework or your own loop", "tests": "Judgement about abstractions.", "probes": ["Have you used LangGraph?", "When would you pick a framework?", "What does a framework hide that you need?"], "notes": ["LangGraph gives you the agent as a graph over shared state, checkpointers for persistence, human-in-the-loop and streaming. Good defaults when your pattern is a standard one.", "What alfred_ needed to own: retries and idempotency around each tool call, a confirm step before writes, and a prompt laid out for caching.", "Kitaru's users wire LangGraph, Claude Code and custom runtimes, which is why Kitaru hooks each framework's tool execution rather than asking people to change frameworks."], "a": ["At alfred_ the loop itself is a small LangGraph graph: a model node, a conditional edge, a tools node. But we don't use its prebuilt tool node, because it would bypass everything that mattered most: how retries and idempotency work around each tool call, the confirm step before a write, and how the prompt is laid out for caching. Every tool call goes through our own wrapper stack.", "I've used LangChain in research, and for a prototype it's faster. For a product where the seam between the model and the tools is where the bugs live, I want to own that seam, framework or not. Which is also why Kitaru hooking the framework's tool execution is the right place to sit."], "land": "Own the seam between the model and the tools when that's where the bugs live.", "id": "q-langgraph-or-your-own-agent-loop"}, {"q": "Which model for what, and how do you control cost?", "short": "Models and cost", "tests": "Practical LLM engineering.", "a": ["Match the model to the stakes. At alfred_ low-stakes mail goes to a cheaper tier, and the expensive reasoning is kept for where it changes the outcome. Before changing anything I instrumented spend per model and per stage, because my guess about where the money went was wrong.", "Changes to reasoning budgets are gated behind evaluation, and a deprecated model raises an alarm before it breaks. The biggest single win wasn't a model at all: replacing per-message LLM calls with a deterministic matcher for email rules cut per-user LLM cost about 30 percent."], "land": "Instrument first; match the model to the stakes; the best cost cut was removing a model call.", "notes": ["Prompt caching is the other lever: a byte-identical shared prefix, cached for an hour. The alfred_ page (ALFRED.html) has the numbers."], "id": "q-which-model-for-what-and-how-do-you-control-cost"}, {"q": "What's your experience with trace stores, and would you build your own?", "short": "Trace stores", "tests": "Honest scope and judgement.", "a": ["At alfred_ we kept our own: conversations, the tool-execution ledger and the scanner's flags live in our own tables in Supabase Postgres, and the scanner and the bench run over them. I haven't run Langfuse or LangSmith in production; I know how Kitaru's importers map them from reading the code.", "Keeping execution records next to product data was the right call for us: the scanner's biggest false-positive fix was joining a flag against the tool-execution record, which is easy when both live in one database. A dedicated store earns its place for span trees, a UI to read them, retention, and volume."], "land": "Own it while the questions are about product data; adopt a trace store when they become about spans.", "learn": {"figs": ["kitaruModel", "alfredVsKitaru"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/hld", "label": "Kitaru, high-level design", "why": "Where imported traces land in Kitaru."}]}, "id": "q-what-s-your-experience-with-trace-stores-and-would-you-build"}, {"q": "How do you use AI in your own workflow?", "short": "Coding agents", "tests": "AI-pilled, not vibes-pilled.", "a": ["Heavily, with scaffolding: Claude Code with project instructions and skills for the jobs I repeat, a review pass, and a verification step that drives the running surface instead of trusting that it compiled.", "I let it drive on well-tested, boring parts and take over on concurrency, permissions and migrations. And I don't trust an agent's self-report, the same instinct as the anti-fabrication work in our product."], "land": "Don't trust self-reports, from models or from yourself.", "notes": ["Their stack names Claude Code, Cursor and Codex; they also build internal tooling on Kitaru itself."], "id": "q-how-do-you-use-ai-in-your-own-workflow"}]}, {"group": "Python, for their codebase", "blurb": "Your Python, why you like it, how you'd build the harness in it, then the idioms their code uses, each with a worked example from Alaap, MockFlow-AI or Kitaru.", "items": [{"q": "Walk me through your experience with Python.", "short": "Your Python experience", "tests": "Real, sustained Python work, told at the depth of someone who has shipped it.", "probes": ["What's the most serious Python system you've built?", "Have you shipped Python services, or only research code?", "How do you structure a larger Python codebase?", "What do you test, and how?"], "a": ["I've been writing Python since my undergrad, so about six years, and it's where most of my research, ML and service work has lived. My day job at alfred_ is TypeScript, so I'd put it as: TypeScript is what I've shipped most recently, Python is what I've built the most in.", "On the service side, at UIC I built Python APIs on Postgres handling over a million records, with auth middleware, and an audio inference API at 150 milliseconds p95 using INT8 quantisation. At WheelPrice the analytics backend was FastAPI with an XGBoost churn model behind it.", "On the systems side, MockFlow-AI is a real-time voice interview platform in Python on LiveKit Agents: a worker subprocess per session, a state machine the model can only move through by calling a tool, async timers as a safety net, and under 400 milliseconds end to end.", "And Alaap is the one I'd point you to for how I write Python now: a research system that turns a text description into a persistent voice, with two speech engines behind one interface, licence rules enforced in code rather than in docs, and 114 invariant tests. The habit it taught me is to assert a property before I read a result, because a suspiciously good number is usually a bug in the setup."], "swaps": [{"when": "If they ask for the most serious one", "line": "Alaap. Two engines behind one interface, identities that always store a vector, a seed clip and a backend version, and 114 tests that check invariants rather than outputs."}, {"when": "If they ask about services versus research code", "line": "Both. The UIC APIs and the FastAPI backend were services people used; MockFlow-AI runs a worker process per live session; Alaap is research code held to service rules."}], "land": "About six years of Python, from services to real-time voice to a research system held to production rules.", "parts": [{"title": "The projects, and what each proves", "items": ["**UIC research lab:** Python APIs on Postgres, over a million records, auth middleware; an audio inference API at 150 ms p95 via INT8. Proves: services.", "**WheelPrice:** FastAPI analytics backend, an ETL from raw events, an XGBoost churn model. Proves: data and APIs.", "**MockFlow-AI:** Flask plus LiveKit Agents, Deepgram, OpenAI, a per-session worker subprocess, an FSM driven by tool calls, async fallback timers, sub-400 ms. Proves: async and real-time.", "**SnakeAI-MLOps:** PyTorch training, exported with TorchScript and run in a C++ game loop. Proves: the Python-to-production boundary.", "**Alaap:** description to persistent voice; two engines behind one interface; `public_servable` enforced in code; 114 invariant tests; every number from a run you can repeat. Proves: design and testing discipline."]}, {"title": "How to say it like a senior engineer", "items": ["Lead with systems and the decisions in them, not libraries. 'Two engines behind one interface' says more than 'I know PyTorch'.", "Name one habit, not a list: assert the property before reading the result.", "Be plain that TypeScript is your most recent daily language; the Python depth is real and the patterns carry over."]}], "id": "q-walk-me-through-your-experience-with-python"}, {"q": "Why do you like Python?", "short": "Why Python", "tests": "Taste, and whether you know its weak spots.", "probes": ["What don't you like about it?", "When would you not use Python?", "How is it different from TypeScript for you?"], "a": ["Mostly because it's the shortest path from an idea to a measured result. In Alaap I could go from 'does the speaker change what's said?' to a test that answers it in an afternoon, and the whole ML and agent ecosystem lives there: PyTorch, Pydantic, FastAPI, PydanticAI, LangGraph.", "I also like that it lets you add rigour where it pays. A notebook-grade script and a typed, tested library can be the same language; you put Pydantic at the edges, Protocols on the interfaces, strict typing on the core, and leave the glue light.", "And decorators and context managers make frameworks feel native. Something like `@flow` and `@checkpoint` reads like plain Python, which is exactly what you want in a developer tool.", "What I don't love is packaging. In Alaap the two speech engines needed conflicting dependency pins, so each lives in its own environment. And the GIL means CPU-heavy work needs processes, not threads. Both are manageable if you design for them from the start."], "swaps": [{"when": "If they ask when you wouldn't use it", "line": "A hot loop that has to be fast and predictable. That's why SnakeAI trained in PyTorch but ran inference in C++ through TorchScript."}, {"when": "If they ask how it compares with TypeScript", "line": "Same ideas, different defaults. TypeScript checks shapes at compile time and needs zod at runtime; Python checks nothing unless you ask, and Pydantic plus a type checker gives you both."}], "land": "The shortest path from an idea to a measured result, with rigour added exactly where it pays.", "parts": [{"title": "What to have ready", "items": ["One reason tied to a project (Alaap: idea to measured result in an afternoon).", "One weakness you've actually hit (conflicting pins; the GIL) and how you designed around it.", "One reason it suits their product: decorators like `@flow` and `@checkpoint` read like plain Python."]}], "id": "q-why-do-you-like-python"}, {"q": "How would you build your eval harness in Python, and what would change?", "short": "Your harness, in Python", "tests": "Design in Python at depth, and knowing what differs from TypeScript.", "probes": ["What are the main types?", "How do you swap the provider?", "How do you run cases concurrently?", "What changes from your TypeScript version?", "Would you build it on Kitaru?"], "a": ["The shape wouldn't change: the provider boundary, a world per case, assertions from the world. What changes is how Python lets me express each piece.", "The provider interface becomes a Protocol, so the Gmail adapter and the SQLite adapter both satisfy it without inheriting anything, and the type checker proves the fake matches the contract. Cases, worlds and assertions become Pydantic models, so a bad case fails when it's loaded, not halfway through a run.", "Each case gets a fresh copy of the base SQLite file, and a context manager sets the case id in a contextvar and tears everything down, even on an exception. The runner is asyncio with a TaskGroup and a Semaphore, because the work is waiting on model calls, and anything CPU-heavy goes to a process pool.", "And honestly, the part I'd most like to change is the flag. In Python I'd hook the framework's tool execution the way Kitaru's adapter does, and let the SQLite world be one more way a tool call can be answered."], "swaps": [{"when": "If they ask what changes from TypeScript", "line": "Interfaces become Protocols, zod becomes Pydantic, the async model is the same, and CPU work moves to processes because of the GIL. The design doesn't change; the idioms do."}, {"when": "If they ask whether you'd build it on Kitaru", "line": "Yes. Recording and replay are already there; I'd add the world as a resolver behind the adapter, so a miss can be answered by the world instead of failing."}], "land": "Same design; in Python it's Protocols, Pydantic, a context manager per case and an asyncio runner.", "parts": [{"title": "1. The contract: a Protocol", "code": "from typing import Protocol\n\nclass MailProvider(Protocol):\n    def search(self, query: str, limit: int = 20) -> list[\"Thread\"]: ...\n    def send(self, to: list[str], subject: str, body: str,\n             thread_id: str | None = None) -> \"Message\": ...\n\nclass GmailProvider:          # production: calls the Gmail API\n    def search(self, query, limit=20): ...\n    def send(self, to, subject, body, thread_id=None): ...\n\nclass SqliteMailProvider:     # harness: reads and writes the snapshot\n    def __init__(self, db): self.db = db\n    def search(self, query, limit=20): ...\n    def send(self, to, subject, body, thread_id=None): ...", "after": ["Neither class inherits from MailProvider; they satisfy it by shape, and mypy or pyright checks that both do."]}, {"title": "2. The data: Pydantic models", "code": "from pydantic import BaseModel\n\nclass Assertion(BaseModel):\n    table: str                 # e.g. \"tasks\"\n    where: dict[str, str]      # e.g. {\"source_message_id\": \"m_41\"}\n    expect_count: int          # four action items -> 4 rows\n\nclass Case(BaseModel):\n    case_id: str\n    intent: str                # \"todo list from an email\"\n    world_version: str\n    user_turns: list[str]\n    assertions: list[Assertion]"}, {"title": "3. One world per case: a context manager", "code": "import shutil, sqlite3\nfrom contextlib import contextmanager\nfrom contextvars import ContextVar\n\ncurrent_case: ContextVar[str] = ContextVar(\"current_case\")\n\n@contextmanager\ndef case_world(case, base_path, tmp_dir):\n    path = tmp_dir / f\"{case.case_id}.sqlite\"\n    shutil.copy(base_path, path)          # fresh copy: writes never leak\n    token = current_case.set(case.case_id)\n    db = sqlite3.connect(path)\n    try:\n        yield db\n    finally:\n        db.close()\n        current_case.reset(token)"}, {"title": "4. The runner: asyncio", "code": "import asyncio\n\nasync def run_bench(cases, run_case, limit=8):\n    sem = asyncio.Semaphore(limit)           # respect model rate limits\n\n    async def one(case):\n        async with sem:\n            async with asyncio.timeout(300):  # a stuck case can't hang the run\n                return await run_case(case)\n\n    async with asyncio.TaskGroup() as tg:     # one failure cancels the rest\n        tasks = [tg.create_task(one(c)) for c in cases]\n    return [t.result() for t in tasks]", "after": ["If one case failing should not stop the others, catch inside `one()` and return a failed result instead."]}, {"title": "5. What changes from TypeScript", "items": ["Interfaces become Protocols; zod becomes Pydantic; the async model is the same.", "CPU-heavy scoring moves to a ProcessPoolExecutor because of the GIL.", "Workers are Python processes claiming runs from Postgres, not edge functions.", "Property tests with Hypothesis become cheap: 'the world after a case never differs from the base except where the agent wrote'."]}], "id": "q-how-would-you-build-your-eval-harness-in-python-and-what-wou"}, {"q": "How would you implement a @checkpoint decorator?", "short": "A @checkpoint decorator", "tests": "Decorators, and whether you understand what their primitives do.", "a": ["Wrap the function with functools.wraps so its name and signature survive. On each call, build a key from the function's qualified name and a hash of its canonical arguments.", "If this run is a replay and that key has a recorded result, return it without running the body. Otherwise run it, persist the result, and return it. Record exceptions too, so a replayed failure fails the same way.", "Two details: if the wrapped function is async, return an async wrapper, checked with inspect.iscoroutinefunction; and carry the current run or replay id in a contextvar rather than a global, so concurrent runs don't see each other's state."], "land": "Key by name and canonical arguments; replay returns the stored result; record failures; async-aware; a contextvar for the run.", "parts": [{"title": "Example: checkpointing Alaap's renders", "lead": "A five-line Alaap scene takes about four minutes on one GPU. With each line checkpointed, changing line 4 re-renders only line 4.", "code": "import functools, hashlib, inspect, json\nfrom contextvars import ContextVar\n\nreplaying: ContextVar[bool] = ContextVar(\"replaying\", default=False)\nrecorded: dict[str, object] = {}     # stands in for the recording store\n\ndef _key(fn, args, kwargs) -> str:\n    raw = json.dumps([args, kwargs], sort_keys=True,\n                     separators=(\",\", \":\"), allow_nan=False)\n    return f\"{fn.__qualname__}:{hashlib.sha256(raw.encode()).hexdigest()}\"\n\ndef checkpoint(fn):\n    if inspect.iscoroutinefunction(fn):\n        @functools.wraps(fn)\n        async def async_wrapper(*args, **kwargs):\n            key = _key(fn, args, kwargs)\n            if replaying.get() and key in recorded:\n                return recorded[key]\n            result = await fn(*args, **kwargs)\n            recorded[key] = result\n            return result\n        return async_wrapper\n\n    @functools.wraps(fn)\n    def wrapper(*args, **kwargs):\n        key = _key(fn, args, kwargs)\n        if replaying.get() and key in recorded:\n            return recorded[key]\n        result = fn(*args, **kwargs)\n        recorded[key] = result\n        return result\n    return wrapper\n\n@checkpoint\ndef render_line(identity_id: str, text: str, rate: float = 1.0) -> str:\n    ...  # minutes of GPU time; returns the path of the rendered clip", "after": ["`allow_nan=False` makes NaN or infinity raise instead of hashing: the same rule Kitaru's cache key follows.", "The key is exact, like Kitaru's: change one character of the text and it misses. That's the divergence problem in miniature."]}, {"title": "What they'd probe", "items": ["Exceptions: store the exception type and message under the key, and re-raise on replay.", "Serialisation: the return value must round-trip, so Pydantic models or JSON, never live objects like a DB connection.", "Side effects inside the body run only on the first call: exactly what you want for a replay, and exactly why a checkpoint must wrap the effect, not the caller."]}], "id": "q-how-would-you-implement-a-checkpoint-decorator"}, {"q": "What goes wrong in async agent code, and how do you handle it?", "short": "asyncio pitfalls", "tests": "Real asyncio, not syntax.", "a": ["The classic one is a blocking call inside the event loop, like a sync HTTP client or a heavy parse, which stalls every other task. Move it to asyncio.to_thread or use an async client.", "Then errors in fan-out: with gather, one failure can leave the others running unobserved; in 3.11, TaskGroup cancels the siblings and raises them together. Timeouts with asyncio.timeout, and a Semaphore to cap concurrency against a provider's rate limit.", "And cancellation: CancelledError must be allowed to propagate, and cleanup belongs in finally, or a cancelled replay leaves a subprocess or a connection behind."], "land": "Never block the loop; TaskGroup for fan-out; timeouts and a Semaphore; let cancellation through and clean up in finally.", "parts": [{"title": "Example: MockFlow-AI's fallback timer", "lead": "Each interview stage ends when the model calls transition_stage(). A background timer forces the transition if the stage runs too long, and must be cancelled if the stage ends first.", "code": "import asyncio, contextlib\n\nasync def run_stage(stage, session):\n    async def fallback_timer():\n        await asyncio.sleep(stage.time_limit_s)\n        await session.force_transition(reason=\"time limit\")\n\n    timer = asyncio.create_task(fallback_timer())\n    try:\n        await session.converse(stage)   # returns when the model calls transition_stage()\n    finally:\n        timer.cancel()                  # the stage ended first: stop the timer\n        with contextlib.suppress(asyncio.CancelledError):\n            await timer", "after": ["The `finally` matters: if the user disconnects and `converse` raises, the timer still gets cancelled instead of firing into a dead session."]}, {"title": "Example: replaying a Kitaru cohort concurrently", "code": "async def replay_cohort(sessions, replay, limit=8):\n    sem = asyncio.Semaphore(limit)\n\n    async def one(s):\n        async with sem:                      # cap concurrency: rate limits\n            async with asyncio.timeout(120):  # one stuck session can't hang the run\n                return await replay(s)\n\n    async with asyncio.TaskGroup() as tg:\n        tasks = [tg.create_task(one(s)) for s in sessions]\n    return [t.result() for t in tasks]"}, {"title": "The pitfalls, in a line each", "items": ["A sync call in async code blocks everything: `await asyncio.to_thread(parse, blob)`.", "`gather` without care leaves failures unobserved; `TaskGroup` cancels siblings and raises together.", "Swallowing `CancelledError` breaks cancellation; catch it only to clean up, then re-raise.", "CPU-bound work doesn't speed up with asyncio; use a process pool."]}], "id": "q-what-goes-wrong-in-async-agent-code-and-how-do-you-handle-it"}, {"q": "How would you model tool policies, or Alaap's inputs, in Pydantic?", "short": "Pydantic models", "tests": "Pydantic v2, and their own domain.", "a": ["For Kitaru's tool policies, a discriminated union: each policy is its own model with a Literal type field, passthrough, history or static, and the parent says which to pick with Field(discriminator='type').", "Validation then happens once, at the edge: a bad policy fails when the config is loaded, with a clear message, not deep inside a replay. And the same models generate the API schema, so the docs can't drift from the code.", "In Alaap it's the same idea for inputs: the speaking rate is clamped to the range we measured, 0.67 to 1.43 times normal, in a validator, so no caller can ask for a rate where identity falls apart."], "land": "A discriminated union on a Literal type field; validators hold the rules; validate at the edge; the schema comes for free.", "parts": [{"title": "Example: Kitaru's tool policies", "code": "from typing import Annotated, Literal, Union\nfrom pydantic import BaseModel, Field\n\nclass Passthrough(BaseModel):\n    type: Literal[\"passthrough\"] = \"passthrough\"\n\nclass History(BaseModel):\n    type: Literal[\"history\"] = \"history\"\n    scope: Literal[\"baseline\", \"agent\", \"cohort_version\"] = \"baseline\"\n\nclass Static(BaseModel):\n    type: Literal[\"static\"] = \"static\"\n    cases: list[dict]\n\nPolicy = Annotated[Union[Passthrough, History, Static], Field(discriminator=\"type\")]\n\nclass ToolPolicy(BaseModel):\n    tool_name: str\n    policy: Policy\n\nToolPolicy.model_validate({\"tool_name\": \"search_crm\",\n                           \"policy\": {\"type\": \"history\", \"scope\": \"agent\"}})", "after": ["A `{\"type\": \"histroy\"}` typo fails at load with a message naming the allowed values, instead of silently falling back to passthrough."]}, {"title": "Example: Alaap's direction and identity", "code": "from pydantic import BaseModel, field_validator\n\nclass Direction(BaseModel):\n    rate: float = 1.0\n    emotion: str | None = None\n\n    @field_validator(\"rate\")\n    @classmethod\n    def clamp_rate(cls, v: float) -> float:\n        return min(max(v, 0.67), 1.43)   # the measured range where identity holds\n\nclass Identity(BaseModel):\n    vector: list[float]\n    seed_clip: str          # always both: a vector and a seed clip\n    backend_version: str\n    public_servable: bool", "after": ["Clamping rather than rejecting is a product choice: callers get the nearest safe rate. Say which you'd pick and why."]}], "id": "q-how-would-you-model-tool-policies-or-alaap-s-inputs-in-pydan"}, {"q": "How would you define the provider interface in Python?", "short": "Protocols for the adapter", "tests": "Typing, tied to your own swap.", "a": ["With typing.Protocol: a MailProvider protocol with search and send, and their signatures. The production adapter and the SQLite adapter both satisfy it structurally, without inheriting from anything.", "The type checker then proves the harness implementation matches the contract the tools depend on. It's the Python version of what I did with TypeScript interfaces at alfred_, and it's exactly how Alaap puts two speech engines behind one interface."], "land": "A Protocol is the contract; production and harness both satisfy it, and the type checker proves it.", "parts": [{"title": "Example: Alaap's two engines behind one interface", "lead": "English renders on Qwen3-TTS (Apache-2.0); Hindi, Bengali and Tamil on Indic-Mio, which is research-only. The rule 'public_servable is enforced in code' lives at the interface. Names are illustrative.", "code": "from typing import Protocol\n\nclass Renderer(Protocol):\n    backend_version: str\n    public_servable: bool\n    def render(self, identity: \"Identity\", text: str,\n               direction: \"Direction\") -> bytes: ...\n\nclass QwenRenderer:                 # English\n    backend_version = \"qwen3-tts-1.7b\"\n    public_servable = True\n    def render(self, identity, text, direction) -> bytes: ...\n\nclass IndicMioRenderer:             # Indian languages, research-only\n    backend_version = \"indic-mio+miocodec\"\n    public_servable = False\n    def render(self, identity, text, direction) -> bytes: ...\n\ndef render_public(r: Renderer, identity, text, direction) -> bytes:\n    if not r.public_servable:\n        raise PermissionError(f\"{r.backend_version} is research-only\")\n    return r.render(identity, text, direction)", "after": ["A new engine only has to match the shape; nothing registers it, and the checker catches a wrong signature."]}, {"title": "Protocol or ABC?", "items": ["A Protocol checks shape, which suits adapters you don't own, like a framework's classes or a third-party client.", "An ABC enforces inheritance and can share code; use it when you own every implementation and want a base behaviour.", "Add `@runtime_checkable` only if you need `isinstance` at runtime; it checks method names, not signatures."]}], "id": "q-how-would-you-define-the-provider-interface-in-python"}, {"q": "Where do context managers and generators earn their place?", "short": "Context managers and generators", "tests": "Idiomatic Python.", "a": ["A context manager whenever something must be set up and always torn down: a replay session that sets the replay id in a contextvar and resets it, a case's copy of the world, or a GPU model that has to be freed. contextlib.contextmanager makes each a few lines.", "Generators when you'd otherwise load everything into memory: yield the nodes of a big session one at a time while importing it, or yield audio in small chunks to a stream. Async generators do the same for events flowing out of a run to a UI."], "land": "Context managers for setup and guaranteed cleanup; generators to stream instead of loading.", "parts": [{"title": "Example: Alaap on a 6 GB GPU", "lead": "Only one speech engine fits in memory at a time, so loading and freeing it has to be guaranteed, even when a render fails.", "code": "from contextlib import contextmanager\nimport torch\n\n@contextmanager\ndef loaded(engine_cls, device=\"cuda\"):\n    engine = engine_cls.load().to(device)\n    try:\n        yield engine\n    finally:\n        del engine\n        torch.cuda.empty_cache()     # free VRAM before the next engine loads\n\nwith loaded(QwenEngine) as tts:\n    clip = tts.render(identity, \"Where were you last night?\", direction)"}, {"title": "Example: a replay session (Kitaru-style)", "code": "from contextvars import ContextVar\n\ncurrent_replay: ContextVar[str | None] = ContextVar(\"current_replay\", default=None)\n\n@contextmanager\ndef replay_session(replay_id: str):\n    token = current_replay.set(replay_id)   # visible to every tool call in this task\n    try:\n        yield\n    finally:\n        current_replay.reset(token)         # never leaks into the next run", "after": ["A contextvar, not a global: each asyncio task sees its own value, so concurrent replays don't cross."]}, {"title": "Example: streaming audio (MockFlow-AI)", "code": "def chunks(pcm: bytes, size: int = 3200):\n    # 3200 bytes = 100 ms of 16 kHz, 16-bit mono audio\n    for i in range(0, len(pcm), size):\n        yield pcm[i:i + size]", "after": ["Streaming in small chunks is part of how a voice reply starts playing before it has finished generating."]}], "id": "q-where-do-context-managers-and-generators-earn-their-place"}, {"q": "How would you package an SDK with adapters for many framewo
