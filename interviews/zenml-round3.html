 orchestration. 5,000-plus subscribers. A long account of working memory: one data model for work items that email, Slack and meeting notes reconcile into. Then the whole bench: scanner, calibrated judge, similar tasks across users, one SQLite snapshot per task, the harness flag."], "verdict": "partly", "why": "The content was right and specific, but it ran over three minutes with filler, and the bench detail arrived before they asked for it.", "good": ["Concrete ownership: eval, memory, orchestration.", "A real number: 5,000-plus subscribers.", "Working memory explained through your own project, a good hook for later."], "bad": ["Over three minutes; the first answer sets the pace for ninety.", "Filler: 'so to say', 'essentially', 'in a lot of degree'.", "You spent the bench story on the opener, so later answers repeated it."], "approach": ["Three sentences: what alfred_ is with one number, what you own, the one piece most relevant to them. Then stop and let them choose where to go.", "Offer the depth as a choice: 'I can go into the eval bench or the memory work, whichever is more useful.'"], "say": ["I'm a founding engineer at alfred_, an AI executive assistant over email, calendar and work apps, with 5,000-plus active users. I own making the agent reliable in production: the eval infrastructure, the memory architecture, and the orchestration underneath.", "Right now it's working memory: one model for every open work item, which email, Slack and meeting notes all reconcile into, so the agent can answer 'what's open today' from one place.", "The part closest to Kitaru is the eval bench I built: real production failures replayed against new agent versions, with tools answered from a snapshot of the user's world. Happy to go into either."], "ref": "#say-intro", "land": "Three sentences: what alfred_ is with one number, what you own, and the one piece closest to their work. Then stop."}, {"id": "x2", "label": "What pass through means", "who": "Alex", "q": "You said that if the agent calls a tool that isn't in the snapshot, you send an error or a pass through. What does pass through mean in your harness? Does that call hit Gmail for real, and how would you know afterwards?", "tests": "Provenance. Can a reader of your results tell recorded from live, or invented?", "said": ["It never leaves the machine. The agent gets an empty result back, with an indication that it's the wrong tool; those calls are marked so the snapshot can be enriched."], "verdict": "partly", "why": "'Never leaves the machine' is the right first sentence. The empty result is the problem, and you described it as a feature.", "good": ["Clear that nothing reaches a live provider.", "You mark out-of-snapshot calls, which is the start of provenance."], "bad": ["Earlier you said 'error or pass through', here 'empty result with an indication', later 'no error, just null'. Three versions of one behaviour.", "An empty result is a plausible answer, so the agent can act on it as a fact."], "approach": ["Answer the literal question first: no, it cannot reach Gmail, because the harness flag routes every provider call to the snapshot.", "Then volunteer the limit in the same breath: 'what the agent gets back is the weak spot.' Interviewers push hardest on what you defend and ease off what you name."], "say": ["It never leaves the machine. With the harness flag on, every provider call goes to the snapshot, so there is no path to Gmail at all.", "What the agent gets back is the weak spot, honestly. Today a call outside the snapshot returns an empty result, and every such call is logged against the run. An empty result is a plausible answer, though. The agent can read it as 'there are no meeting notes', which is the harness telling it something false.", "What I'd do instead: return an explicit 'not in this snapshot' error the agent can't mistake for data, and treat any run that hit one as harness-limited, not as a pass or a fail."], "figs": ["harnessSeam"], "land": "It cannot reach Gmail. What it gets back is the weak spot, and I'd make that an explicit error."}, {"id": "x3", "label": "The empty result is a lie", "who": "Hamza", "q": "In production there probably were notes, so the harness taught the agent something false and it acted reasonably on it. How does your scoring tell 'the agent made a bad call' from 'the agent made a good call on a lie the harness told it'?", "tests": "Do you own your harness's failure modes, or defend them?", "said": ["Out-of-snapshot calls are marked. With rich enough aggregation it rarely happens; I haven't seen it. The north star is tool calls per completed task, and irrelevant calls add latency."], "verdict": "missed", "why": "You answered a different question (how often), then moved to the metric. 'I haven't seen it' reads as 'I never looked', which is the opposite of the signal you want.", "good": ["You do mark the calls, which is the raw material for a real answer."], "bad": ["'I have not seen it': rare is not the same as measured.", "Went sideways to the north-star metric instead of down into the scoring.", "Missed the chance to connect it to Kitaru's provenance gap, the critique you plan to make."], "approach": ["Agree with the premise out loud: 'you're right, those two runs look identical in the output.'", "Then the mechanism: mark the node, keep marked runs out of the headline number, and look at them separately.", "Close by tying it to their world: it's the same problem as a passthrough node without a mocked mark. That turns a weakness into your strongest critique."], "say": ["You're right, in the output those two runs look identical, and today my metric can't tell them apart on its own.", "What I have is the mark: every call outside the snapshot is logged against the run. The fix I'd make is to use it in scoring. A run that touched an out-of-snapshot call is harness-limited, so it's excluded from the headline number and goes to a separate list, and that list is the backlog for enriching the snapshot.", "It's the same problem as a passthrough node in Kitaru that carries no mocked mark: a reader can't tell a recorded answer from an invented or live one. In both systems every answer should carry how it was served."], "figs": ["kitaruPolicy"], "prep": "A tool the snapshot doesn't cover", "land": "Those runs look identical today. Marked runs leave the headline number, and it's Kitaru's provenance gap in my own harness.", "prepId": "q-a-tool-the-snapshot-doesn-t-cover-what-does-the-agent-get-ba"}, {"id": "x4", "label": "What counts as done", "who": "Hamza", "q": "An agent that gets your empty set and wraps up confidently has used fewer calls, so on your metric it looks more efficient. Who decides 'completed'? An assertion against the snapshot, a judge, something else? Be concrete.", "tests": "Is your headline metric gameable, and do you know how?", "said": ["Completion means the task was done: the email found and the todo list created. Failed runs are a separate class that is tracked."], "verdict": "partly", "why": "True but generic. He asked for the mechanism and got the definition, so it took another question to reach the real answer.", "good": ["Failed runs are counted separately, not averaged in."], "bad": ["No mechanism: who or what decides 'done'.", "Did not say that calls per task is only computed over runs that pass, the one fact that answers his worry."], "approach": ["When told 'be concrete', give one worked example with the check named: which rows the assertion reads, what it expects.", "Then show you know the metric's blind spot and what sits next to it.", "Structure behind it: requirements, what is frozen, how it runs, how it is scored. Outcome and final state come before trajectory."], "say": ["Deterministic assertions against the snapshot decide it. For 'make a todo list from this email', the snapshot knows which email is the right one and what its action items are, so the run passes if the agent read that email and the created tasks match those items.", "More generally, pass or fail is the final state against a goal state, not the path: two runs can take different routes to the same right result, and both pass. The path is scored separately.", "Tool calls per completed task is only computed over runs that pass those assertions, so an agent that wraps up early on an empty result doesn't get a better number, it gets a failed run. We moved 2.5 to 2.2 on that metric for the same outcomes.", "On its own it would reward guessing over clarifying, which is why it sits next to a count of false completion claims."], "figs": ["completeness"], "prep": "What makes a run count as done", "land": "Assertions against the snapshot decide done, and the efficiency metric only counts runs that pass.", "prepId": "q-what-makes-a-run-count-as-done-and-how-is-it-scored"}, {"id": "x5", "label": "Four items, three created", "who": "Alex", "q": "The email has four action items. The agent creates a todo list with three. Pass or fail, and what piece of code or which model makes that call?", "tests": "Completeness, and whether you have the refunds lesson ready.", "said": ["A pass for the completion metric. Ground truth per instance is known, so completeness is a second, orthogonal score, and three of four is measured there. Judging has moved to Claude Code."], "verdict": "partly", "why": "The two-score design is right. But 'pass' for a todo list missing an item is the refunds bug you already fixed, and you didn't use that story.", "good": ["Ground truth held per instance: the strongest part of your design.", "Separating completion from completeness."], "bad": ["Called it a pass; for an enumerable answer, a missing item should fail the assertion.", "Didn't reach for the refunds story, which is exactly this case with a real outcome.", "Said the judge is Claude Code without saying which parts are assertions and which are judged."], "approach": ["Decide first: enumerable or not. Four action items is a set you can count, so it is an assertion, not a judgement.", "Then the story that proves you learned it the hard way: the ledger that left out two refunds."], "say": ["It fails, and code decides it, not a model. Action items are enumerable: the snapshot knows there are four, so the case asserts that all four appear. Three of four is a fail on that assertion, and a 0.75 on the completeness score we track across the bench.", "We learned that the hard way. A ledger request produced a clean, well-formed ledger that left out two refunds, and every surface check passed. After that, anything enumerable from the fixture is asserted against it.", "A model only judges what can't be counted, like whether a meeting brief is useful, and those cases stay out of automated gating."], "figs": ["completeness"], "ref": "#say-refunds", "prep": "What makes a run count as done", "land": "Enumerable means asserted: three of four fails, and the refunds bug is why.", "prepId": "q-what-makes-a-run-count-as-done-and-how-is-it-scored"}, {"id": "x6", "label": "Did the judge move?", "who": "Alex", "q": "Claude Code judging on Tuesday and Claude Code judging on Friday won't always agree. How do you know the judge didn't move when your pass rate moves?", "tests": "Is the judge measured, or trusted?", "said": ["No calibration yet for the completeness judge; the harness is local and it's my gut. Ground truth stays fixed. The bench reruns on tool, agent or subtask changes, and the reconciler appends new production cases."], "verdict": "partly", "why": "The honesty landed. But in your intro you said the judge was calibrated, so without naming two judges it sounded like a contradiction.", "good": ["'No calibration yet, it's my gut' is exactly the kind of limit they respect.", "Ground truth fixed across runs."], "bad": ["Two judges, one word: the scanner's judge is calibrated, the completeness judge is not. Say which.", "No concrete way to detect drift, and there is a cheap one."], "approach": ["Separate the two judges in your first sentence.", "Then one mechanism that detects judge drift without new labels: re-judge frozen outputs.", "Add pass^k when they push on noise: for a gating case, report whether it passes every time in k runs, not once."], "say": ["There are two judges, and they're in different states. The scanner's judge, which decides whether a production flag is a real bug, is calibrated: weekly against fresh human labels, about three in four agreement.", "The completeness judge on the bench isn't calibrated yet. Where the answer is enumerable I've replaced it with assertions, so it only judges what can't be counted.", "To tell judge drift from agent change I'd keep a frozen set of past outputs and re-judge it whenever the judge's model or prompt changes. The outputs didn't change, so if the verdicts moved, the judge moved. And the judge's model and prompt are pinned per bench run."], "figs": ["passk"], "prep": "How do you decide what becomes an eval case", "land": "Two judges: the scanner's is calibrated, the completeness one is not yet. Re-judge frozen outputs to catch drift.", "prepId": "q-how-do-you-decide-what-becomes-an-eval-case-and-is-the-judge"}, {"id": "x7", "label": "A better prompt misses everything", "who": "Hamza", "q": "A customer imports a few hundred Langfuse traces, improves the system prompt, and the agent now searches the CRM with a cleaner query. Every search misses the recording; with on_miss set to fail, half the cohort dies. 'Your tool punishes me for improving my agent.' What do we build?", "tests": "Product judgement on their central problem. They argue about this internally.", "said": ["A fake or mock world, maybe a simulated user, but I'd rather not go into that. A read-tool policy that executes against the user's environment if they provide one. Not exactly sure."], "verdict": "gap", "why": "You jumped to the biggest idea, simulation, and backed away from it. The answer was on your Prep tab.", "good": ["Splitting reads from writes is the right instinct; it just came out as an afterthought."], "bad": ["Started with the hardest option and then declined to discuss it.", "No order: what first, what next, what last.", "'Not exactly sure' before trying the smallest version."], "approach": ["Say the reframe first: a miss is information, the agent's behaviour changed. That buys you ten seconds and shows judgement.", "Then build up in order of cost: the miss experience (diff and accept), then policy by effect (reads, writes), then the world model for the few sessions that fork.", "If you blank, say 'let me start with what the user sees' and describe the screen.", "Say what you would not rebuild: the runner, the sandbox and the replay layer work. Your value is the layer above: production traces into cases, stateful environments, outcome and policy scoring."], "say": ["First, a miss is information: it means the agent's behaviour changed, which is what they were measuring. So the goal isn't to avoid misses, it's to stop a miss from killing the run and make it cheap to resolve.", "The first thing I'd build is the miss experience. Show the recorded call next to what the new agent sent. If they're equivalent, one action accepts it and writes a static alias, so the next replay hits. It's deterministic and auditable, and every accepted pair is labelled data for matching later.", "Second, policy by effect. A read that misses can fall through to the customer's own environment, marked live on the node. A write that misses fails closed on a fork, never passthrough.", "And the honest limit: that fixes rephrasing, not an agent that takes a different path. For those few sessions, promote the trace into a small queryable world, which is what my bench does. The common case stays free."], "figs": ["missFlow", "kitaruKey"], "ref": "#say-miss", "prep": "A better prompt misses every recording", "land": "A miss is information. Make it cheap to resolve, then split reads from writes, then a world for the few sessions that fork.", "prepId": "say-miss"}, {"id": "x8", "label": "What the screen shows", "who": "Alex", "q": "Forget the perfect system. Tomorrow morning the customer sees half the runs died. What should that screen show them, so the miss is useful instead of a red X?", "tests": "Can you think like the user, concretely?", "said": ["The recorded call against what the agent did. Then last-turn replay, a stateful world across turns, a simulated user. Not really sure."], "verdict": "gap", "why": "Your first sentence was the answer. Then you recited the multi-turn options, which were answering a different question.", "good": ["'The recorded call against what the agent did' is exactly right."], "bad": ["Kept talking after the right answer, into material from another question.", "Nothing about what the user can do on that screen."], "approach": ["When your first sentence is right, stop and build on it: what is on the screen, what can they do there.", "Think of one row per miss, grouped, because a few hundred red rows is not usable."], "say": ["The misses grouped by tool, with a count, so they see '140 misses on search_crm' rather than 140 red rows.", "Open one and it's a diff: the recorded arguments next to what the new agent sent, the recorded result under it, and where in the session it happened.", "And on that row, the actions: accept as equivalent, which maps the new arguments to the recorded result; run this one call live, marked as live; or leave it failed. Accept applies to the whole group, so one decision clears the 140."], "figs": ["missFlow"], "land": "Misses grouped by tool, the recorded call next to what the agent sent, and the actions on that row."}, {"id": "x9", "label": "Which button", "who": "Hamza", "q": "The customer looks at the diff and says 'yes, those are the same search, just phrased better.' What button do they press, and what does it change for the next replay?", "tests": "Can you land a design all the way down to data?", "said": ["It would play out, but I'm not really sure and a bit lost."], "verdict": "gap", "why": "This is the static alias, the last step of your own miss script.", "good": [], "bad": ["No attempt at the mechanism. Even a rough one ('we remember the mapping') beats 'I'm lost'."], "approach": ["Name the button, then the data it writes, then what the next replay does with it. Three sentences.", "If you blank, buy time honestly: 'give me a second', then start from 'the next replay needs to hit, so something has to map the new call to the old result.'"], "say": ["'Accept as equivalent.' It writes a static alias for that tool: these new arguments map to that recorded call's result, scoped to this cohort.", "On the next replay the lookup checks the alias before it misses, so those calls hit, and the node is stamped 'served by alias' so nobody mistakes it for an exact match.", "And every accepted pair is a labelled example of 'different arguments, same meaning', which is what you'd need to train or tune fuzzy matching later, and test it in shadow first."], "figs": ["missFlow"], "prep": "The customer says the two searches are the same", "land": "Accept writes a static alias; the next replay hits, and the node says it was served by alias.", "prepId": "q-the-customer-says-the-two-searches-are-the-same-what-button-"}, {"id": "x10", "label": "Your questions for them", "who": "Hamza", "q": "Before we let you go, what questions do you have for us?", "tests": "Curiosity, and whether you've thought about their business.", "said": ["I'd love to understand the product more, and what you need from a product engineer specifically."], "verdict": "partly", "why": "A fine question, but generic. You have eight prepared ones that show you've read the product.", "good": ["Asking about the role itself is reasonable."], "bad": ["It could be asked of any company.", "Only one question. Ask one, listen, then one more."], "approach": ["Lead with the one that shows you read the source, then one about the role.", "One at a time, then wait."], "say": ["Where do you see Kitaru sitting against observability tools long term: is replay the wedge, or the product?", "And for the role: what would you want someone in this seat to have shipped by the end of the first month?"], "ref": "#ask", "land": "One question that shows you read the product, then one about the role. One at a time."}]}, {"id": "m2", "title": "Mock 2: Hamza and Alex, the full loop", "when": "Monday 28 September 2026, 08:05 to 08:33, 28 minutes", "read": ["Better than mock 1 where it was about you and your system: the story had the right arc, and the SQLite swap came across cleanly enough that Alex said he liked it. Scoping 'Kitaru with a world' to one class of task was a good design instinct.", "Weaker exactly where this seat is different. The current post is built around building in public, and when Hamza asked for your first post you gave a strategy, then 'I don't know', but never a post. The other habit: twice you answered the neighbouring question instead of the one asked. Both are fixable: have one concrete post ready, and when unsure, say so and reason."], "landed": ["The swap: adapters behind the same interface, a canonical model per domain, tool code real.", "Kitaru toward your design: scope to one class first, build the world from traces, recorded answers for reads, writes into the world.", "Honesty about X: you read it, you don't post; LinkedIn and YouTube; never professionally.", "The refunds story, told naturally."], "fix": [{"t": "Have one concrete post ready: the first line and what's on screen. For this seat it's the most important gap.", "ref": "x4"}, {"t": "Answer the exact question. If you haven't hit it, say so and reason it out.", "ref": "x10"}, {"t": "Drop 'specialisation'. Say 'depth in AI infrastructure, breadth in the work'.", "ref": "x2"}, {"t": "Don't credit your ideas to their product; say 'one thing I'd add is...'.", "ref": "x8"}, {"t": "Headline, then stop. Most answers ran two to three minutes with filler.", "ref": "x1"}], "exchanges": [{"id": "x1", "label": "Your story", "who": "Hamza", "q": "I've seen the CV, but tell me the story in your own words. How did you get from where you started to what you're doing at alfred_?", "tests": "Growing ownership, told in about ninety seconds, landing on why this role.", "said": ["UIC research with the healthcare side and the hospital network; WheelPrice as an AI engineer in a two-engineer team with non-technical founders; across the stack, shipping to customers for the first time; alfred_ as founding LLM engineer for deeper AI systems work; eval harness, failure detection, working memory, talking to customers; the common thread; wanting a larger engineering surface with vertical ownership."], "verdict": "partly", "why": "The arc was right and close to your script, but it ran long with filler, and working memory came out as 'a cracker for every work obligation'.", "good": ["The UIC to WheelPrice to alfred_ arc, with ownership growing each time.", "'You have to figure out what's broken, decide what to build, and own it through production.'"], "bad": ["About two minutes; the filler ('so to say', 'let us say') dilutes the strong lines.", "The last lines drifted ('a larger engineering surface') instead of landing on this role."], "approach": ["Say your own script: its last line lands on 'the engineer who needs better tooling'. Then stop."], "land": "Research, then shipping products, then the infrastructure that tells you whether they work.", "say": ["I started out in computer science research at UIC, on applied ML and LLM systems in healthcare, which gave me a strong base in actually building and evaluating these systems.", "Then WheelPrice: two engineers, founders from the business side, so I worked across the stack and shipped things customers used every day.", "Then alfred_, as founding LLM engineer on an AI assistant with 5,000-plus users. My work there is reliability and evaluation: the eval harness, production failure detection, working memory.", "The thread is building AI systems where nobody hands you a defined problem. And I've spent a lot of time as the engineer who needed better tooling for exactly that, which is why Kitaru is a natural next step."], "ref": "#say-intro"}, {"id": "x2", "label": "Why already talking to us", "who": "Hamza", "q": "You joined alfred_ this year, as a founding engineer, on a product you clearly care about. Why are you already talking to us?", "tests": "A pull, not a push, and no red flags.", "said": ["Not urgently leaving; learned a lot; the work is internal to one product. Comparing my harness taught me how it would break at scale and how hard it would be to hand to another company with a similar data model. So I want to work on infrastructure and developer experience, explore selectively, and get specialisation."], "verdict": "partly", "why": "The 'built for one product, I can see where it doesn't generalise' point was your most convincing line. Ending on 'specialisation' contradicted the role.", "good": ["The harness insight: built for one product, you can see where it wouldn't generalise.", "Calm, not defensive."], "bad": ["'Specialisation': the post says this seat is not for specialists.", "'Ship it to our competitors' sounded odd; say 'another team'."], "approach": ["Use your own answer: 'less get away from alfred_, more a direction I want to go deeper into'. Then one line on depth versus breadth."], "land": "Less 'get away from alfred_', more 'a direction I want to go deeper into'.", "say": ["There's nothing wrong at alfred_; I still enjoy the work. But it's internal to one product, and comparing my harness with Kitaru showed me exactly where it wouldn't generalise to another team.", "What I want is to build that infrastructure as the product, for other engineers. Depth in AI infrastructure, and breadth in the work: shipping, talking to users, and showing what we built."], "ref": "#say-leave"}, {"id": "x3", "label": "The public half, honestly", "who": "Hamza", "q": "Some weeks shipping, some weeks writing the thread or recording the demo, some weeks on a call with a team whose agent is on fire. How do you feel about that half, and what have you done in public so far?", "tests": "Will you build in public, and are you honest about where you are?", "said": ["First re-explained specialisation for a while. Then: enthusiastic about public work, active on personal projects; on X as a reader, not a poster; work on LinkedIn; a YouTube channel with demos; never done it professionally, and would love to."], "verdict": "partly", "why": "The honesty landed. The first minute went on re-defending 'specialisation' instead of answering, and there was no plan for X.", "good": ["'I read X, I don't post there': Hamza preferred that to a follower count.", "LinkedIn, YouTube demos, never professionally: all true and clear."], "bad": ["A minute of re-explaining before answering.", "No week-one plan for X, which is what turns the gap into a strength."], "approach": ["Answer first: 'I enjoy it, I read X daily, I post on LinkedIn and YouTube.' Then the gap, then the plan."], "land": "For an open-source developer tool, talking about what you shipped is part of shipping it.", "say": ["Honestly, I enjoy it. I read X every day, it's where the agent builders are, but I post on LinkedIn and on my YouTube channel, where I put demos of what I build.", "What I haven't done is post on X, or do it professionally for a company. So from week one: a thread for every meaningful release, a short demo on real traces, and real replies where people are stuck on evals."], "prep": "The public half", "prepId": "q-the-public-half-x-github-posts-and-demos"}, {"id": "x4", "label": "The first post, strategy", "who": "Hamza", "q": "Say you start on Monday. By Friday you've played with Kitaru. What's the first thing you'd post, and why would an agent builder stop scrolling for it?", "tests": "Taste for builders: a concrete, useful post.", "said": ["I'd find a use case that was helpful to me and related to my previous work, where Kitaru makes it more efficient, and get to the common point within the first minute."], "verdict": "missed", "why": "A strategy, not a post. For this seat, this is the answer they most want to hear concretely.", "good": ["The instinct to start from something real that you felt."], "bad": ["No first line, no demo, no reason to stop scrolling."], "approach": ["Answer with the artefact: the first sentence, what's on screen, how long, and why it's useful. Then the reason."], "land": "A sixty-second before and after on real sessions: the fix, the regression, and why.", "say": ["The first line would be: 'Your agent passed the demo. Here's what happened when I replayed fifty of its real sessions against the new prompt.'", "On screen, a sixty-second recording: a small agent of mine, import its traces, pick the cohort that's failing, mock the tools, change one line of the prompt, replay, and the diff: three sessions fixed, one got worse, and why. Repo linked.", "It stops the scroll because everyone building agents has shipped a prompt change that looked fine and broke something, and this shows the before and after on real sessions in a minute."], "prep": "The public half", "prepId": "q-the-public-half-x-github-posts-and-demos"}, {"id": "x5", "label": "The first post, pushed", "who": "Hamza", "q": "That's the strategy, not the post. Give me the actual thing: the first sentence, and what's in the video or screenshot.", "tests": "Can you get concrete under pressure?", "said": ["I don't know. Maybe something on multi-turn evals: tau-bench scores the end state; figure out how to plug Kitaru into that, since it's more of a replay system today."], "verdict": "partly", "why": "'I don't know' first, then a genuinely good seed (tau-bench, end state) that never became a post.", "good": ["Tau-bench and end-state scoring is a strong, credible topic, and it led Alex into the technical half."], "bad": ["Opening with 'I don't know' when asked twice.", "Still no first line or visual."], "approach": ["If the first idea was weak, give the second as a post: a first line, a picture, a takeaway."], "land": "Score the end state, not the transcript.", "say": ["Second post, then: 'Stop reading agent transcripts. Score the end state.' A screenshot of two runs that took different paths to the same right database state; one passes on transcript matching, both pass on the end state.", "Then how to do that with your own traces: capture the world before, run the agent, diff the world after against a goal. That's what tau-bench gets right, and it's where replay and a small world model meet."]}, {"id": "x6", "label": "What answers a search call", "who": "Alex", "q": "When your agent calls something like 'search my email' during an eval run, what actually happens? Where does that call go, and what answers it?", "tests": "Intercept depth.", "said": ["Each task class has its own SQLite file aggregated from many production instances. In harness mode the agent and tools run as in production; at the third-party API call, an adapter maps it to the SQLite instance. Canonical data models per domain (email, notes, tasks), and each provider merges into them."], "verdict": "landed", "why": "Clear, concrete and correct. Alex said he liked it.", "good": ["Tool code real, only the provider call swapped.", "Canonical model per domain, providers merged into it."], "bad": ["Could have been half as long with the same content."], "approach": ["Lead with the one line: 'An adapter at the provider boundary; in the harness it reads and writes a SQLite world instead of Gmail.'"], "land": "I don't emulate every provider. I emulate the contract the agent actually depends on.", "say": ["The agent and the tool code run exactly as in production. The tool calls a provider interface; in production that's Gmail, in the harness the same interface is backed by an adapter that reads and writes the case's SQLite world.", "The world is a canonical model per domain, email, calendar, tasks, notes, so Gmail, Outlook and IMAP all merge into one shape. I don't emulate every provider; I emulate the contract the agent depends on."], "figs": ["benchAdapter", "benchSchema"], "prep": "How do you actually replace third-party APIs with SQLite", "prepId": "q-how-do-you-actually-replace-third-party-apis-with-sqlite"}, {"id": "x7", "label": "Gmail's query syntax", "who": "Alex", "q": "Gmail search isn't just a keyword. How far did you go in emulating that query language, and what happened when the agent used syntax you hadn't implemented?", "tests": "The edge of the fake.", "said": ["Every query becomes a SQL query over the canonical model; providers have adapters with their differences. The agent calls tools with parameters, not raw queries, so it's easier: there's no third-party call in harness mode."], "verdict": "partly", "why": "The key point landed (the model sends structured parameters, not raw syntax), but the unimplemented-syntax half was never answered.", "good": ["Structured parameters, not raw Gmail syntax: a genuinely good boundary."], "bad": ["The second half of the question went unanswered."], "approach": ["Answer both halves: how far you went, and what happens at the edge."], "land": "The model sends structured parameters, so the fake only has to support the parameters the tool exposes.", "say": ["We didn't emulate Gmail's query language. The model never writes raw syntax; it calls our search tool with structured parameters, sender, dates, labels, and the tool builds the query. So the SQLite adapter only has to support those parameters.", "At the edge, anything the adapter doesn't support should fail loudly, never be ignored. That's the rule I'd hold it to."]}, {"id": "x8", "label": "A parameter the fake doesn't know", "who": "Alex", "q": "Someone adds a has_attachment filter; production supports it, nobody updates the SQLite adapter. What does the SQLite side do with a parameter it doesn't understand?", "tests": "Do fake and real stay in sync, and does drift fail loudly?", "said": ["The harness runs when tool parameters change; attachments live in the canonical model with type and the first 500 characters; an unseen parameter would be flagged and the case fails. Then: your on_miss lets reads pass through, which is the right way."], "verdict": "partly", "why": "The right direction, but the mechanism was unclear, and you credited your own read/write idea to their on_miss, which doesn't split by reads and writes.", "good": ["Running the bench when tool parameters change.", "Attachments in the model with their type and a snippet."], "bad": ["No mechanism for how the drift is caught.", "Misstated their on_miss: passthrough applies to any tool."], "approach": ["Name the mechanism: a shared interface and a parity test. Offer the read/write split as your idea."], "land": "Unknown parameters fail loudly, and a parity test keeps the fake in step with production.", "say": ["It should refuse, not ignore. The SQLite adapter and the production adapter implement the same interface, so an unknown parameter raises 'not supported in this snapshot', and the case is marked harness-limited rather than passing.", "And to catch it before a run: a parity test that sends the same parameters to both adapters against recorded production responses, so adding has_attachment to production without the fake fails in CI.", "One thing I'd add to Kitaru is the same split: let reads fall through on a miss, and fail writes closed."], "figs": ["benchAdapter"]}, {"id": "x9", "label": "Kitaru toward your design", "who": "Alex", "q": "If Kitaru went in your direction, a session gets something like your SQLite world behind it, what would you build? Where does the world come from when all we have is an imported trace?", "tests": "Designing an evolution of their system.", "said": ["Keep replay. Find cases replay can't test faithfully, like long-running tasks. Pick one subclass, email first; retroactively build its world from the traces' tool calls and results; reads fall back to the recording; writes land in the world instance. Specify which agent class needs this first."], "verdict": "landed", "why": "Scoped, incremental and grounded in your own experience.", "good": ["Keep replay as the default.", "One class first, email.", "Reads from the recording, writes into the world."], "bad": ["Missing: entity reconciliation across sessions, provenance on world-answered calls, and 'only for sessions someone forks'."], "approach": ["Add the three missing pieces in one sentence at the end."], "land": "Import stays free; promote only forked sessions into worlds, one class at a time.", "say": ["I'd keep replay as the default and only promote a session into a world when someone forks it and it starts missing. Start with one class, email.", "Build the world from that session and others with the same intent: union their tool calls and results, reconcile the people and threads, and mark anything synthetic. Reads fall back to the recording, writes land in the world, and every answer is stamped with where it came from."], "prep": "If Kitaru moved toward your design", "prepId": "q-if-kitaru-moved-toward-your-design-with-stateful-worlds-fake"}, {"id": "x10", "label": "Is the world telling the truth?", "who": "Alex", "q": "Once the world answers a query the recording never saw, how do you know the answer is right? The agent behaves well, the case passes, and the world was just wrong. How would you catch that?", "tests": "Keeping a fake honest.", "said": ["Talked about the north-star metric, turns per task completion, then completeness: the ledger missing refunds, gold truth per task, and quality as an open problem."], "verdict": "missed", "why": "A good story, but about whether the agent's output was complete, not whether the world was right. Alex pointed out the gap.", "good": ["The refunds story and completeness are real and well told."], "bad": ["Answered a neighbouring question.", "Ground truth built from the same world can't catch a wrong world."], "approach": ["Restate the question in one line first: 'So, is the fake itself wrong?' That keeps you on it."], "land": "Calibrate every fake against its own recording before you trust it.", "say": ["You check the fake against reality before you trust it. Take the calls the recording did capture, replay them through the world, and compare: if the world's answer differs from what the real tool returned, the world isn't trusted for that tool.", "Then every answer the world gives, rather than the recording, is stamped as world-answered, so a reviewer can see which parts of a pass rest on the fake. And for read-only tools, you can spot-check a sample live.", "It's the same idea as calibrating a judge: never trust a stand-in you haven't measured against the real thing."], "prep": "If Kitaru moved toward your design", "prepId": "q-if-kitaru-moved-toward-your-design-with-stateful-worlds-fake"}, {"id": "x11", "label": "Your question for them", "who": "Hamza", "q": "We're coming up on time. What questions do you have for us?", "tests": "Curiosity about their product and users.", "said": ["What surprised you about the product with early users?"], "verdict": "partly", "why": "A decent question that got a good answer, but only one, and generic. Your prepared contributing questions would have gone further.", "good": ["Asked about users, and got a real answer (cohort replay over debugging; mapping traces is where people stick)."], "bad": ["One generic question.", "No follow-up on their answer, which handed you two openings."], "approach": ["Ask one prepared question, then follow up on their answer with one line."], "land": "One question that shows you read the product, then a follow-up on what they said.", "say": ["What would you want someone in this seat to have shipped by the end of the first month?", "And a follow-up on your answer: you said the mapping from a trace to Kitaru's model is where people get stuck. Is that the importers, or the concepts?"], "ref": "#ask"}]}], "planKicker": "Friday to Sunday", "mechTitle": "Kitaru, mechanism by mechanism", "designLink": {"text": "The worked design, six steps and five deep dives:", "label": "Kitaru in your system design guide", "href": "../SYSTEM%20DESIGN.html#/designs/kitaru"}, "extra": "", "emphasis": ["frozen snapshot of the user's world", "only the call out to", "Only the provider call is swapped", "the only thing swapped", "harness mode", "harness flag", "SQLite snapshot", "twelve failure types", "three out of four", "a little over a hundred cases", "twenty-five real instances", "three people named Michael", "path it never took", "tool calls per completed task", "multi-turn orchestration", "append-only", "ground truth", "pinning an expected answer", "freezing a world rather than a transcript", "freezes the transcript", "froze the world", "fail in opposite directions", "promoted into a small queryable world", "a miss is information", "static alias", "shadow", "stamped on the node", "provenance", "the agent's clock isn't", "anti-fabrication", "tool-execution record", "tool-execution ledger", "at-least-once", "idempotent", "exactly-once", "FOR UPDATE SKIP LOCKED", "CREATE DATABASE ... TEMPLATE", "backstop", "SECURITY DEFINER", "PUBLIC", "row-level security", "fidelity", "execution truth", "a framework, a runtime for stateful agents, and the observability-and-eval product", "our own tables in Supabase Postgres", "divergence", "I never instrumented it", "estimate", "5,000-plus", "WheelPrice", "INFORMS Analytics+", "MockFlow-AI", "MetaRAG", "not looking to urgently leave", "Three doors, one brain", "no send path", "three layers", "byte-identical", "effects ledger", "fail closed", "no side door", "Volunteer the limit"], "own": {"tab": "alfred_", "kicker": "The system you own", "title": "alfred_ against Kitaru", "lead": ["Your own system, layer by layer, with its numbers and stories, is on the alfred_ page: the alfred_ button in the bar at the top, or ALFRED.html. This tab keeps what is about Kitaru: the two designs side by side, and what you would bring across."], "home": {"text": "Your own system, layer by layer:", "label": "the alfred_ page", "href": "../ALFRED.html#system"}, "parts": [], "compare_figs": ["alfredVsKitaru"], "compare": {"head": ["Question", "alfred_", "Kitaru"], "rows": [["Where a tool call is caught", "`compose()` around every call; no surface calls execute()", "The adapter hook, on registered function tools only"], ["Default for a write", "Preview, confirm, then an idempotency key", "passthrough: the real tool runs"], ["What proves an action happened", "The `turn_effects` ledger, and a reconciler that checks the provider", "The mocked attribute, absent on passthrough"], ["Retries and repeats", "Event dedupe, a conversation lease, idempotency keys", "An occurrence counter: read, await, then write"], ["Where traces live", "Own tables in Postgres, read by the scanner", "A SessionNode tree, imported from trace stores"], ["Replay for evals", "Real failures replayed against a frozen world", "A cohort replayed from the call log"]]}, "bridges": [{"id": "b-prov", "title": "Provenance: what you would bring from alfred_", "point": "The effects ledger is the record Kitaru lacks.", "say": ["In alfred_ we never trusted the assistant's text to say an action happened; the effects ledger did. A replay node should carry the same: which policy answered it, and whether anything left the process. That turns the provenance gap into a field."]}, {"id": "b-writes", "title": "Side effects: why passthrough would not have passed your review", "point": "A write is declared as a write, and a fork should fail closed on it.", "say": ["Our write tools declare a capability class and carry an idempotency key, so a default that runs the real tool would not have passed review. On a forked replay I would default writes to fail closed, and let a read fall through only if it is marked safe."]}, {"id": "b-import", "title": "Import: the traces you already have", "point": "Your turn traces and tool executions are what Kitaru's importer would ingest; the scanner picks which are worth replaying.", "say": ["Our turn traces and tool executions are exactly what an importer would ingest. The part I would keep is the scanner: most traces are not worth replaying, and picking the failing ones is where the value was."]}]}, "showUp": [["Headline first, then stop.", "About 45 seconds, then offer the depth: 'I can go into the bench or the memory work.' The first answer sets the pace for ninety minutes; in the mock it ran over three."], ["Answer the person asking.", "Hamza, the co-founder, wants your story, your judgement, why this move and what you would cut. Alex, their Founding DevEx Engineer, wants the mechanism, the API shape, and what the user types and sees."], ["Say the limit before they find it.", "In the mock, defending the empty result cost more than the gap itself. 'That's a gap, and here is what I'd do' is the senior answer. Their own value is Be honest: 'provide candid feedback and own your actions'."], ["When lost, go to what the user sees.", "The screen, the click, what changes next time. It rescues any design question; it would have rescued the miss question."], ["Buy time honestly.", "'Give me a second' is fine. 'Essentially', 'so to say', 'in a sense' are not."], ["Numbers, unprompted.", "5,000-plus users, about 25 real instances per task, 2.5 to 2.2 tool calls per task, about three in four genuine flags, a little over a hundred cases."], ["Show their words as habits, never quote them.", "Their post asks for 'end-to-end in days, not weeks', 'a Slack conversation into a merged PR before lunch', 'product taste for developer tools', 'low ego, high standards'. Tell a story that shows each; do not recite the post."], ["The public half is the job, not a side of it.", "The current post wants someone who 'lives and breathes on X and GitHub', and Lennart and Michael both raised it. Be straight that you read X more than you post there, have your week-one plan for X, and have your YouTube, LinkedIn, the INFORMS talk and MockFlow-AI's launch video ready."], ["Care that Kitaru wins.", "They are founders. Admire one thing specifically (the selector design), then critique one thing as a question. Energy for the product reads as fit."], ["Leave twenty minutes.", "At minute 70 of 90, turn to your questions. One at a time, then wait."]], "prepLead": "Start with how to show up. Then open a bank: each question shows what they are testing, the nuance, figures and reading on the light side, and what to say on the dark sheet. Mark each one revised as you go.", "storyBlurb": "Your career, why this role, why leave alfred_, your days at alfred_ and WheelPrice, the bench, what you found in Kitaru, the comparison, the close.", "sources": [{"label": "The current job post: Product Engineer, Kitaru / ZenML (sent by Pranav, September 2026)", "why": "The newer post: build in public on X and GitHub, a different hat each week (shipping, writing, customer demos), and four success points at six months. It supersedes the April post below on emphasis."}, {"label": "Kitaru: product page", "url": "https://www.zenml.io/product/kitaru", "why": "Turn agent traces into reliable evals."}, {"label": "Kitaru on GitHub (Python, Apache-2.0)", "url": "https://github.com/zenml-io/kitaru", "why": "'Agent traces you can run, not just read.'"}, {"label": "Product Engineer, ZenML/Kitaru: the job post (closed to applications)", "url": "https://careers.crane.vc/companies/zenml-2/jobs/74821580-product-engineer-zenml-kitaru-f-m-d-full-time", "why": "What they asked for, in their words: ship end to end in days, build for Python developers, close the loop on UX, AI-first and craft-first."}, {"label": "ZenML: company and values", "url": "https://www.zenml.io/company", "why": "Challenge everything, Empathize, Be efficient, Enable others, Be honest. Alex is listed as Founding DevEx Engineer."}, {"label": "ZenML careers", "url": "https://www.zenml.io/careers", "why": "No hierarchies, full ownership, open source as the way to build software."}, {"label": "Introducing Kitaru (1 April 2026)", "url": "https://www.zenml.io/blog/kitaru-launch", "why": "The launch as a durable execution layer for Python agents: crash recovery, human-in-the-loop, replay from any checkpoint."}, {"label": "Alex Strick van Linschoten's blog", "url": "https://alexstrick.com/", "why": "He writes in public about MLOps and engineering; read two recent technical posts."}, {"label": "ZenML's LLMOps Database", "url": "https://www.zenml.io/llmops-database", "why": "About 2,100 production case studies: how ZenML does public, useful content."}, {"label": "interviewing.io: a senior engineer's guide to the system design interview", "url": "https://interviewing.io/guides/system-design-interview/part-three", "why": "Clarifying: requirements first, and write down what you are told to assume."}, {"label": "Hello Interview: what your system design interviewer is really judging", "url": "https://hellointerview.substack.com/p/what-your-system-design-interviewer", "why": "Clarifying: the prompt is vague on purpose."}, {"label": "HBS Online: questions to ask before joining a startup", "url": "https://online.hbs.edu/blog/post/startup-interview-questions", "why": "Contributing: what success looks like, and whether the plan is concrete."}, {"label": "The Muse: questions software engineers should ask", "url": "https://www.themuse.com/advice/software-engineer-questions-to-ask-interview-find-the-right-fit", "why": "Collaborating: code review and design practice as a window on the culture."}]}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; o.rev = o.rev || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }
    var sm = el("summary", "", '<span class="qt">' + inl(title) + "</span>" + (meta ? '<span class="qm">' + meta + "</span>" : ""));
    d.appendChild(sm); d.appendChild(body);
    return d;
  }
  function bulk(host) {
    var b = el("div", "bulk");
    var o = el("button", "", "Open all"), c = el("button", "", "Close all");
    o.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = true; }); });
    c.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = false; }); });
    b.appendChild(o); b.appendChild(c);
    host.appendChild(b);
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });
    (s.study || []).forEach(function (_, i) { k.push(s.id + ":s" + i); });
    return k;
  }
  function isDone(t, s) { return !!t.done[s.id]; }
  function link(tab, anchor) { return "#/" + tab + (anchor ? "/" + anchor : ""); }
  /* A drill's reference is either a route already or an anchor on the prep tab. */
  function prepRef(r) { return r.indexOf("#/") === 0 ? r : link("prep", r.replace(/^#/, "")); }

  /* ---------------------------------------------------------------- tabs */
  var TABS = [
    { id: "overview", label: "Overview", show: function () { return true; } },
    { id: "prep", label: "Prep", show: function () { return LOOP.scripts.length || LOOP.drills.length || LOOP.qa.length || LOOP.ask.length || (LOOP.ask3 || []).length; } },
    { id: "design", label: "Design", show: function () { return LOOP.tables.length || LOOP.figures.length; } },
    { id: "own", label: (LOOP.own && LOOP.own.tab) || "Yours", show: function () { return !!LOOP.own; } },
    { id: "sessions", label: "Sessions", show: function () { return LOOP.sessions.length; } },
    { id: "mocks", label: "Mocks", show: function () { return !!LOOP.mockHow; } }
  ].filter(function (t) { return t.show(); });
  var main = document.getElementById("main");
  var side = document.getElementById("side");
  var nav = [];            /* side links for the current tab: [anchor, label, sub] */

  function heading(host, id, kicker, title, sub) {
    var s = el("section", "block"); s.id = id;
    if (kicker) { s.appendChild(el("div", "kicker", esc(kicker))); }
    if (title) { s.appendChild(el("h2", "", esc(title))); }
    host.appendChild(s);
    nav.push([id, title || kicker, !!sub]);
    return s;
  }

  /* ---------------------------------------------------------------- overview */
  function tabOverview(host) {
    var s = el("section", "block"); s.id = "brief";
    s.appendChild(el("div", "kicker", esc(LOOP.subtitle)));
    s.appendChild(el("h1", "", esc(LOOP.title)));
    s.appendChild(el("p", "lead", esc(LOOP.format)));
    var dl = el("dl", "facts");
    dl.innerHTML = "<dt>When</dt><dd>" + esc(LOOP.when) + "</dd><dt>Who</dt><dd>" + esc(LOOP.who) + "</dd>";
    s.appendChild(dl);
    if (LOOP.bar) { s.appendChild(el("p", "bar", "<b>The bar.</b> " + inl(LOOP.bar))); }
    if (LOOP.extra) { s.appendChild(el("div", "lead", LOOP.extra)); }
    host.appendChild(s);
    nav.push(["brief", "The brief"]);
    if (!LOOP.sessions.length) { return; }

    var p = heading(host, "plan", LOOP.planKicker || "", "The plan");
    var t = tracker();
    var days = {}, order = [];
    LOOP.sessions.forEach(function (x) {
      if (!days[x.day]) { days[x.day] = []; order.push(x.day); }
      days[x.day].push(x);
    });
    var wrap = el("div", "days");
    order.forEach(function (d) {
      var box = el("div", "day");
      box.appendChild(el("h3", "", esc(d)));
      days[d].forEach(function (x) {
        var a = el("a", "srow" + (isDone(t, x) ? " done" : ""));
        a.href = link("sessions", x.id);
        a.innerHTML = '<span class="dot"></span><span><span class="nm">' + esc(x.name) +
          '</span><span class="bl">' + esc(x.blurb.replace(/^(Friday|Saturday|Sunday)[^.]*\.\s*/, "")) + '</span></span><span class="hrs">' + esc(x.len) + "</span>";
        box.appendChild(a);
      });
      wrap.appendChild(box);
    });
    p.appendChild(wrap);
    var go = el("div", "acts");
    TABS.filter(function (x) { return x.id !== "overview"; }).forEach(function (x) {
      var a = el("a", "btn", esc(x.label)); a.href = link(x.id); go.appendChild(a);
    });
    p.appendChild(go);
  }

  /* ---------------------------------------------------------------- prep: a hub
     The tab is short: how to show up, then the banks as rows, then drills, questions to
     ask, traps and sources. A bank opens in the one-screen panel. */
  function prepBanks() {
    var banks = [];
    if (LOOP.scripts.length) {
      banks.push({ id: "say", title: "Your story, in the words to say it", blurb: LOOP.storyBlurb || "", items: LOOP.scripts.map(function (x) {
        return { id: "say-" + x.id, q: x.title, short: x.short || x.title, tests: x.when, a: x.say, land: x.land, never: x.never, notes: x.notes,
          probes: x.probes, swaps: x.swaps, learn: x.figs ? { figs: x.figs } : null,
          meta: x.length ? x.length.charAt(0).toUpperCase() + x.length.slice(1) + "." : "",
          drill: LOOP.drills.some(function (d) { return d.id === x.id; }) ? x.id : null };
      }) });
    }
    LOOP.qa.forEach(function (g, gi) {
      banks.push({ id: "qa-" + gi, title: g.group, blurb: g.blurb || "", items: g.items });
    });
    return banks;
  }
  function findPrep(banks, id) {
    for (var b = 0; b < banks.length; b++) {
      for (var i = 0; i < banks[b].items.length; i++) { if (banks[b].items[i].id === id) { return { bank: banks[b], i: i }; } }
    }
    return null;
  }
  var hubCounts = [];
  function drawHubCounts() {
    hubCounts.forEach(function (h) {
      var n = h.bank.items.filter(function (x) { return isRevised(x.id); }).length;

      body.appendChild(acts);
      var list = el("div", "attempts");
      body.appendChild(list);
      var t0 = null, tick = null, secs = 0;
      function fmt(n) { return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); }
      start.addEventListener("click", function () {
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; return; }
        t0 = Date.now(); secs = 0; start.textContent = "Stop";
        tick = setInterval(function () {
          secs = Math.round((Date.now() - t0) / 1000);
          timer.textContent = fmt(secs);
          timer.classList.toggle("over", secs > d.seconds);
        }, 250);
        ta.focus();
      });
      function draw() {
        list.innerHTML = "";

          list.appendChild(el("div", "at", "<small>" + esc(at.at) + (at.secs ? ", " + fmt(at.secs) : "") + "</small>" + esc(at.text)));
        });

        if (!ta.value.trim()) { ta.focus(); return; }
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; }
        var st = own();
        var arr = st.drills[d.id] || [];
        arr.push({ at: stamp(), secs: secs, text: ta.value.trim() });
        st.drills[d.id] = arr.slice(-3);
        writeJSON(OWN, st);
        ta.value = ""; timer.textContent = "0:00"; timer.classList.remove("over"); secs = 0;
        draw();
      });
      draw();
      var n = (own().drills[d.id] || []).length;
      s.appendChild(item("drill-" + d.id, d.prompt, "Aim for " + esc(d.target) + (n ? ". " + n + " saved" : ""), body));

  /* A step opens to what it is, what to read, where it sits in the system design guide
     and the figure that draws it. What you would say stays shut until you have tried. */
  function stepNode(key, it, isStudy) {
    var t = tracker();
    var row = el("details", "step");
    var sm = el("summary");
    var tick = el("button", "tick" + (t.steps[key] ? " on" : ""), t.steps[key] ? "&#10003;" : "");
    tick.setAttribute("aria-label", "Mark done: " + it.t);
    tick.addEventListener("click", function (e) {
      e.preventDefault(); e.stopPropagation();
      var tt = tracker();
      if (tt.steps[key]) { delete tt.steps[key]; delete tt.steps[key + ":at"]; }
      else { tt.steps[key] = true; tt.steps[key + ":at"] = stamp(); }
      writeJSON(TRACKER, tt);
      tick.classList.toggle("on", !!tt.steps[key]);
      tick.innerHTML = tt.steps[key] ? "&#10003;" : "";
      progress();
    });
    sm.appendChild(tick);
    sm.appendChild(el("span", "st", inl(it.t)));

      it.do.forEach(function (d) {

      });
    }
    if (!isStudy && (it.where || it.url)) { pre.push(it.url ? { url: it.url, label: it.where || it.url } : { book: it.where }); }
    learn(body, { figs: [], read: pre.concat(isStudy ? (it.res || []) : (it.links || []), it.read || []), sdLinks: it.sdLinks });
    var say = isStudy ? it.say : it.ans;
    if (say) { body.appendChild(sayToggle(isStudy ? "The idea, in the words you would use" : "What you would say", transcript(Array.isArray(say) ? say : [say], "", ""))); }
    row.appendChild(body);
    return row;
  }

  /* One screen, shared by mocks and the Prep banks: a list on the left, the chosen item on
     the right. The item's header is small; under it, the light column is for understanding
     and the dark sheet is what to say, each scrolling on its own. Arrows move; Escape closes. */
  var convo = document.getElementById("convo");
  function panelSection(host, label, nodes) {
    if (!nodes.length) { return; }
    host.appendChild(el("div", "lab", label));
    nodes.forEach(function (n) { host.appendChild(n); });
  }
  function panelList(items, cls) {
    if (!items || !items.length) { return []; }
    var u = el("ul", "mk-list " + (cls || ""));
    items.forEach(function (t) { u.appendChild(el("li", "", inl(t))); });
    return [u];
  }
  /* o: { title, sub, label, count, row(i) -> html for the rail, draw(i, pane), start } */
  function openPanel(o) {
    var cur = o.start || 0;
    convo.innerHTML = "";
    convo.setAttribute("aria-label", o.label || o.title);
    var shell = el("div", "cv");
    var rail = el("nav", "cv-rail");
    rail.appendChild(el("div", "cv-title", "<b>" + esc(o.title) + "</b>" + (o.sub ? "<span>" + esc(o.sub) + "</span>" : "")));
    var rows = [];
    for (var i = 0; i < o.count; i++) {
      (function (i) {
        var b = el("button", "turn");
        b.innerHTML = o.row(i);
        b.addEventListener("click", function () { show(i); });
        rail.appendChild(b);
        rows.push(b);
      }(i));
    }
    rail.appendChild(el("div", "cv-keys", "Up and down arrows move. Escape closes."));
    var pane = el("section", "cv-pane");
    var close = el("button", "cv-close", "Close");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", function () { convo.close(); });
    shell.appendChild(rail); shell.appendChild(pane);
    convo.appendChild(close); convo.appendChild(shell);
    function show(i) {
      cur = i;
      rows.forEach(function (b, j) { b.classList.toggle("on", j === i); if (j === i) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); } });
      rows[i].scrollIntoView({ block: "nearest" });
      pane.innerHTML = "";
      o.draw(i, pane, function () { rows[i].innerHTML = o.row(i); });
      [].forEach.call(pane.querySelectorAll(".cv-col"), function (c) { c.scrollTop = 0; });
    }
    convo.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = cur + (e.key === "ArrowDown" ? 1 : -1);
        if (n >= 0 && n < o.count) { show(n); rows[n].focus(); }
      }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    rows[cur].focus();
  }
  function panelCols(pane, leftTitle, rightTitle) {
    var cols = el("div", "cv-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "cv-col cv-say");
    left.appendChild(el("h3", "cv-h", leftTitle));
    right.appendChild(el("h3", "cv-h", rightTitle));
    cols.appendChild(left); cols.appendChild(right);
    pane.appendChild(cols);
    return { left: left, right: right, cols: cols };
  }

  /* A mock: what they asked and how it landed; what you said; what to say. */
  function openConvo(m, start) {
    var ex = m.exchanges;
    openPanel({
      title: m.title, sub: m.when, label: "Mock conversation", count: ex.length, start: start,
      row: function (i) {
        var x = ex[i];
        return '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) + "</span>";
      },
      draw: function (i, pane) {
        var x = ex[i], who = (x.who || "").toLowerCase();
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q spk-" + who, '<span class="ex-who">Turn ' + (i + 1) + " of " + ex.length + ", " + esc(x.who) + "</span>" + inl(x.q)));
        head.appendChild(el("p", "cv-verdict", '<span class="vd vd-' + esc(x.verdict) + '"></span><b>' + esc(VERDICT[x.verdict] || x.verdict) + ".</b> " + inl(x.why || "")));
        if (x.tests) { head.appendChild(el("p", "cv-tests", "<b>They were testing:</b> " + inl(x.tests))); }
        pane.appendChild(head);
        var c = panelCols(pane, "What you said", "What to say");
        panelSection(c.left, "In short", (x.said || []).map(function (p) { return el("p", "ex-said", inl(p)); }));
        panelSection(c.left, "What worked", panelList(x.good, "mk-good"));
        panelSection(c.left, "What did not", panelList(x.bad, "mk-bad"));
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.say && x.say.length) { c.right.appendChild(transcript(x.say, "You", "")); }
        panelSection(c.right, "How to approach it", panelList(x.approach));
        (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.right.appendChild(f); } });
        var links = [];
        if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
        if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
        if (links.length) { c.right.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      }
    });
  }

  /* A Prep bank: what it is and what sits under it on the light side; what to say on the
     dark sheet. Each item can be marked revised; the mark is kept in this page's storage. */
  function isRevised(id) { return !!own().rev[id]; }
  function setRevised(id, on) {
    var o = own();
    if (on) { o.rev[id] = stamp(); } else { delete o.rev[id]; }
    writeJSON(OWN, o);
  }
  function openBank(bank, start) {
    var its = bank.items;
    openPanel({
      title: bank.title, sub: its.length + " questions", label: bank.title, count: its.length, start: start,
      row: function (i) {
        return '<span class="n">' + (i + 1) + '</span><span class="vd ' + (isRevised(its[i].id) ? "vd-landed" : "vd-open") + '"></span><span class="tl">' + esc(its[i].short || its[i].q) + "</span>";
      },
      draw: function (i, pane, redrawRow) {
        var x = its[i];
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q", '<span class="ex-who">' + esc(bank.title) + ", " + (i + 1) + " of " + its.length + "</span>" + inl(x.q)));
        if (x.tests) { head.appendChild(el("p", "cv-verdict", "<b>They are testing:</b> " + inl(x.tests))); }
        var rv = el("button", "linkish cv-rev");
        function label() { rv.innerHTML = isRevised(x.id) ? '<span class="vd vd-landed"></span>Revised. Undo' : "Mark as revised"; }
        label();
        rv.addEventListener("click", function () { setRevised(x.id, !isRevised(x.id)); label(); redrawRow(); drawHubCounts(); });
        head.appendChild(el("p", "cv-tests")).appendChild(rv);
        pane.appendChild(head);
        var c = panelCols(pane, "Understand it", "What to say");
        panelSection(c.left, "What they may probe", panelList(x.probes));
        /* A big design question carries its own board: titled sections, read in order. */
        (x.parts || []).forEach(function (p) {
          c.left.appendChild(el("h4", "cv-part", inl(p.title)));
          if (p.lead) { c.left.appendChild(el("p", "cv-part-lead", inl(p.lead))); }
          panelList(p.items).forEach(function (u) { c.left.appendChild(u); });
          /* A worked example: code, shown as written. */
          if (p.code) { var pre = el("pre", "cv-code"); pre.appendChild(el("code", "", esc(p.code))); c.left.appendChild(pre); }
          if (p.after) { panelList(p.after).forEach(function (u) { c.left.appendChild(u); }); }
        });
        panelSection(c.left, "The nuance", panelList(x.notes));
        panelSection(c.left, "Avoid", panelList(x.never, "mk-bad"));
        learn(c.left, x.learn || {});
        if (x.drill) { c.left.appendChild(el("p", "ex-links", '<a href="' + link("prep", "drill-" + x.drill) + '">Practise it aloud, timed</a>')); }
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.a && x.a.length) { c.right.appendChild(transcript(x.a, "You", "")); }
        /* Lines to swap in: a short answer for each probe, said the same way. */
        if (x.swaps && x.swaps.length) {
          c.right.appendChild(el("div", "lab", "Lines you can swap in"));
          x.swaps.forEach(function (w) {
            c.right.appendChild(el("div", "swap", '<span class="sw-when">' + inl(w.when) + '</span><span class="sw-line">' + emph(inl(w.line)) + "</span>"));
          });
        }
        if (x.meta) { c.right.appendChild(el("p", "cv-meta", esc(x.meta))); }
        if (c.left.querySelector(".cv-code")) { c.cols.classList.add("has-code"); }
      }
    });
  }

  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    return { tab: tab, anchor: p[1] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = link(t.id);
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = [];
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "mocks") { tabMocks(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    drawTabs(r.tab); drawSide(r.tab); progress();
    var key = r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    var c = document.getElementById("count");
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
</html>
