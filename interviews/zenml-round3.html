ink the interesting product problems are."}], "land": "I've already run into the problem you're solving, from the other side.", "notes": ["Your own words.", "Pairs with the role bank's first theme, which goes deeper on product engineering."]}, {"id": "leave", "title": "Why are you looking to leave alfred_?", "length": "about 45 seconds", "when": "You are exploring while employed. Make that clear without sounding defensive.", "probes": ["Is something wrong at alfred_?", "Are you unhappy?", "Why move so quickly?", "Are you going to leave us quickly too?", "Is this just compensation, sponsorship or title?"], "say": ["There's nothing particularly wrong with alfred_. I've actually learned a lot there and I still enjoy the work.", "I'm mostly looking at what I want the next few years of my career to look like. At alfred_, I've had a lot of ownership because it's a small team, and that's been great. But the work is ultimately internal to one product.", "What I'm increasingly interested in is building the infrastructure and developer experience that other engineers depend on. That's one of the reasons Kitaru caught my attention — it's very close to problems I've already been solving, but the product itself is the thing I'm building.", "So it's less “I need to get away from Alfred” and more “I've found a direction I want to go deeper into.”"], "swaps": [{"when": "If they ask bluntly: “So why not just stay at alfred_?”", "line": "I could. And that's why I'm being selective about what I talk to. I'm not looking to leave just to change companies. The opportunity has to give me a meaningfully different scope or learning curve. Kitaru does because I'm going from building this infrastructure for one AI product to building it as a product for other engineers."}], "land": "Less “get away from alfred_”, more “a direction I want to go deeper into”.", "notes": ["Your own words.", "Pay, visa and start date are prepared in chat, not on this public page."]}, {"id": "alfred-day", "title": "What does your day-to-day look like at alfred_?", "length": "about 60 seconds", "when": "How much you code, what 'founding LLM engineer' means, what you personally own.", "probes": ["How much do you actually code?", "What does “founding LLM engineer” mean?", "Are you mostly research, backend, or product?", "How independent are you?", "What did you personally own?"], "say": ["It's pretty varied, which is one of the things I like about the role.", "A typical piece of work might start with a production failure. I'll look at the conversation and the tool trace, figure out whether it's a model problem, a tool problem, or something in our orchestration or memory layer.", "If it's something we need to reproduce, I'll add it to the eval harness. The harness takes a snapshot of the relevant user environment — email, calendar, whatever the task needs — and lets the actual agent code run against that state. So we're testing the same tool paths we use in production rather than mocking the whole agent.", "Then I'll usually build the fix, run the regression set, and look at whether we've actually improved the behavior without breaking something else.", "I've also worked on the production failure scanner, working memory, reliability infrastructure, and some of the cost and orchestration pieces.", "So it's a mix of debugging production behavior, building infrastructure, writing product code, and figuring out what we should build next."], "swaps": [{"when": "If they ask “how much coding?”", "line": "A lot. I'm usually in the codebase every day. The difference is that because we're a small team, the coding is usually preceded by figuring out what the right thing to build is."}], "land": "The coding is usually preceded by figuring out what the right thing to build is.", "notes": ["Your own words. The swap line is the best single line for this role."]}, {"id": "wheelprice-leave", "title": "Why did you leave WheelPrice?", "length": "about 40 seconds", "when": "Performance, boredom, a failing company, or a pattern of short stays.", "probes": ["Was there a performance issue?", "Did you get bored?", "Did the company fail?", "Are you a job hopper?", "Why alfred_?"], "say": ["WheelPrice was a really good place to move fast. It was two engineers, so I owned a lot, and I learned a ton about shipping under real constraints.", "But the work I kept enjoying most was the AI systems side, and there it was one of many hats. I wanted to be somewhere that was the core of the job.", "alfred_ was exactly that: a founding team, an agent in production with real users, and the reliability of that agent was mine to own. So it was a move toward depth in the same direction, not away from anything."], "swaps": [{"when": "If they ask whether you're a job hopper", "line": "Fair question. Both moves were toward the same thing, more depth in AI systems and more ownership, and each one widened the scope. This one would make that the whole job."}, {"when": "If they ask whether the company failed or it was performance", "line": "No, neither. It was a good team; I left for the kind of work, not because of anything going wrong."}], "land": "A move toward depth in the same direction, not away from anything.", "notes": ["From your WheelPrice notes, in your voice. Say it plainly and move on; don't over-explain.", "Dates if asked: WheelPrice July 2025 to March 2026; alfred_ from April 2026."]}, {"id": "wheelprice-day", "title": "What did you do day-to-day at WheelPrice?", "length": "about 75 seconds", "when": "How broad your ownership was, AI versus traditional software, and whether it shipped.", "probes": ["How broad was your ownership?", "How much was AI versus traditional software?", "Did you actually ship production systems?", "How does it connect to your current work?"], "say": ["It was two engineers, so nobody handed me tickets. I'd notice a problem, propose something, and own it end to end.", "Four things mostly. A blog and content system from scratch, because we had a big social following and no search presence at all; it got to 10 to 20 thousand daily readers, and I took API response time from about 1.5 seconds to 300 milliseconds with caching and query work.", "Then an AI fitment assistant, because buying wheels is genuinely confusing: bolt pattern, offset, hub bore, diameter. The key decision was to constrain it. The agent could only answer through four tools against verified data, never from what the model thought it knew, and when the data was incomplete it had to say so.", "Third, an internal analytics dashboard. Everyone assumed people dropped off at the fitment check; the data showed the real cliff was checkout, mostly on mobile, where the payment page timed out. And a computer-vision wheel visualizer that we paused, because it wasn't going to be good enough soon enough to be worth it.", "The thread into what I do now is that assistant: constrain the model, ground every answer in real data, and make the data honest about its own gaps."], "swaps": [{"when": "If they ask about the hardest decision", "line": "Constraining the fitment assistant. The easy path was letting the model answer from training data. I made that structurally impossible; every answer had to come through a tool."}, {"when": "If they ask what you'd do differently", "line": "Cache from day one. A blog built to catch viral social traffic will see spikes; I added Redis after the first spike, when it should have been in the design."}, {"when": "If they ask about prioritising four projects on a two-person team", "line": "By impact. The assistant and the dashboard were cutting support load and fixing conversion, so they went first. The visualizer I paused on purpose rather than let it compete."}], "land": "Nobody handed me tickets: notice a problem, propose, own it end to end.", "notes": ["From your WheelPrice notes, in your voice.", "The constrained-agent story connects straight to alfred_'s anti-fabrication work."]}, {"id": "bench2", "title": "The bench, in two minutes", "length": "about 2 minutes", "when": "Tell me about the eval harness. Headline first, every time.", "land": "The real agent against a frozen snapshot of the user's world; only the provider call swapped; scored on tool calls per completed task.", "say": ["When I joined alfred_, we had no reliable way to say whether a new version of the agent was better than the old one. People tried it and had opinions. So I built the loop that turns production failures into regression tests.", "It starts with a scanner over real conversations. Cheap deterministic signals flag anything that looks like one of twelve failure types, and an LLM judge, trained on a week of labels I did by hand, decides which flags are real. Roughly three out of four are genuine bugs. Real ones get fixed and promoted into a bench of a little over a hundred cases.", "Replay is the interesting part. The real agent runs in a harness mode. The tools execute normally, so ranking, filtering and formatting are the production code. Only the call out to Gmail, the calendar or an MCP server gets routed to a SQLite snapshot. And the snapshot isn't one recorded path: for a query type we pulled about twenty-five real instances and covered every tool the agent used across all of them, plus deliberate ambiguity, like three people named Michael.", "So the agent can take a path it never took in production and still get truthful answers. We score on tool calls per completed task and on assertions against the snapshot, run it nightly, and it's what we used to sign off a full rewrite of the agent's multi-turn orchestration."]}, {"id": "kitaru-read", "title": "What did you find out about Kitaru? Did you try it?", "length": "about 75 seconds", "when": "How seriously you prepared, and whether you understand the product from the inside.", "probes": ["Have you used Kitaru?", "What surprised you?", "What did you like?", "What would you change?"], "say": ["I didn't run it on a real agent, honestly. What I did was go through the source and the infrastructure, because I wanted to understand how it actually works rather than how the pages describe it.", "The shape that stuck with me is that the server never runs user code. It's a coordinator: tasks, configs, results. The worker runs in your own environment and spawns your agent as a normal subprocess, and an adapter inside it hooks the framework's tool execution, so every tool call is answered from the recording by a hash of the tool name and its arguments.", "The bit I keep thinking about is the selectors: storing a JSON path into the payload instead of copying text out, so a human judgement, an evaluator verdict and the UI all point at the same place. I hand-rolled a worse version of that.", "And the part I'd want to work on is what happens when the agent changes: exact matching means a better agent misses the recording, and that's the moment a user decides whether to trust the tool."], "swaps": [{"when": "If they ask why you didn't run it", "line": "I prioritised understanding the mechanism, because that's what I'd be changing. Running the example is the first thing I'd do in week one, on a real agent of mine."}, {"when": "If they ask what surprised you", "line": "How much it rests on one hash. It makes replay cheap and deterministic, and it's also exactly where it's brittle."}], "land": "I read it from the source; the server never runs user code, and the hash is both its strength and its edge.", "notes": ["Be straight that you did not run it. Reading the source is a strong signal; overstating use is a weak one.", "Ask about the gaps as questions, never call them bugs. The Kitaru bank has the details."]}, {"id": "compare", "title": "The comparison: your bench against Kitaru", "length": "about 30 seconds", "when": "Hold this until they ask how the two designs differ. It is the strongest closing move.", "land": "Kitaru froze the transcript, I froze the world; they fail in opposite directions. Promote on fork.", "say": ["Kitaru freezes the transcript, so ingestion is free and counterfactuals are brittle. We froze the world, so counterfactuals held up and ingestion was expensive. They fail in opposite directions.", "The interesting product question is whether a recorded session can be promoted into a small queryable world model on demand, so the common case stays free and only the sessions you actually fork on get upgraded into something the agent can explore."]}, {"id": "close", "title": "The close", "length": "about 20 seconds", "when": "The last minute. Then ask about next steps plainly.", "land": "I've built this in-house and know what it costs. I'd like to build it as the product.", "say": ["This is the first eval product whose source I've read and come away thinking the hard parts were hard for the right reasons. I've been on the other side of it: I know what it costs to build in-house and what it costs to keep. I'd like to build it as the product."]}], "drills": [{"id": "intro", "prompt": "Introduce yourself.", "target": "40 seconds", "seconds": 40, "ref": "#say-intro"}, {"id": "seat", "prompt": "Why this seat, and why now?", "target": "45 seconds", "seconds": 45, "ref": "#say-seat"}, {"id": "bench2", "prompt": "Tell me about your eval bench.", "target": "2 minutes", "seconds": 120, "ref": "#say-bench2"}, {"id": "refunds", "prompt": "When did your bench pass something that was actually broken?", "target": "75 seconds", "seconds": 75, "ref": "#say-refunds"}, {"id": "critique", "prompt": "Name one thing in Kitaru that's wrong or oversold.", "target": "60 seconds", "seconds": 60, "ref": "#say-critique"}, {"id": "miss", "prompt": "A prompt change causes a cache miss and the replay dies. What would you do?", "target": "90 seconds", "seconds": 90, "ref": "#say-miss"}, {"id": "sqlite", "prompt": "Why SQLite when production is Postgres?", "target": "60 seconds", "seconds": 60, "ref": "#qa"}, {"id": "halfway", "prompt": "A side-effecting tool call fails halfway. What happens?", "target": "60 seconds", "seconds": 60, "ref": "#qa"}, {"id": "langs", "prompt": "LangChain, LangGraph, LangSmith: what's the difference?", "target": "30 seconds", "seconds": 30, "ref": "#qa"}, {"id": "close", "prompt": "Close the interview.", "target": "20 seconds", "seconds": 20, "ref": "#say-close"}], "qa": [{"group": "The role: product engineer, in public", "blurb": "Six themes, each with what they may probe, the answer, and lines to swap in. Theme 1 is in your own words.", "items": [{"q": "Why product engineering, and why Kitaru?", "short": "Why product engineering, and why Kitaru", "tests": "Is this a real shift or a title change, and do you actually want to build for developers?", "probes": ["What does “product engineer” actually mean to you?", "Why not continue as an AI/backend engineer?", "Is this a real shift or just a title change?", "Why Kitaru specifically?", "Do you actually like building for developers?", "Can you move quickly without overengineering?", "What have you already done that's product-engineering-like?"], "a": ["I think product engineering is really about owning the problem rather than owning a particular layer of the stack.", "That's pretty much how my role at alfred_ has evolved. A lot of the work I enjoyed most started with a real product problem — we'd see something going wrong in production, I'd dig into what was actually happening, build whatever infrastructure we needed to reproduce it, fix it, and then make sure we could catch the same thing again.", "So I wasn't just responsible for the backend or the AI piece. I had to figure out what actually needed to be built and take it through to something the team could use.", "That's the direction I want to go further in. I still like going deep technically, but I don't want my ownership to stop at a particular service or layer. I want to start with the user problem and have enough range to change whatever needs changing.", "And Kitaru is a really natural fit for that because I've actually built a rough version of this problem myself. I've dealt with replay, stateful evals, tool execution, production traces, and the developer workflow around all of that. So I'm not coming at it as, “I want to work on developer tools because they sound interesting.” I've been the engineer who needed this product.", "That's probably the biggest reason I'm interested. The users are engineers like me, and I can feel pretty quickly when a developer product is making my life easier or getting in my way."], "swaps": [{"when": "If they push on “why now?”", "line": "I'm at a point where I want more ownership, not necessarily more specialization."}, {"when": "If they ask “what's different from being a backend engineer?”", "line": "I think the difference is where you start and where you stop. A backend engineer can own the service. A product engineer starts with the problem and stays with it until the workflow actually works."}, {"when": "If they push on moving fast vs. your systems-heavy background", "line": "I care about architecture, but I'm pretty pragmatic about it. At alfred_, I didn't build a distributed eval platform just because that would have been cleaner. SQLite was enough for the problem and the team we had. I like good architecture, but I don't want the architecture to become the product."}, {"when": "If they ask why developer tools", "line": "I like building things where the feedback loop is really short. If an API is awkward or something takes five steps instead of one, I experience that immediately. And when you fix it, you know pretty quickly whether it's actually better."}], "land": "I've been the engineer who needed this product.", "notes": ["Your own words. Say it, don't recite it.", "Their post: 'This is not a backend role or a frontend role', and not for 'specialists seeking deep focus in one stack area'. Your 'more ownership, not more specialization' answers both.", "'Product taste for developer tools: feel physical pain when an API is clunky'. Have one clunky API of your own ready as the example."], "id": "q-why-product-engineering-and-why-kitaru"}, {"q": "The public half: building in public, posts, talking about Kitaru", "short": "The public half of the job", "tests": "Will you actually do it, and do it like an engineer rather than a marketer? Lennart and Michael both raised it.", "probes": ["How do you feel about the public side of this role?", "What have you put out publicly so far?", "Have you done this for an employer before?", "What would your first post about Kitaru be?", "How do you keep it from turning into marketing fluff?", "How would you find the time for it while shipping?", "What's a weakness you're working on?"], "a": ["Honestly, I enjoy it. I have a YouTube channel, I'm pretty active on LinkedIn, and whenever I'm building something of my own I tend to talk about it while I'm building it. MockFlow-AI went out with a launch video, and I presented MetaRAG at INFORMS Analytics+ to 700-plus people.", "What I haven't done yet is do that professionally, for a company's product. And that's genuinely part of why this role is interesting to me.", "The way I think about it, for an open-source developer tool, talking about what you shipped is part of shipping it. The release, the docs, the example and the post are really one piece of work. If I ship a better miss experience and nobody knows it exists, I haven't really finished.", "And I'd want it to be useful, not promotional. The posts I actually read are the ones that teach me something I can use on Monday. So for Kitaru I'd rather show a replay working on real traces than describe features."], "swaps": [{"when": "If they ask what your first post would be", "line": "A walkthrough on real data. Take an agent, import a handful of traces, find a failure, change the prompt, replay, and show the one case that got fixed and the one that got worse. Five minutes, repo linked."}, {"when": "If they ask how you'd keep it from being fluff", "line": "I'd write the post I wish I'd found when I was building the bench. If it doesn't teach something, it doesn't go out."}, {"when": "If they ask how you'd find the time", "line": "I'd tie it to releases. Every meaningful release gets its doc, its example and a short post, the same way it gets tests. Cadence, not inspiration."}, {"when": "If they ask for a weakness", "line": "Doing the public side professionally. I do it for my own projects, but not yet on a schedule for a company. That's the part I'd turn into a habit here."}], "land": "For an open-source developer tool, talking about what you shipped is part of shipping it.", "notes": ["Treat it as a skill with a habit behind it, not enthusiasm. No follower counts, no hype.", "Be honest about the gap and pair it with the plan. That is their value Be honest in action.", "Have your best video or the talk ready to share on screen.", "ZenML's own public content teaches: the LLMOps Database is about 2,100 real case studies. Match that tone."], "figs": ["forkReplay"], "id": "q-the-public-half-building-in-public-posts-talking-about-kitar", "learn": {"figs": ["forkReplay"], "read": [], "sdLinks": []}}, {"q": "Explain Kitaru to someone who has never heard of it", "short": "Kitaru, explained", "tests": "Can you say what the product is, plainly, and where it fits?", "probes": ["Explain Kitaru in thirty seconds.", "Who is it for?", "How is it different from LangSmith or Braintrust?", "What's the hardest part of the product?"], "a": ["The way I'd put it: you've got agent sessions running in production and a change you want to make. Kitaru records what the tools returned, and then re-runs your real agent against those recorded answers, so you can see what your change does to real sessions without touching production.", "So it's basically regression testing for agents, built from the traffic you already have.", "And because it grew out of durable execution, the same recording is what lets a crashed agent pick up from its last checkpoint instead of starting over."], "swaps": [{"when": "If they ask who it's for", "line": "Python engineers shipping agents who've been burned by a change that looked fine in a demo."}, {"when": "If they ask how it's different from LangSmith or Braintrust", "line": "Those are really good at showing you what happened. Kitaru lets you re-run it with a change and see what would have happened. It even imports traces from them, so it's more of a next step than a replacement."}, {"when": "If they ask what the hardest part is", "line": "Divergence. The better your change, the more your agent's calls differ from the recording, and every difference is a miss. That's the problem I'd want to work on."}], "land": "Regression testing for agents, built from the traffic you already have.", "notes": ["Launch, April 2026: a durable execution layer for Python agents (crash recovery, human-in-the-loop, replay from any checkpoint). The replay-eval framing came in August. Lead with whichever their homepage leads with on the day."], "figs": ["kitaruReplay"], "id": "q-explain-kitaru-to-someone-who-has-never-heard-of-it", "learn": {"figs": ["kitaruReplay"], "read": [], "sdLinks": []}}, {"q": "How you'd work here: the first month, what to build, and pace", "short": "How you'd work here", "tests": "Do you start with users, ship early, and move in days?", "probes": ["What would you do in your first month?", "How do you decide what to build when users ask for everything?", "Can you really ship in days, not weeks?", "How do you use coding agents, and when do you take over?", "What do you do with a vague request?"], "a": ["I'd start by using Kitaru the way a new user would, on a real agent of mine, and just write down every place I get stuck. At the same time I'd read through what users are actually asking in Slack and GitHub, and pick up small bugs, because that's the fastest way for me to learn a codebase: by shipping in it.", "By the end of the first month I'd want one visible improvement out of those notes, shipped with its doc and a short post. My guess is it'd be around the miss experience, because that's where replays hurt first. But I'd honestly ask you both which user problem is costing you the most and start there instead of my guess.", "On deciding what to build more generally, I lean on what actually breaks rather than what people guess will break. At alfred_ the production scanner did that for us, and it settled a lot of debates. For a developer tool, anything that stops someone getting their first replay working comes first, because that's where you lose people."], "swaps": [{"when": "If they ask whether you can really ship in days", "line": "Yeah. I'd rather put a two-day prototype in front of someone than spend two weeks on a design doc."}, {"when": "If they ask how you use coding agents", "line": "A lot, but with guardrails. I let them drive on the well-tested, boring parts and I take over on concurrency, permissions and migrations. And I read every line I merge, whoever wrote it."}, {"when": "If they ask about a vague request", "line": "I'd ask them to show me the session where it went wrong. A real example usually tells you what they actually need."}], "land": "Use it as a new user, ship small fixes to learn the code, then one visible improvement with its doc and post.", "notes": ["The post: 'Use Your Own Products'; 'Fix onboarding friction immediately through PRs, not tickets'; 'End-to-end in days, not weeks'.", "Ending with a question to them turns a plan into a conversation."], "id": "q-how-you-d-work-here-the-first-month-what-to-build-and-pace"}, {"q": "Working with people: reviews, feedback, disagreement", "short": "Working with people", "tests": "Low ego, high standards.", "probes": ["How do you give and take code review?", "Which of our values do you connect with?", "How do you handle disagreeing with a founder?", "How do you review code an agent wrote?"], "a": ["I try to be direct about the code and kind to the person. When I review, I say what I'd change and why, and I'm clear about what's a must-fix versus just my taste.", "On the other side, I'd genuinely rather be corrected than stay wrong. That's probably the biggest thing the eval work taught me. The whole bench only worked once we stopped trusting the agent's own account of what it did and checked the execution record instead.", "I try to hold myself to the same thing, including in an interview. I'd rather say “I don't know, here's how I'd find out” than bluff."], "swaps": [{"when": "If they ask which of their values", "line": "Be honest. Not as a slogan: the whole eval story is about not trusting an account over the record."}, {"when": "If they ask about agent-written code in review", "line": "Same bar as a colleague's. It's not a compiler, so it doesn't get trusted like one."}, {"when": "If they ask about disagreeing with a founder", "line": "I'd make my case once, with evidence, ideally a real example or a quick prototype, and then commit to whatever we decide. Small teams can't afford relitigating."}], "land": "Direct about the code, kind to the person; I'd rather be corrected than stay wrong.", "notes": ["The post, word for word: 'Direct in code reviews, kind in conversation. Prefer correction over being wrong.' Show it; don't quote it.", "Their five values: Challenge everything, Empathize, Be efficient, Enable others, Be honest. Pick one, tie it to a story."], "id": "q-working-with-people-reviews-feedback-disagreement"}, {"q": "Where do you want to be in two or three years?", "short": "Where you're headed", "tests": "Ambition that fits a small company.", "probes": ["Where do you want to be in two or three years?", "Do you want to manage people?", "Would you stay if Kitaru pivots again?"], "a": ["Where I want to be in two or three years is owning a product area of developer infrastructure end to end: the users, the code, and the story people tell about it.", "And staying close enough to agents in production that I know what breaks before most teams hit it. A small team that ships fast is the quickest way I know to get there."], "swaps": [{"when": "If they ask about managing people", "line": "Not as a goal in itself. I'd rather own a bigger problem than a bigger team; if the team grows around the problem, great."}, {"when": "If they ask about another pivot", "line": "The problem underneath doesn't pivot: teams need to know whether a change to their agent made it better. I'd want to be on that, whatever the positioning says."}], "land": "Owning a product area end to end, close to where agents break.", "notes": ["Why leave alfred_ is in your story bank, in your own words.", "'No layers, no politics' in the post: don't talk about titles."], "id": "q-where-do-you-want-to-be-in-two-or-three-years"}]}, {"group": "Product engineering on Kitaru", "blurb": "The work the job post names: adapters, onboarding, replay debugging, the miss experience. Compact.", "items": [{"q": "Design the adapter for a new agent framework.", "short": "A new framework adapter", "tests": "SDK design and developer experience.", "a": ["Start from what the framework already exposes: its tool-execution hook, its model-call hook, and how it represents a turn.", "The adapter does three things: record every tool call as a node with its cache key, answer calls on replay through the policy, and mark every node with how it was served. One line of setup for the user; the rest is configuration with good defaults.", "Then one shared contract suite every adapter must pass, against recorded fixtures, so adapters can't drift, canonical JSON especially, since that's where cross-adapter keys break."], "land": "Hook what the framework exposes; record, answer, mark how it was served; one line of setup; a shared contract suite.", "notes": ["The post names 'new framework adapters' as an example deliverable; frameworks it lists: PydanticAI, OpenAI SDK, Claude Agents SDK."], "figs": ["kitaruReplay", "kitaruKey"], "id": "q-design-the-adapter-for-a-new-agent-framework", "learn": {"figs": ["kitaruReplay", "kitaruKey"], "read": [], "sdLinks": []}}, {"q": "A user says their replay is broken. Walk me through it.", "short": "Debugging a user's replay", "tests": "User-driven iteration, same-day fixes.", "a": ["Get the session id and the replay id, not a description, and reproduce against their recording.", "Then read provenance node by node: which calls hit, which missed, which went live. Most breakages are one of four: a key mismatch, so show both canonical forms side by side; an adapter or framework version change; a tool with no policy; or the worker's environment differs from theirs.", "Fix it, add the case to the contract tests, change the error message or doc that would have saved them, and reply in their thread with the PR. Same day if it's small."], "land": "Reproduce from ids, read provenance node by node, fix, add the test, fix the message, reply with the PR.", "notes": ["The post: 'Engage actively in Slack and GitHub. Convert user confusion into same-day PRs.'"], "figs": ["kitaruPolicy"], "id": "q-a-user-says-their-replay-is-broken-walk-me-through-it", "learn": {"figs": ["kitaruPolicy"], "read": [], "sdLinks": []}}, {"q": "A better prompt misses every recording. What do we build?", "short": "A better prompt misses everything", "id": "say-miss", "tests": "Their central problem, as product judgement. (Mock 1 gap.)", "a": ["First, a miss is information: the agent's behaviour changed, which is what they were measuring. The goal isn't to avoid misses, it's to stop one from killing the run and make it cheap to resolve.", "First build: the miss experience. Misses grouped by tool with a count; open one and it's the recorded call next to what the new agent sent. If they're equivalent, one action accepts it as a static alias and the next replay hits. Deterministic, auditable, and every accepted pair is labelled data for matching later.", "Second: policy by effect. A read that misses can fall through to the customer's environment, marked live on the node. A write that misses fails closed on a fork, never passthrough.", "The limit: that fixes rephrasing, not a different path. For those few sessions, promote the trace into a small queryable world, which is what my bench does. The common case stays free."], "swaps": [{"when": "If they ask what button, and what changes next replay", "line": "'Accept as equivalent.' It writes a static alias: these new arguments map to that recorded result. The next replay checks aliases before it misses, and the node says 'served by alias' so nobody mistakes it for an exact match."}, {"when": "If they ask about fuzzy matching", "line": "Last, and carefully: shadow first, then suggest, then opt-in per tool, and every fuzzy hit stamped on the node. A silent false pass is the worst bug an eval product can ship."}], "land": "A miss is information. Make it cheap to resolve: diff, accept as an alias, then policy by effect.", "figs": ["missFlow", "kitaruKey", "zenEffects"], "learn": {"figs": ["missFlow", "kitaruKey", "zenEffects"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Divergence: the better the change, the worse the replay."}]}}, {"q": "The customer says the two searches are the same. What button, and what changes next replay?", "short": "Which button", "tests": "Can you land a design down to data? (Mock 1 gap.)", "a": ["'Accept as equivalent.' It writes a static alias for that tool: these new arguments map to that recorded call's result, scoped to the cohort, and it applies to the whole group of identical misses.", "Next replay the lookup checks aliases before it misses, so those calls hit, and the node is stamped 'served by alias', so nobody mistakes it for an exact match.", "Every accepted pair is a labelled example of 'different arguments, same meaning': the data you'd need to tune fuzzy matching later, shipped in shadow first."], "land": "Button, then the data it writes, then what the next replay does with it.", "figs": ["missFlow"], "learn": {"figs": ["missFlow"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "The productive miss, as a design option."}]}, "id": "q-the-customer-says-the-two-searches-are-the-same-what-button-"}, {"q": "What goes into the first ten minutes with Kitaru?", "short": "The first ten minutes", "tests": "Onboarding taste.", "a": ["One goal: a first replay that shows the user something they didn't know. Install, wrap an agent in one line, import or record a few sessions, replay with one change, see a diff.", "Every step that asks for a decision is a place people drop off, so defaults everywhere, and an example agent for people who don't have one ready. And measure it: time to first successful replay, and where people stop."], "swaps": [{"when": "If they ask what makes an error message good", "line": "It says what happened, why, and the next thing to type. For a miss: which tool, the recorded arguments next to the new ones, and the command to accept. A message that sends someone into the source is a bug in the product."}], "land": "A first replay that teaches the user something, with no decisions on the way; measure time to it.", "notes": ["Alex ships the Claude Code skills behind the guided tour: ask him what the tour changed."], "id": "q-what-goes-into-the-first-ten-minutes-with-kitaru"}, {"q": "How would you test an SDK across frameworks and versions?", "short": "Testing across frameworks", "tests": "Quality at speed.", "a": ["A small matrix: supported Python versions against each framework's oldest supported and newest release. Contract tests from recorded fixtures on every PR.", "A nightly run against the frameworks' newest releases, so a breaking change upstream shows up before a user reports it. And one end-to-end example per framework that runs the real quickstart, because for a new user the quickstart is the product."], "land": "A small matrix, contract tests per PR, nightly against upstream, and the quickstart as a test.", "notes": ["'Raise the bar: better tests, clearer interfaces, sharper documentation.'"], "id": "q-how-would-you-test-an-sdk-across-frameworks-and-versions"}]}, {"group": "Tools and the landscape", "blurb": "What you've built with and why you chose it, and the ecosystem Kitaru imports from. Compact.", "items": [{"q": "Why TypeScript and Deno at alfred_, and Python or TypeScript here?", "short": "TypeScript, Deno and Python", "tests": "Real reasons, and honesty about Kitaru being Python-first.", "a": ["At alfred_ it's TypeScript on Deno, running as edge functions next to Supabase Postgres. One language across the web app and the backend, typed tool schemas with zod, so a tool's contract is checked at the boundary, and functions that deploy in seconds with no servers to run.", "The trade-off is the ML ecosystem, which lives in Python. My research and ML work has been Python: PyTorch, FastAPI, Flask, and an INT8-quantised inference API at UIC.", "Your server and SDK are Python, and I'd say that plainly: I'm stronger in production TypeScript day to day, comfortable in Python, and the fastest way I close that gap is shipping in your codebase from week one."], "land": "TypeScript and Deno for one typed language next to Postgres; Python for ML; plain about which is sharper.", "notes": ["The post asks for '4+ years writing production Python'. Don't oversell; show you've shipped Python services (UIC APIs, FastAPI at WheelPrice)."], "id": "q-why-typescript-and-deno-at-alfred-and-python-or-typescript-h"}, {"q": "Why FastAPI, and why does Pydantic matter?", "short": "FastAPI and Pydantic", "tests": "Their stack, from your own use.", "a": ["I used FastAPI for the analytics backend at WheelPrice: requests validated by Pydantic before my code runs, the OpenAPI contract generated so the dashboard knew the API exactly, and async for several database queries at once.", "Kitaru's server is FastAPI with Pydantic models too, and the value is the same one I care about in agents: the contract is checked at the edge, so bad input fails loudly and early instead of deep inside."], "land": "Validate at the edge, generate the contract, fail early: the same instinct as typed tool schemas.", "notes": ["Their stack in the post: Python 3.11+, Pydantic, SQLAlchemy/SQLModel, FastAPI, asyncio."], "id": "q-why-fastapi-and-why-does-pydantic-matter"}, {"q": "Tell me about the queue: why Postgres, and how is it claimed?", "short": "A queue in Postgres", "tests": "Choice, then mechanism.", "a": ["Postgres, with pgmq for the event bus and pg_cron for schedules, because everything else already lived there: one database to back up, secure and reason about, and at our volume it's plenty. Kafka or SQS would have been a second system for a small team to run.", "Claiming is SELECT ... FOR UPDATE SKIP LOCKED, so two workers never take the same job. And a cron drain's worst case is its interval, which is exactly what we hit on notifications: about ninety seconds down to about three by triggering on the event, with cron kept as a backstop."], "swaps": [{"when": "If they ask when you'd move off Postgres", "line": "The day queue load moves chat latency. Until then, one database is a feature for a small team."}], "land": "Postgres because everything already lived there; SKIP LOCKED to claim; the event as trigger, cron as backstop.", "figs": ["skipLocked"], "learn": {"figs": ["skipLocked"], "read": [{"label": "Postgres docs: the locking clause, FOR UPDATE SKIP LOCKED", "url": "https://www.postgresql.org/docs/current/sql-select.html", "m": 9}, {"label": "Crunchy Data: a queue in plain Postgres with SKIP LOCKED", "url": "https://www.crunchydata.com/blog/message-queuing-using-native-postgresql", "m": 10}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/contention/claim-skip-locked", "label": "Technique: Queue claiming with SKIP LOCKED", "why": "The idiom to name."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/real-time/polling", "label": "Technique: Polling and long polling", "why": "Why a cron drain's worst case is its interval."}]}, "id": "q-tell-me-about-the-queue-why-postgres-and-how-is-it-claimed"}, {"q": "What's the difference between LangChain, LangGraph and LangSmith?", "short": "LangChain, LangGraph, LangSmith", "tests": "Do you know the ecosystem Kitaru imports from?", "a": ["LangChain is the open-source framework: model wrappers, prompts, tools and the glue between them. LangGraph is its orchestration layer for stateful agents: a graph over shared state, with checkpointers for persistence and human-in-the-loop. LangSmith is the commercial platform around both: tracing, datasets, evals, deployment, and one of the trace sources Kitaru imports from.", "In a line: a framework, a runtime for stateful agents, and the observability-and-eval product."], "land": "Framework, runtime, platform.", "learn": {"figs": [], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/transcript-checkpoint", "label": "Technique: Transcript checkpoint every turn", "why": "What LangGraph's checkpointers are, in the guide's terms."}]}, "id": "q-what-s-the-difference-between-langchain-langgraph-and-langsm"}, {"q": "LangGraph, or your own agent loop?", "short": "A framework or your own loop", "tests": "Judgement about abstractions.", "a": ["At alfred_ we run our own loop, and I'd make the same call again for a product like that. The things that mattered most were exactly the ones a framework hides: how retries and idempotency work around each tool call, the confirm step before a write, and how the prompt is laid out for caching.", "I've used LangChain in research, and for a prototype it's faster. For a product where the seam between the model and the tools is where the bugs live, I want to own that seam. Which is also why Kitaru hooking the framework's tool execution is the right place to sit."], "land": "Own the seam between the model and the tools when that's where the bugs live.", "id": "q-langgraph-or-your-own-agent-loop"}, {"q": "Which model for what, and how do you control cost?", "short": "Models and cost", "tests": "Practical LLM engineering.", "a": ["Match the model to the stakes. At alfred_ low-stakes mail goes to a cheaper tier, and the expensive reasoning is kept for where it changes the outcome. Before changing anything I instrumented spend per model and per stage, because my guess about where the money went was wrong.", "Changes to reasoning budgets are gated behind evaluation, and a deprecated model raises an alarm before it breaks. The biggest single win wasn't a model at all: replacing per-message LLM calls with a deterministic matcher for email rules cut per-user LLM cost about 30 percent."], "land": "Instrument first; match the model to the stakes; the best cost cut was removing a model call.", "notes": ["Prompt caching is the other lever: a byte-identical shared prefix, cached for an hour. The alfred_ tab has the numbers."], "id": "q-which-model-for-what-and-how-do-you-control-cost"}, {"q": "What's your experience with trace stores, and would you build your own?", "short": "Trace stores", "tests": "Honest scope and judgement.", "a": ["At alfred_ we kept our own: conversations, the tool-execution ledger and the scanner's flags live in our own tables in Supabase Postgres, and the scanner and the bench run over them. I haven't run Langfuse or LangSmith in production; I know how Kitaru's importers map them from reading the code.", "Keeping execution records next to product data was the right call for us: the scanner's biggest false-positive fix was joining a flag against the tool-execution record, which is easy when both live in one database. A dedicated store earns its place for span trees, a UI to read them, retention, and volume."], "land": "Own it while the questions are about product data; adopt a trace store when they become about spans.", "learn": {"figs": ["kitaruModel", "alfredVsKitaru"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/hld", "label": "Kitaru, high-level design", "why": "Where imported traces land in Kitaru."}]}, "id": "q-what-s-your-experience-with-trace-stores-and-would-you-build"}, {"q": "How do you use AI in your own workflow?", "short": "Coding agents", "tests": "AI-pilled, not vibes-pilled.", "a": ["Heavily, with scaffolding: Claude Code with project instructions and skills for the jobs I repeat, a review pass, and a verification step that drives the running surface instead of trusting that it compiled.", "I let it drive on well-tested, boring parts and take over on concurrency, permissions and migrations. And I don't trust an agent's self-report, the same instinct as the anti-fabrication work in our product."], "land": "Don't trust self-reports, from models or from yourself.", "notes": ["Their stack names Claude Code, Cursor and Codex; they also build internal tooling on Kitaru itself."], "id": "q-how-do-you-use-ai-in-your-own-workflow"}]}, {"group": "Your work, at depth", "blurb": "The bench and alfred_, told as stories you can remember in parts.", "items": [{"q": "When you replay a case, what's running, what's faked, and where does the faking happen?", "short": "What's real in a replay", "tests": "Intercept depth.", "a": ["The actual agent code runs, and so does the tool code. The only thing we swap is the call out to the provider: with the harness flag on, instead of hitting Gmail it hits the case's SQLite snapshot, which answers in Gmail's shape.", "I did it that way because most of our bugs lived in the seam between what a tool returned and how the model read it. If I'd mocked the whole tool, I'd have been testing the model against a simplified world, and missing exactly the bugs we had."], "land": "Swap the provider, not the tool.", "figs": ["harnessSeam"], "learn": {"figs": ["harnessSeam"], "read": [{"label": "Kitaru docs: what a replay is", "url": "https://docs.zenml.io/kitaru/core-concepts/replay", "m": 6}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/env-snapshots", "label": "Technique: Environment snapshots", "why": "The frozen world the tools answer from."}]}, "id": "q-when-you-replay-a-case-what-s-running-what-s-faked-and-where"}, {"q": "The bench, in five minutes", "short": "The bench, in five minutes", "id": "say-bench5", "tests": "When they want the whole thing: nine beats, each with its number.", "a": ["**The problem.** The agent runs over email and calendar for 5,000-plus users. Every change touched prompts, tools or orchestration, and we had no deterministic way to compare versions. The trigger was a rewrite of how the agent handles multi-turn conversations: too big to eyeball, too risky to ship on vibes.", "**Finding failures.** The scanner runs daily over conversations with cheap deterministic checks first: the agent said it did something and no tool ran, the user repeated themselves, a tool errored and the agent kept going. Twelve classes.", "**Judging.** Deterministic signals over-fire, so an LLM judge sits on top, its rubric built from a week of flags I labelled by hand. It agrees with a human on roughly three in four as genuine, reconciled weekly.", "**Promotion.** A genuine bug is fixed, then promoted: a reconciler adds a new case, updates one, or merges it into one that already covers the failure. A little over a hundred cases now.", "**The snapshot.** For a query type like 'create a task from this email', we pulled about twenty-five real instances and covered every tool used across them, plus deliberate ambiguity. The base is append-only.", "**Replay.** Tool code runs for real; at the provider boundary the call goes to the case's SQLite copy. Writes land there, so a task created at turn two is visible at turn three, and we reset between cases.", "**Scoring.** Deterministic assertions against the snapshot, then a judge only for what can't be counted. The headline is tool calls per completed task: 2.5 down to 2.2 means the same outcome, found faster.", "**Trust and cost.** About ten percent of cases are flaky, so those run three times. A tool change runs only the cases that touch it, under ten minutes; the full bench runs nightly, about half an hour.", "**Outcome.** It's how we signed off the orchestration rewrite: old and new agent against the same hundred-plus cases, and we could point at exactly which cases got better, which got worse, and why."], "land": "Nine beats, each with its number: problem, finding, judging, promotion, snapshot, replay, scoring, trust, outcome."}, {"q": "When did the bench pass something that was actually broken?", "short": "The two missing refunds", "id": "say-refunds", "tests": "A false signal, told as a story. Lead with the case.", "a": ["The clearest one was a ledger request: pull every financial event across my accounts and cards into one view. The agent produced a clean, well-formed ledger and left out two refunds. Every surface check passed, and the same omission showed up again on a later version.", "We found it the way you find most of these: a user noticed the output was wrong rather than malformed. The frustration signals don't fire when an answer merely looks right.", "The lesson was about what the scorer asserted. We checked trajectory and shape, and nothing checked completeness. For this class we could, because we own the snapshot: it knows how many financial events fall in that window, so the case can assert every one appears. That's the advantage of freezing a world rather than a transcript."], "swaps": [{"when": "If they ask where that stops working", "line": "When the answer isn't enumerable. A meeting brief isn't a set you can count, so those need a human lens and stay out of automated gating."}], "land": "The case first: a clean ledger missing two refunds. Then the lesson: assert against ground truth you hold.", "figs": ["completeness"], "learn": {"figs": ["completeness"], "read": [], "sdLinks": []}}, {"q": "What makes a run count as done, and how is it scored?", "short": "How a run is scored", "tests": "Is the headline metric gameable? (Mock 1: three turns to get concrete; 'pass' on four items, three created.)", "probes": ["Who decides 'completed'?", "Four action items, the agent creates three: pass or fail?", "How do you stop teaching to the test?", "Doesn't calls-per-task reward giving up early?"], "a": ["The snapshot decides it, not a model. For 'make a todo list from this email', the snapshot knows the right email and its action items, so the run passes only if the agent read that email and the tasks match.", "Tool calls per completed task is only counted over runs that pass, so an agent that wraps up early on an empty result doesn't look efficient, it fails. We moved it from 2.5 to 2.2 for the same outcomes.", "And we never pin expected text. The assertions come from what the snapshot holds, so if there are four action items, all four have to appear. Pinning a known-good answer would be teaching to the test."], "swaps": [{"when": "If they ask about four items and three created", "line": "It fails, and code decides. Action items are countable, so the case asserts all four; three of four fails and scores 0.75 on completeness. We learned that on the two missing refunds."}, {"when": "If they push on the metric rewarding guesses", "line": "On its own it would reward guessing over clarifying, so it sits next to a count of false completion claims."}], "land": "The snapshot decides done; efficiency only counts runs that pass; never pin expected text.", "figs": ["completeness"], "learn": {"figs": ["completeness"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Technique: Eval suites as release gates", "why": "What a gate asserts before it passes."}]}, "id": "q-what-makes-a-run-count-as-done-and-how-is-it-scored"}, {"q": "A tool the snapshot doesn't cover: what does the agent get back?", "short": "Calls outside the snapshot", "tests": "Provenance: can a reader tell recorded from invented? (Mock 1 gap.)", "a": ["It never leaves the machine: with the harness flag on, every provider call goes to the snapshot, so there's no path to a live system.", "What the agent gets back is honestly the weak spot. Today it's an empty result, and the call is logged against the run. But an empty result is a plausible answer: the agent can read it as 'there are no meeting notes', which is the harness telling it something false.", "So I'd return an explicit 'not in this snapshot' error it can't mistake for data, and treat any run that hit one as harness-limited: out of the headline number, onto a list that becomes the backlog for enriching the snapshot. It's the same problem as a Kitaru passthrough node with no mocked mark."], "land": "Name it as a gap before they do; every answer should carry how it was served.", "figs": ["harnessSeam", "kitaruPolicy"], "learn": {"figs": ["harnessSeam", "kitaruPolicy"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Provenance: no silent live calls."}]}, "id": "q-a-tool-the-snapshot-doesn-t-cover-what-does-the-agent-get-ba"}, {"q": "How do you decide what becomes an eval case, and is the judge still right?", "short": "Finding and judging failures", "tests": "The heart of the role; is the judge measured or trusted?", "probes": ["How do you decide what becomes an eval case?", "How do you know the judge is still right?", "How do you deal with nondeterminism?"], "a": ["The first filter is the whole game, because everything downstream depends on it. Early on a signal flagged 'abandoned' conversations, and a lot of them were one-way notifications where nobody expected a reply. Another class, 'agent did nothing', was just wrong: the agent had acted, we just weren't joining against the tool-execution record. Both got fixed by grounding the signal in what actually executed, not by tuning a threshold.", "Then there are two judges, in different states. The scanner's judge, which decides whether a flag is a real bug, is calibrated weekly against fresh human labels: about three in four agreement. The completeness judge on the bench isn't calibrated yet; where the answer is countable I replaced it with assertions, so it only judges what can't be counted.", "To tell judge drift from agent change I'd keep a frozen set of past outputs and re-judge it whenever the judge's model or prompt changes. The outputs didn't move, so if the verdicts did, the judge moved."], "swaps": [{"when": "If they ask about nondeterminism", "line": "Remove it where an action commits a side effect: the decision layer is deterministic risk scoring, not a model call. Elsewhere, the flaky ten percent run three times and report a pass rate; one lucky run never counts."}], "land": "Ground signals in what executed; two judges, one calibrated, one honestly not; re-judge frozen outputs.", "figs": ["benchLoop", "passk"], "learn": {"figs": ["benchLoop", "passk"], "read": [{"label": "Hamel Husain: your AI product needs evals", "url": "https://hamel.dev/blog/posts/evals/index.html", "m": 22}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Technique: Eval suites as release gates", "why": "What the cases become once they are in."}]}, "id": "q-how-do-you-decide-what-becomes-an-eval-case-and-is-the-judge"}, {"q": "Why SQLite when production is Postgres?", "short": "Why SQLite", "tests": "The sharpest fidelity question you will face.", "a": ["Two reasons, one good and one I'd revisit. The good one: a snapshot is a single file. Trivial to capture, trivial to spin up per case, full isolation between cases, and I can open it and see exactly what the agent saw.", "The one I'd revisit: it isn't the production engine. No row-level security, different types, dialect differences. So it tests agent behaviour faithfully and database behaviour not at all.", "Rebuilt today I'd use Postgres template databases, CREATE DATABASE ... TEMPLATE, cloning per case at near-SQLite speed on the real engine. Did the gap bite? Not that I caught, which isn't quite the same thing."], "swaps": [{"when": "If they ask why it was right at the time", "line": "One local runner, a tiny team, and isolation per run mattered more than a distributed database. SQLite was enough for the problem and the team we had."}, {"when": "If they ask what breaks first as it grows", "line": "Concurrent writers, running it across machines, and production semantics like RLS. Next step: per-run isolated databases, then ephemeral Postgres. The invariant stays: every run starts from a known, isolated state."}], "land": "Name the fidelity you traded, then the production-grade alternative.", "learn": {"figs": ["sqliteTemplate"], "read": [{"label": "Postgres docs: template databases", "url": "https://www.postgresql.org/docs/current/manage-ag-templatedbs.html", "m": 4}, {"label": "SQLite docs: datatypes and type affinity", "url": "https://www.sqlite.org/datatype3.html", "m": 18}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/env-snapshots", "label": "Technique: Environment snapshots", "why": "Two ways to give every case its own world."}]}, "id": "q-why-sqlite-when-production-is-postgres"}, {"q": "What happens when the production schema changes?", "short": "Schema changes", "tests": "Have you lived with it, or only built it?", "a": ["The base snapshot is append-only by design: old rows don't move under old cases, and a new case that needs another Michael gets a new name. So a case that used to pass and now fails points at the agent, not the fixture.", "What I'd add on top is to version the snapshot, pin each case to a version, and fail loudly on a mismatch. A test that silently measures the wrong thing is worse than one that refuses to run."], "land": "It rots quietly unless the version is pinned and checked.", "learn": {"figs": [], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/consistency/event-sourcing", "label": "Technique: Event sourcing and append-only ledgers", "why": "Append-only is why an old case never moves under you."}]}, "id": "q-what-happens-when-the-production-schema-changes"}, {"q": "How long does one case take to author, and what would you change?", "short": "What it cost, and what you'd change", "tests": "The number the scaling argument rests on. Don't dodge it.", "a": ["I never instrumented it, so this is an estimate rather than a measurement: about three to four hours a case at the start, dropping to forty-five minutes to an hour once the scanner pulled the traces and prior turns together automatically.", "It's expensive, and that's the honest trade-off: we bought answers that hold up when the agent takes a new path, and paid in expert time per case.", "What I'd change: instrument authoring time from day one, since I can't give you a measured number, and version the base snapshot explicitly instead of relying on append-only discipline."], "land": "Estimate first, with its basis; then two concrete changes.", "learn": {"figs": ["benchLoop"], "read": [{"label": "Hamel Husain: your AI product needs evals", "url": "https://hamel.dev/blog/posts/evals/index.html", "m": 22}], "sdLinks": []}, "id": "q-how-long-does-one-case-take-to-author-and-what-would-you-cha"}, {"q": "What doesn't the bench catch, and did it gate deploys?", "short": "Where the bench stops", "tests": "Do you volunteer the limit?", "a": ["Anything where the right answer isn't countable from the fixture, like whether a meeting brief is actually useful. And anything the scanner never saw fail: the bench only knows failures that already happened, so new features start with no coverage.", "On gating: nightly runs plus subset runs on changes, reviewed by whoever made the change. It blocked the big releases, like the orchestration rewrite. It wasn't a hard gate on every commit, because a thirty-minute run with model variance on every push would have slowed the team more than it protected them."], "land": "Volunteer the limit; it gated the releases that mattered.", "figs": ["completeness"], "learn": {"figs": ["completeness"], "read": [{"label": "Anthropic: demystifying evals for AI agents", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "m": 40}], "sdLinks": []}, "id": "q-what-doesn-t-the-bench-catch-and-did-it-gate-deploys"}]}, {"group": "Designing replay and evals", "blurb": "First principles: what is frozen, how it runs, how it's scored. Compact.", "items": [{"q": "What's hard about replay? Design one from scratch.", "short": "Design a replay and eval system", "tests": "Structure before boxes; name the hard part.", "a": ["Four decisions, in order. Requirements: reproducing a failure, testing a change, measuring capability or efficiency? Each wants something different.", "Determinism: decide what's frozen, the transcript, the world, the tool results or only the effects. Kitaru freezes the transcript; my bench froze the world.", "Execution: workers claiming runs with leases, slots, retries, cancellation and isolation per run. Evaluation: outcome and final state first, then policy, then trajectory, then cost, then repeatability.", "And the hard part isn't capture, it's divergence: exact keys punish the change you're measuring."], "land": "Requirements, what's frozen, how it runs, how it's scored. The hard part is divergence.", "figs": ["forkReplay", "kitaruFreeze"], "learn": {"figs": ["forkReplay", "kitaruKey", "kitaruFreeze"], "read": [{"label": "Temporal: workflow execution, event history and replay", "url": "https://docs.temporal.io/workflow-execution", "m": 3}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Divergence, drawn for both designs."}]}, "id": "q-what-s-hard-about-replay-design-one-from-scratch"}, {"q": "Two runs take different paths to the same right answer. Pass or fail?", "short": "Different paths, same answer", "tests": "Outcome versus trajectory.", "a": ["Pass. Score the final state against a goal state, not the path; tau-bench scores the final database state against an annotated goal for exactly this reason.", "Trajectory is a separate score: efficiency and policy. Keep them apart, so a better path isn't punished as a regression."], "land": "Final state for pass or fail; trajectory scored separately.", "figs": ["completeness"], "id": "q-two-runs-take-different-paths-to-the-same-right-answer-pass-", "learn": {"figs": ["completeness"], "read": [], "sdLinks": []}}, {"q": "pass@k or pass^k?", "short": "pass@k or pass^k", "tests": "Reliability versus capability.", "a": ["pass@k is 'succeeds at least once in k tries': capability, can it ever do this. pass^k is 'succeeds every time in k tries': reliability, what a user lives with.", "For an agent acting on someone's mailbox, pass^k is the honest number; tau-bench showed agents that look fine on one try fall off as k grows."], "land": "pass@k asks 'can it', pass^k asks 'will it every time'.", "figs": ["passk"], "id": "q-pass-k-or-pass-k", "learn": {"figs": ["passk"], "read": [], "sdLinks": []}}, {"q": "Multi-turn: the agent's reply changes at turn two. What happens at turn three?", "short": "Multi-turn divergence", "tests": "The open problem.", "a": ["The recorded turn-three user message may no longer make sense, in Kitaru or in my bench: freezing the world doesn't fix a user who would have said something else.", "Options: last-turn replay, honest but blind; a stateful world across turns, which fixes effects but not replies; or a simulated user seeded from the recording, which only counts once it's calibrated against real replies. I'd scope the simulator to sessions that actually fork early."], "land": "A simulator counts only once it's calibrated.", "figs": ["kitaruTurns", "multiturn"], "learn": {"figs": ["kitaruTurns", "multiturn"], "read": [{"label": "tau-bench paper: tool, agent and a simulated user, and pass^k", "url": "https://arxiv.org/abs/2406.12045", "m": 10}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Multi-turn replay is one of the deep dives."}]}, "id": "q-multi-turn-the-agent-s-reply-changes-at-turn-two-what-happen"}, {"q": "How would you sandbox replays of a customer's agent?", "short": "Sandboxing", "tests": "Threat model first.", "a": ["Threat model first: protect the host, keep tenants apart, stop exfiltration. The worker runs in the customer's environment, which answers most of it by design.", "Inside that: task-scoped credentials that expire with the task, and isolation picked by risk up a ladder: process, container, gVisor or Kata, microVM. Effects by class: reads allowed, reversible writes in a window, irreversible ones behind confirmation, and the adapter must see every effect."], "land": "Threat model, task-scoped credentials, an isolation ladder by risk, effects by class.", "figs": ["kitaruLive"], "id": "q-how-would-you-sandbox-replays-of-a-customer-s-agent", "learn": {"figs": ["kitaruLive"], "read": [], "sdLinks": []}}, {"q": "Stub, mock, fake, record-replay: when would you use each?", "short": "Stub, mock, fake, replay", "tests": "Testing vocabulary with judgement.", "a": ["A stub returns a canned answer; a mock also asserts how it was called; a fake is a small working implementation with state; record-replay reuses real results deterministically.", "My snapshot is a fake, so a new path still gets a coherent answer; Kitaru is record-replay, cheap and realistic for paths already seen. For stateful agents fakes beat mocks; the product question is when to promote one into the other."], "land": "My bench is a fake, Kitaru is record-replay.", "figs": ["kitaruFreeze"], "id": "q-stub-mock-fake-record-replay-when-would-you-use-each", "learn": {"figs": ["kitaruFreeze"], "read": [], "sdLinks": []}}]}, {"group": "Kitaru, from the inside", "blurb": "They won't ask these directly. Know them, and drop one in where it fits.", "items": [{"q": "What's wrong with Kitaru?", "short": "What's wrong with Kitaru", "id": "say-critique", "tests": "Name one thing that's wrong or oversold. Never answer with a compliment. If stuck: 'give me a second'.", "a": ["The one that stood out to me is provenance on mocked calls. When a tool has no policy, or on_miss is set to passthrough, the call goes out to the live provider and the node doesn't carry anything saying so. Someone reading a replay can't tell which results came from the recording and which came from the real world.", "That one's personal, because the equivalent bug at alfred_ was the agent claiming it did something it never did. We fixed it by grounding the claim against the real tool-execution record rather than the agent's account of it.", "The second is time: the tool results are frozen but the agent's clock isn't, so anything reasoning about 'today' drifts against an old snapshot."], "land": "Provenance: a reader can't tell recorded from live. Asked as a question, tied to your own anti-fabrication fix.", "notes": ["In reserve: evaluators see only what the trace captured; provider-native tools bypass the policy; no repeat-run machinery; multi-turn replays only the last turn.", "Ask about the gaps as questions. Never call them bugs; they maintain the code."], "figs": ["kitaruPolicy"], "learn": {"figs": ["kitaruPolicy"], "read": [], "sdLinks": []}}, {"q": "The architecture, in one breath", "short": "The architecture", "tests": "Drop it when they describe the product: shows you read the source.", "a": ["A control plane that never runs user code: FastAPI, Postgres and a blob store holding tasks, configs, datasets and results.", "Workers run in the customer's environment, claim tasks with a lease, and spawn the agent as a normal subprocess with the replay id in its environment. An adapter inside hooks the framework's tool execution and answers each call from the recording by SHA-256 of the tool name and canonical arguments."], "land": "The server coordinates and never runs your code; the worker runs it; the adapter answers tools by hash.", "figs": ["kitaruPlanes", "kitaruReplay"], "id": "q-the-architecture-in-one-breath", "learn": {"figs": ["kitaruPlanes", "kitaruReplay"], "read": [], "sdLinks": []}}, {"q": "The data model, and the part worth admiring", "short": "SessionNode and selectors", "tests": "Say the admiring part out loud before any critique.", "a": ["A session is one recursive table of nodes: spans, model calls, tool calls, subagent calls, joined by a parent id, so nesting goes to any depth and a recursive query walks it.", "The part worth admiring is the selectors: a JSON path into the payload instead of copied text, so a human judgement, an evaluator verdict and the UI all point at the same coordinates. I hand-rolled a worse version of that."], "land": "One recursive table; selectors point at evidence instead of copying it.", "figs": ["kitaruModel"], "id": "q-the-data-model-and-the-part-worth-admiring", "learn": {"figs": ["kitaruModel"], "read": [], "sdLinks": []}}, {"q": "Policies, and what runs live whatever you configure", "short": "Policies and live calls", "tests": "Drop it on any side-effect or trust question.", "a": ["Per-tool policies, found by exact name then the default: passthrough (the default), history by cache key, static cases, and an llm policy the PydanticAI adapter rejects. A miss goes to on_miss: fail, error_result, or passthrough.", "Model calls always run live, so an unchanged baseline is billed and not deterministic. Provider-native tools are recorded but never checked. And a bare HTTP call inside the agent isn't a tool, so no hook sees it."], "land": "The default is passthrough; model calls, native tools and bare HTTP all run live.", "figs": ["kitaruPolicy", "kitaruLive"], "id": "q-policies-and-what-runs-live-whatever-you-configure", "learn": {"figs": ["kitaruPolicy", "kitaruLive"], "read": [], "sdLinks": []}}, {"q": "Repeated calls, and multi-turn", "short": "Repeated calls and multi-turn", "tests": "Details that show depth; ask about them as questions.", "a": ["Repeated identical calls flip with scope: under baseline scope the nth call gets the nth recorded result, under agent or cohort scope it's the latest every time. The occurrence counter is read, the lookup awaited, then written, so two concurrent identical calls could take the same ordinal.", "Multi-turn replays only the last turn: earlier turns are injected as text with their tool calls dropped, so a fork only ever writes the final turn."], "land": "Scope decides which recorded result repeats; only the last turn re-executes.", "figs": ["kitaruOrder", "kitaruTurns"], "id": "q-repeated-calls-and-multi-turn", "learn": {"figs": ["kitaruOrder", "kitaruTurns"], "read": [], "sdLinks": []}}, {"q": "Durable execution, and the pivot to replay evals", "short": "Durable execution to replay", "tests": "Understanding their history from the inside.", "a": ["Kitaru launched in April as a durable execution layer for Python agents: crash recovery, human-in-the-loop with wait(), replay from any checkpoint. By August it was positioned as replay-based evals.", "Same substrate, different intent: durable execution replays history to get the same result again after a crash; an eval replays it to get a different result and understand why. The checkpoints and the recording were already there."], "land": "Same recording, opposite intent.", "notes": ["The nouns: Kitaru's @flow and @checkpoint, ZenML's @pipeline and @step (from the job post). Both Apache 2.0."], "figs": ["kitaruPosition"], "id": "q-durable-execution-and-the-pivot-to-replay-evals", "learn": {"figs": ["kitaruPosition"], "read": [], "sdLinks": []}}, {"q": "If you ran Kitaru for a quarter, what would you ship first?", "short": "A quarter on Kitaru", "tests": "Product judgement with dependencies.", "a": ["I wouldn't rebuild the runner, the sandbox or the replay layer; those work. First, provenance on every node: small, and everything else depends on a reader trusting where a result came from. Then productive misses: the diff and one action to accept a variant.", "Then the evaluation layer above the runner: production traces into eval cases, stateful multi-turn environments, scoring by outcome and final state plus policy, and regression analytics across runs. The useful unit isn't only a recorded trajectory; it's whether an agent can reliably change a realistic world into the right state."], "land": "Trust first, then productive misses, then the evaluation layer above the runner.", "figs": ["missFlow", "kitaruLive"], "learn": {"figs": ["missFlow", "kitaruLive"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Provenance and misses, as design problems."}]}, "id": "q-if-you-ran-kitaru-for-a-quarter-what-would-you-ship-first"}]}, {"group": "Backend depth", "blurb": "Idempotency, failures, grants and providers, compact; then two big design questions with their own boards: rebuilding and scaling your harness, and Kitaru with worlds and multi-turn.", "items": [{"q": "A side-effecting tool call fails halfway. What happens?", "short": "A side effect fails halfway", "tests": "Idempotency and crash windows.", "a": ["You can't get exactly-once against a third-party API you don't control, so the goal is exactly-once logical effect: at-least-once delivery with effects that are safe to repeat.", "We write the intent to a tool-execution ledger before the call, so there's a record even if the process dies mid-flight; the anti-fabrication guards read the same ledger. Side-effecting actions sit behind a confirm verdict with a bounded undo window.", "If the send succeeded but the response timed out, look the effect up at the provider before retrying blind. The real design work is where the idempotency key lives."], "land": "Intent first, a key, reconcile before retry.", "notes": ["Classify first: read, idempotent write, non-idempotent write, external effect.", "On a forked replay, a write that misses fails closed."], "figs": ["zenEffects", "alfredWrap"], "learn": {"figs": ["zenEffects", "alfredWrap"], "read": [{"label": "Stripe, \"Designing robust and predictable APIs with idempotency\"", "url": "https://stripe.com/blog/idempotency", "m": 12}, {"label": "Brandur Leach: Stripe-like idempotency keys in Postgres", "url": "https://brandur.org/idempotency-keys", "m": 22}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/multi-step/idempotency", "label": "Technique: Idempotency keys", "why": "Where the key lives decides whether a retry is safe."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/unknown-results", "label": "Technique: Idempotent tools and unknown results", "why": "The send succeeded but the response timed out."}]}, "id": "q-a-side-effecting-tool-call-fails-halfway-what-happens"}, {"q": "A worker dies halfway through a replay. What happens?", "short": "A worker dies", "tests": "Leases, retries, cancellation.", "a": ["The task was claimed with SKIP LOCKED and holds a lease kept alive by heartbeats; when they stop, a sweeper sees the expired lease and requeues it.", "The rerun must be safe: replay mostly is, anything live needs an idempotency key. Cancellation must kill the whole process tree, or orphaned subprocesses keep calling out, and retries need backoff with jitter, or a bad deploy becomes a retry storm."], "land": "Lease, heartbeat, sweeper; safe reruns; kill the tree; backoff with jitter.", "figs": ["skipLocked"], "id": "q-a-worker-dies-halfway-through-a-replay-what-happens", "learn": {"figs": ["skipLocked"], "read": [], "sdLinks": []}}, {"q": "Hardest bug you've debugged?", "short": "The PUBLIC grant", "tests": "Mechanism-level understanding.", "a": ["Agent-facing read functions in Postgres were SECURITY DEFINER, so they run with the definer's privileges and can see past row-level security to do their job. The subtle part: Postgres grants EXECUTE to PUBLIC by default on a new function, so a function deliberately bypassing RLS was callable by any authenticated role. A cross-user leak class.", "Nothing was exploited; it came out of an adversarial design review. We fixed the grants, and the more important fix was the migration checklist and a test: no SECURITY DEFINER function may carry a PUBLIC execute grant."], "land": "Fix the class, not the instance.", "figs": ["definerGrant"], "learn": {"figs": ["definerGrant"], "read": [{"label": "Postgres docs: CREATE FUNCTION, writing SECURITY DEFINER functions safely", "url": "https://www.postgresql.org/docs/current/sql-createfunction.html", "m": 3}, {"label": "Supabase docs: row-level security and security definer functions", "url": "https://supabase.com/docs/guides/database/postgres/row-level-security", "m": 24}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-safety/least-privilege", "label": "Technique: Least privilege and sandboxing", "why": "Least privilege failing by default."}]}, "id": "q-hardest-bug-you-ve-debugged"}, {"q": "How do you normalise Gmail, Outlook and IMAP?", "short": "Three mail providers", "tests": "Provider adapters, your own world.", "a": ["One internal model behind all three, where each provider fails differently: the same problem as Kitaru's importers across Langfuse, LangSmith and Braintrust, with different nouns.", "Provider schemas stay at the edge; inside there's one canonical model with time zones, ids and contacts normalised. Contract tests against recorded payloads catch drift, and the raw payload is kept next to the normalised one for debugging."], "land": "Provider schemas at the edge, one model inside, contract tests for drift, raw payload kept.", "notes": ["Have one concrete behavioural difference between providers ready, and what it forced in the model."], "learn": {"figs": [], "read": [{"label": "Gmail API: synchronising a client with history.list", "url": "https://developers.google.com/workspace/gmail/api/guides/sync", "m": 3}, {"label": "Microsoft Graph: delta query for messages", "url": "https://learn.microsoft.com/en-us/graph/delta-query-messages", "m": 8}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/email-agent/hld", "label": "Email and calendar agent, high-level design", "why": "The providers behind one model."}]}, "id": "q-how-do-you-normalise-gmail-outlook-and-imap"}, {"q": "Your eval harness: why this shape, what would you change, what breaks at scale, and how would you productionize it?", "short": "Design 1: rebuild and scale your harness", "tests": "The big one. Do you know why your system is the way it is, where it breaks, and how you'd grow it into something other people rely on?", "probes": ["Why did you build it this way?", "If you rebuilt it today, what would you change, and what would you keep?", "What breaks first at ten times the cases, then a hundred?", "How would you scale it?", "How would you productionize it so other teams use it?", "SQLite or Postgres, honestly?"], "parts": [{"title": "1. Why it's built this way: the constraints", "items": ["One product, a small team, one local runner, and one question: is the new agent actually better than the old one? A little over a hundred cases, not thousands.", "**Freeze the world, not the transcript.** A snapshot per task, built from about twenty-five real instances, so the agent can take a path it never took in production and still get a truthful answer.", "**SQLite per task.** A single file: trivial to capture, isolated by construction, disposable, and I can open it and see exactly what the agent saw.", "**Swap the provider, not the tool.** Most bugs lived in the seam between tool output and the model, so tool code runs for real.", "**Cases come from real failures.** Scanner, calibrated judge, promotion with de-duplication."]}, {"title": "2. What I'd keep", "items": ["The seam at the provider boundary.", "Assertions computed from the snapshot, never pinned text.", "An append-only base, so an o
