gainst the snapshot: the right tools, the right records, every event in the window in the output. Then an LLM judge for what is not enumerable, like a summary's quality. The headline number is tool calls per completed task: 2.5 down to 2.2 means the same outcome, found faster.", "**Trustworthy and cheap.** About ten percent of cases are flaky, so those run three times and we read a pass rate. A change to a tool or its description runs only the cases whose snapshots touch it: fifteen to thirty cases, under ten minutes. The full bench runs nightly, about half an hour.", "**Outcome.** It's how we signed off the orchestration rewrite: old and new agent against the same hundred-plus cases, and we could point at exactly which cases got better, which got worse, and why."]}, {"id": "refunds", "land": "The case first: a clean ledger missing two refunds. Then the lesson: assert against ground truth you hold.", "title": "When the bench passed something broken", "length": "about 75 seconds", "when": "Tell me about a false signal. Lead with the case, never with 'I don't have one'.", "say": ["The clearest one was a ledger request: pull every financial event across my accounts and cards into one view. The agent produced a clean, well-formed ledger and left out two refunds. Every surface check passed, and the same omission showed up again on a later agent version.", "We found it the way you find most of these: a user noticed the output was wrong rather than malformed. The report path and the frustration signals don't fire when an answer merely looks right.", "The lesson was about what the scorer asserted. We checked trajectory and shape, and nothing checked completeness. For this class we could, because we own the snapshot: the fixture knows how many financial events fall in that window, so the case can assert every one appears. That's asserting against ground truth we hold, which is different from pinning an expected answer, and it's the advantage of freezing a world rather than a transcript.", "Where I'd stay honest: it only works when the correct answer is enumerable from the fixture. A meeting brief isn't a set you can count, so those need a human lens and stay out of automated gating."]}, {"id": "miss", "land": "A miss is information. Make it cheap to resolve: diff, accept as an alias, then policy by effect.", "title": "The cache miss: the better the change, the worse the replay", "length": "about 90 seconds", "when": "A prompt change makes the agent call search_email with different phrasing, and the replay dies.", "say": ["First thing I'd separate: a miss is information. It's telling you the agent's behaviour changed, which is the thing you were measuring. So the goal isn't to make misses disappear, it's to stop a miss from killing the run and make it cheap for a human to resolve.", "What I'd ship first is the miss experience. Fail loudly with a diff: the recorded call, what the new agent tried, how far apart they are. Then one command to accept that variant as equivalent, which writes a static alias. Deterministic, auditable, no threshold, and it generates labelled pairs for anything automatic later.", "Second, enrichment at import: index the argument variants seen across every session with the same intent, so one recorded result can answer phrasings you've actually observed. That's what we did at alfred_ by hand. It needs volume, so it defaults off.", "Fuzzy matching last, carefully: pick the band from score distributions of known-equivalent and known-different pairs, treat the overlap as ambiguous, and ship it in shadow, then suggest, then opt-in per tool. To know it's wrong a week later: a golden set tracked every release, plus miss rate, fuzzy-hit share and the ambiguous share. And every fuzzy hit is stamped on the node, because a silent false pass is the worst bug an eval product can ship."]}, {"id": "critique", "land": "Provenance: a reader cannot tell recorded from live. Asked as a question, tied to your own anti-fabrication fix.", "title": "What's wrong with Kitaru", "length": "about 60 seconds", "when": "Name one thing that's wrong, badly designed or oversold. Never answer with a compliment. If stuck: 'give me a second'.", "say": ["The one that stood out to me is provenance on mocked calls. When a tool has no policy, or on_miss is set to passthrough, the call goes out to the live provider and the node doesn't carry anything saying so. Someone reading a replay can't tell which results came from the recording and which came from the real world. For a product whose core promise is that a replay is trustworthy, I'd want every node stamped with how it was served.", "That one's personal, because the equivalent bug at alfred_ was the agent claiming it did something it never did. We fixed it by grounding the claim against the real tool-execution record rather than the agent's account of it. Same shape of problem.", "The second is time: the tool results are frozen but the agent's clock isn't, so anything reasoning about 'today' drifts against an old snapshot and shows up as a confusing failure rather than an obvious one."], "never": ["In reserve: evaluators see only what the trace captured; provider-native tools bypass the policy; there is no repeat-run machinery; multi-turn replays only the last turn.", "Ask about the gaps as questions. Never call them bugs."]}, {"id": "compare", "land": "Kitaru froze the transcript, I froze the world; they fail in opposite directions. Promote on fork.", "title": "The comparison, when they ask how the two designs differ", "length": "about 30 seconds", "when": "Hold this until they ask. It is the strongest closing move.", "say": ["Kitaru freezes the transcript, so ingestion is free and counterfactuals are brittle. We froze the world, so counterfactuals held up and ingestion was expensive. They fail in opposite directions.", "The interesting product question is whether a recorded session can be promoted into a small queryable world model on demand, so the common case stays free and only the sessions you actually fork on get upgraded into something the agent can explore."]}, {"id": "close", "land": "I've built this in-house and know what it costs. I'd like to build it as the product.", "title": "The close", "length": "about 20 seconds", "when": "The last minute. Then ask about next steps plainly.", "say": ["This is the first eval product whose source I've read and come away thinking the hard parts were hard for the right reasons. I've been on the other side of it: I know what it costs to build in-house and what it costs to keep. I'd like to build it as the product."]}], "drills": [{"id": "intro", "prompt": "Introduce yourself.", "target": "40 seconds", "seconds": 40, "ref": "#say-intro"}, {"id": "seat", "prompt": "Why this seat, and why now?", "target": "45 seconds", "seconds": 45, "ref": "#say-seat"}, {"id": "bench2", "prompt": "Tell me about your eval bench.", "target": "2 minutes", "seconds": 120, "ref": "#say-bench2"}, {"id": "refunds", "prompt": "When did your bench pass something that was actually broken?", "target": "75 seconds", "seconds": 75, "ref": "#say-refunds"}, {"id": "critique", "prompt": "Name one thing in Kitaru that's wrong or oversold.", "target": "60 seconds", "seconds": 60, "ref": "#say-critique"}, {"id": "miss", "prompt": "A prompt change causes a cache miss and the replay dies. What would you do?", "target": "90 seconds", "seconds": 90, "ref": "#say-miss"}, {"id": "sqlite", "prompt": "Why SQLite when production is Postgres?", "target": "60 seconds", "seconds": 60, "ref": "#qa"}, {"id": "halfway", "prompt": "A side-effecting tool call fails halfway. What happens?", "target": "60 seconds", "seconds": 60, "ref": "#qa"}, {"id": "langs", "prompt": "LangChain, LangGraph, LangSmith: what's the difference?", "target": "30 seconds", "seconds": 30, "ref": "#qa"}, {"id": "close", "prompt": "Close the interview.", "target": "20 seconds", "seconds": 20, "ref": "#say-close"}], "qa": [{"group": "The role: product engineer, in public", "blurb": "What product engineer means to you, the move into it, and the public half of the job that Lennart and Michael both raised.", "items": [{"q": "What does a product engineer mean to you?", "short": "What product engineer means to you", "tests": "Do you know the job, or only the title?", "a": ["Owning the loop from a user's confusion to the shipped fix, and back to the user. Not a layer of the stack: the problem.", "At alfred_ that's what the eval work really was. I read real conversations to find what broke, fixed it, built the tool that proves it stays fixed, and wrote it up so the team used it.", "For Kitaru it's the same loop with developers as the users: someone's replay misses, I see it in Slack or GitHub, reproduce it, ship the fix and the doc, and reply in the thread. And the part engineers skip: making sure people know it exists."], "land": "Owning the loop from a user's confusion to the shipped fix, and back to the user.", "notes": ["Their post: 'This is not a backend role or a frontend role.' 'Own the complete loop: design, implementation, tests, documentation, rollout.'", "'Convert user confusion into same-day PRs' and 'fix onboarding friction through PRs, not tickets'. Your answer should sound like that week, not a definition.", "End on the public part: it is the half they asked about in both earlier rounds."], "id": "q-what-does-a-product-engineer-mean-to-you"}, {"q": "You've been a backend and AI engineer. Why product engineer, and why now?", "short": "Why the move to product engineer", "tests": "Is this a real move or a relabel? Will you miss deep specialist work?", "a": ["I've been doing the job without the title. The work that mattered most at alfred_ wasn't a layer of the stack; it was noticing we couldn't tell whether a new agent was better, and building the thing that could.", "What I want now is for that to be the job, on a product whose users are engineers like me, where I feel a clunky API myself instead of hearing about it.", "Kitaru is that. I built a rough version of it in-house, so I know the user's pain from the inside, and I know which parts of it were hard."], "land": "I've been doing the job without the title; I want it to be the job, on a product for engineers like me.", "notes": ["The post rules out 'specialists seeking deep focus in one stack area' and people who see 'ship in days' as reckless. Say you want breadth and pace.", "It asks for 'product taste for developer tools': feel 'physical pain when an API is clunky'. Have one API you find clunky and why, from your own work.", "Keep alfred_ positive: the move is towards this, not away from there."], "id": "q-you-ve-been-a-backend-and-ai-engineer-why-product-engineer-a"}, {"q": "This role is partly public: posting, demos, talking about Kitaru. How do you feel about that?", "short": "The public half of the job", "tests": "Will you actually do it, and do it like a senior engineer rather than a marketer?", "a": ["I like it, and it isn't new to me. I have a YouTube channel, I'm active on LinkedIn, and I post when I build my own projects: MockFlow-AI shipped with a launch video, and I presented MetaRAG at INFORMS Analytics+ to 700-plus practitioners.", "What I haven't done yet is do it for an employer's product, and that's part of why this role appeals.", "For an open-source developer tool, writing about what you shipped is part of shipping. The release, the docs, the example and the post are one piece of work. And I'd rather show a working replay than describe one: engineers share what teaches them something they can use on Monday."], "land": "Public is part of shipping for an open-source tool, and I already do it for my own work.", "notes": ["Lennart and Michael both raised it explicitly. They want someone ready to build in public. Treat it as a skill with a habit behind it, not enthusiasm.", "Senior framing: posts that teach (a walkthrough on real data, an honest trade-off essay) over announcements. Never hype, never follower counts.", "Be honest about the gap (not for an employer yet) and pair it with a plan (a post per meaningful release). That is their value Be honest in action.", "Have one link ready to share on screen: your best video or the talk."], "id": "q-this-role-is-partly-public-posting-demos-talking-about-kitar"}, {"q": "What would your first post about Kitaru be?", "short": "Your first post about Kitaru", "tests": "Taste: do you know what developers read?", "a": ["A walkthrough on real data, not a feature list. Import a handful of traces from an agent, find a failure, change the prompt, replay, and show the one case that got fixed and the one that got worse. Under five minutes, repo linked.", "The second would be the essay behind it: freezing the transcript against freezing the world. It's the trade-off I lived at alfred_, and every team building agent evals hits it.", "Both teach something a reader can use on Monday, and both end with Kitaru doing the work."], "land": "A five-minute walkthrough on real traces: find a failure, change one thing, prove it with a replay.", "notes": ["ZenML's own public content is useful first: the LLMOps Database is about 2,100 real case studies. Match that tone.", "Alex writes publicly on his blog; referencing a post of his you actually read is a good bridge, if it is true."], "figs": ["forkReplay"], "id": "q-what-would-your-first-post-about-kitaru-be", "learn": {"figs": ["forkReplay"], "read": [], "sdLinks": []}}, {"q": "Explain Kitaru to an engineer who has never heard of it, in thirty seconds.", "short": "Kitaru in thirty seconds", "tests": "Can you sell the product plainly?", "a": ["You have agent sessions in production and a change you want to make. Kitaru records what the tools returned, then re-runs your real agent against those recorded answers, so you see what your change does to real sessions without touching production.", "It's regression testing for agents, built from traffic you already have. And because it grew out of durable execution, the same recording lets a crashed agent resume from its last checkpoint instead of starting over."], "land": "Regression testing for agents, built from the traffic you already have.", "notes": ["Launch (April 2026): a durable execution layer for Python agents, with crash recovery, human-in-the-loop and replay from any checkpoint. The replay-eval framing came in August. Both are true; lead with the one their homepage leads with on the day."], "figs": ["kitaruReplay"], "id": "q-explain-kitaru-to-an-engineer-who-has-never-heard-of-it-in-t", "learn": {"figs": ["kitaruReplay"], "read": [], "sdLinks": []}}, {"q": "What would you do in your first month?", "short": "Your first month", "tests": "Do you start with users and ship early?", "a": ["First two weeks: use Kitaru the way a new user does, on a real agent of mine, and write down every stumble. Read the support threads in Slack and GitHub. Pick up small user-reported bugs, so I learn the codebase by shipping.", "By the end of the month: one visible improvement from those notes, shipped with its doc and a short post. Probably the miss experience, since that's where replays hurt first.", "And I'd ask you both which user problem is costing you most, and start there instead of my guess."], "land": "Use it as a new user, ship small fixes to learn the code, then one visible improvement with its doc and post.", "notes": ["The post: 'Use Your Own Products', 'Fix onboarding friction immediately through PRs, not tickets'.", "Ending with a question to them turns a plan into a conversation."], "id": "q-what-would-you-do-in-your-first-month"}, {"q": "Users ask for everything. How do you decide what to build?", "short": "Deciding what to build", "tests": "Product judgement and pace.", "a": ["Frequency times pain, weighted by whether it blocks adoption. At alfred_ the scanner told me what actually broke rather than what people guessed would break, and that ordering beat any roadmap debate.", "For a developer tool: first anything that stops someone getting a first replay working, because that's where you lose them. Then what many users hit. Then the hard, interesting problems.", "And I'd rather ship a two-day prototype and watch someone use it than write a two-week design doc."], "land": "First whatever blocks the first replay, then what many users hit, then the hard problems; prototype over debate.", "notes": ["The post: not for those 'preferring two-week design debates over two-day prototypes'.", "Their value Be efficient: 'fail fast and learn even faster'."], "id": "q-users-ask-for-everything-how-do-you-decide-what-to-build"}, {"q": "What's a weakness you're working on?", "short": "A weakness", "tests": "Self-awareness without a fake weakness.", "a": ["Doing the public part professionally. I build in public on my own projects, but I haven't been the person writing about an employer's product on a schedule.", "I'd close it the way I close any gap: a cadence rather than inspiration. Here that would be a post for every meaningful release, written as part of shipping it, the same way the doc is."], "land": "The public part, done professionally: I'd make it a cadence tied to releases.", "notes": ["A true weakness that the role fixes reads better than 'I work too hard'.", "Keep it short; don't reopen it."], "id": "q-what-s-a-weakness-you-re-working-on"}, {"q": "How do you give and take code review?", "short": "Code review", "tests": "Low ego, high standards.", "a": ["Direct on the code, kind to the person. I say what I'd change and why, and I separate 'must fix' from 'taste'.", "Taking it, I'd rather be corrected than stay wrong, and I read every line I merge, including what a coding agent wrote. An agent's code gets reviewed like a colleague's, not trusted like a compiler's."], "land": "Direct on the code, kind to the person; I'd rather be corrected than stay wrong.", "notes": ["The post, word for word: 'Direct in code reviews, kind in conversation. Prefer correction over being wrong.' Show it; do not quote it."], "id": "q-how-do-you-give-and-take-code-review"}, {"q": "Which of our values do you connect with?", "short": "Their values", "tests": "Did you read about us, and is it real?", "a": ["Be honest: provide candid feedback and own your actions. The eval work only worked because we stopped trusting the agent's own account and checked the execution record.", "I try to hold myself to the same standard, including in an interview: I'd rather say 'I don't know, here's how I'd find out' than bluff."], "land": "Be honest, because the whole eval story is about not trusting an account over the record.", "notes": ["Their five: Challenge everything, Empathize, Be efficient, Enable others, Be honest.", "Pick one and tie it to a story; do not list all five."], "id": "q-which-of-our-values-do-you-connect-with"}, {"q": "Where do you want to be in two or three years?", "short": "Two or three years out", "tests": "Ambition that fits a small company.", "a": ["Owning a product area of developer infrastructure end to end: the users, the code, and the story people tell about it.", "And close enough to agents in production to know what breaks before most teams hit it. A small team shipping fast is the fastest way I know to get there."], "land": "Owning a product area end to end, close to where agents break.", "notes": ["'No layers, no politics' in the post: don't talk about titles or managing people."], "id": "q-where-do-you-want-to-be-in-two-or-three-years"}]}, {"group": "Your work, at depth", "blurb": "The bench and alfred_, at the depth Alex will go.", "items": [{"q": "Walk me through your day-to-day.", "tests": "Is the ownership real?", "a": ["It varies, but a typical week has three modes. Feature work on the email automation layer: the rules engine is our stickiest feature, users create rules in plain language from chat, so there's a steady stream of 'this rule didn't fire when I expected'.", "Reliability: I own the eval harness and the scanner that reads real production conversations and promotes genuine failures into a triage queue, so I'm looking at what actually broke rather than what I guessed would break.", "And work nobody asks for until it hurts. Our LLM spend was concentrated in one background pipeline, and I spent a week instrumenting cost per model and per stage before changing anything, because I didn't trust my intuition about where it was going."], "land": "I own a slice end to end, including after it ships.", "learn": {"figs": ["alfredHld"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/deepdives", "label": "alfred_, deep dives", "why": "The system you own, drawn from your own code."}]}, "id": "q-walk-me-through-your-day-to-day"}, {"q": "When you replay a case, what's running, what's faked, and where does the faking happen?", "tests": "Intercept depth.", "a": ["The tool body runs. Only the provider call is swapped, behind a harness flag that routes to the snapshot. So permission checks, ranking and response shaping are all on the production path.", "The alternative, replacing the whole tool function, would have meant testing the model against a simplified world, and most of our bugs lived in the seam between tool output and model interpretation."], "land": "Swap the provider, not the tool.", "learn": {"figs": ["harnessSeam"], "read": [{"label": "Kitaru docs: what a replay is", "url": "https://docs.zenml.io/kitaru/core-concepts/replay", "m": 6}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/env-snapshots", "label": "Technique: Environment snapshots", "why": "The frozen world the tools answer from."}]}, "id": "q-when-you-replay-a-case-what-s-running-what-s-faked-and-where"}, {"q": "How long does one case take to author, end to end?", "tests": "The number the whole scaling argument rests on. Do not dodge it.", "a": ["I never instrumented it, so this is an estimate rather than a measurement: about three to four hours per case at the start, dropping to forty-five minutes to an hour once the scanner aggregated the tool traces and prior turns automatically.", "It's expensive, and that's the honest trade-off. We bought counterfactual tolerance and paid for it in expert time per case. Importing a thousand recorded sessions is nearly free and gives you weaker cases. I'd want both."], "land": "Estimate first, with its basis. Never deflect to how cases are found.", "learn": {"figs": ["benchLoop"], "read": [{"label": "Hamel Husain: your AI product needs evals", "url": "https://hamel.dev/blog/posts/evals/index.html", "m": 22}], "sdLinks": []}, "id": "q-how-long-does-one-case-take-to-author-end-to-end"}, {"q": "Why SQLite when production is Postgres?", "tests": "The sharpest fidelity question you will face.", "a": ["Two reasons, one good and one I'd revisit. The good one: a snapshot is a single file. Trivial to capture, trivial to spin up per case, no process to manage, full isolation between cases by construction, and I can open it and see exactly what the agent saw.", "The one I'd revisit: it isn't the production engine. No row-level security, different type affinity, dialect differences. So it tests agent behaviour faithfully and database behaviour not at all.", "Rebuilt today I'd use Postgres template databases, CREATE DATABASE ... TEMPLATE, cloning per case at near-SQLite speed on the real engine. The cost is a server in the test path. Did the gap bite? Not that I caught, which isn't quite the same thing."], "land": "Name the fidelity you traded, then the production-grade alternative.", "notes": ["Why it was right then: one local runner, a tiny team, and isolation per run mattered more than a distributed database.", "What breaks first as it grows: concurrent writers, running it across machines, and production semantics like RLS. Next step: per-run isolated databases, then ephemeral Postgres.", "The invariant to keep whatever the engine: every run starts from a known, isolated state."], "learn": {"figs": ["sqliteTemplate"], "read": [{"label": "Postgres docs: template databases", "url": "https://www.postgresql.org/docs/current/manage-ag-templatedbs.html", "m": 4}, {"label": "SQLite docs: datatypes and type affinity", "url": "https://www.sqlite.org/datatype3.html", "m": 18}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/env-snapshots", "label": "Technique: Environment snapshots", "why": "Two ways to give every case its own world."}]}, "id": "q-why-sqlite-when-production-is-postgres"}, {"q": "What happens when the production schema changes?", "tests": "Have you lived with it, or only built it?", "a": ["The base snapshot is append-only by design: old rows don't move under old cases, and a new case that needs another Michael gets a new name. So a case that used to pass and now fails is a signal about the agent, not the fixture.", "The structural fix I'd want on top is to version the snapshot and pin each case to a version, and fail loudly on a mismatch. A test that silently measures the wrong thing is worse than one that refuses to run."], "land": "It rots quietly unless the version is pinned and checked.", "learn": {"figs": [], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/consistency/event-sourcing", "label": "Technique: Event sourcing and append-only ledgers", "why": "Append-only is why an old case never moves under you."}]}, "id": "q-what-happens-when-the-production-schema-changes"}, {"q": "How do you stop teaching to the test?", "tests": "Do you know what a fixture is for?", "a": ["We never pin expected output text. Assertions are computed from the snapshot: if the fixture has four financial events in the window, the output must contain four. That's checking against ground truth we own. Pinning a known-good answer would be teaching to the test."], "land": "Assert against ground truth you hold.", "learn": {"figs": ["completeness"], "read": [{"label": "Snapshot tests against behaviour-checking tests, the trade-offs", "url": "https://www.sitepen.com/blog/snapshot-testing-benefits-and-drawbacks", "m": 9}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/reliability/monitoring", "label": "Technique: Monitoring and completeness checks", "why": "A completeness check against ground truth you hold."}]}, "id": "q-how-do-you-stop-teaching-to-the-test"}, {"q": "How do you deal with nondeterminism?", "tests": "Do you separate noise from regression?", "a": ["Partly by removing it, partly by running more. On the gating path I removed it: the decision layer is deterministic risk scoring rather than a model call, because if an action commits a side effect I don't want the classification to be a sample.", "On generative paths you can't, so known-flaky cases, about ten percent, run three times and report a pass rate. A case that flips between versions without a code change is quarantined and looked at. One lucky run never counts as a pass.", "If they push on tool calls per task: on its own it rewards an agent that guesses instead of clarifying, which is why it sits next to counts of false completion claims. A version that got decisive and wrong would win on one and lose on the other."], "land": "Remove it on dangerous paths; measure around it elsewhere.", "learn": {"figs": ["passk"], "read": [{"label": "tau-bench paper: tool, agent and a simulated user, and pass^k", "url": "https://arxiv.org/abs/2406.12045", "m": 10}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-safety/policy-gate", "label": "Technique: Deterministic policy gate", "why": "Why the gating decision is scored, not sampled."}]}, "id": "q-how-do-you-deal-with-nondeterminism"}, {"q": "A tool the snapshot doesn't cover: what does the agent get back?", "tests": "Provenance: can a reader tell recorded from invented? (Mock 1 gap.)", "a": ["It never leaves the machine: with the harness flag on, every provider call goes to the snapshot, so there is no path to a live system.", "What the agent gets back is the weak spot. Today it's an empty result, and the call is logged against the run. But an empty result is a plausible answer: the agent can read it as 'there are no meeting notes', which is the harness telling it something false.", "So I'd return an explicit 'not in this snapshot' error the agent can't mistake for data, and treat any run that hit one as harness-limited: out of the headline number, onto a list that becomes the backlog for enriching the snapshot. It's the same problem as a Kitaru passthrough node with no mocked mark."], "land": "Name it as a gap before they do; every answer should carry how it was served.", "learn": {"figs": ["harnessSeam", "kitaruPolicy"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Provenance: no silent live calls."}]}, "id": "q-a-tool-the-snapshot-doesn-t-cover-what-does-the-agent-get-ba"}, {"q": "What makes a run count as done?", "tests": "Is the headline metric gameable? (Mock 1: took three turns to get concrete.)", "a": ["Deterministic assertions against the snapshot. For 'make a todo list from this email', the snapshot knows the right email and its action items, so the run passes if the agent read that email and the tasks match those items.", "Tool calls per completed task is computed only over runs that pass, so an agent that wraps up early on an empty result doesn't look efficient, it fails. We moved 2.5 to 2.2 on that for the same outcomes.", "On its own the metric would reward guessing over clarifying, so it sits next to a count of false completion claims."], "land": "Name the check, give one worked example, then the metric's blind spot.", "learn": {"figs": ["completeness"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Technique: Eval suites as release gates", "why": "What a gate asserts before it passes."}]}, "id": "q-what-makes-a-run-count-as-done"}, {"q": "Four action items, the agent creates three: pass or fail?", "tests": "Completeness, and the refunds lesson. (Mock 1: answered 'pass'.)", "a": ["It fails, and code decides, not a model. Action items are enumerable: the snapshot knows there are four, so the case asserts all four appear. Three of four fails that assertion and scores 0.75 on the completeness number we track across the bench.", "We learned it on the ledger that left out two refunds while every surface check passed. A model only judges what can't be counted, like whether a brief is useful, and those cases stay out of automated gating."], "land": "Enumerable means asserted, never judged.", "learn": {"figs": ["completeness"], "read": [], "sdLinks": []}, "id": "q-four-action-items-the-agent-creates-three-pass-or-fail"}, {"q": "How do you know the judge is still right?", "tests": "Is the judge's value measured? Name which judge.", "a": ["There are two judges, in different states. The scanner's judge, which decides whether a production flag is a real bug, is calibrated weekly against fresh human labels on a sample: about three in four agreement. When agreement drops it's usually because a feature changed what correct means, and the rubric gets updated.", "The completeness judge on the bench isn't calibrated yet; where the answer is enumerable I replaced it with assertions, so it only judges what can't be counted.", "To tell judge drift from agent change: keep a frozen set of past outputs and re-judge it when the judge's model or prompt changes. The outputs didn't move, so if the verdicts did, the judge moved. And the judge's model and prompt are pinned per run."], "land": "Two judges: one calibrated, one honestly not. Re-judge frozen outputs to catch drift.", "learn": {"figs": ["passk"], "read": [{"label": "Eugene Yan: evaluating LLM evaluators, agreement with human labels", "url": "https://eugeneyan.com/writing/llm-evaluators/", "m": 38}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/shadow-online", "label": "Technique: Shadow mode and online signals", "why": "The signals the judge sits on, and why they drift."}]}, "id": "q-how-do-you-know-the-judge-is-still-right"}, {"q": "How do you decide what becomes an eval case?", "tests": "The heart of the role.", "a": ["The first filter is the whole game, because everything downstream is conditioned on it. Early on a signal flagged abandoned conversations, the agent said something and the user never replied, and a large share were one-way notifications where no reply was ever expected. Another class, 'agent did nothing', was just wrong: the agent had acted, we weren't joining against the tool-execution record.", "Both got fixed by grounding the signal in execution truth rather than tuning a threshold."], "land": "Ground signals in execution truth, not thresholds.", "learn": {"figs": ["benchLoop"], "read": [{"label": "Hamel Husain: your AI product needs evals", "url": "https://hamel.dev/blog/posts/evals/index.html", "m": 22}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Technique: Eval suites as release gates", "why": "What the cases become once they are in."}]}, "id": "q-how-do-you-decide-what-becomes-an-eval-case"}, {"q": "What doesn't the bench catch?", "tests": "Do you volunteer the limit?", "a": ["Anything where the right answer isn't enumerable from the fixture, like whether a meeting brief is actually useful. And anything the scanner never saw fail: the bench only knows failures that happened. New features start with no coverage."], "land": "Volunteer the limit before they find it.", "learn": {"figs": ["completeness"], "read": [{"label": "Anthropic: demystifying evals for AI agents", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "m": 40}], "sdLinks": []}, "id": "q-what-doesn-t-the-bench-catch"}, {"q": "Was it gating deploys?", "tests": "Is it real engineering practice?", "a": ["Nightly runs plus subset runs on changes, reviewed by whoever made the change. It informed releases and blocked the big ones, like the orchestration rewrite. It wasn't a hard CI gate on every commit, because a thirty-minute run with model variance on every push would have slowed the team more than it protected them."], "land": "It gated the releases that mattered.", "learn": {"figs": [], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Technique: Eval suites as release gates", "why": "Eval suites as release gates, and what a hard gate costs."}]}, "id": "q-was-it-gating-deploys"}, {"q": "What would you do differently?", "tests": "Self-awareness.", "a": ["Instrument authoring time from day one, since I can't give you a measured number. And version the base snapshot explicitly so each case pins a version, instead of relying on append-only discipline."], "land": "Two concrete changes, no hedging.", "id": "q-what-would-you-do-differently"}]}, {"group": "Designing replay and evals", "blurb": "From first principles: what is frozen, how it runs, how it is scored, and where it breaks.", "items": [{"q": "Design an evaluation system for agents from scratch.", "short": "Design an eval system", "tests": "Structure before boxes.", "a": ["Four decisions, in order. Requirements first: are we reproducing a failure, testing a change, measuring capability, or measuring efficiency? Each wants something different.", "Then determinism: decide what is frozen. The transcript, the world, the tool results, or only the external effects. Kitaru freezes the transcript; my bench froze the world.", "Then execution: workers claiming runs from a queue with leases, slots, retries, cancellation, and isolation per run.", "Then evaluation: outcome and final state first, then policy and safety, then trajectory, then cost and latency, then repeatability across runs."], "land": "Requirements, what is frozen, how it runs, how it is scored. In that order.", "notes": ["This is the structure behind every other design answer here. When lost, say the four words and pick the one they asked about.", "Defend trade-offs, not a perfect architecture: say why your bench fit alfred_'s scale, and how it breaks at ten times."], "figs": ["forkReplay", "kitaruFreeze"], "id": "q-design-an-evaluation-system-for-agents-from-scratch", "learn": {"figs": ["forkReplay", "kitaruFreeze"], "read": [], "sdLinks": []}}, {"q": "Two runs take different paths to the same right answer. Pass or fail?", "short": "Different paths, same answer", "tests": "Outcome versus trajectory.", "a": ["Pass. Score the final state against a goal state, not the path. The same goal with different valid paths is normal for agents; tau-bench scores the final database state against an annotated goal state for exactly this reason.", "Trajectory is a separate score: efficiency, like tool calls per task, and policy, like whether it did anything it shouldn't have. Keep them apart, so a better path isn't punished as a regression."], "land": "Final state against a goal state for pass or fail; trajectory scored separately.", "notes": ["The same idea fixes Kitaru's miss problem at the scoring end: a new path that reaches the right state should not fail because a call missed."], "figs": ["completeness"], "id": "q-two-runs-take-different-paths-to-the-same-right-answer-pass-", "learn": {"figs": ["completeness"], "read": [], "sdLinks": []}}, {"q": "pass@k or pass^k?", "short": "pass@k or pass^k", "tests": "Reliability versus capability.", "a": ["pass@k is 'succeeds at least once in k tries': right for capability, whether it can ever do this. pass^k is 'succeeds every time in k tries': right for reliability, which is what a user lives with.", "For an agent acting on someone's mailbox, pass^k is the honest number; tau-bench showed agents that look fine on one try fall off sharply as k grows. So gating cases report pass^k, and the flaky ten percent run three times."], "land": "pass@k asks 'can it', pass^k asks 'will it every time'. Users live with pass^k.", "id": "q-pass-k-or-pass-k"}, {"q": "A worker dies halfway through a replay. What happens?", "short": "A worker dies mid-replay", "tests": "Leases, retries, cancellation.", "a": ["The task was claimed atomically, with FOR UPDATE SKIP LOCKED, and holds a lease kept alive by heartbeats. When the heartbeats stop, a sweeper sees the expired lease and puts the task back.", "The rerun has to be safe. Replay mostly is, because the tools answer from the recording; anything that went live needs an idempotency key, so a second attempt doesn't repeat the effect.", "Two details people miss: cancellation must kill the whole process tree, not only the parent, or orphaned subprocesses keep calling out; and retries need exponential backoff with jitter, or a bad deploy becomes a retry storm. Keep the poller separate from execution slots, so a busy worker still claims work."], "land": "Lease, heartbeat, sweeper; reruns safe by idempotency; kill the process tree; backoff with jitter.", "figs": ["skipLocked"], "id": "q-a-worker-dies-halfway-through-a-replay-what-happens", "learn": {"figs": ["skipLocked"], "read": [], "sdLinks": []}}, {"q": "How would you sandbox replays of a customer's agent?", "short": "Sandboxing replays", "tests": "Threat model first.", "a": ["Threat model first: protect the host, keep tenants apart, stop exfiltration. Kitaru's server never runs user code; the worker runs in the customer's environment, which answers most of it by design.", "Inside that: least privilege, with credentials scoped to the task and expiring with it. Then isolation picked by risk, up a ladder: process, container, gVisor or Kata, microVM, confidential VM.", "And effects by class: reads allowed, reversible writes inside a controlled window, irreversible actions behind confirmation. The adapter hook has to see every effect, which is why a bare HTTP call inside the agent is the gap to close."], "land": "Threat model, least privilege with task-scoped credentials, an isolation ladder by risk, effects by class.", "figs": ["kitaruPlanes", "kitaruLive"], "id": "q-how-would-you-sandbox-replays-of-a-customer-s-agent", "learn": {"figs": ["kitaruPlanes", "kitaruLive"], "read": [], "sdLinks": []}}, {"q": "Durable execution and replay evals: how are they related?", "short": "Durable execution and replay", "tests": "Do you understand their pivot from the inside?", "a": ["Same substrate, different intent. Durable execution records a workflow's history: deterministic workflow code, nondeterministic work in activities, and after a crash you resume by replaying history instead of re-running what finished.", "Replay evals reuse that recording for another job: re-run the agent with a change and answer the tools from history.", "That's why Kitaru could move from one positioning to the other: checkpoints and replay were already there. Durable execution wants the same result again; an eval wants a different result and wants to know why."], "land": "Same recording, opposite intent: durable execution wants the same result again, an eval wants a different one and why.", "figs": ["kitaruPosition"], "id": "q-durable-execution-and-replay-evals-how-are-they-related", "learn": {"figs": ["kitaruPosition"], "read": [], "sdLinks": []}}, {"q": "Stub, mock, fake, record-replay: when would you use each?", "short": "Stub, mock, fake, replay", "tests": "Testing vocabulary with judgement.", "a": ["A stub returns a canned answer. A mock returns an answer and asserts how it was called. A fake is a small working implementation with state. Record-replay captures real results and reuses them deterministically.", "My SQLite snapshot is a fake: the agent can take a new path and still get a coherent answer. Kitaru is record-replay: cheap and realistic for paths already seen, brittle for new ones.", "For stateful agent evaluation, fakes beat mocks; record-replay wins on cost at volume. The product question is when to promote one into the other."], "land": "My bench is a fake, Kitaru is record-replay; stateful agents need fakes for new paths.", "figs": ["kitaruFreeze"], "id": "q-stub-mock-fake-record-replay-when-would-you-use-each", "learn": {"figs": ["kitaruFreeze"], "read": [], "sdLinks": []}}, {"q": "Why store a trace as a self-referencing tree?", "short": "Traces as a tree", "tests": "Data modelling.", "a": ["Because agent work nests to any depth: tool calls, subagents, spans, retries. One table with a parent id represents all of it, and a recursive query walks ancestors or descendants.", "It beats fixed-depth tables, which break on the first subagent of a subagent, and it's more queryable than an opaque JSON blob. The cost is deep recursive queries on big traces: index the parent column and cache subtree summaries if they get slow."], "land": "Nesting to any depth in one table; recursive queries; index the parent and cache subtrees.", "figs": ["kitaruModel"], "id": "q-why-store-a-trace-as-a-self-referencing-tree", "learn": {"figs": ["kitaruModel"], "read": [], "sdLinks": []}}, {"q": "What's hard about replay? How would you design one?", "tests": "First principles, not reciting Kitaru.", "a": ["Clarify first: are we reproducing a known failure or testing a change? The design splits there. Then name the hard part: capture isn't hard, divergence is.", "Sketch: intercept every boundary the agent crosses, model calls, tool calls, clock, randomness, key them for lookup, and re-run the real agent with the recording answering for the outside world.", "Then attack it. Divergence: exact keys punish the change you're measuring. Side effects: interception must sit at a boundary that catches everything, or a direct HTTP call walks past it. Ordering: repeated identical calls and concurrency make an ordinal ambiguous. The model: if model calls go live, the baseline isn't deterministic, so you need repeat runs."], "land": "Name the hard part before sketching.", "learn": {"figs": ["forkReplay", "kitaruKey", "kitaruFreeze"], "read": [{"label": "Temporal: workflow execution, event history and replay", "url": "https://docs.temporal.io/workflow-execution", "m": 3}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Divergence, drawn for both designs."}]}, "id": "q-what-s-hard-about-replay-how-would-you-design-one"}, {"q": "Multi-turn: the agent's reply changes at turn two. What happens at turn three?", "tests": "The open problem.", "a": ["The recorded turn-three user message may no longer make sense, in Kitaru or in my bench: freezing the world doesn't fix user divergence. The options are last-turn replay, which is honest but blind; a stateful world across turns, which fixes effects but not replies; or a simulated user seeded from the recording, which only counts once it's calibrated against real replies. I'd scope the simulator to sessions that actually fork early."], "land": "A simulator counts only once it's calibrated.", "learn": {"figs": ["kitaruTurns", "multiturn"], "read": [{"label": "tau-bench paper: tool, agent and a simulated user, and pass^k", "url": "https://arxiv.org/abs/2406.12045", "m": 10}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Multi-turn replay is one of the deep dives."}]}, "id": "q-multi-turn-the-agent-s-reply-changes-at-turn-two-what-happen"}, {"q": "If you ran Kitaru for a quarter, what would you ship first?", "tests": "Product judgement with dependencies.", "a": ["I wouldn't rebuild the runner, the sandbox or the replay layer; those work. First, provenance on every node: small, and everything else depends on a reader trusting where a result came from. Then productive misses: the recorded-versus-attempted diff and one action to accept a variant.", "Then the evaluation layer above the runner, which is where alfred_ taught me the value is: turning production traces into eval cases, stateful multi-turn environments, scoring by outcome and final state plus policy, and regression analytics across runs.", "The useful unit isn't only a recorded trajectory. It's whether an agent can reliably change a realistic world into the right state."], "land": "Trust first, then productive misses, then the evaluation layer above the runner.", "notes": ["Order by dependency: trust, then the cheap feature, then the hard problem.", "Say what you would not rebuild; it shows you respect what exists."], "learn": {"figs": ["missFlow", "kitaruLive"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Provenance and misses, as design problems."}]}, "id": "q-if-you-ran-kitaru-for-a-quarter-what-would-you-ship-first"}]}, {"group": "Product engineering on Kitaru", "blurb": "The work the job post names: adapters, onboarding, replay debugging, shipped fast and driven by users.", "items": [{"q": "Design the adapter for a new agent framework.", "short": "A new framework adapter", "tests": "SDK design and developer experience.", "a": ["Start from what the framework already exposes: its tool-execution hook, its model-call hook, and how it represents a turn.", "The adapter does three things: record every tool call as a node with its cache key, answer calls on replay through the policy, and mark every node with how it was served. The user-facing surface is one line of setup; the rest is configuration with good defaults.", "Then contract tests: one shared suite every adapter must pass, against recorded fixtures, so adapters can't drift. Canonical JSON especially, since that's where cross-adapter keys break."], "land": "Hook what the framework exposes; record, answer, mark how it was served; one line of setup; a shared contract suite.", "notes": ["The post names 'new framework adapters' as an example deliverable. Frameworks it lists: PydanticAI, OpenAI SDK, Claude Agents SDK."], "figs": ["kitaruReplay", "kitaruKey"], "id": "q-design-the-adapter-for-a-new-agent-framework", "learn": {"figs": ["kitaruReplay", "kitaruKey"], "read": [], "sdLinks": []}}, {"q": "A user says their replay is broken. Walk me through it.", "short": "Debugging a user's replay", "tests": "User-driven iteration, same-day fixes.", "a": ["Get the session id and the replay id, not a description, and reproduce against their recording.", "Then read provenance node by node: which calls hit, which missed, which went live. Most breakages are one of four: a key mismatch, so show both canonical forms side by side; an adapter or framework version change; a tool with no policy; or the environment the worker spawned differs from theirs.", "Fix it, add the case to the contract tests, change the error message or doc that would have saved them, and reply in their thread with the PR. Same day if it's small."], "land": "Reproduce from ids, read provenance node by node, fix, add the test, fix the message, reply with the PR.", "notes": ["The post: 'Engage actively in Slack and GitHub. Convert user confusion into same-day PRs.'"], "figs": ["kitaruPolicy"], "id": "q-a-user-says-their-replay-is-broken-walk-me-through-it", "learn": {"figs": ["kitaruPolicy"], "read": [], "sdLinks": []}}, {"q": "How would you test an SDK across frameworks and versions?", "short": "Testing across frameworks", "tests": "Quality at speed.", "a": ["A small matrix: supported Python versions against each framework's oldest supported and newest release. Contract tests from recorded fixtures on every PR.", "A nightly run against the frameworks' newest releases, so a breaking change upstream shows up before a user reports it.", "And one end-to-end example per framework that runs the real quickstart, because for a new user the quickstart is the product."], "land": "A small matrix, contract tests per PR, nightly against upstream, and the quickstart as a test.", "notes": ["'Raise the bar: better tests, clearer interfaces, sharper documentation.'"], "id": "q-how-would-you-test-an-sdk-across-frameworks-and-versions"}, {"q": "What goes into the first ten minutes with Kitaru?", "short": "The first ten minutes", "tests": "Onboarding taste.", "a": ["One goal: a first replay that shows the user something they didn't know. Install, wrap an agent in one line, import or record a few sessions, replay with one change, see a diff.", "Every step that asks for a decision is a place people drop off, so defaults everywhere, and an example agent for people who don't have one ready.", "And measure it: time to first successful replay, and where people stop. A guided tour that walks users through their own code, like the Claude Code skills, is the right shape for this."], "land": "A first replay that teaches the user something, with no decisions on the way; measure time to it.", "notes": ["Alex ships the Claude Code skills behind the guided tour: this question may come from him. Ask what the tour changed."], "id": "q-what-goes-into-the-first-ten-minutes-with-kitaru"}, {"q": "What makes an error message good?", "short": "A good error message", "tests": "Product taste for developer tools.", "a": ["It says what happened, why, and the next thing to type. For a replay miss: which tool, the recorded arguments next to the new ones, and the command to accept the variant.", "A message that sends someone into the source code is a bug in the product, not in the user."], "land": "What happened, why, and the next thing to type.", "notes": ["The post: 'Every API choice, error message, and example should reflect developer experience.'"], "id": "q-what-makes-an-error-message-good"}, {"q": "A better prompt misses every recording. What do we build?", "tests": "Their central problem, as product judgement. (Mock 1 gap.)", "a": ["First, a miss is information: the agent's behaviour changed, which is what they were measuring. The goal isn't to avoid misses, it's to stop one from killing the run and make it cheap to resolve.", "First build: the miss experience. Misses grouped by tool with a count; open one and it's the recorded call next to what the new agent sent. If they're equivalent, one action accepts it as a static alias and the next replay hits. Deterministic, auditable, and every accepted pair is labelled data for matching later.", "Second: policy by effect. A read that misses can fall through to the customer's environment, marked live on the node. A write that misses fails closed on a fork, never passthrough.", "The limit: that fixes rephrasing, not a different path. For those few sessions, promote the trace into a small queryable world, which is what my bench does. The common case stays free."], "land": "Reframe, then build up in order of cost. If you blank, start with what the user sees.", "learn": {"figs": ["missFlow", "kitaruKey", "zenEffects"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Divergence: the better the change, the worse the replay."}]}, "id": "q-a-better-prompt-misses-every-recording-what-do-we-build"}, {"q": "The customer says the two searches are the same. What button, and what changes next replay?", "tests": "Can you land a design down to data? (Mock 1 gap.)", "a": ["'Accept as equivalent.' It writes a static alias for that tool: these new arguments map to that recorded call's result, scoped to the cohort, and it applies to the whole group of identical misses.", "Next replay the lookup checks aliases before it misses, so those calls hit, and the node is stamped 'served by alias', so nobody mistakes it for an exact match.", "Every accepted pair is a labelled example of 'different arguments, same meaning': the data you'd need to tune fuzzy matching later, shipped in shadow first."], "land": "Button, then the data it writes, then what the next replay does with it.", "learn": {"figs": ["missFlow"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "The productive miss, as a design option."}]}, "id": "q-the-customer-says-the-two-searches-are-the-same-what-button-"}]}, {"group": "Backend depth", "blurb": "Idempotency, queues, Postgres and providers.", "items": [{"q": "A side-effecting tool call fails halfway. What happens?", "tests": "Idempotency and crash windows.", "a": ["You can't get exactly-once against a third-party API you don't control, so the honest goal is at-least-once delivery with effects that are safe to repeat.", "We write the intent to a tool-execution ledger before the call, so there's a record even if the process dies mid-flight. That ledger is also what the anti-fabrication guards read: the agent can't claim it sent something unless there's a row saying it did. And side-effecting actions sit behind a confirm verdict with a bounded undo window.", "If the send succeeded but the response timed out, reconcile by looking the effect up at the provider before retrying blind. The design work is deciding where the idempotency key lives."], "land": "Exactly-once execution is out of reach; exactly-once logical effect is the goal: intent first, a key, reconcile before retry.", "notes": ["Classify the call first: read, idempotent write, non-idempotent write, external effect. The policy follows the class.", "Where the provider supports it, pass your idempotency key through to them, so their side refuses the duplicate too.", "In Kitaru terms: on a forked replay a write that misses should fail closed, never pass through."], "learn": {"figs": ["zenEffects", "alfredWrap"], "read": [{"label": "Stripe, \"Designing robust and predictable APIs with idempotency\"", "url": "https://stripe.com/blog/idempotency", "m": 12}, {"label": "Brandur Leach: Stripe-like idempotency keys in Postgres", "url": "https://brandur.org/idempotency-keys", "m": 22}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/multi-step/idempotency", "label": "Technique: Idempotency keys", "why": "Where the key lives decides whether a retry is safe."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/unknown-results", "label": "Technique: Idempotent tools and unknown results", "why": "The send succeeded but the response timed out."}]}, "id": "q-a-side-effecting-tool-call-fails-halfway-what-happens"}, {"q": "Tell me about the queue. How is it claimed and drained?", "tests": "Postgres under concurrency.", "a": ["At our volume it's a Postgres table with a periodic drain, which is respectable at that scale. Where it strains is concurrent claiming: SELECT ... FOR UPDATE SKIP LOCKED so two workers don't serialise on the same rows.", "And a cron drain's worst-case latency is the interval, which is exactly the problem we hit on notifications: about ninety seconds down to about three by triggering on the event, with cron kept as a backstop, not removed."], "land": "Name the idiom, and the backstop.", "learn": {"figs": ["skipLocked"], "read": [{"label": "Postgres docs: the locking clause, FOR UPDATE SKIP LOCKED", "url": "https://www.postgresql.org/docs/current/sql-select.html", "m": 9}, {"label": "Crunchy Data: a queue in plain Postgres with SKIP LOCKED", "url": "https://www.crunchydata.com/blog/message-queuing-using-native-postgresql", "m": 10}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/contention/claim-skip-locked", "label": "Technique: Queue claiming with SKIP LOCKED", "why": "The idiom to name."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/real-time/polling", "label": "Technique: Polling and long polling", "why": "Why a cron drain's worst case is its interval."}]}, "id": "q-tell-me-about-the-queue-how-is-it-claimed-and-drained"}, {"q": "Hardest bug you've debugged?", "tests": "Mechanism-level understanding.", "a": ["Agent-facing read functions in Postgres were SECURITY DEFINER RPCs, so they run with the definer's privileges and can see past row-level security to do their job. The subtle part: Postgres grants EXECUTE to PUBLIC by default on a new function, so a function deliberately bypassing RLS was callable by any authenticated role. A cross-user leak class.", "Nothing was exploited; it came out of an adversarial design review. We fixed the grants, and the more important fix was the migration checklist, plus the test I'd automate: assert no SECURITY DEFINER function carries a PUBLIC execute grant."], "land": "Fix the class, not the instance.", "learn": {"figs": ["definerGrant"], "read": [{"label": "Postgres docs: CREATE FUNCTION, writing SECURITY DEFINER functions safely", "url": "https://www.postgresql.org/docs/current/sql-createfunction.html", "m": 3}, {"label": "Supabase docs: row-level security and security definer functions", "url": "https://supabase.com/docs/guides/database/postgres/row-level-security", "m": 24}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-safety/least-privilege", "label": "Technique: Least privilege and sandboxing", "why": "Least privilege failing by default."}]}, "id": "q-hardest-bug-you-ve-debugged"}, {"q": "How do you normalise Gmail, Outlook and IMAP?", "tests": "Provider adapters, his own world.", "a": ["One internal model behind all three, where each provider fails differently, which is the same problem as Kitaru's importers across Langfuse, LangSmith and Braintrust with different nouns.", "Adapters keep each provider's schema at the edge; inside there's one canonical model with time zones, ids and contacts normalised. Contract tests against recorded provider payloads catch schema drift before users do, and the raw payload is kept next to the normalised one, because when something looks wrong you need to see what the provider actually sent."], "land": "Provider schemas at the edge, one canonical model inside, contract tests for drift, raw payload kept for debugging.", "notes": ["Have your one concrete behavioural difference between providers ready, and what it forced in the model."], "learn": {"figs": [], "read": [{"label": "Gmail API: synchronising a client with history.list", "url": "https://developers.google.com/workspace/gmail/api/guides/sync", "m": 3}, {"label": "Microsoft Graph: delta query for messages", "url": "https://learn.microsoft.com/en-us/graph/delta-query-messages", "m": 8}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/email-agent/hld", "label": "Email and calendar agent, high-level design", "why": "The providers behind one model."}]}, "id": "q-how-do-you-normalise-gmail-outlook-and-imap"}]}, {"group": "Tools and the landscape", "blurb": "The ecosystem Kitaru imports from, and how you work with coding agents.", "items": [{"q": "What's the difference between LangChain, LangGraph and LangSmith?", "tests": "Do you know the ecosystem Kitaru imports from?", "a": ["LangChain is the open-source framework: model wrappers, prompts, tools, retrievers, and the glue that chains them.", "LangGraph is its open-source orchestration layer for stateful agents: the agent as a graph of nodes and edges over shared state, with checkpointers for persistence, human-in-the-loop and streaming. LangChain's agents now run on it.", "LangSmith is the commercial platform around both, and it works outside them too: tracing, datasets, evals, a prompt hub and deployment. It's one of the trace sources Kitaru imports from.", "In a line: a framework, a runtime for stateful agents, and the observability-and-eval product."], "land": "Framework, runtime, platform.", "learn": {"figs": [], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/transcript-checkpoint", "label": "Technique: Transcript checkpoint every turn", "why": "What LangGraph's checkpointers are, in the guide's terms."}]}, "id": "q-what-s-the-difference-between-langchain-langgraph-and-langsm"}, {"q": "What's your experience with trace stores, open source or otherwise?", "tests": "Honest scope.", "a": ["At alfred_ we kept our own: conversations, the tool-execution ledger and the scanner's flags live in our own tables in Supabase Postgres, and the scanner and the bench run over them. I haven't run Langfuse or LangSmith in production; the closest I've come is importing Langfuse traces into Kitaru's example agent.", "What I know well is what a trace needs to hold for evaluation to work, because I built the consumer: tool inputs and outputs untruncated, the reasoning, and enough surrounding turns to judge a flag."], "land": "Own tables, honestly; and you know the consumer side deeply.", "learn": {"figs": ["kitaruModel", "alfredVsKitaru"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/hld", "label": "Kitaru, high-level design", "why": "Where imported traces land in Kitaru."}]}, "id": "q-what-s-your-experience-with-trace-stores-open-source-or-othe"}, {"q": "Supabase for traces, a dedicated trace store, or build it yourself?", "tests": "Judgement.", "a": ["Keeping execution records in Postgres next to product data was the right call for us. The scanner's biggest false-positive fix was joining a flag against the tool-execution record, which is only easy when both live in the same database.", "Where a dedicated store earns its place is span trees, a UI for reading them, retention, and cost and latency at volume. So: build it yourself while your questions are about product data; adopt a trace store when your questions become about spans. That's also the appeal of Kitaru's importers: you don't have to pick."], "land": "Own it while the questions are about product data.", "id": "q-supabase-for-traces-a-dedicated-trace-store-or-build-it-your"}, {"q": "How do you use AI in your own workflow?", "tests": "Are your instincts product instincts?", "a": ["Heavily, with scaffolding: Claude Code with project instructions and skills for the jobs I repeat, a review pass, and a verification step that drives the running surface instead of trusting that it compiled.", "The thing I've got strict about is not trusting an agent's self-report, the same instinct as the anti-fabrication work in our product. And where it's weak: anything depending on runtime state it can't see. It will tell you confidently which code path executes, reasoning from imports. That's exactly the gap replay closes."], "land": "Don't trust self-reports, from models or from yourself.", "notes": ["The post: 'AI-pilled, not vibes-pilled': know when to let the agent drive and when to take the wheel.", "Say where you take the wheel: concurrency, security and grants, data migrations, anything where a plausible answer is not a checked one.", "Their stack names Claude Code, Cursor and Codex; they also build internal tooling on Kitaru itself."], "id": "q-how-do-you-use-ai-in-your-own-workflow"}, {"q": "Python or TypeScript?", "tests": "Don't oversell.", "a": ["My production work at alfred_ is TypeScript on Deno; my research and ML work is Python. Their server is Python, and I'd say that plainly rather than oversell fluency to someone with years in this codebase."], "land": "Plain and exact.", "id": "q-python-or-typescript"}]}], "ask": [], "ask3": [{"id": "clarify", "title": "Clarifying", "when": "During the interview, before you answer or design.", "why": "Design prompts are vague on purpose: they are watching whether requirements drive your solution. A good clarifying question names the decision it changes. It is also the rescue when you blank: in the mock, the miss question needed one.", "how": ["Ask one to three before you design, each tied to a decision: 'because it decides X'.", "If they say 'you decide', pick, say why in one line, and write the assumption down.", "Do not ask what you can reason out yourself; that reads as stalling.", "Mid-answer, check the depth once: it keeps a long answer pointed at what they care about."], "items": [{"to": "Either", "q": "Are we reproducing a known failure, or testing a change?", "loop": "'Before I sketch, one question, because the design splits here: ...'", "why": "Replay for debugging and replay for evaluation freeze different things."}, {"to": "Either", "q": "Who is the user of this screen: the engineer who wrote the agent, or someone reviewing results?", "loop": "Use it the moment a question turns to UX: 'Let me start with who is looking at it.'", "why": "It turns 'what should the screen show' into something concrete. It is exactly where the mock went quiet."}, {"to": "Either", "q": "How big: a few dozen sessions, or a cohort of thousands?", "loop": "'Rough scale first, because it changes the answer: ...'", "why": "Scale decides between a world snapshot and a recorded call log."}, {"to": "Either", "q": "Can a replay reach production in this scenario, or is every effect behind the adapter?", "loop": "Before any side-effect answer: 'Is the tool's effect real here?'", "why": "Side-effect policy depends on it, and it shows you think about provenance first."}, {"to": "Either", "q": "Do you mean how it works today, or how I'd change it?", "loop": "When a question could be either: 'Today's version first, or where I'd take it?'", "why": "Clarifying the question itself saves a wrong three-minute answer."}, {"to": "Either", "q": "Is this the depth you want, or shall I go down on the storage?", "loop": "Once, about a minute into a long answer.", "why": "It hands them the steering wheel; interviewers take it gladly."}]}, {"id": "contribute", "title": "Contributing", "when": "At the end, first. About their problems and how you would add to them.", "why": "What you ask shows your preparation and judgement as much as your answers. Questions about success and their hard problems show you are thinking about impact, and the answer tells you whether the role has a concrete plan behind it.", "how": ["Ask about their hardest problem, not their perks.", "Bridge from something they said earlier: 'You mentioned X...'", "Listen fully. Then add one line from alfred_ if it helps, never a pitch: 'We hit a version of that; happy to share how it went.'", "One question, then wait. Two or three contributing questions at most."], "items": [{"to": "Hamza", "q": "What would you want someone in this seat to have shipped by the end of the first month?", "loop": "Lead with it: 'To picture the role concretely: ...'", "why": "Success in ninety days, made specific to a small team. Their answer is your first-month plan."}, {"to": "Hamza", "q": "Where do you see Kitaru against observability tools long term: is replay the wedge, or the product?", "loop": "After they describe the product or a customer: 'That makes me curious about the bigger picture: ...'", "why": "Strategy, asked as curiosity. Founders enjoy this one."}, {"to": "Alex", "q": "What's been the hardest thing to get right in the replay path?", "loop": "'You've seen more replays than anyone: ...'", "why": "It invites him to teach, and his answer is where you would start."}, {"to": "Either", "q": "When a forked replay misses for early users, is that the main support conversation, or a rare edge?", "loop": "If the miss came up earlier: 'Coming back to misses: ...'", "why": "It tests your own critique against their data, without calling it a bug."}, {"to": "Either", "q": "When an unchanged replay diverges because the model sampled differently, what do you show the user?", "loop": "After any talk of nondeterminism or cost.", "why": "It names a real open problem and shows you have read the product closely."}, {"to": "Hamza", "q": "Deciding which production behaviours become durable eval cases was the hard part for us. How are you thinking about that for Kitaru users?", "loop": "Best right after your bench story lands.", "why": "It turns your experience into their roadmap question."}]}, {"id": "collaborate", "title": "Collaborating", "when": "At the end, after contributing. How you would work together.", "why": "How a team designs, reviews and decides tells you whether you would thrive, and asking shows you already think like a teammate. Ask about real practice, not a description of the culture.", "how": ["Ask for a recent example rather than a policy: 'the last time...'", "Tie each to something from the job post you care about, without quoting it.", "Match the question to the person: Hamza on how decisions get made, Alex on how the work gets done."], "items": [{"to": "Hamza", "q": "How does a user's problem become shipped work here? Does a Slack thread go straight to a PR, or is there a planning step between?", "loop": "'I'm curious how the loop actually runs day to day: ...'", "why": "It checks the 'PRs, not tickets' pace they promise, and shows you want it."}, {"to": "Hamza", "q": "How does the public side work in practice? Who writes, and how would a product engineer's posts fit with developer relations?", "loop": "After the building-in-public question: 'On that, how does it work in practice: ...'", "why": "It shows you take the public half seriously and want to do it with the team, not alone."}, {"to": "Alex", "q": "What have you learned from early users about the first ten minutes, and what did the guided tour change?", "loop": "'Since you built the guided tour: ...'", "why": "It is his work; you would be collaborating on it from week one."}, {"to": "Alex", "q": "How do you review code here, especially agent-written code? What counts as blocking versus a nit?", "loop": "After talking about how you use coding agents.", "why": "Code review shows how a team gives feedback in general."}, {"to": "Hamza", "q": "The last time the team disagreed about what to ship, how did it get decided?", "loop": "Only if there is time; it is the most personal one.", "why": "It shows you care how decisions get made, and tells you how it would feel to disagree."}]}], "traps": [["Leading with history", "Headline first: the real agent against a frozen snapshot of the user's world, only the provider call swapped."], ["Dodging the authoring-cost question", "Say it's an estimate, then the number, then the basis."], ["Praising Kitaru when asked what's wrong", "Provenance, then time. If stuck, 'give me a second'."], ["Two questions in one breath", "One at a time, name the thing, then wait."], ["Vague numbers", "5,000+ users, 12 classes, about 3 in 4, 100+ cases, 25 to 30 minutes nightly, 90 to 3 seconds."], ["Going sideways when pushed", "Add a detail about the same system, not a second system."], ["Defending SQLite", "Name the fidelity gap, then CREATE DATABASE ... TEMPLATE."], ["Calling their gaps bugs", "Ask as questions; they maintain the code."], ["Citing their PRs or commits", "Never. Ask a normal question and let them bring it up."], ["Funding, crunch, internal version names, colleagues' names", "Never."], ["Running long", "At minute 70 of 90, hand them your questions."]], "tables": [{"title": "Tool policies", "note": "Resolution is by exact tool name, then the default.", "head": ["Policy", "What it does"], "rows": [["passthrough", "Runs the real tool. The default when no policy is set."], ["history", "The recorded result, by cache key, within a scope."], ["static", "Ordered cases, first match wins; exact or subset matching."], ["llm", "Modelled in the API; rejected at runtime by the PydanticAI adapter."]]}, {"title": "on_miss", "note": "Three values, and every one is a bad escape for an improved agent.", "head": ["Value", "What happens"], "rows": [["fail", "Raises; the node is recorded failed and the whole replay dies."], ["error_result", "The model gets a literal error and keeps running: you grade recovery from an error you invented."], ["passthrough", "Calls the real tool; the node carries no mocked attribute. The silent fidelity hole."]]}, {"title": "The cache key", "note": "sha256(tool_name + a null byte + canonical JSON: sorted keys, compact separators, allow_nan false). No fuzzy or subset matching on history.", "head": ["Change to the arguments", "Matches?"], "rows": [["Key order, JSON formatting", "Yes"], ["Whitespace inside a string", "No"], ["1 against 1.0, true against 1", "No"], ["NaN, infinity, unserialisable", "No key at all: straight to on_miss, no diagnostic"], ["Non-ASCII", "Within one adapter language only"]]}, {"title": "Repeated calls flip with scope", "note": "Ask about the concurrency point as a question: the counter is read, the lookup awaited, then the counter written.", "head": ["Scope", "Behaviour"], "rows": [["baseline", "The nth recorded node, ordered by started_at: ordered consumption, from completed and failed nodes."], ["agent, cohort version", "The latest completed node, the same one every time."]]}, {"title": "What always runs live", "note": "", "head": ["Thing", "Why it matters"], "rows": [["Model calls", "Every replay is billed and nondeterministic, even unchanged."], ["Anything outside a registered tool", "A bare HTTP call reaches production."], ["Provider-native tools", "Recorded but never checked against policy."], ["Earlier turns' tool calls", "Dropped: only the final turn re-executes."]]}, {"title": "Claims against the source", "note": "", "head": ["Claim", "Reality"], "rows": [["Replays never touch production", "The default policy is passthrough, and so is one on_miss value."], ["No card gets refunded twice", "True for registered function tools; native tools bypass."], ["Compare distributions across runs", "No repeat-count or aggregation exists."], ["Multi-turn replays faithfully", "Final turn only; earlier tool activity stripped."], ["No user code runs on the server", "Accurate."]]}], "admire": "The selector design is the bit I keep thinking about: storing a JSON path into the payload instead of copying text out, so a human judgement, an evaluator verdict and the UI all point at the same coordinates. I hand-rolled a worse version.", "kitaruLead": "Kitaru spawns your agent as an ordinary subprocess in your own environment, and an in-process adapter intercepts the agent framework's tool-execution hook, answering each tool call by a SHA-256 lookup against a recorded call log. The diagrams are from your teardown; the tables are the mechanisms they will probe.", "figures": ["kitaruPlanes", "kitaruReplay", "kitaruModel", "kitaruPolicy", "kitaruKey", "kitaruOrder", "kitaruTurns", "kitaruLive", "kitaruFreeze", "kitaruScale", "kitaruPosition"], "mockHow": "Full mocks run in the Claude Code chat. Say **'run the ZenML mock, 25 minutes'**. Hamza leads on your story, why this move and judgement; Alex goes down on mechanism and what the user sees. Each mock below starts with the read. Open the conversation to see every turn in one screen: the turns on the left, and for the one you pick, what they asked and how it landed, what you said, and what to say. Every gap also sits on the Prep tab.", "mocks": [{"id": "m1", "title": "Mock 1: Hamza and Alex", "when": "Sunday 27 September 2026, 10:12 to 10:38, 26 minutes", "read": ["The bench came across as real work: one snapshot per task, users merged into it with duplicate people renamed, the harness flag that swaps only the provider call. Alex said he wanted to think about it more, which is the reaction you want.", "It went wrong in two places. When they pushed on the empty result, you defended it instead of naming it as a gap, and that is the same provenance problem you plan to criticise in Kitaru. Then the design question on misses collapsed, although the answer is already on your Prep tab. Both are fixable by tomorrow: say the limit first, and when lost, go to what the user sees and clicks."], "landed": ["How the bench works, from the ground up, with a concrete example task.", "Honesty about the completeness judge: no calibration yet.", "Two numbers in the end: completion and completeness against ground truth you hold."], "fix": [{"t": "When you are lost on a design question, go to the smallest concrete thing: what the user sees, what they click, what changes next time.", "ref": "x7"}, {"t": "Name the limit before they do. An empty result is the harness inventing a fact.", "ref": "x3"}, {"t": "Lead with the numbers and one worked example; it took three turns to get concrete on the metric.", "ref": "x4"}, {"t": "Keep the two judges apart: the scanner's judge is calibrated, the completeness judge is not.", "ref": "x6"}, {"t": "Intro in 45 seconds: what you own, one number, the bench headline.", "ref": "x1"}], "exchanges": [{"id": "x1", "label": "What you own", "who": "Hamza", "q": "Tell us what you're working on right now at alfred_, and what part of it you actually own.", "tests": "Is the ownership real, and can you say it in under a minute?", "said": ["Founding engineer; making the agent reliable in production through eval infrastructure, memory and orchestration. 5,000-plus subscribers. A long account of working memory: one data model for work items that email, Slack and meeting notes reconcile into. Then the whole bench: scanner, calibrated judge, similar tasks across users, one SQLite snapshot per task, the harness flag."], "verdict": "partly", "why": "The content was right and specific, but it ran over three minutes with filler, and the bench detail arrived before they asked for it.", "good": ["Concrete ownership: eval, memory, orchestration.", "A real number: 5,000-plus subscribers.", "Working memory explained through your own project, a good hook for later."], "bad": ["Over three minutes; the first answer sets the pace for ninety.", "Filler: 'so to say', 'essentially', 'in a lot of degree'.", "You spent the bench story on the opener, so later answers repeated it."], "approach": ["Three sentences: what alfred_ is with one number, what you own, the one piece most relevant to them. Then stop and let them choose where to go.", "Offer the depth as a choice: 'I can go into the eval bench or the memory work, whichever is more useful.'"], "say": ["I'm a founding engineer at alfred_, an AI executive assistant over email, calendar and work apps, with 5,000-plus active users. I own making the agent reliable in production: the eval infrastructure, the memory architecture, and the orchestration underneath.", "Right now it's working memory: one model for every open work item, which email, Slack and meeting notes all reconcile into, so the agent can answer 'what's open today' from one place.", "The part closest to Kitaru is the eval bench I built: real production failures replayed a
