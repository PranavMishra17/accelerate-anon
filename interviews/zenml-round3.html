rks?", "short": "Packaging an SDK", "tests": "Shipping to thousands of users without breaking them.", "a": ["One package with optional extras, one per framework, declared in pyproject.toml, and lazy imports, so a missing framework doesn't break importing the core.", "Version ranges for each framework, tested in CI at both ends of the range. Semantic versioning, and deprecations that warn for a release before they break.", "Alaap taught me why this matters: its two speech engines needed conflicting pins, so each lives in its own environment. A research repo can do that; a library can't, so it has to stay loose and test the edges."], "land": "Optional extras, lazy imports, tested version ranges, warn before you break.", "parts": [{"title": "Example: extras and lazy imports (illustrative, not Kitaru's real file)", "code": "# pyproject.toml\n[project]\nname = \"kitaru\"\ndependencies = [\"pydantic>=2\", \"httpx\"]\n\n[project.optional-dependencies]\npydantic-ai = [\"pydantic-ai\"]\nopenai = [\"openai>=1\"]\n\n# kitaru/adapters/__init__.py\ndef get_adapter(name: str):\n    if name == \"pydantic-ai\":\n        from .pydantic_ai import Adapter   # imported only when asked for\n        return Adapter()\n    raise ValueError(f\"unknown adapter {name!r}\")", "after": ["`pip install kitaru[pydantic-ai]` pulls only what that user needs; importing `kitaru` never fails because a framework is missing."]}, {"title": "The rest of the checklist", "items": ["A CI matrix: supported Python versions against each framework's oldest supported and newest release.", "`warnings.warn(..., DeprecationWarning)` for a release before removing anything.", "A lock file for development (uv or similar), loose ranges in the published package."]}], "id": "q-how-would-you-package-an-sdk-with-adapters-for-many-framewor"}, {"q": "How would you test it with pytest?", "short": "pytest", "tests": "Quality at speed.", "a": ["Fixtures for the expensive setup, like a fresh copy of a world per test; parametrize to run the same test across frameworks or engines; recorded fixtures for provider responses, so tests are fast and need no network.", "And test invariants, not just outputs. Alaap has 114 of them: things like 'who speaks has no effect on what is said', or 'every identity stores a vector, a seed clip and a backend version'. An invariant keeps holding when the model changes; a pinned output doesn't."], "land": "Fixtures, parametrize across engines or frameworks, recorded responses, and invariants over pinned outputs.", "parts": [{"title": "Example: Alaap-style invariant tests (a sketch)", "code": "import shutil\nimport pytest\n\n@pytest.fixture\ndef world(tmp_path):\n    path = tmp_path / \"case.sqlite\"\n    shutil.copy(BASE_SNAPSHOT, path)     # every test gets a fresh world\n    return path\n\ndef test_identity_stores_everything(minted_identity):\n    i = minted_identity\n    assert i.vector and i.seed_clip and i.backend_version\n\n@pytest.mark.parametrize(\"engine\", [\"qwen3\", \"indic-mio\"])\ndef test_speaker_does_not_change_words(engine, render, line, two_identities):\n    a = render(engine, two_identities[0], line)\n    b = render(engine, two_identities[1], line)\n    assert transcript(a) == transcript(b)   # who speaks never changes what is said", "after": ["Alaap measured this one as a CER spread of 0.000 between identities on every line."]}, {"title": "What else to say", "items": ["Markers to keep slow or GPU tests out of the default run: `@pytest.mark.slow`.", "A contract suite every adapter must pass, run from recorded fixtures.", "Be careful with snapshot tests: easy to write, easy to rubber-stamp.", "Alaap's rule: a suspiciously good or bad number is a bug report about your setup, so assert the property before reading the result."]}], "id": "q-how-would-you-test-it-with-pytest"}, {"q": "SQLAlchemy or SQLModel: what bites you at scale?", "short": "SQLAlchemy at scale", "tests": "Their persistence layer.", "a": ["The N+1 query from lazy loading: loop over sessions, touch their nodes, and you've made a query per session. selectinload or joinedload fixes it.", "Then session scope: one session per request or task, never shared across threads. Queue claiming maps to with_for_update(skip_locked=True). Migrations through Alembic, and the connection pool sized for the number of workers, not left at the default."], "land": "Watch for N+1, one session per unit of work, skip_locked for claiming, a pool sized for your workers.", "parts": [{"title": "Example: Kitaru-style sessions and nodes", "code": "from sqlalchemy import select\nfrom sqlalchemy.orm import aliased, selectinload\n\n# N+1: one extra query per session as soon as you touch .nodes in a loop\nsessions = db.scalars(select(Session).where(Session.cohort_id == cid)).all()\n\n# fixed: one more query loads every session's nodes\nsessions = db.scalars(select(Session).where(Session.cohort_id == cid)\n                      .options(selectinload(Session.nodes))).all()\n\n# claim one queued task without two workers taking the same row\ntask = db.scalars(select(Task).where(Task.status == \"queued\")\n                  .limit(1).with_for_update(skip_locked=True)).first()\n\n# walk a node tree of any depth with a recursive CTE\ntree = (select(Node.external_id, Node.parent_external_id)\n        .where(Node.external_id == root_id).cte(\"tree\", recursive=True))\nchild = aliased(Node)\ntree = tree.union_all(\n    select(child.external_id, child.parent_external_id)\n    .where(child.parent_external_id == tree.c.external_id))\nrows = db.execute(select(tree)).all()"}, {"title": "What else to say", "items": ["Your UIC backend was Postgres with over a million records: the same N+1 and pooling lessons.", "Async SQLAlchemy needs an async driver and care with lazy loading, which raises instead of silently querying."]}], "id": "q-sqlalchemy-or-sqlmodel-what-bites-you-at-scale"}]}, {"group": "Your work, at depth", "blurb": "The bench and alfred_, told as stories you can remember in parts.", "items": [{"q": "How do you actually replace third-party APIs with SQLite?", "short": "The swap: APIs to SQLite", "tests": "Intercept depth, and whether the swap makes architectural sense.", "probes": ["What's real in a replay and what's faked?", "Where exactly does the faking happen?", "Isn't emulating Gmail a huge amount of work?", "What does the SQLite data model look like?", "Why not mock the whole tool?"], "a": ["The “swap” isn't a generic runtime trick. I put an abstraction at the provider boundary.", "The agent calls something like `GmailAdapter.search()` or `CalendarAdapter.createEvent()`. In production, that adapter calls Gmail or Google Calendar. In the harness, the same interface is backed by a local implementation that reads and mutates the SQLite snapshot.", "So I don't try to make SQLite look like Gmail. I model the subset of the provider's domain that the evaluation needs — messages, threads, participants, attachments, events, contacts, tasks, notes, etc. — and implement the same operations the agent actually uses against that model.", "For example:", "`gmail.search()` → query `messages/threads` in SQLite", "`gmail.send()` → insert/update the corresponding message state", "`calendar.create()` → insert an event", "`calendar.update()` → mutate that event", "`asana.createTask()` → insert a task", "The important part is that the agent doesn't know which implementation it's talking to. The harness controls the dependency through the adapter boundary.", "The SQLite model is therefore a small relational representation of the user's world, not a copy of every provider's database. I only model the entities and operations needed by the evals, which keeps the snapshot deterministic and resettable."], "swaps": [{"when": "If they challenge the complexity", "line": "I don't emulate every provider. I emulate the contract that the agent actually depends on."}, {"when": "If they ask why not mock the whole tool", "line": "Because most of our bugs lived in the seam between what a tool returned and how the model read it. If I'd mocked the whole tool, I'd have been testing the model against a simplified world and missing exactly the bugs we had."}, {"when": "If they ask what happens on a call you didn't model", "line": "It's logged against the run as not in the snapshot. Honestly that used to come back as an empty result, which is the weak spot; I'd make it an explicit error the agent can't mistake for data."}], "land": "I don't emulate every provider. I emulate the contract that the agent actually depends on.", "parts": [{"title": "1. The seam, top to bottom", "items": ["The agent loop and the tool code are production code in every run: ranking, filtering and shaping results are real.", "Tools call a **provider interface**, never Gmail directly. Behind it sit two implementations: production adapters that call Gmail, Google Calendar, Outlook or Asana, and harness adapters backed by SQLite.", "A **harness flag** picks the implementation for the run. With it on, there is no path to a live system."]}, {"title": "2. The contract: only what the agent uses", "items": ["`GmailAdapter`: `search(query, limit)`, `getThread(id)`, `send(to, subject, body, thread_id)`, `archive(id)`, `label(id, name)`.", "`CalendarAdapter`: `listEvents(start, end)`, `createEvent(title, start, end, attendees)`, `updateEvent(id, changes)`.", "Tasks: `createTask(title, due, source_message_id)`, `listTasks(status)`.", "Each method returns the same shape the production adapter returns, so the tool code can't tell the difference. Anything outside the contract isn't implemented, and is logged as not in the snapshot."]}, {"title": "3. The data model, table by table (a model that works here)", "items": ["**contacts**: id, name, email, org. People once; three Michaels are three rows, on purpose.", "**threads**: id, subject, labels, last_message_at. What `search()` returns first.", "**messages**: id, thread_id, sent_at, snippet, body, is_read, attachments by name and type.", "**participants**: message_id, contact_id, role (from, to, cc). A join table, so 'emails from Priya' is a query, not a string match.", "**events** and **attendees**: the calendar, with who's invited and how they responded.", "**tasks**: id, title, due, status, source_message_id, so an assertion can check every action item became a task.", "Two harness tables beside the world: **case_meta** (case id, world version, user, a pinned 'now') and **call_log** (turn, tool, argument hash, served_by)."]}, {"title": "4. One read, end to end", "items": ["The user says: find the latest email from Michael about the offsite.", "The tool calls `search(\"from:michael offsite\")`. The harness adapter runs a query joining messages, participants and contacts, where the sender's name matches and the subject or body mentions the offsite, newest first.", "Three Michaels come back. The adapter shapes the rows like Gmail's thread list; the tool ranks them as it would in production; the agent has to ask which Michael, or use context. That's the behaviour being tested."]}, {"title": "5. One write, end to end", "items": ["`send()` inserts a message and its participant rows in one transaction, attached to the thread if it's a reply.", "A later turn that searches sent mail sees it, because writes land in the case's copy of the world. That's what makes it stateful within a case."]}, {"title": "6. Deterministic and resettable", "items": ["The base snapshot is an immutable file; each case runs on a fresh copy, so writes never leak between runs.", "'Now' is pinned in case_meta, so anything reasoning about 'today' matches the world.", "Stable ids and a fixed sort order (time, then id), and no randomness in the adapters.", "Every call lands in call_log with how it was served: that's the provenance record."]}, {"title": "7. What it deliberately doesn't model", "items": ["OAuth, rate limits, push notifications, HTML rendering, provider pagination tokens (a simple limit and offset instead).", "Provider errors aren't random: when a case needs one, it's injected explicitly, so the test is about how the agent handles it, not luck."]}, {"title": "8. Where the rows come from", "items": ["About twenty-five real instances of the same task: the calls they made and what came back become rows, unioned across users.", "Entities are reconciled, so the same person across instances becomes one contact, renamed and redacted; deliberate ambiguity is added on purpose."]}], "notes": ["Your own words. The board is there to help you picture it; the data model is one that works for this, described in your terms."], "figs": ["benchAdapter", "benchSchema"], "id": "q-how-do-you-actually-replace-third-party-apis-with-sqlite", "learn": {"figs": ["benchAdapter", "benchSchema"], "read": [], "sdLinks": []}}, {"q": "Does your harness actually support multi-turn evaluation?", "short": "Multi-turn, honestly", "tests": "The open problem. Honesty first, then a design you could defend to the people building it.", "probes": ["Can the user side react to what the agent does?", "What happens when the agent's reply changes at turn two?", "How would you build the simulator?", "How do you keep a simulated user honest?", "Why not simulate from the start?"], "a": ["Not fully. I’d describe my current harness as a goal-oriented, stateful evaluation harness, rather than an adaptive multi-turn harness.", "I collect and aggregate a task spec from real production behavior, create a snapshot of the relevant user world, and then let the actual agent run against that snapshot. The state persists within the case, so multiple steps can affect the same world, but the user turns themselves are currently scripted rather than generated in response to what the agent actually says or does.", "The next thing I’d add is a goal-oriented user simulator: give it the user’s goal, constraints, and a controlled view of the resulting state, and let it decide whether the next turn should be a clarification, correction, confirmation, or termination."], "swaps": [{"when": "If they ask what happens when the reply changes at turn two", "line": "The recorded turn-three message may no longer make sense, in Kitaru or in my bench. Freezing the world fixes effects across turns, not a user who would have said something else."}, {"when": "If they ask why not simulate from the start", "line": "Because a simulator is a second model in the loop. I'd replay the recorded user turns while the agent stays equivalent, and only hand over to the simulator at real divergence."}, {"when": "If they ask how you'd keep it honest", "line": "Calibrate it on the unchanged baseline. If it can't reproduce what the real user said to the old agent, its behaviour on the new one isn't evidence."}], "land": "Goal-oriented and stateful, not yet adaptive; the next step is a calibrated, goal-oriented user simulator.", "parts": [{"title": "1. What it does today", "items": ["A task spec aggregated from real production behaviour, a snapshot of the user's world, the real agent running against it.", "State persists within the case: a task created at turn two is there at turn three.", "User turns are scripted from the recording; they don't react to what the agent says."]}, {"title": "2. Where that breaks", "items": ["If the agent asks a clarifying question the original never asked, the scripted next turn answers something else.", "It's the same ceiling as Kitaru's last-turn replay, from the other side: they freeze earlier turns as text, I freeze the user's lines."]}, {"title": "3. The three options", "items": ["**Truncate** at the first divergence and score only up to there: cheap and honest, but blind to what the change did afterwards.", "**Simulate** the user from the start: a full counterfactual, but a second model in the loop the whole time.", "**Hybrid** (my pick): replay recorded user turns while the agent's replies stay equivalent to the recording, and hand over to the simulator only at real divergence."]}, {"title": "4. The goal-oriented simulator", "items": ["**Inputs:** the user's goal and constraints extracted from the session, a persona, and a controlled view of the resulting state: what the user could actually see, never the answer key.", "**Each turn it chooses:** clarification, correction, confirmation or termination.", "**Stop conditions:** goal achieved, the user gives up, or the turn budget runs out.", "**A judge** decides whether the goal was met, scored against the final state of the world."]}, {"title": "5. Keeping it honest", "items": ["Hold it fixed across baseline and fork: same model, same prompt, same seed where possible, so it's a controlled variable.", "Calibrate on the unchanged baseline: it has to reproduce the recorded user turns before its behaviour on a new agent counts.", "Known risks: too cooperative (inflates scores), goal leakage (it tells the agent the answer), drift over versions, error compounding over turns, and cost per turn.", "Every simulated turn is marked as simulated, so a reviewer never mistakes it for a real one."]}, {"title": "6. How it's scored", "items": ["Final world state against the goal state for pass or fail; trajectory and policy scored separately.", "pass^k over a few runs, because a simulator adds variance of its own.", "Open question worth asking them: how to define 'equivalent' between two agent replies."]}], "notes": ["Your own words. 'That is the technically honest version': lead with 'not fully' and don't soften it."], "figs": ["multiturn", "kitaruTurns", "passk"], "id": "q-does-your-harness-actually-support-multi-turn-evaluation", "learn": {"figs": ["multiturn", "kitaruTurns", "passk"], "read": [], "sdLinks": []}}, {"q": "The bench, in five minutes", "short": "The bench, in five minutes", "id": "say-bench5", "tests": "When they want the whole thing: nine beats, each with its number.", "probes": ["How many cases?", "How long does a run take?", "How do you handle flaky cases?", "What was the headline result?"], "notes": ["The numbers, in order: 5,000-plus users; twelve failure classes; about three in four genuine; a little over a hundred cases; about twenty-five instances per snapshot; 2.5 down to 2.2 tool calls per task; about ten percent flaky, run three times; under ten minutes for a subset, about half an hour nightly.", "Use the bold beat names as your outline if you lose your place."], "figs": ["benchLoop", "harnessSeam", "completeness"], "a": ["**The problem.** The agent runs over email and calendar for 5,000-plus users. Every change touched prompts, tools or orchestration, and we had no deterministic way to compare versions. The trigger was a rewrite of how the agent handles multi-turn conversations: too big to eyeball, too risky to ship on vibes.", "**Finding failures.** The scanner runs daily over conversations with cheap deterministic checks first: the agent said it did something and no tool ran, the user repeated themselves, a tool errored and the agent kept going. Twelve classes.", "**Judging.** Deterministic signals over-fire, so an LLM judge sits on top, its rubric built from a week of flags I labelled by hand. It agrees with a human on roughly three in four as genuine, reconciled weekly.", "**Promotion.** A genuine bug is fixed, then promoted: a reconciler adds a new case, updates one, or merges it into one that already covers the failure. A little over a hundred cases now.", "**The snapshot.** For a query type like 'create a task from this email', we pulled about twenty-five real instances and covered every tool used across them, plus deliberate ambiguity. The base is append-only.", "**Replay.** Tool code runs for real; at the provider boundary the call goes to the case's SQLite copy. Writes land there, so a task created at turn two is visible at turn three, and we reset between cases.", "**Scoring.** Deterministic assertions against the snapshot, then a judge only for what can't be counted. The headline is tool calls per completed task: 2.5 down to 2.2 means the same outcome, found faster.", "**Trust and cost.** About ten percent of cases are flaky, so those run three times. A tool change runs only the cases that touch it, under ten minutes; the full bench runs nightly, about half an hour.", "**Outcome.** It's how we signed off the orchestration rewrite: old and new agent against the same hundred-plus cases, and we could point at exactly which cases got better, which got worse, and why."], "land": "Nine beats, each with its number: problem, finding, judging, promotion, snapshot, replay, scoring, trust, outcome.", "learn": {"figs": ["benchLoop", "harnessSeam", "completeness"], "read": [], "sdLinks": []}}, {"q": "When did the bench pass something that was actually broken?", "short": "The two missing refunds", "id": "say-refunds", "tests": "A false signal, told as a story. Lead with the case.", "a": ["The clearest one was a ledger request: pull every financial event across my accounts and cards into one view. The agent produced a clean, well-formed ledger and left out two refunds. Every surface check passed, and the same omission showed up again on a later version.", "We found it the way you find most of these: a user noticed the output was wrong rather than malformed. The frustration signals don't fire when an answer merely looks right.", "The lesson was about what the scorer asserted. We checked trajectory and shape, and nothing checked completeness. For this class we could, because we own the snapshot: it knows how many financial events fall in that window, so the case can assert every one appears. That's the advantage of freezing a world rather than a transcript."], "swaps": [{"when": "If they ask where that stops working", "line": "When the answer isn't enumerable. A meeting brief isn't a set you can count, so those need a human lens and stay out of automated gating."}], "land": "The case first: a clean ledger missing two refunds. Then the lesson: assert against ground truth you hold.", "figs": ["completeness"], "learn": {"figs": ["completeness"], "read": [], "sdLinks": []}}, {"q": "What makes a run count as done, and how is it scored?", "short": "How a run is scored", "tests": "Is the headline metric gameable? (Mock 1: three turns to get concrete; 'pass' on four items, three created.)", "probes": ["Who decides 'completed'?", "Four action items, the agent creates three: pass or fail?", "How do you stop teaching to the test?", "Doesn't calls-per-task reward giving up early?"], "a": ["The snapshot decides it, not a model. For 'make a todo list from this email', the snapshot knows the right email and its action items, so the run passes only if the agent read that email and the tasks match.", "Tool calls per completed task is only counted over runs that pass, so an agent that wraps up early on an empty result doesn't look efficient, it fails. We moved it from 2.5 to 2.2 for the same outcomes.", "And we never pin expected text. The assertions come from what the snapshot holds, so if there are four action items, all four have to appear. Pinning a known-good answer would be teaching to the test."], "swaps": [{"when": "If they ask about four items and three created", "line": "It fails, and code decides. Action items are countable, so the case asserts all four; three of four fails and scores 0.75 on completeness. We learned that on the two missing refunds."}, {"when": "If they push on the metric rewarding guesses", "line": "On its own it would reward guessing over clarifying, so it sits next to a count of false completion claims."}], "land": "The snapshot decides done; efficiency only counts runs that pass; never pin expected text.", "figs": ["completeness"], "learn": {"figs": ["completeness"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Technique: Eval suites as release gates", "why": "What a gate asserts before it passes."}]}, "id": "q-what-makes-a-run-count-as-done-and-how-is-it-scored"}, {"q": "A tool the snapshot doesn't cover: what does the agent get back?", "short": "Calls outside the snapshot", "tests": "Provenance: can a reader tell recorded from invented? (Mock 1 gap.)", "a": ["It never leaves the machine: with the harness flag on, every provider call goes to the snapshot, so there's no path to a live system.", "What the agent gets back is honestly the weak spot. Today it's an empty result, and the call is logged against the run. But an empty result is a plausible answer: the agent can read it as 'there are no meeting notes', which is the harness telling it something false.", "So I'd return an explicit 'not in this snapshot' error it can't mistake for data, and treat any run that hit one as harness-limited: out of the headline number, onto a list that becomes the backlog for enriching the snapshot. It's the same problem as a Kitaru passthrough node with no mocked mark."], "land": "Name it as a gap before they do; every answer should carry how it was served.", "figs": ["harnessSeam", "kitaruPolicy"], "learn": {"figs": ["harnessSeam", "kitaruPolicy"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Provenance: no silent live calls."}]}, "id": "q-a-tool-the-snapshot-doesn-t-cover-what-does-the-agent-get-ba"}, {"q": "How do you decide what becomes an eval case, and is the judge still right?", "short": "Finding and judging failures", "tests": "The heart of the role; is the judge measured or trusted?", "probes": ["How do you decide what becomes an eval case?", "How do you know the judge is still right?", "How do you deal with nondeterminism?"], "a": ["The first filter is the whole game, because everything downstream depends on it. Early on a signal flagged 'abandoned' conversations, and a lot of them were one-way notifications where nobody expected a reply. Another class, 'agent did nothing', was just wrong: the agent had acted, we just weren't joining against the tool-execution record. Both got fixed by grounding the signal in what actually executed, not by tuning a threshold.", "Then there are two judges, in different states. The scanner's judge, which decides whether a flag is a real bug, is calibrated weekly against fresh human labels: about three in four agreement. The completeness judge on the bench isn't calibrated yet; where the answer is countable I replaced it with assertions, so it only judges what can't be counted.", "To tell judge drift from agent change I'd keep a frozen set of past outputs and re-judge it whenever the judge's model or prompt changes. The outputs didn't move, so if the verdicts did, the judge moved."], "swaps": [{"when": "If they ask about nondeterminism", "line": "Remove it where an action commits a side effect: whether a write previews or confirms is decided in code, by what the tool declares, not by a model call. Elsewhere, the flaky ten percent run three times and report a pass rate; one lucky run never counts."}], "land": "Ground signals in what executed; two judges, one calibrated, one honestly not; re-judge frozen outputs.", "figs": ["benchLoop", "passk"], "learn": {"figs": ["benchLoop", "passk"], "read": [{"label": "Hamel Husain: your AI product needs evals", "url": "https://hamel.dev/blog/posts/evals/index.html", "m": 22}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Technique: Eval suites as release gates", "why": "What the cases become once they are in."}]}, "id": "q-how-do-you-decide-what-becomes-an-eval-case-and-is-the-judge"}, {"q": "Why SQLite when production is Postgres?", "short": "Why SQLite", "tests": "The sharpest fidelity question you will face.", "a": ["Two reasons, one good and one I'd revisit. The good one: a snapshot is a single file. Trivial to capture, trivial to spin up per case, full isolation between cases, and I can open it and see exactly what the agent saw.", "The one I'd revisit: it isn't the production engine. No row-level security, different types, dialect differences. So it tests agent behaviour faithfully and database behaviour not at all.", "Rebuilt today I'd use Postgres template databases, CREATE DATABASE ... TEMPLATE, cloning per case at near-SQLite speed on the real engine. Did the gap bite? Not that I caught, which isn't quite the same thing."], "swaps": [{"when": "If they ask why it was right at the time", "line": "One local runner, a tiny team, and isolation per run mattered more than a distributed database. SQLite was enough for the problem and the team we had."}, {"when": "If they ask what breaks first as it grows", "line": "Concurrent writers, running it across machines, and production semantics like RLS. Next step: per-run isolated databases, then ephemeral Postgres. The invariant stays: every run starts from a known, isolated state."}], "land": "Name the fidelity you traded, then the production-grade alternative.", "learn": {"figs": ["sqliteTemplate"], "read": [{"label": "Postgres docs: template databases", "url": "https://www.postgresql.org/docs/current/manage-ag-templatedbs.html", "m": 4}, {"label": "SQLite docs: datatypes and type affinity", "url": "https://www.sqlite.org/datatype3.html", "m": 18}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/env-snapshots", "label": "Technique: Environment snapshots", "why": "Two ways to give every case its own world."}]}, "id": "q-why-sqlite-when-production-is-postgres"}, {"q": "What happens when the production schema changes?", "short": "Schema changes", "tests": "Have you lived with it, or only built it?", "a": ["The base snapshot is append-only by design: old rows don't move under old cases, and a new case that needs another Michael gets a new name. So a case that used to pass and now fails points at the agent, not the fixture.", "What I'd add on top is to version the snapshot, pin each case to a version, and fail loudly on a mismatch. A test that silently measures the wrong thing is worse than one that refuses to run."], "land": "It rots quietly unless the version is pinned and checked.", "learn": {"figs": [], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/consistency/event-sourcing", "label": "Technique: Event sourcing and append-only ledgers", "why": "Append-only is why an old case never moves under you."}]}, "id": "q-what-happens-when-the-production-schema-changes"}, {"q": "How long does one case take to author, and what would you change?", "short": "What it cost, and what you'd change", "tests": "The number the scaling argument rests on. Don't dodge it.", "a": ["I never instrumented it, so this is an estimate rather than a measurement: about three to four hours a case at the start, dropping to forty-five minutes to an hour once the scanner pulled the traces and prior turns together automatically.", "It's expensive, and that's the honest trade-off: we bought answers that hold up when the agent takes a new path, and paid in expert time per case.", "What I'd change: instrument authoring time from day one, since I can't give you a measured number, and version the base snapshot explicitly instead of relying on append-only discipline."], "land": "Estimate first, with its basis; then two concrete changes.", "learn": {"figs": ["benchLoop"], "read": [{"label": "Hamel Husain: your AI product needs evals", "url": "https://hamel.dev/blog/posts/evals/index.html", "m": 22}], "sdLinks": []}, "id": "q-how-long-does-one-case-take-to-author-and-what-would-you-cha"}, {"q": "What doesn't the bench catch, and did it gate deploys?", "short": "Where the bench stops", "tests": "Do you volunteer the limit?", "a": ["Anything where the right answer isn't countable from the fixture, like whether a meeting brief is actually useful. And anything the scanner never saw fail: the bench only knows failures that already happened, so new features start with no coverage.", "On gating: nightly runs plus subset runs on changes, reviewed by whoever made the change. It blocked the big releases, like the orchestration rewrite. It wasn't a hard gate on every commit, because a thirty-minute run with model variance on every push would have slowed the team more than it protected them."], "land": "Volunteer the limit; it gated the releases that mattered.", "figs": ["completeness"], "learn": {"figs": ["completeness"], "read": [{"label": "Anthropic: demystifying evals for AI agents", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "m": 40}], "sdLinks": []}, "id": "q-what-doesn-t-the-bench-catch-and-did-it-gate-deploys"}]}, {"group": "Designing replay and evals", "blurb": "First principles: what is frozen, how it runs, how it's scored. Compact.", "items": [{"q": "What's hard about replay? Design one from scratch.", "short": "Design a replay and eval system", "tests": "Structure before boxes; name the hard part.", "a": ["Four decisions, in order. Requirements: reproducing a failure, testing a change, measuring capability or efficiency? Each wants something different.", "Determinism: decide what's frozen, the transcript, the world, the tool results or only the effects. Kitaru freezes the transcript; my bench froze the world.", "Execution: workers claiming runs with leases, slots, retries, cancellation and isolation per run. Evaluation: outcome and final state first, then policy, then trajectory, then cost, then repeatability.", "And the hard part isn't capture, it's divergence: exact keys punish the change you're measuring."], "land": "Requirements, what's frozen, how it runs, how it's scored. The hard part is divergence.", "figs": ["forkReplay", "kitaruFreeze"], "learn": {"figs": ["forkReplay", "kitaruKey", "kitaruFreeze"], "read": [{"label": "Temporal: workflow execution, event history and replay", "url": "https://docs.temporal.io/workflow-execution", "m": 3}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Divergence, drawn for both designs."}]}, "id": "q-what-s-hard-about-replay-design-one-from-scratch"}, {"q": "Two runs take different paths to the same right answer. Pass or fail?", "short": "Different paths, same answer", "tests": "Outcome versus trajectory.", "a": ["Pass. Score the final state against a goal state, not the path; tau-bench scores the final database state against an annotated goal for exactly this reason.", "Trajectory is a separate score: efficiency and policy. Keep them apart, so a better path isn't punished as a regression."], "land": "Final state for pass or fail; trajectory scored separately.", "figs": ["completeness"], "id": "q-two-runs-take-different-paths-to-the-same-right-answer-pass-", "learn": {"figs": ["completeness"], "read": [], "sdLinks": []}}, {"q": "pass@k or pass^k?", "short": "pass@k or pass^k", "tests": "Reliability versus capability.", "a": ["pass@k is 'succeeds at least once in k tries': capability, can it ever do this. pass^k is 'succeeds every time in k tries': reliability, what a user lives with.", "For an agent acting on someone's mailbox, pass^k is the honest number; tau-bench showed agents that look fine on one try fall off as k grows."], "land": "pass@k asks 'can it', pass^k asks 'will it every time'.", "figs": ["passk"], "id": "q-pass-k-or-pass-k", "learn": {"figs": ["passk"], "read": [], "sdLinks": []}}, {"q": "How would you sandbox replays of a customer's agent?", "short": "Sandboxing", "tests": "Threat model first.", "a": ["Threat model first: protect the host, keep tenants apart, stop exfiltration. The worker runs in the customer's environment, which answers most of it by design.", "Inside that: task-scoped credentials that expire with the task, and isolation picked by risk up a ladder: process, container, gVisor or Kata, microVM. Effects by class: reads allowed, reversible writes in a window, irreversible ones behind confirmation, and the adapter must see every effect."], "land": "Threat model, task-scoped credentials, an isolation ladder by risk, effects by class.", "figs": ["kitaruLive"], "id": "q-how-would-you-sandbox-replays-of-a-customer-s-agent", "learn": {"figs": ["kitaruLive"], "read": [], "sdLinks": []}}, {"q": "Stub, mock, fake, record-replay: when would you use each?", "short": "Stub, mock, fake, replay", "tests": "Testing vocabulary with judgement.", "a": ["A stub returns a canned answer; a mock also asserts how it was called; a fake is a small working implementation with state; record-replay reuses real results deterministically.", "My snapshot is a fake, so a new path still gets a coherent answer; Kitaru is record-replay, cheap and realistic for paths already seen. For stateful agents fakes beat mocks; the product question is when to promote one into the other."], "land": "My bench is a fake, Kitaru is record-replay.", "figs": ["kitaruFreeze"], "id": "q-stub-mock-fake-record-replay-when-would-you-use-each", "learn": {"figs": ["kitaruFreeze"], "read": [], "sdLinks": []}}]}, {"group": "Kitaru, from the inside", "blurb": "They won't ask these directly. Know them, and drop one in where it fits.", "items": [{"q": "What's wrong with Kitaru?", "short": "What's wrong with Kitaru", "id": "say-critique", "tests": "Name one thing that's wrong or oversold. Never answer with a compliment. If stuck: 'give me a second'.", "a": ["The one that stood out to me is provenance on mocked calls. When a tool has no policy, or on_miss is set to passthrough, the call goes out to the live provider and the node doesn't carry anything saying so. Someone reading a replay can't tell which results came from the recording and which came from the real world.", "That one's personal, because the equivalent bug at alfred_ was the agent claiming it did something it never did. We fixed it by grounding the claim against the real tool-execution record rather than the agent's account of it.", "The second is time: the tool results are frozen but the agent's clock isn't, so anything reasoning about 'today' drifts against an old snapshot."], "land": "Provenance: a reader can't tell recorded from live. Asked as a question, tied to your own anti-fabrication fix.", "notes": ["In reserve: evaluators see only what the trace captured; provider-native tools bypass the policy; no repeat-run machinery; multi-turn replays only the last turn.", "Ask about the gaps as questions. Never call them bugs; they maintain the code."], "figs": ["kitaruPolicy"], "learn": {"figs": ["kitaruPolicy"], "read": [], "sdLinks": []}}, {"q": "The architecture, in one breath", "short": "The architecture", "tests": "Drop it when they describe the product: shows you read the source.", "a": ["A control plane that never runs user code: FastAPI, Postgres and a blob store holding tasks, configs, datasets and results.", "Workers run in the customer's environment, claim tasks with a lease, and spawn the agent as a normal subprocess with the replay id in its environment. An adapter inside hooks the framework's tool execution and answers each call from the recording by SHA-256 of the tool name and canonical arguments."], "land": "The server coordinates and never runs your code; the worker runs it; the adapter answers tools by hash.", "figs": ["kitaruPlanes", "kitaruReplay"], "id": "q-the-architecture-in-one-breath", "learn": {"figs": ["kitaruPlanes", "kitaruReplay"], "read": [], "sdLinks": []}}, {"q": "The data model, and the part worth admiring", "short": "SessionNode and selectors", "tests": "Say the admiring part out loud before any critique.", "a": ["A session is one recursive table of nodes: spans, model calls, tool calls, subagent calls, joined by a parent id, so nesting goes to any depth and a recursive query walks it.", "The part worth admiring is the selectors: a JSON path into the payload instead of copied text, so a human judgement, an evaluator verdict and the UI all point at the same coordinates. I hand-rolled a worse version of that."], "land": "One recursive table; selectors point at evidence instead of copying it.", "figs": ["kitaruModel"], "id": "q-the-data-model-and-the-part-worth-admiring", "learn": {"figs": ["kitaruModel"], "read": [], "sdLinks": []}}, {"q": "Policies, and what runs live whatever you configure", "short": "Policies and live calls", "tests": "Drop it on any side-effect or trust question.", "a": ["Per-tool policies, found by exact name then the default: passthrough (the default), history by cache key, static cases, and an llm policy the PydanticAI adapter rejects. A miss goes to on_miss: fail, error_result, or passthrough.", "Model calls always run live, so an unchanged baseline is billed and not deterministic. Provider-native tools are recorded but never checked. And a bare HTTP call inside the agent isn't a tool, so no hook sees it."], "land": "The default is passthrough; model calls, native tools and bare HTTP all run live.", "figs": ["kitaruPolicy", "kitaruLive"], "id": "q-policies-and-what-runs-live-whatever-you-configure", "learn": {"figs": ["kitaruPolicy", "kitaruLive"], "read": [], "sdLinks": []}}, {"q": "Repeated calls, and multi-turn", "short": "Repeated calls and multi-turn", "tests": "Details that show depth; ask about them as questions.", "a": ["Repeated identical calls flip with scope: under baseline scope the nth call gets the nth recorded result, under agent or cohort scope it's the latest every time. The occurrence counter is read, the lookup awaited, then written, so two concurrent identical calls could take the same ordinal.", "Multi-turn replays only the last turn: earlier turns are injected as text with their tool calls dropped, so a fork only ever writes the final turn."], "land": "Scope decides which recorded result repeats; only the last turn re-executes.", "figs": ["kitaruOrder", "kitaruTurns"], "id": "q-repeated-calls-and-multi-turn", "learn": {"figs": ["kitaruOrder", "kitaruTurns"], "read": [], "sdLinks": []}}, {"q": "Durable execution, and the pivot to replay evals", "short": "Durable execution to replay", "tests": "Understanding their history from the inside.", "a": ["Kitaru launched in April as a durable execution layer for Python agents: crash recovery, human-in-the-loop with wait(), replay from any checkpoint. By August it was positioned as replay-based evals.", "Same substrate, different intent: durable execution replays history to get the same result again after a crash; an eval replays it to get a different result and understand why. The checkpoints and the recording were already there."], "land": "Same recording, opposite intent.", "notes": ["The nouns: Kitaru's @flow and @checkpoint, ZenML's @pipeline and @step (from the job post). Both Apache 2.0."], "figs": ["kitaruPosition"], "id": "q-durable-execution-and-the-pivot-to-replay-evals", "learn": {"figs": ["kitaruPosition"], "read": [], "sdLinks": []}}, {"q": "If you ran Kitaru for a quarter, what would you ship first?", "short": "A quarter on Kitaru", "tests": "Product judgement with dependencies.", "a": ["I wouldn't rebuild the runner, the sandbox or the replay layer; those work. First, provenance on every node: small, and everything else depends on a reader trusting where a result came from. Then productive misses: the diff and one action to accept a variant.", "Then the evaluation layer above the runner: production traces into eval cases, stateful multi-turn environments, scoring by outcome and final state plus policy, and regression analytics across runs. The useful unit isn't only a recorded trajectory; it's whether an agent can reliably change a realistic world into the right state."], "land": "Trust first, then productive misses, then the evaluation layer above the runner.", "figs": ["missFlow", "kitaruLive"], "learn": {"figs": ["missFlow", "kitaruLive"], "read": [], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Provenance and misses, as design problems."}]}, "id": "q-if-you-ran-kitaru-for-a-quarter-what-would-you-ship-first"}]}, {"group": "Backend depth", "blurb": "Idempotency, failures, grants and providers, compact; then two big design questions with their own boards: rebuilding and scaling your harness, and Kitaru with worlds and multi-turn.", "items": [{"q": "A side-effecting tool call fails halfway. What happens?", "short": "A side effect fails halfway", "tests": "Idempotency and crash windows.", "a": ["You can't get exactly-once against a third-party API you don't control, so the goal is exactly-once logical effect: at-least-once delivery with effects that are safe to repeat.", "We write the intent to a tool-execution ledger before the call, so there's a record even if the process dies mid-flight; the anti-fabrication guards read the same ledger. Side-effecting actions sit behind a confirm verdict with a bounded undo window.", "If the send succeeded but the response timed out, look the effect up at the provider before retrying blind. The real design work is where the idempotency key lives."], "land": "Intent first, a key, reconcile before retry.", "notes": ["Classify first: read, idempotent write, non-idempotent write, external effect.", "On a forked replay, a write that misses fails closed."], "figs": ["zenEffects", "alfredWrap"], "learn": {"figs": ["zenEffects", "alfredWrap"], "read": [{"label": "Stripe, \"Designing robust and predictable APIs with idempotency\"", "url": "https://stripe.com/blog/idempotency", "m": 12}, {"label": "Brandur Leach: Stripe-like idempotency keys in Postgres", "url": "https://brandur.org/idempotency-keys", "m": 22}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/multi-step/idempotency", "label": "Technique: Idempotency keys", "why": "Where the key lives decides whether a retry is safe."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/unknown-results", "label": "Technique: Idempotent tools and unknown results", "why": "The send succeeded but the response timed out."}]}, "id": "q-a-side-effecting-tool-call-fails-halfway-what-happens"}, {"q": "A worker dies halfway through a replay. What happens?", "short": "A worker dies", "tests": "Leases, retries, cancellation.", "a": ["The task was claimed with SKIP LOCKED and holds a lease kept alive by heartbeats; when they stop, a sweeper sees the expired lease and requeues it.", "The rerun must be safe: replay mostly is, anything live needs an idempotency key. Cancellation must kill the whole process tree, or orphaned subprocesses keep calling out, and retries need backoff with jitter, or a bad deploy becomes a retry storm."], "land": "Lease, heartbeat, sweeper; safe reruns; kill the tree; backoff with jitter.", "figs": ["skipLocked"], "id": "q-a-worker-dies-halfway-through-a-replay-what-happens", "learn": {"figs": ["skipLocked"], "read": [], "sdLinks": []}}, {"q": "Hardest bug you've debugged?", "short": "The PUBLIC grant", "tests": "Mechanism-level understanding.", "a": ["Agent-facing read functions in Postgres were SECURITY DEFINER, so they run with the definer's privileges and can see past row-level security to do their job. The subtle part: Postgres grants EXECUTE to PUBLIC by default on a new function, so a function deliberately bypassing RLS was callable by any authenticated role. A cross-user leak class.", "Nothing was exploited; it came out of an adversarial design review. We fixed the grants, and the more important fix was the migration checklist and a test: no SECURITY DEFINER function may carry a PUBLIC execute grant."], "land": "Fix the class, not the instance.", "figs": ["definerGrant"], "learn": {"figs": ["definerGrant"], "read": [{"label": "Postgres docs: CREATE FUNCTION, writing SECURITY DEFINER functions safely", "url": "https://www.postgresql.org/docs/current/sql-createfunction.html", "m": 3}, {"label": "Supabase docs: row-level security and security definer functions", "url": "https://supabase.com/docs/guides/database/postgres/row-level-security", "m": 24}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-safety/least-privilege", "label": "Technique: Least privilege and sandboxing", "why": "Least privilege failing by default."}]}, "id": "q-hardest-bug-you-ve-debugged"}, {"q": "How do you normalise Gmail, Outlook and IMAP?", "short": "Three mail providers", "tests": "Provider adapters, your own world.", "a": ["One internal model behind all three, where each provider fails differently: the same problem as Kitaru's importers across Langfuse, LangSmith and Braintrust, with different nouns.", "Provider schemas stay at the edge; inside there's one canonical model with time zones, ids and contacts normalised. Contract tests against recorded payloads catch drift, and the raw payload is kept next to the normalised one for debugging."], "land": "Provider schemas at the edge, one model inside, contract tests for drift, raw payload kept.", "notes": ["Have one concrete behavioural difference between providers ready, and what it forced in the model."], "learn": {"figs": [], "read": [{"label": "Gmail API: synchronising a client with history.list", "url": "https://developers.google.com/workspace/gmail/api/guides/sync", "m": 3}, {"label": "Microsoft Graph: delta query for messages", "url": "https://learn.microsoft.com/en-us/graph/delta-query-messages", "m": 8}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/email-agent/hld", "label": "Email and calendar agent, high-level design", "why": "The providers behind one model."}]}, "id": "q-how-do-you-normalise-gmail-outlook-and-imap"}, {"q": "Your eval harness: why this shape, what would you change, what breaks at scale, and how would you productionize it?", "short": "Design 1: rebuild and scale your harness", "tests": "The big one. Do you know why your system is the way it is, where it breaks, and how you'd grow it into something other people rely on?", "probes": ["Why did you build it this way?", "If you rebuilt it today, what would you change, and what would you keep?", "What breaks first at ten times the cases, then a hundred?", "How would you scale it?", "How would you productionize it so other teams use it?", "SQLite or Postgres, honestly?"], "parts": [{"title": "1. Why it's built this way: the constraints", "items": ["One product, a small team, one local runner, and one question: is the new agent actually better than the old one? A little over a hundred cases, not thousands.", "**Freeze the world, not the transcript.** A snapshot per task, built from about twenty-five real instances, so the agent can take a path it never took in production and still get a truthful answer.", "**SQLite per task.** A single file: trivial to capture, isolated by construction, disposable, and I can open it and see exactly what the agent saw.", "**Swap the provider, not the tool.** Most bugs lived in the seam between tool output and the model, so tool code runs for real.", "**Cases come from real failures.** Scanner, calibrated judge, promotion with de-duplication."]}, {"title": "2. What I'd keep", "items": ["The seam at the provider boundary.", "Assertions computed from the snapshot, never pinned text.", "An append-only base, so an old case never moves under you.", "Cases fed by real production failures.", "Efficiency counted only over runs that pass."]}, {"title": "3. What I'd change if I rebuilt it today", "items": ["Instrument authoring time from day one: I can only estimate it (three to four hours a case, then under an hour).", "Version the base snapshot and pin each case to a version, failing loudly on a mismatch.", "Return an explicit 'not in this snapshot' error instead of an empty result, and keep harness-limited runs out of the headline number.", "Stamp every tool answer with how it was served: snapshot, not in snapshot, or live.", "Postgres template databases instead of SQLite, for the real engine and row-level security.", "Report pass^k on gating cases, not a single run."]}, {"title": "4. What breaks at 10x, then 100x, in the order it breaks", "items": ["**Authoring is the wall, and it's human.** At tens of cases it's an investment; at hundreds it's someone's job; at thousands it isn't done. It arrives before any technical limit.", "**Schema drift.** Every production migration can rot old snapshots; the cost is cases times migration rate.", "**Redaction becomes a security surface.** At tens a person checks each snapshot; at hundreds it's automated, and automated redaction is never complete. A growing store of near-production data.", "**One runner.** The nightly run stretches past the night; SQLite is single-writer; nothing runs in parallel across machines.", "**Cost of repeats.** Cases times k model calls; the temptation is to cut k exactly when variance matters most.", "**The shared ceiling:** multi-turn. Freezing the world fixes effects across turns, not a user who would have said something else."]}, {"title": "5. How I'd scale it", "items": ["**Storage:** an immutable base world per intent, and a copy-on-write fork per run: a Postgres template clone, or an event log of writes on top of the base. Checkpoint the world at each turn so a run can branch from turn N.", "**Authoring:** automate snapshot building from the scanner. Pull the same-intent instances, union the tools, reconcile entities (the three-Michaels renaming, generalised), and have a human review rather than build.", "**Execution:** runs become rows in a queue; workers claim with SKIP LOCKED under a lease; an index from tool to cases so a change runs only what it touches; cases run in parallel.", "**Drift:** the world is versioned against the schema; fixtures migrate with the same migrations, or pin and fail loudly.", "**Redaction:** automated, with synthetic replacement of identities, plus access control, audit and retention on the fixture store.", "**Cost:** k runs only for cases that flake or flip between versions; recorded model answers for an unchanged baseline."]}, {"title": "6. How I'd productionize it for other teams", "items": ["A case becomes a record, not a file: intent, world version, user turns, assertions, owner.", "A 'promote this failure' action straight from the scanner, so a production failure becomes a case in minutes.", "A gate in CI: the touched subset on every PR, the full bench nightly, a per-case diff a reviewer can read.", "Provenance on every answer, so a result says what was real.", "The metrics that say it's healthy: authoring time, flake rate, coverage by intent, judge agreement over time."]}, {"title": "7. The trade-offs to say out loud", "items": ["Expensive authoring for answers that hold up on new paths.", "Speed (SQLite) against fidelity (Postgres).", "Coverage against cost (k runs).", "Determinism against realism: model calls stay live, on purpose."]}, {"title": "8. Deep dives, if they go down", "items": ["**World storage.** A file per task, a template database, or a base plus an event log. Pick: template clones for fidelity now, an event log when you need cheap branching and a state diff to score.", "**Building worlds without experts.** Union the tools of same-intent sessions, reconcile entities, fill gaps synthetically but mark them synthetic, human review last.", "**Drift.** Version worlds against the schema and fail loudly on a mismatch; a test that measures the wrong thing silently is worse than one that refuses to run."]}], "a": ["I built it the way it is because of where we were. One product, a small team, and one question: is the new version of the agent actually better? So I froze the user's world rather than the transcript, a SQLite snapshot per task built from about twenty-five real instances, and I swapped the provider rather than the tool, because most of our bugs lived in the seam between what a tool returned and how the model read it.", "If I rebuilt it today, I'd keep that core. What I'd change is mostly honesty and fidelity: measure authoring time from day one, version the snapshots and pin each case to a version, return an explicit 'not in this snapshot' instead of an empty result, and stamp every answer with how it was served. And I'd use Postgres template databases instead of SQLite, so I'm testing on the real engine.", "The first thing that breaks at scale isn't technical, it's authoring. A good snapshot is expert work, and at hundreds of cases that becomes someone's job. Then schema drift starts rotting old snapshots, and redaction turns into a security problem, because you're holding more and more near-production data.", "To scale it, I'd make the world an immutable base with a copy-on-write fork per run, checkpointed at every turn so you can branch. I'd automate building the worlds from the scanner so a person reviews instead of builds. And runs become a queue with leases, where a change only runs the cases it touches.", "And to productionize it, a case becomes a record rather than a file, with a one-click 'promote this failure' from the scanner, a CI gate on the touched subset, and provenance on every answer. The number I'd watch is authoring time, because that's the wall."], "swaps": [{"when": "If they ask what breaks first", "line": "Authoring. Not the database, not the runner. A good snapshot is expert work, and it stops scaling long before the infrastructure does."}, {"when": "If they ask what you'd never change", "line": "Swapping the provider and not the tool. That seam is where the bugs were, so that's the part that has to stay real."}, {"when": "If they ask how you'd know it's working at scale", "line": "Authoring time going down, flake rate staying flat, coverage by intent going up, and the judge's agreement with people not drifting."}, {"when": "If they ask SQLite or Postgres", "line": "SQLite was right for one runner and a small team. For other teams, template databases on Postgres: real engine, real RLS, still cheap to clone per run."}], "land": "Keep the seam, fix the honesty, and scale the authoring, because authoring is the wall.", "notes": ["Tell it as a story in five beats: why, what I'd change, what breaks, how I'd scale, how I'd productionize.", "Say the order of breaking out loud; it's the insight most people miss."], "figs": ["harnessSeam", "kitaruScale", "sqliteTemplate", "skipLocked"], "id": "q-your-eval-harness-why-this-shape-what-would-you-change-what-", "learn": {"figs": ["harnessSeam", "kitaruScale", "sqliteTemplate", "skipLocked"], "read": [], "sdLinks": []}}, {"q": "If Kitaru moved toward your design, with stateful worlds, fakes and multi-turn runs, what would it need?", "short": "Design 2: Kitaru with worlds and multi-turn", "tests": "Can you design an evolution of their system, respect what exists, and name the trade-offs? This is their roadmap question.", "probes": ["What changes in the infrastructure?", "Where does the world come from?", "How do you keep import free?", "How do fakes stay honest?", "How does multi-turn work when the agent diverges?", "What are the trade-offs?", "What would you build first?"], "parts": [{"title": "1. Requirements: what changes, what doesn't", "items": ["**Keep:** import stays free, and the recorded path stays the default for every session.", "**Add:** a session can be promoted into a world; the agent can call tools off the recorded path and get coherent answers; writes persist across turns within a run; a user side can respond when the agent diverges.", "**Non-functional:** every answer carries how it was served (recorded, alias, world, live, simulated); a run is reproducible from a world version and seeds; the server still never runs user code."]}, {"title": "2. New entities", "items": ["**World:** an immutable base built from a session and its same-intent neighbours, versioned.", "**Run state:** a copy-on-write fork of the world per run, checkpointed per turn.", "**Fake:** for each tool, how the world answers it: a query over the world's tables, generic or user-written.", "**Simulated user:** goal, constraints, persona, stop conditions, and a calibration score.", "**Promotion task:** builds a world from recordings; runs on the worker, next to the customer's data."]}, {"title": "3. Infrastructure changes", "items": ["**The adapter gets a resolver chain** instead of one lookup: exact recording, then alias, then the world's fake, then the policy (fail or live). Every node is stamped with which one answered.", "**A world store:** a base per world in the customer's blob store or Postgres, cloned per run; an event log of writes so a run's final state can be diffed against a goal.", "**Fakes in the SDK:** generic fakes for the common tools (email, calendar, CRM, search), and a way for users to write their own as Python functions over the world. This is the biggest new product surface.", "**The turn loop moves into the worker:** replay recorded user turns while the agent stays equivalent; at real divergence, hand over to the simulated user.", "**Checkpoints reuse the durable-execution heritage:** checkpoint the world with the flow, so a run can branch from turn N.", "**Scoring:** final world state against a goal state, plus trajectory and policy, reported as pass^k."]}, {"title": "4. Trade-offs", "items": ["**Cost:** a world costs compute and review. Promote only the sessions someone forks.", "**Fidelity:** a fake answers coherently but can be wrong in ways a recording never is. Provenance has to show it.", "**Determinism:** a simulated user is a second model in the loop. Hold it fixed across baseline and fork, and calibrate it.", "**SDK surface:** fakes per tool are a lot to maintain. Start with generic fakes for the three most common tools.", "**Data governance:** worlds built from production data live longer than a trace. Keep them on the customer's side, with retention."]}, {"title": "5. Deep dive: building a world from recordings", "items": ["**Problem:** a session only contains the calls it made; the new agent will ask for others.", "**Options:** union the calls of same-intent sessions (my bench); synthesise neighbours with a model; let the customer supply fixtures.", "**Pick:** union and entity reconciliation first; synthetic fill only where needed, marked synthetic on every node it answers."]}, {"title": "6. Deep dive: keeping fakes honest", "items": ["**Problem:** a fake can drift from the real tool and nobody would notice.", "**Pick:** calibrate every fake against its own recording. Replay the recorded calls through the fake; if it disagrees with what the real tool returned, it isn't trusted. It's the same idea as calibrating a judge."]}, {"title": "7. Deep dive: multi-turn when the agent diverges", "items": ["**Options:** truncate at the first divergence (cheap, blind to what came after); a simulated user from the session's goal (a full counterfactual, two models); the hybrid.", "**Pick:** the hybrid. Replay recorded user turns while the agent's replies stay equivalent, and hand over to the simulator only at real divergence.", "**Calibration:** run the simulator against the unchanged baseline; if it can't reproduce what the real user said, its behaviour on the new agent isn't evidence.", "**Open question:** how to define 'equivalent' between two agent replies."]}, {"title": "8. Deep dive: state and branching", "items": ["An immutable base, and an event log of writes per run: cheap forks, a free state diff for scoring, and a branch from any turn's checkpoint.", "Concurrency stays per run, so the occurrence-counter problem goes away inside a world: the world answers by query, not by ordinal."]}, {"title": "9. What I'd build first", "items": ["Provenance on every node and the alias step in the resolver chain: small, and it builds trust.", "Then promotion of a forked session into a world with generic fakes for two or three tools, each calibrated against its recording.", "Then the multi-turn hybrid, with a calibrated simulator."]}], "a": ["I'd keep what Kitaru already does well: import stays free and the recorded path stays the default. The change is that a session someone actually forks can be promoted into a world.", "In the infrastructure, the adapter stops being one lookup and becomes a chain: the exact recording, then an alias, then the world, then the policy. And every answer gets stamped with which one it came from, because the moment you have fakes, provenance stops being nice to have.", "The world itself would be an immutable base built from that session and other sessions with the same intent, which is exactly what I did by hand at alfred_, with a copy-on-write fork per run. Kitaru already checkpoints flows, so checkpointing the world with them gives you branching from any turn almost for free.", "The hard part is keeping fakes honest. I'd calibrate every fake against its own recording: replay the recorded calls through it, and if it disagrees with what the real tool returned, it isn't trusted. Same idea for the simulated user: run it against the unchanged baseline, and only trust it if it reproduces what the real user said.", "The trade-off is cost and fidelity. Worlds are expensive and fakes can be wrong in new ways, so you only pay for the sessions people fork, and you never let a simulated answer look like a real one. I'd build provenance and aliases first, then promotion with a couple of generic fakes, then multi-turn."], "swaps": [{"when": "If they ask where the world comes from", "line": "From the session itself plus other sessions with the same intent: union the tools they used, reconcile the entities, and only fill gaps synthetically, marked as synthetic."}, {"when": "If they ask how to keep import free", "line": "Nothing changes on import. A world is only built when someone forks a session and it starts missing."}, {"when": "If they ask about the biggest risk", "line": "A fake that's confidently wrong. That's why every fake is checked against its own recording before it's trusted, and every answer says it came from a fake."}, {"when": "If they ask what you'd build first", "line": "Provenance and aliases. They're small, they help today's users, and everything after depends on a reader trusting where an answer came from."}], "land": "Import stays free; promote only forked sessions into worlds; calibrate every fake and simulator against the recording.", "notes": ["Ask it back as a question at the end: whether stateful worlds are on their roadmap or deliberately out of scope.", "Respect what exists: say what you would not change before what you would add."], "figs": ["kitaruFreeze", "forkReplay", "missFlow", "multiturn"], "id": "q-if-kitaru-moved-toward-your-design-with-stateful-worlds-fake", "learn": {"figs": ["kitaruFreeze", "forkReplay", "missFlow", "multiturn"], "read": [], "sdLinks": []}}]}], "ask": [], "ask3": [{"id": "clarify", "title": "Clarifying", "when": "During the interview, before you answer or design.", "why": "Design prompts are vague on purpose: they are watching whether requirements drive your solution. A good clarifying question names the decision it changes. It is also the rescue when you blank: in the mock, the miss question needed one.", "how": ["Ask one to three before you design, each tied to a decision: 'because it decides X'.", "If they say 'you decide', pick, say why in one line, and write the assumption down.", "Do not ask what you can reason out yourself; that reads as stalling.", "Mid-answer, check the depth once: it keeps a long answer pointed at what they care about."], "items": [{"to": "Either", "q": "Are we reproducing a known failure, or testing a change?", "loop": "'Before I sketch, one question, because the design splits here: ...'", "why": "Replay for debugging and replay for evaluation freeze different things."}, {"to": "Either", "q": "Who is the user of this screen: the engineer who wrote the agent, or someone reviewing results?", "loop": "Use it the moment a question turns to UX: 'Let me start with who is looking at it.'", "why": "It turns 'what should the screen show' into something concrete. It is exactly where the mock went quiet."}, {"to": "Either", "q": "How big: a few dozen sessions, or a cohort of thousands?", "loop": "'Rough scale first, because it changes the answer: ...'", "why": "Scale decides between a world snapshot and a recorded call log."}, {"to": "Either", "q": "Can a replay reach production in this scenario, or is every effect behind the adapter?", "loop": "Before any side-effect answer: 'Is the tool's effect real here?'", "why": "Side-effect policy depends on it, and it shows you think about provenance first."}, {"to": "Either", "q": "Do you mean how it works today, or how I'd change it?", "loop": "When a question could be either: 'Today's version first, or where I'd take it?'", "why": "Clarifying the question itself saves a wrong three-minute answer."}, {"to": "Either", "q": "Is this the depth you want, or shall I go down on the storage?", "loop": "Once, about a minute into a long answer.", "why": "It hands them the steering wheel; interviewers take it gladly."}]}, {"id": "contribute", "title": "Contributing", "when": "At the end, first. About their problems and how you would add to them.", "why": "What you ask shows your preparation and judgement as much as your answers. Questions about success and their hard problems show you are thinking about impact, and the answer tells you whether the role has a concrete plan behind it.", "how": ["Ask about their hardest problem, not their perks.", "Bridge from something they said earlier: 'You mentioned X...'", "Listen fully. Then add one line from alfred_ if it helps, never a pitch: 'We hit a version of that; happy to share how it went.'", "One question, then wait. Two or three contributing questions at most."], "items": [{"to": "Hamza", "q": "What would you want someone in this seat to have shipped by the end of the first month?", "loop": "Lead with it: 'To picture the role concretely: ...'", "why": "Success in ninety days, made specific to a small team. Their answer is your first-month plan."}, {"to": "Hamza", "q": "Where do you see Kitaru against observability tools long term: is replay the wedge, or the product?", "loop": "After they describe the product or a customer: 'That makes me curious about the bigger picture: ...'", "why": "Strategy, asked as curiosity. Founders enjoy this one."}, {"to": "Alex", "q": "What's been the hardest thing to get right in the replay path?", "loop": "'You've seen more replays than anyone: ...'", "why": "It invites him to teach, and his answer is where you would start."}, {"to": "Either", "q": "When a forked replay misses for early users, is that the main support conversation, or a rare edge?", "loop": "If the miss came up earlier: 'Coming back to misses: ...'", "why": "It tests your own critique against their data, without calling it a bug."}, {"to": "Either", "q": "When an unchanged replay diverges because the model sampled differently, what do you show the user?", "loop": "After any talk of nondeterminism or cost.", "why": "It names a real open problem and shows you have read the product closely."}, {"to": "Hamza", "q": "Deciding which production behaviours become durable eval cases was the hard part for us. How are you thinking about that for Kitaru users?", "loop": "Best right after your bench story lands.", "why": "It turns your experience into their roadmap question."}]}, {"id": "collaborate", "title": "Collaborating", "when": "At the end, after contributing. How you would work together.", "why": "How a team designs, reviews and decides tells you whether you would thrive, and asking shows you already think like a teammate. Ask about real practice, not a description of the culture.", "how": ["Ask for a recent example rather than a policy: 'the last time...'", "Tie each to something from the job post you care about, without quoting it.", "Match the question to the person: Hamza on how decisions get made, Alex on how the work gets done."], "items": [{"to": "Hamza", "q": "How does a user's problem become shipped work here? Does a Slack thread go straight to a PR, or is there a planning step between?", "loop": "'I'm curious how the loop actually runs day to day: ...'", "why": "It checks the 'PRs, not tickets' pace they promise, and shows you want it."}, {"to": "Hamza", "q": "How does the public side work in practice? On X, in demos and in content, who owns what, and how would this seat fit with the rest of the go-to-market motion?", "loop": "After the building-in-public question: 'On that, how does it work in practice: ...'", "why": "It shows you take the public half seriously and want to do it with the team, not alone."}, {"to": "Alex", "q": "What have you learned from early users about the first ten minutes, and what did the guided tour change?", "loop": "'Since you built the guided tour: ...'", "why": "It is his work; you would be collaborating on it from week one."}, {"to": "Alex", "q": "How do you review code here, especially agent-written code? What counts as blocking versus a nit?", "loop": "After talking about how you use coding agents.", "why": "Code review shows how a team gives feedback in general."}, {"to": "Hamza", "q": "The last time the team disagreed about what to ship, how did it get decided?", "loop": "Only if there is time; it is the most personal one.", "why": "It shows you care how decisions get made, and tells you how it would feel to disagree."}]}], "traps": [["Leading with history", "Headline first: the real agent against a frozen snapshot of the user's world, only the provider call swapped."], ["Dodging the authoring-cost question", "Say it's an estimate, then the number, then the basis."], ["Praising Kitaru when asked what's wrong", "Provenance, then time. If stuck, 'give me a second'."], ["Two questions in one breath", "One at a time, name the thing, then wait."], ["Vague numbers", "5,000+ users, 12 classes, about 3 in 4, 100+ cases, 25 to 30 minutes nightly, 90 to 3 seconds."], ["Going sideways when pushed", "Add a detail about the same system, not a second system."], ["Defending SQLite", "Name the fidelity gap, then CREATE DATABASE ... TEMPLATE."], ["Calling their gaps bugs", "Ask as questions; they maintain the code."], ["Citing their PRs or commits", "Never. Ask a normal question and let them bring it up."], ["Funding, crunch, internal version names, colleagues' names", "Never."], ["Running long", "At minute 70 of 90, hand them your questions."]], "tables": [{"title": "Tool policies", "note": "Resolution is by exact tool name, then the default.", "head": ["Policy", "What it does"], "rows": [["passthrough", "Runs the real tool. The default when no policy is set."], ["history", "The recorded result, by cache key, within a scope."], ["static", "Ordered cases, first match wins; exact or subset matching."], ["llm", "Modelled in the API; rejected at runtime by the PydanticAI adapter."]]}, {"title": "on_miss", "note": "Three values, and every one is a bad escape for an improved agent.", "head": ["Value", "What happens"], "rows": [["fail", "Raises; the node is recorded failed and the whole replay dies."], ["error_result", "The model gets a literal error and keeps running: you grade recovery from an error you invented."], ["passthrough", "Calls the real tool; the node carries no mocked attribute. The silent fidelity hole."]]}, {"title": "The cache key", "note": "sha256(tool_name + a null byte + canonical JSON: sorted keys, compact separators, allow_nan false). No fuzzy or subset matching on history.", "head": ["Change to the arguments", "Matches?"], "rows": [["Key order, JSON formatting", "Yes"], ["Whitespace inside a string", "No"], ["1 against 1.0, true against 1", "No"], ["NaN, infinity, unserialisable", "No key at all: straight to on_miss, no diagnostic"], ["Non-ASCII", "Within one adapter language only"]]}, {"title": "Repeated calls flip with scope", "note": "Ask about the concurrency point as a question: the counter is read, the lookup awaited, then the counter written.", "head": ["Scope", "Behaviour"], "rows": [["baseline", "The nth recorded node, ordered by started_at, then id: ordered consumption, from completed and failed nodes."], ["agent, cohort version", "The latest completed node, the same one every time."]]}, {"title": "What always runs live", "note": "", "head": ["Thing", "Why it matters"], "rows": [["Model calls", "Every replay is billed and nondeterministic, even unchanged."], ["Anything outside a registered tool", "A bare HTTP call reaches production."], ["Provider-native tools", "Recorded but never checked against policy."], ["Earlier turns' tool calls", "Dropped: only the final turn re-executes."]]}, {"title": "Claims against the source", "note": "", "head": ["Claim", "Reality"], "rows": [["Replays never touch production", "The default policy is passthrough, and so is one on_miss value."], ["No card gets refunded twice", "True for registered function tools; native tools bypass."], ["Compare distributions across runs", "No repeat-count or aggregation exists."], ["Multi-turn replays faithfully", "Final turn only; earlier tool activity stripped."], ["No user code runs on the server", "Accurate."]]}], "admire": "The selector design is the bit I keep thinking about: storing a JSON path into the payload instead of copying text out, so a human judgement, an evaluator verdict and the UI all point at the same coordinates. I hand-rolled a worse version.", "kitaruLead": "Kitaru spawns your agent as an ordinary subprocess in your own environment, and an in-process adapter intercepts the agent framework's tool-execution hook, answering each tool call by a SHA-256 lookup against a recorded call log. The diagrams are from your teardown; the tables are the mechanisms they will probe.", "figures": ["kitaruPlanes", "kitaruReplay", "kitaruModel", "kitaruPolicy", "kitaruKey", "kitaruOrder", "kitaruTurns", "kitaruLive", "kitaruFreeze", "kitaruScale", "kitaruPosition"], "mockHow": "Full mocks run in the Claude Code chat. Say **'run the ZenML mock, 25 minutes'**. Hamza leads on your story, why this move and judgement; Alex goes down on mechanism and what the user sees. Each mock below starts with the read. Open the conversation to see every turn in one screen: the turns on the left, and for the one you pick, what they asked and how it landed, what you said, and what to say. Every gap also sits on the Prep tab.", "mocks": [{"id": "m1", "title": "Mock 1: Hamza and Alex", "when": "Sunday 27 September 2026, 10:12 to 10:38, 26 minutes", "read": ["The bench came across as real work: one snapshot per task, users merged into it with duplicate people renamed, the harness flag that swaps only the provider call. Alex said he wanted to think about it more, which is the reaction you want.", "It went wrong in two places. When they pushed on the empty result, you defended it instead of naming it as a gap, and that is the same provenance problem you plan to criticise in Kitaru. Then the design question on misses collapsed, although the answer is already on your Prep tab. Both are fixable by tomorrow: say the limit first, and when lost, go to what the user sees and clicks."], "landed": ["How the bench works, from the ground up, with a concrete example task.", "Honesty about the completeness judge: no calibration yet.", "Two numbers in the end: completion and completeness against ground truth you hold."], "fix": [{"t": "When you are lost on a design question, go to the smallest concrete thing: what the user sees, what they click, what changes next time.", "ref": "x7"}, {"t": "Name the limit before they do. An empty result is the harness inventing a fact.", "ref": "x3"}, {"t": "Lead with the numbers and one worked example; it took three turns to get concrete on the metric.", "ref": "x4"}, {"t": "Keep the two judges apart: the scanner's judge is calibrated, the completeness judge is not.", "ref": "x6"}, {"t": "Intro in 45 seconds: what you own, one number, the bench headline.", "ref": "x1"}], "exchanges": [{"id": "x1", "label": "What you own", "who": "Hamza", "q": "Tell us what you're working on right now at alfred_, and what part of it you actually own.", "tests": "Is the ownership real, and can you say it in under a minute?", "said": ["Founding engineer; making the agent reliable in production through eval infrastructure, memory and
