.hit { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: var(--hair); padding: var(--s2) 0; color: var(--ink); }
.hit .hb { display: block; font-size: var(--fs-sm); color: var(--muted); }
.hit:hover { color: var(--accent); }

/* the turn list: one row per turn, on the page and in the panel's rail */
main .turns { list-style: none; margin: var(--s4) 0 0; padding: 0; border-top: var(--hair); max-width: none; }
.turn { display: grid; grid-template-columns: 24px 14px minmax(0, 1fr) auto; align-items: baseline; gap: var(--s1); width: 100%; text-align: left;
  background: none; border: 0; border-bottom: var(--hair); padding: var(--s2) var(--s1); color: var(--ink); }
.turn:hover .tl { color: var(--accent); }
.turn .n { color: var(--muted); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.turn .tw { font-size: var(--fs-xs); font-weight: var(--w-strong); }

/* dialogs float, so they alone carry a shadow */
dialog { width: min(640px, 94vw); border: 0; border-radius: var(--radius-lg); padding: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-float); }
dialog::backdrop { background: rgba(10, 10, 14, .55); }

/* the one-screen panel, shared by mocks and the Prep banks: the list on the left; the item's
   header; then understanding on the page and what to say on a sunken tint, each scrolling on its own */
dialog.convo { width: min(1320px, 96vw); height: min(880px, 92vh); max-width: none; max-height: none; overflow: hidden; }
.cv { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100%; }
.cv-rail { background: var(--bg); border-right: var(--hair); overflow-y: auto; padding: var(--s4) var(--s2) var(--s4) var(--s3); display: flex; flex-direction: column; }
.cv-title { padding: 0 var(--s2) var(--s3); border-bottom: var(--hair); margin-bottom: var(--s2); font-size: var(--fs-sm); line-height: var(--lh-tight); }
.cv-title b { font-weight: var(--w-strong); }
.cv-title span { display: block; color: var(--muted); font-size: var(--fs-xs); margin-top: var(--s1); }
.cv-rail .turn { grid-template-columns: 20px 14px minmax(0, 1fr); border-radius: var(--radius); border-bottom: 0; margin-top: 1px; font-size: var(--fs-sm); line-height: var(--lh-tight); padding: 6px var(--s2); }
.cv-rail .turn .tw { display: none; }
.cv-rail .turn.on { background: var(--accent-soft); }
.cv-rail .turn.on .tl { font-weight: var(--w-strong); }
.cv-keys { margin-top: auto; padding: var(--s3) var(--s2) 0; font-size: var(--fs-xs); color: var(--muted); }

.cv-pane { display: flex; flex-direction: column; min-height: 0; }
.cv-head { padding: var(--s4) 96px var(--s3) var(--s5); border-bottom: var(--hair); flex: none; }
.cv-verdict { margin: var(--s2) 0 0 var(--s4); font-size: var(--fs-sm); color: var(--soft); }
.cv-verdict b { color: var(--ink); font-weight: var(--w-strong); }
.cv-tests { margin: var(--s1) 0 0 var(--s4); font-size: var(--fs-sm); color: var(--muted); }
.cv-tests b { color: var(--soft); font-weight: var(--w-strong); }
.cv-cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--s2); flex: 1; min-height: 0; padding: 0 var(--s4) var(--s4) 0; }
.cv-cols.has-code { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.cv-col { overflow-y: auto; padding: var(--s4) var(--s5) var(--s6); scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.cv-col.cv-say { scrollbar-color: var(--muted) transparent; }
.cv-h { font-size: var(--fs-md); margin: 0 0 var(--s3); }
.cv-col .lab, .sbody .lab { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); margin: var(--s4) 0 var(--s1); }
.cv-part { font-size: var(--fs-md); margin: var(--s5) 0 var(--s1); padding-top: var(--s3); border-top: var(--hair); }
.cv-part-lead { color: var(--soft); margin: 0 0 var(--s1); }
.cv-code { margin: var(--s2) 0 var(--s3); padding: var(--s3); background: var(--code-bg); border-radius: var(--radius); overflow-x: auto;
  font-family: var(--mono); font-size: var(--fs-code); line-height: 1.6; color: var(--code-ink); white-space: pre; }
.cv-code code { background: none; padding: 0; font-size: inherit; color: inherit; }
/* what to say: the one inverse sheet on the screen (dark on the light theme), so the words to
   say never read like the notes beside them. Its labels are the sheet's own ink, dimmed. */
.cv-say { background: var(--ink); color: var(--bg); border-radius: var(--radius-lg); margin-top: var(--s4); }
.cv-say .cv-h, .cv-say .lab, .cv-say .transcript .who, .swap .sw-when, .cv-meta { color: inherit; opacity: .72; }
.cv-say a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
.cv-say .sep { background: var(--muted); }
.cv-say .mk-list li::marker { color: var(--muted); }
.cv-land { margin: 0 0 var(--s4); padding: 0 0 var(--s3); border-bottom: 1px solid var(--muted); }
.cv-land b { font-weight: var(--w-strong); }
.cv-say .transcript { background: transparent; color: inherit; border-radius: 0; margin: 0; padding: 0; max-width: none; }
.cv-say code { background: var(--code-bg); color: var(--code-ink); }
.swap { margin: 0 0 var(--s3); padding-left: var(--s3); border-left: 2px solid var(--muted); }
.swap .sw-when { display: block; font-size: var(--fs-sm); margin-bottom: 2px; }
.swap .sw-line { display: block; }
.cv-meta { margin: var(--s4) 0 0; font-size: var(--fs-xs); }
.cv-rev { font-size: var(--fs-sm); }
.cv-said .reading a { color: var(--ink); }
.cv-col figure { padding: var(--s3); margin: var(--s4) 0 0; }
.cv-col figure svg { min-width: 0; }
.cv-close { position: absolute; top: var(--s3); right: var(--s4); z-index: 2; background: var(--surface); border: var(--hair); color: var(--soft);
  border-radius: var(--radius); padding: 2px var(--s3); font-size: var(--fs-sm); }
.cv-close:hover { color: var(--ink); border-color: var(--muted); }
@media (max-width: 860px) {
  dialog.convo { width: 100vw; height: 100vh; border-radius: 0; }
  .cv { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .cv-rail { max-height: 28vh; border-right: 0; border-bottom: var(--hair); }
  .cv-title { padding-right: 72px; }
  .cv-cols { grid-template-columns: minmax(0, 1fr); overflow-y: auto; padding: 0 var(--s3) var(--s3); }
  .cv-col { overflow: visible; }
  .cv-head { padding: var(--s3) 80px var(--s3) var(--s4); }
}

/* figures are drawn for a light ground, so they sit on the light surface on every theme
   (the light tokens' values: surface, ink, muted, rule) */
figure { margin: var(--s5) 0 var(--s6); padding: var(--s4); background: #FFFDF8; color: #1D1B17; border: 1px solid #E5DDCD; border-radius: var(--radius-lg); overflow-x: auto; }
figure svg { display: block; width: 100%; height: auto; min-width: 620px; }
figcaption { font-size: var(--fs-sm); color: #736D62; margin-top: var(--s3); }
figure .fh { font-weight: var(--w-strong); font-size: var(--fs-sm); margin-bottom: var(--s2); }
/* the tracker's own figures, drawn with its classes */
figure.trk { --faint: #a2a09a; --dim: #6b6a65; --line: #c3c0b7; --ink: #1a1a19; --live: #fffdf5; }
table { width: 100%; border-collapse: collapse; margin: var(--s1) 0; font-size: var(--fs-sm); }
th, td { text-align: left; padding: var(--s2) var(--s3) var(--s2) 0; border-bottom: var(--hair); vertical-align: top; }
th { font-weight: var(--w-strong); color: var(--muted); font-size: var(--fs-xs); }
td:first-child { font-weight: var(--w-strong); }
.tnote { font-size: var(--fs-sm); color: var(--muted); margin: var(--s2) 0 var(--s6); }

/* sessions */
.session .meta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); margin-top: calc(-1 * var(--s3)); }
.chip { color: var(--muted); }
.chip.done { color: var(--ok); }
.session .intro { color: var(--soft); margin: var(--s3) 0; }
.session > h3 { margin: var(--s6) 0 var(--s2); }
.step { border-top: var(--hair); }
.step > summary { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: var(--s3); align-items: start; padding: var(--s3) var(--s6) var(--s3) 0; }
.step > summary .st { font-weight: var(--w-strong); }
.step > summary:hover .st { color: var(--accent); }
.step > summary .sm { color: var(--muted); font-size: var(--fs-sm); padding-top: 2px; white-space: nowrap; }
.tick { width: 18px; height: 18px; border-radius: var(--radius-sm); border: 1.5px solid var(--muted); background: transparent; color: var(--surface);
  display: grid; place-items: center; font-size: var(--fs-xs); margin-top: 3px; padding: 0; }
.tick.on { background: var(--ok); border-color: var(--ok); }
.sbody { padding: 0 0 var(--s5) 30px; }
.step { scroll-margin-top: calc(var(--top) + var(--s2)); }
.sbody2 { margin: 0 0 var(--s5); grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); }
.sbody2 > .cv-said { padding: 0 var(--s4) 0 30px; }
.sbody2 > .cv-said > p.d { margin: 0 0 var(--s3); }
.pts { margin: 0 0 var(--s3); padding-left: var(--s5); }
.pts li { margin: 0 0 var(--s2); padding-left: var(--s1); }
.pts li b { font-weight: var(--w-strong); color: var(--ink); }
.pq-work { align-self: start; position: sticky; top: calc(var(--top) + var(--s3)); background: var(--surface); border: var(--hair); border-radius: var(--radius-lg); padding: var(--s4); }
.pq-work .mine { margin-top: 0; }
.pq-work details.say .transcript { margin-top: var(--s3); }
@media (max-width: 760px) { .sbody2 > .cv-said { padding: 0; } .pq-work { position: static; } }
.sbody > p.d, .sbody > p.point { margin: 0 0 var(--s1); }
.reading { margin: 0; padding: 0; list-style: none; }
.reading li { margin: 0 0 var(--s2); padding-left: var(--s3); position: relative; }

.reading .why { display: block; color: var(--soft); font-size: var(--fs-sm); margin-top: 2px; }
.sbody figure { margin: var(--s4) 0 var(--s2); }
details.say { margin-top: var(--s4); }
details.say > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--accent); }
details.say > summary::-webkit-details-marker { display: none; }
details.say > summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin-top: -3px; }
details.say[open] > summary::after { transform: rotate(-135deg); margin-top: 3px; }
details.say > summary:hover { text-decoration: underline; text-underline-offset: 3px; }
details.item > .sbody { padding-left: 0; }
@media (max-width: 700px) { .sbody { padding-left: 0; } }
.session-end { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-top: var(--s5); }
.pager { display: flex; justify-content: space-between; gap: var(--s4); margin-top: var(--s6); padding-top: var(--s4); border-top: var(--hair); }
.pager a { display: flex; flex-direction: column; color: var(--ink); font-weight: var(--w-strong); max-width: 48%; }
.pager a span { font-weight: var(--w-regular); font-size: var(--fs-sm); color: var(--muted); }
.pager a.next { text-align: right; margin-left: auto; }
.pager a:hover { color: var(--accent); text-decoration: none; }

/* quiz: one question at a time */
.dq { padding: var(--s5) var(--s5) var(--s4); }
.dq .dots { display: flex; gap: var(--s1); margin-bottom: var(--s4); }
.dq .dots i { width: 20px; height: 3px; border-radius: 2px; background: var(--rule); }
.dq .dots i.on { background: var(--accent); }
.dq .dots i.got { background: var(--ok); }
.dq .qq { font-size: var(--fs-lg); font-weight: var(--w-strong); line-height: var(--lh-tight); }
.dq .model { margin-top: var(--s4); padding-left: var(--s3); border-left: 2px solid var(--ok); color: var(--soft); }
.dq .model b { display: block; font-size: var(--fs-sm); color: var(--ok); font-weight: var(--w-strong); }
.dq .row { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s4); align-items: center; }
.dq .row .grow { flex: 1; }
.dq .close { background: none; border: 0; color: var(--muted); font-size: var(--fs-sm); }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 var(--s4) var(--s7); }

}

 exactly what has to be recorded and how a sample has to be defensible — for audit, that requirement is not background polish, it is the product itself. Durability, because a signed workpaper is the record of the audit for years afterwards; if it can be lost or altered after the fact, the traceability the whole system exists for stops meaning anything."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/framework/requirements", "label": "The framework, requirements", "why": "Top three functional, then quantified non-functionals: the rule this item teaches."}, {"href": "../SYSTEM%20DESIGN.html#/designs/prior-auth/requirements", "label": "Prior auth validator, requirements", "why": "Non-functionals for a regulated decision system, the nearest thing in the guide to audit software."}], "read": [], "figs": []}, {"t": "Back-of-envelope estimation", "sd": [{"v": "prior-auth", "a": "requirements", "why": "Capacity math kept to only what changes the design, which is the discipline this item asks for."}], "close": [{"k": "num", "q": "To one significant figure, about how many times more expensive is a cross-region round trip than a same-datacenter one?", "a": "About 300 times."}, {"k": "pick", "q": "The interviewer asks about p99 latency for the ingestion batch pipeline. What do you say?", "o": ["Give a p99 target as if it were the binding constraint", "Say p99 response time is not the constraint — throughput and cost per page are, since this is batch", "Ask her to skip the estimation section"], "a": 1, "why": "This is a batch pipeline, not a live one, so throughput and cost per page are what actually bind."}, {"k": "blank", "q": "For a ___ pipeline, throughput per engagement and cost per page are the binding constraints, not p99 latency.", "a": "batch"}, {"k": "short", "q": "One sentence: why stream large PDFs rather than seek around inside them?", "a": "Because sequential disk read is cheap and seeking wastes that advantage, especially at OCR-pipeline scale."}, {"k": "why", "q": "Why keep OCR and storage compute inside the tenant's own region rather than centralising it globally?", "a": "Because a cross-region hop costs roughly 300 times a same-region one, an unnecessary tax on every batch job."}], "say": "Pages per engagement, bytes per page, OCR cost per page, to one significant figure, out loud. And which constraint does not matter here: batch latency.", "res": [{"label": "Latency numbers, interactive", "url": "https://colin-scott.github.io/personal_website/research/interactive_latency.html"}], "do": [{"a": "Read the percentiles pages, then say which constraint you are dismissing and why", "m": 5, "where": "DDIA 2e, ch. 2 Defining Nonfunctional Requirements → Describing Performance → from Latency and Response Time through Use of Response Time Metrics. Chapter 2, not chapter 1", "out": "one sentence: this is a batch pipeline, so p99 response time is not the constraint, throughput per engagement and cost per page are", "skip": "the rest of chapter 1. Reliability and maintainability are not being asked about here.", "ans": "This is a batch ingestion pipeline, not a live request path, so p99 response time is the wrong thing to optimise for. Throughput per engagement and cost per page are the real constraints, because nobody is waiting on a single response the way a live user would be."}, {"a": "Read off four numbers: disk sequential read, disk seek, same-datacenter round trip, cross-region round trip", "m": 3, "where": "Latency numbers, interactive, the current year column", "url": "https://colin-scott.github.io/personal_website/research/interactive_latency.html", "out": "roughly 359 microseconds, 2 milliseconds, 500 microseconds, 150 milliseconds", "ans": ["Disk sequential read, 1 MB: about 359 microseconds", "Disk seek: about 2 milliseconds, so roughly six times a 1 MB sequential read", "Same-datacenter round trip: about 500 microseconds", "Cross-region round trip: about 150 milliseconds, roughly 300 times the in-region hop"]}, {"a": "Say out loud what each implies for a batch pipeline rather than a live one", "m": 3, "out": "sequential disk read is cheap, so stream large PDFs rather than seek around them; an in-region hop is negligible next to OCR compute; a cross-region hop costs roughly 300 times more, the case for keeping compute inside the tenant's region", "ans": "For a batch ingestion pipeline these numbers point the same way. Sequential disk read is cheap, so I would stream large PDFs through rather than seek around inside them. An in-region round trip is negligible next to OCR compute time, so it barely shows up in the budget. A cross-region hop costs roughly three hundred times a same-region one, which is the argument for keeping OCR and storage inside the tenant's own region rather than centralising compute globally. None of this is about response-time latency, because this is batch work — it is about not wasting cost and time on network hops that do not need to happen."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/prior-auth/requirements", "label": "Prior auth validator, requirements", "why": "Capacity math kept to only what changes the design, which is the discipline this item asks for."}], "read": [], "figs": []}, {"t": "ICFR, and SOX sections 302, 404(a) and 404(b)", "close": [{"k": "word", "q": "Which SOX section is the CEO and CFO's quarterly certification?", "a": "302."}, {"k": "word", "q": "Which section is the external auditor's attestation on management's ICFR assessment?", "a": "404(b)."}, {"k": "blank", "q": "Oxus mostly serves the ___ work — management's own annual assessment of ICFR.", "a": "404(a)"}, {"k": "pick", "q": "A prospective customer says they just need help with the CEO and CFO's quarterly sign-off. Is that squarely Oxus's territory?", "o": ["Yes, that is exactly the 404(a) work Oxus serves", "Not really — that is section 302, a different certification from the 404(a) work Oxus mainly serves", "Yes, all three sections are functionally the same work"], "a": 1, "why": "302 is the executives' own certification, distinct from the 404(a) control-testing work the product is built around."}, {"k": "short", "q": "One sentence: what does ICFR stand for and what does it give reasonable assurance about?", "a": "Internal control over financial reporting — reasonable assurance that the financial statements are reliable."}], "say": "ICFR is the set of controls that give reasonable assurance the financial statements are reliable. 404(a) is management's own assessment of those controls, 404(b) is the external auditor's attestation, and 302 is the quarterly certification by the CEO and CFO. Oxus mostly serves the internal audit team doing the 404(a) work.", "res": [{"label": "Anthropic audit-support skill, SOX 404 primer", "url": "https://skillselion.com/skills/anthropics/knowledge-work-plugins/audit-support"}, {"label": "PCAOB AS 2201, the ICFR audit standard", "url": "https://pcaobus.org/oversight/standards/auditing-standards/details/AS2201"}], "do": [{"a": "Read the SKILL.md overview's six-step ICFR process", "m": 2, "where": "Anthropic audit-support skill, 'SOX 404 Control Testing Methodology', Overview", "url": "https://skillselion.com/skills/anthropics/knowledge-work-plugins/audit-support", "out": "the six steps named: scoping, risk assessment, control identification, testing, evaluation, reporting", "ans": ["Scoping — decide which accounts and processes are significant enough to test", "Risk assessment — identify what could go wrong in those processes", "Control identification — name the controls meant to address those risks", "Testing — check design and operating effectiveness", "Evaluation — classify any deficiencies found", "Reporting — write up the conclusion"]}, {"a": "Read AS 2201's footnote 2 and paragraph .C2", "m": 2, "where": "PCAOB AS 2201, footnote 2 on the standard's title, and paragraph .C2 in Appendix C", "url": "https://pcaobus.org/oversight/standards/auditing-standards/details/AS2201", "out": "footnote 2 names this standard as the 404(b) attestation standard; .C2 names Section 302, management's certification", "ans": ["AS 2201 is the PCAOB standard for the 404(b) external-auditor attestation on internal control over financial reporting", "Appendix C ties the standard back to Section 302, management's quarterly certification", "Oxus's own work centres on the 404(a) work, management's assessment, which 302 and 404(b) sit around"]}, {"a": "Say the three sections in one sentence each, out loud, no notes", "m": 2, "out": "302 is the CEO/CFO's quarterly certification, 404(a) is management's own annual assessment, 404(b) is the external auditor's attestation on it — Oxus mostly serves the 404(a) work", "ans": "Section 302 is the CEO and CFO's quarterly certification that the financial statements and disclosure controls are accurate. Section 404(a) is management's own annual assessment of internal control over financial reporting. Section 404(b) is the external auditor's attestation on that assessment. Oxus mostly serves the 404(a) work — it helps the internal team build and test the evidence management will certify."}], "sdLinks": [], "read": [], "figs": []}], "quiz": [{"q": "She cuts in three minutes into your happy path with a question about tenancy. What do you do?", "a": "Follow her, and come back to the shape only if she stops. The shape is for when she does not cut in. An interviewer who interrupts is telling you what she cares about."}, {"q": "One sentence: why draw no boxes until requirements are stated?", "a": "Because the requirements decide which part of the system is the hard part, and the hard part is what the design has to be about."}, {"q": "A requirement says every sample must be reproducible from a stored seed. Is that functional or non-functional?", "a": "Non-functional — it is a guarantee about how the system behaves, not one feature it runs. Reproducibility holds across every action rather than describing one of them, which is what makes it non-functional."}, {"q": "One sentence: why does compliance count as non-functional for audit software rather than a checklist item?", "a": "Because it is a guarantee the whole system must satisfy in every case, not a single feature it performs."}, {"q": "The interviewer asks about p99 latency for the ingestion batch pipeline. What do you say?", "a": "Say p99 response time is not the constraint — throughput and cost per page are, since this is batch. This is a batch pipeline, not a live one, so throughput and cost per page are what actually bind."}, {"q": "One sentence: why stream large PDFs rather than seek around inside them?", "a": "Because sequential disk read is cheap and seeking wastes that advantage, especially at OCR-pipeline scale."}, {"q": "Why keep OCR and storage compute inside the tenant's own region rather than centralising it globally?", "a": "Because a cross-region hop costs roughly 300 times a same-region one, an unnecessary tax on every batch job."}, {"q": "A prospective customer says they just need help with the CEO and CFO's quarterly sign-off. Is that squarely Oxus's territory?", "a": "Not really — that is section 302, a different certification from the 404(a) work Oxus mainly serves. 302 is the executives' own certification, distinct from the 404(a) control-testing work the product is built around."}], "hasTrackerQuiz": true, "figs": ["oxusFrame"]}, {"id": "wc5", "name": "Your past work, at grilling depth", "blurb": "She has not probed any of it yet. Expect one system and a lot of how exactly.", "intro": "The intro stayed behavioural, so the experience half of tomorrow is a fresh technical examination. Christine will likely pick one system and keep asking how it works until she finds the edge of what you know. Have the edges prepared.", "len": "1h 15m", "day": "Before the call", "steps": [{"t": "Memory system: two minutes, then the follow-ups", "sd": [{"v": "alfred", "a": "hld", "why": "Your own system, drawn: the stores and paths the follow-ups will probe."}], "d": "Two-minute version from your prep, section F question 1. Then the follow-ups: how candidates are generated for the menu; what an opaque handle actually is; what happens when the right candidate is not in the menu, which should be an abstention rather than a best guess; how the ground-truth audit loop graded briefs against live inboxes. Number to use: fabricated-recall and false-confirmation incidents down eighty percent.", "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/hld", "label": "alfred_, high-level design", "why": "Your own system, drawn: the stores and paths the follow-ups will probe."}], "read": [], "figs": []}, {"t": "Decision layer: why deterministic risk scoring", "sd": [{"v": "email-agent", "a": "deepdives", "why": "Verdicts from deterministic risk scoring, argued as a deep dive."}, {"v": "alfred", "a": "deepdives", "why": "How alfred_ does action safety without a risk score: the contrast to have ready."}], "d": "What the features are, how the five verdicts map to thresholds, and which error is worse — a false silent, where the agent acted and should have asked, or a false confirm, where it asked needlessly. The answer is that false silent is worse because it is a side effect the user did not approve, and the thresholds are tuned asymmetrically for that reason. Then the line from your prep: a model asked to judge itself gives you a plausible explanation, not the actual reason.", "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/email-agent/deepdives", "label": "Email and calendar agent, deep dives", "why": "Verdicts from deterministic risk scoring, argued as a deep dive."}, {"href": "../SYSTEM%20DESIGN.html#/designs/alfred/deepdives", "label": "alfred_, deep dives", "why": "How alfred_ does action safety without a risk score: the contrast to have ready."}], "read": [], "figs": []}, {"t": "Eval harness, reframed for audit", "sd": [{"v": "overview", "a": "pattern-grounding", "why": "Eval gates and shadow runs: the vocabulary to frame the harness in."}], "d": "Use the two-minute bench story from the ZenML critique, and end on completeness: because you own the snapshot, a case can assert that every event in a window appears in the output. That is checking against ground truth you hold, which is exactly what a control test is.", "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding", "label": "Pattern: Grounding and output quality", "why": "Eval gates and shadow runs: the vocabulary to frame the harness in."}], "read": [], "figs": []}, {"t": "MetaRAG, at the depth an AI degree will ask", "d": "Why prefix injection beat blending sparse and dense vectors: the two spaces are not aligned, so a weighted sum mixes incomparable quantities. What NDCG at ten measures and why you reported relative comparisons. How your silver standard is biased, and why relative claims survive that bias while absolute ones would not.", "sdLinks": [], "read": [], "figs": []}, {"t": "Prepare the technical weakness question", "d": "Something like: which system you built are you least satisfied with? A good answer names a real flaw, what it cost, and what you would do now. The eval bench's authoring cost and the lack of a versioned base snapshot is a strong, honest candidate. Use the Answer field.", "sdLinks": [], "read": [], "figs": []}], "study": [{"t": "NDCG at ten, derived", "close": [{"k": "short", "q": "One sentence: what does NDCG divide DCG by, and why?", "a": "By IDCG, the DCG of the ideal ordering, so the score is normalised to between zero and one and comparable across queries."}, {"k": "why", "q": "Why is the rank discount logarithmic rather than linear?", "a": "So a relevant result ranked lower is still penalised, but the penalty shrinks logarithmically rather than punishing every rank drop equally."}, {"k": "word", "q": "What does DCG sum, weighted by a log-of-rank discount?", "a": "Relevance."}, {"k": "blank", "q": "NDCG normalises against the ___ ordering of the same relevance scores.", "a": "ideal"}, {"k": "pick", "q": "Two queries have different numbers of relevant results, and you want a metric comparable across both. Do you report raw DCG or NDCG?", "o": ["Raw DCG, it is simpler", "NDCG, since normalising by the ideal ordering makes scores comparable across queries with different relevant-result counts", "Neither is comparable across queries"], "a": 1, "why": "That normalisation is exactly why NDCG, not raw DCG, is the metric used to compare across queries."}], "say": "Discounted cumulative gain sums relevance with a logarithmic discount by rank, then normalises by the ideal ordering. Be able to write it and explain why rank position is discounted.", "res": [{"label": "Wikipedia, discounted cumulative gain", "url": "https://en.wikipedia.org/wiki/Discounted_cumulative_gain"}], "do": [{"a": "Write DCG_p and NDCG_p from memory, on paper", "m": 3, "out": "both formulas on paper, unaided", "ans": "DCG at p is the sum over the top p results of relevance at rank i divided by log base two of i plus one, summed from i equals one to p. NDCG at p is DCG at p divided by IDCG at p, where IDCG is the DCG of the ideal ordering, the same relevance scores sorted from most to least relevant. Dividing by that ideal value normalises the score to between zero and one, so it is comparable across queries with different numbers of relevant results."}, {"a": "Check against Wikipedia, then say aloud why the discount is logarithmic", "m": 3, "where": "Wikipedia, 'Discounted cumulative gain', the Discounted Cumulative Gain and Normalized DCG sections", "url": "https://en.wikipedia.org/wiki/Discounted_cumulative_gain", "out": "one sentence: a relevant result ranked lower is penalised, and the penalty shrinks logarithmically rather than linearly", "skip": "the history subsection and everything below Normalized DCG", "ans": "A relevant result ranked lower should count for less, because a user is less likely to see it — but the penalty shrinks logarithmically rather than linearly, so the gap between rank 1 and rank 2 costs far more than the gap between rank 20 and rank 21. That matches how attention actually drops off down a results list."}], "sdLinks": [], "read": [], "figs": []}, {"t": "Bi-encoders against cross-encoders", "close": [{"k": "word", "q": "Which architecture reads query and document together rather than separately?", "a": "Cross-encoder."}, {"k": "blank", "q": "A bi-encoder is fast and ___, because it embeds separately in advance.", "a": "indexable"}, {"k": "pick", "q": "You need to judge fifty reranked candidates for your silver standard, not the whole corpus. Which architecture do you use?", "o": ["Bi-encoder, since it is already indexed", "Cross-encoder, since joint attention over query and chunk catches interaction a dot product misses, and fifty candidates is cheap enough", "Neither — use exact lexical match only"], "a": 1, "why": "A cross-encoder is too slow for the whole corpus but exactly right for a short reranked list, which is why it made the stronger judge."}, {"k": "short", "q": "One sentence: why did a cross-encoder make a stronger judge for your silver standard than a bi-encoder?", "a": "Joint attention over query and chunk catches interactions a dot-product comparison misses, and judging is cheap enough over a short list to afford it."}, {"k": "word", "q": "What does a bi-encoder trade away for its speed?", "a": "The joint-attention accuracy a cross-encoder gets from reading query and document together."}], "say": "A bi-encoder embeds query and document separately, which is fast and indexable. A cross-encoder reads them together, which is slower and more accurate. That is why a cross-encoder made a stronger judge for your silver standard.", "res": [{"label": "Sentence-Transformers docs", "url": "https://www.sbert.net"}], "do": [{"a": "Reread the cross-encoder paragraph in your own MetaRAG notes", "m": 2, "where": "E:/_Resume-Curator/job_search/profile/METARAG.md, section 3.1, the paragraph starting 'Why a cross-encoder rather than the bi-encoder used for retrieval'", "ans": "A bi-encoder embeds query and document separately and compares vectors, which is fast — that speed is why it is used for retrieval. A cross-encoder jointly encodes query and chunk in one forward pass, so attention runs across both and it catches fine-grained interaction a dot product misses. Too slow for a whole corpus, fine over fifty candidates — which is why a cross-encoder, a strictly stronger and architecturally different model, made the better silver-standard judge."}, {"a": "Skim the sbert.net tradeoff paragraph, then say in one breath why a cross-encoder made the stronger judge", "m": 3, "where": "Sentence-Transformers docs, 'Cross-Encoder vs. Bi-Encoder', the opening paragraph", "url": "https://www.sbert.net/examples/cross_encoder/applications/README.html", "out": "one breath: joint attention over query and chunk catches interaction a dot product misses, too slow for the whole corpus, fine for fifty candidates", "skip": "the clustering and reranking code examples further down the page", "ans": "Joint attention over the query and the candidate chunk together catches interactions a dot product between two separately computed embeddings misses — that is what makes a cross-encoder the stronger judge. It is too slow to run over a whole corpus, but scoring fifty candidates per query is cheap enough, which is exactly the judge role it played for MetaRAG's silver standard."}], "sdLinks": [], "read": [], "figs": []}, {"t": "Calibrating an LLM judge against humans", "close": [{"k": "order", "q": "Put the calibration loop in order.", "items": ["Iterate the rubric where judge and labels disagree", "Label a sample by hand", "Re-check as the product changes", "Measure agreement between judge and labels"], "a": "Label a sample by hand, measure agreement, iterate the rubric, re-check as the product changes."}, {"k": "word", "q": "Roughly what fraction of your production-failure scanner's flags turned out to be genuine failures?", "a": "Roughly three in four."}, {"k": "short", "q": "One sentence: why re-check the judge's calibration periodically rather than once?", "a": "Because the product itself changes and drifts the distribution of cases the judge sees."}, {"k": "why", "q": "Why measure agreement against hand labels instead of trusting the judge's own confidence score?", "a": "Because a judge's stated confidence is not evidence it agrees with a human; only measured agreement against real labels is."}, {"k": "word", "q": "Name one statistic used to measure judge-versus-human agreement.", "a": "Cohen's kappa (or Kendall's tau, or Spearman's rho)."}], "say": "Label a sample by hand, measure agreement, iterate the rubric, and re-check as the product changes. This is how your scanner's judge reached roughly three in four flags being genuine.", "res": [{"label": "Hamel Husain, LLM-as-a-judge", "url": "https://hamel.dev/blog/posts/llm-judge/"}, {"label": "Eugene Yan, evaluating LLM evaluators", "url": "https://eugeneyan.com/writing/llm-evaluators/"}], "do": [{"a": "Read Hamel Husain's FAQ answer on validating a judge against human labels, nothing else on the page", "m": 2, "where": "hamel.dev, LLM-as-a-judge post, FAQ: 'How do you validate an LLM judge against human labels?'", "url": "https://hamel.dev/blog/posts/llm-judge/", "skip": "Steps 1 through 7 — those build a judge from scratch, not calibrate one you already have", "ans": ["Treat the judge as a binary classifier, with train, dev and test splits that each have enough Pass and Fail examples", "Measure true positive and true negative rate against human labels, not raw agreement — agreement is misleading when failures are rare", "Inspect disagreements, revise the prompt, and never leak dev or test examples into the judge's own prompt"]}, {"a": "Read Eugene Yan's metrics passage, nothing else on the page", "m": 2, "where": "eugeneyan.com, evaluating LLM evaluators, section 'Key considerations before adopting an LLM-evaluator', the passage on Cohen's kappa, Kendall's tau and Spearman's rho", "url": "https://eugeneyan.com/writing/llm-evaluators/", "skip": "the rest of the post — it runs to about fifty minutes; the use-case, prompting and fine-tuning sections are not tonight's question", "ans": ["Cohen's kappa measures agreement on categorical data while correcting for chance agreement, and is the most conservative of the three", "Kendall's tau and Spearman's rho measure agreement between two rankings and run higher because they do not correct for chance", "Use kappa for binary or categorical labels, tau or rho for ordinal ones like a Likert scale — kappa over-penalises ordinal data"]}, {"a": "Say your own calibration loop out loud, ending on the number", "m": 2, "out": "label by hand, measure agreement, iterate the rubric, re-check as the product changes — ending on roughly three in four flags genuine", "ans": "Label a sample by hand, measure agreement between the judge and those labels, iterate the rubric where they disagree, and re-check periodically as the product itself changes and drifts the distribution of cases. That loop is how the production-failure scanner's judge got to the point where roughly three in four of its flags were genuine failures rather than expected behaviour misread as a bug."}], "sdLinks": [], "read": [], "figs": []}, {"t": "Evals when there is no ground truth", "sd": [{"v": "email-agent", "a": "deepdives", "why": "Evaluating an action agent, where no single right answer exists."}, {"v": "coding-agent", "a": "deepdives", "why": "Knowing the agent is good, for runs too long to label by hand."}], "close": [{"k": "word", "q": "In MetaRAG, what stood in for human relevance judgments?", "a": "A cross-encoder-reranked silver standard."}, {"k": "blank", "q": "In production, the eval harness replays real traces against ___ scenarios.", "a": "fixture-driven"}, {"k": "pick", "q": "Someone asks whether your MetaRAG numbers are absolute retrieval quality scores. What do you say?", "o": ["Yes, they are directly comparable to published absolute benchmarks", "No — they are relative comparisons against a proxy ground truth, scoped that way because there is no human annotation behind them", "Yes, but only for the best-performing configuration"], "a": 1, "why": "Every MetaRAG claim was scoped as relative, precisely because the silver standard is a proxy, not real human judgment."}, {"k": "short", "q": "One sentence: what is missing from each of your two eval approaches, and what do you do about it?", "a": "Both lack a labelled ground truth; the response is to build the best proxy available and scope every claim to what that proxy can actually support."}, {"k": "why", "q": "Why start with error analysis on real outputs before building targeted checks?", "a": "Because looking at real traces is what tells you which failure modes actually occur, before you spend effort checking for ones that don't."}], "say": "Error analysis on real outputs first, then targeted checks. Your two versions of this — silver standard in MetaRAG, replay bench in production — are the answer.", "res": [{"label": "Hamel Husain, your AI product needs evals", "url": "https://hamel.dev/blog/posts/evals/"}], "do": [{"a": "Read only the 'Looking At Your Traces' section", "m": 2, "where": "hamel.dev, 'Your AI Product Needs Evals', section 'Looking At Your Traces'", "url": "https://hamel.dev/blog/posts/evals/", "skip": "the rest of the post — the levels framework, RAG and fine-tuning sections are not tonight's question", "ans": ["Remove all friction from looking at the data — build a domain-specific view rather than reading raw JSON", "A lightweight custom tool (Gradio, Streamlit) built in about a day beats a generic trace viewer", "Let a human curate or edit outputs while reviewing, so inspection doubles as labelled data collection"]}, {"a": "Say your own two versions of this out loud", "m": 3, "out": "both named in one breath: the silver standard in MetaRAG, the re  the nine configurations ever entered the ___ pool.", "a": "scoring"}, {"k": "short", "q": "One sentence: what does the retrieval-pool-bias limitation mean for the paper's recall-flavoured metrics?", "a": "They are optimistic in absolute terms, since anything all nine configurations missed is invisible to the evaluation."}, {"k": "why", "q": "Why does that pooling limitation not undermine the paper's comparative claims between configurations?", "a": "Because the same pool bias applies equally to every configuration being compared, so the relative ranking still holds even though absolute numbers don't."}], "say": "Re-read the method and limitations sections tonight. An AI-degree interviewer will ask about the parts you wrote least recently.", "res": [{"book": "MetaRAG, IEEE CAI 2026 — your own paper"}], "do": [{"a": "Reread the system and its three pipelines", "m": 2, "where": "E:/_Resume-Curator/job_search/profile/METARAG.md, sections 1.5 and 1.6 — the part of your own paper you describe least often", "ans": ["Offline indexing: chunk three ways, generate structured metadata with an LLM, fold it in three ways, embed — nine indices total", "Online retrieval: vector similarity search to top-K, then a generator answers from the retrieved chunks", "Evaluation: a cross-encoder reranks and thresholds to produce silver-standard labels, scored with Hit Rate, MRR, NDCG and Precision at 10", "Full index build for all nine configurations runs in about 7.4 seconds"]}, {"a": "Reread what the paper does not claim", "m": 3, "where": "E:/_Resume-Curator/job_search/profile/METARAG.md, section 2.4, all five bullets", "ans": ["No human-annotated ground truth — labels are silver-standard, from cross-encoder reranking", "Retrieval-pool bias — only chunks at least one configuration surfaced were ever scored", "Single domain — AWS documentation only, not shown to generalise", "Generation-quality results are exploratory, not a benchmark", "No production deployment claim — only retrieval latency on a 100-query evaluation set"]}, {"a": "Say the three stated contributions and the retrieval-pool-bias limitation out loud, cold", "m": 3, "out": "three contributions plus one limitation, spoken without the file open", "ans": "First, a reproducible metadata enrichment pipeline that generates structured annotations for document chunks and integrates them through TF-IDF weighting and prefix-fusion embedding. Second, a controlled three-by-three factorial evaluation isolating the individual and interaction effects of chunking strategy and metadata integration, including an ablation of which metadata category contributes what. Third, a practitioner configuration framework grounded in statistically validated benchmarks, Bonferroni-corrected paired t-tests and bootstrap confidence intervals, for picking chunking and embedding pairings by objective. The limitation: only chunks retrieved by at least one of the nine configurations ever entered the scoring pool, so anything all nine configurations missed is invisible to the evaluation, and recall-flavoured metrics are optimistic in absolute terms."}], "sdLinks": [], "read": [], "figs": []}], "quiz": [{"q": "One sentence: what does NDCG divide DCG by, and why?", "a": "By IDCG, the DCG of the ideal ordering, so the score is normalised to between zero and one and comparable across queries."}, {"q": "Why is the rank discount logarithmic rather than linear?", "a": "So a relevant result ranked lower is still penalised, but the penalty shrinks logarithmically rather than punishing every rank drop equally."}, {"q": "You need to judge fifty reranked candidates for your silver standard, not the whole corpus. Which architecture do you use?", "a": "Cross-encoder, since joint attention over query and chunk catches interaction a dot product misses, and fifty candidates is cheap enough. A cross-encoder is too slow for the whole corpus but exactly right for a short reranked list, which is why it made the stronger judge."}, {"q": "One se <script>

(function () {

  /* ---------------------------------------------------------------- storage */

    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {

  /* The tracker's own progress, shared because both pages are served from the same address.

  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }

      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {

    d.appendChild(sm); d.appendChild(body);

  }
  function bulk(host) {

  function prepRef(r) { return r.indexOf("#/") === 0 ? r : link("prep", r.replace(/^#/, "")); }

  /* ---------------------------------------------------------------- tabs */

    { id: "rounds", label: "Rounds", show: function () { return (LOOP.rounds || []).length; } },
    { id: "research", label: "Research", show: function () { return !!LOOP.research; } },
    { id: "design", label: "Design", show: function () { return LOOP.tables.length || LOOP.figures.length; } },
    { id: "own", label: (LOOP.own && LOOP.own.tab) || "Yours", show: function () { return !!LOOP.own; } },

  ].filter(function (t) { return t.show() && (!LOOP.tabs || LOOP.tabs.indexOf(t.id) >= 0); });
  var main = document.getElementById("main");

  function heading(host, id, kicker, title, sub) {

  }

  /* ---------------------------------------------------------------- overview

  function tabOverview(host) {
    var s = el("section", "block"); s.id = "brief";
    s.appendChild(el("h1", "", esc(LOOP.title)));

    s.appendChild(el("p", "lead", esc(LOOP.format)));
    var P = LOOP.posting;
    var dl = el("dl", "facts");
    dl.innerHTML = "<dt>When</dt><dd>" + esc(LOOP.when) + "</dd><dt>Who</dt><dd>" + esc(LOOP.who) + "</dd>" +
      (P && P.url ? '<dt>Posting</dt><dd><a href="' + esc(P.url) + '" target="_blank" rel="noopener">' + esc(P.label || "The job description") + "</a></dd>" : "");
    s.appendChild(dl);

    onePage(host);

    }

  /* ---------------------------------------------------------------- learn: one path, judged
     LOOP.learn = { lead, onepage, modules: [{ id, title, blurb, sessions, table?, topics: [{ id, title,
     brief, points, figs, production, read, mcq, open, say, avoid, was }] }] }. A private module
     (window.LOOP_PRIVATE[loop id].modules) is appended when present. Each topic opens to four
     steps: Learn, Check (multiple choice, with I don't know and a guess flag), Explain (an open
     question, then the model answer and a self-rating), Say (shut until Explain is tried).
     A topic's level (Know, Partly, Not yet) comes from its latest answers and the rating. */
  var LEARN_KEY = "loop.learn.v1";
  function learnStore() {
    try { var all = JSON.parse(localStorage.getItem(LEARN_KEY) || "{}"); return all[LOOP.id] || { mcq: {}, rate: {}, tried: {} }; }
    catch (err) { console.error("Could not read learning progress", err); return { mcq: {}, rate: {}, tried: {} }; }
  }
  function learnSave(st) {
    try { var all = JSON.parse(localStorage.getItem(LEARN_KEY) || "{}"); all[LOOP.id] = st; localStorage.setItem(LEARN_KEY, JSON.stringify(all)); }
    catch (err) { console.error("Could not save learning progress", err); }
  }
  function learnModules() {
    var mods = ((LOOP.learn && LOOP.learn.modules) || []).slice();

  function allTopics() {

  var LEVELS = { know: "Know", partly: "Partly", notyet: "Not yet" };

    if (!rate && s === 1 && n === all) { return "know"; }
    return "partly";

  function levelDot(lv) { return '<span class="lv lv-' + (lv || "none") + '" title="' + (lv ? LEVELS[lv] : "Not judged yet") + '"></span>'; }

  /* one multiple-choice question; done(record) after the answer is shown */
  function mcqCard(host, t, i, done) {
    var q = t.mcq[i], st = learnStore(), key = t.id + ":" + i;

    var opts = el("div", "mq-opts"), guess = el("label", "mq-guess"), cb = el("input");
    cb.type = "checkbox"; guess.appendChild(cb); guess.appendChild(document.createTextNode(" I'm guessing"));
    var after = el("div", "mq-after");

  function learnBody(t, refresh) {

    pts.forEach(function (q) {
      var m = /^([^:]{2,60}):\s+([\s\S]+)$/.exec(String(q));
      ul.appendChild(el("li", "", m ? "<b>" + inl(m[1]) + "</b> " + inl(m[2]) : inl(q)));
    });
    return ul;
  }
  function stepNode(key, it, isStudy) {
    var t = tracker();
    var row = el("details", "step");
    row.setAttribute("name", "step");
    row.addEventListener("toggle", function () { if (row.open) { glideTo(row); } });
    var sm = el("summary");
    var tick = el("button", "tick" + (t.steps[key] ? " on" : ""), t.steps[key] ? "&#10003;" : "");
    tick.setAttribute("aria-label", "Mark done: " + it.t);
    tick.addEventListener("click", function (e) {
      e.preventDefault(); e.stopPropagation();
      var tt = tracker();
      if (tt.steps[key]) { delete tt.steps[key]; delete tt.steps[key + ":at"]; }
      else { tt.steps[key] = true; tt.steps[key + ":at"] = stamp(); }
      writeJSON(TRACKER, tt);
      tick.classList.toggle("on", !!tt.steps[key]);
      tick.innerHTML = tt.steps[key] ? "&#10003;" : "";
      progress();
    });
    sm.appendChild(tick);
    sm.appendChild(el("span", "st", inl(it.t)));
    var mins = it.m || (it.do || []).reduce(function (a, d) { return a + (d.m || 0); }, 0);
    sm.appendChild(el("span", "sm", mins ? mins + " min" : ""));
    row.appendChild(sm);

    var body = el("div", "cv-cols pq-cols sbody2"), left = el("div", "cv-col cv-said"), work = el("div", "pq-work");
    body.appendChild(left); body.appendChild(work);
    if (!isStudy && it.d) { left.appendChild(el("p", "d", inl(it.d))); }
    if (it.pts && it.pts.length) { left.appendChild(ptsList(it.pts)); }
    learn(left, { figs: it.figs || [] });

    var pre = [];
    if (isStudy && it.do) {
      it.do.forEach(function (d) {
        pre.push({ url: d.url, label: d.a, m: d.m, why: d.where });
      });
    }
    if (!isStudy && (it.where || it.url)) { pre.push(it.url ? { url: it.url, label: it.where || it.url } : { book: it.where }); }
    learn(left, { figs: [], read: pre.concat(isStudy ? (it.res || []) : (it.links || []), it.read || []), sdLinks: it.sdLinks });
    var say = isStudy ? it.say : it.ans;
    if (say || it.out || SAYS.test(it.t || "")) { work.appendChild(mineBox(key, promptOf(it))); }
    if (say) { work.appendChild(sayToggle(isStudy ? "The idea, in the words you would use" : "What you would say", transcript(Array.isArray(say) ? say : [say], "", ""))); }
    if (!work.children.length) { work.remove(); body.classList.add("one"); }
    row.appendChild(body);
    return row;
  }

  function toggleSession(x) {
    var t = tracker();
    if (t.done[x.id]) {
      delete t.done[x.id];
    } else {
      stepKeys(x).forEach(function (k) { if (!t.steps[k]) { t.steps[k] = true; t.steps[k + ":at"] = stamp(); } });
      if (x.hasTrackerQuiz && !(t.quiz[x.id] && t.quiz[x.id].passed)) {
        t.quiz[x.id] = { score: 0, passed: true, at: stamp(), missed: [], via: "interview page" };
      }
      t.done[x.id] = stamp();
    }
    writeJSON(TRACKER, t);
    route();
  }

  /* ---------------------------------------------------------------- mocks */
  /* A mock reads in two parts: the read (how it went, what landed, what to fix first),
     then the conversation, one exchange at a time. Each exchange shows who asked what and
     what you said, with a verdict; it opens to why, how to approach it, and the answer to
     say, behind the same toggle the Prep tab uses. */
  var VERDICT = { landed: "Landed", partly: "Partly", missed: "Missed", gap: "Gap: you did not have an answer" };
  function tabMocks(host) {
    var s = heading(host, "mock", "Run in chat", "Mock interviews");
    s.appendChild(el("p", "lead", inl(LOOP.mockHow)));
    if (!LOOP.mocks.length) {
      s.appendChild(el("p", "when", "None yet. After a mock in chat, its read and its exchanges appear here. The latest two are kept."));
    }
    LOOP.mocks.slice(-2).reverse().forEach(function (m, mi) { drawMock(host, m, mi); });
  }
  function drawMock(host, m, mi) {
    var pre = m.id || "m" + mi;
    var s = heading(host, pre, m.when, m.title);
    var ex = m.exchanges || [];
    if (!ex.length && m.critique) { s.appendChild(el("p", "", inl(m.critique))); return; }
    var tally = {};
    ex.forEach(function (x) { tally[x.verdict] = (tally[x.verdict] || 0) + 1; });
    s.appendChild(el("p", "mk-tally", ["landed", "partly", "missed", "gap"].filter(function (k) { return tally[k]; })
      .map(function (k) { return '<span class="vd vd-' + k + '"></span>' + tally[k] + " " + (k === "gap" ? "gaps" : k); }).join('<span class="sep"></span>') +
      '<span class="sep"></span>' + ex.length + " exchanges"));
    (m.read || []).forEach(function (p) { s.appendChild(el("p", "mk-read", inl(p))); });
    if (m.landed && m.landed.length) {
      s.appendChild(el("h3", "mk-h", "What landed"));
      var ul = el("ul", "mk-list");
      m.landed.forEach(function (t) { ul.appendChild(el("li", "", inl(t))); });
      s.appendChild(ul);
    }
    if (m.fix && m.fix.length) {
      s.appendChild(el("h3", "mk-h", "Fix these first"));
      var ol = el("ol", "mk-list mk-fix");
      m.fix.forEach(function (f) {
        var li = el("li", "", inl(f.t) + " ");
        var at = ex.findIndex(function (x) { return x.id === f.ref; });
        if (at >= 0) { li.appendChild(openLink("See turn " + (at + 1), m, at)); }
        ol.appendChild(li);
      });
      s.appendChild(ol);
    }
    /* The turns, one line each; the conversation itself opens in one screen. */
    var c = heading(host, pre + "-talk", "Every turn, in one screen", "The conversation");
    var go = el("button", "btn primary", "Open the conversation");
    go.addEventListener("click", function () { openConvo(m, 0); });
    c.appendChild(el("div", "acts")).appendChild(go);
    var list = el("ol", "turns");
    ex.forEach(function (x, i) {
      var li = el("li");
      var b = el("button", "turn");
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) +
        '</span><span class="tw spk-' + esc((x.who || "").toLowerCase()) + '">' + esc(x.who) + "</span>";
      b.addEventListener("click", function () { openConvo(m, i); });
      li.appendChild(b); list.appendChild(li);
    });
    c.appendChild(list);
  }
  function openLink(text, m, i) {
    var a = el("button", "linkish", esc(text));
    a.addEventListener("click", function () { openConvo(m, i); });
    return a;
  }

  /* One screen, shared by mocks and the Prep banks: a list on the left, the chosen item on
     the right. The item's header is small; under it, the light column is for understanding
     and the dark sheet is what to say, each scrolling on its own. Arrows move; Escape closes. */
  var convo = document.getElementById("convo");
  function panelSection(host, label, nodes) {
    if (!nodes.length) { return; }
    host.appendChild(el("div", "lab", label));
    nodes.forEach(function (n) { host.appendChild(n); });
  }
  function panelList(items, cls) {
    if (!items || !items.length) { return []; }
    var u = el("ul", "mk-list " + (cls || ""));
    items.forEach(function (t) { u.appendChild(el("li", "", inl(t))); });
    return [u];
  }
  /* o: { title, sub, label, count, row(i) -> html for the rail, draw(i, pane), start } */
  function openPanel(o) {
    var cur = o.start || 0;
    convo.innerHTML = "";
    convo.setAttribute("aria-label", o.label || o.title);
    var shell = el("div", "cv");
    var rail = el("nav", "cv-rail");
    rail.appendChild(el("div", "cv-title", "<b>" + esc(o.title) + "</b>" + (o.sub ? "<span>" + esc(o.sub) + "</span>" : "")));
    var rows = [];
    for (var i = 0; i < o.count; i++) {
      (function (i) {
        var b = el("button", "turn");
        b.innerHTML = o.row(i);
        b.addEventListener("click", function () { show(i); });
        rail.appendChild(b);
        rows.push(b);
      }(i));
    }
    rail.appendChild(el("div", "cv-keys", "Up and down arrows move. Escape closes."));
    var pane = el("section", "cv-pane");
    var close = el("button", "cv-close", "Close");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", function () { convo.close(); });
    shell.appendChild(rail); shell.appendChild(pane);
    convo.appendChild(close); convo.appendChild(shell);
    function show(i) {
      cur = i;
      rows.forEach(function (b, j) { b.classList.toggle("on", j === i); if (j === i) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); } });
      rows[i].scrollIntoView({ block: "nearest" });
      pane.innerHTML = "";
      o.draw(i, pane, function () { rows[i].innerHTML = o.row(i); });
      [].forEach.call(pane.querySelectorAll(".cv-col"), function (c) { c.scrollTop = 0; });
    }
    convo.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = cur + (e.key === "ArrowDown" ? 1 : -1);
        if (n >= 0 && n < o.count) { show(n); rows[n].focus(); }
      }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    rows[cur].focus();
  }
  function panelCols(pane, leftTitle, rightTitle) {
    var cols = el("div", "cv-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "cv-col cv-say");
    left.appendChild(el("h3", "cv-h", leftTitle));
    right.appendChild(el("h3", "cv-h", rightTitle));
    cols.appendChild(left); cols.appendChild(right);
    pane.appendChild(cols);
    return { left: left, right: right, cols: cols };
  }

  /* A mock: what they asked and how it landed; what you said; what to say. */
  function openConvo(m, start) {
    var ex = m.exchanges;
    openPanel({
      title: m.title, sub: m.when, label: "Mock conversation", count: ex.length, start: start,
      row: function (i) {
        var x = ex[i];
        return '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) + "</span>";
      },
      draw: function (i, pane) {
        var x = ex[i], who = (x.who || "").toLowerCase();
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q spk-" + who, '<span class="ex-who">Turn ' + (i + 1) + " of " + ex.length + ", " + esc(x.who) + "</span>" + inl(x.q)));
        head.appendChild(el("p", "cv-verdict", '<span class="vd vd-' + esc(x.verdict) + '"></span><b>' + esc(VERDICT[x.verdict] || x.verdict) + ".</b> " + inl(x.why || "")));
        if (x.tests) { head.appendChild(el("p", "cv-tests", "<b>They were testing:</b> " + inl(x.tests))); }
        pane.appendChild(head);
        var c = panelCols(pane, "What you said", "What to say");
        panelSection(c.left, "In short", (x.said || []).map(function (p) { return el("p", "ex-said", inl(p)); }));
        panelSection(c.left, "What worked", panelList(x.good, "mk-good"));
        panelSection(c.left, "What did not", panelList(x.bad, "mk-bad"));
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.say && x.say.length) { c.right.appendChild(transcript(x.say, "You", "")); }
        panelSection(c.right, "How to approach it", panelList(x.approach));
        (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.right.appendChild(f); } });
        var links = [];
        if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
        if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
        if (links.length) { c.right.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      }
    });
  }

  /* A Prep question can be marked revised; the mark is kept in this page's storage. */
  function isRevised(id) { return !!own().rev[id]; }
  function setRevised(id, on) {
    var o = own();
    if (on) { o.rev[id] = stamp(); } else { delete o.rev[id]; }
    writeJSON(OWN, o);
  }
  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    if (tab === "overview" && p[0] && p[0] !== "overview" && LOOP.learn && p[1]) {
      var to = null;
      learnModules().forEach(function (m) { m.topics.forEach(function (t) { if ((t.was || []).indexOf(p[1]) >= 0 || t.id === p[1]) { to = t.id; } }); });
      if (to) { history.replaceState(null, "", link("learn", to)); return { tab: "learn", anchor: to }; }
    }
    return { tab: tab, anchor: p[1] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = link(t.id);
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = [];
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "rounds") { tabRounds(main); }
      else if (r.tab === "research") { tabResearch(main); }
      else if (r.tab === "learn") { tabLearn(main); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "mocks") { tabMocks(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    drawTabs(r.tab); drawSide(r.tab); progress();
    var key = r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var c = document.getElementById("count");
    if (!LOOP.when_iso) { c.textContent = "Date to be set"; return; }
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
</html>
