  max-height: calc(100vh - var(--top) - var(--s6)); overflow-y: auto; }

main { min-width: 0; max-width: 760px; padding-top: var(--s6); }
main p, main ul, main ol, main dl { max-width: var(--measure); }

section.block { margin-bottom: var(--s7); }
h1 { font-size: var(--fs-2xl); margin-bottom: var(--s3); }
h2 { font-size: var(--fs-xl); margin-bottom: var(--s4); }
h3 { font-size: var(--fs-lg); margin-bottom: var(--s1); }
h4 { font-size: var(--fs-md); margin-bottom: var(--s1); }
/* the line under a heading: small, muted, sentence case */
.hsub { font-size: var(--fs-sm); color: var(--muted); margin: calc(-1 * var(--s3)) 0 var(--s4); }
h1 + .hsub { margin-top: calc(-1 * var(--s2)); }
.lead { color: var(--soft); margin: var(--s3) 0 0; }
.facts { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: var(--s1) var(--s4); margin: var(--s4) 0 0; }

/* the plan: a plain list */
.day { margin-bottom: var(--s5); }
.day h3 { font-size: var(--fs-sm); font-weight: var(--w-regular); color: var(--muted); margin-bottom: var(--s1); }
.srow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: var(--s3); align-items: baseline; padding: var(--s2) 0; border-bottom: var(--hair); color: var(--ink); }
.srow:hover { text-decoration: none; }

.srow .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); display: inline-block; }
.srow.done .dot { background: var(--ok); border-color: var(--ok); }

.meta { font-size: var(--fs-sm); color: var(--muted); margin: 0 0 var(--s3); }

.filter:focus { outline: none; border-bottom-color: var(--accent); }
.ask, .trap { padding: var(--s3) 0; border-bottom: var(--hair); }
.ask .to { display: block; font-size: var(--fs-sm); color: var(--muted); }
.trap b { display: block; font-weight: var(--w-strong); }
.trap span { color: var(--soft); }

/* folding rows: a hairline between them, a small chevron at the right */
details.item { border-bottom: var(--hair); }
details.item > summary, details.fold > summary, .step > summary { list-style: none; cursor: pointer; position: relative; }

.bulk { display: flex; gap: var(--s4); margin: 0 0 var(--s2); font-size: var(--fs-sm); }
.bulk button { background: none; border: 0; padding: 0; color: var(--accent); }

/* buttons: small and plain; the primary one takes the accent */
.acts { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s4); align-items: center; }
.btn { display: inline-block; border: var(--hair); background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: var(--s1) var(--s3); }
.btn:hover { border-color: var(--muted); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { opacity: .9; }

/* practise aloud */
.drill-body .t { font-size: var(--fs-sm); color: var(--muted); }
.timer { font-family: var(--mono); font-size: var(--fs-code); color: var(--muted); margin-left: auto; }
.timer.over { color: var(--warn); }
textarea { width: 100%; min-height: 120px; font: inherit; padding: var(--s2) var(--s3); border: var(--hair); border-radius: var(--radius); background: var(--surface); color: var(--ink); resize: vertical; margin-top: var(--s3); }

.attempts .at { padding: var(--s1) 0 var(--s1) var(--s3); border-left: 2px solid var(--rule); margin: var(--s2) 0; white-space: pre-wrap; color: var(--soft); }

.vd { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--muted); }
.vd-landed { background: var(--ok); } .vd-partly { background: var(--cat-5); }

.vd-open { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
.sep { display: inline-block; width: 1px; height: 12px; background: var(--rule); margin: 0 var(--s3); vertical-align: -1px; }
.mk-tally { font-size: var(--fs-sm); color: var(--soft); margin: 0 0 var(--s4); }
.mk-h { font-size: var(--fs-md); margin: var(--s5) 0 var(--s2); }
.mk-list { margin: 0; padding-left: var(--s5); }
.mk-list li { margin: 0 0 var(--s2); padding-left: var(--s1); }
.mk-list a, .mk-list .linkish { margin-left: var(--s2); white-space: nowrap; }

.showup { margin: 0; padding-left: var(--s5); }

.fold-body { padding: 0 0 var(--s5); }
.c3 { margin: var(--s1) 0 var(--s6); }
.c3-t { font-size: var(--fs-lg); margin: var(--s4) 0 var(--s1); }

.c3-q .q { display: block; font-weight: var(--w-strong); margin: 2px 0 var(--s1); }
.c3-q .lp, .c3-q .wy { display: block; font-size: var(--fs-sm); color: var(--soft); }

.hit:hover { color: var(--accent); }

/* the turn list: one row per turn, on the page and in the panel's rail */
main .turns { list-style: none; margin: var(--s4) 0 0; padding: 0; border-top: var(--hair); max-width: none; }

/* the one-screen panel, shared by mocks and the Prep banks: the list on the left; the item's
   header; then understanding on the page and what to say on a sunken tint, each scrolling on its own */
dialog.convo { width: min(1320px, 96vw); height: min(880px, 92vh); max-width: none; max-height: none; overflow: hidden; }
.cv { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100%; }

.cv-rail .turn .tw { display: none; }
.cv-rail .turn.on { background: var(--accent-soft); }
.cv-rail .turn.on .tl { font-weight: var(--w-strong); }
.cv-keys { margin-top: auto; padding: var(--s3) var(--s2) 0; font-size: var(--fs-xs); color: var(--muted); }

.cv-pane { display: flex; flex-direction: column; min-height: 0; }
.cv-head { padding: var(--s4) 96px var(--s3) var(--s5); border-bottom: var(--hair); flex: none; }
.cv-verdict { margin: var(--s2) 0 0 var(--s4); font-size: var(--fs-sm); color: var(--soft); }
.cv-verdict b { color: var(--ink); font-weight: var(--w-strong); }
.cv-tests { margin: var(--s1) 0 0 var(--s4); font-size: var(--fs-sm); color: var(--muted); }
.cv-tests b { color: var(--soft); font-weight: var(--w-strong); }
.cv-cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--s2); flex: 1; min-height: 0; padding: 0 var(--s4) var(--s4) 0; }
.cv-cols.has-code { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.cv-col { overflow-y: auto; padding: var(--s4) var(--s5) var(--s6); scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.cv-col.cv-say { scrollbar-color: var(--muted) transparent; }
.cv-h { font-size: var(--fs-md); margin: 0 0 var(--s3); }
.cv-col .lab, .sbody .lab { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); margin: var(--s4) 0 var(--s1); }
.cv-part { font-size: var(--fs-md); margin: var(--s5) 0 var(--s1); padding-top: var(--s3); border-top: var(--hair); }
.cv-part-lead { color: var(--soft); margin: 0 0 var(--s1); }
.cv-code { margin: var(--s2) 0 var(--s3); padding: var(--s3); background: var(--code-bg); border-radius: var(--radius); overflow-x: auto;
  font-family: var(--mono); font-size: var(--fs-code); line-height: 1.6; color: var(--code-ink); white-space: pre; }
.cv-code code { background: none; padding: 0; font-size: inherit; color: inherit; }
/* what to say: the one inverse sheet on the screen (dark on the light theme), so the words to
   say never read like the notes beside them. Its labels are the sheet's own ink, dimmed. */
.cv-say { background: var(--ink); color: var(--bg); border-radius: var(--radius-lg); margin-top: var(--s4); }
.cv-say .cv-h, .cv-say .lab, .cv-say .transcript .who, .swap .sw-when, .cv-meta { color: inherit; opacity: .72; }
.cv-say a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
.cv-say .sep { background: var(--muted); }
.cv-say .mk-list li::marker { color: var(--muted); }
.cv-land { margin: 0 0 var(--s4); padding: 0 0 var(--s3); border-bottom: 1px solid var(--muted); }
.cv-land b { font-weight: var(--w-strong); }
.cv-say .transcript { background: transparent; color: inherit; border-radius: 0; margin: 0; padding: 0; max-width: none; }
.cv-say code { background: var(--code-bg); color: var(--code-ink); }
.swap { margin: 0 0 var(--s3); padding-left: var(--s3); border-left: 2px solid var(--muted); }

.swap .sw-line { display: block; }
.cv-meta { margin: var(--s4) 0 0; font-size: var(--fs-xs); }
.cv-rev { font-size: var(--fs-sm); }
.cv-said .reading a { color: var(--ink); }
.cv-col figure { padding: var(--s3); margin: var(--s4) 0 0; }
.cv-col figure svg { min-width: 0; }
.cv-close { position: absolute; top: var(--s3); right: var(--s4); z-index: 2; background: var(--surface); border: var(--hair); color: var(--soft);
  border-radius: var(--radius); padding: 2px var(--s3); font-size: var(--fs-sm); }
.cv-close:hover { color: var(--ink); border-color: var(--muted); }
@media (max-width: 860px) {
  dialog.convo { width: 100vw; height: 100vh; border-radius: 0; }
  .cv { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .cv-rail { max-height: 28vh; border-right: 0; border-bottom: var(--hair); }
  .cv-title { padding-right: 72px; }
  .cv-cols { grid-template-columns: minmax(0, 1fr); overflow-y: auto; padding: 0 var(--s3) var(--s3); }
  .cv-col { overflow: visible; }
  .cv-head { padding: var(--s3) 80px var(--s3) var(--s4); }
}

/* figures are drawn for a light ground, so they sit on the light surface on every theme
   (the light tokens' values: surface, ink, muted, rule) */
figure { margin: var(--s5) 0 var(--s6); padding: var(--s4); background: #FFFDF8; color: #1D1B17; border: 1px solid #E5DDCD; border-radius: var(--radius-lg); overflow-x: auto; }
figure svg { display: block; width: 100%; height: auto; min-width: 620px; }
figcaption { font-size: var(--fs-sm); color: #736D62; margin-top: var(--s3); }
figure .fh { font-weight: var(--w-strong); font-size: var(--fs-sm); margin-bottom: var(--s2); }
/* the tracker's own figures, drawn with its classes */
figure.trk { --faint: #a2a09a; --dim: #6b6a65; --line: #c3c0b7; --ink: #1a1a19; --live: #fffdf5; }
table { width: 100%; border-collapse: collapse; margin: var(--s1) 0; font-size: var(--fs-sm); }
th, td { text-align: left; padding: var(--s2) var(--s3) var(--s2) 0; border-bottom: var(--hair); vertical-align: top; }
th { font-weight: var(--w-strong); color: var(--muted); font-size: var(--fs-xs); }
td:first-child { font-weight: var(--w-strong); }
.tnote { font-size: var(--fs-sm); color: var(--muted); margin: var(--s2) 0 var(--s6); }

/* sessions */
.session .meta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); margin-top: calc(-1 * var(--s3)); }
.chip { color: var(--muted); }
.chip.done { color: var(--ok); }
.session .intro { color: var(--soft); margin: var(--s3) 0; }
.session > h3 { margin: var(--s6) 0 var(--s2); }
.step { border-top: var(--hair); }
.step > summary { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: var(--s3); align-items: start; padding: var(--s3) var(--s6) var(--s3) 0; }
.step > summary .st { font-weight: var(--w-strong); }
.step > summary:hover .st { color: var(--accent); }
.step > summary .sm { color: var(--muted); font-size: var(--fs-sm); padding-top: 2px; white-space: nowrap; }
.tick { width: 18px; height: 18px; border-radius: var(--radius-sm); border: 1.5px solid var(--muted); background: transparent; color: var(--surface);
  display: grid; place-items: center; font-size: var(--fs-xs); margin-top: 3px; padding: 0; }
.tick.on { background: var(--ok); border-color: var(--ok); }
.sbody { padding: 0 0 var(--s5) 30px; }
.sbody > p.d, .sbody > p.point { margin: 0 0 var(--s1); }
.reading { margin: 0; padding: 0; list-style: none; }
.reading li { margin: 0 0 var(--s2); padding-left: var(--s3); position: relative; }
.reading li::before { content: ""; position: absolute; left: 0; top: .75em; width: 5px; height: 1.5px; background: var(--muted); }
.reading a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.reading a:hover { text-decoration-color: var(--ink); }
.reading .w { color: var(--muted); font-size: var(--fs-sm); margin-left: var(--s2); white-space: nowrap; }
.reading .why { display: block; color: var(--soft); font-size: var(--fs-sm); margin-top: 2px; }
.sbody figure { margin: var(--s4) 0 var(--s2); }
details.say { margin-top: var(--s4); }
details.say > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--accent); }
details.say > summary::-webkit-details-marker { display: none; }
details.say > summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin-top: -3px; }
details.say[open] > summary::after { transform: rotate(-135deg); margin-top: 3px; }
details.say > summary:hover { text-decoration: underline; text-underline-offset: 3px; }
details.item > .sbody { padding-left: 0; }
@media (max-width: 700px) { .sbody { padding-left: 0; } }
.session-end { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-top: var(--s5); }
.pager { display: flex; justify-content: space-between; gap: var(--s4); margin-top: var(--s6); padding-top: var(--s4); border-top: var(--hair); }
.pager a { display: flex; flex-direction: column; color: var(--ink); font-weight: var(--w-strong); max-width: 48%; }
.pager a span { font-weight: var(--w-regular); font-size: var(--fs-sm); color: var(--muted); }
.pager a.next { text-align: right; margin-left: auto; }
.pager a:hover { color: var(--accent); text-decoration: none; }

/* quiz: one question at a time */
.dq { padding: var(--s5) var(--s5) var(--s4); }
.dq .dots { display: flex; gap: var(--s1); margin-bottom: var(--s4); }
.dq .dots i { width: 20px; height: 3px; border-radius: 2px; background: var(--rule); }
.dq .dots i.on { background: var(--accent); }
.dq .dots i.got { background: var(--ok); }
.dq .qq { font-size: var(--fs-lg); font-weight: var(--w-strong); line-height: var(--lh-tight); }
.dq .model { margin-top: var(--s4); padding-left: var(--s3); border-left: 2px solid var(--ok); color: var(--soft); }
.dq .model b { display: block; font-size: var(--fs-sm); color: var(--ok); font-weight: var(--w-strong); }
.dq .row { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s4); align-items: center; }
.dq .row .grow { flex: 1; }
.dq .close { background: none; border: 0; color: var(--muted); font-size: var(--fs-sm); }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 var(--s4) var(--s7); }
  nav.side { display: none; }
  main { padding-top: var(--s5); }
  .top-in { padding: 0 var(--s4); gap: var(--s2); }
  .top .loopname, .prog, .count { display: none; }
  .tabs { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs a { padding: 2px 6px 0; white-space: nowrap; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
@media (prefers-reduced-motion: reduce) { details > summary::after { transition: none; } }

<script type="application/json" id="loop-data">{"id": "mphasis", "title": "Mphasis, technical", "subtitle": "Agentic AI, AI fundamentals, a short coding exercise", "when": "Today, Monday 28 September (time in the invite)", "when_iso": "2026-09-28T14:30:00-04:00", "who": "A technical panel. The invite came from the RPO consultant, copying two others.", "format": "Video on for the whole call, recorded. Personal laptop, not a phone, no headphones, an ID ready. A short coding exercise on a shared screen is likely. They will test agentic skills and may go into how AI works underneath.", "bar": "Say what a thing is in one line, then show it from your own work. Code out loud: brute force first, then better, with the complexity said. Tie agentic answers to alfred_.", "sessions": [], "scripts": [{"id": "intro", "title": "Tell me about yourself", "length": "about 90 seconds", "when": "The opener. In an L1 AI/ML round it sets which of your projects they dig into, so put MetaRAG and alfred_ in it on purpose.", "probes": ["Tell me more about MetaRAG.", "What do you do day to day at alfred_?", "What's your strongest AI/ML work?", "Why Mphasis?"], "say": ["Sure. I started out in computer science research at UIC, where I worked on applied ML and LLM systems. That gave me a pretty strong foundation in actually building and evaluating these systems, rather than just using the models.", "One of those was MetaRAG, a retrieval framework for enterprise knowledge. It ended up running in a production code-translation use case, about ten thousand queries a day, and the paper got accepted at IEEE CAI.", "From there I joined WheelPrice, which was a much more startup-oriented environment. I was working across the stack and got a lot more exposure to shipping things that were actually being used by customers. It was a small engineering team, so I had to be pretty broad — backend, AI, infrastructure, and product work all kind of blended together.", "After that I joined alfred_, where I've been working as a founding LLM engineer. It's an AI assistant, and my work has become much more focused on reliability and evaluation — things like building the eval harness, production failure detection, working memory, and making sure agent changes actually improve the product rather than just looking better on a benchmark.", "The common thread through all of that has really been building AI systems in environments where you don't have a perfectly defined problem in front of you. You have to figure out what's broken, decide what to build, and then own it through production.", "And that's pretty much why Mphasis is interesting to me. Your clients run systems where a wrong answer is expensive, and making AI reliable and checkable on those systems is the work I've been doing, just with bigger stakes."], "swaps": [{"when": "If they cut you short: the one-line arc", "line": "Research on retrieval and multi-agent reasoning, then shipping products at a startup, and now making an agent reliable in production for five thousand users."}, {"when": "If they ask for the numbers on MetaRAG", "line": "82.5% precision against a 73.3% content-only baseline, 0.925 hit rate at ten, and about 25% fewer hallucinations, measured with an automated evaluation framework."}], "land": "Research, then shipping products, then making agents reliable in production; Mphasis is the same problem with bigger stakes.", "notes": ["Changed from your ZenML intro: paragraphs 1, 3, 4 and 5 are your words, unchanged. Paragraph 2 (MetaRAG) is new, because a production code-translation use case is the closest thing you have to Mphasis's core work. The last line now points at Mphasis instead of Kitaru.", "About ninety seconds. Stop after the last line and let them pick where to go; MetaRAG and alfred_ are both baits you are ready for.", "Numbers if they dig: MetaRAG 82.5% precision, 0.925 Hit@10, 25% hallucination reduction, p99 under 300 ms, 10K queries a day, on SageMaker with MLflow. alfred_: 5,000+ active users."], "never": ["Don't say you worked on COBOL or legacy modernization. You worked on code translation retrieval; say exactly that.", "Never mention alfred_'s funding or a crunch."]}, {"id": "why-mphasis", "title": "Why Mphasis?", "length": "about 60 seconds", "when": "Straight after the intro, or at the end. They want to hear you know what they do and why it fits you, not a compliment.", "probes": ["What do you know about us?", "Why a services company and not a product company?", "Have you worked with legacy systems?", "What would you want to work on here?"], "say": ["Honestly, two things. The first is the problems. Your clients are banks, insurers, airlines, with decades of systems underneath. That's where generative AI is hardest to get right, and I think also where it's most useful, because a lot of those systems aren't fully understood by anyone anymore.", "The second is how you're approaching it. What I read about NeoZeta is that it doesn't point an LLM at COBOL and hope. It parses the code deterministically first, builds a knowledge graph of what the system does, and uses the model on top of that. I think that's the right order.", "It's pretty much the lesson I learned at alfred_: let code decide what code can decide, and use the model for the language part. And it's close to my own research, since MetaRAG was retrieval over enterprise knowledge in a code-translation setting.", "So it's a problem I've already touched, in the place where getting it right matters most."], "swaps": [{"when": "If they ask: have you worked with legacy systems?", "line": "Not COBOL, no, and I'd rather be straight about that. What I have done is the pattern around it: retrieval for code translation with MetaRAG, and at alfred_, an agent that has to act on systems it doesn't own, where every action gets checked against what actually happened. COBOL itself I'd learn on the job."}, {"when": "If they ask: why services and not a product company?", "line": "At a startup you go deep on one product. In services you see twenty problems, each with different data and different constraints. I've had the depth; now I want the range, and I want to learn how large clients actually adopt this, the security reviews, the data rules, getting people to trust it."}], "land": "The hardest place to make generative AI reliable, and you're approaching it in the right order: parse first, model second.", "notes": ["New for Mphasis, in your voice. NeoZeta facts are from their own page (in Sources): deterministic parsers plus generative AI relearn legacy code into explainable knowledge. Say 'what I read', not 'I know'.", "The alfred_ line maps to a real design choice: email rules are a deterministic matcher that fires before the model sees the mail, and the executor has no send path."]}, {"id": "why-role", "title": "Why this role? Why AI/ML engineering?", "length": "about 60 seconds", "when": "Why an AI/ML engineer role, and what you would bring to it on day one.", "probes": ["How strong are you on classic ML, not only LLMs?", "What would you do in your first month?", "Have you trained models or only used APIs?"], "say": ["Because it's the work I like most: taking a model and making it do a real job, reliably. At alfred_ that's meant evals, guardrails, memory and cost. In research it was retrieval and multi-agent reasoning, including getting four-billion-parameter models to work as a team at about three times the speed of frontier models.", "In a role like this, I think the value usually isn't picking the fanciest model. It's knowing when RAG is enough, when a small model is enough, how you evaluate it before you trust it, and how you make it auditable for a client. That's where I've spent most of my time.", "And I like the variety. Different clients, different data, different constraints. I think that makes you a better engineer than going deeper into one product."], "swaps": [{"when": "If they ask about classic ML, not only LLMs", "line": "I'm comfortable there too. My master's coursework was advanced ML, NLP and computer vision, and I've trained and deployed models myself, for example an audio inference API I quantized to INT8 and served at 150 milliseconds p95."}, {"when": "If they ask what you'd do in the first month", "line": "Learn one client's system end to end before touching it, find where AI output is being trusted without a check, and put an evaluation set around it. Every later change gets measured against that."}], "land": "The value isn't the fanciest model; it's knowing what's enough, evaluating it, and making it auditable.", "notes": ["New for Mphasis, in your voice. Facts: SLM-TeamMedAgents, 4B small models, 77.63% accuracy across 8 benchmarks, 3.1x inference speedup against frontier LLMs; audio API at 150 ms p95 via INT8.", "'L1' is the first technical round, so expect this to lead into fundamentals. The AI fundamentals bank is the follow-on."]}, {"id": "leave", "title": "Why are you looking to leave alfred_?", "length": "about 45 seconds", "when": "You are exploring while employed. Make that clear without sounding defensive.", "probes": ["Is something wrong at alfred_?", "You've only been there since April. Why move so soon?", "Will you leave us quickly too?", "Is this about compensation or visa?"], "say": ["There's nothing particularly wrong with alfred_. I've actually learned a lot there and I still enjoy the work.", "I'm mostly looking at what I want the next few years of my career to look like. At alfred_, I've had a lot of ownership because it's a small team, and that's been great. But the work is ultimately internal to one product.", "What I'm increasingly interested in is range: taking what I've learned about making agents reliable and applying it across many problems and many clients, on systems that matter. That's the part a company like Mphasis gives me that one product can't.", "So it's less “I need to get away from Alfred” and more “I've found a direction I want to go deeper into.”"], "swaps": [{"when": "If they ask bluntly: why not just stay?", "line": "I could. And that's why I'm being selective about what I talk to. I'm not looking to leave just to change companies. It has to give me a meaningfully different scope, and going from one product to many clients' systems does."}, {"when": "If they ask: only since April, why so soon?", "line": "Fair question. It's been a very dense six months, and the reliability pieces I built there are running. I'm not in a rush; this is one of very few conversations I'm having, because the scope is genuinely different."}], "land": "Less “get away from alfred_”, more “a direction I want to go deeper into”.", "notes": ["Changed from your ZenML version: paragraphs 1, 2 and 4 are your words, unchanged. Paragraph 3 was about building developer infrastructure for Kitaru; it is now range across clients, which is what services offers.", "Pay, visa and start date are prepared in chat, not on this public page. If asked here, say you're happy to go through it with the recruiter."]}, {"id": "why-now", "title": "Why now?", "length": "about 30 seconds", "when": "Often tacked onto why leave, or asked as 'what changed?'. Short.", "probes": ["What changed recently?", "Are you interviewing elsewhere?"], "say": ["Two reasons. The things I built at alfred_, the eval harness, the failure scanner, working memory, are running in production, so it's a natural point to take what I learned somewhere bigger.", "And I think enterprise AI is at the point where it's moving from pilots to production. The hard part now is exactly what I've been working on: making it reliable, measurable and safe. I'd like to be doing that where it's hardest, which is on the systems your clients run."], "swaps": [{"when": "If they ask whether you're interviewing elsewhere", "line": "A few conversations, yes, and I'm being selective. This one stands out because it's the most direct fit between what I've done and what you're building."}], "land": "My pieces are running; enterprise AI is moving from pilots to production, which is the part I know.", "notes": ["New, in your voice. Keep it under thirty seconds; the leave answer carries the weight."]}, {"id": "alfred-day", "title": "What does your day-to-day look like at alfred_?", "length": "about 60 seconds", "when": "How much you code, what 'founding LLM engineer' means, what you personally own.", "probes": ["How much do you actually code?", "What does “founding LLM engineer” mean?", "What did you personally own?"], "say": ["It's pretty varied, which is one of the things I like about the role.", "A typical piece of work might start with a production failure. I'll look at the conversation and the tool trace, figure out whether it's a model problem, a tool problem, or something in our orchestration or memory layer.", "If it's something we need to reproduce, I'll add it to the eval harness. The harness takes a snapshot of the relevant user environment — email, calendar, whatever the task needs — and lets the actual agent code run against that state. So we're testing the same tool paths we use in production rather than mocking the whole agent.", "Then I'll usually build the fix, run the regression set, and look at whether we've actually improved the behavior without breaking something else.", "I've also worked on the production failure scanner, working memory, reliability infrastructure, and some of the cost and orchestration pieces.", "So it's a mix of debugging production behavior, building infrastructure, writing product code, and figuring out what we should build next."], "swaps": [{"when": "If they ask “how much coding?”", "line": "A lot. I'm usually in the codebase every day. The difference is that because we're a small team, the coding is usually preceded by figuring out what the right thing to build is."}], "land": "The coding is usually preceded by figuring out what the right thing to build is.", "notes": ["Your own words, unchanged from ZenML. It works for any company.", "For Mphasis, the regression-set sentence is the one to lean on: clients want proof a change didn't break anything."]}], "drills": [{"id": "intro", "prompt": "Tell me about yourself.", "target": "90 seconds", "seconds": 90, "ref": "#say-intro"}, {"id": "why-mphasis", "prompt": "Why Mphasis?", "target": "60 seconds", "seconds": 60, "ref": "#say-why-mphasis"}, {"id": "why-role", "prompt": "Why this role, and how strong are you on classic ML?", "target": "60 seconds", "seconds": 60, "ref": "#say-why-role"}, {"id": "leave", "prompt": "Why leave alfred_ after six months?", "target": "45 seconds", "seconds": 45, "ref": "#say-leave"}, {"id": "llm", "prompt": "How does a large language model work?", "target": "60 seconds", "seconds": 60, "ref": "#/prep/q-how-does-a-large-language-model-work"}, {"id": "agent", "prompt": "What is an AI agent? Walk me through one you built.", "target": "90 seconds", "seconds": 90, "ref": "#/prep/q-what-is-an-ai-agent-and-how-is-it-different-from-a-chatbot"}, {"id": "rag", "prompt": "Design a RAG system out loud, then code the query path.", "target": "3 minutes", "seconds": 180, "ref": "#/prep/q-build-a-basic-rag-pipeline"}], "qa": [{"group": "Mphasis, and generative AI on legacy systems", "blurb": "What Mphasis does with generative AI, and how you'd design for it.", "items": [{"q": "What do you know about Mphasis?", "short": "What Mphasis does", "tests": "Did you prepare?", "a": ["Mphasis is an IT services company whose clients are largely in banking, insurance and airlines, with a lot of legacy systems.", "On the AI side, the part I found most interesting is NeoZeta: it uses deterministic parsers together with generative AI to relearn legacy code like COBOL into explainable knowledge, a knowledge graph of what the system does, so it can be reviewed before anything is changed. And NeoCrux on the software-engineering side.", "That's close to what I care about: making AI reliable on systems where a wrong answer is expensive."], "land": "Services for regulated industries; NeoZeta turns legacy code into reviewable knowledge with parsers plus generative AI.", "notes": ["Their claim: modernization cost per line down 60% or more; a COBOL platform relearned in two months instead of 12 to 18. Say it as 'they report', not as fact."], "id": "q-what-do-you-know-about-mphasis"}, {"q": "How would you use generative AI to modernize a COBOL system?", "short": "GenAI for COBOL modernization", "tests": "An HLD for their core use case.", "probes": ["Where does the LLM fit, and where shouldn't it?", "How do you trust its output?", "How does retrieval help?"], "a": ["I wouldn't point an LLM at raw COBOL and ask for Java. First, parse deterministically: programs, copybooks, data structures, calls, file and DB access. That gives you a graph of the system you can trust.", "Then use the LLM where it's good: explaining what a paragraph or program does in business terms, grounded by retrieving the relevant nodes from that graph, and proposing a translation one unit at a time.", "And verify everything: generate tests from the old system's behaviour, run old and new side by side on the same inputs, and have a person review the explanations before code changes. The parser gives structure, the model gives language, the tests give trust."], "land": "Parse deterministically into a graph, let the LLM explain and translate with retrieval from it, and verify with side-by-side tests.", "parts": [{"title": "The pipeline", "items": ["**Parse:** COBOL programs, copybooks, JCL; extract calls, data flows, file and DB access. Deterministic.", "**Graph:** nodes for programs, paragraphs, data items, tables; edges for calls, reads, writes.", "**Explain:** the LLM summarises each node in business terms, with its neighbours retrieved from the graph as context (GraphRAG).", "**Translate:** unit by unit, into the target language, with the explanation and interfaces in the prompt.", "**Verify:** tests from recorded production inputs; old and new run side by side; differences flagged; human review for the rest.", "**Audit:** every generated artefact traced to its source node and the model and prompt that produced it."]}, {"title": "Where it breaks", "items": ["Hallucinated business rules: mitigate with retrieval from the graph and review.", "Context limits on huge programs: chunk by the graph, not by line count.", "Numeric semantics (COBOL decimals): test, don't trust."]}], "id": "q-how-would-you-use-generative-ai-to-modernize-a-cobol-system"}, {"q": "What worries you about generative AI for regulated clients?", "short": "GenAI risks in regulated work", "tests": "Maturity about risk.", "a": ["Four things. Hallucination, so outputs must be grounded and checked, not trusted. Data: where client data goes, and whether the model provider can see it. Auditability: being able to say which model, prompt and data produced an output. And evaluation: you need a regression suite before you change a prompt or a model.", "At alfred_ the version of this I lived was an agent claiming it had done something it hadn't. We fixed it by checking the claim against the real execution record, not the model's own account."], "land": "Ground it, protect the data, make it auditable, and evaluate before you change it.", "id": "q-what-worries-you-about-generative-ai-for-regulated-clients"}]}, {"group": "AI fundamentals", "blurb": "How it works underneath: one line each, then an example from your work.", "items": [{"q": "How does a large language model work?", "short": "How an LLM works", "tests": "Fundamentals, plainly.", "a": ["Text is split into tokens, and each token becomes a vector, an embedding. A transformer then runs those vectors through layers of attention, where every token looks at the others and decides how much each one matters to it, plus feed-forward layers.", "The output is a probability for every possible next token. The model picks one, appends it, and repeats. That's all generation is: next-token prediction, over and over.", "It learns in stages: pretraining on huge amounts of text to predict the next token, then fine-tuning on instructions, then preference tuning, like RLHF or DPO, so it answers the way people want."], "land": "Tokens become vectors, attention mixes them, the model predicts the next token, repeatedly.", "figs": ["attention"], "parts": [{"title": "Terms to have ready, one line each", "items": ["**Token:** a piece of a word; cost and context are counted in tokens.", "**Embedding:** a vector that captures meaning; similar meanings sit close together.", "**Attention:** each token weighs every other token: softmax(QK^T / sqrt(d)) V.", "**Context window:** how many tokens the model can see at once.", "**Temperature:** how random the next-token choice is; 0 is near-deterministic.", "**Top-p:** sample only from the smallest set of tokens covering probability p.", "**Hallucination:** fluent output not grounded in fact; the model predicts plausible text, not true text."]}], "id": "q-how-does-a-large-language-model-work", "learn": {"figs": ["attention"], "read": [], "sdLinks": []}}, {"q": "Prompting, RAG or fine-tuning: when do you use which?", "short": "Prompt, RAG or fine-tune", "tests": "Judgement.", "a": ["Prompting first, because it's cheapest and fastest to change. RAG when the model needs knowledge it doesn't have or that changes, like a company's documents; it also gives you citations. Fine-tuning when you need a consistent behaviour or format, or a smaller cheaper model to do one task well, not to add facts.", "In practice they combine: at alfred_ the agent is prompted with a carefully laid-out, cached prompt, and it retrieves the user's own data through tools rather than knowing it."], "land": "Prompt first; RAG for knowledge; fine-tune for behaviour or cost.", "id": "q-prompting-rag-or-fine-tuning-when-do-you-use-which"}, {"q": "What are embeddings, and how does similarity search work?", "short": "Embeddings and vector search", "tests": "The core of RAG.", "a": ["An embedding model turns text into a vector, so that similar meanings end up close together. To search, you embed the query and find the stored vectors closest to it, usually by cosine similarity.", "At scale you don't compare against everything: a vector index like HNSW finds approximate nearest neighbours fast. And you often combine it with keyword search, because embeddings can miss exact terms like an error code or a product name."], "land": "Embed, compare by cosine similarity, index with approximate nearest neighbours, and mix in keyword search.", "learn": {"read": [{"url": "../CODING.html#embed", "label": "Embeddings and vector search, with the code", "why": "Cosine top-k in NumPy, tested."}]}, "id": "q-what-are-embeddings-and-how-does-similarity-search-work"}, {"q": "How do you reduce hallucination?", "short": "Reducing hallucination", "tests": "Practical reliability.", "a": ["Ground the model: give it the facts through retrieval or tools and tell it to answer only from them, with citations. Constrain the output: structured formats, and let the model select from real options rather than invent identifiers.", "Then check: verify claims against a source of truth after generation. At alfred_ the strongest fix was structural: in working memory the model only picks from real candidates behind opaque handles, and code attaches the ids, so it can't invent a thread. And at WheelPrice, the fitment assistant could only answer through four tools against verified data."], "land": "Ground it, constrain it, and verify it; make the worst hallucinations structurally impossible.", "id": "q-how-do-you-reduce-hallucination"}, {"q": "What drives an LLM's cost and latency, and how do you reduce them?", "short": "Cost and latency", "tests": "Production sense.", "a": ["Tokens in and out, and which model. Latency is mostly the output tokens, which are generated one at a time, plus time to the first token.", "Levers: a smaller model where the stakes are low, prompt caching for a stable prefix, fewer tokens in the prompt, streaming so the user sees text early, and replacing a model call with code where you can. At alfred_ a deterministic matcher for email rules cut per-user LLM cost about 30 percent, and quantisation got an audio model to 150 ms p95 at UIC."], "land": "Tokens and model choice; cache, shrink, stream, route, and replace calls with code.", "id": "q-what-drives-an-llm-s-cost-and-latency-and-how-do-you-reduce-"}]}, {"group": "Agentic AI", "blurb": "Loop, tools, memory, guardrails, evaluation, each tied to alfred_.", "items": [{"q": "What is an AI agent, and how is it different from a chatbot?", "short": "What an agent is", "tests": "Core concept.", "a": ["A chatbot answers. An agent pursues a goal in a loop: it decides on an action, calls a tool, looks at the result, and decides again, until the goal is met or it stops.", "So an agent is a model plus tools plus a loop plus state. At alfred_, the user texts 'move my 3pm to tomorrow', and the agent looks up the calendar, finds the event, checks conflicts, proposes the change, and only moves it after a confirm, across several steps."], "land": "A model, tools, a loop and state, pursuing a goal.", "parts": [{"title": "An agent loop, in plain Python", "code": "def run_agent(goal, tools, llm, max_steps=12):\n    messages = [{\"role\": \"user\", \"content\": goal}]\n    for _ in range(max_steps):\n        reply = llm(messages, tools=[t.schema for t in tools.values()])\n        messages.append(reply)\n        if not reply.tool_calls:              # the model answered: done\n            return reply.content\n        for call in reply.tool_calls:         # the model asked for tools\n            result = tools[call.name].run(**call.arguments)\n            messages.append({\"role\": \"tool\", \"id\": call.id, \"content\": result})\n    return \"Stopped: step budget reached\"", "after": ["The step budget matters: alfred_'s agent stops at 12 steps on SMS and 50 on the web."]}], "learn": {"read": [{"url": "../ALFRED.html#l-turn", "label": "alfred_: the turn, and the agent graph"}, {"url": "../CODING.html#agent", "label": "The agent loop, coded and tested"}]}, "id": "q-what-is-an-ai-agent-and-how-is-it-different-from-a-chatbot"}, {"q": "How does tool calling actually work?", "short": "Tool calling", "tests": "Mechanics, not magic.", "a": ["You describe each tool to the model with a name, a description and a JSON schema for its arguments. The model doesn't run anything: it returns a structured request, 'call this tool with these arguments'.", "Your code validates the arguments, runs the tool, and sends the result back as a message, and the model continues. At alfred_ every tool call goes through a wrapper stack before it runs: schema validation, a capability gate, a preview and confirmation for writes, an idempotency key, logging and a timeout."], "land": "The model asks, your code validates and runs, the result goes back into the conversation.", "figs": ["alfredWrap"], "learn": {"read": [{"url": "../ALFRED.html#l-wrap", "label": "alfred_: the tool wrapper stack"}], "figs": ["alfredWrap"]}, "id": "q-how-does-tool-calling-actually-work"}, {"q": "How do you give an agent memory?", "short": "Agent memory", "tests": "Short-term and long-term memory.", "a": ["Short-term is the conversation itself, trimmed to fit the context window, often with a rolling summary. Long-term is stored outside the model and brought back when needed: facts about the user, past conversations by similarity, and structured state.", "At alfred_ there are three: the recent messages and a summary, facts in the per-user part of the prompt, and working memory, open loops like owed replies, which the agent fetches with a tool instead of carrying in every prompt."], "land": "Short-term in the context, long-term in stores, brought back by retrieval or tools.", "figs": ["alfredMemory"], "learn": {"read": [{"url": "../ALFRED.html#l-memory", "label": "alfred_: memory, the three kinds"}], "figs": ["alfredMemory"]}, "id": "q-how-do-you-give-an-agent-memory"}, {"q": "What is ReAct, and what are the common agent patterns?", "short": "ReAct and patterns", "tests": "Vocabulary.", "a": ["ReAct is reasoning and acting interleaved: the model thinks about what to do, takes an action, observes the result, and repeats. Most tool-using agents are a version of it.", "Other patterns: plan and execute, where a plan is made first and steps are run; routing to a specialist; and multi-agent setups where agents with different roles work together. My TeamMedAgents research was a multi-agent setup for medical reasoning, and MockFlow-AI uses a state machine the model moves through by calling a tool, so it can't drift between stages."], "land": "Think, act, observe, repeat; plus planning, routing and multiple agents.", "id": "q-what-is-react-and-what-are-the-common-agent-patterns"}, {"q": "How do you keep an agent safe?", "short": "Agent guardrails", "tests": "Safety on real actions.", "a": ["Decide by what an action does, not by how confident the model sounds. At alfred_ every tool declares its side effect, read, write or bulk, and one wrapper stack around every call decides whether it previews, confirms or replays. That is decided in code, not by another model.", "Irreversible actions like sending mail or deleting always need a confirmation, whatever the user prefers. There's an undo window for reversible ones. Emails are treated as untrusted input because of prompt injection. And a guard checks the agent's claims against what actually ran."], "land": "Gate by what the action does, confirm irreversible ones, treat input as untrusted, verify claims.", "learn": {"read": [{"url": "../ALFRED.html#l-wrap", "label": "alfred_: the wrapper stack, and why there is no risk score"}]}, "id": "q-how-do-you-keep-an-agent-safe"}, {"q": "How do you evaluate an agent?", "short": "Evaluating agents", "tests": "Your strongest topic.", "a": ["Outcome first: did it reach the right end state? Then how: the right tools, no unsafe actions, how many steps. Then reliability: does it succeed every time over several runs, not just once.", "At alfred_ I built a bench from real production failures: a scanner flags failing conversations, a judge checks them, and real ones become cases. Each case runs the real agent against a snapshot of the user's world, with only the provider calls swapped, scored on tool calls per completed task and on assertions against the snapshot."], "land": "End state, then path, then repeatability; built from real failures.", "figs": ["benchLoop", "benchAdapter"], "learn": {"read": [{"url": "../ALFRED.html#s-bench", "label": "alfred_: the eval bench, the full story"}], "figs": ["benchLoop", "benchAdapter"]}, "id": "q-how-do-you-evaluate-an-agent"}, {"q": "What is MCP?", "short": "MCP", "tests": "Current tooling.", "a": ["The Model Context Protocol is an open standard for connecting models to tools and data. A server exposes tools and resources; a client, like Claude, discovers and calls them in a standard way, so you don't write a custom integration per model.", "At alfred_ we ship an MCP connector: Claude can call alfred_'s tools as the user, through the same safety wrappers our own agent uses, with writes previewed and confirmed."], "land": "A standard way for models to discover and call tools; alfred_ ships one.", "id": "q-what-is-mcp"}]}, {"group": "RAG and GraphRAG, in code", "blurb": "Enough code to draw the design correctly, whatever the exact syntax.", "items": [{"q": "Build a basic RAG pipeline.", "short": "RAG, end to end", "tests": "Can you code the HLD?", "a": ["Two phases. Indexing: load documents, split them into chunks with some overlap, embed each chunk, and store the vectors with their text and source. Querying: embed the question, retrieve the top matching chunks, put them in the prompt with an instruction to answer only from them and cite, and generate.", "Then evaluate both halves separately: did retrieval find the right chunks, and did the answer stay faithful to them? That split is what my MetaRAG work was about."], "land": "Chunk, embed, store; embed the question, retrieve, prompt with sources, generate; evaluate retrieval and answer separately.", "parts": [{"title": "What they'll probe", "items": ["**Chunk size:** too small loses context, too large dilutes relevance; overlap stops a sentence being cut in half.", "**Hybrid search:** add keyword search (BM25) and merge the results, for exact terms.", "**Reranking:** retrieve 20, rerank with a cross-encoder, keep the best 4.", "**Evaluation:** retrieval recall at k; answer faithfulness to the sources; answer relevance."]}], "figs": ["ragPipeline"], "learn": {"read": [{"url": "../CODING.html#rag", "label": "RAG, end to end, with the code", "why": "Chunk, embed, retrieve, prompt, cite; tested."}, {"url": "../CODING.html#ai", "label": "AI-flavoured coding: chunk() and friends"}], "figs": ["ragPipeline"]}, "id": "q-build-a-basic-rag-pipeline"}, {"q": "What is GraphRAG, and when does it beat plain RAG?", "short": "GraphRAG", "tests": "Beyond basic retrieval, and Mphasis's world.", "a": ["Plain RAG finds chunks that look like the question. It struggles with questions that need connections across many documents, like 'which systems depend on this table?' or 'what are the main themes across all of this?'.", "GraphRAG first extracts entities and relationships into a graph. For a specific question it retrieves an entity's neighbourhood, following the edges; for a broad question it uses summaries of clusters of the graph. For legacy code this is natural: programs, data and calls already form a graph, which is what NeoZeta's knowledge graph is about."], "land": "Retrieve by relationships, not just similarity: neighbourhoods for specific questions, cluster summaries for broad ones.", "figs": ["graphRag"], "learn": {"read": [{"url": "../CODING.html#graphrag", "label": "GraphRAG, with the code", "why": "Triples, a graph, k hops, cited facts; local against global search."}], "figs": ["graphRag"]}, "id": "q-what-is-graphrag-and-when-does-it-beat-plain-rag"}]}, {"group": "Quick Python", "blurb": "Short exercises that show up on shared screens. The code for each is on the CODING page.", "items": [{"q": "Top k most frequent words in a text.", "short": "Top k frequent", "tests": "Collections and complexity.", "a": ["Count with a Counter, then take the k largest. Counter.most_common(k) does it; with a heap it's O(n log k)."], "land": "Counter plus a heap: O(n log k).", "learn": {"read": [{"url": "../CODING.html#heap", "label": "Heap: top k, with the code"}]}, "id": "q-top-k-most-frequent-words-in-a-text"}, {"q": "Implement an LRU cache.", "short": "LRU cache", "tests": "Data structures.", "a": ["An ordered dict: on get, move the key to the end; on put, insert at the end and, if over capacity, pop the first. Both are O(1). The interview version without OrderedDict is a hash map plus a doubly linked list."], "land": "OrderedDict, move_to_end on use, pop the oldest when full.", "learn": {"read": [{"url": "../CODING.html#ai", "label": "LRU cache, with the code"}]}, "id": "q-implement-an-lru-cache"}, {"q": "Write a retry decorator with exponential backoff for an LLM call.", "short": "Retry with backoff", "tests": "Practical Python for AI systems.", "a": ["A decorator that catches the retryable error, waits base times two to the attempt, plus a little random jitter so many clients don't retry together, and gives up after a few attempts."], "land": "Catch, wait with exponential backoff and jitter, give up after n.", "learn": {"read": [{"url": "../CODING.html#ai", "label": "Retry with backoff, with the code"}]}, "id": "q-write-a-retry-decorator-with-exponential-backoff-for-an-llm-"}, {"q": "Parse a model's JSON output safely.", "short": "Parsing model JSON", "tests": "Robustness.", "a": ["Strip code fences, try json.loads, and validate the shape with Pydantic. If it fails, retry once with the error message in the prompt. Better still, use the provider's structured output or tool calling so the model has to return the schema."], "land": "Strip, parse, validate with Pydantic, retry once with the error.", "learn": {"read": [{"url": "../CODING.html#structured", "label": "Structured output and parsing, with the code"}]}, "id": "q-parse-a-model-s-json-output-safely"}, {"q": "Merge overlapping intervals.", "short": "Merge intervals", "tests": "A classic that shows up everywhere.", "a": ["Sort by start, then walk: if the next interval starts before the last one ends, extend the last; otherwise start a new one. O(n log n) for the sort."], "land": "Sort by start, extend or append.", "learn": {"read": [{"url": "../CODING.html#intervals", "label": "Intervals, with the code"}]}, "id": "q-merge-overlapping-intervals"}]}], "ask": [], "ask3": [{"id": "clarify", "title": "Clarifying", "when": "During coding and design questions.", "why": "It shows you think before you type, and it stops you solving the wrong problem.", "how": ["Restate the problem in one line.", "Ask about input size, edge cases and what to return on bad input.", "Say your assumption out loud if they say 'your choice'."], "items": [{"to": "Either", "q": "How big can the input get, and can it be empty?", "loop": "Before any code.", "why": "It decides the complexity you need."}, {"to": "Either", "q": "Should I optimise for clarity or for speed here?", "loop": "Before choosing an approach.", "why": "It shows you know there's a trade-off."}]}, {"id": "contribute", "title": "Contributing", "when": "At the end.", "why": "Show you're thinking about their work, not just the job.", "how": ["One question, then listen."], "items": [{"to": "Either", "q": "What kinds of agentic or generative AI projects would this role work on first: modernization like NeoZeta, or client-facing agents?", "loop": "Your first question.", "why": "Shows you read about them and want to know where you'd add value."}, {"to": "Either", "q": "How do your clients evaluate an AI system before they trust it in production?", "loop": "After they describe a project.", "why": "Your strongest area, asked as curiosity."}]}, {"id": "collaborate", "title": "Collaborating", "when": "At the end, if there's time.", "why": "How the team works day to day.", "how": ["Ask for a recent example."], "items": [{"to": "Either", "q": "How does the team work with client engineers on a project, day to day?", "loop": "Last.", "why": "Services work is collaborative; shows you know it."}]}], "traps": [["Rambling on the opener", "Ninety seconds, then stop."], ["Coding silently", "Talk through every step; silence reads as stuck."], ["Skipping complexity", "Say the time and space cost before and after."], ["Bluffing a definition", "'Here's how I'd reason about it' beats a wrong confident answer."]], "tables": [], "admire": "", "kitaruLead": "", "figures": [], "mockHow": "Say 'run the Mphasis mock, 15 minutes' in chat for a quick run.", "mocks": [], "planKicker": "The next two hours", "mechTitle": "", "designLink": null, "extra": "Algorithms and coding patterns are on their own page: <a href=\"../CODING.html\" target=\"_blank\" rel=\"noopener\">Algorithms and coding<\/a>. Your own system is on the <a href=\"../ALFRED.html\" target=\"_blank\" rel=\"noopener\">alfred_ page<\/a>, and agent design at depth in your <a href=\"../SYSTEM%20DESIGN.html#/designs/alfred\" target=\"_blank\" rel=\"noopener\">system design guide, alfred_<\/a>.", "emphasis": [], "own": null, "showUp": [["The first two hours: a plan.", "20 min Mphasis and your story; 30 min AI fundamentals and agents; 30 min RAG and GraphRAG code; 20 min quick Python; 20 min algorithms page, patterns only."], ["Set up before you join.", "Laptop plugged in, camera at eye level, light in front of you, no headphones, ID on the desk, an editor open and a blank file ready to share, pop-up blocker off."], ["One line, then your own example.", "Every fundamentals answer: what it is in a sentence, then where you used it. Tokens and attention, then alfred_'s prompt caching; RAG, then MetaRAG."], ["Code out loud.", "Restate the problem, ask about input size and edge cases, say the brute force and its cost, then the better approach, then write it. Run one example by hand at the end."], ["Syntax is not the test.", "If you forget an API, say what it does and write a plausible call. Structure and reasoning score; a missing import doesn't."], ["Agents: loop, tools, memory, guardrails, evaluation.", "Every agent answer can be walked in that order, with alfred_ as the example."], ["They are an IT services company.", "Their clients are banks, insurers and airlines with old systems. Reliability, auditability and cost matter more than novelty. Say how you'd make it safe."], ["Don't bluff.", "'I haven't used that, here's how I'd reason about it' is a strong answer in a recorded round."]], "prepLead": "Two hours. Read how to show up, then open the banks in order: Mphasis, AI fundamentals, agents, RAG and GraphRAG in code, quick Python. Then twenty minutes on the algorithms page.", "storyBlurb": "Your career in ninety seconds, then why Mphasis, why this role, why leave alfred_ and why now, each written for Mphasis.", "sources": [{"label": "Mphasis NeoZeta: generative AI for legacy modernization", "url": "https://www.mphasis.ai/home/neozeta-generative-ai-enterprise-modernization-platform.html", "why": "Relearns legacy code (COBOL, C++, Natural, Java) with deterministic parsers plus generative AI into explainable knowledge."}, {"label": "Mphasis unveils NeoCrux and NeoZeta (press release)", "url": "https://www.prnewswire.com/news-releases/mphasis-unveils-mphasis-neocrux-and-mphasis-neozeta-a-powerful-duo-for-ai-driven-software-engineering-and-enterprise-modernization-302207334.html", "why": "NeoCrux: AI-driven software engineering. NeoZeta: enterprise modernization."}, {"label": "Mphasis.ai", "url": "https://www.mphasis.ai/home.html", "why": "Agentic and enterprise AI; an evergreen knowledge graph over code and documents."}]}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; o.rev = o.rev || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }
    var sm = el("summary", "", '<span class="qt">' + inl(title) + "</span>" + (meta ? '<span class="qm">' + meta + "</span>" : ""));
    d.appendChild(sm); d.appendChild(body);
    return d;
  }
  function bulk(host) {
    var b = el("div", "bulk");
    var o = el("button", "", "Open all"), c = el("button", "", "Close all");
    o.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = true; }); });
    c.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = false; }); });
    b.appendChild(o); b.appendChild(c);
    host.appendChild(b);
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });

  /* ---------------------------------------------------------------- prep: a hub
     The tab is short: how to show up, then the banks as rows, then drills, questions to
     ask, traps and sources. A bank opens in the one-screen panel. */
  function prepBanks() {
    var banks = [];
    if (LOOP.scripts.length) {
      banks.push({ id: "say", title: "Your story, in the words to say it", blurb: LOOP.storyBlurb || "", items: LOOP.scripts.map(function (x) {
        return { id: "say-" + x.id, q: x.title, short: x.short || x.title, tests: x.when, a: x.say, land: x.land, never: x.never, notes: x.notes,
          probes: x.probes, swaps: x.swaps, learn: x.figs ? { figs: x.figs } : null,
          meta: x.length ? x.length.charAt(0).toUpperCase() + x.length.slice(1) + "." : "",
          drill: LOOP.drills.some(function (d) { return d.id === x.id; }) ? x.id : null };
      }) });
    }
    LOOP.qa.forEach(function (g, gi) {
      banks.push({ id: "qa-" + gi, title: g.group, blurb: g.blurb || "", items: g.items });
    });
    return banks;
  }
  function findPrep(banks, id) {
    for (var b = 0; b < banks.length; b++) {
      for (var i = 0; i < banks[b].items.length; i++) { if (banks[b].items[i].id === id) { return { bank: banks[b], i: i }; } }
    }
    return null;
  }
  var hubCounts = [];

    hubCounts.forEach(function (h) {
      var n = h.bank.items.filter(function (x) { return isRevised(x.id); }).length;
      h.node.innerHTML = h.bank.items.length + " questions" + (n ? '<span class="sep"></span><span class="rv">' + n + " revised</span>" : "");
    });
  }
  function tabPrep(host) {

    }

    var h = heading(host, "banks", "Open one, study it in one screen", "Question banks");

    h.appendChild(f);
    var found = el("div", "found"); h.appendChild(found);
    var rows = el("div", "banks");
    banks.forEach(function (b) {
      var r = el("button", "bank");

    h.appendChild(rows);
    drawHubCounts();
    f.addEventListener("input", function () {
      var v = f.value.trim().toLowerCase();
      found.innerHTML = "";
      rows.hidden = !!v;
      if (!v) { return; }
      var hits = 0;
      banks.forEach(function (b) {
        b.items.forEach(function (x, i) {
          var text = (x.q + " " + (x.a || []).join(" ") + " " + (x.notes || []).join(" ") + " " + (x.probes || []).join(" ") + " " +
            (x.swaps || []).map(function (w) { return w.when + " " + w.line; }).join(" ")).toLowerCase();
          if (text.indexOf(v) < 0 || hits >= 14) { return; }

    var three = LOOP.ask3 || [];

      var ul = el("ul", "reading");

        var lab = x.url ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + inl(x.label) + "</a>" : inl(x.label);
        ul.appendChild(el("li", "", lab + (x.why ? '<span class="why">' + inl(x.why) + "</span>" : "")));
      });

  function drills(s) {
    s.appendChild(el("p", "lead", "Open one. Start the timer, answer out loud with Win+H dictating into the box, stop, save. Then read the script and say what you missed. The last three attempts are kept."));
    bulk(s);
    LOOP.drills.forEach(function (d) {
      var body = el("div", "sbody drill-body");
      var head = el("div", "acts"); head.style.marginTop = "0";
      var timer = el("span", "timer", "0:00");
      head.appendChild(el("span", "t", "Aim for " + esc(d.target)));
      head.appendChild(timer);
      body.appendChild(head);
      var ta = el("textarea"); ta.placeholder = "Press Win+H and speak, or type. What you actually said, not what you meant to say.";
      body.appendChild(ta);
      var acts = el("div", "acts");
      var start = el("button", "btn primary", "Start timer");
      var save = el("button", "btn", "Save attempt");
      var see = el("a", "btn", "Read the script"); see.href = prepRef(d.ref);
      acts.appendChild(start); acts.appendChild(save); acts.appendChild(see);
      body.appendChild(acts);
      var list = el("div", "attempts");
      body.appendChild(list);
      var t0 = null, tick = null, secs = 0;
      function fmt(n) { return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); }
      start.addEventListener("click", function () {
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; return; }
        t0 = Date.now(); secs = 0; start.textContent = "Stop";
        tick = setInterval(function () {
          secs = Math.round((Date.now() - t0) / 1000);
          timer.textContent = fmt(secs);
          timer.classList.toggle("over", secs > d.seconds);
        }, 250);
        ta.focus();
      });
      function draw() {
        list.innerHTML = "";
        (own().drills[d.id] || []).slice().reverse().forEach(function (at) {
          list.appendChild(el("div", "at", "<small>" + esc(at.at) + (at.secs ? ", " + fmt(at.secs) : "") + "</small>" + esc(at.text)));
        });
      }
      save.addEventListener("click", function () {
        if (!ta.value.trim()) { ta.focus(); return; }
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; }
        var st = own();
        var arr = st.drills[d.id] || [];
        arr.push({ at: stamp(), secs: secs, text: ta.value.trim() });
        st.drills[d.id] = arr.slice(-3);
        writeJSON(OWN, st);
        ta.value = ""; timer.textContent = "0:00"; timer.classList.remove("over"); secs = 0;
        draw();
      });
      draw();
      var n = (own().drills[d.id] || []).length;
      s.appendChild(item("drill-" + d.id, d.prompt, "Aim for " + esc(d.target) + (n ? ". " + n + " saved" : ""), body));
    });

  /* Figures come from ../figures/figures.js by key, the same registry the tracker draws from. */
  function figNode(k, n) {

    var fig = el("figure", f.fixed ? "" : "trk");
    fig.setAttribute("data-fig", k);
    if (n) { fig.appendChild(el("div", "fh", "Figure " + n + ". " + esc(f.title))); }

  /* What an item rests on: its figures, what to read (with minutes), and where it sits in
     the system design guide. Shared by session steps and Prep questions. */
  function learn(body, x) {
    (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { body.appendChild(f); } });
    var read = el("ul", "reading"), seen = {};
    (x.read || []).forEach(function (r) {
      var k = r.url || r.book || r.label;
      if (!k || seen[k]) { return; }
      seen[k] = 1;
      read.appendChild(el("li", "", (r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + inl(r.label || r.url) + "</a>" : inl(r.book || r.label)) +
        (r.m ? '<span class="w">' + r.m + " min</span>" : "") + (r.why ? '<span class="why">' + inl(r.why) + "</span>" : "")));
    });
    if (read.children.length) { body.appendChild(el("div", "lab", "Read")); body.appendChild(read); }
    if (x.sdLinks && x.sdLinks.length) {
      body.appendChild(el("div", "lab", "In your system design guide"));
      var sd = el("ul", "reading");
      x.sdLinks.forEach(function (q) {
        sd.appendChild(el("li", "", '<a href="' + esc(q.href) + '" target="_blank" rel="noopener">' + esc(q.label) + "</a>" +
          (q.why ? '<span class="why">' + inl(q.why) + "</span>" : "")));
      });
      body.appendChild(sd);
    }
  }
  function sayToggle(label, node) {
    var d = el("details", "say");
    d.appendChild(el("summary", "", esc(label)));
    d.appendChild(node);
    return d;
