ot be able to write.", "yt": {"id": "1At8wV8fwp8", "ch": "Jordan has no life"}}, {"kind": "video", "req": false, "label": "Bloom filters", "url": "https://www.youtube.com/watch?v=V3pzxngeLqw", "m": 6, "why": "Check-and-insert for a million IDs: the memory against false positive trade.", "yt": {"id": "V3pzxngeLqw", "ch": "ByteByteGo"}}, {"kind": "read", "req": true, "label": "Hello Interview: design a news feed", "url": "https://www.hellointerview.com/learn/system-design/problem-breakdowns/fb-news-feed", "m": 30, "why": "Cursor pagination, hot accounts and what to do with deletions and privacy."}, {"kind": "read", "req": false, "label": "Hello Interview: design a ride-sharing service", "url": "https://www.hellointerview.com/learn/system-design/problem-breakdowns/uber", "m": 30, "why": "Matching a rider to a driver under capacity and contention; the same shape as project to contractor."}, {"kind": "read", "req": false, "label": "Bloom filters by example", "url": "https://llimllib.github.io/bloomfilter-tutorial/", "m": 8, "why": "A worked example of how the bit array and the hashes give a no or a maybe."}]}]}, {"id": "gtm", "title": "The GTM round", "lead": "Fifteen minutes with an engagement manager and a principal from Enterprise AI. How to take it, then session wc39 and the Prep questions.", "topics": [{"id": "gtm-howto", "title": "How to take the GTM interview", "brief": "Fifteen minutes with an Engagement Manager and a Principal, Enterprise AI. It is not a sales test. It checks whether you could be put in front of a Fortune 500 stakeholder: do you listen first, ask before solving, say no with a reason, tie work to a number, and explain AI in plain words. No public report of this round exists, so this is built from the invitation (communication, product sense, user empathy, stakeholders) and from how similar customer-facing rounds are graded. Process is graded over conclusion.", "points": ["**What fifteen minutes holds:** a short introduction and two or three real answers, with little room to recover from a long, unstructured one. So the whole prep is structure: a headline, a short story, a clean close, every time. No public report of this round's questions exists; ask the coordinator who runs it and whether it is a role-play or a conversation.", "**The answer shape:** 1. headline first, one sentence that answers the question; 2. two or three short points, one idea a sentence, signposted (first, second); 3. one concrete example with one number or outcome; 4. close and check: 'Does that address what you were asking?'", "**Pace and clarity:** speak about 15 to 20 percent slower than feels natural; pause and count two before answering; short sentences, finished clearly, with the key nouns and numbers stressed; repeat the question in your words when it helps ('If I understand correctly, you are asking...'); practise numbers aloud so they come out cleanly; prepare bullet stories, not scripts, because scripts break under a follow-up.", "**Phrase bank, to use as written:** 'First... Second... To summarise...'; 'For example...'; 'As a result...'; 'What I learned was...'; 'Let me think for a moment.'; 'If I understand correctly, you are asking...'; 'Could you repeat that part?'; 'Does that address what you were asking?'", "**Four things to have ready (your own, told in about 90 seconds each: situation in one sentence, task in one, action in two or three, a result with one number):** 1. a 30 to 60 second self-introduction (current role, the most relevant experience, one or two depth areas, why this role); 2. a stakeholder story where you listened, clarified and changed course; 3. a plain-language story where you explained a technical constraint to a non-technical person; 4. an honest-no story where you said no or reset expectations and kept trust. Reuse the same few stories across questions; do not make a new one for every hypothetical.", "**Empathy and product sense in one answer:** 1. acknowledge the person's pressure and goal, in their terms; 2. say out loud what success looks like for them before proposing anything; 3. name the options and the trade-off in plain words, no unexplained jargon; 4. propose one concrete next step and when you will update them; 5. do not promise a timeline you cannot keep.", "**Product sense, the recipe:** name the user, the job they are trying to do, the pain in their words, the metric that would show improvement, and one trade-off you would make (speed against accuracy, coverage against depth) and why. Then say what you would take back to product and engineering. One specific example with a number beats three general claims about caring for users.", "**Close with one curious question,** such as how the team learns what enterprise users actually need, or how customer feedback reaches engineering. Curious, not challenging; a pointed business question to a leader is reported to have landed badly once.", "The shape of every answer, five moves: Listen (let them finish, note the impact), Ask (two or three targeted questions), Reflect (say back the goal and the constraint in one sentence), Propose (a small scoped first step, with a time), Measure (the number that says it worked, and the rule for what happens next). Say the moves out loud so they can hear the structure", "Unhappy customer, quality dropped: acknowledge the impact first and name a time for a first diagnosis. Ask for three real failures and when it started. Replay the same cases before and after to separate the model changing from the input changing. Run two tracks at once: what you tell the customer, and what you fix. Never blame their systems", "Customer wants something that will not solve their problem: agree with the goal, ask what sits behind the request, name the risk honestly, offer the smaller version that works with a number to judge it. Validate the goal while you reframe the scope. Disagree, then commit once decided", "Expectations gap (they expect three days, it is six weeks): say the real number early, explain what drives it in a sentence, offer a phased first slice that shows value sooner, and write down what is out of the first phase", "Explaining AI variability to an executive: say it is expected, not a bug. Use an analogy from their domain (two good analysts asked the same question word it differently, the facts should agree). Then say how you check: a fixed set of cases, run on every change, with the facts that matter held steady", "Discovery questions for a new customer: the goal and who decides; one real case from start to finish; what a wrong answer costs; what cannot change (data, systems, security review, sign-off); how success will be judged. Two or three of these, not a list of twelve", "Pilot metrics: baseline first, one outcome, one guardrail, an evaluation set built with their experts, and the expansion and stop rule written before you start. Mercor's own case studies follow this: an evaluation-defined goal and an operational result (an incident-response agent reported a cut of over 50% in median time to mitigation; say 'they report')", "Product sense for Mercor Enterprise: know the four parts (Discover finds and ranks workflows worth automating, Deploy builds agents judged by the customer's own quality bar, Improve tunes live agents, Monetize is opt-in data licensing). Know one number. Then think as a customer: who grades the agent, what it does when it is unsure, how it stays good after launch. Ask these as questions, not as criticism", "Mistakes to avoid: jumping to a solution before asking; defending instead of acknowledging; arguing about the customer's own systems; a technical lecture to a non-technical person; vague claims with no number; presenting Mercor's case-study figures as yours; talking for more than about a minute and a half without checking in. Fifteen minutes is two or three scenarios, so keep answers to a minute or two", "Your honest limit: alfred_ is a consumer product with over 5,000 active users, not an enterprise engagement. Say that once, then carry over what is true: you ask what users need, you built a tool that explains why, and you measure with an evaluation set"], "production": ["The same five moves answer almost every scenario. If a question surprises you, say 'let me ask two things first' and begin at Ask. It buys time and is exactly what the round rewards."], "links": [{"url": "../index.html#/w/wc39", "label": "wc39 GTM round session", "why": "The teach-first session for this round: each question with its pointers."}, {"url": "#/prep", "label": "Prep tab: GTM round and Leadership chat groups", "why": "Every likely question, with bold pointers and a learn link on each."}], "res": [{"kind": "video", "req": true, "label": "Forward Deployed Engineer | Role & Interview Overview", "url": "https://www.youtube.com/watch?v=qZgErBZk0GY", "m": 22, "why": "What a customer-facing technical round tests and how candidates are scored.", "yt": {"id": "qZgErBZk0GY", "ch": "Aced (formerly Exponent)"}}, {"kind": "video", "req": false, "label": "Forward Deployed Engineer Interviews at LangChain", "url": "https://www.youtube.com/watch?v=knEiqlfpV5k", "m": 24, "why": "A real company's loop, including the customer scenario round and what stood out.", "yt": {"id": "knEiqlfpV5k", "ch": "Aced (formerly Exponent)"}}, {"kind": "read", "req": true, "label": "FDE Academy: forward deployed engineer interview questions (free to read)", "url": "https://fde.academy/blog/forward-deployed-engineer-interview-questions", "why": "The deployment-scenario and client-simulation rounds, with a framework and model approaches."}, {"kind": "read", "req": false, "label": "Perspective AI: FDE interview questions, 2026 guide (free to read)", "url": "https://getperspective.ai/blog/forward-deployed-engineer-interview-questions-2026-prep-guide", "why": "What interviewers evaluate, sample questions by category, and red flags."}], "mcq": [{"q": "A customer says the agent was fine last week and is now making mistakes. What is the best first move?", "o": ["Explain that models change and some variation is normal", "Acknowledge the impact, ask for three real failures and when it started, and name a time for a first diagnosis", "Ask them to check their own data pipeline", "Roll back the model immediately", "Offer a discount"], "a": 1, "why": "Acknowledge the impact first, then diagnose with real examples and a committed time. Defending or blaming their systems loses the room."}, {"q": "A stakeholder asks for a feature you know will not fix their problem. What do you do?", "o": ["Build it, since they are the customer", "Refuse and explain why they are wrong", "Agree with the goal, ask what sits behind the request, name the risk, and offer a smaller version with a number to judge it", "Escalate to your manager", "Say you will think about it and move on"], "a": 2, "why": "Validate the goal while reframing the scope. You keep the relationship and move to something that can be measured."}, {"q": "Which set best defines a pilot that you can later call a success?", "o": ["A demo that went well and a happy sponsor", "Baseline, one outcome, one guardrail, an evaluation set with their experts, and an expansion and stop rule written first", "Number of users who logged in", "Model accuracy on a public benchmark", "A signed contract"], "a": 1, "why": "Success has to be measurable and agreed before the pilot starts, or the pilot proves nothing."}, {"q": "A CFO asks why the AI gives different wording for the same question. Which answer fits best?", "o": ["It is a known bug we are fixing", "Two good analysts asked the same question word it differently; the facts should agree, and we test a fixed set of cases to check that they do", "Randomness cannot be controlled", "You should lower the temperature and the problem goes away", "That is how all software works"], "a": 1, "why": "Say it is expected, use an analogy from their world, and show how you verify the facts stay steady."}], "open": {"q": "A new enterprise customer says 'we want an AI agent for support.' You have fifteen minutes. How do you start, and what do you say?", "probe": "What do you ask first, what would you propose, and how would you know it worked?", "a": ["Listen and reflect: say back the goal in one sentence and ask who decides.", "Ask two or three questions: one real case start to finish, what a wrong answer costs, what cannot change.", "Propose a small first slice, such as one request type with a person checking, and a time for a first result.", "Measure: baseline today, one outcome, one guardrail, an evaluation set made with their experts.", "Write the expansion rule first: when both numbers hold for two weeks, add the next request type."]}, "say": ["**Let me ask two things before I suggest anything.**", "**What I am hearing is the goal and the constraint,** is that right?", "**I would start small:** one request type, a person checking, a first result by a date I name.", "**We would know it worked when** one number moves and one guardrail holds, and I would agree both with you now.", "**I can't promise that, but here is what I can do** and how we would measure it."], "avoid": ["Jumping to a solution or a tool name before asking anything.", "Defending the product or blaming the customer's systems.", "Long technical explanations for a non-technical listener.", "Claims with no number, or Mercor's case-study figures stated as your own."]}]}, {"id": "optional-ai", "title": "Optional: AI designs", "blurb": "Not on the 11 November agenda, which is a backend round. Kept for the follow-ups if the interviewer asks about AI systems: retrieval, evaluation, model behaviour.", "sessions": ["wc38"], "topics": [{"id": "sd-candidate-search", "title": "Design candidate search for a job description", "brief": "Reported both as a 45 minute system design and as a 90 minute build against an evaluation endpoint. Given a job description, return the best candidates from a large pool, and know how good the results are.", "points": ["How it is asked: practical, about AI systems: retrieval, evaluation, model behaviour, failure modes, monitoring. Open with requirements and the numbers (how many candidates, queries per day, how fresh), then the shape", "The shape: filters on hard facts, then keyword and embedding retrieval fused, then a rerank of a short list, with an LLM used where it is worth the cost (extracting fields, rewriting the query, explaining a match)", "Cost and latency: cheap stages cover the whole pool, expensive stages see only the top few dozen. Embeddings are computed once per profile and refreshed on change; per-query model calls are counted and capped", "Evaluation is half the design: a labelled set of jobs and good candidates, precision at 5 and recall, a held-out slice, and failures read by hand. Without it you cannot say a change helped", "Failure modes: a wrong hard filter drops the right person, keyword stuffing wins, a model invents a skill during extraction, stale profiles rank first, a bias in the labels becomes a bias in the results", "In production: monitor result click and hire signals, score drift after a model change, latency by stage, and the share of queries with no good result. Roll out a new ranker behind a comparison on real queries", "For the build version of this, see wc38; for the design checklist, wc36"], "production": ["A new ranker or embedding model is rolled out against the old one on the same queries first, because a silent model update moves every score."], "figs": [], "links": [{"url": "../index.html#/w/wc36", "label": "wc36 AI system design the Mercor way", "why": "Candidate search is the first of its four designs."}, {"url": "../index.html#/w/wc38", "label": "wc38 The search build: iterate against a score", "why": "The 90 minute build version, with a runnable scorer."}, {"url": "../index.html#/w/wc35", "label": "wc35 The build", "why": "The general build workflow and presentation."}], "res": [{"kind": "read", "req": true, "label": "Eugene Yan: system design for discovery", "url": "https://eugeneyan.com/writing/system-design-for-discovery/", "m": 12, "why": "Retrieval then ranking as separate stages, with the metrics for each."}, {"kind": "read", "req": true, "label": "Anthropic: contextual retrieval", "url": "https://www.anthropic.com/news/contextual-retrieval", "m": 8, "why": "Keywords, embeddings and a reranker together, with measured results."}, {"kind": "read", "req": false, "label": "Chip Huyen: building a generative AI platform", "url": "https://huyenchip.com/2024/07/25/genai-platform.html", "m": 25, "why": "Where retrieval, guardrails, caching and evaluation sit in a production stack."}, {"kind": "video", "req": true, "label": "Rerank for better RAG, explained", "url": "https://www.youtube.com/watch?v=K1F8BIgcoNk", "m": 14, "why": "Why a second-stage reranker lifts the top results that embeddings alone miss.", "yt": {"id": "K1F8BIgcoNk", "ch": "vectorize"}}, {"kind": "video", "req": false, "label": "Advanced RAG: hybrid search with BM25 and ensembles", "url": "https://www.youtube.com/watch?v=lYxGYXjfrNI", "m": 7, "why": "Keyword and vector scores combined, the retrieval you would use for profiles.", "yt": {"id": "lYxGYXjfrNI", "ch": "Sam Witteveen"}}], "mcq": [{"q": "You can afford an LLM call on about 50 candidates per query, from a pool of 100,000. Where does the LLM go?", "o": ["On every candidate, once per query", "On the top 50 from a cheap stage, to rerank or explain them", "Only on the job description, never on candidates", "On a random sample of 50", "Nowhere; LLMs cannot rank"], "a": 1, "why": "The cheap stages (filters, keywords, embeddings) cover the pool; the expensive model sees only the short list, where order matters most."}, {"q": "Your tuning score keeps rising but a held-out set of jobs does not move. What does that suggest?", "o": ["The held-out set is broken", "You are overfitting to the tuning data", "The model needs more parameters", "Precision at 5 is the wrong metric", "Nothing; only the tuning score matters"], "a": 1, "why": "Gains that do not carry to unseen jobs mean the change fits the tuning data, not the problem."}], "open": {"q": "Design candidate search: a recruiter pastes a job description and wants the best candidates. How do you build it, and how do you know it works?", "probe": "Where does the LLM earn its cost, and what is your evaluation set?", "a": ["Requirements and numbers: pool size, queries a day, freshness, how bad a miss is.", "Shape: hard filters, then keyword plus embeddings fused, then a rerank of the top few dozen. LLM extraction of fields and query rewriting where messy text hides the signal.", "Cost: embed each profile once and refresh on change; cap model calls per query; cache.", "Evaluation: labelled jobs and candidates, precision at 5 and recall, a held-out slice, failures read by hand.", "Failures and monitoring: wrong filters, keyword stuffing, invented skills, stale profiles; watch score drift and the no-good-result rate."]}, "say": ["**I'd start with the pool size and what a miss costs, then the shape.**", "**The shape:** filters, then keywords and embeddings together, then a rerank on the short list. The LLM goes where it earns its cost.", "**Evaluation:** a labelled set with a held-out slice, and I read the failures by hand. In MetaRAG I measured retrieval changes the same way.", "**Failures:** a wrong filter, keyword stuffing, an invented skill, stale profiles.", "And I'd compare a new ranker to the old on the same queries before it ships."], "avoid": ["Calling a toy label set a benchmark, or claiming a gain that was not measured."], "design": "candidate-search"}, {"id": "sd-ai-interviewer", "title": "Design an AI interviewer with rubric grading", "brief": "A design taken from what Mercor sells (wc36): an AI that asks a candidate questions, listens, follows up and grades the answers against a rubric. It is not reported as an onsite prompt, so treat it as likely practice for the AI-systems design round.", "points": ["How it would be asked: practical, about model behaviour, evaluation and failure modes. Start with who uses the grade and what a wrong grade costs, then the pipeline", "The pipeline: a rubric of named criteria, a question flow that can follow up, a transcript, a grader that scores each criterion with evidence from the transcript, and a human review path for low-confidence or high-stakes cases", "Grade one criterion at a time, with its own prompt, a short scale with written anchors, and a quote as evidence. One broad 'rate this candidate' call is vague and unstable", "Trusting the grader: compare it with human graders on a labelled sample, measure agreement per criterion, and repeat the same answer to measure consistency. Fix the rubric text before the model", "Failure modes: a long confident answer scores high, bias by accent or style, prompt injection from the candidate's answer, a cheating candidate reading from another tool, and a grader that drifts after a model update", "Cost, latency and ops: a live conversation needs fast turns, grading can run after the call in a queue, and every grade stores the rubric version, the model version and the evidence so it can be replayed and audited", "For the design checklist and the other three Mercor-style designs, see wc36"], "production": ["Every grade stores the rubric version, model version and transcript evidence, so a disputed grade can be replayed and a rubric change can be tested against past interviews."], "figs": [], "links": [{"url": "../index.html#/w/wc36", "label": "wc36 AI system design the Mercor way", "why": "The AI interviewer is one of its four designs, with the evaluation checklist."}, {"url": "../index.html#/w/wc38", "label": "wc38 The search build", "why": "Same habit: a score, a held-out slice, failures read by hand."}], "res": [{"kind": "read", "req": true, "label": "Hamel Husain: using an LLM as a judge", "url": "https://hamel.dev/blog/posts/llm-judge/", "m": 12, "why": "Build the judge by checking it against human labels, one criterion at a time."}, {"kind": "read", "req": true, "label": "Anthropic: demystifying evals for AI agents", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "m": 15, "why": "Graders, what a score shows, and how to calibrate."}, {"kind": "read", "req": false, "label": "Anthropic: building effective agents", "url": "https://www.anthropic.com/engineering/building-effective-agents", "m": 15, "why": "Workflows against agents: how much the model should decide in the interview flow."}, {"kind": "video", "req": true, "label": "LLM as a judge: scaling AI evaluation strategies", "url": "https://www.youtube.com/watch?v=trfUBIDeI1Y", "m": 7, "why": "What a judge model can grade, and where it is biased.", "yt": {"id": "trfUBIDeI1Y", "ch": "IBM Technology"}}, {"kind": "video", "req": false, "label": "From LLM as a judge to agent as a judge", "url": "https://www.youtube.com/watch?v=q2JrUKBMf0w", "m": 7, "why": "A conference talk on grading multi-step behaviour, not one answer.", "yt": {"id": "q2JrUKBMf0w", "ch": "AI Engineer"}}], "mcq": [{"q": "How do you decide whether an LLM grader can be trusted with a rubric?", "o": ["If it gives confident explanations", "Compare its scores with human graders on a labelled sample and measure agreement per criterion", "If it uses the largest model available", "If it scores the same on a second run, whatever the humans think", "You cannot; use only humans"], "a": 1, "why": "Agreement with human labels is the test. Consistency alone can mean consistently wrong, and confidence is not evidence."}, {"q": "The same answer gets 3 on one run and 5 on another. What do you fix first?", "o": ["Switch to a bigger model", "Tighten the rubric: separate criteria, a short scale with written anchors, and require quoted evidence", "Average ten runs and hide the spread", "Remove the rubric and let the model decide", "Ignore it; scores vary"], "a": 1, "why": "Vague criteria cause unstable grades. Anchors and per-criterion prompts fix the cause; averaging only hides it."}], "open": {"q": "Design an AI interviewer that grades candidates against a rubric. How do you make the grades trustworthy?", "probe": "How do you know the grader agrees with a human, and what happens on a low-confidence grade?", "a": ["Who uses the grade and what a wrong one costs, to set the bar.", "Pipeline: rubric, question flow with follow-ups, transcript, a grader per criterion with quoted evidence, and a human review path.", "Trust: compare with human graders on a labelled sample, measure agreement per criterion, measure repeat consistency, and fix the rubric text first.", "Failures: confident long answers, style bias, prompt injection in an answer, cheating, drift after a model update.", "Ops: grade after the call in a queue, store rubric and model versions and evidence, replay old interviews to test a change."]}, "say": ["**I'd start with what a wrong grade costs, then the pipeline.**", "**One criterion at a time:** a short scale with written anchors and a quote as evidence, not one broad rating.", "**Trust the grader by measuring it:** agreement with human graders on a labelled sample, and the same answer repeated for consistency. In MetaRAG I built an automated evaluation framework the same way.", "**Failures:** a long confident answer, style bias, injection from an answer, drift after a model update.", "Low-confidence and high-stakes grades go to a person, with the evidence attached."], "avoid": ["Saying the grader is accurate without a human-labelled sample to show it."], "design": "ai-interviewer"}]}, {"id": "related", "title": "Related designs, for the follow-ups", "lead": "Designs already in the guide that cover the AI follow-ups. Read the deep dives, not the whole design.", "topics": [{"id": "sd-notebooklm", "title": "NotebookLM: retrieval and grounded answers", "brief": "Retrieval over a user's own documents with citations. Candidate search reuses its ingestion, chunking and retrieval, then adds hard filters and a ranking you can evaluate.", "points": ["Read the ingestion and retrieval steps, then the deep dive on answer grounding.", "Carry over: hybrid retrieval, reranking, and keeping each customer's data apart.", "Say it in candidate search: retrieval sets the ceiling; a profile never retrieved can't be ranked."], "design": "notebooklm", "res": [{"kind": "video", "req": true, "label": "Google's RAG experiment: NotebookLM", "url": "https://www.youtube.com/watch?v=nK61ZpAS13s", "m": 14, "why": "How NotebookLM answers from your own sources and cites them.", "yt": {"id": "nK61ZpAS13s", "ch": "Sam Witteveen"}}, {"kind": "video", "req": false, "label": "Is RAG still needed?", "url": "https://www.youtube.com/watch?v=UabBYexBD4k", "m": 12, "why": "When retrieval wins over stuffing documents into the context.", "yt": {"id": "UabBYexBD4k", "ch": "IBM Technology"}}, {"kind": "read", "req": true, "label": "Google: NotebookLM, an AI-first notebook", "url": "https://blog.google/technology/ai/notebooklm-google-ai/", "m": 5, "why": "The product as launched: source-grounded answers with citations."}, {"kind": "read", "req": false, "label": "Pinecone: rerankers and two-stage retrieval", "url": "https://www.pinecone.io/learn/series/rag/rerankers/", "m": 12, "why": "Retrieve wide, rerank narrow; the step between retrieval and grounded answer."}]}, {"id": "sd-kitaru", "title": "Kitaru: an agent-evaluation product", "brief": "An evaluation product read from its source. The AI interviewer's grading and the search build's evaluation endpoint are both evaluation problems: cases, graders, a score you can trust.", "points": ["Read how cases, runs and graders are modelled.", "Carry over: one grader per dimension, a stored baseline, and regressions flagged on every change.", "Pairs with the LLD tab's eval harness round."], "design": "kitaru", "res": [{"kind": "video", "req": true, "label": "How to evaluate agents in practice", "url": "https://www.youtube.com/watch?v=vuBvf7ZRKTA", "m": 11, "why": "Cases, graders and trajectories for agent evaluation.", "yt": {"id": "vuBvf7ZRKTA", "ch": "Google Cloud Tech"}}, {"kind": "video", "req": false, "label": "How to systematically set up LLM evals", "url": "https://www.youtube.com/watch?v=a3SMraZWNNs", "m": 56, "why": "A long build-along from cases to LLM-as-a-judge; skim the middle.", "yt": {"id": "a3SMraZWNNs", "ch": "Dave Ebbelaar"}}, {"kind": "read", "req": true, "label": "Hamel Husain: your AI product needs evals", "url": "https://hamel.dev/blog/posts/evals/", "m": 20, "why": "Three levels of eval and why you build the loop before the fixes."}, {"kind": "read", "req": false, "label": "Eugene Yan: task-specific LLM evals that do and don't work", "url": "https://eugeneyan.com/writing/evals/", "m": 20, "why": "Which metrics hold up for classification, summarisation and retrieval."}]}]}]}, "tabs": ["overview", "learn", "sessions", "coding", "lld", "prep", "rounds", "mocks"], "concN": 4, "plan": null, "lp": null, "card": null, "live": [], "liveLead": [], "takehomes": [], "watch": null, "timeline": null}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; o.rev = o.rev || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\(((?:#|\.\.\/|https:\/\/)[^)\s]+)\)/g, '<a href="$2">$1</a>');
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }
    var sm = el("summary", "", '<span class="qt">' + inl(title) + "</span>" + (meta ? '<span class="qm">' + meta + "</span>" : ""));
    d.appendChild(sm); d.appendChild(body);
    return d;
  }
  function bulk(host) {
    var b = el("div", "bulk");
    var o = el("button", "", "Open all"), c = el("button", "", "Close all");
    o.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = true; }); });
    c.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = false; }); });
    b.appendChild(o); b.appendChild(c);
    host.appendChild(b);
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });
    (s.study || []).forEach(function (_, i) { k.push(s.id + ":s" + i); });
    return k;
  }
  function isDone(t, s) { return !!t.done[s.id]; }
  function link(tab, anchor) { return "#/" + tab + (anchor ? "/" + anchor : ""); }
  /* A drill's reference is either a route already or an anchor on the prep tab. */
  function prepRef(r) { return r.indexOf("#/") === 0 ? r : link("prep", r.replace(/^#/, "")); }

  /* ---------------------------------------------------------------- tabs */
  var TABS = [
    { id: "overview", label: "Overview", show: function () { return true; } },
    { id: "mine", label: "My answers", show: function () { return true; } },

  /* One button by a session's title: copies the session's NotebookLM links (x.nlm, gathered at
     build time by site/nlm.js exactly as the tracker's button does), one per line, for
     NotebookLM's Website source. A session without them falls back to its own links. */
  function notebookButton(x) {
    var urls = x.nlm || [], seen = {};
    if (!x.nlm) (function walk(v) {
      if (typeof v === "string") {
        var u = v.replace(/#.*$/, ""), id = u.replace(/\/$/, "");
        if (/^https?:\/\//.test(u) && !/^https?:\/\/(localhost|127\.|\[::1\])/.test(u) && !seen[id]) { seen[id] = 1; urls.push(u); }
      } else if (v && typeof v === "object") {
        for (var k in v) { if (Object.prototype.hasOwnProperty.call(v, k)) { walk(v[k]); } }
      }
    })([x.steps, x.study || []]);
    if (!urls.length) { return null; }
    var label = "Copy " + urls.length + (urls.length === 1 ? " link" : " links") + " for NotebookLM";
    var cp = el("button", "btn nlm-copy", label);
    cp.title = "Paste into NotebookLM: Add source, Website";
    cp.addEventListener("click", function () {
      var text = urls.join("\n");
      function done() { cp.textContent = "Copied"; setTimeout(function () { cp.textContent = label; }, 1500); }
      function fallback() {
        var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); done(); } catch (e) { cp.textContent = "Copy failed"; }
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, fallback); } else { fallback(); }
    });
    return cp;
  }

      sol.appendChild(cdPre(p.solution));

      if (p.explain && p.explain.length) { var ol = el("ol"); p.explain.forEach(function (x) { ol.appendChild(el("li", "", inl(x))); }); sol.appendChild(ol); }

      if (p.followups && p.followups.length) { sol.appendChild(el("div", "lab", "The next layers they ask: answer each out loud first")); sol.appendChild(cdFaq(p.followups)); }
      var rv = resFor(p.id, "Watch the walkthrough"); if (rv) { sol.appendChild(rv); }

      if (editing) { return; }
      if (e.key === "ArrowRight" && cur < list.length - 1) { e.preventDefault(); show(cur + 1); }
      else if (e.key === "ArrowLeft" && cur > 0) { e.preventDefault(); show(cur - 1); }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    close.focus();
  }

  function openPanel(o) {
    var cur = o.start || 0;
    convo.innerHTML = ""; convo.className = "convo";
    convo.setAttribute("aria-label", o.label || o.title);
    var shell = el("div", "cv");
    var rail = el("nav", "cv-rail");
    rail.appendChild(el("div", "cv-title", "<b>" + esc(o.title) + "</b>" + (o.sub ? "<span>" + esc(o.sub) + "</span>" : "")));
    var rows = [];
    for (var i = 0; i < o.count; i++) {
      (function (i) {
        var b = el("button", "turn");
        b.innerHTML = o.row(i);
        b.addEventListener("click", function () { show(i); });
        rail.appendChild(b);
        rows.push(b);
      }(i));
    }
    rail.appendChild(el("div", "cv-keys", "Up and down arrows move. Escape closes."));
    var pane = el("section", "cv-pane");
    var close = el("button", "cv-close", "Close");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", function () { convo.close(); });
    shell.appendChild(rail); shell.appendChild(pane);
    convo.appendChild(close); convo.appendChild(shell);
    function show(i) {
      cur = i;
      rows.forEach(function (b, j) { b.classList.toggle("on", j === i); if (j === i) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); } });
      rows[i].scrollIntoView({ block: "nearest" });
      pane.innerHTML = "";
      o.draw(i, pane, function () { rows[i].innerHTML = o.row(i); });
      [].forEach.call(pane.querySelectorAll(".cv-col"), function (c) { c.scrollTop = 0; });
    }
    convo.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = cur + (e.key === "ArrowDown" ? 1 : -1);
        if (n >= 0 && n < o.count) { show(n); rows[n].focus(); }
      }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    rows[cur].focus();
  }
  function panelCols(pane, leftTitle, rightTitle) {
    var cols = el("div", "cv-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "cv-col cv-say");
    left.appendChild(el("h3", "cv-h", leftTitle));
    right.appendChild(el("h3", "cv-h", rightTitle));
    cols.appendChild(left); cols.appendChild(right);
    pane.appendChild(cols);
    return { left: left, right: right, cols: cols };
  }

  /* A mock: what they asked and how it landed; what you said; what to say. */
  function openConvo(m, start) {
    var ex = m.exchanges;
    openPanel({
      title: m.title, sub: m.when, label: "Mock conversation", count: ex.length, start: start,
      row: function (i) {
        var x = ex[i];
        return '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) + "</span>";
      },
      draw: function (i, pane) {
        var x = ex[i], who = (x.who || "").toLowerCase();
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q spk-" + who, '<span class="ex-who">Turn ' + (i + 1) + " of " + ex.length + ", " + esc(x.who) + "</span>" + inl(x.q)));
        head.appendChild(el("p", "cv-verdict", '<span class="vd vd-' + esc(x.verdict) + '"></span><b>' + esc(VERDICT[x.verdict] || x.verdict) + ".</b> " + inl(x.why || "")));
        if (x.tests) { head.appendChild(el("p", "cv-tests", "<b>They were testing:</b> " + inl(x.tests))); }
        pane.appendChild(head);
        var c = panelCols(pane, "What you said", "What to say");
        panelSection(c.left, "In short", (x.said || []).map(function (p) { return el("p", "ex-said", inl(p)); }));
        panelSection(c.left, "What worked", panelList(x.good, "mk-good"));
        panelSection(c.left, "What did not", panelList(x.bad, "mk-bad"));
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.say && x.say.length) { c.right.appendChild(transcript(x.say, "You", "")); }
        panelSection(c.right, "How to approach it", panelList(x.approach));
        (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.right.appendChild(f); } });
        var links = [];
        if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
        if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
        if (links.length) { c.right.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      }
    });
  }

  /* A Prep question can be marked revised; the mark is kept in this page's storage. */
  function isRevised(id) { return !!own().rev[id]; }
  function setRevised(id, on) {
    var o = own();
    if (on) { o.rev[id] = stamp(); } else { delete o.rev[id]; }
    writeJSON(OWN, o);
  }
  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    if (tab === "overview" && p[0] && p[0] !== "overview" && LOOP.learn && p[1]) {
      var to = null;
      learnModules().forEach(function (m) { m.topics.forEach(function (t) { if ((t.was || []).indexOf(p[1]) >= 0 || t.id === p[1]) { to = t.id; } }); });
      if (to) { history.replaceState(null, "", link("learn", to)); return { tab: "learn", anchor: to }; }
    }
    return { tab: tab, anchor: p[1] || null, sub: p[2] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = (t.id !== current && lastHash(t.id)) || link(t.id);
      a.addEventListener("click", function () { restoreNext = true; });
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = []; document.body.removeAttribute("data-wide");
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "mine") { tabMine(main); }
      else if (r.tab === "prep") { tabPrep(main, r.anchor); }
      else if (r.tab === "rounds") { tabRounds(main); }
      else if (r.tab === "research") { tabResearch(main); }
      else if (r.tab === "learn") { tabLearn(main, r.anchor); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "live") { tabLive(main); }
      else if (r.tab === "mocks") { if (cdParts("mocks").length) { tabCoding(main, r.anchor, "mocks"); } tabMocks(main); }
      else if (r.tab === "coding") { tabCoding(main, r.anchor); }
      else if (r.tab === "lld") { tabCoding(main, r.anchor, "lld"); }
      else if (r.tab === "concurrency") { tabCoding(main, r.anchor, "concurrency"); }
      else if (r.tab === "daily") { tabDaily(main, r.anchor, r.sub); }
      else if (r.tab === "lp") { tabLp(main, r.anchor); }
      else if (r.tab === "plan") { tabPlan(main, r.anchor); }
      else if (r.tab === "card") { tabCard(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    curTab = r.tab; document.body.setAttribute("data-tab", r.tab);
    var lh = cdState().lastHash || {}; lh[r.tab] = location.hash; cdSave("lastHash", lh);
    drawTabs(r.tab); drawSide(r.tab); drawToday(); progress();
    var key = /^(daily|plan|coding|lld)$/.test(r.tab) ? location.hash : r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    var back = restoreNext && POS[location.hash] != null; restoreNext = false;
    if (back) { var y = POS[location.hash]; requestAnimationFrame(function () { window.scrollTo({ top: y, behavior: "instant" }); }); }
    else if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var c = document.getElementById("count");
    if (!LOOP.when_iso) { c.textContent = "Date to be set"; return; }
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
