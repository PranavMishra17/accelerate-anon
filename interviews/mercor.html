beddings, then a reranker on the top few, then query rewriting and LLM field extraction. Why this order: the cheap, explainable steps first, and the expensive model calls only where the cheap ones have stalled. Embeddings catch what keywords miss: server-side and backend are different words and the same job. Extraction: a model turns messy profile text into skills, years and seniority once, and I cache it. I check a sample by hand. My own example: in MetaRAG, adding LLM-generated metadata to chunks lifted precision from 73.3% to 82.5% against a content-only baseline, and I only knew that because I measured it. The log of score per change is also what I'll talk through in the last fifteen minutes."}, {"q": "In your own words: Not overfitting the endpoint: a held-out slice and failures read by hand.", "a": "I keep part of my data aside, and I read the failures by hand, so I know a better score means a better ranker and not a better fit to the endpoint. Hold-out: I tune on some jobs and check each kept change on others. If only the tuned score rises, I stop. Failures: I print the wrong results in the top five and group them: synonyms, a wrong filter, repeated words, missing fields. Fixes are for groups, not one case. A fix that names one candidate is overfit. Small numbers: with a few jobs, one result moves the score a lot, so I say how noisy it is. No leakage: the labels never go into a prompt or a rule. The score tells me how much, and reading the failures tells me why."}, {"q": "In your own words: The 15-minute discussion: how you used the LLMs, the design, the debugging.", "a": "I'd start with the score story, then say where the LLMs helped and where I checked them, then the design, one bug, and what's next. Score story: baseline, then each change and what it did, including the ones that did nothing. LLMs: as a coding helper I gave it small asks and fixed what it got wrong. As part of the system they did embeddings, reranking and extraction, and I checked a sample by hand. Design: cheap stage first, expensive stage on the top few, cached, so cost per query stays low. A bug: I'd tell one real one, how I found it and how I checked the fix. Next: a bigger labelled set first, then the changes that the failures point to. I can explain every line, including the ones the model wrote, because I read them all."}], "hasTrackerQuiz": false, "figs": [], "nlm": ["https://aceoffer.app/interviews/mercor/interview-process", "https://www.teamblind.com/post/mercor-swe-interview-experience-vv02w0gy", "https://eugeneyan.com/writing/system-design-for-discovery/", "https://www.anthropic.com/news/contextual-retrieval", "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "https://hamel.dev/blog/posts/llm-judge/", "https://www.canva.dev/blog/engineering/ai-interview-success/"]}, {"id": "wc32", "name": "The cache code review, out loud", "blurb": "The screen as candidates report it: a short cached function to review. Assumptions first, then each failure with an example and its fix.", "intro": "Mercor's caching screen, as three candidates describe it, hands you a few lines that check a cache, compute or await on a miss, and store the result, then asks what you would say in a code review. This session is that review: what you assume first, then concurrency, memory and failures, in the order the interviewer tends to probe.", "len": "50m", "day": "6", "steps": [{"t": "State your assumptions, then review in a fixed order", "m": 15, "out": "Someone hands you this function in a code review. What do you assume first, and what is wrong with it?", "d": "The function: cache = {}; def get(x): if x in cache: return cache[x]; v = compute(x); cache[x] = v; return v. compute is slow and sometimes fails. One reported version is JavaScript, with await inside a function that is not async and cache.set(key) with no value: bugs before any race. Say what you assume, then walk the same order every time: correctness on one caller, concurrency, memory, errors, staleness, visibility.", "pts": ["Assumptions: one process or many; threads, asyncio or both; how slow and costly compute is; whether it is pure (same input, same output); the read-to-write ratio; how stale an answer may be; whether x comes from a user", "One caller: right on a hit and on a miss? Read the code literally first. The reported JavaScript version is broken before any concurrency", "Concurrency: two callers miss the same key at once and both run compute. Twice the cost, and twice the side effect if compute writes anything", "Memory: the dict never evicts, so it grows with every distinct x until the process runs out, and it keeps every value alive", "Errors: if compute raises, nothing is stored and every caller retries at once; if a failure value is stored, it is served forever", "Staleness: nothing expires, so when the source changes the cache is wrong until the process restarts", "Keys: x must be hashable and normalised; unvalidated user input lets anyone fill memory with junk keys", "Visibility: no hit ratio, size or timing, so nobody can tell whether the cache helps"], "where": "PracHub: a candidate's report of this screen (the concurrency code review)", "url": "https://prachub.com/interview-experiences/mercor-software-engineer-interview-experience-a-product-focused-recruiter-screen-then-sorting-theory-and-a-concurrency-code-review", "ans": {"lead": "I'd say what I'm assuming, then go through correctness, concurrency, memory, errors and staleness, with a concrete failure for each.", "pts": ["Assumptions: I'd ask whether this runs in one process or across many, threads or asyncio, how expensive compute is, and how stale an answer can be. The fixes depend on those.", "Concurrency: two requests that miss the same key at the same time both run compute, so the expensive call runs twice, and if it has side effects they happen twice.", "Memory: nothing is ever evicted, so the dict grows with every new key until the process falls over.", "Errors: if compute throws, nothing is cached and every caller hits it again at once; there's no timeout either, so a hung call holds everyone.", "Staleness and visibility: nothing expires, and there's no hit ratio or size metric, so we can't tell if it's helping."], "close": "Then I'd fix them in that order: make the miss run once, bound the memory, handle failures, add a TTL and metrics."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/scaling-reads/cache-aside", "label": "Technique: Cache-aside (Redis)", "why": "The snippet is cache-aside in miniature: check, compute on a miss, fill."}], "read": [], "figs": [], "sheet": {"cheat": ["Assumptions first: one process or many, threads or asyncio, cost of compute, pure or not, read-to-write ratio, staleness allowed, user input or not.", "Then the same order every time: one caller, concurrency, memory, errors, staleness, visibility.", "One caller: read it literally. await in a non-async function, or a set with no value, is a bug before any race.", "Concurrency: two misses on one key both run compute: double cost, double side effects.", "Memory: a dict that never evicts grows with every distinct key and keeps every value alive.", "Errors: an exception stores nothing, so every caller retries at once; a stored failure is served forever.", "Staleness: no expiry means wrong forever once the source changes.", "Visibility: without hit ratio, size and timing, nobody knows if the cache helps."], "terms": [{"t": "Cache hit, cache miss", "mem": "Found it, or go and get it.", "d": "A hit returns a stored value; a miss means computing or fetching it from the source."}, {"t": "Pure function", "mem": "Same in, same out, nothing else touched.", "d": "A function whose result depends only on its inputs and that has no side effects; only these are safe to cache without care."}, {"t": "Side effect", "mem": "Something changes outside the function.", "d": "Any effect beyond the return value, such as a write, a payment or a message; running it twice does it twice."}, {"t": "Staleness", "mem": "Old, and still being served.", "d": "How far a cached value may lag the source; the tolerance is a product decision, stated per kind of data."}], "vis": [{"rule": "Say what you assume, then walk the same order every time: one caller, concurrency, memory, errors, staleness, visibility."}, {"title": "The snippet, with each problem pinned to its line", "code": "cache = {}\ndef get(x):\n    if x in cache:\n        return cache[x]\n    v = compute(x)\n    cache[x] = v\n    return v", "pins": [[1, "never evicts: grows with every new x, keeps every value alive"], [3, "check, then act: a second caller can miss in the gap"], [5, "slow and fallible: no timeout; if it raises, every caller retries at once"], [6, "no expiry: once the source changes, wrong until restart"]]}, {"title": "Ask before you judge", "parts": [["process?", "one or many"], ["threads?", "or asyncio"], ["compute", "cost, pure?"], ["reads : writes", "ratio"], ["staleness", "allowed?"], ["x", "from a user?"]]}]}}, {"t": "Two requests miss at once: make compute run once", "m": 20, "out": "Two requests miss the same key at the same moment. What happens, and how do you make compute run once without slowing every hit?", "d": "Check, then act, is two operations, so another caller can slip in between them. A lock fixes it, but where the lock sits decides whether hits stay fast. In CPython one dict get or one dict set is atomic under the GIL; the check and the set together are not. The same race happens in asyncio, at every await.", "pts": ["The race: A checks and misses, starts compute; B checks before A stores, misses, computes too", "One lock around the whole function: correct, but every hit queues behind a miss that takes seconds. The lock is too broad", "Lock only the miss and check again inside it: if hit, return; take the lock; if hit now, return; compute; store. That is double-checked locking", "Per-key locks: a slow miss on one key no longer blocks a miss on another. The map of locks needs its own guard and cleanup", "Share the work in flight: the first miss stores a future for x and the others wait on it. Go calls this singleflight; it is also called request coalescing", "asyncio: cache the Task, not the coroutine and not only the result. A coroutine can be awaited once; a Task can be awaited by every caller. Remove it if it fails", "functools.lru_cache keeps its own structure thread-safe, but its docs say the function can run more than once if a second call starts before the first finishes", "Across processes or hosts, a process lock does nothing: use the shared cache's atomic set-if-absent with an expiry, or a lease, so a crashed holder cannot block the key"], "where": "Python docs: functools, lru_cache (the note on calls running more than once); then the discussion on caching coroutines", "url": "https://docs.python.org/3/library/functools.html#functools.lru_cache", "ans": {"lead": "The check and the set aren't atomic together, so I'd lock only the miss, check again inside the lock, and share the in-flight result.", "pts": ["The race: both requests check, both miss, both compute. In Python a single dict operation is atomic, but check-then-set isn't.", "Lock placement: one lock around everything is correct but makes every hit wait behind a slow miss, so I'd lock only on the miss and re-check inside, double-checked locking.", "Per key: one lock per key, so a slow miss on one key doesn't block the others.", "In-flight sharing: better still, store a future for the key on the first miss and have everyone else await it. In asyncio that means caching the Task, and dropping it if it fails.", "Many processes: a process lock doesn't help across machines, so it'd be an atomic set-if-absent with an expiry in the shared cache, or a lease."], "close": "So compute runs once per key, hits never take a lock, and a crash can't hold a key forever."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/contention/distributed-lock", "label": "Technique: Distributed locks and leases with TTL", "why": "Once the cache is shared across processes, the lock around a miss becomes a lease with a TTL."}], "read": [], "figs": [], "sheet": {"cheat": ["Check-then-act is two steps: a second caller can miss between the check and the set.", "In CPython one dict get or set is atomic under the GIL; check plus set is not.", "One lock around everything is correct but makes every hit wait behind a slow miss.", "Double-checked locking: check, take the lock only on a miss, check again, compute, store.", "Per-key locks stop one slow key from blocking the others.", "Single-flight: the first miss stores a future; later callers await it. Compute runs once.", "asyncio: cache the Task, not the coroutine (a coroutine can be awaited once); drop the Task if it fails.", "lru_cache keeps its structure safe but may call the function twice for one key.", "Across hosts: set-if-absent with an expiry, or a lease; a process lock does nothing there."], "terms": [{"t": "Race condition", "mem": "Two callers, one gap, wrong outcome.", "d": "A bug where the result depends on how two concurrent operations interleave."}, {"t": "Check-then-act", "mem": "Looked empty, someone filled it meanwhile.", "d": "Deciding on a check and acting on it later, with nothing stopping the state changing in between."}, {"t": "Double-checked locking", "mem": "Check, lock, check again.", "d": "Checking without the lock, taking it only on a miss, and checking again inside before doing the work."}, {"t": "Single-flight", "mem": "One request in the air per key.", "d": "Duplicate calls for the same key share the result of the one call already in flight; also called request coalescing."}, {"t": "GIL", "mem": "One Python thread runs bytecode at a time.", "d": "CPython's global interpreter lock; it makes single dict operations atomic but not a sequence of them."}, {"t": "Task (asyncio)", "mem": "A coroutine already running, awaitable by many.", "d": "A scheduled coroutine; any number of callers can await the same Task and get its result."}], "vis": [{"title": "The race, in time", "lanes": [["A", [["check: miss", "plain"], ["compute (3 s)", "hot", "3"], ["set", "plain"]]], ["B", [["check: miss", "plain", "", "48px"], ["compute again", "hot", "3"], ["set", "plain"]]]], "note": "B checks before A has stored. One dict get or set is atomic under the GIL; the check and the set together are not."}, {"title": "The fixes, compared", "vs": {"cols": ["Correct", "Hits stay fast", "Runs once", "Across hosts"], "rows": [["One lock around all", "yes", "no: hits wait behind a slow miss", "yes", "no"], ["Lock the miss, check again", "yes", "yes", "yes", "no"], ["Per-key lock", "yes", "yes, and keys don't block each other", "yes", "no"], ["Share the in-flight future", "yes", "yes", "yes: everyone awaits one", "no"], ["Set-if-absent with expiry", "yes", "yes", "yes", "yes"]]}}, {"title": "In asyncio", "code": "inflight = {}\ndef get(x):\n    if x not in inflight:\n        inflight[x] = asyncio.ensure_future(compute(x))\n    return inflight[x]   # every caller awaits the same Task", "pins": [[4, "cache the Task, not the coroutine: a coroutine can be awaited once"], [5, "if it fails, remove it, or every caller gets the same exception"]]}]}}, {"t": "Bound the memory, and decide what a failure caches", "m": 15, "out": "This cache runs for a week in a busy service. What goes wrong with memory and with failures, and what do you change?", "d": "An unbounded cache is a slow memory leak, and a cache that stores failures turns one bad call into a week of bad answers. Bound it by count or by bytes, expire entries, and treat failures on purpose.", "pts": ["Bound it: a maximum size and an eviction policy. LRU drops the least recently used, LFU the least frequently used; Redis approximates LRU by sampling a few keys", "Bound by bytes when values vary: a thousand 1 KB entries and a thousand 10 MB entries are different caches", "TTL on every entry, so staleness has a limit and dead keys leave", "Do not store an exception as a value. Let the next caller retry, with backoff so a failing source is not hammered", "If failures are frequent and expensive, cache them briefly on purpose: negative caching, with its own short TTL", "In asyncio a failed Task stays failed: remove it from the cache when it raises, or every later caller gets the same exception", "Give compute a timeout, so a hung call releases its lock or its waiters", "Watch it: hit ratio = hits / (hits + misses), size, evictions, compute latency. Evictions rising while the hit ratio falls means the cache is too small"], "where": "Redis docs: key eviction (maxmemory, LRU against LFU, the hit ratio)", "url": "https://redis.io/docs/latest/develop/reference/eviction/", "ans": {"lead": "I'd cap it, expire it, and never let one failure get cached as the answer.", "pts": ["Bound: a max size with LRU eviction, or by bytes if values vary a lot.", "Expiry: a TTL on everything, so stale data and dead keys age out.", "Failures: don't cache the exception; retry with backoff, and if failures are frequent, cache them briefly with a short TTL on purpose.", "Timeouts: a timeout on compute, so a hung call doesn't hold its waiters.", "Metrics: hit ratio, size and evictions, so we know if the size is right."], "close": "Then the cache can run for a week without becoming the incident."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/scaling-reads/invalidation", "label": "Technique: Cache invalidation", "why": "A bound and a TTL are the two ways an entry leaves; invalidation is the third."}], "read": [], "figs": [], "sheet": {"cheat": ["Bound the size: LRU drops least recently used, LFU least frequently used.", "Bound by bytes when values vary in size.", "A TTL on every entry limits staleness and clears dead keys.", "Don't store an exception as a value; retry with backoff instead.", "Frequent, expensive failures: cache them briefly on purpose, with a shorter TTL (negative caching).", "A failed asyncio Task stays failed; remove it when it raises.", "A timeout on compute releases the lock and the waiters if the call hangs.", "Hit ratio = hits / (hits + misses). Evictions up and hit ratio down: the cache is too small."], "terms": [{"t": "Eviction", "mem": "Full, so something has to go.", "d": "Removing entries to stay within a size limit, chosen by a policy."}, {"t": "LRU", "mem": "Untouched longest, out first.", "d": "Least recently used: evicts the entry whose last access is oldest."}, {"t": "LFU", "mem": "Used least often, out first.", "d": "Least frequently used: evicts the entry with the fewest accesses, usually with counts that decay."}, {"t": "TTL", "mem": "A use-by date on every entry.", "d": "Time to live: how long an entry stays before it expires."}, {"t": "Negative caching", "mem": "Remember the no, briefly.", "d": "Storing 'not found' or a failure for a short time so repeated misses do not reach the source."}, {"t": "Hit ratio", "mem": "How often the cache answers.", "d": "hits / (hits + misses); with eviction counts, it tells you whether the cache is sized right."}], "vis": [{"title": "A week in a busy service", "split": [["Without a bound", ["memory grows until the process dies", "one failure cached is served all week", "a hung compute holds its waiters", "nobody knows the hit ratio"]], ["With one", ["max size, LRU or by bytes", "TTL on every entry", "failures not cached, or briefly on purpose", "timeout on compute; metrics on hits, size, evictions"]]]}, {"title": "Is it sized right?", "calc": [["hit ratio", "hits / (hits + misses)"], ["evictions ↑, hit ratio ↓", "too small"], ["hit ratio flat, memory ↑", "too big, or keys never reused"]]}]}}], "study": [], "quiz": [{"q": "In your own words: State your assumptions, then review in a fixed order.", "a": "I'd say what I'm assuming, then go through correctness, concurrency, memory, errors and staleness, with a concrete failure for each. Assumptions: I'd ask whether this runs in one process or across many, threads or asyncio, how expensive compute is, and how stale an answer can be. The fixes depend on those. Concurrency: two requests that miss the same key at the same time both run compute, so the expensive call runs twice, and if it has side effects they happen twice. Memory: nothing is ever evicted, so the dict grows with every new key until the process falls over. Errors: if compute throws, nothing is cached and every caller hits it again at once; there's no timeout either, so a hung call holds everyone. Staleness and visibility: nothing expires, and there's no hit ratio or size metric, so we can't tell if it's helping. Then I'd fix them in that order: make the miss run once, bound the memory, handle failures, add a TTL and metrics."}, {"q": "In your own words: Two requests miss at once: make compute run once.", "a": "The check and the set aren't atomic together, so I'd lock only the miss, check again inside the lock, and share the in-flight result. The race: both requests check, both miss, both compute. In Python a single dict operation is atomic, but check-then-set isn't. Lock placement: one lock around everything is correct but makes every hit wait behind a slow miss, so I'd lock only on the miss and re-check inside, double-checked locking. Per key: one lock per key, so a slow miss on one key doesn't block the others. In-flight sharing: better still, store a future for the key on the first miss and have everyone else await it. In asyncio that means caching the Task, and dropping it if it fails. Many processes: a process lock doesn't help across machines, so it'd be an atomic set-if-absent with an expiry in the shared cache, or a lease. So compute runs once per key, hits never take a lock, and a crash can't hold a key forever."}, {"q": "In your own words: Bound the memory, and decide what a failure caches.", "a": "I'd cap it, expire it, and never let one failure get cached as the answer. Bound: a max size with LRU eviction, or by bytes if values vary a lot. Expiry: a TTL on everything, so stale data and dead keys age out. Failures: don't cache the exception; retry with backoff, and if failures are frequent, cache them briefly with a short TTL on purpose. Timeouts: a timeout on compute, so a hung call doesn't hold its waiters. Metrics: hit ratio, size and evictions, so we know if the size is right. Then the cache can run for a week without becoming the incident."}], "hasTrackerQuiz": false, "figs": [], "nlm": ["https://prachub.com/interview-experiences/mercor-software-engineer-interview-experience-a-product-focused-recruiter-screen-then-sorting-theory-and-a-concurrency-code-review", "https://docs.python.org/3/library/functools.html", "https://redis.io/docs/latest/develop/reference/eviction/", "https://www.youtube.com/watch?v=UoDCrVjTD94", "https://aws.amazon.com/builders-library/caching-challenges-and-strategies/", "https://www.youtube.com/watch?v=wh98s0XhMmQ", "https://www.youtube.com/watch?v=OYZCcVbKCKE", "https://www.youtube.com/watch?v=1NngTUYPdpI", "https://github.com/donnemartin/system-design-primer", "https://www.youtube.com/watch?v=L9TfZdODuFQ", "https://www.youtube.com/watch?v=i7twT3x5yv8", "https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside", "https://cseweb.ucsd.edu/~avattani/papers/cache_stampede.pdf", "https://builder.aws.com/content/3K9TeXp6strMiJ4vhakpRD7BQWO/caching-challenges-and-strategies", "https://aws.amazon.com/caching/best-practices/", "https://www.usenix.org/system/files/conference/nsdi13/nsdi13-final170_update.pdf", "https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html"]}, {"id": "wc33", "name": "Caching under load: stale data, stampedes, failure", "blurb": "As the workload grows: the write that leaves a stale value forever, the hot key that expires, many processes, and what happens when the cache or the source fails.", "intro": "The brief says correctness, performance and reliability as workloads grow and requests run concurrently. Week 5 gave you placement, keys and TTL against invalidation. This session is what breaks once there are many requests, many processes and a database behind it.", "len": "1h", "day": "7", "steps": [{"t": "The write that leaves a stale value cached forever", "m": 15, "out": "With cache-aside, how can a stale value end up in the cache forever, and how do you prevent it?", "d": "Cache-aside: read the cache; on a miss read the database and fill the cache; on a write, update the database and remove the key. The order of those operations, and a reader that is slow, decide whether old data can win.", "pts": ["Delete the key on a write rather than updating it: deletes are idempotent, and two concurrent updates can land in the wrong order", "Write the database first, then invalidate. Invalidate first and a reader can refill the old value before the write commits", "The race that remains: reader R misses and reads the old row; writer W commits and deletes the key; R then stores the old value. It stays until it expires", "A TTL makes 'forever' at most one TTL", "Leases, from Facebook's memcache: a miss gets a token, a delete cancels the token, and a set with a cancelled token is refused, so R's late write is dropped", "Versions: store a version with the value and refuse to overwrite a newer one", "Read your own writes: the user who just saved expects to see it; read through to the database for that user for a moment", "Say the tolerance out loud: stale by a few seconds is fine for a dashboard, never for a balance or a permission"], "where": "Azure Architecture Center: cache-aside pattern; then Facebook, Scaling Memcache (NSDI 2013), section 3.2.1 Leases", "url": "https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside", "ans": {"lead": "A slow reader can put an old value back after the writer deletes it; I'd bound it with a TTL and stop it with a lease or a version check.", "pts": ["The pattern: write the database, then delete the key. Delete, not update, because deletes are idempotent.", "The race: a reader misses and reads the old row, the writer commits and deletes, then the reader sets the old value back, and it stays.", "Bound it: a TTL means it's wrong for at most one TTL.", "Stop it: a lease, like Facebook's memcache, where the delete invalidates the reader's token so its late set is refused; or a version on the value.", "Tolerance: I'd ask how stale is acceptable; for balances or permissions I'd read from the source."], "close": "Order of operations plus a TTL handles most of it; leases or versions close the rest."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/scaling-reads/invalidation", "label": "Technique: Cache invalidation", "why": "The stale write is the race that delete-on-write invalidation has to survive."}], "read": [], "figs": [], "sheet": {"cheat": ["Cache-aside: read the cache; on a miss, read the database and fill; on a write, update the database, then delete the key.", "Delete rather than update: deletes are idempotent; concurrent updates can land out of order.", "Database first, then invalidate; the other order lets a reader refill the old value.", "Remaining race: reader reads old row, writer commits and deletes, reader sets old value. It stays until it expires.", "TTL bounds it; a lease (token cancelled by the delete) or a version check stops it.", "Read your own writes: read through to the database for the user who just wrote.", "Say the tolerance: a few seconds is fine for a dashboard, never for a balance or a permission."], "terms": [{"t": "Cache-aside", "mem": "The app fetches and fills.", "d": "The application reads the cache, loads from the source on a miss and fills the cache; writes go to the source and invalidate the key."}, {"t": "Invalidation", "mem": "Throw the old copy away.", "d": "Removing or expiring a cached entry because the source changed."}, {"t": "Lease", "mem": "A ticket to write back, cancelled by any delete.", "d": "A token handed out on a miss; a set must present it, and a delete in between cancels it, so a late stale set is refused."}, {"t": "Read-your-writes", "mem": "I saved it, so I see it.", "d": "The guarantee that a user's own write is visible to that user's next read."}, {"t": "Idempotent", "mem": "Twice is the same as once.", "d": "An operation whose repeated application has the same effect as applying it once, like a delete."}], "vis": [{"title": "How the old value wins", "lanes": [["Reader", [["miss", "plain"], ["reads old row", "plain", "2"], ["", "gap", "2"], ["sets OLD value", "hot", "2"]]], ["Writer", [["", "gap", "2", "40px"], ["commits new row", "done", "2"], ["deletes key", "done"]]]], "note": "The reader's late set lands after the delete. The stale value stays until it expires."}, {"title": "What stops it", "vs": {"cols": ["What it does", "Cost"], "rows": [["TTL", "'forever' becomes at most one TTL", "more misses"], ["Write DB, then delete", "deletes are idempotent; order matters", "one round trip"], ["Lease", "a delete cancels the reader's token; the late set is refused", "a token per miss"], ["Version", "never overwrite a newer version", "a version on every value"]]}}]}}, {"t": "A hot key expires: the stampede, and how to stop it", "m": 15, "out": "A popular key expires under heavy load. What happens to the database, and what are three ways to stop it?", "d": "When a hot key expires, every request misses together and goes to the source. The size of the burst is the request rate times the recompute time: 10 requests a second and a 3 second recompute give 30 recomputes of the same thing.", "pts": ["Coalesce: one recompute per key, the rest wait for it (the single-flight from the code review)", "Serve stale while one caller refreshes: a soft TTL starts a background refresh, a hard TTL is the real limit", "Refresh early, at random: XFetch recomputes before expiry with a probability that rises as expiry nears, so one request refreshes ahead of the crowd", "Jitter the TTL: entries filled together expire together; add a few percent at random so expiries spread out", "A refresh lock needs its own expiry, or a holder that dies blocks the key", "Facebook throttled with leases too: one token per key every 10 seconds, the rest wait or take a slightly stale value; peak database queries fell from 17K a second to 1.3K"], "where": "Vattani, Chierichetti and Lowenstein, Optimal Probabilistic Cache Stampede Prevention (VLDB 2015)", "url": "https://cseweb.ucsd.edu/~avattani/papers/cache_stampede.pdf", "ans": {"lead": "Every request misses together and hits the database; I'd coalesce, serve stale while one request refreshes, and jitter the TTLs.", "pts": ["The burst: request rate times recompute time. Ten a second and a three-second recompute is thirty identical queries.", "Coalesce: one recompute per key; everyone else waits on it.", "Stale while refreshing: a soft TTL triggers a background refresh while the old value is still served.", "Spread expiries: jitter on TTLs, or refresh early with a probability that rises near expiry.", "Locks expire: whatever guards the refresh needs a timeout of its own."], "close": "The database should see one query per hot key per refresh, not one per request."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/scaling-reads/hot-keys", "label": "Technique: Hot-key handling", "why": "A stampede is a hot key expiring; the guide's fixes are coalescing and early refresh."}], "read": [], "figs": [], "sheet": {"cheat": ["Stampede: a hot key expires and every request misses together.", "Burst size ≈ request rate × recompute time: 10 per second × 3 s = 30 recomputes.", "Coalesce: one recompute per key; the rest wait.", "Soft TTL serves stale and refreshes in the background; the hard TTL is the limit.", "XFetch refreshes early with a probability that rises as expiry nears.", "Jitter the TTL so entries filled together do not expire together.", "A refresh lock needs its own expiry.", "Facebook's lease throttle: one token per key per 10 s; peak database load fell from 17K/s to 1.3K/s."], "terms": [{"t": "Cache stampede", "mem": "Everyone runs to the database at once.", "d": "Many concurrent misses on one expired key, all recomputing it; also called a thundering herd or dogpile."}, {"t": "Soft TTL", "mem": "Past its best, still served while one refreshes.", "d": "An age after which a value is refreshed in the background but still returned, until a hard TTL."}, {"t": "Stale-while-revalidate", "mem": "Answer now, update behind.", "d": "Serving the old value while one request fetches the new one."}, {"t": "TTL jitter", "mem": "Shake the use-by dates.", "d": "Adding a small random amount to each TTL so expiries spread out instead of arriving together."}, {"t": "Probabilistic early expiration", "mem": "Refresh early, by a coin whose odds rise.", "d": "Recomputing before expiry with a probability that grows as expiry nears (XFetch), so one request refreshes ahead of the crowd."}], "vis": [{"rule": "A hot key expires and every request misses at once."}, {"title": "How big the burst is", "calc": [["burst", "request rate × recompute time"], ["10 / s × 3 s", "30 identical recomputes"], ["Facebook, with leases", "17K/s peak → 1.3K/s"]]}, {"title": "Four ways out", "flow": ["coalesce: one recompute per key", "serve stale, refresh behind (soft TTL)", "refresh early at random (XFetch)", "jitter TTLs so expiries spread"], "note": "Any lock that guards a refresh needs its own expiry."}]}}, {"t": "Many processes and hosts: where the cache lives", "m": 15, "out": "The service now runs as twenty processes on five machines. What changes about the cache?", "d": "A cache in process memory is the fastest and the most duplicated. A shared cache is one copy behind a network hop. Most systems that grow end up with both, and the cache becomes a resource to manage like any other.", "pts": ["In-process: nanoseconds, but twenty copies: twenty misses per key, twenty times the memory, and an invalidation has to reach all of them", "Shared (Redis, Memcached): one copy, about half a millisecond away in the same data centre, survives deploys, and needs its own capacity and failure plan", "Two tiers: a small local cache with a short TTL in front of the shared one, for the hottest keys", "Hot key: one key takes a large share of traffic and saturates one cache node; a local tier, replicas, or splitting it into key#0 to key#N spreads it", "Locks across machines: an atomic set-if-absent with an expiry, or a lease; add a fencing token if a holder that lost the lock could still write", "Connections are a resource: a bounded pool, a timeout to borrow one, never a new connection per request"], "where": "AWS Builders' Library: caching challenges and strategies (local against external caches)", "url": "https://builder.aws.com/content/3K9TeXp6strMiJ4vhakpRD7BQWO/caching-challenges-and-strategies", "ans": {"lead": "Twenty in-process caches mean twenty copies to keep in sync, so I'd move to a shared cache with a small local tier for hot keys.", "pts": ["Local: fastest, but every process misses separately and invalidation has to reach all of them.", "Shared: one copy, about half a millisecond away, survives deploys, but it's now a service with its own capacity and failures.", "Both: a small local cache with a short TTL in front, for hot keys.", "Locks: a process lock doesn't cross machines; set-if-absent with an expiry, or a lease.", "Resources: a bounded connection pool with a borrow timeout."], "close": "Which one depends on how stale each process may be, and how hot the hottest key is."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/scaling-reads/cache-aside", "label": "Technique: Cache-aside (Redis)", "why": "Where the cache lives decides who can invalidate it."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/contention/distributed-lock", "label": "Technique: Distributed locks and leases with TTL", "why": "SET NX with an expiry, and a fencing token for the stale holder."}], "read": [], "figs": [], "sheet": {"cheat": ["In-process: nanoseconds, but one copy per process: N misses, N times the memory, invalidation must reach all.", "Shared cache: one copy, about 0.5 ms away in the same data centre, survives deploys, has its own failures.", "Two tiers: a small local cache with a short TTL in front of the shared one.", "Hot key: one key saturates one node; spread it with a local tier, replicas, or key#0 to key#N.", "Locks across machines: set-if-absent with an expiry, or a lease; a fencing token if a stale holder could still write.", "Connections: a bounded pool, a borrow timeout, never one connection per request."], "terms": [{"t": "Local (in-process) cache", "mem": "In my own memory, only mine.", "d": "A cache inside one process: fastest, but duplicated in every process."}, {"t": "Shared cache", "mem": "One copy, one hop away.", "d": "A separate service such as Redis or Memcached that every process reads; consistent across processes at the cost of a network call."}, {"t": "Hot key", "mem": "One key doing most of the work.", "d": "A key taking a disproportionate share of traffic, enough to overload the node that holds it."}, {"t": "Fencing token", "mem": "A number that only goes up.", "d": "A counter issued with a lock; the store rejects writes carrying an older number, so a holder that lost the lock cannot write."}, {"t": "Connection pool", "mem": "A fixed set of lines, borrowed and returned.", "d": "A bounded set of reusable connections; borrowers wait, with a timeout, when all are in use."}], "vis": [{"title": "Where the cache lives", "vs": {"cols": ["In-process", "Shared (Redis)", "Both"], "rows": [["Speed", "nanoseconds", "about 0.5 ms", "local hit, else shared"], ["Copies", "one per process", "one", "small local + one"], ["Invalidation", "must reach every process", "one place", "short local TTL"], ["Survives a deploy", "no", "yes", "shared part does"], ["Watch for", "N misses per key", "hot key on one node", "staleness of the local copy"]]}}, {"title": "Locks and connections across machines", "parts": [["SET key NX", "atomic set-if-absent"], ["EX 30", "the lock expires"], ["fencing token", "rejects a stale holder"], ["pool max", "bounded connections"], ["borrow timeout", "never wait forever"]]}]}}, {"t": "When the cache or the source fails", "m": 15, "out": "The cache cluster restarts during peak traffic. What happens, and how should the system behave?", "d": "A cache changes how much traffic the source is built for. With a 95% hit ratio the database sees 5% of requests; lose the cache and it sees all of them, 1 / (1 − 0.95) = 20 times its normal load. Design for that moment.", "pts": ["The cache is an optimisation, not a dependency: on a cache error, fall back to the source, but with a limit (a semaphore or load shedding) and a timeout on the cache call", "Warm a new cache node before it takes traffic, and restart cache nodes one at a time", "Negative caching: remember 'not found' briefly, with its own shorter TTL, so missing keys do not hit the source every time; DNS does this", "Source down: serve stale if correctness allows, with a cap on how stale; otherwise fail fast with a circuit breaker instead of queueing", "Retries with backoff and jitter, never a tight loop; an idempotency key on anything that writes", "Know your two numbers: the hit ratio, and the load the source survives without the cache"], "where": "AWS Builders' Library, same article: the sections on modal behaviour and negative caching", "url": "https://builder.aws.com/content/3K9TeXp6strMiJ4vhakpRD7BQWO/caching-challenges-and-strategies", "ans": {"lead": "At a 95% hit ratio, losing the cache sends the database twenty times its normal load, so the fallback has to be limited.", "pts": ["The jump: the database was sized for 5% of traffic and suddenly gets 100%.", "Fallback with a limit: go to the source on a cache failure, but through a concurrency limit, shedding the rest.", "Restarts: warm new nodes and restart one at a time.", "Source failing: serve stale within a cap, or fail fast behind a circuit breaker; retries with backoff and jitter.", "Negative caching: cache 'not found' briefly so missing keys don't hammer the source."], "close": "A cache should make the system faster, never the only reason it stays up."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/reliability/degradation", "label": "Technique: Graceful degradation", "why": "Cache down: fall back to the source through a limit, serve stale if allowed."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/reliability/timeouts-retries", "label": "Technique: Timeouts, retries, backoff, jitter", "why": "Retries with backoff and jitter, so the recovery is not a second stampede."}], "read": [], "figs": [], "sheet": {"cheat": ["Load on the source = 1 − hit ratio. At 95%, losing the cache means 1 / 0.05 = 20 times normal load.", "The cache is an optimisation, not a dependency: fall back to the source through a concurrency limit, and time out the cache call.", "Warm new nodes before traffic; restart cache nodes one at a time.", "Negative caching with a short TTL keeps missing keys off the source.", "Source down: serve stale within a cap, or fail fast with a circuit breaker.", "Retries with backoff and jitter; idempotency keys on writes.", "Know two numbers: the hit ratio, and the load the source survives without the cache."], "terms": [{"t": "Modal behaviour", "mem": "Two modes: cached, and suddenly not.", "d": "A system that behaves very differently when the cache is cold or down, because the source was sized for the cached mode."}, {"t": "Load shedding", "mem": "Drop some to save the rest.", "d": "Rejecting part of the traffic on purpose so the remaining requests are served."}, {"t": "Circuit breaker", "mem": "Stop calling what keeps failing.", "d": "After repeated failures, calls fail immediately for a while instead of waiting on a broken dependency."}, {"t": "Cache warming", "mem": "Fill it before the crowd arrives.", "d": "Loading likely keys into a cache before it takes live traffic."}, {"t": "Backoff with jitter", "mem": "Wait longer each time, not in step.", "d": "Retrying after growing, randomised delays so clients do not retry in synchronised waves."}], "vis": [{"title": "What the source suddenly sees", "ladder": [["5%", "of traffic, with a 95% hit ratio", "what the database is sized for"], ["100%", "when the cache is cold or down", "1 / (1 − 0.95) = 20× the load"]]}, {"title": "Behave on purpose", "flow": ["cache error", "fall back to the source", "through a concurrency limit", "shed the rest", "serve stale if allowed"], "note": "Warm new cache nodes before traffic, restart them one at a time; negative-cache 'not found' briefly; retry with backoff and jitter."}]}}], "study": [], "quiz": [{"q": "In your own words: The write that leaves a stale value cached forever.", "a": "A slow reader can put an old value back after the writer deletes it; I'd bound it with a TTL and stop it with a lease or a version check. The pattern: write the database, then delete the key. Delete, not update, because deletes are idempotent. The race: a reader misses and reads the old row, the writer commits and deletes, then the reader sets the old value back, and it stays. Bound it: a TTL means it's wrong for at most one TTL. Stop it: a lease, like Facebook's memcache, where the delete invalidates the reader's token so its late set is refused; or a version on the value. Tolerance: I'd ask how stale is acceptable; for balances or permissions I'd read from the source. Order of operations plus a TTL handles most of it; leases or versions close the rest."}, {"q": "In your own words: A hot key expires: the stampede, and how to stop it.", "a": "Every request misses together and hits the database; I'd coalesce, serve stale while one request refreshes, and jitter the TTLs. The burst: request rate times recompute time. Ten a second and a three-second recompute is thirty identical queries. Coalesce: one recompute per key; everyone else waits on it. Stale while refreshing: a soft TTL triggers a background refresh while the old value is still served. Spread expiries: jitter on TTLs, or refresh early with a probability that rises near expiry. Locks expire: whatever guards the refresh needs a timeout of its own. The database should see one query per hot key per refresh, not one per request."}, {"q": "In your own words: Many processes and hosts: where the cache lives.", "a": "Twenty in-process caches mean twenty copies to keep in sync, so I'd move to a shared cache with a small local tier for hot keys. Local: fastest, but every process misses separately and invalidation has to reach all of them. Shared: one copy, about half a millisecond away, survives deploys, but it's now a service with its own capacity and failures. Both: a small local cache with a short TTL in front, for hot keys. Locks: a process lock doesn't cross machines; set-if-absent with an expiry, or a lease. Resources: a bounded connection pool with a borrow timeout. Which one depends on how stale each process may be, and how hot the hottest key is."}, {"q": "In your own words: When the cache or the source fails.", "a": "At a 95% hit ratio, losing the cache sends the database twenty times its normal load, so the fallback has to be limited. The jump: the database was sized for 5% of traffic and suddenly gets 100%. Fallback with a limit: go to the source on a cache failure, but through a concurrency limit, shedding the rest. Restarts: warm new nodes and restart one at a time. Source failing: serve stale within a cap, or fail fast behind a circuit breaker; retries with backoff and jitter. Negative caching: cache 'not found' briefly so missing keys don't hammer the source. A cache should make the system faster, never the only reason it stays up."}], "hasTrackerQuiz": false, "figs": [], "nlm": ["https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside", "https://cseweb.ucsd.edu/~avattani/papers/cache_stampede.pdf", "https://builder.aws.com/content/3K9TeXp6strMiJ4vhakpRD7BQWO/caching-challenges-and-strategies", "https://prachub.com/interview-experiences/mercor-software-engineer-interview-experience-a-product-focused-recruiter-screen-then-sorting-theory-and-a-concurrency-code-review", "https://docs.python.org/3/library/functools.html", "https://redis.io/docs/latest/develop/reference/eviction/", "https://aws.amazon.com/builders-library/caching-challenges-and-strategies/", "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/", "https://aws.amazon.com/caching/best-practices/", "https://www.usenix.org/system/files/conference/nsdi13/nsdi13-final170_update.pdf", "https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html"]}, {"id": "wc34", "name": "Caching LLM calls, and the caches you've run", "blurb": "What goes in the key when the expensive call is a model, and the real caches at alfred_ told as stories with what you would fix.", "intro": "Mercor Enterprise deploys agents for its customers, and your interviewer works in applied AI. Expect the snippet's compute to become a model call. This session is the key design for LLM and embedding caches, then your own caches at alfred_, so every point has a real example behind it.", "len": "45m", "day": "8", "steps": [{"t": "What goes in the key for an LLM or embedding cache", "m": 20, "out": "compute(x) is now an LLM call. What goes in the cache key, what must never be cached, and how do you invalidate when the prompt changes?", "d": "An LLM cache is only correct if the key holds everything that changes the answer. Two caches get confused: your own response cache, and the provider's prompt cache, which caches a prompt prefix, not an answer.", "pts": ["Key = everything that changes the output: model and version, system prompt version, tools, parameters (temperature, max tokens), the normalised input, and the tenant or user when the answer is per-user", "Invalidate by version: put the prompt and model version in the key, so a change is a miss, not a purge", "Temperature above 0, or an LLM judge, gives a new sample each time; a cache freezes one. For evaluations, decide whether that is what you want", "Exact against semantic: a semantic cache matches similar inputs by embedding distance and a threshold; it hits more often but can serve a wrong answer, and similar questions from two users may need different answers", "Never share across tenants: anything that changes the answer but is not in the key serves one customer's answer to another; web cache poisoning is the same mistake", "Provider prompt caching: the provider reuses a cached prefix (Anthropic orders it tools, system, messages; a hit needs an exact match up to the breakpoint; 5 minute TTL, refreshed on use). Stable text first, timestamps after the breakpoint", "Embeddings: key by a hash of the content and the embedding model; re-embed only when the hash changes"], "where": "Anthropic docs: prompt caching; then GPTCache's README on semantic caching and its false positives", "url": "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "ans": {"lead": "The key has to include everything that changes the answer, the model, prompt version, parameters, input and tenant, or the cache serves wrong answers fast.", "pts": ["The key: model and version, prompt version, tools, temperature and other parameters, the normalised input, and the tenant if the answer is per-user.", "Invalidation: versions in the key, so changing the prompt is just a miss.", "What not to cache: per-user or sensitive answers across tenants, and anything where you want a fresh sample, like an eval run at temperature above zero.", "Semantic caching: more hits, but false positives, so I'd only use it with a tight threshold and an exact-match fallback.", "Prompt caching: separately, I put the stable system prompt and tools first so the provider's prefix cache hits."], "close": "Exact-match on a versioned key first; semantic only where a near-miss answer is acceptable."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/llm-cost/response-cache", "label": "Technique: Response and semantic caching", "why": "Your own response cache: the key has to cover everything that changes the answer."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/llm-cost/prompt-cache", "label": "Technique: Prompt caching", "why": "The provider's prefix cache, a different thing with a different key."}], "read": [], "figs": [], "sheet": {"cheat": ["Key = model and version, prompt version, tools, parameters, normalised input, and tenant when the answer is per-user.", "Versions in the key: a prompt change is a miss, not a purge.", "Temperature above 0 or an LLM judge: a cache freezes one sample. Decide if that is wanted.", "Semantic cache: embedding distance under a threshold counts as a hit; more hits, and false positives.", "Never share across tenants: an input that changes the answer but is not in the key leaks answers.", "Prompt caching is the provider's prefix cache: tools, system, messages; exact match to the breakpoint; 5 min TTL refreshed on use.", "Embeddings: key by content hash and model; re-embed only when the hash changes."], "terms": [{"t": "Response cache", "mem": "Same question, saved answer.", "d": "Your own store of model outputs keyed by everything that determines them."}, {"t": "Prompt caching", "mem": "The provider remembers the start of the prompt.", "d": "A provider feature that reuses the processed prefix of a prompt; it saves cost and latency but does not cache the answer."}, {"t": "Semantic cache", "mem": "Close enough counts as a hit.", "d": "A cache that returns a stored answer for an input whose embedding is within a threshold of a stored one."}, {"t": "False positive (cache)", "mem": "A hit with the wrong answer.", "d": "A semantic match that returns an answer meant for a different question."}, {"t": "Cache poisoning", "mem": "One bad entry served to everyone.", "d": "A harmful or wrong response stored under a key that others share, often because an input that changes the response is left out of the key."}, {"t": "Content hash", "mem": "A fingerprint of the text.", "d": "A hash of the content used as part of a key, so a change in content means a new key."}], "vis": [{"title": "Anatomy of the key", "parts": [["model@version", "which model"], ["prompt v7", "a change is a miss"], ["tools", "hash of definitions"], ["temp, max_tokens", "parameters"], ["normalised input", "the question"], ["tenant", "never share across", true]]}, {"split": [["Safe to cache", ["temperature 0, versioned key", "per-tenant key for per-user answers", "embeddings keyed by content hash and model", "exact match first"]], ["Careful", ["temperature above 0: freezes one sample", "LLM judge in evals: hides variance", "semantic match: false positives", "anything that changes the answer but isn't in the key"]]]}, {"title": "Two different caches", "vs": {"cols": ["Your response cache", "Provider prompt caching"], "rows": [["Stores", "the answer", "the processed prompt prefix"], ["Hit needs", "the same key", "an exact prefix: tools, system, messages"], ["Lives", "as long as you set", "about 5 minutes, refreshed on use"], ["Saves", "the whole call", "input cost and latency"]]}}]}}, {"t": "Your caches at alfred_, as stories", "m": 25, "out": "Tell me about a caching problem you've dealt with in production.", "d": "Read from the alfred_ code on 19 October 2026 (the edge-function checkout read was last updated 7 August, so confirm anything you will name, and which of these you built yourself). Every cache below lives in one instance's memory; nothing is shared across instances, and there is no Redis. Tell each as: what it caches, the risk, the fix.", "pts": ["Token reuse: OAuth access tokens are reused until a few minutes before expiry. Per-user mail tokens refresh with no lock, so two workers can refresh the same token at once. Fix: a per-user lease, or a compare-and-set on the stored token", "Single-flight, in practice: the Outlook calendar list shares one in-flight request between concurrent callers, with a 30 second TTL, added because concurrent calls hit Microsoft's concurrency limit and came back as 503s", "Unbounded maps: some per-instance maps (feature flags per user, 60 seconds; thread metadata, 5 minutes) only remove an entry when it is read again, with no size cap, so a warm instance grows. Fix: a bounded LRU", "One done right: the attachment cache keeps 30 minutes, at most 80 entries, and skips anything over 300K characters", "A deliberate negative cache: if the subscriber lookup fails, 'unknown' is cached for 60 seconds and every event is published. Availability over precision, on purpose", "Embedding skip: notes are re-embedded only when a chunk's content hash changes", "Prompt caching on the agent's model calls: stable system prompt and tools first, marked cacheable, 5 minute TTL", "What is not there: no shared cache across instances. Say when you would add one: shared tokens and rate limits across instances"], "ans": {"lead": "The one I'd tell is the Outlook calendar: concurrent requests were hitting Microsoft's concurrency limit, so we share one in-flight request between callers.", "pts": ["The problem: several parts of the app asked for the same user's calendar list at the same moment, and Microsoft started returning 503s for too many concurrent requests.", "The fix: the first caller makes the request and stores the promise; anyone who asks in the meantime awaits the same one, and the result is kept for 30 seconds.", "What I'd still fix: our per-user mail tokens refresh without a lock, so two workers can refresh the same token at once; I'd add a lease or a compare-and-set.", "And memory: a couple of our in-memory maps only expire on read with no size cap, so I'd make them bounded LRUs, like the attachment cache already is."], "close": "It's all per-instance memory today; if we needed shared tokens or rate limits across instances, that's when I'd add a shared cache."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/llm-cost/response-cache", "label": "Technique: Response and semantic caching", "why": "The model-call caches at alfred_ sit here."}], "read": [], "figs": [], "sheet": {"cheat": ["Every alfred_ cache is per-instance memory; nothing is shared; no Redis.", "Tokens: reused until minutes before expiry; per-user refresh has no lock, so two workers can refresh at once. Fix: a lease or compare-and-set.", "Outlook calendar list: one in-flight request shared by concurrent callers, 30 s TTL, added after Microsoft 503s for too many concurrent calls.", "Some maps expire only on read with no size cap; fix with a bounded LRU.", "The attachment cache does it right: 30 minutes, at most 80 entries, nothing over 300K characters.", "A deliberate negative cache: a failed subscriber lookup caches 'unknown' for 60 s and publishes everything.", "Notes are re-embedded only when a chunk's content hash changes; model calls use prompt caching.", "Confirm which of these you built before you name them."], "terms": [{"t": "Compare-and-set", "mem": "Write only if it is still what I read.", "d": "An atomic update that succeeds only if the current value matches the expected one; a safe way to refresh a shared token."}, {"t": "Fail open", "mem": "When unsure, let it through.", "d": "Choosing availability on an error, here publishing every event when the lookup fails."}, {"t": "Cold start", "mem": "A fresh instance knows nothing.", "d": "A new serverless instance with empty in-memory caches, so its first requests all miss."}], "vis": [{"title": "Your caches at alfred_: what, the risk, the fix", "vs": {"cols": ["What it does", "Risk", "Fix or point"], "rows": [["Outlook calendar", "one in-flight request shared, 30 s TTL", "it was added after Microsoft 503s", "single-flight, in production"], ["Mail tokens", "reused until minutes before expiry", "two workers refresh at once, no lock", "a lease or compare-and-set"], ["Per-user flag maps", "60 s TTL, expire only on read", "no size cap: grows", "a bounded LRU"], ["Attachments", "30 min, at most 80, skip > 300K chars", "none", "the one done right"], ["Subscriber lookup", "on failure, caches 'unknown' 60 s", "publishes everything", "fail open, on purpose"], ["Notes and model calls", "re-embed only on content-hash change; prompt caching", "none", "cost and latency"]]}, "note": "All per-instance memory; no Redis. Confirm which you built before you name them."}]}}], "study": [], "quiz": [{"q": "In your own words: What goes in the key for an LLM or embedding cache.", "a": "The key has to include everything that changes the answer, the model, prompt version, parameters, input and tenant, or the cache serves wrong answers fast. The key: model and version, prompt version, tools, temperature and other parameters, the normalised input, and the tenant if the answer is per-user. Invalidation: versions in the key, so changing the prompt is just a miss. What not to cache: per-user or sensitive answers across tenants, and anything where you want a fresh sample, like an eval run at temperature above zero. Semantic caching: more hits, but false positives, so I'd only use it with a tight threshold and an exact-match fallback. Prompt caching: separately, I put the stable system prompt and tools first so the provider's prefix cache hits. Exact-match on a versioned key first; semantic only where a near-miss answer is acceptable."}, {"q": "In your own words: Your caches at alfred_, as stories.", "a": "The one I'd tell is the Outlook calendar: concurrent requests were hitting Microsoft's concurrency limit, so we share one in-flight request between callers. The problem: several parts of the app asked for the same user's calendar list at the same moment, and Microsoft started returning 503s for too many concurrent requests. The fix: the first caller makes the request and stores the promise; anyone who asks in the meantime awaits the same one, and the result is kept for 30 seconds. What I'd still fix: our per-user mail tokens refresh without a lock, so two workers can refresh the same token at once; I'd add a lease or a compare-and-set. And memory: a couple of our in-memory maps only expire on read with no size cap, so I'd make them bounded LRUs, like the attachment cache already is. It's all per-instance memory today; if we needed shared tokens or rate limits across instances, that's when I'd add a shared cache."}], "hasTrackerQuiz": false, "figs": [], "nlm": ["https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "https://huyenchip.com/2024/07/25/genai-platform.html", "https://www.hellointerview.com/learn/system-design/in-a-hurry/delivery", "https://www.anthropic.com/news/contextual-retrieval", "https://eugeneyan.com/writing/system-design-for-discovery/", "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "https://hamel.dev/blog/posts/llm-judge/", "https://arxiv.org/abs/2509.25721", "https://arxiv.org/abs/2601.14242", "https://www.anthropic.com/engineering/multi-agent-research-system", "https://www.anthropic.com/engineering/building-effective-agents", "https://platform.claude.com/docs/en/docs/build-with-claude/prompt-caching", "https://techcrunch.com/2026/04/09/after-data-breach-10b-valued-startup-mercor-is-having-a-month", "https://arxiv.org/abs/2406.18665"]}], "scripts": [{"id": "intro", "title": "Tell me about yourself", "length": "about 45 seconds", "when": "Thirty minutes, so the short one. Then stop.", "probes": ["What do you own at alfred_?", "Which language do you work in day to day?"], "say": ["I'm currently a founding LLM engineer at alfred_, where I work across AI agent reliability, memory architecture, evaluation infrastructure, and automation for a product with 5,000-plus active users. A big part of my work has been taking ambiguous problems and building the systems underneath them that make AI actually work reliably in production.", "Before that, I worked at an early-stage startup called WheelPrice and did AI research at UIC. What I enjoy most is working across the stack, understanding a real problem, and building something that solves it end to end. That's what caught my attention about Mercor's Enterprise team — it combines applied AI engineering with customer problems, integrations, and ownership of the final outcome."], "swaps": [{"when": "If she asks your language", "line": "Python, mostly, and TypeScript for our edge functions and web app. I'll reason in Python today."}], "land": "Production AI reliability at alfred_, and why Enterprise: customer problems you own end to end.", "notes": ["Your words from INTRO.md, unchanged."]}, {"id": "why-mercor", "title": "Why Mercor?", "length": "about 30 seconds", "when": "If she asks; a technical screen may not.", "probes": ["Why Enterprise and not research?", "What do you know about Mercor Enterprise?"], "say": ["What interests me is that Mercor is going beyond building AI tools as The role also sits at the intersection of engineering, product, and customer needs, - I enjoy working most. I'd get to solve different problems, build production integrations, and turn what works for one customer into reusable systems for others. This hands-on engineering and direct business impact is particularly appealing to me."], "swaps": [{"when": "If she asks what you know", "line": "From what I read, Enterprise finds where agents pay off, deploys them with custom evaluations in the customer's tools, and keeps improving them live. The evaluation part is the work I do at alfred_."}], "land": "Engineering, product and customers in one role, and reusable systems out of one-off deployments.", "notes": ["Your words from INTRO.md, unchanged. The first sentence breaks off mid-way ('beyond building AI tools as The role also...'): finish it in your own words before Friday."]}, {"id": "leave", "title": "Why leave alfred_?", "length": "about 30 seconds", "when": "If asked.", "probes": [], "say": ["I’m not looking to leave because there’s something fundamentally wrong with alfred_. The reason I'm exploring is more about the direction I want to take my career", "I've learned a lot at alfred_ and have had the opportunity to own important parts of a production AI product from the ground up. I've gradually moved beyond just building agent features and into building the systems around the agent — evaluations, observability, memory, reliability", "I'm still there and not looking to leave just for the sake of moving. I'm exploring roles where I can apply that experience to a broader range of problems, work directly with customers, and grow as an engineer who can own both the technical solution and its business outcome. Mercor's Enterprise team seems particularly aligned with that."], "land": "Not away from alfred_; toward customers and ownership of the outcome.", "notes": ["Your words from INTRO.md, unchanged."]}, {"id": "logistics", "title": "Logistics they may ask", "length": "a line each", "when": "Unlikely in a technical screen. Your answers are in chat, not on this page.", "probes": ["In person five days a week in San Francisco?", "Start date?", "Work authorization?"], "say": [], "land": "One sentence each, then back to the work.", "notes": ["Location, relocation, start date and work authorization: your answers from chat."]}], "drills": [{"id": "review", "prompt": "Here's a function that caches an expensive call. What would you say in a code review?", "target": "2 minutes", "seconds": 120, "ref": "../index.html#/w/wc32"}, {"id": "stampede", "prompt": "A hot key expires under load. What happens, and how do you stop it?", "target": "90 seconds", "seconds": 90, "ref": "../index.html#/w/wc33"}, {"id": "navigate", "prompt": "In mock2_service: where is concurrency capped, where is order kept, and where is the stampede stopped? Go to each line.", "target": "3 minutes", "seconds": 180, "ref": "../index.html#/w/wc33"}, {"id": "intro", "prompt": "Tell me about yourself.", "target": "45 seconds", "seconds": 45, "ref": "#say-intro"}, {"id": "present", "prompt": "Present what you built: intent, the tradeoffs you made under time, what you cut and why, next steps.", "target": "8 minutes", "seconds": 480, "ref": "../index.html#/w/wc35"}, {"id": "search", "prompt": "Design a candidate search system with RAG. Open it: requirements, the shape, where it fails, how you would know it works.", "target": "5 minutes", "seconds": 300, "ref": "../index.html#/w/wc36"}, {"id": "complexity", "prompt": "State the time and space complexity of what you just wrote, and of the worst sort that still works.", "target": "2 minutes", "seconds": 120, "ref": "../index.html#/w/wc37"}], "qa": [{"group": "GTM round", "blurb": "Fifteen minutes with an Engagement Manager and a Principal, Enterprise AI. Pointers, not scripts: remember the bold line, then tell it your way. Session wc39 teaches each one.", "items": [{"q": "The four stories to have ready (yours, about 90 seconds each)", "short": "Four stories", "a": ["**A 30 to 60 second introduction.** Current role, the most relevant experience, one or two depth areas, why this role. Your intro on this page is the base.", "**A stakeholder story.** A time you listened, clarified what they needed, and changed course. Pick it from your work; tell it in your words.", "**A plain-language story.** A time you explained a technical constraint simply to a non-technical person.", "**An honest-no story.** A time you said no or reset expectations and kept their trust.", "**The shape for each:** situation in one sentence, task in one, action in two or three short sentences, a result with one number. Then close: 'Does that answer it?'"], "land": "Four stories, reused across questions, each about 90 seconds with one number.", "notes": ["These are prompts, not answers: each story has to be yours. Say 'capture' in chat with the story in your words and it goes in as you said it.", "Practise aloud with a 90-second timer; if one runs long, cut a point, do not speed up."], "id": "q-the-four-stories-to-have-ready-yours-about-90-seconds-each"}, {"q": "What do you know about Mercor Enterprise, and what would you improve in how it is sold or delivered?", "short": "Product sense on Enterprise", "learn": {"read": [{"url": "https://mercor.com/enterprise", "label": "Mercor Enterprise (the product page)", "why": "Discover, Deploy, Improve, Monetize in Mercor's own words. Read it once before the call."}, {"url": "https://www.youtube.com/watch?v=MtZTf-2JH2g", "label": "Learn Product Sense in 9 Minutes (DataInterview)", "why": "10 minutes. A frame for thinking about a product as its user would: user, pain, options, trade-off."}]}, "tests": "Did you learn the product, and can you think about it as a customer would.", "a": ["**Four parts, one loop.** Discover finds where agents pay off, Deploy puts them in the customer's tools with custom evaluations, Improve tunes them live, Monetize is opt-in data licensing.", "**Lead with one number.** The incident-response agent cut median time to mitigation by over 50%. Say 'they report'. It shows an evaluation-defined goal with an operational result.", "**Name the hard part.** Mercor's APEX-Agents work found models finish under 25% of long professional tasks, often failing on ambiguity and context. So a customer's messy real work is harder than a demo.", "**Then a customer's questions.** Who grades the agent, what happens when it is unsure, how does it stay good after launch. Ask them as questions, not as criticism."], "land": "I know the offer, one number, the real difficulty, and what a customer would ask.", "notes": ["No public report of this round exists. Mercor's figures are anonymised case studies on its Enterprise page; never present them as yours."], "id": "q-what-do-you-know-about-mercor-enterprise-and-what-would-you-"}, {"q": "A customer is unhappy: their agent was good last week and is making mistakes now. What do you do?", "short": "Quality dropped", "learn": {"read": [{"url": "https://www.youtube.com/watch?v=846ZWzRznjo", "label": "How to De-escalate Calls with Angry or Agitated Customers (Myra Golden)", "why": "8 minutes. Acknowledge the impact before you explain anything."}, {"url": "https://fde.academy/blog/forward-deployed-engineer-interview-questions", "label": "FDE Academy: forward deployed engineer interview questions (free to read)", "why": "The unhappy-customer scenarios: acknowledge first, then diagnose, and keep what you tell the client apart from what you fix."}]}, "tests": "Acknowledge, then diagnose, with a plan and a time.", "a": ["**Acknowledge first.** Say it is hitting their team and that you will have a first diagnosis by a time you name.", "**Three real examples.** Ask what worse means, when it started, and for the actual failures.", "**Replay before and after.** Your eval harness replays real traces: run the same cases and see whether quality moved or the input changed.", "**Say it in two tracks.** What you tell the customer, and what you do technically, at the same time."], "land": "Acknowledge, three examples, replay the same cases, report in plain words.", "id": "q-a-customer-is-unhappy-their-agent-was-good-last-week-and-is-"}, {"q": "How do you handle a stakeholder who wants something that will not solve their problem?", "short": "Handling a stakeholder", "learn": {"read": [{"url": "https://www.youtube.com/watch?v=16c_phbGgNE", "label": "What to Say When the Answer Is No (Myra Golden)", "why": "4 minutes. Agree with the goal, say what you can do, then the limit."}, {"url": "https://getperspective.ai/blog/forward-deployed-engineer-interview-questions-2026-prep-guide", "label": "Perspective AI: FDE interview questions, 2026 guide (free to read)", "why": "The 'customer demands a feature that will not solve their problem' question, and what interviewers grade: process over conclusion."}]}, "tests": "Can you say no without losing the person.", "a": ["**Agree with the goal.** Start from what they are trying to achieve, not from the feature.", "**Ask what sits behind it.** The request is often a guess at a solution.", "**Be honest about the risk.** An answer-anything box sounds sure and is sometimes wrong, and that loses trust.", "**Offer the version that works, with a number.** A smaller first step, sources shown, and a way to measure it."], "land": "I validate the goal, reframe the scope, and keep the relationship.", "id": "q-how-do-you-handle-a-stakeholder-who-wants-something-that-wil"}, {"q": "Tell me about a time you worked with a non-technical user.", "short": "A non-technical user", "learn": {"read": [{"url": "https://www.youtube.com/watch?v=-Y6YmuqGLpY", "label": "Forward Deployed Engineer Behavioral Mock Interview (Aced)", "why": "27 minutes. A real FDE answers behavioural questions; hear how a good story sounds when it is short and concrete."}, {"url": "https://www.aced.io/guides/cognition-forward-deployed-engineer-interview", "label": "Aced: Cognition FDE interview guide (account prompt on page)", "why": "What a simulated customer call tests: structure fast, plain words, stay calm on a surprise question."}]}, "tests": "Real empathy, a real example, plain words.", "a": ["**Everyday users, not engineers.** alfred_ has over 5,000 active users who talk to an assistant about email and calendar.", "**Plain-language rules.** About 98% of rules are made from chat. I added a check that warns when a new rule matches none of their recent mail.", "**Show the reason.** I built a read-only tool that answers why was I notified, so trust grows when a user can see why.", "**Say the limit.** It is a consumer product, not an enterprise engagement. What carries over is asking what they need and measuring it."], "land": "Plain-language rules, a check that warns, and a tool that explains why.", "notes": ["Add one real moment of your own: a user report or a non-technical teammate's question. If you have none, say so and use the tool you built; that is true."], "id": "q-tell-me-about-a-time-you-worked-with-a-non-technical-user"}, {"q": "How would you measure whether a pilot worked?", "short": "Measuring a pilot", "learn": {"read": [{"url": "https://www.youtube.com/watch?v=UlPn9GOCswE", "label": "5 Rules for Successful Startup Pilots, POCs, Trials (Dreamit)", "why": "8 minutes. Success criteria agreed before the pilot starts, and what happens after."}, {"url": "https://hamel.dev/blog/posts/evals/", "label": "Hamel Husain: Your AI Product Needs Evals (free to read)", "why": "Why an evaluation set is what lets you say a change made it better. Your eval harness story sits here."}]}, "tests": "Metrics, baseline, expansion rule.", "a": ["**Baseline first.** Measure how the work goes today, or the pilot proves nothing.", "**One outcome and one guardrail.** For example share handled without a person, and the errors that should not happen.", "**An evaluation set made with their experts.** It is what lets you say a change made it better. Mercor's HR case used 132 expert-graded runs.", "**Write the expansion and stop rule before you start.** When both numbers hold for two weeks, add the next request type."], "land": "Baseline, one outcome, one guardrail, and the rule written first.", "id": "q-how-would-you-measure-whether-a-pilot-worked"}, {"q": "What would you ask a new enterprise customer in the first meeting?", "short": "Discovery questions", "learn": {"read": [{"url": "https://www.youtube.com/watch?v=_DbSgU5naDQ", "label": "How To Run A Discovery Call (Patrick Dang)", "why": "12 minutes. Goal, current process, cost of the problem, who decides: the order of a first meeting."}, {"url": "https://fde.academy/blog/forward-deployed-engineer-interview-questions", "label": "FDE Academy: scoping and discovery scenarios (free to read)", "why": "Ask two or three targeted questions before proposing anything: success, owner, constraints, cost of failure."}]}, "tests": "Ask before solving.", "a": ["**The goal and who decides.** A named person, not a team.", "**One real case, start to finish.** Where it starts, who touches it, where it goes wrong, how long it takes.", "**What a wrong answer costs.** It sets how much a person must check.", "**What cannot change.** Data they cannot share, systems, security review, sign-off."], "land": "Goal, one real case, cost of a wrong answer, constraints.", "id": "q-what-would-you-ask-a-new-enterprise-customer-in-the-first-me"}, {"q": "Explain to a non-technical executive why an AI system gives a different answer to the same question.", "short": "Why the output varies", "learn": {"read": [{"url": "https://www.youtube.com/watch?v=EN8jVkv0kiw", "label": "Why Everyone Should Know About AI Evals (ByteByteGo)", "why": "9 minutes. Because wording varies, you test a fixed set of cases instead of trusting one run."}, {"url": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/increase-consistency", "label": "Anthropic docs: increase output consistency (free to read)", "why": "What makes outputs steadier: fixed formats, examples, grounding in retrieved facts. Matches your 'facts stable, wording free' line."}]}, "tests": "Plain words, an analogy from their world.", "a": ["**Say it is expected.** Not a bug.", "**Two good analysts.** Ask both the same question and the wording will differ.", "**Facts stable, wording free.** In your memory work the model picks from real items and code attaches names and owners.", "**Test a fixed set.** So you can see if the answers on the things that matter ever change."], "land": "Wording varies, facts should not, and here is how I check.", "id": "q-explain-to-a-non-technical-executive-why-an-ai-system-gives-"}]}, {"group": "Leadership chat", "blurb": "Why Mercor, why now, why leave, two years out, and pace. Built on your own words in INTRO.md and the scripts on this tab (Your story), which stay as you wrote them. Pointers to weave a story around.", "items": [{"q": "Why Mercor, and why now?", "short": "Why Mercor, why now", "learn": {"read": [{"url": "https://www.youtube.com/watch?v=x-4MewJpaso", "label": "Why Do You Want to Work Here? (Jeff Su)", "why": "9 minutes. Tie your past work to something specific about them, not praise."}, {"url": "https://mercor.com/enterprise", "label": "Mercor Enterprise (the product page)", "why": "Pick one thing here to name: custom evaluations tied to each client's quality bar."}]}, "tests": "Fit with Enterprise, and a reason for the timing.", "a": ["Your verbatim answer is in Your story, Why Mercor. These are the INTRO.md pointers to weave in.", "**Evaluations are the product here, and they are my core work.** I built the eval harness and the production-failure scanner. Mercor measures whether AI does real professional work.", "**Engineering, product and customer at once.** Finding where agents pay off, deploying them into real tools, improving them live. It is the vertical slice I already own, across many customers.", "**Reusable systems out of one-off deployments.** Turning each deployment into shared connectors and eval templates.", "**The stakes are real.** Reliability failures cost something, and that is where I get better fastest."], "land": "Evals at the centre, a slice I already own, many customers.", "notes": ["Why now: Enterprise is early and growing; ask them rather than assert it."], "id": "q-why-mercor-and-why-now"}, {"q": "Why leave alfred_?", "short": "Why leave", "learn": {"read": [{"url": "https://www.youtube.com/watch?v=QSPGdAvnUv4", "label": "Why Are You Leaving Your Current Job? (Jeff Su)", "why": "8 minutes. Pull toward, not push away; no criticism of the current place."}]}, "tests": "Pull toward, not push away.", "a": ["Your verbatim answer is in Your story, Why leave alfred_.", "**Nothing is wrong at alfred_.** I have owned real parts of a production AI product from early on and learned a lot.", "**From agent features to the systems around agents.** Evals, observability, memory, reliability. I want to apply that to many problems and customers, not one product.", "**Own the outcome with t
