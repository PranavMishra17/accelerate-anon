nding/shadow-online", "label": "Technique: Shadow mode and online signals", "why": "Shadow runs and online scoring are the second half of the evaluation answer."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/reliability/monitoring", "label": "Technique: Monitoring and completeness checks", "why": "Traces, dashboards and alerts on drift."}], "read": [{"label": "Chip Huyen: Building a generative AI platform, the stages as a skeleton", "url": "https://huyenchip.com/2024/07/25/genai-platform.html", "m": 25}, {"label": "Hello Interview: the delivery framework, a usable clock", "url": "https://www.hellointerview.com/learn/system-design/in-a-hurry/delivery", "m": 10}], "figs": [], "sheet": {"cheat": ["Requirements: who uses it, what a good answer is, what a bad one costs; ask for users, requests per second, data size, freshness, latency target.", "Scale in one line: say a number out loud so every choice is sized against it.", "Pipeline: draw the stages first (ingest, index, retrieve, rank, generate or score, check, return), then name tools.", "Per stage: latency, cost, failure, fallback.", "Offline eval: a labelled set and a metric that matches the product, run on every change.", "Online eval: score a sample of live traffic, watch overrides and corrections, shadow before rollout.", "Monitoring: a trace per request (inputs, retrieved items, prompt, model, output, latency, cost) and alerts on drift.", "Deployment: behind a flag, shadow, staged rollout; prompt, model and index versioned together.", "Close with the tradeoff you chose and what you would build next."], "terms": [{"t": "Offline evaluation", "mem": "Test on a fixed set before shipping.", "d": "Scoring the system on a labelled set of examples that does not change, so two versions can be compared fairly."}, {"t": "Online evaluation", "mem": "Watch it on real traffic.", "d": "Measuring quality on live requests, by scoring a sample or reading user signals such as clicks and overrides."}, {"t": "Shadow run", "mem": "Run it on real input, show nobody.", "d": "A new version processes live requests in parallel with the old one, and its output is recorded but not served."}, {"t": "Trace", "mem": "One request, every step, written down.", "d": "A record of a request's inputs, stage outputs, model and prompt versions, timings and cost, used to reproduce and debug an answer."}, {"t": "Fallback", "mem": "What the user gets when a stage fails.", "d": "A simpler path used when a stage is down or slow, such as returning the unranked list when the reranker fails."}], "vis": [{"rule": "Requirements and numbers, the pipeline, four questions per stage, evaluation, monitoring, deployment. Give a reason for every choice."}, {"title": "The generic AI pipeline", "flow": ["ingest and clean", "index", "retrieve", "rank", "generate or score", "check", "return"], "note": "Draw this before naming a tool. Each box then gets latency, cost, failure and fallback."}, {"title": "Four questions for every stage", "parts": [["latency", "budget out of the total"], ["cost", "per request, what grows"], ["failure", "what breaks, how you notice"], ["fallback", "what the user gets instead"]]}, {"title": "How you know it is good", "split": [["Offline", ["a labelled set of examples", "a metric that matches the product", "run on every change", "compare two versions fairly"]], ["Online", ["score a sample of live traffic", "watch overrides and corrections", "shadow run before rollout", "a trace for every request, alerts on drift"]]]}]}}, {"t": "Design 1: candidate search with RAG", "m": 30, "out": "Design a system where a recruiter types 'senior backend engineer with fintech experience in the Bay Area' and gets the best candidates from millions of resumes. Where does it go wrong, and how do you know it works?", "d": "This is the prompt candidates report most: 'to design Mercor, you need to design a candidate search system by leveraging RAG'. It is retrieval first, generation second. Resumes are messy, so parsing and normalising them decides the ceiling. Then retrieval has two jobs, finding by meaning and finding by exact term, so you combine both and rerank. Evaluation is a labelled set of queries with good candidates marked by recruiters.", "pts": ["Ingest: parse PDFs and docs to text, extract fields (titles, employers, dates, skills, location), normalise (Software Eng and SWE are one title; dates to a range), dedupe the same person arriving twice. Keep the raw file and the parsed record, so you can re-parse when the parser improves", "Chunking: a resume is short, so one record per person plus one chunk per role often beats fixed-size splits. Prepend context to each chunk (whose resume, which role), which is the idea behind contextual retrieval", "Hybrid retrieval: BM25 over text catches exact terms (a name, a certification, 'Kubernetes'); embeddings catch meaning ('backend' near 'server-side'). Run both, merge the two ranked lists (reciprocal rank fusion is a simple merge), then take the top 100 or so", "Hard filters before ranking: location, work authorization, availability, seniority. A filter that is a requirement belongs in the query as a filter, not in the embedding, because meaning search does not honour 'must'", "Rerank: a cross-encoder or an LLM reads the query with each of the top 100 and orders them. It is slow and costs money per pair, so it only sees the short list. Anthropic reports the top-20 failure rate falling from 5.7% to 1.9% with contextual embeddings, BM25 and reranking together", "Generate: optional. A one-line reason per candidate ('led payments at a fintech, four years of Go') grounded in the resume text, with the source line shown, so the recruiter can check it", "Freshness: new resumes and updates go through a queue and reach the index in minutes; a nightly full rebuild repairs drift; deletes (a person asks to be removed) must reach the index too", "Latency budget for about 1 s: parse of the query 50 ms, retrieval 100 ms, rerank 300 ms, the rest for network and the reason lines streaming after the list. Cache frequent queries and the embedding of the query text", "Failure and fallback: reranker down, return the fused list as is; embedding service down, fall back to BM25 alone; empty result, relax the softest filter and say so", "Evaluation offline: 200 to 500 real queries with candidates graded by recruiters, then recall at k (did the good ones appear in the top 100), NDCG or precision at 10 (are the best at the top). Check each stage on its own, so you know whether a miss was retrieval or rerank", "Evaluation online: click-through, shortlist and contact rates, 'not relevant' feedback. For an LLM judge, calibrate it against recruiter labels first and report the agreement", "Fairness and privacy: do not rank on name, photo or age proxies; log which fields drove a score; keep each customer's candidate pool separate"], "where": "Anthropic, Introducing contextual retrieval: BM25 plus embeddings plus reranking, with the failure-rate numbers", "url": "https://www.anthropic.com/news/contextual-retrieval", "ans": {"lead": "I'd treat it as retrieval first: parse and normalise the resumes, retrieve with both keywords and embeddings, filter, rerank a short list, and only then generate anything.", "pts": ["Ingest: resumes are messy, so I'd parse them into fields, normalise titles and dates, and dedupe. I'd keep the raw file so I can re-parse later.", "Retrieve: BM25 for exact terms and embeddings for meaning, merged, then hard filters for things that are requirements like location and work authorization.", "Rerank: a cross-encoder or LLM over the top hundred, since it's too slow and costly to run on everything.", "Fallbacks: if the reranker is down I return the fused list, and if embeddings are down I fall back to keyword search.", "Evaluation: a labelled set of real queries with recruiter-graded candidates, recall at k for retrieval and precision at 10 for ranking, checked per stage so I know which one missed. I've done this kind of thing with MetaRAG, where an automated evaluation framework showed the gains."], "close": "Online I'd watch shortlist rate and 'not relevant' clicks, and I'd calibrate any LLM judge against recruiters before trusting it."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/search/hybrid-rerank", "label": "Technique: Hybrid retrieval and reranking", "why": "BM25 plus vectors, merged, then reranked: the core of the search design."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/search/vector", "label": "Technique: Vector index", "why": "The embedding index and its approximate nearest-neighbour search."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/search/inverted", "label": "Technique: Inverted index (Elasticsearch)", "why": "The keyword side of the hybrid."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/rag", "label": "Technique: Retrieval-augmented generation", "why": "Retrieval before generation, with the source shown."}], "read": [{"label": "Anthropic: Introducing contextual retrieval, BM25 plus embeddings plus reranking", "url": "https://www.anthropic.com/news/contextual-retrieval", "m": 10}, {"label": "Eugene Yan: system design for discovery, retrieve then rank", "url": "https://eugeneyan.com/writing/system-design-for-discovery/", "m": 20}, {"label": "Coding page: RAG, with code", "url": "CODING.html#rag", "m": 10}], "figs": [], "sheet": {"cheat": ["Ingest: parse to fields, normalise titles and dates, dedupe; keep the raw file so you can re-parse.", "One record per person plus one chunk per role; prepend context to each chunk.", "Hybrid: BM25 for exact terms, embeddings for meaning, merge the two ranked lists, take about 100.", "Hard requirements (location, work authorization) are filters, not part of the embedding.", "Rerank the short list with a cross-encoder or LLM; too slow and costly for everything.", "Anthropic: top-20 failure 5.7% to 1.9% with contextual embeddings, BM25 and reranking.", "Freshness: queue for updates, nightly rebuild, deletes must reach the index.", "Fallbacks: reranker down, return the fused list; embeddings down, BM25 alone.", "Eval: recruiter-graded queries, recall at k for retrieval, precision at 10 or NDCG for ranking, per stage.", "Calibrate any LLM judge against recruiter labels before using it."], "terms": [{"t": "BM25", "mem": "Keyword score that rewards rare terms.", "d": "A ranking function over word counts; strong when the query contains exact terms such as a name or a certification."}, {"t": "Embedding", "mem": "Meaning as a list of numbers.", "d": "A vector from a model where texts with similar meaning sit close together; found by nearest-neighbour search."}, {"t": "Reciprocal rank fusion", "mem": "Merge lists by rank, not by score.", "d": "Combining ranked lists by adding 1 over (a constant plus the rank) for each item; needs no common score scale."}, {"t": "Cross-encoder reranker", "mem": "Reads query and item together.", "d": "A model that scores each query and candidate pair jointly; more accurate than a vector match and too slow for the whole corpus."}, {"t": "Recall at k", "mem": "Did the good ones make the top k.", "d": "The share of relevant items that appear in the top k results; the measure for the retrieval stage."}, {"t": "NDCG", "mem": "Rewards good items near the top.", "d": "A ranking score that gives more credit to relevant results placed higher in the list."}], "vis": [{"title": "Candidate search with RAG", "flow": ["parse and normalise", "index text and vectors", "BM25 plus embeddings", "filters", "rerank top 100", "reasons from the resume"], "note": "Hard requirements such as location are filters, not part of the embedding."}, {"title": "Why both retrievers", "vs": {"cols": ["Finds", "Misses"], "rows": [["BM25 (keywords)", "exact terms: a name, a certification, 'Kubernetes'", "'server-side' when the resume says 'backend'"], ["Embeddings (meaning)", "same idea in other words", "a rare exact term, a number"], ["Both, merged, then reranked", "most of each", "less; the reranker orders the short list"]]}}, {"title": "Fallbacks and checks", "split": [["When a stage fails", ["reranker down: return the fused list", "embeddings down: BM25 alone", "empty result: relax the softest filter and say so"]], ["How you measure it", ["recruiter-graded query set", "recall at k for retrieval", "precision at 10 or NDCG for ranking", "per stage, to see which one missed"]]]}, {"title": "Anthropic's contextual retrieval, top-20 failure", "ladder": [["5.7%", "embeddings alone"], ["1.9%", "contextual embeddings, BM25 and reranking", "the gain from layering the three"]]}]}}, {"t": "Design 2: matching about 30,000 contractors to projects", "m": 25, "out": "A new project needs 40 expert contractors. Design the system that picks and ranks them from a pool of about 30,000. How do you handle a contractor with no history?", "d": "Mercor manages about 30,000 contractors, so this is retrieve-then-rank at a size where you could almost score everyone. Eugene Yan's discovery design is the frame: a cheap stage narrows the pool, a heavier model ranks what is left. The interesting parts are what the features are, what the label is when you have little feedback, the new contractor with no history, and fairness.", "pts": ["Scale first: 30,000 is small. You can embed all contractors once, store them in memory, and score every one with a cheap model in tens of milliseconds. Say so, then say what changes at 3 million", "Stage 1, candidate generation: hard constraints (language, location, availability, credentials, conflicts), then similarity between the project brief and each contractor's profile and past work. Take the top few hundred", "Stage 2, ranking: features per pair. Skill overlap, domain match, past quality scores in similar work, reliability (on-time, acceptance rate), recent activity, current load, rate against budget. Start with a gradient-boosted model on these, because it is easy to explain and to debug", "Label: the outcome you care about, for example the task was accepted and later graded well. Early on you will have few labels, so start with rules and a hand-weighted score, log everything, and train when you have data", "Cold start: a new contractor has no history. Use what they declared and what a screening test showed, give a small exploration boost so they get a few tasks, and update fast from the first results. Without this, the system only ever picks people it already knows", "Feedback loop: you only see outcomes for people you picked. That biases the next model. Reserve a small slice of picks for exploration, and compare against a random or rule-based baseline from time to time", "Fairness: do not use protected traits or close proxies. Check outcomes by group and by region. Spread work so a few top contractors do not take all of it, and cap load per person", "A human in the loop: a project manager can override and pin contractors. Treat their overrides as labels, and show the main reasons for each score so they can disagree with something specific", "Failure and fallback: ranker down, use the stage 1 similarity order; stale availability, check availability again right before sending the offer", "Evaluation offline: replay past projects and ask whether the contractors who did well appear in your top 40; precision at 40 and the grading of those chosen. Online: acceptance rate, time to fill, quality of delivered work, compared with the old process in an A/B or a holdout"], "where": "Eugene Yan, System design for recommendations and search: the retrieve-then-rank frame", "url": "https://eugeneyan.com/writing/system-design-for-discovery/", "ans": {"lead": "With 30,000 contractors I'd say up front that a cheap first stage plus a ranker is plenty, then spend the time on features, cold start and fairness.", "pts": ["Stage 1: hard constraints like language, availability and credentials, then similarity between the brief and each profile, down to a few hundred.", "Stage 2: a ranker over features such as skill overlap, past quality in similar work, reliability, current load and rate. I'd begin with something explainable like gradient-boosted trees.", "Cold start: a new contractor has no history, so I'd use their declared skills and a screening test and give a small exploration boost, so the system doesn't only pick people it already knows.", "Feedback loop: I only see outcomes for people I picked, so I'd keep an exploration slice and compare against a simple baseline now and then.", "Fairness: no protected traits or proxies, check results by group, cap load per person. A project manager can override, and I'd treat overrides as labels."], "close": "I'd measure it by replaying past projects offline, then acceptance rate, time to fill and delivered quality online."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/search/hybrid-rerank", "label": "Technique: Hybrid retrieval and reranking", "why": "The first stage narrows the pool, the second ranks it: the same shape as matching."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/scaling-reads/indexing", "label": "Technique: Indexing and query tuning", "why": "At 30,000 contractors an in-memory index is enough; at millions it is not."}], "read": [{"label": "Eugene Yan: system design for discovery, candidate generation and ranking", "url": "https://eugeneyan.com/writing/system-design-for-discovery/", "m": 20}], "figs": [], "sheet": {"cheat": ["30,000 is small: embed everyone once, score all in memory. Say what changes at 3 million.", "Stage 1: hard constraints, then similarity of brief and profile, down to a few hundred.", "Stage 2: ranker over pair features (skill overlap, past quality in similar work, reliability, load, rate). Start with boosted trees.", "Label: accepted and graded well. With few labels, start with a hand-weighted score and log everything.", "Cold start: declared skills, a screening test, a small exploration boost, fast updates.", "Feedback loop: outcomes only for people you picked; keep an exploration slice and a baseline.", "Fairness: no protected traits or proxies, check by group, cap load per person.", "Overrides by the project manager are labels; show the main reasons for each score.", "Eval: replay past projects (precision at 40), then acceptance rate, time to fill, delivered quality against a holdout."], "terms": [{"t": "Retrieve then rank", "mem": "Cheap to narrow, costly to order.", "d": "A first stage cuts a large pool to a few hundred with a fast method; a heavier model orders only those."}, {"t": "Cold start", "mem": "New, so no history to judge by.", "d": "The problem of ranking an item or person with no past outcomes; handled with declared attributes, tests and a deliberate exploration share."}, {"t": "Feedback loop", "mem": "You learn only from what you chose.", "d": "A bias where the system sees outcomes only for the people it picked, so later models reinforce earlier picks."}, {"t": "Exploration", "mem": "Pick some on purpose to learn.", "d": "Giving a small share of choices to items the model is unsure about so it can gather outcomes it would otherwise never see."}, {"t": "Holdout", "mem": "A group kept on the old way.", "d": "A set of cases handled by the baseline process so the new system's effect can be measured against it."}], "vis": [{"title": "Matching about 30,000 contractors", "flow": ["hard constraints", "similarity: brief to profile", "top few hundred", "ranker on pair features", "top 40", "manager can override"], "note": "At 30,000 you could score everyone in memory. Say so, then say what changes at 3 million."}, {"title": "What the ranker sees", "parts": [["skill overlap", "domain match"], ["past quality", "in similar work"], ["reliability", "on time, acceptance"], ["load and rate", "against budget"]]}, {"title": "Cold start and the feedback loop", "split": [["New contractor", ["declared skills", "a screening test", "a small exploration boost", "update fast from the first results"]], ["Only seeing what you picked", ["keep an exploration slice", "compare to a simple baseline now and then", "treat manager overrides as labels", "check outcomes by group, cap load per person"]]]}]}}, {"t": "Design 3: an AI interviewer with rubric scoring", "m": 30, "out": "Design an AI interviewer that screens thousands of experts and scores them against a rubric. How do you trust the scores, and where would you keep a human?", "d": "Two systems in one: the conversation (real-time, speech or text) and the scoring (a judge against a rubric). They have different budgets. The conversation needs low latency. The scoring can take longer, and it needs to be trusted. You have built both halves: MockFlow-AI for the live interview and an eval harness at alfred_ for judging. Mercor's APEX papers show how it grades expert work with rubrics and a judge.", "pts": ["Conversation, speech path: speech to text, a model that decides the next move, text to speech, with streaming at each hop. MockFlow-AI reached sub-400ms end to end this way over WebSockets, five times faster than a polling baseline", "Conversation, control: do not let the model decide when the interview moves on. In MockFlow-AI the stage changes only when the model calls an explicit transition tool, with a minimum number of questions and a quality exit, plus a timer as a safety net. Explicit transitions stop drift", "Rubric: a list of dimensions per skill (for example correctness, depth, communication), each with described levels and example answers at each level. Written with domain experts, versioned", "Judge design: one LLM judge per dimension, not one judge for everything. Each returns a level, a short reason quoted from the transcript, and an 'Unknown' option when the evidence is not there. Unknown is routed to a person, not guessed", "Calibration: have experts grade a sample of 100 to 200 interviews, compare the judge with them, and report agreement per dimension (Cohen's kappa or simple agreement and the confusion matrix). Fix the rubric or the prompt where they disagree. Do this before any score is used, and again on every prompt or model change", "Deterministic checks where they exist: for a coding question, run the tests; for a fact, compare to a key. Use the LLM only for what needs judgment", "Monitoring: score distributions over time, agreement with human graders on a rolling sample, judge cost, rate of Unknown. A shift in the mix of scores after a model update is drift, and it should page someone", "Human in the loop: borderline scores, Unknowns, a random audit sample, and every appeal. Hiring is a decision about a person, so a score alone should not reject anyone", "Failure and fallback: speech service down, switch to text or reschedule; judge fails or times out, queue the transcript and retry with the same request id so it is not scored twice; model provider down, fall back to a second model", "Where Mercor's would differ (state it, do not claim to know): it is likely asynchronous and at far larger volume; scores feed a hiring or pay decision, so fairness checks and an audit trail matter more; rubrics come from domain experts across many fields, so per-domain calibration is the heavy work", "Privacy: recordings and transcripts are sensitive. Store per customer, set retention, and keep them out of logs and prompts you do not control"], "where": "Anthropic, Demystifying evals for AI agents: code, model and human graders; one judge per dimension; an Unknown option; calibrating to humans", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "ans": {"lead": "I'd split it in two, because the live conversation needs speed and the scoring needs trust.", "pts": ["Conversation: streaming speech to text, model and text to speech. I built this in MockFlow-AI and got to under 400 ms end to end. The model doesn't decide when to move on; it has to call a transition tool, and there's a minimum number of questions and a timer as a safety net.", "Scoring: a rubric per skill with described levels, and one judge per dimension that returns a level, a quote from the transcript as its reason, and an Unknown option that goes to a person.", "Trust: experts grade a sample, I compare the judge with them per dimension and fix the rubric or prompt where they disagree, before any score is used. I'd rerun that on every model or prompt change.", "Monitoring: score distributions and agreement with human graders over time, so drift after a model update shows up.", "Where I'd differ at Mercor: I'd expect it to be asynchronous, at much higher volume and with scores that feed a decision, so audit trails and fairness checks matter more. I'd want to hear how they do it today."], "close": "A person stays on borderline scores, Unknowns, a random audit sample and every appeal."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Technique: Eval suites as release gates", "why": "A calibrated judge is the gate for scoring changes."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/real-time/websockets", "label": "Technique: WebSockets", "why": "The live interview is a streaming connection."}], "read": [{"label": "Anthropic: Demystifying evals for AI agents, graders, one judge per dimension, Unknown", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "m": 20}, {"label": "Hamel Husain: creating and validating an LLM judge against a domain expert", "url": "https://hamel.dev/blog/posts/llm-judge/", "m": 25}, {"label": "Mercor APEX paper: rubrics and a judge for expert work", "url": "https://arxiv.org/abs/2509.25721", "m": 30}, {"label": "Baseline: LLM-as-judge, the short explainer", "url": "BASELINE.html#/ai/llm-as-judge", "m": 3}], "figs": [], "sheet": {"cheat": ["Two systems: the live conversation needs speed, the scoring needs trust.", "MockFlow-AI: streaming speech to text, model, text to speech; under 400 ms end to end, five times faster than polling.", "Explicit transition tool, a minimum number of questions, a quality exit and a timer as a safety net; stops drift.", "Rubric per skill: dimensions with described levels and example answers, written with experts, versioned.", "One judge per dimension: a level, a quote from the transcript as the reason, and an Unknown option routed to a person.", "Calibrate: experts grade 100 to 200, compare per dimension (agreement, kappa, confusion matrix), fix rubric or prompt, rerun on every change.", "Use deterministic checks where they exist (run the tests, compare to a key).", "Monitor: score mix over time, agreement with humans on a rolling sample, Unknown rate, cost.", "Human stays on borderline, Unknown, a random audit and every appeal.", "Where Mercor would differ: likely async, more volume, scores feed a decision, per-domain calibration."], "terms": [{"t": "Rubric", "mem": "The levels, written down.", "d": "A list of dimensions for a skill, each with described levels and examples, so graders and judges apply the same standard."}, {"t": "LLM judge", "mem": "A model that grades another's output.", "d": "A model prompted with a rubric to score an answer; useful at scale and only trustworthy once checked against human graders."}, {"t": "Calibration", "mem": "Check the judge against people.", "d": "Comparing a judge's scores with expert labels on a sample and adjusting the rubric or prompt until agreement is acceptable."}, {"t": "Cohen's kappa", "mem": "Agreement beyond chance.", "d": "A statistic for how often two graders agree after discounting the agreement expected by luck."}, {"t": "Unknown option", "mem": "Allowed to say 'not enough evidence'.", "d": "A judge output meaning the transcript does not support a level; it goes to a person instead of being guessed."}, {"t": "Judge drift", "mem": "Same judge, shifting scores.", "d": "A change in score distribution over time, often after a model or prompt update, found by tracking agreement with human graders."}], "vis": [{"title": "The live conversation (MockFlow-AI)", "flow": ["speech to text", "model decides the move", "text to speech", "stage changes only by a transition tool"], "note": "Streaming at each hop gave under 400 ms end to end. A timer is the safety net."}, {"title": "The scoring, a different budget", "flow": ["transcript", "one judge per dimension", "level, quote, or Unknown", "calibrate against experts", "audit sample", "score"], "note": "Unknown goes to a person, not to a guess."}, {"title": "Where each half spends", "vs": {"cols": ["Live conversation", "Scoring"], "rows": [["Budget", "latency, under 400 ms", "trust, can take minutes"], ["Failure", "switch to text or reschedule", "queue and retry with the same request id"], ["Check", "stage and timer logs", "agreement with human graders per dimension"]]}}, {"title": "Where Mercor's would differ", "split": [["Likely", ["asynchronous, not live", "far larger volume", "scores feed a decision", "audit trail and fairness checks matter more"]], ["What to ask", ["how they calibrate today", "which domains are hardest", "who reviews the Unknowns"]]]}]}}, {"t": "Design 4: catching contractors who game AI-graded tasks", "m": 20, "out": "Contractors are paid for tasks that an AI grades, and some are gaming it. How do you find them without punishing honest people?", "d": "This is an adversarial problem: the people you measure will adapt. So no single signal decides; you combine weak signals, test the system with tasks whose answer you know, send uncertain cases to people, and keep testing it against new tricks. The cost of a wrong accusation is high, so the output is a review queue, not an automatic ban.", "pts": ["Name the ways to game it first: pasting the task into another model and submitting its answer, writing to the judge's known preferences (long, confident answers), submitting the same work many times, collusion between accounts, sharing answer keys", "Signals: time on task against how long the task takes, copy and paste events, answers unusually similar to each other or to a model's output, a sudden jump in quality with no change in pace, many accounts from one device or network, work at hours that do not fit the profile", "Gold tasks: mix in a small share of tasks with a known right answer and a trap, placed at random so they cannot be told apart. Failing them is strong evidence, and it measures the cheat rate directly", "Honeypots for the judge: answers written to fool it (padded, flattering, with an instruction hidden in the text). If the judge scores them high, fix the judge. This is an adversarial eval for the grader itself", "Anomaly detection: compare each contractor with peers on the same task type and look for outliers, using robust statistics (median and spread, not mean). Outliers are leads, not proof; some are very good", "Combine: a risk score from several signals, with a threshold that sends cases to a human review queue sized to what reviewers can handle. Show the reviewer the signals that fired", "Cost of errors: set the threshold from the cost of each mistake. A false accusation hurts a real person and costs trust, so require several independent signals or a gold-task failure before action, and keep an appeal path", "Evaluation: a labelled set of confirmed cases from reviewers, precision and recall of the risk score, and precision of the review queue (what share of reviewed cases were real). Re-measure monthly, since cheaters change tactics", "Monitoring and drift: track the flag rate and the rate at which reviewers agree. A drop in flags may mean cheaters adapted, not that they stopped", "Failure and fallback: detection pipeline down, queue the events and catch up; do not pause payment for everyone. Keep raw events so you can re-score everything when you add a signal"], "where": "Mercor APEX paper: how Mercor grades expert work with rubrics and a judge (the grading section)", "url": "https://arxiv.org/abs/2509.25721", "ans": {"lead": "I'd combine weak signals, plant tasks where I know the answer, and send uncertain cases to people, because the cost of accusing an honest contractor is high.", "pts": ["Signals: time on task against what it normally takes, paste events, answers very similar to each other or to model output, many accounts on one device, and a sudden jump in quality.", "Gold tasks: I'd mix in tasks with a known answer and a trap, placed at random. Failing them is strong evidence, and it gives me the cheat rate directly.", "Testing the grader: I'd also write answers meant to fool the judge, like padded or flattering ones, and fix the judge if it scores them high.", "Decision: a risk score from several signals sends cases to a review queue sized to what reviewers can handle. I'd need several independent signals or a gold-task failure before any action, plus an appeal.", "Evaluation: confirmed cases from reviewers give me precision and recall, and I'd re-measure monthly since the tricks change."], "close": "A falling flag rate could mean cheaters adapted, so I'd check it against the gold-task failure rate before calling it good news."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/reliability/rate-limiting", "label": "Technique: Rate limiting", "why": "Limits per account are one cheap signal and a defence against bulk gaming."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/reliability/monitoring", "label": "Technique: Monitoring and completeness checks", "why": "Flag rate and reviewer agreement are the drift signals."}], "read": [{"label": "Mercor APEX-Agents paper: how agent work is graded against rubrics", "url": "https://arxiv.org/abs/2601.14242", "m": 30}, {"label": "Anthropic: Demystifying evals for AI agents, graders you can trust", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "m": 20}], "figs": [], "sheet": {"cheat": ["List the tricks first: another model's answer, writing to the judge's preferences, resubmission, collusion, shared answer keys.", "Signals: time on task, paste events, answers similar to each other or to a model's, shared device, sudden quality jump.", "Gold tasks: known answer plus a trap, placed at random; failing is strong evidence and measures the cheat rate.", "Fool the judge on purpose: padded, flattering, hidden-instruction answers; if they score high, fix the judge.", "Anomaly detection against peers on the same task type, with median and spread. Outliers are leads, not proof.", "A risk score from several signals sends cases to a human review queue sized to reviewer capacity.", "Require several independent signals or a gold-task failure before action; keep an appeal.", "Eval: reviewer-confirmed cases, precision and recall of the score, precision of the queue; re-measure monthly.", "A falling flag rate may mean cheaters adapted; check against the gold-task failure rate."], "terms": [{"t": "Gold task", "mem": "A task whose answer you already know.", "d": "A task mixed in at random with a known correct answer, used to check a contractor or a judge."}, {"t": "Honeypot", "mem": "Bait that only a cheater takes.", "d": "An item built so that honest work passes and a particular kind of cheating fails or shows itself."}, {"t": "Adversarial eval", "mem": "Test it against attacks.", "d": "An evaluation set built from inputs designed to fool the system, such as answers written to win a judge's favour."}, {"t": "Anomaly detection", "mem": "Find who differs from peers.", "d": "Flagging cases far from the usual pattern for their group; the flag is a lead for review, not a verdict."}, {"t": "Review queue", "mem": "People see what the score is unsure of.", "d": "A list of flagged cases sent to human reviewers, sized to what they can handle, with the signals that fired."}], "vis": [{"title": "From signals to a decision", "flow": ["raw events", "several weak signals", "risk score", "review queue", "human decides", "appeal path"], "note": "The output is a queue for people, not an automatic ban."}, {"title": "Planted checks", "split": [["Gold tasks", ["known answer plus a trap", "mixed in at random", "failing is strong evidence", "gives the cheat rate directly"]], ["Tests for the judge", ["padded or flattering answers", "a hidden instruction in the text", "if they score high, fix the judge", "an adversarial eval for the grader"]]]}, {"title": "Cost of a wrong call", "ladder": [["flag", "send to review", "cheap"], ["pause", "needs several independent signals", "costly"], ["remove", "needs a gold-task failure or reviewer confirmation, and an appeal", "very costly"]]}]}}, {"t": "Production pushback: 10x traffic, an outage, cost, and customer data", "m": 20, "out": "You have described the design. Traffic goes up 10 times, your model provider has an outage, the bill doubles, and a customer asks how you keep their data apart from others. What do you say to each?", "d": "The interviewer takes any design and pushes on the same four things. You answer each with a mechanism and a number, not a reassurance. The fourth is background on the company: Mercor was reported to have had a data breach in March 2026 through an open-source dependency. Know it so your answer on isolation is good; do not raise it.", "pts": ["10x traffic: find the bottleneck first (model calls, index, database). Then the levers in order: cache (same query, same embedding), batch where latency allows, a queue to smooth bursts, scale the stateless parts out, and shed or degrade low-priority work. Say what you would load-test and the limit you expect to hit first", "Provider outage: a timeout on every call, a bounded retry with backoff and jitter, a circuit breaker so you stop hammering a dead service, then a fallback model from another provider with the same prompt tested on your eval set. For work that can wait, queue it and process it when the provider is back", "Retries and idempotency: attach a request id to every operation with a side effect (a score saved, a message sent). The retry reuses the id, so doing it twice has the effect of once. Without this, retries double-charge or double-score", "Cost per request: measure it per stage first. Levers: cache responses and the provider's prompt prefix; route easy requests to a small model and hard ones to a large one, deciding with a cheap classifier or a confidence score; batch non-urgent work; shorten the context to what the stage needs; cap output length", "Check the saving against quality: after routing, run the eval set again and compare. A cost cut that lowers quality is a bug, and you only know from the offline set", "Customer data isolation: every row and every index entry carries a customer id; queries filter on it at the lowest layer (row-level security, per-customer index namespaces) so a bug in application code cannot cross it. Separate keys per customer, per-customer retention, and no customer data in shared logs or prompts", "Dependencies: pin versions, review updates, scan them, and keep secrets out of the services that call third-party code. An open-source package in your model gateway runs with your credentials, so give it only what it needs", "Observability to answer 'what happened': a trace per request with a request id, stage timings, tokens and cost, model and prompt version. When a customer asks about one answer, you can reproduce it", "Then say which of these you have done: caching and an outage-tolerant design at WheelPrice and in the Mercor caching rounds, cost engineering and eval at alfred_"], "where": "Anthropic, How we built our multi-agent research system: resuming from failure, checkpoints and tracing in production", "url": "https://www.anthropic.com/engineering/multi-agent-research-system", "ans": {"lead": "For each push I'd name the mechanism and the number I'd check, not say it'll be fine.", "pts": ["10x traffic: I'd find the first bottleneck, probably model calls, then cache repeated queries, queue bursts, scale out the stateless parts and degrade low-priority work first.", "Provider outage: timeouts, a bounded retry with backoff and jitter, a circuit breaker, and a fallback model I've already run through the eval set. Anything that can wait goes on a queue. Every retry carries the same request id, so doing it twice has the effect of once.", "Cost: I'd measure it per stage first. Then caching, routing easy requests to a small model, batching what isn't urgent, and a shorter context. After each change I rerun the eval set, since a saving that lowers quality is a bug.", "Customer data: a customer id on every row and index entry, enforced at the lowest layer such as row-level security, so an application bug can't cross it. I'd also keep customer data out of shared logs and give third-party code only the access it needs.", "What I've done: caching at WheelPrice, where I cut an API response from 1.5 s to 300 ms, and cost engineering at alfred_, where a deterministic matcher cut per-user LLM cost by about 30%."], "close": "And for each one I'd say how I'd see it in a trace, so I can tell the interviewer how I'd know."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/reliability/timeouts-retries", "label": "Technique: Timeouts, retries, backoff, jitter", "why": "Backoff with jitter and a bounded retry."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/reliability/circuit-breaker", "label": "Technique: Circuit breaker", "why": "Stop calling a provider that is down."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/reliability/degradation", "label": "Technique: Graceful degradation", "why": "A fallback model or a simpler path when a stage fails."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/multi-step/idempotency", "label": "Technique: Idempotency keys", "why": "A request id makes a retry safe."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/llm-cost/routing", "label": "Technique: Model routing and tiering", "why": "Small model for easy requests, large for hard ones."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/llm-cost/prompt-cache", "label": "Technique: Prompt caching", "why": "The provider's prefix cache."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/agent-safety/least-privilege", "label": "Technique: Least privilege and sandboxing", "why": "Third-party code and per-customer data get only the access they need."}], "read": [{"label": "Anthropic: How we built our multi-agent research system, resuming from failure and tracing", "url": "https://www.anthropic.com/engineering/multi-agent-research-system", "m": 15}, {"label": "Anthropic: Building effective agents", "url": "https://www.anthropic.com/engineering/building-effective-agents", "m": 15}, {"label": "Anthropic: prompt caching docs", "url": "https://platform.claude.com/docs/en/docs/build-with-claude/prompt-caching", "m": 10}, {"label": "Light review: wc33, stale data, stampedes and failure", "url": "index.html#/w/wc33", "m": 10}, {"label": "Light review: wc34, LLM caches and your alfred_ caches", "url": "index.html#/w/wc34", "m": 10}, {"label": "TechCrunch: after the data breach, Mercor's month (background only)", "url": "https://techcrunch.com/2026/04/09/after-data-breach-10b-valued-startup-mercor-is-having-a-month", "m": 6}], "figs": [], "sheet": {"cheat": ["10x traffic: find the first bottleneck, then cache, batch, queue, scale out stateless parts, degrade low-priority work.", "Outage: timeout, bounded retry with backoff and jitter, circuit breaker, a fallback model already run on the eval set, queue what can wait.", "Idempotency: a request id on every side effect, reused by the retry, so twice has the effect of once.", "Cost: measure per stage; cache responses and the prompt prefix; route easy to a small model; batch; shorten context; cap output.", "Rerun the eval set after a cost change; a saving that lowers quality is a bug.", "Customer data: a customer id on every row and index entry, enforced at the lowest layer (row-level security, per-customer namespaces).", "Dependencies: pin, review, scan, and give third-party code only the access it needs.", "Trace per request with a request id, timings, tokens, cost, model and prompt version.", "Background: Mercor was reported to have a March 2026 breach through an open-source dependency. Know it; do not raise it."], "terms": [{"t": "Circuit breaker", "mem": "Stop calling what is down.", "d": "After repeated failures, calls to a dependency are refused for a while so it can recover and callers fail fast."}, {"t": "Idempotency key", "mem": "Same id, same effect once.", "d": "A unique id sent with an operation so that a repeated request is recognised and does not repeat the side effect."}, {"t": "Model routing", "mem": "Small model first, large when needed.", "d": "Sending each request to a cheaper or stronger model based on a cheap classifier or confidence score."}, {"t": "Backoff with jitter", "mem": "Wait longer, and not all together.", "d": "Retry delays that grow each time, with random variation so many clients do not retry at the same moment."}, {"t": "Row-level security", "mem": "The database refuses the wrong rows.", "d": "A database rule that limits each query to rows the caller may see, so an application bug cannot cross a customer boundary."}], "vis": [{"title": "Provider outage, in order", "flow": ["timeout on every call", "retry with backoff and jitter", "circuit breaker opens", "fallback model", "queue what can wait"], "note": "A retry carries the same request id, so doing it twice has the effect of once."}, {"title": "Cost levers", "vs": {"cols": ["What it does", "Check"], "rows": [["Cache responses and the prompt prefix", "skips repeat work", "key covers everything that changes the answer"], ["Route easy to a small model", "pays less for easy requests", "rerun the eval set"], ["Batch non-urgent work", "better throughput per call", "latency still within budget"], ["Shorten the context", "fewer tokens in", "quality unchanged on the eval set"]]}}, {"title": "Customer data apart", "split": [["Enforce low", ["customer id on every row and index entry", "row-level security, per-customer namespaces", "separate keys and retention per customer"]], ["Keep out", ["customer data in shared logs", "customer data in prompts you do not control", "third-party code with more access than it needs"]]]}]}}], "study": [], "quiz": [{"q": "In your own words: The checklist you walk on every AI design.", "a": "I'd start with who uses it and what a good answer is, put numbers on the scale, then draw the pipeline and ask the same four questions of every stage. Requirements: I'd ask for users, requests per second, data size, how fresh the data has to be and the latency target, and I'd say a number out loud so I can size against it. Pipeline: I'd draw the stages before picking any tool. Then for each stage I'd say how long it takes, what it costs, how it fails and what the user gets when it does. Evaluation: I'd build a small labelled set first. It tells me whether the design works, and it lets me change a model or a prompt without guessing. Online, I'd score a sample of live traffic and watch user overrides. Operating it: a trace on every request, quality and cost on a dashboard, a flag to ship behind and shadow runs before rollout. Prompt, model and index versioned together. Why over names: I'd say why I picked a component, for example a hybrid index because exact terms like a job title and fuzzy meaning both matter, and not only the product name. Then I'd say the one tradeoff I made and what I'd do next, so it stays a conversation."}, {"q": "In your own words: Design 1: candidate search with RAG.", "a": "I'd treat it as retrieval first: parse and normalise the resumes, retrieve with both keywords and embeddings, filter, rerank a short list, and only then generate anything. Ingest: resumes are messy, so I'd parse them into fields, normalise titles and dates, and dedupe. I'd keep the raw file so I can re-parse later. Retrieve: BM25 for exact terms and embeddings for meaning, merged, then hard filters for things that are requirements like location and work authorization. Rerank: a cross-encoder or LLM over the top hundred, since it's too slow and costly to run on everything. Fallbacks: if the reranker is down I return the fused list, and if embeddings are down I fall back to keyword search. Evaluation: a labelled set of real queries with recruiter-graded candidates, recall at k for retrieval and precision at 10 for ranking, checked per stage so I know which one missed. I've done this kind of thing with MetaRAG, where an automated evaluation framework showed the gains. Online I'd watch shortlist rate and 'not relevant' clicks, and I'd calibrate any LLM judge against recruiters before trusting it."}, {"q": "In your own words: Design 2: matching about 30,000 contractors to projects.", "a": "With 30,000 contractors I'd say up front that a cheap first stage plus a ranker is plenty, then spend the time on features, cold start and fairness. Stage 1: hard constraints like language, availability and credentials, then similarity between the brief and each profile, down to a few hundred. Stage 2: a ranker over features such as skill overlap, past quality in similar work, reliability, current load and rate. I'd begin with something explainable like gradient-boosted trees. Cold start: a new contractor has no history, so I'd use their declared skills and a screening test and give a small exploration boost, so the system doesn't only pick people it already knows. Feedback loop: I only see outcomes for people I picked, so I'd keep an exploration slice and compare against a simple baseline now and then. Fairness: no protected traits or proxies, check results by group, cap load per person. A project manager can override, and I'd treat overrides as labels. I'd measure it by replaying past projects offline, then acceptance rate, time to fill and delivered quality online."}, {"q": "In your own words: Design 3: an AI interviewer with rubric scoring.", "a": "I'd split it in two, because the live conversation needs speed and the scoring needs trust. Conversation: streaming speech to text, model and text to speech. I built this in MockFlow-AI and got to under 400 ms end to end. The model doesn't decide when to move on; it has to call a transition tool, and there's a minimum number of questions and a timer as a safety net. Scoring: a rubric per skill with described levels, and one judge per dimension that returns a level, a quote from the transcript as its reason, and an Unknown option that goes to a person. Trust: experts grade a sample, I compare the judge with them per dimension and fix the rubric or prompt where they disagree, before any score is used. I'd rerun that on every model or prompt change. Monitoring: score distributions and agreement with human graders over time, so drift after a model update shows up. Where I'd differ at Mercor: I'd expect it to be asynchronous, at much higher volume and with scores that feed a decision, so audit trails and fairness checks matter more. I'd want to hear how they do it today. A person stays on borderline scores, Unknowns, a random audit sample and every appeal."}, {"q": "In your own words: Design 4: catching contractors who game AI-graded tasks.", "a": "I'd combine weak signals, plant tasks where I know the answer, and send uncertain cases to people, because the cost of accusing an honest contractor is high. Signals: time on task against what it normally takes, paste events, answers very similar to each other or to model output, many accounts on one device, and a sudden jump in quality. Gold tasks: I'd mix in tasks with a known answer and a trap, placed at random. Failing them is strong evidence, and it gives me the cheat rate directly. Testing the grader: I'd also write answers meant to fool the judge, like padded or flattering ones, and fix the judge if it scores them high. Decision: a risk score from several signals sends cases to a review queue sized to what reviewers can handle. I'd need several independent signals or a gold-task failure before any action, plus an appeal. Evaluation: confirmed cases from reviewers give me precision and recall, and I'd re-measure monthly since the tricks change. A falling flag rate could mean cheaters adapted, so I'd check it against the gold-task failure rate before calling it good news."}], "hasTrackerQuiz": false, "figs": [], "nlm": ["https://huyenchip.com/2024/07/25/genai-platform.html", "https://www.hellointerview.com/learn/system-design/in-a-hurry/delivery", "https://www.anthropic.com/news/contextual-retrieval", "https://eugeneyan.com/writing/system-design-for-discovery/", "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "https://hamel.dev/blog/posts/llm-judge/", "https://arxiv.org/abs/2509.25721", "https://arxiv.org/abs/2601.14242", "https://www.anthropic.com/engineering/multi-agent-research-system", "https://www.anthropic.com/engineering/building-effective-agents", "https://platform.claude.com/docs/en/docs/build-with-claude/prompt-caching", "https://techcrunch.com/2026/04/09/after-data-breach-10b-valued-startup-mercor-is-having-a-month", "https://arxiv.org/abs/2005.11401", "https://www.anthropic.com/engineering/contextual-retrieval", "https://eugeneyan.com/writing/llm-patterns/", "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "https://arxiv.org/abs/2406.18665", "https://docs.stripe.com/webhooks", "https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events", "https://brandur.org/idempotency-keys", "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/", "https://stripe.com/blog/rate-limiters", "https://opentelemetry.io/docs/concepts/observability-primer/", "https://sre.google/sre-book/monitoring-distributed-systems/", "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html", "https://use-the-index-luke.com/", "https://www.postgresql.org/docs/current/indexes-types.html", "https://github.com/pgvector/pgvector", "https://www.pinecone.io/learn/series/faiss/hnsw/", "https://www.confluent.io/blog/exactly-once-semantics-are-possible-heres-how-apache-kafka-does-it/", "https://web.stanford.edu/~jurafsky/slp3/4.pdf"]}, {"id": "wc39", "name": "The GTM conversation: customers, stakeholders, product sense", "blurb": "Fifteen minutes with an Engagement Manager and a Principal of Enterprise AI: how you talk to a customer, what you ask first, how you say no, and how you explain an AI system to someone who does not write code.", "intro": "Mercor describes this round in one line: communication, product sense, user empathy, and how you approach users and stakeholders. The two interviewers are an Engagement Manager and a Principal, Enterprise AI. They sit between the customer and the engineers. So they are asking one thing: would you be safe, and useful, in front of a Fortune 500 stakeholder? No public report of this round exists. Everything here is built from Mercor's own wording, the Enterprise page and the public posts on customer-facing interview rounds, and it is practice, not a leak. The skill is the same in every scenario: ask before you answer, tie the work to a number the customer cares about, and say the hard thing kindly.", "len": "1h 15m", "day": "3", "steps": [{"t": "What the round assesses, and how to show it", "m": 12, "out": "What are two interviewers from the customer side listening for in fifteen minutes, and what do you do in the first minute?", "d": "Fifteen minutes is one or two scenarios and a question about your own work with users. It is a conversation, so they listen to your process more than your conclusion. The public prep guides for customer-facing engineering rounds agree on the pattern: clarifying questions first, a clean breakdown, empathy for the real pain, trade-offs said out loud, and plain words for a non-technical listener. Jumping straight to a solution is the red flag. No public report of Mercor's own GTM round exists, so treat this as the best reading of the invitation text and the role postings, which stress scoping, milestones and explaining technical ideas to non-technical stakeholders.", "pts": ["Who is in the room: an Engagement Manager owns the customer relationship from evaluation through delivery; the Principal works on how enterprise AI gets deployed. Neither is checking your code. Both are asking whether a customer would trust you", "Ask first: before you propose anything, ask two or three targeted questions. What does success look like, who decides, what is the cost of getting it wrong", "Acknowledge before you diagnose: say the customer's pain back to them in a sentence, then investigate. Never blame the customer's systems, even when they are the cause", "Tie to a number: every plan ends with how you would know it worked. Mercor sells custom evaluations tied to what good looks like for the customer, so a metric is the language of the building", "Say the trade-off: what you will do, what you will leave for later, and why", "Plain words: if you use a term, say what it means in the customer's world. Test it on someone who does not code", "Use a real example from your own work when they ask about users. One true story beats three claims", "Be brief: with fifteen minutes, an answer is about a minute and a half, then stop and let them steer"], "where": "FDE Academy and Perspective AI, customer-facing FDE interview guides; Mercor job postings for the Enterprise team. No public report of Mercor's GTM round exists.", "url": "https://getperspective.ai/blog/forward-deployed-engineer-interview-questions-2026-prep-guide", "ans": {"lead": "I think this round is about whether a customer would trust me, so I'd ask before I answer and tie everything to a number they care about.", "pts": ["Ask first: two or three questions on what success looks like and what a failure costs, before I suggest anything.", "Acknowledge: I say the customer's problem back in a sentence, then I diagnose.", "Number: every plan ends with how we'd know it worked.", "Trade-off: I say what I'd do now, what I'd leave, and why.", "Plain words: I explain it in their world, not mine."], "close": "And if I don't know something, I say so and say how I'd find out."}, "sdLinks": [], "read": [{"label": "Perspective AI, FDE interview questions: what customer-facing rounds grade (process over conclusion)", "url": "https://getperspective.ai/blog/forward-deployed-engineer-interview-questions-2026-prep-guide", "m": 8}, {"label": "FDE Academy: acknowledge, diagnose, own", "url": "https://fde.academy/blog/forward-deployed-engineer-interview-questions", "m": 8}], "figs": [], "sheet": {"cheat": ["Two interviewers on the customer side: would a Fortune 500 stakeholder trust you?", "Ask two or three questions before you propose anything.", "Acknowledge the pain first, then diagnose. Never blame the customer's systems.", "End every plan with a number: how you would know it worked.", "Say the trade-off: what now, what later, why.", "No public report of this round exists. This is built from Mercor's wording and public guides."], "terms": [{"t": "Acknowledge, then diagnose", "mem": "Their pain first.", "d": "Say the customer's problem back to them in a sentence before you start investigating it."}, {"t": "Product sense", "mem": "Why it is built this way.", "d": "Knowing what the product does, who it is for, and what would make it succeed or fail for a given customer."}, {"t": "Targeted question", "mem": "Narrow and useful.", "d": "A question that changes your plan, such as what success looks like or what a wrong answer costs, asked before proposing anything."}], "vis": [{"rule": "Ask before you answer. Say their pain, ask two or three questions, end with a number."}, {"title": "The shape of fifteen minutes", "flow": ["Hear the case", "Acknowledge", "Ask two or three", "Plan and a number", "Trade-off"], "note": "A reading of public guides, not Mercor's rule."}, {"title": "Who is listening", "parts": [["Engagement Manager", "owns the customer, scope to delivery"], ["Principal, Enterprise AI", "how enterprise AI gets deployed"], ["Both", "would a customer trust you?"]]}]}}, {"t": "Mercor Enterprise in your own words, and the questions it raises", "m": 18, "out": "Explain what Mercor Enterprise sells, in your own words, with one case study and its number. What would a customer ask you about it?", "d": "Product sense starts with knowing the product. Mercor Enterprise helps large companies put AI agents to work. It has four parts: Discover (find where agents pay off, with a ranked list, workflow maps and ROI estimates), Deploy (build production agents wired into the customer's tools, with evaluations defined by what good looks like for that business), Improve (review live agents and tune architecture, prompts, tools and models), and Monetize (license data to AI labs, always opt in). Custom evaluations run continuously in production. Business experts and forward deployed engineers deliver it on one platform. Customers appear only by industry, so the case studies are anonymous.", "pts": ["Incident-response agent (technology company): over 50% reduction in median time to mitigation. Know this one cold: a measurable operational number, set by an evaluation of what good looks like", "Private equity value-creation assessment: $7 to 9M of upside run-rate savings identified. A second PE firm: $20M annual run-rate impact by 2031, about $4M near-term net value. Say these are Mercor's figures: 'they report'", "Customer-success agent (Mercor's own support): about 12,000 support requests a week. Scale is the point, and the customer is Mercor itself", "HR production-readiness evaluation: 132 expert-graded agent runs on real HR tasks. This is the evaluation story in one number: experts grade real runs before the agent goes live", "Enterprise software diagnostic: 25 candidate workflows across seven functions, five agents prioritised for the next twelve months. Discovery turns many ideas into a short ordered list", "APEX-Agents, Mercor's benchmark of long professional tasks: frontier models complete under 25% of tasks, about 40% with eight attempts. Many failures come from handling ambiguity, finding the right file and keeping context. So an agent that works in a demo can still fail on the customer's messy real work", "The questions it raises for a customer: what does good look like and who grades it, what happens when the agent is unsure, how does it stay good after launch, what data does it see and who controls it, what does the first month cost and return", "Why this matters to you: Mercor's evaluation work is the part of your own work that fits, so it is where your answers should land"], "where": "Mercor Enterprise page (mercor.com/enterprise) and the APEX-Agents post; both opened 3 Nov 2026. Case studies are anonymised; no named customers.", "url": "https://mercor.com/enterprise", "ans": {"lead": "From what I read, Mercor Enterprise finds where agents pay off, puts them into the customer's real tools with evaluations built around what good means for that business, and keeps improving them live.", "pts": ["Four parts: Discover, Deploy, Improve, and Monetize, which is opt-in data licensing.", "The case I'd lead with: an incident-response agent that cut median time to mitigation by over 50%. They report it, and I like it because the number is operational, not a vibe.", "The other one I'd mention is the HR evaluation, 132 runs graded by experts before launch. That's the idea that evaluation comes first.", "The APEX finding I'd point to: models fail a lot on ambiguity and context, so a customer's messy real work is harder than a demo.", "Questions I'd expect from a customer: who grades the agent, what happens when it's unsure, and how does it stay good after launch."], "close": "That last part, grading and staying good, is the work I do at alfred_, which is why this team fits."}, "sdLinks": [], "read": [{"label": "Mercor Enterprise: the four offerings and the case studies", "url": "https://mercor.com/enterprise", "m": 6}, {"label": "Mercor, introducing APEX-Agents: why agents fail on ambiguity", "url": "https://mercor.com/blog/introducing-apex-agents", "m": 8}], "figs": [], "sheet": {"cheat": ["Enterprise: Discover, Deploy, Improve, Monetize (opt-in data licensing).", "Custom evaluations tied to the customer's quality bar, run continuously in production.", "Incident-response agent: over 50% lower median time to mitigation.", "HR readiness: 132 expert-graded agent runs before launch.", "Customer-success agent: about 12,000 requests a week. Diagnostic: 25 workflows, 5 agents prioritised.", "APEX-Agents: under 25% of tasks completed; failures from ambiguity and lost context.", "Say 'they report' for every Mercor figure."], "terms": [{"t": "Median time to mitigation", "mem": "How fast it is contained.", "d": "The middle time from an incident starting to its impact being contained; the incident-response agent cut it by over 50%."}, {"t": "Expert-graded run", "mem": "A person scores it.", "d": "An agent attempt on a real task that a domain expert marks against a rubric; the HR case used 132 of them."}, {"t": "APEX-Agents", "mem": "Long professional tasks.", "d": "Mercor's benchmark of long tasks in banking, consulting and law; frontier models finish under 25% of them."}, {"t": "Forward deployed engineer", "mem": "Embedded builder.", "d": "An engineer who works inside a customer's company to build and deploy a solution into their real tools."}], "vis": [{"rule": "Four parts, evaluations tied to the customer's bar, run continuously."}, {"title": "What Mercor Enterprise sells", "flow": ["Discover", "Deploy", "Improve", "Monetize"], "note": "Monetize is opt-in data licensing. Delivered by business experts and forward deployed engineers."}, {"title": "The case studies, as Mercor reports them", "vs": {"cols": ["Case", "Number"], "rows": [["Incident-response agent", "over 50% lower median time to mitigation"], ["PE value-creation assessment", "$7 to 9M upside run-rate savings"], ["Customer-success agent", "about 12,000 requests a week"], ["HR readiness evaluation", "132 expert-graded runs"], ["Workflow diagnostic", "25 workflows, 5 agents prioritised"]]}}]}}, {"t": "Discovery before solutions: the questions, the metrics, the pilot", "m": 15, "out": "A new enterprise customer says 'we want an agent for support'. What do you ask, what is the success metric, and how do you phase it?", "d": "Discovery is how you avoid building the wrong thing well. The public guides give a simple order: acknowledge the customer's goal, ask two or three targeted questions, define what success means in a number, then propose a small pilot with the rule for when to expand. Mercor's own Discover offering is this step turned into a product: a ranked list of opportunities with ROI estimates. Starting small is deliberate. A tight scope is cheaper to expand than a loose one is to unwind.", "pts": ["Goal and owner: what outcome do you want, and who decides if it worked? A person with a name, not a team", "The work today: walk me through one real case. Where does it start, who touches it, where does it go wrong, how long does it take", "Failure cost: what happens when the agent is wrong? A wrong answer on a refund costs money, a wrong answer on a medical question costs more. That sets how much a person must check", "Constraints not yet shared: data they cannot share, systems that cannot change, security review, who must sign off", "Success metric, in numbers: one outcome (time to resolve, share handled without a person, cost per case) and one guardrail (error rate, escalations that should not have happened). Agree how it is measured before building", "Baseline: measure how it works today first. A pilot with no baseline cannot prove anything", "Phase the pilot: one team or one request type, a defined length, a real evaluation set made with their experts, a human in the loop at first", "Expansion criteria, written down before you start: 'if resolution without a person is above X and errors below Y for two weeks, we add the next request type'. Agree the stop rule too"], "where": "FDE Academy: scoping and phased rollout; Mercor Enterprise page: the Discover and Deploy offerings", "url": "https://fde.academy/blog/forward-deployed-engineer-interview-questions", "ans": {"lead": "Before I propose anything I'd ask what success looks like, who decides, and what it costs when the agent is wrong.", "pts": ["Walk me through one real case today, start to finish, so I see where it actually goes wrong.", "What can't we touch: data, systems, security review, sign-off.", "Metric: one outcome and one guardrail, agreed in numbers, with a baseline measured first.", "Pilot: one request type, a few weeks, a real evaluation set built with their own experts, a person checking at first.", "Expansion: the numbers that unlock the next phase, written down before we start, and the number that stops it."], "close": "That way the customer sees value early and nobody is surprised later."}, "sdLinks": [], "read": [{"label": "FDE Academy: scoping questions and a phased rollout", "url": "https://fde.academy/blog/forward-deployed-engineer-interview-questions", "m": 8}], "figs": [], "sheet": {"cheat": ["Ask: the goal and who decides; one real case end to end; what a wrong answer costs; what cannot change.", "One outcome metric plus one guardrail, in numbers.", "Measure the baseline before the pilot.", "Pilot: one request type, a few weeks, an evaluation set built with their experts, a person checking.", "Write expansion criteria and the stop rule before you start.", "A tight scope is cheaper to expand than a loose one is to unwind."], "terms": [{"t": "Guardrail metric", "mem": "What must not get worse.", "d": "A second number, such as error rate, that you watch so the main metric is not won by cutting a corner."}, {"t": "Baseline", "mem": "Before you start.", "d": "How the work performs today; without it a pilot cannot show an improvement."}, {"t": "Expansion criteria", "mem": "Numbers that unlock more.", "d": "The agreed results that decide the pilot grows to the next request type or team."}, {"t": "Pilot", "mem": "Small, timed, measured.", "d": "A limited first deployment with a defined length and success rule, used to learn before scaling."}], "vis": [{"rule": "Goal, one real case, cost of a wrong answer, constraints. Then metric, baseline, pilot, expansion rule."}, {"title": "Discovery questions", "ladder": [["1", "what outcome, and who decides?", ""], ["2", "walk me through one real case", ""], ["3", "what does a wrong answer cost?", ""], ["4", "what can we not touch?", ""]]}, {"title": "A pilot, written before it starts", "calc": [["metric", "share handled without a person"], ["guardrail", "errors that should not happen"], ["baseline", "measured first"], ["expand if", "both hold for two weeks"], ["stop if", "guardrail breaks"]]}]}}, {"t": "Three practice scenarios, with model answers", "m": 20, "out": "Say each answer aloud in about 90 seconds, then compare. Where did you jump to a solution before you asked?", "d": "These are the three shapes the public guides report most: something broke, someone asks for the wrong thing, and someone needs to understand something technical. Each answer follows the same spine: acknowledge, ask, state the plan with a number, name the trade-off. The model answers are in your voice and use only facts from your work. Change the words until they sound like you, but keep the order.", "pts": ["Scenario 1: a customer says their agent's quality dropped. 'Last week it was fine. Now my team says it is making mistakes.' You acknowledge the cost to their team, then separate what changed (a model update, new input types, a change on their side, a prompt change) from what is only noticed more. You ask what 'worse' means with three real examples. You check traces against a fixed evaluation set. You commit to a time for a first answer. Say what you will tell the customer and what you will do technically at the same time", "Model answer 1, in your voice: 'First I'd say I understand this is hitting their team, and that I'll have a first diagnosis by end of day. Then I'd ask for three real examples of the mistakes and when it started. At alfred_ I built an evaluation harness that replays real traces, so the first thing I'd do is run the same cases from before and after and see whether quality actually moved, or whether the input changed. I'd also check the failures from production for a pattern, like one tool or one request type. I'd tell the customer what I found in plain words, what I'm fixing, and how we'll check it stays fixed.'", "Scenario 2: a buyer asks for something that will not solve their problem. 'Add a chat box that answers anything about our policies.' You validate the goal, ask what problem sits behind it, show what would go wrong (answers that sound right but are stale or wrong), and offer a version that works: start with the 20 questions that make up most of the volume, with sources shown and a person for the rest", "Model answer 2, in your voice: 'I'd start by saying I get the goal, fewer repeat questions to your team. Then I'd ask which questions come up most and what happens today when someone gets a wrong answer. I'd be honest that an answer-anything box will sometimes sound sure and be wrong, and that's the thing that loses trust. So I'd suggest we start with the most common questions, show the source for each answer, and measure how many get resolved without a person. If that works, we widen it. I'd rather say that now than ship something that makes their team trust it less.'", "Scenario 3: explain to a non-technical executive why an AI system's output varies. 'Why did it give a different answer to the same question?' Use a comparison from their own world, say it is expected, and then say what you do to bound it", "Model answer 3, in your voice: 'Think of asking two good analysts the same question. Both are competent and the wording will differ, and sometimes one weighs a point differently. The model works like that: it picks among likely answers, so the wording varies. The part that matters for you is whether the facts and the decision are stable. So we keep the facts out of the model's hands: it picks from real records and the system attaches the names and numbers, and we test a fixed set of cases so we can see if the answers on the things that matter ever change.'", "Spine to repeat: acknowledge, ask, plan with a number, trade-off. If you notice you are two sentences into a solution without a question, stop and ask one"], "where": "FDE Academy: the unhappy customer, saying no, and the CFO variance questions; Perspective AI: the sample customer questions. Model answers use facts from your alfred_ work only.", "url": "https://fde.academy/blog/forward-deployed-engineer-interview-questions", "ans": {"lead": "The three go the same way: I acknowledge the problem, I ask before I answer, and I give a plan with a number and a trade-off.", "pts": ["Quality dropped: acknowledge the cost, ask for three real examples, replay the same cases before and after to see whether it actually changed, then tell them what I found in plain words.", "A request that won't solve it: agree with the goal, ask what sits behind it, be honest about the risk, and offer a smaller version that works and a way to measure it.", "Why it varies: compare it to asking two good analysts, say that wording varies but facts shouldn't, and say how I keep the facts stable.", "Each has a number at the end, so the customer knows how we'd tell it worked."], "close": "I'd rather say the honest thing early than ship something that loses their trust."}, "sdLinks": [], "read": [{"label": "FDE Academy: the unhappy customer, saying no, and explaining variance to a CFO", "url": "https://fde.academy/blog/forward-deployed-engineer-interview-questions", "m": 8}, {"label": "Perspective AI: a customer demands a feature that will not solve the problem", "url": "https://getperspective.ai/blog/forward-deployed-engineer-interview-questions-2026-prep-guide", "m": 6}], "figs": [], "sheet": {"cheat": ["Spine for all three: acknowledge, ask, plan with a number, trade-off.", "Quality dropped: three real examples, replay the same cases before and after, was it the model, the input, or the noticing?", "Wrong request: agree with the goal, ask what sits behind it, be honest about the risk, offer a smaller version that works.", "Output varies: compare to two good analysts; wording varies, facts should not; say how you keep facts stable.", "Say what you tell the customer and what you do technically, in parallel.", "If you are two sentences into a solution with no question, stop and ask one."], "terms": [{"t": "Replay", "mem": "Same cases, before and after.", "d": "Running a fixed set of past cases through the system again to see whether quality actually changed."}, {"t": "Reframe", "mem": "Their goal, a smaller step.", "d": "Saying no to a request by agreeing with the goal behind it and proposing a version that will work."}, {"t": "Output variance", "mem": "Wording moves, facts should not.", "d": "The model picks among likely answers, so phrasing differs between runs; you bound it by controlling the facts and testing a fixed set."}], "vis": [{"rule": "Acknowledge, ask, plan with a number, trade-off."}, {"title": "Three scenarios, one spine", "vs": {"cols": ["Scenario", "First move", "Number to end on"], "rows": [["Quality dropped", "three real examples, replay before and after", "quality on a fixed set"], ["Wrong request", "agree with the goal, ask what sits behind it", "share resolved without a person"], ["Output varies", "two good analysts", "answers on the facts that matter stay the same"]]}}, {"title": "When quality drops, ask in this order", "ladder": [["1", "did it really change? replay the same cases", ""], ["2", "what changed: model, input, their side, prompt", ""], ["3", "which request type or tool fails", ""], ["4", "fix, then keep the cases as a check", ""]]}]}}, {"t": "Your own material: users at alfred_, and explaining trade-offs", "m": 10, "out": "Tell me about a time you worked with non-technical users, and how you explained a technical trade-off to someone who does not code.", "d": "Use what is true. At alfred_ the users are everyday people, not engineers: more than 5,000 active users who talk to an assistant about their email, calendar and tasks. That is a live user base, which is the closest thing to a customer you have. Your facts that fit this round: users make email rules in plain language from chat (about 98% of rules), you added a check that warns when a new rule matches none of the user's recent mail, you built a read-only tool that answers 'why was I notified', you fixed notification bugs such as one email becoming two texts, and your working memory is built so the model cannot invent a name or an owner. Add one real moment of your own: a user report, a message from the team, a question from a non-technical teammate. If you do not have one, say so and use the tool you built, because that is true.", "pts": ["Plain-language rules: users never write a filter, they say what they want in chat. The system has to be right about what they meant, so you built a check that warns when a new rule matches nothing in their recent mail. That is empathy turned into a feature", "'Why was I notified': a person gets a text and wonders why. You built a read-only tool that answers it. Trust grows when users can see the reason", "Notification precision: one email became two texts, and OTP alerts fired falsely on tracking links. Fixing these was about what the user feels, not what the code does", "Trade-off in plain words: strict-ID memory. 'The model never writes a name or an owner itself. It picks from real items and the code attaches who owes what. It costs flexibility, and it means the assistant cannot make up a person.' That is a trade-off a non-engineer can follow", "Cost versus quality in plain words: the deterministic matcher cut per-user model cost by about 30%. 'We use the model for the
