<script type="application/json" id="loop-data">{"id": "mercor", "title": "Mercor, Applied AI (Enterprise)", "subtitle": "Round 2: a conversational technical screen on caching", "when": "Friday 23 October, 6:00 to 6:30 PM Eastern", "when_iso": "2026-10-23T18:00:00-04:00", "who": "Sophie Guo, Applied AI Engineer at Mercor (MIT, EECS and Biological Engineering; ML before that at J&J and Cellarity). Round 1 was with Neel Taneja; Todd Dockery is the recruiter.", "format": "Thirty minutes on Google Meet, conversational: no coding tools, no LLMs. Candidates report a short function that caches an expensive call, handed over for a spoken code review, then deeper questions on concurrency, memory, failures and staleness. One report adds a quick follow-up on another topic (retries and idempotency).", "bar": "From the brief: clear assumptions, concrete examples of what fails, and trade-offs when you propose a fix, as the workload grows and requests run concurrently. Say the assumption, name the failure with an example, give the fix and what it costs. Breadth and pace: one report says the screen was rapid-fire.", "sessions": [{"id": "wc32", "name": "The cache code review, out loud", "blurb": "The screen as candidates report it: a short cached function to review. Assumptions first, then each failure with an example and its fix.", "intro": "Mercor's caching screen, as three candidates describe it, hands you a few lines that check a cache, compute or await on a miss, and store the result, then asks what you would say in a code review. This session is that review: what you assume first, then concurrency, memory and failures, in the order the interviewer tends to probe.", "len": "50m", "day": "1", "steps": [{"t": "State your assumptions, then review in a fixed order", "m": 15, "out": "Someone hands you this function in a code review. What do you assume first, and what is wrong with it?", "d": "The function: cache = {}; def get(x): if x in cache: return cache[x]; v = compute(x); cache[x] = v; return v. compute is slow and sometimes fails. One reported version is JavaScript, with await inside a function that is not async and cache.set(key) with no value: bugs before any race. Say what you assume, then walk the same order every time: correctness on one caller, concurrency, memory, errors, staleness, visibility.", "pts": ["Assumptions: one process or many; threads, asyncio or both; how slow and costly compute is; whether it is pure (same input, same output); the read-to-write ratio; how stale an answer may be; whether x comes from a user", "One caller: right on a hit and on a miss? Read the code literally first. The reported JavaScript version is broken before any concurrency", "Concurrency: two callers miss the same key at once and both run compute. Twice the cost, and twice the side effect if compute writes anything", "Memory: the dict never evicts, so it grows with every distinct x until the process runs out, and it keeps every value alive", "Errors: if compute raises, nothing is stored and every caller retries at once; if a failure value is stored, it is served forever", "Staleness: nothing expires, so when the source changes the cache is wrong until the process restarts", "Keys: x must be hashable and normalised; unvalidated user input lets anyone fill memory with junk keys", "Visibility: no hit ratio, size or timing, so nobody can tell whether the cache helps"], "where": "PracHub: a candidate's report of this screen (the concurrency code review)", "url": "https://prachub.com/interview-experiences/mercor-software-engineer-interview-experience-a-product-focused-recruiter-screen-then-sorting-theory-and-a-concurrency-code-review", "ans": {"lead": "I'd say what I'm assuming, then go through correctness, concurrency, memory, errors and staleness, with a concrete failure for each.", "pts": ["Assumptions: I'd ask whether this runs in one process or across many, threads or asyncio, how expensive compute is, and how stale an answer can be. The fixes depend on those.", "Concurrency: two requests that miss the same key at the same time both run compute, so the expensive call runs twice, and if it has side effects they happen twice.", "Memory: nothing is ever evicted, so the dict grows with every new key until the process falls over.", "Errors: if compute throws, nothing is cached and every caller hits it again at once; there's no timeout either, so a hung call holds everyone.", "Staleness and visibility: nothing expires, and there's no hit ratio or size metric, so we can't tell if it's helping."], "close": "Then I'd fix them in that order: make the miss run once, bound the memory, handle failures, add a TTL and metrics."}, "sdLinks": [], "read": [], "figs": [], "sheet": {"cheat": ["Assumptions first: one process or many, threads or asyncio, cost of compute, pure or not, read-to-write ratio, staleness allowed, user input or not.", "Then the same order every time: one caller, concurrency, memory, errors, staleness, visibility.", "One caller: read it literally. await in a non-async function, or a set with no value, is a bug before any race.", "Concurrency: two misses on one key both run compute: double cost, double side effects.", "Memory: a dict that never evicts grows with every distinct key and keeps every value alive.", "Errors: an exception stores nothing, so every caller retries at once; a stored failure is served forever.", "Staleness: no expiry means wrong forever once the source changes.", "Visibility: without hit ratio, size and timing, nobody knows if the cache helps."], "terms": [{"t": "Cache hit, cache miss", "mem": "Found it, or go and get it.", "d": "A hit returns a stored value; a miss means computing or fetching it from the source."}, {"t": "Pure function", "mem": "Same in, same out, nothing else touched.", "d": "A function whose result depends only on its inputs and that has no side effects; only these are safe to cache without care."}, {"t": "Side effect", "mem": "Something changes outside the function.", "d": "Any effect beyond the return value, such as a write, a payment or a message; running it twice does it twice."}, {"t": "Staleness", "mem": "Old, and still being served.", "d": "How far a cached value may lag the source; the tolerance is a product decision, stated per kind of data."}], "vis": [{"rule": "Say what you assume, then walk the same order every time: one caller, concurrency, memory, errors, staleness, visibility."}, {"title": "The snippet, with each problem pinned to its line", "code": "cache = {}\ndef get(x):\n    if x in cache:\n        return cache[x]\n    v = compute(x)\n    cache[x] = v\n    return v", "pins": [[1, "never evicts: grows with every new x, keeps every value alive"], [3, "check, then act: a second caller can miss in the gap"], [5, "slow and fallible: no timeout; if it raises, every caller retries at once"], [6, "no expiry: once the source changes, wrong until restart"]]}, {"title": "Ask before you judge", "parts": [["process?", "one or many"], ["threads?", "or asyncio"], ["compute", "cost, pure?"], ["reads : writes", "ratio"], ["staleness", "allowed?"], ["x", "from a user?"]]}]}}, {"t": "Two requests miss at once: make compute run once", "m": 20, "out": "Two requests miss the same key at the same moment. What happens, and how do you make compute run once without slowing every hit?", "d": "Check, then act, is two operations, so another caller can slip in between them. A lock fixes it, but where the lock sits decides whether hits stay fast. In CPython one dict get or one dict set is atomic under the GIL; the check and the set together are not. The same race happens in asyncio, at every await.", "pts": ["The race: A checks and misses, starts compute; B checks before A stores, misses, computes too", "One lock around the whole function: correct, but every hit queues behind a miss that takes seconds. The lock is too broad", "Lock only the miss and check again inside it: if hit, return; take the lock; if hit now, return; compute; store. That is double-checked locking", "Per-key locks: a slow miss on one key no longer blocks a miss on another. The map of locks needs its own guard and cleanup", "Share the work in flight: the first miss stores a future for x and the others wait on it. Go calls this singleflight; it is also called request coalescing", "asyncio: cache the Task, not the coroutine and not only the result. A coroutine can be awaited once; a Task can be awaited by every caller. Remove it if it fails", "functools.lru_cache keeps its own structure thread-safe, but its docs say the function can run more than once if a second call starts before the first finishes", "Across processes or hosts, a process lock does nothing: use the shared cache's atomic set-if-absent with an expiry, or a lease, so a crashed holder cannot block the key"], "where": "Python docs: functools, lru_cache (the note on calls running more than once); then the discussion on caching coroutines", "url": "https://docs.python.org/3/library/functools.html#functools.lru_cache", "ans": {"lead": "The check and the set aren't atomic together, so I'd lock only the miss, check again inside the lock, and share the in-flight result.", "pts": ["The race: both requests check, both miss, both compute. In Python a single dict operation is atomic, but check-then-set isn't.", "Lock placement: one lock around everything is correct but makes every hit wait behind a slow miss, so I'd lock only on the miss and re-check inside, double-checked locking.", "Per key: one lock per key, so a slow miss on one key doesn't block the others.", "In-flight sharing: better still, store a future for the key on the first miss and have everyone else await it. In asyncio that means caching the Task, and dropping it if it fails.", "Many processes: a process lock doesn't help across machines, so it'd be an atomic set-if-absent with an expiry in the shared cache, or a lease."], "close": "So compute runs once per key, hits never take a lock, and a crash can't hold a key forever."}, "sdLinks": [], "read": [], "figs": [], "sheet": {"cheat": ["Check-then-act is two steps: a second caller can miss between the check and the set.", "In CPython one dict get or set is atomic under the GIL; check plus set is not.", "One lock around everything is correct but makes every hit wait behind a slow miss.", "Double-checked locking: check, take the lock only on a miss, check again, compute, store.", "Per-key locks stop one slow key from blocking the others.", "Single-flight: the first miss stores a future; later callers await it. Compute runs once.", "asyncio: cache the Task, not the coroutine (a coroutine can be awaited once); drop the Task if it fails.", "lru_cache keeps its structure safe but may call the function twice for one key.", "Across hosts: set-if-absent with an expiry, or a lease; a process lock does nothing there."], "terms": [{"t": "Race condition", "mem": "Two callers, one gap, wrong outcome.", "d": "A bug where the result depends on how two concurrent operations interleave."}, {"t": "Check-then-act", "mem": "Looked empty, someone filled it meanwhile.", "d": "Deciding on a check and acting on it later, with nothing stopping the state changing in between."}, {"t": "Double-checked locking", "mem": "Check, lock, check again.", "d": "Checking without the lock, taking it only on a miss, and checking again inside before doing the work."}, {"t": "Single-flight", "mem": "One request in the air per key.", "d": "Duplicate calls for the same key share the result of the one call already in flight; also called request coalescing."}, {"t": "GIL", "mem": "One Python thread runs bytecode at a time.", "d": "CPython's global interpreter lock; it makes single dict operations atomic but not a sequence of them."}, {"t": "Task (asyncio)", "mem": "A coroutine already running, awaitable by many.", "d": "A scheduled coroutine; any number of callers can await the same Task and get its result."}], "vis": [{"title": "The race, in time", "lanes": [["A", [["check: miss", "plain"], ["compute (3 s)", "hot", "3"], ["set", "plain"]]], ["B", [["check: miss", "plain", "", "48px"], ["compute again", "hot", "3"], ["set", "plain"]]]], "note": "B checks before A has stored. One dict get or set is atomic under the GIL; the check and the set together are not."}, {"title": "The fixes, compared", "vs": {"cols": ["Correct", "Hits stay fast", "Runs once", "Across hosts"], "rows": [["One lock around all", "yes", "no: hits wait behind a slow miss", "yes", "no"], ["Lock the miss, check again", "yes", "yes", "yes", "no"], ["Per-key lock", "yes", "yes, and keys don't block each other", "yes", "no"], ["Share the in-flight future", "yes", "yes", "yes: everyone awaits one", "no"], ["Set-if-absent with expiry", "yes", "yes", "yes", "yes"]]}}, {"title": "In asyncio", "code": "inflight = {}\ndef get(x):\n    if x not in inflight:\n        inflight[x] = asyncio.ensure_future(compute(x))\n    return inflight[x]   # every caller awaits the same Task", "pins": [[4, "cache the Task, not the coroutine: a coroutine can be awaited once"], [5, "if it fails, remove it, or every caller gets the same exception"]]}]}}, {"t": "Bound the memory, and decide what a failure caches", "m": 15, "out": "This cache runs for a week in a busy service. What goes wrong with memory and with failures, and what do you change?", "d": "An unbounded cache is a slow memory leak, and a cache that stores failures turns one bad call into a week of bad answers. Bound it by count or by bytes, expire entries, and treat failures on purpose.", "pts": ["Bound it: a maximum size and an eviction policy. LRU drops the least recently used, LFU the least frequently used; Redis approximates LRU by sampling a few keys", "Bound by bytes when values vary: a thousand 1 KB entries and a thousand 10 MB entries are different caches", "TTL on every entry, so staleness has a limit and dead keys leave", "Do not store an exception as a value. Let the next caller retry, with backoff so a failing source is not hammered", "If failures are frequent and expensive, cache them briefly on purpose: negative caching, with its own short TTL", "In asyncio a failed Task stays failed: remove it from the cache when it raises, or every later caller gets the same exception", "Give compute a timeout, so a hung call releases its lock or its waiters", "Watch it: hit ratio = hits / (hits + misses), size, evictions, compute latency. Evictions rising while the hit ratio falls means the cache is too small"], "where": "Redis docs: key eviction (maxmemory, LRU against LFU, the hit ratio)", "url": "https://redis.io/docs/latest/develop/reference/eviction/", "ans": {"lead": "I'd cap it, expire it, and never let one failure get cached as the answer.", "pts": ["Bound: a max size with LRU eviction, or by bytes if values vary a lot.", "Expiry: a TTL on everything, so stale data and dead keys age out.", "Failures: don't cache the exception; retry with backoff, and if failures are frequent, cache them briefly with a short TTL on purpose.", "Timeouts: a timeout on compute, so a hung call doesn't hold its waiters.", "Metrics: hit ratio, size and evictions, so we know if the size is right."], "close": "Then the cache can run for a week without becoming the incident."}, "sdLinks": [], "read": [], "figs": [], "sheet": {"cheat": ["Bound the size: LRU drops least recently used, LFU least frequently used.", "Bound by bytes when values vary in size.", "A TTL on every entry limits staleness and clears dead keys.", "Don't store an exception as a value; retry with backoff instead.", "Frequent, expensive failures: cache them briefly on purpose, with a shorter TTL (negative caching).", "A failed asyncio Task stays failed; remove it when it raises.", "A timeout on compute releases the lock and the waiters if the call hangs.", "Hit ratio = hits / (hits + misses). Evictions up and hit ratio down: the cache is too small."], "terms": [{"t": "Eviction", "mem": "Full, so something has to go.", "d": "Removing entries to stay within a size limit, chosen by a policy."}, {"t": "LRU", "mem": "Untouched longest, out first.", "d": "Least recently used: evicts the entry whose last access is oldest."}, {"t": "LFU", "mem": "Used least often, out first.", "d": "Least frequently used: evicts the entry with the fewest accesses, usually with counts that decay."}, {"t": "TTL", "mem": "A use-by date on every entry.", "d": "Time to live: how long an entry stays before it expires."}, {"t": "Negative caching", "mem": "Remember the no, briefly.", "d": "Storing 'not found' or a failure for a short time so repeated misses do not reach the source."}, {"t": "Hit ratio", "mem": "How often the cache answers.", "d": "hits / (hits + misses); with eviction counts, it tells you whether the cache is sized right."}], "vis": [{"title": "A week in a busy service", "split": [["Without a bound", ["memory grows until the process dies", "one failure cached is served all week", "a hung compute holds its waiters", "nobody knows the hit ratio"]], ["With one", ["max size, LRU or by bytes", "TTL on every entry", "failures not cached, or briefly on purpose", "timeout on compute; metrics on hits, size, evictions"]]]}, {"title": "Is it sized right?", "calc": [["hit ratio", "hits / (hits + misses)"], ["evictions ↑, hit ratio ↓", "too small"], ["hit ratio flat, memory ↑", "too big, or keys never reused"]]}]}}], "study": [], "quiz": [{"q": "In your own words: State your assumptions, then review in a fixed order.", "a": "I'd say what I'm assuming, then go through correctness, concurrency, memory, errors and staleness, with a concrete failure for each. Assumptions: I'd ask whether this runs in one process or across many, threads or asyncio, how expensive compute is, and how stale an answer can be. The fixes depend on those. Concurrency: two requests that miss the same key at the same time both run compute, so the expensive call runs twice, and if it has side effects they happen twice. Memory: nothing is ever evicted, so the dict grows with every new key until the process falls over. Errors: if compute throws, nothing is cached and every caller hits it again at once; there's no timeout either, so a hung call holds everyone. Staleness and visibility: nothing expires, and there's no hit ratio or size metric, so we can't tell if it's helping. Then I'd fix them in that order: make the miss run once, bound the memory, handle failures, add a TTL and metrics."}, {"q": "In your own words: Two requests miss at once: make compute run once.", "a": "The check and the set aren't atomic together, so I'd lock only the miss, check again inside the lock, and share the in-flight result. The race: both requests check, both miss, both compute. In Python a single dict operation is atomic, but check-then-set isn't. Lock placement: one lock around everything is correct but makes every hit wait behind a slow miss, so I'd lock only on the miss and re-check inside, double-checked locking. Per key: one lock per key, so a slow miss on one key doesn't block the others. In-flight sharing: better still, store a future for the key on the first miss and have everyone else await it. In asyncio that means caching the Task, and dropping it if it fails. Many processes: a process lock doesn't help across machines, so it'd be an atomic set-if-absent with an expiry in the shared cache, or a lease. So compute runs once per key, hits never take a lock, and a crash can't hold a key forever."}, {"q": "In your own words: Bound the memory, and decide what a failure caches.", "a": "I'd cap it, expire it, and never let one failure get cached as the answer. Bound: a max size with LRU eviction, or by bytes if values vary a lot. Expiry: a TTL on everything, so stale data and dead keys age out. Failures: don't cache the exception; retry with backoff, and if failures are frequent, cache them briefly with a short TTL on purpose. Timeouts: a timeout on compute, so a hung call doesn't hold its waiters. Metrics: hit ratio, size and evictions, so we know if the size is right. Then the cache can run for a week without becoming the incident."}], "hasTrackerQuiz": false, "figs": []}, {"id": "wc33", "name": "Caching under load: stale data, stampedes, failure", "blurb": "As the workload grows: the write that leaves a stale value forever, the hot key that expires, many processes, and what happens when the cache or the source fails.", "intro": "The brief says correctness, performance and reliability as workloads grow and requests run concurrently. Week 5 gave you placement, keys and TTL against invalidation. This session is what breaks once there are many requests, many processes and a database behind it.", "len": "1h", "day": "2", "steps": [{"t": "The write that leaves a stale value cached forever", "m": 15, "out": "With cache-aside, how can a stale value end up in the cache forever, and how do you prevent it?", "d": "Cache-aside: read the cache; on a miss read the database and fill the cache; on a write, update the database and remove the key. The order of those operations, and a reader that is slow, decide whether old data can win.", "pts": ["Delete the key on a write rather than updating it: deletes are idempotent, and two concurrent updates can land in the wrong order", "Write the database first, then invalidate. Invalidate first and a reader can refill the old value before the write commits", "The race that remains: reader R misses and reads the old row; writer W commits and deletes the key; R then stores the old value. It stays until it expires", "A TTL makes 'forever' at most one TTL", "Leases, from Facebook's memcache: a miss gets a token, a delete cancels the token, and a set with a cancelled token is refused, so R's late write is dropped", "Versions: store a version with the value and refuse to overwrite a newer one", "Read your own writes: the user who just saved expects to see it; read through to the database for that user for a moment", "Say the tolerance out loud: stale by a few seconds is fine for a dashboard, never for a balance or a permission"], "where": "Azure Architecture Center: cache-aside pattern; then Facebook, Scaling Memcache (NSDI 2013), section 3.2.1 Leases", "url": "https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside", "ans": {"lead": "A slow reader can put an old value back after the writer deletes it; I'd bound it with a TTL and stop it with a lease or a version check.", "pts": ["The pattern: write the database, then delete the key. Delete, not update, because deletes are idempotent.", "The race: a reader misses and reads the old row, the writer commits and deletes, then the reader sets the old value back, and it stays.", "Bound it: a TTL means it's wrong for at most one TTL.", "Stop it: a lease, like Facebook's memcache, where the delete invalidates the reader's token so its late set is refused; or a version on the value.", "Tolerance: I'd ask how stale is acceptable; for balances or permissions I'd read from the source."], "close": "Order of operations plus a TTL handles most of it; leases or versions close the rest."}, "sdLinks": [], "read": [], "figs": [], "sheet": {"cheat": ["Cache-aside: read the cache; on a miss, read the database and fill; on a write, update the database, then delete the key.", "Delete rather than update: deletes are idempotent; concurrent updates can land out of order.", "Database first, then invalidate; the other order lets a reader refill the old value.", "Remaining race: reader reads old row, writer commits and deletes, reader sets old value. It stays until it expires.", "TTL bounds it; a lease (token cancelled by the delete) or a version check stops it.", "Read your own writes: read through to the database for the user who just wrote.", "Say the tolerance: a few seconds is fine for a dashboard, never for a balance or a permission."], "terms": [{"t": "Cache-aside", "mem": "The app fetches and fills.", "d": "The application reads the cache, loads from the source on a miss and fills the cache; writes go to the source and invalidate the key."}, {"t": "Invalidation", "mem": "Throw the old copy away.", "d": "Removing or expiring a cached entry because the source changed."}, {"t": "Lease", "mem": "A ticket to write back, cancelled by any delete.", "d": "A token handed out on a miss; a set must present it, and a delete in between cancels it, so a late stale set is refused."}, {"t": "Read-your-writes", "mem": "I saved it, so I see it.", "d": "The guarantee that a user's own write is visible to that user's next read."}, {"t": "Idempotent", "mem": "Twice is the same as once.", "d": "An operation whose repeated application has the same effect as applying it once, like a delete."}], "vis": [{"title": "How the old value wins", "lanes": [["Reader", [["miss", "plain"], ["reads old row", "plain", "2"], ["", "gap", "2"], ["sets OLD value", "hot", "2"]]], ["Writer", [["", "gap", "2", "40px"], ["commits new row", "done", "2"], ["deletes key", "done"]]]], "note": "The reader's late set lands after the delete. The stale value stays until it expires."}, {"title": "What stops it", "vs": {"cols": ["What it does", "Cost"], "rows": [["TTL", "'forever' becomes at most one TTL", "more misses"], ["Write DB, then delete", "deletes are idempotent; order matters", "one round trip"], ["Lease", "a delete cancels the reader's token; the late set is refused", "a token per miss"], ["Version", "never overwrite a newer version", "a version on every value"]]}}]}}, {"t": "A hot key expires: the stampede, and how to stop it", "m": 15, "out": "A popular key expires under heavy load. What happens to the database, and what are three ways to stop it?", "d": "When a hot key expires, every request misses together and goes to the source. The size of the burst is the request rate times the recompute time: 10 requests a second and a 3 second recompute give 30 recomputes of the same thing.", "pts": ["Coalesce: one recompute per key, the rest wait for it (the single-flight from the code review)", "Serve stale while one caller refreshes: a soft TTL starts a background refresh, a hard TTL is the real limit", "Refresh early, at random: XFetch recomputes before expiry with a probability that rises as expiry nears, so one request refreshes ahead of the crowd", "Jitter the TTL: entries filled together expire together; add a few percent at random so expiries spread out", "A refresh lock needs its own expiry, or a holder that dies blocks the key", "Facebook throttled with leases too: one token per key every 10 seconds, the rest wait or take a slightly stale value; peak database queries fell from 17K a second to 1.3K"], "where": "Vattani, Chierichetti and Lowenstein, Optimal Probabilistic Cache Stampede Prevention (VLDB 2015)", "url": "https://cseweb.ucsd.edu/~avattani/papers/cache_stampede.pdf", "ans": {"lead": "Every request misses together and hits the database; I'd coalesce, serve stale while one request refreshes, and jitter the TTLs.", "pts": ["The burst: request rate times recompute time. Ten a second and a three-second recompute is thirty identical queries.", "Coalesce: one recompute per key; everyone else waits on it.", "Stale while refreshing: a soft TTL triggers a background refresh while the old value is still served.", "Spread expiries: jitter on TTLs, or refresh early with a probability that rises near expiry.", "Locks expire: whatever guards the refresh needs a timeout of its own."], "close": "The database should see one query per hot key per refresh, not one per request."}, "sdLinks": [], "read": [], "figs": [], "sheet": {"cheat": ["Stampede: a hot key expires and every request misses together.", "Burst size ≈ request rate × recompute time: 10 per second × 3 s = 30 recomputes.", "Coalesce: one recompute per key; the rest wait.", "Soft TTL serves stale and refreshes in the background; the hard TTL is the limit.", "XFetch refreshes early with a probability that rises as expiry nears.", "Jitter the TTL so entries filled together do not expire together.", "A refresh lock needs its own expiry.", "Facebook's lease throttle: one token per key per 10 s; peak database load fell from 17K/s to 1.3K/s."], "terms": [{"t": "Cache stampede", "mem": "Everyone runs to the database at once.", "d": "Many concurrent misses on one expired key, all recomputing it; also called a thundering herd or dogpile."}, {"t": "Soft TTL", "mem": "Past its best, still served while one refreshes.", "d": "An age after which a value is refreshed in the background but still returned, until a hard TTL."}, {"t": "Stale-while-revalidate", "mem": "Answer now, update behind.", "d": "Serving the old value while one request fetches the new one."}, {"t": "TTL jitter", "mem": "Shake the use-by dates.", "d": "Adding a small random amount to each TTL so expiries spread out instead of arriving together."}, {"t": "Probabilistic early expiration", "mem": "Refresh early, by a coin whose odds rise.", "d": "Recomputing before expiry with a probability that grows as expiry nears (XFetch), so one request refreshes ahead of the crowd."}], "vis": [{"rule": "A hot key expires and every request misses at once."}, {"title": "How big the burst is", "calc": [["burst", "request rate × recompute time"], ["10 / s × 3 s", "30 identical recomputes"], ["Facebook, with leases", "17K/s peak → 1.3K/s"]]}, {"title": "Four ways out", "flow": ["coalesce: one recompute per key", "serve stale, refresh behind (soft TTL)", "refresh early at random (XFetch)", "jitter TTLs so expiries spread"], "note": "Any lock that guards a refresh needs its own expiry."}]}}, {"t": "Many processes and hosts: where the cache lives", "m": 15, "out": "The service now runs as twenty processes on five machines. What changes about the cache?", "d": "A cache in process memory is the fastest and the most duplicated. A shared cache is one copy behind a network hop. Most systems that grow end up with both, and the cache becomes a resource to manage like any other.", "pts": ["In-process: nanoseconds, but twenty copies: twenty misses per key, twenty times the memory, and an invalidation has to reach all of them", "Shared (Redis, Memcached): one copy, about half a millisecond away in the same data centre, survives deploys, and needs its own capacity and failure plan", "Two tiers: a small local cache with a short TTL in front of the shared one, for the hottest keys", "Hot key: one key takes a large share of traffic and saturates one cache node; a local tier, replicas, or splitting it into key#0 to key#N spreads it", "Locks across machines: an atomic set-if-absent with an expiry, or a lease; add a fencing token if a holder that lost the lock could still write", "Connections are a resource: a bounded pool, a timeout to borrow one, never a new connection per request"], "where": "AWS Builders' Library: caching challenges and strategies (local against external caches)", "url": "https://builder.aws.com/content/3K9TeXp6strMiJ4vhakpRD7BQWO/caching-challenges-and-strategies", "ans": {"lead": "Twenty in-process caches mean twenty copies to keep in sync, so I'd move to a shared cache with a small local tier for hot keys.", "pts": ["Local: fastest, but every process misses separately and invalidation has to reach all of them.", "Shared: one copy, about half a millisecond away, survives deploys, but it's now a service with its own capacity and failures.", "Both: a small local cache with a short TTL in front, for hot keys.", "Locks: a process lock doesn't cross machines; set-if-absent with an expiry, or a lease.", "Resources: a bounded connection pool with a borrow timeout."], "close": "Which one depends on how stale each process may be, and how hot the hottest key is."}, "sdLinks": [], "read": [], "figs": [], "sheet": {"cheat": ["In-process: nanoseconds, but one copy per process: N misses, N times the memory, invalidation must reach all.", "Shared cache: one copy, about 0.5 ms away in the same data centre, survives deploys, has its own failures.", "Two tiers: a small local cache with a short TTL in front of the shared one.", "Hot key: one key saturates one node; spread it with a local tier, replicas, or key#0 to key#N.", "Locks across machines: set-if-absent with an expiry, or a lease; a fencing token if a stale holder could still write.", "Connections: a bounded pool, a borrow timeout, never one connection per request."], "terms": [{"t": "Local (in-process) cache", "mem": "In my own memory, only mine.", "d": "A cache inside one process: fastest, but duplicated in every process."}, {"t": "Shared cache", "mem": "One copy, one hop away.", "d": "A separate service such as Redis or Memcached that every process reads; consistent across processes at the cost of a network call."}, {"t": "Hot key", "mem": "One key doing most of the work.", "d": "A key taking a disproportionate share of traffic, enough to overload the node that holds it."}, {"t": "Fencing token", "mem": "A number that only goes up.", "d": "A counter issued with a lock; the store rejects writes carrying an older number, so a holder that lost the lock cannot write."}, {"t": "Connection pool", "mem": "A fixed set of lines, borrowed and returned.", "d": "A bounded set of reusable connections; borrowers wait, with a timeout, when all are in use."}], "vis": [{"title": "Where the cache lives", "vs": {"cols": ["In-process", "Shared (Redis)", "Both"], "rows": [["Speed", "nanoseconds", "about 0.5 ms", "local hit, else shared"], ["Copies", "one per process", "one", "small local + one"], ["Invalidation", "must reach every process", "one place", "short local TTL"], ["Survives a deploy", "no", "yes", "shared part does"], ["Watch for", "N misses per key", "hot key on one node", "staleness of the local copy"]]}}, {"title": "Locks and connections across machines", "parts": [["SET key NX", "atomic set-if-absent"], ["EX 30", "the lock expires"], ["fencing token", "rejects a stale holder"], ["pool max", "bounded connections"], ["borrow timeout", "never wait forever"]]}]}}, {"t": "When the cache or the source fails", "m": 15, "out": "The cache cluster restarts during peak traffic. What happens, and how should the system behave?", "d": "A cache changes how much traffic the source is built for. With a 95% hit ratio the database sees 5% of requests; lose the cache and it sees all of them, 1 / (1 − 0.95) = 20 times its normal load. Design for that moment.", "pts": ["The cache is an optimisation, not a dependency: on a cache error, fall back to the source, but with a limit (a semaphore or load shedding) and a timeout on the cache call", "Warm a new cache node before it takes traffic, and restart cache nodes one at a time", "Negative caching: remember 'not found' briefly, with its own shorter TTL, so missing keys do not hit the source every time; DNS does this", "Source down: serve stale if correctness allows, with a cap on how stale; otherwise fail fast with a circuit breaker instead of queueing", "Retries with backoff and jitter, never a tight loop; an idempotency key on anything that writes", "Know your two numbers: the hit ratio, and the load the source survives without the cache"], "where": "AWS Builders' Library, same article: the sections on modal behaviour and negative caching", "url": "https://builder.aws.com/content/3K9TeXp6strMiJ4vhakpRD7BQWO/caching-challenges-and-strategies", "ans": {"lead": "At a 95% hit ratio, losing the cache sends the database twenty times its normal load, so the fallback has to be limited.", "pts": ["The jump: the database was sized for 5% of traffic and suddenly gets 100%.", "Fallback with a limit: go to the source on a cache failure, but through a concurrency limit, shedding the rest.", "Restarts: warm new nodes and restart one at a time.", "Source failing: serve stale within a cap, or fail fast behind a circuit breaker; retries with backoff and jitter.", "Negative caching: cache 'not found' briefly so missing keys don't hammer the source."], "close": "A cache should make the system faster, never the only reason it stays up."}, "sdLinks": [], "read": [], "figs": [], "sheet": {"cheat": ["Load on the source = 1 − hit ratio. At 95%, losing the cache means 1 / 0.05 = 20 times normal load.", "The cache is an optimisation, not a dependency: fall back to the source through a concurrency limit, and time out the cache call.", "Warm new nodes before traffic; restart cache nodes one at a time.", "Negative caching with a short TTL keeps missing keys off the source.", "Source down: serve stale within a cap, or fail fast with a circuit breaker.", "Retries with backoff and jitter; idempotency keys on writes.", "Know two numbers: the hit ratio, and the load the source survives without the cache."], "terms": [{"t": "Modal behaviour", "mem": "Two modes: cached, and suddenly not.", "d": "A system that behaves very differently when the cache is cold or down, because the source was sized for the cached mode."}, {"t": "Load shedding", "mem": "Drop some to save the rest.", "d": "Rejecting part of the traffic on purpose so the remaining requests are served."}, {"t": "Circuit breaker", "mem": "Stop calling what keeps failing.", "d": "After repeated failures, calls fail immediately for a while instead of waiting on a broken dependency."}, {"t": "Cache warming", "mem": "Fill it before the crowd arrives.", "d": "Loading likely keys into a cache before it takes live traffic."}, {"t": "Backoff with jitter", "mem": "Wait longer each time, not in step.", "d": "Retrying after growing, randomised delays so clients do not retry in synchronised waves."}], "vis": [{"title": "What the source suddenly sees", "ladder": [["5%", "of traffic, with a 95% hit ratio", "what the database is sized for"], ["100%", "when the cache is cold or down", "1 / (1 − 0.95) = 20× the load"]]}, {"title": "Behave on purpose", "flow": ["cache error", "fall back to the source", "through a concurrency limit", "shed the rest", "serve stale if allowed"], "note": "Warm new cache nodes before traffic, restart them one at a time; negative-cache 'not found' briefly; retry with backoff and jitter."}]}}], "study": [], "quiz": [{"q": "In your own words: The write that leaves a stale value cached forever.", "a": "A slow reader can put an old value back after the writer deletes it; I'd bound it with a TTL and stop it with a lease or a version check. The pattern: write the database, then delete the key. Delete, not update, because deletes are idempotent. The race: a reader misses and reads the old row, the writer commits and deletes, then the reader sets the old value back, and it stays. Bound it: a TTL means it's wrong for at most one TTL. Stop it: a lease, like Facebook's memcache, where the delete invalidates the reader's token so its late set is refused; or a version on the value. Tolerance: I'd ask how stale is acceptable; for balances or permissions I'd read from the source. Order of operations plus a TTL handles most of it; leases or versions close the rest."}, {"q": "In your own words: A hot key expires: the stampede, and how to stop it.", "a": "Every request misses together and hits the database; I'd coalesce, serve stale while one request refreshes, and jitter the TTLs. The burst: request rate times recompute time. Ten a second and a three-second recompute is thirty identical queries. Coalesce: one recompute per key; everyone else waits on it. Stale while refreshing: a soft TTL triggers a background refresh while the old value is still served. Spread expiries: jitter on TTLs, or refresh early with a probability that rises near expiry. Locks expire: whatever guards the refresh needs a timeout of its own. The database should see one query per hot key per refresh, not one per request."}, {"q": "In your own words: Many processes and hosts: where the cache lives.", "a": "Twenty in-process caches mean twenty copies to keep in sync, so I'd move to a shared cache with a small local tier for hot keys. Local: fastest, but every process misses separately and invalidation has to reach all of them. Shared: one copy, about half a millisecond away, survives deploys, but it's now a service with its own capacity and failures. Both: a small local cache with a short TTL in front, for hot keys. Locks: a process lock doesn't cross machines; set-if-absent with an expiry, or a lease. Resources: a bounded connection pool with a borrow timeout. Which one depends on how stale each process may be, and how hot the hottest key is."}, {"q": "In your own words: When the cache or the source fails.", "a": "At a 95% hit ratio, losing the cache sends the database twenty times its normal load, so the fallback has to be limited. The jump: the database was sized for 5% of traffic and suddenly gets 100%. Fallback with a limit: go to the source on a cache failure, but through a concurrency limit, shedding the rest. Restarts: warm new nodes and restart one at a time. Source failing: serve stale within a cap, or fail fast behind a circuit breaker; retries with backoff and jitter. Negative caching: cache 'not found' briefly so missing keys don't hammer the source. A cache should make the system faster, never the only reason it stays up."}], "hasTrackerQuiz": false, "figs": []}, {"id": "wc34", "name": "Caching LLM calls, and the caches you've run", "blurb": "What goes in the key when the expensive call is a model, and the real caches at alfred_ told as stories with what you would fix.", "intro": "Mercor Enterprise deploys agents for its customers, and your interviewer works in applied AI. Expect the snippet's compute to become a model call. This session is the key design for LLM and embedding caches, then your own caches at alfred_, so every point has a real example behind it.", "len": "45m", "day": "3", "steps": [{"t": "What goes in the key for an LLM or embedding cache", "m": 20, "out": "compute(x) is now an LLM call. What goes in the cache key, what must never be cached, and how do you invalidate when the prompt changes?", "d": "An LLM cache is only correct if the key holds everything that changes the answer. Two caches get confused: your own response cache, and the provider's prompt cache, which caches a prompt prefix, not an answer.", "pts": ["Key = everything that changes the output: model and version, system prompt version, tools, parameters (temperature, max tokens), the normalised input, and the tenant or user when the answer is per-user", "Invalidate by version: put the prompt and model version in the key, so a change is a miss, not a purge", "Temperature above 0, or an LLM judge, gives a new sample each time; a cache freezes one. For evaluations, decide whether that is what you want", "Exact against semantic: a semantic cache matches similar inputs by embedding distance and a threshold; it hits more often but can serve a wrong answer, and similar questions from two users may need different answers", "Never share across tenants: anything that changes the answer but is not in the key serves one customer's answer to another; web cache poisoning is the same mistake", "Provider prompt caching: the provider reuses a cached prefix (Anthropic orders it tools, system, messages; a hit needs an exact match up to the breakpoint; 5 minute TTL, refreshed on use). Stable text first, timestamps after the breakpoint", "Embeddings: key by a hash of the content and the embedding model; re-embed only when the hash changes"], "where": "Anthropic docs: prompt caching; then GPTCache's README on semantic caching and its false positives", "url": "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "ans": {"lead": "The key has to include everything that changes the answer, the model, prompt version, parameters, input and tenant, or the cache serves wrong answers fast.", "pts": ["The key: model and version, prompt version, tools, temperature and other parameters, the normalised input, and the tenant if the answer is per-user.", "Invalidation: versions in the key, so changing the prompt is just a miss.", "What not to cache: per-user or sensitive answers across tenants, and anything where you want a fresh sample, like an eval run at temperature above zero.", "Semantic caching: more hits, but false positives, so I'd only use it with a tight threshold and an exact-match fallback.", "Prompt caching: separately, I put the stable system prompt and tools first so the provider's prefix cache hits."], "close": "Exact-match on a versioned key first; semantic only where a near-miss answer is acceptable."}, "sdLinks": [], "read": [], "figs": [], "sheet": {"cheat": ["Key = model and version, prompt version, tools, parameters, normalised input, and tenant when the answer is per-user.", "Versions in the key: a prompt change is a miss, not a purge.", "Temperature above 0 or an LLM judge: a cache freezes one sample. Decide if that is wanted.", "Semantic cache: embedding distance under a threshold counts as a hit; more hits, and false positives.", "Never share across tenants: an input that changes the answer but is not in the key leaks answers.", "Prompt caching is the provider's prefix cache: tools, system, messages; exact match to the breakpoint; 5 min TTL refreshed on use.", "Embeddings: key by content hash and model; re-embed only when the hash changes."], "terms": [{"t": "Response cache", "mem": "Same question, saved answer.", "d": "Your own store of model outputs keyed by everything that determines them."}, {"t": "Prompt caching", "mem": "The provider remembers the start of the prompt.", "d": "A provider feature that reuses the processed prefix of a prompt; it saves cost and latency but does not cache the answer."}, {"t": "Semantic cache", "mem": "Close enough counts as a hit.", "d": "A cache that returns a stored answer for an input whose embedding is within a threshold of a stored one."}, {"t": "False positive (cache)", "mem": "A hit with the wrong answer.", "d": "A semantic match that returns an answer meant for a different question."}, {"t": "Cache poisoning", "mem": "One bad entry served to everyone.", "d": "A harmful or wrong response stored under a key that others share, often because an input that changes the response is left out of the key."}, {"t": "Content hash", "mem": "A fingerprint of the text.", "d": "A hash of the content used as part of a key, so a change in content means a new key."}], "vis": [{"title": "Anatomy of the key", "parts": [["model@version", "which model"], ["prompt v7", "a change is a miss"], ["tools", "hash of definitions"], ["temp, max_tokens", "parameters"], ["normalised input", "the question"], ["tenant", "never share across", true]]}, {"split": [["Safe to cache", ["temperature 0, versioned key", "per-tenant key for per-user answers", "embeddings keyed by content hash and model", "exact match first"]], ["Careful", ["temperature above 0: freezes one sample", "LLM judge in evals: hides variance", "semantic match: false positives", "anything that changes the answer but isn't in the key"]]]}, {"title": "Two different caches", "vs": {"cols": ["Your response cache", "Provider prompt caching"], "rows": [["Stores", "the answer", "the processed prompt prefix"], ["Hit needs", "the same key", "an exact prefix: tools, system, messages"], ["Lives", "as long as you set", "about 5 minutes, refreshed on use"], ["Saves", "the whole call", "input cost and latency"]]}}]}}, {"t": "Your caches at alfred_, as stories", "m": 25, "out": "Tell me about a caching problem you've dealt with in production.", "d": "Read from the alfred_ code on 19 October 2026 (the edge-function checkout read was last updated 7 August, so confirm anything you will name, and which of these you built yourself). Every cache below lives in one instance's memory; nothing is shared across instances, and there is no Redis. Tell each as: what it caches, the risk, the fix.", "pts": ["Token reuse: OAuth access tokens are reused until a few minutes before expiry. Per-user mail tokens refresh with no lock, so two workers can refresh the same token at once. Fix: a per-user lease, or a compare-and-set on the stored token", "Single-flight, in practice: the Outlook calendar list shares one in-flight request between concurrent callers, with a 30 second TTL, added because concurrent calls hit Microsoft's concurrency limit and came back as 503s", "Unbounded maps: some per-instance maps (feature flags per user, 60 seconds; thread metadata, 5 minutes) only remove an entry when it is read again, with no size cap, so a warm instance grows. Fix: a bounded LRU", "One done right: the attachment cache keeps 30 minutes, at most 80 entries, and skips anything over 300K characters", "A deliberate negative cache: if the subscriber lookup fails, 'unknown' is cached for 60 seconds and every event is published. Availability over precision, on purpose", "Embedding skip: notes are re-embedded only when a chunk's content hash changes", "Prompt caching on the agent's model calls: stable system prompt and tools first, marked cacheable, 5 minute TTL", "What is not there: no shared cache across instances. Say when you would add one: shared tokens and rate limits across instances"], "ans": {"lead": "The one I'd tell is the Outlook calendar: concurrent requests were hitting Microsoft's concurrency limit, so we share one in-flight request between callers.", "pts": ["The problem: several parts of the app asked for the same user's calendar list at the same moment, and Microsoft started returning 503s for too many concurrent requests.", "The fix: the first caller makes the request and stores the promise; anyone who asks in the meantime awaits the same one, and the result is kept for 30 seconds.", "What I'd still fix: our per-user mail tokens refresh without a lock, so two workers can refresh the same token at once; I'd add a lease or a compare-and-set.", "And memory: a couple of our in-memory maps only expire on read with no size cap, so I'd make them bounded LRUs, like the attachment cache already is."], "close": "It's all per-instance memory today; if we needed shared tokens or rate limits across instances, that's when I'd add a shared cache."}, "sdLinks": [], "read": [], "figs": [], "sheet": {"cheat": ["Every alfred_ cache is per-instance memory; nothing is shared; no Redis.", "Tokens: reused until minutes before expiry; per-user refresh has no lock, so two workers can refresh at once. Fix: a lease or compare-and-set.", "Outlook calendar list: one in-flight request shared by concurrent callers, 30 s TTL, added after Microsoft 503s for too many concurrent calls.", "Some maps expire only on read with no size cap; fix with a bounded LRU.", "The attachment cache does it right: 30 minutes, at most 80 entries, nothing over 300K characters.", "A deliberate negative cache: a failed subscriber lookup caches 'unknown' for 60 s and publishes everything.", "Notes are re-embedded only when a chunk's content hash changes; model calls use prompt caching.", "Confirm which of these you built before you name them."], "terms": [{"t": "Compare-and-set", "mem": "Write only if it is still what I read.", "d": "An atomic update that succeeds only if the current value matches the expected one; a safe way to refresh a shared token."}, {"t": "Fail open", "mem": "When unsure, let it through.", "d": "Choosing availability on an error, here publishing every event when the lookup fails."}, {"t": "Cold start", "mem": "A fresh instance knows nothing.", "d": "A new serverless instance with empty in-memory caches, so its first requests all miss."}], "vis": [{"title": "Your caches at alfred_: what, the risk, the fix", "vs": {"cols": ["What it does", "Risk", "Fix or point"], "rows": [["Outlook calendar", "one in-flight request shared, 30 s TTL", "it was added after Microsoft 503s", "single-flight, in production"], ["Mail tokens", "reused until minutes before expiry", "two workers refresh at once, no lock", "a lease or compare-and-set"], ["Per-user flag maps", "60 s TTL, expire only on read", "no size cap: grows", "a bounded LRU"], ["Attachments", "30 min, at most 80, skip > 300K chars", "none", "the one done right"], ["Subscriber lookup", "on failure, caches 'unknown' 60 s", "publishes everything", "fail open, on purpose"], ["Notes and model calls", "re-embed only on content-hash change; prompt caching", "none", "cost and latency"]]}, "note": "All per-instance memory; no Redis. Confirm which you built before you name them."}]}}], "study": [], "quiz": [{"q": "In your own words: What goes in the key for an LLM or embedding cache.", "a": "The key has to include everything that changes the answer, the model, prompt version, parameters, input and tenant, or the cache serves wrong answers fast. The key: model and version, prompt version, tools, temperature and other parameters, the normalised input, and the tenant if the answer is per-user. Invalidation: versions in the key, so changing the prompt is just a miss. What not to cache: per-user or sensitive answers across tenants, and anything where you want a fresh sample, like an eval run at temperature above zero. Semantic caching: more hits, but false positives, so I'd only use it with a tight threshold and an exact-match fallback. Prompt caching: separately, I put the stable system prompt and tools first so the provider's prefix cache hits. Exact-match on a versioned key first; semantic only where a near-miss answer is acceptable."}, {"q": "In your own words: Your caches at alfred_, as stories.", "a": "The one I'd tell is the Outlook calendar: concurrent requests were hitting Microsoft's concurrency limit, so we share one in-flight request between callers. The problem: several parts of the app asked for the same user's calendar list at the same moment, and Microsoft started returning 503s for too many concurrent requests. The fix: the first caller makes the request and stores the promise; anyone who asks in the meantime awaits the same one, and the result is kept for 30 seconds. What I'd still fix: our per-user mail tokens refresh without a lock, so two workers can refresh the same token at once; I'd add a lease or a compare-and-set. And memory: a couple of our in-memory maps only expire on read with no size cap, so I'd make them bounded LRUs, like the attachment cache already is. It's all per-instance memory today; if we needed shared tokens or rate limits across instances, that's when I'd add a shared cache."}], "hasTrackerQuiz": false, "figs": []}], "scripts": [{"id": "intro", "title": "Tell me about yourself", "length": "about 45 seconds", "when": "Thirty minutes, so the short one. Then stop.", "probes": ["What do you own at alfred_?", "Which language do you work in day to day?"], "say": ["I'm currently a founding LLM engineer at alfred_, where I work across AI agent reliability, memory architecture, evaluation infrastructure, and automation for a product with 5,000-plus active users. A big part of my work has been taking ambiguous problems and building the systems underneath them that make AI actually work reliably in production.", "Before that, I worked at an early-stage startup called WheelPrice and did AI research at UIC. What I enjoy most is working across the stack, understanding a real problem, and building something that solves it end to end. That's what caught my attention about Mercor's Enterprise team — it combines applied AI engineering with customer problems, integrations, and ownership of the final outcome."], "swaps": [{"when": "If she asks your language", "line": "Python, mostly, and TypeScript for our edge functions and web app. I'll reason in Python today."}], "land": "Production AI reliability at alfred_, and why Enterprise: customer problems you own end to end.", "notes": ["Your words from INTRO.md, unchanged."]}, {"id": "why-mercor", "title": "Why Mercor?", "length": "about 30 seconds", "when": "If she asks; a technical screen may not.", "probes": ["Why Enterprise and not research?", "What do you know about Mercor Enterprise?"], "say": ["What interests me is that Mercor is going beyond building AI tools as The role also sits at the intersection of engineering, product, and customer needs, - I enjoy working most. I'd get to solve different problems, build production integrations, and turn what works for one customer into reusable systems for others. This hands-on engineering and direct business impact is particularly appealing to me."], "swaps": [{"when": "If she asks what you know", "line": "From what I read, Enterprise finds where agents pay off, deploys them with custom evaluations in the customer's tools, and keeps improving them live. The evaluation part is the work I do at alfred_."}], "land": "Engineering, product and customers in one role, and reusable systems out of one-off deployments.", "notes": ["Your words from INTRO.md, unchanged. The first sentence breaks off mid-way ('beyond building AI tools as The role also...'): finish it in your own words before Friday."]}, {"id": "leave", "title": "Why leave alfred_?", "length": "about 30 seconds", "when": "If asked.", "probes": [], "say": ["I’m not looking to leave because there’s something fundamentally wrong with alfred_. The reason I'm exploring is more about the direction I want to take my career", "I've learned a lot at alfred_ and have had the opportunity to own important parts of a production AI product from the ground up. I've gradually moved beyond just building agent features and into building the systems around the agent — evaluations, observability, memory, reliability", "I'm still there and not looking to leave just for the sake of moving. I'm exploring roles where I can apply that experience to a broader range of problems, work directly with customers, and grow as an engineer who can own both the technical solution and its business outcome. Mercor's Enterprise team seems particularly aligned with that."], "land": "Not away from alfred_; toward customers and ownership of the outcome.", "notes": ["Your words from INTRO.md, unchanged."]}, {"id": "logistics", "title": "Logistics they may ask", "length": "a line each", "when": "Unlikely in a technical screen. Your answers are in chat, not on this page.", "probes": ["In person five days a week in San Francisco?", "Start date?", "Work authorization?"], "say": [], "land": "One sentence each, then back to the work.", "notes": ["Location, relocation, start date and work authorization: your answers from chat."]}], "drills": [{"id": "review", "prompt": "Here's a function that caches an expensive call. What would you say in a code review?", "target": "2 minutes", "seconds": 120, "ref": "../index.html#/w/wc32"}, {"id": "stampede", "prompt": "A hot key expires under load. What happens, and how do you stop it?", "target": "90 seconds", "seconds": 90, "ref": "../index.html#/w/wc33"}, {"id": "intro", "prompt": "Tell me about yourself.", "target": "45 seconds", "seconds": 45, "ref": "#say-intro"}], "qa": [], "ask": [], "ask3": [{"id": "sophie", "title": "For Sophie", "when": "The last two or three minutes. One or two.", "why": "She builds on Enterprise; a question about her work shows you think past the screen.", "how": ["Ask one, listen, ask one follow-up on what she said."], "items": [{"to": "Sophie", "q": "Where does caching actually bite in Enterprise deployments: model calls, customer APIs with rate limits, or the evaluation runs?", "loop": "First.", "why": "Ties the screen to the job, and her answer is the real problem you'd work on."}, {"to": "Sophie", "q": "To get to know the product, what are some recent pain points you've solved, and some that are ongoing work?", "loop": "Second.", "why": "Your question from INTRO.md, reworded only for spelling."}, {"to": "Sophie", "q": "What does the full interview process look like from here, and the rough timeline?", "loop": "Last.", "why": "Your question from INTRO.md."}]}], "traps": [], "tables": [], "admire": "", "kitaruLead": "", "figures": [], "mockHow": "Say 'run the Mercor mock' in chat: Sophie's caching screen, 30 minutes, a snippet to review, no tools; critique after.", "mocks": [], "planKicker": "Before Friday, 6 PM", "mechTitle": "", "designLink": null, "extra": "<b>Work in this order.<\/b> 1. Week 5, Caching, in the tracker: <a href=\"../index.html#/s/w5a\" target=\"_blank\" rel=\"noopener\">finish it there<\/a> (placement, keys, TTL against invalidation). It is the base; this page does not repeat it. 2. Sessions tab: wc32, the code review out loud (the screen itself), then wc33 (stale data, stampedes, failure) and wc34 (LLM caches and your own at alfred_). Each step ends on its cheat sheet and key terms. 3. Prep tab: your intro and why Mercor out loud, with the timer. 4. Thursday: say 'run the Mercor mock' in chat for a 30-minute screen, critique after. 5. Friday, an hour before: reread the three cheat sheets of wc32 and the one page of assumptions below.", "emphasis": [], "own": null, "showUp": [["Assumptions before answers.", "Before you judge the code, say what you assume: one process or many, threads or asyncio, how slow compute is, whether it is pure, how stale an answer may be. The brief asks for exactly this."], ["Review in a fixed order.", "One caller, concurrency, memory, errors, staleness, visibility. Each with a concrete failure ('two requests miss at once and compute runs twice') and its fix."], ["Every fix with its cost.", "A global lock is correct and slows every hit; a TTL bounds staleness and adds misses; a shared cache is consistent and adds a network hop. Say both halves."], ["Read the code literally first.", "One reported snippet has await in a non-async function and a set with no value. Catch the plain bugs before the clever ones."], ["Python, said precisely.", "One dict operation is atomic under the GIL, check-then-set is not; lru_cache can call the function twice; in asyncio cache the Task, not the coroutine; a failed Task must be evicted."], ["Real examples from alfred_.", "The Outlook calendar call shares one in-flight request after Microsoft returned 503s; token refresh has no lock; some maps grow without a cap. Only what you confirmed, and say which you built."], ["Keep the pace.", "Thirty minutes, possibly rapid-fire. Two or three sentences per point, then stop and let her pick the next one."], ["End with a real question.", "One question for Sophie about how Enterprise deployments handle caching or evaluation, then the process question."]], "prepLead": "The teaching is on the Sessions tab and in week 5. Here: how to show up, then your story out loud, and two drills: the cache review in two minutes, and the stampede.", "storyBlurb": "Your intro, why Mercor, why leave alfred_, and logistics.", "sources": [{"label": "Mercor Enterprise", "url": "https://mercor.com/enterprise", "why": "Discover, Deploy, Improve, Monetize; business experts, forward deployed engineers and a platform for context, connectors and evaluation."}, {"label": "The posting: Software Engineer, Applied AI (Enterprise)", "url": "https://jobs.generalcatalyst.com/companies/mercor/jobs/77183222-software-engineer-enterprise-applied-ai", "why": "Embedded with enterprise customers; integrations, APIs and workflows on Mercor's platform; in person five days a week."}, {"label": "Sacra: Mercor", "url": "https://sacra.com/c/mercor/", "why": "Funding rounds, revenue estimates (gross against net), customers and controversies."}, {"label": "Fortune: Mercor acquires Deeptune (July 2026)", "url": "https://fortune.com/2026/07/09/ai-unicorn-mercor-acquires-deeptune-brendan-foody-investor-a16z-openai-anthropic/", "why": "About $2B annualised revenue in June 2026; Deeptune builds simulation environments where agents practise before live systems."}, {"label": "TechCrunch: the March 2026 breach (April 2026)", "url": "https://techcrunch.com/2026/04/09/after-data-breach-10b-valued-startup-mercor-is-having-a-month", "why": "A breach tied to a compromised open-source dependency (LiteLLM); contractor lawsuits. Know it; don't raise it."}, {"label": "PracHub: a candidate's report of the caching code review (May 2026)", "url": "https://prachub.com/interview-experiences/mercor-software-engineer-interview-experience-a-product-focused-recruiter-screen-then-sorting-theory-and-a-concurrency-code-review", "why": "A cached compute(x) handed over for review; probes: two threads miss, a lock, double-checked locking, lock scope, dict semantics."}, {"label": "PracHub: a 30-minute screen with an async cache (September 2026)", "url": "https://prachub.com/interview-experiences/mercor-software-engineer-interview-experience-a-rushed-30-minute-screen-on-sorting-probability-and-a-cache-race-condition", "why": "A JavaScript Map cache; the interviewer wanted race conditions, locking, memory and eviction."}, {"label": "PracHub: a rapid-fire screen (September 2026)", "url": "https://prachub.com/interview-experiences/mercor-software-engineer-interview-experience-30-minute-rapid-fire-technical-screen-rejected-after-three-questions", "why": "No eviction, the expensive call repeated, errors and input validation; then idempotency and retries for a payment integration."}], "company": ["Mercor connects AI labs with vetted domain experts (doctors, lawyers, bankers, engineers) who write training data, tasks, rubrics and RL environments. Founded in 2023 in San Francisco by Brendan Foody, Adarsh Hiremath and Surya Midha. A $350M Series C at a $10B valuation (October 2025). Revenue is reported at about $2B annualised in June 2026; that is gross, and most of it is paid out to experts. Customers include Anthropic and OpenAI. It bought Deeptune in July 2026: simulation environments where agents practise before they touch live systems.", "APEX is its benchmark family for real professional work (banking, consulting, law, medicine; APEX-Agents and APEX-SWE since), graded with rubrics and a judge model. That is the evaluation layer you talked about with Neel.", "Mercor Enterprise, the team you would join, takes the same machinery to large companies: find where agents pay off (Discover), put them in production with custom evaluations wired into the customer's tools (Deploy), review and tune them live (Improve), and license opt-in data to labs (Monetize). It is delivered by business experts and forward deployed engineers on one platform for context, connectors and evaluation. The page cites an incident-response agent that cut median time to mitigation by more than half.", "Know, don't raise: a March 2026 breach through a compromised open-source dependency, followed by contractor lawsuits. If it comes up, it is a reason caching and keys matter (what is cached, and for whom)."], "posting": {"url": "https://jobs.generalcatalyst.com/companies/mercor/jobs/77183222-software-engineer-enterprise-applied-ai", "lead": "Software Engineer, Applied AI on Mercor's Enterprise team: engineering, product and customer success in one role, builders first, embedded with enterprise clients.", "facts": [["Team", "Mercor Enterprise"], ["Offices", "San Francisco, New York or London, in person five days a week"], ["Round 2", "Friday 23 October, 6:00 PM Eastern, 30 minutes"], ["Interviewer", "Sophie Guo, Applied AI Engineer"]], "does": ["Embed with enterprise customers to understand technical requirements and business goals.", "Architect and implement custom integrations, APIs and workflows on top of Mercor's platform.", "Deploy scalable solutions in client environments and drive launches and expansions.", "Build internal tools and reusable components that speed up future deployments.", "Turn ambiguous enterprise needs into clear technical plans and shipped systems."], "wants": ["A computer science or related degree.", "Strong fundamentals in a modern language (Python, Go, Rust).", "Production systems deployed on AWS, GCP or Azure.", "Comfort with customers, and explaining technical ideas to non-technical people.", "High ownership in ambiguous, high-stakes work."]}, "rounds": [{"title": "Round 1: call with Neel Taneja", "when": "Before 19 October 2026", "who": "Neel Taneja, Mercor", "format": "A conversation about your work; you discussed the evaluation layer and agents.", "outcome": "Passed. The recruiter wrote that Neel was 'very complimentary' and moved you to the technical screen.", "notes": [], "asked": []}, {"title": "Round 2: conversational technical screen on caching", "when": "Friday 23 October 2026, 6:00 to 6:30 PM Eastern", "who": "Sophie Guo, Applied AI Engineer", "format": "Thirty minutes on Google Meet. No coding tools or LLMs.", "outcome": "Not yet held.", "notes": ["The brief, from the recruiter: “This technical screen explores how you reason about caching in production systems. Be prepared to discuss how caching affects correctness, performance, and reliability as workloads grow and multiple requests run concurrently. We’ll look for clear assumptions, concrete examples of potential failures, and thoughtful tradeoffs when proposing improvements. To prepare, review caching fundamentals, concurrency concepts, and resource management in your preferred language.”", "Your preferred language is Python: say so at the start."], "asked": []}], "research": null, "learn": null, "tabs": ["overview", "prep", "sessions", "rounds", "mocks"], "live": [], "liveLead": [], "takehomes": [], "watch": null, "timeline": null}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; o.rev = o.rev || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }
    var sm = el("summary", "", '<span class="qt">' + inl(title) + "</span>" + (meta ? '<span class="qm">' + meta + "</span>" : ""));
    d.appendChild(sm); d.appendChild(body);
    return d;
  }
  function bulk(host) {
    var b = el("div", "bulk");
    var o = el("button", "", "Open all"), c = el("button", "", "Close all");
    o.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = true; }); });
    c.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = false; }); });
    b.appendChild(o); b.appendChild(c);
    host.appendChild(b);
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });
    (s.study || []).forEach(function (_, i) { k.push(s.id + ":s" + i); });
    return k;
  }
  function isDone(t, s) { return !!t.done[s.id]; }
  function link(tab, anchor) { return "#/" + tab + (anchor ? "/" + anchor : ""); }
  /* A drill's reference is either a route already or an anchor on the prep tab. */
  function prepRef(r) { return r.indexOf("#/") === 0 ? r : link("prep", r.replace(/^#/, "")); }

  /* ---------------------------------------------------------------- tabs */
  var TABS = [
    { id: "overview", label: "Overview", show: function () { return true; } },
    { id: "learn", label: "Learn", show: function () { return !!(LOOP.learn && LOOP.learn.modules); } },
    { id: "prep", label: "Prep", show: function () { return LOOP.scripts.length || LOOP.drills.length || LOOP.qa.length || LOOP.ask.length || (LOOP.ask3 || []).length; } },
    { id: "rounds", label: "Rounds", show: function () { return (LOOP.rounds || []).length; } },
    { id: "research", label: "Research", show: function () { return !!LOOP.research; } },
    { id: "design", label: "Design", show: function () { return LOOP.tables.length || LOOP.figures.length; } },
    { id: "own", label: (LOOP.own && LOOP.own.tab) || "Yours", show: function () { return !!LOOP.own; } },
    { id: "sessions", label: "Sessions", show: function () { return LOOP.sessions.length; } },
    { id: "live", label: "Live build", show: function () { return (LOOP.live || []).length || (LOOP.takehomes || []).length; } },
    { id: "mocks", label: "Mocks", show: function () { return !!LOOP.mockHow; } }
  ].filter(function (t) { return t.show() && (!LOOP.tabs || LOOP.tabs.indexOf(t.id) >= 0); });
  var main = document.getElementById("main");
  var side = document.getElementById("side");
  var nav = [];            /* side links for the current tab: [anchor, label, sub] */

  function heading(host, id, kicker, title, sub) {
    var s = el("section", "block"); s.id = id;
    if (title) { s.appendChild(el("h2", "", esc(title))); }
    if (kicker) { s.appendChild(el("p", "hsub", esc(kicker))); }
    host.appendChild(s);
    nav.push([id, title || kicker, !!sub]);
    return s;
  }

  /* ---------------------------------------------------------------- overview
     The call, the company, the role from its posting, how to show up, how to prepare. */
  function tabOverview(host) {
    var s = el("section", "block"); s.id = "brief";
    s.appendChild(el("h1", "", esc(LOOP.title)));
    s.appendChild(el("p", "hsub", esc(LOOP.subtitle)));
    s.appendChild(el("p", "lead", esc(LOOP.format)));
    var P = LOOP.posting;
    var dl = el("dl", "facts");
    dl.innerHTML = "<dt>When</dt><dd>" + esc(LOOP.when) + "</dd><dt>Who</dt><dd>" + esc(LOOP.who) + "</dd>" +
      (P && P.url ? '<dt>Posting</dt><dd><a href="' + esc(P.url) + '" target="_blank" rel="noopener">' + esc(P.label || "The job description") + "</a></dd>" : "");
    s.appendChild(dl);
    host.appendChild(s);
    nav.push(["brief", "The call"]);
    onePage(host);

    if (LOOP.company && LOOP.company.length) {
      var c = heading(host, "company", "", "The company");

  var LEARN_KEY = "loop.learn.v1";

    catch (err) { console.error("Could not read learning progress", err); return { mcq: {}, rate: {}, tried: {} }; }
  }

  /* The question the answer box answers: the step's done-when, else its title, explained. */
  function promptOf(it) {
    var p = String(it.out || "Explain in your own words. " + it.t).replace(/[.\s]+$/, "");
    return (/^[a-z]+\b/.test(p) ? p.charAt(0).toUpperCase() + p.slice(1) : p) + (/[?!]$/.test(p) ? "" : QWORD.test(p) ? "?" : ".");
  }
  var QWORD = /^(how|what|why|when|which|who|where|do|does|did|can|could|is|are|should|would|will)\b/i;

  function ptsList(pts) {

      var m = /^([^:]{2,60}):\s+([\s\S]+)$/.exec(String(q));

    sm.appendChild(tick);
    sm.appendChild(el("span", "st", inl(it.t)));

    if (!work.children.length) { work.remove(); body.classList.add("one"); }
