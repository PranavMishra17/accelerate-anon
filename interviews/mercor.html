 unclear cases and plain rules for the clear ones.' Lead with the user benefit, then the cost", "Pace example, if asked: dozens of production changes in about three months on a live system with paying users, and notification delivery from about 90 seconds to about 3", "Honest limit: alfred_ is a consumer product, not an enterprise engagement. Say that, then say what carries over: ask what the user actually needs, measure it, and explain the trade-off in their words", "Do not claim: customer contracts, named enterprise accounts, or any mechanism that is not yours. Stay with what you built"], "where": "Your master reference (alfred_ section) and the Mercor page; nothing here is invented. Add your own real user moment before the day.", "url": "https://mercor.com/enterprise", "ans": {"lead": "At alfred_ I work with everyday users, not engineers, so I've had to get good at explaining what the system does in their words.", "pts": ["Users make email rules in plain language from chat. Since people say what they mean loosely, I added a check that warns when a new rule matches none of their recent mail.", "People get a text and ask why, so I built a read-only tool that answers 'why was I notified'.", "I explain trade-offs in plain words: the model never writes a name or owner, it picks from real items and the code attaches the rest. We give up some flexibility and the assistant can't invent a person.", "I'd be honest that it's a consumer product, not an enterprise one, and the part that carries over is asking what they need and measuring it."], "close": "That's the habit I'd bring to an enterprise customer."}, "sdLinks": [], "read": [{"label": "Mercor Enterprise: what the team does, to place your own work against it", "url": "https://mercor.com/enterprise", "m": 5}], "figs": [], "sheet": {"cheat": ["alfred_: over 5,000 active users, everyday people, not engineers.", "Rules made in plain language from chat (about 98%); a check warns when a new rule matches none of recent mail.", "Read-only tool that answers 'why was I notified'.", "Strict-ID memory in plain words: the model picks from real items, code attaches names and owners.", "Matcher in plain words: model for unclear cases, rules for clear ones; about 30% lower cost per user.", "Be honest: a consumer product, not an enterprise engagement. Add one real user moment of your own."], "terms": [{"t": "Verify-after-edit", "mem": "Warn if it matches nothing.", "d": "A check that tells a user when a new rule matches none of their recent mail, so a wrong rule shows up at once."}, {"t": "Provenance tool", "mem": "Why you got this.", "d": "A read-only tool that shows the reason a notification was sent, so a user can see why."}, {"t": "Plain-words trade-off", "mem": "What you give up, in their terms.", "d": "Explaining a design choice by what the user gains and what flexibility is lost, without technical terms."}], "vis": [{"rule": "True facts only. Everyday users, plain words, one honest limit."}, {"title": "Your material, in plain words", "split": [["What users see", ["rules in plain language from chat", "a warning if a rule matches nothing", "a tool that says why they were notified"]], ["What you say about trade-offs", ["the model picks, code attaches names", "model for unclear, rules for clear", "some flexibility given up for no invented people"]]]}, {"title": "Say honestly", "calc": [["it is", "a consumer product"], ["not", "an enterprise engagement"], ["carries over", "ask, measure, explain in their words"]]}]}}], "study": [], "quiz": [{"q": "In your own words: What the round assesses, and how to show it.", "a": "I think this round is about whether a customer would trust me, so I'd ask before I answer and tie everything to a number they care about. Ask first: two or three questions on what success looks like and what a failure costs, before I suggest anything. Acknowledge: I say the customer's problem back in a sentence, then I diagnose. Number: every plan ends with how we'd know it worked. Trade-off: I say what I'd do now, what I'd leave, and why. Plain words: I explain it in their world, not mine. And if I don't know something, I say so and say how I'd find out."}, {"q": "In your own words: Mercor Enterprise in your own words, and the questions it raises.", "a": "From what I read, Mercor Enterprise finds where agents pay off, puts them into the customer's real tools with evaluations built around what good means for that business, and keeps improving them live. Four parts: Discover, Deploy, Improve, and Monetize, which is opt-in data licensing. The case I'd lead with: an incident-response agent that cut median time to mitigation by over 50%. They report it, and I like it because the number is operational, not a vibe. The other one I'd mention is the HR evaluation, 132 runs graded by experts before launch. That's the idea that evaluation comes first. The APEX finding I'd point to: models fail a lot on ambiguity and context, so a customer's messy real work is harder than a demo. Questions I'd expect from a customer: who grades the agent, what happens when it's unsure, and how does it stay good after launch. That last part, grading and staying good, is the work I do at alfred_, which is why this team fits."}, {"q": "In your own words: Discovery before solutions: the questions, the metrics, the pilot.", "a": "Before I propose anything I'd ask what success looks like, who decides, and what it costs when the agent is wrong. Walk me through one real case today, start to finish, so I see where it actually goes wrong. What can't we touch: data, systems, security review, sign-off. Metric: one outcome and one guardrail, agreed in numbers, with a baseline measured first. Pilot: one request type, a few weeks, a real evaluation set built with their own experts, a person checking at first. Expansion: the numbers that unlock the next phase, written down before we start, and the number that stops it. That way the customer sees value early and nobody is surprised later."}, {"q": "In your own words: Three practice scenarios, with model answers.", "a": "The three go the same way: I acknowledge the problem, I ask before I answer, and I give a plan with a number and a trade-off. Quality dropped: acknowledge the cost, ask for three real examples, replay the same cases before and after to see whether it actually changed, then tell them what I found in plain words. A request that won't solve it: agree with the goal, ask what sits behind it, be honest about the risk, and offer a smaller version that works and a way to measure it. Why it varies: compare it to asking two good analysts, say that wording varies but facts shouldn't, and say how I keep the facts stable. Each has a number at the end, so the customer knows how we'd tell it worked. I'd rather say the honest thing early than ship something that loses their trust."}, {"q": "In your own words: Your own material: users at alfred_, and explaining trade-offs.", "a": "At alfred_ I work with everyday users, not engineers, so I've had to get good at explaining what the system does in their words. Users make email rules in plain language from chat. Since people say what they mean loosely, I added a check that warns when a new rule matches none of their recent mail. People get a text and ask why, so I built a read-only tool that answers 'why was I notified'. I explain trade-offs in plain words: the model never writes a name or owner, it picks from real items and the code attaches the rest. We give up some flexibility and the assistant can't invent a person. I'd be honest that it's a consumer product, not an enterprise one, and the part that carries over is asking what they need and measuring it. That's the habit I'd bring to an enterprise customer."}], "hasTrackerQuiz": false, "figs": [], "nlm": ["https://getperspective.ai/blog/forward-deployed-engineer-interview-questions-2026-prep-guide", "https://fde.academy/blog/forward-deployed-engineer-interview-questions", "https://www.youtube.com/watch?v=5OYy_UtINo4", "https://www.youtube.com/watch?v=KwhgfwOSToQ", "https://review.firstround.com/do-you-really-need-a-forward-deployed-engineer/", "https://mercor.com/enterprise", "https://mercor.com/blog/introducing-apex-agents", "https://www.youtube.com/watch?v=SWlcKSuoFJA", "https://www.youtube.com/watch?v=cBD7_R-Cizg", "https://www.lennysnewsletter.com/p/product-sense", "https://a16z.com/where-enterprises-are-actually-adopting-ai/", "https://www.youtube.com/watch?v=OTkP2JDeGWM", "https://www.youtube.com/watch?v=Zyw-YA0k3xo", "https://a16z.com/need-for-speed-in-ai-sales-ai-doesnt-just-change-what-you-sell-it-also-changes-how-you-sell-it/", "https://review.firstround.com/the-early-user-research-playbook-for-founders-jeanette-mellingers-expert-advice-for-validating-your-idea-with-high-quality-interviews/", "https://www.youtube.com/watch?v=pGK2EuLXL7A", "https://www.youtube.com/watch?v=Q5zaQ6CC134", "https://hbr.org/2026/01/how-to-get-your-customers-to-trust-ai", "https://www.youtube.com/watch?v=pk3VOO9WT8o", "https://www.youtube.com/watch?v=Byv311hdoHE"]}, {"id": "wc35", "name": "The build: an AI-assisted prototype in a few hours, then the presentation", "blurb": "The onsite coding exercise as Mercor describes it: break the problem down, steer an AI tool, test as you go, recover when stuck, then present intent, tradeoffs, scoping and next steps.", "intro": "Mercor's brief says the exercise is not an algorithm interview. AI help is encouraged, and you are judged on breaking the problem down, weighing alternatives, recovering when stuck, working with the interviewer, and delivering a working prototype in the time. Then you present it. Candidates report the same shape: long build time, then a short debrief where the reviewer reads your code and asks why. This session is the workflow for that day, and ends on a timed rehearsal you run yourself. The prompt is not public, so the model build here is a practice one.", "len": "2h", "day": "4", "steps": [{"t": "The first 15 minutes: scope, assumptions, the thin slice", "m": 15, "out": "You are handed a vague build prompt and an AI tool. What do you do in the first fifteen minutes, before any code?", "d": "The first quarter hour decides the day. Ask what is in scope, write your assumptions where the interviewer can see them, and pick the thinnest slice that runs from input to output. Set up the repo and the AI tool before the clock starts, so the clock is spent on the problem. A pacing guide for a 90 minute build round gives the proportions: about 8 minutes clarifying, 7 on a sketch, most of the rest building the happy path, then polish and a demo. It is not Mercor's rule; scale it to your hours.", "pts": ["Clarify before prompting: what is the input and how messy, who uses the output, what counts as done, which parts allow AI (one Blind report says its first part did not), and whether tests are expected", "Write assumptions down as a short list in the repo (a README stub or a comment block). Say each aloud. A wrong assumption caught in minute 5 costs nothing", "Thin slice: one real input goes in, one real output comes out, through every layer. Parse, process, return. Breadth comes after the slice runs", "Name what you will not build in the first pass. This is the start of your scoping story for the presentation", "Before the clock: a project skeleton, a runnable test command, a formatter, and your AI tool signed in and pointed at the repo. Ask whether you may bring your own setup", "Pace as a rough plan, not a rule: clarify and sketch first, a thin working flow early, a hard stop for building, time kept back to polish and prepare the presentation", "Say your plan aloud and get a nod. The brief judges collaboration, so the interviewer is part of the work"], "where": "Canva Engineering, AI interview success (clarify first, plan before coding); GenAI Systems Lab, FDE build round (the pacing model)", "url": "https://www.canva.dev/blog/engineering/ai-interview-success/", "ans": {"lead": "I'd spend the first fifteen minutes on scope and a thin slice, and write my assumptions down before I touch the AI tool.", "pts": ["Questions first: what the input looks like, what the output is for, what done means, and whether AI is allowed for every part.", "Assumptions: I'd write them in the repo as a short list and read them out, so a wrong one gets corrected early.", "Thin slice: one real record in, one real answer out, end to end. I'd get that running before adding anything.", "Not now: I'd name what I'm leaving out, so it reads as a choice and not as a gap.", "Setup: the repo, the test command and the AI tool are ready before the clock starts."], "close": "Then the next two hours are spent on the problem, not on getting started."}, "sdLinks": [], "read": [{"label": "Canva Engineering, AI interview success: prepare the skeleton, clarify scope, plan before coding", "url": "https://www.canva.dev/blog/engineering/ai-interview-success/", "m": 5}, {"label": "GenAI Systems Lab, FDE build round: the pacing model (clarify, sketch, thin flow, demo)", "url": "https://genai-systems-lab-ivory.vercel.app/gt/fde-build-round-survival", "m": 5}], "figs": [], "sheet": {"cheat": ["Clarify first: input and how messy, who uses the output, what done means, which parts allow AI, whether tests are expected.", "Assumptions: write them in the repo, say each aloud, fix them when the real data disagrees.", "Thin slice: one real input to one real output through every layer, before any breadth.", "Not now: name what you leave out. It becomes your scoping story.", "Before the clock: skeleton repo, test command, AI tool signed in.", "Pace (a guide, not Mercor's rule): clarify and sketch, thin flow early, a hard stop for building, time kept for the presentation."], "terms": [{"t": "Thin slice", "mem": "One path, all layers.", "d": "The smallest flow that runs from real input to real output through every layer; breadth is added after it works."}, {"t": "Assumption list", "mem": "Written down, said aloud.", "d": "The short list of things you are taking as true so you can start; each is checked against the real input and corrected."}, {"t": "Scoping choice", "mem": "Left out on purpose.", "d": "A feature you decided not to build in the time, with a reason; framed this way it reads as judgment, not a gap."}], "vis": [{"rule": "Ask, write down what you assume, run one real input to one real output, and say what you are leaving out."}, {"title": "A rough plan for the day (a guide, scale it)", "flow": ["Clarify and assume", "Sketch the slice", "Thin flow running", "Build and test", "Stop building", "Prepare to present"], "note": "From a pacing guide for a 90 minute build round. Not Mercor's rule."}, {"title": "Before the clock starts", "parts": [["repo", "skeleton, git"], ["tests", "one command"], ["AI tool", "signed in, pointed at repo"], ["notes", "assumptions file"]]}]}}, {"t": "Working with the AI: your plan first, bounded prompts, own every line", "m": 25, "out": "How do you use the AI tool during the build, and what do you refuse to ship?", "d": "Interviewers are not scoring how much the model wrote. They score whether you direct it, check it and can explain it. One Blind report of a Mercor build says the candidate used AI to beat a baseline, then the reviewer ignored the approach and read code the candidate admitted not fully understanding. The lesson is plain: never ship a line you cannot explain. Canva names three failure modes: AI Showcase (the tool is the show), Feature Marathon (accepting output fast to pile on features) and Hands-Off (handing it over and watching).", "pts": ["Your plan first: write the approach and the data shapes yourself, in a few lines, then ask the model to fill in a bounded piece. A candidate who asks the model what to do has nothing to defend", "Bounded prompts: one function or one file, with the types, an example input and the expected output. Not 'build the whole thing'", "Review to pull request quality: read the diff, run it, and ask what happens on an empty field, a duplicate, a bad type, a huge input. AI output can sound sure and be wrong, including its claims about complexity", "The explain test: for every block, can you say what it does and why this way over the other way, with the tool closed? If not, rewrite it smaller, or ask the model to explain, then rewrite it in your words", "Stop prompting and write it yourself when: two attempts miss the same way, the fix is three lines, the piece is the heart of the problem, or you can no longer say what the code does", "Keep a running list of the model's mistakes you caught. It is your evidence for the debrief that you steered it", "Say it aloud: 'I'm giving it this slice because it's routine; the matching rule I'm writing myself because it's the part that matters'"], "where": "Formation, what AI-assisted interviews score (direct, explain, verify); Blind, a Mercor candidate who could not explain vibe-coded code", "url": "https://formation.dev/blog/ai-assisted-coding-interviews", "ans": {"lead": "I use the model for slices I could write myself, I write the core myself, and I don't keep a line I can't explain.", "pts": ["Plan first: I write the approach and the data shapes before I prompt, so I'm directing and not following.", "Small asks: one function at a time, with an example input and output, then I run it.", "Review: I read the diff like a pull request. I check empty values, duplicates and bad types, because the model sounds sure either way.", "The test for keeping a line: can I explain it with the tool closed? If not, I rewrite it smaller.", "When to stop: if two prompts miss in the same way, or the fix is a few lines, I write it myself."], "close": "The debrief is that same review, said aloud."}, "sdLinks": [], "read": [{"label": "Canva Engineering, AI interview success: the three failure modes", "url": "https://www.canva.dev/blog/engineering/ai-interview-success/", "m": 5}, {"label": "Formation, what AI-assisted coding interviews score: direct, explain, verify", "url": "https://formation.dev/blog/ai-assisted-coding-interviews", "m": 5}, {"label": "Blind: a Mercor candidate's report on code they could not explain", "url": "https://www.teamblind.com/post/mercor-swe-interview-experience-vv02w0gy", "m": 4}], "figs": [], "sheet": {"cheat": ["Your plan first: approach and data shapes in your own words, then ask the model for a bounded piece.", "Bounded prompts: one function or file, with types and an example in and out.", "Review like a pull request: empty, duplicate, bad type, huge input. Check its complexity claims.", "Explain test: with the tool closed, can you say what it does and why this way? If not, rewrite it smaller.", "Stop prompting when: two misses the same way, the fix is a few lines, it is the core of the problem, or you cannot say what the code does.", "Failure modes: AI Showcase, Feature Marathon, Hands-Off.", "Keep a list of the model's mistakes you caught."], "terms": [{"t": "AI Showcase", "mem": "The tool is the show.", "d": "Canva's name for a candidate who demonstrates mastery of the AI tool instead of solving the task."}, {"t": "Feature Marathon", "mem": "Accept fast, pile on.", "d": "Canva's name for taking model output quickly to add many features, with little review."}, {"t": "Hands-Off", "mem": "You watch it work.", "d": "Canva's name for handing too much to the model and not staying engaged or reviewing critically."}, {"t": "Explain test", "mem": "Tool closed, still clear.", "d": "Whether you can say what a block does and why this way over another, without the tool; any line that fails gets rewritten."}], "vis": [{"rule": "Never ship a line you cannot explain with the tool closed."}, {"title": "Who does what", "split": [["You write", ["the approach and data shapes", "the rule that decides the answer", "the tests on that rule", "the sentence that explains each block"]], ["The model drafts", ["parsing and glue", "the endpoint shell", "routine transforms", "research on an unfamiliar API"]]]}, {"title": "Three ways to lose", "vs": {"cols": ["What it looks like", "Fix"], "rows": [["AI Showcase", "the tool is the demo", "make the task the demo"], ["Feature Marathon", "accept fast, add many features", "one slice, review, run"], ["Hands-Off", "watch it work, cannot explain it", "read every diff, explain it aloud"]]}}, {"title": "When to stop prompting", "ladder": [["1", "two misses the same way", ""], ["2", "the fix is a few lines", ""], ["3", "it is the core of the problem", ""], ["4", "you cannot say what the code does", ""]]}]}}, {"t": "Tests and validation as you go, and saying what you optimise for", "m": 20, "out": "What do you test in a short build, when, and what do you say about it?", "d": "Mercor's brief asks you to write tests, validate assumptions and say what you optimise for. In a few hours that means a handful of tests on the path that carries the result, run after each slice, plus a check against real input. It does not mean full coverage. A passing test on made-up data proves less than one run on the messy sample you were given.", "pts": ["A few behaviour tests on the core path: given this input, this output. Include the awkward cases that the prompt hints at, such as a duplicate, a missing field and an empty list", "Run the tests after each slice. A red test the minute after a prompt tells you which prompt broke it", "Validate assumptions with real input: open the sample, count the rows, look at the ugliest ten. Then fix the assumption list. 'I assumed ids are unique; 4 of 200 were not' is the sentence to say", "Write the test before accepting the model's code only when the behaviour is clear; otherwise write it right after, from your own reading of the prompt, not from the model's output", "Say what you optimise for, in one line, and when it changes: correctness on the core path first, then clarity, then speed. Say what you gave up", "Make a failure visible: log or return which records were skipped and why. A silent drop is a bug that the demo hides", "Do not test the model's wiring. Test your rule: the part that decides what the right answer is"], "where": "Formation: verify complexity and edge cases, work in reviewable steps; Canva: review everything to pull request quality", "url": "https://formation.dev/blog/ai-assisted-coding-interviews", "ans": {"lead": "I test the core path after every slice, I check my assumptions against the real input, and I say what I'm optimising for.", "pts": ["Tests: a few on the rule that decides the answer, including a duplicate, a missing field and an empty input.", "When: after each slice, so a red test points at the last thing I changed.", "Real input: I look at the actual sample early, count what's there and read the worst rows. I update my assumption list from that.", "Optimising for: correctness on the main path first, then readability. I say what I traded away.", "Visibility: skipped or merged records are reported, not dropped quietly."], "close": "That way the demo shows what works and what doesn't, and I'm the one who says so."}, "sdLinks": [], "read": [{"label": "Formation: verify complexity claims and edge cases, work in reviewable steps", "url": "https://formation.dev/blog/ai-assisted-coding-interviews", "m": 5}], "figs": [], "sheet": {"cheat": ["A few behaviour tests on the core path: input to output, with the awkward cases the prompt hints at.", "Run them after each slice, so a red test points at the last prompt.", "Real input beats made-up input: open the sample, count rows, read the ugliest ten, update the assumptions.", "Say what you optimise for in one line: correctness on the core path, then clarity, then speed.", "Make skips visible: report which records were dropped and why.", "Test your rule, not the model's wiring."], "terms": [{"t": "Core path", "mem": "Where the answer comes from.", "d": "The code that decides what the right output is; the part that gets tests first."}, {"t": "Behaviour test", "mem": "This in, that out.", "d": "A test that states an input and the output a user should see, not how the code gets there."}, {"t": "Optimise for", "mem": "What you protect, what you give up.", "d": "The one quality you put first under the clock, said aloud together with what it costs."}], "vis": [{"rule": "A few tests on the rule that decides the answer, run after every slice, plus a look at the real input."}, {"title": "A test on the core path", "code": "def test_merges_duplicate_email():\n    recs = [{'email': 'A@x.com', 'name': 'Ann'},\n            {'email': 'a@x.com ', 'name': 'Ann L'}]\n    out = dedupe(recs)\n    assert len(out) == 1\n\ndef test_missing_skills_is_empty_list():\n    assert normalise({'email': 'b@x.com'})['skills'] == []", "pins": [[1, "behaviour: this in, that out"], [4, "normalised key: case and spaces"], [7, "the awkward case the prompt hints at"]]}, {"title": "Say it aloud", "calc": [["assumed", "ids are unique"], ["checked", "4 of 200 were not"], ["changed", "dedupe on email, not id"]]}]}}, {"t": "Recovering when stuck: time boxes, cut scope, simplest version", "m": 15, "out": "You are 90 minutes in and the approach is not working. What do you do, and what do you say?", "d": "The brief lists recovering when stuck as a judged skill, so being stuck is not the failure. Staying stuck quietly is. Decide a time box before you begin each hard part, and when it runs out, cut scope or drop to the simplest version that works. Say the decision aloud, so the interviewer sees the judgment and can help.", "pts": ["Time box each hard piece when you start it: 'fifteen minutes on fuzzy dedupe; if it isn't working, I fall back to exact match on a normalised key'", "Stuck test: you have tried the same kind of fix twice, or you cannot say what the bug is. Stop prompting; reproduce it in the smallest case, read the actual error, print the data", "Cut scope in this order: polish, then extra features, then edge cases that are not in the sample, then the second data source. Never cut the end-to-end flow or the tests on the core path", "Simplest working version: a rule beats a model, exact beats fuzzy, one file beats a framework, a printed table beats a UI. A running simple version beats a broken ambitious one", "Keep the good version recoverable: commit when the slice works, so a bad experiment is a revert and not a rescue", "Say it aloud: what failed, what you tried, what you are choosing now and what it costs. That sentence is the scoping story for the presentation", "Ask when it helps. The brief judges collaboration: a clarifying question about intent is better than an hour on the wrong reading"], "where": "GenAI Systems Lab, FDE build round (name your shortcuts, stub and mock to keep a working demo)", "url": "https://genai-systems-lab-ivory.vercel.app/gt/fde-build-round-survival", "ans": {"lead": "I set a time box before each hard part, and when it runs out I fall back to the simplest version that works and say so.", "pts": ["Time box: I decide up front how long a hard piece gets and what the fallback is.", "When stuck: after two misses of the same kind I stop prompting, shrink the problem and print the real data.", "Cutting: polish first, then extras, then edge cases outside the sample. The end-to-end flow and the core tests stay.", "Fallback: a rule instead of a model, exact match instead of fuzzy, and I commit the working version first.", "Saying it: what failed, what I chose, what it costs."], "close": "A working simple version that I can explain is better than a clever one that I can't finish."}, "sdLinks": [], "read": [{"label": "GenAI Systems Lab, FDE build round: stub, mock, name your shortcuts", "url": "https://genai-systems-lab-ivory.vercel.app/gt/fde-build-round-survival", "m": 5}], "figs": [], "sheet": {"cheat": ["Time box each hard piece when you start it, with its fallback named.", "Stuck: the same kind of fix twice, or you cannot say what the bug is. Stop prompting, shrink the case, print the data.", "Cut in order: polish, extras, edge cases outside the sample, second source. Never the end-to-end flow or the core tests.", "Simplest version: rule over model, exact over fuzzy, one file, a printed table.", "Commit when a slice works, so a bad experiment is a revert.", "Say it: what failed, what you tried, what you chose, what it costs."], "terms": [{"t": "Time box", "mem": "A budget set before you start.", "d": "A fixed time for one hard piece, decided up front, after which you switch to the fallback."}, {"t": "Fallback", "mem": "The simpler thing that still works.", "d": "The plan you named before starting, such as exact match when fuzzy match is not working in time."}, {"t": "Cut scope", "mem": "Smaller, but still runs.", "d": "Removing features in a chosen order while keeping the end-to-end flow and the core tests."}], "vis": [{"rule": "Stuck is allowed. Staying stuck quietly is the failure."}, {"title": "Cut in this order", "ladder": [["1", "polish", "first to go"], ["2", "extra features", ""], ["3", "edge cases outside the sample", ""], ["4", "second data source", ""], ["keep", "end to end flow and core tests", "never cut"]]}, {"title": "Simplest version that works", "vs": {"cols": ["Ambitious", "Fallback"], "rows": [["matching", "embeddings", "explicit skill and title rules"], ["dedupe", "fuzzy names", "exact match on a normalised key"], ["output", "a UI", "a printed table or JSON"]]}}]}}, {"t": "The presentation in Mercor's order, and the follow-ups", "m": 25, "out": "Present your build in 5 to 10 minutes, in the order Mercor asks for. Then take the follow-up questions.", "d": "Mercor's order is intent, tradeoffs under time pressure, what you did not get to framed as scoping with what you would do next, and next steps. Lead with what you set out to build and why, not with a tour of the files. Show it running first. The model below is a practice build, a candidate-to-job matcher over messy resume JSON. Use the shape, and say only what you actually built.", "pts": ["Intent (1 to 2 minutes): what I set out to build, for whom, and what 'good' meant. 'A matcher that takes messy resume JSON and a job, returns a ranked list a recruiter can trust'", "Demo (2 minutes): one real run, input to output. Show the awkward record, and the numbers: how many records, how many duplicates merged, how many skipped", "Tradeoffs (2 to 3 minutes): the decisions you made under the clock and the alternative you rejected. Rules over embeddings first, and why. Exact plus normalised match over fuzzy. What you optimised for", "Scoping (1 to 2 minutes): what you did not do, as a choice. 'I did not build reranking because I had no labelled pairs to judge it against'", "Next steps (1 minute): the top three, in order, with the reason for the order. First the eval, because everything else is guesswork without it", "Likely follow-ups: why this approach over that one; how does it fail on a bad record; how would you know the matches are good; what breaks at 100 times the data; walk me through this function; what would you change if the customer needed it live next week", "Match quality: a small labelled set of job and candidate pairs, precision at 5, and a spot check of the false positives. State plainly that your set is small and what that limits", "Say what AI wrote and what you wrote, and where it was wrong. It answers 'did you understand this' before it is asked"], "where": "Mercor's onsite brief (the order of the presentation); Canva and Formation on defending decisions after the build", "url": "https://www.canva.dev/blog/engineering/ai-interview-success/", "ans": {"lead": "I built a matcher over messy resume JSON: I'll say what I aimed for, show it run, then the tradeoffs, what I left out on purpose, and what's next.", "pts": ["Intent: take messy candidate records and a job, and return a ranked list with the reasons, behind one endpoint.", "Demo: a run on the sample, 200 records in, 14 duplicates merged on a normalised email and name key, 6 skipped with a reason each.", "Tradeoffs: I used explicit skill and title rules, not embeddings, because I could read and test them in the time, and I merged duplicates with exact keys, not fuzzy matching, to avoid wrong merges.", "Scoping: I didn't build reranking or a UI. I had no labelled pairs, so I couldn't have shown reranking was better.", "Next: first a small labelled set and precision at 5, then fuzzy dedupe measured against it, then caching and batching if volume needs it."], "close": "I wrote the matching rule and the tests myself; the model wrote the parsing and the endpoint, and I fixed two things it got wrong."}, "sdLinks": [], "read": [{"label": "Canva Engineering, AI interview success: justify decisions and discuss tradeoffs", "url": "https://www.canva.dev/blog/engineering/ai-interview-success/", "m": 5}, {"label": "Formation: expect follow-ups on rationale and adaptation", "url": "https://formation.dev/blog/ai-assisted-coding-interviews", "m": 5}, {"label": "Anthropic, Contextual retrieval: a measured retrieve-then-rerank result to cite when asked about match quality", "url": "https://www.anthropic.com/news/contextual-retrieval", "m": 8}], "figs": [], "sheet": {"cheat": ["Order: intent, demo, tradeoffs, scoping, next steps. 5 to 10 minutes.", "Intent: what you built, for whom, what good meant. First sentence, before any code.", "Demo: one real run with numbers: records in, merged, skipped.", "Tradeoffs: the decision, the alternative you rejected, what you optimised for.", "Scoping: what you left out, as a choice, with the reason.", "Next steps: top three, ranked, with why that order. The eval comes first.", "Follow-ups: why this over that, how it fails on a bad record, how you know matches are good, what breaks at 100x, walk through a function.", "Say what the AI wrote, what you wrote, where it was wrong."], "terms": [{"t": "Precision at k", "mem": "Of the top k, how many are right.", "d": "The share of the k highest-ranked results that are correct matches; precision at 5 looks at the first five."}, {"t": "Dedupe key", "mem": "What makes two records one.", "d": "A normalised value, such as a lowercased email, used to merge duplicate records; exact keys avoid wrong merges, fuzzy keys catch more."}, {"t": "Labelled set", "mem": "Answers you trust.", "d": "A small list of inputs with the right answer marked by a person; it is what lets you say a change made matches better."}], "vis": [{"rule": "Lead with intent. Show it running. Tradeoffs, then scoping as a choice, then next steps."}, {"title": "The order, with a rough clock", "flow": ["Intent 1 to 2 min", "Demo 2 min", "Tradeoffs 2 to 3 min", "Scoping 1 to 2 min", "Next steps 1 min"]}, {"title": "The model build: a matcher over messy resume JSON", "lanes": [["Input", [["200 records, messy", "plain", "2"]]], ["Process", [["normalise", "plain"], ["dedupe", "hot"], ["score", "plain"]]], ["Output", [["endpoint: top 10 + reason", "done", "2"]]]], "note": "Rules over embeddings, exact keys over fuzzy: readable and testable in the time. Report merged and skipped counts."}, {"title": "Match quality, plainly", "calc": [["precision at 5", "correct in the top 5 / 5"], ["labelled set", "small: say what that limits"], ["next", "measure fuzzy dedupe against it"]]}, {"title": "Follow-ups to expect", "split": [["About the build", ["why this over that", "walk me through this function", "what did the AI get wrong", "how does a bad record fail"]], ["About growth", ["how do you know matches are good", "what breaks at 100 times the data", "what if it must be live next week", "what would you build next, and why"]]]}]}}, {"t": "A timed rehearsal you run yourself, and how to grade it", "m": 20, "out": "Run the rehearsal below on your own with your AI tool, then grade it against the checklist. What did you miss?", "d": "Do this once, timed, with the real tool, on messy input. The point is the workflow, not the result. Use a timer, a screen recording or a voice memo, and read the checklist only after you stop. Nothing here is private: use made-up records.", "pts": ["The prompt (give it to yourself): 'Here are 200 candidate records as JSON. Fields are inconsistent: some have skills as a list, some as a string, some missing; emails are repeated with different casing; names have typos. Build a service with one endpoint that takes a job description and returns the top 10 candidates with a score and a reason. Merge duplicates. Include tests. Present it.'", "Clock: 5 minutes to clarify aloud and write assumptions, 75 minutes to build, 10 to prepare, 8 to present. Then 5 minutes of follow-ups from a friend or a voice recording of the questions in the last step", "Narrate the whole time, to a recording. Silence is the most common loss", "Grade intent: did you state what you built and why before showing anything? Pass only if it was the first thing you said", "Grade steering: did you write the plan before the first prompt, use bounded prompts, and catch at least one model mistake? Could you explain every function with the tool closed? Fail any line you could not", "Grade tests and recovery: tests on the core path, run after slices; at least one assumption changed by the real data; a time box set and a fallback taken if you were stuck", "Grade the presentation: in Mercor's order, under 10 minutes, scoping framed as choice, next steps ranked with a reason, the demo ran. Count the filler and the apologies", "Write three lines after: one thing to keep, one to change, one assumption you would ask about next time"], "where": "Your own rehearsal; the checklist condenses Mercor's brief, Canva and Formation", "url": "https://www.canva.dev/blog/engineering/ai-interview-success/", "ans": {"lead": "I ran a timed build on messy candidate data and graded myself on intent, steering, tests, recovery and the presentation.", "pts": ["Setup: made-up records, my own AI tool, a timer, and a recording so I could hear myself.", "Plan: five minutes clarifying and writing assumptions, then a thin slice before anything else.", "Grading: I checked that I led with intent, wrote the plan before prompting, and could explain every function with the tool closed.", "Recovery: I looked for where I got stuck, whether I set a time box, and what I cut.", "Presentation: in Mercor's order, under ten minutes, with next steps ranked."], "close": "What I'd change next time goes in three lines, so the next run is better."}, "sdLinks": [], "read": [{"label": "GenAI Systems Lab, FDE build round: the 90 minute timeline to copy for the rehearsal", "url": "https://genai-systems-lab-ivory.vercel.app/gt/fde-build-round-survival", "m": 5}], "figs": [], "sheet": {"cheat": ["Prompt: 200 messy candidate JSON records, one endpoint, top 10 for a job with score and reason, merge duplicates, tests, present.", "Clock: 5 clarify, 75 build, 10 prepare, 8 present, 5 follow-ups.", "Record yourself and narrate. Silence is the common loss.", "Grade: led with intent; plan before first prompt; caught a model mistake; explained every function with the tool closed.", "Grade: core tests run after slices; an assumption changed by real data; a time box and fallback.", "Grade: Mercor's order, under 10 minutes, scoping as choice, ranked next steps, demo ran.", "After: keep one, change one, one question to ask next time."], "terms": [{"t": "Rehearsal", "mem": "Full run, real tool, timed.", "d": "One complete pass of the build and the presentation under a clock, graded after against a checklist."}, {"t": "Grade line", "mem": "Pass or fail, no maybe.", "d": "A checklist item written so you can answer yes or no, such as 'led with intent before showing anything'."}], "vis": [{"rule": "Run it once, timed, with your real tool and made-up records. Grade it after."}, {"title": "The clock", "lanes": [["Rehearsal", [["clarify 5", "plain"], ["build 75", "hot", "8"], ["prepare 10", "plain", "2"], ["present 8", "done", "2"], ["follow-ups 5", "plain"]]]], "note": "About 100 minutes. Record and narrate throughout."}, {"title": "Grade yourself, yes or no", "vs": {"cols": ["Check"], "rows": [["Intent", "said what you built and why before showing anything"], ["Steering", "plan before first prompt; caught a model mistake; every function explained with the tool closed"], ["Tests and recovery", "core tests after slices; an assumption changed by real data; a time box and a fallback"], ["Presentation", "Mercor's order, under 10 minutes, scoping as choice, ranked next steps, demo ran"]]}}]}}], "study": [], "quiz": [{"q": "In your own words: The first 15 minutes: scope, assumptions, the thin slice.", "a": "I'd spend the first fifteen minutes on scope and a thin slice, and write my assumptions down before I touch the AI tool. Questions first: what the input looks like, what the output is for, what done means, and whether AI is allowed for every part. Assumptions: I'd write them in the repo as a short list and read them out, so a wrong one gets corrected early. Thin slice: one real record in, one real answer out, end to end. I'd get that running before adding anything. Not now: I'd name what I'm leaving out, so it reads as a choice and not as a gap. Setup: the repo, the test command and the AI tool are ready before the clock starts. Then the next two hours are spent on the problem, not on getting started."}, {"q": "In your own words: Working with the AI: your plan first, bounded prompts, own every line.", "a": "I use the model for slices I could write myself, I write the core myself, and I don't keep a line I can't explain. Plan first: I write the approach and the data shapes before I prompt, so I'm directing and not following. Small asks: one function at a time, with an example input and output, then I run it. Review: I read the diff like a pull request. I check empty values, duplicates and bad types, because the model sounds sure either way. The test for keeping a line: can I explain it with the tool closed? If not, I rewrite it smaller. When to stop: if two prompts miss in the same way, or the fix is a few lines, I write it myself. The debrief is that same review, said aloud."}, {"q": "In your own words: Tests and validation as you go, and saying what you optimise for.", "a": "I test the core path after every slice, I check my assumptions against the real input, and I say what I'm optimising for. Tests: a few on the rule that decides the answer, including a duplicate, a missing field and an empty input. When: after each slice, so a red test points at the last thing I changed. Real input: I look at the actual sample early, count what's there and read the worst rows. I update my assumption list from that. Optimising for: correctness on the main path first, then readability. I say what I traded away. Visibility: skipped or merged records are reported, not dropped quietly. That way the demo shows what works and what doesn't, and I'm the one who says so."}, {"q": "In your own words: Recovering when stuck: time boxes, cut scope, simplest version.", "a": "I set a time box before each hard part, and when it runs out I fall back to the simplest version that works and say so. Time box: I decide up front how long a hard piece gets and what the fallback is. When stuck: after two misses of the same kind I stop prompting, shrink the problem and print the real data. Cutting: polish first, then extras, then edge cases outside the sample. The end-to-end flow and the core tests stay. Fallback: a rule instead of a model, exact match instead of fuzzy, and I commit the working version first. Saying it: what failed, what I chose, what it costs. A working simple version that I can explain is better than a clever one that I can't finish."}, {"q": "In your own words: The presentation in Mercor's order, and the follow-ups.", "a": "I built a matcher over messy resume JSON: I'll say what I aimed for, show it run, then the tradeoffs, what I left out on purpose, and what's next. Intent: take messy candidate records and a job, and return a ranked list with the reasons, behind one endpoint. Demo: a run on the sample, 200 records in, 14 duplicates merged on a normalised email and name key, 6 skipped with a reason each. Tradeoffs: I used explicit skill and title rules, not embeddings, because I could read and test them in the time, and I merged duplicates with exact keys, not fuzzy matching, to avoid wrong merges. Scoping: I didn't build reranking or a UI. I had no labelled pairs, so I couldn't have shown reranking was better. Next: first a small labelled set and precision at 5, then fuzzy dedupe measured against it, then caching and batching if volume needs it. I wrote the matching rule and the tests myself; the model wrote the parsing and the endpoint, and I fixed two things it got wrong."}], "hasTrackerQuiz": false, "figs": [], "nlm": ["https://www.canva.dev/blog/engineering/ai-interview-success/", "https://genai-systems-lab-ivory.vercel.app/gt/fde-build-round-survival", "https://formation.dev/blog/ai-assisted-coding-interviews", "https://www.teamblind.com/post/mercor-swe-interview-experience-vv02w0gy", "https://www.anthropic.com/news/contextual-retrieval"]}, {"id": "wc38", "name": "The search build: iterate against a score", "blurb": "The reported candidate-search build: a baseline in 15 minutes, then one change at a time against an evaluation endpoint, without overfitting it, and a 15 minute discussion.", "intro": "AceOffer's synthesis of 20 Mercor reports describes a build of about 90 minutes: 75 minutes building with LLMs allowed against an evaluation endpoint, then 15 minutes on how you used the LLMs, the design and the debugging. The prompt is paraphrased in those reports, so this is a rehearsal of the loop, not a copy of the task. It is the build version of the guide's candidate search case study (SYSTEM%20DESIGN.html#/designs/candidate-search/requirements), and it comes after wc35 (the general build workflow) and alongside wc36 (the design version). It does not repeat the coding problems on the Coding tab.", "len": "1h 30m", "day": "5", "steps": [{"t": "The round as reported: 75 minutes building against a score, 15 minutes of discussion", "m": 10, "out": "Describe the candidate-search build round: how long, what you are given, what is scored, and what the last 15 minutes are for.", "d": "This is a reported round, not Mercor's published format. AceOffer's synthesis of 20 candidate reports says there is a build of about 90 minutes: 75 building with LLMs allowed, against an evaluation endpoint you call to get a score, then 15 minutes of discussion on how you used the LLMs, the design and debugging. The prompt is paraphrased there, not quoted, so treat the details as likely, not certain. A Blind post from 26 August 2026 describes a second part that used AI to beat a baseline, then a line-by-line review. Read the guide's candidate search case study first: this session is the build version of that design.", "pts": ["The shape: a job description comes in, a ranked list of candidate profiles goes out, and an evaluation endpoint tells you how good your ranking is. You submit, you see a number, you improve it", "LLMs are allowed in this round. The first hour of the separate coding round is the one with no LLMs; do not mix the two up. Ask at the start which tools are allowed and what the endpoint returns (one number, or per-query detail)", "What is being judged is how you work, not only the final score: a baseline early, one change at a time, a record of what helped, honest reading of failures", "The last 15 minutes are a conversation about the build. Expect: how you used the LLMs, why this design, what you debugged, and what you would do with another hour", "Unknowns to settle in the first two minutes: how many queries and candidates, whether fields are structured or free text, whether the endpoint is rate limited, and whether there is a call budget on submissions", "Related: wc35 is the general build workflow and presentation; wc36 is the system design version of candidate search. This session is the score-driven loop between them"], "where": "AceOffer, Mercor interview process (20 reports, 3 Nov 2026); Blind, a Mercor candidate, 26 Aug 2026; the guide's candidate search case study", "url": "https://aceoffer.app/interviews/mercor/interview-process", "ans": {"lead": "I understand it as a 75 minute build with LLMs allowed, scored by an evaluation endpoint, then 15 minutes explaining what I did.", "pts": ["The task: rank candidate profiles for a job description, and the endpoint returns a score I can improve.", "My first move: ask what the score measures, how often I can call it, and which tools are allowed.", "How I work: get a baseline score early, change one thing at a time, and write down what each change did.", "The last 15 minutes: how I used the LLMs, why the design, what I debugged and what I'd do next."], "close": "So the score matters, but how I got it up matters as much."}, "sdLinks": [], "read": [{"label": "AceOffer, Mercor interview process: the reported rounds, from 20 candidate reports", "url": "https://aceoffer.app/interviews/mercor/interview-process", "m": 8}, {"label": "Blind: a Mercor candidate's report of an AI-assisted part and a line-by-line review", "url": "https://www.teamblind.com/post/mercor-swe-interview-experience-vv02w0gy", "m": 4}], "figs": [], "sheet": {"cheat": ["Reported: about 90 minutes. 75 building with LLMs allowed against an evaluation endpoint, 15 minutes of discussion.", "Details come from paraphrased reports. Ask what the endpoint returns, how often you may call it, and which tools are allowed.", "Settle in two minutes: number of queries and candidates, structured or free text, call budget.", "Judged on how you work: early baseline, one change at a time, a log, honest reading of failures.", "Related: wc35 (build workflow), wc36 (design), the guide's candidate search case study."], "terms": [{"t": "Evaluation endpoint", "mem": "You submit, it scores.", "d": "A service the round gives you that scores your ranking, so you can measure each change."}, {"t": "Build score", "mem": "The number you move.", "d": "The result the endpoint returns for your ranker; it is only useful against a baseline and a log."}, {"t": "Discussion", "mem": "15 minutes on how.", "d": "The part after the build, about LLM use, the design and debugging."}], "vis": [{"rule": "Seventy-five minutes building against a score, fifteen minutes explaining it. Reported, not published."}, {"title": "The reported round", "lanes": [["Build", [["clarify 2", "plain"], ["baseline 13", "hot", "3"], ["iterate 60", "hot", "8"]]], ["Then", [["discuss 15", "done", "3"]]]], "note": "About 90 minutes. From a paraphrase of 20 reports; ask what is real on the day."}, {"title": "Ask at the start", "calc": [["endpoint", "one number or per-query detail?"], ["budget", "how many submissions?"], ["tools", "which LLMs are allowed?"], ["data", "structured fields or free text?"]]}]}}, {"t": "A baseline in the first 15 minutes: filters plus keyword overlap", "m": 25, "out": "You have 75 minutes and a scoring endpoint. What do you build in the first 15 minutes, and why that before anything clever?", "d": "A baseline is the simplest ranker that produces a score. It does two jobs: it shows the endpoint works end to end, and it is the number every later change is judged against. Build it from hard filters (years of experience, location, a required skill) and a keyword score such as word overlap or BM25. BM25 is a ranking function that scores a document by how often the query words appear in it, damped so that repeating a word ten times does not count ten times, and weighted so rare words count more. A plain word count is a weaker version of the same idea, and it is easy to fool by repeating words. The kit in the cheat sheet is a toy you can run now: 30 profiles, 3 jobs, hand labels, a precision at 5 scorer and a baseline ranker.", "pts": ["Get a score before you are clever: filters plus keyword overlap, submit, read the number. Fifteen minutes is the target. A candidate who has no score at minute 40 has nothing to compare against", "Hard filters first: they are cheap, exact and explainable. A candidate with 2 years does not fit a job that says 5. Keep filters loose at first; a wrong filter removes the right person and no later step can bring them back", "Keyword score: count the job words found in the profile. BM25 improves on it with term saturation and rarity weights, and a library such as rank_bm25 gives it in a few lines. Know what it misses: synonyms (server-side for backend, psql for Postgres) and meaning", "Precision at 5: of the first five results, how many are right. It is the score in the kit. Say why it suits a recruiter who reads the top of the list", "Run the kit, then break it: look at which wrong candidates reach the top 5. In the toy data one profile repeats words and wins. That failure is your next change", "Log every score from the start: a line in a notes file with the change and the number. This is the log you will use in the discussion", "Make the endpoint call a function you can rerun in one step. Every later minute depends on how cheap one try is"], "where": "Your own rehearsal kit; Eugene Yan on retrieval and ranking stages in a discovery system", "url": "https://eugeneyan.com/writing/system-design-for-discovery/", "ans": {"lead": "I get a baseline score in the first fifteen minutes with simple filters and keyword overlap, because every later change needs something to be compared with.", "pts": ["Filters: loose and exact, such as years of experience and a required skill, so I don't drop the right person.", "Ranking: word overlap or BM25 on the profile. It's weak on synonyms, and I know that going in.", "Score: precision at 5, because the recruiter reads the top of the list. In my toy set the baseline gets 0.73.", "Habit: I write the score and the change in a log after every run.", "Failures: I look at what ranked high and shouldn't have, and that decides my next change."], "close": "A working simple version first is what lets me prove that anything fancier helps."}, "sdLinks": [], "read": [{"label": "Eugene Yan, System design for discovery: retrieval, then ranking, as separate stages", "url": "https://eugeneyan.com/writing/system-design-for-discovery/", "m": 12}], "figs": [], "sheet": {"cheat": ["Baseline by minute 15: loose filters plus word overlap or BM25. Submit, read the score.", "Filters: cheap and exact. Keep them loose; a wrong filter removes the right person for good.", "BM25: word match with saturation and rarity weights. Weak on synonyms and meaning.", "Precision at 5: of the top five, how many are right. Baseline in the kit: 0.73.", "Read which wrong profiles reach the top five. That is your next change.", "Log every run: change, score. Make one rerun a single command."], "terms": [{"t": "BM25", "mem": "Word match, damped.", "d": "A ranking function that scores a document by how often the query words appear in it, with diminishing returns for repeats and extra weight for rare words."}, {"t": "Precision at k", "mem": "Of the top k, how many right.", "d": "The share of the first k results that are correct; precision at 5 looks at the first five."}, {"t": "Baseline", "mem": "The score to beat.", "d": "The simplest ranker that produces a number; every later change is judged against it."}, {"t": "Hard filter", "mem": "Exact, cheap, final.", "d": "A rule that removes candidates before ranking, such as minimum years; a wrong one cannot be undone by later steps."}], "vis": [{"rule": "A score at minute 15, then every change is judged against it."}, {"title": "The rehearsal kit: run it, then beat 0.73", "code": "# Rehearsal kit: 30 candidates, 3 jobs, hand labels, a scorer and a baseline ranker.\nimport re\n\nCANDS = [\n    # id, title, years, city, skills text\n    (\"c01\", \"Backend Engineer\", 7, \"San Francisco\", \"python postgres kafka queues distributed systems\"),\n    (\"c02\", \"Senior Software Engineer\", 9, \"San Francisco\", \"server-side python psql rabbitmq sharding replication\"),\n    (\"c03\", \"Backend Engineer\", 5, \"Oakland\", \"python postgres redis workers job scheduling\"),\n    (\"c04\", \"Staff Engineer\", 12, \"San Francisco\", \"go distributed systems consensus postgres kafka\"),\n    (\"c05\", \"Backend Developer\", 2, \"San Francisco\", \"python django postgres\"),\n    (\"c06\", \"Platform Engineer\", 6, \"Seattle\", \"python postgres kubernetes queues distributed systems\"),\n    (\"c07\", \"Data Engineer\", 6, \"San Francisco\", \"python spark airflow postgres kafka\"),\n    (\"c08\", \"Senior Backend Engineer\", 8, \"San Francisco\", \"java postgres kafka microservices distributed systems\"),\n    (\"c09\", \"Software Engineer\", 5, \"San Jose\", \"python python python postgres queues distributed systems backend backend\"),\n    (\"c10\", \"Frontend Engineer\", 6, \"San Francisco\", \"react typescript css\"),\n    (\"c11\", \"ML Engineer\", 4, \"Remote\", \"python pytorch llm evaluation retrieval embeddings\"),\n    (\"c12\", \"Applied Scientist\", 6, \"San Francisco\", \"python rag reranking evaluation metrics llm\"),\n    (\"c13\", \"Research Engineer\", 3, \"Boston\", \"pytorch transformers evaluation python\"),\n    (\"c14\", \"ML Engineer\", 2, \"Remote\", \"python sklearn pandas\"),\n    (\"c15\", \"AI Engineer\", 3, \"New York\", \"python llm agents vector search evaluation harness\"),\n    (\"c16\", \"Data Scientist\", 5, \"Remote\", \"python statistics experiments ab testing sql\"),\n    (\"c17\", \"NLP Engineer\", 7, \"Remote\", \"python bm25 elasticsearch embeddings ranking evaluation\"),\n    (\"c18\", \"Backend Engineer\", 4, \"Remote\", \"node typescript postgres apis\"),\n    (\"c19\", \"ML Platform Engineer\", 5, \"Austin\", \"python pytorch kubernetes model serving llm\"),\n    (\"c20\", \"Search Engineer\", 6, \"Remote\", \"elasticsearch ranking retrieval python relevance evaluation\"),\n    (\"c21\", \"Frontend Engineer\", 5, \"New York\", \"react typescript design systems storybook\"),\n    (\"c22\", \"UI Engineer\", 7, \"New York\", \"typescript web components design system accessibility\"),\n    (\"c23\", \"Frontend Developer\", 3, \"New York\", \"react javascript redux css\"),\n    (\"c24\", \"Full Stack Engineer\", 4, \"New York\", \"react typescript node postgres\"),\n    (\"c25\", \"Senior Frontend Engineer\", 8, \"Brooklyn\", \"react typescript design systems performance\"),\n    (\"c26\", \"Frontend Engineer\", 2, \"New York\", \"react typescript\"),\n    (\"c27\", \"Mobile Engineer\", 5, \"New York\", \"swift kotlin react native typescript\"),\n    (\"c28\", \"Frontend Engineer\", 6, \"New York\", \"react typescript design systems\"),\n    (\"c29\", \"Designer\", 6, \"New York\", \"figma design systems prototyping\"),\n    (\"c30\", \"Frontend Engineer\", 4, \"Remote\", \"vue typescript css testing\"),\n]\n\nJOBS = {\n    \"j1\": {\"text\": \"senior backend engineer python postgres distributed systems queues\", \"city\": \"San Francisco\", \"min_years\": 5},\n    \"j2\": {\"text\": \"ml engineer llm evaluation retrieval python embeddings\", \"city\": \"Remote\", \"min_years\": 3},\n    \"j3\": {\"text\": \"frontend engineer react typescript design systems\", \"city\": \"New York\", \"min_years\": 3},\n}\n\n# Hand labels: who a recruiter would call a good fit. Written before looking at any score.\nLABELS = {\n    \"j1\": {\"c01\", \"c02\", \"c03\", \"c04\", \"c06\", \"c08\"},\n    \"j2\": {\"c11\", \"c12\", \"c15\", \"c17\", \"c20\"},\n    \"j3\": {\"c21\", \"c22\", \"c25\", \"c28\", \"c24\"},\n}\n\n\ndef tokens(s):\n    return re.findall(r\"[a-z0-9]+\", s.lower())\n\n\ndef baseline(job):\n    \"\"\"Filter on years, then rank by shared words between job text and the candidate's profile.\"\"\"\n    want = set(tokens(job[\"text\"]))\n    out = []\n    for cid, title, years, city, skills in CANDS:\n        if years < job[\"min_years\"]:\n            continue\n        have = tokens(title + \" \" + skills)\n        out.append((sum(1 for w in have if w in want), cid))   # counts repeats on purpose: a weakness to find\n    out.sort(key=lambda p: (-p[0], p[1]))\n    return [cid for _, cid in out]\n\n\ndef precision_at_k(ranked, relevant, k=5):\n    return sum(1 for c in ranked[:k] if c in relevant) / k\n\n\ndef score(ranker, k=5):\n    per = {j: precision_at_k(ranker(JOBS[j]), LABELS[j], k) for j in JOBS}\n    return sum(per.values()) / len(per), per\n\n\nif __name__ == \"__main__\":\n    assert len(CANDS) == 30 and len({c[0] for c in CANDS}) == 30\n    mean, per = score(baseline)\n    print(\"baseline precision@5:\", round(mean, 2), {j: round(p, 2) for j, p in per.items()})\n    for j in JOBS:\n        top = baseline(JOBS[j])[:5]\n        print(j, \"top5\", top, \"wrong:\", [c for c in top if c not in LABELS[j]])\n", "pins": [[45, "hand labels, written before any score"], [61, "loose filter on years, then word overlap"], [64, "counts repeats on purpose: a weakness to find"], [69, "precision at 5"], [75, "mean over the three jobs"]]}, {"title": "What it prints", "calc": [["baseline P@5", "0.73"], ["j1", "0.80: a profile repeating words reaches the top"], ["j2", "0.60: two wrong profiles in the top five"], ["j3", "0.80: right stack, no design systems"]], "note": "Real output of the kit. Add your own ranker and rerun."}, {"title": "Try this next", "flow": ["Count a word once", "Score city and skills", "Add synonyms", "Rerun, log the score"]}]}}, {"t": "Iterating on the score: one change at a time, with a log", "m": 25, "out": "The baseline scores 0.73 on your labels. List the changes you would try, in order, and how you decide to keep one.", "d": "Each change must earn its place by moving the score, and you can only tell which one did it if you change one thing per run. The usual ladder for candidate search, cheapest first: fix the filters and the text you index; add a better keyword scorer; add embeddings so meaning matches (backend and server-side); rerank the top results; rewrite the query; and use an LLM to turn each free-text profile into structured fields. When the signal is hidden in messy text, extracting fields such as skills, seniority and years is often the biggest step. Anthropic's contextual retrieval write-up gives a measured example of why combining keyword search, embeddings and a reranker beats any one alone. Your own MetaRAG work is the same pattern: LLM-generated metadata added to chunks raised precision from 73.3% to 82.5% over a content-only baseline.", "pts": ["The ladder, cheapest first: clean the indexed text and the filters; BM25; embeddings on the profile; fuse the keyword and embedding scores; rerank the top 20 to 50; rewrite the job description into a query; LLM extraction of structured fields", "Embeddings: turn the job and each profile into vectors and rank by similarity. They catch synonyms that keywords miss. Cost: one embedding call per profile, once. Cache them to disk so a rerun does not pay again", "Reranking: take the top 20 to 50 from the cheap stage and score each against the job with a stronger model, such as a cross-encoder or an LLM asked for a score. It improves order at the top, which is where precision at 5 looks. Cost grows with the number of pairs, so keep the list short", "Query rewriting: ask an LLM to turn a job description into the must-haves, the nice-to-haves and the synonyms. A messy job post becomes a clean query. Check it did not invent requirements", "LLM extraction: for each profile, extract skills, years, seniority and domain into fields, then filter and score on the fields. It runs once per profile, so batch it and cache it. Check a sample by hand; models guess when a field is missing", "One change per run, every run logged: change, score, time spent, call cost. Keep the change if the score goes up and you can say why. Revert it if not. Never stack two untested changes", "A rise you cannot explain is a warning, not a win. Look at what moved in the top 5 before you keep it", "Budget the time: a change that needs 20 minutes of tokens and waiting must be worth it. Run LLM steps in parallel where the API allows, and test on one job before running all of them"], "where": "Anthropic, Contextual retrieval (retrieve with keywords and embeddings, then rerank); the guide's candidate search case study; your MetaRAG results in the master reference", "url": "https://www.anthropic.com/news/contextual-retrieval", "ans": {"lead": "I change one thing per run, log the score each time, and keep a change only if the score moves and I can say why.", "pts": ["Order: clean the text and filters, then BM25, then embeddings, then a reranker on the top few, then query rewriting and LLM field extraction.", "Why this order: the cheap, explainable steps first, and the expensive model calls only where the cheap ones have stalled.", "Embeddings catch what keywords miss: server-side and backend are different words and the same job.", "Extraction: a model turns messy profile text into skills, years and seniority once, and I cache it. I check a sample by hand.", "My own example: in MetaRAG, adding LLM-generated metadata to chunks lifted precision from 73.3% to 82.5% against a content-only baseline, and I only knew that because I measured it."], "close": "The log of score per change is also what I'll talk through in the last fifteen minutes."}, "sdLinks": [], "read": [{"label": "Anthropic, Contextual retrieval: keywords, embeddings and a reranker together, with measured results", "url": "https://www.anthropic.com/news/contextual-retrieval", "m": 8}], "figs": [], "sheet": {"cheat": ["Ladder, cheapest first: clean text and filters, BM25, embeddings, fuse scores, rerank the top 20 to 50, rewrite the query, LLM field extraction.", "Embeddings catch synonyms. Compute once per profile and cache to disk.", "Rerank only a short list: cost grows with the number of pairs.", "Query rewriting: must-haves, nice-to-haves, synonyms. Check it invented nothing.", "Extraction: skills, years, seniority per profile, once, cached. Check a sample by hand.", "One change per run. Keep if the score moves and you can say why. A rise you cannot explain is a warning."], "terms": [{"t": "Embedding", "mem": "Meaning as numbers.", "d": "A vector for a piece of text so that similar meanings sit close together; ranking by similarity finds matches that share no words."}, {"t": "Rerank", "mem": "Re-score the short list.", "d": "Using a stronger model on the top results from a cheap stage to fix their order."}, {"t": "Query rewriting", "mem": "Clean up the question.", "d": "Using a model to turn a messy job description into a precise query with synonyms."}, {"t": "Field extraction", "mem": "Free text to fields.", "d": "Using a model to read each profile once and write skills, years and seniority as structured data you can filter on."}, {"t": "Score log", "mem": "Change, number, line by line.", "d": "A running list of what you changed and what the score did; it is your evidence in the discussion."}], "vis": [{"rule": "One change per run. Log it. Keep it only if the score moves and you can say why."}, {"title": "The ladder, cheapest first", "ladder": [["1", "clean the text and the filters", "free"], ["2", "BM25", "free"], ["3", "embeddings, cached", "one call per profile"], ["4", "fuse keyword and embedding scores", ""], ["5", "rerank the top 20 to 50", "calls grow with pairs"], ["6", "rewrite the query", "one call per job"], ["7", "LLM field extraction", "one call per profile, cached"]]}, {"title": "A score log (the habit, not results from the kit)", "calc": [["baseline", "0.73"], ["count a word once", "up: keep"], ["embeddings fused", "up: keep"], ["rerank top 20", "flat: revert"]]}, {"title": "Keep or revert", "vs": {"cols": ["Keep", "Revert"], "rows": [["score up", "and you can say why", "and you cannot explain it"], ["score flat", "if it removes a known failure", "otherwise"], ["cost", "within the time left", "20 minutes for a point of noise"]]}}]}}, {"t": "Not overfitting the endpoint: a held-out slice and failures read by hand", "m": 15, "out": "Your score keeps rising but you are only tuning against the endpoint. How do you know the system is actually better?", "d": "If you tune against one score for 75 minutes, you can end up with a ranker that fits the scorer and not the job. The fix is the same as in any experiment: keep some data aside that you do not tune on, and look at actual failures. You may not control the endpoint's data, but you can make a small labelled set of your own, like the one in the kit, and hold part of it back. Then read the wrong results by hand, because a score tells you how much, and only reading tells you why.", "pts": ["Overfitting here means changing the ranker until it wins on the queries you have seen, for reasons that will not hold on new ones. Typical signs: a rule that names a specific job title, or a threshold tuned to one query", "Hold-out: split your jobs or your labels. Tune on one part. Check each kept change on the other part. If the tuning score rises and the held-out score does not, you are fitting the data, not the problem", "If the endpoint gives only one number and no hold-out, build your own small set. Ten jobs and a few labelled candidates each is enough to catch big mistakes. Say plainly how small it is", "Look at failures by hand: print the wrong candidates in the top 5 and the right ones that were missed, with the reason each went wrong. Group them: synonyms, a wrong filter, a repeated word, a missing field", "Fix groups, not single cases. If one fix names one candidate, it is overfit by construction", "Beware of leakage: do not put the labels, or text copied from the answer set, into a prompt or a rule. It lifts the score and proves nothing", "Noise: with a handful of jobs, one flipped result moves precision at 5 by several points. Say that a gap of one or two results is within noise, and that is why you read the failures", "Say it in the discussion: what you tuned on, what you held back, and the failure groups you found. It shows judgment, which is what the round tests"], "where": "Anthropic, Demystifying evals for AI agents (graders, what a score does and does not show); Hamel Husain on validating an LLM judge against human labels", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "ans": {"lead": "I keep part of my data aside, and I read the failures by hand, so I know a better score means a better ranker and not a better fit to the endpoint.", "pts": ["Hold-out: I tune on some jobs and check each kept change on others. If only the tuned score rises, I stop.", "Failures: I print the wrong results in the top five and group them: synonyms, a wrong filter, repeated words, missing fields.", "Fixes are for groups, not one case. A fix that names one candidate is overfit.", "Small numbers: with a few jobs, one result moves the score a lot, so I say how noisy it is.", "No leakage: the labels never go into a prompt or a rule."], "close": "The score tells me how much, and reading the failures tells me why."}, "sdLinks": [], "read": [{"label": "Anthropic, Demystifying evals for AI agents: graders, and what a score does and does not tell you", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "m": 15}, {"label": "Hamel Husain, Using an LLM as a judge: validate it against human labels", "url": "https://hamel.dev/blog/posts/llm-judge/", "m": 12}], "figs": [], "sheet": {"cheat": ["Overfitting: winning on the queries you have seen for reasons that will not hold on new ones.", "Hold out a slice of jobs or labels. Tune on one part, check each kept change on the other.", "No hold-out from the endpoint? Build your own small labelled set and say how small it is.", "Print wrong top-five results and missed right ones. Group them. Fix groups, not single cases.", "No leakage: labels never go into a prompt or a rule.", "Small sets are noisy: one flipped result moves precision at 5 by several points."], "terms": [{"t": "Overfitting", "mem": "Fits the test, not the job.", "d": "Tuning a system until it scores well on the data you tuned on, while it does no better on new data."}, {"t": "Hold-out", "mem": "Data you do not tune on.", "d": "A slice kept aside and used only to check whether a change really helps."}, {"t": "Leakage", "mem": "The answers in the question.", "d": "Letting labels or answer-set text reach the ranker, which raises the score and proves nothing."}, {"t": "Failure grouping", "mem": "Cases into causes.", "d": "Sorting wrong results by why they were wrong, such as synonyms, a bad filter or repeated words."}], "vis": [{"rule": "The score says how much. The failures say why. Keep some data aside."}, {"title": "Tune and hold out", "split": [["Tune on", ["some of the jobs", "read their failures", "change one thing"]], ["Check on", ["jobs you never tuned on", "did the gain hold?", "if not, revert"]]]}, {"title": "Group the failures", "vs": {"cols": ["Cause", "Fix a group, not a case"], "rows": [["synonyms", "server-side is backend", "embeddings or a synonym list"], ["repeated words", "a profile stuffed with one word", "count each word once"], ["wrong filter", "right person dropped", "loosen or score instead of filter"], ["missing field", "no years given", "extract, or treat as unknown"]]}}]}}, {"t": "The 15-minute discussion: how you used the LLMs, the design, the debugging", "m": 15, "out": "Walk me through how you used LLMs in the build, why you chose this design, and one thing that broke.", "d": "After the build, the reviewer asks about your process. This is where the log you kept pays off. The Blind report of a similar Mercor part describes the reverse: a reviewer who read the code line by line and asked about parts the candidate did not fully understand. So you need to be able to explain every piece, including the code an LLM wrote. Answer in this order: the score story, where the LLM helped and where you checked it, the design choices and their cost, one real bug, and what you would do next.", "pts": ["Open with the score story from your log: baseline 0.73, then each change and its effect. Numbers first, then reasons. If a change did not help, say so; it shows honest measurement", "How you used LLMs, in two places: as helpers while coding (what you gave them, what you checked, one thing they got wrong) and as parts of the system (embeddings, a reranker, extraction). Keep the two apart in your answer", "Design choices and costs: why a cheap stage then a rerank, how many model calls per query, what was cached, what would change at 100 times the candidates (an index, batch jobs, a vector store)", "Debugging story: pick one real failure. What the symptom was, how you found the cause (a printed wrong result, a log of scores), the fix, and how you checked it. A wrong filter that dropped the right candidate is a good example", "What you did not do, as a choice: no fine-tuning, no UI, no per-job tuning, because there was no time to measure it. Then the top three next steps, with evaluation first", "Own every line: for any function, say what it does and why that way, with the tool closed. If you cannot, say so and say how you would find out", "Do not claim a gain you did not measure, and do not call a toy set a benchmark"], "where": "Blind, a Mercor candidate on the line-by-line review; Canva Engineering on explaining decisions after an AI-assisted build; wc35 step 5", "url": "https://www.teamblind.com/post/mercor-swe-interview-experience-vv02w0gy", "ans": {"lead": "I'd start with the score story, then say where the LLMs helped and where I checked them, then the design, one bug, and what's next.", "pts": ["Score story: baseline, then each change and what it did, including the ones that did nothing.", "LLMs: as a coding helper I gave it small asks and fixed what it got wrong. As part of the system they did embeddings, reranking and extraction, and I checked a sample by hand.", "Design: cheap stage first, expensive stage on the top few, cached, so cost per query stays low.", "A bug: I'd tell one real one, how I found it and how I checked the fix.", "Next: a bigger labelled set first, then the changes that the failures point to."], "close": "I can explain every line, including the ones the model wrote, because I read them all."}, "sdLinks": [], "read": [{"label": "Blind: a Mercor candidate who was asked about code they did not fully understand", "url": "https://www.teamblind.com/post/mercor-swe-interview-experience-vv02w0gy", "m": 4}, {"label": "Canva Engineering, AI interview success: justify decisions and discuss tradeoffs", "url": "https://www.canva.dev/blog/engineering/ai-interview-success/", "m": 5}], "figs": [], "sheet": {"cheat": ["Order: score story from your log, LLM use, design and cost, one real bug, what you skipped, next steps.", "LLM use in two places: as a coding helper (what you checked, what it got wrong) and as part of the system (embeddings, rerank, extraction).", "Design: cheap stage then rerank, calls per query, what is cached, what changes at 100 times the candidates.", "Bug story: symptom, how you found it, the fix, how you checked.", "Skipped on purpose: no fine-tuning, no UI, no per-job tuning, no time to measure it.", "Own every line. Do not claim an unmeasured gain."], "terms": [{"t": "Score story", "mem": "Baseline, then each change.", "d": "Telling the build as numbers from your log, including changes that did nothing."}, {"t": "Calls per query", "mem": "The cost of a design.", "d": "How many model or embedding calls one search needs; it decides latency and cost."}, {"t": "Line-by-line review", "mem": "Explain what you shipped.", "d": "A reviewer reads your code and asks why; you must explain model-written lines too."}], "vis": [{"rule": "Score story, LLM use, design, one bug, what you skipped, next steps."}, {"title": "The order", "flow": ["Score story", "LLM use", "Design and cost", "One real bug", "Skipped on purpose", "Next steps"]}, {"title": "Two kinds of LLM use", "split": [["As a coding helper", ["small asks", "what you checked", "one thing it got wrong"]], ["As part of the system", ["embeddings", "rerank or extraction", "cached, sampled by hand"]]]}]}}], "study": [], "quiz": [{"q": "In your own words: The round as reported: 75 minutes building against a score, 15 minutes of discussion.", "a": "I understand it as a 75 minute build with LLMs allowed, scored by an evaluation endpoint, then 15 minutes explaining what I did. The task: rank candidate profiles for a job description, and the endpoint returns a score I can improve. My first move: ask what the score measures, how often I can call it, and which tools are allowed. How I work: get a baseline score early, change one thing at a time, and write down what each change did. The last 15 minutes: how I used the LLMs, why the design, what I debugged and what I'd do next. So the score matters, but how I got it up matters as much."}, {"q": "In your own words: A baseline in the first 15 minutes: filters plus keyword overlap.", "a": "I get a baseline score in the first fifteen minutes with simple filters and keyword overlap, because every later change needs something to be compared with. Filters: loose and exact, such as years of experience and a required skill, so I don't drop the right person. Ranking: word overlap or BM25 on the profile. It's weak on synonyms, and I know that going in. Score: precision at 5, because the recruiter reads the top of the list. In my toy set the baseline gets 0.73. Habit: I write the score and the change in a log after every run. Failures: I look at what ranked high and shouldn't have, and that decides my next change. A working simple version first is what lets me prove that anything fancier helps."}, {"q": "In your own words: Iterating on the score: one change at a time, with a log.", "a": "I change one thing per run, log the score each time, and keep a change only if the score moves and I can say why. Order: clean the text and filters, then BM25, then em
