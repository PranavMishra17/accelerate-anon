.pq-work .lab { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); margin: var(--s3) 0 var(--s1); }
.pq-tests { font-size: var(--fs-sm); color: var(--soft); margin: 0 0 var(--s2); }

details.pq.rev > summary .qt::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: var(--s2); vertical-align: middle; }
/* prep: the list of rows, and one card per question with its follow-ups stepped on the right */
.prows { list-style: none; margin: 0; padding: 0; }
.prows li { border-bottom: var(--hair); }
.prow { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s1) var(--s4); flex-wrap: wrap; padding: var(--s2) 0; text-decoration: none; }

.prow.rev .qt::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: var(--s2); vertical-align: middle; }
.pc { margin: 0; padding-top: var(--s3); }

.shell:has(.pc) { padding-bottom: var(--s4); }
.pc-head h2 { margin: var(--s2) 0 var(--s1); }

#ask.bank-sec { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 var(--s6); }
#ask.bank-sec > h2 { grid-column: 1 / -1; }

@media (min-width: 961px) and (min-height: 520px) {

}

.c3 { margin: var(--s1) 0 var(--s6); }
.c3-t { font-size: var(--fs-lg); margin: var(--s4) 0 var(--s1); }
.c3-w { display: block; font-size: var(--fs-sm); font-weight: var(--w-regular); color: var(--muted); margin-top: 2px; }

  border-bottom: var(--hair); padding: var(--s3) 0; color: var(--ink); }

/* the turn list: one row per turn, on the page and in the panel's rail */
main .turns { list-style: none; margin: var(--s4) 0 0; padding: 0; border-top: var(--hair); max-width: none; }
.turn { max-width: 1180px; display: grid; grid-template-columns: 24px 14px minmax(0, 1fr) auto; align-items: baseline; gap: var(--s1); width: 100%; text-align: left;
  background: none; border: 0; border-bottom: var(--hair); padding: var(--s2) var(--s1); color: var(--ink); }

/* dialogs float, so they alone carry a shadow */

/* the one-screen panel, shared by mocks and the Prep banks: the list on the left; the item's
   header; then understanding on the page and what to say on a sunken tint, each scrolling on its own */
dialog.convo { width: min(1320px, 96vw); height: min(880px, 92vh); max-width: none; max-height: none; overflow: hidden; }
.cv { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100%; }

.cv-title b { font-weight: var(--w-strong); }
.cv-title span { display: block; color: var(--muted); font-size: var(--fs-xs); margin-top: var(--s1); }
.cv-rail .turn { grid-template-columns: 20px 14px minmax(0, 1fr); border-radius: var(--radius); border-bottom: 0; margin-top: 1px; font-size: var(--fs-sm); line-height: var(--lh-tight); padding: 6px var(--s2); }

.cv-rail .turn.on .tl { font-weight: var(--w-strong); }
.cv-keys { margin-top: auto; padding: var(--s3) var(--s2) 0; font-size: var(--fs-xs); color: var(--muted); }

.cv-pane { display: flex; flex-direction: column; min-height: 0; }
.cv-head { padding: var(--s4) 96px var(--s3) var(--s5); border-bottom: var(--hair); flex: none; }
.cv-verdict { margin: var(--s2) 0 0 var(--s4); font-size: var(--fs-sm); color: var(--soft); }
.cv-verdict b { color: var(--ink); font-weight: var(--w-strong); }
.cv-tests { margin: var(--s1) 0 0 var(--s4); font-size: var(--fs-sm); color: var(--muted); }
.cv-tests b { color: var(--soft); font-weight: var(--w-strong); }
.cv-cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--s2); flex: 1; min-height: 0; padding: 0 var(--s4) var(--s4) 0; }
.cv-cols.has-code { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.cv-col { overflow-y: auto; padding: var(--s4) var(--s5) var(--s6); scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.cv-col.cv-say { scrollbar-color: var(--muted) transparent; }
.cv-h { font-size: var(--fs-md); margin: 0 0 var(--s3); }
.stepsheet { margin: var(--s4) 0 0; padding-top: var(--s2); }
.vpick { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin: 0 0 var(--s3); }
.vp-lab { font-size: var(--fs-sm); color: var(--muted); font-weight: var(--w-strong); }
.vp { font: inherit; font-size: var(--fs-sm); padding: 2px var(--s3); border: var(--hair); border-radius: var(--radius-sm); background: transparent; color: var(--soft); cursor: pointer; }

.meta .nlm-copy { margin-left: auto; }
.stepsheet .lab { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); margin: var(--s3) 0 var(--s1); }
.cv-col .lab, .sbody .lab { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); margin: var(--s4) 0 var(--s1); }
.cv-part { font-size: var(--fs-md); margin: var(--s5) 0 var(--s1); padding-top: var(--s3); border-top: var(--hair); }
.cv-part-lead { color: var(--soft); margin: 0 0 var(--s1); }
.cv-code { margin: var(--s2) 0 var(--s3); padding: var(--s3); background: var(--code-bg); border-radius: var(--radius); overflow-x: auto;
  font-family: var(--mono); font-size: var(--fs-code); line-height: 1.6; color: var(--code-ink); white-space: pre; }
.cv-code code { background: none; padding: 0; font-size: inherit; color: inherit; }
/* what to say: the one inverse sheet on the screen (dark on the light theme), so the words to
   say never read like the notes beside them. Its labels are the sheet's own ink, dimmed. */

.cv-land { margin: 0 0 var(--s4); padding: 0 0 var(--s3); border-bottom: 1px solid var(--muted); }

.cv-meta { margin: var(--s4) 0 0; font-size: var(--fs-xs); }
.cv-rev { font-size: var(--fs-sm); }
.cv-said .reading a { color: var(--ink); }
.cv-col figure { padding: var(--s3); margin: var(--s4) 0 0; }

@media (max-width: 860px) {

/* figures are drawn for a light ground, so they sit on the light surface on every theme
   (the light tokens' values: surface, ink, muted, rule) */
figure { margin: var(--s5) 0 var(--s6); padding: var(--s4); background: #FFFDF8; color: #1D1B17; border: 1px solid #E5DDCD; border-radius: var(--radius-lg); overflow-x: auto; }

/* the tracker's own figures, drawn with its classes */
figure.trk { --faint: #a2a09a; --dim: #6b6a65; --line: #c3c0b7; --ink: #1a1a19; --live: #fffdf5; }
table { width: 100%; border-collapse: collapse; margin: var(--s1) 0; font-size: var(--fs-sm); }
th, td { text-align: left; padding: var(--s2) var(--s3) var(--s2) 0; border-bottom: var(--hair); vertical-align: top; }
th { font-weight: var(--w-strong); color: var(--muted); font-size: var(--fs-xs); }
td:first-child { font-weight: var(--w-strong); }
.tnote { font-size: var(--fs-sm); color: var(--muted); margin: var(--s2) 0 var(--s6); }

/* sessions */
.session .meta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); margin-top: calc(-1 * var(--s3)); }
.chip { color: var(--muted); }
.chip.done { color: var(--ok); }
.session .intro { color: var(--soft); margin: var(--s3) 0; }
.session > h3 { margin: var(--s6) 0 var(--s2); }
.step { border-top: var(--hair); }
.step > summary { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: var(--s3); align-items: start; padding: var(--s3) var(--s6) var(--s3) 0; }
.step > summary .st { font-weight: var(--w-strong); }
.step > summary:hover .st { color: var(--accent); }
.step > summary .sm { color: var(--muted); font-size: var(--fs-sm); padding-top: 2px; white-space: nowrap; }
.tick { width: 18px; height: 18px; border-radius: var(--radius-sm); border: 1.5px solid var(--muted); background: transparent; color: var(--surface);
  display: grid; place-items: center; font-size: var(--fs-xs); margin-top: 3px; padding: 0; }
.tick.on { background: var(--ok); border-color: var(--ok); }
.sbody { padding: 0 0 var(--s5) 30px; }
.step { scroll-margin-top: calc(var(--top) + var(--s2)); }
.sbody2 { margin: 0 0 var(--s5); grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); }
.sbody2 > .cv-said { padding: 0 var(--s4) 0 30px; }
.sbody2 > .cv-said > p.d { margin: 0 0 var(--s3); }
.pts { margin: 0 0 var(--s3); padding-left: var(--s5); }
.pts li { margin: 0 0 var(--s2); padding-left: var(--s1); }
.pts li b { font-weight: var(--w-strong); color: var(--ink); }
.pq-work { align-self: start; position: sticky; top: calc(var(--top) + var(--s3)); padding: 0 0 var(--s4); }
.pq-work .mine { margin-top: 0; }
.pq-work details.say .transcript { margin-top: var(--s3); }
@media (max-width: 760px) { .sbody2 > .cv-said { padding: 0; } .pq-work { position: static; } }
.sbody > p.d, .sbody > p.point { margin: 0 0 var(--s1); }
.reading { margin: 0; padding: 0; list-style: none; }
.reading li { margin: 0 0 var(--s2); padding-left: var(--s3); position: relative; }
.reading li::before { content: ""; position: absolute; left: 0; top: .75em; width: 5px; height: 1.5px; background: var(--muted); }
.reading a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.reading a:hover { text-decoration-color: var(--ink); }
.reading .w { color: var(--muted); font-size: var(--fs-sm); margin-left: var(--s2); white-space: nowrap; }
.reading .why { display: block; color: var(--soft); font-size: var(--fs-sm); margin-top: 2px; }
.sbody figure { margin: var(--s4) 0 var(--s2); }
details.say { margin-top: var(--s4); }
details.say > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--accent); }
details.say > summary::-webkit-details-marker { display: none; }
details.say > summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin-top: -3px; }
details.say[open] > summary::after { transform: rotate(-135deg); margin-top: 3px; }
details.say > summary:hover { text-decoration: underline; text-underline-offset: 3px; }
details.item > .sbody { padding-left: 0; }
@media (max-width: 700px) { .sbody { padding-left: 0; } }
.session-end { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-top: var(--s5); }
.pager { display: flex; justify-content: space-between; gap: var(--s4); margin-top: var(--s6); padding-top: var(--s4); border-top: var(--hair); }
.pager a { display: flex; flex-direction: column; color: var(--ink); font-weight: var(--w-strong); max-width: 48%; }
.pager a span { font-weight: var(--w-regular); font-size: var(--fs-sm); color: var(--muted); }
.pager a.next { text-align: right; margin-left: auto; }
.pager a:hover { color: var(--accent); text-decoration: none; }

/* quiz: one question at a time */
.dq { padding: var(--s5) var(--s5) var(--s4); }
.dq .dots { display: flex; gap: var(--s1); margin-bottom: var(--s4); }
.dq .dots i { width: 20px; height: 3px; border-radius: 2px; background: var(--rule); }

.dq .qq { font-size: var(--fs-lg); font-weight: var(--w-strong); line-height: var(--lh-tight); }
.dq .model { margin-top: var(--s4); padding-left: var(--s3); border-left: 2px solid var(--ok); color: var(--soft); }
.dq .model b { display: block; font-size: var(--fs-sm); color: var(--ok); font-weight: var(--w-strong); }
.dq .row { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s4); align-items: center; }
.dq .row .grow { flex: 1; }
.dq .close { background: none; border: 0; color: var(--muted); font-size: var(--fs-sm); }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 var(--s4) var(--s7); }
  nav.side { display: none; }
  main { padding-top: var(--s5); }
  .top-in { padding: 0 var(--s4); gap: var(--s2); }
  .top .loopname, .prog, .count { display: none; }
  .tabs { min-width: 0; overflow-x: auto; scrollbar-width: none; }

}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
@media (prefers-reduced-motion: reduce) { details > summary::after { transition: none; } }
/* coding tab: parts in order, one per page; every block ends in something you do */
.cd-parts { list-style: none; padding: 0; margin: 0 0 var(--s5); display: grid; gap: var(--s1); }
.cd-parts a { display: flex; gap: var(--s3); align-items: baseline; color: var(--ink); }
.cd-parts a.on { color: var(--accent); font-weight: var(--w-strong); }
.cd-parts .cd-n { color: var(--muted); font-size: var(--fs-sm); min-width: 1.5em; }
.cd-parts .cd-m { color: var(--muted); font-size: var(--fs-sm); margin-left: auto; white-space: nowrap; }
.cd-sec { margin: var(--s6) 0 0; padding-top: var(--s4); border-top: var(--hair); }
.cd-sec h3 { font-size: var(--fs-lg); margin-bottom: var(--s3); }
.cd-blk { margin: var(--s4) 0; max-width: 860px; }
.cd-toprow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s5); align-items: start; margin: var(--s4) 0; max-width: 1100px; }
.cd-toprow > .am-res, .cd-toprow > .cd-apart { margin: 0; }
@media (max-width: 900px) { .cd-toprow { grid-template-columns: minmax(0, 1fr); } }
.cd-apart { margin: var(--s4) 0; max-width: 860px; padding: var(--s4) var(--s5); border-radius: var(--radius-lg); background: var(--ink); color: var(--bg); }
.cd-apart-h { font-weight: var(--w-strong); margin-bottom: var(--s2); }
.cd-apart ol { margin: 0; padding-left: var(--s5); }
.cd-apart li { margin: var(--s2) 0; line-height: 1.5; }
.cd-apart strong { color: inherit; }
.dif { font-size: var(--fs-xs); white-space: nowrap; }
.dif.d-easy { color: var(--ok); } .dif.d-medium { color: var(--muted); } .dif.d-hard { color: var(--warn); }
.cd-probs table { width: 100%; } .cd-probs td { vertical-align: top; } .cd-probs td.cd-pl { white-space: nowrap; text-align: right; }
.cd-probs a.ext + a.ext { margin-left: var(--s2); }
/* A mock turn: the interviewer left, what you say right on the dark sheet, the follow-ups folded under it. */
.turn { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: var(--s6); margin: var(--s4) 0 var(--s6); align-items: start; }
.turn + .turn { border-top: var(--hair); padding-top: var(--s5); }
.turn-who { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); margin-bottom: var(--s2); }
.turn-ask { font-size: var(--fs-lg); line-height: 1.45; margin: 0 0 var(--s4); }
.turn-chk { list-style: none; padding: 0; margin: 0 0 var(--s4); font-size: var(--fs-sm); color: var(--muted); }
.turn-chk li { padding-left: var(--s4); position: relative; margin: var(--s1) 0; }
.turn-chk li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.turn-avoid { font-size: var(--fs-sm); margin: 0; }
.turn-avoid strong { color: var(--warn); }
.say-sheet { background: var(--ink); color: var(--bg); border-radius: var(--radius-lg); padding: var(--s4) var(--s5); }
.say-sheet p { margin: 0; font-size: var(--fs-md); line-height: 1.6; }
.say-sheet p + p { margin-top: var(--s3); }
.say-sheet strong { color: inherit; font-weight: var(--w-strong); box-shadow: inset 0 -.38em color-mix(in srgb, var(--accent) 55%, transparent); }
.say-sheet .turn-who { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.say-hidden { cursor: pointer; text-align: left; width: 100%; border: 0; font: inherit; color: color-mix(in srgb, var(--bg) 70%, transparent); }
.turn-more { margin-top: var(--s3); }
.turn-exp { margin-top: var(--s4); }
.turn-exp-h { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); margin-bottom: var(--s2); }
.turn-exp ul { margin: 0; padding-left: var(--s5); }
.turn-exp li { margin: 0 0 var(--s2); line-height: 1.55; }
.turn-probe { padding-left: var(--s5); border-left: 2px solid var(--accent-soft); }
.turn + .turn-probe { border-top: 0; padding-top: 0; }
.turn-src { font-size: var(--fs-sm); margin-top: var(--s3); color: color-mix(in srgb, var(--bg) 70%, transparent); }
.turn-more > summary { cursor: pointer; font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--accent); }
.turn-more ul { margin: var(--s2) 0 0; padding-left: var(--s5); font-size: var(--fs-sm); }
.turn-vis { margin-top: var(--s3); }
.turn-quick { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); margin: var(--s3) 0; }
.turn-quick .turn-ask { font-size: var(--fs-md); font-weight: var(--w-strong); margin: 0; }
.say-mode { display: flex; gap: var(--s2); align-items: center; font-size: var(--fs-sm); color: var(--muted); margin: var(--s3) 0; }
.say-mode button { font: inherit; padding: var(--s1) var(--s3); border: var(--hair); border-radius: 999px; background: transparent; color: inherit; cursor: pointer; }
.say-mode button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
/* Notes to what you say: a row per concept, three columns. */
.bridge { display: grid; grid-template-columns: minmax(8rem, 1fr) minmax(0, 2.2fr) minmax(0, 2.4fr); max-width: 1100px; margin: var(--s4) 0; font-size: var(--fs-sm); }
.bridge > div { padding: var(--s3) var(--s3) var(--s3) 0; border-top: var(--hair); }
.bridge .bh { font-weight: var(--w-strong); color: var(--muted); border-top: 0; }
.bridge .bc { font-weight: var(--w-strong); font-size: var(--fs-md); }
.bridge .bf { color: var(--muted); }
.bridge .bs { font-size: var(--fs-md); }
.bridge .bs strong { box-shadow: inset 0 -.38em var(--accent-soft); }
@media (max-width: 900px) {
  .turn, .turn-quick { grid-template-columns: 1fr; gap: var(--s3); }
  .bridge { grid-template-columns: 1fr; }
  .bridge .bh { display: none; }
  .bridge > div { border-top: 0; padding: var(--s1) 0; }
  .bridge .bc { border-top: var(--hair); padding-top: var(--s3); }
}
.cd-q { font-weight: var(--w-strong); margin: 0 0 var(--s2); }
.cd-code { margin: var(--s2) 0; background: var(--code-bg); color: var(--code-ink); border-radius: var(--radius); padding: var(--s2) 0; overflow-x: auto;
  font-family: var(--mono); font-size: var(--fs-code); line-height: 1.6; }
.cd-ttl { font-size: var(--fs-sm); color: var(--muted); margin-bottom: var(--s1); }
.cd-ln { display: grid; grid-template-columns: 3em minmax(0, 1fr); white-space: pre; }
.cd-ln .no { color: var(--code-ink); opacity: .45; text-align: right; padding-right: var(--s3); user-select: none; }
.cd-ln .tx { padding-right: var(--s3); }
.cd-code.asking .cd-ln { cursor: pointer; }
.cd-code.asking .cd-ln:hover { background: rgba(127, 127, 127, .18); }
.cd-ln.pick { background: rgba(200, 120, 90, .28); }
.cd-ln.hit { background: rgba(110, 180, 140, .28); }
.cd-pin { grid-column: 2; white-space: normal; font-family: var(--font); font-size: var(--fs-sm); opacity: .78; padding: 0 var(--s3) var(--s1) 0; }
.cd-pin::before { content: "\2191  "; }
.cd-bar { display: flex; flex-wrap: wrap; gap: var(--s2); margin: var(--s2) 0; align-items: center; }
.cd-bar .note { font-size: var(--fs-sm); color: var(--muted); }
.cd-why { color: var(--soft); margin: var(--s2) 0; }
.cd-ok { color: var(--ok); font-weight: var(--w-strong); }
.cd-no { color: var(--warn); font-weight: var(--w-strong); }
.cd-opts { display: grid; gap: var(--s1); margin: var(--s2) 0; }
.cd-opts button { text-align: left; border: var(--hair); background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: var(--s2) var(--s3); }
.cd-opts button.right { border-color: var(--ok); color: var(--ok); font-weight: var(--w-strong); }
.cd-opts button.wrong { border-color: var(--warn); color: var(--warn); }
.cd-opts button.idk { color: var(--muted); }
/* Python colours (light and dark), shared by code blocks and the editor. */
.py-k { color: #a626a4; } .py-s { color: #50a14f; } .py-c { color: #8a8a8a; } .py-n { color: #986801; }
.py-f { color: #4078f2; } .py-b { color: #0184bc; } .py-d { color: #c18401; } .py-sf { color: #e45649; }
/* The editor: Amazon LiveCode's plain look, a white page, a grey gutter, monospace, no chrome. */
.lc { --lc-bg: #ffffff; --lc-ink: #1f2328; --lc-gut: #f6f8fa; --lc-gut-ink: #8c959f; --lc-line: #d0d7de;
  display: grid; grid-template-columns: auto minmax(0, 1fr); margin-top: var(--s2); background: var(--lc-bg); color: var(--lc-ink);
  border: 1px solid var(--lc-line); border-radius: var(--radius); overflow: hidden; height: 360px;
  font-family: var(--mono); font-size: var(--fs-code); line-height: 1.6; }
.lc.wb-ta { height: 52vh; }
.lc:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.lc-gut { min-width: 3.2em; padding: var(--s3) var(--s2) var(--s3) var(--s3); background: var(--lc-gut); color: var(--lc-gut-ink); text-align: right;
  white-space: pre; overflow: hidden; user-select: none; border-right: 1px solid var(--lc-line); }
.lc-body { position: relative; overflow: hidden; height: 100%; }
.lc-view, .lc-ta { margin: 0; padding: var(--s3); border: 0; font: inherit; line-height: inherit; tab-size: 4; white-space: pre; letter-spacing: 0;
  word-wrap: normal; overflow-wrap: normal; box-sizing: border-box; }
.lc-view { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--lc-ink); background: transparent; }
.lc-ta { position: relative; display: block; width: 100%; height: 100%; resize: none; outline: none; overflow: auto;
  background: transparent; color: transparent; caret-color: var(--lc-ink); -webkit-text-fill-color: transparent; }
.lc-ta::selection { background: rgba(9, 105, 218, .22); -webkit-text-fill-color: transparent; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lc { --lc-bg: #1e1e1e; --lc-ink: #d4d4d4; --lc-gut: #252526; --lc-gut-ink: #6e7681; --lc-line: #3c3c3c; } }
:root[data-theme="dark"] .lc { --lc-bg: #1e1e1e; --lc-ink: #d4d4d4; --lc-gut: #252526; --lc-gut-ink: #6e7681; --lc-line: #3c3c3c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .py-k { color: #c678dd; } :root:not([data-theme="light"]) .py-s { color: #98c379; }
  :root:not([data-theme="light"]) .py-c { color: #7f848e; } :root:not([data-theme="light"]) .py-n { color: #d19a66; } :root:not([data-theme="light"]) .py-f { color: #61afef; }
  :root:not([data-theme="light"]) .py-b { color: #56b6c2; } :root:not([data-theme="light"]) .py-d { color: #e5c07b; } :root:not([data-theme="light"]) .py-sf { color: #e06c75; } }
:root[data-theme="dark"] .py-k { color: #c678dd; } :root[data-theme="dark"] .py-s { color: #98c379; } :root[data-theme="dark"] .py-c { color: #7f848e; }
:root[data-theme="dark"] .py-n { color: #d19a66; } :root[data-theme="dark"] .py-f { color: #61afef; } :root[data-theme="dark"] .py-b { color: #56b6c2; }
:root[data-theme="dark"] .py-d { color: #e5c07b; } :root[data-theme="dark"] .py-sf { color: #e06c75; }
textarea.cd-ta { font-family: var(--mono); font-size: var(--fs-code); line-height: 1.55; min-height: 140px; tab-size: 4; white-space: pre; overflow-x: auto; }
textarea.cd-ta.small { min-height: 60px; font-family: var(--font); white-space: pre-wrap; }
.cd-faq details { border-bottom: var(--hair); padding: var(--s2) 0; }
.cd-faq summary { cursor: pointer; font-weight: var(--w-regular); }
.cd-faq details[open] summary { font-weight: var(--w-strong); }
/* Stage-by-stage parts (flow: true): each stage heading starts a new band; running text keeps the measure. */
.cd-sec > p, .cd-sec .cd-blk > p { max-width: var(--measure); }
.cd-sec > p.cd-stage { font-size: var(--fs-lg); margin: var(--s6) 0 var(--s2); padding-top: var(--s4); border-top: var(--hair); }
.cd-sec > p.cd-stage + .cd-blk { margin-top: var(--s2); }
.cd-faq p { margin: var(--s2) 0 0; color: var(--soft); }
/* Hand-drawn figures in LLD part 0 (ported from lld-path.html); markers come from one hidden #lld-defs. */
.cd-svg svg { display: block; width: 100%; max-width: 420px; height: auto; }
.d-box { fill: var(--sunken); stroke: var(--muted); stroke-width: 1.2; }
.d-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.d-dim, .d-dashbox { fill: var(--bg); stroke: var(--rule); stroke-width: 1; }

.d-ar, .d-tri, .d-agg { stroke: var(--muted); stroke-width: 1.4; fill: none; marker-end: url(#ar); }
.d-tri { marker-end: url(#tri); }

.cd-prob dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--s1) var(--s4); font-size: var(--fs-sm); }

.cd-nav { display: flex; justify-content: space-between; gap: var(--s3); margin-top: var(--s7); padding-top: var(--s4); border-top: var(--hair); }

<script type="application/json" id="loop-data">{"id": "mercor", "title": "Mercor, Applied AI (Enterprise)", "subtitle": "Onsite, Wednesday 11 November: coding, system design, algorithms, GTM", "when": "Wednesday 11 November 2026, 10:00 AM to 2:30 PM Pacific, in person at Mercor HQ, San Francisco", "when_iso": "2026-11-11T10:00:00-08:00", "who": "Coding review: Bradley Moon, Member of Technical Staff. System design: Ishwari Nalgirkar. Algorithms: Pranav Mereddy, Tech Lead Manager. GTM: Will Ledingham, Engagement Manager, and Lily Liu, Principal, both Enterprise AI. Set-up and wrap-up: Maggie Cassidy. Leadership chats may be slotted into spare time.", "format": "The agenda, Pacific time: 10:00 set-up; 10:15 coding challenge, one hour solo and screen-recorded; 11:15 coding review, 30 minutes; 11:45 break; 12:15 SWE system design, 45 minutes; 1:00 break; 1:15 algorithms, 30 minutes; 1:45 break; 2:00 GTM, 15 minutes; 2:15 wrap-up. The calendar block runs longer in case leadership chats are added.", "bar": "Coding: data structures, graph reasoning, correctness under constraints, explaining and extending your code live. No LLM tools, no Google search or Gemini, no IDE plugins; any language, Python recommended. System design: a backend system end to end: data model and schema, API, block diagram, behaviour under concurrent load, recovery from failures, the trade-offs. No code. Algorithms: real architecture and scaling problems, discussion-based; not LeetCode, not system design. GTM: communication, product sense, user empathy, how you handle users and stakeholders.", "sessions": [{"id": "wc37", "name": "The basics they still check: complexity, hashing, graphs, and a cache race", "blurb": "The basics reports say Mercor still checks: say a complexity precisely, dedupe with a hash, search a graph under a call budget, and make a retry safe.", "intro": "Round 2 showed the soft spot: bogosort said as O(n^n) and then O(n²), and the random sort as O(n³). The reports say Mercor's onsite also has easy-to-medium algorithm parts: deduplication with hash sets, checking a million user IDs, a friend network through a restricted API, cars and preferred spots, a double refund that needs an idempotency key. This session drills those, with code that runs, in the order they cost you most.", "len": "1h 30m", "day": "1", "steps": [{"t": "Say a cost precisely: rounds times work per round", "m": 20, "out": "What is the time complexity of bogosort, of a nested loop with a hash lookup inside, and of building a heap from n items?", "d": "Complexity is how the work grows as the input grows. Say it as a count: how many rounds, times how much work each round. Then say which case you mean: best, expected (the average over the randomness), or worst. In round 2 you said O(n^n) and then O(n²) for bogosort, and O(n³) for the random sort. Each time the rounds were not counted first. Three drills below, answers last.", "pts": ["Count rounds first, then the work in one round, then multiply. If you cannot see the answer, say that count out loud; it is what the interviewer is listening for", "Name the case: best case (already sorted), expected case (averaged over the random choices), worst case (the longest it could ever run). A randomised algorithm can have no worst-case bound at all", "Drill 1, bogosort: shuffle, check, repeat. One shuffle lands on sorted with chance 1/n!, so about n! rounds. Each round costs O(n) to shuffle and O(n) to check. Expected O(n · n!), best O(n), worst unbounded. Run it: 4 items took about 24 shuffles, 5 items about 121", "Drill 2, a nested loop with a hash lookup inside: n × n rounds of an O(1) lookup is O(n²). The lookup is O(1) on average only; adversarial keys that collide make it O(n), so the worst case is O(n³). Say average", "Drill 3, building a heap: heapify is O(n), not O(n log n). Half the nodes are leaves and never move, a quarter sink at most one level, and so on, and that sum is linear. n separate pushes cost O(n log n). Measured: 99,990 swaps for 100,000 items", "Amortised means the cost per operation averaged over a long run of them, with no randomness. A list append is O(1) amortised: the array doubles now and then, a copy of n, spread over the n appends that earned it", "Ladder to keep in your head: O(1) hash lookup, O(log n) binary search or a heap push, O(n) scan or heapify, O(n log n) sort, O(n²) nested loop, O(2^n) subsets, O(n!) permutations", "Do not let the right-looking symbol do the work. n! is about (n/e)^n, so your first guess of O(n^n) was close in size; the habit that gets you the answer is counting rounds"], "where": "Python docs: time complexity of built-in types (set and dict: O(1) average, O(n) worst)", "url": "https://docs.python.org/3/library/time-complexity.html", "ans": {"lead": "I'd count the rounds, then the work in each round, and say whether I mean best, expected or worst case.", "pts": ["Bogosort: a shuffle is sorted with probability one over n factorial, so about n factorial shuffles, and each round is O(n) to shuffle and check. Expected O(n times n factorial), best O(n), and no worst-case bound.", "A nested loop with a hash lookup: n times n rounds of a lookup that is O(1) on average, so O(n squared). In the worst case the lookup degrades, so I'd say average out loud.", "Building a heap: O(n), not O(n log n). Most nodes are near the bottom and barely move, so the sift-down costs add up to a linear total. n separate pushes would be O(n log n).", "If I'm unsure of a bound, I say the count I would make, rounds times work per round, and work it out from there."], "close": "So I'd rather say 'let me count the rounds' than guess a symbol, because the count is the answer."}, "sdLinks": [], "read": [{"label": "Python docs: time complexity of built-in types, the set and dict rows", "url": "https://docs.python.org/3/library/time-complexity.html", "m": 4}, {"label": "Python docs: heapq, heapify in linear time", "url": "https://docs.python.org/3/library/heapq.html", "m": 3}, {"label": "Coding page: the complexity cheat sheet", "url": "CODING.html#bigo", "m": 5}, {"label": "Coding page: heaps and top k", "url": "CODING.html#heap", "m": 8}], "figs": [], "sheet": {"cheat": ["Method: count the rounds, then the work in one round, then multiply. Say best, expected or worst.", "Bogosort: n! rounds expected, each O(n) to shuffle and check. Expected O(n · n!), best O(n), worst unbounded.", "Hash lookup: O(1) on average, O(n) worst case. A nested loop around it is O(n²) on average.", "Heapify is O(n). n pushes are O(n log n). Most nodes are near the bottom and barely move.", "Amortised: the average per operation over a long run, no randomness. Append is O(1) amortised.", "n! is about (n/e)^n: factorial grows like n to the n, never like n squared.", "Unsure? Say the count you would make. That is the answer they are listening for."], "terms": [{"t": "Expected case", "mem": "Averaged over the dice.", "d": "The average running time over the algorithm's own random choices, for a fixed input."}, {"t": "Worst case", "mem": "The longest it can ever run.", "d": "The maximum time over all inputs of a size n; for a randomised algorithm it may be unbounded."}, {"t": "Amortised", "mem": "Cheap on average over a run.", "d": "The total cost of a sequence of operations divided by their number; an occasional costly step is paid for by the cheap ones."}, {"t": "Heapify", "mem": "Build the heap bottom-up.", "d": "Turning an array into a heap by sinking each parent from the last one back to the root; O(n) in total."}, {"t": "Factorial growth", "mem": "n! outruns every power of n.", "d": "n! = 1 × 2 × ... × n, about (n/e)^n; the number of orderings of n items."}], "vis": [{"rule": "Count the rounds, then the work in a round, then multiply. Say best, expected or worst."}, {"title": "Bogosort, counted", "code": "import random\n\ndef bogosort(a):\n    # Returns how many shuffles it took to land on a sorted order.\n    shuffles = 0\n    while any(a[i] > a[i + 1] for i in range(len(a) - 1)):  # O(n) check each round\n        random.shuffle(a)                                   # O(n) shuffle each round\n        shuffles += 1\n    return shuffles", "pins": [[6, "one round = a check (n) plus a shuffle (n): O(n) per round"], [8, "rounds: a shuffle is sorted with chance 1/n!, so about n! rounds"]]}, {"title": "Three drills", "calc": [["bogosort: n! rounds × O(n) a round", "expected O(n · n!), best O(n)"], ["n × n rounds × O(1) lookup", "O(n²) on average"], ["heapify: half the nodes move 0, a quarter 1, ...", "O(n); n pushes are O(n log n)"], ["measured: 5 items, 2000 runs", "about 121 shuffles; 5! = 120"], ["measured: heap of 100,000", "99,990 swaps"]]}, {"title": "Building a heap, bottom-up", "code": "def sift_down(a, i, n):\n    # Moves a[i] down until both children are no smaller. Returns the swaps used.\n    swaps = 0\n    while True:\n        small, l, r = i, 2 * i + 1, 2 * i + 2\n        if l < n and a[l] < a[small]: small = l\n        if r < n and a[r] < a[small]: small = r\n        if small == i: return swaps\n        a[i], a[small] = a[small], a[i]\n        i, swaps = small, swaps + 1\n\ndef build_heap(a):\n    n, swaps = len(a), 0\n    for i in range(n // 2 - 1, -1, -1):   # leaves (half the nodes) are skipped\n        swaps += sift_down(a, i, n)\n    return swaps", "pins": [[12, "build bottom-up: n/2 leaves are already heaps"], [14, "start at the last parent and walk back to the root"], [15, "a node at height h sinks at most h: the sum is O(n), not O(n log n)"]]}, {"title": "A ladder of common costs", "ladder": [["O(1)", "hash lookup", "average case"], ["O(log n)", "binary search, heap push", "halve or climb a tree"], ["O(n)", "scan, heapify", "touch each once"], ["O(n log n)", "a good sort", "n rounds of log n"], ["O(n²)", "nested loops", "n rounds of n"], ["O(2^n)", "all subsets", "two choices each"], ["O(n!)", "all orderings", "bogosort rounds"]]}]}}, {"t": "Hashing and dedupe: sets, keys, and a million IDs", "m": 20, "out": "How would you check a million user IDs against a seen list under tight memory and latency limits, and how would you deduplicate records by a composite key?", "d": "A set or dict finds a key in O(1) on average because it hashes the key to a slot. That makes dedupe one pass. Two things decide whether it is right: what you treat as the same record (the key, after normalising) and what you can afford to hold in memory (an exact set, or a Bloom filter that trades a small error for a tiny footprint). The reports list both as Mercor questions, and the onsite is said to have data-structure parts like them.", "pts": ["Dedupe by composite key: build the key from the fields that define 'same' as a tuple (a tuple is hashable, a list is not), keep a set of keys seen, keep the record the first time. One pass, O(n) average, order preserved", "Normalise before you hash: strip spaces, lower-case, apply Unicode normalisation, treat 123 and '123' as one or the other on purpose. Most dedupe bugs are two spellings of one thing", "State the policy: first wins, latest wins, or merge the fields. It decides whether you overwrite or skip, and an interviewer will ask", "A million IDs in an exact Python set cost about 60 MB measured (the table plus an object for each int). Fine on a server; not fine in a phone, a worker with a hard cap, or a hundred such sets", "Bloom filter: k hashes set k bits per ID in a bit array. A lookup that finds any 0 bit is a sure no; all 1s is a probable yes. For 1M IDs at a 1% false-positive rate it needs about 9.6 bits an ID: 1.2 MB, 7 hashes. Measured at 100K IDs: no false negatives, 1.0% false positives", "The trade: no false negatives, some false positives, no delete, no listing, and the size is fixed by the count you plan for. For a 'probably seen' skip it is ideal; where a wrong yes does harm, confirm a yes against the real store", "Latency: a set lookup is in-process and microseconds; a database round trip is milliseconds. A Bloom filter in front of the database turns most 'new ID' checks into zero round trips. Batch the rest", "If the data will not fit even as a filter or you need exact answers: split the IDs into buckets by hash(id) % B, write each bucket to disk, and dedupe one bucket at a time, since equal IDs always land in the same bucket", "A hash table is O(1) on average, O(n) worst case: with attacker-chosen keys many can collide. Python randomises string hashing per process for that reason"], "where": "Redis docs: Bloom filter (the false-positive guarantee, bits an item at each error rate, against a set)", "url": "https://redis.io/docs/latest/develop/data-types/probabilistic/bloom-filter/", "ans": {"lead": "I'd dedupe in one pass with a set of normalised composite keys, and for a million IDs I'd ask whether a small error is acceptable before choosing between an exact set and a Bloom filter.", "pts": ["Composite key: a tuple of the fields that define 'same', normalised first, so spacing and case don't make two keys. Keep a set of keys seen, keep the first record, one pass.", "A million IDs in a Python set is about 60 MB, which is fine unless memory is the limit. If it is, I'd ask whether a wrong 'yes' is acceptable.", "If it is, a Bloom filter: about 10 bits an ID, so 1.2 MB for a million at a 1% false-positive rate. It never misses an ID it has seen; it sometimes says 'seen' for a new one, and I can confirm those against the database.", "If I need exact answers and the data won't fit, I'd split by hash into buckets on disk and dedupe each bucket on its own."], "close": "So I'd pick the exact set by default and move to a Bloom filter only when memory or latency forces it."}, "sdLinks": [], "read": [{"label": "Redis docs: Bloom filter, the guarantee and bits an item at each error rate", "url": "https://redis.io/docs/latest/develop/data-types/probabilistic/bloom-filter/", "m": 8}, {"label": "Coding page: arrays and hashing", "url": "CODING.html#hashing", "m": 10}], "figs": [], "sheet": {"cheat": ["Dedupe: key = tuple of the fields that define 'same', normalised. Set of keys seen. One pass, O(n) average.", "Normalise first: strip, lower-case, one Unicode form, one type. Most bugs are two spellings of one thing.", "Say the policy: first wins, latest wins, or merge.", "A million IDs in a Python set: about 60 MB. In a Bloom filter at 1%: about 1.2 MB.", "Bloom filter: no false negatives, some false positives, no delete, size fixed in advance.", "Bits an item: -ln(p) / (ln 2)^2, about 9.6 at 1% and 14.4 at 0.1%. Hashes: about 7 at 1%.", "Need exact and too big: bucket by hash(id) % B, dedupe one bucket at a time."], "terms": [{"t": "Composite key", "mem": "Several fields as one identity.", "d": "A tuple of the fields that together decide two records are the same."}, {"t": "Normalise", "mem": "Make equal things look equal.", "d": "Strip, case-fold and canonicalise a value before hashing, so two spellings give one key."}, {"t": "Bloom filter", "mem": "Sure no, probable yes.", "d": "A bit array and k hash functions; a lookup finding any 0 bit is a definite no, all 1s means probably present."}, {"t": "False positive", "mem": "Said yes, was wrong.", "d": "A Bloom filter claiming an item is present when it was never added; the rate is chosen when it is sized."}, {"t": "Hash collision", "mem": "Two keys, one slot.", "d": "Different keys landing in the same slot; many collisions turn an O(1) lookup into O(n)."}], "vis": [{"rule": "Normalise the key, then one pass with a set. Pick exact or Bloom by what a wrong yes costs."}, {"title": "Dedupe by a composite key", "code": "def key_of(rec):\n    # The composite key: what makes two records \"the same\". Normalise first.\n    return (rec[\"email\"].strip().lower(), rec[\"company\"].strip().lower())\n\ndef dedupe(records):\n    seen = set()\n    out = []\n    for rec in records:                # one pass, O(n) average\n        k = key_of(rec)\n        if k not in seen:              # O(1) average lookup\n            seen.add(k)\n            out.append(rec)            # first one wins; keeps input order\n    return out", "pins": [[3, "normalise first: ' A@x.com' and 'a@x.com' must be one key"], [3, "a tuple is hashable; a list is not"], [10, "O(1) on average; the whole pass is O(n)"], [12, "first record wins; say so, or say 'latest wins' and overwrite"]]}, {"title": "A million IDs, two ways", "calc": [["exact set, 1M ints (measured)", "≈ 62 MB"], ["Bloom filter, 1M ids × 9.6 bits, 1% error", "≈ 1.2 MB, 7 hashes"], ["Bloom at 100K ids (measured)", "0 false negatives, 1.0% false positives"], ["at 0.1% error", "14.4 bits an id, 10 hashes"]]}, {"title": "A Bloom filter, small", "code": "class Bloom:\n    def __init__(self, n, p):\n        self.m = math.ceil(-n * math.log(p) / math.log(2) ** 2)   # bits\n        self.k = round(self.m / n * math.log(2))                  # hashes\n        self.bits = bytearray(self.m // 8 + 1)\n\n    def _spots(self, item):\n        h = hashlib.sha256(str(item).encode()).digest()\n        a = int.from_bytes(h[:8], \"big\")\n        b = int.from_bytes(h[8:16], \"big\") | 1\n        return [(a + i * b) % self.m for i in range(self.k)]      # k spots from 2 hashes\n\n    def add(self, item):\n        for s in self._spots(item):\n            self.bits[s // 8] |= 1 << (s % 8)\n\n    def might_contain(self, item):\n        return all(self.bits[s // 8] >> (s % 8) & 1 for s in self._spots(item))", "pins": [[3, "bits needed: n x -ln(p) / (ln 2)^2, about 9.6 bits an id at 1%"], [4, "hashes: about 7 at 1%"], [7, "k positions from two hashes"], [15, "add: set k bits. There is no delete"], [17, "any bit 0: definitely new. All 1: probably seen"]]}, {"title": "Exact set or Bloom filter", "vs": {"cols": ["Exact set", "Bloom filter"], "rows": [["Memory", "about 62 MB per million", "about 1.2 MB per million"], ["A wrong answer", "never", "a yes can be wrong"], ["A wrong no", "never", "never"], ["Delete", "yes", "no"], ["Pick it when", "memory is fine, or a wrong yes does harm", "memory or latency is tight and a yes can be confirmed"]]}}]}}, {"t": "Graph search through a restricted API, and cars to spots", "m": 30, "out": "You can only see a friend network through a call that costs money. How do you explore it with as few calls as possible, and how do you assign cars to their preferred spots?", "d": "Both reported Mercor problems are graph search with a rule about cost. Breadth-first search (BFS) visits people in rings: you, your friends, their friends. A visited set stops it going in circles, and when each call is expensive, the visited set and a cache are what save calls. The cars problem is a search over choices: try a spot, go deeper, undo on a dead end (backtracking), and prune early. The original prompts are not public; the versions below are my own statement of each, shaped by one candidate's report.", "pts": ["My statement of problem 1: the only way to learn the network is friends(user), one call each. From a start user, find whether a target is reachable and the shortest chain, using as few calls as you can", "BFS with a queue and a visited set (a dict that also remembers who found each person, so you can rebuild the path). It makes at most one call per person reached, so calls are at most the people you expand, and time is O(V + E)", "Fewest calls: cache every answer so no one is asked twice; stop the moment the target is seen when you add it to the queue, not when you pop it; give a depth limit if the question has one; if the API has a batch call, send a whole ring in one request", "BFS, not DFS, because BFS finds the shortest chain first and can stop at the first hit. DFS dives down one long path and spends calls on people far from the start", "Say the unknowns: are friendships mutual, how many friends per person, are calls rate-limited, can they run in parallel? If calls can run in parallel, fetch a whole ring at once and the queue becomes a batch", "My statement of problem 2: each of n cars lists the spots it would accept, and a spot holds one car. Can every car get a spot of its own, and what is one such assignment? The report says the easy part asked only whether all cars can park, with a DFS or backtracking follow-up", "Backtracking: pick a car, try each of its free spots, go to the next car, and undo the choice if it leads nowhere. Worst case is exponential", "Pruning is the answer to the follow-up: take the most constrained car first (fewest spots), and after each choice stop at once if any later car has every spot taken. Say what you would tell the interviewer: it still can be exponential, but dead branches die early", "The better answer, if asked: this is bipartite matching (cars on one side, spots on the other), solved by augmenting paths in O(V · E). Backtracking is what you write in 20 minutes; matching is what you name afterwards"], "where": "PracHub: a candidate's report of the Mercor ML onsite (the friend network and the cars and spots problems)", "url": "https://prachub.com/interview-experiences/mercor-machine-learning-engineer-interview-experience-three-onsite-rounds-kicked-out-of-the-meeting-room-mid-interview", "ans": {"lead": "I'd use breadth-first search with a visited set, cache every call, and stop the moment the target is seen. For the cars I'd backtrack, most constrained car first, and prune early.", "pts": ["Network: BFS from the start user with a queue and a visited set. Each person is expanded once, so calls are at most the people I expand, not the number of friendships.", "Fewer calls: a cache so I never ask for the same person twice, stop when I see the target as I add it, a depth limit, and batching a whole ring if the API allows. I'd ask whether calls can run in parallel.", "Why BFS: it finds the shortest chain, so it can stop at the first hit. DFS would spend calls going deep along one path.", "Cars: put the car with the fewest acceptable spots first, try each free spot, recurse, and undo on a dead end. After each choice, if a later car has every spot taken, I stop that branch at once.", "Cost: backtracking is exponential in the worst case. If I had more time I'd name it as bipartite matching with augmenting paths, which is polynomial."], "close": "So the search is the easy part; the answer is the cost rule: never ask twice, stop early, and cut dead branches."}, "sdLinks": [], "read": [{"label": "PracHub: a candidate's report of the Mercor ML onsite, the friend network and cars and spots", "url": "https://prachub.com/interview-experiences/mercor-machine-learning-engineer-interview-experience-three-onsite-rounds-kicked-out-of-the-meeting-room-mid-interview", "m": 5}, {"label": "Coding page: graphs, BFS and DFS", "url": "CODING.html#graphs", "m": 10}, {"label": "Coding page: backtracking", "url": "CODING.html#backtrack", "m": 10}], "figs": [], "sheet": {"cheat": ["Problem 1 (my statement): friends(user) costs a call. Find a target and the shortest chain with the fewest calls.", "BFS: queue plus visited dict (also remembers the parent for the path). Calls are at most the people you expand.", "Save calls: cache every answer, stop when the target is seen on adding, depth limit, batch a ring.", "BFS over DFS: shortest chain first, and it can stop at the first hit.", "Problem 2 (my statement): n cars each list acceptable spots; give every car its own spot.", "Backtracking: choose a spot, recurse, undo. Worst case exponential.", "Prune: most constrained car first, and cut a branch when a later car has no free spot.", "Name it after: bipartite matching, augmenting paths, O(V · E)."], "terms": [{"t": "BFS", "mem": "Ring by ring.", "d": "Breadth-first search: visit all nodes at distance 1, then 2, and so on, with a queue; finds shortest paths in an unweighted graph."}, {"t": "Visited set", "mem": "Never go twice.", "d": "The nodes already reached, kept so a cycle cannot loop and no one is fetched twice."}, {"t": "Backtracking", "mem": "Choose, explore, undo.", "d": "A depth-first search over choices that undoes the last choice when a branch fails."}, {"t": "Pruning", "mem": "Cut a dead branch early.", "d": "Stopping a branch as soon as it cannot lead to a solution, before exploring its subtree."}, {"t": "Bipartite matching", "mem": "Pair two sides one to one.", "d": "Pairing items of one set (cars) with items of another (spots) through allowed links, no item used twice."}], "vis": [{"rule": "Never ask twice, stop when you see the target, and cut a dead branch the moment you can."}, {"title": "Explore the network with few calls", "flow": ["pop a user", "friends(u), cached", "skip anyone seen", "target? stop now", "queue the rest"], "note": "The visited dict also keeps who found each person, so the path comes back by walking parents."}, {"title": "BFS through a call budget", "code": "def find_path(api, start, target, max_depth=6):\n    if start == target:\n        return [start]\n    cache = {}                                   # a person is never fetched twice\n    def friends_of(u):\n        if u not in cache:\n            cache[u] = api.friends(u)\n        return cache[u]\n\n    parent = {start: None}                       # doubles as the visited set\n    queue = deque([(start, 0)])\n    while queue:\n        user, depth = queue.popleft()\n        if depth == max_depth:                   # do not expand past the limit\n            continue\n        for f in friends_of(user):\n            if f in parent:\n                continue\n            parent[f] = user\n            if f == target:                      # stop when SEEN, not when popped\n                path = [f]\n                while parent[path[-1]] is not None:\n                    path.append(parent[path[-1]])\n                return path[::-1]\n            queue.append((f, depth + 1))\n    return None", "pins": [[4, "never ask for the same person twice"], [10, "visited set and the way back to the path"], [14, "do not pay for a layer you will not use"], [17, "skip people already seen"], [20, "stop when seen, not when popped: it saves a call"]]}, {"title": "Cars and preferred spots, backtracking with pruning", "code": "def assign(prefs):\n    # prefs[i] = the spots car i would accept. Give every car its own spot.\n    order = sorted(range(len(prefs)), key=lambda i: len(prefs[i]))  # fewest options first\n    taken = {}                                    # spot -> car\n\n    def place(k):\n        if k == len(order):\n            return True                           # every car has a spot\n        car = order[k]\n        for spot in prefs[car]:\n            if spot in taken:\n                continue\n            taken[spot] = car\n            if no_car_stranded(k + 1) and place(k + 1):   # prune before going deeper\n                return True\n            del taken[spot]                       # undo, try the next spot\n        return False\n\n    def no_car_stranded(k):\n        # A later car whose spots are all taken can never be placed: stop now.\n        for car in order[k:]:\n            if all(s in taken for s in prefs[car]):\n                return False\n        return True\n\n    if place(0):\n        return {car: spot for spot, car in taken.items()}\n    return None", "pins": [[3, "most constrained car first: it fails fast"], [13, "choose"], [14, "prune: a later car with no free spot kills this branch now"], [16, "undo, then try the next spot"]]}, {"title": "Ways to save a call", "calc": [["cache every answer", "no person asked twice"], ["stop when seen, not when popped", "one fewer expansion"], ["depth limit", "no unused ring"], ["batch a ring, if the API allows", "one request a ring"]]}]}}, {"t": "The cache race again, and the refund that can run twice", "m": 20, "out": "An async refund function times out and the caller retries. Why can the customer be refunded twice, and how do you make it safe?", "d": "Both of these are reported as Mercor questions. The cache race and its fixes are the wc32 and wc33 sessions; read their cheat sheets as a light review before this step. The new drill is the same shape as the cache race: a check and an act with a gap between them, plus a failure in the middle. A retry is a second caller. The fix is an idempotency key: the caller picks one key per intended refund, the server stores the first result under it, and every retry gets that stored result back. Listed on PracHub as Mercor questions; the report could not confirm they were asked at the onsite.", "pts": ["Light review first: wc32 (the cache code review, double-checked locking and single-flight) and wc33 (stale data, stampedes, failure). The refund below is single-flight with a stored result", "The failure: the refund call reaches the payment provider and succeeds, then the reply is lost. The caller sees a timeout, retries, and refunds again. Run it: the naive version refunded 500 twice", "Idempotent means doing it twice has the effect of doing it once. A refund is not idempotent by nature; you make it so with a key", "The key is made once per intended refund (by the client or from the refund request), and reused on every retry. A fresh key per attempt defeats it", "Store the result under the key. On a retry, return the stored result, do not call the provider again. If the first attempt is still running, wait on it; here the stored value is the Task, so everyone awaits one result", "Store it before the first await. In asyncio nothing else runs between two lines with no await, so claiming the key first removes the gap that the check-then-act race needs", "Same key, different request (another amount): refuse it. Do not guess which one was meant", "Pass the key to the provider as well. If our process dies between the provider's success and our store, only the provider can still recognise the retry. Stripe's idempotency keys work this way: the first response is saved and returned to every retry", "Do not store a failure as the answer. If the attempt gave up, remove the key so a later retry can try again. Retry with backoff and a timeout; and keep keys long enough for the longest retry window, then expire them"], "where": "Stripe API docs: idempotent requests (the key, the saved response, the check on changed parameters)", "url": "https://docs.stripe.com/api/idempotent_requests", "ans": {"lead": "The reply can be lost after the refund went through, so a retry refunds again. I'd make it idempotent with a key and a stored result.", "pts": ["The failure: the payment provider does the refund, the reply is lost, the caller times out and retries, and the customer gets two refunds.", "The fix: one idempotency key per intended refund, kept the same on every retry. The first call stores its result under the key. A retry gets that result back and the provider is not called again.", "The race: if the retry arrives while the first is still running, I'd store the in-flight Task under the key before the first await, so the second caller waits on the same Task. It's the same single-flight idea as the cache.", "Details: pass the key to the provider too, since I might crash after it succeeded. Reject a reused key with a different amount. Don't store a failure as the answer. Expire keys after the longest retry window."], "close": "So a retry becomes safe to send, which is what I want when the network can drop any reply."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/multi-step/idempotency", "label": "Technique: Idempotency keys", "why": "The refund key is this technique: a client-chosen key, a stored first result, retries get it back."}], "read": [{"label": "Light review: wc32, the cache code review out loud", "url": "index.html#/w/wc32", "m": 10}, {"label": "Light review: wc33, stale data, stampedes and failure", "url": "index.html#/w/wc33", "m": 10}, {"label": "Stripe API docs: idempotent requests", "url": "https://docs.stripe.com/api/idempotent_requests", "m": 5}, {"label": "Python docs: asyncio tasks, awaiting one Task from many callers", "url": "https://docs.python.org/3/library/asyncio-task.html", "m": 6}], "figs": [], "sheet": {"cheat": ["Light review: wc32 (lock the miss, single-flight) and wc33 (stale data, stampedes, failure).", "The failure: the provider refunds, the reply is lost, the caller retries, the customer is refunded twice.", "Idempotent: doing it twice has the effect of doing it once. Make it so with a key.", "One key per intended refund, the same on every retry. A new key per attempt defeats it.", "Store the Task under the key before the first await; a retry returns the same Task.", "Same key with a different amount: refuse it.", "Send the key to the provider too: a crash after its success is still safe.", "Do not store a failure as the answer. Expire keys after the longest retry window."], "terms": [{"t": "Idempotent", "mem": "Twice is the same as once.", "d": "An operation whose repeat has no further effect beyond the first."}, {"t": "Idempotency key", "mem": "A name for one intended action.", "d": "A client-chosen token sent with every attempt of one action so the server can recognise a retry."}, {"t": "At-least-once", "mem": "Retry until it works.", "d": "Delivery that may repeat a request; the receiver must tolerate duplicates."}, {"t": "Lost reply", "mem": "It worked, nobody heard.", "d": "A success whose response never reaches the caller, so the caller cannot tell success from failure."}, {"t": "Single-flight", "mem": "One in the air per key.", "d": "Callers with the same key share the result of one running operation."}], "vis": [{"rule": "A retry is a second caller. Give each intended refund one key, and store its result before anything can race."}, {"title": "How the customer is refunded twice", "lanes": [["Caller", [["refund(o1, 500)", "plain"], ["timeout", "hot", "2"], ["retry", "plain"], ["ok", "plain"]]], ["Provider", [["", "gap", "1", "40px"], ["refund done", "done"], ["reply lost", "hot"], ["refund again", "hot", "2"]]]], "note": "Without a key, the provider cannot tell the retry from a new refund."}, {"title": "The idempotent version", "code": "stored = {}                                       # idempotency key -> (Task, the request)\n\nasync def refund_once(p, key, order, cents):\n    if key in stored:                             # a retry or a duplicate request\n        task, req = stored[key]\n        if req != (order, cents):\n            raise ValueError(\"key reused with different input\")\n        return await task                         # same Task, same result\n\n    async def attempt():\n        for _ in range(2):\n            try:\n                return await p.refund(order, cents, key)   # the key goes to the provider too\n            except TimeoutError:\n                pass\n        del stored[key]                           # a failure is not remembered as the answer\n        raise TimeoutError(\"gave up\")\n\n    task = asyncio.ensure_future(attempt())\n    stored[key] = (task, (order, cents))          # stored before any await: no gap to race in\n    return await task", "pins": [[4, "a retry or a duplicate: do not run it again"], [7, "same key, different request: refuse, do not guess"], [8, "everyone shares one Task, so one result"], [13, "the key goes to the provider too: a lost reply is safe"], [16, "do not store a failure as the answer"], [20, "stored before any await: nothing can slip in"]]}, {"title": "What each part protects against", "vs": {"cols": ["Duplicate retry", "Retry while running", "Crash after success", "Wrong amount"], "rows": [["Stored result under the key", "yes", "no", "no", "no"], ["Task stored before the first await", "yes", "yes", "no", "no"], ["Key sent to the provider", "yes", "yes", "yes", "no"], ["Request compared with the stored one", "no", "no", "no", "yes"]]}}]}}], "study": [], "quiz": [{"q": "In your own words: Say a cost precisely: rounds times work per round.", "a": "I'd count the rounds, then the work in each round, and say whether I mean best, expected or worst case. Bogosort: a shuffle is sorted with probability one over n factorial, so about n factorial shuffles, and each round is O(n) to shuffle and check. Expected O(n times n factorial), best O(n), and no worst-case bound. A nested loop with a hash lookup: n times n rounds of a lookup that is O(1) on average, so O(n squared). In the worst case the lookup degrades, so I'd say average out loud. Building a heap: O(n), not O(n log n). Most nodes are near the bottom and barely move, so the sift-down costs add up to a linear total. n separate pushes would be O(n log n). If I'm unsure of a bound, I say the count I would make, rounds times work per round, and work it out from there. So I'd rather say 'let me count the rounds' than guess a symbol, because the count is the answer."}, {"q": "In your own words: Hashing and dedupe: sets, keys, and a million IDs.", "a": "I'd dedupe in one pass with a set of normalised composite keys, and for a million IDs I'd ask whether a small error is acceptable before choosing between an exact set and a Bloom filter. Composite key: a tuple of the fields that define 'same', normalised first, so spacing and case don't make two keys. Keep a set of keys seen, keep the first record, one pass. A million IDs in a Python set is about 60 MB, which is fine unless memory is the limit. If it is, I'd ask whether a wrong 'yes' is acceptable. If it is, a Bloom filter: about 10 bits an ID, so 1.2 MB for a million at a 1% false-positive rate. It never misses an ID it has seen; it sometimes says 'seen' for a new one, and I can confirm those against the database. If I need exact answers and the data won't fit, I'd split by hash into buckets on disk and dedupe each bucket on its own. So I'd pick the exact set by default and move to a Bloom filter only when memory or latency forces it."}, {"q": "In your own words: Graph search through a restricted API, and cars to spots.", "a": "I'd use breadth-first search with a visited set, cache every call, and stop the moment the target is seen. For the cars I'd backtrack, most constrained car first, and prune early. Network: BFS from the start user with a queue and a visited set. Each person is expanded once, so calls are at most the people I expand, not the number of friendships. Fewer calls: a cache so I never ask for the same person twice, stop when I see the target as I add it, a depth limit, and batching a whole ring if the API allows. I'd ask whether calls can run in parallel. Why BFS: it finds the shortest chain, so it can stop at the first hit. DFS would spend calls going deep along one path. Cars: put the car with the fewest acceptable spots first, try each free spot, recurse, and undo on a dead end. After each choice, if a later car has every spot taken, I stop that branch at once. Cost: backtracking is exponential in the worst case. If I had more time I'd name it as bipartite matching with augmenting paths, which is polynomial. So the search is the easy part; the answer is the cost rule: never ask twice, stop early, and cut dead branches."}, {"q": "In your own words: The cache race again, and the refund that can run twice.", "a": "The reply can be lost after the refund went through, so a retry refunds again. I'd make it idempotent with a key and a stored result. The failure: the payment provider does the refund, the reply is lost, the caller times out and retries, and the customer gets two refunds. The fix: one idempotency key per intended refund, kept the same on every retry. The first call stores its result under the key. A retry gets that result back and the provider is not called again. The race: if the retry arrives while the first is still running, I'd store the in-flight Task under the key before the first await, so the second caller waits on the same Task. It's the same single-flight idea as the cache. Details: pass the key to the provider too, since I might crash after it succeeded. Reject a reused key with a different amount. Don't store a failure as the answer. Expire keys after the longest retry window. So a retry becomes safe to send, which is what I want when the network can drop any reply."}], "hasTrackerQuiz": false, "figs": [], "nlm": ["https://docs.python.org/3/library/time-complexity.html", "https://docs.python.org/3/library/heapq.html", "https://redis.io/docs/latest/develop/data-types/probabilistic/bloom-filter/", "https://prachub.com/interview-experiences/mercor-machine-learning-engineer-interview-experience-three-onsite-rounds-kicked-out-of-the-meeting-room-mid-interview", "https://docs.stripe.com/api/idempotent_requests", "https://docs.python.org/3/library/asyncio-task.html", "https://research.google/pubs/the-tail-at-scale/", "https://www.youtube.com/watch?v=43TDfUNsM3E", "https://www.youtube.com/watch?v=mAyW-4LeXZo", "https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/", "https://brooker.co.za/blog/2015/03/21/backoff.html", "https://www.youtube.com/watch?v=WjEmM1Jy79M", "https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/", "https://stripe.com/blog/idempotency", "https://www.youtube.com/watch?v=XAccGbtl3Z8", "https://www.youtube.com/watch?v=5_DyX3PnKxg", "https://www.conduktor.io/glossary/dead-letter-queues-for-error-handling", "https://www.youtube.com/watch?v=xAYthoT7Sk0", "https://sre.google/sre-book/addressing-cascading-failures/", "https://go.auditboard.com/rs/961-ZQV-184/images/AB-AR-Best-Practices-Effective-SOX-Testing.pdf", "https://skillselion.com/skills/anthropics/knowledge-work-plugins/audit-support", "https://umbrex.com/resources/governance-risk-and-compliance-system-playbook/internal-controls-and-sox-compliance/", "https://www.youtube.com/watch?v=FtsXl3AaMJ4", "https://www.youtube.com/watch?v=O1Mrpt6H_jg", "https://linfordco.com/blog/design-vs-operating-effectiveness/", "https://www.youtube.com/watch?v=ROCY7kCD_rk", "https://www.ispartnersllc.com/blog/five-types-testing-methods-used-audits/", "https://www.youtube.com/watch?v=1KAo8Y-k-jY", "https://www.youtube.com/watch?v=Xs5sO2o980w", "https://schneiderdowns.com/our-thoughts-on/ipe-understanding-information-produced-by-entity/", "https://www.youtube.com/watch?v=S9TWP1P9YIg", "https://pcaobus.org/oversight/standards/auditing-standards/details/AS2315", "https://www.youtube.com/watch?v=sRczLv3zvWM", "https://www.youtube.com/watch?v=fMxFCTZClLU", "https://trullion.com/blog/audit-workpapers/", "https://www.auditdashboard.com/post/what-is-a-pbc-request-list-or-pbc-list", "https://www.youtube.com/watch?v=0B8dxqwuC2c", "https://www.youtube.com/watch?v=ZVl57fUYcbE", "https://pcaobus.org/oversight/standards/auditing-standards/details/AS2201", "https://pathlock.com/learn/what-is-a-material-weakness/", "https://www.youtube.com/watch?v=79yCmgMA3mw", "https://www.youtube.com/watch?v=lAFc-Db9VT0", "https://www.sailpoint.com/identity-library/it-general-controls", "https://www.youtube.com/watch?v=bafb1IyUKUU", "https://docs.claude.com/en/docs/build-with-claude/citations", "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", "https://aiengineeringfromscratch.com/lesson?path=phases%2F13-tools-and-protocols%2F04-structured-output", "https://www.youtube.com/watch?v=piCAuOk5Jvk", "https://www.anthropic.com/engineering/building-effective-agents", "https://aiengineeringfromscratch.com/lesson?path=phases%2F14-agent-engineering%2F12-anthropic-workflow-patterns", "https://www.youtube.com/watch?v=Qd6anWv0mv0", "https://www.youtube.com/watch?v=D7_ipDqhtwk", "https://aiengineeringfromscratch.com/lesson?path=phases%2F05-nlp-foundations-to-advanced%2F20-structured-outputs-constrained-decoding", "https://aiengineeringfromscratch.com/lesson?path=phases%2F14-agent-engineering%2F26-failure-modes-agentic", "https://aiengineeringfromscratch.com/lesson?path=phases%2F14-agent-engineering%2F33-instructions-as-executable-constraints", "https://martinfowler.com/eaaDev/EventSourcing.html", "https://aiengineeringfromscratch.com/lesson?path=phases%2F14-agent-engineering%2F24-agent-observability-platforms", "https://www.youtube.com/watch?v=yFjzGRb8NOk", "https://www.youtube.com/watch?v=ck7t592bvBg", "https://hamel.dev/blog/posts/evals/", "https://aiengineeringfromscratch.com/lesson?path=phases%2F14-agent-engineering%2F30-eval-driven-agent-development", "https://www.youtube.com/watch?v=e2i6JbU2R-s", "https://www.youtube.com/watch?v=GL0XhAj5LPE", "https://www.youtube.com/watch?v=bI8Ry6GhMSE", "https://www.youtube.com/watch?v=mBUCF1WGI_I", "https://www.postgresql.org/docs/current/warm-standby.html", "https://www.allthingsdistributed.com/2008/12/eventually_consistent.html", "https://www.youtube.com/watch?v=uNxl3BFcKSA", "https://www.youtube.com/watch?v=DAONthD50g0", "https://www.allthingsdistributed.com/2007/10/amazons_dynamo.html", "https://martin.kleppmann.com/2015/05/11/please-stop-calling-databases-cp-or-ap.html", "https://jepsen.io/consistency/models/linearizable", "https://www.youtube.com/watch?v=VdrEq0cODu4", "https://www.youtube.com/watch?v=noUNH3jDLC0", "https://raft.github.io/", "https://www.hellointerview.com/learn/system-design/deep-dives/cap-theorem", "https://www.youtube.com/watch?v=LdH-AJ6Rm1A", "https://www.youtube.com/watch?v=GAe5oB742dw", "https://www.youtube.com/watch?v=5ZjhNTM8XU8", "https://www.postgresql.org/docs/current/transaction-iso.html", "https://www.youtube.com/watch?v=Tgpa9TrxsfU", "https://www.youtube.com/watch?v=eym48yrObhY", "https://www.postgresql.org/docs/current/indexes-multicolumn.html", "https://www.youtube.com/watch?v=Q9xD4J3tezw", "https://www.youtube.com/watch?v=fW-y-r7CgNI", "https://use-the-index-luke.com/sql/where-clause/the-equals-operator/concatenated-keys", "https://www.postgresql.org/docs/current/sql-insert.html", "https://www.postgresql.org/docs/current/explicit-locking.html", "https://www.postgresql.org/docs/current/indexes-index-only-scans.html", "https://www.youtube.com/watch?v=4TAKYRzm_dA", "https://grpc.io/docs/what-is-grpc/introduction/", "https://www.youtube.com/watch?v=gnchfOojMk4", "https://www.youtube.com/watch?v=WpXs7e7kEoI", "https://sre.google/sre-book/load-balancing-datacenter/", "https://grpc.io/blog/grpc-load-balancing/", "https://www.youtube.com/watch?v=dBmxNsS3BGE", "https://www.youtube.com/watch?v=aKMLgFVxZYk", "https://aws.amazon.com/route53/what-is-dns/", "https://aws.amazon.com/what-is/cdn/", "https://www.youtube.com/watch?v=27r4Bzuj5NQ", "https://www.youtube.com/watch?v=RI9np1LWzqw", "https://stripe.com/blog/rate-limiters", "https://blog.cloudflare.com/counting-things-a-lot-of-different-things/", "https://www.youtube.com/watch?v=YXkOdWBwqaA", "https://www.youtube.com/watch?v=MIJFyUPG4Z4", "https://github.com/donnemartin/system-design-primer", "https://www.youtube.com/watch?v=L9TfZdODuFQ", "https://huyenchip.com/2024/07/25/genai-platform.html", "https://www.hellointerview.com/learn/system-design/in-a-hurry/delivery", "https://www.anthropic.com/news/contextual-retrieval", "https://eugeneyan.com/writing/system-design-for-discovery/", "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "https://hamel.dev/blog/posts/llm-judge/", "https://arxiv.org/abs/2509.25721", "https://arxiv.org/abs/2601.14242", "https://www.anthropic.com/engineering/multi-agent-research-system", "https://platform.claude.com/docs/en/docs/build-with-claude/prompt-caching", "https://techcrunch.com/2026/04/09/after-data-breach-10b-valued-startup-mercor-is-having-a-month", "https://supabase.com/docs/guides/functions/limits", "https://docs.railway.com/reference/services", "https://docs.livekit.io/agents/server/lifecycle", "https://www.youtube.com/watch?v=Gjnup-PuquQ", "https://www.postgresql.org/docs/current/sql-select.html", "https://www.crunchydata.com/blog/message-queuing-using-native-postgresql", "https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html", "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues-at-least-once-delivery.html", "https://aiengineeringfromscratch.com/lesson?path=phases%2F15-autonomous-systems%2F12-durable-execution", "https://www.youtube.com/watch?v=m6-63kpttQk", "https://brandur.org/idempotency-keys", "https://aiengineeringfromscratch.com/lesson?path=phases%2F13-tools-and-protocols%2F03-parallel-and-streaming-tool-calls", "https://www.youtube.com/watch?v=m6DtqSb1BDM", "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/", "https://www.youtube.com/watch?v=yGO4Igb45V0", "https://www.youtube.com/watch?v=2GAQVXGT_Zw", "https://docs.railway.com/reference/scaling", "https://docs.livekit.io/agents/server/options", "https://aiengineeringfromscratch.com/lesson?path=phases%2F17-infrastructure-and-production%2F10-cold-start-mitigation", "https://aiengineeringfromscratch.com/lesson?path=phases%2F17-infrastructure-and-production%2F22-load-testing-llm-apis", "https://www.youtube.com/watch?v=lHQZcMRr2n0", "https://www.youtube.com/watch?v=vXJsJ52vwAA", "https://docs.stripe.com/webhooks", "https://www.confluent.io/blog/exactly-once-semantics-are-possible-heres-how-apache-kafka-does-it/"]}, {"id": "wc36", "name": "AI system design the Mercor way: four designs from their business", "blurb": "Mercor's design round is practical and about AI systems. Learn one checklist, then run it on four designs taken from what Mercor sells: candidate search, contractor matching, an AI interviewer, and catching gamed tasks.", "intro": "Mercor's brief for the system design round asks for tradeoffs on latency, cost, reliability, scalability, deployment and observability, and for AI systems retrieval, evaluation, model behavior, failure modes and monitoring. It says why matters more than tool names. Candidates report prompts close to Mercor's own business: a candidate search system with RAG, matching contractors to projects, and detecting contractors who game AI-graded tasks. Step 1 is the checklist you walk every time. Steps 2 to 5 run it on one design each. Step 6 is the production pushback any of them can draw. The role is Applied AI on the Enterprise team, so evaluation is the thread through all of it.", "len": "2h 30m", "day": "2", "steps": [{"t": "The checklist you walk on every AI design", "m": 25, "out": "You get 'design an AI system' with no other detail. What do you do in the first ten minutes, and what do you cover before the end?", "d": "An AI design is an ordinary system with parts that are wrong some of the time. So the checklist is the usual one plus an answer to 'how do we know it is good, and what do we do when it is not'. Walk it in the same order every time, spend the first minutes on requirements and numbers, and give a reason for every choice. Mercor's brief says why beats tool names: 'a vector database' is a tool, 'a vector index because we need approximate nearest neighbour over 20 million resumes under 100 ms' is a reason.", "pts": ["Requirements: who uses it, what a good answer is, what a bad answer costs. Ask for the numbers: users, requests per second, data size, latency target, how fresh the data must be", "Scale in one line: say a number out loud (for example 20 million resumes, 50 queries per second) so every later choice has something to be sized against", "The pipeline: draw the stages from input to output before naming any tool. For most AI systems: ingest and clean, index, retrieve, rank, generate or score, check, return", "Per stage, four questions: latency (how long, budget out of the total), cost (per request, and what grows with traffic), failure (what breaks, how you notice), fallback (what the user gets instead)", "Evaluation offline: a labelled set, a metric that matches the product (recall at k, agreement with human graders), run on every change. Build the set first, because it also tells you which model is good enough", "Evaluation online: a sample of live traffic scored, user signals (clicks, corrections, overrides), A/B or shadow runs before a full rollout", "Monitoring: a trace for every request (inputs, retrieved items, prompts, model, output, latency, cost), dashboards on quality and cost, alerts on drift", "Deployment: ship the change behind a flag, shadow it, roll out in steps, roll back by flag. Version the prompt, the model and the index together", "Data and safety: whose data is this, can one customer's data reach another's, what is logged and who can read it", "Close with the tradeoff you chose and what you would build next. That is the collaborative ending Mercor describes"], "where": "Chip Huyen, Building a generative AI platform: the stages (context, guardrails, router, cache, orchestration, observability) as a skeleton", "url": "https://huyenchip.com/2024/07/25/genai-platform.html", "ans": {"lead": "I'd start with who uses it and what a good answer is, put numbers on the scale, then draw the pipeline and ask the same four questions of every stage.", "pts": ["Requirements: I'd ask for users, requests per second, data size, how fresh the data has to be and the latency target, and I'd say a number out loud so I can size against it.", "Pipeline: I'd draw the stages before picking any tool. Then for each stage I'd say how long it takes, what it costs, how it fails and what the user gets when it does.", "Evaluation: I'd build a small labelled set first. It tells me whether the design works, and it lets me change a model or a prompt without guessing. Online, I'd score a sample of live traffic and watch user overrides.", "Operating it: a trace on every request, quality and cost on a dashboard, a flag to ship behind and shadow runs before rollout. Prompt, model and index versioned together.", "Why over names: I'd say why I picked a component, for example a hybrid index because exact terms like a job title and fuzzy meaning both matter, and not only the product name."], "close": "Then I'd say the one tradeoff I made and what I'd do next, so it stays a conversation."}, "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Technique: Eval suites as release gates", "why": "Offline evaluation gates every change to a prompt, model or index."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/grou
