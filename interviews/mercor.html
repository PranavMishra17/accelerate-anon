he customer.** The customer, the technical solution and the business result together, and Enterprise is built that way."], "land": "Toward customers and ownership of the outcome.", "id": "q-why-leave-alfred"}, {"q": "Where do you want to be in two years?", "short": "Two years", "learn": {"read": [{"url": "https://www.youtube.com/watch?v=ClmHniKlt6k", "label": "Where Do You See Yourself in 5 Years (Jeff Su)", "why": "7 minutes. Show ambition that fits the role you are applying for."}]}, "tests": "Ambition that fits a hands-on role.", "a": ["From your INTRO.md goals, in your words.", "**Somewhere agentic engineering is at the frontier.** Running against real stakes, where getting it wrong has weight, which is the fastest way I know to get good.", "**Hard, ambiguous problems handed to me.** Someone the team can give a messy problem to without much hand-holding.", "**Still in the code.** I want to be able to call the direction and still build it, because the judgment comes from hitting the failure modes myself."], "land": "Frontier work, trusted with ambiguity, hands still on the code.", "id": "q-where-do-you-want-to-be-in-two-years"}, {"q": "Mercor moves fast and the hours are intense. How do you feel about the pace?", "short": "The pace question", "learn": {"read": [{"url": "https://www.youtube.com/watch?v=55YF0Ff5owc", "label": "Tell Me About a Time You Worked Under Pressure (CareerVidz)", "why": "8 minutes. Answer with one concrete example, which is the shape you planned."}]}, "tests": "A real example, not a claim.", "a": ["**Answer with an example, not a claim.** Over about three months I shipped dozens of production changes on a live system with paying users.", "**Speed with a safety net.** My eval harness and failure scanner are why I can move quickly and still know what broke.", "**One result.** Notification delivery went from about 90 seconds to about 3, found and fixed in production.", "**Then ask.** What the real hours and rhythm look like on Enterprise. It shows you want the true answer."], "land": "Fast with evidence, and I asked what the pace really is.", "notes": ["Culture reports describe an intense in-person environment. Do not argue with it; answer with how you work."], "id": "q-mercor-moves-fast-and-the-hours-are-intense-how-do-you-feel-"}, {"q": "What questions do you have for us?", "short": "Your questions", "learn": {"read": [{"url": "https://www.youtube.com/watch?v=gOOFLK655y4", "label": "Strategic Questions to Ask at the End of the Job Interview (Cass Thompson)", "why": "13 minutes. Questions about the work, not benefits. Pick two."}]}, "tests": "Curiosity about the work.", "a": ["Your four questions are in INTRO.md and the two groups added under Questions to ask. Pick two.", "**Week to week.** What an Enterprise engagement looks like from discovery to the agent running, and where it gets stuck.", "**Evaluation without ground truth.** Rubrics, expert reviewers, live signals, or a mix.", "**The first 90 days.** What a strong start looks like.", "**The team.** How engineers, forward deployed engineers and business experts are structured, and the next steps."], "land": "Two questions, then your closing line.", "id": "q-what-questions-do-you-have-for-us"}]}], "ask": [], "ask3": [{"id": "onsite", "title": "For the onsite interviewers", "when": "The last minutes of each part. One or two each.", "why": "They build on Enterprise; a question about the work shows you think past the exercise.", "how": ["Ask one, listen, ask one follow-up on what they said."], "items": [{"to": "Any engineer", "q": "What does a first month look like for someone on the Enterprise team?", "loop": "Early in the day.", "why": "Makes the job concrete and shows you are planning to start."}, {"to": "An Applied AI engineer", "q": "How do you build the evaluations for a customer: who writes the rubric, and how do you know the judge can be trusted?", "loop": "After the design part.", "why": "Ties to the evaluation work you own at alfred_ and to what Mercor sells."}, {"to": "The coding interviewer", "q": "Which parts of today allow AI tools, and what do you look for in how people use them?", "loop": "Before the build, if not already said.", "why": "The brief says encouraged; one report says an early part did not."}, {"to": "Any engineer", "q": "To get to know the product, what are some recent pain points you've solved, and some that are ongoing work?", "loop": "Any time.", "why": "Your question from INTRO.md, reworded only for spelling."}, {"to": "The recruiter or last interviewer", "q": "What does the full interview process look like from here, and the rough timeline?", "loop": "Last.", "why": "Your question from INTRO.md."}]}, {"id": "coding-reviewer", "title": "For the coding reviewer (Member of Technical Staff)", "when": "In the last minutes of the thirty-minute review. One or two.", "why": "A hands-on engineer who reads your code and runs the review. Questions about how they build show you read code the way they do.", "how": ["Ask one, listen, then say in a sentence how you have seen the same thing at alfred_."], "items": [{"to": "The coding reviewer", "q": "To get to know the product, what are some recent pain points you've solved, and some that are ongoing work?", "loop": "First choice.", "why": "Your question from INTRO.md, reworded only for spelling. Their answer is the real work."}, {"to": "The coding reviewer", "q": "When you review a teammate's first working version, what do you look at first: correctness, tests, or how it is structured to change?", "loop": "Second.", "why": "Tells you what they score, and shows you care about review as a shared habit."}, {"to": "The coding reviewer", "q": "How do engineering decisions get made on your team: who proposes, who pushes back, and how does a disagreement end?", "loop": "If time.", "why": "How the team works day to day, not the process document."}, {"to": "The coding reviewer", "q": "What would a strong first 90 days look like for someone joining Enterprise now?", "loop": "Last.", "why": "Your INTRO.md question, asked of an engineer who would work beside you."}]}, {"id": "sd-interviewer", "title": "For the system design interviewer", "when": "After the forty-five minutes. One or two.", "why": "They have just watched you reason about a backend. Ask about the real systems behind it.", "how": ["Ask one, listen, ask one follow-up on a failure or tradeoff they mention."], "items": [{"to": "The system design interviewer", "q": "How do you evaluate an agent inside a customer's environment when there's no ground truth? Rubrics, expert reviewers, live signals, or a mix?", "loop": "First choice.", "why": "Your INTRO.md question. It follows the design of an AI system and ties to the evaluation work you own."}, {"to": "The system design interviewer", "q": "Which part of the systems you run has failed in a way nobody predicted, and what changed in the design afterwards?", "loop": "Second.", "why": "Invites a real story and shows you think about failure first."}, {"to": "The system design interviewer", "q": "Where do you draw the line between a reusable service and a one-off build for a single customer?", "loop": "If time.", "why": "Your reusable-systems point from INTRO.md, as a design question."}, {"to": "The system design interviewer", "q": "How is the team structured, engineers versus forward deployed and business experts, and what are the next steps and timeline from here?", "loop": "Last.", "why": "Your INTRO.md question, whole."}]}, {"id": "algo-tlm", "title": "For the algorithms interviewer (Tech Lead Manager)", "when": "The last two or three minutes of the thirty. One or two.", "why": "The role is half hands-on building and half leading. Ask about both halves.", "how": ["Ask one, listen, then say in a sentence what you would bring."], "items": [{"to": "The Tech Lead Manager", "q": "What does a typical Enterprise engagement look like week to week, from discovery to the agent running in a customer's tools? Where does it usually get stuck?", "loop": "First choice.", "why": "Your INTRO.md question, to someone who leads the people doing it."}, {"to": "The Tech Lead Manager", "q": "What scaling problem have you had to rethink in the last few months, and what pushed you to change the approach?", "loop": "Second.", "why": "Matches the round, which is about real infrastructure and scaling decisions."}, {"to": "The Tech Lead Manager", "q": "How do you split your own time between building and leading, and what does an engineer need to show to take on more?", "loop": "If time.", "why": "How the team grows people, and where you could grow."}, {"to": "The Tech Lead Manager", "q": "What does the full interview process look like from here, and the rough timeline?", "loop": "Last.", "why": "Your question from INTRO.md."}]}, {"id": "gtm", "title": "For the GTM interviewers", "when": "The last two minutes of the fifteen. One or two.", "why": "They sit between the customer and the engineers; a question about their side shows you think about the customer too.", "how": ["Ask one, listen, then say in a sentence how you have seen the same thing."], "items": [{"to": "The Engagement Manager", "q": "What does a good first month with a new enterprise customer look like, and where does it usually get stuck?", "loop": "First choice.", "why": "Your INTRO.md question, aimed at the person who runs the engagement."}, {"to": "The Principal, Enterprise AI", "q": "How do you agree what good looks like with a customer, and who grades the agent when there is no ground truth?", "loop": "Second.", "why": "Ties to the evaluation work you own and to what Enterprise sells."}, {"to": "The Engagement Manager", "q": "When a customer asks for something that will not solve their problem, how do you handle it, and when do engineers join that conversation?", "loop": "If time.", "why": "Shows you have thought about saying no, and asks how engineers fit in."}, {"to": "The Principal, Enterprise AI", "q": "What does a customer have to see in a pilot before they expand it?", "loop": "If time.", "why": "Pilot metrics and expansion criteria, the part you prepared."}, {"to": "Either", "q": "What have you seen make a deployment go badly, and what would you want an engineer to do differently?", "loop": "Last.", "why": "Invites a real story and shows you want the honest answer."}]}, {"id": "leadership", "title": "For a leadership chat", "when": "When they ask if you have questions. Two, then your closing line.", "why": "About the company, the pace and where you would add, from someone who sets direction.", "how": ["Ask one, listen, then close in your words from INTRO.md."], "items": [{"to": "Leadership", "q": "Why is Enterprise being built now, and what would you want its first engineers to have solved by the end of the year?", "loop": "First choice.", "why": "The company direction, and what you would be measured on."}, {"to": "Leadership", "q": "What does a strong first 90 days look like for someone joining Enterprise?", "loop": "Second.", "why": "Your INTRO.md question."}, {"to": "Leadership", "q": "What does the real week look like here, hours and rhythm included?", "loop": "If the pace came up.", "why": "Culture reports describe an intense in-person environment; ask directly."}, {"to": "Leadership", "q": "How do deployments turn into reusable tools and eval templates, and who owns that?", "loop": "If time.", "why": "Your reusable-systems point from INTRO.md."}, {"to": "Leadership", "q": "What is the full interview process from here, and the rough timeline?", "loop": "Last.", "why": "Your question from INTRO.md."}]}, {"id": "sophie", "title": "For Sophie (round 2, kept)", "when": "The last two or three minutes. One or two.", "why": "She builds on Enterprise; a question about her work shows you think past the screen.", "how": ["Ask one, listen, ask one follow-up on what she said."], "items": [{"to": "Sophie", "q": "Where does caching actually bite in Enterprise deployments: model calls, customer APIs with rate limits, or the evaluation runs?", "loop": "First.", "why": "Ties the screen to the job, and her answer is the real problem you'd work on."}, {"to": "Sophie", "q": "To get to know the product, what are some recent pain points you've solved, and some that are ongoing work?", "loop": "Second.", "why": "Your question from INTRO.md, reworded only for spelling."}, {"to": "Sophie", "q": "What does the full interview process look like from here, and the rough timeline?", "loop": "Last.", "why": "Your question from INTRO.md."}]}], "traps": [], "tables": [], "admire": "", "kitaruLead": "", "figures": [], "mockHow": "Three mocks run in chat, each as the round on 11 November: 'run the Mercor coding mock' (a solo hour on a graph problem, no AI, then a 30-minute review where you extend it), 'run the Mercor design mock' (45 minutes of backend design: schema, API, block diagram, concurrent load, failure recovery) and 'run the Mercor GTM mock' (15 minutes with an engagement manager and a principal). Critique after each.", "mocks": [], "planKicker": "Things to do for round 3, Wednesday 11 November", "mechTitle": "", "designLink": null, "extra": "<b>Things to do for round 3, in order.<\/b> Every item links to where it lives. <ol><li><b>System design brush-up.<\/b> <a href=\"#/learn/sd-brushup\">Learn: the brush-up<\/a>: <a href=\"../index.html#/s/w1a\" target=\"_blank\" rel=\"noopener\">w1a<\/a>, <a href=\"../index.html#/s/w4e\" target=\"_blank\" rel=\"noopener\">w4e<\/a>, <a href=\"../index.html#/s/w4a\" target=\"_blank\" rel=\"noopener\">w4a<\/a>, <a href=\"../index.html#/s/w5e\" target=\"_blank\" rel=\"noopener\">w5e<\/a> first.<\/li><li><b>Coding challenge, 10:15, no AI and no Google.<\/b> <a href=\"#/coding/mercor-onsite-code\">Coding 7: referral network and task scheduler<\/a>, one timed solo hour each in a plain editor, then defend every line. Warm up on <a href=\"#/coding/problems\">Coding 6: four problems<\/a>; <a href=\"#/coding/concurrency\">Coding 4: concurrency<\/a> if threads come up in the review.<\/li><li><b>Algorithms, 1:15.<\/b> <a href=\"#/coding/mercor-onsite-algo\">Coding 8: the reported problems<\/a> (comparator, exchange rates, friend network, a million IDs, weighted top-k), then <a href=\"#/coding/mercor-infra-algo\">Coding 9: infrastructure and scaling<\/a>, said aloud with the numbers. <a href=\"../index.html#/w/wc37\" target=\"_blank\" rel=\"noopener\">wc37<\/a> for complexity.<\/li><li><b>System design, 12:15.<\/b> <a href=\"#/learn/m-round\">Learn: the system design round<\/a>: how to run 45 minutes, the job scheduler, contractor payouts, Ticketmaster, other prompts. <a href=\"../index.html#/w/wc36\" target=\"_blank\" rel=\"noopener\">wc36<\/a> step 1 for the checklist.<\/li><li><b>GTM, 2:00, and a possible leadership chat.<\/b> <a href=\"../index.html#/w/wc39\" target=\"_blank\" rel=\"noopener\">wc39<\/a>, then <a href=\"#/prep\">Prep: GTM round, Leadership chat and your questions<\/a>.<\/li><li><b>Mocks in chat.<\/b> Say 'run the Mercor coding mock', 'run the Mercor design mock' or 'run the Mercor GTM mock'.<\/li><li><b>Optional, not on the agenda.<\/b> The AI build: <a href=\"../index.html#/w/wc35\" target=\"_blank\" rel=\"noopener\">wc35<\/a>, <a href=\"../index.html#/w/wc38\" target=\"_blank\" rel=\"noopener\">wc38<\/a>, <a href=\"#/coding/mercor-onsite-build\">Coding 10<\/a>; <a href=\"#/lld\">the LLD tab<\/a>; the AI designs on the Learn tab.<\/li><li><b>On the day.<\/b> Photo ID and a charger. Ask early whether any round ends the day early, and confirm the coding rules before you start.<\/li><\/ol>", "emphasis": [], "own": null, "showUp": [["Make your thinking visible.", "Narrate as you go: what you are about to try, why, and what would change your mind. The brief judges how you break the problem down and recover when stuck."], ["Lead with intent.", "Open the presentation with what you set out to build and why, before any code. Then the tradeoffs you made under time pressure."], ["Own every AI-written line.", "Read what the model gives you to pull-request quality. Reviewers penalise code the candidate cannot explain. Write your own first answer before you ask it."], ["Tests and assumptions, out loud.", "Say the assumption, write the test that checks it, run it. Say what you optimise for: speed to a working prototype, or correctness on the edge cases."], ["Scoping is not failure.", "What you did not reach is a deliberate choice. Name it, say why, and say what you would do next and in what order."], ["End the build with next steps.", "Two or three, ranked: the next test, the next risk, the next feature. Then stop."], ["Think past the code, to production.", "How it scales, where latency or reliability bite, how you know it performs, what happens when an outside service fails, how it is deployed and monitored."], ["A teammate, not a performer.", "Ask questions, take hints, and change your mind when the interviewer gives a good reason. It is a conversation."], ["Ask which parts allow AI tools.", "The brief says encouraged; one candidate report says an early part did not. Ask early, and ask whether the build prompt is shared in advance."], ["Expect a solo hour, then a review.", "AceOffer's synthesis of 20 reports: about 60 minutes alone and screen-recorded, then 30 minutes of review. In the Applied AI version, Google for syntax but no LLMs in that hour, and no tests given. Write your own tests."], ["Clarify an under-specified prompt before coding.", "Reports say the referral network leaves 'flow centrality' deliberately vague. State your reading, ask, and only then build."], ["The search build allows LLMs, and is scored.", "About 75 minutes building against an evaluation endpoint, then 15 minutes on how you used the LLMs, the design and debugging. Baseline early, one change at a time, a log of score per change (wc38)."], ["Rounds may be eliminatory.", "One report says a candidate who failed system design was sent home at noon. Ask the end time and whether each round decides the day, and do not save your best for the afternoon."], ["Expect a direct question on pace.", "Mercor works fast. Answer with a real example of moving quickly and keeping quality, not a claim."]], "prepLead": "The teaching is on the Sessions tab. Here: how to show up, then your story out loud, and the timed drills: the build presentation, the candidate search opening, a complexity answer, and the earlier cache drills.", "storyBlurb": "Your intro, why Mercor, why leave alfred_, and logistics.", "sources": [{"label": "Mercor Enterprise", "url": "https://mercor.com/enterprise", "why": "Discover, Deploy, Improve, Monetize; business experts, forward deployed engineers and a platform for context, connectors and evaluation."}, {"label": "The posting: Software Engineer, Applied AI (Enterprise)", "url": "https://jobs.generalcatalyst.com/companies/mercor/jobs/77183222-software-engineer-enterprise-applied-ai", "why": "Embedded with enterprise customers; integrations, APIs and workflows on Mercor's platform; in person five days a week."}, {"label": "Sacra: Mercor", "url": "https://sacra.com/c/mercor/", "why": "Funding rounds, revenue estimates (gross against net), customers and controversies."}, {"label": "Fortune: Mercor acquires Deeptune (July 2026)", "url": "https://fortune.com/2026/07/09/ai-unicorn-mercor-acquires-deeptune-brendan-foody-investor-a16z-openai-anthropic/", "why": "About $2B annualised revenue in June 2026; Deeptune builds simulation environments where agents practise before live systems."}, {"label": "TechCrunch: the March 2026 breach (April 2026)", "url": "https://techcrunch.com/2026/04/09/after-data-breach-10b-valued-startup-mercor-is-having-a-month", "why": "A breach tied to a compromised open-source dependency (LiteLLM); contractor lawsuits. Know it; don't raise it."}, {"label": "PracHub: a candidate's report of the caching code review (May 2026)", "url": "https://prachub.com/interview-experiences/mercor-software-engineer-interview-experience-a-product-focused-recruiter-screen-then-sorting-theory-and-a-concurrency-code-review", "why": "A cached compute(x) handed over for review; probes: two threads miss, a lock, double-checked locking, lock scope, dict semantics."}, {"label": "PracHub: a 30-minute screen with an async cache (September 2026)", "url": "https://prachub.com/interview-experiences/mercor-software-engineer-interview-experience-a-rushed-30-minute-screen-on-sorting-probability-and-a-cache-race-condition", "why": "A JavaScript Map cache; the interviewer wanted race conditions, locking, memory and eviction."}, {"label": "PracHub: a rapid-fire screen (September 2026)", "url": "https://prachub.com/interview-experiences/mercor-software-engineer-interview-experience-30-minute-rapid-fire-technical-screen-rejected-after-three-questions", "why": "No eviction, the expensive call repeated, errors and input validation; then idempotency and retries for a payment integration."}, {"label": "Jointaro: a senior onsite report (October 2025)", "url": "https://www.jointaro.com/interviews/companies/mercor/experiences/senior-software-engineer-united-states-october-28-2025-no-offer-negative-c87ecf87", "why": "AI tools allowed at the onsite; the design prompt reported as a candidate search system built with RAG."}, {"label": "Canva: AI interview success, an interviewer's guide", "url": "https://www.canva.dev/blog/engineering/ai-interview-success/", "why": "How an interviewer scores an AI-assisted build: skeleton ready, scope first, own answer before the model, pull-request quality, three failure modes."}, {"label": "Chip Huyen: a generative AI platform", "url": "https://huyenchip.com/2024/07/25/genai-platform.html", "why": "The skeleton for an AI design: retrieval, guardrails, routing, caches, orchestration, observability."}, {"label": "Anthropic: demystifying evals for AI agents", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "why": "Code, model and human graders; one judge per rubric dimension; calibrating judges to humans."}, {"label": "Anthropic: contextual retrieval", "url": "https://www.anthropic.com/news/contextual-retrieval", "why": "Contextual embeddings, BM25 and reranking; top-20 retrieval failure falls from 5.7% to 1.9%."}, {"label": "Dealroom: Mercor at $2B gross run rate", "url": "https://dealroom.co/news/137121-mercor-doubles-to-2b-gross-revenue-run-rate-as-ai-labs-buy-expert-data/", "why": "The $2B figure is gross annualised revenue (June 2026)."}, {"label": "The Next Web: the $20B talks and Deeptune", "url": "https://thenextweb.com/news/mercor-20-billion-valuation-deeptune-acquisition", "why": "Contractors keep roughly 60 to 70%, so net revenue is a fraction of the gross figure."}, {"label": "TechCrunch: Mercor in talks at a $20B valuation (July 2026)", "url": "https://techcrunch.com/2026/07/09/mercor-is-in-talks-for-a-20b-valuation/", "why": "Reported talks; a close is unconfirmed, so say 'reported in talks'."}], "company": ["Mercor connects AI labs with vetted domain experts (doctors, lawyers, bankers, engineers) who write training data, tasks, rubrics and RL environments. Founded in 2023 in San Francisco by Brendan Foody, Adarsh Hiremath and Surya Midha. A $350M Series C at a $10B valuation (October 2025). Gross annualised revenue passed $2B in June 2026. Say gross: contractors keep roughly 60 to 70%, so net revenue is far smaller. Talks at about $20B were reported in July 2026 and a close is unconfirmed: say 'reported in talks'. Revenue leans on a few labs, with OpenAI and Anthropic the anchors.", "It bought Deeptune in July 2026: simulation environments where agents practise before they touch live systems. APEX is its benchmark family for real professional work (APEX-Agents and APEX-SWE since), graded with rubrics and a judge model. That is the evaluation layer you talked about with Neel.", "Mercor Enterprise, the team you would join, takes the same machinery to large companies: find where agents pay off (Discover), put them in production with custom evaluations wired into the customer's tools (Deploy), review and tune them live (Improve), and license opt-in data to labs (Monetize). Delivered by business experts and forward deployed engineers on one platform. The posting says engineering, product and customer success in one role. No source describes the team's internal work, so ask.", "Know, don't raise: the March 2026 breach through a compromised open-source dependency (LiteLLM) and the contractor lawsuits, and Scale AI's September 2025 suit over a former employee, which Mercor disputes. If the breach comes up, it bears on how you design for customer data: what is cached, and for whom. Culture reports describe an intense in-person environment; ask about hours directly."], "posting": {"url": "https://jobs.generalcatalyst.com/companies/mercor/jobs/77183222-software-engineer-enterprise-applied-ai", "lead": "Software Engineer, Applied AI on Mercor's Enterprise team: engineering, product and customer success in one role, builders first, embedded with enterprise clients.", "facts": [["Team", "Mercor Enterprise"], ["Offices", "San Francisco, New York or London, in person five days a week"], ["Onsite", "About five hours, downtown San Francisco; date to be set, about a week out"], ["Interviewers", "Not named yet"]], "does": ["Embed with enterprise customers to understand technical requirements and business goals.", "Architect and implement custom integrations, APIs and workflows on top of Mercor's platform.", "Deploy scalable solutions in client environments and drive launches and expansions.", "Build internal tools and reusable components that speed up future deployments.", "Turn ambiguous enterprise needs into clear technical plans and shipped systems."], "wants": ["A computer science or related degree.", "Strong fundamentals in a modern language (Python, Go, Rust).", "Production systems deployed on AWS, GCP or Azure.", "Comfort with customers, and explaining technical ideas to non-technical people.", "High ownership in ambiguous, high-stakes work."]}, "rounds": [{"title": "Round 1: call with Neel Taneja", "when": "Before 19 October 2026", "who": "Neel Taneja, Mercor", "format": "A conversation about your work; you discussed the evaluation layer and agents.", "outcome": "Passed. The recruiter wrote that Neel was 'very complimentary' and moved you to the technical screen.", "notes": [], "asked": []}, {"title": "Round 2: conversational technical screen on caching", "when": "Friday 23 October 2026, 6:00 to 6:30 PM Eastern", "who": "Sophie Guo, Applied AI Engineer", "format": "Thirty minutes on Google Meet. No coding tools or LLMs.", "outcome": "Held. You think okay-ish: strong on the cache code and the follow-ups, shaky on the sorting complexity. Waiting to hear.", "notes": ["How it ran: your intro, a warm-up on the worst sort that still works, then a five-line cache-aside snippet (a dict cache in front of an expensive external call) and its follow-ups, then your questions.", "The brief, from the recruiter: “This technical screen explores how you reason about caching in production systems. Be prepared to discuss how caching affects correctness, performance, and reliability as workloads grow and multiple requests run concurrently. We’ll look for clear assumptions, concrete examples of potential failures, and thoughtful tradeoffs when proposing improvements. To prepare, review caching fundamentals, concurrency concepts, and resource management in your preferred language.”", "Your preferred language is Python: say so at the start."], "asked": [{"q": "Tell me about yourself.", "short": "Intro", "said": ["Your intro."], "keep": [], "prep": "say-intro"}, {"q": "Write a sort that works but is the most inefficient you can think of. What is its time complexity?", "short": "Worst sort that works", "said": ["Started from what efficient sorts look like, then an O(n²) loop: find the minimum, append it, repeat (selection sort).", "Joked about random sort. First said O(n^n), then corrected yourself to O(n²)."], "land": "The worst sort that still works is bogosort: expected O(n · n!), and with true randomness no worst-case bound at all.", "keep": ["**Bogosort:** shuffle, check if sorted, repeat. A shuffle is sorted with probability 1/n!, so it takes n! shuffles on average, each costing O(n): **expected O(n · n!)**. Best case O(n), already sorted.", "**Worst case is unbounded:** random shuffles never guarantee success; the algorithm only finishes with probability 1. That is the monkey-and-typewriter point, said precisely.", "**Deterministic version:** try every permutation in order: worst O(n · n!), and it always finishes.", "**The ladder:** selection or bubble O(n²), stooge sort about O(n^2.71), bogosort expected O(n · n!)."], "notes": ["O(n²) is inefficient but normal, not the worst. Your first instinct, O(n^n), was closer to the intended answer than the correction: n! is roughly (n/e)^n."]}, {"q": "What is the random sort actually doing? Walk me through it.", "short": "Inside random sort", "said": ["Jumble the numbers, a validator inside a while loop; estimated O(n³)."], "land": "Each round is a shuffle and a check, O(n); the number of rounds averages n!.", "keep": ["One round: a Fisher-Yates shuffle, O(n), then an is-sorted check, O(n).", "Rounds until success are geometric with mean n! (distinct values), so the total is expected O(n · n!). Duplicates make it faster, since more orderings count as sorted."], "notes": ["O(n³) was the miss: the number of rounds grows like n!, not like n. Count rounds times work per round."]}, {"q": "Here is a small cache-aside snippet: a dict cache in front of an expensive external call. What can go wrong?", "short": "The cache-aside snippet", "said": ["No size limit, so it needs eviction: LRU.", "With multiple processes, contention.", "Staleness: if the source value changes, the cache is stale forever. Invalidate the key on write, and add a TTL."], "land": "Correctness first (staleness, the key), then concurrency (the stampede), then memory, then failures.", "keep": ["**Name the stampede:** many concurrent misses on one key all call the expensive function. Single-flight: one loads, the rest wait on it.", "**Per-process dicts:** each process has its own copy, so many processes means inconsistency between copies, not contention on one dict. Contention is between threads in one process, or on a shared cache like Redis.", "**Failures:** if the external call raises, nothing is stored; if it returns an error value and that is stored, it is served forever. Add a timeout."], "notes": ["Good coverage, and she kept probing, which reads as interest. The two to add next time: the stampede by name, and the per-process copies."]}, {"q": "If the value is edited all the time, why cache it at all?", "short": "Write-heavy", "said": ["Agreed: cache-aside suits read-heavy data. For write-heavy there are other patterns, like write-through."], "land": "Cache-aside is for read-heavy data; for write-heavy data, don't cache it, or batch the writes with write-behind if a little loss is fine.", "keep": ["Read-heavy, some staleness fine: cache-aside.", "Must read your own write: write-through (every write updates both, reads stay fresh).", "Write-heavy, a little loss fine (counters, view counts): write-behind. Otherwise skip the cache for that value."], "notes": ["Right call that cache-aside fits read-heavy work. Write-through does not help write-heavy load: it makes every write slower. It buys freshness, not throughput."]}, {"q": "How would you avoid race conditions and contention?", "short": "Races", "said": ["Compare-and-swap when many processes update one value; a mutex so one thread at a time touches it."], "land": "In one process a lock per key, held only around the dict; across processes, atomic operations on the shared cache.", "keep": ["**In one process:** a lock per key, held only to check and register, never across the expensive call; single-flight so one thread loads.", "**Across processes:** the cache is shared (Redis): SET NX with an expiry as a short lock, atomic INCR, or optimistic compare-and-swap with a version (WATCH and MULTI, or compare the version on write).", "**Writes to the source:** carry a version or timestamp, so an older write cannot overwrite a newer one."], "notes": ["Correct. Next time, tie it to the snippet in one sentence each: where the lock goes, and what changes once the cache is shared."]}, {"q": "What questions do you have for me?", "short": "Your questions", "said": ["Why Enterprise now (the team opened in March): the gap is that only a few frontier companies can do this themselves.", "The pain points she has personally solved recently: she walked through her own work.", "How the team is structured across sales, MVP building and forward deployment: very flexible, no fixed lines yet."], "keep": [], "notes": ["A good set; she answered at length."]}]}, {"title": "Round 3: the onsite", "when": "Wednesday 11 November 2026, 10:00 AM to 2:30 PM Pacific", "who": "Bradley Moon (coding review), Ishwari Nalgirkar (system design), Pranav Mereddy (algorithms), Will Ledingham and Lily Liu (GTM); Maggie Cassidy (set-up, wrap-up)", "format": "Coding challenge: the link arrives by email on the day; one hour of solo work, no kickoff, screen-recorded; then 30 minutes of live review and collaborative coding. No LLM tools, no Google search or Gemini, no IDE plugins. Focus: data structures, graph reasoning, correctness under constraints, explaining and iterating. System design, 45 minutes, live: a backend system end to end (schema, API, block diagram, concurrent load, failure recovery, trade-offs), whiteboard, no code. Algorithms, 30 minutes, live, discussion: real architecture challenges, infrastructure decisions and scaling strategies; not LeetCode, not system design. GTM, 15 minutes: communication, product sense, user empathy, users and stakeholders.", "outcome": "To come.", "notes": ["Confirmed by Mercor on 3 November: no candidate-search build and no AI anywhere in the coding challenge. The build material on this page is now optional.", "The brief's one takeaway: show how you think; a collaborative engineering conversation, not a performance.", "Open points to ask early: which parts allow AI tools, whether the build prompt is shared in advance, who the interviewers are, and the real hours.", "From AceOffer's synthesis of 20 candidate reports (3 Nov 2026, https://aceoffer.app/interviews/mercor/interview-process; paraphrased there, not verbatim prompts):", "Coding, about 90 minutes: 60 alone and screen-recorded, then 30 of review. In the Applied AI version, Google for syntax but no LLMs in the first hour, and no tests given. Prompts reported: a three-part referral network where 'flow centrality' is deliberately under-specified, and a two-part task scheduler.", "Algorithms, 30 to 45 minutes, discussion only: sorting or top-k with a faulty comparator is the most reported (minimise comparison calls, then wall-clock time when each call is slow); also exchange rates across currency pairs, and friend-network search with few API calls.", "System design, 45 minutes: a distributed job scheduler or work orchestration, and candidate search for a job description.", "Candidate-search build, about 90 minutes: 75 building with LLMs allowed against an evaluation endpoint, 15 discussing how you used the LLMs, the design and the debugging.", "Eliminatory rounds are possible: one report says a candidate who failed system design was sent home at noon. Days ran noon to 4 or 5 pm. An Applied AI variant is three hours: the referral-network coding round plus the search build.", "Expect a direct question on pace, and answer with a real example."], "asked": []}], "research": null, "learn": {"lead": "One path for the Mercor onsite design round, which Mercor describes as a backend system end to end: data model and schema, API, block diagrams, behaviour under concurrent load, recovery from failures and trade-offs. First the brush-up: which of your Accelerate sessions to redo or skim. Then the round itself: how to run the 45 minutes, and the designs it is reported to ask, drawn in full in the guide (a job scheduler, contractor payouts, ticket holds). The AI designs (candidate search, an AI interviewer) are optional now. Each topic: learn it, check yourself with multiple choice (say 'I don't know' when you don't, tick 'I'm guessing' when you are), explain the open question aloud, then compare and rate yourself.", "modules": [{"id": "brushup", "title": "Brush up your system design", "blurb": "Your own Accelerate sessions, in the order that pays most for the two reported prompts.", "sessions": [], "topics": [{"id": "sd-brushup", "title": "System design brush-up from your plan", "brief": "The Accelerate sessions to redo or skim before the onsite, in priority order. The backend design prompts Mercor is reported to ask (a job scheduler, contractor payouts, ticket holds) lean on the same few ideas: queues and backpressure, atomic claims, retries that are safe to repeat, and rate limits. Do the first four. Skim the next two. The rest is light.", "points": ["Do first, w1a Throughput, latency, queues, backpressure: a scheduler is a queue with workers, and a search endpoint is a service under load. Both need a bound on the queue and a stated answer when it is full (shed load, reject, slow the producer). It also gives the p50 and p99 words to size things aloud", "Do, w4e Transactions and indexes: how a worker claims a job with SELECT ... FOR UPDATE SKIP LOCKED so two workers never take the same row and never wait. Also the retry write with ON CONFLICT, the lost update and write skew anomalies, compare-and-set, and partial indexes for the queue and for failed jobs. This is the job scheduler's core", "Do, w4a Things break at a hundred million: retries with exponential backoff and jitter, timeouts, dead-letter queues, and idempotency beyond payments. Every external call in both designs (a model, a customer API) fails sometimes, and 'what happens when it fails' is on Mercor's list", "Do, w5e APIs and the edge: the token bucket, 429 with Retry-After, and idempotency keys on the front door. Rate limits matter twice here: protecting your service from tenants, and staying inside a model provider's limits", "Skim, w4d Replication and consistency: leader and failover, fencing and consensus in outline. This is what sits behind 'only one scheduler instance may fire a job' and a lease that expires", "Skim, w5f Streams and events: queue against log, at-least-once delivery, the outbox, dead-letter. Useful when a scheduler publishes events or a search index is fed by changes", "Light review, w5a Caching: round 2 covered it. Reread the key terms and the stampede idea, which returns for cached embeddings and cached model calls", "Skim if time, w2a How work splits and w3a Where a hundred million things live: hot keys and sharding for job ids and tenants, and back-of-envelope sizing for rows and vectors"], "links": [{"url": "../index.html#/s/w1a", "label": "w1a Throughput, latency, queues, backpressure (do)", "why": "Bounded queues and what to do when full. The vocabulary for both designs."}, {"url": "../index.html#/s/w4e", "label": "w4e Transactions and indexes (do)", "why": "Atomic claims with SKIP LOCKED, ON CONFLICT retries, partial indexes. The scheduler's core."}, {"url": "../index.html#/s/w4a", "label": "w4a Things break at a hundred million (do)", "why": "Backoff with jitter, timeouts, dead-letter, idempotency. Failure of every external call."}, {"url": "../index.html#/s/w5e", "label": "w5e APIs and the edge (do)", "why": "Token bucket, 429 and Retry-After, idempotency keys."}, {"url": "../index.html#/s/w4d", "label": "w4d Replication and consistency (skim)", "why": "Leader election, failover and fencing behind a lease."}, {"url": "../index.html#/s/w5f", "label": "w5f Streams and events (skim)", "why": "At-least-once, the outbox, dead-letter, replay."}, {"url": "../index.html#/s/w5a", "label": "w5a Caching (light review)", "why": "Round 2 covered it; keep the key terms warm."}, {"url": "../index.html#/s/w2a", "label": "w2a How work splits (skim if time)", "why": "Hot keys and sharding for job ids and tenants."}, {"url": "../index.html#/s/w3a", "label": "w3a Where a hundred million things live (skim if time)", "why": "Sizing rows, vectors and traces out loud."}], "mcq": [{"q": "Which two Accelerate sessions give the job scheduler its core: the atomic claim and the safe retry?", "o": ["w2a and w3a", "w4e and w4a", "w5a and w5f", "w1a and w5a", "w4d and w5e"], "a": 1, "why": "w4e has the SKIP LOCKED claim and the ON CONFLICT retry write; w4a has backoff, dead-letter and idempotency. The others support them."}], "res": [{"kind": "video", "req": true, "label": "Intro to ACID database transactions", "url": "https://www.youtube.com/watch?v=oGmxzUBCYtY", "m": 8, "why": "The four guarantees in plain words, before the claim and lost-update material in w4e.", "yt": {"id": "oGmxzUBCYtY", "ch": "Jordan has no life"}}, {"kind": "video", "req": false, "label": "Distributed systems 7.2: linearizability", "url": "https://www.youtube.com/watch?v=noUNH3jDLC0", "m": 19, "why": "What 'one scheduler may fire a job' needs from the store; the idea behind w4d.", "yt": {"id": "noUNH3jDLC0", "ch": "Martin Kleppmann"}}, {"kind": "read", "req": true, "label": "AWS Builders' Library: timeouts, retries and backoff with jitter", "url": "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/", "m": 15, "why": "The retry rules behind w4a: which calls to retry, how long to wait, why jitter."}, {"kind": "read", "req": false, "label": "PostgreSQL docs: transaction isolation", "url": "https://www.postgresql.org/docs/current/transaction-iso.html", "m": 15, "why": "The anomalies (lost update, write skew) each level allows, from the database itself."}]}]}, {"id": "round", "title": "The system design round", "blurb": "Mercor's backend round, end to end: how to run the 45 minutes, then the designs it is reported to ask, each drawn in full in the guide.", "sessions": ["wc36"], "topics": [{"id": "sd-run-45", "title": "How to run 45 minutes of backend design", "brief": "Mercor describes the round as a backend system end to end for a realistic scenario, on a whiteboard, no code: data model and schema, API, block diagrams, behaviour under concurrent load, recovery from failures, trade-offs. This topic is the order and the clock. The designs after it are practice for the same order.", "points": ["The order, from Mercor's own list: requirements and numbers, data model and schema, API, block diagram, the concurrency hazard, failure recovery, trade-offs. Follow it and say each name aloud, so the interviewer can see the structure", "The minute plan, 45 in all. Requirements and numbers, 5. Data model and schema, 7. API, 5. Block diagram, built in stages, 8. The concurrency hazard, 8. Failure recovery, 8. Trade-offs and what you would do next, 4. Failure and concurrency get 16, because that is where the round is judged", "Requirements and numbers (5 minutes): three functional requirements, what is out of scope, the delivery promise (at-least-once, with safe repeats), and the one or two numbers that change the design. Say that every number is an assumption. Do math only where it changes a decision", "Data model and schema (7 minutes): the entities, which one is contended (many actors change it), money as integers in minor units, state as a column with legal moves, and the unique constraints that stop duplicates. Draw the tables with their keys, not a diagram of boxes", "API (5 minutes): the write calls with an idempotency key, 202 and a status read for slow work, cursor pagination for lists, and the worker or provider side as its own small contract. Name the one field that makes retries safe", "Block diagram (8 minutes): start with one node that works, name what breaks, and add one box at a time: a queue between choosing and doing, a worker pool, a sweeper, an outbox. State lives in the database; queues hold ids", "The concurrency hazard (8 minutes): name it before you are asked. Two actors, one row. Pick the mechanism and say what the loser does: a unique constraint, a conditional update, SKIP LOCKED, a lease with a fencing token. Never hold a lock across a network call", "Failure recovery (8 minutes): walk the arrows of the data flow and say what happens if the process dies on each one. Then the unknown outcome (a call that may or may not have happened), a sweeper that settles it, and a reconciliation that checks the books", "Trade-offs (4 minutes): latency, cost, reliability, scalability, operational complexity, and what you would monitor. Say what you did not build and why. Mercor asks for why over tool names: justify each choice by the failure it prevents", "Raise one failure case unprompted, state your numbers, and treat the interviewer as a collaborator: ask 'do you want me to go deeper here or move on?' at each stage. A collaborative conversation, not a performance"], "production": ["A design is judged on what happens when it breaks. The minutes spent on concurrency and failure are the ones that separate a passing answer from a diagram."], "figs": [], "links": [{"url": "../index.html#/s/w1a", "label": "w1a Throughput, latency, queues, backpressure", "why": "The vocabulary and the numbers for the first five minutes."}, {"url": "../index.html#/s/w4e", "label": "w4e Transactions and indexes", "why": "Unique constraints, conditional updates and SKIP LOCKED: the concurrency minute."}, {"url": "../index.html#/s/w4a", "label": "w4a Things break at a hundred million", "why": "Retries, timeouts and idempotency: the failure minutes."}, {"url": "../index.html#/w/wc36", "label": "wc36 AI system design the Mercor way", "why": "A checklist that also applies to backend designs: failure, operations, evaluation."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/contention/optimistic", "label": "Guide: compare-and-set (contention)", "why": "The standard answer to the concurrency hazard."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/multi-step/idempotency", "label": "Guide: idempotency keys (multi-step)", "why": "The standard answer to retries."}], "res": [{"kind": "read", "req": true, "label": "Hello Interview: how to deliver a system design answer", "url": "https://www.hellointerview.com/learn/system-design/in-a-hurry/delivery", "m": 15, "why": "The order to run the 45 minutes in: requirements, core entities, API, high level, deep dives."}, {"kind": "video", "req": true, "label": "System design interview: a step-by-step guide", "url": "https://www.youtube.com/watch?v=i7twT3x5yv8", "m": 10, "why": "The four-step frame (scope, high level, deep dive, wrap up) and how to split the time.", "yt": {"id": "i7twT3x5yv8", "ch": "ByteByteGo"}}, {"kind": "video", "req": false, "label": "How to prepare for system design interviews", "url": "https://www.youtube.com/watch?v=Ru54dxzCyD0", "m": 19, "why": "What interviewers grade at each level and where candidates lose time.", "yt": {"id": "Ru54dxzCyD0", "ch": "Hello Interview"}}, {"kind": "read", "req": false, "label": "Hello Interview: system design in a hurry", "url": "https://www.hellointerview.com/learn/system-design/in-a-hurry/introduction", "m": 10, "why": "The overview page of the same course; read it for the map of what to cover."}], "mcq": [{"q": "You have 45 minutes for a backend design. Which split puts the time where the round is judged?", "o": ["15 minutes requirements, 15 boxes, 15 on scale", "5 requirements, 12 on schema and API, 8 on boxes, 16 on concurrency and failure, 4 on trade-offs", "40 minutes of boxes, 5 for questions", "20 on the schema, 20 on the API, 5 on the rest", "All of it on scale math"], "a": 1, "why": "Mercor lists concurrent load and recovery from failures as what the design is checked on. Requirements and schema are short and sharp; the failure minutes are the longest block after the diagram."}, {"q": "You have drawn the boxes and not mentioned concurrency. What do you do?", "o": ["Say the database handles it", "Name the row two actors both change, say what goes wrong, pick a mechanism, and say what the loser does", "Add a global lock around everything", "Put Redis in front and move on", "Wait for the interviewer to ask"], "a": 1, "why": "Naming the hazard first shows the design has no gap. A mechanism is a unique key, a conditional update, SKIP LOCKED or a lease with a fence, and the loser retries or skips."}], "open": {"q": "You are given a backend prompt you have not seen. Walk me through how you spend the 45 minutes, and what you say at each stage.", "probe": "Where do the concurrency hazard and the failures come in, and how do you decide when to go deeper?", "a": ["Requirements and numbers in 5 minutes: three functions, what is out, the delivery promise, one or two numbers that change the design.", "Schema in 7 and API in 5: entities, the contended one, constraints for duplicates, an idempotency key on writes.", "Boxes in 8, built in stages from one node: say what breaks, then add one thing.", "Concurrency in 8 and failure in 8: name the hazard, pick the mechanism, walk each arrow for a crash, handle unknown outcomes, add a sweeper and a reconciliation.", "Trade-offs in 4: latency, cost, reliability, operations, what I did not build and what I would watch. Ask the interviewer where to go deeper at each stage."]}, "say": ["**I'll follow the order: requirements and numbers, schema, API, boxes, then concurrency and failure.**", "**Before I draw:** the delivery promise, three functions, and the number that changes the design. Every number is an assumption.", "**The schema first, not the boxes:** which entity is contended, money as integers, and the unique keys that stop a duplicate.", "**I will name the concurrency hazard myself,** pick one mechanism, and say what the loser does. Then I walk each step and say what happens if the process dies there.", "I'll finish with what I'd monitor, what I did not build, and why."], "avoid": ["Starting with boxes and a database brand before the requirements and the schema.", "Waiting to be asked about concurrency or failure."]}, {"id": "sd-job-scheduler", "title": "Workflow orchestration (the job scheduler)", "brief": "The closest match to Mercor's design round: a workflow system where users define steps with dependencies, start runs, and the system runs each step in order, tracks every run and step, handles failures and shows progress (PracHub, 25 Sep 2026, a close paraphrase; AceOffer, three reports). The guide's job scheduler is the design; its deep dives answer the four reported follow-ups. Reported as a 45 minute system design in the Mercor onsite (three reports). Run jobs now or at a time or on a schedule, across many workers, without losing one or running one twice by mistake. Open the design in the guide below; the lines above it say how Mercor tends to ask.", "points": ["How it is asked: practical over theoretical. They want the tradeoffs on reliability, scale and operations, and what happens when a worker dies mid-job. Start with requirements and numbers, not boxes", "The core loop: jobs are rows with a status and a time to run. A worker claims due jobs, runs them, and records the result. The claim must be atomic, so two workers never take the same job", "Failure: a worker can die after taking a job. A lease with an expiry lets another worker take it back. Delivery is at-least-once, so jobs must be safe to run twice (idempotent), with a key they can check", "Retries and limits: backoff with jitter, a retry cap, then a dead-letter state a person can look at. A per-tenant limit stops one customer from starving the rest", "Scale: partition by job id or tenant, keep the due-jobs query on a partial index, and watch for a hot partition. A single scheduler that fires jobs needs a leader and a fencing token so a stale leader cannot fire twice", "Operate it: queue age, lateness (start time minus due time), failure rate and retries as the dashboard. Late jobs, not CPU, are the user-facing symptom"], "production": ["Lateness, the gap between due time and start time, is the metric that pages someone; queue depth alone does not say whether jobs are on time."], "figs": [], "links": [{"url": "../index.html#/s/w4e", "label": "w4e Transactions and indexes", "why": "The claim and the retry write, with the SQL."}, {"url": "../index.html#/s/w4a", "label": "w4a Things break at a hundred million", "why": "Retries, backoff, dead-letter and idempotency."}, {"url": "../index.html#/s/w4d", "label": "w4d Replication and consistency", "why": "Leader and fencing, for the single scheduler."}, {"url": "../index.html#/s/w5e", "label": "w5e APIs and the edge", "why": "Per-tenant rate limits and idempotency keys."}, {"url": "../index.html#/w/wc36", "label": "wc36 AI system design the Mercor way", "why": "The checklist to run on any design, including failure and operations."}], "res": [{"kind": "read", "req": true, "label": "Hello Interview: design a distributed job scheduler", "url": "https://www.hellointerview.com/learn/system-design/problem-breakdowns/job-scheduler", "m": 30, "why": "A commenter in the reports says this walkthrough was enough preparation for the round."}, {"kind": "read", "req": false, "label": "Hello Interview: how to deliver a system design answer", "url": "https://www.hellointerview.com/learn/system-design/in-a-hurry/delivery", "m": 15, "why": "The order to run the 45 minutes in: requirements, API, high level, deep dives."}, {"kind": "video", "req": true, "label": "Distributed job scheduler, systems design interview", "url": "https://www.youtube.com/watch?v=pzDwYHRzEnk", "m": 31, "why": "Claiming, retries and the duplicate-run problem, drawn out with trade-offs.", "yt": {"id": "pzDwYHRzEnk", "ch": "Jordan has no life"}}, {"kind": "video", "req": false, "label": "Distributed task scheduler: system design interview", "url": "https://www.youtube.com/watch?v=zl8BPH74GY4", "m": 23, "why": "A shorter pass at the same design; compare how it handles failed workers.", "yt": {"id": "zl8BPH74GY4", "ch": "TechPrep"}}, {"kind": "read", "req": true, "label": "Brandur: Postgres job queues and failure by MVCC", "url": "https://brandur.org/postgres-queues", "m": 12, "why": "A database-backed queue works until long transactions bloat it; know the limit before you propose it."}, {"kind": "read", "req": false, "label": "PostgreSQL docs: SELECT, the locking clause (FOR UPDATE SKIP LOCKED)", "url": "https://www.postgresql.org/docs/current/sql-select.html", "m": 10, "why": "The exact semantics of the claim query; search the page for SKIP LOCKED."}], "mcq": [{"q": "Two workers poll the jobs table at the same moment. Which claim keeps them from taking the same job, without one waiting for the other?", "o": ["Read the due rows, then update them by id in a second statement", "SELECT ... FOR UPDATE SKIP LOCKED, then mark them running in the same transaction", "Lock the whole table while claiming", "Add a random sleep before each poll", "Run only one worker"], "a": 1, "why": "Two statements leave a gap where both read the same rows. A table lock serialises every worker. SKIP LOCKED lets each take rows the other does not hold."}, {"q": "A worker takes a job, runs half of it and dies. What makes giving the job to another worker safe?", "o": ["Exactly-once delivery from the queue", "A lease that expires, plus a job that is idempotent and checks its key", "Never retry, and alert a person", "Run every job on two workers at once", "Keep the worker's memory on disk"], "a": 1, "why": "Delivery is at-least-once in practice, so the lease lets the job be reclaimed and idempotency makes a second run harmless."}], "open": {"q": "Design a distributed job scheduler. Open with requirements, then walk the claim, a worker dying mid-job, and how you know jobs are running on time.", "probe": "What stops two workers running the same job, and what stops one customer starving the rest?", "a": ["Requirements first: one-off and recurring jobs, how many per second, how late is too late, whether a job may run twice.", "Claim: jobs are rows; a worker takes due rows with SKIP LOCKED in one short transaction and marks them running with a lease.", "Failure: if the lease expires, another worker reclaims the job. Jobs are idempotent with a key, so a second run is harmless. Retries use backoff with jitter, then a dead-letter state.", "Fairness and scale: a per-tenant limit, partitioned by tenant or job id, with the due query on a partial index. One scheduler leader fires recurring jobs, with a fencing token.", "Operate: lateness, queue age, retries and failure rate on a dashboard, with an alert on lateness."]}, "say": ["**I'd start with requirements and numbers, then the claim.**", "**The claim:** jobs are rows, and a worker takes due ones with SKIP LOCKED so two never get the same job and none waits.", "**A dying worker:** a lease expires and the job is reclaimed. Delivery is at-least-once, so jobs are idempotent and carry a key.", "**Retries:** backoff with jitter, a cap, then a dead-letter state a person can inspect.", "I'd watch lateness first, because that is what the user feels."], "avoid": ["Promising exactly-once execution: say at-least-once with idempotent jobs."], "design": "job-scheduler"}, {"id": "sd-contractor-payouts", "title": "Design contractor payouts: a payment endpoint safe against timeouts, retries and crashes", "brief": "Reported for Mercor as a charge-then-record payment endpoint, and as weekly payouts to thousands of contractors with an append-only ledger. Money moves in one system and the record lives in another, and no transaction covers both. Open the design in the guide below.", "points": ["How it is asked: correctness under failure, not scale. The reported follow-ups are a crash between the charge and the record, a timeout where the outcome is unknown, retries, concurrent submissions, and whether one database transaction can cover the external call (it cannot)", "The rule that decides the design: paying twice is worse than paying late. Commit the intent first (a payout row marked submitting), call the provider with the payout id as the idempotency key, then record the result, the ledger entries and the outbox event in one transaction", "Unknown is a state. A timeout means the payment may or may not have happened. Look it up by key or by reference, or wait for the webhook, and move on only on a definite answer. Never retry with a new key after an unknown", "Idempotency at every hop: the client's key at your door with a hash of the body, a unique key on contractor and period, the payout id to the provider, unique ledger rows per payout, and a processed-events check on webhooks", "Concurrency: two batch runs or two workers go for one payout. A unique constraint and a conditional update decide the winner in the database. Do not hold a lock across the provider call; use a state with a lease", "The ledger is append-only. A mistake is a reversal plus a new entry with a reason and an actor, and an overpayment becomes a balance to recover. A daily reconciliation against the provider's report, by key, is the check that does not trust anything else", "Say the limit: if the provider has no idempotency key or no status lookup, automatic retry after an unknown is not safe. Put the payout id in the reference field, search by it, and send what is left to a person"], "production": ["A double payment found by reconciliation pages a person at once, and an unknown payout older than five minutes means the sweeper or the provider is stuck."], "figs": [], "links": [{"url": "../index.html#/s/w4a", "label": "w4a Things break at a hundred million", "why": "Idempotency, retries with backoff, timeouts. The payment version of each."}, {"url": "../index.html#/s/w4e", "label": "w4e Transactions and indexes", "why": "Unique constraints, ON CONFLICT and conditional updates for the claim and the record."}, {"url": "../index.html#/s/w5f", "label": "w5f Streams and events", "why": "The outbox and at-least-once delivery."}, {"url": "../index.html#/s/w5e", "label": "w5e APIs and the edge", "why": "Idempotency keys on the front door, and the provider's rate limit as a token bucket."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/multi-step/idempotency", "label": "Guide: idempotency keys", "why": "One key per intent, carried through every hop."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/multi-step/outbox", "label": "Guide: the outbox", "why": "Events committed with the state change."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/multi-step/saga", "label": "Guide: sagas", "why": "Commit the intent, call the outside, record the result."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/multi-step/state-machine", "label": "Guide: state machines", "why": "Why unknown is a state."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/long-running/leases", "label": "Guide: leases", "why": "How a crashed worker's payout is given back."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/contention/atomic", "label": "Guide: atomic operations", "why": "A unique key and a conditional update, not check-then-act."}], "res": [{"kind": "read", "req": true, "label": "TechInterview: designing a payment system that never charges a card twice", "url": "https://www.techinterview.org/post/3233476895/designing-a-payment-system-that-never-double-charges/", "m": 12, "why": "States, a unique idempotency key, a timeout as unknown, the outbox and nightly reconciliation."}, {"kind": "read", "req": true, "label": "ByteByteGo: how to avoid double payment", "url": "https://blog.bytebytego.com/p/how-to-avoid-double-payment", "m": 6, "why": "At-least-once retries plus an at-most-once key, in one page. It does not cover a lost reply or a crash, which the guide design adds."}, {"kind": "video", "req": false, "label": "Build a robust payments service using idempotency keys", "url": "https://www.youtube.com/watch?v=m6DtqSb1BDM", "m": 17, "why": "Builds the key table and the retry path step by step.", "yt": {"id": "m6DtqSb1BDM", "ch": "Arpit Bhayani"}}, {"kind": "read", "req": false, "label": "PracHub: make a charge-then-record payment endpoint safe against timeouts, retries and crashes", "url": "https://prachub.com/interview-questions/make-a-charge-then-record-payment-endpoint-safe-against-timeouts-retries-and-crashes", "m": 5, "why": "The reported question as asked, with its follow-ups: no idempotency keys, testing the crash paths, monitoring stuck payments."}, {"kind": "read", "req": false, "label": "Stripe API reference: idempotent requests", "url": "https://docs.stripe.com/api/idempotent_requests", "m": 5, "why": "What a real provider stores for a key, for how long, and what a different body does."}, {"kind": "video", "req": true, "label": "Design a payment system", "url": "https://www.youtube.com/watch?v=olfaBgJrUBI", "m": 32, "why": "The full interview shape for payments: ledger, PSP, retries, reconciliation.", "yt": {"id": "olfaBgJrUBI", "ch": "Code with Lucian"}}], "mcq": [{"q": "Your payout call to the provider times out. What state is the payout in?", "o": ["Failed, so retry with a new key", "Succeeded, so record it", "Unknown: look it up by key or reference, or wait for the webhook", "Cancelled, and tell the contractor", "Delete the row and start again"], "a": 2, "why": "A timeout does not say whether the money moved. A new key on a retry can pay twice. Only a definite answer from the provider moves the payout on."}, {"q": "Why not put the provider call inside the same database transaction as the payout record?", "o": ["Transactions are slow in Postgres", "The provider is not part of the commit: a rollback cannot unsend money, and the transaction holds locks across the network", "Providers do not accept payments from transactions", "It would save the record twice", "There is no reason; it is fine for small payments"], "a": 1, "why": "No transaction spans two systems. If the commit fails after the provider accepted, the money is gone with no record. Commit the intent first, then call, then record."}, {"q": "The weekly batch is run twice by mistake. What stops a second payout for the same week?", "o": ["A check that no payout exists, run first", "A unique key on contractor and period, plus a conditional update that attaches each hour to one payout", "A comment in the runbook", "Running the batch only at night", "Paying in smaller amounts"], "a": 1, "why": "A check-then-insert lets both runs pass the check. The unique key and the conditional update decide in the database, where the decision is atomic."}], "open": {"q": "Design a payment endpoint that is safe against timeouts, retries and crashes. Start from the failures: what can go wrong between charging the provider and writing your own record?", "probe": "What is the state after a timeout, and what does the system do when it finds a payout stuck in that state?", "a": ["The failure: money moves in the provider and the record is in my database, and nothing commits both. A crash between the two leaves money moved and no record.", "Fix: commit a payout row as submitting first, call the provider with the payout id as the idempotency key, then record the result, the ledger entries and an outbox event in one transaction.", "Unknown: a timeout is unknown, not failed. A sweeper looks the payment up by key or reference, and the webhook tells me too. A new key only after a confirmed failure.", "Concurrency: a unique key on contractor and period, a conditional update for the claim, a lease for a dead worker, a fence on the record. No lock across the call.", "Audit: an append-only ledger, corrections as reversals, and a daily reconciliation against the provider's report. Page on a double payment."]}, "say": ["**The problem is that the provider and my database cannot commit together.** So I commit the intent first, as a payout in submitting.", "**Then I call the provider with the payout id as the key,** and record the result, the ledger entries and the outbox row in one transaction. A crash in any window leaves a row for a sweeper to check.", "**A timeout is unknown, not failed.** I look it up by key, or wait for the webhook, and only a definite answer moves it on.", "**Duplicates are stopped where they are atomic:** a unique key on contractor and period, and a conditional update. The ledger is append-only, and a daily reconciliation checks it against the provider.", "If the provider has no key or no status lookup, I do not retry automatically. I search by reference and send the rest to a person."], "avoid": ["Promising exactly-once: say at-least-once attempts with one key and an at-most-once effect, and say where it depends on the provider.", "Claiming payments experience you do not have. Say the discipline you do have: a record of intent before an outside call, keys, and a way to find out what happened."], "design": "contractor-payouts"}, {"id": "sd-ticketmaster", "title": "Ticketmaster: contention and holds", "brief": "The classic baseline for two workers or two buyers wanting the same thing. The job scheduler's duplicate-run problem is the same contention: a conditional update, a hold with an expiry, a lock with a lease.", "points": ["Read the deep dives on holding a seat and on the queue in front of a hot event.", "Carry over: a conditional update or a lease decides who wins; the loser retries or moves on.", "Say it in the scheduler: a job is claimed the way a seat is held, with an expiry so a dead worker gives it back.", "Holds: a seat is held with an expiry (a status and a time, or a Redis lock with a TTL), never by keeping a database lock open for the whole checkout. The expiry gives the seat back when a buyer walks away.", "Double booking: the database is the backstop. A conditional update or optimistic concurrency means only one buyer's write succeeds, even if the hold layer fails. The loser is told and offered another seat.", "Payment uncertainty: the same unknown outcome as in contractor payouts. The booking carries a key, the payment webhook is handled idempotently, and a hold that that expires while a payment is in flight is reconciled, not guessed."], "design": "ticketmaster", "links": [{"url": "https://www.hellointerview.com/learn/system-design/problem-breakdowns/ticketmaster", "label": "Hello Interview: design Ticketmaster", "why": "Holds, double booking, the waiting queue and what happens when the hold layer fails. Free to read."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/contention/reservation", "label": "Guide: reservation (hold, then confirm)", "why": "The hold with an expiry."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/contention/optimistic", "label": "Guide: compare-and-set", "why": "The database backstop against double booking."}], "mcq": [{"q": "Buyers hold a seat while they pay, which can take minutes. What is the right way to hold it?", "o": ["SELECT ... FOR UPDATE on the seat for the whole checkout", "A status and an expiry (or a lock with a TTL), with a conditional update at confirmation as the backstop", "No hold; whoever pays first wins and the rest get refunds", "Lock the whole event", "Hold the seat in browser storage"], "a": 1, "why": "A database lock held for minutes ties up connections and leaks if the buyer leaves. A hold with an expiry gives the seat back on its own, and the conditional update at the end keeps the sale correct even if the hold layer fails."}], "open": {"q": "Design the booking path for a high-demand event so a seat is never sold twice. What happens when a buyer's payment outcome is unknown?", "probe": "What holds the seat, what is the backstop if the hold layer fails, and what does the loser see?", "a": ["A hold: the seat gets a status and an expiry when a buyer starts checkout, so an abandoned checkout gives it back.", "A backstop: confirming is a conditional update on the seat, so only one buyer's write succeeds even if the hold layer is down.", "Payment: the booking has a key, the payment webhook is idempotent, and an unknown outcome is looked up, not guessed.", "Spikes: a waiting queue in front of the hot event, and a clear message to the loser."]}, "say": ["**A seat is held with an expiry, not locked for the whole checkout.**", "**The database is the backstop:** confirming is a conditional update, so only one buyer wins even if the hold layer fails.", "**A payment that times out is unknown.** The booking has a key and the webhook is idempotent, so I look it up instead of guessing.", "For a hot on-sale I'd put a waiting queue in front and tell the loser plainly."], "avoid": ["Keeping a database row lock open while a person types a card number."], "res": [{"kind": "video", "req": true, "label": "Ticketmaster: system design interview", "url": "https://www.youtube.com/watch?v=_1AF8eZI0RA", "m": 20, "why": "The hold with an expiry and the double-booking guard in one short pass.", "yt": {"id": "_1AF8eZI0RA", "ch": "TechPrep"}}, {"kind": "video", "req": false, "label": "Design Ticketmaster, system design interview", "url": "https://www.youtube.com/watch?v=fhdPyoO6aXI", "m": 59, "why": "The long version with the deep dives on holds and the queue for a hot event.", "yt": {"id": "fhdPyoO6aXI", "ch": "Hello Interview"}}, {"kind": "read", "req": true, "label": "Hello Interview: design Ticketmaster", "url": "https://www.hellointerview.com/learn/system-design/problem-breakdowns/ticketmaster", "m": 30, "why": "Written breakdown of the seat hold, the distributed lock with a TTL, and the waiting room."}, {"kind": "read", "req": false, "label": "Kleppmann: how to do distributed locking", "url": "https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html", "m": 20, "why": "Why a lock with a lease is not enough alone and what a fencing token adds."}]}, {"id": "sd-other-prompts", "title": "Other prompts reported", "brief": "Four more prompts reported for the Mercor backend round, each with a core hazard and a first move. A few lines each, so you recognise the shape in the room and reach for the right guide technique. Not full designs.", "points": ["Social feed (stable pagination, deletions, privacy). Hazard: pages that shift while posts are added or removed, so a reader sees duplicates or skips, and a deleted or private post that keeps showing from a cache. Move: cursor pagination on (created_at, id) instead of offsets; fan out on write for normal accounts and on read for huge ones; check privacy and deletion at read time against the source of truth, with tombstones so caches drop the post", "Dataset deep copy (a dataset with its tasks, responses and grades). Hazard: a duplicate copy request, a worker that dies half way, a stale worker that wakes up and writes, and edits during the copy. Move: an idempotency key on the request, a background job with checkpoints and a stored old-to-new id map, a claim with an expiring lease and a fencing token, the copy hidden until a final atomic flip, and cleanup for failed copies", "Check-and-insert for about a million IDs (latency, memory, accuracy). Hazard: check-then-insert is a race, so two requests both see 'not there' and both insert. Move: the database unique key is the truth, with INSERT ... ON CONFLICT DO NOTHING. A hash set of a million 8-byte IDs is about 8 MB and fits in memory; a Bloom filter (about 1.2 MB at a 1% false-positive rate) only skips lookups for IDs that are surely new, and never replaces the constraint", "Project-to-contractor matching (hard eligibility, capacity, cold start, feedback). Hazard: two projects take the same contractor's last free hours, and new contractors with no history never get shown. Move: hard filters first (skills, availability, rate, region), then a ranked top-k; reserve capacity with a conditional update so only one project wins the hours; leave room for exploration of new contractors; feed outcomes back and evaluate on a held-out set", "The common move: find the row two actors both change, put the decision in the database (unique key, conditional update, lease with a fence), make every retry safe with a key, and say what the loser does"], "production": ["In each of these the quiet failure is a duplicate or a stale copy that no error reports, so the design needs an invariant check or reconciliation, not only error alerts."], "figs": [], "links": [{"url": "https://prachub.com/companies/mercor/categories/system-design", "label": "PracHub: reported Mercor system design questions", "why": "The prompts above, with dates. Some pages are thin or locked."}, {"url": "https://prachub.com/interview-questions/design-an-api-to-deep-copy-a-dataset-with-its-tasks-model-responses-and-grades", "label": "PracHub: deep-copy a dataset with its tasks, model responses and grades", "why": "The four parts: copy API and id remapping, large copies as jobs, duplicate requests and leases, edits during the copy."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/real-time/fanout-mode", "label": "Guide: fan-out on write or on read (feed)", "why": "How a post reaches readers."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/scaling-reads/invalidation", "label": "Guide: cache invalidation (feed)", "why": "Making a deletion reach every cache."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/long-running/leases", "label": "Guide: leases (deep copy)", "why": "An expiring claim on the copy job."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/long-running/checkpointing", "label": "Guide: checkpointing (deep copy)", "why": "Resume a large copy instead of restarting."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/contention/single-writer", "label": "Guide: single writer (deep copy)", "why": "One worker owns a copy at a time."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/multi-step/idempotency", "label": "Guide: idempotency keys (deep copy, check-and-insert)", "why": "One copy for a repeated request."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/contention/atomic", "label": "Guide: atomic operations (check-and-insert)", "why": "INSERT ... ON CONFLICT instead of check-then-insert."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/scaling-reads/indexing", "label": "Guide: indexing (check-and-insert)", "why": "A unique index is the exact answer."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/contention/reservation", "label": "Guide: reservation (matching capacity)", "why": "Hold a contractor's hours, then confirm."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/search/topk", "label": "Guide: top-k (matching)", "why": "Rank a short list, not the pool."}, {"url": "../SYSTEM%20DESIGN.html#/designs/job-scheduler/deepdives", "label": "Guide design: job scheduler, deep dives", "why": "Leases, fencing and idempotency worked through in full: the deep-copy answer uses the same moves."}], "mcq": [{"q": "You must check whether an ID exists and insert it if not, for about a million IDs and many concurrent requests. What is the safest core?", "o": ["SELECT, then INSERT if the row is missing", "A unique key and INSERT ... ON CONFLICT DO NOTHING, with a Bloom filter only as an optional shortcut", "A Bloom filter alone", "An in-memory set on each server", "A global lock on the table"], "a": 1, "why": "Check-then-insert is a race. The unique key decides atomically and is exact. A Bloom filter has false positives, so it can skip lookups for new IDs but cannot be the answer."}, {"q": "A deep copy of a large dataset is claimed by a worker that then stalls for a minute. A second worker takes over. What stops the first one from corrupting the copy when it wakes up?", "o": ["Nothing; the last writer wins", "A fencing token: every claim bumps a number, and writes must present the current one", "A longer lease", "Running the copy twice and keeping the better result", "Locking the source dataset"], "a": 1, "why": "A lease alone cannot tell a paused holder from a dead one. The fence is checked where the write lands, so the stale worker is rejected."}], "open": {"q": "Pick one of these: a social feed, a deep copy of a dataset, check-and-insert for a million IDs, or matching projects to contractors. Name the core hazard and your first move.", "probe": "What does the loser of the race see, and which part of your answer would break if a retry arrived twice?", "a": ["Feed: shifting pages and deleted content that stays visible. Cursor pagination, privacy and deletion checked at read time.", "Deep copy: duplicates, dead and stale workers, edits during the copy. Idempotency key, checkpoints with an id map, a lease with a fence, a hidden copy and an atomic flip.", "Check-and-insert: a race on check-then-insert. A unique key with ON CONFLICT is the truth; a Bloom filter is a shortcut.", "Matching: two projects take the same hours. Hard filters, ranked top-k, capacity reserved by a conditional update, exploration for new contractors."]}, "say": ["**For any of these I look for the row two actors both change,** and put the decision in the database.", "**A feed:** cursor pagination so pages do not shift, and privacy and deletion checked at read time.", "**A deep copy:** an idempotency key, a background job with checkpoints, a lease with a fence, and the copy hidden until a final atomic flip.", "**Check-and-insert:** a unique key with ON CONFLICT. A Bloom filter only saves lookups and never replaces it.", "**Matching:** hard filters, ranked top-k, and capacity reserved with a conditional update."], "avoid": ["Using a Bloom filter or an in-memory set as the source of truth for uniqueness."], "res": [{"kind": "video", "req": true, "label": "Design a news feed, system design interview", "url": "https://www.youtube.com/watch?v=Qj4-GruzyDU", "m": 27, "why": "Fan-out on write against read, and how pages stay stable while posts change.", "yt": {"id": "Qj4-GruzyDU", "ch": "Hello Interview"}}, {"kind": "video", "req": false, "label": "Fencing tokens", "url": "https://www.youtube.com/watch?v=1At8wV8fwp8", "m": 9, "why": "Leases and fencing: why an expired holder must n
