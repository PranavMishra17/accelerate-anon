<style>
/* Reader-view principles: one calm column, type and space carry the hierarchy,
   no boxes, badges or pills, and colour only where it means something. */
:root {
  --bg: #FFFFFF; --ink: #15141A; --soft: #3F3E48; --muted: #6B6A76; --rule: #E3E2E8;
  --accent: #0A5BD3; --ok: #1A7F4B; --tint: #F4F4F7;
  --paper2: #F1F0EC; --script: #1B1A20; --script-muted: #6A6873;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
  --top: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1C1B22; --ink: #EDEDF2; --soft: #C9C8D3; --muted: #9C9BA8; --rule: #33323C;
  --accent: #7AB2FF; --ok: #5BC98E; --tint: #25242D; --paper2: #E6E4DF; --script: #1B1A20; --script-muted: #66646E; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1C1B22; --ink: #EDEDF2; --soft: #C9C8D3; --muted: #9C9BA8; --rule: #33323C;
  --accent: #7AB2FF; --ok: #5BC98E; --tint: #25242D; --paper2: #E6E4DF; --script: #1B1A20; --script-muted: #66646E; color-scheme: dark; }
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top) + 24px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.72 var(--body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
code { font-family: var(--mono); font-size: 0.86em; background: var(--tint); padding: 1px 5px; border-radius: 4px; }
strong { font-weight: 700; }
h1, h2, h3, h4 { font-family: var(--body); font-weight: 700; line-height: 1.25; margin: 0; }
p { margin: 0 0 1em; }

/* top bar: quiet */
.top { position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: 1px solid var(--rule); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 0 28px; height: var(--top); display: flex; align-items: center; gap: 22px; }
.home { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); font-weight: 700; font-size: 16px; }
.home img { border-radius: 5px; }
.top .loopname { color: var(--muted); font-size: 16px; }
.tabs { display: flex; gap: 4px; }
.tabs a { color: var(--muted); font-size: 16px; padding: 16px 10px 14px; border-bottom: 2px solid transparent; }
.tabs a:hover { color: var(--ink); text-decoration: none; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
.top .grow { flex: 1; }
.prog, .count { font-size: 15px; color: var(--muted); white-space: nowrap; }

/* layout: a narrow reading column, a quiet contents list beside it */
.shell { max-width: 1180px; margin: 0 auto; padding: 0 28px 160px; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 64px; }
nav.side { position: sticky; top: calc(var(--top) + 36px); align-self: start; padding-top: 44px; font-size: 15px; line-height: 1.45; max-height: calc(100vh - var(--top) - 50px); overflow-y: auto; }
nav.side a { display: block; padding: 5px 0; color: var(--muted); }
nav.side a:hover { color: var(--ink); text-decoration: none; }
nav.side a.on { color: var(--ink); font-weight: 700; }
nav.side .sub { padding-left: 14px; font-size: 14.5px; }
nav.side .ok { color: var(--ok); }
main { min-width: 0; max-width: 680px; padding-top: 44px; }

section.block { margin-bottom: 72px; }
.kicker { font-size: 15px; color: var(--muted); margin-bottom: 6px; }
h1 { font-size: 36px; letter-spacing: -0.01em; }
h2 { font-size: 27px; letter-spacing: -0.005em; margin-bottom: 22px; }
h3 { font-size: 21px; margin-bottom: 6px; }

.lead { font-size: 20px; color: var(--soft); margin: 14px 0 0; }
.facts { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 6px 16px; margin: 26px 0 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.bar { margin-top: 26px; color: var(--soft); }
.bar b { color: var(--ink); }

/* the plan: a plain list */
.day { margin-bottom: 26px; }
.day h3 { font-size: 15px; font-weight: 400; color: var(--muted); margin-bottom: 4px; }
.srow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--rule); color: var(--ink); }
.srow:hover { text-decoration: none; }
.srow:hover .nm { color: var(--accent); }
.srow .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--muted); display: inline-block; font-size: 0; }
.srow.done .dot { background: var(--ok); border-color: var(--ok); }
.srow .nm { font-weight: 700; }
.srow .bl { display: block; font-size: 16px; color: var(--muted); }
.srow .hrs { font-size: 15px; color: var(--muted); }

/* scripts and answers: prose, nothing around it */
.script { margin: 0 0 48px; }
.meta { font-size: 16px; color: var(--muted); margin: 0 0 14px; }
.script p, .qa p { color: var(--ink); }
.avoid { font-size: 16px; color: var(--muted); font-style: italic; }
.qgroup { font-size: 15px; font-weight: 400; color: var(--muted); margin: 48px 0 18px; padding-top: 18px; border-top: 1px solid var(--rule); }
.qa { margin: 0 0 40px; }
.land { font-size: 17px; color: var(--soft); }
.land b { color: var(--ink); }
.filter { width: 100%; font: inherit; font-size: 17px; padding: 10px 0; border: 0; border-bottom: 1px solid var(--rule); background: transparent; color: var(--ink); margin-bottom: 8px; }
.filter:focus { outline: none; border-bottom-color: var(--ink); }
.ask { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.ask .to { display: block; font-size: 15px; color: var(--muted); }
.trap { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.trap b { display: block; }
.trap span { color: var(--soft); }

/* what you say: a transcript on its own light panel, in a serif, so it never reads like the headings */
details.item { border-bottom: 1px solid var(--rule); }
details.item > summary { list-style: none; cursor: pointer; padding: 16px 34px 16px 0; position: relative; }
details.item > summary::-webkit-details-marker { display: none; }
details.item > summary::after { content: ""; position: absolute; right: 6px; top: 24px; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s ease; }
details.item[open] > summary::after { transform: rotate(-135deg); top: 28px; }
details.item > summary:hover .qt { color: var(--accent); }
.qt { display: block; font-weight: 700; font-size: 19px; line-height: 1.4; color: var(--ink); }
.qm { display: block; font-size: 15px; color: var(--muted); margin-top: 3px; }
.transcript { background: var(--paper2); color: var(--script); border-radius: 8px; padding: 22px 28px 20px; margin: 2px 0 22px;
  font-family: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif; font-size: 18.5px; line-height: 1.68; }
.transcript .who { font-family: var(--body); font-size: 13px; letter-spacing: .02em; color: var(--script-muted); margin-bottom: 8px; }
.transcript .beat { margin: 0 0 16px; }
.transcript .beat:last-of-type { margin-bottom: 0; }
.transcript .line { display: block; }
.transcript .line + .line { padding-left: 1.4em; }
.transcript strong { font-weight: 700; color: var(--script); }
.transcript code { background: rgba(0,0,0,.06); color: var(--script); }
.transcript .note { font-family: var(--body); font-size: 15px; color: var(--script-muted); margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,.1); }
.transcript .note b { color: var(--script); }
.bulk { display: flex; gap: 14px; margin: -8px 0 10px; font-size: 15px; }
.bulk button { background: none; border: 0; padding: 0; color: var(--accent); }

/* buttons: small and plain */
.acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
.btn { border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 6px; padding: 7px 14px; font-size: 16px; display: inline-block; }
.btn:hover { border-color: var(--ink); text-decoration: none; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .88; }

/* practise aloud */
.drill { padding: 22px 0 26px; border-top: 1px solid var(--rule); }
.drill .p { font-weight: 700; font-size: 19px; }
.drill .t { font-size: 15px; color: var(--muted); }
.timer { font-family: var(--mono); font-size: 17px; color: var(--muted); margin-left: auto; }
.timer.over { color: #D9480F; }
textarea { width: 100%; min-height: 130px; font: inherit; font-size: 17px; line-height: 1.6; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 6px; background: transparent; color: var(--ink); resize: vertical; margin-top: 12px; }
textarea:focus { outline: none; border-color: var(--muted); }
.hint { font-size: 14px; color: var(--muted); margin-top: 4px; }
.attempts .at { padding: 8px 0 8px 14px; border-left: 2px solid var(--rule); margin: 10px 0; white-space: pre-wrap; font-size: 16px; color: var(--soft); }
.attempts .at small { display: block; color: var(--muted); font-size: 13.5px; }
.when { color: var(--muted); font-size: 16px; }

/* mocks: the read, then the conversation. Colour means one of two things here: who is
   speaking (a rule beside the question), and the verdict (a small dot). */
:root { --hamza: #9A5B13; --alex: #2F6DB5; --v-landed: var(--ok); --v-partly: #B7791F; --v-missed: #C23B22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hamza: #E0A55C; --alex: #7AB2FF; --v-partly: #E3B25C; --v-missed: #F07A63; } }
:root[data-theme="dark"] { --hamza: #E0A55C; --alex: #7AB2FF; --v-partly: #E3B25C; --v-missed: #F07A63; }
.vd { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: var(--muted); }
.vd-landed { background: var(--v-landed); } .vd-partly { background: var(--v-partly); }
.vd-missed, .vd-gap { background: var(--v-missed); } .vd-gap { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--v-missed); }
.sep { display: inline-block; width: 1px; height: 14px; background: var(--rule); margin: 0 14px; vertical-align: -2px; }
.mk-tally { font-size: 16px; color: var(--soft); margin: 4px 0 22px; }
.mk-read { font-size: 18.5px; color: var(--ink); }
.mk-h { font-size: 15px; font-weight: 700; color: var(--muted); margin: 26px 0 8px; }
.mk-list { margin: 0; padding-left: 22px; font-size: 17px; line-height: 1.6; }
.mk-list li { margin: 0 0 8px; padding-left: 4px; }
.mk-list a { font-size: 15px; margin-left: 6px; white-space: nowrap; }
.mk-good li::marker { color: var(--v-landed); } .mk-bad li::marker { color: var(--v-missed); }
.ex-q { display: block; border-left: 3px solid var(--rule); padding: 1px 0 1px 16px; font-size: 19px; font-weight: 700; line-height: 1.5; color: var(--ink); }
.ex-q.spk-hamza { border-left-color: var(--hamza); } .ex-q.spk-alex { border-left-color: var(--alex); }
.ex-who { display: block; font-size: 13.5px; letter-spacing: .03em; font-weight: 700; margin-bottom: 3px; color: var(--muted); }
.spk-hamza .ex-who, .tw.spk-hamza { color: var(--hamza); } .spk-alex .ex-who, .tw.spk-alex { color: var(--alex); }
.ex-said { margin: 0 0 8px; padding-left: 14px; border-left: 2px solid var(--rule); color: var(--soft); font-size: 16.5px; }
.ex-links { margin: 20px 0 0; font-size: 15px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-size: 15px; white-space: nowrap; }
.linkish:hover { text-decoration: underline; text-underline-offset: 3px; }

/* the turn list: one row per turn, on the page and in the conversation's rail */
.turns { list-style: none; margin: 18px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.turn { display: grid; grid-template-columns: 26px 16px minmax(0, 1fr) auto; align-items: baseline; gap: 6px; width: 100%; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 11px 6px; color: var(--ink); font-size: 16.5px; line-height: 1.4; }
.turn:hover .tl { color: var(--accent); }
.turn .n { color: var(--muted); font-size: 14.5px; font-variant-numeric: tabular-nums; }
.turn .tw { font-size: 13.5px; font-weight: 700; }

/* the conversation: one screen, turns on the left, the chosen turn on the right */
dialog.convo { width: min(1320px, 96vw); height: min(900px, 92vh); max-width: none; max-height: none; border: 0; border-radius: 10px; padding: 0;
  background: var(--bg); color: var(--ink); box-shadow: 0 24px 60px rgba(0,0,0,.35); overflow: hidden; }
dialog.convo::backdrop { background: rgba(10, 10, 14, 0.6); }
.cv { display: grid; grid-template-columns: 270px minmax(0, 1fr); height: 100%; }
.cv-rail { border-right: 1px solid var(--rule); overflow-y: auto; padding: 18px 12px 18px 16px; display: flex; flex-direction: column; }
.cv-title { padding: 0 6px 14px; border-bottom: 1px solid var(--rule); font-size: 15px; line-height: 1.4; }
.cv-title span { display: block; color: var(--muted); font-size: 13.5px; margin-top: 3px; }
.cv-rail .turn { border-radius: 6px; border-bottom: 0; margin-top: 2px; font-size: 15.5px; padding: 9px 8px; }
.cv-rail .turn.on { background: var(--tint); }
.cv-rail .turn.on .tl { font-weight: 700; }
.cv-keys { margin-top: auto; padding: 14px 6px 0; font-size: 13.5px; color: var(--muted); }
.cv-pane { display: flex; flex-direction: column; min-height: 0; }
.cv-head { padding: 22px 110px 16px 28px; border-bottom: 1px solid var(--rule); flex: none; }
.cv-verdict { margin: 12px 0 0 19px; font-size: 16px; color: var(--soft); line-height: 1.5; }
.cv-verdict b { color: var(--ink); }
.cv-tests { margin: 4px 0 0 19px; font-size: 15px; color: var(--muted); }
.cv-tests b { color: var(--soft); font-weight: 700; }
.cv-cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); flex: 1; min-height: 0; }
.cv-col { overflow-y: auto; padding: 20px 28px 32px; }
.cv-said { border-right: 1px solid var(--rule); }
.cv-h { font-size: 15px; font-weight: 700; color: var(--muted); margin: 0 0 12px; }
.cv-col .lab { font-size: 14px; font-weight: 700; color: var(--muted); margin: 20px 0 8px; }
.cv-col .mk-list { font-size: 16px; }
.cv-land { font-size: 17.5px; margin: 0 0 14px; padding: 12px 14px; background: var(--tint); border-radius: 6px; }
.cv-say .transcript { font-size: 17.5px; padding: 18px 22px; margin: 0; }
.cv-col figure { padding: 12px; margin: 18px 0 0; }
.cv-col figure svg { min-width: 0; }
.cv-close { position: absolute; top: 16px; right: 18px; z-index: 2; background: transparent; border: 1px solid var(--rule); color: var(--soft);
  border-radius: 6px; padding: 5px 12px; font-size: 14.5px; }
.cv-close:hover { color: var(--ink); border-color: var(--ink); }
@media (max-width: 860px) {
  dialog.convo { width: 100vw; height: 100vh; border-radius: 0; }
  .cv { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .cv-rail { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--rule); }
  .cv-cols { grid-template-columns: minmax(0, 1fr); overflow-y: auto; }
  .cv-col { overflow: visible; }
  .cv-said { border-right: 0; border-bottom: 1px solid var(--rule); }
  .cv-head { padding-right: 90px; }
}

/* design */
figure { margin: 26px 0 34px; padding: 18px; background: #FFFFFF; color: #15141A; border-radius: 8px; overflow-x: auto; }
figure svg { display: block; width: 100%; height: auto; min-width: 620px; }
figcaption { font-size: 15.5px; color: #55545F; margin-top: 12px; }
table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 16.5px; }
th, td { text-align: left; padding: 9px 12px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 400; color: var(--muted); font-size: 15px; }
td:first-child { font-weight: 700; padding-right: 20px; }
.tnote { font-size: 15.5px; color: var(--muted); margin: 8px 0 34px; }

/* sessions */
.session .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.chip { color: var(--muted); }
.chip.done { color: var(--ok); }
.session .intro { font-size: 19px; color: var(--soft); margin: 14px 0 12px; }
.step { border-top: 1px solid var(--rule); }
.step > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 16px 30px 16px 0; position: relative; }
.step > summary::-webkit-details-marker { display: none; }
.step > summary::after { content: ""; position: absolute; right: 6px; top: 24px; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); }
.step[open] > summary::after { transform: rotate(-135deg); top: 28px; }
.step > summary .st { font-weight: 700; font-size: 18px; line-height: 1.4; }
.step > summary:hover .st { color: var(--accent); }
.step > summary .sm { color: var(--muted); font-size: 14.5px; padding-top: 3px; white-space: nowrap; }
.tick { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--muted); background: transparent; color: var(--bg); display: grid; place-items: center; font-size: 13px; margin-top: 3px; padding: 0; cursor: pointer; }
.tick.on { background: var(--ok); border-color: var(--ok); }
.sbody { padding: 0 0 24px 44px; font-size: 17px; line-height: 1.65; }
.sbody > p.d { margin: 0 0 4px; }
.sbody > p.point { margin: 0 0 4px; font-size: 18px; }
.sbody .lab { font-size: 14px; font-weight: 700; color: var(--muted); margin: 20px 0 6px; }
.reading { margin: 0; padding: 0; list-style: none; font-size: 16px; line-height: 1.5; }
.reading li { margin: 0 0 10px; padding-left: 14px; position: relative; }
.reading li::before { content: ""; position: absolute; left: 0; top: .7em; width: 5px; height: 1.5px; background: var(--muted); }
.reading a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.reading a:hover { text-decoration-color: var(--ink); }
.reading .w { color: var(--muted); font-size: 14px; margin-left: 8px; white-space: nowrap; }
.reading .why { display: block; color: var(--soft); font-size: 14px; margin-top: 2px; }
.sbody figure { margin: 16px 0 6px; }
details.say { margin-top: 22px; }
details.say > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; font-size: 14.5px; font-weight: 700; color: var(--soft); padding: 7px 14px; border: 1px solid var(--rule); border-radius: 6px; }
details.say > summary::-webkit-details-marker { display: none; }
details.say > summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin-top: -3px; }
details.say[open] > summary::after { transform: rotate(-135deg); margin-top: 3px; }
details.say > summary:hover { color: var(--ink); border-color: var(--muted); }
details.say .transcript { margin-top: 12px; }
details.item > .sbody { padding-left: 0; }
@media (max-width: 700px) { .sbody { padding-left: 0; } }
/* the tracker's own figures, drawn with its classes, always on white */
figure.trk { --faint: #a2a09a; --dim: #6b6a65; --line: #c3c0b7; --ink: #1a1a19; --live: #fffdf5; }
figure .fh { font-weight: 700; font-size: 15.5px; margin-bottom: 8px; }
.session-end { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 26px; }
.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--rule); }
.pager a { display: flex; flex-direction: column; color: var(--ink); font-weight: 700; max-width: 48%; }
.pager a span { font-weight: 400; font-size: 14.5px; color: var(--muted); }
.pager a.next { text-align: right; margin-left: auto; }
.pager a:hover { color: var(--accent); text-decoration: none; }

/* quiz: one question at a time */
dialog { width: min(640px, 94vw); border: 0; border-radius: 10px; padding: 0; background: var(--bg); color: var(--ink); box-shadow: 0 24px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10, 10, 14, 0.55); }
.dq { padding: 28px 30px 24px; }
.dq .dots { display: flex; gap: 5px; margin-bottom: 18px; }
.dq .dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--rule); }
.dq .dots i.on { background: var(--ink); }
.dq .dots i.got { background: var(--ok); }
.dq .qq { font-size: 21px; font-weight: 700; line-height: 1.35; }
.dq .model { margin-top: 16px; padding-left: 14px; border-left: 2px solid var(--ok); color: var(--soft); }
.dq .model b { display: block; font-size: 14.5px; color: var(--ok); font-weight: 700; }
.dq .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
.dq .row .grow { flex: 1; }
.dq .close { background: none; border: 0; color: var(--muted); font-size: 15px; }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 20px 120px; }
  nav.side { display: none; }
  .top-in { padding: 0 16px; gap: 10px; }
  .top .loopname, .prog, .count { display: none; }
  .tabs a { padding: 16px 6px 14px; font-size: 15px; }
  body { font-size: 17.5px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="home" href="../index.html#/wild"><img src="../brand/accelerate.svg" width="28" height="28" alt="">Accelerate</a>
  <span class="loopname" id="loopname"></span>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <span class="grow"></span>
  <span class="prog" id="prog"></span>
  <span class="count" id="count"></span>
</div></header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<dialog id="quiz" aria-label="Quiz"></dialog>
<dialog id="convo" class="convo" aria-label="Mock conversation"></dialog>
<script src="../figures/icons.js"></script>
<script src="../figures/figures.js"></script>
<script src="../figures/notes.js"></script>
<script src="../figures/viewer.js"></script>
<script type="application/json" id="loop-data">{{DATA}}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }
    var sm = el("summary", "", '<span class="qt">' + inl(title) + "</span>" + (meta ? '<span class="qm">' + meta + "</span>" : ""));
    d.appendChild(sm); d.appendChild(body);
    return d;
  }
  function bulk(host) {
    var b = el("div", "bulk");
    var o = el("button", "", "Open all"), c = el("button", "", "Close all");
    o.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = true; }); });
    c.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = false; }); });
    b.appendChild(o); b.appendChild(c);
    host.appendChild(b);
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });
    (s.study || []).forEach(function (_, i) { k.push(s.id + ":s" + i); });
    return k;
  }
  function isDone(t, s) { return !!t.done[s.id]; }
  function link(tab, anchor) { return "#/" + tab + (anchor ? "/" + anchor : ""); }
  /* A drill's reference is either a route already or an anchor on the prep tab. */
  function prepRef(r) { return r.indexOf("#/") === 0 ? r : link("prep", r.replace(/^#/, "")); }

  /* ---------------------------------------------------------------- tabs */
  var TABS = [
    { id: "overview", label: "Overview", show: function () { return true; } },
    { id: "prep", label: "Prep", show: function () { return LOOP.scripts.length || LOOP.drills.length || LOOP.qa.length || LOOP.ask.length; } },
    { id: "design", label: "Design", show: function () { return LOOP.tables.length || LOOP.figures.length; } },
    { id: "own", label: (LOOP.own && LOOP.own.tab) || "Yours", show: function () { return !!LOOP.own; } },
    { id: "sessions", label: "Sessions", show: function () { return LOOP.sessions.length; } },
    { id: "mocks", label: "Mocks", show: function () { return !!LOOP.mockHow; } }
  ].filter(function (t) { return t.show(); });
  var main = document.getElementById("main");
  var side = document.getElementById("side");
  var nav = [];            /* side links for the current tab: [anchor, label, sub] */

  function heading(host, id, kicker, title, sub) {
    var s = el("section", "block"); s.id = id;
    if (kicker) { s.appendChild(el("div", "kicker", esc(kicker))); }
    if (title) { s.appendChild(el("h2", "", esc(title))); }
    host.appendChild(s);
    nav.push([id, title || kicker, !!sub]);
    return s;
  }

  /* ---------------------------------------------------------------- overview */
  function tabOverview(host) {
    var s = el("section", "block"); s.id = "brief";
    s.appendChild(el("div", "kicker", esc(LOOP.subtitle)));
    s.appendChild(el("h1", "", esc(LOOP.title)));
    s.appendChild(el("p", "lead", esc(LOOP.format)));
    var dl = el("dl", "facts");
    dl.innerHTML = "<dt>When</dt><dd>" + esc(LOOP.when) + "</dd><dt>Who</dt><dd>" + esc(LOOP.who) + "</dd>";
    s.appendChild(dl);
    if (LOOP.bar) { s.appendChild(el("p", "bar", "<b>The bar.</b> " + inl(LOOP.bar))); }
    if (LOOP.extra) { s.appendChild(el("div", "lead", LOOP.extra)); }
    host.appendChild(s);
    nav.push(["brief", "The brief"]);
    if (!LOOP.sessions.length) { return; }

    var p = heading(host, "plan", LOOP.planKicker || "", "The plan");
    var t = tracker();
    var days = {}, order = [];
    LOOP.sessions.forEach(function (x) {
      if (!days[x.day]) { days[x.day] = []; order.push(x.day); }
      days[x.day].push(x);
    });
    var wrap = el("div", "days");
    order.forEach(function (d) {
      var box = el("div", "day");
      box.appendChild(el("h3", "", esc(d)));
      days[d].forEach(function (x) {
        var a = el("a", "srow" + (isDone(t, x) ? " done" : ""));
        a.href = link("sessions", x.id);
        a.innerHTML = '<span class="dot"></span><span><span class="nm">' + esc(x.name) +
          '</span><span class="bl">' + esc(x.blurb.replace(/^(Friday|Saturday|Sunday)[^.]*\.\s*/, "")) + '</span></span><span class="hrs">' + esc(x.len) + "</span>";
        box.appendChild(a);
      });
      wrap.appendChild(box);
    });
    p.appendChild(wrap);
    var go = el("div", "acts");
    TABS.filter(function (x) { return x.id !== "overview"; }).forEach(function (x) {
      var a = el("a", "btn", esc(x.label)); a.href = link(x.id); go.appendChild(a);
    });
    p.appendChild(go);
  }

  /* ---------------------------------------------------------------- prep */
  function tabPrep(host) {
    if (LOOP.scripts.length) {
      var s = heading(host, "say", "In the words to say it", "Say it");
      bulk(s);
      LOOP.scripts.forEach(function (x) {
        var drill = LOOP.drills.some(function (d) { return d.id === x.id; });
        var meta = inl(x.when) + " " + esc(x.length.charAt(0).toUpperCase() + x.length.slice(1)) + ".";
        var note = (x.never && x.never.length ? "<b>Avoid.</b> " + x.never.map(inl).join(" ") : "") +
          (drill ? (x.never && x.never.length ? " " : "") + '<a href="' + link("prep", "drill-" + x.id) + '">Practise it aloud, timed</a>' : "");
        s.appendChild(item("say-" + x.id, x.title, meta, transcript(x.say, "You", note)));
        nav.push(["say-" + x.id, x.title, true]);
      });
    }
    if (LOOP.drills.length) { drills(heading(host, "practise", "One question, out loud", "Practise aloud")); }
    if (LOOP.qa.length) { qa(heading(host, "qa", "Where a technical round goes down", "Technical questions")); }
    if (LOOP.ask.length) {
      var a = heading(host, "ask", "One at a time, then wait", "Questions to ask");
      LOOP.ask.forEach(function (x) { a.appendChild(el("div", "ask", '<span class="to">' + esc(x.to) + "</span><span>" + inl(x.q) + "</span>")); });
    }
    if (LOOP.traps.length) {
      var t = heading(host, "traps", "What cost points last time", "Traps");
      LOOP.traps.forEach(function (x) { t.appendChild(el("div", "trap", "<b>" + esc(x[0]) + "</b><span>" + inl(x[1]) + "</span>")); });
    }
  }

  function drills(s) {
    s.appendChild(el("p", "lead", "Pick one. Start the timer, answer out loud with Win+H dictating into the box, stop, save. Then read the script and say what you missed. The page keeps your last three attempts for each."));
    LOOP.drills.forEach(function (d) {
      var c = el("div", "drill"); c.id = "drill-" + d.id;
      var head = el("div", "acts"); head.style.marginTop = "0";
      head.appendChild(el("span", "", '<span class="p">' + esc(d.prompt) + '</span><br><span class="t">Aim for ' + esc(d.target) + "</span>"));
      var timer = el("span", "timer", "0:00");
      head.appendChild(timer);
      c.appendChild(head);
      var ta = el("textarea"); ta.placeholder = "Press Win+H and speak, or type. What you actually said, not what you meant to say.";
      c.appendChild(ta);
      c.appendChild(el("div", "hint", "Win+H starts Windows voice typing in this box."));
      var acts = el("div", "acts");
      var start = el("button", "btn primary", "Start timer");
      var save = el("button", "btn", "Save attempt");
      var see = el("a", "btn", "Read the script"); see.href = prepRef(d.ref);
      acts.appendChild(start); acts.appendChild(save); acts.appendChild(see);
      c.appendChild(acts);
      var list = el("div", "attempts");
      c.appendChild(list);
      var t0 = null, tick = null, secs = 0;
      function fmt(n) { return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); }
      start.addEventListener("click", function () {
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; return; }
        t0 = Date.now(); secs = 0; start.textContent = "Stop";
        tick = setInterval(function () {
          secs = Math.round((Date.now() - t0) / 1000);
          timer.textContent = fmt(secs);
          timer.classList.toggle("over", secs > d.seconds);
        }, 250);
        ta.focus();
      });
      function draw() {
        list.innerHTML = "";
        (own().drills[d.id] || []).slice().reverse().forEach(function (at) {
          list.appendChild(el("div", "at", "<small>" + esc(at.at) + (at.secs ? ", " + fmt(at.secs) : "") + "</small>" + esc(at.text)));
        });
      }
      save.addEventListener("click", function () {
        if (!ta.value.trim()) { ta.focus(); return; }
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; }
        var st = own();
        var arr = st.drills[d.id] || [];
        arr.push({ at: stamp(), secs: secs, text: ta.value.trim() });
        st.drills[d.id] = arr.slice(-3);
        writeJSON(OWN, st);
        ta.value = ""; timer.textContent = "0:00"; timer.classList.remove("over"); secs = 0;
        draw();
      });
      draw();
      s.appendChild(c);
    });
  }

  function qa(s) {
    var f = el("input", "filter"); f.type = "search"; f.placeholder = "Filter questions, for example SQLite, queue, LangGraph";
    s.appendChild(f);
    bulk(s);
    var items = [];
    LOOP.qa.forEach(function (g, gi) {
      var gh = el("h3", "qgroup", esc(g.group)); gh.id = "qa-" + gi; s.appendChild(gh);
      nav.push(["qa-" + gi, g.group, true]);
      g.items.forEach(function (q) {
        var qb = el("div", "sbody");
        if (q.land) { qb.appendChild(el("p", "point", "<b>The point.</b> " + inl(q.land))); }
        learn(qb, q.learn || {});
        qb.appendChild(sayToggle("What you would say", transcript(q.a, "You", "")));
        var c = item(q.id || null, q.q, q.tests ? "They are testing: " + inl(q.tests.charAt(0).toLowerCase() + q.tests.slice(1)) : "", qb);
        s.appendChild(c);
        items.push({ node: c, text: (q.q + " " + q.a.join(" ")).toLowerCase() });
      });
    });
    f.addEventListener("input", function () {
      var v = f.value.trim().toLowerCase();
      items.forEach(function (it) { it.node.hidden = v && it.text.indexOf(v) < 0; if (v && !it.node.hidden) { it.node.open = true; } });
    });
  }

  /* ---------------------------------------------------------------- design */
  function tabDesign(host) {
    var s = heading(host, "mech", "Read from source", LOOP.mechTitle || "Mechanisms");
    if (LOOP.kitaruLead) { s.appendChild(el("p", "lead", inl(LOOP.kitaruLead))); }
    if (LOOP.designLink) {
      var more = el("p", "lead");
      more.innerHTML = esc(LOOP.designLink.text) + ' <a href="' + esc(LOOP.designLink.href) + '" target="_blank" rel="noopener">' + esc(LOOP.designLink.label) + "</a>.";
      s.appendChild(more);
    }
    if (LOOP.figures.length) {
      var d = heading(host, "diagrams", "The system, drawn", "Diagrams");
      LOOP.figures.forEach(function (k, i) {
        var f = figNode(k, 0);
        if (f) { f.id = "fig-" + i; d.appendChild(f); }
      });
    }
    if (LOOP.tables.length) {
      var t = heading(host, "tables", "What they will probe", "Mechanisms, as tables");
      LOOP.tables.forEach(function (tb, i) {
        var h = el("h3", "", esc(tb.title)); h.id = "tb-" + i; t.appendChild(h);
        nav.push(["tb-" + i, tb.title, true]);
        var table = el("table");
        table.innerHTML = "<thead><tr>" + tb.head.map(function (x) { return "<th>" + esc(x) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          tb.rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + inl(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody>";
        t.appendChild(table);
        t.appendChild(el("p", "tnote", inl(tb.note || "")));
      });
    }
    if (LOOP.admire) { host.appendChild(el("p", "bar", "<b>Admire first.</b> " + inl(LOOP.admire))); }
  }

  /* ---------------------------------------------------------------- your own system, then set against theirs */
  function ownItem(host, id, x) {
    var b = el("div", "sbody");
    b.appendChild(el("p", "point", "<b>The point.</b> " + inl(x.point)));
    learn(b, x.learn || {});
    b.appendChild(sayToggle("What you would say", transcript(x.say, "You", "")));
    host.appendChild(item(id, x.title, x.meta ? esc(x.meta.charAt(0).toUpperCase() + x.meta.slice(1)) + "." : "", b));
    nav.push([id, x.title, true]);
  }
  function tabOwn(host) {
    var A = LOOP.own;
    var s = heading(host, "own", A.kicker, A.title);
    A.lead.forEach(function (p) { s.appendChild(el("p", "lead", inl(p))); });
    bulk(s);
    A.parts.forEach(function (p) { ownItem(s, "own-" + p.id, p); });
    if (A.numbers && A.numbers.length) {
      var n = heading(host, "numbers", "Reach for a number unprompted", "Numbers to have ready");
      var dl = el("dl", "facts");
      dl.innerHTML = A.numbers.map(function (r) { return "<dt>" + esc(r[0]) + "</dt><dd>" + inl(r[1]) + "</dd>"; }).join("");
      n.appendChild(dl);
    }
    if (A.compare) {
      var c = heading(host, "against", "Two designs, one seam", "Against Kitaru");
      (A.compare_figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.appendChild(f); } });
      var table = el("table");
      table.innerHTML = "<thead><tr>" + A.compare.head.map(function (x) { return "<th>" + esc(x) + "</th>"; }).join("") + "</tr></thead><tbody>" +
        A.compare.rows.map(function (r) { return "<tr>" + r.map(function (x) { return "<td>" + inl(x) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody>";
      c.appendChild(table);
      (A.bridges || []).forEach(function (x) { ownItem(c, x.id, x); });
    }
  }

  /* ---------------------------------------------------------------- sessions, one at a time */
  function tabSessions(host, which) {
    var t = tracker();
    var idx = 0;
    LOOP.sessions.forEach(function (x, i) { if (x.id === which) { idx = i; } });
    if (!which) {
      var firstOpen = LOOP.sessions.findIndex(function (x) { return !isDone(t, x); });
      idx = firstOpen < 0 ? 0 : firstOpen;
    }
    LOOP.sessions.forEach(function (x, i) {
      nav.push(["s-" + x.id, x.name, false, link("sessions", x.id), i === idx, isDone(t, x)]);
    });
    var x = LOOP.sessions[idx];
    var box = el("div", "session"); box.id = "s-" + x.id;
    box.appendChild(el("div", "kicker", esc(x.day) + ", session " + (idx + 1) + " of " + LOOP.sessions.length));
    box.appendChild(el("h2", "", esc(x.name)));
    var meta = el("div", "meta");
    meta.innerHTML = "<span>" + esc(x.len) + "</span>" + (isDone(t, x) ? '<span class="chip done">Done ' + esc(t.done[x.id]) + "</span>" : "");
    box.appendChild(meta);
    if (x.intro) { box.appendChild(el("p", "intro", inl(x.intro))); }
    (x.figs || []).forEach(function (k, i) { var f = figNode(k, i + 1); if (f) { box.appendChild(f); } });
    bulk(box);
    x.steps.forEach(function (st, i) { box.appendChild(stepNode(x.id + ":" + i, st, false)); });
    if (x.study && x.study.length) {
      box.appendChild(el("h3", "", "What to know for it"));
      x.study.forEach(function (it, i) { box.appendChild(stepNode(x.id + ":s" + i, it, true)); });
    }
    var end = el("div", "session-end");
    if (x.quiz.length) {
      var q = el("button", "btn primary", "Quiz this session, " + x.quiz.length + " questions");
      q.addEventListener("click", function () { openQuiz(x); });
      end.appendChild(q);
    }
    var d = el("button", "btn", isDone(t, x) ? "Mark not done" : "Mark the whole session done");
    d.addEventListener("click", function () { toggleSession(x); });
    end.appendChild(d);
    box.appendChild(end);
    var pager = el("div", "pager");
    var prev = LOOP.sessions[idx - 1], next = LOOP.sessions[idx + 1];
    pager.innerHTML = (prev ? '<a href="' + link("sessions", prev.id) + '"><span>Previous</span>' + esc(prev.name) + "</a>" : '<a href="' + link("overview", "plan") + '"><span>Back to</span>The plan</a>') +
      (next ? '<a class="next" href="' + link("sessions", next.id) + '"><span>Next</span>' + esc(next.name) + "</a>" : '<a class="next" href="' + link("mocks") + '"><span>Then</span>A mock interview</a>');
    box.appendChild(pager);
    host.appendChild(box);
  }

  /* Figures come from ../figures/figures.js by key, the same registry the tracker draws from. */
  function figNode(k, n) {
    var f = window.FIGURES && FIGURES.DIA[k];
    if (!f) { return null; }
    var fig = el("figure", f.fixed ? "" : "trk");
    fig.setAttribute("data-fig", k);
    if (n) { fig.appendChild(el("div", "fh", "Figure " + n + ". " + esc(f.title))); }
    fig.appendChild(el("div", "", f.svg()));
    fig.appendChild(el("figcaption", "", f.cap));
    return fig;
  }
  /* What an item rests on: its figures, what to read (with minutes), and where it sits in
     the system design guide. Shared by session steps and Prep questions. */
  function learn(body, x) {
    (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { body.appendChild(f); } });
    var read = el("ul", "reading"), seen = {};
    (x.read || []).forEach(function (r) {
      var k = r.url || r.book || r.label;
      if (!k || seen[k]) { return; }
      seen[k] = 1;
      read.appendChild(el("li", "", (r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + inl(r.label || r.url) + "</a>" : inl(r.book || r.label)) +
        (r.m ? '<span class="w">' + r.m + " min</span>" : "") + (r.why ? '<span class="why">' + inl(r.why) + "</span>" : "")));
    });
    if (read.children.length) { body.appendChild(el("div", "lab", "Read")); body.appendChild(read); }
    if (x.sdLinks && x.sdLinks.length) {
      body.appendChild(el("div", "lab", "In your system design guide"));
      var sd = el("ul", "reading");
      x.sdLinks.forEach(function (q) {
        sd.appendChild(el("li", "", '<a href="' + esc(q.href) + '" target="_blank" rel="noopener">' + esc(q.label) + "</a>" +
          (q.why ? '<span class="why">' + inl(q.why) + "</span>" : "")));
      });
      body.appendChild(sd);
    }
  }
  function sayToggle(label, node) {
    var d = el("details", "say");
    d.appendChild(el("summary", "", esc(label)));
    d.appendChild(node);
    return d;
  }
  /* A step opens to what it is, what to read, where it sits in the system design guide
     and the figure that draws it. What you would say stays shut until you have tried. */
  function stepNode(key, it, isStudy) {
    var t = tracker();
    var row = el("details", "step");
    var sm = el("summary");
    var tick = el("button", "tick" + (t.steps[key] ? " on" : ""), t.steps[key] ? "&#10003;" : "");
    tick.setAttribute("aria-label", "Mark done: " + it.t);
    tick.addEventListener("click", function (e) {
      e.preventDefault(); e.stopPropagation();
      var tt = tracker();
      if (tt.steps[key]) { delete tt.steps[key]; delete tt.steps[key + ":at"]; }
      else { tt.steps[key] = true; tt.steps[key + ":at"] = stamp(); }
      writeJSON(TRACKER, tt);
      tick.classList.toggle("on", !!tt.steps[key]);
      tick.innerHTML = tt.steps[key] ? "&#10003;" : "";
      progress();
    });
    sm.appendChild(tick);
    sm.appendChild(el("span", "st", inl(it.t)));
    var mins = it.m || (it.do || []).reduce(function (a, d) { return a + (d.m || 0); }, 0);
    sm.appendChild(el("span", "sm", mins ? mins + " min" : ""));
    row.appendChild(sm);

    var body = el("div", "sbody");
    if (!isStudy && it.d) { body.appendChild(el("p", "d", inl(it.d))); }
    learn(body, { figs: it.figs || [] });

    var pre = [];
    if (isStudy && it.do) {
      it.do.forEach(function (d) {
        pre.push({ url: d.url, label: d.a, m: d.m, why: d.where });
      });
    }
    if (!isStudy && (it.where || it.url)) { pre.push(it.url ? { url: it.url, label: it.where || it.url } : { book: it.where }); }
    learn(body, { figs: [], read: pre.concat(isStudy ? (it.res || []) : (it.links || []), it.read || []), sdLinks: it.sdLinks });
    var say = isStudy ? it.say : it.ans;
    if (say) { body.appendChild(sayToggle(isStudy ? "The idea, in the words you would use" : "What you would say", transcript(Array.isArray(say) ? say : [say], "", ""))); }
    row.appendChild(body);
    return row;
  }

  function toggleSession(x) {
    var t = tracker();
    if (t.done[x.id]) {
      delete t.done[x.id];
    } else {
      stepKeys(x).forEach(function (k) { if (!t.steps[k]) { t.steps[k] = true; t.steps[k + ":at"] = stamp(); } });
      if (x.hasTrackerQuiz && !(t.quiz[x.id] && t.quiz[x.id].passed)) {
        t.quiz[x.id] = { score: 0, passed: true, at: stamp(), missed: [], via: "interview page" };
      }
      t.done[x.id] = stamp();
    }
    writeJSON(TRACKER, t);
    route();
  }

  /* ---------------------------------------------------------------- mocks */
  /* A mock reads in two parts: the read (how it went, what landed, what to fix first),
     then the conversation, one exchange at a time. Each exchange shows who asked what and
     what you said, with a verdict; it opens to why, how to approach it, and the answer to
     say, behind the same toggle the Prep tab uses. */
  var VERDICT = { landed: "Landed", partly: "Partly", missed: "Missed", gap: "Gap: you did not have an answer" };
  function tabMocks(host) {
    var s = heading(host, "mock", "Run in chat", "Mock interviews");
    s.appendChild(el("p", "lead", inl(LOOP.mockHow)));
    if (!LOOP.mocks.length) {
      s.appendChild(el("p", "when", "None yet. After a mock in chat, its read and its exchanges appear here. The latest two are kept."));
    }
    LOOP.mocks.slice(-2).reverse().forEach(function (m, mi) { drawMock(host, m, mi); });
  }
  function drawMock(host, m, mi) {
    var pre = m.id || "m" + mi;
    var s = heading(host, pre, m.when, m.title);
    var ex = m.exchanges || [];
    if (!ex.length && m.critique) { s.appendChild(el("p", "", inl(m.critique))); return; }
    var tally = {};
    ex.forEach(function (x) { tally[x.verdict] = (tally[x.verdict] || 0) + 1; });
    s.appendChild(el("p", "mk-tally", ["landed", "partly", "missed", "gap"].filter(function (k) { return tally[k]; })
      .map(function (k) { return '<span class="vd vd-' + k + '"></span>' + tally[k] + " " + (k === "gap" ? "gaps" : k); }).join('<span class="sep"></span>') +
      '<span class="sep"></span>' + ex.length + " exchanges"));
    (m.read || []).forEach(function (p) { s.appendChild(el("p", "mk-read", inl(p))); });
    if (m.landed && m.landed.length) {
      s.appendChild(el("h3", "mk-h", "What landed"));
      var ul = el("ul", "mk-list");
      m.landed.forEach(function (t) { ul.appendChild(el("li", "", inl(t))); });
      s.appendChild(ul);
    }
    if (m.fix && m.fix.length) {
      s.appendChild(el("h3", "mk-h", "Fix these first"));
      var ol = el("ol", "mk-list mk-fix");
      m.fix.forEach(function (f) {
        var li = el("li", "", inl(f.t) + " ");
        var at = ex.findIndex(function (x) { return x.id === f.ref; });
        if (at >= 0) { li.appendChild(openLink("See turn " + (at + 1), m, at)); }
        ol.appendChild(li);
      });
      s.appendChild(ol);
    }
    /* The turns, one line each; the conversation itself opens in one screen. */
    var c = heading(host, pre + "-talk", "Every turn, in one screen", "The conversation");
    var go = el("button", "btn primary", "Open the conversation");
    go.addEventListener("click", function () { openConvo(m, 0); });
    c.appendChild(el("div", "acts")).appendChild(go);
    var list = el("ol", "turns");
    ex.forEach(function (x, i) {
      var li = el("li");
      var b = el("button", "turn");
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) +
        '</span><span class="tw spk-' + esc((x.who || "").toLowerCase()) + '">' + esc(x.who) + "</span>";
      b.addEventListener("click", function () { openConvo(m, i); });
      li.appendChild(b); list.appendChild(li);
    });
    c.appendChild(list);
  }
  function openLink(text, m, i) {
    var a = el("button", "linkish", esc(text));
    a.addEventListener("click", function () { openConvo(m, i); });
    return a;
  }

  /* One screen: the turns on the left, the chosen turn on the right. The turn's header is
     what they asked and how it landed; under it, what you said on the left and what to say
     on the right, each column scrolling on its own. Up and down arrows move; Escape closes. */
  var convo = document.getElementById("convo");
  function openConvo(m, start) {
    var ex = m.exchanges, cur = start || 0;
    convo.innerHTML = "";
    var shell = el("div", "cv");
    var rail = el("nav", "cv-rail");
    rail.appendChild(el("div", "cv-title", "<b>" + esc(m.title) + "</b><span>" + esc(m.when) + "</span>"));
    var items = ex.map(function (x, i) {
      var b = el("button", "turn");
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) +
        '</span><span class="tw spk-' + esc((x.who || "").toLowerCase()) + '">' + esc(x.who) + "</span>";
      b.addEventListener("click", function () { show(i); });
      rail.appendChild(b);
      return b;
    });
    rail.appendChild(el("div", "cv-keys", "Up and down arrows move. Escape closes."));
    var pane = el("section", "cv-pane");
    var close = el("button", "cv-close", "Close");
    close.setAttribute("aria-label", "Close the conversation");
    close.addEventListener("click", function () { convo.close(); });
    shell.appendChild(rail); shell.appendChild(pane);
    convo.appendChild(close); convo.appendChild(shell);

    function section(host, label, nodes) {
      if (!nodes.length) { return; }
      host.appendChild(el("div", "lab", label));
      nodes.forEach(function (n) { host.appendChild(n); });
    }
    function ul(items, cls) {
      var u = el("ul", "mk-list " + (cls || ""));
      (items || []).forEach(function (t) { u.appendChild(el("li", "", inl(t))); });
      return (items && items.length) ? [u] : [];
    }
    function show(i) {
      cur = i;
      var x = ex[i], who = (x.who || "").toLowerCase();
      items.forEach(function (b, j) { b.classList.toggle("on", j === i); if (j === i) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); } });
      items[i].scrollIntoView({ block: "nearest" });
      pane.innerHTML = "";
      var head = el("header", "cv-head");
      head.appendChild(el("div", "ex-q spk-" + who, '<span class="ex-who">Turn ' + (i + 1) + " of " + ex.length + ", " + esc(x.who) + "</span>" + inl(x.q)));
      head.appendChild(el("p", "cv-verdict", '<span class="vd vd-' + esc(x.verdict) + '"></span><b>' + esc(VERDICT[x.verdict] || x.verdict) + ".</b> " + inl(x.why || "")));
      if (x.tests) { head.appendChild(el("p", "cv-tests", "<b>They were testing:</b> " + inl(x.tests))); }
      pane.appendChild(head);
      var cols = el("div", "cv-cols");
      var said = el("div", "cv-col cv-said");
      said.appendChild(el("h3", "cv-h", "What you said"));
      section(said, "In short", (x.said || []).map(function (p) { return el("p", "ex-said", inl(p)); }));
      section(said, "What worked", ul(x.good, "mk-good"));
      section(said, "What did not", ul(x.bad, "mk-bad"));
      var say = el("div", "cv-col cv-say");
      say.appendChild(el("h3", "cv-h", "What to say"));
      if (x.land) { say.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
      if (x.say && x.say.length) { say.appendChild(transcript(x.say, "You", "")); }
      section(say, "How to approach it", ul(x.approach));
      (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { say.appendChild(f); } });
      var links = [];
      if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
      if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
      if (links.length) { say.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      cols.appendChild(said); cols.appendChild(say);
      pane.appendChild(cols);
      said.scrollTop = 0; say.scrollTop = 0;
    }
    convo.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = cur + (e.key === "ArrowDown" ? 1 : -1);
        if (n >= 0 && n < ex.length) { show(n); items[n].focus(); }
      }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    items[cur].focus();
  }

  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    return { tab: tab, anchor: p[1] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = link(t.id);
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = [];
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "mocks") { tabMocks(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    drawTabs(r.tab); drawSide(r.tab); progress();
    var key = r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    var c = document.getElementById("count");
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
</html>
