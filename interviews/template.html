/* Reader-view principles: one calm column, type and space carry the hierarchy,
   no boxes, badges or pills, and colour only where it means something. */

  --bg: #FBF8F1; --ink: #1D1B17; --soft: #45413A; --muted: #736D62; --rule: #E7E0D2;

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

:root[data-theme="dark"] {
  --bg: #1C1B22; --ink: #EDEDF2; --soft: #C9C8D3; --muted: #9C9BA8; --rule: #33323C;
  --accent: #7AB2FF; --ok: #5BC98E; --tint: #25242D; --paper2: #E6E4DF; --script: #1B1A20; --script-muted: #66646E; color-scheme: dark; }

h1, h2, h3, h4 { font-family: var(--body); font-weight: 700; line-height: 1.25; margin: 0; }

/* top bar: quiet; the site badges sit in a strip above it (site/nav.css) */

.top .grow { flex: 1; }
.prog, .count { font-size: 15px; color: var(--muted); white-space: nowrap; }

/* layout: a narrow reading column, a quiet contents list beside it */
.shell { max-width: 1180px; margin: 0 auto; padding: 0 28px 160px; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 64px; }

/* scripts and answers: prose, nothing around it */
.script { margin: 0 0 48px; }

/* what you say: a transcript on its own light panel, in a serif, so it never reads like the headings */
details.item { border-bottom: 1px solid var(--rule); }

details.item[open] > summary::after { transform: rotate(-135deg); top: 28px; }
details.item > summary:hover .qt { color: var(--accent); }
.qt { display: block; font-weight: 700; font-size: 19px; line-height: 1.4; color: var(--ink); }
.qm { display: block; font-size: 15px; color: var(--muted); margin-top: 3px; }
.transcript { background: var(--paper2); color: var(--script); border-radius: 8px; padding: 22px 28px 20px; margin: 2px 0 22px;
  font-family: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif; font-size: 18.5px; line-height: 1.68; }

.transcript .note b { color: var(--script); }
.bulk { display: flex; gap: 14px; margin: -8px 0 10px; font-size: 15px; }
.bulk button { background: none; border: 0; padding: 0; color: var(--accent); }

/* buttons: small and plain */
.acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
.btn { border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 6px; padding: 7px 14px; font-size: 16px; display: inline-block; }

/* mocks: the read, then the conversation. Colour means one of two things here: who is

:root { --hamza: #9A5B13; --alex: #2F6DB5; --v-landed: var(--ok); --v-partly: #B7791F; --v-missed: #C23B22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hamza: #E0A55C; --alex: #7AB2FF; --v-partly: #E3B25C; --v-missed: #F07A63; } }
:root[data-theme="dark"] { --hamza: #E0A55C; --alex: #7AB2FF; --v-partly: #E3B25C; --v-missed: #F07A63; }
.vd { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: var(--muted); }
.vd-landed { background: var(--v-landed); } .vd-partly { background: var(--v-partly); }
.vd-missed, .vd-gap { background: var(--v-missed); } .vd-gap { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--v-missed); }
.sep { display: inline-block; width: 1px; height: 14px; background: var(--rule); margin: 0 14px; vertical-align: -2px; }
.mk-tally { font-size: 16px; color: var(--soft); margin: 4px 0 22px; }
.mk-read { font-size: 18.5px; color: var(--ink); }
.mk-h { font-size: 15px; font-weight: 700; color: var(--muted); margin: 26px 0 8px; }
.mk-list { margin: 0; padding-left: 22px; font-size: 17px; line-height: 1.6; }
.mk-list li { margin: 0 0 8px; padding-left: 4px; }

.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-size: 15px; white-space: nowrap; }

/* prep hub: how to show up, then one row per bank, then folded sections */
.showup { margin: 0; padding-left: 24px; font-size: 16.5px; line-height: 1.55; }
.showup li { margin: 0 0 10px; padding-left: 4px; color: var(--soft); }
details.fold { border-top: 1px solid var(--rule); }
details.fold:last-of-type { border-bottom: 1px solid var(--rule); margin-bottom: 40px; }

details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: ""; position: absolute; right: 8px; top: 24px; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); }
details.fold[open] > summary::after { transform: rotate(-135deg); top: 28px; }

.fold-body { padding: 0 4px 26px; }
.c3 { margin: 6px 0 34px; }
.c3-t { font-size: 20px; margin: 18px 0 4px; }
.c3-w { display: block; font-size: 15px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.c3-why { font-size: 16.5px; color: var(--soft); margin: 8px 0 10px; }
.c3-how { font-size: 15.5px; margin-bottom: 14px; }
.c3-q { padding: 14px 0 14px 16px; border-left: 2px solid var(--rule); margin: 0 0 12px; }
.c3-q .to { display: block; font-size: 13.5px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.c3-q .q { display: block; font-weight: 700; font-size: 17.5px; line-height: 1.45; margin: 2px 0 6px; }
.c3-q .lp, .c3-q .wy { display: block; font-size: 15.5px; color: var(--soft); line-height: 1.5; }
.c3-q .lp b, .c3-q .wy b { color: var(--ink); }

.banks { border-top: 1px solid var(--rule); margin-top: 6px; }

  border-bottom: 1px solid var(--rule); padding: 16px 4px; color: var(--ink); }

.hit .hb { display: block; font-size: 13.5px; color: var(--muted); }

.turns { list-style: none; margin: 18px 0 0; padding: 0; border-top: 1px solid var(--rule); }

/* the conversation: one screen, always light whatever the page's theme. Turns on the
   left, a small header, what you said on paper, and what to say on a dark typewriter sheet. */
dialog.convo {
  --bg: #FBF8F1; --ink: #1D1B17; --soft: #45413A; --muted: #736D62; --rule: #E7E0D2; --tint: #F2ECE0;
  --accent: #0A5BD3; --ok: #1A7F4B; --hamza: #9A5B13; --alex: #2F6DB5; --v-landed: #1A7F4B; --v-partly: #B7791F; --v-missed: #C23B22;
  --sheet: #1C1B19; --sheet-ink: #EEE9DE; --sheet-soft: #BDB6A8; --sheet-muted: #8C8679; --sheet-rule: #3A3732; --sheet-mark: #F2C66D;
  color-scheme: light;
  width: min(1320px, 96vw); height: min(880px, 92vh); max-width: none; max-height: none; border: 0; border-radius: 10px; padding: 0;
  background: var(--bg); color: var(--ink); box-shadow: 0 24px 70px rgba(0,0,0,.4); overflow: hidden; }
dialog.convo::backdrop { background: rgba(10, 10, 14, 0.62); }
.cv { display: grid; grid-template-columns: 250px minmax(0, 1fr); height: 100%; }

.cv-rail { background: #F5F0E6; border-right: 1px solid var(--rule); overflow-y: auto; padding: 16px 10px 16px 12px; display: flex; flex-direction: column; }
.cv-title { padding: 2px 8px 12px; border-bottom: 1px solid var(--rule); margin-bottom: 6px; font-size: 14px; line-height: 1.4; }
.cv-title span { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.cv-rail .turn { grid-template-columns: 22px 14px minmax(0, 1fr); border-radius: 6px; border-bottom: 0; margin-top: 1px; font-size: 14.5px; padding: 8px 8px; }
.cv-rail .turn .tw { display: none; }
.cv-rail .turn.on { background: #E9E1D1; }
.cv-rail .turn.on .tl { font-weight: 700; }
.cv-keys { margin-top: auto; padding: 12px 8px 0; font-size: 12.5px; color: var(--muted); }

.cv-pane { display: flex; flex-direction: column; min-height: 0; }
.cv-head { padding: 14px 96px 12px 24px; border-bottom: 1px solid var(--rule); flex: none; }
.cv-head .ex-q { font-size: 15.5px; line-height: 1.5; padding-left: 12px; border-left-width: 2px; }
.cv-head .ex-who { font-size: 12px; margin-bottom: 2px; }

.cv-tests { margin: 3px 0 0 14px; font-size: 13px; color: var(--muted); }
.cv-tests b { color: var(--soft); }

.cv-cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 8px; flex: 1; min-height: 0; padding: 0 16px 16px 0; }
.cv-col { overflow-y: auto; padding: 18px 26px 32px; }
.cv-h { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.cv-col .lab { font-size: 13px; font-weight: 700; color: var(--muted); margin: 18px 0 6px; }
.cv-col .mk-list { font-size: 15.5px; line-height: 1.55; }
.cv-said .ex-said { font-size: 15.5px; }
.cv-part { font-size: 16px; margin: 26px 0 6px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--ink); }
.cv-part-lead { font-size: 15px; color: var(--soft); margin: 0 0 6px; }
.cv-code { margin: 10px 0 12px; padding: 12px 14px; background: #EFE8DA; border: 1px solid var(--rule); border-radius: 6px; overflow-x: auto;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: #2A2620; white-space: pre; }
.cv-cols.has-code { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.cv-code code { background: none; padding: 0; font-size: inherit; color: inherit; }

/* what to say: a dark sheet in a typewriter face, the one place on the screen that is dark */
.cv-say { background: var(--sheet); color: var(--sheet-ink); scrollbar-color: var(--sheet-rule) transparent; border-radius: 10px; margin-top: 16px; padding: 22px 28px 32px;
  box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 18px rgba(40,30,10,.10); }
.cv-say .cv-h, .cv-say .lab { color: var(--sheet-muted); }
.cv-say .mk-list { color: var(--sheet-soft); }
.cv-say .mk-list li::marker { color: var(--sheet-muted); }
.cv-land { margin: 0 0 18px; padding: 12px 14px; border-radius: 6px; background: #2A2824; color: var(--sheet-ink); font-size: 15.5px; line-height: 1.55; }
.cv-land b { color: var(--sheet-mark); font-weight: 700; }
.cv-say .transcript { background: transparent; color: var(--sheet-ink); border-radius: 0; margin: 0; padding: 2px 0 2px 16px; border-left: 2px solid var(--sheet-rule);
  font-family: var(--mono); font-size: 14.5px; line-height: 1.9; }
.cv-say .transcript .who { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--sheet-muted); margin-bottom: 10px; }
.cv-say .transcript .beat { margin: 0 0 18px; }
.cv-say .transcript strong { color: var(--sheet-mark); font-weight: 400; }
.cv-say code, .cv-say .transcript code { background: #2E2B26; color: #F6D8A0; padding: 1px 6px; border-radius: 4px; font-size: .95em; }
.cv-say .transcript .line + .line { padding-left: 1.2em; }
.cv-say .ex-links a { color: #9CC6FF; }
.swap { margin: 0 0 16px; padding-left: 16px; border-left: 2px solid var(--sheet-rule); }
.swap .sw-when { display: block; font-size: 13px; color: var(--sheet-muted); margin-bottom: 4px; }
.swap .sw-line { display: block; font-family: var(--mono); font-size: 14px; line-height: 1.8; color: var(--sheet-ink); }
.swap .sw-line strong { color: var(--sheet-mark); font-weight: 400; }
.cv-say .lab { margin-top: 26px; }
.cv-say .ex-links .sep { background: var(--sheet-rule); }
.cv-col figure { padding: 12px; margin: 18px 0 0; }
.cv-col figure svg { min-width: 0; }

.cv-close { position: absolute; top: 12px; right: 14px; z-index: 2; background: var(--bg); border: 1px solid var(--rule); color: var(--soft);
  border-radius: 6px; padding: 3px 10px; font-size: 13px; }
.cv-close:hover { color: var(--ink); border-color: var(--ink); }
@media (max-width: 860px) {
  dialog.convo { width: 100vw; height: 100vh; border-radius: 0; }
  .cv { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .cv-rail { max-height: 28vh; border-right: 0; border-bottom: 1px solid var(--rule); }
  .cv-cols { grid-template-columns: minmax(0, 1fr); overflow-y: auto; padding: 0 12px 12px; }
  .cv-col { overflow: visible; }
  .cv-head { padding-right: 80px; }
}

/* design */
figure { margin: 26px 0 34px; padding: 18px; background: #FFFFFF; color: #15141A; border: 1px solid var(--rule); border-radius: 8px; overflow-x: auto; }
figure svg { display: block; width: 100%; height: auto; min-width: 620px; }
figcaption { font-size: 15.5px; color: #55545F; margin-top: 12px; }
table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 16.5px; }
th, td { text-align: left; padding: 9px 12px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 400; color: var(--muted); font-size: 15px; }
td:first-child { font-weight: 700; padding-right: 20px; }
.tnote { font-size: 15.5px; color: var(--muted); margin: 8px 0 34px; }

/* sessions */
.session .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.chip { color: var(--muted); }
.chip.done { color: var(--ok); }
.session .intro { font-size: 19px; color: var(--soft); margin: 14px 0 12px; }
.step { border-top: 1px solid var(--rule); }
.step > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 16px 30px 16px 0; position: relative; }
.step > summary::-webkit-details-marker { display: none; }
.step > summary::after { content: ""; position: absolute; right: 6px; top: 24px; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); }
.step[open] > summary::after { transform: rotate(-135deg); top: 28px; }
.step > summary .st { font-weight: 700; font-size: 18px; line-height: 1.4; }
.step > summary:hover .st { color: var(--accent); }
.step > summary .sm { color: var(--muted); font-size: 14.5px; padding-top: 3px; white-space: nowrap; }
.tick { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--muted); background: transparent; color: var(--bg); display: grid; place-items: center; font-size: 13px; margin-top: 3px; padding: 0; cursor: pointer; }
.tick.on { background: var(--ok); border-color: var(--ok); }
.sbody { padding: 0 0 24px 44px; font-size: 17px; line-height: 1.65; }
.sbody > p.d { margin: 0 0 4px; }
.sbody > p.point { margin: 0 0 4px; font-size: 18px; }
.sbody .lab { font-size: 14px; font-weight: 700; color: var(--muted); margin: 20px 0 6px; }
.reading { margin: 0; padding: 0; list-style: none; font-size: 16px; line-height: 1.5; }
.reading li { margin: 0 0 10px; padding-left: 14px; position: relative; }
.reading li::before { content: ""; position: absolute; left: 0; top: .7em; width: 5px; height: 1.5px; background: var(--muted); }
.reading a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.reading a:hover { text-decoration-color: var(--ink); }
.reading .w { color: var(--muted); font-size: 14px; margin-left: 8px; white-space: nowrap; }
.reading .why { display: block; color: var(--soft); font-size: 14px; margin-top: 2px; }
.sbody figure { margin: 16px 0 6px; }
details.say { margin-top: 22px; }
details.say > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; font-size: 14.5px; font-weight: 700; color: var(--soft); padding: 7px 14px; border: 1px solid var(--rule); border-radius: 6px; }
details.say > summary::-webkit-details-marker { display: none; }
details.say > summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin-top: -3px; }
details.say[open] > summary::after { transform: rotate(-135deg); margin-top: 3px; }
details.say > summary:hover { color: var(--ink); border-color: var(--muted); }
details.say .transcript { margin-top: 12px; }
details.item > .sbody { padding-left: 0; }
@media (max-width: 700px) { .sbody { padding-left: 0; } }
/* the tracker's own figures, drawn with its classes, always on white */
figure.trk { --faint: #a2a09a; --dim: #6b6a65; --line: #c3c0b7; --ink: #1a1a19; --live: #fffdf5; }
figure .fh { font-weight: 700; font-size: 15.5px; margin-bottom: 8px; }
.session-end { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 26px; }
.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--rule); }
.pager a { display: flex; flex-direction: column; color: var(--ink); font-weight: 700; max-width: 48%; }
.pager a span { font-weight: 400; font-size: 14.5px; color: var(--muted); }
.pager a.next { text-align: right; margin-left: auto; }
.pager a:hover { color: var(--accent); text-decoration: none; }

/* quiz: one question at a time */
dialog { width: min(640px, 94vw); border: 0; border-radius: 10px; padding: 0; background: var(--bg); color: var(--ink); box-shadow: 0 24px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10, 10, 14, 0.55); }
.dq { padding: 28px 30px 24px; }
.dq .dots { display: flex; gap: 5px; margin-bottom: 18px; }
.dq .dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--rule); }
.dq .dots i.on { background: var(--ink); }
.dq .dots i.got { background: var(--ok); }
.dq .qq { font-size: 21px; font-weight: 700; line-height: 1.35; }
.dq .model { margin-top: 16px; padding-left: 14px; border-left: 2px solid var(--ok); color: var(--soft); }
.dq .model b { display: block; font-size: 14.5px; color: var(--ok); font-weight: 700; }
.dq .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
.dq .row .grow { flex: 1; }
.dq .close { background: none; border: 0; color: var(--muted); font-size: 15px; }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 20px 120px; }
  nav.side { display: none; }
  .top-in { padding: 0 16px; gap: 10px; }
  .top .loopname, .prog, .count { display: none; }
  .tabs { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs a { padding: 16px 6px 14px; font-size: 15px; }
  body { font-size: 17.5px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<body>
<div class="sn-strip"><nav class="sn-top" data-site-nav data-base="../"></nav></div>
<header class="top"><div class="top-in">
  <span class="loopname" id="loopname"></span>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <span class="grow"></span>
  <span class="prog" id="prog"></span>
  <span class="count" id="count"></span>
</div></header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<dialog id="quiz" aria-label="Quiz"></dialog>
<dialog id="convo" class="convo" aria-label="Mock conversation"></dialog>
<script src="../figures/icons.js"></script>
<script src="../figures/figures.js"></script>
<script src="../figures/notes.js"></script>
<script src="../figures/viewer.js"></script>
<script type="application/json" id="loop-data">{{DATA}}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; o.rev = o.rev || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }
    var sm = el("summary", "", '<span class="qt">' + inl(title) + "</span>" + (meta ? '<span class="qm">' + meta + "</span>" : ""));
    d.appendChild(sm); d.appendChild(body);
    return d;
  }
  function bulk(host) {
    var b = el("div", "bulk");
    var o = el("button", "", "Open all"), c = el("button", "", "Close all");
    o.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = true; }); });
    c.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = false; }); });
    b.appendChild(o); b.appendChild(c);
    host.appendChild(b);
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });
    (s.study || []).forEach(function (_, i) { k.push(s.id + ":s" + i); });
    return k;
  }
  function isDone(t, s) { return !!t.done[s.id]; }
  function link(tab, anchor) { return "#/" + tab + (anchor ? "/" + anchor : ""); }
  /* A drill's reference is either a route already or an anchor on the prep tab. */
  function prepRef(r) { return r.indexOf("#/") === 0 ? r : link("prep", r.replace(/^#/, "")); }

  /* ---------------------------------------------------------------- tabs */
  var TABS = [
    { id: "overview", label: "Overview", show: function () { return true; } },
    { id: "prep", label: "Prep", show: function () { return LOOP.scripts.length || LOOP.drills.length || LOOP.qa.length || LOOP.ask.length || (LOOP.ask3 || []).length; } },
    { id: "design", label: "Design", show: function () { return LOOP.tables.length || LOOP.figures.length; } },
    { id: "own", label: (LOOP.own && LOOP.own.tab) || "Yours", show: function () { return !!LOOP.own; } },
    { id: "sessions", label: "Sessions", show: function () { return LOOP.sessions.length; } },
    { id: "mocks", label: "Mocks", show: function () { return !!LOOP.mockHow; } }
  ].filter(function (t) { return t.show(); });
  var main = document.getElementById("main");
  var side = document.getElementById("side");
  var nav = [];            /* side links for the current tab: [anchor, label, sub] */

  function heading(host, id, kicker, title, sub) {
    var s = el("section", "block"); s.id = id;
    if (kicker) { s.appendChild(el("div", "kicker", esc(kicker))); }
    if (title) { s.appendChild(el("h2", "", esc(title))); }
    host.appendChild(s);
    nav.push([id, title || kicker, !!sub]);
    return s;
  }

  /* ---------------------------------------------------------------- overview */
  function tabOverview(host) {
    var s = el("section", "block"); s.id = "brief";
    s.appendChild(el("div", "kicker", esc(LOOP.subtitle)));
    s.appendChild(el("h1", "", esc(LOOP.title)));
    s.appendChild(el("p", "lead", esc(LOOP.format)));
    var dl = el("dl", "facts");
    dl.innerHTML = "<dt>When</dt><dd>" + esc(LOOP.when) + "</dd><dt>Who</dt><dd>" + esc(LOOP.who) + "</dd>";
    s.appendChild(dl);
    if (LOOP.bar) { s.appendChild(el("p", "bar", "<b>The bar.</b> " + inl(LOOP.bar))); }
    if (LOOP.extra) { s.appendChild(el("div", "lead", LOOP.extra)); }
    host.appendChild(s);
    nav.push(["brief", "The brief"]);
    if (!LOOP.sessions.length) { return; }

    var p = heading(host, "plan", LOOP.planKicker || "", "The plan");
    var t = tracker();
    var days = {}, order = [];
    LOOP.sessions.forEach(function (x) {
      if (!days[x.day]) { days[x.day] = []; order.push(x.day); }
      days[x.day].push(x);
    });
    var wrap = el("div", "days");
    order.forEach(function (d) {
      var box = el("div", "day");
      box.appendChild(el("h3", "", esc(d)));
      days[d].forEach(function (x) {
        var a = el("a", "srow" + (isDone(t, x) ? " done" : ""));
        a.href = link("sessions", x.id);
        a.innerHTML = '<span class="dot"></span><span><span class="nm">' + esc(x.name) +
          '</span><span class="bl">' + esc(x.blurb.replace(/^(Friday|Saturday|Sunday)[^.]*\.\s*/, "")) + '</span></span><span class="hrs">' + esc(x.len) + "</span>";
        box.appendChild(a);
      });
      wrap.appendChild(box);
    });
    p.appendChild(wrap);
    var go = el("div", "acts");
    TABS.filter(function (x) { return x.id !== "overview"; }).forEach(function (x) {
      var a = el("a", "btn", esc(x.label)); a.href = link(x.id); go.appendChild(a);
    });
    p.appendChild(go);
  }

  /* ---------------------------------------------------------------- prep: a hub
     The tab is short: how to show up, then the banks as rows, then drills, questions to
     ask, traps and sources. A bank opens in the one-screen panel. */
  function prepBanks() {
    var banks = [];
    if (LOOP.scripts.length) {
      banks.push({ id: "say", title: "Your story, in the words to say it", blurb: LOOP.storyBlurb || "", items: LOOP.scripts.map(function (x) {
        return { id: "say-" + x.id, q: x.title, short: x.short || x.title, tests: x.when, a: x.say, land: x.land, never: x.never, notes: x.notes,
          probes: x.probes, swaps: x.swaps, learn: x.figs ? { figs: x.figs } : null,
          meta: x.length ? x.length.charAt(0).toUpperCase() + x.length.slice(1) + "." : "",
          drill: LOOP.drills.some(function (d) { return d.id === x.id; }) ? x.id : null };
      }) });
    }
    LOOP.qa.forEach(function (g, gi) {
      banks.push({ id: "qa-" + gi, title: g.group, blurb: g.blurb || "", items: g.items });
    });
    return banks;
  }
  function findPrep(banks, id) {
    for (var b = 0; b < banks.length; b++) {
      for (var i = 0; i < banks[b].items.length; i++) { if (banks[b].items[i].id === id) { return { bank: banks[b], i: i }; } }
    }
    return null;
  }
  var hubCounts = [];
  function drawHubCounts() {
    hubCounts.forEach(function (h) {
      var n = h.bank.items.filter(function (x) { return isRevised(x.id); }).length;
      h.node.innerHTML = h.bank.items.length + " questions" + (n ? '<span class="sep"></span><span class="rv">' + n + " revised</span>" : "");
    });
  }
  function tabPrep(host) {
    var banks = prepBanks();
    hubCounts = [];
    var s = heading(host, "prep", LOOP.prepKicker || "The day before", "Prep");
    if (LOOP.prepLead) { s.appendChild(el("p", "lead", inl(LOOP.prepLead))); }

    if (LOOP.showUp && LOOP.showUp.length) {
      var u = heading(host, "show-up", "Before the first question", "How to show up");
      var ol = el("ol", "showup");
      LOOP.showUp.forEach(function (x) { ol.appendChild(el("li", "", "<b>" + inl(x[0]) + "</b> " + inl(x[1]))); });
      u.appendChild(ol);
    }

    var h = heading(host, "banks", "Open one, study it in one screen", "Question banks");
    var f = el("input", "filter"); f.type = "search"; f.placeholder = "Search every bank, for example YouTube, lease, SQLite, first post";
    h.appendChild(f);
    var found = el("div", "found"); h.appendChild(found);
    var rows = el("div", "banks");
    banks.forEach(function (b) {
      var r = el("button", "bank");
      r.innerHTML = '<span class="bt">' + esc(b.title) + "</span>" + (b.blurb ? '<span class="bb">' + inl(b.blurb) + "</span>" : "");
      var cnt = el("span", "bc"); r.appendChild(cnt);
      hubCounts.push({ bank: b, node: cnt });
      r.addEventListener("click", function () { openBank(b, 0); });
      rows.appendChild(r);
    });
    h.appendChild(rows);
    drawHubCounts();
    f.addEventListener("input", function () {
      var v = f.value.trim().toLowerCase();
      found.innerHTML = "";
      rows.hidden = !!v;
      if (!v) { return; }
      var hits = 0;
      banks.forEach(function (b) {
        b.items.forEach(function (x, i) {
          var text = (x.q + " " + (x.a || []).join(" ") + " " + (x.notes || []).join(" ") + " " + (x.probes || []).join(" ") + " " +
            (x.swaps || []).map(function (w) { return w.when + " " + w.line; }).join(" ")).toLowerCase();
          if (text.indexOf(v) < 0 || hits >= 14) { return; }
          hits++;
          var r = el("button", "hit", '<span class="hb">' + esc(b.title) + "</span>" + inl(x.q));
          r.addEventListener("click", function () { openBank(b, i); });
          found.appendChild(r);
        });
      });
      if (!hits) { found.appendChild(el("p", "when", "Nothing matches.")); }
    });

    /* The rest folds shut, one line each, so the page is how to show up and the banks. */
    function fold(id, title, sub) {
      var d = el("details", "fold"); d.id = id;
      d.appendChild(el("summary", "", '<span class="ft">' + esc(title) + '</span><span class="fs">' + esc(sub) + "</span>"));
      var body = el("div", "fold-body"); d.appendChild(body);
      host.appendChild(d);
      nav.push([id, title]);
      return body;
    }
    if (LOOP.drills.length) { drills(fold("practise", "Practise aloud", LOOP.drills.length + " timed questions, out loud")); }
    var three = LOOP.ask3 || [];
    if (three.length) {
      /* Questions you ask, as three Cs: when, why and how for each kind, then each question
         with who to ask, how to loop it in, and what it shows. */
      var n3 = three.reduce(function (n, k) { return n + k.items.length; }, 0);
      var a3 = fold("ask", "Questions to ask: clarify, contribute, collaborate", n3 + " questions, in three kinds");

  /* A step opens to what it is, what to read, where it sits in the system design guide

      else { tt.steps[key] = true; tt.steps[key + ":at"] = stamp(); }

    learn(body, { figs: [], read: pre.concat(isStudy ? (it.res || []) : (it.links || []), it.read || []), sdLinks: it.sdLinks });

    row.appendChild(body);
    return row;

  /* ---------------------------------------------------------------- mocks */
  /* A mock reads in two parts: the read (how it went, what landed, what to fix first),
     then the conversation, one exchange at a time. Each exchange shows who asked what and
     what you said, with a verdict; it opens to why, how to approach it, and the answer to
     say, behind the same toggle the Prep tab uses. */
  var VERDICT = { landed: "Landed", partly: "Partly", missed: "Missed", gap: "Gap: you did not have an answer" };
  function tabMocks(host) {
    var s = heading(host, "mock", "Run in chat", "Mock interviews");
    s.appendChild(el("p", "lead", inl(LOOP.mockHow)));

  function drawMock(host, m, mi) {
    var pre = m.id || "m" + mi;

    if (!ex.length && m.critique) { s.appendChild(el("p", "", inl(m.critique))); return; }

      .map(function (k) { return '<span class="vd vd-' + k + '"></span>' + tally[k] + " " + (k === "gap" ? "gaps" : k); }).join('<span class="sep"></span>') +
      '<span class="sep"></span>' + ex.length + " exchanges"));
    (m.read || []).forEach(function (p) { s.appendChild(el("p", "mk-read", inl(p))); });

      m.fix.forEach(function (f) {

      });

    /* The turns, one line each; the conversation itself opens in one screen. */

    ex.forEach(function (x, i) {
      var li = el("li");
      var b = el("button", "turn");
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) +
        '</span><span class="tw spk-' + esc((x.who || "").toLowerCase()) + '">' + esc(x.who) + "</span>";

  function openLink(text, m, i) {

  /* One screen, shared by mocks and the Prep banks: a list on the left, the chosen item on
     the right. The item's header is small; under it, the light column is for understanding
     and the dark sheet is what to say, each scrolling on its own. Arrows move; Escape closes. */
  var convo = document.getElementById("convo");
  function panelSection(host, label, nodes) {
    if (!nodes.length) { return; }
    host.appendChild(el("div", "lab", label));
    nodes.forEach(function (n) { host.appendChild(n); });
  }
  function panelList(items, cls) {
    if (!items || !items.length) { return []; }
    var u = el("ul", "mk-list " + (cls || ""));
    items.forEach(function (t) { u.appendChild(el("li", "", inl(t))); });
    return [u];
  }
  /* o: { title, sub, label, count, row(i) -> html for the rail, draw(i, pane), start } */
  function openPanel(o) {
    var cur = o.start || 0;
    convo.innerHTML = "";
    convo.setAttribute("aria-label", o.label || o.title);
    var shell = el("div", "cv");
    var rail = el("nav", "cv-rail");
    rail.appendChild(el("div", "cv-title", "<b>" + esc(o.title) + "</b>" + (o.sub ? "<span>" + esc(o.sub) + "</span>" : "")));
    var rows = [];
    for (var i = 0; i < o.count; i++) {
      (function (i) {
        var b = el("button", "turn");
        b.innerHTML = o.row(i);
        b.addEventListener("click", function () { show(i); });
        rail.appendChild(b);
        rows.push(b);
      }(i));
    }
    rail.appendChild(el("div", "cv-keys", "Up and down arrows move. Escape closes."));
    var pane = el("section", "cv-pane");
    var close = el("button", "cv-close", "Close");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", function () { convo.close(); });
    shell.appendChild(rail); shell.appendChild(pane);
    convo.appendChild(close); convo.appendChild(shell);
    function show(i) {
      cur = i;
      rows.forEach(function (b, j) { b.classList.toggle("on", j === i); if (j === i) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); } });
      rows[i].scrollIntoView({ block: "nearest" });
      pane.innerHTML = "";
      o.draw(i, pane, function () { rows[i].innerHTML = o.row(i); });
      [].forEach.call(pane.querySelectorAll(".cv-col"), function (c) { c.scrollTop = 0; });
    }
    convo.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = cur + (e.key === "ArrowDown" ? 1 : -1);
        if (n >= 0 && n < o.count) { show(n); rows[n].focus(); }
      }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    rows[cur].focus();
  }
  function panelCols(pane, leftTitle, rightTitle) {
    var cols = el("div", "cv-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "cv-col cv-say");
    left.appendChild(el("h3", "cv-h", leftTitle));
    right.appendChild(el("h3", "cv-h", rightTitle));
    cols.appendChild(left); cols.appendChild(right);
    pane.appendChild(cols);
    return { left: left, right: right, cols: cols };
  }

  /* A mock: what they asked and how it landed; what you said; what to say. */
  function openConvo(m, start) {
    var ex = m.exchanges;
    openPanel({
      title: m.title, sub: m.when, label: "Mock conversation", count: ex.length, start: start,
      row: function (i) {
        var x = ex[i];
        return '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) + "</span>";
      },
      draw: function (i, pane) {
        var x = ex[i], who = (x.who || "").toLowerCase();
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q spk-" + who, '<span class="ex-who">Turn ' + (i + 1) + " of " + ex.length + ", " + esc(x.who) + "</span>" + inl(x.q)));
        head.appendChild(el("p", "cv-verdict", '<span class="vd vd-' + esc(x.verdict) + '"></span><b>' + esc(VERDICT[x.verdict] || x.verdict) + ".</b> " + inl(x.why || "")));
        if (x.tests) { head.appendChild(el("p", "cv-tests", "<b>They were testing:</b> " + inl(x.tests))); }
        pane.appendChild(head);
        var c = panelCols(pane, "What you said", "What to say");
        panelSection(c.left, "In short", (x.said || []).map(function (p) { return el("p", "ex-said", inl(p)); }));
        panelSection(c.left, "What worked", panelList(x.good, "mk-good"));
        panelSection(c.left, "What did not", panelList(x.bad, "mk-bad"));
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.say && x.say.length) { c.right.appendChild(transcript(x.say, "You", "")); }
        panelSection(c.right, "How to approach it", panelList(x.approach));
        (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.right.appendChild(f); } });
        var links = [];
        if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
        if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
        if (links.length) { c.right.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      }
    });
  }

  /* A Prep bank: what it is and what sits under it on the light side; what to say on the
     dark sheet. Each item can be marked revised; the mark is kept in this page's storage. */
  function isRevised(id) { return !!own().rev[id]; }
  function setRevised(id, on) {
    var o = own();
    if (on) { o.rev[id] = stamp(); } else { delete o.rev[id]; }
    writeJSON(OWN, o);
  }
  function openBank(bank, start) {
    var its = bank.items;
    openPanel({
      title: bank.title, sub: its.length + " questions", label: bank.title, count: its.length, start: start,
      row: function (i) {
        return '<span class="n">' + (i + 1) + '</span><span class="vd ' + (isRevised(its[i].id) ? "vd-landed" : "vd-open") + '"></span><span class="tl">' + esc(its[i].short || its[i].q) + "</span>";
      },
      draw: function (i, pane, redrawRow) {
        var x = its[i];
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q", '<span class="ex-who">' + esc(bank.title) + ", " + (i + 1) + " of " + its.length + "</span>" + inl(x.q)));
        if (x.tests) { head.appendChild(el("p", "cv-verdict", "<b>They are testing:</b> " + inl(x.tests))); }
        var rv = el("button", "linkish cv-rev");
        function label() { rv.innerHTML = isRevised(x.id) ? '<span class="vd vd-landed"></span>Revised. Undo' : "Mark as revised"; }
        label();
        rv.addEventListener("click", function () { setRevised(x.id, !isRevised(x.id)); label(); redrawRow(); drawHubCounts(); });
        head.appendChild(el("p", "cv-tests")).appendChild(rv);
        pane.appendChild(head);
        var c = panelCols(pane, "Understand it", "What to say");
        panelSection(c.left, "What they may probe", panelList(x.probes));
        /* A big design question carries its own board: titled sections, read in order. */
        (x.parts || []).forEach(function (p) {
          c.left.appendChild(el("h4", "cv-part", inl(p.title)));
          if (p.lead) { c.left.appendChild(el("p", "cv-part-lead", inl(p.lead))); }
          panelList(p.items).forEach(function (u) { c.left.appendChild(u); });
          /* A worked example: code, shown as written. */
          if (p.code) { var pre = el("pre", "cv-code"); pre.appendChild(el("code", "", esc(p.code))); c.left.appendChild(pre); }
          if (p.after) { panelList(p.after).forEach(function (u) { c.left.appendChild(u); }); }
        });
        panelSection(c.left, "The nuance", panelList(x.notes));
        panelSection(c.left, "Avoid", panelList(x.never, "mk-bad"));
        learn(c.left, x.learn || {});
        if (x.drill) { c.left.appendChild(el("p", "ex-links", '<a href="' + link("prep", "drill-" + x.drill) + '">Practise it aloud, timed</a>')); }
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.a && x.a.length) { c.right.appendChild(transcript(x.a, "You", "")); }
        /* Lines to swap in: a short answer for each probe, said the same way. */
        if (x.swaps && x.swaps.length) {
          c.right.appendChild(el("div", "lab", "Lines you can swap in"));
          x.swaps.forEach(function (w) {
            c.right.appendChild(el("div", "swap", '<span class="sw-when">' + inl(w.when) + '</span><span class="sw-line">' + emph(inl(w.line)) + "</span>"));
          });
        }
        if (x.meta) { c.right.appendChild(el("p", "cv-meta", esc(x.meta))); }
        if (c.left.querySelector(".cv-code")) { c.cols.classList.add("has-code"); }
      }
    });
  }

  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    return { tab: tab, anchor: p[1] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = link(t.id);
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = [];
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "mocks") { tabMocks(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    drawTabs(r.tab); drawSide(r.tab); progress();
    var key = r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    var c = document.getElementById("count");
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
</html>
