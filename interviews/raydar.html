.cv-close { position: absolute; top: var(--s3); right: var(--s4); z-index: 2; background: var(--surface); border: var(--hair); color: var(--soft);
  border-radius: var(--radius); padding: 2px var(--s3); font-size: var(--fs-sm); }
.cv-close:hover { color: var(--ink); border-color: var(--muted); }
@media (max-width: 860px) {
  dialog.convo { width: 100vw; height: 100vh; border-radius: 0; }
  .cv { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .cv-rail { max-height: 28vh; border-right: 0; border-bottom: var(--hair); }
  .cv-title { padding-right: 72px; }
  .cv-cols { grid-template-columns: minmax(0, 1fr); overflow-y: auto; padding: 0 var(--s3) var(--s3); }
  .cv-col { overflow: visible; }
  .cv-head { padding: var(--s3) 80px var(--s3) var(--s4); }
}

/* figures are drawn for a light ground, so they sit on the light surface on every theme
   (the light tokens' values: surface, ink, muted, rule) */
figure { margin: var(--s5) 0 var(--s6); padding: var(--s4); background: #FFFDF8; color: #1D1B17; border: 1px solid #E5DDCD; border-radius: var(--radius-lg); overflow-x: auto; }
figure svg { display: block; width: 100%; height: auto; min-width: 620px; }
figcaption { font-size: var(--fs-sm); color: #736D62; margin-top: var(--s3); }
figure .fh { font-weight: var(--w-strong); font-size: var(--fs-sm); margin-bottom: var(--s2); }
/* the tracker's own figures, drawn with its classes */
figure.trk { --faint: #a2a09a; --dim: #6b6a65; --line: #c3c0b7; --ink: #1a1a19; --live: #fffdf5; }
table { width: 100%; border-collapse: collapse; margin: var(--s1) 0; font-size: var(--fs-sm); }
th, td { text-align: left; padding: var(--s2) var(--s3) var(--s2) 0; border-bottom: var(--hair); vertical-align: top; }
th { font-weight: var(--w-strong); color: var(--muted); font-size: var(--fs-xs); }
td:first-child { font-weight: var(--w-strong); }
.tnote { font-size: var(--fs-sm); color: var(--muted); margin: var(--s2) 0 var(--s6); }

/* sessions */
.session .meta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); margin-top: calc(-1 * var(--s3)); }
.chip { color: var(--muted); }
.chip.done { color: var(--ok); }
.session .intro { color: var(--soft); margin: var(--s3) 0; }
.session > h3 { margin: var(--s6) 0 var(--s2); }
.step { border-top: var(--hair); }
.step > summary { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: var(--s3); align-items: start; padding: var(--s3) var(--s6) var(--s3) 0; }
.step > summary .st { font-weight: var(--w-strong); }
.step > summary:hover .st { color: var(--accent); }
.step > summary .sm { color: var(--muted); font-size: var(--fs-sm); padding-top: 2px; white-space: nowrap; }
.tick { width: 18px; height: 18px; border-radius: var(--radius-sm); border: 1.5px solid var(--muted); background: transparent; color: var(--surface);
  display: grid; place-items: center; font-size: var(--fs-xs); margin-top: 3px; padding: 0; }
.tick.on { background: var(--ok); border-color: var(--ok); }
.sbody { padding: 0 0 var(--s5) 30px; }
.sbody > p.d, .sbody > p.point { margin: 0 0 var(--s1); }
.reading { margin: 0; padding: 0; list-style: none; }
.reading li { margin: 0 0 var(--s2); padding-left: var(--s3); position: relative; }
.reading li::before { content: ""; position: absolute; left: 0; top: .75em; width: 5px; height: 1.5px; background: var(--muted); }
.reading a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.reading a:hover { text-decoration-color: var(--ink); }
.reading .w { color: var(--muted); font-size: var(--fs-sm); margin-left: var(--s2); white-space: nowrap; }
.reading .why { display: block; color: var(--soft); font-size: var(--fs-sm); margin-top: 2px; }
.sbody figure { margin: var(--s4) 0 var(--s2); }
details.say { margin-top: var(--s4); }
details.say > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--accent); }
details.say > summary::-webkit-details-marker { display: none; }
details.say > summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin-top: -3px; }
details.say[open] > summary::after { transform: rotate(-135deg); margin-top: 3px; }
details.say > summary:hover { text-decoration: underline; text-underline-offset: 3px; }
details.item > .sbody { padding-left: 0; }
@media (max-width: 700px) { .sbody { padding-left: 0; } }
.session-end { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-top: var(--s5); }
.pager { display: flex; justify-content: space-between; gap: var(--s4); margin-top: var(--s6); padding-top: var(--s4); border-top: var(--hair); }
.pager a { display: flex; flex-direction: column; color: var(--ink); font-weight: var(--w-strong); max-width: 48%; }
.pager a span { font-weight: var(--w-regular); font-size: var(--fs-sm); color: var(--muted); }
.pager a.next { text-align: right; margin-left: auto; }
.pager a:hover { color: var(--accent); text-decoration: none; }

/* quiz: one question at a time */
.dq { padding: var(--s5) var(--s5) var(--s4); }
.dq .dots { display: flex; gap: var(--s1); margin-bottom: var(--s4); }
.dq .dots i { width: 20px; height: 3px; border-radius: 2px; background: var(--rule); }
.dq .dots i.on { background: var(--accent); }
.dq .dots i.got { background: var(--ok); }
.dq .qq { font-size: var(--fs-lg); font-weight: var(--w-strong); line-height: var(--lh-tight); }
.dq .model { margin-top: var(--s4); padding-left: var(--s3); border-left: 2px solid var(--ok); color: var(--soft); }
.dq .model b { display: block; font-size: var(--fs-sm); color: var(--ok); font-weight: var(--w-strong); }
.dq .row { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s4); align-items: center; }
.dq .row .grow { flex: 1; }
.dq .close { background: none; border: 0; color: var(--muted); font-size: var(--fs-sm); }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 var(--s4) var(--s7); }
  nav.side { display: none; }
  main { padding-top: var(--s5); }
  .top-in { padding: 0 var(--s4); gap: var(--s2); }
  .top .loopname, .prog, .count { display: none; }
  .tabs { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs a { padding: 2px 6px 0; white-space: nowrap; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
@media (prefers-reduced-motion: reduce) { details > summary::after { transition: none; } }

<script type="application/json" id="loop-data">{"id": "raydar", "title": "Raydar, Founding FDE", "subtitle": "AI screen, 15 minutes", "when": "Wednesday 30 September, morning (the time on your booking), Google Meet", "when_iso": "2026-09-30T09:00:00-05:00", "who": "The Raydar Interview Agent, an AI. A human at Raydar reviews the recording; David Phillips, the founder, then introduces fits to the hiring manager.", "format": "Ten to fifteen minutes on Google Meet, recorded and transcribed. Your background, what you want next, and pay (base, separate from equity). You can ask for a human at any point.", "bar": "The transcript is scored against a rubric and read by a person. Clear structure, a number in every story, the posting's own words used naturally. One or two minutes an answer, then stop.", "sessions": [], "scripts": [{"id": "intro", "title": "Tell me about yourself", "length": "about 90 seconds", "when": "The opener. The agent will quote from it, so land on the FDE line.", "probes": ["What does alfred_ do?", "What did you own?", "What are you looking for?"], "say": ["Sure. I started out in computer science research at UIC, where I worked on applied ML and LLM systems. That gave me a pretty strong foundation in actually building and evaluating these systems, rather than just using the models.", "From there I joined WheelPrice, which was a much more startup-oriented environment. I was working across the stack and got a lot more exposure to shipping things that were actually being used by customers. It was a small engineering team, so I had to be pretty broad — backend, AI, infrastructure, and product work all kind of blended together.", "After that I joined alfred_, where I've been working as a founding LLM engineer. It's an AI assistant, and my work has become much more focused on reliability and evaluation — things like building the eval harness, production failure detection, working memory, and making sure agent changes actually improve the product rather than just looking better on a benchmark.", "The common thread through all of that has really been building AI systems in environments where you don't have a perfectly defined problem in front of you. You have to figure out what's broken, decide what to build, and then own it through production.", "And that's pretty much what a forward deployed role is: sit with the business, figure out what's actually broken, and ship AI that people use, from the first deployment to adoption."], "swaps": [{"when": "If it asks what alfred_ is, in a line", "line": "An AI executive assistant that works over text message. It handles people's email and calendar end to end, for 5,000-plus active users."}], "land": "Research, then shipping for customers, then owning a production agent. FDE is that, across several businesses.", "notes": ["Paragraphs 1 to 4 are your words, unchanged. Only the last line is new.", "Stop after the last line."]}, {"id": "why-fde", "title": "Why this role? Why forward deployed?", "length": "about 60 seconds", "when": "Straight after the intro. It checks you understand the job and that it fits.", "probes": ["What do you know about the role?", "Have you worked with customers directly?", "Why founding?"], "say": ["From the posting, it's for a group that buys vertical software companies and wants to make each of them AI-first. The job is to build the forward deployed function: go into each business, run discovery with the people running it, and ship AI into real workflows, then stay until it's adopted.", "That's pretty close to how I already work. At WheelPrice we were two engineers, so I was building straight for customers: a React and Node content system serving 15 thousand daily users, where I took API p95 from 1.5 seconds to 300 milliseconds, and an AI assistant that could only answer through tools against verified data, because a wrong answer to a customer is worse than no answer.", "At alfred_ I work from real users' failures: I read the conversation, find what broke, fix it, and make sure it stays fixed with an eval case. That's the loop an FDE runs, with the customer in the room.", "And founding appeals to me because there's no playbook yet. I like building the thing and the way it gets built."], "swaps": [{"when": "If it asks about working with executives", "line": "At a small company you're never far from the person who owns the outcome. I've learned to start from what they measure, and to say plainly what AI will and won't do for it."}, {"when": "If it asks why founding", "line": "I've been a founding engineer at alfred_. I like owning the first version and deciding what gets built, not only building it."}], "land": "Discovery, ship into real workflows, stay until adoption; that's how I already work.", "notes": ["New, in your voice. Facts from the posting (Sources) and your master reference.", "Say 'from the posting', not 'I know'."], "never": ["Don't guess the client's name.", "Don't claim executive discovery work you haven't done."]}, {"id": "story", "title": "The one story, in STAR shape", "length": "about 90 seconds", "when": "Any 'tell me about a time' question: an impact, a hard problem, owning something end to end.", "probes": ["What was the result?", "What was your part?", "How did you measure it?"], "say": ["Situation: at alfred_, when I joined, nobody could say whether a new version of the agent was better than the old one. People tried it and had opinions.", "Task: we were about to rewrite how the agent handles back-and-forth conversations, and that's too big to check by trying it a few times.", "Action: I built a way to replay real user tasks against the new version before it ships. A little over a hundred cases, each from a real production failure, each running the real agent against a frozen copy of that user's email and calendar. A scanner reads real conversations daily, so new failures keep becoming cases.", "Result: that's how we signed off the rewrite. We could point at which cases got better and which got worse, and the agent reached the same results in fewer steps, about 2.5 tool calls per task down to 2.2."], "swaps": [{"when": "If it wants a win users felt", "line": "Texts about important emails used to arrive about ninety seconds after the email. The delay was a timer, not the work, so I triggered on the event instead. About three seconds now."}, {"when": "If it asks about cost or pragmatism", "line": "Not everything needs a model. Email rules were a model call on every message; I replaced that with a deterministic three-stage matcher: per-user LLM cost down 40%, under 50 milliseconds, same match accuracy."}, {"when": "If it asks about a hard technical problem", "line": "The model kept inventing email threads. Instead of prompting harder, I made it pick from a list of real items while code attaches the ids. It can't invent a thread anymore."}], "land": "Real failures became tests, and a full rewrite shipped with evidence.", "notes": ["Say the four labels in your head, not out loud, unless it asks for STAR.", "The swaps are three more stories in one line each.", "**Check before the call:** the resume says 40% for the matcher; the September code check found about 30%. Say the number you can defend, and if asked, say what it was measured over."]}, {"id": "next", "title": "What are you looking for next?", "length": "about 45 seconds", "when": "It asks this for matching across its clients too, so be specific and a little broad.", "probes": ["What kind of company?", "What kind of role?", "What matters most?"], "say": ["An early team shipping AI that people actually use. Forward deployed or applied AI engineering, where I'm close to the users and own things from the first version into production.", "The work I'm strongest at is agents in production: evaluation, reliability, and the infrastructure under them. I've also built real-time voice, a mock interview platform on LiveKit at under 400 milliseconds end to end, with its own LLM-as-judge grading.", "What matters most is ownership and a real problem. Stage matters less than that."], "land": "Early team, AI people use, close to users, owning it into production.", "notes": ["New, in your voice. MockFlow-AI facts from the master reference: LiveKit, Deepgram, sub-400ms latency.", "Location: the posting says New York or Chicago. Your answer is in chat."]}, {"id": "logistics", "title": "Logistics it will ask", "length": "a line each", "when": "Pay for certain; the rest maybe. Your answers are in chat, not on this public page.", "probes": ["What base salary are you looking for?", "Equity expectations?", "Where are you based? In office five days?", "Travel?", "Work authorization?", "When could you start?"], "say": [], "land": "Say each once, in one sentence, then stop.", "notes": ["**Base:** one number, from chat. The posting lists $200K to $300K base plus equity.", "**Equity:** 'Open, depending on the stage and the grant.'", "**Location and office:** the posting says New York or Chicago, five days in office, with frequent travel. Your answer from chat.", "**Work authorization and start date:** your answers from chat, one sentence each."], "never": ["Don't explain a logistics answer; the explanation becomes the transcript."]}], "drills": [{"id": "intro", "prompt": "Tell me about yourself.", "target": "90 seconds", "seconds": 90, "ref": "#say-intro"}, {"id": "stack", "prompt": "Walk me through your tech stack.", "target": "45 seconds", "seconds": 45, "ref": "#/prep"}, {"id": "where", "prompt": "Where does the alfred_ agent run?", "target": "30 seconds", "seconds": 30, "ref": "#/prep"}, {"id": "why-fde", "prompt": "Why this role, and why forward deployed?", "target": "60 seconds", "seconds": 60, "ref": "#say-why-fde"}, {"id": "story", "prompt": "Tell me about something you owned end to end, and the result.", "target": "90 seconds", "seconds": 90, "ref": "#say-story"}, {"id": "next", "prompt": "What are you looking for next?", "target": "45 seconds", "seconds": 45, "ref": "#say-next"}], "qa": [{"group": "Your stack, item by item", "blurb": "Walk me through your stack: the order to say it, and one what, where, number for each. The first follow-up on any item is a depth check.", "items": [{"q": "Walk me through your tech stack.", "short": "The whole stack, in 45 seconds", "tests": "Breadth, and whether it matches the resume.", "a": ["Mostly TypeScript and Python. On the backend, Node and Deno, FastAPI, with Postgres as the main database, plus Redis and MongoDB where I've needed them. React on the front end.", "For AI: LLM APIs, Claude and Gemini, with tool calling and MCP, and a lot of evaluation work. PyTorch for models, and LiveKit for real-time voice.", "For running it: Supabase, containers on Railway, Docker, CI/CD, and AWS for the research deployment."], "land": "TypeScript and Python; Postgres; LLM tooling and evals; Supabase, Docker and AWS to run it.", "notes": ["Say this, then stop. It will pick one item to go deeper on; the answers below are those."], "id": "q-walk-me-through-your-tech-stack"}, {"q": "Full stack: React and Node.", "short": "Full stack", "tests": "The posting's 'full stack'.", "a": ["At WheelPrice I owned a React, Node and MongoDB CMS serving about 15 thousand daily users. I took API p95 from 1.5 seconds to 300 milliseconds with query-plan tuning, connection pooling and Redis caching, and added server-side rendering and dynamic SEO, which lifted organic traffic 25%."], "land": "Resume: WheelPrice, the CMS bullet.", "notes": ["**Depth check, 'how did you find the slow part?':** read the query plans for the slowest endpoints first; the fixes were indexes and fewer round trips, then pooling, then Redis for the hot reads."], "id": "q-full-stack-react-and-node"}, {"q": "TypeScript and Python.", "short": "Languages", "tests": "Which, and for what.", "a": ["TypeScript for product and agent code: alfred_'s agent and its services are TypeScript on Deno and Node. Python for ML and research: the eval tooling, PyTorch, the MetaRAG and TeamMedAgents work, and FastAPI services."], "land": "TypeScript for the product, Python for ML and research.", "id": "q-typescript-and-python"}, {"q": "Postgres and data.", "short": "Postgres, Redis, MongoDB", "tests": "Real database work, not only CRUD.", "a": ["At alfred_ everything runs on one Postgres in Supabase: the data, row-level security, and the job queues too, with pgmq for queues and pg_cron for schedules, so long jobs don't need a separate broker.", "At WheelPrice it was MongoDB with Redis in front for the hot reads."], "land": "One Postgres doing data, security and queues.", "notes": ["**Depth check, 'why queues in Postgres?':** one system to run and back up, transactions across the job and the data, and our volume doesn't need Kafka. The trade-off: you watch table bloat and claim jobs with SKIP LOCKED."], "id": "q-postgres-and-data"}, {"q": "Where does the alfred_ agent actually run?", "short": "Where the agent runs", "tests": "Do you know your own system's infrastructure?", "a": ["A message comes in over SMS or the web and hits a Supabase edge function, which is Deno running serverless. That function runs the agent's turn: a LangGraph loop that calls the model and our tools, up to 12 steps on SMS and 50 on the web.", "Anything long, like reading through a whole inbox, goes onto a pgmq queue in Postgres and runs on worker containers on Railway. pg_cron is the backstop, so nothing gets dropped."], "land": "The turn in a Supabase edge function; long work on queued workers on Railway; Postgres underneath.", "notes": ["Say this one cold. Edge function first, then the queue and the workers."], "id": "q-where-does-the-alfred-agent-actually-run"}, {"q": "Data pipelines.", "short": "Data pipelines", "tests": "The posting's shared data infrastructure line.", "a": ["At alfred_ the agent's data comes from users' real inboxes and calendars, Gmail, Outlook and IMAP, at over 100 thousand emails a day through the rules engine. That runs through queues and scheduled jobs, with checks that the result is complete, not only well formed.", "At WheelPrice I shipped an XGBoost churn pipeline at 0.85 AUC that flagged at-risk accounts weekly for the ops team."], "land": "Resume: the matcher bullet (100K+ daily emails) and the churn pipeline.", "notes": ["**Depth check, 'how do you know it's complete?':** the ledger story: a check once passed a result missing two refunds, so tests now assert against the counts we hold."], "id": "q-data-pipelines"}, {"q": "LLM workflows and evals.", "short": "LLM workflows and evals", "tests": "The core of the role.", "a": ["It's most of my work. At alfred_ I built the eval harness from scratch: it replays real production scenarios against the real agent, scored by deterministic checks plus an LLM judge, and catches regressions across 12 failure classes in nightly runs.", "And I re-architected memory so recall is grounded in verified state, which cut fabricated recall and false confirmations by 80%."], "land": "Resume: alfred_, the first and third bullets.", "notes": ["**Depth check, 'how do you trust the LLM judge?':** deterministic checks wherever there's a right answer; the judge only for judgement calls. In MockFlow-AI I calibrated a judge against 50 human-graded items, weighted Cohen's kappa 0.82."], "id": "q-llm-workflows-and-evals"}, {"q": "Cloud and deployment.", "short": "Cloud and deployment", "tests": "Can you ship and run things.", "a": ["Supabase and Railway at alfred_, Docker and CI/CD for my projects, and AWS for MetaRAG's deployment at p99 under 300 milliseconds. At the UIC lab I deployed a quantized INT8 TorchScript audio model as a service at 150 milliseconds p95, for 200 concurrent users on the hospital network."], "land": "Resume: the UIC bullet and MetaRAG.", "notes": ["**If it asks about Kubernetes:** 'I've used Docker and managed platforms; I haven't run Kubernetes in production.' One sentence, honest, then move on."], "id": "q-cloud-and-deployment"}, {"q": "Voice and real-time.", "short": "Voice and real-time", "tests": "A differentiator.", "a": ["MockFlow-AI: a real-time voice interview platform on LiveKit with streaming speech-to-text and text-to-speech, under 400 milliseconds end to end. The interview moves through stages only when the model calls a transition tool, so it can't drift."], "land": "Resume: MockFlow-AI.", "notes": ["Worth one line in any answer about agents: you've built an AI interviewer yourself."], "id": "q-voice-and-real-time"}]}, {"group": "Resume lines to call out", "blurb": "The lines it may point at, in resume order, each with the one sentence to add.", "items": [{"q": "The eval harness (alfred_, bullet 1).", "short": "Eval harness", "tests": "Ownership of reliability.", "a": ["Built from scratch; replays real production scenarios; deterministic plus LLM-as-judge scoring; 12 failure classes; nightly. The sentence to add: it's how we signed off a full rewrite of the conversation handling."], "land": "It turned 'we think it's better' into evidence.", "id": "q-the-eval-harness-alfred-bullet-1"}, {"q": "The deterministic matcher (alfred_, bullet 2).", "short": "Matcher: cost down 40%", "tests": "Pragmatism: not everything needs a model.", "a": ["Per-message LLM calls in the email rules engine replaced by a three-stage deterministic matcher; per-user LLM cost down 40%, under 50 ms, same accuracy over 100K+ daily emails. The sentence to add: the model is the expensive fallback, not the default."], "land": "The model as the fallback, not the default.", "notes": ["Check the 40% before the call (see the story's notes)."], "id": "q-the-deterministic-matcher-alfred-bullet-2"}, {"q": "Grounded memory (alfred_, bullet 3).", "short": "Memory: 80% fewer fabrications", "tests": "Hallucination by design, not by prompt.", "a": ["Recall grounded in verified state; fabricated recall and false confirmations down 80%. The sentence to add: the model picks from real items and code attaches the ids, so it can't invent a thread."], "land": "Make the mistake impossible, not rarer.", "id": "q-grounded-memory-alfred-bullet-3"}, {"q": "The CMS latency (WheelPrice).", "short": "p95 1.5 s to 300 ms", "tests": "Backend performance.", "a": ["15K daily users; p95 1.5 s to 300 ms via query plans, pooling and Redis; SSR and SEO lifted organic traffic 25%. The sentence to add: I found it by reading the query plans of the slowest endpoints first."], "land": "Measure first, then fix the biggest one.", "id": "q-the-cms-latency-wheelprice"}, {"q": "The audio inference service (UIC).", "short": "INT8 audio model at 150 ms", "tests": "Inference and deployment.", "a": ["A quantized INT8 TorchScript audio model at 150 ms p95, with the Python and Postgres backend, 200 concurrent users across the hospital network. The sentence to add: quantizing was what made it fit the latency budget."], "land": "Quantize to fit the budget, then serve it.", "id": "q-the-audio-inference-service-uic"}, {"q": "MockFlow-AI's judge (Projects).", "short": "LLM-as-judge, kappa 0.82", "tests": "Evaluation rigour.", "a": ["Evidence-cited scoring across 5 competencies, the verdict computed in code, calibrated against 50 human-graded items at weighted Cohen's kappa 0.82. The sentence to add: the model gathers evidence; code makes the call."], "land": "The model cites evidence; code decides.", "id": "q-mockflow-ai-s-judge-projects"}]}, {"group": "The role", "blurb": "What an FDE does, and how your work maps to it.", "items": [{"q": "What does a forward deployed engineer do?", "short": "What an FDE is", "tests": "Do you understand the job?", "a": ["An engineer who sits with the customer instead of behind a product team. You find what's actually broken in their workflow, wire their systems together, ship something they use, and stay until it's adopted. Then you feed what you learned back, so the next deployment is faster.", "The hard part isn't the code. It's saying no to one-off custom work and building the pieces that carry over to the next customer."], "land": "Sit with the customer, ship what they use, stay until adoption, and reuse what you learn.", "id": "q-what-does-a-forward-deployed-engineer-do"}, {"q": "How would you approach a new portfolio company?", "short": "A new company, day one", "tests": "Discovery before building.", "a": ["Start with the people running it: what they measure, where time goes, and which work is repeated. Then read the data, because the workflow on paper is never the real one.", "Pick one workflow where AI saves real hours and a wrong answer is cheap to catch. Ship a small version in weeks, measure it against what they measure, and only then widen it. And check it against real cases before it goes live, the same way I do at alfred_."], "land": "Listen, read the data, ship one small thing that's measured, then widen.", "id": "q-how-would-you-approach-a-new-portfolio-company"}, {"q": "Tell me about working with data pipelines and messy data.", "short": "Data and integrations", "tests": "The posting's data infrastructure line.", "a": ["At alfred_ everything the agent knows comes from people's real inboxes and calendars across Gmail, Outlook and IMAP, so most of my data work is making messy sources reliable: queues for long jobs, scheduled backstops so nothing gets dropped, and checks that the result is complete, not just well shaped.", "The lesson that stuck: a test once passed a financial ledger that left out two refunds. Now we check against the ground truth we hold."], "land": "Messy real sources, made reliable, checked against ground truth.", "id": "q-tell-me-about-working-with-data-pipelines-and-messy-data"}]}], "ask": [], "ask3": [{"id": "agent", "title": "For the agent, at the end", "when": "When it asks if you have questions.", "why": "It records these, and David reads them. Keep them practical.", "how": ["One or two, short."], "items": [{"to": "Agent", "q": "What happens after this call, and when would I hear back?", "loop": "First.", "why": "Practical, and it tells you the timeline."}, {"to": "Agent", "q": "Can you tell me more about the company behind the role, and how the FDE team would be set up?", "loop": "If there's time.", "why": "The client isn't named; this invites David to tell you."}, {"to": "Agent", "q": "Are there other roles you'd match me with, in applied AI or forward deployed work?", "loop": "Last.", "why": "Uses the matching it offers."}]}, {"id": "david", "title": "For David or the hiring manager, later", "when": "The next call, not this one.", "why": "Keep them for a person.", "how": ["Save these."], "items": [{"to": "Hiring manager", "q": "Which workflows in the portfolio do you expect AI to change first?", "loop": "Early.", "why": "Shows you think in outcomes."}, {"to": "Hiring manager", "q": "How is an FDE's work measured: adoption, hours saved, revenue?", "loop": "Middle.", "why": "What you'd be judged on."}, {"to": "Hiring manager", "q": "How do you decide what becomes shared across companies and what stays custom?", "loop": "Middle.", "why": "The hard part of the job, asked as curiosity."}]}], "traps": [["Reading a script aloud", "It hears the flatness and the rubric rewards substance, not polish. Know the points; say them."], ["Keyword stuffing", "Use the posting's words where they're true. A list of terms reads badly in a transcript."], ["Talking over it", "Wait a beat after it stops. If you cut each other off, let it finish, then answer."], ["Leaving the result unsaid", "It can't infer 'and it worked'. Say the number."], ["A vague pay answer", "It asks base directly. One number."], ["Raising logistics first", "Work authorization and relocation only if asked. One sentence each."], ["The wrong posting", "Another 'Founding Forward Deployed Engineer' in New York is at Frontdesk, a different company."], ["Funding, crunch, colleagues' names", "Never, about alfred_."]], "tables": [], "admire": "", "kitaruLead": "", "figures": [], "mockHow": "Say 'run the Raydar mock' in chat: an AI-style screener, fifteen minutes, background, goals and pay.", "mocks": [], "planKicker": "Before the call", "mechTitle": "", "designLink": null, "extra": "The posting and what Raydar publishes are under <b>What this rests on<\/b> on the Prep tab. Refresh the basics on Baseline: <a href=\"../BASELINE.html#/ai\" target=\"_blank\" rel=\"noopener\">AI engineering<\/a>, <a href=\"../BASELINE.html#/backend\" target=\"_blank\" rel=\"noopener\">Backend<\/a>, <a href=\"../BASELINE.html#/data\" target=\"_blank\" rel=\"noopener\">Data<\/a>, <a href=\"../BASELINE.html#/cloud\" target=\"_blank\" rel=\"noopener\">Cloud<\/a>.", "emphasis": [], "own": null, "showUp": [["It grades the transcript, not your voice.", "Vendors that publish how they work score what you said against a rubric, with a reason and your quoted words for each score, and a person reads it. HireVue says it uses the transcript only. So the words count; pace and accent don't."], ["Say the tool's name out loud.", "'Postgres', 'LiveKit', 'Supabase edge functions', 'Redis'. A transcript can only quote what you said; 'our database' scores nothing."], ["Every answer: what, where, a number, in production.", "'At WheelPrice I cut API p95 from 1.5 seconds to 300 milliseconds with query-plan tuning, pooling and Redis.' That one sentence is the whole shape."], ["Keep the resume's numbers exactly.", "Some agents check what you say against your resume, and the reviewer sees both. Use the numbers on the resume you applied with, word for word."], ["The first follow-up is a depth check.", "'Tell me more about X' means: one decision you made, one trade-off, one result. Then stop. Don't open a new topic."], ["Thirty to forty-five seconds a stack item; up to two minutes a story.", "Then stop. It asks when it wants more."], ["No reading, no tab switching.", "Several vendors flag scripted answers, reading off a second screen, and switching tabs. Glance at a one-line note, then look at the camera."], ["Wait a beat before you speak.", "Voice agents can cut in on a pause. If it interrupts, finish your sentence; if it mishears, correct it plainly."], ["Pay: one base number, equity separate.", "Raydar asks base apart from equity. Your number is in chat; say it once."], ["If it goes wrong, ask for a human.", "Raydar says you can, at any time, with no penalty."]], "prepLead": "One hour. Read how to show up (5 minutes). Say the stack walk-through and the resume lines out loud, item by item (25 minutes). Then the intro, why FDE, the one story and what you want next, with a timer (25 minutes). Have your pay number written down.", "storyBlurb": "Your intro, why FDE, the one story in STAR shape, what you want next, and logistics.", "sources": [{"label": "Founding Forward Deployed Engineer: the job post (Workable)", "url": "https://jobs.workable.com/view/4KUx4od5tWQuAWeMoxENqF/founding-forward-deployed-engineer-in-chicago-at-raydar", "why": "For an unnamed AI-first permanent-capital group that buys vertical SaaS companies: $50M+ raised, 8 businesses in under 2 years. Build the forward-deployed function, run discovery with executives, own deployments through adoption, build shared data infrastructure. 3 to 5 years; full stack, systems, data pipelines, LLM workflows. New York or Chicago, in office, travel."}, {"label": "The same posting on Raydar's Workable page", "url": "https://apply.workable.com/raydar/j/6198E62EFE/", "why": "The original; the mirror above has the full text."}, {"label": "Raydar: how it works", "url": "https://www.raydar.xyz/how-it-works", "why": "Free for candidates. The agent: Google Meet, 15 minutes, background, what you want next, base pay separate from equity; recorded and transcribed; ask for a human any time."}, {"label": "Raydar: company site", "url": "https://www.raydar.xyz", "why": "An AI-powered recruiting agency. The team reviews every application; strong ones get the AI interview, then placement support."}, {"label": "Raydar: open roles", "url": "https://www.raydar.xyz/open-roles", "why": "Other roles it may match you to, including a Forward Deployed ML Engineer."}, {"label": "The Palantirization of everything (a16z)", "url": "https://a16z.com/the-palantirization-of-everything/", "why": "What an FDE is: embedded with the customer, wiring systems together, driving adoption, feeding back to product, and saying no to one-off custom work."}, {"label": "Forward deployed engineers (The Pragmatic Engineer)", "url": "https://newsletter.pragmaticengineer.com/p/forward-deployed-engineers", "why": "How FDEs are screened: shipped work owned end to end, ambiguity, technical depth and communication."}, {"label": "AI interviews explained (HeyMilo, an AI interview vendor)", "url": "https://blog.heymilo.ai/ai-interviews-explained-what-candidates-and-recruiters-need-to-know", "why": "The agent scores each answer against a rubric, with a rationale and timestamped quotes; a person decides."}, {"label": "How HeyMilo's scoring works (docs)", "url": "https://docs.admin.heymilo.ai/creating-your-interview-agents/how-our-scoring-system-works", "why": "A 1 to 5 scale: the recruiter defines a 1 and a 5, the AI places you between, with a reason per score; the recruiter can override."}, {"label": "AI interviewers for hiring (BrightHire)", "url": "https://brighthire.com/ai-interviewers-for-hiring-the-complete-guide/", "why": "Questions are summary, yes/no qualification, or rubric-scored; recruiters get the transcript, recording, summary and scores with reasoning; follow-ups adapt."}, {"label": "AI screening interviews (Metaview)", "url": "https://www.metaview.ai/resources/blog/ai-screening-interviews", "why": "Screens verify application claims and surface gaps between the resume and the conversation; vague answers get a follow-up."}, {"label": "AI in hiring (HireVue)", "url": "https://www.hirevue.com/ai-in-hiring", "why": "Scores the transcript only: no facial, video or audio analysis."}, {"label": "What to expect in a Tenzo AI interview (review)", "url": "https://recruitingtechreviews.com/articles/tenzo-ai-interview-what-to-expect", "why": "The agent references your resume during the call; tab switching and copy-paste are flagged."}], "company": [], "posting": null, "rounds": []}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; o.rev = o.rev || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }
    var sm = el("summary", "", '<span class="qt">' + inl(title) + "</span>" + (meta ? '<span class="qm">' + meta + "</span>" : ""));
    d.appendChild(sm); d.appendChild(body);
    return d;
  }
  function bulk(host) {
    var b = el("div", "bulk");
    var o = el("button", "", "Open all"), c = el("button", "", "Close all");
    o.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = true; }); });
    c.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = false; }); });
    b.appendChild(o); b.appendChild(c);
    host.appendChild(b);
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });
    (s.study || []).forEach(function (_, i) { k.push(s.id + ":s" + i); });
    return k;
  }
  function isDone(t, s) { return !!t.done[s.id]; }
  function link(tab, anchor) { return "#/" + tab + (anchor ? "/" + anchor : ""); }
  /* A drill's reference is either a route already or an anchor on the prep tab. */
  function prepRef(r) { return r.indexOf("#/") === 0 ? r : link("prep", r.replace(/^#/, "")); }

  /* ---------------------------------------------------------------- tabs */
  var TABS = [
    { id: "overview", label: "Overview", show: function () { return true; } },
    { id: "prep", label: "Prep", show: function () { return LOOP.scripts.length || LOOP.drills.length || LOOP.qa.length || LOOP.ask.length || (LOOP.ask3 || []).length; } },
    { id: "rounds", label: "Rounds", show: function () { return (LOOP.rounds || []).length; } },
    { id: "design", label: "Design", show: function () { return LOOP.tables.length || LOOP.figures.length; } },
    { id: "own", label: (LOOP.own && LOOP.own.tab) || "Yours", show: function () { return !!LOOP.own; } },
    { id: "sessions", label: "Sessions", show: function () { return LOOP.sessions.length; } },
    { id: "mocks", label: "Mocks", show: function () { return !!LOOP.mockHow; } }
  ].filter(function (t) { return t.show(); });
  var main = document.getElementById("main");
  var side = document.getElementById("side");
  var nav = [];            /* side links for the current tab: [anchor, label, sub] */

  function heading(host, id, kicker, title, sub) {
    var s = el("section", "block"); s.id = id;
    if (title) { s.appendChild(el("h2", "", esc(title))); }
    if (kicker) { s.appendChild(el("p", "hsub", esc(kicker))); }
    host.appendChild(s);
    nav.push([id, title || kicker, !!sub]);
    return s;
  }

  /* ---------------------------------------------------------------- overview
     The call, the company, the role from its posting, how to show up, how to prepare. */
  function tabOverview(host) {
    var s = el("section", "block"); s.id = "brief";
    s.appendChild(el("h1", "", esc(LOOP.title)));
    s.appendChild(el("p", "hsub", esc(LOOP.subtitle)));
    s.appendChild(el("p", "lead", esc(LOOP.format)));
    var P = LOOP.posting;
    var dl = el("dl", "facts");
    dl.innerHTML = "<dt>When</dt><dd>" + esc(LOOP.when) + "</dd><dt>Who</dt><dd>" + esc(LOOP.who) + "</dd>" +
      (P && P.url ? '<dt>Posting</dt><dd><a href="' + esc(P.url) + '" target="_blank" rel="noopener">' + esc(P.label || "The job description") + "</a></dd>" : "");
    s.appendChild(dl);
    host.appendChild(s);
    nav.push(["brief", "The call"]);

    if (LOOP.company && LOOP.company.length) {
      var c = heading(host, "company", "", "The company");
      LOOP.company.forEach(function (p) { c.appendChild(el("p", "lead", inl(p))); });
    }
    if (P) {
      var r = heading(host, "role", "", "The role");
      if (P.lead) { r.appendChild(el("p", "lead", inl(P.lead))); }
      if (P.facts && P.facts.length) {
        var fd = el("dl", "facts wide");
        P.facts.forEach(function (f) { fd.appendChild(el("dt", "", esc(f[0]))); fd.appendChild(el("dd", "", inl(f[1]))); });
        r.appendChild(fd);
      }
      var cols = el("div", "role-cols");
      [["What you would do", P.does], ["What they look for", P.wants]].forEach(function (k) {
        if (!k[1] || !k[1].length) { return; }
        var box = el("div");
        box.appendChild(el("h3", "", esc(k[0])));
        panelList(k[1]).forEach(function (u) { box.appendChild(u); });
        cols.appendChild(box);
      });
      r.appendChild(cols);
      if (P.url) { r.appendChild(el("p", "lead", '<a href="' + esc(P.url) + '" target="_blank" rel="noopener">Read the full posting</a>' + (P.checked ? ", checked " + esc(P.checked) + "." : "."))); }
    }
    if (LOOP.showUp && LOOP.showUp.length) {
      var u = heading(host, "show-up", "", "How to show up");
      var ol = el("ol", "showup");
      LOOP.showUp.forEach(function (x) { ol.appendChild(el("li", "", "<b>" + inl(x[0]) + "</b> " + inl(x[1]))); });
      u.appendChild(ol);
    }
    var p = heading(host, "plan", "", "How to prepare");
    if (LOOP.bar) { p.appendChild(el("p", "bar", "<b>The bar.</b> " + inl(LOOP.bar))); }
    if (LOOP.extra) { p.appendChild(el("div", "lead", LOOP.extra)); }
    if (LOOP.sessions.length) {
      var t = tracker(), days = {}, order = [];
      LOOP.sessions.forEach(function (x) {
        if (!days[x.day]) { days[x.day] = []; order.push(x.day); }
        days[x.day].push(x);
      });
      var wrap = el("div", "days");
      order.forEach(function (d) {
        var box = el("div", "day");
        box.appendChild(el("h3", "", esc(d)));
        days[d].forEach(function (x) {
          var a = el("a", "srow" + (isDone(t, x) ? " done" : ""));
          a.href = link("sessions", x.id);
          a.innerHTML = '<span class="dot"></span><span><span class="nm">' + esc(x.name) +
            '</span><span class="bl">' + esc(x.blurb.replace(/^(Friday|Saturday|Sunday)[^.]*\.\s*/, "")) + '</span></span><span class="hrs">' + esc(x.len) + "</span>";
          box.appendChild(a);
        });
        wrap.appendChild(box);
      });
      p.appendChild(wrap);
    }
    var go = el("div", "acts");
    TABS.filter(function (x) { return x.id !== "overview"; }).forEach(function (x) {
      var a = el("a", "btn", esc(x.label)); a.href = link(x.id); go.appendChild(a);
    });
    p.appendChild(go);
  }

  /* ---------------------------------------------------------------- prep: the question bank
     Sections in order: your intro and story, each bank of questions, logistics, practising
     aloud, and the questions you ask. A question opens in place, one at a time: how to
     understand it on the left, what to say on the dark sheet. */
  function scriptItem(x) {
    return { id: "say-" + x.id, q: x.title, short: x.short || x.title, tests: x.when, a: x.say, land: x.land, never: x.never, notes: x.notes,
      probes: x.probes, swaps: x.swaps, learn: x.figs ? { figs: x.figs } : null,
      meta: x.length ? x.length.charAt(0).toUpperCase() + x.length.slice(1) + "." : "",
      drill: LOOP.drills.some(function (d) { return d.id === x.id; }) ? x.id : null };
  }
  function prepBanks() {
    var banks = [], story = LOOP.scripts.filter(function (x) { return x.id !== "logistics"; });
    if (story.length) { banks.push({ id: "story", title: "Your intro and story", blurb: LOOP.storyBlurb || "", items: story.map(scriptItem) }); }
    LOOP.qa.forEach(function (g, gi) { banks.push({ id: "qa-" + gi, title: g.group, blurb: g.blurb || "", items: g.items }); });
    var lg = LOOP.scripts.filter(function (x) { return x.id === "logistics"; });
    if (lg.length) { banks.push({ id: "logistics", title: "Logistics", blurb: "Your answers stay in chat; how to handle each is here.", items: lg.map(scriptItem) }); }
    return banks;
  }
  function prepBody(x) {
    var c = el("div", "cv-cols pq-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "cv-col cv-say");
    c.appendChild(left); c.appendChild(right);

  var VERDICT = { landed: "Landed", partly: "Partly", missed: "Missed", gap: "Gap: you did not have an answer" };
  function tabMocks(host) {
    var s = heading(host, "mock", "Run in chat", "Mock interviews");
    s.appendChild(el("p", "lead", inl(LOOP.mockHow)));
    if (!LOOP.mocks.length) {
      s.appendChild(el("p", "when", "None yet. After a mock in chat, its read and its exchanges appear here. The latest two are kept."));
    }
    LOOP.mocks.slice(-2).reverse().forEach(function (m, mi) { drawMock(host, m, mi); });
  }
  function drawMock(host, m, mi) {
    var pre = m.id || "m" + mi;
    var s = heading(host, pre, m.when, m.title);
    var ex = m.exchanges || [];
    if (!ex.length && m.critique) { s.appendChild(el("p", "", inl(m.critique))); return; }
    var tally = {};
    ex.forEach(function (x) { tally[x.verdict] = (tally[x.verdict] || 0) + 1; });
    s.appendChild(el("p", "mk-tally", ["landed", "partly", "missed", "gap"].filter(function (k) { return tally[k]; })
      .map(function (k) { return '<span class="vd vd-' + k + '"></span>' + tally[k] + " " + (k === "gap" ? "gaps" : k); }).join('<span class="sep"></span>') +
      '<span class="sep"></span>' + ex.length + " exchanges"));
    (m.read || []).forEach(function (p) { s.appendChild(el("p", "mk-read", inl(p))); });
    if (m.landed && m.landed.length) {
      s.appendChild(el("h3", "mk-h", "What landed"));
      var ul = el("ul", "mk-list");
      m.landed.forEach(function (t) { ul.appendChild(el("li", "", inl(t))); });
      s.appendChild(ul);
    }
    if (m.fix && m.fix.length) {
      s.appendChild(el("h3", "mk-h", "Fix these first"));
      var ol = el("ol", "mk-list mk-fix");
      m.fix.forEach(function (f) {
        var li = el("li", "", inl(f.t) + " ");
        var at = ex.findIndex(function (x) { return x.id === f.ref; });
        if (at >= 0) { li.appendChild(openLink("See turn " + (at + 1), m, at)); }
        ol.appendChild(li);
      });
      s.appendChild(ol);
    }
    /* The turns, one line each; the conversation itself opens in one screen. */
    var c = heading(host, pre + "-talk", "Every turn, in one screen", "The conversation");
    var go = el("button", "btn primary", "Open the conversation");
    go.addEventListener("click", function () { openConvo(m, 0); });
    c.appendChild(el("div", "acts")).appendChild(go);
    var list = el("ol", "turns");
    ex.forEach(function (x, i) {
      var li = el("li");
      var b = el("button", "turn");
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) +
        '</span><span class="tw spk-' + esc((x.who || "").toLowerCase()) + '">' + esc(x.who) + "</span>";
      b.addEventListener("click", function () { openConvo(m, i); });
      li.appendChild(b); list.appendChild(li);
    });
    c.appendChild(list);
  }
  function openLink(text, m, i) {
    var a = el("button", "linkish", esc(text));
    a.addEventListener("click", function () { openConvo(m, i); });
    return a;
  }

  /* One screen, shared by mocks and the Prep banks: a list on the left, the chosen item on
     the right. The item's header is small; under it, the light column is for understanding
     and the dark sheet is what to say, each scrolling on its own. Arrows move; Escape closes. */
  var convo = document.getElementById("convo");
  function panelSection(host, label, nodes) {
    if (!nodes.length) { return; }
    host.appendChild(el("div", "lab", label));
    nodes.forEach(function (n) { host.appendChild(n); });
  }
  function panelList(items, cls) {
    if (!items || !items.length) { return []; }
    var u = el("ul", "mk-list " + (cls || ""));
    items.forEach(function (t) { u.appendChild(el("li", "", inl(t))); });
    return [u];
  }
  /* o: { title, sub, label, count, row(i) -> html for the rail, draw(i, pane), start } */
  function openPanel(o) {
    var cur = o.start || 0;
    convo.innerHTML = "";
    convo.setAttribute("aria-label", o.label || o.title);
    var shell = el("div", "cv");
    var rail = el("nav", "cv-rail");
    rail.appendChild(el("div", "cv-title", "<b>" + esc(o.title) + "</b>" + (o.sub ? "<span>" + esc(o.sub) + "</span>" : "")));
    var rows = [];
    for (var i = 0; i < o.count; i++) {
      (function (i) {
        var b = el("button", "turn");
        b.innerHTML = o.row(i);
        b.addEventListener("click", function () { show(i); });
        rail.appendChild(b);
        rows.push(b);
      }(i));
    }
    rail.appendChild(el("div", "cv-keys", "Up and down arrows move. Escape closes."));
    var pane = el("section", "cv-pane");
    var close = el("button", "cv-close", "Close");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", function () { convo.close(); });
    shell.appendChild(rail); shell.appendChild(pane);
    convo.appendChild(close); convo.appendChild(shell);
    function show(i) {
      cur = i;
      rows.forEach(function (b, j) { b.classList.toggle("on", j === i); if (j === i) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); } });
      rows[i].scrollIntoView({ block: "nearest" });
      pane.innerHTML = "";
      o.draw(i, pane, function () { rows[i].innerHTML = o.row(i); });
      [].forEach.call(pane.querySelectorAll(".cv-col"), function (c) { c.scrollTop = 0; });
    }
    convo.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = cur + (e.key === "ArrowDown" ? 1 : -1);
        if (n >= 0 && n < o.count) { show(n); rows[n].focus(); }
      }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    rows[cur].focus();
  }
  function panelCols(pane, leftTitle, rightTitle) {
    var cols = el("div", "cv-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "cv-col cv-say");
    left.appendChild(el("h3", "cv-h", leftTitle));
    right.appendChild(el("h3", "cv-h", rightTitle));
    cols.appendChild(left); cols.appendChild(right);
    pane.appendChild(cols);
    return { left: left, right: right, cols: cols };
  }

  /* A mock: what they asked and how it landed; what you said; what to say. */
  function openConvo(m, start) {
    var ex = m.exchanges;
    openPanel({
      title: m.title, sub: m.when, label: "Mock conversation", count: ex.length, start: start,
      row: function (i) {
        var x = ex[i];
        return '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) + "</span>";
      },
      draw: function (i, pane) {
        var x = ex[i], who = (x.who || "").toLowerCase();
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q spk-" + who, '<span class="ex-who">Turn ' + (i + 1) + " of " + ex.length + ", " + esc(x.who) + "</span>" + inl(x.q)));
        head.appendChild(el("p", "cv-verdict", '<span class="vd vd-' + esc(x.verdict) + '"></span><b>' + esc(VERDICT[x.verdict] || x.verdict) + ".</b> " + inl(x.why || "")));
        if (x.tests) { head.appendChild(el("p", "cv-tests", "<b>They were testing:</b> " + inl(x.tests))); }
        pane.appendChild(head);
        var c = panelCols(pane, "What you said", "What to say");
        panelSection(c.left, "In short", (x.said || []).map(function (p) { return el("p", "ex-said", inl(p)); }));
        panelSection(c.left, "What worked", panelList(x.good, "mk-good"));
        panelSection(c.left, "What did not", panelList(x.bad, "mk-bad"));
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.say && x.say.length) { c.right.appendChild(transcript(x.say, "You", "")); }
        panelSection(c.right, "How to approach it", panelList(x.approach));
        (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.right.appendChild(f); } });
        var links = [];
        if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
        if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
        if (links.length) { c.right.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      }
    });
  }

  /* A Prep question can be marked revised; the mark is kept in this page's storage. */
  function isRevised(id) { return !!own().rev[id]; }
  function setRevised(id, on) {
    var o = own();
    if (on) { o.rev[id] = stamp(); } else { delete o.rev[id]; }
    writeJSON(OWN, o);
  }
  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    return { tab: tab, anchor: p[1] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = link(t.id);
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = [];
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "rounds") { tabRounds(main); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "mocks") { tabMocks(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    drawTabs(r.tab); drawSide(r.tab); progress();
    var key = r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var c = document.getElementById("count");
    if (!LOOP.when_iso) { c.textContent = "Date to be set"; return; }
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
</html>
