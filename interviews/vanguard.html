ch escalation is a bug signal?", "o": ["The user fails three times at one task and is handed off", "A business rule sends a large transfer to a person", "The user types 'agent' in the very first turn", "A compliance rule escalates any mention of fraud", "A refusal on an investment advice question"], "a": 0, "why": "Business rules and compliance escalations are system intended, and asking for a person is user requested. A user stuck after repeated failures is system unintended: the one that means the bot is failing."}], "open": {"q": "Today every failed conversation in our assistant gets logged as 'bot did not understand'. How would you break that down so it is useful?", "probe": "Whether he can build a taxonomy that routes each fix to an owner, and knows outcome metrics blame the last layer.", "a": ["Tag each failed conversation with one primary cause, the first layer that went wrong: ASR, NLU miss, wrong intent, missing intent, slot, flow, backend, knowledge gap, policy or abandonment.", "Tag from the full trace (transcript, ASR confidence, top intents with scores, slots, backend results), not the final reply, because symptoms cascade.", "Set expected outcomes apart (policy refusals, intended escalations), and add LLM rows: retrieval, grounding, tool call.", "Add severity, so missed disputes, wrong fees or balances, doom loops and blocked human access are counted on their own.", "Report a Pareto of lost conversations by cause, so each bucket goes to its owner: designer, ML, platform or another team's API."]}, "say": ["**I'd tag every failed conversation with the first layer that went wrong, because each layer has its own owner.**", "**First failure:** ASR, NLU, flow, backend or policy, read from the whole trace, not the last symptom.", "**Wrong versus missing:** a wrong intent is a data problem, a missing intent is a design gap.", "**My version:** the failure scanner at alfred_ flags candidates with deterministic signals, an LLM classifies each one, and expected behaviour is kept apart from real agent bugs.", "Then the biggest bucket gets fixed first."], "avoid": ["Using 'the bot did not understand' as a cause: it lumps five different fixes into one", "Counting policy refusals and intended escalations as errors"], "was": ["b-error-taxonomy", "a-error-analysis"], "res": [{"kind": "clip", "req": true, "label": "Explainer: the assistant improvement loop", "url": "../media/videos/assistant-improvement-loop.mp4", "m": 4, "why": "How a live assistant gets better each week: redact, find failures without labels, cluster, label where it counts, and gate every release per intent."}, {"kind": "video", "req": true, "label": "Error analysis: the highest ROI technique in AI engineering", "url": "https://www.youtube.com/watch?v=e2i6JbU2R-s", "m": 13, "why": "Read traces, tag the first thing that went wrong, count the tags: the taxonomy method.", "yt": {"id": "e2i6JbU2R-s", "ch": "Hamel Husain"}}, {"kind": "read", "req": true, "label": "Microsoft Learn: Monitor conversational agents (Copilot Studio)", "url": "https://learn.microsoft.com/en-us/microsoft-copilot-studio/analytics-improve-agent-effectiveness", "m": 8, "why": "The three escalation reasons and why only one is a bug signal."}, {"kind": "video", "req": false, "label": "LLM eval office hours: start with error analysis", "url": "https://www.youtube.com/watch?v=ZEvXvyY17Ys", "m": 24, "why": "Q and A on building failure categories from real conversations.", "yt": {"id": "ZEvXvyY17Ys", "ch": "Hamel Husain"}}, {"kind": "video", "req": false, "label": "Failure is an option: how to help your chatbot fail", "url": "https://www.youtube.com/watch?v=1DDdFUQSTJE", "m": 43, "why": "Conversation design view of fallback and failure types. Watch the first 25 minutes.", "yt": {"id": "1DDdFUQSTJE", "ch": "Hillary Black"}}, {"kind": "read", "req": false, "label": "Amazon Lex V2: Key definitions (analytics)", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/analytics-key-definitions.html", "m": 6, "why": "Exact outcome states for utterances, intents and slots, which map onto a taxonomy."}]}, {"id": "errors-review", "title": "Transcript review that closes the loop", "brief": "Review is a sampling plan plus a labelling process, not reading. Keep a targeted stream (fallbacks, low confidence, escalations, thumbs down, rephrasing) to find defects fast, and a smaller random stream to estimate the true error rate. The nuance: confident wrong answers never trigger a fallback, so only the random stream and outcome signals find them, and a review that does not end in an artifact is only a reading habit.", "points": ["Two streams: targeted finds defects quickly but biases the picture; random measures the real rate", "Whole conversations: many failures are dialogue failures (a loop, a lost goal) that a per-utterance metric never shows", "Labelling: a guide with edge-case rulings, one primary cause each, two labellers on a subset with agreement measured (Cohen's kappa), and a gold set", "Artifacts: every finding ends as a training example, a regression test or a ticket for another team; a note is not an output", "LLM judge for triage: it scores a sample against a rubric for coverage; calibrate it against human labels, and keep people on the high-severity calls", "Redact first: in finance reviewers see masked transcripts, with role-based and logged access"], "figs": ["errorLoop"], "production": ["Rasa's conversation-driven development loop is share, review, annotate, test, track, fix. Its guidance drops very short conversations and internal test channels and puts fallbacks and low-confidence NLU first; Studio filters by intent, flow, channel, slots and tags.", "DoorDash read thousands of transcripts by hand first, then prompted an LLM judge with open questions, summarised the answers into recurring issue types, and calibrated the judge against human-labelled random samples (secondary summary).", "Capital One has human subject-matter experts audit complex financial logic and calibrate its LLM judges: automation for coverage, people for ground truth.", "The MT-bench study found strong judges agree with humans over 80% of the time, about the human-to-human rate, but show position, verbosity and self-enhancement biases.", "Copilot Studio samples answered questions and rates them Good or Poor on completeness, relevance and groundedness, with a reason for each Poor: a sampled quality metric, not a full audit."], "mcq": [{"q": "Your targeted review queue (fallbacks, low confidence) looks clean, but repeat calls on the same issue keep rising. What is the likely blind spot?", "o": ["Too few labellers on the targeted stream", "Confident wrong answers, which never reach the queue", "A fallback threshold that is set too high", "ASR errors that only happen on voice calls", "Out-of-scope requests the bot refused correctly"], "a": 1, "why": "A confident wrong answer passes the threshold, so a fallback-driven queue never sees it. Random sampling and outcome signals such as repeat contact catch it, and it hints the threshold is too low."}, {"q": "Why keep a small random sample next to the targeted one?", "o": ["Random samples find more defects per hour of review", "Targeted samples cannot be labelled consistently", "Regulators require all review to be random", "To estimate the true error rate without selection bias", "Random samples do not need a labelling guide"], "a": 3, "why": "The targeted stream is chosen for likely defects, so its error rate says nothing about traffic as a whole. A random slice gives the unbiased rate."}, {"q": "Two reviewers label the same 200 conversations and agree on the primary cause only 55% of the time. What does that most likely tell you?", "o": ["The categories overlap or edge cases lack rulings", "The intent model is underfitting the hard cases", "One reviewer should become the only labeller", "The sample is too small to say anything", "An LLM judge should replace both reviewers"], "a": 0, "why": "Low agreement between people usually means the taxonomy or guide is ambiguous. Fix the guide before you train anything, model or judge, on those labels."}, {"q": "An LLM judge agrees with your reviewers 85% of the time overall, but misses most answers that state a wrong fee. How do you use it?", "o": ["As the release gate for every category", "Not at all, since below 90% is not usable", "With a higher temperature so it explores more", "To judge its own outputs and save cost", "For triage, with people on fee and dispute cases"], "a": 4, "why": "Agreement is per criterion, not overall. Use the judge where it matches people, and keep humans on the high-severity categories where it does not."}], "open": {"q": "You get a few hours a week to review conversations. How do you structure it so it actually improves the assistant?", "probe": "A repeatable process with sampling, labelling and outputs, not ad hoc reading.", "a": ["Two streams: targeted (escalations, abandoned sessions, low confidence, negative feedback) and a small random slice to estimate the real rate.", "Read whole conversations with their traces; tag one primary cause from a fixed taxonomy plus the correct intent and entities.", "Measure agreement on a double-labelled subset and add rulings where people disagree.", "Let a calibrated LLM judge pre-sort the volume; people decide the high-severity cases.", "Every finding ends as a training example, a test or a ticket, and the share of causes ranks next week's work."]}, "say": ["**I'd run two streams and make every review end in an artifact.**", "**Two streams:** a targeted one for escalations and low-confidence turns, and a small random one so I can still estimate the real error rate.", "**Close the loop:** every reviewed conversation becomes a training example, a test case or a ticket. If it ends as a note, the loop is not closed.", "**Judge for coverage:** at alfred_ the scanner does the first sort, detectors flag candidates and an LLM classifies them. I still read the real cases before deciding anything.", "The judge is for coverage, not the last word."], "avoid": ["Claiming an LLM judge can replace people on compliance-sensitive cases", "Reviewing only low-confidence turns: those are already routed to fallback"], "was": ["b-conversation-review", "b-llm-eval-regulated", "q-how-do-you-structure-transcript-review", "q-how-do-you-use-an-llm-as-a-judge-on-conversations-and-where-"], "res": [{"kind": "video", "req": true, "label": "Error analysis: the highest ROI technique in AI engineering", "url": "https://www.youtube.com/watch?v=e2i6JbU2R-s", "m": 13, "why": "Reading real failures and naming the first thing that went wrong, before building any metric.", "yt": {"id": "e2i6JbU2R-s", "ch": "Hamel Husain"}}, {"kind": "read", "req": true, "label": "Rasa Docs: Conversation Review", "url": "https://rasa.com/docs/studio/analyze/conversation-review", "m": 5, "why": "Filters, tags and reviewed status in a real tool."}, {"kind": "video", "req": false, "label": "Paired error analysis with AI agents", "url": "https://www.youtube.com/watch?v=FzO7NRe_7VA", "m": 26, "why": "Reviewer plus agent labelling workflow, and why labels must end in an artifact.", "yt": {"id": "FzO7NRe_7VA", "ch": "Hamel Husain and 2 more"}}, {"kind": "video", "req": false, "label": "NLP for Developers: annotating language data (Rasa)", "url": "https://www.youtube.com/watch?v=OqdPoWmRPBU", "m": 8, "why": "How labelling works in practice: a guide, one label per example, and why people disagree.", "yt": {"id": "OqdPoWmRPBU", "ch": "Rasa"}}, {"kind": "read", "req": false, "label": "Rasa: CDD playbook, review and annotate conversations", "url": "https://info.rasa.com/cdd-playbook-review", "m": 6, "why": "The review loop and what to filter on first."}]}, {"id": "errors-confusion", "title": "Per-intent metrics and colliding intents", "brief": "Overall accuracy hides where a classifier fails. Per-intent precision and recall, a macro average and a confusion matrix show which intents collide, and the margin between the top two scores tells you at runtime when to ask instead of guess. The nuance: confusion costs are asymmetric. Swapping two balance questions is harmless; reading 'I don't recognise this charge' as 'show my transactions' misses a dispute.", "points": ["Macro and micro: macro-F1 weights every intent equally, so a rare dispute intent shows up; micro-F1 is dominated by the big intents and hides it", "Confusion matrix: off-diagonal cells show which pairs collide; read the utterances in a hot cell, because the numbers say where and the utterances say why", "Cause decides the fix: one need with different objects, merge and use an entity; different actions with similar words, add contrastive examples; skewed data, rebalance; words that cannot separate them, ask", "Top-two margin: 0.95 against 0.65 is clear, 0.75 against 0.72 is ambiguous; ask a short question, and let the safer branch win ties", "Beyond intent: score entity span and type separately (right intent, wrong date still fails), plus out-of-scope false accepts and confidence calibration", "Frozen set: after every fix rerun a golden set that is never trained on, because errors move to a neighbour, and training on your test utterances inflates accuracy"], "figs": ["confusionMatrix", "thresholdBands"], "production": ["Amazon Lex returns the top intent plus up to four alternatives with scores. Its docs call 0.95 against 0.65 clear and 0.75 against 0.72 ambiguous, and note scores are comparative and can shift when the platform model updates.", "The fallback threshold is set per locale (nluIntentConfidenceThreshold in Lex): too low gives silent wrong answers, too high gives fallback loops.", "Microsoft CLU reports per-intent precision, recall and F1 and a confusion matrix whose row and column sums give false negatives and false positives; its worked example has the right intent with a wrong entity span.", "Kore.ai's training validations and Cognigy's Intent Analyzer flag overlapping and weak intents, and Cyara Botium reports confusion matrices and intent overlap as a testing product.", "Many teams route any utterance with dispute or fraud vocabulary to a dedicated flow or a person, whatever the classifier's top score."], "mcq": [{"q": "Overall accuracy is 94%, but recall on 'dispute a charge' is 58%. Which summary number would have exposed this?", "o": ["Micro-F1 across all intents", "Overall accuracy on a larger test set", "Macro-F1 across all intents", "Average top-1 confidence", "F1 weighted by traffic volume"], "a": 2, "why": "Macro-F1 averages the per-intent scores equally, so one weak rare intent pulls it down. Micro and traffic-weighted scores are dominated by the large intents.", "pair": "macro-vs-micro"}, {"q": "'Transfer money' and 'dispute a transfer' collide, and in a minority of cases the user's wording really is ambiguous. What do you do?", "o": ["Merge them and use an entity for the type", "Drop the rarer intent from the model", "Raise the global threshold until errors stop", "Keep both, ask when close, default to the safer path", "Add the misrouted test utterances to training"], "a": 3, "why": "They start different processes, one of them regulated, so merging is wrong. Contrastive data plus a short question when the margin is small, with ties going to the dispute path."}, {"q": "After adding 500 production utterances to training, accuracy on your test set jumps 6 points. What do you check first?", "o": ["Whether the learning rate was too high", "Whether the new utterances overlap the test set", "Whether macro-F1 rose by the same amount", "Whether the threshold now needs lowering", "Whether the model now needs more intents"], "a": 1, "why": "If the added utterances or near copies are also in the test set, accuracy rises with nothing improved. Keep a frozen golden set that is never trained on."}, {"q": "Micro-F1 is 0.93 on an assistant where 80% of traffic is balance and transactions. What does that number tell you about the fraud intent?", "o": ["Very little: the big intents dominate it", "Fraud recall is at least 0.93", "Fraud precision is at least 0.93", "Fraud is well calibrated", "Fraud has no confusion with other intents"], "a": 0, "why": "Micro-F1 pools the counts, so frequent intents swamp rare ones. Fraud could sit far lower; set per-intent floors for the sensitive intents.", "pair": "macro-vs-micro"}], "open": {"q": "Two intents keep getting confused in production, say 'report a lost card' and 'block my card'. Walk me through what you do.", "probe": "Evidence first, the right fix for the cause, then a check that the errors did not move.", "a": ["Look at the confusion matrix cell and the top-two margins, then read every misclassified utterance.", "Name the cause: one need with different objects (merge, use an entity), different actions with similar words (contrastive examples), or skewed data (rebalance).", "If users' words cannot separate them, keep both and ask a short question when the margin is small; on a risky pair, default to the safer branch.", "Rerun the frozen golden set and check the neighbouring intents, because a fix often moves the errors.", "Watch that pair's confusion rate in production after release."]}, "say": ["**I'd start with the confusion matrix, then read the utterances in the hot cell.**", "**Where and why:** the numbers tell you where, the utterances tell you why.", "**Pick the fix:** merge if it's one need, add contrastive examples if they're different actions, ask a short question when the scores are close.", "**Safer path:** on a pair like dispute versus inquiry I'd let the safer path win ties.", "Then I rerun the frozen set, because the errors like to move next door."], "avoid": ["Answering with overall accuracy: they want per-intent numbers and the risky pair", "Implying you tuned a trained intent classifier at alfred_: intent there comes from an LLM with typed tool schemas validated in code"], "was": ["b-intent-confusion", "q-two-intents", "q-how-do-you-evaluate-an-nlu-model-beyond-accuracy"], "res": [{"kind": "video", "req": true, "label": "Machine learning fundamentals: the confusion matrix", "url": "https://www.youtube.com/watch?v=Kdsp6soqA7o", "m": 8, "why": "True and false positives and negatives, which is where every per-intent metric starts.", "yt": {"id": "Kdsp6soqA7o", "ch": "StatQuest with Josh Starmer"}}, {"kind": "video", "req": true, "label": "Multiclass metrics: macro vs micro precision, recall and F1", "url": "https://www.youtube.com/watch?v=YOMFCH8BvLs", "m": 13, "why": "Why macro-F1 shows a rare intent that micro-F1 hides.", "yt": {"id": "YOMFCH8BvLs", "ch": "Professor Rahul Jain"}}, {"kind": "read", "req": true, "label": "Microsoft Learn: CLU evaluation metrics", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/evaluation-metrics", "m": 12, "why": "Precision, recall, F1, the confusion matrix and its sums."}, {"kind": "video", "req": false, "label": "IBM Watson Assistant intent conflict resolution", "url": "https://www.youtube.com/watch?v=46OntowKhos", "m": 4, "why": "Colliding intents in a real assistant tool: how conflicts are found and resolved.", "yt": {"id": "46OntowKhos", "ch": "Cobus Greyling"}}, {"kind": "read", "req": false, "label": "Cognigy: Intent Analyzer", "url": "https://docs.cognigy.com/ai/empower/nlu/intents/intent-analyzer/", "m": 4, "why": "How a platform scores weak and overlapping intents."}], "code": [{"lang": "python", "title": "Confusion matrix, per-intent precision and recall, and a regression gate against a baseline", "file": "interviews/vanguard_builds/eval_harness.py", "src": "# Exercise: run a labelled set through the classifier, print a confusion matrix and per-intent precision and\n# recall, measure out-of-scope accuracy, and fail a regression gate against a stored baseline.\n# Run its test: python interviews/vanguard_builds/eval_harness_test.py\nimport json\n\nfrom intent_classifier import TRAIN, IntentClassifier\n\nOOS = \"out_of_scope\"  # the label for \"the classifier returned None\"\n\nTESTSET = [\n    (\"show my balance\", \"check_balance\"), (\"how much do i have in checking\", \"check_balance\"),\n    (\"what is the balance of my savings\", \"check_balance\"),\n    (\"send 50 dollars to savings\", \"transfer_money\"), (\"i want to move money to my savings\", \"transfer_money\"),\n    (\"transfer funds please\", \"transfer_money\"),\n    (\"i lost my debit card\", \"card_lost\"), (\"my card was stolen\", \"card_lost\"), (\"freeze my lost card\", \"card_lost\"),\n    (\"i do not recognize this charge\", \"dispute_charge\"), (\"dispute this charge\", \"dispute_charge\"),\n    (\"i was charged twice at a store\", \"dispute_charge\"),\n    (\"when does the branch open\", \"branch_hours\"), (\"branch hours on sunday\", \"branch_hours\"),\n    (\"what time does the branch close\", \"branch_hours\"),\n    (\"play jazz music\", OOS), (\"who won the football game\", OOS), (\"recommend a good pizza place\", OOS),\n]\n\n\ndef evaluate(clf: IntentClassifier, testset) -> dict:\n    intents = sorted((set(clf.counts) | {t for _, t in testset}) - {OOS})  # an intent the model lost still gets a row\n    labels = intents + [OOS]\n    matrix = {t: {p: 0 for p in labels} for t in labels}  # matrix[true][predicted]\n    for text, truth in testset:\n        pred, _ = clf.classify(text)\n        matrix[truth][pred or OOS] += 1\n    per = {}\n    for i in intents:\n        tp = matrix[i][i]\n        predicted = sum(matrix[t][i] for t in labels)\n        actual = sum(matrix[i].values())\n        per[i] = {\"precision\": tp / predicted if predicted else 0.0, \"recall\": tp / actual if actual else 0.0}\n    oos_total = sum(matrix[OOS].values())\n    return {\"matrix\": matrix, \"per_intent\": per, \"oos_accuracy\": matrix[OOS][OOS] / oos_total if oos_total else 1.0}\n\n\ndef report(result: dict) -> str:\n    labels = list(result[\"matrix\"])\n    lines = [\"rows = truth, columns = predicted\", \" \" * 16 + \"\".join(f\"{l[:7]:>8}\" for l in labels)]\n    for t in labels:\n        lines.append(f\"{t:<16}\" + \"\".join(f\"{result['matrix'][t][p]:>8}\" for p in labels))\n    lines.append(\"\")\n    for i, m in result[\"per_intent\"].items():\n        lines.append(f\"{i:<16} precision {m['precision']:.2f}  recall {m['recall']:.2f}\")\n    lines.append(f\"out-of-scope accuracy {result['oos_accuracy']:.2f}\")\n    return \"\\n\".join(lines)\n\n\ndef gate(result: dict, baseline: dict, margin: float = 0.05) -> list[str]:\n    # Returns the failures. An empty list means the change may ship. A drop within the margin is noise on a small set.\n    fails = []\n    for i, base in baseline[\"per_intent\"].items():\n        for metric in (\"precision\", \"recall\"):\n            drop = base[metric] - result[\"per_intent\"][i][metric]\n            if drop > margin:\n                fails.append(f\"{i} {metric} fell {drop:.2f} (from {base[metric]:.2f})\")\n    if baseline[\"oos_accuracy\"] - result[\"oos_accuracy\"] > margin:\n        fails.append(\"out-of-scope accuracy fell\")\n    return fails\n\n\ndef save_baseline(result: dict, path: str) -> None:\n    with open(path, \"w\") as f:\n        json.dump({\"per_intent\": result[\"per_intent\"], \"oos_accuracy\": result[\"oos_accuracy\"]}, f, indent=1)\n\n\ndef load_baseline(path: str) -> dict:\n    with open(path) as f:\n        return json.load(f)\n\n\nif __name__ == \"__main__\":\n    res = evaluate(IntentClassifier(TRAIN, cutoff=0.6), TESTSET)\n    print(report(res))\n"}]}, {"id": "errors-discovery", "title": "Finding the intents you did not design", "brief": "The next intents are in the fallback, low-confidence and escalated traffic, and in human agent transcripts. Embed them, cluster, have an LLM name each cluster, size by volume, then decide per cluster: new intent, more examples, content, or a human-only path. The nuance: clusters follow vocabulary, not need ('cancel' mixes a card, a transfer and a subscription), so clustering proposes and a designer decides.", "points": ["Sources: the bot's misses show what people try with the bot; human agent transcripts show what customers need, a good prior for coverage", "Pipeline: embed the misses, cluster (HDBSCAN handles varying density and leaves noise unclustered; k-means needs k), name clusters with an LLM, review by hand", "Decide per cluster: by volume, value, risk and feasibility; a new intent with an API, examples for an existing intent, out-of-scope examples, or knowledge content", "Check overlap: test a proposed intent against the existing taxonomy and a held-out sample so it does not create a new collision", "Scope policy: hardship, disputes, complaints and anything that sounds like advice stay with people, even when the volume looks attractive"], "figs": ["intentTaxonomy"], "production": ["The Lex automated chatbot designer takes agent and customer transcripts, clusters them into proposed intents, sample utterances and slot types linked to the source conversations, and removes overlap between them; AWS says about 600 transcript lines are analysed per minute.", "Google Conversational Insights topic modeling builds a taxonomy of primary and secondary call drivers with an LLM, suggests at least 10,000 conversations, offers five granularity levels, and lets you rename or remove topics before real-time inference.", "Copilot Studio Themes cluster user questions and its Unanswered questions view says why the agent could not answer; Intercom Fin's Topics Explorer sorts topics by how often Fin is involved, to show where automation is weakest.", "Rasa's NLU inbox surfaces low-confidence messages for labelling, and Kore.ai's Discourse Analyzer proposes intents and flows from historical transcripts."], "mcq": [{"q": "Why might HDBSCAN suit clustering missed utterances better than k-means?", "o": ["It needs no embeddings, only the raw text", "It always produces equal-sized clusters", "It names each cluster with an intent label", "It is supervised, so clusters match intents", "It needs no k and leaves noise unclustered"], "a": 4, "why": "Missed traffic has clusters of very different sizes plus a lot of one-off noise. HDBSCAN finds varying-density clusters without a preset k and leaves outliers out; k-means forces every point into one of k groups."}, {"q": "A cluster labelled 'cancel' holds 4,000 utterances. What is the main risk in turning it into one intent?", "o": ["It is too small to train an intent on", "The LLM-generated name will be inaccurate", "It mixes several needs that share one verb", "Clusters can never become intents", "It will force a lower confidence threshold"], "a": 2, "why": "Clusters follow vocabulary. Cancelling a card, a transfer and a subscription share a word but need different backends, so a person splits the cluster before any intent is built."}, {"q": "A large cluster of 'can I afford to retire early' questions appears in the misses. What is the right decision?", "o": ["Build a new intent, since the volume is high", "Route it to people or approved content: it borders on advice", "Add the utterances to the nearest existing intent", "Ignore it, since clustering is unreliable", "Answer it with the LLM and an advice disclaimer"], "a": 1, "why": "Volume is one input; risk and scope are others. A suitability or advice question is out of scope for automation in a regulated firm, whatever its size."}], "open": {"q": "Our fallback rate is 15%. How would you find out what those users actually want, and what would you build from it?", "probe": "Mining production for coverage gaps, then judgement on what to automate.", "a": ["Collect fallback, low-confidence and escalated turns plus live agent transcripts, redacted.", "Embed and cluster, name clusters with an LLM, and size them by volume times business cost.", "Review clusters by hand: split ones that mix needs, merge ones that are one need, check against the existing taxonomy.", "Decide per cluster: new intent with an API, examples for an existing intent, content, out of scope, or human only.", "Validate on a held-out sample and watch that cluster's fallback rate after release."]}, "say": ["**The next intents are already in the misses, so I'd mine them and let a designer decide.**", "**Collect:** the fallback and low-confidence turns, plus the escalated conversations.", "**Cluster and name:** embed and cluster them, and have an LLM name each cluster.", "**Size and decide:** by volume and cost, then per cluster: a new intent, more examples, a content fix, or it stays with a person.", "The clustering is only a proposal. A designer still checks whether two clusters are really one need, and whether the bot should handle it at all."], "avoid": ["Treating cluster output as the new taxonomy without a person reviewing it"], "was": ["b-intent-discovery", "q-how-do-you-find-the-intents-you-re-missing"], "res": [{"kind": "video", "req": true, "label": "Clustering with DBSCAN, clearly explained", "url": "https://www.youtube.com/watch?v=RDZUdRSDOok", "m": 10, "why": "Density clustering that leaves noise unclustered and needs no k, the idea behind HDBSCAN on missed utterances.", "yt": {"id": "RDZUdRSDOok", "ch": "StatQuest with Josh Starmer"}}, {"kind": "read", "req": true, "label": "AWS Docs: Creating Lex V2 bots using the Automated Chatbot Designer", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/designing.html", "m": 8, "why": "Transcripts in, suggested intents and slot types out, with sources."}, {"kind": "video", "req": false, "label": "LDA vs BERTopic explained", "url": "https://www.youtube.com/watch?v=F4mz8lb_MZ8", "m": 10, "why": "Embeddings plus clustering plus naming topics, the pipeline for finding missed intents.", "yt": {"id": "F4mz8lb_MZ8", "ch": "Engineering Insider"}}, {"kind": "video", "req": false, "label": "HDBSCAN, fast density based clustering, the how and the why", "url": "https://www.youtube.com/watch?v=dGsxd67IFiU", "m": 35, "why": "Why density clustering suits messy utterances better than k-means. Watch the first 25 minutes.", "yt": {"id": "dGsxd67IFiU", "ch": "PyData"}}, {"kind": "read", "req": false, "label": "Google Cloud: Topic modeling basics (Conversational Insights)", "url": "https://docs.cloud.google.com/contact-center/insights/docs/topic-modeling-basics", "m": 8, "why": "Call-driver taxonomy, granularity and fine-tuning."}]}, {"id": "errors-metrics", "title": "Metrics that hide failure, and a containment drop", "brief": "Every headline metric can look good while customers suffer. Containment counts people who gave up, deflection counts tickets not filed, and a low escalation rate can mean the bot is a wall. Read a small set together, anchored by repeat contact. When a metric moves after a release: confirm it, localise it, stop the bleeding, then find the cause.", "points": ["Containment: sessions that never reached a human; pair it with confirmed resolution, abandonment and repeat contact within 24 hours to 7 days", "Resolution: confirmed (the user says so) is not the same as implied or assumed (the session ended, or 24 hours of silence); report them apart", "Escalation mix: the rate alone means little; rising unintended escalations mean users are stuck", "Per-intent funnel: recognised, slots filled, authenticated, backend succeeded, confirmation shown, completed; the drop-off shows where to work", "Clean first: filter out greetings, tests and spam; compute resolution from outcomes, never as one minus escalation", "After a drop: check definition, pipeline and traffic mix; break down by intent, flow, page and version; roll back; read transcripts; add a test and an alert. A drop can be good, if a fix stopped trapping people"], "figs": [], "production": ["Copilot Studio separates Resolved confirmed from Resolved implied, counts a session as abandoned after 30 minutes, and splits escalations into three reasons.", "Intercom Fin counts a resolution when the customer confirms or leaves without asking for more, treats 24 hours of silence as an assumed resolution, and charges 0.99 dollars per resolution: the definition and the price are linked.", "Salesforce reports (self-reported) its Help site agent resolved about 76% of 1.7 million conversations and escalated about 5%. The two do not sum to 100, so other states such as abandonment exist: ask how the denominator is defined.", "Klarna's assistant handled about two-thirds of chats in its first month; the company later said it had focused too much on cost, with quality suffering, and resumed hiring people for complex cases.", "Dialogflow CX analytics show no-match, escalation and exit rates per page, plus webhook errors and latency: the first place to look after a drop on that platform."], "mcq": [{"q": "Containment rose from 60% to 70% after a release, and repeat calls within three days rose too. What is the most likely reading?", "o": ["The bot improved and customers engage more", "The call centre is sending callers back to chat", "The bot closes conversations it has not solved", "Repeat calls are noise and can be ignored", "Containment and repeat calls are unrelated"], "a": 2, "why": "Containment counts a customer who gave up as contained. Rising repeat contact alongside it is the classic sign of false containment.", "pair": "containment-vs-resolution"}, {"q": "Which number is safest to report as 'problem solved'?", "o": ["Sessions where the user confirmed it was resolved", "Sessions that ended without an escalation", "Sessions with 24 hours of silence afterwards", "One minus the escalation rate", "Sessions that ended within two minutes"], "a": 0, "why": "Confirmed resolution is the only one of these that observes an outcome. The others infer it from silence or the absence of a handoff, and count people who gave up.", "pair": "containment-vs-resolution"}, {"q": "Containment fell 10% the day after a release. What is your first step?", "o": ["Roll back the whole agent immediately", "Retrain the intent model on yesterday's traffic", "Lower the confidence threshold to cut fallbacks", "Check it is real: definition, pipeline, traffic mix", "Survey users about the new release"], "a": 3, "why": "A campaign, an outage or a logging change moves the metric with no regression at all. Confirm, then localise by intent, page and version before acting."}, {"q": "Total escalation rate is flat, but the share of 'system unintended' escalations doubled. What does that suggest?", "o": ["Business rules are firing more often", "Nothing, since the total rate is flat", "Customers prefer human agents this month", "The bot is refusing more policy questions", "More users are getting stuck before the handoff"], "a": 4, "why": "The mix is the signal. Unintended escalations are users failing at a task, so a rising share means people are stuck even though the total did not move."}], "open": {"q": "Containment dropped 10% after last week's release. Walk me through what you do.", "probe": "Calm, ordered debugging of a live metric, and knowing the drop might be good news.", "a": ["Confirm it is real: the metric definition, the data pipeline and the traffic mix (a campaign or outage changes which intents arrive).", "Localise it: break down by intent, channel, flow, page and version; look at no-match, escalation reasons, webhook errors and abandonment by page.", "Stop the bleeding: roll back or cut traffic to the regressed flow while reading transcripts for the cause.", "Check repeat contact before calling it a regression: a fix that stops trapping people lowers containment.", "Close it out: a regression test for the cause and an alert on that page's no-match or escalation rate."]}, "say": ["**When a metric drops, I'd confirm, localise, stop the bleeding, then find the root cause.**", "**Confirm:** check the metric definition, the pipeline, and whether the traffic mix changed.", "**Localise and stop:** break it down by intent, flow and version, and roll that flow back while I read the transcripts.", "**Repeat contact:** containment can drop for a good reason, if the bot stopped trapping people.", "Then a test for the cause and an alert on it."], "avoid": ["Reporting containment alone as success", "Quoting vendor resolution rates as fact: each vendor defines resolution its own way"], "was": ["b-metrics-hide", "q-which-kpis-do-you-report-and-which-ones-mislead", "q-containment-dropped-10-after-a-release-walk-me-through-it"], "res": [{"kind": "video", "req": true, "label": "Analytics in Microsoft Copilot Studio", "url": "https://www.youtube.com/watch?v=Y9dPClQldaQ", "m": 23, "why": "Resolved, escalated and abandoned sessions on a real dashboard. Watch the sessions and resolution part.", "yt": {"id": "Y9dPClQldaQ", "ch": "Power Tech Speck (Girish Uppal)"}}, {"kind": "read", "req": true, "label": "Voiceflow: What ticket deflection rate actually means", "url": "https://www.voiceflow.com/blog/what-ticket-deflection-rate-actually-means", "m": 5, "why": "What deflection hides (secondary source)."}, {"kind": "video", "req": false, "label": "Chatbot metrics meltdown", "url": "https://www.youtube.com/watch?v=9WXnNIhaTlM", "m": 4, "why": "Short take on metrics that look good while users suffer.", "yt": {"id": "9WXnNIhaTlM", "ch": "Jim Rowe-Bot"}}, {"kind": "video", "req": false, "label": "Deflection rate is a vanity metric", "url": "https://www.youtube.com/watch?v=rh5XDnZsGeM", "m": 38, "why": "Why deflection and containment mislead; read together with repeat contact. Watch the first 25 minutes.", "yt": {"id": "rh5XDnZsGeM", "ch": "Agents And Actions"}}, {"kind": "read", "req": false, "label": "Google Cloud: Dialogflow CX analytics", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/analytics", "m": 5, "why": "No-match, escalation and webhook errors by page."}]}, {"id": "errors-regression", "title": "Every bug becomes a regression test", "brief": "A bot regresses silently: retraining, a flow edit or a prompt change can break something unrelated. The defence is a suite that grows from incidents, where each production failure becomes a test before it is fixed. The nuance is that tests come in two kinds. Flow tests are deterministic and pass or fail exactly; NLU and LLM tests are statistical, so they get thresholds on aggregates plus a short list of must-never cases that block a release on one failure.", "points": ["Bug to test: write the failing case first, then the fix, so the incident history becomes the suite", "Deterministic layer: scripted conversations assert the intent, page, slots and API call at each turn; a wording change only warns", "Statistical layer: per-intent recall or a groundedness rate with thresholds, compared with the last release", "Must-never cases: never state a rate, never give a tax or investment recommendation, never execute without the confirmation step; one failure blocks", "Run it k times: an LLM can answer differently on each run, so a scenario that passes once may fail the next; pass^k is the chance that all k runs pass (0.9ᵏ if each run passes 90%)", "Real replay: scripted or LLM-played customers share the bot's blind spots, so anonymised production conversations replayed as tests stay the anchor"], "figs": ["evalHarness", "passk"], "production": ["Dialogflow CX test cases store per-turn expectations (response, flow, page, intent, tool use). Intent and page mismatches fail, a change in wording only warns, 'Save as golden' resets the baseline, and coverage reports cover transitions, intents and route groups.", "DoorDash uses Promptfoo, which it likens to unit tests, to block failing prompt changes, and adds each newly found production issue to the suite (secondary summary).", "tau-bench found GPT-4o function-calling agents solved under half the retail tasks and had pass^8 under 25%: one success overstates reliability.", "Lex's Test Workbench builds test sets from existing transcripts and shows intent and slot performance against a bot.", "In finance, keep an auditable record of which suite version passed for each release, because model risk management will ask what was tested before a change went live."], "mcq": [{"q": "A flow test now sees 'Sure, here is your balance' where it expected 'Here is your balance'. Intent and page are unchanged. In a CX-style suite, what happens?", "o": ["The release fails: any wording change is a regression", "Delete the test, since generated text cannot be tested", "A warning: wording varies, intent and page are the hard checks", "Re-record it as golden without looking at it", "Rerun until the old wording comes back"], "a": 2, "why": "Structure (intent, page, tool call) is asserted exactly; wording only warns because templated or generated text varies. Save a new golden only after a person checks the change is intended.", "pair": "hard-vs-soft-checks"}, {"q": "Your LLM assistant passes a refund scenario on 7 of 8 runs. How should the suite treat it?", "o": ["Pass: 87.5% is above a typical threshold", "Count only the first run, since users see one", "Set temperature to zero and call it fixed", "Fail pass⁸ and investigate the failing run", "Remove the scenario as flaky"], "a": 3, "why": "At volume, one failure in eight is many customers. passᵏ asks for all k runs to succeed, and the failing transcript is where the bug is."}, {"q": "Which case belongs in the must-never set rather than under a thresholded quality score?", "o": ["A transfer runs without the confirmation step", "The tone sounds friendly and on brand", "The answer is under three sentences", "Retrieved passages rank in the top three", "The bot uses the customer's first name"], "a": 0, "why": "Skipping confirmation on a money movement is a hard failure with no acceptable rate. Tone, length and ranking are quality signals that tolerate a threshold.", "pair": "hard-vs-soft-checks"}], "open": {"q": "How do you test a conversational assistant before a release, given that the LLM parts are not deterministic?", "probe": "Layers, statistical thresholds versus hard gates, and reliability over a single run.", "a": ["An NLU or routing set with per-intent metrics, compared with the last release.", "Golden conversations with turn-level expectations on intent, state and tool calls; wording differences only warn.", "For the LLM parts, rubric scores with thresholds and each scenario run several times (pass^k), with simulated users for breadth.", "A must-never suite (confirmation steps, no advice, no stated rates) where a single failure blocks.", "Every production bug added as a case first, and anonymised real conversations replayed as the anchor."]}, "say": ["**Every production bug becomes a test before it's fixed, so the incident history is the regression suite.**", "**Hard versus soft:** the confirmation step and the must-never cases block a release, and quality scores get thresholds.", "**More than once:** I run each scenario several times, because one pass overstates reliability.", "**Real turns:** at alfred_ I built a replay bench over real production turns, graded by a person.", "I trust real turns more than simulated users."], "avoid": ["Claiming automated evals gate every deploy at alfred_: the replay bench is graded by a person", "Treating one passing run of an LLM scenario as proof"], "was": ["b-regression-testing", "q-how-do-you-test-a-conversational-system-before-release"], "res": [{"kind": "video", "req": true, "label": "Regression Testing for LLMs: Golden Datasets Explained", "url": "https://www.youtube.com/watch?v=7vqU_Yj5kUc", "m": 7, "why": "A short explainer of a golden set that grows from failures and guards each release.", "yt": {"id": "7vqU_Yj5kUc", "ch": "Latitude"}}, {"kind": "read", "req": true, "label": "Google Cloud: Dialogflow CX test cases", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/test-case", "m": 5, "why": "What is asserted per turn, golden baselines, coverage."}, {"kind": "video", "req": false, "label": "Error Analysis: The Highest ROI Technique In AI Engineering", "url": "https://www.youtube.com/watch?v=e2i6JbU2R-s", "m": 13, "why": "Where regression cases come from: real failures read from traces and turned into tests.", "yt": {"id": "e2i6JbU2R-s", "ch": "Hamel Husain"}}, {"kind": "video", "req": false, "label": "Mastering LLM chatbot testing: metrics, methods and mistakes", "url": "https://www.youtube.com/watch?v=9DhGuLb6gZY", "m": 11, "why": "Testing a non-deterministic chatbot: thresholds on aggregates, what to automate.", "yt": {"id": "9DhGuLb6gZY", "ch": "The Test Tribe"}}, {"kind": "read", "req": false, "label": "Amazon Lex V2: Test Workbench", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/test-workbench.html", "m": 2, "why": "Test sets built from real transcripts."}]}, {"id": "errors-release", "title": "Shipping the fix and watching for drift", "brief": "A prompt, threshold, content or flow change is a release: versioned, rolled out gradually, with rollback. Experiments on a bot are harder than web A/B tests: assign per session or user, outcomes like repeat contact arrive days later, and rare high-risk intents never reach significance. After release the world drifts, so watch the intent mix and confidence, and treat live agents' resolutions as free labels.", "points": ["Version together: model, prompt, threshold, knowledge article and timeout ship as one versioned config, so a rollback restores a known good state", "Experiment design: one change, assignment by user or session (never by turn), one pre-registered primary metric such as task completion, guardrails (escalation, CSAT, repeat contact), full weekly cycles", "Rare intents: experiment live on frequent low-risk flows; use offline evals and human review for disputes and other rare high-risk flows", "Drift signals: intent mix, confidence distribution, fallback by intent, tool errors; alert against a rolling baseline, with releases and campaigns annotated", "Fallback spike: usually a new topic (needs an intent or content) or a regression (needs a rollback); reading twenty of the new fallbacks tells you which", "Agent labels: what the human agent does after a handoff is the label for the failed turn; it is noisy, so measure agreement and gate on a frozen set"], "figs": ["errorLoop"], "production": ["Amazon Lex V2 uses numbered versions and an alias that points to one; clients call the alias, so you publish version 2, move the alias, and move it back to roll back.", "Dialogflow CX experiments split traffic between a control and up to four variants, compare live-agent handoff, no-match, session end and turn counts, and can auto roll out in steps; one experiment runs per flow at a time.", "Uber's COTA used the agent's chosen resolution as the positive label in a ranking setup, a 25% relative accuracy gain over plain classification; COTA v2 said models decay and retrained on a schedule, lifting one model's top-1 accuracy from 49% to 65%.", "Bank of America reports more than 75,000 updates to Erica since launch (self-reported): many small continuous changes rather than big rewrites.", "Finance drift has a calendar (tax season, a fee change, a fraud wave), and the answer is often a content or routing change in hours through a separately reviewed fast path, not a retrain in weeks."], "mcq": [{"q": "You A/B test a new disputes flow. Why assign variants per session or user rather than per turn?", "o": ["Per-turn assignment needs far more traffic", "A mixed conversation cannot be attributed", "No platform supports per-turn assignment", "Users must consent to each variant separately", "Turn-level metrics always come out lower"], "a": 1, "why": "A conversation is one unit. If turns switch variants, the user sees an incoherent dialogue and no outcome can be attributed to either version."}, {"q": "A variant cuts handoff rate by 4 points in a two-day test. Why not ship it yet?", "o": ["Handoff rate is not a valid metric for bots", "Variants must always run for exactly one month", "The control group was too large", "Two days cannot show repeat contact or weekly patterns", "Lower handoff always means worse quality"], "a": 3, "why": "Outcomes like a repeat call arrive days later, and Monday traffic is not Saturday traffic. A lower handoff rate can be worse if people call back tomorrow."}, {"q": "Average confidence drops slowly over two weeks while the intent mix stays stable. What is the likely cause?", "o": ["A new topic users have started asking about", "A backend outage on one API", "A raised confidence threshold", "Labellers disagreeing more this month", "Users phrasing the same needs differently"], "a": 4, "why": "A stable mix with falling confidence points to new phrasing for old needs. Embedding new traffic and comparing it with the training data shows the shift.", "pair": "new-topic-vs-rephrasing"}, {"q": "The morning after a fee change is announced, fallback doubles, concentrated in one area. What is most likely?", "o": ["A new topic driven by a business event", "A model regression from last week's release", "An ASR outage at the telephony provider", "Labelling drift in the gold set", "Users rephrasing the same old requests"], "a": 0, "why": "A sudden, concentrated spike lined up with a business event is a new topic. It needs content or routing fast, which is why dashboards are annotated with campaigns and announcements.", "pair": "new-topic-vs-rephrasing"}], "open": {"q": "You've fixed a flow and want to ship it. How do you release it, and how would you know a month later that it is still working?", "probe": "Release discipline, experiment design and drift monitoring, in that order.", "a": ["Version the whole config (prompt, threshold, content, model) and keep the previous version one switch away for rollback.", "Run the regression and must-never suites, then a small canary with automatic rollback on guardrail metrics.", "For a measured change, A/B by session with one primary metric, guardrails including repeat contact, over full weeks.", "Afterwards watch intent mix, confidence, fallback and escalation by intent against a rolling baseline, annotated with releases and campaigns.", "Feed human agents' resolutions after handoff back as labels, and update content or retrain on a schedule, gated by the frozen set."]}, "say": ["**I'd ship it like a service: versioned, canaried and watched.**", "**Canary:** a small slice first, with rollback tied to guardrail metrics like escalation and repeat contact.", "**Measure:** if I want a number, I split by session, pick one primary metric and run full weeks.", "**Watch drift:** the intent mix and confidence, because a shift tells me something changed before accuracy numbers do.", "And the human agent's resolution after a handoff is a free label."], "avoid": ["Declaring a win from a one-day experiment: outcomes like repeat contact arrive later"], "was": ["b-release-practice", "b-feedback-drift", "q-how-would-you-a-b-test-a-change-to-a-flow", "q-how-do-you-monitor-a-live-assistant-for-drift"], "res": [{"kind": "video", "req": true, "label": "Top 5 most-used deployment strategies", "url": "https://www.youtube.com/watch?v=AWVTKBUnoIg", "m": 10, "why": "Canary, blue-green and rolling releases, the vocabulary for shipping a fix gradually.", "yt": {"id": "AWVTKBUnoIg", "ch": "ByteByteGo"}}, {"kind": "read", "req": true, "label": "Google Cloud: Dialogflow CX experiments", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/experiments", "m": 4, "why": "Traffic splits, the metrics compared, auto rollout."}, {"kind": "video", "req": false, "label": "ML drift: identifying issues before you have a problem", "url": "https://www.youtube.com/watch?v=uOG685WFO00", "m": 16, "why": "What drift looks like in production and which signals to alert on.", "yt": {"id": "uOG685WFO00", "ch": "Fiddler AI"}}, {"kind": "video", "req": false, "label": "A/B testing and canary releases: why, what and how", "url": "https://www.youtube.com/watch?v=I4F6nM9SgBk", "m": 29, "why": "Gradual rollout and experiments, the release side of shipping a fix. Watch the first 25 minutes.", "yt": {"id": "I4F6nM9SgBk", "ch": "JSConf"}}, {"kind": "read", "req": false, "label": "AWS Docs: Versioning and aliases with your Lex V2 bot", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/versions-aliases.html", "m": 4, "why": "Versions and aliases as blue and green releases."}]}], "day": "Day 3, Tuesday 6 Oct"}, {"id": "eval", "title": "Evaluation, telemetry and cost", "blurb": "Say how you would measure an assistant before and after release, what you would log on every turn, and how you would keep cost and latency down without a hidden regression.", "sessions": [], "topics": [{"id": "eval-layers", "title": "Evaluate each layer on its own terms", "brief": "One blended score cannot tell you what broke. Production teams measure each layer separately: routing or intent, entities (span F1 plus whether the entity resolved to the right record), retrieval, grounding, task success, cost, and for actions the duplicate rate and confirmation compliance. The nuance: suites have two jobs. Capability evals start low and show headroom; regression evals sit near 100% and block a change when they drop, and a suite stuck at 100% has stopped telling you anything.", "points": ["Why layers: when an end-to-end test fails, per-layer scores say whether the router, the slot filler, retrieval or the generator broke, and show where a swapped component moved", "Entities: span F1 says the text was found; resolution accuracy says 'that meeting' became the right record, which is what the task needs", "Actions: duplicate rate (a retry did it twice) and confirmation compliance (no side effect without an explicit yes) are measured, not assumed", "Capability versus regression: capability suites show headroom; regression suites hold near 100% and gate changes; watch for saturation", "Per-intent floors: put floors on sensitive intents (fraud, dispute, hardship) instead of one global threshold, because 95% overall can hide 60% recall on fraud", "Golden set as an artifact: versioned, owned, labelled to a guide, refreshed from redacted production traffic, or it drifts away from what customers say"], "figs": ["evalHarness"], "production": ["Anthropic's eval guidance: start with 20 to 50 tasks drawn from real failures, grade what the agent produced rather than the path it took, and read the transcripts.", "Rasa's end-to-end tests assert on slots, responses and custom actions for each scripted conversation: the flow layer as tests.", "DoorDash adds each issue it finds to a unit-test-like suite that runs on every prompt change (secondary summary).", "At scale the hard number is tokens times concurrent runs times tool latency, not HTTP requests per second; downstream tool APIs are often the real bottleneck, so timeouts and bounded parallelism belong in the evals too.", "Review sampling is ranked by volume times cost times severity: every escalation, abandonment, low-confidence route, negative feedback, failed tool call and long run, plus a random baseline."], "mcq": [{"q": "Your regression suite has passed at 100% for three months while customers keep reporting new failures. What is the problem?", "o": ["The suite is saturated and no longer covers what breaks", "The model is overfitting to the regression suite", "The pass threshold should be raised further", "Regression suites should start low and climb", "The graders are too strict about wording"], "a": 0, "why": "A suite that always passes carries no information. Add the new production failures as cases, and keep a capability suite that still has headroom.", "pair": "capability-vs-regression"}, {"q": "You add a suite of hard multi-step tasks and the agent scores 30%. How should you treat it?", "o": ["As a regression gate that blocks every merge", "As a sign the suite is broken and should go", "As a capability eval that shows headroom", "As proof the model must be replaced now", "As a reason to lower the regression threshold"], "a": 2, "why": "Capability evals are meant to start low and show progress. Gating merges on a 30% suite would block everything; tasks graduate to the regression suite once they pass reliably.", "pair": "capability-vs-regression"}, {"q": "Entity span F1 is 0.96, yet requests about 'the second email' often act on the wrong email. Which metric is missing?", "o": ["Intent macro-F1", "Retrieval recall at k", "Groundedness of the reply", "Resolution accuracy to the right record", "BLEU on the generated reply"], "a": 3, "why": "Span F1 checks the words were found. The task needs the reference resolved to the right record, which is a separate layer with its own metric."}, {"q": "An end-to-end score drops after you swap the embedding model. Why do per-layer metrics help?", "o": ["They raise the end-to-end score directly", "They remove the need for a golden set", "They make the judge more consistent", "They let you skip the regression tests", "They show whether retrieval or a later layer moved"], "a": 4, "why": "With per-layer scores you can see that retrieval recall fell (or did not) and fix the right component, instead of guessing from one blended number."}], "open": {"q": "We have one accuracy number for our assistant. How would you set up offline evaluation so it tells us what to fix?", "probe": "Per-layer metrics for diagnosis, two kinds of suite, and growth from real failures.", "a": ["Split by layer: routing or intent per class, entity span and resolution accuracy, retrieval recall, groundedness, task success, cost per conversation.", "For actions, measure the duplicate rate and confirmation compliance directly.", "Two suites: a regression suite near 100% that gates changes, with per-intent floors on sensitive intents, and a capability suite that shows headroom.", "Start with 20 to 50 cases from real failures and add every new production failure.", "Version the golden set with an owner and a labelling guide, and refresh it from redacted production traffic."]}, "say": ["**I don't trust a single accuracy number, so I measure each layer on its own terms.**", "**Per layer:** routing, entities, retrieval, grounding, task success and cost, so a failure points at a component.", "**Side effects:** I'd measure duplicates and whether every action had an explicit confirmation. At alfred_ a side-effecting tool returns a preview first, a second call with explicit confirmation executes, and idempotency keys make retries safe.", "**Real failures:** the suite grows from them, not from guesses.", "That way the numbers say what to fix."], "avoid": ["Quoting an overall intent accuracy for alfred_: there is no trained classifier there to report one"], "was": ["d-offline-eval-layers", "h-eval-scale"], "res": [{"kind": "keep", "src": "aieng", "req": true, "label": "AI Engineering from Scratch, phase 5: LLM Evaluation: RAGAS, DeepEval, G-Eval", "url": "https://aiengineeringfromscratch.com/lesson?path=phases%2F05-nlp-foundations-to-advanced%2F27-llm-evaluation-frameworks", "m": 25, "why": "The evaluation frameworks and what each layer measures."}, {"kind": "video", "req": true, "label": "How to evaluate agents in practice", "url": "https://www.youtube.com/watch?v=vuBvf7ZRKTA", "m": 11, "why": "Scoring the final answer, the tool calls and the trajectory separately, which is the per-layer idea.", "yt": {"id": "vuBvf7ZRKTA", "ch": "Google Cloud Tech"}}, {"kind": "video", "req": true, "label": "Demystifying evals for AI agents: a refresher", "url": "https://www.youtube.com/watch?v=-mZL77QSDaI", "m": 13, "why": "Walks Anthropic's guide: graders, capability versus regression suites, and saturation.", "yt": {"id": "-mZL77QSDaI", "ch": "AI Native Way"}}, {"kind": "video", "req": false, "label": "Error analysis: the highest ROI technique", "url": "https://www.youtube.com/watch?v=e2i6JbU2R-s", "m": 13, "why": "Read real traces first to learn which layer breaks, before choosing metrics.", "yt": {"id": "e2i6JbU2R-s", "ch": "Hamel Husain"}}, {"kind": "read", "req": true, "label": "Anthropic: Demystifying evals for AI agents", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "m": 15, "why": "Capability versus regression suites, graders per layer, and when a suite saturates."}, {"kind": "read", "req": true, "label": "Hamel Husain: Your AI product needs evals", "url": "https://hamel.dev/blog/posts/evals/", "m": 15, "why": "Unit-test style evals per failure mode, then a golden set refreshed from real logs."}, {"kind": "read", "req": false, "label": "Rasa: testing your assistant (end-to-end tests)", "url": "https://rasa.com/docs/rasa/testing-your-assistant/", "m": 8, "why": "How a conversational platform tests routing and flows with scripted end-to-end cases."}]}, {"id": "eval-simulated", "title": "Simulated users and pass^k", "brief": "Scripted test conversations only check what you scripted. A simulated user, an LLM playing a customer with a hidden goal, exercises multi-turn behaviour at scale. tau-bench showed how to score it: compare the final database state with the goal state, and report pass^k, the chance the agent succeeds on all k tries. The nuance: simulated users are friendlier and more articulate than real ones, so their pass rate overstates production.", "points": ["State-based grading: if the task is to cancel an order, the backend either matches the goal state or it does not; a deterministic grader under a stochastic conversation", "pass^k versus pass@k: pass@k is at least one success in k tries (fine when you can check and pick); pass^k is all k succeed, which matches a system that must be right every time", "Reliability compounds: a 90% single-run rate gives 0.9 to the fifth, about 59%, for five similar customers in a row", "Personas that stress failure: vague, changes mind mid-flow, pushes for something the policy forbids, angry, speaks in fragments, tries to get another customer's data", "Grade policy as well as outcome: confirmation before a transfer, identity verified before details are shared, a handoff when one is required", "Anchor: keep human-written and replayed real conversations; a simulator does not reproduce noisy ASR or real impatience"], "figs": ["passk", "multiturn"], "production": ["tau-bench (Sierra) pairs an LLM-simulated user with an agent that has domain API tools and a policy document, in retail and airline domains, and grades by comparing the end database state with the annotated goal state.", "The paper reports strong function-calling agents of the time passed under half the retail tasks and had pass^8 below 25%.", "Anthropic's eval guidance says conversational agents need a second LLM simulating the user, and that pass^k reflects consistency requirements better than pass@k.", "For a finance assistant the state check reads: the right transaction, and only that one, staged; a confirmation step present; disclosures given; nothing written that should not have been."], "mcq": [{"q": "An agent succeeds on a scenario 90% of the time per run. Roughly how likely is it to get five similar customers in a row right?", "o": ["About 90%", "About 99%", "About 45%", "About 59%", "About 10%"], "a": 3, "why": "Independent runs multiply: 0.9 to the fifth is about 0.59. A per-run rate that looks high still fails a lot of customers at volume."}, {"q": "Why does tau-bench grade the final database state rather than the dialogue text?", "o": ["Dialogue text is too long to store", "It is objective and cheap, whatever words were used", "Judges cannot read multi-turn conversations", "The state includes the user's satisfaction", "Text grading would favour the simulator"], "a": 1, "why": "Many different conversations can reach the right outcome. Checking the end state against the goal gives a deterministic grade without judging wording."}, {"q": "For a support agent that moves money, which metric fits the risk?", "o": ["pass@k: at least one of k tries succeeds", "Mean BLEU against a reference reply", "passᵏ: all k tries succeed", "Single-run accuracy at temperature zero", "Average judge score across the tries"], "a": 2, "why": "A customer gets one try. passᵏ measures whether the agent is consistently right; pass@k suits settings where you can generate several and pick a checked winner.", "pair": "passk-vs-pass-at-k"}, {"q": "Your simulated-user suite passes at 92%, but production completion on the same flows is 75%. What is the most likely reason?", "o": ["Production logs are miscounting completions", "The simulator is too adversarial", "passᵏ inflates the simulated number", "Production uses a different model by accident", "Simulated users are more cooperative than real ones"], "a": 4, "why": "An LLM playing a customer is articulate, patient and on topic. Treat simulation as a regression and stress tool, calibrated against real transcripts, not as a forecast."}], "open": {"q": "How would you evaluate a multi-turn flow, say moving money between accounts, before customers can use it?", "probe": "State-based grading, reliability over k runs, adversarial personas, and the limits of simulation.", "a": ["Simulated users with hidden goals and personas that stress the flow: vague, changing their mind, pushing for something forbidden.", "Grade the end state and the policy: the right transfer staged only after explicit confirmation, identity checked first, a handoff when required.", "Run each scenario k times with varied temperature and persona, report pass^k, and read the failing transcripts.", "Anchor with replayed real conversations, because the simulator is friendlier than customers and has no ASR noise.", "Read the simulated rate as a regression and stress signal, not a forecast of production completion."]}, "say": ["**I'd test a multi-turn flow with a simulated user and grade the final state and the policy, not the wording.**", "**Hidden goal:** an LLM plays a customer who wants something specific, with personas that stress the flow.", "**pass^k:** I run each scenario several times, because a bot that succeeds seven times out of eight is still a bad bot at scale.", "**Real anchor:** at alfred_ my replay bench runs over real production turns and a person grades it, because simulated users are more polite than real ones.", "So I read the simulated rate as a stress signal, not a forecast."], "avoid": ["Reading a simulated pass rate as a forecast of production containment"], "was": ["d-simulated-users"], "res": [{"kind": "video", "req": true, "label": "tau-bench: tool-agent-user interaction", "url": "https://www.youtube.com/watch?v=lTwnhgZ0-qQ", "m": 7, "why": "Simulated user, goal database state as the grade, and pass^k as the reliability number.", "yt": {"id": "lTwnhgZ0-qQ", "ch": "Andriy Batutin"}}, {"kind": "video", "req": true, "label": "Simulating and evaluating multi-turn conversations", "url": "https://www.youtube.com/watch?v=2mRmiuyFRGc", "m": 7, "why": "Building a simulated customer with a persona and scoring the whole conversation.", "yt": {"id": "2mRmiuyFRGc", "ch": "LangChain"}}, {"kind": "video", "req": false, "label": "Evaluating multi-turn conversations with Langfuse", "url": "https://www.youtube.com/watch?v=btF1x1tpj_s", "m": 7, "why": "Grading at conversation level in a tracing tool, for the production side of the same idea.", "yt": {"id": "btF1x1tpj_s", "ch": "Langfuse"}}, {"kind": "read", "req": true, "label": "arXiv: tau-bench, tool-agent-user interaction", "url": "https://arxiv.org/pdf/2406.12045", "m": 20, "why": "Sections on the simulated user, the state comparison and the pass^k definition."}, {"kind": "read", "req": true, "label": "Sierra: benchmarking AI agents for the real world", "url": "https://sierra.ai/blog/benchmarking-ai-agents", "m": 8, "why": "Why pass^k matters for an agent that must be right every time."}, {"kind": "read", "req": false, "label": "LangSmith: chatbot simulation tutorial", "url": "https://docs.smith.langchain.com/evaluation/tutorials/chatbot-simulation", "m": 10, "why": "A worked simulated-customer persona loop you could rebuild."}]}, {"id": "eval-judge", "title": "Calibrating an LLM judge", "brief": "A judge model is useful only once you have measured how well it agrees with your people, criterion by criterion. The working pattern: binary or small-scale criteria with explicit definitions, the evidence given to the judge, a human-labelled calibration set, known biases controlled, and a human sample reviewed for as long as the judge runs. The nuance: judges reward fluent, confident, long answers, so a polished hallucination scores well unless the criterion forces a check against the source.", "points": ["Criteria: narrow, checkable true or false questions ('every number appears in the retrieved passage or the API result'), not 'is this a good answer'", "Calibration: people label the same conversations, you measure agreement per criterion and fix the wording or the judge; automate only the criteria where it matches", "Biases: position (run both orders and require the same winner), verbosity (prefers longer answers), self-enhancement (judge with a different model family)", "Pairwise over absolute: 'is B better than A' is more stable than a 1 to 5 score, and is the right tool for a ship decision", "Reasoning first: ask for the reasoning, then the verdict, and convert to structured output as a separate step; low temperature, several votes on high-stakes criteria", "Limits: never the only control on a regulated answer; that needs a deterministic check or an approved content library"], "figs": [], "production": ["Instacart's LACE scores five dimensions (query understanding, answer correctness, chat efficiency, client satisfaction, compliance) from binary criteria; a debate setup worked best on context-dependent criteria, and subjective ones like conciseness stay directional checks.", "DoorDash's quality judge scores retrieval correctness, response accuracy, language, coherence and relevance, alongside human review of random samples to keep it calibrated.", "The MT-Bench paper found strong judges reach over 80% agreement with human preferences, similar to humans with each other; Langfuse's guide cites 80 to 90% on many criteria.", "In a control environment teams record the judge prompt version, the model version and human agreement by criterion, and send disagreements to a named reviewer."], "mcq": [{"q": "In pairwise tests your judge prefers whichever answer is shown first 62% of the time. What fixes this?", "o": ["Use a larger judge from the same family", "Switch to a 1 to 10 absolute score", "Ask the judge in the prompt to be unbiased", "Run both orders and keep only consistent winners", "Trim both answers to the same length"], "a": 3, "why": "That is position bias. Swapping the order and requiring the same winner cancels it; trimming length addresses verbosity, a different bias.", "pair": "position-vs-verbosity"}, {"q": "Your judge rates long, confident answers higher even when they state an unsupported fee. Which change helps most?", "o": ["Give it the source and require every number to appear in it", "Ask for a 1 to 10 score instead of pass or fail", "Use the same model that wrote the answer", "Raise its temperature for more varied scores", "Show it the answers in a random order"], "a": 0, "why": "Verbosity and fluency bias let polished claims through. A grounded criterion with the evidence attached makes the judge check the claim instead of the tone; order shuffling fixes position bias, not this.", "pair": "position-vs-verbosity"}, {"q": "You must decide whether a new prompt beats the current one. Which judging setup is most stable?", "o": ["Absolute 1 to 5 scores on each, compared by mean", "One judge vote per conversation at high temperature", "Self-rating by the model that wrote each answer", "Counting which prompt gives longer answers", "Pairwise comparison in both orders on the same conversations"], "a": 4, "why": "Relative judgements are more consistent than absolute scores, and running both orders on the same inputs removes position bias and input differences."}, {"q": "The judge agrees with your people 90% on tone but 60% on policy compliance. What do you do?", "o": ["Average the two and report 75%", "Drop the judge for both criteria", "Automate tone, keep people on compliance, rework that criterion", "Retrain your people to match the judge", "Use the tone score as a proxy for compliance"], "a": 2, "why": "Agreement is per criterion. Use the judge where it matches people, and on the weak criterion tighten the wording or keep humans, especially when it is the high-risk one."}], "open": {"q": "You want an LLM to score thousands of support conversations a week. How do you know its scores mean anything?", "probe": "Treating the judge as a model that needs its own evaluation.", "a": ["Write narrow binary criteria with definitions, and give the judge the evidence (retrieved passages, tool results), not only the reply.", "Have people label a few hundred conversations with the same rubric and measure agreement per criterion.", "Control the biases: both orders in pairwise tests, a different model family, an eye on length.", "Automate only criteria with good agreement; keep a human sample running and re-check when the judge prompt or model changes.", "Never make it the only gate on a regulated answer; use deterministic checks there."]}, "say": ["**I treat the judge as another model that needs its own evaluation.**", "**Calibrate:** I'd label a couple hundred conversations by hand, measure agreement per criterion, and only automate the ones where it matches us.", "**Code where it must be exact:** at alfred_ claims of actions or searches are checked against the turn's tool-execution ledger, and that check is deterministic, not an LLM.", "**Human sample:** I'd keep one going, because judges drift too.", "So the score means something because we measured it."], "avoid": ["Claiming an LLM reviews each reply at alfred_: the action-claim check is deterministic code against the ledger", "Quoting a judge agreement figure as your own result at alfred_"], "was": ["d-llm-judge"], "res": [{"kind": "video", "req": true, "label": "LLM as a judge: scaling AI evaluation", "url": "https://www.youtube.com/watch?v=trfUBIDeI1Y", "m": 7, "why": "What a judge is, pairwise versus scored, and the biases to control.", "yt": {"id": "trfUBIDeI1Y", "ch": "IBM Technology"}}, {"kind": "video", "req": true, "label": "How to create an LLM judge and align with human labels", "url": "https://www.youtube.com/watch?v=kP_aaFnXLmY", "m": 25, "why": "The calibration loop: human labels, judge prompt, agreement per criterion, revise.", "yt": {"id": "kP_aaFnXLmY", "ch": "Evidently AI"}}, {"kind": "video", "req": false, "label": "How to automate AI evals (correctly)", "url": "https://www.youtube.com/watch?v=tqUDjc1HzO4", "m": 28, "why": "Why automated judges need validation against human labels first.", "yt": {"id": "tqUDjc1HzO4", "ch": "Hamel Husain"}}, {"kind": "read", "req": true, "label": "Hamel Husain: creating an LLM-as-a-judge that drives business results", "url": "https://hamel.dev/blog/posts/llm-judge/", "m": 20, "why": "Binary criteria, domain expert labels, and measuring agreement before trusting the judge."}, {"kind": "read", "req": false, "label": "Eugene Yan: evaluating the effectiveness of LLM evaluators", "url": "https://eugeneyan.com/writing/llm-evaluators/", "m": 20, "why": "Survey of judge biases and what agreement rates have been reported."}, {"kind": "read", "req": false, "label": "arXiv: Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena", "url": "https://arxiv.org/abs/2306.05685", "m": 15, "why": "Section on position, verbosity and self-enhancement bias."}]}, {"id": "eval-online", "title": "Offline green is not online good", "brief": "Golden sets are written by you, from yesterday's traffic, in clean text. Production brings new products, new phrasing, noisy speech and adversarial users. So evaluation continues after release: shadow mode, a canary, A/B tests on outcomes and sampled human review, with every finding flowing back into the offline set. The nuance: in a regulated firm you do not A/B test a new compliance answer on customers; content goes through approval first and experiments cover routing and presentation.", "points": ["Three offline blind spots: selection (only what you thought to include), time (last quarter's phrasing), channel (text tests miss ASR errors, interruptions and silence)", "Shadow mode: the candidate runs on live traffic, its output logged and never shown; compare intent, answer and tool calls with production and review the disagreements; costs tokens, carries no customer risk", "Canary: 1 to 5% of traffic or one segment, with automatic rollback on guardrail metrics (fallback, handoff, complaints, latency, sampled judge scores)", "Outcomes: containment read with repeat contact within 7 days, CSAT and cost per conversation; pairwise preference on sampled shadow outputs needs far fewer samples than a full A/B test", "Automation rate: Intercom frames it as involvement rate times resolution rate, separating how often the bot gets a chance from how well it uses it", "Close the loop: each reviewed failure is labelled and becomes a golden-set row, and often a new intent, guardrail or content fix"], "figs": [], "production": ["LinkedIn built tooling to evaluate on the order of 500 conversations a day for hallucination and responsible AI issues.", "Langfuse describes the loop as online monitoring catching the edge cases the dataset missed, which are then added to the dataset.", "Klarna reported a 25% drop in repeat inquiries, a better signal than raw chat share, though critics note it does not say how that was measured or how case mix was controlled.", "The CFPB warns that containment can rise because reaching a human got harder, the doom loop, so containment is paired with repeat contact, complaints and abandonment after fallback."], "mcq": [{"q": "You want to see how a new prompt behaves on real traffic without any customer seeing its answers. Which do you use?", "o": ["A canary on 1% of traffic", "Shadow mode, logging its outputs only", "An A/B test with a small variant", "The offline golden set", "A simulated-user suite"], "a": 1, "why": "Shadow mode runs the candidate on live inputs and discards its output, so you see real-traffic behaviour with no customer risk. A canary shows answers to real customers.", "pair": "shadow-vs-canary"}, {"q": "Shadow results look good. What does a canary give you that shadow mode cannot?", "o": ["Lower token cost than shadow mode", "Coverage of intents missing from the golden set", "A way to skip the regression suite", "Customer outcomes such as repeat contact and complaints", "Deterministic grading of every reply"], "a": 3, "why": "In shadow no customer sees the answer, so there is no outcome to measure. A canary exposes a small slice and lets you watch what customers actually do next.", "pair": "shadow-vs-canary"}, {"q": "A voice assistant passes its text golden set at 97% but does much worse on calls. Which offline blind spot is this?", "o": ["Selection: the set lacks those intents", "Time: phrasing has drifted since labelling", "Saturation: the suite sits at 100%", "Leakage: test items were in training", "Channel: text tests miss ASR errors and silence"], "a": 4, "why": "Typed test utterances do not contain misrecognised words, barge-in or dead air. Voice needs audio-level tests and its own online monitoring."}, {"q": "The bot is involved in 50% of conversations and resolves 60% of those. In Intercom's framing, what is the automation rate?", "o": ["110%", "60%", "50%", "30%", "10%"], "a": 3, "why": "Automation rate is involvement times resolution: 0.5 times 0.6 is 0.3. Splitting it shows whether to widen where the bot is used or improve how well it does there."}], "open": {"q": "Your new model beats the old one on every offline metric. Would you ship it? What happens between now and full rollout?", "probe": "Knowing why offline results do not transfer, and the online steps that close the gap.", "a": ["Not on offline numbers alone: the set misses un
