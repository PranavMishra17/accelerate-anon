kind": "read", "req": false, "label": "Rasa docs: Business logic with flows", "url": "https://rasa.com/docs/reference/primitives/flows/", "m": 8, "why": "Flows as the deterministic next-step policy that an LLM cannot overwrite."}]}, {"id": "map-eras", "title": "Classic NLU, LLM-first and the hybrid", "brief": "Classic platforms are a trained intent classifier, entity extractors and an authored state machine: predictable, cheap and auditable, but every new task costs training data and authoring. LLM-first stacks fold understanding and generation into one model: flexible, few labels, slower and harder to certify. Most banks run a hybrid, and the real question is where the line sits: the model interprets, code owns the action.", "points": ["Classic: classification plus labelling plus a state machine; per-intent metrics and easy audits", "LLM-first: one model reads the message, picks a tool and writes the reply; handles long-tail phrasing and several requests in one message", "Hybrid: a fast classifier or small model takes confident turns, an LLM takes uncertain or open-ended ones, deterministic flows own transactions", "Why classifiers survive: milliseconds on a CPU against about a second per LLM call, and a stable label for routing, analytics and compliance", "What changed: building the intent list stopped being the bottleneck, and evaluation became it"], "figs": ["clfLadder"], "production": ["Bank of America's Erica, as reported: still 700 plus curated intents rather than an LLM, for a closed set of high-volume actions", "Amazon (EMNLP 2024 industry track): sending a turn to the LLM only when a SetFit classifier was uncertain stayed within 2% of the LLM's accuracy with 50% less latency", "Rasa CALM and Copilot Studio moved intent matching to an LLM that reads flow or topic descriptions, while flows still own the steps", "Dialogflow CX keeps flows for authentication and payment, and adds generative playbooks and generative fallback for open conversation"], "mcq": [{"q": "A bank has 40 stable, high-volume intents, plenty of labelled logs, and a voice channel with tight latency. What is the strongest default for intent routing?", "o": ["A large LLM on every turn, with no classifier", "A fine-tuned encoder classifier, with an LLM for the uncertain tail", "Keyword rules only, since the intent set is small", "An LLM that writes new intents as traffic arrives", "Nearest-neighbour search over the training phrases alone"], "a": 1, "why": "Stable labels, lots of data and tight latency favour a fine-tuned encoder. The LLM earns its cost on the uncertain or open-ended turns the classifier is unsure about.", "pair": "classic-vs-llm"}, {"q": "What does an LLM-first design give up compared with a classic intent stack?", "o": ["The ability to handle paraphrases", "Support for multi-turn conversations", "Any way to call backend APIs", "Predictability and per-intent auditability", "The ability to answer 'none of these'"], "a": 3, "why": "The LLM handles paraphrase and multi-turn well. What it loses is a fixed label per turn that you can measure, audit and explain to a model risk team, and repeatable behaviour across runs.", "pair": "classic-vs-llm"}, {"q": "In the hybrid most banks run, which job does the LLM typically not do?", "o": ["Execute the money movement itself", "Interpret long-tail phrasing", "Extract slots from a messy message", "Answer FAQs from retrieved content", "Take turns the classifier is unsure about"], "a": 0, "why": "The LLM interprets and phrases. Execution goes through deterministic flows with validation and confirmation, so the model never does the transfer itself."}], "open": {"q": "Explain to a product manager the difference between a classic NLU bot and an LLM agent, and why a bank might still want the classic parts.", "probe": "A balanced trade-off, not 'LLMs replaced intents'", "a": ["Classic: a classifier picks the intent, extractors fill slots, and authored flows run the task", "LLM agent: one model understands, picks tools and writes replies, with far less training data per task", "Classic strengths: predictable, cheap, fast, measurable per intent, easy for model risk review", "LLM strengths: long-tail phrasing, several requests in one message, open questions", "So a hybrid: a router in front, flows own money movement, the LLM handles open questions grounded in approved content; Erica staying intent-based for closed actions is the example"]}, "say": ["**I don't think it's classic or LLM. It's where you draw the line.**", "**Fast path first:** at alfred_ a lean first pass answers simple turns from what it can read, or escalates to a heavier agent.", "**Code guards:** if a reply promises an action or claims it's done, code turns it into an escalation instead of shipping it.", "**Where the line sits:** the model interprets, and code owns the action.", "That's the same shape as a bank's hybrid."], "avoid": ["Implying hands-on time on a classic platform: say you've read how each one models the problem"], "was": [], "res": [{"kind": "keep", "src": "aieng", "req": true, "label": "AI Engineering from Scratch, phase 5: Chatbots: Rule-Based to Neural to LLM Agents", "url": "https://aiengineeringfromscratch.com/lesson?path=phases%2F05-nlp-foundations-to-advanced%2F17-chatbots-rule-to-neural", "m": 25, "why": "The whole history of conversational systems in one lesson: why each era replaced the last."}, {"kind": "video", "req": true, "label": "Generative vs rules-based chatbots", "url": "https://www.youtube.com/watch?v=lZjUS_8btEo", "m": 8, "why": "A plain comparison of the two eras: predictability and control against flexibility, the product manager framing.", "yt": {"id": "lZjUS_8btEo", "ch": "IBM Technology"}}, {"kind": "video", "req": true, "label": "Conversational AI assistants with CALM: introduction to CALM", "url": "https://www.youtube.com/watch?v=SAZROeEQtMg", "m": 7, "why": "Why an LLM-only agent is hard to control and how a hybrid keeps business logic deterministic.", "yt": {"id": "SAZROeEQtMg", "ch": "Rasa"}}, {"kind": "video", "req": false, "label": "Rasa CALM demo: conversational AI with LLMs (Alan Nichol)", "url": "https://www.youtube.com/watch?v=4UnxaJ-GcT0", "m": 13, "why": "A live demo of a hybrid, with the founder's reasoning on what the LLM does and what code does.", "yt": {"id": "4UnxaJ-GcT0", "ch": "Vanishing Gradients"}}, {"kind": "read", "req": true, "label": "Anthropic: Building effective agents", "url": "https://www.anthropic.com/engineering/building-effective-agents", "m": 15, "why": "Workflows (fixed paths) against agents (model-directed): the same trade-off as classic against LLM-first, with when each fits."}, {"kind": "read", "req": false, "label": "Rasa docs: Conversational AI with language models", "url": "https://rasa.com/docs/learn/concepts/calm/", "m": 6, "why": "A vendor's statement of the hybrid: LLM understands, flows decide, so regulated steps stay predictable."}, {"kind": "read", "req": false, "label": "Eugene Yan: Patterns for building LLM-based systems", "url": "https://eugeneyan.com/writing/llm-patterns/", "m": 25, "why": "Guardrails, evals and caching patterns around a model, the parts that keep classic components relevant."}]}, {"id": "map-field", "title": "Where classification, embeddings and LLMs sit", "brief": "Underneath the assistant is the NLP field: text becomes units (tokens), units become numbers (from sparse counts to dense embeddings), and tasks run on top (classification, labelling, retrieval, generation). Each era replaced hand-built features with learned representations. The nuance: the older rungs did not die, and TF-IDF, small classifiers and embeddings still sit in front of LLMs as routers, retrievers and guards.", "points": ["Tokenization: text into words, subwords or bytes; LLM cost and quirks with numbers and other languages start here", "Sparse to dense: bag of words and TF-IDF count words; static embeddings (word2vec, GloVe) give one vector per word, so 'bank' has one meaning; contextual ones (BERT) give one per occurrence; sentence embeddings give one per text", "Text classification: intent, sentiment, topic; from logistic regression on TF-IDF, to fine-tuned encoders, to zero-shot LLMs", "Embeddings in the assistant: semantic search over FAQs and RAG (look up approved passages first, then have the model answer from them), clustering logs to find new intents, nearest-neighbour routing", "LLMs: very large decoders pretrained on next-token prediction, then instruction and preference tuned; in the assistant they understand, plan tool calls and phrase replies", "Eras: rules, statistical models on hand-built features, neural seq2seq with attention, the Transformer (2017), BERT (2018) making pretrain then fine-tune the standard, then LLMs"], "figs": ["nlpMap", "reprLadder"], "production": ["TF-IDF is still the default sparse baseline, strong for topic-like classification and lexical matching", "Sentence embeddings drive semantic search, clustering and the retrieval half of RAG in front of the LLM", "Encoders (BERT, RoBERTa, DeBERTa) for understanding, decoders (GPT, Llama) for generation, encoder-decoders (T5, BART) for input-to-output tasks", "Machine translation is the task that produced seq2seq, attention and the Transformer"], "mcq": [{"q": "Why does a static embedding such as word2vec struggle with 'bank' in 'river bank' and 'bank account'?", "o": ["It cannot represent words seen fewer than ten times", "It splits 'bank' into subwords that lose the meaning", "It gives one vector per word, whatever the sentence", "It weights 'bank' down because the word is common", "It encodes word order but not word meaning"], "a": 2, "why": "Static embeddings learn one vector per word type, so both senses share it. A contextual model like BERT computes a vector per occurrence from the whole sentence."}, {"q": "Which job in a conversational assistant is a sentence embedding model best suited to?", "o": ["Executing a transfer once the slots are filled", "Generating the reply text in the right tone", "Measuring word error rate on call audio", "Deciding whether an action needs confirmation", "Finding the FAQ article closest in meaning to a question"], "a": 4, "why": "Sentence embeddings place texts with similar meaning close together, which is what semantic search and RAG retrieval need. Execution, confirmation and phrasing belong to other stages."}, {"q": "What thread runs through NLP's eras, from n-gram models to LLMs?", "o": ["Models got smaller and cheaper at each step", "Hand-built features were replaced by learned representations", "Rules were removed from every production system", "Each era moved from generation toward classification", "Labelled data mattered more at each step"], "a": 1, "why": "Statistical models needed hand-built features; neural models and then pretrained Transformers learned the representations. Rules still survive for narrow high-precision cases, and LLMs need less labelled data, not more."}], "open": {"q": "Give me the map of NLP in two minutes, and put conversational AI on it.", "probe": "Breadth with structure, and whether you can place real systems and your own work on it", "a": ["Foundations: normalization and tokenization, morphology, tagging and parsing", "Representations: sparse (bag of words, TF-IDF, n-grams) to dense (static, contextual, sentence embeddings)", "Tasks: classification, sequence labelling, QA, summarization, translation, retrieval, dialogue, extraction", "Eras: rules, statistical, neural, Transformers, LLMs; the thread is learned representations replacing hand-built features", "Conversational AI is a stack over the map: intent is classification, entities are labelling, FAQ is retrieval, the reply and tool calls are generation"]}, "say": ["**I'd draw it as a tree: units, numbers, tasks, eras, and how you measure it.**", "**Units:** how text becomes tokens.", "**Numbers:** how tokens become vectors, from counts to embeddings.", "**Tasks and eras:** classification, labelling, retrieval and generation, and the thread is that learned representations replaced hand-built features.", "Conversational AI isn't a branch, it's a stack that uses several tasks in one turn. In MetaRAG I used TF-IDF weighted embeddings, the old rung and the new one working together."], "avoid": ["Calling BERT a generative model: it is an encoder, used for understanding"], "was": [], "res": [{"kind": "video", "req": true, "label": "Brief history of large language models and generative AI", "url": "https://www.youtube.com/watch?v=K7o5_Fj7_SY", "m": 11, "why": "Walks the eras in order (rules, statistical, neural, transformers), which is the map you draw in two minutes.", "yt": {"id": "K7o5_Fj7_SY", "ch": "Analytics Vidhya"}}, {"kind": "video", "req": true, "label": "Transformers, explained: the model behind GPT, BERT and T5", "url": "https://www.youtube.com/watch?v=SZorAJ4I-sA", "m": 10, "why": "Places encoder, decoder and encoder-decoder models and their uses on the map.", "yt": {"id": "SZorAJ4I-sA", "ch": "Google Cloud Tech"}}, {"kind": "video", "req": false, "label": "Large language models explained briefly", "url": "https://www.youtube.com/watch?v=LPZh9BOjkQs", "m": 8, "why": "Short picture of what a language model does, to anchor where LLMs sit.", "yt": {"id": "LPZh9BOjkQs", "ch": "3Blue1Brown"}}, {"kind": "read", "req": true, "label": "Hugging Face: LLM course, how do Transformers work", "url": "https://huggingface.co/learn/llm-course/chapter1/4", "m": 15, "why": "Names the three model families and which tasks each handles, including classification and generation."}, {"kind": "read", "req": false, "label": "Lilian Weng: Generalized language models", "url": "https://lilianweng.github.io/posts/2019-01-31-lm/", "m": 20, "why": "ELMo to BERT, GPT and T5; read to the end of BERT"}, {"kind": "read", "req": false, "label": "Stanford SLP3: ch. 2 Words and Tokens", "url": "https://web.stanford.edu/~jurafsky/slp3/2.pdf", "m": 20, "why": "First stop on the map: how text becomes tokens before any model sees it."}]}, {"id": "map-metrics", "title": "One metric per stage", "brief": "Each stage of the stack has its own metric, and each metric hides something. Accuracy hides rare intents when classes are imbalanced, word error rate hides the digits and names that matter, and perplexity says how well a model predicts text, not whether it answers correctly. The end-to-end number is task completion; the per-stage numbers tell you where to look.", "points": ["ASR: word error rate, but slot-level accuracy on digits, names and amounts is what breaks tasks", "Precision and recall: of what I flagged, how much was right; of what was there, how much I found; F1 drops if either is low", "Intent: macro-F1 with per-intent recall and a confusion matrix; with 95% of data in one class, always predicting it scores 95% accuracy and near-zero macro-F1", "Dialogue state: joint goal accuracy, the share of turns with every slot right", "Generation: BLEU and ROUGE are cheap overlap, weakly tied to quality; open-ended replies need rubric judges (a model that scores replies against a written rubric) calibrated against people", "End to end: task completion, with escalation and repeat contact as guardrails"], "figs": ["confusionMatrix", "evalHarness"], "production": ["Microsoft CLU reports per-intent precision, recall and F1 with a confusion matrix", "MT-bench: strong LLM judges agreed with human preferences over 80% of the time, about the human-to-human rate, but showed position, verbosity and self-enhancement biases", "Perplexity is exp of the average negative log-likelihood: a language model measure, not an answer-quality one"], "mcq": [{"q": "150 intents, ten of which carry most of the traffic. Which headline metric shows rare intents failing?", "o": ["Micro-F1, because it pools every decision", "Overall accuracy on the test set", "Perplexity of the intent model", "Macro-F1, because every intent counts equally", "BLEU against the reference labels"], "a": 3, "why": "Micro pools all decisions, so the ten big intents dominate it. Macro averages per-intent F1, so a rare intent failing pulls it down. Report both, lead with macro, and show per-intent recall.", "pair": "macro-vs-micro"}, {"q": "After retraining, micro-F1 rose from 0.91 to 0.93 while macro-F1 fell from 0.80 to 0.72. What most likely happened?", "o": ["It got better on every intent equally", "The test set shrank, so both scores are noise", "It improved on rare intents and slipped on big ones", "The labels changed, so the numbers can't be compared", "It improved on big intents and got worse on rare ones"], "a": 4, "why": "Micro follows the high-volume intents and macro weights every intent equally. Micro up with macro down means the big ones improved while several small ones got worse.", "pair": "macro-vs-micro"}, {"q": "Why is perplexity a poor way to judge a banking assistant's answers?", "o": ["It measures how well text is predicted, not whether answers are right", "It can only be computed for encoder models", "It rewards short answers over long ones", "It needs a human reference answer for every turn", "It ignores the tokens at the start of a reply"], "a": 0, "why": "Perplexity is about predicting held-out text. A fluent, likely answer can still be wrong, ungrounded or unhelpful, so task metrics and judges are needed."}], "open": {"q": "Your intent model reports 94% accuracy and the business says the bot feels broken. What do you look at?", "probe": "Whether you know what accuracy hides and can go from a metric to a cause", "a": ["Check the class balance: if a few intents carry the traffic, accuracy is mostly about them", "Look at macro-F1, per-intent recall and the hot cells of the confusion matrix", "Compare the clean test set with real traffic, sliced by channel, since voice transcripts carry ASR errors", "Measure end-to-end task completion and escalation: a right intent with a wrong slot still fails", "Read a sample of failed conversations to find the cause the numbers point at"]}, "say": ["**I'd first ask what the 94% is over.**", "**Check the mix:** if a few intents carry the traffic, accuracy hides the rare ones, so I'd look at macro-F1, per-intent recall and the confusion matrix.", "**Go end to end:** task completion, because a right intent with a wrong slot still fails.", "**Read real failures:** at alfred_ we built a replay bench over real production turns, graded by a person, because the aggregate never told us why.", "I'd trust the failed conversations over the headline number."], "avoid": ["Quoting BLEU or ROUGE as the measure of a chatbot's quality"], "was": [], "res": [{"kind": "video", "req": true, "label": "Machine learning fundamentals: the confusion matrix", "url": "https://www.youtube.com/watch?v=Kdsp6soqA7o", "m": 8, "why": "Reading a confusion matrix, which is how you find the intents hiding behind 94% accuracy.", "yt": {"id": "Kdsp6soqA7o", "ch": "StatQuest with Josh Starmer"}}, {"kind": "video", "req": false, "label": "Mapping chatbot metrics to business KPIs", "url": "https://www.youtube.com/watch?v=qtKbKoEKBdU", "m": 32, "why": "Containment, fallback rate and escalation as the end-to-end measures; watch for how they differ from model accuracy.", "yt": {"id": "qtKbKoEKBdU", "ch": "Dashbot"}}, {"kind": "video", "req": false, "label": "Word error rate (WER) explained", "url": "https://www.youtube.com/watch?v=hoEWRdHi7dI", "m": 3, "why": "WER defined, and why a good score can still mangle digits and names.", "yt": {"id": "hoEWRdHi7dI", "ch": "DataMListic"}}, {"kind": "read", "req": true, "label": "Microsoft Learn: CLU evaluation metrics", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/evaluation-metrics", "m": 12, "why": "Precision, recall, F1 per intent and per entity, plus the confusion matrix, from a vendor's own tool."}, {"kind": "read", "req": false, "label": "scikit-learn: Metrics and scoring, precision, recall and F-measures", "url": "https://scikit-learn.org/stable/modules/model_evaluation.html", "m": 15, "why": "Micro, macro and weighted averages for many classes, with the formulas."}, {"kind": "read", "req": false, "label": "Stanford: SLP3, ch. 4 Logistic regression and text classification", "url": "https://web.stanford.edu/~jurafsky/slp3/4.pdf", "m": 30, "why": "Section on evaluating classifiers: precision, recall, F1 and why averaging choice matters."}]}], "day": "Day 1, Sunday 4 Oct"}, {"id": "classify", "title": "Text classification and embeddings", "blurb": "Choose and defend an intent model, its confidence thresholds and its out-of-scope handling, and explain embeddings from TF-IDF to contrastive sentence models, vector search and routing.", "sessions": ["wc26"], "topics": [{"id": "classify-ladder", "title": "Choosing the classifier: the ladder", "brief": "There is no best intent classifier, only the best fit for labelled examples per intent, how often the labels change, and the latency budget. Climb from a TF-IDF baseline to embeddings plus a head, SetFit, a fine-tuned encoder or an LLM, and stop when the next rung stops beating the last on your held-out set. The nuance: most production systems end as a cascade, a small model for the confident bulk and an LLM for the uncertain slice, and that only works if the small model is calibrated.", "points": ["Baseline: TF-IDF with logistic regression or a linear SVM trains in seconds on a CPU, is interpretable, and tells you how hard the problem is", "Embeddings plus a head: a frozen sentence encoder with logistic regression or kNN (take the label of the nearest labelled examples); an embedding is a vector of numbers for a text, so similar texts sit close; strong with little data, cheap to retrain, and a new intent is new examples", "SetFit: fine-tunes a sentence transformer contrastively on pairs built from 8 to 64 examples per class (same class close, different classes apart), then fits a logistic head; a few examples make many pairs, and the encoder already knows semantics", "Fine-tuned encoder: BERT, RoBERTa or DeBERTa with hundreds to thousands of examples per class give the best closed-set accuracy; DistilBERT or MiniLM when latency is tight; typically learning rate 2e-5 to 5e-5, 2 to 4 epochs", "LLM: no training, copes with changing labels and out-of-scope, but costs latency and money per call; with hundreds of overlapping labels, embedding kNN shortlists candidates and an LLM or reranker picks", "Structure: multi-class is softmax with cross-entropy; multi-label ('freeze my card and tell me my balance') is a sigmoid per label with its own threshold, or split clauses first; a hierarchy (domain, then intent) lets an unsure fine prediction fall back to the right domain"], "figs": ["clfLadder", "intentTaxonomy"], "production": ["Casanueva et al. (2020), who introduced BANKING77: dual sentence encoders with a light classifier beat full BERT-Large fine-tuning at 10 or 30 examples per intent, trained in minutes on one CPU", "A 2026 preprint: fine-tuned RoBERTa beat Claude Haiku on ATIS (95.9 against 84.1) and tied on CLINC150, but the LLM had far higher out-of-scope recall (85.6 against 58.1), at about 981 ms against 2.4 ms p50", "An ACL 2025 industry paper sends only the uncertain turns from a cheap classifier to an LLM for out-of-scope detection on CLINC150 and BANKING77; its stated limit is the first stage's calibration", "Encoder latency, in order of effort: truncate, dynamic padding and length bucketing, ONNX or TensorRT export, fp16 or int8, distil to DistilBERT or MiniLM; cache frequent inputs; measure p95 on the target hardware", "Multilingual: a multilingual backbone transfers across languages (SetFit reports this), but keep a per-language golden set and thresholds; Dialogflow CX sets its classification threshold per language per flow"], "mcq": [{"q": "200 intents, 50 labelled examples each, stable labels, a 30 ms budget. What do you build first?", "o": ["A prompted LLM on every request, since 50 examples is too few to train on", "Full fine-tuning of BERT-Large straight away, as the most accurate option", "A TF-IDF and logistic regression baseline, then embeddings with a head, moving up only when a rung wins on held-out data", "Zero-shot NLI with each intent as a hypothesis, since it needs no data", "kNN over mean-pooled vanilla BERT vectors, since it needs no training"], "a": 2, "why": "The baseline costs minutes and sets the bar every later rung must beat. Zero-shot NLI needs 200 forward passes per query, an LLM per call breaks 30 ms, and vanilla mean-pooled BERT is poor for similarity."}, {"q": "Why does SetFit work with about 8 examples per class?", "o": ["It generates synthetic examples with an LLM before training", "Pairs from a few examples give many contrastive signals, and the pretrained encoder only has to bend its space a little", "It prompts a large model with the examples, so nothing is trained", "It trains only a logistic head and keeps the encoder frozen", "It uses a much larger encoder than BERT, which memorises the classes"], "a": 1, "why": "SetFit fine-tunes the encoder itself on same-class and different-class pairs, then fits a head. A frozen encoder with a head is the rung below it."}, {"q": "'Freeze my card and tell me my balance' goes into a single softmax over intents. What goes wrong?", "o": ["The softmax gives each intent 0.5 and the router runs both", "Nothing, because the confidence threshold catches it", "The tokenizer splits on 'and', so the model sees two inputs", "The two intents cancel and the turn falls to out-of-scope", "The softmax forces one winner, so one request is silently dropped"], "a": 4, "why": "A softmax picks one class per input. Compound requests need a sigmoid per label with per-label thresholds, or clause splitting before a single-label model."}, {"q": "When does a cascade of a small classifier and an LLM fail quietly?", "o": ["When the small model is overconfident, so wrong answers clear the bar and never reach the LLM", "When the LLM is more accurate than the small model on hard cases", "When most traffic is routine and the label set is stable", "When the latency budget is loose enough for the LLM", "When the small model abstains on too many turns"], "a": 0, "why": "The small model's confidence decides who escalates. If it is miscalibrated, its confident errors ship. Abstaining too often costs money but is visible, not quiet."}], "open": {"q": "You have 200 intents, 50 examples each, and some LLM budget. How do you build the intent model, and how do you decide when to stop?", "probe": "Judgement on the ladder: cheapest first, measured, with a plan for the uncertain slice.", "a": ["A TF-IDF and logistic regression baseline in minutes, to see how hard it is", "Sentence embeddings with a head, then SetFit or a fine-tuned small encoder; 10,000 examples is enough for fine-tuning", "A stratified held-out set, macro-F1 and per-intent recall, and a none class from day one; move up only when the next rung wins", "Read the confusion matrix: merge or clarify colliding intents", "Cascade: the small model takes confident turns, the uncertain slice goes to an LLM constrained to the intent list"]}, "say": ["**I'd climb the ladder cheapest first, and only move up when the next rung beats the last on a held-out set.**", "**Baseline:** TF-IDF and logistic regression, because in a few seconds it tells me how hard the problem really is.", "**Then up:** sentence embeddings with a head, then SetFit or a small fine-tuned encoder.", "**Read the matrix:** with 200 intents some will collide, so I'd spend real time on the confusion matrix.", "**Cascade:** the uncertain slice goes to an LLM constrained to the intent list.", "To be honest, at alfred_ we don't have a trained intent classifier: intent comes from an LLM with typed tool schemas checked in code. So this is how I'd build it, not something I've shipped."], "avoid": ["Implying you have shipped a trained intent classifier, or worked on Dialogflow, Lex or Rasa models."], "was": ["q-classify-200-intents-with-50-examples-each-what-do-you-do", "q-what-is-setfit-and-why-does-it-work-with-so-few-examples", "q-how-would-you-reduce-the-latency-of-a-bert-classifier", "e-approach-choice", "e-hierarchy-multilabel-multilingual"], "res": [{"kind": "keep", "src": "aieng", "req": true, "label": "AI Engineering from Scratch, phase 5: Sentiment Analysis", "url": "https://aiengineeringfromscratch.com/lesson?path=phases%2F05-nlp-foundations-to-advanced%2F05-sentiment-analysis", "m": 25, "why": "Text classification built from scratch: the ladder from a lexicon to a trained model, the same ladder an intent classifier climbs."}, {"kind": "video", "req": true, "label": "High quality text classification with few training examples with SetFit", "url": "https://www.youtube.com/watch?v=IHalt4Nbf_Q", "m": 7, "why": "Few-shot intent classification with SetFit, the middle rung for 50 examples per intent.", "yt": {"id": "IHalt4Nbf_Q", "ch": "Cohere"}}, {"kind": "video", "req": false, "label": "Text classification explained: Naive Bayes, logistic regression and fine-tuning", "url": "https://www.youtube.com/watch?v=1jsTRXZTtq8", "m": 11, "why": "The baseline rung and how it compares with fine-tuned models.", "yt": {"id": "1jsTRXZTtq8", "ch": "SH AI Academy"}}, {"kind": "video", "req": false, "label": "Fine-tuning BERT for text classification", "url": "https://www.youtube.com/watch?v=4QHg8Ix8WWQ", "m": 24, "why": "The fine-tuned encoder rung in code: head, labels, training loop and evaluation.", "yt": {"id": "4QHg8Ix8WWQ", "ch": "Shaw Talebi"}}, {"kind": "read", "req": false, "label": "Hugging Face: SetFit, efficient few-shot learning without prompts", "url": "https://huggingface.co/blog/setfit", "m": 10, "why": "How SetFit works, its 8-per-class results and the multilingual section."}, {"kind": "read", "req": false, "label": "Alex Jacobs: Beating BERT? Small LLMs vs fine-tuned encoders", "url": "https://alex-jacobs.com/posts/beatingbert/", "m": 10, "why": "Throughput numbers and a plain when-each-wins summary."}, {"kind": "read", "req": false, "label": "scikit-learn: Metrics and scoring", "url": "https://scikit-learn.org/stable/modules/model_evaluation.html", "m": 15, "why": "Choosing the score on which to decide when to stop climbing the ladder."}]}, {"id": "classify-confidence", "title": "Calibration and thresholds", "brief": "A softmax score is a ranking signal, not the probability of being right, and modern networks are overconfident. Calibrate first so that 0.9 means right about 90% of the time, then set thresholds per action risk from held-out data. The nuance: calibration and thresholding are two different jobs, and both drift with traffic and with every retrain.", "points": ["Calibration: of all predictions made at 0.8 confidence, about 80% should be right; Guo et al. (2017) showed modern deep networks are overconfident", "Measure: a reliability diagram, and expected calibration error (bin predictions by confidence, average the gap between confidence and accuracy, weighted by bin size)", "Temperature scaling: divide the logits by one scalar T fitted on a held-out split; the top class never changes, so accuracy is unchanged, but which predictions clear a threshold does change", "Thresholds by risk: a greeting can act at a low score, a funds transfer needs a high one, and a middle band confirms first; choose operating points on a precision against coverage curve", "Margin: if the top two intents are close, clarify even when the top score clears the bar (Rasa's ambiguity threshold)", "Drift: refit T and re-tune thresholds after every retrain; watch the live confidence distribution and fallback rate"], "figs": ["thresholdBands", "softmaxCrossEntropy"], "production": ["Vendor defaults are only starting points: Dialogflow CX's ML classification threshold is 0.3, Rasa's FallbackClassifier defaults to 0.7 with an ambiguity margin, and CLU lets you set a None score threshold", "Microsoft's CLU guidance gives per-intent examples of about 0.40 for a greeting and 0.95 for placing a call, and notes a model can predict the wrong intent at 1.00", "Rasa's two-stage fallback: ask the user to confirm the likely intent, then to rephrase, then hand off; showing the top two as quick replies turns uncertainty into one tap", "Hendrycks and Gimpel: maximum softmax probability is a usable baseline for spotting errors and out-of-distribution inputs, but some of those inputs still score high"], "mcq": [{"q": "After temperature scaling with T = 2, what happens to accuracy?", "o": ["It rises, because overconfident errors are softened", "It falls, because confident correct answers drop below 0.5", "It shifts toward rare classes, because they gain probability", "It stays the same, because dividing every logit by one positive scalar keeps the top class", "It rises on rare classes and falls on common ones"], "a": 3, "why": "Dividing all logits by the same positive number preserves their order, so the argmax and accuracy are unchanged. Only the confidence values move.", "pair": "calibration-vs-accuracy"}, {"q": "On a held-out set, average confidence is 0.95 and accuracy is 80%. What does that tell you, and what do you do?", "o": ["It is overconfident; fit a temperature on held-out data, then re-tune the thresholds", "It is underconfident; lower the thresholds to accept more turns", "It is well calibrated, since accuracy is far above chance", "Accuracy is the problem; retrain with more data before touching confidence", "Switch the metric to macro-F1, which corrects overconfidence"], "a": 0, "why": "Confidence above accuracy is overconfidence. Temperature scaling fixes the confidence without changing predictions; thresholds tuned on the old scores then need re-tuning.", "pair": "calibration-vs-accuracy"}, {"q": "A bank assistant handles 'check balance' and 'send money'. How should their thresholds differ?", "o": ["One global 0.5 threshold, so behaviour is consistent", "Lower for send money, because a missed transfer frustrates users most", "A higher bar for send money with a confirm band below it, and a lower bar for balance", "No threshold for send money, since a confirmation step runs anyway", "The same threshold, with a separate temperature fitted for send money"], "a": 2, "why": "Thresholds follow the cost of a wrong action. A wrong balance answer is cheap; a wrong transfer is not, so it needs a high bar, a confirmation, and a clarify band below."}], "open": {"q": "Your intent model is confidently wrong on some turns, sending users to the wrong flow at 0.97. What do you do?", "probe": "Whether you separate calibration from thresholds and tie thresholds to risk.", "a": ["Measure: a reliability diagram and ECE on a held-out split that includes real out-of-scope traffic", "Temperature scaling fitted on a separate split: accuracy unchanged, confidence honest", "Thresholds per action risk plus a top-two margin; the middle band confirms or clarifies", "Look at the confident errors: often a taxonomy or label problem, or a missing none class for near misses", "Refit after every retrain; monitor the confidence distribution and fallback rate"]}, "say": ["**A softmax score ranks answers, it isn't the probability of being right, so I'd calibrate first and set thresholds second.**", "**Check the scores:** a reliability diagram on held-out data.", "**Fix them:** temperature scaling keeps the predictions and makes the confidence honest.", "**Set thresholds by risk:** a balance check can go at a lower score, a transfer needs a high one and a confirmation.", "At alfred_ the confirm flow does that last part in code: anything that sends or deletes always previews and asks first, whatever the model's confidence."], "avoid": ["Calling a platform's intent score a probability: CLU itself warns of wrong intents at 1.00."], "was": ["q-why-does-calibration-matter-and-how-do-you-fix-it", "e-calibration-thresholds"], "res": [{"kind": "video", "req": true, "label": "Probability calibration, data science concepts", "url": "https://www.youtube.com/watch?v=AunotauS5yI", "m": 11, "why": "Calibration defined with reliability curves, the first step to explaining a confidently wrong 0.97.", "yt": {"id": "AunotauS5yI", "ch": "ritvikmath"}}, {"kind": "video", "req": false, "label": "When calibration beats metrics", "url": "https://www.youtube.com/watch?v=oOZr4kRJgFE", "m": 13, "yt": {"id": "oOZr4kRJgFE", "ch": "Probabl"}, "why": "Why a better-calibrated model can beat a higher-scoring one in practice."}, {"kind": "video", "req": false, "label": "Temperature scaling: fix overconfident probabilities with PyTorch", "url": "https://www.youtube.com/watch?v=YKau1_KcZWo", "m": 8, "why": "Fits one scalar T on held-out data and shows the effect on confidence.", "yt": {"id": "YKau1_KcZWo", "ch": "Professor Py: AI Foundations"}}, {"kind": "read", "req": false, "label": "Guo et al.: On calibration of modern neural networks", "url": "https://arxiv.org/abs/1706.04599", "m": 25, "why": "Sections 3 and 4: what miscalibration is, and why temperature scaling works for modern networks."}, {"kind": "read", "req": true, "label": "scikit-learn: Probability calibration", "url": "https://scikit-learn.org/stable/modules/calibration.html", "m": 12, "why": "Reliability curves and the two calibration methods, with the code idea."}, {"kind": "read", "req": false, "label": "Amazon Lex: Using confidence scores", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/confidence-scores.html", "m": 6, "why": "How a production NLU service exposes confidence and what to do near the threshold."}], "code": [{"lang": "python", "title": "Naive Bayes intent classifier: per-intent cutoffs, and a score that climbs to 1.0 when one word is repeated", "file": "interviews/vanguard_builds/intent_classifier.py", "src": "# Exercise: a bag-of-words intent classifier (naive Bayes) with an out-of-scope cutoff, per-intent thresholds,\n# and a demo that a raw score is not a calibrated probability.\n# Run its test: python interviews/vanguard_builds/intent_classifier_test.py\nimport math\nimport re\nfrom collections import Counter\n\nSTOP = {\"the\", \"a\", \"an\", \"to\", \"is\", \"my\", \"i\", \"me\", \"of\", \"it\", \"for\", \"on\", \"do\", \"can\", \"you\", \"what\", \"please\", \"and\"}\n\nTRAIN = {\n    \"check_balance\": [\n        \"what is my balance\", \"how much money do i have\", \"check my balance\", \"show me my account balance\",\n        \"balance in my checking account\", \"how much is in savings\", \"tell me my balance please\",\n        \"what is the balance on my account\", \"how much cash is available\", \"can you check my balance\",\n        \"current balance of my savings account\", \"what do i have in my account\",\n    ],\n    \"transfer_money\": [\n        \"transfer money to savings\", \"move 200 dollars from checking to savings\", \"send money to my brother\",\n        \"i want to transfer funds\", \"move money between my accounts\", \"transfer 50 to my savings account\",\n        \"send 100 dollars to john\", \"can you move some money for me\", \"wire money to another account\",\n        \"i need to transfer money\", \"put 300 from checking into savings\", \"pay my friend 40 dollars\",\n    ],\n    \"card_lost\": [\n        \"i lost my card\", \"my debit card is missing\", \"my credit card was stolen\", \"i cannot find my card\",\n        \"block my lost card\", \"card stolen please freeze it\", \"i think someone stole my wallet and card\",\n        \"freeze my card now\", \"lost my debit card yesterday\", \"report a stolen credit card\",\n        \"my card is gone\", \"cancel my lost card and send a new one\",\n    ],\n    \"dispute_charge\": [\n        \"i did not make this charge\", \"dispute a charge on my card\", \"there is a wrong charge on my statement\",\n        \"i was charged twice\", \"this transaction is not mine\", \"i want to dispute a transaction\",\n        \"unauthorized charge on my account\", \"i see a charge i do not recognize\", \"refund a wrong charge\",\n        \"merchant charged me the wrong amount\", \"challenge a payment on my statement\", \"double charged at a store\",\n    ],\n    \"branch_hours\": [\n        \"when does the branch open\", \"what time does the branch close\", \"branch hours on saturday\",\n        \"is the branch open today\", \"opening hours of the nearest branch\", \"when do you close on sunday\",\n        \"what are your branch hours\", \"is the bank open on holidays\", \"what time do you open tomorrow\",\n        \"hours for the downtown branch\", \"when is the branch open\", \"branch closing time\",\n    ],\n}\n\n\ndef tokens(text: str) -> list[str]:\n    return [w for w in re.findall(r\"[a-z0-9]+\", text.lower()) if w not in STOP]\n\n\nclass IntentClassifier:\n    def __init__(self, train: dict[str, list[str]], cutoff: float = 0.6, per_intent: dict[str, float] | None = None):\n        self.cutoff = cutoff\n        self.per_intent = per_intent or {}  # a risky intent can demand more confidence than a harmless one\n        self.counts = {i: Counter(w for u in us for w in tokens(u)) for i, us in train.items()}\n        self.vocab = {w for c in self.counts.values() for w in c}\n        self.totals = {i: sum(c.values()) for i, c in self.counts.items()}\n\n    def scores(self, text: str) -> dict[str, float]:\n        words = [w for w in tokens(text) if w in self.vocab]  # unseen words carry no evidence\n        logp = {}\n        for i, c in self.counts.items():\n            logp[i] = sum(math.log((c[w] + 1) / (self.totals[i] + len(self.vocab))) for w in words)  # +1 smoothing\n        m = max(logp.values())\n        exp = {i: math.exp(v - m) for i, v in logp.items()}\n        z = sum(exp.values())\n        return {i: v / z for i, v in exp.items()}  # softmax: sums to 1, but it is a score, not a probability\n\n    def classify(self, text: str) -> tuple[str | None, float]:\n        if not any(w in self.vocab for w in tokens(text)):\n            return None, 0.0\n        s = self.scores(text)\n        best = max(s, key=s.get)\n        if s[best] < self.per_intent.get(best, self.cutoff):\n            return None, s[best]  # below the line: say \"not sure\" instead of guessing\n        return best, s[best]\n\n\ndef overconfidence_demo(clf: IntentClassifier) -> tuple[float, float]:\n    # Naive Bayes multiplies word evidence as if words were independent. Repeating one word adds the same\n    # evidence again, so the score climbs toward 1.0 though we learned nothing new: not a calibrated probability.\n    once = clf.scores(\"balance savings\")[\"check_balance\"]\n    five = clf.scores(\"balance savings \" * 5)[\"check_balance\"]\n    return once, five\n\n\nif __name__ == \"__main__\":\n    c = IntentClassifier(TRAIN)\n    for u in [\"how much is in my savings\", \"what is the weather\", \"I lost my card\"]:\n        print(u, \"->\", c.classify(u))\n    print(overconfidence_demo(c))\n"}]}, {"id": "classify-oos", "title": "Out-of-scope detection", "brief": "In a bank assistant the expensive failure is a confident wrong intent, not a missed one. Treat out-of-scope as a designed case: a none class trained on real near misses, a calibrated threshold, a distance signal, and an LLM or a person for the borderline band. The nuance: catching more out-of-scope costs some in-scope accuracy, so you choose an operating point; you do not remove the trade-off.", "points": ["CLINC150 (Larson et al., 2019): 150 intents in 10 domains plus out-of-scope queries; classifiers did well in scope and poorly on out-of-scope", "Three kinds: out-of-domain (weather, to a bank bot), in-domain but unsupported (a product you do not offer), in-scope but ambiguous; they need a redirect, a policy answer or handoff, and a clarifying question", "Detectors: max softmax with a calibrated threshold (the baseline), an explicit none class (often the most reliable on near misses), distance to class centroids or kNN in embedding space (an embedding is a vector of numbers for a text, so similar texts sit close), and an LLM judge for the borderline band", "Negatives: mine real logs (small talk, other products, competitors, a bare 'yes' or number) plus near misses like 'I want to buy a book' in a flight bot; synthetic negatives alone under-represent customers", "Measure: in-scope accuracy, out-of-scope recall and false-accept rate at a fixed in-scope accuracy, never one blended number", "BANKING77: 77 fine-grained intents, 13,083 queries, one domain, so the hard part is confusable neighbours; the original has no out-of-scope split"], "figs": ["thresholdBands"], "production": ["Platforms: CLU's None intent with a score threshold, Dialogflow CX's default negative intent, Lex's AMAZON.FallbackIntent", "Microsoft's CLU guidance: add near-miss false positives to the None intent", "The 2026 preprint: the LLM's out-of-scope recall was 85.6 against 58.1 for a fine-tuned encoder, the main argument for routing uncertain turns to an LLM", "Log every rejection and review a sample on a schedule: it shows where the model quietly fails, the unsupported requests are the product backlog, and model-risk reviewers ask for it"], "mcq": [{"q": "Which detector is usually strongest on near misses like 'I want to buy a book' sent to a flight bot?", "o": ["Max softmax with a fixed 0.5 threshold", "A lower softmax temperature, so the model is more decisive", "A larger encoder trained on in-scope data only", "An explicit none class trained on real near-miss examples", "Tuning for macro-F1 on the in-scope test set"], "a": 3, "why": "Near misses score high on a wrong intent, so a threshold alone lets them through. Training a none class on them teaches the boundary directly."}, {"q": "You tighten the out-of-scope threshold and out-of-scope recall rises from 60% to 80%. What else should you expect?", "o": ["In-scope accuracy rises too, since fewer wrong intents fire", "No in-scope change, since the threshold only affects out-of-scope", "Calibration error drops to zero", "The none class needs fewer training examples", "Some in-scope queries are now rejected, so in-scope accuracy drops; report both at the chosen point"], "a": 4, "why": "A stricter bar rejects borderline in-scope turns as well. That is the trade-off CLINC150 exposed, which is why both numbers are reported together."}, {"q": "A brokerage assistant that offers no mortgages is asked 'what's your mortgage rate?'. Which handling fits?", "o": ["In-domain but unsupported: a clear policy answer or handoff, logged as backlog", "Out-of-domain: a polite redirect to small talk", "Ambiguous: ask which mortgage they mean", "Route to the nearest in-scope intent, such as account balance", "Add it to training data labelled as account balance"], "a": 0, "why": "It is a real financial question the assistant does not support, so it deserves an honest answer or a human, and the log of such requests tells the product team what to build."}], "open": {"q": "Our assistant sometimes answers questions it should not, routing them into a real flow. How do you design out-of-scope handling?", "probe": "Whether you treat 'none of the above' as a designed case, measured separately.", "a": ["A none class trained on real and near-miss negatives mined from logs", "Calibrated confidence, a threshold set for a target in-scope accuracy, and a top-two margin", "A second signal: distance to the nearest class centroid; the borderline band goes to an LLM or a person", "Different responses for out-of-domain, unsupported and ambiguous", "Measure out-of-scope recall and false-accept rate at a fixed in-scope accuracy; review rejections every week"]}, "say": ["**I'd treat out-of-scope as its own case from day one.**", "**Train it:** a none class built from real near misses in the logs.", "**Two signals:** a calibrated threshold, and distance to the nearest intent.", "**Borderline band:** anything unsure goes to an LLM or a person.", "**Measure false accepts:** at a fixed in-scope accuracy, not one blended number.", "In a bank the confident wrong answer is the expensive one."], "avoid": ["Saying overall accuracy shows out-of-scope performance: it hides it."], "was": ["q-how-do-you-handle-out-of-scope-queries", "e-out-of-scope"], "res": [{"kind": "video", "req": true, "label": "Rasa Algorithm Whiteboard: Fallback Detection", "url": "https://www.youtube.com/watch?v=VldHznqAYlE", "m": 13, "yt": {"id": "VldHznqAYlE", "ch": "Rasa"}, "why": "Fallback detection with a confidence threshold, the baseline out-of-scope detector."}, {"kind": "video", "req": false, "label": "When calibration beats metrics", "url": "https://www.youtube.com/watch?v=oOZr4kRJgFE", "m": 13, "yt": {"id": "oOZr4kRJgFE", "ch": "Probabl"}, "why": "Why calibration decides how well a rejection threshold works."}, {"kind": "video", "req": false, "label": "Chatbots at Nestle: improving performance on intent detection", "url": "https://www.youtube.com/watch?v=VZI-ikj0RoQ", "m": 32, "why": "A production talk on intent detection failures and fixes in a large-company bot; skim for the out-of-scope handling.", "yt": {"id": "VZI-ikj0RoQ", "ch": "AI Council"}}, {"kind": "read", "req": true, "label": "Larson et al.: An evaluation dataset for intent classification and out-of-scope prediction", "url": "https://aclanthology.org/D19-1131.pdf", "m": 15, "why": "Sections 2 to 4: how CLINC150 builds out-of-scope queries and what the baselines score."}, {"kind": "read", "req": true, "label": "Microsoft Learn: CLU None intent", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/none-intent", "m": 8, "why": "How the None intent and its threshold interact."}, {"kind": "read", "req": false, "label": "Google Cloud: Dialogflow CX state handlers, no-match events", "url": "https://cloud.google.com/dialogflow/cx/docs/concept/handler", "m": 10, "why": "The no-match event and how a flow handles an unmatched utterance."}]}, {"id": "classify-data", "title": "Metrics, imbalance, labels and the production gap", "brief": "Accuracy lies under imbalance, so start with macro-F1 and per-intent recall, then apply the cheapest fixes in order: class weights, resampling of the training set only, per-class thresholds, focal loss. The nuance: the labels and the test set are usually the bottleneck, not the model, and a 92% test score that fails in production is mostly shift, leakage, or a test set that does not look like traffic.", "points": ["Precision, recall, F1: of what I flagged, how much was right; of what was there, how much I found; F1 is their harmonic mean, so a lopsided pair scores low", "Micro against macro: micro pools every decision (and equals accuracy for single-label multi-class), so big classes dominate; macro averages per-class F1, so every intent counts; weight by business cost where you can", "Imbalance, in order: fix the metric; class weights; oversample or undersample the training set only, never validation or test; per-class thresholds tuned on validation (often the biggest win); focal loss, which down-weights easy examples", "Labels: confident learning (out-of-fold predictions that confidently disagree with the label) surfaces bad labels; confusable intents are often a taxonomy problem, to merge or split", "Test against production: distribution shift (new phrasing, new products), prior shift (a different class mix), leakage from near-duplicates across splits, and preprocessing that differs between training and serving", "The loop: label sampled production traffic, dedupe before splitting, use a time-based split, keep a frozen golden set apart from anything used for sampling or tuning, and add uncertain production turns by active learning"], "figs": ["confusionMatrix", "errorLoop"], "production": ["Label errors in BANKING77 (ACL Insights 2022): over 1,400 of 10,003 training utterances, about 14%, flagged as possibly mislabelled; removing them raised F1 by about 4.5%", "Microsoft's CLU evaluation guidance: read the confusion matrix and merge intents that are mistaken for each other, or add distinguishing examples", "Long tail: reweighting, logit adjustment or balanced softmax, paraphrase oversampling, and few-shot methods like SetFit for tail intents; track per-intent recall", "Spend the labelling budget where it moves the boundary: low-confidence or small-margin production turns first; an LLM pre-labels and people review where it disagrees with the current model"], "mcq": [{"q": "95% of traffic is 'check balance', and a model always predicts it. What do you see across 20 intents?", "o": ["95% accuracy and 95% macro-F1", "95% accuracy and very low macro-F1", "Low accuracy and high micro-F1", "95% micro-F1 and 95% macro-F1, since they agree on single-label data", "Low accuracy and low macro-F1"], "a": 1, "why": "Accuracy rewards the majority class. Macro-F1 averages F1 over 20 intents, 19 of which score zero, so it is about 0.05.", "pair": "micro-vs-macro"}, {"q": "For single-label multi-class classification, micro-F1 equals which number?", "o": ["Macro-F1", "Support-weighted F1", "The mean of per-class recall", "Precision on the largest class", "Accuracy"], "a": 4, "why": "Each wrong prediction is one false positive and one false negative, so pooled precision, pooled recall and micro-F1 all equal accuracy. That is why micro hides rare intents.", "pair": "micro-vs-macro"}, {"q": "You oversample the rare class. Which data must keep its real distribution?", "o": ["The training set, since duplicates always overfit", "Only the rare class, undersampling the common one instead", "The validation and test sets, which must measure the world you serve", "Only the golden set; other evaluation splits can be resampled", "None, as long as the duplicates are paraphrased"], "a": 2, "why": "Resampling is a training intervention. Evaluation splits that are resampled measure a class mix that does not exist in production, and thresholds tuned on them are wrong."}, {"q": "Test accuracy is 92% but production quality is poor. What is the first thing to do?", "o": ["Label a sample of production traffic and score the model on it, per intent", "Retrain a larger model on the same data", "Raise the confidence threshold on every intent", "Train for more epochs, since it is underfitting", "Recompute macro-F1 on the existing test set"], "a": 0, "why": "You need evidence that the gap is real and where it lives. Every other option acts on the same test set that failed to predict production."}], "open": {"q": "Your intent model scores 92% on the test set, but complaints say it is poor in production. Walk me through it.", "probe": "Debugging the offline to online gap with evidence, not guesses.", "a": ["Label a few hundred production turns and score on them: is the gap real, and which intents?", "Check shift: compare training and production embeddings, and the class mix", "Check the test set: near-duplicates across splits, label noise, preprocessing that differs between training and serving", "Check the metric: accuracy can hide rare intents, so look at macro-F1 and per-intent recall", "Fix the loop: production samples into training, a time-based split, a frozen golden set, monitoring on the live mix"]}, "say": ["**Most likely the test set doesn't look like the traffic.**", "**Score real turns:** I'd label a sample of production turns and score on that first, per intent.", "**Hunt leaks:** near-duplicates between train and test, and text cleaned differently in training and serving.", "**Close the loop:** real production cases go into training and into a frozen test set.", "That's the same lesson as our replay bench at alfred_, which is built from real production turns, not ones we imagined."], "avoid": ["Resampling the test set to balance it: it then measures a world you do not serve."], "was": ["q-your-classes-are-100-to-1-imbalanced-what-do-you-try-in-orde", "q-macro-or-micro-f1-and-when-does-accuracy-lie", "q-your-model-scores-92-on-the-test-set-but-poorly-in-productio", "e-data-quality"], "res": [{"kind": "video", "req": true, "label": "Why you should care about unbalanced data", "url": "https://www.youtube.com/watch?v=JvFrJacbt6U", "m": 11, "why": "Why accuracy lies on skewed intents.", "yt": {"id": "JvFrJacbt6U", "ch": "ritvikmath"}}, {"kind": "video", "req": true, "label": "Macro vs micro for imbalanced multi-class classification", "url": "https://www.youtube.com/watch?v=9jtO4YLsH4s", "m": 17, "why": "Averaging choices on many classes, the micro-versus-macro half of the question.", "yt": {"id": "9jtO4YLsH4s", "ch": "Machine Learning Mindset"}}, {"kind": "video", "req": false, "label": "Rasa livestream: machine learning evaluation", "url": "https://www.youtube.com/watch?v=qFv9I-iSxh0", "m": 62, "why": "Evaluating an NLU model on real data; watch for confusion and mislabeled examples.", "yt": {"id": "qFv9I-iSxh0", "ch": "Rasa"}}, {"kind": "read", "req": false, "label": "ACL Insights 2022: Label errors in BANKING77", "url": "https://aclanthology.org/2022.insights-1.19/", "m": 15, "why": "Shows label errors in BANKING77, so a test-set ceiling can be wrong labels."}, {"kind": "read", "req": true, "label": "Microsoft Learn: CLU evaluation metrics", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/evaluation-metrics", "m": 10, "why": "Precision, recall, F1 and the confusion matrix for intents."}, {"kind": "read", "req": false, "label": "scikit-learn: Metrics and scoring, precision, recall and F-measures", "url": "https://scikit-learn.org/stable/modules/model_evaluation.html", "m": 15, "why": "Micro, macro and weighted definitions and when each misleads."}]}, {"id": "classify-representations", "title": "The representation ladder", "brief": "Each rung of text representation closes a gap the one below left open: bag of words and TF-IDF count terms, static embeddings put similar words close, contextual embeddings give a vector per occurrence, and sentence embeddings compare whole texts. The nuance: the lower rungs are not obsolete; TF-IDF and BM25 still win when the exact term is the signal, and embeddings are indexes for finding candidates, not records of truth.", "points": ["TF-IDF: term frequency in this document times the log of (all documents over documents containing the term); 'the' counts for nothing, a term frequent here and rare elsewhere counts a lot; blind to synonyms and word order", "BM25: the same idea with term-frequency saturation and document-length normalisation; still the lexical half of hybrid search (exact-word matching combined with meaning-based matching)", "Distributional hypothesis: words in similar contexts have similar meanings, so training a vector to predict its context puts similar words close; nobody puts the meaning in, it falls out of the objective", "word2vec, GloVe, fastText: skip-gram predicts context words from the centre word (CBOW the reverse), and negative sampling turns the vocabulary softmax into a cheap binary task; GloVe factorises global co-occurrence counts; fastText sums character n-gram vectors, so it embeds typos and unseen words", "Static against contextual: one vector per word type ('bank' has one) against one per occurrence computed from the sentence (ELMo with a bidirectional LSTM, BERT with a Transformer encoder, a network in which every token's vector is updated by mixing in the other tokens' vectors); contextual costs a forward pass, static is a lookup", "The map: rules, then statistical models on features (Naive Bayes, logistic regression, HMMs, CRFs), then neural sequence models with attention, then the Transformer (2017), BERT's pretrain then fine-tune, and LLMs; each step replaced feature engineering with learned representations"], "figs": ["reprLadder", "embed"], "production": ["TF-IDF still fits product codes, error messages and jargon, where the exact term is the signal, and it is the baseline every classifier should beat", "Rules and regexes still own narrow, high-precision cases such as account and routing number formats", "Hybrid lexical plus dense retrieval with rank fusion often beats either alone", "Generic embeddings know general similarity; a bank's idea of 'same enough' is taught by fine-tuning on positive pairs and hard negatives, deployed only if held-out retrieval improves"], "mcq": [{"q": "A query contains the error code 'E-4012', which appears in three help articles. Which representation finds them most reliably?", "o": ["A general sentence embedding, because it captures meaning", "Averaged static word2vec vectors for the query", "Mean-pooled BERT, because contextual vectors handle rare tokens", "A larger embedding dimension, which preserves exact strings", "BM25 or TF-IDF, because the exact rare term carries the signal"], "a": 4, "why": "A rare exact identifier is where lexical weighting shines and dense embeddings blur. That is the case for hybrid search."}, {"q": "Why does fastText handle the typo 'balence' when word2vec cannot?", "o": ["It builds words from character n-grams, so the typo shares most pieces with 'balance'", "It was trained on more data, including common typos", "It reads the whole sentence with a contextual encoder", "It normalises spelling before training", "It factorises a co-occurrence matrix that smooths rare words"], "a": 0, "why": "word2vec only has vectors for words seen in training. fastText composes a word from its n-grams, so unseen and misspelled words still get sensible vectors. Factorising co-occurrence is GloVe."}, {"q": "'Card' appears in 'my card was declined' and 'send a birthday card'. Which representation gives the two uses different vectors?", "o": ["word2vec skip-gram with a larger window", "GloVe, which uses global co-occurrence", "A contextual model like BERT, which computes a vector per occurrence", "TF-IDF, which weights the word by its rarity in each document", "fastText, through its character n-grams"], "a": 2, "why": "Static methods give one vector per word type, whatever the context. Contextual models compute each occurrence's vector from the surrounding sentence."}], "open": {"q": "Give me the map of text representations, and tell me when the old ones are still the right tool.", "probe": "Breadth with judgement: why each rung exists and where it still wins.", "a": ["Counts: bag of words and TF-IDF, BM25 for retrieval; cheap, interpretable, exact terms", "Static embeddings (word2vec, GloVe, fastText): similar words close, learned from predicting context; one vector per word", "Contextual (ELMo, BERT): a vector per occurrence; sentence embeddings trained to compare whole texts", "The old rungs still win on exact identifiers, jargon and small data, and as the lexical half of hybrid search", "Example: MetaRAG's TF-IDF weighted embeddings reached 82.5% precision against a 73.3% baseline"]}, "say": ["**I think of it as a ladder where each rung closes a gap the one below left open.**", "**Counts:** TF-IDF counts words, weighted by how rare they are.", "**Learned vectors:** word2vec learns that words used in similar places mean similar things, and BERT gives each word a vector from its sentence.", "**Whole texts:** sentence embeddings let you compare whole texts.", "**Old rungs still win:** when the exact word matters, like an error code, so I'd usually run hybrid search.", "In MetaRAG, TF-IDF weighted embeddings got 82.5% precision against a 73.3% baseline."], "avoid": ["Explaining exactly how MetaRAG weighted the embeddings unless you have checked the code first."], "was": ["q-give-me-the-map-of-nlp-in-two-minutes", "q-tf-idf-what-does-it-do-and-when-is-it-still-the-right-tool", "q-why-do-embeddings-work", "q-static-or-contextual-embeddings-what-s-the-difference", "h-representations"], "res": [{"kind": "video", "req": true, "label": "The Illustrated Word2vec: a gentle intro to word embeddings", "url": "https://www.youtube.com/watch?v=ISPId9Lhc1g", "m": 9, "why": "Word vectors from skip-gram, visually, with the analogy intuition.", "yt": {"id": "ISPId9Lhc1g", "ch": "Jay Alammar"}}, {"kind": "video", "req": false, "label": "Word embeddings: TF-IDF", "url": "https://www.youtube.com/watch?v=x1u5TotQ0G0", "m": 6, "why": "The sparse rung: what TF-IDF counts and why it is still a strong baseline.", "yt": {"id": "x1u5TotQ0G0", "ch": "Hex"}}, {"kind": "video", "req": false, "label": "Vectoring words (word embeddings)", "url": "https://www.youtube.com/watch?v=gQddtTdmG_8", "m": 17, "why": "The step from one-hot to dense vectors.", "yt": {"id": "gQddtTdmG_8", "ch": "Computerphile"}}, {"kind": "read", "req": true, "label": "Stanford SLP3: ch. 5 Embeddings", "url": "https://web.stanford.edu/~jurafsky/slp3/5.pdf", "m": 45, "why": "Sparse versus dense vectors, TF-IDF and word2vec, in one chapter."}, {"kind": "read", "req": false, "label": "Jay Alammar: The Illustrated BERT, ELMo and co.", "url": "https://jalammar.github.io/illustrated-bert/", "m": 25, "why": "Static versus contextual vectors, ending at BERT."}, {"kind": "read", "req": false, "label": "Hugging Face: Summary of the tokenizers", "url": "https://huggingface.co/docs/transformers/tokenizer_summary", "m": 12, "why": "How subword tokens sit between words and bytes, which feeds every representation."}]}, {"id": "classify-sentence", "title": "Sentence embeddings and similarity", "brief": "A useful sentence vector has to be trained for comparison. Mean-pooled BERT is poor because BERT learned to fill masked tokens and its vectors crowd into a narrow cone; Sentence-BERT and contrastive training (InfoNCE with in-batch and hard negatives) make cosine meaningful. The nuance: on unit-length vectors, cosine, dot product and Euclidean distance rank the same, so normalise once and use the cheapest, unless the model card says length carries meaning.", "points": ["Why not mean-pool BERT (BERT learns by hiding words and predicting them): masked-token training is not a comparison objective, and the vectors are anisotropic (packed into a narrow cone), so almost every cosine is high", "Bi-encoder against cross-encoder: Sentence-BERT encodes each text once with a siamese network, so finding the most similar pair among 10,000 sentences drops from about 65 hours with a BERT cross-encoder to about 5 seconds; the cross-encoder reads both texts together, slower but more precise, which makes it the reranker", "InfoNCE: for each query, a softmax over its similarity to one positive and many negatives, each divided by a temperature (a scalar that sharpens or flattens the softmax, often around 0.05 to 0.1); the loss is minus the log of the positive's share", "Negatives: in-batch negatives (the other examples' positives) are free, so bigger batches help; hard negatives, similar but wrong, help most; for intents, utterances from the most-confused intent", "SimCSE and Matryoshka: SimCSE uses dropout noise as the augmentation and spreads the vectors out; Matryoshka training makes the first k dimensions useful on their own, so vectors can be truncated and renormalised", "Similarity: cosine is the dot product with the lengths divided out; for unit vectors, squared Euclidean distance is 2 minus 2 times the cosine, so all three rank the same"], "figs": ["contrastive", "vectors"], "production": ["Sentence Transformers' MultipleNegativesRankingLoss is the standard in-batch-negatives loss for fine-tuning on (query, positive) pairs, optionally wrapped in MatryoshkaLoss", "Cohere Embed v3 requires an input_type (search_document, search_query, classification, clustering) and warns that classification and clustering vectors should not be mixed with retrieval ones", "Retrieve then rerank: a bi-encoder fetches the top candidates fast and a cross-encoder reorders them, which is where negation and fine detail get fixed", "Normalise at write time and use inner product in the index"], "mcq": [{"q": "Mean-pooled vanilla BERT gives a cosine near 0.85 for almost every sentence pair. Why?", "o": ["Mean pooling normalises every vector to unit length", "BERT's vocabulary is too small to separate meanings", "Cosine is the wrong metric; Euclidean distance would separate them", "Its vectors sit in a narrow cone, because it was never trained to compare sentences", "Position embeddings dominate the average"], "a": 3, "why": "Masked-token training does not shape the space for comparison, and the vectors are anisotropic. Changing the metric does not help; contrastive training does."}, {"q": "Why do larger batches usually help contrastive training with in-batch negatives?", "o": ["Gradients average over more positives, which cancels the temperature", "Each query is compared with more negatives, including harder ones, at no extra encoding cost", "Each positive pair is seen more times per epoch", "Batch normalisation statistics become exact", "The loss can skip the softmax with enough examples"], "a": 1, "why": "Every other example's positive is a negative for this query, so a batch of N gives N − 1 negatives for free. More negatives means more chances to meet hard ones."}, {"q": "Your vectors are L2-normalised. Which metric should the index use?", "o": ["Inner product, since on unit vectors it equals cosine and ranks like Euclidean distance", "Euclidean, because it is the only true distance", "Cosine, because inner product ignores direction", "Manhattan distance, because it is robust to outliers", "It depends on the length of the query"], "a": 0, "why": "For unit vectors the dot product is the cosine, and squared distance is 2 − 2cos, so the ranking is identical and the dot product is the cheapest."}, {"q": "Searching 2 million help passages per query: bi-encoder or cross-encoder?", "o": ["A cross-encoder over all passages, as it is the most accurate", "A bi-encoder only, because cross-encoders cannot score pairs", "A cross-encoder to build the index and a bi-encoder to rerank", "Neither; only TF-IDF scales to millions", "A bi-encoder to retrieve, then a cross-encoder to rerank the top few dozen"], "a": 4, "why": "Bi-encoder vectors are computed once and searched fast; a cross-encoder must run per pair, so it only sees the shortlist, where its precision pays off."}], "open": {"q": "Why can't you mean-pool BERT for sentence similarity, and how would you train embeddings that understand our banking intents?", "probe": "Depth on contrastive training and on what a hard negative is for an assistant.", "a": ["BERT learned to fill masked tokens, not to compare; its vectors crowd into a cone, so cosines are all high", "Sentence-BERT: a siamese encoder trained on pairs, each text encoded once", "Contrastive training with InfoNCE: pull the query and its positive together, push the rest of the batch away; the temperature sets how sharp", "For banking intents: positives are utterances of the same intent; hard negatives come from the intent it is most confused with", "Normalise vectors; keep the model only if held-out retrieval or kNN macro-F1 improves"]}, "say": ["**BERT was trained to fill in blanks, not to compare sentences, so a plain average of its vectors makes everything look similar.**", "**The fix:** contrastive training, which pulls a sentence and its match together and pushes the rest of the batch away.", "**For banking intents:** utterances of the same intent are the positives.", "**Hard negatives:** they come from the intent it's most often confused with.", "Then I'd keep the model only if held-out retrieval actually improves."], "avoid": ["Saying Euclidean and cosine give different rankings on normalised vectors: they do not."], "was": ["q-why-can-t-you-mean-pool-bert-for-sentence-similarity", "q-cosine-dot-product-or-euclidean-distance"], "res": [{"kind": "video", "req": true, "label": "Text embeddings and semantic search", "url": "https://www.youtube.com/watch?v=OATCgQtNX2o", "m": 4, "why": "Text embeddings and semantic search from the ground up.", "yt": {"id": "OATCgQtNX2o", "ch": "Hugging Face"}}, {"kind": "video", "req": false, "label": "Sentence Transformers explained", "url": "https://www.youtube.com/watch?v=O3xbVmpdJwU", "m": 18, "why": "Sentence Transformers: how a bi-encoder is trained and used.", "yt": {"id": "O3xbVmpdJwU", "ch": "CodeEmporium"}}, {"kind": "video", "req": false, "label": "SimCSE: simple contrastive learning of sentence embeddings (EMNLP 2021)", "url": "https://www.youtube.com/watch?v=u-OQVQSvx38", "m": 12, "why": "The authors explain dropout as augmentation and the contrastive loss.", "yt": {"id": "u-OQVQSvx38", "ch": "Princeton NLP"}}, {"kind": "read", "req": true, "label": "Reimers and Gurevych: Sentence-BERT", "url": "https://arxiv.org/abs/1908.10084", "m": 25, "why": "Sections 3 and 4: the siamese architecture and why raw BERT averages perform poorly."}, {"kind": "read", "req": true, "label": "Hugging Face: Training and finetuning embedding models with Sentence Transformers", "url": "https://huggingface.co/blog/train-sentence-transformers", "m": 20, "why": "Contrastive pairs, in-batch and hard negatives, end to end."}, {"kind": "read", "req": false, "label": "Hugging Face: Summary of the tokenizers", "url": "https://huggingface.co/docs/transformers/tokenizer_summary", "m": 12, "why": "Context on what the encoder actually sees before pooling."}]}, {"id": "classify-embed-choice", "title": "Choosing an embedding model, and where it fails", "brief": "Shortlist from MTEB, then decide on 100 to 300 of your own labelled queries, because leaderboard rank barely predicts domain results; FinMTEB found it a poor predictor for finance. The nuance: embeddings are weak on negation, numbers, IDs and domain terms, and in a bank the governance questions (where customer text goes, which model version, who validated it) often decide before accuracy does.", "points": ["MTEB: the standard benchmark (8 task types, 58 datasets and 112 languages in the original paper, larger since); filter to your task and language, check it live, and never quote ranks from memory", "Practical filters: maximum input length, dimension and storage, licence, hosting, latency, price, and whether the model needs query and document prefixes or input types", "Your own eval: 100 to 300 real query-to-answer pairs; recall@k (how often a right answer is in the top k results) and MRR (the average of 1 over the rank of the first right result) for retrieval, kNN macro-F1 for intents; small leaderboard gaps rarely survive", "Failure modes: negation ('I can't log in' sits near 'I can log in'), numbers and identifiers, domain vocabulary, short queries against long passages, silent truncation when chunking", "Mitigations, cheapest first: hybrid BM25 plus dense (keyword and meaning-based matching together), a cross-encoder reranker (reads query and passage together to reorder the top results), query rewriting, metadata filters, then domain fine-tuning with hard negatives", "Finance: FinBERT is a sentiment model (BERT further trained on financial text and tuned on Financial PhraseBank), not an intent classifier; domain-adapted embeddings do help on finance tasks"], "figs": ["hybridRetrieval", "ragPipeline"], "production": ["FinMTEB (64 finance datasets): general MTEB rank was a poor predictor of finance performance, and finance-adapted models like Fin-E5 beat their general bases", "Storage: OpenAI text-embedding-3 and Voyage models are Matryoshka-trained, so vectors can be truncated; Voyage reports int8 at 1024 dimensions within 0.31% of float at 2048 with 8 times less storage (vendor-reported); re-test your hard queries after truncating", "Governance: FINRA Regulatory Notice 24-09 says existing rules apply whether a firm builds a model or uses a third party's; SR 11-7 style model risk treats vendor models as components to inventory and validate", "Data handling: redact or tokenise account numbers and personal data before any hosted embedding call; prefer self-hosted or private deployments with no-retention terms, confirmed with security and legal"], "mcq": [{"q": "Two embedding models differ by 0.4 points on MTEB retrieval. How do you choose between them?", "o": ["Take the higher MTEB score, since it averages many datasets", "Take the one with more dimensions, as it holds more meaning", "Run both on a few hundred of your own labelled queries and compare recall@k and MRR", "Take the newer one, since models improve release over release", "Average their vectors to get the best of both"], "a": 2, "why": "A gap that small rarely survives on domain data, and FinMTEB showed general rank barely predicts finance results. Vectors from two models are not comparable, so averaging is meaningless."}, {"q": "Users write 'I did not authorise this charge' and the embedding router sends them to 'explain a charge'. Most likely cause and fix?", "o": ["The dimension is too small; double it", "Cosine should be replaced by Euclidean distance", "The embedding model's temperature is too high", "The tokenizer drops the word 'not'", "Embeddings blur negation; add a reranker or trained classifier, with hard negatives for that pair"], "a": 4, "why": "Sentences that differ by a negation sit close in embedding space. A cross-encoder or a classifier trained on that confusable pair reads the difference."}, {"q": "A colleague proposes FinBERT as the intent classifier for a brokerage assistant. What is the issue?", "o": ["FinBERT is a decoder, so it cannot classify", "FinBERT is a financial sentiment model, at best a domain-adapted backbone to fine-tune, not a ready intent model", "FinBERT only handles Chinese text", "FinBERT cannot be self-hosted", "No issue; it was trained on BANKING77 intents"], "a": 1, "why": "FinBERT is BERT further trained on financial text and fine-tuned for three-way sentiment. Its domain pretraining can help as a starting point, but the intent head and data are still yours to build."}], "open": {"q": "How would you choose an embedding model for intent routing and FAQ retrieval at a firm like Vanguard?", "probe": "A method, not a leaderboard rank, with the finance and governance constraints.", "a": ["Shortlist 3 or 4 from MTEB for the task and language", "Filter on input length, dimension, licence, hosting, latency, price, and where customer text may go", "Build 100 to 300 labelled queries from real traffic; compare recall@k, MRR and kNN macro-F1", "Test the failure cases on purpose: negation, amounts, fund names and tickers, jargon", "If weak: hybrid search and a reranker first, domain fine-tuning with hard negatives after"]}, "say": ["**I wouldn't pick an embedding model off the leaderboard.**", "**Shortlist, then test:** a few models on a few hundred real queries from our own traffic, because finance text has jargon and boilerplate the benchmarks barely test.", "**Probe the weak spots:** negation, amounts and fund names, since that's where embeddings blur.", "**Ask about data first:** where customer text is allowed to go can rule out a hosted model on its own.", "Governance often decides before accuracy does."], "avoid": ["Quoting MTEB ranks or a vendor's current best model from memory."], "was": ["q-how-do-you-choose-an-embedding-model", "q-where-do-embeddings-fail-and-how-do-you-use-them-in-an-assis", "e-embedding-model-choice", "e-finance-specifics"], "res": [{"kind": "keep", "src": "aieng", "req": true, "label": "AI Engineering from Scratch, phase 5: Embedding Models, the 2026 Deep Dive", "url": "https://aiengineeringfromscratch.com/lesson?path=phases%2F05-nlp-foundations-to-advanced%2F22-embedding-models-deep-dive", "m": 25, "why": "Which embedding model to pick and why, with the trade-offs this topic asks about."}, {"kind": "video", "req": true, "label": "Embedding model evaluation and selection guide", "url": "https://www.youtube.com/watch?v=9gkT_dfa5yA", "m": 7, "yt": {"id": "9gkT_dfa5yA", "ch": "Weaviate vector database"}, "why": "How to evaluate and choose an embedding model on your own data."}, {"kind": "video", "req": false, "label": "Evaluating Embeddings with MTEB, Massive Text Embeddings Benchmark", "url": "https://www.youtu
