the model's memory", "Disclosures: attached by the system, as Vanguard's article-summary tool generates the necessary disclosures with each summary", "Guardrails: input and output checks, managed ones such as Bedrock Guardrails (named in the Virtual Analyst write-up), and a safe canned answer plus handoff when a check fails", "Retention: each turn's message, answer, retrieved sources and versions, model and prompt version, guardrail results and handoff, kept immutably; analytics get a copy with PII scrubbed", "Human review: compliance samples conversations, and a prompt or content change goes through sign-off like code; Vanguard's Writer story names Compliance and Legal as partners in the build", "Evaluation: a golden set from real conversations scored for accuracy, groundedness, hallucination, tone and refusal behaviour, with judges calibrated against compliance reviewers' labels; the posting says no capability reaches production 'without a quantitative, repeatable evaluation baseline'"], "links": [{"label": "Baseline: RAG", "url": "BASELINE.html#/ai/rag"}, {"label": "Baseline: guardrails", "url": "BASELINE.html#/ai/guardrails"}, {"label": "Baseline: evaluation", "url": "BASELINE.html#/ai/evaluation"}, {"label": "Baseline: LLM-as-judge", "url": "BASELINE.html#/ai/llm-as-judge"}, {"label": "Vanguard prep: Vanguard and financial services", "url": "interviews/vanguard.html#/prep"}], "ans": ["Retrieve only approved, versioned content the user may see, with citations; numbers come from tools", "Disclosures added by the system, output guardrails, and a safe fallback with handoff on any failed check", "Log every turn with its sources and versions, retained immutably for supervision", "A golden set scored for groundedness, hallucination, tone and refusals; judges calibrated to compliance reviewers' labels", "Every prompt or content change is a release: sign-off, regression set, rollback"], "close": [{"k": "why", "q": "How do you calibrate an LLM judge for compliance, and why is it never the only gate?", "a": "Have compliance reviewers label a set, run the judge on it and track agreement per criterion before trusting it, and re-check when the prompt or model changes. Judges show position and verbosity bias, and a missed recommendation is a regulatory failure, so people keep sampling."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Technique: Eval suites as release gates", "why": "An evaluation suite as the release gate."}], "read": [{"label": "Vanguard posting, Head of AI/ML for Advice: evaluation baselines, permissions-aware retrieval, compliance partners", "url": "https://www.vanguardjobs.com/job/23896184/head-of-ai-ml-for-advice-wealth-and-strategic-enablement-dallas-tx/", "m": 6}, {"label": "Vanguard: Client-Ready Article Summaries, generated with the necessary disclosures", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/vanguards-new-genai-capability-for-advisors.html", "m": 4}], "figs": ["ragPipeline", "evalHarness"]}, {"t": "Agent assist versus client-facing", "m": 10, "out": "Why would you ship agent assist before a client-facing assistant, and how would you measure success for each", "d": "Agent assist puts a trained person between the model and the client, so it can ship first and show you what fails. Client-facing removes that person, which raises the bar for evaluation, guardrails and monitoring.", "pts": ["Agent assist: answers go to crew, who read and judge them before the client hears anything; Vanguard's Crew Assist answers from internal content and also speeds up onboarding", "Why first: a person catches the error, the content is internal, and the users can be trained and asked for feedback; this is reasoning, consistent with the order Vanguard shipped in", "Client-facing: each answer is a firm communication with no one in between, so it needs the no-advice boundary, authentication, retention and a stricter release gate", "Evaluation changes: for assist, accuracy and usefulness judged by crew; for clients, also refusal behaviour, advice leaks, groundedness and pass^k over repeated runs", "Risk changes: assist risks a wrong answer a crew member repeats; client-facing risks a recommendation, a hallucinated number, or account data shown to the wrong person", "Assist metrics: handle time, answer accuracy and adoption, how many crew use it and how often they accept or edit a suggestion; Vanguard reports call-handling time down and satisfaction up", "Client metrics: resolution, not containment alone, with escalation reasons, repeat contact and CSAT", "Governance: Vanguard describes systems that evaluate model performance, detect bias and drift, and monitor how crew use AI"], "links": [{"label": "Baseline, NLP: assistant metrics", "url": "BASELINE.html#/nlp/assistant-metrics"}, {"label": "Guide: enterprise virtual assistant, deep dives", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives"}, {"label": "Vanguard prep: Vanguard and financial services", "url": "interviews/vanguard.html#/prep"}], "ans": ["A crew member stands between the model and the client, so errors are caught and fed back", "Client-facing answers are firm communications with no one in between: advice boundary, authentication, retention, stricter gates", "Assist success: handle time, accuracy judged by crew, adoption and acceptance rate", "Client success: resolution and repeat contact, not containment alone, plus advice-leak and groundedness rates", "Crew edits and rejections become test cases for the client-facing version"], "close": [{"k": "short", "q": "Crew adoption of agent assist is low. What do you look at first?", "a": "Whether the answers are right and fast enough to use mid-call: sample the suggestions crew ignored or edited, check retrieval misses and latency, and ask crew directly. Low adoption usually means low trust, and trust follows accuracy."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives", "label": "Enterprise virtual assistant, deep dives", "why": "Evaluation, metrics and handoff in the enterprise design."}], "read": [{"label": "PYMNTS: how Vanguard's AI, Crew Assist included, cut call-handling time", "url": "https://www.pymnts.com/artificial-intelligence-2/2025/how-vanguard-turned-ai-ambition-into-500-million-in-value/", "m": 5}, {"label": "Vanguard careers blog: Call Center Agent Assist in full production", "url": "https://www.vanguardjobs.com/career-blog/2025/05/14/ai-engineer/", "m": 4}], "figs": ["errorLoop", "evalHarness"]}, {"t": "Your pitch for Vanguard", "m": 10, "out": "Why are you a fit for this team, given you have not worked in financial services", "d": "Map your own work to their situation in under two minutes, then name plainly what you have not done. Every number and phrase comes from your master reference.", "pts": ["alfred_ routing: 'Inbound message (SMS/web) routed through intent classification → decision layer → callable tools', for 5,000+ active users", "Five verdicts: 'every candidate action classified into five verdicts (SILENT / NOTIFY / CONFIRM / CLARIFY / REFUSE) via deterministic risk scoring, not LLM-as-judge'; the same idea as a deterministic no-advice route", "Failure scanner: 'scans real production conversations, classifies genuine failures vs. expected behavior, auto-promotes real bugs for triage'; the review loop a quality or compliance team runs by hand", "Strict IDs: the working-memory pipeline made 'a whole class of hallucination structurally impossible, not probabilistically reduced'", "MetaRAG: IEEE CAI 2026, '82.5% precision' against a 73.3% baseline, '0.925 Hit Rate@10', '25% hallucination reduction'; retrieval measured on its own", "The bridge: their worries are hallucination and advice; your work is deterministic control around an LLM, failure scanning on real conversations, and measured grounding", "Not done: you have not built on an enterprise NLU platform (Lex, Dialogflow CX, Kore.ai) and have not worked in regulated finance; say so, and say you would work inside their compliance process", "Close with a question: which assistant this role supports, and how compliance signs off prompt and content changes"], "links": [{"label": "Vanguard prep: Vanguard and financial services", "url": "interviews/vanguard.html#/prep"}, {"label": "Baseline, NLP: classic NLU and LLMs together", "url": "BASELINE.html#/nlp/nlu-llm-hybrid"}, {"label": "Baseline, NLP: error analysis", "url": "BASELINE.html#/nlp/error-analysis"}, {"label": "Guide: enterprise virtual assistant, deep dives", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives"}], "ans": ["alfred_: intent classification, a decision layer and callable tools, for 5,000+ active users", "Every action gets one of five verdicts by deterministic risk scoring, not LLM-as-judge: the shape of a no-advice route", "A production-failure scanner finds genuine failures in real conversations and promotes them to triage", "MetaRAG: 82.5% precision, 0.925 Hit Rate@10, 25% hallucination reduction, with retrieval measured on its own", "Plainly: no enterprise NLU platform and no regulated finance yet; I would learn their controls first and build inside them"], "close": [{"k": "short", "q": "They ask whether you have worked under financial regulation. What do you say?", "a": "No, not in finance. Then the bridge: I have built deterministic controls around an LLM, so the risky decisions do not depend on the model, and I know the frame here: Rule 2210 content standards, retention under Rule 4511, and Reg BI's line on recommendations, with compliance owning that line."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives", "label": "Enterprise virtual assistant, deep dives", "why": "Evaluation, metrics and handoff in the enterprise design."}], "read": [{"label": "Vanguard posting via aggregator, AI Engineer on AI Powered Experiences: the team closest to this role", "url": "https://freehire.me/jobs/ai-engineer-vanguard-dpyotss6", "m": 4}, {"label": "Vanguard research: The AI advice frontier, what investors trust and fear", "url": "https://corporate.vanguard.com/content/dam/corp/research/pdf/the_ai_advice_frontier.pdf", "m": 15}], "figs": ["errorLoop"]}], "study": [], "quiz": [{"q": "What can you say about their platform, and what must you not claim?", "a": "The postings point to AWS Bedrock, LangGraph and MCP-backed tools for the client chat assistant, and crew tools use Azure OpenAI. No source names the contact-center or NLU vendor, so ask rather than assume."}, {"q": "Does SR 11-7 govern an LLM assistant at Vanguard?", "a": "Say it carefully. SR 11-7 was replaced by SR 26-2 on 17 Apr 2026, which targets banks and says generative and agentic AI models are not in its scope. Vanguard's postings still name Model Risk Management, so the firm applies its own governance, and FINRA Notice 24-09 asks for model risk management within technology governance."}, {"q": "Why route advice-seeking by a deterministic rule rather than letting the LLM decide?", "a": "A rule behaves the same on every run, and it can be tested and shown to compliance. A model may route correctly once and not the next time, and one leaked recommendation is a firm communication the bot had no basis for."}, {"q": "How do you calibrate an LLM judge for compliance, and why is it never the only gate?", "a": "Have compliance reviewers label a set, run the judge on it and track agreement per criterion before trusting it, and re-check when the prompt or model changes. Judges show position and verbosity bias, and a missed recommendation is a regulatory failure, so people keep sampling."}, {"q": "Crew adoption of agent assist is low. What do you look at first?", "a": "Whether the answers are right and fast enough to use mid-call: sample the suggestions crew ignored or edited, check retrieval misses and latency, and ask crew directly. Low adoption usually means low trust, and trust follows accuracy."}, {"q": "They ask whether you have worked under financial regulation. What do you say?", "a": "No, not in finance. Then the bridge: I have built deterministic controls around an LLM, so the risky decisions do not depend on the model, and I know the frame here: Rule 2210 content standards, retention under Rule 4511, and Reg BI's line on recommendations, with compliance owning that line."}], "hasTrackerQuiz": false, "figs": []}], "scripts": [{"id": "intro", "title": "Tell me about yourself", "length": "about 90 seconds", "when": "The opener. Land on conversational AI and the NLP under it.", "probes": ["What does alfred_ do?", "What do you own there?", "Have you worked on a chatbot or virtual assistant?", "Which NLU platforms have you used?"], "say": ["Sure. I started out in computer science research at UIC, where I worked on applied ML and LLM systems. That gave me a pretty strong foundation in actually building and evaluating these systems, rather than just using the models.", "From there I joined WheelPrice, which was a much more startup-oriented environment. I was working across the stack and got a lot more exposure to shipping things that were actually being used by customers. It was a small engineering team, so I had to be pretty broad — backend, AI, infrastructure, and product work all kind of blended together.", "After that I joined alfred_, where I've been working as a founding LLM engineer. It's an AI assistant, and my work has become much more focused on reliability and evaluation — things like building the eval harness, production failure detection, working memory, and making sure agent changes actually improve the product rather than just looking better on a benchmark.", "The common thread through all of that has really been building AI systems in environments where you don't have a perfectly defined problem in front of you. You have to figure out what's broken, decide what to build, and then own it through production.", "And the closest part to this role is what sits in front of the agent. At alfred_ every message goes through intent classification and a decision layer before any tool runs, and a scanner reads real conversations every day to find what went wrong. So building an assistant and improving it from its transcripts is pretty much the work I already do."], "swaps": [{"when": "If they ask what alfred_ is, in a line", "line": "An AI executive assistant that works over text message and the web. It handles people's email and calendar end to end, for 5,000-plus active users."}, {"when": "If they ask which NLU platforms you've used", "line": "Honestly, not Dialogflow or Lex in production. I've built the NLU layer myself, in front of LLM agents: intent classification, a decision layer, tools. The modelling and the error analysis are the same work, and I'd pick up the platform quickly."}], "land": "Research, shipping, production assistants, and the layer in front of the agent: understanding and improving it from real conversations.", "notes": ["Paragraphs 1 to 4 are your words, unchanged from ZenML and Coframe. Only the last line is new, pointed at conversational AI.", "About ninety seconds. Stop after the last line and let them choose where to go."], "never": ["Never say you've used Dialogflow, Lex, CLU, Rasa, Kore.ai or Cognigy.", "Never mention alfred_'s funding, a crunch, or colleagues' names."]}, {"id": "why-role", "title": "Why this role?", "length": "about 60 seconds", "when": "After the intro, or when they ask why Vanguard or why conversational AI.", "probes": ["Why Vanguard?", "What do you know about our assistants?", "Why classic NLU when everyone is moving to LLMs?"], "say": ["Honestly, it's the way Vanguard is doing it. From what I read, the generative AI went to crew first, Crew Assist and agent assist in the contact center, and the client-facing side is staged: summaries for advisers in beta, then a pilot inside Digital Advisor. I think that's the right order, and it's how I'd do it.", "And the concern your CIO named, keeping the bot from veering into advice and watching for hallucinations, is pretty much the problem I work on. At alfred_ every action goes through a decision layer in code before anything runs, and a scanner reads real conversations every day to find what went wrong.", "The two areas in the role are the two halves of what I do. One is the assistant: how the conversation is designed, how intents and entities are modelled, and how you find and fix what's going wrong in production. The other is the NLP underneath: classification, embeddings, how the models work.", "So it's the work I already do, in a place where being right matters more than being first."], "swaps": [{"when": "If they ask why classic NLU at all", "line": "I think the classic layer is the part you can measure and control: a confusion matrix, a threshold, a test set. The LLM is great for the long tail and out-of-scope. Most good assistants I've read about use both, and that's how alfred_ works too."}, {"when": "If they ask what you know about the scale", "line": "From what I read, your chat already serves more than 2 million investors a month, and you're adding AI features to it. At that volume a small error rate is a lot of people, so the evaluation has to come first."}], "land": "Vanguard is doing generative AI in the right order, and keeping an assistant inside its lines is my daily work.", "notes": ["New, in your voice. Vanguard's facts come from SOURCES: say 'from what I read', and don't name a vendor for their chat; none is public.", "Say 'your CIO', not a name. If they ask why a contract role through Mphasis, that's logistics: one line, then back to the work."]}, {"id": "closest", "title": "What have you built that's closest to this?", "length": "about 2 minutes", "when": "When they ask about your experience with chatbots, virtual assistants or NLU. Outcome first, one design choice, then stop.", "probes": ["What does the intent classification do?", "How do you decide when to ask the user?", "How do you find failures?", "Was any of it on a platform like Dialogflow?"], "say": ["The closest is alfred_. It's an AI assistant for 5,000-plus active users, over text and the web. Every inbound message is routed through intent classification, then a decision layer, then callable tools. The decision layer is the part I'd point to: every candidate action is classified into one of five verdicts, silent, notify, confirm, clarify or refuse, by deterministic risk scoring, not by an LLM judging itself. So clarify and confirm aren't something the model decides to do; they're rules.", "Then error analysis. I built a production failure scanner that reads real conversations, separates genuine failures from expected behaviour, and promotes the real bugs for triage. Those become test cases in our eval harness, so every change runs against real failures before it ships.", "Before that, MockFlow-AI: a real-time voice interview platform I built from scratch, under 400 milliseconds end to end. The conversation moves through stages in a state machine, and the model can only move it by calling a transition tool. That's the nearest thing I've built to flows and pages.", "And on the NLP side, MetaRAG at UIC: TF-IDF weighted embeddings with recursive chunking got 82.5% precision against a 73.3% baseline, and 0.925 Hit Rate at 10."], "swaps": [{"when": "If they ask about WheelPrice", "line": "At WheelPrice I built an AI fitment assistant that could only answer through tools against verified data."}, {"when": "If they ask about a classic platform", "line": "Not in production. The concepts map closely: a page with a form in Dialogflow CX is a stage with required slots, and a route is a transition. I'd want a week with their taxonomy and their transcripts."}, {"when": "If they ask about voice", "line": "I own alfred_'s voice agent, phone and web. In MockFlow-AI the pipeline was Deepgram Nova-2 for speech and Silero for voice activity."}], "land": "Intent classification, a rule-based decision layer and a failure scanner in production; stages driven by tools in voice; TF-IDF weighted embeddings in research.", "notes": ["Facts from the master reference, quoted: 'intent classification → decision layer → callable tools'; five verdicts 'via deterministic risk scoring, not LLM-as-judge'; the scanner 'classifies genuine failures vs. expected behavior, auto-promotes real bugs for triage'.", "The Coframe page described the safety rule as 'no risk score; a code floor confirms every send and irreversible delete'. Check which matches today's code before you say 'risk scoring' on Friday.", "The fitment line is worded as on the Coframe page; there is no more detail in your master reference, so don't add any."], "never": ["Don't call alfred_'s classifier 'Dialogflow-like' or name a platform you haven't used."]}, {"id": "logistics", "title": "Logistics they may ask", "length": "a line each", "when": "Your answers are in chat, not on this page. Vanguard's team rarely asks; Mphasis will.", "probes": ["Are you available full time?", "Where are you based? Remote or on site?", "When could you start?", "Work authorization?", "Rate?"], "say": [], "land": "Say each once, then back to the role.", "notes": ["**Rate and terms:** for Mphasis, never Vanguard's team. Your number is in chat.", "**Location, start date, work authorization:** your answers from chat, one sentence each.", "**Duration:** ask Mphasis afterwards; similar postings run 6 to 12 months."], "never": ["Don't negotiate with Vanguard's team."]}], "drills": [{"id": "intro", "prompt": "Tell me about yourself.", "target": "90 seconds", "seconds": 90, "ref": "#say-intro"}, {"id": "why-role", "prompt": "Why this role?", "target": "60 seconds", "seconds": 60, "ref": "#say-why-role"}, {"id": "two-intents", "prompt": "Two intents keep getting confused. What do you do?", "target": "90 seconds", "seconds": 90, "ref": "#q-two-intents"}, {"id": "attention", "prompt": "Explain attention to me.", "target": "90 seconds", "seconds": 90, "ref": "#q-attention"}], "qa": [{"group": "Vanguard and financial services", "blurb": "The advice line, authentication, compliance, evaluation and model risk, at Vanguard. Taught in wc31.", "items": [{"q": "A client asks: 'Should I sell in this downturn?' What does the assistant do?", "short": "The no-advice boundary", "tests": "Do you know where education ends and advice starts, and that the bot can't cross it?", "a": ["It doesn't answer the question as asked. 'Should I sell' is asking for a recommendation, and a recommendation needs a reasonable basis in that person's whole picture: goals, holdings, costs, alternatives. The bot doesn't have that, so it can't give one. And where exactly education ends and advice starts is compliance's call, not mine; I build the control.", "So the assistant detects the advice-seeking intent, answers with approved educational content, for example long-term investing principles, says plainly it can't advise on a specific trade, and offers a licensed person or the advice product. The whole exchange is logged for supervision.", "I'd test it with a red-team set of paraphrases, 'what would you do?', 'is it a good time to get out?', 'my neighbour sold, should I?', and track an advice-leak rate as a release gate. At alfred_ refuse is one of the five verdicts the decision layer gives, in code, so the model can't talk itself past it. Same idea here."], "land": "Detect it, educate from approved content, offer a licensed person, log it; the leak rate is a release gate.", "probes": ["How do you catch advice-seeking that's phrased indirectly?", "What if the user insists?", "Who decides what counts as advice?"], "parts": [{"title": "The response, in order", "items": ["**Detect:** an advice-seeking intent from the classifier, and a check on the final draft too.", "**Educate:** approved content only, no view on this client's trade.", "**Say the line:** plainly, once, without lecturing.", "**Offer the person:** a licensed representative, or the regulated advice product.", "**Log:** the turn, the sources and the check results, retained for supervision."]}], "notes": ["The SEC's care-obligation bulletin: a recommendation needs a reasonable basis in the client's profile, the costs and the alternatives. Vanguard's CIO named the bot 'veering into offering financial advice' as the thing to guard against (Fortune).", "Inference, say it as such: Digital Advisor is Vanguard's advice product, so it's a plausible place to send someone. Ask how they route it today."], "swaps": [{"when": "If they push: what if the user insists?", "line": "Then it's the same answer, said kindly, and the offer of a person gets more prominent. The bot never gets more willing because someone asked twice."}], "learn": {"read": [{"url": "../index.html#/w/wc31", "label": "Session wc31: Assistants at Vanguard, financial services", "why": "The advice line, authentication, compliance and evaluation, taught first."}, {"url": "../BASELINE.html#/nlp/out-of-scope", "label": "Baseline: out-of-scope", "why": "Where advice-seeking and off-topic requests go."}, {"url": "https://www.sec.gov/about/divisions-offices/division-trading-markets/broker-dealers/staff-bulletin-standards-conduct-broker-dealers-investment-advisers-care-obligations", "label": "SEC staff bulletin: care obligations", "why": "A recommendation needs a reasonable basis in the client's profile, costs and alternatives. Why a bot can't answer 'should I sell?'.", "m": 15}, {"url": "https://fortune.com/2025/12/24/vanguards-cio-niti-tandon-ai-digital-advisor/", "label": "Fortune: Vanguard's CIO on AI (Dec 2025)", "why": "A chatbot piloted with about 2,000 employees; the CIO's concerns are hallucinations and the bot veering into financial advice.", "m": 6}, {"url": "https://www.finra.org/rules-guidance/rulebooks/finra-rules/2210", "label": "FINRA Rule 2210: communications with the public", "why": "Fair and balanced; no promissory or misleading statements; no performance predictions.", "m": 15}], "figs": [], "sdLinks": []}, "id": "q-a-client-asks-should-i-sell-in-this-downturn-what-does-the-a"}, {"q": "How do you keep an LLM-based assistant from giving investment advice?", "short": "Layers against advice", "tests": "Defence in depth, not one clever prompt.", "a": ["Layers, not one prompt. First, scope: the system prompt and an intent gate that routes advice-seeking requests away from the generator before it writes anything.", "Then grounding: answers come from retrieved, approved content with citations, so the model has nothing to invent from. Then an output check before release, a classifier or an LLM judge with a strict rubric, looking for recommendations, performance predictions and promissory language. If any check fails, a safe approved response and a handoff.", "Managed guardrails help too; from what I read, Vanguard's Virtual Analyst uses Bedrock Guardrails. And a regression set of adversarial prompts runs on every change. In MetaRAG, better retrieval came with a 25% hallucination reduction, so I think of grounding as the first layer, not an add-on."], "land": "Gate the input, ground the answer, check the output, fall back safely, test adversarially.", "probes": ["Why not one good system prompt?", "What does the output check cost in latency?", "How do you know the judge is right?"], "parts": [{"title": "Four layers", "items": ["**Input:** an intent gate; advice-seeking never reaches the generator.", "**Grounding:** retrieval from approved content, with citations.", "**Output:** a classifier or a judge with a rubric for recommendations, predictions and promissory language.", "**Fallback:** an approved response and a handoff when any check fails."]}], "notes": ["FINRA Rule 2210: fair and balanced, no promissory or misleading statements, no performance predictions. Notice 24-09: the same standards apply whether a person or a tool wrote it."], "swaps": [{"when": "If they ask about latency", "line": "The input gate is a classifier, so it's cheap. The output check adds a step, and here it's worth it. On voice I'd keep the checker small and fast."}], "learn": {"read": [{"url": "../index.html#/w/wc31", "label": "Session wc31: Assistants at Vanguard, financial services", "why": "The advice line, authentication, compliance and evaluation, taught first."}, {"url": "../BASELINE.html#/nlp/out-of-scope", "label": "Baseline: out-of-scope", "why": "Where advice-seeking and off-topic requests go."}, {"url": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives", "label": "Guide: the virtual assistant's deep dives", "why": "Routing, thresholds and the hybrid at depth."}, {"url": "https://www.finra.org/rules-guidance/notices/24-09", "label": "FINRA Regulatory Notice 24-09", "why": "Rules are technology-neutral: Rule 2210 content standards apply whether a person or a tool wrote it; supervision covers model risk.", "m": 10}, {"url": "https://www.finra.org/rules-guidance/rulebooks/finra-rules/2210", "label": "FINRA Rule 2210: communications with the public", "why": "Fair and balanced; no promissory or misleading statements; no performance predictions.", "m": 15}, {"url": "https://aws.amazon.com/blogs/machine-learning/building-ai-ready-data-vanguards-virtual-analyst-journey/", "label": "AWS blog: Vanguard's Virtual Analyst (Apr 2026)", "why": "Natural-language questions to SQL on Amazon Bedrock with Guardrails; 50-plus ground-truth pairs used as few-shot examples and as the evaluation set.", "m": 10}, {"url": "https://genai.owasp.org/llm-top-10/", "label": "OWASP Top 10 for LLM applications", "why": "Prompt injection, excessive agency and the rest.", "m": 10}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-keep-an-llm-based-assistant-from-giving-investmen"}, {"q": "How do you handle authentication and personal data before the assistant touches account data?", "short": "Authentication and PII", "tests": "Security sense in a channel where a mistake is somebody's money.", "a": ["Authentication happens before the assistant sees any account data, and it happens in the channel's own flow: the logged-in app session, or on the phone voice biometrics or a step-up. The assistant gets a scoped identity, never raw credentials. It never asks for a password, a full SSN or a security code in free text. Vanguard's own security page says it never asks clients for a security code, so the bot mustn't either.", "Then minimum data: account facts come through API tools scoped to the logged-in client, and identifiers are redacted or tokenised before they reach logs or a model. Sensitive actions, like a withdrawal or a beneficiary change, get step-up authentication and an explicit confirmation.", "And I'd treat prompt injection as a threat to account actions, so write actions sit behind confirmations in code. That's how alfred_ works: a send or an irreversible delete can't happen without the person confirming, whatever the model thinks."], "land": "Authenticate in the channel, scope the tools, redact before logs and models, confirm writes in code.", "probes": ["What if a caller fails voice ID?", "Where does redaction happen?", "Can the model see the account number?"], "parts": [{"title": "The rules", "items": ["Never ask for a password, a full SSN or a security code in the conversation.", "Identity comes from the channel; the bot receives a scoped token.", "Account facts from systems of record through tools, never from the model's memory.", "Redact or tokenise identifiers before logs and model calls.", "Step-up and explicit confirmation for sensitive actions."]}], "notes": ["Vanguard's security page: Voice ID using over 100 characteristics that can detect synthetic voices, passkeys, security codes as required MFA."], "learn": {"read": [{"url": "../index.html#/w/wc31", "label": "Session wc31: Assistants at Vanguard, financial services", "why": "The advice line, authentication, compliance and evaluation, taught first."}, {"url": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives", "label": "Guide: the virtual assistant's deep dives", "why": "Routing, thresholds and the hybrid at depth."}, {"url": "https://investor.vanguard.com/trust-security", "label": "Vanguard: trust and security", "why": "Voice ID, passkeys, security codes; Vanguard never asks for login details, an SSN or a security code.", "m": 4}, {"url": "https://genai.owasp.org/llm-top-10/", "label": "OWASP Top 10 for LLM applications", "why": "Prompt injection, excessive agency and the rest.", "m": 10}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-handle-authentication-and-personal-data-before-th"}, {"q": "Design an intent taxonomy for a retirement-account assistant.", "short": "A retirement-account taxonomy", "tests": "A taxonomy from real data, with the regulated edges built in.", "a": ["I'd start from the chat and call logs, not a whiteboard: cluster real utterances, then group them into two levels. Something like account servicing (balance, statements, contribution change, loan, withdrawal, rollover), plan and product information, tax forms, fraud and security, and a family that always goes to a person.", "Intents split by what the person wants to do; the variation goes into entities like account type, plan, date and amount, not into more intents. Sensitive actions, withdrawals and beneficiary changes, are their own intents with step-up authentication. And there are explicit out-of-scope, advice-seeking and chitchat intents, so 'should I...' questions have somewhere to land.", "Then the confusion matrix on a held-out set, and I merge or split until each intent has enough examples and a clear owner for the answer. Rollover against withdrawal is the pair I'd expect to fight."], "land": "From real logs, two levels, actions as intents, details as entities, advice and out-of-scope as intents of their own.", "probes": ["How many intents is too many?", "Where does 'what happened to my balance today' go?", "Who owns a new intent?"], "parts": [{"title": "An example, two levels", "items": ["**Account servicing:** balance, statements, contribution change, loan, withdrawal, rollover.", "**Plan and product information:** what the plan offers, fees, fund facts.", "**Tax forms:** which form, when it arrives.", "**Fraud and security:** a suspicious message, a locked account.", "**Always a person:** complaints, bereavement, suspected fraud.", "**Edges:** advice-seeking, out-of-scope, chitchat."]}], "notes": ["An example to reason from, not Vanguard's real taxonomy. Say 'I'd expect', not 'you have'."], "learn": {"read": [{"url": "../index.html#/w/wc31", "label": "Session wc31: Assistants at Vanguard, financial services", "why": "The advice line, authentication, compliance and evaluation, taught first."}, {"url": "../BASELINE.html#/nlp/intents-entities", "label": "Baseline: intents and entities", "why": "Actions as intents, objects as entities."}, {"url": "../BASELINE.html#/nlp/out-of-scope", "label": "Baseline: out-of-scope", "why": "Where advice-seeking and off-topic requests go."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model, step 1: The taxonomy: actions as intents, objects as entities", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}], "figs": [], "sdLinks": []}, "id": "q-design-an-intent-taxonomy-for-a-retirement-account-assistant"}, {"q": "How do you keep a generative answer compliant?", "short": "Compliant generation", "tests": "Approved content, vetted knowledge, disclosures and records: the whole chain.", "a": ["I think of it as a chain, and the model is the smallest part. The knowledge it retrieves from is vetted: approved content with a source, an owner and an effective date, so a stale document doesn't come back. Retrieval is permissions-aware, so a client or a crew member only gets what they may see.", "The wording is generated from that, with citations, and the disclosures come with it. From what I read, Vanguard's article summaries for advisers generate the necessary disclosures with each summary, which is the right pattern. Then an output check against the content rules: fair and balanced, nothing promissory, no performance predictions.", "And every turn is kept: the message, the answer, the sources and their versions, the model and prompt version, the check results. FINRA treats chatbot messages as firm communications, so you have to be able to show what was said and why. Compliance and Legal are in the build loop, not at the end."], "land": "Vetted knowledge, grounded wording with disclosures, an output check, and a record of every turn.", "probes": ["Who approves the knowledge base?", "What happens when a source document changes?", "Does every generated answer need a principal's approval?"], "parts": [{"title": "The chain", "items": ["**Knowledge:** approved, owned, dated, permissioned.", "**Retrieval:** filtered by plan type and effective date; recall at k measured on its own.", "**Generation:** from retrieved passages only, with citations and disclosures.", "**Check:** the content rules, before release.", "**Record:** every turn retained and reproducible."]}], "notes": ["Rule 2210 needs a qualified principal's approval for retail communications before use, with exceptions; how that applies to a chatbot is compliance's call. Say so rather than guess.", "Writer's story on Vanguard names Compliance, Legal and IT as partners from the start."], "learn": {"read": [{"url": "../index.html#/w/wc31", "label": "Session wc31: Assistants at Vanguard, financial services", "why": "The advice line, authentication, compliance and evaluation, taught first."}, {"url": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives", "label": "Guide: the virtual assistant's deep dives", "why": "Routing, thresholds and the hybrid at depth."}, {"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/vanguards-new-genai-capability-for-advisors.html", "label": "Vanguard: generative AI article summaries for advisers (May 2025)", "why": "Its first client-facing generative AI, in beta; it generates the disclosures that go with each summary.", "m": 4}, {"url": "https://www.investmentnews.com/regulation-and-legislation/finra-clarifies-guidelines-around-ai-chatbot-communications/253319", "label": "InvestmentNews: FINRA on AI chatbot communications (May 2024)", "why": "Chatbot messages are firm communications: supervised, held to content standards, retained.", "m": 4}, {"url": "https://www.finra.org/rules-guidance/rulebooks/finra-rules/2210", "label": "FINRA Rule 2210: communications with the public", "why": "Fair and balanced; no promissory or misleading statements; no performance predictions.", "m": 15}, {"url": "https://writer.com/blog/vanguard-customer-story/", "label": "Writer: Vanguard customer story", "why": "Compliance, Legal and IT as partners in the build from the start; 'practical, risk-minded'.", "m": 5}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-keep-a-generative-answer-compliant"}, {"q": "What do you log and keep for supervision?", "short": "Recordkeeping", "tests": "Do you build so a generated answer can be defended later?", "a": ["Every client-facing turn: the user's message, the final answer, the retrieved sources and their versions, the model and prompt version, the guardrail results and any handoff. Stored so it can't be changed, for the required period: FINRA Rule 4511 sets six years by default, in a format that meets SEA Rule 17a-4. Write-once storage is the usual way.", "That lets compliance sample conversations, reproduce a bad answer exactly, and answer a regulator. I keep it apart from the analytics copy, which has PII scrubbed. Without the record you can't defend a generated answer after the fact.", "It's the same habit as alfred_'s failure scanner: you can only find and fix what you kept. The scanner reads real production conversations, separates genuine failures from expected behaviour, and promotes the real bugs for triage."], "land": "Every turn with its sources, versions and checks, kept unchangeable for six years, apart from analytics.", "probes": ["What about the PII in the record?", "How would you reproduce a bad answer from six months ago?"], "notes": ["FINRA's 2026 report lists prompt and output logging, model version tracking and human review of results as ongoing monitoring."], "learn": {"read": [{"url": "../index.html#/w/wc31", "label": "Session wc31: Assistants at Vanguard, financial services", "why": "The advice line, authentication, compliance and evaluation, taught first."}, {"url": "https://www.finra.org/rules-guidance/rulebooks/finra-rules/4511", "label": "FINRA Rule 4511: books and records", "why": "Six years by default, in a format that meets SEA Rule 17a-4.", "m": 3}, {"url": "https://www.finra.org/rules-guidance/guidance/reports/2026-finra-annual-regulatory-oversight-report/gen-ai", "label": "FINRA 2026 oversight report: generative AI", "why": "Prompt and output logging, model version tracking, human review; agents acting beyond scope.", "m": 10}, {"url": "https://www.investmentnews.com/regulation-and-legislation/finra-clarifies-guidelines-around-ai-chatbot-communications/253319", "label": "InvestmentNews: FINRA on AI chatbot communications (May 2024)", "why": "Chatbot messages are firm communications: supervised, held to content standards, retained.", "m": 4}], "figs": [], "sdLinks": []}, "id": "q-what-do-you-log-and-keep-for-supervision"}, {"q": "Containment dropped after a market event. How do you investigate?", "short": "Containment after a market event", "tests": "Do you separate a mix shift from a real failure, and know containment isn't the goal?", "a": ["First, is it real or a measurement change? I'd segment by intent, channel and day, and compare the mix. A market event pushes traffic toward sensitive intents, balances, 'what happened', withdrawals, that were never meant to be contained. So containment can drop while the assistant is doing exactly the right thing.", "Then I read a sample of the failed conversations, look at fallback and misclassification by intent, and check for vocabulary the model hasn't seen, news phrases or fund names. Then the knowledge sources for stale answers, and the release log for anything that shipped at the same time.", "The fix might be training utterances, a content update, or a rule that deliberately sends market-volatility questions to people, which lowers containment and is the right outcome. I'd report containment and resolution quality separately so nobody optimises the wrong number. Separating real failures from expected behaviour is what the failure scanner at alfred_ does."], "land": "Mix shift first, then the transcripts, then vocabulary, content and releases; containment isn't the goal.", "probes": ["What would you show leadership instead of containment?", "How fast can you ship a routing rule?", "How do you spot new vocabulary?"], "parts": [{"title": "In order", "items": ["**Real or measured:** segment by intent, channel and day; compare the mix.", "**Read:** a sample of failed conversations.", "**NLU:** fallback and confusion by intent; new vocabulary.", "**Content:** stale answers in the knowledge sources.", "**Releases:** anything shipped in the same window.", "**Decide:** retrain, update content, or route to people on purpose."]}], "notes": ["Vanguard's 2026 letter says trained phone representatives are up nearly 20% and 85% of calls resolve in one conversation. People are part of the design, not a failure of it."], "learn": {"read": [{"url": "../index.html#/w/wc31", "label": "Session wc31: Assistants at Vanguard, financial services", "why": "The advice line, authentication, compliance and evaluation, taught first."}, {"url": "../BASELINE.html#/nlp/assistant-metrics", "label": "Baseline: assistant metrics", "why": "Containment, resolution and what each hides."}, {"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "Mining misses."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 4: KPIs that tell the truth", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}, {"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/salim-letter-to-investors-2026.html", "label": "Vanguard: letter to investors, 2026", "why": "Chat serves more than 2 million investors a month, AI features being added; an AI capability in Digital Advisor pilots later in 2026 and launches early 2027.", "m": 8}], "figs": [], "sdLinks": []}, "id": "q-containment-dropped-after-a-market-event-how-do-you-investig"}, {"q": "Agent assist for crew, or an assistant facing clients: what changes?", "short": "Crew assist or client-facing", "tests": "Do you scale the controls to who reads the answer?", "a": ["With agent assist there's a trained person between the model and the client. The crew member reads the answer, judges it and says it in their own words, so a wrong answer costs time more than trust. You can move faster, show sources and confidence, and measure handle time and how often crew use the suggestion.", "Client-facing, the model's words are the firm's words. So the bar goes up: approved content only, the advice line in code, authentication before account data, disclosures, every turn retained, and a handoff that always works. From what I read, that's the order Vanguard went in: Crew Assist and agent assist first, client-facing staged behind pilots.", "I think the crew tool is also where you learn: what crew ask, which answers they ignore, which sources they trust. That's evaluation data for the client-facing side."], "land": "A person in between lowers the stakes; client-facing, the bot's words are the firm's.", "probes": ["What would you measure for agent assist?", "Could the same retrieval serve both?", "What changes in the evaluation?"], "notes": ["Crew Assist runs on Azure OpenAI (MIT SMR); the client-facing postings name AWS Bedrock. Two stacks may sit side by side; ask, don't assume they're one."], "learn": {"read": [{"url": "../index.html#/w/wc31", "label": "Session wc31: Assistants at Vanguard, financial services", "why": "The advice line, authentication, compliance and evaluation, taught first."}, {"url": "https://sloanreview.mit.edu/article/investing-in-ai-payoffs-at-vanguard/", "label": "MIT Sloan Management Review: AI payoffs at Vanguard", "why": "Crew Assist on Azure OpenAI for contact-center crew; governance that evaluates models, detects bias and drift, and monitors use.", "m": 12}, {"url": "https://www.vanguardjobs.com/career-blog/2025/05/14/ai-engineer/", "label": "Vanguard careers blog: an AI engineer's work (May 2025)", "why": "Call Center Agent Assist in full production: generative AI for client service representatives.", "m": 5}, {"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/salim-letter-to-investors-2026.html", "label": "Vanguard: letter to investors, 2026", "why": "Chat serves more than 2 million investors a month, AI features being added; an AI capability in Digital Advisor pilots later in 2026 and launches early 2027.", "m": 8}], "figs": [], "sdLinks": []}, "id": "q-agent-assist-for-crew-or-an-assistant-facing-clients-what-ch"}, {"q": "How do you evaluate an assistant for compliance before release?", "short": "Evaluating for compliance", "tests": "Safety categories as gates, and a judge you've checked.", "a": ["A golden set from real conversations, labelled for intent, the expected action and whether a handoff was right. Plus a red-team set built for compliance: advice-seeking paraphrases, performance-prediction bait, requests for account data before authentication, prompt injections.", "Scored on accuracy and groundedness, but the compliance categories are gates, not averages: advice-leak rate, unsupported claims, missing disclosures, refusing when it should answer and answering when it should refuse. An LLM judge with a strict rubric does the volume, calibrated against compliance reviewers' labels on a sample. A release can't make any safety category worse.", "From what I read, Vanguard's posting for its head of AI for advice says nothing generative reaches production without a quantitative, repeatable evaluation baseline and drift monitoring. That's how I work at alfred_: real failures from the scanner become test cases in the eval harness, and every change runs against them before it ships."], "land": "A golden set plus a compliance red team; safety categories as gates; the judge calibrated to reviewers.", "probes": ["How many examples per category?", "How do you calibrate the judge?", "Who signs off on a release?"], "parts": [{"title": "Gates, not averages", "items": ["Advice-leak rate on the red-team set.", "Unsupported or ungrounded claims.", "Missing or wrong disclosures.", "Over-refusal and under-refusal.", "Account data before authentication: zero."]}], "notes": ["MT-bench: strong judges agree with humans over 80% of the time, with position and verbosity biases. Calibrate on your own labels."], "learn": {"read": [{"url": "../index.html#/w/wc31", "label": "Session wc31: Assistants at Vanguard, financial services", "why": "The advice line, authentication, compliance and evaluation, taught first."}, {"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "Failure taxonomy and testing."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 3: Testing: golden conversations, simulation, judges", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}, {"url": "https://www.vanguardjobs.com/job/23896184/head-of-ai-ml-for-advice-wealth-and-strategic-enablement-dallas-tx/", "label": "Vanguard posting: Head of AI/ML for Advice, Wealth and Strategic Enablement", "why": "Evaluation baselines before production, human-in-the-loop, deterministic fallbacks, escalation to a human advisor, Model Risk Management.", "m": 8}, {"url": "https://arxiv.org/abs/2306.05685", "label": "Judging LLM-as-a-judge (MT-bench)", "why": "Over 80% agreement with humans, and the biases.", "m": 30}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-evaluate-an-assistant-for-compliance-before-relea"}, {"q": "How does model risk management apply to an LLM assistant?", "short": "Model risk", "tests": "Do you know the governance frame, and where it has changed?", "a": ["The ideas carry over even where the letter doesn't: an inventory of what's deployed, validation of whether it's conceptually sound, ongoing monitoring, outcomes analysis, and effective challenge from someone independent. For an LLM assistant that means the model, the prompt, the retrieval and the tools are versioned, validated and monitored together.", "One thing worth knowing: SR 11-7 was superseded on 17 April 2026 by SR 26-2, and a footnote puts generative and agentic AI outside its scope and tells institutions to apply their own governance. It's written for banks, and Vanguard isn't one, but from what I read Vanguard's postings still name Model Risk Management and responsible AI governance, so I'd expect an internal framework that plays that role.", "In practice I'd bring a versioned record of every model and prompt change with its evaluation results, drift monitoring, a rollback path, and oversight of the vendor models, since the foundation models come from outside."], "land": "Inventory, validation, monitoring and challenge, applied to model, prompt, retrieval and tools together.", "probes": ["Is a prompt change a model change?", "How do you validate a vendor's model?", "What would you show a validator?"], "notes": ["SR 26-2 is from the Federal Reserve's own PDF, footnote 3. Don't say 'SR 11-7 governs our LLM'. Asking how their model risk team reviews LLM changes is a good question back.", "Crew Assist governance, per MIT SMR: systems that evaluate model performance, detect bias and drift, and monitor how crew use AI."], "learn": {"read": [{"url": "../index.html#/w/wc31", "label": "Session wc31: Assistants at Vanguard, financial services", "why": "The advice line, authentication, compliance and evaluation, taught first."}, {"url": "https://www.federalreserve.gov/supervisionreg/srletters/SR2602.pdf", "label": "Federal Reserve SR 26-2: revised model risk guidance (17 Apr 2026)", "why": "Supersedes SR 11-7; keeps effective challenge, validation and monitoring; footnote 3 puts generative and agentic AI outside its scope.", "m": 20}, {"url": "https://www.finra.org/rules-guidance/notices/24-09", "label": "FINRA Regulatory Notice 24-09", "why": "Rules are technology-neutral: Rule 2210 content standards apply whether a person or a tool wrote it; supervision covers model risk.", "m": 10}, {"url": "https://www.vanguardjobs.com/job/23896184/head-of-ai-ml-for-advice-wealth-and-strategic-enablement-dallas-tx/", "label": "Vanguard posting: Head of AI/ML for Advice, Wealth and Strategic Enablement", "why": "Evaluation baselines before production, human-in-the-loop, deterministic fallbacks, escalation to a human advisor, Model Risk Management.", "m": 8}, {"url": "https://sloanreview.mit.edu/article/investing-in-ai-payoffs-at-vanguard/", "label": "MIT Sloan Management Review: AI payoffs at Vanguard", "why": "Crew Assist on Azure OpenAI for contact-center crew; governance that evaluates models, detects bias and drift, and monitors use.", "m": 12}], "figs": [], "sdLinks": []}, "id": "q-how-does-model-risk-management-apply-to-an-llm-assistant"}, {"q": "Design an assistant that answers questions about a client's own accounts and Vanguard's content.", "short": "Accounts and content", "tests": "Facts from systems of record, words from the model, and the advice path designed in.", "a": ["A gateway authenticates the session and passes a scoped identity. An orchestrator, LangGraph for example, classifies the request and picks a path: deterministic API tools for account facts, so balances and transactions come from systems of record; retrieval over approved content for 'how do I' and product questions; and a refusal-and-handoff path for advice.", "The model writes the final wording from tool results and retrieved passages, with citations, and the output and compliance checks run before release. Everything is traced, logged and versioned: prompts, tools and knowledge.", "The rule I'd hold: numbers and dates never come from the model's memory. alfred_'s working memory works that way: the model picks from real items and code attaches the real ids, which made a whole class of hallucination structurally impossible, not probabilistically reduced."], "land": "Authenticate, route, tools for facts, retrieval for content, refuse advice, check, log.", "probes": ["Where does MCP fit?", "What happens when a tool times out?", "How do you stop prompt injection reaching a tool?"], "swaps": [{"when": "If they ask about MCP", "line": "It gives the account and content tools one interface the agent can call. The identity scoping still has to live in the tool, not in the protocol, so a tool only ever returns the logged-in client's data."}], "notes": ["LangGraph and MCP appear in summaries of the chat-assistant team's postings, seen only in search results. Use them as examples, not as facts about their stack."], "learn": {"read": [{"url": "../index.html#/w/wc31", "label": "Session wc31: Assistants at Vanguard, financial services", "why": "The advice line, authentication, compliance and evaluation, taught first."}, {"url": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives", "label": "Guide: the virtual assistant's deep dives", "why": "Routing, thresholds and the hybrid at depth."}, {"url": "../BASELINE.html#/nlp/dialogue-state", "label": "Baseline: dialogue state", "why": "What's carried across turns, and what's fetched."}, {"url": "https://www.vanguardjobs.com/job/23810105/lead-cloud-agentic-ai-engineer-dallas-tx/", "label": "Vanguard posting: Lead Cloud and Agentic AI Engineer", "why": "Agentic AI on Amazon Bedrock, RAG and agent orchestration; evaluation and responsible AI preferred. Another team, the same stack.", "m": 5}, {"url": "https://genai.owasp.org/llm-top-10/", "label": "OWASP Top 10 for LLM applications", "why": "Prompt injection, excessive agency and the rest.", "m": 10}], "figs": [], "sdLinks": []}, "id": "q-design-an-assistant-that-answers-questions-about-a-client-s-"}, {"q": "Why Vanguard, and what do you know about our assistants?", "short": "Why Vanguard", "tests": "Did you read about them, and does it connect to your work?", "a": ["From what I read, the generative AI went to crew first: Crew Assist on Azure OpenAI, and agent assist in full production in the contact center. Client-facing is staged: article summaries for advisers that generate their disclosures, Expert Insights piloted with advisers, and an AI capability in Digital Advisor piloting later this year. And the investor chat already serves more than 2 million people a month.", "I like that order, and I like that your CIO named the right risks: hallucination and the bot veering into advice. Those are the two things I've spent the most time on: grounding at MetaRAG, and a decision layer in code at alfred_.", "So honestly, it's the work I do, in a place that takes the hard part seriously."], "land": "Crew first, clients staged, the right risks named; that's my work.", "probes": ["Which of those would you want to work on?", "What would worry you about the Digital Advisor chat?"], "notes": ["The long form is your 'Why this role?' script on the story tab; this is the short form for 'what do you know about us'.", "Don't name a vendor for the investor chat or the phone channel; none is public."], "learn": {"read": [{"url": "../index.html#/w/wc31", "label": "Session wc31: Assistants at Vanguard, financial services", "why": "The advice line, authentication, compliance and evaluation, taught first."}, {"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/salim-letter-to-investors-2026.html", "label": "Vanguard: letter to investors, 2026", "why": "Chat serves more than 2 million investors a month, AI features being added; an AI capability in Digital Advisor pilots later in 2026 and launches early 2027.", "m": 8}, {"url": "https://fortune.com/2025/12/24/vanguards-cio-niti-tandon-ai-digital-advisor/", "label": "Fortune: Vanguard's CIO on AI (Dec 2025)", "why": "A chatbot piloted with about 2,000 employees; the CIO's concerns are hallucinations and the bot veering into financial advice.", "m": 6}, {"url": "https://sloanreview.mit.edu/article/investing-in-ai-payoffs-at-vanguard/", "label": "MIT Sloan Management Review: AI payoffs at Vanguard", "why": "Crew Assist on Azure OpenAI for contact-center crew; governance that evaluates models, detects bias and drift, and monitors use.", "m": 12}, {"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/responsibly-scaling-ai-to-better-serve-our-clients.html", "label": "Vanguard: responsibly scaling AI (May 2026)", "why": "Augment, not replace; trust and accuracy; AI diffused into the system.", "m": 5}], "figs": [], "sdLinks": []}, "id": "q-why-vanguard-and-what-do-you-know-about-our-assistants"}]}, {"group": "Conversation design", "blurb": "How the conversation itself is built: errors, confirmation, repair, handoff, voice and chat. Taught in wc28.", "items": [{"q": "How do you design the conversation for a new use case?", "short": "Designing for task completion", "tests": "Do you start from users' real tasks and the failure paths, or from a happy-path script?", "a": ["I start from the tasks people actually bring, ranked by volume and by the cost of getting them wrong, from logs if there are any. For the top ones I write sample dialogs and read them out loud, because a prompt that reads fine often sounds wrong spoken.", "Then I write the failure paths before building anything: what happens on no-match, on silence, on a backend error, when the user changes their mind, when they want a person. Pretty much every bad assistant I've seen had a good happy path and nothing else.", "A couple of rules I'd hold to: accept over-answering, so someone who gives the date and the city at once skips both questions, and ask for information in the order people naturally know it. In MockFlow-AI the conversation runs in stages, and I designed each stage's way out before its way in."], "land": "Top tasks from real logs, sample dialogs out loud, then every failure path before building.", "probes": ["How do you decide what's in scope for version one?", "What's a persona for, in an enterprise bot?", "How long should a voice menu be?"], "parts": [{"title": "The failure paths to write first", "items": ["**No-match:** the input wasn't understood.", "**No-input:** silence on voice, nothing typed on chat.", "**System error:** a webhook times out, a backend says no.", "**Correction:** the user changes an earlier answer.", "**Digression:** a side question, then back to the task.", "**Handoff:** the user asks for a person, or the bot should give up.", "**Out of scope:** something the assistant doesn't do, said kindly with a way out."]}, {"title": "Rules of thumb", "items": ["Highest-volume intents at the top level; no voice menu longer than 3 to 5 options.", "Accept over-answering: Dialogflow CX prefills form parameters from the matched intent, and Rasa's collect steps can skip a question already answered.", "Persona: Google's recipe is four to six traits, an archetype and a one-paragraph description. In an enterprise bot it's mostly a style guide for the copy and the prompt, and it settles whether the bot says 'I' and what it says when asked 'are you a bot?'"]}], "notes": ["Rasa's conversation-driven development is the same loop after launch: review real conversations, tag them, fix in batches."], "swaps": [{"when": "If they ask about personas", "line": "I'd keep it short: a handful of traits and a paragraph, used as the style guide for every prompt and line of copy. The point isn't to pass as human; it's that the assistant sounds like one consistent, helpful person."}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/conversation-design", "label": "Baseline: conversation design", "why": "The topic, with links to the rest of the field."}, {"url": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant", "label": "Guide: enterprise virtual assistant", "why": "The whole assistant in six steps."}, {"url": "../index.html#/w/wc28", "label": "Session wc28: Conversation design, step 6: Design one task end to end, aloud", "why": "Errors, confirmation, repair, handoff, voice and chat."}, {"url": "https://developers.google.com/assistant/conversation-design/create-a-persona", "label": "Google conversation design: create a persona", "why": "Four to six traits, an archetype, a paragraph.", "m": 6}, {"url": "https://rasa.com/docs/rasa/conversation-driven-development/", "label": "Rasa: conversation-driven development", "why": "Review, tag and fix real conversations in batches.", "m": 4}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-design-the-conversation-for-a-new-use-case"}, {"q": "How do you handle no-match and no-input?", "short": "No-match and no-input", "tests": "The most common event in any assistant, handled with care.", "a": ["I count errors per state and escalate the help. The first miss gets a short rephrase, not the same prompt repeated. The second adds options or an example. After about two failures, I offer a way out: a person, another channel, or a menu. Google's and Alexa's guides say pretty much the same thing.", "For no-input I don't say 'I didn't hear you'; I rephrase and offer choices. And every message is specific to the state. A global 'Sorry, I didn't get that' is the line people quote when they complain about a bot.", "In Dialogflow CX this maps to the numbered no-match and no-input handlers on a flow, page or parameter. On alfred_'s voice agent the idle check-ins and the graceful exit are in code, not left to the model. And I review no-match by page every week, because it points at design gaps and NLU gaps."], "land": "Count per state, escalate the help, always a way out; review no-match by page.", "probes": ["What's the difference between no-match and a system error?", "When do you hand off instead of reprompting?", "How do you know your reprompts work?"], "parts": [{"title": "Three kinds of error", "items": ["**No-input:** silence. A first-class event on voice.", "**No-match:** heard, not understood.", "**System error:** understood, but the backend failed. Say so, and don't make the user repeat themselves."]}], "notes": ["Don't blame the user and don't over-apologise. One short apology with the rephrase is enough.", "Measure it: no-match rate per page, and how many sessions recover after the first reprompt."], "swaps": [{"when": "If they ask for the Dialogflow CX specifics", "line": "Numbered event handlers, sys.no-match-1 to 6 and sys.no-input-1 to 6, scoped to the flow, the page or a parameter, plus reprompt handlers on form parameters for invalid input."}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/conversation-design", "label": "Baseline: conversation design", "why": "Errors and reprompts."}, {"url": "../index.html#/w/wc28", "label": "Session wc28: Conversation design, step 2: No-match and no-input: escalating help", "why": "Errors, confirmation, repair, handoff, voice and chat."}, {"url": "https://developers.google.com/assistant/conversation-design/errors", "label": "Google conversation design: errors", "why": "No-input, no-match, system error, and escalating reprompts.", "m": 10}, {"url": "https://developer.amazon.com/en-US/alexa/alexa-haus/patterns-and-components/patterns-errors", "label": "Alexa: handling errors gracefully", "why": "Repeat, explain, then suggest leaving the task.", "m": 8}, {"url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/handler", "label": "Dialogflow CX: event handlers", "why": "Numbered no-match and no-input handlers, reprompts, scopes.", "m": 6}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-handle-no-match-and-no-input"}, {"q": "Explicit or implicit confirmation: when do you use which?", "short": "Confirmation", "tests": "Judgement about risk versus friction.", "a": ["Implicit is the default: 'Booking a table for two at seven', and the user corrects if it's wrong. Explicit yes-or-no is for actions that are expensive or can't be undone: payments, deletions, sending something on someone's behalf, names and addresses.", "I think the rule is: confirm in proportion to the cost of being wrong times the chance of being wrong. So low confidence raises it too. A misheard name on a voice call gets read back even if the action is cheap.", "That's how alfred_'s decision layer works. Every candidate action gets one of five verdicts, silent, notify, confirm, clarify or refuse, by deterministic risk scoring. Confirm and clarify are rules, not something the model chooses. Over-confirming has a cost too, so I'd watch turn count and drop-off."], "land": "Cost of being wrong times chance of being wrong; implicit by default, explicit for the irreversible.", "probes": ["What does over-confirmation cost?", "How does ASR confidence change it?", "Who decides, the model or code?"], "notes": ["Lex returns transcription confidence and up to three alternative transcriptions; its docs suggest comparing close candidates (John vs Juan) against a database before asking.", "Cognigy builds the middle band into its thresholds: between reconfirmation and confidence it asks 'did you mean X?'"], "swaps": [{"when": "If they ask how alfred_ decides", "line": "Code scores the risk of the action, not the model's opinion of it. A send or a delete can't happen without the person confirming, whatever the model thinks."}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/conversation-design", "label": "Baseline: conversation design", "why": "Confirmation."}, {"url": "../index.html#/w/wc28", "label": "Session wc28: Conversation design, step 3: Confirmation: implicit, explicit, and confidence", "why": "Errors, confirmation, repair, handoff, voice and chat."}, {"url": "https://developers.google.com/assistant/conversation-design/confirmations", "label": "Google conversation design: confirmations", "why": "Implicit by default, explicit for costly actions.", "m": 6}, {"url": "https://docs.aws.amazon.com/lexv2/latest/dg/using-transcript-confidence-scores.html", "label": "Amazon Lex: transcription confidence", "why": "N-best transcripts and how to disambiguate with them.", "m": 8}], "figs": [], "sdLinks": []}, "id": "q-explicit-or-implicit-confirmation-when-do-you-use-which"}, {"q": "How do you handle ambiguity, corrections and digressions?", "short": "Repair", "tests": "What happens off the happy path, where most bots fail.", "a": ["Ambiguity first: when the top two intents are close, I ask a short closed question, 'Do you mean the card or the account?', rather than guessing. Lex's docs give the example: 0.75 against 0.72 is ambiguous, 0.95 against 0.65 isn't.", "Corrections: detect that the user is changing an earlier value, update it, and rerun only the steps that depended on it, with an implicit read-back. Digressions: answer the side question and return to where they were. Dialogflow CX does that with route groups that match anywhere; Rasa ships it as patterns.", "Rasa's list of patterns is a good checklist even if you're not on Rasa: correction, clarification, cancel, skip a question, chitchat, human handoff, internal error, repeat, silence. I'd test each as its own scenario class, because that's where happy-path bots break."], "land": "Ask when the top two are close; corrections rerun only what depended on them; test repair as its own class.", "probes": ["How close is 'close' for the top two?", "What must be remembered deterministically?", "How do you test digressions?"], "notes": ["The design question for carry-over: what must be remembered for sure (account, order id, authentication state) versus what the model may infer from the transcript. In an LLM stack carry-over is easier but harder to guarantee.", "alfred_'s working memory takes the first kind seriously: the model picks from real items and code attaches the real ids, which made 'a whole class of hallucination structurally impossible, not probabilistically reduced'."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/dialogue-state", "label": "Baseline: dialogue state", "why": "Slots carried across turns."}, {"url": "../index.html#/w/wc28", "label": "Session wc28: Conversation design, step 4: Repair: disambiguation, digressions and corrections", "why": "Errors, confirmation, repair, handoff, voice and chat."}, {"url": "https://rasa.com/docs/reference/primitives/patterns/", "label": "Rasa: conversation patterns", "why": "Correction, clarification, digression, handoff: a checklist of repair.", "m": 5}, {"url": "https://learning.rasa.com/rasa-pro/deviations-from-happypath/", "label": "Rasa: deviations from the happy path", "why": "Digressions, corrections, cancellations.", "m": 6}, {"url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/flow", "label": "Dialogflow CX: flows", "why": "Flows as topics, route groups.", "m": 4}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-handle-ambiguity-corrections-and-digressions"}, {"q": "When should the assistant hand off to a human, and how?", "short": "Handoff", "tests": "Do you design the exit, or treat it as failure?", "a": ["On an explicit request, immediately, with no more attempts. After a second failure on the same thing. For high-stakes or regulated topics. And on frustration signals. Those triggers are designed up front, not discovered.", "The how matters more than people think. Pass a short summary, the intent, identifiers, and what was already tried, so the customer doesn't repeat themselves; Twilio's guidance points out that escalation is cold unless someone designs it otherwise. Warm transfer, where the agent is briefed first, for high emotion or urgency.", "And handle the case where nobody's available: a callback or a ticket, never a dead end. I'd measure how often customers have to re-explain after transfer, because a bad handoff quietly destroys CSAT."], "land": "Designed triggers; a summary, intent, ids and what was tried; never a dead end.", "probes": ["What's in the handoff payload?", "Warm or cold?", "Does a handoff count against containment?"], "notes": ["Send an AI summary, not a 40-turn transcript; write the outcome back to the customer record."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/conversation-design", "label": "Baseline: conversation design", "why": "Handoff."}, {"url": "../index.html#/w/wc28", "label": "Session wc28: Conversation design, step 5: Handoff to a human", "why": "Errors, confirmation, repair, handoff, voice and chat."}, {"url": "https://www.twilio.com/en-us/blog/insights/ai-to-human-handoff-context", "label": "Twilio: AI to human handoff", "why": "Warm and cold transfer, the payload, summaries.", "m": 7}], "figs": [], "sdLinks": []}, "id": "q-when-should-the-assistant-hand-off-to-a-human-and-how"}, {"q": "What do you design differently for voice and for chat?", "short": "Voice and chat", "tests": "Channel sense, from someone who's built voice.", "a": ["Voice has no scanning. So prompts are short with the question last, lists stay at three or fewer, silence and barge-in are first-class events, and ASR errors dominate failure. I'd use N-best transcripts and confirm low-confidence values, and take sensitive digits by DTMF or spelling.", "Chat can use buttons and longer answers, and people can scroll back, but they type fragments and misspellings and expect quick replies. Messaging like SMS adds opt-in rules and no custom UI at all, which is alfred_'s main channel.", "On voice I've built both sides: alfred_'s voice agent on phone and web, and MockFlow-AI, with Deepgram Nova-2 for speech and Silero for voice activity, under 400 milliseconds end to end. The thing I'd carry over is tuning thresholds and test sets per channel. Voice utterances aren't chat test data."], "land": "Voice: short, question last, silence and ASR first-class. Chat: rich, fragmentary, fast. Separate tests per channel.", "probes": ["How would you reduce ASR-driven errors?", "Why not reuse chat utterances for voice?", "What about accessibility?"], "parts": [{"title": "ASR errors, in order", "items": ["Separate ASR errors from NLU errors first: word error rate and slot error rate on real audio.", "Phrase hints or speech adaptation for domain words; constrained grammars for known-set slots.", "N-best transcripts checked against the database; DTMF or spelling for IDs.", "Re-measure on real audio, never on typed text."]}], "notes": ["Accessibility: generous timeouts and 'repeat' or 'slower' on voice; screen-reader friendly chat, plain language, nothing carried only by colour or emoji, an easy path to a person."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/conversation-design", "label": "Baseline: conversation design", "why": "Voice and chat."}, {"url": "../BASELINE.html#/audio/voice-agent-pipeline", "label": "Baseline: the voice agent pipeline", "why": "Where ASR, the model and TTS sit."}, {"url": "commure.html#/prep/q-what-s-hard-about-latency-in-a-voice-agent", "label": "Commure page: latency in a voice agent", "why": "Your voice latency answer, already written."}, {"url": "../index.html#/w/wc28", "label": "Session wc28: Conversation design, step 1: Persona, and prompts for voice and for chat", "why": "Errors, confirmation, repair, handoff, voice and chat."}, {"url": "https://docs.aws.amazon.com/lexv2/latest/dg/using-transcript-confidence-scores.html", "label": "Amazon Lex: transcription confidence", "why": "N-best transcripts and how to disambiguate with them.", "m": 8}], "figs": [], "sdLinks": []}, "id": "q-what-do-you-design-differently-for-voice-and-for-chat"}, {"q": "Flows or a generative agent: how do you decide?", "short": "Flows or generative", "tests": "Where you put determinism, and why.", "a": ["By risk and determinism. Authentication, payments and anything with regulatory consequences stay deterministic: flows, authored topics. Open-ended help and FAQs go to a generative layer with retrieval. In between, a generative layer with approval checkpoints.", "Google and Microsoft both describe that layering. Dialogflow CX keeps flows for deterministic work like authentication or payment and uses playbooks for open-ended conversation; Copilot Studio keeps a deterministic layer for irreversible actions. Rasa's CALM goes further: the LLM only translates what the user said into commands, and the business logic stays in flows.", "I'd start deterministic on the money paths and widen the generative scope only as the evaluation data supports it. It's the same rule I use at alfred_: the model proposes, code authorises."], "land": "Money and regulation in flows, the long tail generative, widened only on evidence. The model proposes, code authorises.", "probes": ["What goes in the middle layer?", "How do you stop prompt injection reaching a tool?", "How do you migrate an existing bot?"], "notes": ["OWASP's top risks for LLM apps include prompt injection, sensitive information disclosure and excessive agency. Server-side authorisation on every tool, and an explicit confirmation turn for risky ones."], "swaps": [{"when": "If they ask how you'd migrate a classic bot", "line": "Inventory intents by volume and success rate, keep the accurate ones with strict flows, move the long tail and FAQs to retrieval or an LLM classifier, run old and new in shadow on logged traffic, compare on the golden set, then shift traffic gradually with a rollback."}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/nlu-llm-hybrid", "label": "Baseline: classic NLU and LLMs together", "why": "The hybrid at depth."}, {"url": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives", "label": "Guide: the virtual assistant's deep dives", "why": "Routing, thresholds and the hybrid at depth."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model, step 5: How the platforms differ", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}, {"url": "../index.html#/w/wc28", "label": "Session wc28: Conversation design", "why": "Errors, confirmation, repair, handoff, voice and chat."}, {"url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/playbook", "label": "Dialogflow CX: playbooks", "why": "Generative playbooks beside deterministic flows.", "m": 6}, {"url": "https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/generative-orchestration", "label": "Copilot Studio: generative orchestration", "why": "An LLM planner over topics and tools, with deterministic control layers.", "m": 12}, {"url": "https://rasa.com/docs/rasa-pro/concepts/dialogue-understanding/", "label": "Rasa: dialogue understanding", "why": "An LLM emits commands; flows keep the logic.", "m": 5}, {"url": "https://genai.owasp.org/llm-top-10/", "label": "OWASP Top 10 for LLM applications", "why": "Prompt injection, excessive agency and the rest.", "m": 10}], "figs": [], "sdLinks": []}, "id": "q-flows-or-a-generative-agent-how-do-you-decide"}]}, {"group": "Intents, entities and the NLU model", "blurb": "The taxonomy, training data, entities, thresholds and dialogue state, and where LLMs change them. Taught in wc29.", "items": [{"q": "How would you design the intent taxonomy for, say, a bank assistant?", "short": "Intent taxonomy", "tests": "Granularity, consistency and a merge-or-split rule.", "a": ["I'd start from call and chat logs and rank tasks by volume and risk, not from the product catalogue. Actions become intents: check balance, dispute a transaction, report a lost card. Products and accounts become entities. Microsoft's CLU guidance puts it well: cancel is one intent and the product is an entity, so you don't build 'cancel product X' as its own intent.",
