tency and price.", "Then the part that decides: build 100 to 300 real query-to-answer pairs from our own data and compare recall at k and MRR. Small gaps on a public leaderboard rarely survive on your own data.", "In MetaRAG the evaluation on our own queries is what found the win: TF-IDF weighted embeddings beat the plain baseline, 82.5% precision against 73.3%, with 0.925 Hit Rate at 10."], "land": "Shortlist from MTEB, check the practical limits, decide on your own labelled queries.", "probes": ["Which models would you shortlist today?", "What's MRR?", "What happens when you switch models?"], "notes": ["MTEB, in the original paper: 8 task types, 58 datasets, 112 languages; it has grown since. Check rankings live; don't quote them from memory.", "Families to name: OpenAI text-embedding-3, Cohere, Voyage, Google's Gemini embeddings; open ones like BGE, E5, GTE, Nomic, Qwen. From memory: say 'families like'.", "Switching models means re-embedding everything; vectors from two models aren't comparable."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/sentence-embeddings", "label": "Baseline: sentence embeddings", "why": "Choosing a model."}, {"url": "mphasis.html#/prep/q-what-are-embeddings-and-how-does-similarity-search-work", "label": "Mphasis page: embeddings and similarity search", "why": "Your general answer, already written."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 6: Choosing an embedding model, and how embeddings fail", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://arxiv.org/abs/2210.07316", "label": "MTEB", "why": "The benchmark: task types, datasets, languages.", "m": 25}, {"url": "https://huggingface.co/spaces/mteb/leaderboard", "label": "MTEB leaderboard", "why": "Check rankings live; don't quote them from memory."}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-choose-an-embedding-model"}, {"q": "Cosine, dot product or Euclidean distance?", "short": "Similarity", "tests": "Knowing they're often the same, and when they're not.", "a": ["Cosine is the dot product with the lengths divided out, so it ignores magnitude. On unit-normalised vectors, dot product equals cosine and gives the same ranking as Euclidean distance.", "So normalise once at write time and use the fastest, which is the dot product.", "The exception: if a model was trained with dot product and its vector length carries meaning, popularity for example, don't normalise blindly. Use the metric the model card says it was trained with."], "land": "Same ranking on normalised vectors; normalise once, use dot product; follow the model card.", "probes": ["Prove the L2 equivalence.", "When does magnitude matter?"], "notes": ["For unit vectors, squared distance is 2 minus 2 times the cosine, so ranking by one ranks by the other."], "figs": ["vectors"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/sentence-embeddings", "label": "Baseline: sentence embeddings", "why": "Similarity."}, {"url": "../CODING.html#embed", "label": "Coding page: embeddings and vector search", "why": "The code."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 4: Contextual and sentence embeddings, and contrastive training", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}], "figs": ["vectors"], "sdLinks": []}, "id": "q-cosine-dot-product-or-euclidean-distance"}, {"q": "HNSW, IVF and PQ: what are they, and when do you use each?", "short": "Vector search", "tests": "Approximate nearest neighbour search, practically.", "a": ["Flat search compares against every vector, fine up to roughly a million. HNSW is a layered proximity graph: you descend greedily from sparse top layers to the dense bottom one. Very good recall and speed, at high memory; the knobs are M, efConstruction and efSearch.", "IVF clusters the space with k-means and searches only the nearest few cells, which saves compute. PQ splits each vector into sub-vectors and stores a short code for each, 10 to 50 times less memory at some recall cost. IVF-PQ together is the billion-scale option.", "For an assistant's knowledge base, flat or HNSW is usually enough. I'd also use hybrid search, BM25 plus dense with rank fusion, which often beats dense alone; my Comments Probe project used a two-phase hybrid search."], "land": "Flat to a million, HNSW for recall and speed, IVF-PQ for billions; hybrid often beats dense alone.", "probes": ["What does efSearch trade?", "What are Matryoshka embeddings?", "How do filters interact with ANN?"], "swaps": [{"when": "If they ask about Matryoshka embeddings", "line": "The model is trained so the first k dimensions are a good embedding on their own, for several k. You can truncate to, say, 256 and renormalise to cut storage and search cost with a small quality drop, then rerank with the full vectors."}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/sentence-embeddings", "label": "Baseline: sentence embeddings", "why": "Search."}, {"url": "../BASELINE.html#/data/vector-db", "label": "Baseline: vector databases", "why": "The core topic."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/search/vector", "label": "Guide: vector search", "why": "As a design technique."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 5: Vector search: HNSW, IVF, PQ", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://github.com/facebookresearch/faiss/wiki/Faiss-indexes", "label": "FAISS: index types", "why": "Flat, IVF, HNSW, PQ.", "m": 15}, {"url": "https://arxiv.org/abs/2205.13147", "label": "Matryoshka representation learning", "why": "Truncatable embeddings.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-hnsw-ivf-and-pq-what-are-they-and-when-do-you-use-each"}, {"q": "Where do embeddings fail, and how do you use them in an assistant?", "short": "Failures and uses", "tests": "Knowing the limits, and the practical uses.", "a": ["They're weak on negation, numbers and identifiers: 'I can't log in' and 'I can log in' sit close together. They miss domain vocabulary a general model never saw. Short queries against long passages need models trained with query and document prefixes. Chunking and truncation silently drop content. And upgrading the model means re-embedding everything.", "I'd mitigate with hybrid BM25, a cross-encoder reranker, domain fine-tuning with hard negatives, and a retrieval evaluation set in CI.", "In an assistant they do three jobs: intent detection by nearest labelled example or class centroid, clustering misses to find new intents, and retrieval for the knowledge answers. MetaRAG is my retrieval example: TF-IDF weighted embeddings, 0.925 Hit Rate at 10."], "land": "Negation, numbers, IDs, domain words, truncation; hybrid, rerankers, fine-tuning; three uses in an assistant.", "probes": ["How would you fix negation?", "What does a reranker add?", "When would you fine-tune an embedding model?"], "notes": ["A cross-encoder reads the query and the passage together, so it's slower but far better at the details embeddings blur, like negation."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/sentence-embeddings", "label": "Baseline: sentence embeddings", "why": "Failure modes."}, {"url": "../BASELINE.html#/ai/hybrid-search-reranking", "label": "Baseline: hybrid search and reranking", "why": "The core topic."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/search/hybrid-rerank", "label": "Guide: hybrid search and reranking", "why": "As a design technique."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 6: Choosing an embedding model, and how embeddings fail", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}], "figs": [], "sdLinks": []}, "id": "q-where-do-embeddings-fail-and-how-do-you-use-them-in-an-assis"}]}, {"group": "LLM fundamentals and the Transformer", "blurb": "Attention and the block, encoders and decoders, the KV cache, tokens, decoding, post-training, and fine-tune versus RAG. Taught in wc27; lightly.", "items": [{"q": "Explain attention to me.", "id": "q-attention", "short": "Attention", "tests": "The mechanism in plain words, with the intuition.", "a": ["Each token's vector is projected three ways: a query, a key and a value. The query is compared, by dot product, with every token's key to get scores; a softmax turns the scores into weights; and the token's new vector is the weighted sum of the values.", "The intuition: the query is 'what am I looking for', the key is 'what I contain', the value is 'what I hand over if chosen'. So every token gathers what's relevant from the whole sequence in one parallel step, where an RNN had to pass information along step by step.", "I built one from scratch, a Transformer for English-German translation following the original paper, so this is the part I'd be happiest to draw on a whiteboard."], "land": "Query against every key, softmax into weights, weighted sum of values; all positions in one parallel step.", "probes": ["Why divide by the square root of d_k?", "What's multi-head for?", "Self-attention versus cross-attention?"], "parts": [{"title": "The formula, said out loud", "items": ["Attention(Q, K, V) = softmax(Q Kᵀ / √d_k) V.", "**Causal mask:** position i can't attend to j greater than i, so training is many next-token predictions at once.", "**Cross-attention:** queries from the decoder, keys and values from the encoder (translation, T5)."]}], "figs": ["qkvAttention"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/attention", "label": "Baseline: attention", "why": "The mechanism."}, {"url": "../BASELINE.html#/ml/transformers", "label": "Baseline: Transformers and attention (ML field)", "why": "The core topic."}, {"url": "../CODING.html#transformer", "label": "Coding page: attention and a Transformer block", "why": "The code."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 5: Attention, and the block around it", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://jalammar.github.io/illustrated-transformer/", "label": "Jay Alammar: the illustrated Transformer", "why": "Q, K, V, heads, positions, residuals.", "m": 25}, {"url": "https://www.3blue1brown.com/lessons/attention", "label": "3Blue1Brown: attention in Transformers, step by step", "why": "The picture behind Q, K and V."}, {"url": "https://magazine.sebastianraschka.com/p/understanding-and-coding-self-attention", "label": "Sebastian Raschka: coding self-attention", "why": "Self, multi-head, causal and cross-attention in code.", "m": 25}], "figs": ["qkvAttention"], "sdLinks": []}}, {"q": "Why divide the attention scores by the square root of d_k?", "short": "The √d_k", "tests": "A classic follow-up: do you know why, not only that?", "a": ["Because dot products grow with dimension. If the query and key entries have unit variance, their dot product over d_k dimensions has variance d_k.", "Large scores push the softmax into saturation, nearly one-hot, where the gradients are tiny and training stalls. Dividing by the square root of d_k brings the variance back to about one.", "So it's a variance fix to keep the softmax in the range where it can learn."], "land": "Dot-product variance grows with d_k; big scores saturate softmax and kill gradients; the root brings it back to one.", "probes": ["Why the square root and not d_k?", "What does a saturated softmax do to gradients?"], "notes": ["The square root because variance scales with d_k, so the standard deviation scales with its root."], "figs": ["attention"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/attention", "label": "Baseline: attention", "why": "Scaling."}, {"url": "../BASELINE.html#/ml/transformers", "label": "Baseline: Transformers and attention", "why": "The core topic."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 5: Attention, and the block around it", "why": "Attention, encoders and decoders, decoding, post-training."}], "figs": ["attention"], "sdLinks": []}, "id": "q-why-divide-the-attention-scores-by-the-square-root-of-d-k"}, {"q": "Why multiple heads, and how does position get in?", "short": "Heads and position", "tests": "Two standard follow-ups in one.", "a": ["Multiple heads run attention several times in parallel on smaller projections, d_k is d_model divided by the number of heads, then concatenate and project. Different heads can learn different relations, syntax, position, coreference, at the same total cost as one big head.", "Attention itself is order-blind, so position has to be injected. The original paper added fixed sine and cosine waves to the embeddings. BERT and GPT-2 learned a vector per position, capped at the training length. RoPE, the default in Llama-style models, rotates the query and key vectors by an angle that depends on position, so their dot product depends on relative distance, and it extends better to longer contexts."], "land": "Heads: several relations at the same cost. Position: sinusoidal, learned, or RoPE's rotation for relative distance.", "probes": ["Why does RoPE extend to longer context?", "What do heads actually learn?"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/attention", "label": "Baseline: attention", "why": "Heads and positions."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 5: Attention, and the block around it", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://jalammar.github.io/illustrated-transformer/", "label": "Jay Alammar: the illustrated Transformer", "why": "Q, K, V, heads, positions, residuals.", "m": 25}, {"url": "https://arxiv.org/abs/2104.09864", "label": "RoFormer (RoPE)", "why": "Rotary position embeddings.", "m": 20}], "figs": [], "sdLinks": []}, "id": "q-why-multiple-heads-and-how-does-position-get-in"}, {"q": "Walk me through one Transformer block.", "short": "The block", "tests": "The whole layer, lightly, and where the parameters are.", "a": ["Normalise, attend, add the input back; normalise, run a feed-forward network on each token, add back again. That block repeats N times.", "The residual connections, x plus the sublayer of x, keep gradients flowing through deep stacks. Layer norm normalises each token's activations. The original put the norm after the residual add, post-LN, which needs learning-rate warmup; modern LLMs put it before each sublayer, pre-LN, which trains stably without it, and many use RMSNorm.", "The feed-forward block expands to about four times the width, applies a nonlinearity and projects back. It holds about two-thirds of the parameters and is where a lot of factual knowledge is thought to live."], "land": "Norm, attend, add; norm, feed-forward, add; repeated; the FFN holds two-thirds of the parameters.", "probes": ["Pre-LN or post-LN, and why?", "Roughly how many parameters per layer?", "Why is attention O(n²)?"], "parts": [{"title": "Rough numbers", "items": ["About 12 × d_model² parameters per layer: 4 d² in attention, 8 d² in a 4× FFN.", "GPT-3: 96 layers, d_model 12,288, about 174B by that formula; published 175B.", "BERT-base: 12 layers, 768 hidden, 12 heads, about 110M (from memory).", "Training compute is about 6 × parameters × tokens; inference about 2 × parameters per token."]}, {"title": "Why O(n²), and what helps", "items": ["Every token is scored against every other, so time and memory grow with the square of the length.", "FlashAttention keeps it exact and cuts memory traffic by tiling.", "Sparse or windowed attention restricts the pattern; the KV cache avoids recomputation during generation."]}], "figs": ["transformerBlock"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/encoders-decoders", "label": "Baseline: encoders and decoders", "why": "The block in each family."}, {"url": "../CODING.html#transformer", "label": "Coding page: attention and a Transformer block", "why": "The code."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 5: Attention, and the block around it", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://arxiv.org/abs/2002.04745", "label": "On layer normalization in the Transformer", "why": "Pre-LN trains without warmup.", "m": 20}, {"url": "https://www.3blue1brown.com/lessons/mlp", "label": "3Blue1Brown: how might LLMs store facts", "why": "The feed-forward block."}], "figs": ["transformerBlock"], "sdLinks": []}, "id": "q-walk-me-through-one-transformer-block"}, {"q": "BERT versus GPT: what's the difference?", "short": "BERT and GPT", "tests": "Encoders, decoders, and which to use for what.", "a": ["BERT is an encoder trained on masked-token prediction: hide about 15% of the tokens and predict them from both sides. So it builds rich representations, good for classification, NER, embeddings and reranking, but it can't generate fluently.", "GPT is a decoder trained to predict the next token with a causal mask, so it only sees the left context and it generates naturally. T5 and BART are the third family, encoder-decoders, where the encoder reads the input and the decoder generates while attending to it: translation, summarisation.", "Instruction-tuned decoders now do classification too, by prompting, but for pure understanding at volume an encoder is still much cheaper and faster. That's the whole classic-versus-LLM trade-off in an assistant."], "land": "Encoder, both directions, understanding; decoder, left to right, generation; encoders still win on cost for classification.", "probes": ["Why can't BERT generate?", "Which would you use for intent classification?", "What's span corruption?"], "notes": ["T5's span corruption masks spans and generates the missing ones."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/encoders-decoders", "label": "Baseline: encoders and decoders", "why": "The three families."}, {"url": "mphasis.html#/prep/q-how-does-a-large-language-model-work", "label": "Mphasis page: how an LLM works", "why": "Your general answer, already written."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 2: From pretraining to an assistant", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://jalammar.github.io/illustrated-bert/", "label": "Jay Alammar: the illustrated BERT, ELMo and co.", "why": "From ELMo to BERT, masked LM, feature extraction.", "m": 25}, {"url": "https://huggingface.co/learn/llm-course/chapter1/4", "label": "Hugging Face LLM course: how do Transformers work?", "why": "Encoder, decoder, encoder-decoder.", "m": 15}, {"url": "https://web.stanford.edu/~jurafsky/slp3/9.pdf", "label": "SLP3, ch. 9: Masked Language Models", "why": "BERT and fine-tuning.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-bert-versus-gpt-what-s-the-difference"}, {"q": "What is the KV cache, and why does it matter?", "short": "KV cache", "tests": "Inference cost, from the mechanism.", "a": ["During generation, the keys and values of past tokens don't change, so you store them. Each new token computes only its own query, key and value and attends over the cache, instead of recomputing the whole sequence.", "The cache grows with layers, context length and batch size, and at long context it often dominates GPU memory. For a 7B Llama-style model, 32 layers and hidden size 4096 in fp16, that's two tensors times 32 layers times 4096 times 2 bytes, about half a megabyte per token, so 4,000 tokens is about 2 GB per sequence.", "That's why long context and high concurrency are expensive, and why grouped-query attention shares keys and values across heads to shrink it."], "land": "Store past keys and values; it grows with layers, context and batch; GQA shrinks it.", "probes": ["What's prefill versus decode?", "How does GQA work?", "Why is decode memory-bound?"], "notes": ["The half megabyte is arithmetic: 2 (K and V) × 32 layers × 4,096 × 2 bytes = 524,288 bytes per token, assuming no GQA."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/encoders-decoders", "label": "Baseline: encoders and decoders", "why": "Why decoders cache keys and values."}, {"url": "../BASELINE.html#/inference/kv-cache", "label": "Baseline: KV cache", "why": "The core topic."}, {"url": "../BASELINE.html#/inference/prefill-decode", "label": "Baseline: prefill and decode", "why": "Why decode is memory-bound."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 6: Three shapes, the cost of attention, and the KV cache", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://lilianweng.github.io/posts/2023-01-10-inference-optimization/", "label": "Lilian Weng: inference optimisation", "why": "KV cache cost, distillation, quantisation.", "m": 9}, {"url": "https://arxiv.org/abs/2305.13245", "label": "GQA: grouped-query attention", "why": "Sharing K and V across heads shrinks the cache.", "m": 15}], "figs": [], "sdLinks": []}, "id": "q-what-is-the-kv-cache-and-why-does-it-matter"}, {"q": "Why subword tokenization, and how does BPE work?", "short": "Tokenization", "tests": "Where cost and quirks begin.", "a": ["Word vocabularies explode and can't represent unseen words; characters make sequences very long. Subwords sit between: a fixed vocabulary, 30 thousand to a couple of hundred thousand, that composes any word from pieces.", "BPE starts from characters or bytes and repeatedly merges the most frequent adjacent pair; encoding replays those merges in the order they were learned. Byte-level BPE, in GPT-2 and RoBERTa, starts from the 256 bytes, so nothing is ever out of vocabulary. BERT's WordPiece is similar but picks merges by likelihood and marks continuations with '##'; SentencePiece treats spaces as characters, so it needs no language-specific pre-tokeniser.", "It matters in practice: token count drives cost and context, and tokenisation explains odd behaviour on spelling, arithmetic, IDs and other languages. In an assistant, account numbers split into odd pieces, which is one more reason to extract them with code."], "land": "Subwords: fixed vocabulary, any word; BPE merges frequent pairs; it drives cost and odd failures.", "probes": ["WordPiece versus BPE?", "Why do LLMs struggle to count letters?", "What's a unigram tokeniser?"], "figs": ["bpeMerge"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/tokenization", "label": "Baseline: tokenization", "why": "BPE, WordPiece, SentencePiece."}, {"url": "../CODING.html#bpe", "label": "Coding page: a tokenizer, byte-pair encoding", "why": "The code."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 1: Tokenization: BPE, WordPiece, SentencePiece", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://huggingface.co/learn/llm-course/chapter6/5", "label": "Hugging Face LLM course: byte-pair encoding", "why": "BPE step by step, with code.", "m": 20}, {"url": "https://web.stanford.edu/~jurafsky/slp3/2.pdf", "label": "SLP3, ch. 2: Words and Tokens", "why": "The BPE section only.", "m": 20}], "figs": ["bpeMerge"], "sdLinks": []}, "id": "q-why-subword-tokenization-and-how-does-bpe-work"}, {"q": "Temperature, top-k and top-p: what are they, and when do you use each?", "short": "Decoding", "tests": "Knowing which knob for which task.", "a": ["Temperature divides the logits before the softmax: below one sharpens the distribution, above one flattens it, and near zero it approaches greedy. Top-k samples from the k most likely tokens. Top-p, nucleus sampling, samples from the smallest set whose probabilities add up to p, so it adapts to how confident the model is.", "Greedy and beam search are deterministic. Beam is good for translation and summarisation but goes bland and repetitive on open-ended text; that's what the nucleus sampling paper was about.", "For classification, extraction and anything an assistant acts on, temperature zero or constrained decoding to a schema. Higher temperature with top-p only where variety is the point."], "land": "Temperature reshapes, top-k and top-p truncate; zero or constrained for anything the assistant acts on.", "probes": ["Why does top-p adapt better than top-k?", "Is temperature zero deterministic?", "What's constrained decoding?"], "notes": ["Temperature zero is close to deterministic but not guaranteed across providers and batches; don't promise byte-identical output."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/decoding", "label": "Baseline: decoding", "why": "Greedy, beam, sampling."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 3: Decoding, and prompt against RAG against fine-tuning", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://arxiv.org/abs/1904.09751", "label": "The curious case of neural text degeneration (top-p)", "why": "Why greedy and beam go bland, and nucleus sampling.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-temperature-top-k-and-top-p-what-are-they-and-when-do-you-us"}, {"q": "How does a pretrained model become an assistant?", "short": "Post-training", "tests": "Pretraining, SFT and preference tuning, in order.", "a": ["Pretraining on next-token prediction gives a model that continues text. Supervised instruction tuning on instruction and response pairs teaches it the format and to follow instructions; it gains behaviour more than knowledge.", "Then preference tuning. RLHF collects human rankings, trains a reward model, and optimises the policy with PPO plus a penalty for drifting from the tuned model; InstructGPT's 1.3B model was preferred over the 175B GPT-3. DPO skips the reward model and the RL loop and trains directly on preferred versus rejected pairs; it's simpler and more stable, and widely used.", "Scaling, in one line: loss falls as a power law in parameters, data and compute, and Chinchilla showed many early models were undertrained for their size."], "land": "Pretrain, then SFT for behaviour, then RLHF or DPO for preferences.", "probes": ["Why does SFT on unknown facts cause hallucination?", "DPO or RLHF?", "What's in-context learning?"], "notes": ["Weng's survey: fine-tuning on facts the model doesn't know teaches it to guess.", "In-context learning: the model adapts from examples in the prompt with no weight updates; choose examples by embedding similarity."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/llm-training", "label": "Baseline: LLM training", "why": "Pretraining to assistant."}, {"url": "../BASELINE.html#/ml/preference-tuning", "label": "Baseline: preference tuning", "why": "The core topic."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 2: From pretraining to an assistant", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://web.stanford.edu/~jurafsky/slp3/8.pdf", "label": "SLP3, ch. 8: Post-training", "why": "Instruction tuning and preference tuning.", "m": 25}, {"url": "https://arxiv.org/abs/2203.02155", "label": "InstructGPT", "why": "SFT, a reward model, PPO.", "m": 30}, {"url": "https://arxiv.org/abs/2305.18290", "label": "DPO", "why": "Preference tuning without a reward model.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-how-does-a-pretrained-model-become-an-assistant"}, {"q": "Fine-tune, LoRA, prompt or RAG: how do you choose?", "short": "Fine-tune or RAG", "tests": "Matching the method to the problem, for an assistant.", "a": ["Prompting first: fast, no training. RAG when the problem is knowledge that's private, large or changing, which in an assistant is policies, product details, help articles. Fine-tuning when the problem is behaviour, format, tone, a narrow skill, or latency and cost at scale.", "LoRA is how I'd fine-tune: freeze the base and train small low-rank matrices beside the weights, up to 10,000 times fewer trainable parameters than full fine-tuning in the paper, with no extra latency once merged, and adapters you can swap.", "The rule I use: knowledge goes in retrieval, behaviour goes in tuning, and try prompting before either. For an intent classifier specifically, a common pattern is to label with an LLM, then distil into a small encoder."], "land": "Knowledge in retrieval, behaviour in tuning, prompting first; LoRA for cheap fine-tunes.", "probes": ["How do you reduce hallucination in production?", "What's QLoRA?", "When would you fine-tune for an assistant?"], "swaps": [{"when": "If they ask about hallucination", "line": "Ground answers in retrieved evidence with citations, constrain the model to that context, use tools for facts and arithmetic, allow 'I don't know', and measure faithfulness on a regression set. At alfred_ we went further for one case: the model picks from real items and code attaches the ids, so it can't invent a thread at all."}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/nlu-llm-hybrid", "label": "Baseline: classic NLU and LLMs together", "why": "Where each fits."}, {"url": "mphasis.html#/prep/q-prompting-rag-or-fine-tuning-when-do-you-use-which", "label": "Mphasis page: prompting, RAG or fine-tuning", "why": "Your general answer, already written."}, {"url": "mphasis.html#/prep/q-how-do-you-reduce-hallucination", "label": "Mphasis page: reducing hallucination", "why": "Already written."}, {"url": "../CODING.html#lora", "label": "Coding page: LoRA", "why": "The code."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 3: Decoding, and prompt against RAG against fine-tuning", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://arxiv.org/abs/2106.09685", "label": "LoRA", "why": "Low-rank adapters on a frozen base.", "m": 20}, {"url": "https://lilianweng.github.io/posts/2024-07-07-hallucination/", "label": "Lilian Weng: extrinsic hallucinations in LLMs", "why": "Causes, detection, mitigation.", "m": 29}], "figs": [], "sdLinks": []}, "id": "q-fine-tune-lora-prompt-or-rag-how-do-you-choose"}]}, {"group": "Your work, mapped to the role", "blurb": "What you've built that matches, and the gaps said plainly.", "items": [{"q": "How does your background fit this role?", "short": "The fit", "tests": "Is it real, and are you honest about the gaps?", "a": ["Most of it maps directly. The role is building and improving virtual assistants, conversation design, intents and entities, error analysis, production improvements, on top of strong NLP. At alfred_ every message goes through intent classification and a decision layer before any tool runs, for 5,000-plus active users, and I built the scanner and eval harness that find and fix its failures from real conversations.", "What I haven't done is ship on a classic NLU platform like Dialogflow CX or Cognigy, or run a taxonomy of hundreds of intents, and I'd rather say that plainly. The modelling and the error analysis are the same work; the platform is new."], "land": "The assistant, the NLU in front of it and the error analysis: done. The classic platforms: new, said first.", "probes": ["How quickly could you ramp up on our platform?", "What's the biggest gap?"], "parts": [{"title": "Where you've done each area", "items": ["**Intent classification and routing:** alfred_'s 'intent classification → decision layer → callable tools'.", "**Clarify and confirm by rule:** five verdicts, silent, notify, confirm, clarify, refuse, by deterministic risk scoring.", "**Error analysis:** the production failure scanner; eval cases from real failures; the multi-turn rewrite signed off on them.", "**Flows and state:** MockFlow-AI's state machine, stages moved only by a tool call.", "**Voice:** alfred_'s voice agent; MockFlow-AI under 400 ms with Deepgram Nova-2 and Silero VAD.", "**Embeddings and retrieval:** MetaRAG, TF-IDF weighted embeddings, 82.5% precision vs 73.3%, 0.925 Hit@10, 25% hallucination reduction, p99 under 300 ms at 10K queries a day.", "**Transformers:** a from-scratch Transformer for English-German translation; Advanced NLP at UIC.", "**Cost:** per-user LLM cost cut about 30% with a deterministic matcher in place of per-message model calls."]}, {"title": "Not done yet: say so", "items": ["Dialogflow CX, Lex, CLU, Rasa, Kore.ai or Cognigy in production.", "An intent taxonomy in the hundreds, with a team adding to it.", "Contact-centre analytics at enterprise volume: containment and CSAT across millions of sessions."]}], "learn": {"read": [{"url": "../BASELINE.html#/nlp", "label": "Baseline: the map of NLP and conversational AI", "why": "The whole field, by cluster."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 6: Your own work, and where you have not worked", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}], "figs": [], "sdLinks": []}, "id": "q-how-does-your-background-fit-this-role"}, {"q": "Tell me about the decision layer at alfred_.", "short": "The decision layer", "tests": "Depth on your closest work.", "a": ["Every inbound message, by text or the web, is routed through intent classification, then a decision layer, then callable tools. The decision layer is where the assistant decides what to do with each candidate action.", "It classifies every candidate action into one of five verdicts: silent, notify, confirm, clarify or refuse. And it does that by deterministic risk scoring, not by asking an LLM to judge. I think that's the right split: the model is good at understanding what someone meant; whether it's safe to send an email on their behalf should be a rule you can test.", "It's the same three-band idea the platforms use for thresholds, act, confirm, fall back, applied to actions instead of intents. And because it's deterministic, every verdict can be tested and replayed."], "land": "Intent, then five verdicts by deterministic risk scoring, then tools; the model understands, rules decide.", "probes": ["What goes into the risk score?", "Why not an LLM judge?", "How do you test it?", "What happens on clarify?"], "notes": ["From the master reference: 'every candidate action classified into five verdicts (SILENT / NOTIFY / CONFIRM / CLARIFY / REFUSE) via deterministic risk scoring, not LLM-as-judge'.", "The Coframe page says 'no risk score; a code floor confirms every send and irreversible delete'. Check which matches today's code, and what goes into the score, before Friday. If you're unsure on the call, describe the verdicts and the code floor, and leave the scoring detail out."], "never": ["Don't invent the inputs to the risk score."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/nlu-llm-hybrid", "label": "Baseline: classic NLU and LLMs together", "why": "The model proposes, code decides."}, {"url": "../index.html#/w/wc28", "label": "Session wc28: Conversation design, step 3: Confirmation: implicit, explicit, and confidence", "why": "Errors, confirmation, repair, handoff, voice and chat."}], "figs": [], "sdLinks": []}, "id": "q-tell-me-about-the-decision-layer-at-alfred"}, {"q": "Tell me about the production failure scanner.", "short": "The failure scanner", "tests": "Error analysis you've actually run.", "a": ["It scans real production conversations, classifies genuine failures versus expected behaviour, and auto-promotes the real bugs for triage. The hard part is the second step: a lot of what looks like failure is the assistant correctly declining, or the user changing their mind.", "The genuine ones become cases in our eval harness, a little over a hundred so far, each running the real agent against a frozen copy of that user's world. So every change runs against what users actually hit before it ships; that's how we signed off a full rewrite of the agent.", "It's pretty much the transcript-review loop this role describes, automated: find the failures, label the cause, turn each into a test."], "land": "Real conversations, failure versus expected behaviour, real bugs promoted, each one a test case.", "probes": ["How does it tell failure from expected behaviour?", "How often does it run?", "What did it find that you didn't expect?"], "notes": ["From the master reference: 'scans real production conversations, classifies genuine failures vs. expected behavior, auto-promotes real bugs for triage'. The Coframe page says it runs daily."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "The same loop, by hand."}, {"url": "coframe.html#/prep/say-now", "label": "Coframe page: what you're working on now", "why": "The eval harness story, already written."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 6: Your own work, and where you have not worked", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}], "figs": [], "sdLinks": []}, "id": "q-tell-me-about-the-production-failure-scanner"}, {"q": "Tell me about MetaRAG.", "short": "MetaRAG", "tests": "Your NLP research, with its numbers.", "a": ["MetaRAG was a retrieval framework for enterprise knowledge at UIC, accepted at IEEE CAI 2026. The finding I'd lead with: recursive chunking with TF-IDF weighted embeddings got 82.5% precision against a 73.3% baseline, and 0.925 Hit Rate at 10.", "It ran in a production code-translation use case at about 10K queries a day with p99 latency under 300 milliseconds, and it reduced hallucination by 25%.", "The lesson that carries over to an assistant: get retrieval right before touching the generation, and let sparse signals like TF-IDF help dense embeddings on domain vocabulary."], "land": "TF-IDF weighted embeddings and recursive chunking: 82.5% vs 73.3%, 0.925 Hit@10, 25% less hallucination.", "probes": ["How did the TF-IDF weighting work?", "What's Hit Rate at 10?", "How did you measure hallucination?"], "notes": ["Metrics verbatim from the master reference: 82.5% precision vs 73.3% baseline; 0.925 Hit Rate@10; 25% hallucination reduction; 10K queries/day; p99 under 300ms.", "Check the weighting mechanism and how hallucination was measured in the paper before Friday; don't improvise either."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/bow-tfidf", "label": "Baseline: bag of words and TF-IDF", "why": "The sparse half."}, {"url": "../BASELINE.html#/ai/rag", "label": "Baseline: RAG", "why": "The core topic."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 6: Choosing an embedding model, and how embeddings fail", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}], "figs": [], "sdLinks": []}, "id": "q-tell-me-about-metarag"}, {"q": "Tell me about a time you improved an assistant from production data.", "short": "An improvement from production", "tests": "Root cause over symptom, with a result.", "a": ["Our assistant tracks what people owe others from their inbox. The model kept inventing email threads, or getting who owes whom backwards, which is the worst thing an assistant can do to trust.", "Instead of prompting harder, I changed the design: the model only picks from a list of real items and writes the sentence, and code attaches the real ids. That made a whole class of hallucination structurally impossible, not probabilistically reduced, and tests enforce it.", "Two smaller ones from the same habit: replacing per-message model calls with a deterministic matcher for email rules cut per-user LLM cost about 30%, and triggering notifications on the event instead of a timer took them from about 90 seconds to about 3."], "land": "Make the mistake impossible by design; then cost and latency from the same habit.", "probes": ["How did you find it?", "How do you know it's fixed?", "What would you do on a classic platform?"], "swaps": [{"when": "If they ask what that means on a classic platform", "line": "The same move as validating a slot against the system of record instead of trusting the extractor: the model understands, code supplies the facts."}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "Mining misses and the failure taxonomy."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 6: Your own work, and where you have not worked", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}], "figs": [], "sdLinks": []}, "id": "q-tell-me-about-a-time-you-improved-an-assistant-from-producti"}, {"q": "You haven't used our platform. How would you get productive?", "short": "Ramping up", "tests": "Honesty plus a credible plan.", "a": ["Honestly, the platform is the part I'd learn; the work underneath it I've done. In the first week I'd read the intent taxonomy and the confusion matrix, sit with a few hundred real transcripts, and map the platform's pieces onto what I know: a page with a form is a state with required slots, a route is a transition, an event handler is the no-match ladder.", "Then I'd pick one small, measurable problem, a pair of confused intents or a page with a high no-match rate, and fix it end to end through the platform's test cases and release process. That teaches the platform on real work.", "That's how I work with any new stack: I built MockFlow-AI on LiveKit from scratch, and it runs under 400 milliseconds end to end."], "land": "Learn the platform on real work: taxonomy, transcripts, one small measurable fix end to end.", "probes": ["Which platform would be hardest for you?", "What would you need from the team?"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/intents-entities", "label": "Baseline: intents and entities", "why": "Platform terms side by side."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model, step 5: How the platforms differ", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}], "figs": [], "sdLinks": []}, "id": "q-you-haven-t-used-our-platform-how-would-you-get-productive"}]}], "ask": [], "ask3": [{"id": "client", "title": "For Vanguard's team", "when": "The platform question early if nobody has said; the rest at the end.", "why": "The platform and the assistant aren't public, so the first answer reframes everything after it. The rest show you think about evaluation, compliance and failure, not only building.", "how": ["Ask the platform question in the first minutes, plainly.", "At the end, one or two; listen fully, then one follow-up on what they said."], "items": [{"to": "Vanguard's team", "q": "Which assistant does this role support: the investor chat, the phone channel, or crew-facing agent assist? And what does it run on?", "loop": "Early, if it hasn't come up.", "why": "Tells you which half of your prep to lean on, and lets you use their words."}, {"to": "Vanguard's team", "q": "Is there an intent and entity layer beside the LLM and agent layer, or are they being merged?", "loop": "With the platform question.", "why": "The two areas in the invite read like both; this settles it."}, {"to": "Vanguard's team", "q": "How do you evaluate a change before it ships, and who approves it?", "loop": "At the end, first.", "why": "Shows evaluation is how you work; their answer tells you how mature the loop is."}, {"to": "Vanguard's team", "q": "Where does compliance review sit: on each prompt and content change, or on releases?", "loop": "At the end.", "why": "The real constraint on how fast the assistant can change."}, {"to": "Vanguard's team", "q": "What would the first 90 days look like for someone in this role?", "loop": "At the end.", "why": "What they need first, and what success looks like to them."}, {"to": "Vanguard's team", "q": "What's the hardest failure the assistant has right now?", "loop": "Last, if there's time.", "why": "You want the real problem; it's also what you'd work on first."}]}, {"id": "mphasis", "title": "For Mphasis, afterwards", "when": "After the call, by message or phone.", "why": "Practical questions for Mphasis, never Vanguard's team.", "how": ["Rate and terms stay in chat; settle them with Mphasis."], "items": [{"to": "Mphasis", "q": "What's the scope of the role: which Vanguard team, which assistant, and who I'd work with day to day?", "loop": "After the call.", "why": "What you'd actually be doing."}, {"to": "Mphasis", "q": "How long is the engagement, and what are the next steps after this call?", "loop": "After the call.", "why": "Duration and process."}, {"to": "Mphasis", "q": "Rate and terms.", "loop": "With Mphasis only.", "why": "Your numbers are in chat."}]}], "traps": [], "tables": [], "admire": "", "kitaruLead": "", "figures": [], "mockHow": "Say 'run the Vanguard mock' in chat: Vanguard's engineers, scenario-led, 30 minutes.", "mocks": [], "planKicker": "Before Friday, 2 PM", "mechTitle": "", "designLink": null, "extra": "<b>Work in this order.<\/b> 1. Understand: the sessions in the tracker, <a href=\"../index.html#/w/wc25\" target=\"_blank\" rel=\"noopener\">starting with the map of NLP<\/a>, wc25 to wc30, then wc31 on Vanguard and financial services. 2. Design: the guide's <a href=\"../SYSTEM%20DESIGN.html#/designs/virtual-assistant\" target=\"_blank\" rel=\"noopener\">enterprise virtual assistant<\/a>, in six steps; it is set at a bank, close to Vanguard. 3. Refresh: Baseline's <a href=\"../BASELINE.html#/nlp\" target=\"_blank\" rel=\"noopener\">NLP and conversational AI<\/a> field, one topic at a time. 4. Say: the Prep tab, last, once every sentence is one you could explain. Your Mphasis technical round (28 September) is a light review: <a href=\"mphasis.html\" target=\"_blank\" rel=\"noopener\">its Prep tab<\/a> has the LLM fundamentals answers.", "emphasis": [], "own": null, "showUp": [["Lead with what you've built that matches.", "At alfred_ every inbound message goes through intent classification, then a decision layer, then callable tools, and every candidate action gets one of five verdicts, refuse and confirm among them, decided in code. A production failure scanner reads real conversations and separates genuine failures from expected behaviour. MetaRAG used TF-IDF weighted embeddings: 82.5% precision against a 73.3% baseline."], ["Ask about the platform early.", "Vanguard's assistant platform isn't public. In the first minutes ask which assistant the role supports (the investor chat, the phone channel, or crew-facing agent assist) and what it runs on: Vanguard's own stack on AWS, or a platform Mphasis brings. Mphasis is a Kore.ai partner, so Kore.ai is possible; that's inference, so ask, don't assume. Then use their words."], ["Hold the financial-services line.", "No investment advice: an advice-seeking question goes to a licensed person or the advice product, and compliance owns where education ends and advice starts. Authenticated before any account data, and the assistant never asks for a password, a full SSN or a security code; Vanguard's own security page says it never asks for a security code."], ["Say the platforms plainly.", "You haven't shipped on Dialogflow CX, Cognigy, Lex, CLU or Kore.ai. Say it once, then what carries over: the NLU underneath, the error analysis and the evals are the same work, and you know how each platform models intents, thresholds and fallbacks."], ["Answer a scenario with a method.", "What you'd check first, how you'd split the cause, the fix, and how you'd know it worked. 'Two intents are confused' starts at the confusion matrix and the actual utterances, not at the F1."], ["Numbers, exactly.", "5,000-plus active users at alfred_; per-user LLM cost down about 30%; notifications about 90 seconds to about 3. MetaRAG: 82.5% precision, 0.925 Hit@10, 25% hallucination reduction, p99 under 300 ms at 10K queries a day. MockFlow-AI: sub-400ms end to end. Vanguard's numbers are 'from what I read'."], ["Have the hybrid answer ready.", "A fast classifier for confident turns, an LLM for the uncertain ones and for out-of-scope, and deterministic code for anything that moves money or data. One Amazon paper measured that routing within 2% of the LLM's accuracy at half the latency."], ["Theory: the mechanism, then where you used it.", "Attention, embeddings, calibration: two sentences on how it works, one on where it showed up in your work. Then stop and let them go deeper."], ["Logistics: one line each.", "Rate, duration, location and start date: your answers are in chat. They are for Mphasis afterwards, not Vanguard's team."]], "prepLead": "Say comes last. Each area is taught first in its session, and every question here links back to that session, its Baseline topic and the reading. Then your story out loud with the timer, and two drills: two intents confused, and attention.", "storyBlurb": "Your intro, why this role, the work closest to it, and logistics.", "sources": [{"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/salim-letter-to-investors-2026.html", "label": "Vanguard: letter to investors, 2026", "why": "Chat serves more than 2 million investors a month, AI features being added; an AI capability in Digital Advisor pilots later in 2026 and launches early 2027."}, {"url": "https://fortune.com/2025/12/24/vanguards-cio-niti-tandon-ai-digital-advisor/", "label": "Fortune: Vanguard's CIO on AI (Dec 2025)", "why": "A chatbot piloted with about 2,000 employees; the CIO's concerns are hallucinations and the bot veering into financial advice."}, {"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/vanguards-new-genai-capability-for-advisors.html", "label": "Vanguard: generative AI article summaries for advisers (May 2025)", "why": "Its first client-facing generative AI, in beta; it generates the disclosures that go with each summary."}, {"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/who-we-are/pressroom/press-release-vanguard-launches-expert-insights-equipping-advisors-with-ai-powered-portfolio-analysis-expertise-04092026.html", "label": "Vanguard: Expert Insights for advisers (Apr 2026)", "why": "AI portfolio analysis, piloted with select advisers."}, {"url": "https://sloanreview.mit.edu/article/investing-in-ai-payoffs-at-vanguard/", "label": "MIT Sloan Management Review: AI payoffs at Vanguard", "why": "Crew Assist on Azure OpenAI for contact-center crew; governance that evaluates models, detects bias and drift, and monitors use."}, {"url": "https://www.vanguardjobs.com/career-blog/2025/05/14/ai-engineer/", "label": "Vanguard careers blog: an AI engineer's work (May 2025)", "why": "Call Center Agent Assist in full production: generative AI for client service representatives."}, {"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/responsibly-scaling-ai-to-better-serve-our-clients.html", "label": "Vanguard: responsibly scaling AI (May 2026)", "why": "Augment, not replace; trust and accuracy; AI diffused into the system."}, {"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/why-vanguard/sets-us-apart/client-centered-technology.html", "label": "Vanguard: client-centered technology", "why": "Enhancing phone and chat support; 85% of systems moved to the cloud in five years."}, {"url": "https://aws.amazon.com/blogs/machine-learning/building-ai-ready-data-vanguards-virtual-analyst-journey/", "label": "AWS blog: Vanguard's Virtual Analyst (Apr 2026)", "why": "Natural-language questions to SQL on Amazon Bedrock with Guardrails; 50-plus ground-truth pairs used as few-shot examples and as the evaluation set."}, {"url": "https://corporate.vanguard.com/content/dam/corp/research/pdf/the_ai_advice_frontier.pdf", "label": "Vanguard research: The AI advice frontier (Sept 2026)", "why": "About one in three investors used AI for financial guidance; most trust it little; they want human oversight and embedded disclosures."}, {"url": "https://investor.vanguard.com/trust-security", "label": "Vanguard: trust and security", "why": "Voice ID, passkeys, security codes; Vanguard never asks for login details, an SSN or a security code."}, {"url": "https://www.vanguardjobs.com/job/23810105/lead-cloud-agentic-ai-engineer-dallas-tx/", "label": "Vanguard posting: Lead Cloud and Agentic AI Engineer", "why": "Agentic AI on Amazon Bedrock, RAG and agent orchestration; evaluation and responsible AI preferred. Another team, the same stack."}, {"url": "https://www.vanguardjobs.com/job/23896184/head-of-ai-ml-for-advice-wealth-and-strategic-enablement-dallas-tx/", "label": "Vanguard posting: Head of AI/ML for Advice, Wealth and Strategic Enablement", "why": "Evaluation baselines before production, human-in-the-loop, deterministic fallbacks, escalation to a human advisor, Model Risk Management."}, {"url": "https://freehire.me/jobs/ai-engineer-vanguard-dpyotss6", "label": "Vanguard posting (aggregator): AI Engineer, AI Powered Experiences", "why": "Builds the team's conversational AI orchestration platforms and shared AI infrastructure; Python or TypeScript, AWS."}, {"url": "https://www.mphasis.com/home/mphasis-ai-partnership.html", "label": "Mphasis: AI partnerships", "why": "Mphasis calls itself Kore.ai's only distinguished Platinum Partner for conversational and generative AI. Names no client."}, {"url": "https://www.finra.org/rules-guidance/notices/24-09", "label": "FINRA Regulatory Notice 24-09", "why": "Rules are technology-neutral: Rule 2210 content standards apply whether a person or a tool wrote it; supervision covers model risk."}, {"url": "https://www.investmentnews.com/regulation-and-legislation/finra-clarifies-guidelines-around-ai-chatbot-communications/253319", "label": "InvestmentNews: FINRA on AI chatbot communications (May 2024)", "why": "Chatbot messages are firm communications: supervised, held to content standards, retained."}, {"url": "https://www.finra.org/rules-guidance/rulebooks/finra-rules/2210", "label": "FINRA Rule 2210: communications with the public", "why": "Fair and balanced; no promissory or misleading statements; no performance predictions."}, {"url": "https://www.finra.org/rules-guidance/guidance/reports/2026-finra-annual-regulatory-oversight-report/gen-ai", "label": "FINRA 2026 oversight report: generative AI", "why": "Prompt and output logging, model version tracking, human review; agents acting beyond scope."}, {"url": "https://www.finra.org/rules-guidance/rulebooks/finra-rules/4511", "label": "FINRA Rule 4511: books and records", "why": "Six years by default, in a format that meets SEA Rule 17a-4."}, {"url": "https://www.sec.gov/about/divisions-offices/division-trading-markets/broker-dealers/staff-bulletin-standards-conduct-broker-dealers-investment-advisers-care-obligations", "label": "SEC staff bulletin: care obligations", "why": "A recommendation needs a reasonable basis in the client's profile, costs and alternatives. Why a bot can't answer 'should I sell?'."}, {"url": "https://writer.com/blog/vanguard-customer-story/", "label": "Writer: Vanguard customer story", "why": "Compliance, Legal and IT as partners in the build from the start; 'practical, risk-minded'."}, {"url": "https://www.federalreserve.gov/supervisionreg/srletters/SR2602.pdf", "label": "Federal Reserve SR 26-2: revised model risk guidance (17 Apr 2026)", "why": "Supersedes SR 11-7; keeps effective challenge, validation and monitoring; footnote 3 puts generative and agentic AI outside its scope."}, {"label": "Similar posting: Conversational AI Developer, Galaxy i Technologies (Dice)", "url": "https://www.dice.com/job-detail/6d7bd820-388e-4d39-81e7-ed0e087eda91", "why": "Dialogflow CX, CCAI, BigQuery, Node.js, GCP; chatbots and voicebots, multi-turn with error handling, webhooks; creating intents and entities."}, {"label": "Similar posting: Google Cloud Conversational AI Developer, ASCII Group (Dice)", "url": "https://www.dice.com/job-detail/5e08da59-2148-4749-a3af-2f9ea6de0edd", "why": "The same Dialogflow CX and CCAI stack."}, {"label": "Similar posting: NICE CXone / Cognigy developer, United Technology (Dice)", "url": "https://www.dice.com/job-detail/e40592e9-8c84-4401-a025-29818721572b", "why": "Cognigy flows, voicebots and IVR, REST, production troubleshooting; NLU and intent recognition preferred."}, {"label": "Similar posting: Lead Conversational AI Developer, SGA (Dice)", "url": "https://www.dice.com/job-detail/73324714-ba9d-4272-8005-59ec7d82649c", "why": "Azure Bot Framework v4, C#/.NET, Azure OpenAI preferred."}, {"label": "Similar posting: Chatbot Developer, Triwave (Dice)", "url": "https://www.dice.com/job-detail/40145e8c-0dba-4647-8f94-b4d273073754", "why": "Bot Framework moving to Microsoft's agents stack; classical NLU combined with LLMs for routing."}, {"label": "Similar posting: Senior AI Engineer, Conversational and Agentic AI, Trigint (Dice)", "url": "https://www.dice.com/job-detail/e0fd510e-109e-4e54-965f-19db6101e5e3", "why": "AWS Bedrock and AgentCore, RAG, embeddings, MCP, multi-turn, Langfuse, Ragas; Lex or Connect nice to have."}, {"label": "Similar posting: Conversational AI Engineer, Eversana", "url": "https://zapply.jobs/jobs/63d1956f-79c2-48e5-ad45-9e1934e6ee9e/", "why": "Cognigy, NLU and intent modelling, production issue analysis; GenAI nice to have."}], "company": ["Vanguard is an investment manager, not a bank, serving investors, advisers and retirement plans. Its assistants today are staged by risk. Crew-facing generative AI is live: Crew Assist, on Azure OpenAI, answers contact-center crew from internal content, and Call Center Agent Assist is in full production. Client-facing work is careful and staged: article summaries for advisers in beta (May 2025) that generate their own disclosures, Expert Insights piloted with advisers (April 2026), and an AI capability inside Digital Advisor piloting later in 2026. Its investor chat already serves more than 2 million people a month. The concerns its CIO named are hallucinations and the bot veering into financial advice.", "Stack clues from Vanguard's own material: AWS (85% of systems moved to the cloud), Amazon Bedrock with Guardrails for its Virtual Analyst, and postings that ask for Bedrock, RAG, agent orchestration, evaluation and Model Risk Management, with Python or TypeScript. Summaries of the chat-assistant team's postings, now closed, also name LangGraph and MCP, but those were seen only in search results. No source names the vendor of the investor chat or the phone channel; don't assume one.", "Mphasis organises the call; no public source links Mphasis and Vanguard, so this is most likely a placement into a Vanguard team (inference). Mphasis calls itself Kore.ai's only distinguished Platinum Partner, so ask early which platform the role supports: Kore.ai through Mphasis, or Vanguard's own stack. That too is inference, not fact."], "posting": {"lead": "Rama at Mphasis sent the two areas the interview will concentrate on (1 October), quoted: “Conversational AI: Build and enhance complex virtual assistants, including conversation design, intent/entity modeling, error analysis, and production improvements.” And “Deep NLP & LLM: Strong expertise in NLP, text classification, embeddings, LLM fundamentals, and Transformer architecture.” The lists below come from those two areas and from similar postings, not from Vanguard.", "facts": [["Client", "Vanguard: the team you would join"], ["Arranged by", "Mphasis (Rama sent the invite and the two areas)"], ["When", "Friday 2 October, 2:00 PM"], ["Platform", "Not confirmed: ask early in the call"]], "does": ["Build and extend virtual assistants for chat and voice: multi-turn flows, prompts, reprompts and error handling.", "Model intents and entities: the taxonomy, training phrases, entity types, slots and confidence thresholds.", "Write webhooks and fulfillment that connect the assistant to backend systems (from similar postings).", "Analyse production transcripts: misclassified intents, fallbacks and escalations, fixed in batches.", "Improve the assistant from analytics: containment, no-match and escalation rates, A/B tests of flows.", "Add LLMs where they help: generative fallback, retrieval for FAQs, routing for uncertain turns."], "wants": ["Strong NLP: text classification, embeddings, LLM fundamentals and the Transformer.", "Conversation design for chat and voice.", "An enterprise NLU platform: Dialogflow CX and CCAI most often in similar postings, or Cognigy, Azure Bot Framework and CLU, Amazon Lex.", "Production troubleshooting and error analysis on real conversations.", "Generative AI with guardrails: RAG, prompting, evaluation.", "APIs and integrations: REST, Node.js or Python, a cloud platform (from similar postings)."]}, "rounds": [], "research": {"lead": "An industry pass over the two areas, for nuance rather than definitions: how this is done in production, at scale and in regulated finance. Each topic's line under its title is the thirty-second version; open it for how teams do it, the deeper notes, the sources, and lines you could say. Start with the likely questions.", "questions": [{"q": "Our assistant's fallback rate doubled after last week's release. Walk me through how you'd find out why.", "probe": "Method under pressure: segment, diff the release, read the transcripts, roll back first if it hurts customers.", "topics": ["b-error-taxonomy", "b-release-practice", "b-regression-testing", "d-dashboards-alerts"]}, {"q": "Two intents keep getting confused, say a dispute and a transaction inquiry. What do you do?", "probe": "Whether you read the confusion matrix and the utterances before touching the model, and know merge, split and disambiguate.", "topics": ["b-intent-confusion", "a-intent-taxonomy", "e-data-quality"]}, {"q": "How would you design the intent taxonomy for a financial-services assistant with several hundred things customers ask about?", "probe": "Granularity by what the bot does differently, hierarchy, the negative intent, sensitive intents.", "topics": ["a-intent-taxonomy", "a-oos-negative", "e-hierarchy-multilabel-multilingual"]}, {"q": "With LLMs available, do you still need intents? Where does the model stop and the flow start?", "probe": "The hybrid: the model understands, deterministic flows act; intents still carry routing, analytics and compliance.", "topics": ["a-hybrid-llm-era", "f-llm-orchestration", "a-platform-flows", "h-thesis", "h-state-routing"]}, {"q": "Design an assistant that answers account questions and can move money. Where do you start?", "probe": "The six steps, with the boundary first: what the model may do, what only code may do.", "topics": ["h-thesis", "h-two-contracts", "h-durable-intent", "h-hybrid-retrieval", "h-state-routing"]}, {"q": "How do you stop a virtual assistant at a bank from hallucinating?", "probe": "That grounding differs by mechanic: retrieval for FAQ, tool calls for account data, flows for transactions.", "topics": ["c-grounding-per-mechanic", "c-faq-retrieval-groundedness", "c-account-data-never-generated", "c-guardrails-stack", "h-hybrid-retrieval"]}, {"q": "A customer asks for their balance, or about a fee. Walk me through how the assistant answers safely.", "probe": "Authenticate first, the number comes from an API and a template, never from the model.", "topics": ["c-account-data-never-generated", "f-auth-personalisation"]}, {"q": "A user says 'send 500 to John'. How does your design make sure the right amount goes to the right person?", "probe": "Slot validation, disambiguating the payee, explicit confirmation, idempotency.", "topics": ["c-transactions-state-machine", "a-entities-slots", "f-llm-orchestration", "h-durable-intent", "h-two-contracts"]}, {"q": "Where is the line between information and investment advice, and how does the assistant respect it?", "probe": "That you know a recommendation is regulated, and route it to a licensed person.", "topics": ["c-compliance-advice-boundary", "f-chatbot-regulation", "c-guardrails-stack"]}, {"q": "How do you handle out-of-scope and low-confidence inputs, including a dispute phrased in an unexpected way?", "probe": "Thresholds tuned on held-out data, an out-of-scope class, sensitive intents that never fall through.", "topics": ["a-oos-negative", "e-out-of-scope", "e-calibration-thresholds"]}, {"q": "When should the assistant say 'I don't know', and how would you build that?", "probe": "Abstention as a designed outcome with a next step, not a failure.", "topics": ["c-abstention-citation-ux", "c-faq-retrieval-groundedness"]}, {"q": "Why can a softmax score of 0.95 still be wrong, and how do you pick a threshold?", "probe": "Calibration, and the precision against coverage trade-off.", "topics": ["e-calibration-thresholds"]}, {"q": "You need an intent classifier with 60 intents and about 50 labelled examples each. What would you build and why?", "probe": "Which classifier when: SetFit or embeddings first, a fine-tuned encoder, an LLM, a cascade.", "topics": ["e-approach-choice", "e-data-quality"]}, {"q": "Containment went up 8 points last quarter. Is that good news?", "probe": "That containment can be false: abandonment, repeat contacts, wrong answers that ended the chat.", "topics": ["b-metrics-hide", "d-cost-per-resolution"]}, {"q": "Customers complain, but the dashboards look fine. How do you do error analysis?", "probe": "Sampling, an error taxonomy, reading transcripts, counting by cause.", "topics": ["b-error-taxonomy", "b-conversation-review", "a-error-analysis"]}, {"q": "How would you discover new intents from a year of chat logs?", "probe": "Embeddings, clustering, a human naming the clusters, prioritising by volume and cost.", "topics": ["b-intent-discovery", "e-intent-discovery"]}, {"q": "How would you evaluate a conversational assistant before production, and how far do you trust an LLM judge?", "probe": "Layers: NLU metrics, end-to-end tests, simulated users, a judge calibrated against people.", "topics": ["d-offline-eval-layers", "d-simulated-users", "d-llm-judge", "b-llm-eval-regulated", "h-eval-scale"]}, {"q": "Offline tests pass but production quality drops. Why, and how do you catch it?", "probe": "Distribution shift, what golden sets miss, drift monitoring, feedback from live agents.", "topics": ["d-offline-online-gap", "b-feedback-drift", "e-embedding-ops"]}, {"q": "What do you log for each turn, and what are the constraints in a bank?", "probe": "Intent and confidence, state, tool calls, latency, outcome; PII redaction and retention.", "topics": ["d-telemetry-per-turn", "f-model-risk"]}, {"q": "The LLM bill is too high. How do you cut cost without hurting quality?", "probe": "A cascade, routing, caching, shorter prompts, measured per resolved conversation.", "topics": ["d-cost-latency-levers", "e-semantic-routing", "d-cost-per-resolution"]}, {"q": "What changes when the assistant moves from chat to the phone, and ASR mishears account numbers?", "probe": "Voice-specific design: confirmations, DTMF fallback, latency budget, barge-in.", "topics": ["a-voice-vs-chat", "f-voice-pipeline", "d-voice-latency-budget"]}, {"q": "When should the assistant hand off to a human, and what travels with it?", "probe": "Warm transfer with context, escalation triggers, agent feedback into training.", "topics": ["f-handoff-agent-assist", "a-design-principles"]}, {"q": "How would you use generative AI to help our contact centre agents, and what could go wrong?", "probe": "Agent assist and summaries, with the agent as the last check; Vanguard's Crew Assist is this.", "topics": ["c-agent-assist-summaries", "c-finance-players-case-studies"]}, {"q": "A compliance reviewer asks what the assistant told a customer last Tuesday, and why. What do you have in place?", "probe": "Audit logs, versioned prompts and models, model risk management.", "topics": ["f-model-risk", "f-chatbot-regulation", "d-telemetry-per-turn"]}, {"q": "Why did some banks keep their customer-facing assistant non-generative while others went all in? What would you do?", "probe": "Erica against Klarna: judgement about where generation earns its risk.", "topics": ["c-finance-players-case-studies", "c-grounding-per-mechanic", "a-hybrid-llm-era"]}, {"q": "What would worry you about putting a generative assistant in front of retail investors?", "probe": "Advice, wrong numbers, disputes missed, auditability, and what Vanguard has said publicly.", "topics": ["f-vanguard-public", "c-compliance-advice-boundary", "f-chatbot-regulation"]}, {"q": "How would you pick, or fine-tune, an embedding model for financial search and classification?", "probe": "Domain benchmarks, cost and dimension, contrastive fine-tuning, data constraints at a regulated firm.", "topics": ["e-embedding-model-choice", "e-finance-specifics", "h-representations"]}, {"q": "How do you roll out a change to millions of customers without breaking what worked yesterday?", "probe": "Regression suites, shadow and canary, gates on the metrics that matter.", "topics": ["b-release-practice", "b-regression-testing"]}], "themes": [{"id": "rs-design", "title": "Conversation design, intents and entities", "blurb": "Where intents still earn their place next to an LLM, and how the flows around them are designed.", "topics": [{"id": "a-intent-taxonomy", "title": "Intent taxonomy: granularity, splitting and merging", "brief": "An intent is a unit of action the business can take, not a unit of topic. The test for splitting is whether the two things need a different flow, API or compliance treatment; if the fulfilment is the same, merge and let slots carry the difference. Over-fine taxonomies fail through overlap and imbalance, not through lack of coverage.", "practice": ["Dialogflow CX guidance: at least 20 training phrases per intent, about 50 for the main ones, and avoid one intent having far more phrases than its neighbours because the classifier then leans toward the big one.", "Two phrasings that mean the same request belong to one intent (Google's example: 'change my bill due date' and 'more time to pay'). Two intents with near-identical phrases give low-confidence, unreliable matches.", "Hierarchical naming such as service.category.action keeps hundreds of intents navigable and lets analytics roll up to a parent.", "Scope the confusion: in CX, intents are only trained against other intents in the same flow, so splitting a big bot into flows reduces cross-topic confusion as the intent count grows.", "Bank of America's Erica went from roughly 200 to 250 intents at launch to more than 700, and BofA describes an intent as a curated answer or workflow, not a topic label.", "Use real production utterances (from transcripts) for training phrases, not phrases invented by the design team."], "say": ["I'd split intents by what the system does next, so a different API, flow or compliance rule means a different intent, and everything else becomes a slot.", "When the count grows past a few hundred I'd stop adding to a flat list and scope intents per flow or domain, because confusion between intents is what actually hurts accuracy."], "deep": "The common mistake is organising intents by how people talk (one intent per FAQ phrasing) instead of by what the assistant will do. 'Check checking balance' and 'check savings balance' are one intent with an account-type slot. 'Report a lost card' and 'dispute a charge' look close in language but go to different flows with different regulatory clocks, so they stay separate. The practical split test is: different fulfilment, different authentication level, different escalation or compliance treatment.\n\nGranularity also has a classifier cost. Every added intent is another decision boundary, and overlapping training phrases show up as a confusion matrix full of off-diagonal mass between two intents. The fix is usually to merge them and distinguish later by slot or by a clarifying question, or to split them properly with distinguishing data. Imbalanced phrase counts bias the model, so teams cap and balance, and add production data over time.\n\nIn finance the taxonomy has a second axis: risk tier. Informational intents (fund fees, how a Roth works) can tolerate a wrong answer being corrected. Transactional intents (transfer, address change, trade) and regulated intents (dispute, fraud, complaint, hardship) cannot, so they get tighter thresholds, confirmation and a human off-ramp. A good taxonomy records that tier on each intent so routing rules and monitoring can use it.\n\nWith LLM routing the training-phrase count matters less, but the taxonomy matters more, because the descriptions you write for each flow or tool become the thing the model chooses between (Copilot Studio's guidance on overlapping descriptions is the same overlap problem in prose).", "sources": [{"label": "Google Cloud: Dialogflow CX general agent design best practices", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/agent-design", "why": "Concrete training-phrase counts, balance advice, hierarchical naming, flow structure."}, {"label": "Google Cloud: Dialogflow CX intents", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/intent", "why": "Intent matching, thresholds and the default negative intent."}, {"label": "Cyara: Dialogflow CX best practices, pages and flows", "url": "https://cyara.com/blog/dialogflow-cx-best-practices-pages-flows/", "why": "Overlap guidance and why flow scoping helps intent recognition."}, {"label": "American Banker: How Bank of America's Erica does the work of 11,000 people", "url": "https://www.americanbanker.com/news/how-bank-of-americas-erica-does-the-work-of-11-000-people", "why": "A named bank with 700+ curated intents and a reason it stayed intent-based."}]}, {"id": "a-oos-negative", "title": "Out-of-scope, the negative intent, and sensitive intents that must not be missed", "brief": "Out-of-scope handling is two problems. Cheap one: do not answer things you were never built for. Expensive one: do not fail to recognise an in-scope but regulated request (a dispute, fraud report, complaint) just because it was phrased unexpectedly. The CFPB named exactly that second failure.", "practice": ["Dialogflow CX scores intents from 0.0 to 1.0 and fires a no-match event if the best score is below the classification threshold; a default negative intent holds phrases that look in-scope but should not match.", "Google warns against stuffing the negative intent (performance degrades past about 10,000 phrases) and says to review it regularly because some negatives become in-scope over time.", "Uncertainty-driven routing: a cheap classifier answers when confident and defers to an LLM only when uncertain, which improves out-of-scope detection without an LLM call on every turn (arXiv 2507.01541).", "Amazon's 'Intent Detection in the Age of LLMs' (EMNLP 2024 industry track) reports a hybrid within 2 percent of native LLM accuracy with 50 percent less latency, and shows LLM out-of-scope ability depends on how many labels and how scoped they are.", "The CFPB's 2023 chatbot spotlight flags bots that only recognise a dispute or legal right when specific words appear, and 'doom loops' with no route to a human.", "Treat a handful of intents as always-escalate triggers (dispute, fraud, unauthorised transaction, complaint, bereavement, hardship) with a high-recall detector separate from the main classifier."], "say": ["I'd split out-of-scope into two: a polite decline for things we never support, and a separate high-recall detector for regulated intents like disputes, tuned to over-trigger toward a human rather than miss one.", "For uncertain cases I like a cheap classifier first and an LLM only on low-confidence turns, which keeps cost and latency down and still catches the odd phrasing."], "deep": "A single confidence threshold is a blunt tool. If you set it high you get many no-matches and users bounce between reprompts. If you set it low you get confident wrong answers, which in banking is worse than asking again. The usual answer is per-intent thresholds by risk, a margin test between the top two intents (if the gap is small, ask a disambiguating question), and a fallback ladder: reprompt once with examples, offer a short menu, then hand off.\n\nThe negative intent should be fed by logs: real out-of-scope utterances that the model wrongly matched. It is not a place to dump every possible irrelevant sentence. With LLM classifiers the equivalent is negative data in the few-shot prompt and an explicit 'none of these' label, plus an uncertainty measure so that borderline cases route to a stronger model or a clarifying question.\n\nThe finance-specific point is asymmetric cost. A missed 'I did not make this charge' is not a bad customer experience, it can be a failure to start an error-resolution process with a legal clock. The CFPB spotlight is explicit that scripted bots which depend on particular words are a risk, and that a bot must not trap people in loops. So the design rule is that every state has a human off-ramp, and the detector for sensitive intents is evaluated on recall of those intents specifically, not on overall accuracy.\n\nThis is also where the LLM era helps: semantic matching catches paraphrases a phrase list would miss. It does not remove the need for the escalation rule, because the rule is a policy, not a prediction.", "sources": [{"label": "Google Cloud: Dialogflow CX intents", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/intent", "why": "Threshold behaviour, default negative intent and its limits, intent suggestions from no-match."}, {"label": "CFPB: Chatbots in consumer finance (issue spotlight, June 2023)", "url": "https://files.consumerfinance.gov/f/documents/cfpb_chatbot-issue-spotlight_2023-06.pdf", "why": "Regulator language on doom loops and failing to recognise disputes."}, {"label": "arXiv: Intent Detection in the Age of LLMs", "url": "https://arxiv.org/abs/2410.01627", "why": "Hybrid classifier plus LLM numbers and out-of-scope findings."}, {"label": "arXiv: Efficient out-of-scope detection via uncertainty-driven LLM routing", "url": "https://arxiv.org/pdf/2507.01541", "why": "Classifier defers to LLM only when uncertain."}]}, {"id": "a-entities-slots", "title": "Entity and slot modelling: validation, resolution and reprompts", "brief": "Extracting a value is the easy half. The real design work is resolving it to something the backend accepts, validating it against business rules, and deciding what to say when it fails. Slot filling is a small dialogue of its own with its own retry budget and its own exit.", "practice": ["Built-in types for generic values (number, date, name) and custom types for the domain, such as account type or fund or plan names, each with synonyms that resolve to a canonical id.", "Lex V2 slot config includes a required flag, retries with a different prompt per retry, a Lambda dialog code hook to validate (range, format, business rule) after each attempt, and separate success and failure responses.", "Optional slots are filled opportunistically: if the user says 'sales for April in San Diego' the optional city slot fills without being asked.", "In Dialogflow CX you must annotate the training-phrase spans that should become parameters, or extraction does not happen; use form parameters when a page mainly collects, intent parameters when values arrive during a transition.", "Rasa CALM collect steps support rejections: if validation fails the assistant re-asks until the value is acceptable. Copilot Studio's generative orchestration does not yet take custom entities (closed lists, regex) as topic input parameters, so a Q
