label": "How Fin uses Topics Explorer to improve continuously", "url": "https://www.youtube.com/watch?v=pF1m2LNgkjE", "m": 2, "why": "A production example of clustering conversations into topics to find what to fix.", "yt": {"id": "pF1m2LNgkjE", "ch": "Intercom"}}, {"kind": "video", "req": true, "label": "PII redaction for LLM logs in Python", "url": "https://www.youtube.com/watch?v=epV3BPAMPtM", "m": 8, "why": "Redaction before logging, with typed placeholders.", "yt": {"id": "epV3BPAMPtM", "ch": "Professor Py: AI Engineering"}}, {"kind": "read", "req": true, "label": "Anthropic: Clio, privacy-preserving insights into real-world AI use", "url": "https://www.anthropic.com/research/clio", "m": 10, "why": "Summarising, clustering and labelling conversations while keeping personal data out."}, {"kind": "read", "req": true, "label": "Hamel Husain: a field guide to rapidly improving AI products", "url": "https://hamel.dev/blog/posts/field-guide/", "m": 20, "why": "Error analysis, labelling and the evaluation loop as a weekly practice."}, {"kind": "read", "req": false, "label": "Microsoft: Presidio", "url": "https://microsoft.github.io/presidio/", "m": 8, "why": "The redaction library for the first step of the loop."}], "mcq": [{"q": "Where should personal data be removed from conversation logs, and why there?", "o": ["At read time in the viewer, because it keeps the raw text for debugging", "In memory at ingest, before any write, so every store, export and training set inherits it", "In the nightly job, after clustering, so cluster quality is not affected", "At the labelling queue, because reviewers are the only people who read text", "In the dashboards, because those are the only user-facing surface"], "a": 1, "why": "Read-time masking leaves raw text in replicas, exports, backups and training data. Redacting before the first write protects every later stage."}, {"q": "24,000 conversations are flagged a day and reviewers can label 600. What is the best way to spend the 600?", "o": ["A random 600 of the flagged conversations", "The 600 with the highest model confidence", "About 4 samples from each of the top 150 clusters, ranked by volume times cost, plus a small random slice", "Every handoff, in order of arrival, until the 600 run out", "The 600 shortest conversations, since they are fastest to label"], "a": 2, "why": "Clusters ranked by volume times cost let each label represent many failures, and a random slice checks that the ranking is not missing unflagged problems."}, {"q": "A retrained model scores better overall on 1,500 evaluation turns, but a rare intent with 30 turns dropped 6 points. What does the gate do?", "o": ["Ships it, because the overall number improved", "Ships it, because 6 points is inside the interval for a 30-turn intent, so it is not evidence either way, and shadow will settle it", "Blocks it at once without further checks, because any drop is a failure", "Re-trains on the evaluation set until the rare intent recovers", "Removes the rare intent from the evaluation set"], "a": 1, "why": "For 30 turns at 0.90 the 95% interval is about plus or minus 11 points, so 6 is not distinguishable from noise. A protected intent still needs more examples or a never-break suite, and shadow traffic gives a second opinion. Training on the evaluation set would make the gate meaningless."}], "open": {"q": "Design the loop that finds where our assistant fails and makes it better every week, without leaking customer data.", "probe": "You have 24,000 flagged conversations a day and people for 600 labels. What do you review, and how do you know a retrained model is safe to ship?", "a": "Redact in memory at ingest, with patterns for card and account numbers and a tagger for names and addresses, store only placeholders, and drop the turn on a redactor error. Score each conversation on several weak signals (fallback, rephrase, handoff, thumbs down, low confidence), embed and cluster the failed utterances, and rank clusters by volume times cost. Reviewers label about 4 samples from the top 150 clusters, plus a random slice, using a written guide. Labels build a dataset version with a frozen evaluation split. A candidate is scored per intent plus a never-break suite, then shadowed and rolled out at 5%, 25%, full with guardrails on fallback, handoff and resolution. I would size the set: at 1,500 turns a 1.5 point change is noise, so rare high-risk intents get a fixed suite."}, "say": ["**The loop is redact, find, cluster, label, retrain, gate, and the order is the design.**", "**Privacy:** redact in memory before any write; on error, drop the turn and alert.", "**Failures:** several weak signals, embedded and clustered, ranked by volume times cost, because people can label 600 of 24,000.", "**Release:** a frozen set scored per intent plus a never-break suite, then shadow and staged rollout; at 1,500 turns a 1.5 point change is noise.", "Containment goes next to resolution, so a bot that never transfers does not look like it is winning."], "design": "convo-analytics"}]}, {"id": "watch", "title": "Long watches: system design talks", "day": "Any evening, alongside", "blurb": "Fifteen long talks (20 to 85 minutes) that go deep enough to talk through nuances: conversational assistants, voice agents, agents in production, evals, and LLM system design interviews. What to listen for is under each.", "topics": [{"id": "watch-assistant-nlu", "title": "How would you design the NLU and dialogue layer of a banking assistant?", "brief": "How intent, entity and dialogue pieces fit in a production assistant, and where an LLM goes.", "points": ["Pipeline shape: what each stage of an intent and entity model takes in and hands on, and why the pieces are separate.", "Control versus fluency: which decisions stay in deterministic flows and which go to an LLM.", "Regulated setting: how a large bank keeps an assistant auditable, versioned and scalable.", "Failure handling: fallbacks, out-of-scope input and corrections, and what you would log."], "production": [], "figs": [], "res": [{"kind": "video", "req": false, "label": "CALM: Architecture at Scale (Morgan Stanley and Red Hat)", "url": "https://www.youtube.com/watch?v=bqip3qiXh6o", "m": 39, "why": "A bank's view of running a flow-based LLM assistant at scale; the architecture and governance parts matter most.", "yt": {"id": "bqip3qiXh6o", "ch": "FINOS"}}, {"kind": "video", "req": false, "label": "Rasa Algorithm Whiteboard: DIET Architecture 1, How it Works", "url": "https://www.youtube.com/watch?v=vWStcJDuOUk", "m": 24, "why": "One model doing intent and entity extraction together, drawn on a whiteboard; listen to the shared-encoder trade-off.", "yt": {"id": "vWStcJDuOUk", "ch": "Rasa"}}, {"kind": "video", "req": false, "label": "Conversational AI: Building clever chatbots (Tom Bocklisch)", "url": "https://www.youtube.com/watch?v=HV0bJMkzpO4", "m": 30, "why": "The Rasa CTO on dialogue management, NLU limits and what breaks once real users arrive.", "yt": {"id": "HV0bJMkzpO4", "ch": "PyData"}}]}, {"id": "watch-voice-agents", "title": "What decides latency, turn-taking and scale in a real-time voice agent?", "brief": "The streaming pipeline, its latency budget, and why conversation was harder than recognition.", "points": ["Latency budget: where each hundred milliseconds goes across STT, LLM, TTS and the network.", "Transport: why WebRTC over WebSockets for audio, and what that does to the server design.", "Turn-taking: voice activity, end-of-turn detection and interruptions, and their error costs.", "Scale and quality: GPU and worker capacity, cold starts, and keeping quality as concurrency grows."], "production": [], "figs": [], "res": [{"kind": "video", "req": false, "label": "How to build the world's fastest voice bot (Kwindla Hultman Kramer)", "url": "https://www.youtube.com/watch?v=dRQHikOrH2A", "m": 21, "why": "A concrete latency budget and the design moves that cut it; the network and streaming sections matter most.", "yt": {"id": "dRQHikOrH2A", "ch": "AI Engineer"}}, {"kind": "video", "req": false, "label": "Engineering voice agents: Latency, quality, and scale (Rishabh Bhargava, Together AI)", "url": "https://www.youtube.com/watch?v=N7b1PJc7SFc", "m": 25, "why": "Serving side of voice: model latency, quality trade-offs and scaling the workers.", "yt": {"id": "N7b1PJc7SFc", "ch": "AI Engineer"}}, {"kind": "video", "req": false, "label": "Why Speech Recognition Was Solved Before Conversation Was (Shawn Wen)", "url": "https://www.youtube.com/watch?v=VoAPg8Fj6-c", "m": 71, "why": "A long look at turn-taking and the rhythm of conversation; the part on why end-of-turn is hard matters most.", "yt": {"id": "VoAPg8Fj6-c", "ch": "Machine Learning Street Talk"}}]}, {"id": "watch-agents-production", "title": "What does it take to run tool-using agents safely in production?", "brief": "Harness, memory and enterprise rollout: the engineering around the model.", "points": ["Harness: the loop, tools, context and checks around the model, and why they matter as much as model choice.", "Memory: what to keep in context, what to store, and what to forget or compact.", "Guardrails and limits: validation, permissions, human handoff and rate limits for tool calls.", "Rollout: how an enterprise moves from a demo to monitored, governed agents."], "production": [], "figs": [], "res": [{"kind": "video", "req": false, "label": "Why The Harness Matters More Than The Model (YC Paper Club)", "url": "https://www.youtube.com/watch?v=n9xKblqyQ28", "m": 61, "why": "A long argument, with examples, that the scaffolding decides reliability; the failure examples matter most.", "yt": {"id": "n9xKblqyQ28", "ch": "Y Combinator"}}, {"kind": "video", "req": false, "label": "Build Hour: Agent Memory Patterns", "url": "https://www.youtube.com/watch?v=WsGVXiWzTpI", "m": 58, "why": "Short-term and long-term memory patterns with code and the trade-offs between them.", "yt": {"id": "WsGVXiWzTpI", "ch": "OpenAI"}}, {"kind": "video", "req": false, "label": "The Production AI Playbook: Deploying Agents at Enterprise Scale (Sandipan Bhaumik, Databricks)", "url": "https://www.youtube.com/watch?v=ObTPqBGsEbA", "m": 38, "why": "Governance, evaluation and monitoring for agents in a large organisation.", "yt": {"id": "ObTPqBGsEbA", "ch": "AI Engineer"}}]}, {"id": "watch-evals-loops", "title": "How do you measure and improve a conversational or voice system after launch?", "brief": "Error analysis, automated judges and evals for voice.", "points": ["Error analysis first: read real traces, name the failure modes, and only then build metrics.", "Judges: when an LLM judge is trustworthy, and how to check it against human labels.", "Voice specifics: what to score beyond words, such as latency, interruptions and task completion.", "The loop: how findings turn into prompt, data or pipeline changes you can re-run."], "production": [], "figs": [], "res": [{"kind": "video", "req": false, "label": "AI Evaluations Clearly Explained in 50 Minutes (Hamel Husain)", "url": "https://www.youtube.com/watch?v=uiza7wp1KrE", "m": 53, "why": "A worked example of error analysis on real traces; the way failure categories are built matters most.", "yt": {"id": "uiza7wp1KrE", "ch": "Peter Yang"}}, {"kind": "video", "req": false, "label": "How to Automate AI Evals (Correctly)", "url": "https://www.youtube.com/watch?v=tqUDjc1HzO4", "m": 28, "why": "Turning manual review into judges you can trust, and how to validate them.", "yt": {"id": "tqUDjc1HzO4", "ch": "Hamel Husain"}}, {"kind": "video", "req": false, "label": "Evals for real-world voice agents", "url": "https://www.youtube.com/watch?v=JtIeyT7WFOw", "m": 54, "why": "Scoring and simulating voice calls at scale; the metrics and test setup matter most.", "yt": {"id": "JtIeyT7WFOw", "ch": "Braintrust"}}]}, {"id": "watch-llm-design-interviews", "title": "How would you walk through an LLM or assistant system design interview end to end?", "brief": "Full mock walkthroughs of ChatGPT-style and support-agent designs.", "points": ["Requirements: how the scope and numbers are set before any box is drawn.", "Core path: request flow, streaming responses, context storage and model serving.", "Quality and safety: retrieval, evals, moderation and fallbacks added after the core path.", "Trade-offs: cost per request, latency, caching and what you would cut first."], "production": [], "figs": [], "res": [{"kind": "video", "req": false, "label": "Design ChatGPT: System Design Mock Interview (with eBay EM)", "url": "https://www.youtube.com/watch?v=I9-PUPYZyiw", "m": 36, "why": "A full mock with interviewer pushback; the scaling and streaming discussion matters most.", "yt": {"id": "I9-PUPYZyiw", "ch": "Aced (formerly Exponent)"}}, {"kind": "video", "req": false, "label": "Design ChatGPT: Top Interview Question in OpenAI and Anthropic", "url": "https://www.youtube.com/watch?v=5yHR1_2Y6bs", "m": 85, "why": "A long, detailed build of the whole system, including serving and storage choices.", "yt": {"id": "5yHR1_2Y6bs", "ch": "ShowOffer - Tech Interview Coaching Platform"}}, {"kind": "video", "req": false, "label": "Design a Customer Support Agent (Applied AI System Design)", "url": "https://www.youtube.com/watch?v=un1IJdX-ImQ", "m": 29, "why": "A support-agent design with retrieval, tools and escalation; closest to a bank assistant.", "yt": {"id": "un1IJdX-ImQ", "ch": "Aniket Wattamwar"}}]}]}, {"id": "you", "title": "You: your story and your work", "blurb": "Your intro, why this role, and your work told as it is in the code today. Explain each aloud, then compare.", "sessions": [], "extras": ["drills", "ask"], "topics": [{"id": "you-intro", "title": "Tell me about yourself", "brief": "Research, shipping, production assistants, and the layer in front of the agent: understanding and improving it from real conversations.", "points": ["They may ask: What does alfred_ do?", "They may ask: What do you own there?", "They may ask: Have you worked on a chatbot or virtual assistant?", "They may ask: Which NLU platforms have you used?"], "production": ["If they ask what alfred_ is, in a line: An AI executive assistant that works over text message and the web. It handles people's email and calendar end to end, for 5,000-plus active users.", "If they ask which NLU platforms you've used: Honestly, not Dialogflow or Lex in production. I've built the layer in front of LLM agents myself: routing, entity resolution, confirmation in code. The understanding there is an LLM with typed tool schemas, not a trained classifier, but the modelling and the error analysis are the same work, and I'd pick up the platform quickly."], "open": {"q": "Tell me about yourself", "probe": "The opener. Land on conversational AI and the NLP under it.", "a": ["Sure. I started out in computer science research at UIC, where I worked on applied ML and LLM systems. That gave me a pretty strong foundation in actually building and evaluating these systems, rather than just using the models.", "From there I joined WheelPrice, which was a much more startup-oriented environment. I was working across the stack and got a lot more exposure to shipping things that were actually being used by customers. It was a small engineering team, so I had to be pretty broad — backend, AI, infrastructure, and product work all kind of blended together.", "After that I joined alfred_, where I've been working as a founding LLM engineer. It's an AI assistant, and my work has become much more focused on reliability and evaluation — things like building the eval harness, production failure detection, working memory, and making sure agent changes actually improve the product rather than just looking better on a benchmark.", "The common thread through all of that has really been building AI systems in environments where you don't have a perfectly defined problem in front of you. You have to figure out what's broken, decide what to build, and then own it through production.", "And the closest part to this role is what sits in front of the agent. At alfred_ a fast first pass decides whether a message can be answered or needs the heavier agent, things like 'that email' resolve to real records, anything that sends goes through a confirm step in code, and a scanner reads real conversations every day to find what went wrong. So building an assistant and improving it from its transcripts is pretty much the work I already do."]}, "say": [], "avoid": ["Never say you've used Dialogflow, Lex, CLU, Rasa, Kore.ai or Cognigy.", "Never mention alfred_'s funding, a crunch, or colleagues' names."], "mcq": [], "was": ["say-intro"]}, {"id": "you-why", "title": "Why this role?", "brief": "Vanguard is doing generative AI in the right order, and keeping an assistant inside its lines is my daily work.", "points": ["They may ask: Why Vanguard?", "They may ask: What do you know about our assistants?", "They may ask: Why classic NLU when everyone is moving to LLMs?"], "production": ["If they ask why classic NLU at all: I think the classic layer is the part you can measure and control: a confusion matrix, a threshold, a test set. The LLM is great for the long tail and out-of-scope. Most good assistants I've read about use both, and that's how alfred_ works too.", "If they ask what you know about the scale: From what I read, your chat already serves more than 2 million investors a month, and you're adding AI features to it. At that volume a small error rate is a lot of people, so the evaluation has to come first."], "open": {"q": "Why this role?", "probe": "After the intro, or when they ask why Vanguard or why conversational AI.", "a": ["Honestly, it's the way Vanguard is doing it. From what I read, the generative AI went to crew first, Crew Assist and agent assist in the contact center, and the client-facing side is staged: summaries for advisers in beta, then a pilot inside Digital Advisor. I think that's the right order, and it's how I'd do it.", "And the concern your CIO named, keeping the bot from veering into advice and watching for hallucinations, is pretty much the problem I work on. At alfred_ anything that sends or deletes goes through a confirm step in code before it runs, and a scanner reads real conversations every day to find what went wrong.", "The two areas in the role are the two halves of what I do. One is the assistant: how the conversation is designed, how intents and entities are modelled, and how you find and fix what's going wrong in production. The other is the NLP underneath: classification, embeddings, how the models work.", "So it's the work I already do, in a place where being right matters more than being first."]}, "say": [], "avoid": [], "mcq": [], "was": ["say-why-role"]}, {"id": "you-closest", "title": "What have you built that's closest to this?", "brief": "A first pass that answers or escalates, entity resolution in chat, a confirm flow in code and a failure scanner in production; stages driven by tools in voice; TF-IDF weighted embeddings in research.", "points": ["They may ask: How does the first pass decide to escalate?", "They may ask: How do you decide when to ask the user?", "They may ask: How do you find failures?", "They may ask: Was any of it on a platform like Dialogflow?"], "production": ["If they ask about WheelPrice: At WheelPrice I built an AI fitment assistant that could only answer through tools against verified data.", "If they ask about a classic platform: Not in production. The concepts map closely: a page with a form in Dialogflow CX is a stage with required slots, and a route is a transition. I'd want a week with their taxonomy and their transcripts.", "If they ask about voice: I own alfred_'s voice agent, phone and web. In MockFlow-AI the pipeline was Deepgram Nova-2 for speech and Silero for voice activity."], "open": {"q": "What have you built that's closest to this?", "probe": "When they ask about your experience with chatbots, virtual assistants or NLU. Outcome first, one design choice, then stop.", "a": ["The closest is alfred_. It's an AI assistant over text and the web. A fast first pass answers what it can from what it can read and escalates the rest to a heavier agent, and code guards turn a reply that promises an action into an escalation instead of shipping it. I also built entity resolution in chat, so 'the second email' or 'that meeting' points at a real record, and the confirm flow: anything that sends gets a preview first and runs only on an explicit confirm, with floors in code that no prompt can override.", "Then error analysis. I built a production failure scanner that reads real conversations, separates genuine failures from expected behaviour, and promotes the real bugs for triage. Those feed a replay bench of real production turns, graded by a person, so a change is judged on what users actually hit before it ships.", "Before that, MockFlow-AI: a real-time voice interview platform I built from scratch, under 400 milliseconds end to end. The conversation moves through stages in a state machine, and the model can only move it by calling a transition tool. That's the nearest thing I've built to flows and pages.", "And on the NLP side, MetaRAG at UIC: TF-IDF weighted embeddings with recursive chunking got 82.5% precision against a 73.3% baseline, and 0.925 Hit Rate at 10."]}, "say": [], "avoid": ["Don't call alfred_'s classifier 'Dialogflow-like' or name a platform you haven't used."], "mcq": [], "was": ["say-closest"]}, {"id": "you-fit", "title": "How your background fits, and the gaps", "brief": "Most of the role maps onto work you've done; the classic NLU platforms and a trained intent classifier are new, and you say so first.", "points": ["Done: a first pass that answers or escalates; entity resolution in chat; a confirm flow with floors in code; grounding guards; a failure scanner over real conversations.", "Also done: a voice state machine in MockFlow-AI; TF-IDF weighted embeddings in MetaRAG; a from-scratch Transformer.", "Not done: Dialogflow CX, Lex, CLU, Rasa, Kore.ai or Cognigy in production.", "Not done: a trained intent classifier or NER model in production; an intent taxonomy in the hundreds; contact-centre analytics at enterprise volume."], "production": [], "mcq": [], "open": {"q": "How does your background fit this role?", "probe": "Is it real, and are you honest about the gaps?", "a": ["Most of it maps directly. The role is building and improving assistants: conversation design, intents and entities, error analysis, production improvements, on strong NLP.", "At alfred_ I built the parts that do that work: the first pass that decides whether a turn can be answered or needs the heavier agent, entity resolution in chat so 'that email' points at a real record, the confirm flow and code floors on anything that sends, and the scanner that finds failures in real conversations.", "What I haven't done is ship on a classic NLU platform, or train an intent classifier for a taxonomy of hundreds of intents. In alfred_ the understanding is an LLM with typed tool schemas, checked in code. The error analysis and the design underneath are the same work; the platform is new."]}, "say": [], "avoid": ["Don't say alfred_ has a trained intent classifier, a decision layer or a risk score."], "was": ["q-how-does-your-background-fit-this-role"]}, {"id": "you-confirm", "title": "What your assistant may do on its own", "brief": "Anything that changes the world goes through a preview, then an explicit confirm, with floors in code that no prompt can override and idempotency on retries.", "points": ["Preview first: the first call to a sending tool returns a preview and stashes the arguments as a pending confirmation.", "Explicit confirm: only a second call with a real confirmation executes; sends need that prior preview.", "Code floors: destructive actions and external sends always confirm; a bare 'yes' can't approve several pending sends; large sweeps hit a scale threshold.", "Idempotency: a retried send replays the first result instead of sending again."], "production": [], "mcq": [], "open": {"q": "How does your assistant decide what it can do without asking?", "probe": "Whether safety is a rule you can test or a prompt you hope holds.", "a": ["Anything that changes the world goes through a two-step confirm. The first call to a tool like send email returns a preview, not an action, and the arguments are kept as a pending confirmation. Only a second call with an explicit confirmation executes it.", "On top of that there are floors in code that no prompt can override: destructive actions and external sends always confirm, and a bare 'yes' can't approve several sends at once. Retries go through idempotency keys, so a double send replays the first result.", "I think that's the right split: the model is good at understanding what someone meant; whether it's safe to send an email on their behalf should be a rule you can test."]}, "say": [], "avoid": ["Talk only about what's live: the confirm flow, the floors and idempotency. No verdicts, no risk score."], "was": ["q-tell-me-about-the-decision-layer-at-alfred"]}, {"id": "you-entities", "title": "How your assistant knows what 'that email' means", "brief": "You built entity management in chat: everything in play is a typed entity with a real id and a lifetime, kept outside the model, so references resolve to records rather than guesses.", "points": ["Typed entities: email, thread, draft, event, task, contact and more, each with its real id.", "Lifetimes: short for drafts and emails, longer for events and tasks; an event expires after it happens.", "Resolution: the prompt lists them numbered with references; the tool receives a real id.", "Matching: contacts and events are resolved by deterministic matching with thresholds; when two candidates are too close, it asks.", "Honest limit: 'the second one' is resolved by the model reading the numbered list, not by code."], "production": [], "mcq": [], "open": {"q": "A user says 'reply to the second one'. How does your assistant know what that means?", "probe": "Dialogue state and entity resolution, and honesty about where the model still decides.", "a": ["Everything in play in a conversation, an email, a thread, an event, a task, a contact, is kept as a typed entity outside the model, with its real id and a lifetime.", "The prompt shows them as a numbered list with references, so when someone says 'the second one', the model resolves it against that list and the tool gets a real id, not a guess.", "Contacts and events are resolved by deterministic matching: several sources merged, a similarity threshold, and if two candidates are too close it asks rather than picks.", "Honestly, the ordinal itself is the model reading the list; if I were hardening it, I'd move that into code too."]}, "say": [], "avoid": [], "was": []}, {"id": "you-grounding", "title": "How your assistant stops claiming what it didn't do", "brief": "Claims of actions and searches are checked in code against the turn's tool-execution ledger; a model-based verifier is a narrow, flagged backstop, not the main check.", "points": ["Ledger check: a reply that claims an action, a search or a saved item is checked against what the tools actually did that turn.", "First-pass guards: a reply that promises an action or claims it's done becomes an escalation instead of shipping.", "Strict-ID memory: the model sees opaque handles; code drops any it didn't issue and reattaches the real ids.", "Limit: the model still writes the wording, so this removes invented threads and owners, not every wrong sentence."], "production": [], "mcq": [], "open": {"q": "How do you stop your assistant claiming things it didn't do?", "probe": "Grounding you built, and whether you overclaim it.", "a": ["We found the assistant sometimes claimed an action or a live fact with no tool behind it. So every reply that claims an action, a search or a saved item is checked against that turn's tool-execution ledger, in code, not by another model.", "In the fast first pass, a reply that promises an action or says it's done is turned into an escalation instead of shipping.", "For memory, the model only ever sees opaque handles, and code drops any handle it didn't issue, so it can't point at a thread that doesn't exist. It still writes the sentence, so I wouldn't call it hallucination-proof.", "The lesson for me: the cheap deterministic check carries most of the weight; a model-based check is a narrow backstop."]}, "say": [], "avoid": ["Don't say an LLM verifier checks every reply, or that strict-ID makes hallucination impossible."], "was": ["q-tell-me-about-a-time-you-improved-an-assistant-from-production"]}, {"id": "you-scanner", "title": "The production failure scanner and the replay bench", "brief": "Deterministic signals find candidate failures in real conversations, a model labels each, and only real agent bugs above a confidence bar are promoted; a replay bench judges changes on real turns, graded by a person.", "points": ["Scan: deterministic signals and detectors over real conversations.", "Classify: a model labels each candidate as an agent bug, a UX problem, a provider error or expected behaviour.", "Promote: only agent bugs above a confidence bar; signals like a user dropping off never auto-promote.", "Precision: joining against the tool-execution record killed false 'agent did nothing' flags.", "Bench: real production turns replayed against a change, graded by a person; not run in CI."], "production": [], "mcq": [], "open": {"q": "Tell me about the production failure scanner.", "probe": "Error analysis you've actually run.", "a": ["It scans real production conversations with deterministic signals and detectors, then a model classifies each candidate: an agent bug, a UX problem, a provider error, or expected behaviour.", "Only real agent bugs above a confidence bar are promoted automatically, and some signals, like a user dropping off, never are, because they're too often not a failure.", "The hard part is that second step: a lot of what looks like failure is the assistant correctly declining. Joining against the tool-execution record killed a lot of false flags.", "The failures feed a replay bench of real turns, graded by a person, so a change is judged on what users actually hit. It's the transcript-review loop this role describes, automated."]}, "say": [], "avoid": ["Don't say evals run in CI."], "was": ["q-tell-me-about-the-production-failure-scanner"]}, {"id": "you-metarag", "title": "MetaRAG, your retrieval research", "brief": "A retrieval framework for enterprise knowledge at UIC, accepted at IEEE CAI 2026: recursive chunking with TF-IDF weighted embeddings. Not alfred_ work.", "points": ["Result: 82.5% precision against a 73.3% baseline, 0.925 Hit Rate at 10.", "Production: about 10K queries a day, p99 under 300 ms, 25% hallucination reduction.", "Lesson: get retrieval right before touching generation; sparse signals help dense embeddings on domain vocabulary.", "Check before the call: how the TF-IDF weights enter the embedding, and how hallucination was measured."], "production": [], "mcq": [], "open": {"q": "Tell me about MetaRAG.", "probe": "Your NLP research, with its numbers.", "a": ["MetaRAG was a retrieval framework for enterprise knowledge at UIC, accepted at IEEE CAI 2026. Recursive chunking with TF-IDF weighted embeddings got 82.5% precision against a 73.3% baseline, and 0.925 Hit Rate at 10.", "It ran in a production code-translation use case at about 10K queries a day with p99 latency under 300 milliseconds, and it reduced hallucination by 25%.", "The lesson that carries over to an assistant: get retrieval right before touching generation, and let sparse signals like TF-IDF help dense embeddings on domain vocabulary."]}, "say": [], "avoid": ["Don't improvise the weighting mechanism or the hallucination measure."], "was": ["q-tell-me-about-metarag"]}, {"id": "you-ramp", "title": "Getting productive on their platform", "brief": "The platform is what you'd learn; the work underneath you've done. Learn it on real work: taxonomy, transcripts, one small measurable fix end to end.", "points": ["Week one: read the taxonomy and the confusion matrix, sit with real transcripts.", "Map the pieces: a page with a form is a state with required slots; a route is a transition; an event handler is the no-match ladder.", "Then one small fix end to end through their test cases and release process."], "production": [], "mcq": [], "open": {"q": "You haven't used our platform. How would you get productive?", "probe": "Honesty plus a credible plan.", "a": ["Honestly, the platform is the part I'd learn; the work underneath it I've done. In the first week I'd read the intent taxonomy and the confusion matrix, sit with a few hundred real transcripts, and map the platform's pieces onto what I know.", "Then I'd pick one small, measurable problem, a pair of confused intents or a page with a high no-match rate, and fix it end to end through the platform's test cases and release process.", "That's how I work with any new stack: I built MockFlow-AI on LiveKit from scratch, and it runs under 400 milliseconds end to end."]}, "say": [], "avoid": [], "was": ["q-you-haven-t-used-our-platform-how-would-you-get-productive"]}, {"id": "you-logistics", "title": "Logistics they may ask", "brief": "Say each once, then back to the role.", "points": ["They may ask: Are you available full time?", "They may ask: Where are you based? Remote or on site?", "They may ask: When could you start?", "They may ask: Work authorization?"], "production": [], "say": [], "avoid": ["Don't negotiate with Vanguard's team."], "mcq": [], "was": ["say-logistics"]}], "day": "Wednesday morning, before the 3 PM call"}]}, "tabs": ["overview", "learn", "mocks"], "live": [], "liveLead": [], "watch": null, "timeline": null}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; o.rev = o.rev || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }
    var sm = el("summary", "", '<span class="qt">' + inl(title) + "</span>" + (meta ? '<span class="qm">' + meta + "</span>" : ""));
    d.appendChild(sm); d.appendChild(body);
    return d;
  }
  function bulk(host) {
    var b = el("div", "bulk");
    var o = el("button", "", "Open all"), c = el("button", "", "Close all");
    o.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = true; }); });

    if (it.pts && it.pts.length) { left.appendChild(ptsList(it.pts)); }
    learn(left, { figs: it.figs || [] });

    var pre = [];
    if (isStudy && it.do) {
      it.do.forEach(function (d) {
        pre.push({ url: d.url, label: d.a, m: d.m, why: d.where });
      });
    }
    if (!isStudy && (it.where || it.url)) { pre.push(it.url ? { url: it.url, label: it.where || it.url } : { book: it.where }); }
    learn(left, { figs: [], read: pre.concat(isStudy ? (it.res || []) : (it.links || []), it.read || []), sdLinks: it.sdLinks });
    var say = isStudy ? it.say : it.ans;
    if (say || it.out || SAYS.test(it.t || "")) { work.appendChild(mineBox(key, promptOf(it))); }
    if (say) { work.appendChild(sayToggle(isStudy ? "The idea, in the words you would use" : "What you would say", transcript(Array.isArray(say) ? say : [say], "", ""))); }
    if (!work.children.length) { work.remove(); body.classList.add("one"); }
    row.appendChild(body);
    return row;
  }

  function toggleSession(x) {
    var t = tracker();
    if (t.done[x.id]) {
      delete t.done[x.id];
    } else {
      stepKeys(x).forEach(function (k) { if (!t.steps[k]) { t.steps[k] = true; t.steps[k + ":at"] = stamp(); } });
      if (x.hasTrackerQuiz && !(t.quiz[x.id] && t.quiz[x.id].passed)) {
        t.quiz[x.id] = { score: 0, passed: true, at: stamp(), missed: [], via: "interview page" };
      }
      t.done[x.id] = stamp();
    }
    writeJSON(TRACKER, t);
    route();
  }

  /* ---------------------------------------------------------------- mocks */
  /* A mock reads in two parts: the read (how it went, what landed, what to fix first),
     then the conversation, one exchange at a time. Each exchange shows who asked what and
     what you said, with a verdict; it opens to why, how to approach it, and the answer to
     say, behind the same toggle the Prep tab uses. */
  var VERDICT = { landed: "Landed", partly: "Partly", missed: "Missed", gap: "Gap: you did not have an answer" };
  /* Live build: repos handed over as the interviewer would hand them, each a vague request to
     clarify and build in a separate coding session while the interviewer is played in chat. */
  function tabLive(host) {
    var intro = heading(host, "live-how", "", "Live build");
    (LOOP.liveLead || []).forEach(function (p) { intro.appendChild(el("p", "lead", inl(p))); });
    LOOP.live.forEach(function (x) {
      var s = heading(host, "live-" + x.id, x.lang + ", about " + x.minutes + " minutes", x.title);
      s.appendChild(el("div", "lab", "What he says"));
      s.appendChild(el("blockquote", "live-ask", inl(x.ask)));
      s.appendChild(el("div", "lab", "Start"));
      var ol = el("ol", "mk-list");
      x.start.forEach(function (t) { ol.appendChild(el("li", "", inl(t))); });
      s.appendChild(ol);
      if (x.after && x.after.length) {
        s.appendChild(el("div", "lab", "After the build"));
        var ul = el("ul", "mk-list");
        x.after.forEach(function (t) { ul.appendChild(el("li", "", inl(t))); });
        s.appendChild(ul);
      }
      (x.guide || []).forEach(function (ph, pi) { s.appendChild(livePhase(x, ph, pi)); });
    });
  }

  /* One phase of a live build's guide, folded: a lead, points, decisions with the strong pick shut
     until he has chosen, copy-ready prompts, and resources. */
  function livePhase(x, ph, pi) {
    var d = el("details", "live-phase");
    d.appendChild(el("summary", "", '<span class="lp-n">' + (pi + 1) + "</span>" + inl(ph.title)));
    var body = el("div", "lp-body");
    if (ph.lead) { body.appendChild(el("p", "", inl(ph.lead))); }
    if (ph.items && ph.items.length) {
      var list = el(ph.ordered ? "ol" : "ul", "mk-list");
      ph.items.forEach(function (t) { list.appendChild(el("li", "", inl(t).replace(/^([^:<]{2,60}):/, "<b>$1:</b>"))); });
      body.appendChild(list);
    }
    (ph.decisions || []).forEach(function (q, qi) {
      var box = el("div", "lp-dec");
      box.appendChild(el("p", "ln-oq", (qi + 1) + ". " + inl(q.q)));
      var ol = el("ol", "lp-opts");
      q.opts.forEach(function (o) { ol.appendChild(el("li", "", inl(o))); });
      box.appendChild(ol);
      var out = el("div", "ln-ans"), b = el("button", "btn", "I've picked one: show the strong choice");
      b.addEventListener("click", function () {
        b.remove();
        out.appendChild(el("p", "", "<b>Strong choice:</b> " + inl(q.pick)));
        out.appendChild(el("p", "", inl(q.why)));
      });
      box.appendChild(b); box.appendChild(out);
      body.appendChild(box);
    });
    (ph.prompts || []).forEach(function (p) {
      body.appendChild(el("div", "lab", inl(p.when)));
      var pre = el("pre", "cv-code lp-prompt", esc(p.text));
      var cp = el("button", "btn lp-copy", "Copy");
      cp.addEventListener("click", function () {
        (navigator.clipboard ? navigator.clipboard.writeText(p.text) : Promise.reject()).then(function () { cp.textContent = "Copied"; setTimeout(function () { cp.textContent = "Copy"; }, 1500); }, function () { cp.textContent = "Select and copy"; });
      });
      body.appendChild(pre); body.appendChild(cp);
    });
    if (ph.res && ph.res.length && window.Res) { var rs = Res.render(ph.res); if (rs) { body.appendChild(rs); } }
    d.appendChild(body);
    return d;
  }

  function tabMocks(host) {
    var s = heading(host, "mock", "Run in chat", "Mock interviews");
    s.appendChild(el("p", "lead", inl(LOOP.mockHow)));
    if (!LOOP.mocks.length) {
      s.appendChild(el("p", "when", "None yet. After a mock in chat, its read and its exchanges appear here. The latest two are kept."));
    }
    LOOP.mocks.slice(-2).reverse().forEach(function (m, mi) { drawMock(host, m, mi); });
  }
  function drawMock(host, m, mi) {
    var pre = m.id || "m" + mi;
    var s = heading(host, pre, m.when, m.title);
    var ex = m.exchanges || [];
    if (!ex.length && m.critique) { s.appendChild(el("p", "", inl(m.critique))); return; }
    var tally = {};
    ex.forEach(function (x) { tally[x.verdict] = (tally[x.verdict] || 0) + 1; });
    s.appendChild(el("p", "mk-tally", ["landed", "partly", "missed", "gap"].filter(function (k) { return tally[k]; })
      .map(function (k) { return '<span class="vd vd-' + k + '"></span>' + tally[k] + " " + (k === "gap" ? "gaps" : k); }).join('<span class="sep"></span>') +
      '<span class="sep"></span>' + ex.length + " exchanges"));
    (m.read || []).forEach(function (p) { s.appendChild(el("p", "mk-read", inl(p))); });
    if (m.landed && m.landed.length) {
      s.appendChild(el("h3", "mk-h", "What landed"));
      var ul = el("ul", "mk-list");
      m.landed.forEach(function (t) { ul.appendChild(el("li", "", inl(t))); });
      s.appendChild(ul);
    }
    if (m.fix && m.fix.length) {
      s.appendChild(el("h3", "mk-h", "Fix these first"));
      var ol = el("ol", "mk-list mk-fix");
      m.fix.forEach(function (f) {
        var li = el("li", "", inl(f.t) + " ");
        var at = ex.findIndex(function (x) { return x.id === f.ref; });
        if (at >= 0) { li.appendChild(openLink("See turn " + (at + 1), m, at)); }
        ol.appendChild(li);
      });
      s.appendChild(ol);
    }
    /* The turns, one line each; the conversation itself opens in one screen. */
    var c = heading(host, pre + "-talk", "Every turn, in one screen", "The conversation");
    var go = el("button", "btn primary", "Open the conversation");
    go.addEventListener("click", function () { openConvo(m, 0); });
    c.appendChild(el("div", "acts")).appendChild(go);
    var list = el("ol", "turns");
    ex.forEach(function (x, i) {
      var li = el("li");
      var b = el("button", "turn");
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) +
        '</span><span class="tw spk-' + esc((x.who || "").toLowerCase()) + '">' + esc(x.who) + "</span>";
      b.addEventListener("click", function () { openConvo(m, i); });
      li.appendChild(b); list.appendChild(li);
    });
    c.appendChild(list);
  }
  function openLink(text, m, i) {
    var a = el("button", "linkish", esc(text));
    a.addEventListener("click", function () { openConvo(m, i); });
    return a;
  }

  /* One screen, shared by mocks and the Prep banks: a list on the left, the chosen item on
     the right. The item's header is small; under it, the light column is for understanding
     and the dark sheet is what to say, each scrolling on its own. Arrows move; Escape closes. */
  var convo = document.getElementById("convo");
  function panelSection(host, label, nodes) {
    if (!nodes.length) { return; }
    host.appendChild(el("div", "lab", label));
    nodes.forEach(function (n) { host.appendChild(n); });
  }
  function panelList(items, cls) {
    if (!items || !items.length) { return []; }
    var u = el("ul", "mk-list " + (cls || ""));
    items.forEach(function (t) { u.appendChild(el("li", "", inl(t))); });
    return [u];
  }
  /* o: { title, sub, label, count, row(i) -> html for the rail, draw(i, pane), start } */
  function openPanel(o) {
    var cur = o.start || 0;
    convo.innerHTML = "";
    convo.setAttribute("aria-label", o.label || o.title);
    var shell = el("div", "cv");
    var rail = el("nav", "cv-rail");
    rail.appendChild(el("div", "cv-title", "<b>" + esc(o.title) + "</b>" + (o.sub ? "<span>" + esc(o.sub) + "</span>" : "")));
    var rows = [];
    for (var i = 0; i < o.count; i++) {
      (function (i) {
        var b = el("button", "turn");
        b.innerHTML = o.row(i);
        b.addEventListener("click", function () { show(i); });
        rail.appendChild(b);
        rows.push(b);
      }(i));
    }
    rail.appendChild(el("div", "cv-keys", "Up and down arrows move. Escape closes."));
    var pane = el("section", "cv-pane");
    var close = el("button", "cv-close", "Close");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", function () { convo.close(); });
    shell.appendChild(rail); shell.appendChild(pane);
    convo.appendChild(close); convo.appendChild(shell);
    function show(i) {
      cur = i;
      rows.forEach(function (b, j) { b.classList.toggle("on", j === i); if (j === i) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); } });
      rows[i].scrollIntoView({ block: "nearest" });
      pane.innerHTML = "";
      o.draw(i, pane, function () { rows[i].innerHTML = o.row(i); });
      [].forEach.call(pane.querySelectorAll(".cv-col"), function (c) { c.scrollTop = 0; });
    }
    convo.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = cur + (e.key === "ArrowDown" ? 1 : -1);
        if (n >= 0 && n < o.count) { show(n); rows[n].focus(); }
      }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    rows[cur].focus();
  }
  function panelCols(pane, leftTitle, rightTitle) {
    var cols = el("div", "cv-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "cv-col cv-say");
    left.appendChild(el("h3", "cv-h", leftTitle));
    right.appendChild(el("h3", "cv-h", rightTitle));
    cols.appendChild(left); cols.appendChild(right);
    pane.appendChild(cols);
    return { left: left, right: right, cols: cols };
  }

  /* A mock: what they asked and how it landed; what you said; what to say. */
  function openConvo(m, start) {
    var ex = m.exchanges;
    openPanel({
      title: m.title, sub: m.when, label: "Mock conversation", count: ex.length, start: start,
      row: function (i) {
        var x = ex[i];
        return '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) + "</span>";
      },
      draw: function (i, pane) {
        var x = ex[i], who = (x.who || "").toLowerCase();
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q spk-" + who, '<span class="ex-who">Turn ' + (i + 1) + " of " + ex.length + ", " + esc(x.who) + "</span>" + inl(x.q)));
        head.appendChild(el("p", "cv-verdict", '<span class="vd vd-' + esc(x.verdict) + '"></span><b>' + esc(VERDICT[x.verdict] || x.verdict) + ".</b> " + inl(x.why || "")));
        if (x.tests) { head.appendChild(el("p", "cv-tests", "<b>They were testing:</b> " + inl(x.tests))); }
        pane.appendChild(head);
        var c = panelCols(pane, "What you said", "What to say");
        panelSection(c.left, "In short", (x.said || []).map(function (p) { return el("p", "ex-said", inl(p)); }));
        panelSection(c.left, "What worked", panelList(x.good, "mk-good"));
        panelSection(c.left, "What did not", panelList(x.bad, "mk-bad"));
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.say && x.say.length) { c.right.appendChild(transcript(x.say, "You", "")); }
        panelSection(c.right, "How to approach it", panelList(x.approach));
        (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.right.appendChild(f); } });
        var links = [];
        if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
        if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
        if (links.length) { c.right.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      }
    });
  }

  /* A Prep question can be marked revised; the mark is kept in this page's storage. */
  function isRevised(id) { return !!own().rev[id]; }
  function setRevised(id, on) {
    var o = own();
    if (on) { o.rev[id] = stamp(); } else { delete o.rev[id]; }
    writeJSON(OWN, o);
  }
  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    if (tab === "overview" && p[0] && p[0] !== "overview" && LOOP.learn && p[1]) {
      var to = null;
      learnModules().forEach(function (m) { m.topics.forEach(function (t) { if ((t.was || []).indexOf(p[1]) >= 0 || t.id === p[1]) { to = t.id; } }); });
      if (to) { history.replaceState(null, "", link("learn", to)); return { tab: "learn", anchor: to }; }
    }
    return { tab: tab, anchor: p[1] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = link(t.id);
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = [];
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "rounds") { tabRounds(main); }
      else if (r.tab === "research") { tabResearch(main); }
      else if (r.tab === "learn") { tabLearn(main, r.anchor); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "live") { tabLive(main); }
      else if (r.tab === "mocks") { tabMocks(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    drawTabs(r.tab); drawSide(r.tab); progress();
    var key = r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var c = document.getElementById("count");
    if (!LOOP.when_iso) { c.textContent = "Date to be set"; return; }
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
