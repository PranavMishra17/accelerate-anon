ntities separately from intents?", "a": "A turn can get the intent right and the entity wrong, the wrong date or the wrong account, and the task still fails. An intent-only metric would score it a success."}, {"q": "Why label one primary cause per failed conversation?", "a": "The split tells you who fixes it: training data, flow design, an integration, or the product. Reported as a share of lost containment, it ranks the work."}, {"q": "What does pass^k measure, and why does it matter for an assistant?", "a": "The chance that all k runs of the same scenario succeed. A model that passes once may fail the next run; tau-bench found pass^8 under 25% in retail for agents that solved under half the tasks once."}, {"q": "What are the limits of LLM-as-judge for conversations?", "a": "Strong judges agree with humans over 80% of the time, about the human-to-human rate, but show position, verbosity and self-enhancement bias. So use a rubric with small or binary scales, randomize order, calibrate against a human-labelled set, track agreement, and never make it the only gate for compliance."}, {"q": "Containment dropped 10% after a release. What are your steps?", "a": "Confirm it is real: the metric definition, the pipeline, the traffic mix. Break it down by intent, channel, flow, page and version to find where it moved; read no-match, escalation reasons, webhook errors and abandonment by page. Roll back the regressed flow while reading transcripts for the cause, then add a regression test and an alert."}, {"q": "The fallback rate jumps overnight. What are the two usual explanations?", "a": "A new topic users started asking about, which needs an intent or content, or a regression from a release, which needs a rollback. The dashboard annotations for releases, campaigns and outages tell you which to check first."}, {"q": "The interviewer asks whether you have used Dialogflow CX. What do you say?", "a": "Not on that platform. Then the bridge: I have built the same loop, intent routing, a decision layer, failure scanning on real conversations, and I know how CX models it: flows of pages, route groups, numbered no-match handlers, test cases and experiments."}], "hasTrackerQuiz": false, "figs": []}, {"id": "wc31", "name": "Assistants at Vanguard: financial services", "blurb": "What Vanguard has shipped and staged, the rules a broker-dealer assistant lives under, the no-advice boundary and authentication, compliant generated answers, agent assist before client-facing, and your pitch.", "intro": "Tomorrow's interviewers build assistants for a firm whose CIO named two worries: hallucinations and a bot veering into financial advice. This session gives you what Vanguard has shipped, the rules its answers live under, and the designs that answer both worries, so your NLP answers land in their context. It ends with your own work mapped to theirs, and what you have not done.", "len": "1h 10m", "day": "7", "steps": [{"t": "Vanguard's assistants today", "m": 12, "out": "What do you know about how Vanguard uses conversational AI today, and what would you ask them first", "d": "Vanguard moves at two speeds: crew-facing generative AI is live, client-facing generative AI is staged and cautious. Know what is confirmed, say inference as inference, and ask early which assistant and which platform the role supports.", "pts": ["Crew-facing, live: Crew Assist, an Azure OpenAI tool where contact-center crew get answers drawn from internal content (MIT Sloan Management Review, Oct 2025); a Call Center Agent Assist in full production (Vanguard careers blog, May 2025)", "Client-facing, staged: chat on site and mobile serves more than 2 million investors a month and is gaining AI-enabled features; an AI capability in Digital Advisor pilots later in 2026 and launches early 2027 (letter to investors, May 2026)", "Employee pilot: an AI chatbot for about 2,000 employees answering questions like 'What's my account balance?'; the CIO named hallucinations and the tool 'veering into offering financial advice' as the concerns (Fortune, Dec 2025)", "Advisers: Client-Ready Article Summaries, the first client-facing generative AI, generates the necessary disclosures with each summary (beta, May 2025); Expert Insights, AI portfolio analysis, has piloted since Apr 2026", "Virtual Analyst: an internal assistant that turns analysts' questions into SQL on Amazon Bedrock with Guardrails; 50+ question-to-SQL ground-truth pairs serve as few-shot examples and as the evaluation benchmark (AWS blog, Apr 2026)", "Stack clues: postings for an agentic AI chat assistant name AWS Bedrock, LangGraph, tools backed by APIs and MCP, and Python and TypeScript; an AI Powered Experiences team builds conversational AI orchestration with WORM retention, Arize and RBAC retrieval (both from search summaries)", "Not known: no public source names the contact-center or NLU platform; Amazon Connect or Lex is plausible on an AWS-heavy stack, but that is inference, so do not assert a vendor", "Mphasis: no public Mphasis and Vanguard link was found; Mphasis is a Kore.ai Platinum Partner, so the intent and entity wording may come from its requisition (inference); ask which platform, and whether the work is classic NLU, LLM, or both"], "links": [{"label": "Vanguard prep: Vanguard and financial services", "url": "interviews/vanguard.html#/prep"}, {"label": "Guide: enterprise virtual assistant, the whole design", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant"}, {"label": "Baseline, NLP: classic NLU and LLMs together", "url": "BASELINE.html#/nlp/nlu-llm-hybrid"}], "ans": ["Crew-facing generative AI is live: Crew Assist on Azure OpenAI and a call center agent assist in production", "Client-facing is staged: chat for over 2 million investors a month gaining AI features, an AI capability in Digital Advisor piloting later in 2026", "Their leaders named the concerns: hallucinations and the bot veering into financial advice", "The postings point to Bedrock, LangGraph and MCP tools in Python and TypeScript; the phone and NLU platform is not public", "First question: which assistant this role supports, on which platform, and whether it is intents, LLM, or both"], "close": [{"k": "short", "q": "What can you say about their platform, and what must you not claim?", "a": "The postings point to AWS Bedrock, LangGraph and MCP-backed tools for the client chat assistant, and crew tools use Azure OpenAI. No source names the contact-center or NLU vendor, so ask rather than assume."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant", "label": "Enterprise virtual assistant", "why": "The enterprise assistant this session puts in a financial setting."}], "read": [{"label": "Fortune: Vanguard's CIO on the employee chatbot pilot, hallucinations and the advice guardrail", "url": "https://fortune.com/2025/12/24/vanguards-cio-niti-tandon-ai-digital-advisor/", "m": 6}, {"label": "MIT Sloan Management Review: Crew Assist on Azure OpenAI, and how Vanguard governs its AI", "url": "https://sloanreview.mit.edu/article/investing-in-ai-payoffs-at-vanguard/", "m": 10}], "figs": ["intentTaxonomy", "vaTurn"]}, {"t": "The rules an assistant at a broker-dealer lives under", "m": 13, "out": "A chatbot at a broker-dealer generates an answer. Which rules apply to it, and what do they make you build", "d": "FINRA is technology-neutral: an answer a bot generates is held to the same rules as one a person writes. Four ideas carry most questions: content standards, supervision and retention, the line between education and a recommendation, and model risk governance.", "pts": ["Rule 2210: communications must be fair and balanced, with no false, exaggerated, promissory or misleading statements and no predictions of performance; retail communications need a qualified principal's approval before use, with exceptions", "Notice 24-09: FINRA said in June 2024 that Rule 2210's content standards apply whether a human or a technology tool generates the communication, and that supervision should cover technology governance, including model risk management", "Chatbot FAQ: chatbot messages can be correspondence, retail or institutional communications depending on the audience, are supervised under Rules 2210 and 3110(b)(4), and chat sessions must be retained (InvestmentNews coverage, May 2024)", "Rule 4511: books and records are kept six years by default, in a format that meets SEA Rule 17a-4; that is why a Vanguard posting mentions WORM-based conversation retention", "Reg BI: a recommendation needs a reasonable basis that it is in the client's best interest, after understanding their profile, costs and alternatives; a bot answering 'should I sell?' without that profile cannot meet it", "Education or advice: whether a given answer is advice is a legal and compliance call; you build the technical control, compliance owns the line", "Model risk: SR 26-2 replaced SR 11-7 on 17 Apr 2026; it keeps effective challenge, validation, inventory and vendor model oversight, but a footnote puts generative and agentic AI models out of its scope, and it targets banks; Vanguard's own postings still name Model Risk Management", "FINRA 2026 report: names hallucination and bias as key risks and asks for prompt and output logging, model version tracking, human review of results, guardrails and human-in-the-loop protocols for agents"], "links": [{"label": "Vanguard prep: Vanguard and financial services", "url": "interviews/vanguard.html#/prep"}, {"label": "Baseline: guardrails", "url": "BASELINE.html#/ai/guardrails"}, {"label": "Baseline, NLP: out of scope", "url": "BASELINE.html#/nlp/out-of-scope"}], "ans": ["Rule 2210 content standards apply whether a person or a tool wrote it: fair, balanced, nothing promissory, no performance predictions", "Chat is a firm communication: supervised, and retained six years under Rule 4511 in a 17a-4 format, hence WORM", "Reg BI: a recommendation needs a best-interest basis the bot does not have, so advice-seeking turns route away", "Compliance owns where education ends and advice begins; engineering builds the control", "Model risk: SR 26-2 replaced SR 11-7 in April 2026 and puts generative AI out of its scope, so the firm's own governance and FINRA's guidance carry it"], "close": [{"k": "short", "q": "Does SR 11-7 govern an LLM assistant at Vanguard?", "a": "Say it carefully. SR 11-7 was replaced by SR 26-2 on 17 Apr 2026, which targets banks and says generative and agentic AI models are not in its scope. Vanguard's postings still name Model Risk Management, so the firm applies its own governance, and FINRA Notice 24-09 asks for model risk management within technology governance."}], "sdLinks": [], "read": [{"label": "FINRA Notice 24-09: Rule 2210 applies to AI-generated communications; model risk in supervision", "url": "https://www.finra.org/rules-guidance/notices/24-09", "m": 10}, {"label": "FINRA 2026 oversight report, GenAI: logging, version tracking, human review, agent risks", "url": "https://www.finra.org/rules-guidance/guidance/reports/2026-finra-annual-regulatory-oversight-report/gen-ai", "m": 10}], "figs": ["vaTurn"]}, {"t": "The no-advice boundary and authentication", "m": 13, "out": "A signed-in client asks 'Should I sell during this downturn?' Walk me through what the assistant does", "d": "Advice-seeking is an intent you design for, not a prompt you hope holds. Detect it, answer with approved education, route it by rule to a licensed person or the advice product, and never let the model see account data before the client is authenticated.", "pts": ["Advice intent: an explicit advice-seeking intent beside out-of-scope and chitchat, trained on real paraphrases such as 'what would you do?' and 'is it a good time to get out?'", "Two checks: a classifier on the user's turn, and a check on the final draft for recommendations, performance predictions and promissory wording", "The response: approved educational content, a plain note that it cannot advise on individual trades, and an offer of a licensed representative or Digital Advisor, the regulated advice product", "Deterministic routing: the handoff is a rule, not a model choice; it also fires on explicit request, sensitive intents (withdrawals, complaints, bereavement, suspected fraud), repeated fallback and failed authentication, and carries the transcript, intent and entities", "Authentication first: the client signs in through the app or the channel's own flow (Vanguard uses Voice ID, passkeys and security codes); the assistant gets a scoped session token, never raw credentials", "Never ask: Vanguard says it will never ask for your Social Security number or a security code you received, so the assistant must not either", "PII: redact or tokenise identifiers before logs and model calls, give the model only the account context its scoped tools return, and keep write actions behind confirmation", "Red team: a set of advice paraphrases runs in CI, and the advice-leak rate is a release gate"], "links": [{"label": "Baseline, NLP: intents and entities", "url": "BASELINE.html#/nlp/intents-entities"}, {"label": "Baseline, NLP: out of scope", "url": "BASELINE.html#/nlp/out-of-scope"}, {"label": "Baseline, NLP: conversation design", "url": "BASELINE.html#/nlp/conversation-design"}, {"label": "Guide: enterprise virtual assistant, the whole design", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant"}, {"label": "Vanguard prep: Vanguard and financial services", "url": "interviews/vanguard.html#/prep"}], "ans": ["The advice-seeking intent fires; a second check on the draft catches a recommendation or prediction that slips through", "It answers with approved education and says plainly it cannot advise on individual trades", "It offers a licensed representative or Digital Advisor; the route is a rule, and the transcript and context go with it", "Account data only after authentication, through tools scoped to that client; PII redacted from logs and prompts", "The turn is logged for supervision, and advice paraphrases sit in a red-team set that gates release"], "close": [{"k": "why", "q": "Why route advice-seeking by a deterministic rule rather than letting the LLM decide?", "a": "A rule behaves the same on every run, and it can be tested and shown to compliance. A model may route correctly once and not the next time, and one leaked recommendation is a firm communication the bot had no basis for."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant", "label": "Enterprise virtual assistant", "why": "The enterprise assistant this session puts in a financial setting."}], "read": [{"label": "SEC staff bulletin on the care obligation: what a recommendation requires, and why a bot cannot give one", "url": "https://www.sec.gov/about/divisions-offices/division-trading-markets/broker-dealers/staff-bulletin-standards-conduct-broker-dealers-investment-advisers-care-obligations", "m": 12}, {"label": "Vanguard trust and security: Voice ID, passkeys, security codes, and what Vanguard never asks for", "url": "https://investor.vanguard.com/trust-security", "m": 4}], "figs": ["thresholdBands", "repairLadder"]}, {"t": "Keeping generated answers compliant", "m": 12, "out": "How do you keep a generated answer compliant, and how would you prove it to compliance before release", "d": "Layers, not one prompt: ground the answer in vetted content the user may see, check it before it leaves, log it so it can be defended, and gate every release on an evaluation compliance trusts.", "pts": ["Approved content: retrieve only from vetted, versioned sources with an owner, and answer with citations so the model has nothing to invent from", "RBAC retrieval: permissions-aware access, so a client or crew member retrieves only what they may see; Vanguard's Head of AI/ML posting also lists source authority, freshness and lineage", "Numbers from systems: balances and dates come from API tools on systems of record, never from the model's memory", "Disclosures: attached by the system, as Vanguard's article-summary tool generates the necessary disclosures with each summary", "Guardrails: input and output checks, managed ones such as Bedrock Guardrails (named in the Virtual Analyst write-up), and a safe canned answer plus handoff when a check fails", "Retention: each turn's message, answer, retrieved sources and versions, model and prompt version, guardrail results and handoff, kept immutably; analytics get a copy with PII scrubbed", "Human review: compliance samples conversations, and a prompt or content change goes through sign-off like code; Vanguard's Writer story names Compliance and Legal as partners in the build", "Evaluation: a golden set from real conversations scored for accuracy, groundedness, hallucination, tone and refusal behaviour, with judges calibrated against compliance reviewers' labels; the posting says no capability reaches production 'without a quantitative, repeatable evaluation baseline'"], "links": [{"label": "Baseline: RAG", "url": "BASELINE.html#/ai/rag"}, {"label": "Baseline: guardrails", "url": "BASELINE.html#/ai/guardrails"}, {"label": "Baseline: evaluation", "url": "BASELINE.html#/ai/evaluation"}, {"label": "Baseline: LLM-as-judge", "url": "BASELINE.html#/ai/llm-as-judge"}, {"label": "Vanguard prep: Vanguard and financial services", "url": "interviews/vanguard.html#/prep"}], "ans": ["Retrieve only approved, versioned content the user may see, with citations; numbers come from tools", "Disclosures added by the system, output guardrails, and a safe fallback with handoff on any failed check", "Log every turn with its sources and versions, retained immutably for supervision", "A golden set scored for groundedness, hallucination, tone and refusals; judges calibrated to compliance reviewers' labels", "Every prompt or content change is a release: sign-off, regression set, rollback"], "close": [{"k": "why", "q": "How do you calibrate an LLM judge for compliance, and why is it never the only gate?", "a": "Have compliance reviewers label a set, run the judge on it and track agreement per criterion before trusting it, and re-check when the prompt or model changes. Judges show position and verbosity bias, and a missed recommendation is a regulatory failure, so people keep sampling."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Technique: Eval suites as release gates", "why": "An evaluation suite as the release gate."}], "read": [{"label": "Vanguard posting, Head of AI/ML for Advice: evaluation baselines, permissions-aware retrieval, compliance partners", "url": "https://www.vanguardjobs.com/job/23896184/head-of-ai-ml-for-advice-wealth-and-strategic-enablement-dallas-tx/", "m": 6}, {"label": "Vanguard: Client-Ready Article Summaries, generated with the necessary disclosures", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/vanguards-new-genai-capability-for-advisors.html", "m": 4}], "figs": ["ragPipeline", "evalHarness"]}, {"t": "Agent assist versus client-facing", "m": 10, "out": "Why would you ship agent assist before a client-facing assistant, and how would you measure success for each", "d": "Agent assist puts a trained person between the model and the client, so it can ship first and show you what fails. Client-facing removes that person, which raises the bar for evaluation, guardrails and monitoring.", "pts": ["Agent assist: answers go to crew, who read and judge them before the client hears anything; Vanguard's Crew Assist answers from internal content and also speeds up onboarding", "Why first: a person catches the error, the content is internal, and the users can be trained and asked for feedback; this is reasoning, consistent with the order Vanguard shipped in", "Client-facing: each answer is a firm communication with no one in between, so it needs the no-advice boundary, authentication, retention and a stricter release gate", "Evaluation changes: for assist, accuracy and usefulness judged by crew; for clients, also refusal behaviour, advice leaks, groundedness and pass^k over repeated runs", "Risk changes: assist risks a wrong answer a crew member repeats; client-facing risks a recommendation, a hallucinated number, or account data shown to the wrong person", "Assist metrics: handle time, answer accuracy and adoption, how many crew use it and how often they accept or edit a suggestion; Vanguard reports call-handling time down and satisfaction up", "Client metrics: resolution, not containment alone, with escalation reasons, repeat contact and CSAT", "Governance: Vanguard describes systems that evaluate model performance, detect bias and drift, and monitor how crew use AI"], "links": [{"label": "Baseline, NLP: assistant metrics", "url": "BASELINE.html#/nlp/assistant-metrics"}, {"label": "Guide: enterprise virtual assistant, deep dives", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives"}, {"label": "Vanguard prep: Vanguard and financial services", "url": "interviews/vanguard.html#/prep"}], "ans": ["A crew member stands between the model and the client, so errors are caught and fed back", "Client-facing answers are firm communications with no one in between: advice boundary, authentication, retention, stricter gates", "Assist success: handle time, accuracy judged by crew, adoption and acceptance rate", "Client success: resolution and repeat contact, not containment alone, plus advice-leak and groundedness rates", "Crew edits and rejections become test cases for the client-facing version"], "close": [{"k": "short", "q": "Crew adoption of agent assist is low. What do you look at first?", "a": "Whether the answers are right and fast enough to use mid-call: sample the suggestions crew ignored or edited, check retrieval misses and latency, and ask crew directly. Low adoption usually means low trust, and trust follows accuracy."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives", "label": "Enterprise virtual assistant, deep dives", "why": "Evaluation, metrics and handoff in the enterprise design."}], "read": [{"label": "PYMNTS: how Vanguard's AI, Crew Assist included, cut call-handling time", "url": "https://www.pymnts.com/artificial-intelligence-2/2025/how-vanguard-turned-ai-ambition-into-500-million-in-value/", "m": 5}, {"label": "Vanguard careers blog: Call Center Agent Assist in full production", "url": "https://www.vanguardjobs.com/career-blog/2025/05/14/ai-engineer/", "m": 4}], "figs": ["errorLoop", "evalHarness"]}, {"t": "Your pitch for Vanguard", "m": 10, "out": "Why are you a fit for this team, given you have not worked in financial services", "d": "Map your own work to their situation in under two minutes, then name plainly what you have not done. Every number and phrase comes from your master reference.", "pts": ["alfred_ routing: 'Inbound message (SMS/web) routed through intent classification → decision layer → callable tools', for 5,000+ active users", "Five verdicts: 'every candidate action classified into five verdicts (SILENT / NOTIFY / CONFIRM / CLARIFY / REFUSE) via deterministic risk scoring, not LLM-as-judge'; the same idea as a deterministic no-advice route", "Failure scanner: 'scans real production conversations, classifies genuine failures vs. expected behavior, auto-promotes real bugs for triage'; the review loop a quality or compliance team runs by hand", "Strict IDs: the working-memory pipeline made 'a whole class of hallucination structurally impossible, not probabilistically reduced'", "MetaRAG: IEEE CAI 2026, '82.5% precision' against a 73.3% baseline, '0.925 Hit Rate@10', '25% hallucination reduction'; retrieval measured on its own", "The bridge: their worries are hallucination and advice; your work is deterministic control around an LLM, failure scanning on real conversations, and measured grounding", "Not done: you have not built on an enterprise NLU platform (Lex, Dialogflow CX, Kore.ai) and have not worked in regulated finance; say so, and say you would work inside their compliance process", "Close with a question: which assistant this role supports, and how compliance signs off prompt and content changes"], "links": [{"label": "Vanguard prep: Vanguard and financial services", "url": "interviews/vanguard.html#/prep"}, {"label": "Baseline, NLP: classic NLU and LLMs together", "url": "BASELINE.html#/nlp/nlu-llm-hybrid"}, {"label": "Baseline, NLP: error analysis", "url": "BASELINE.html#/nlp/error-analysis"}, {"label": "Guide: enterprise virtual assistant, deep dives", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives"}], "ans": ["alfred_: intent classification, a decision layer and callable tools, for 5,000+ active users", "Every action gets one of five verdicts by deterministic risk scoring, not LLM-as-judge: the shape of a no-advice route", "A production-failure scanner finds genuine failures in real conversations and promotes them to triage", "MetaRAG: 82.5% precision, 0.925 Hit Rate@10, 25% hallucination reduction, with retrieval measured on its own", "Plainly: no enterprise NLU platform and no regulated finance yet; I would learn their controls first and build inside them"], "close": [{"k": "short", "q": "They ask whether you have worked under financial regulation. What do you say?", "a": "No, not in finance. Then the bridge: I have built deterministic controls around an LLM, so the risky decisions do not depend on the model, and I know the frame here: Rule 2210 content standards, retention under Rule 4511, and Reg BI's line on recommendations, with compliance owning that line."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives", "label": "Enterprise virtual assistant, deep dives", "why": "Evaluation, metrics and handoff in the enterprise design."}], "read": [{"label": "Vanguard posting via aggregator, AI Engineer on AI Powered Experiences: the team closest to this role", "url": "https://freehire.me/jobs/ai-engineer-vanguard-dpyotss6", "m": 4}, {"label": "Vanguard research: The AI advice frontier, what investors trust and fear", "url": "https://corporate.vanguard.com/content/dam/corp/research/pdf/the_ai_advice_frontier.pdf", "m": 15}], "figs": ["errorLoop"]}], "study": [], "quiz": [{"q": "What can you say about their platform, and what must you not claim?", "a": "The postings point to AWS Bedrock, LangGraph and MCP-backed tools for the client chat assistant, and crew tools use Azure OpenAI. No source names the contact-center or NLU vendor, so ask rather than assume."}, {"q": "Does SR 11-7 govern an LLM assistant at Vanguard?", "a": "Say it carefully. SR 11-7 was replaced by SR 26-2 on 17 Apr 2026, which targets banks and says generative and agentic AI models are not in its scope. Vanguard's postings still name Model Risk Management, so the firm applies its own governance, and FINRA Notice 24-09 asks for model risk management within technology governance."}, {"q": "Why route advice-seeking by a deterministic rule rather than letting the LLM decide?", "a": "A rule behaves the same on every run, and it can be tested and shown to compliance. A model may route correctly once and not the next time, and one leaked recommendation is a firm communication the bot had no basis for."}, {"q": "How do you calibrate an LLM judge for compliance, and why is it never the only gate?", "a": "Have compliance reviewers label a set, run the judge on it and track agreement per criterion before trusting it, and re-check when the prompt or model changes. Judges show position and verbosity bias, and a missed recommendation is a regulatory failure, so people keep sampling."}, {"q": "Crew adoption of agent assist is low. What do you look at first?", "a": "Whether the answers are right and fast enough to use mid-call: sample the suggestions crew ignored or edited, check retrieval misses and latency, and ask crew directly. Low adoption usually means low trust, and trust follows accuracy."}, {"q": "They ask whether you have worked under financial regulation. What do you say?", "a": "No, not in finance. Then the bridge: I have built deterministic controls around an LLM, so the risky decisions do not depend on the model, and I know the frame here: Rule 2210 content standards, retention under Rule 4511, and Reg BI's line on recommendations, with compliance owning that line."}], "hasTrackerQuiz": false, "figs": []}], "scripts": [{"id": "intro", "title": "Tell me about yourself", "length": "about 90 seconds", "when": "The opener. Land on conversational AI and the NLP under it.", "probes": ["What does alfred_ do?", "What do you own there?", "Have you worked on a chatbot or virtual assistant?", "Which NLU platforms have you used?"], "say": ["Sure. I started out in computer science research at UIC, where I worked on applied ML and LLM systems. That gave me a pretty strong foundation in actually building and evaluating these systems, rather than just using the models.", "From there I joined WheelPrice, which was a much more startup-oriented environment. I was working across the stack and got a lot more exposure to shipping things that were actually being used by customers. It was a small engineering team, so I had to be pretty broad — backend, AI, infrastructure, and product work all kind of blended together.", "After that I joined alfred_, where I've been working as a founding LLM engineer. It's an AI assistant, and my work has become much more focused on reliability and evaluation — things like building the eval harness, production failure detection, working memory, and making sure agent changes actually improve the product rather than just looking better on a benchmark.", "The common thread through all of that has really been building AI systems in environments where you don't have a perfectly defined problem in front of you. You have to figure out what's broken, decide what to build, and then own it through production.", "And the closest part to this role is what sits in front of the agent. At alfred_ a fast first pass decides whether a message can be answered or needs the heavier agent, things like 'that email' resolve to real records, anything that sends goes through a confirm step in code, and a scanner reads real conversations every day to find what went wrong. So building an assistant and improving it from its transcripts is pretty much the work I already do."], "swaps": [{"when": "If they ask what alfred_ is, in a line", "line": "An AI executive assistant that works over text message and the web. It handles people's email and calendar end to end, for 5,000-plus active users."}, {"when": "If they ask which NLU platforms you've used", "line": "Honestly, not Dialogflow or Lex in production. I've built the layer in front of LLM agents myself: routing, entity resolution, confirmation in code. The understanding there is an LLM with typed tool schemas, not a trained classifier, but the modelling and the error analysis are the same work, and I'd pick up the platform quickly."}], "land": "Research, shipping, production assistants, and the layer in front of the agent: understanding and improving it from real conversations.", "notes": ["Paragraphs 1 to 4 are your words, unchanged from ZenML and Coframe. Only the last line is new, pointed at conversational AI.", "About ninety seconds. Stop after the last line and let them choose where to go."], "never": ["Never say you've used Dialogflow, Lex, CLU, Rasa, Kore.ai or Cognigy.", "Never mention alfred_'s funding, a crunch, or colleagues' names."]}, {"id": "why-role", "title": "Why this role?", "length": "about 60 seconds", "when": "After the intro, or when they ask why Vanguard or why conversational AI.", "probes": ["Why Vanguard?", "What do you know about our assistants?", "Why classic NLU when everyone is moving to LLMs?"], "say": ["Honestly, it's the way Vanguard is doing it. From what I read, the generative AI went to crew first, Crew Assist and agent assist in the contact center, and the client-facing side is staged: summaries for advisers in beta, then a pilot inside Digital Advisor. I think that's the right order, and it's how I'd do it.", "And the concern your CIO named, keeping the bot from veering into advice and watching for hallucinations, is pretty much the problem I work on. At alfred_ anything that sends or deletes goes through a confirm step in code before it runs, and a scanner reads real conversations every day to find what went wrong.", "The two areas in the role are the two halves of what I do. One is the assistant: how the conversation is designed, how intents and entities are modelled, and how you find and fix what's going wrong in production. The other is the NLP underneath: classification, embeddings, how the models work.", "So it's the work I already do, in a place where being right matters more than being first."], "swaps": [{"when": "If they ask why classic NLU at all", "line": "I think the classic layer is the part you can measure and control: a confusion matrix, a threshold, a test set. The LLM is great for the long tail and out-of-scope. Most good assistants I've read about use both, and that's how alfred_ works too."}, {"when": "If they ask what you know about the scale", "line": "From what I read, your chat already serves more than 2 million investors a month, and you're adding AI features to it. At that volume a small error rate is a lot of people, so the evaluation has to come first."}], "land": "Vanguard is doing generative AI in the right order, and keeping an assistant inside its lines is my daily work.", "notes": ["New, in your voice. Vanguard's facts come from SOURCES: say 'from what I read', and don't name a vendor for their chat; none is public.", "Say 'your CIO', not a name. If they ask why a contract role through Mphasis, that's logistics: one line, then back to the work."]}, {"id": "closest", "title": "What have you built that's closest to this?", "length": "about 2 minutes", "when": "When they ask about your experience with chatbots, virtual assistants or NLU. Outcome first, one design choice, then stop.", "probes": ["How does the first pass decide to escalate?", "How do you decide when to ask the user?", "How do you find failures?", "Was any of it on a platform like Dialogflow?"], "say": ["The closest is alfred_. It's an AI assistant over text and the web. A fast first pass answers what it can from what it can read and escalates the rest to a heavier agent, and code guards turn a reply that promises an action into an escalation instead of shipping it. I also built entity resolution in chat, so 'the second email' or 'that meeting' points at a real record, and the confirm flow: anything that sends gets a preview first and runs only on an explicit confirm, with floors in code that no prompt can override.", "Then error analysis. I built a production failure scanner that reads real conversations, separates genuine failures from expected behaviour, and promotes the real bugs for triage. Those feed a replay bench of real production turns, graded by a person, so a change is judged on what users actually hit before it ships.", "Before that, MockFlow-AI: a real-time voice interview platform I built from scratch, under 400 milliseconds end to end. The conversation moves through stages in a state machine, and the model can only move it by calling a transition tool. That's the nearest thing I've built to flows and pages.", "And on the NLP side, MetaRAG at UIC: TF-IDF weighted embeddings with recursive chunking got 82.5% precision against a 73.3% baseline, and 0.925 Hit Rate at 10."], "swaps": [{"when": "If they ask about WheelPrice", "line": "At WheelPrice I built an AI fitment assistant that could only answer through tools against verified data."}, {"when": "If they ask about a classic platform", "line": "Not in production. The concepts map closely: a page with a form in Dialogflow CX is a stage with required slots, and a route is a transition. I'd want a week with their taxonomy and their transcripts."}, {"when": "If they ask about voice", "line": "I own alfred_'s voice agent, phone and web. In MockFlow-AI the pipeline was Deepgram Nova-2 for speech and Silero for voice activity."}], "land": "A first pass that answers or escalates, entity resolution in chat, a confirm flow in code and a failure scanner in production; stages driven by tools in voice; TF-IDF weighted embeddings in research.", "notes": ["Checked against the alfred_ code on 2 October 2026 by your alfred_ agent: what is live is the first pass with its guards, entity resolution in chat, the confirm flow with code floors and idempotency, the grounding guards, and the failure scanner. The verdict gate (policyGate) was removed on 3 August; talk only about what is live.", "There is no risk score, no five verdicts and no trained intent classifier in the code today. The full map, with what is an LLM and what is code, is in the private alfred_ module on the Learn tab.", "The fitment line is worded as on the Coframe page; there is no more detail in your master reference, so don't add any."], "never": ["Don't call alfred_'s classifier 'Dialogflow-like' or name a platform you haven't used."]}, {"id": "logistics", "title": "Logistics they may ask", "length": "a line each", "when": "Your answers are in chat, not on this page. Vanguard's team rarely asks; Mphasis will.", "probes": ["Are you available full time?", "Where are you based? Remote or on site?", "When could you start?", "Work authorization?", "Rate?"], "say": [], "land": "Say each once, then back to the role.", "notes": ["**Rate and terms:** for Mphasis, never Vanguard's team. Your number is in chat.", "**Location, start date, work authorization:** your answers from chat, one sentence each.", "**Duration:** ask Mphasis afterwards; similar postings run 6 to 12 months."], "never": ["Don't negotiate with Vanguard's team."]}], "drills": [{"id": "intro", "prompt": "Tell me about yourself.", "target": "90 seconds", "seconds": 90, "ref": "#say-intro"}, {"id": "why-role", "prompt": "Why this role?", "target": "60 seconds", "seconds": 60, "ref": "#say-why-role"}, {"id": "two-intents", "prompt": "Two intents keep getting confused. What do you do?", "target": "90 seconds", "seconds": 90, "ref": "#q-two-intents"}, {"id": "attention", "prompt": "Explain attention to me.", "target": "90 seconds", "seconds": 90, "ref": "#q-attention"}], "qa": [], "ask": [], "ask3": [{"id": "client", "title": "For Vanguard's team", "when": "The platform question early if nobody has said; the rest at the end.", "why": "The platform and the assistant aren't public, so the first answer reframes everything after it. The rest show you think about evaluation, compliance and failure, not only building.", "how": ["Ask the platform question in the first minutes, plainly.", "At the end, one or two; listen fully, then one follow-up on what they said."], "items": [{"to": "Vanguard's team", "q": "Which assistant does this role support: the investor chat, the phone channel, or crew-facing agent assist? And what does it run on?", "loop": "Early, if it hasn't come up.", "why": "Tells you which half of your prep to lean on, and lets you use their words."}, {"to": "Vanguard's team", "q": "Is there an intent and entity layer beside the LLM and agent layer, or are they being merged?", "loop": "With the platform question.", "why": "The two areas in the invite read like both; this settles it."}, {"to": "Vanguard's team", "q": "How do you evaluate a change before it ships, and who approves it?", "loop": "At the end, first.", "why": "Shows evaluation is how you work; their answer tells you how mature the loop is."}, {"to": "Vanguard's team", "q": "Where does compliance review sit: on each prompt and content change, or on releases?", "loop": "At the end.", "why": "The real constraint on how fast the assistant can change."}, {"to": "Vanguard's team", "q": "What would the first 90 days look like for someone in this role?", "loop": "At the end.", "why": "What they need first, and what success looks like to them."}, {"to": "Vanguard's team", "q": "What's the hardest failure the assistant has right now?", "loop": "Last, if there's time.", "why": "You want the real problem; it's also what you'd work on first."}]}, {"id": "mphasis", "title": "For Mphasis, afterwards", "when": "After the call, by message or phone.", "why": "Practical questions for Mphasis, never Vanguard's team.", "how": ["Rate and terms stay in chat; settle them with Mphasis."], "items": [{"to": "Mphasis", "q": "What's the scope of the role: which Vanguard team, which assistant, and who I'd work with day to day?", "loop": "After the call.", "why": "What you'd actually be doing."}, {"to": "Mphasis", "q": "How long is the engagement, and what are the next steps after this call?", "loop": "After the call.", "why": "Duration and process."}, {"to": "Mphasis", "q": "Rate and terms.", "loop": "With Mphasis only.", "why": "Your numbers are in chat."}]}], "traps": [], "tables": [], "admire": "", "kitaruLead": "", "figures": [], "mockHow": "Say 'run the Vanguard mock' in chat: Vanguard's engineers, scenario-led, 30 minutes.", "mocks": [], "planKicker": "Before Wednesday, 3 PM", "mechTitle": "", "designLink": null, "extra": "<b>Work in this order.<\/b> 1. Skim <a href=\"#/overview/onepage\">the one page<\/a> above. 2. Learn: take the path a module at a time, learn, check, explain, say; the squares show where you stand. 3. Test: 'Test me on everything' until the weak squares turn. 4. Your work: the alfred_ module (private, on this device) before any mock. 5. Mock: say 'run the Vanguard mock' in chat. Deeper material sits in the tracker sessions wc25 to wc31 and the guide's <a href=\"../SYSTEM%20DESIGN.html#/designs/virtual-assistant\" target=\"_blank\" rel=\"noopener\">enterprise virtual assistant<\/a>.", "emphasis": [], "own": null, "showUp": [["Lead with what you've built that matches.", "At alfred_ a fast first pass answers or escalates to a heavier agent, entities in chat resolve to real records, and anything that sends goes through a preview and an explicit confirm, with floors in code. A production failure scanner reads real conversations and separates genuine failures from expected behaviour. MetaRAG used TF-IDF weighted embeddings: 82.5% precision against a 73.3% baseline."], ["Ask about the platform early.", "Vanguard's assistant platform isn't public. In the first minutes ask which assistant the role supports (the investor chat, the phone channel, or crew-facing agent assist) and what it runs on: Vanguard's own stack on AWS, or a platform Mphasis brings. Mphasis is a Kore.ai partner, so Kore.ai is possible; that's inference, so ask, don't assume. Then use their words."], ["Hold the financial-services line.", "No investment advice: an advice-seeking question goes to a licensed person or the advice product, and compliance owns where education ends and advice starts. Authenticated before any account data, and the assistant never asks for a password, a full SSN or a security code; Vanguard's own security page says it never asks for a security code."], ["Say the platforms plainly.", "You haven't shipped on Dialogflow CX, Cognigy, Lex, CLU or Kore.ai. Say it once, then what carries over: the NLU underneath, the error analysis and the evals are the same work, and you know how each platform models intents, thresholds and fallbacks."], ["Answer a scenario with a method.", "What you'd check first, how you'd split the cause, the fix, and how you'd know it worked. 'Two intents are confused' starts at the confusion matrix and the actual utterances, not at the F1."], ["Numbers, exactly.", "5,000-plus active users at alfred_; per-user LLM cost down about 30%; notifications about 90 seconds to about 3. MetaRAG: 82.5% precision, 0.925 Hit@10, 25% hallucination reduction, p99 under 300 ms at 10K queries a day. MockFlow-AI: sub-400ms end to end. Vanguard's numbers are 'from what I read'."], ["Have the hybrid answer ready.", "A fast classifier for confident turns, an LLM for the uncertain ones and for out-of-scope, and deterministic code for anything that moves money or data. One Amazon paper measured that routing within 2% of the LLM's accuracy at half the latency."], ["Theory: the mechanism, then where you used it.", "Attention, embeddings, calibration: two sentences on how it works, one on where it showed up in your work. Then stop and let them go deeper."], ["Logistics: one line each.", "Rate, duration, location and start date: your answers are in chat. They are for Mphasis afterwards, not Vanguard's team."]], "prepLead": "Say comes last. Each area is taught first in its session, and every question here links back to that session, its Baseline topic and the reading. Then your story out loud with the timer, and two drills: two intents confused, and attention.", "storyBlurb": "Your intro, why this role, the work closest to it, and logistics.", "sources": [{"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/salim-letter-to-investors-2026.html", "label": "Vanguard: letter to investors, 2026", "why": "Chat serves more than 2 million investors a month, AI features being added; an AI capability in Digital Advisor pilots later in 2026 and launches early 2027."}, {"url": "https://fortune.com/2025/12/24/vanguards-cio-niti-tandon-ai-digital-advisor/", "label": "Fortune: Vanguard's CIO on AI (Dec 2025)", "why": "A chatbot piloted with about 2,000 employees; the CIO's concerns are hallucinations and the bot veering into financial advice."}, {"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/vanguards-new-genai-capability-for-advisors.html", "label": "Vanguard: generative AI article summaries for advisers (May 2025)", "why": "Its first client-facing generative AI, in beta; it generates the disclosures that go with each summary."}, {"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/who-we-are/pressroom/press-release-vanguard-launches-expert-insights-equipping-advisors-with-ai-powered-portfolio-analysis-expertise-04092026.html", "label": "Vanguard: Expert Insights for advisers (Apr 2026)", "why": "AI portfolio analysis, piloted with select advisers."}, {"url": "https://sloanreview.mit.edu/article/investing-in-ai-payoffs-at-vanguard/", "label": "MIT Sloan Management Review: AI payoffs at Vanguard", "why": "Crew Assist on Azure OpenAI for contact-center crew; governance that evaluates models, detects bias and drift, and monitors use."}, {"url": "https://www.vanguardjobs.com/career-blog/2025/05/14/ai-engineer/", "label": "Vanguard careers blog: an AI engineer's work (May 2025)", "why": "Call Center Agent Assist in full production: generative AI for client service representatives."}, {"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/responsibly-scaling-ai-to-better-serve-our-clients.html", "label": "Vanguard: responsibly scaling AI (May 2026)", "why": "Augment, not replace; trust and accuracy; AI diffused into the system."}, {"url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/why-vanguard/sets-us-apart/client-centered-technology.html", "label": "Vanguard: client-centered technology", "why": "Enhancing phone and chat support; 85% of systems moved to the cloud in five years."}, {"url": "https://aws.amazon.com/blogs/machine-learning/building-ai-ready-data-vanguards-virtual-analyst-journey/", "label": "AWS blog: Vanguard's Virtual Analyst (Apr 2026)", "why": "Natural-language questions to SQL on Amazon Bedrock with Guardrails; 50-plus ground-truth pairs used as few-shot examples and as the evaluation set."}, {"url": "https://corporate.vanguard.com/content/dam/corp/research/pdf/the_ai_advice_frontier.pdf", "label": "Vanguard research: The AI advice frontier (Sept 2026)", "why": "About one in three investors used AI for financial guidance; most trust it little; they want human oversight and embedded disclosures."}, {"url": "https://investor.vanguard.com/trust-security", "label": "Vanguard: trust and security", "why": "Voice ID, passkeys, security codes; Vanguard never asks for login details, an SSN or a security code."}, {"url": "https://www.vanguardjobs.com/job/23810105/lead-cloud-agentic-ai-engineer-dallas-tx/", "label": "Vanguard posting: Lead Cloud and Agentic AI Engineer", "why": "Agentic AI on Amazon Bedrock, RAG and agent orchestration; evaluation and responsible AI preferred. Another team, the same stack."}, {"url": "https://www.vanguardjobs.com/job/23896184/head-of-ai-ml-for-advice-wealth-and-strategic-enablement-dallas-tx/", "label": "Vanguard posting: Head of AI/ML for Advice, Wealth and Strategic Enablement", "why": "Evaluation baselines before production, human-in-the-loop, deterministic fallbacks, escalation to a human advisor, Model Risk Management."}, {"url": "https://freehire.me/jobs/ai-engineer-vanguard-dpyotss6", "label": "Vanguard posting (aggregator): AI Engineer, AI Powered Experiences", "why": "Builds the team's conversational AI orchestration platforms and shared AI infrastructure; Python or TypeScript, AWS."}, {"url": "https://www.mphasis.com/home/mphasis-ai-partnership.html", "label": "Mphasis: AI partnerships", "why": "Mphasis calls itself Kore.ai's only distinguished Platinum Partner for conversational and generative AI. Names no client."}, {"url": "https://www.finra.org/rules-guidance/notices/24-09", "label": "FINRA Regulatory Notice 24-09", "why": "Rules are technology-neutral: Rule 2210 content standards apply whether a person or a tool wrote it; supervision covers model risk."}, {"url": "https://www.investmentnews.com/regulation-and-legislation/finra-clarifies-guidelines-around-ai-chatbot-communications/253319", "label": "InvestmentNews: FINRA on AI chatbot communications (May 2024)", "why": "Chatbot messages are firm communications: supervised, held to content standards, retained."}, {"url": "https://www.finra.org/rules-guidance/rulebooks/finra-rules/2210", "label": "FINRA Rule 2210: communications with the public", "why": "Fair and balanced; no promissory or misleading statements; no performance predictions."}, {"url": "https://www.finra.org/rules-guidance/guidance/reports/2026-finra-annual-regulatory-oversight-report/gen-ai", "label": "FINRA 2026 oversight report: generative AI", "why": "Prompt and output logging, model version tracking, human review; agents acting beyond scope."}, {"url": "https://www.finra.org/rules-guidance/rulebooks/finra-rules/4511", "label": "FINRA Rule 4511: books and records", "why": "Six years by default, in a format that meets SEA Rule 17a-4."}, {"url": "https://www.sec.gov/about/divisions-offices/division-trading-markets/broker-dealers/staff-bulletin-standards-conduct-broker-dealers-investment-advisers-care-obligations", "label": "SEC staff bulletin: care obligations", "why": "A recommendation needs a reasonable basis in the client's profile, costs and alternatives. Why a bot can't answer 'should I sell?'."}, {"url": "https://writer.com/blog/vanguard-customer-story/", "label": "Writer: Vanguard customer story", "why": "Compliance, Legal and IT as partners in the build from the start; 'practical, risk-minded'."}, {"url": "https://www.federalreserve.gov/supervisionreg/srletters/SR2602.pdf", "label": "Federal Reserve SR 26-2: revised model risk guidance (17 Apr 2026)", "why": "Supersedes SR 11-7; keeps effective challenge, validation and monitoring; footnote 3 puts generative and agentic AI outside its scope."}, {"label": "Similar posting: Conversational AI Developer, Galaxy i Technologies (Dice)", "url": "https://www.dice.com/job-detail/6d7bd820-388e-4d39-81e7-ed0e087eda91", "why": "Dialogflow CX, CCAI, BigQuery, Node.js, GCP; chatbots and voicebots, multi-turn with error handling, webhooks; creating intents and entities."}, {"label": "Similar posting: Google Cloud Conversational AI Developer, ASCII Group (Dice)", "url": "https://www.dice.com/job-detail/5e08da59-2148-4749-a3af-2f9ea6de0edd", "why": "The same Dialogflow CX and CCAI stack."}, {"label": "Similar posting: NICE CXone / Cognigy developer, United Technology (Dice)", "url": "https://www.dice.com/job-detail/e40592e9-8c84-4401-a025-29818721572b", "why": "Cognigy flows, voicebots and IVR, REST, production troubleshooting; NLU and intent recognition preferred."}, {"label": "Similar posting: Lead Conversational AI Developer, SGA (Dice)", "url": "https://www.dice.com/job-detail/73324714-ba9d-4272-8005-59ec7d82649c", "why": "Azure Bot Framework v4, C#/.NET, Azure OpenAI preferred."}, {"label": "Similar posting: Chatbot Developer, Triwave (Dice)", "url": "https://www.dice.com/job-detail/40145e8c-0dba-4647-8f94-b4d273073754", "why": "Bot Framework moving to Microsoft's agents stack; classical NLU combined with LLMs for routing."}, {"label": "Similar posting: Senior AI Engineer, Conversational and Agentic AI, Trigint (Dice)", "url": "https://www.dice.com/job-detail/e0fd510e-109e-4e54-965f-19db6101e5e3", "why": "AWS Bedrock and AgentCore, RAG, embeddings, MCP, multi-turn, Langfuse, Ragas; Lex or Connect nice to have."}, {"label": "Similar posting: Conversational AI Engineer, Eversana", "url": "https://zapply.jobs/jobs/63d1956f-79c2-48e5-ad45-9e1934e6ee9e/", "why": "Cognigy, NLU and intent modelling, production issue analysis; GenAI nice to have."}], "company": ["Vanguard is an investment manager, not a bank, serving investors, advisers and retirement plans. Its assistants today are staged by risk. Crew-facing generative AI is live: Crew Assist, on Azure OpenAI, answers contact-center crew from internal content, and Call Center Agent Assist is in full production. Client-facing work is careful and staged: article summaries for advisers in beta (May 2025) that generate their own disclosures, Expert Insights piloted with advisers (April 2026), and an AI capability inside Digital Advisor piloting later in 2026. Its investor chat already serves more than 2 million people a month. The concerns its CIO named are hallucinations and the bot veering into financial advice.", "Stack clues from Vanguard's own material: AWS (85% of systems moved to the cloud), Amazon Bedrock with Guardrails for its Virtual Analyst, and postings that ask for Bedrock, RAG, agent orchestration, evaluation and Model Risk Management, with Python or TypeScript. Summaries of the chat-assistant team's postings, now closed, also name LangGraph and MCP, but those were seen only in search results. No source names the vendor of the investor chat or the phone channel; don't assume one.", "Mphasis organises the call; no public source links Mphasis and Vanguard, so this is most likely a placement into a Vanguard team (inference). Mphasis calls itself Kore.ai's only distinguished Platinum Partner, so ask early which platform the role supports: Kore.ai through Mphasis, or Vanguard's own stack. That too is inference, not fact."], "posting": {"lead": "Rama at Mphasis sent the two areas the interview will concentrate on (1 October), quoted: “Conversational AI: Build and enhance complex virtual assistants, including conversation design, intent/entity modeling, error analysis, and production improvements.” And “Deep NLP & LLM: Strong expertise in NLP, text classification, embeddings, LLM fundamentals, and Transformer architecture.” The lists below come from those two areas and from similar postings, not from Vanguard.", "facts": [["Client", "Vanguard: the team you would join"], ["Arranged by", "Mphasis (Rama sent the invite and the two areas)"], ["When", "Wednesday 7 October, 3:00 PM"], ["Platform", "Not confirmed: ask early in the call"]], "does": ["Build and extend virtual assistants for chat and voice: multi-turn flows, prompts, reprompts and error handling.", "Model intents and entities: the taxonomy, training phrases, entity types, slots and confidence thresholds.", "Write webhooks and fulfillment that connect the assistant to backend systems (from similar postings).", "Analyse production transcripts: misclassified intents, fallbacks and escalations, fixed in batches.", "Improve the assistant from analytics: containment, no-match and escalation rates, A/B tests of flows.", "Add LLMs where they help: generative fallback, retrieval for FAQs, routing for uncertain turns."], "wants": ["Strong NLP: text classification, embeddings, LLM fundamentals and the Transformer.", "Conversation design for chat and voice.", "An enterprise NLU platform: Dialogflow CX and CCAI most often in similar postings, or Cognigy, Azure Bot Framework and CLU, Amazon Lex.", "Production troubleshooting and error analysis on real conversations.", "Generative AI with guardrails: RAG, prompting, evaluation.", "APIs and integrations: REST, Node.js or Python, a cloud platform (from similar postings)."]}, "rounds": [], "research": null, "learn": {"lead": "One path through everything for this call. Each topic: learn it, check yourself with multiple choice (say 'I don't know' when you don't, tick 'I'm guessing' when you are), explain the open question aloud, then compare and rate yourself. The squares show where you stand; test a module or everything, weakest first.", "onepage": {"lead": "The points to know before the call, from your banking copilot handbook and the research. Skim it; anything that doesn't click in one read, open its topic. Say only what you can explain one level down: they will dig into any term you use, and 'I don't know, but here is how I'd find out' is a good answer.", "points": [{"t": "The thesis.", "d": "Use models where language ambiguity is the hard part, deterministic systems where correctness is: a deterministic financial core with a probabilistic language interface.", "to": "map-eras"}, {"t": "The boundary.", "d": "The model interprets, retrieves, summarises and proposes. It is never the source of truth for money, positions, identity, permissions, policy or execution state.", "to": "grounding-mechanics"}, {"t": "Three modes.", "d": "Insight is read-only and cites; recommendation is simulation with no action; action needs policy, auth, explicit confirmation and idempotent execution.", "to": "grounding-advice"}, {"t": "The flow, tagged.", "d": "Normalise (code), route by intent and entities (model and code), retrieve (code), plan or answer (model), policy and tool call (code), execute and verify (code), respond grounded.", "to": "map-turn"}, {"t": "Intent and entity.", "d": "Intent is what they want; an entity is what you need to do it. Resolve entities to real ids through APIs, never from a nickname.", "to": "nlu-entities"}, {"t": "Two contracts.", "d": "A conversation API for the user and a bounded tool API for the model; each tool declares a side-effect class: read-only, reversible, or consequential.", "to": "nlu-tools"}, {"t": "Durable intent.", "d": "Write the action with an idempotency key before calling the provider; on a timeout, check status before retrying. 'Probably sent' is not a financial state.", "to": "grounding-transactions"}, {"t": "Routing.", "d": "A cheap calibrated classifier for the high-volume intents, an LLM for low-confidence or compound turns. Calibration means 0.92 is right about 92% of the time.", "to": "classify-confidence"}, {"t": "Hybrid retrieval.", "d": "BM25 for exact terms, dense for paraphrase, fuse and rerank, then access and effective date in code. A matched retired policy is still wrong.", "to": "grounding-knowledge"}, {"t": "State over transcript.", "d": "Compact dialogue state with real ids plus a short window; never cache balances or execution status without a freshness contract.", "to": "nlu-state"}, {"t": "Representations.", "d": "TF-IDF is hard to beat on narrow tasks; static, contextual and sentence embeddings each have a job; embeddings are an index, not a ledger.", "to": "classify-representations"}, {"t": "Tokenizers.", "d": "BPE merges frequent pairs, WordPiece merges by likelihood gain, SentencePiece trains BPE or unigram tokenizers on raw text.", "to": "llm-tokens"}, {"t": "Eval per layer.", "d": "Routing F1 and the confusion matrix, entity resolution, Recall@K, grounded claims, task success and cost, duplicate actions. Review by volume times cost times severity.", "to": "eval-layers"}, {"t": "Containment is not the KPI.", "d": "Put it next to confirmed resolution, repeat contact and abandonment; containment rises when people give up.", "to": "errors-metrics"}, {"t": "Transformer whys.", "d": "The square root of d_k keeps softmax out of saturation; heads learn different subspaces; attention is quadratic, the KV cache linear; FlashAttention moves less memory with the same maths.", "to": "llm-attention"}]}, "modules": [{"id": "map", "title": "The map of NLP and conversational AI", "blurb": "Place any term they use on one map: the stages of an assistant turn, the eras of the stack, and the NLP underneath.", "sessions": ["wc25"], "topics": [{"id": "map-turn", "title": "One turn through the stack", "brief": "A conversational assistant is a stack of stages, not one model: text or speech comes in, understanding turns it into an intent and entities, dialogue management decides the next step against the state, the backend does the work, and a reply goes out. The nuance people miss: errors compound down the chain, so a 95% accurate ASR feeding a 98% accurate NLU gets about 93% of turns through both, and each stage needs its own metric.", "points": ["Input: text from chat or SMS, or audio that ASR turns into text; for voice, endpointing decides when the user has finished", "Understanding (NLU): the intent is text classification, entities and slots are sequence labelling, and out-of-scope is the option to answer 'none of these'", "Dialogue management: holds the state (what has been collected, where the user is in the task) and picks the next action: ask, confirm, call the backend, hand off", "Backend and tools: the APIs that look up a balance or move money; the only stage that changes anything in the world", "Response generation: templates or approved copy in classic bots, an LLM phrasing the result in newer ones; TTS speaks it for voice", "Around the stack: safety checks, logging and evaluation at every stage, and a path to a human"], "figs": ["vaTurn", "voicePipeline"], "production": ["Classic platforms (Dialogflow CX, Lex, CLU, Rasa, Kore.ai, Cognigy) build this as classification plus labelling plus a state machine", "LLM-first stacks fold understanding and generation into one model, but keep classifiers and embeddings in front as routers and guards", "A small classifier answers in milliseconds on a CPU, against about a second for an LLM call, so it takes the confident turns and sends only uncertain or open-ended ones to the LLM", "Voice adds ASR at the front and TTS at the back, and the user talking again can interrupt any stage"], "mcq": [{"q": "A voice bot's ASR is 95% accurate and its NLU is 98% accurate. Roughly what share of turns get through both stages correctly?", "o": ["About 98%, because the NLU sets the ceiling", "About 95%, because the weaker stage sets the ceiling", "About 93%, because the errors compound down the chain", "About 96.5%, the average of the two stages", "Above 98%, because the NLU repairs most ASR errors"], "a": 2, "why": "0.95 times 0.98 is about 0.93 if the errors are independent. In practice it is often worse, because an NLU trained on clean typed text does badly on transcripts with recognition errors."}, {"q": "A user says 'move 500 dollars to savings'. Which stage should own the decision that a confirmation is needed before the transfer runs?", "o": ["The dialogue manager, applying a rule for money movement", "The NLU model, since it extracted the amount", "The response generator, when it phrases the reply", "The backend API, after the transfer has posted", "The ASR, based on its transcription confidence"], "a": 0, "why": "Deciding the next action is the dialogue manager's job, and a money rule belongs in code there. Low ASR or NLU confidence can raise the need to confirm, but they feed the decision rather than own it."}, {"q": "Which pairing of assistant stage and NLP task is right?", "o": ["Intent is sequence labelling; entities are text classification", "Intent is retrieval; entities are text generation", "Intent is generation; entities are retrieval", "Intent is text classification; entities are sequence labelling", "Intent is language modelling; entities are parsing"], "a": 3, "why": "An intent is one label for the whole message, a classification. Entities are spans inside it, so each token gets a label: sequence labelling, the same family as NER.", "pair": "intent-vs-entity"}], "open": {"q": "Walk me through what happens in one turn when a customer types 'what's my balance on the Roth' to a bank assistant.", "probe": "Whether you see the assistant as a stack with a job per stage, or as one model that does everything", "a": ["Text comes in and is normalized; for voice, ASR and endpointing come first", "NLU returns the intent (check balance) and an entity (account type: Roth IRA), with confidence", "Dialogue management checks the state: is the user authenticated, does 'the Roth' resolve to one of their accounts, is anything missing", "The backend balance API returns the figure from the system of record; the model never produces the number", "The reply is a template or an LLM phrasing the number it was given, logged for evaluation; if any stage is unsure, it clarifies or hands off"]}, "say": ["**I think of the assistant as a stack, not one model.**", "**Understand:** something reads the message and works out what the person wants.", "**Decide:** something holds the state and picks the next step.", "**Do:** the backend does the work. At alfred_ the model picks a typed tool, and the things in play live outside it as entities with ids, so 'that meeting' resolves to a real record.", "The model can propose. Code decides what actually runs."], "avoid": ["Saying alfred_ has a trained intent classifier: intent and slots come from an LLM with typed tool schemas, validated in code"], "was": [], "res": [{"kind": "video", "req": true, "label": "Voice agent pipeline explained: VAD, STT, LLM and TTS", "url": "https://www.youtube.com/watch?v=SPB2T-eLrOg", "m": 11, "why": "Walks one spoken turn stage by stage (endpointing, ASR, model, TTS), which is the 'one turn through the stack' you narrate for voice.", "yt": {"id": "SPB2T-eLrOg", "ch": "LiveKit"}}, {"kind": "video", "req": true, "label": "Task-oriented dialogue (UT Austin NLP)", "url": "https://www.youtube.com/watch?v=JXfAkX7kvnM", "m": 12, "why": "The classic text-side chain in one lecture: understanding, dialogue state, policy, backend call, generated reply.", "yt": {"id": "JXfAkX7kvnM", "ch": "Greg Durrett"}}, {"kind": "video", "req": false, "label": "NLP vs NLU vs NLG", "url": "https://www.youtube.com/watch?v=1I6bQ12VxV0", "m": 7, "why": "Separates reading the message from deciding and writing, so each stage gets its own name and metric.", "yt": {"id": "1I6bQ12VxV0", "ch": "IBM Technology"}}, {"kind": "read", "req": true, "label": "Microsoft Learn: Conversational language understanding overview", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/overview", "m": 8, "why": "Shows what a production NLU stage returns for one utterance: a top intent with confidence plus extracted entities."}, {"kind": "read", "req": false, "label": "Amazon Lex V2 core concepts", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/how-it-works.html", "m": 8, "why": "Names the same stages a bank bot runs (intent, slots, fulfilment, response) from a vendor's own vocabulary."}, {"kind": "read", "req": false, "label": "Rasa docs: Conversational AI with language models", "url": "https://rasa.com/docs/learn/concepts/calm/", "m": 6, "why": "Shows how an LLM-era assistant splits understanding, flow logic and the reply for one turn."}]}, {"id": "map-nlu", "title": "Understanding: intent, entities, out-of-scope", "brief": "NLU turns one message into a structured guess: which task the user wants (the intent), the values it needs (entities, which fill slots), and whether it is something the assistant handles at all. The nuance: out-of-scope is a first-class answer. Without it, a classifier forces every message into the nearest intent, and the confident wrong answer is worse than asking again.", "points": ["Intent: a label for what the user wants done, chosen from a fixed set; a text classification problem", "Entities: the values inside the message (an amount, a date, an account type), found by prebuilt extractors, lists with synonyms, regexes or a learned tagger", "Slots: the entities a task needs; the ones collected so far are part of the dialogue state", "Out-of-scope: a 'none of these' outcome, from a trained negative intent or a confidence threshold", "Confidence: the score that decides act, confirm or fall back; useful only if it is calibrated, so a 0.9 is right about 90% of the time"], "figs": ["intentTaxonomy", "thresholdBands"], "production": ["The platforms name the out-of-scope part: CLU's None intent, Dialogflow CX's default negative intent and no-match event, Lex's AMAZON.FallbackIntent", "Entities mix extractors: prebuilt dates and numbers, lists with synonyms for closed sets, regex plus validation for IDs", "LLM-first stacks get intent and slots from function calling: each tool is an intent and its typed arguments are slots", "Microsoft CLU reports per-intent precision, recall and F1 with a confusion matrix, because overall accuracy hides weak intents"], "mcq": [{"q": "A flight bot is told 'I want to buy a book' and confidently returns BookFlight. What is its NLU missing?", "o": ["A better entity extractor for product names", "An out-of-scope outcome, a negative intent or a threshold", "More training phrases for the BookFlight intent", "A larger language model behind the classifier", "A dialogue state tracker for the whole session"], "a": 1, "why": "A classifier with no 'none of these' option must pick some intent. Near misses like 'buy a book' are exactly what a negative intent or a threshold is for."}, {"q": "'Transfer 200 to my savings tomorrow.' Which split into intent and entities is right?", "o": ["Intent: savings; entities: transfer, 200, tomorrow", "Intents: transfer and schedule; no entities needed", "Intent: tomorrow; entities: the amount and the account", "One intent per account type, here transfer_to_savings", "Intent: transfer; entities: amount, destination account, date"], "a": 4, "why": "The action is the intent and the information it needs is entities. One intent per account type multiplies near-duplicate intents that collide.", "pair": "intent-vs-entity"}, {"q": "Why must a confidence score be calibrated before you set act, confirm and fall-back thresholds on it?", "o": ["So the scores across all intents add up to exactly one", "So the model trains faster on the next data refresh", "So the top intent always scores above 0.5", "So a 0.9 score is right about 90% of the time", "So one threshold works for every future model version"], "a": 3, "why": "A threshold is a bet on what a score means. An overconfident model can be wrong at 0.99, which makes any cutoff meaningless. Softmax scores summing to one says nothing about calibration."}], "open": {"q": "A customer writes 'my card got eaten by the ATM, send a new one to my old address'. What does your NLU return, and what is hard about it?", "probe": "Intent against entities, multi-part messages, and knowing when not to guess", "a": ["The main intent is replace card, with the card as an entity that has to resolve to one of their cards", "'My old address' is an entity that needs resolving against records, and it hides a second request: an address change", "Classic NLU returns one intent per turn, so the second request is split out, queued, or handled by a planner", "An address change is high risk, so it needs authentication and an explicit confirmation before anything ships", "If the scores are close or the reference is ambiguous, ask one short question instead of guessing"]}, "say": ["**The intent is the task, the entities are the values it needs, and I always keep a 'none of these' answer.**", "**Honest start:** at alfred_ we don't have a trained intent classifier or an NER model.", "**What we do:** intent and slots come from an LLM picking typed tools, and code validates the arguments.", "**Entities:** contacts and events are resolved by deterministic code with thresholds.", "Same parts, different machinery."], "avoid": ["Calling softmax scores 'probabilities you can trust' without calibration"], "was": [], "res": [{"kind": "video", "req": true, "label": "What is conversational language understanding? (AI-900)", "url": "https://www.youtube.com/watch?v=T-RrAETmZ0I", "m": 6, "why": "Defines intents, utterances and entities in CLU in six minutes, using the same vocabulary as the question.", "yt": {"id": "T-RrAETmZ0I", "ch": "Refactored"}}, {"kind": "video", "req": true, "label": "Understanding pages, intents and routes in Dialogflow CX", "url": "https://www.youtube.com/watch?v=PrxtVjvbYak", "m": 6, "why": "Shows how an intent is matched on a page and how a route fires, which is what the NLU result feeds.", "yt": {"id": "PrxtVjvbYak", "ch": "Peter Fessel"}}, {"kind": "video", "req": false, "label": "Rasa Algorithm Whiteboard: Fallback Detection", "url": "https://www.youtube.com/watch?v=VldHznqAYlE", "m": 13, "yt": {"id": "VldHznqAYlE", "ch": "Rasa"}, "why": "Covers the none-of-these outcome and a confidence threshold, the out-of-scope half of the question."}, {"kind": "read", "req": true, "label": "Microsoft Learn: Entity components in CLU", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/entity-components", "m": 10, "why": "Explains learned, list and prebuilt entity components, and how overlapping ones are resolved, the hard part of the ATM example."}, {"kind": "read", "req": false, "label": "Microsoft Learn: CLU None intent", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/none-intent", "m": 5, "why": "How out-of-scope is modelled as a trained intent and a score threshold."}, {"kind": "read", "req": false, "label": "Google Cloud: Dialogflow CX intents", "url": "https://cloud.google.com/dialogflow/cx/docs/concept/intent", "m": 10, "why": "Training phrases, parameters annotated in a phrase, and how a match score drives the no-match path."}]}, {"id": "map-dialogue", "title": "Dialogue state, the backend and the reply", "brief": "Dialogue management is the part that remembers and decides: it holds the state (slots collected, where the user is, whether they are authenticated) and chooses the next action. The backend executes and the reply reports. The nuance: state must live in code with real ids, not only in the transcript, because the transcript is what a model can misread.", "points": ["Dialogue state: the structured record at each turn: active task, slots filled, pending action, authentication status", "Policy: the rule for the next step: ask for a missing slot, confirm, call the backend, clarify or hand off", "Classic form: a state machine, such as Dialogflow CX pages, Lex slot elicitation or Rasa flows", "Backend and tools: typed APIs with server-side validation; the model may propose a call, code authorises it", "Response generation: approved copy for anything regulated, an LLM for phrasing; figures come from the backend, never from the model"], "figs": ["agentLoop", "schemaRepair"], "production": ["Dialogflow CX: flows are topics and pages are states, each with a form of required parameters and routes out", "Rasa CALM: an LLM turns the message into commands such as start flow or set slot, and deterministic flows run the steps", "Wells Fargo's Fargo, as reported: the LLM extracts intent and entities, while the APIs for transfers and lookups never pass through it", "A balance or order status is fetched and then phrased; the model is never the source of the number"], "mcq": [{"q": "Halfway through a transfer the user says 'actually make it 500'. Where should the new amount go so later steps use it?", "o": ["Only in the transcript, which the model rereads each turn", "In the NLU training data for the transfer intent", "Into the slot in the dialogue state, then reconfirmed", "Into the response template for the confirmation", "Straight to the backend, sending the transfer at once"], "a": 2, "why": "The slot store is the authoritative state, so a correction updates the slot and triggers a fresh confirmation. Leaving it only in the transcript means a later step may read the old value."}, {"q": "Why do teams keep templates or approved copy for some replies even with an LLM in the stack?", "o": ["Templates always read more naturally than generated text", "LLMs cannot produce text in a fixed format", "Templates remove the need to track dialogue state", "Approved copy makes the NLU more accurate", "Regulated statements and figures must match what was approved or fetched"], "a": 4, "why": "A disclosure or a balance has to be exactly right, not plausibly worded. Generation is fine for phrasing around content the system already owns."}], "open": {"q": "In an LLM-based assistant, where does dialogue state live, and why not let the model keep it in the conversation?", "probe": "Whether you know the transcript is context, not authoritative state", "a": ["State is a structured record: active task, slots, pending action, auth status, the ids of the things in play", "Keep it in code and give the model a compact slice of it plus a short transcript window", "Long transcripts get misread or truncated, and the same message can behave differently in a fresh session and a long one", "References like 'the second email' resolve to ids held in state, and the backend reads the state, not prose", "The trade-off is more engineering, but the state becomes testable and replayable"]}, "say": ["**The state lives in code, and the model gets a compact view of it.**", "**What I built:** entity management in chat, where an email, an event or a contact is a typed entity with an id and a lifetime outside the model.", "**Why it helps:** 'that meeting' resolves to a real record instead of a guess.", "**What the model sees:** a compact slice of that state plus a short transcript window.", "The transcript is context. The state is the truth."], "avoid": ["Saying the model 'remembers' the account or the order: say where the id is held"], "was": [], "res": [{"kind": "video", "req": true, "label": "Conversational AI assistants with CALM: architecture of an assistant", "url": "https://www.youtube.com/watch?v=zzUY5T9I730", "m": 5, "why": "Shows where state, flows and the LLM sit, and why the model proposes steps while the system keeps the state.", "yt": {"id": "zzUY5T9I730", "ch": "Rasa"}}, {"kind": "video", "req": true, "label": "Memory and Slots in Rasa", "url": "https://www.youtube.com/watch?v=Ss1xRQv9jWg", "m": 7, "why": "What a slot is, how it is filled, and how it persists across turns outside the model.", "yt": {"id": "Ss1xRQv9jWg", "ch": "Rasa"}}, {"kind": "video", "req": false, "label": "Form filling in Dialogflow CX (slot filling)", "url": "https://www.youtube.com/watch?v=Sa85lRuCEIs", "m": 15, "why": "The classic version of dialogue state: required parameters, prompts for missing ones, and the page that holds them.", "yt": {"id": "Sa85lRuCEIs", "ch": "Peter Fessel"}}, {"kind": "read", "req": true, "label": "Rasa docs: Slots", "url": "https://rasa.com/docs/reference/primitives/slots/", "m": 10, "why": "Slots as the structured state store: types, mappings from the user message, and influence on the flow."}, {"kind": "read", "req": true, "label": "Google Cloud: Dialogflow CX pages", "url": "https://cloud.google.com/dialogflow/cx/docs/concept/page", "m": 10, "why": "A page as the unit of dialogue state, with form parameters, entry fulfilment and routes."}, {"
