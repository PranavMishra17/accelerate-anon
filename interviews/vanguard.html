be.com/watch?v=S6XY9mFRHGs", "m": 6, "yt": {"id": "S6XY9mFRHGs", "ch": "Cohere"}, "why": "MTEB task types and how to read the leaderboard."}, {"kind": "video", "req": false, "label": "BERTopic for topic modeling (Maarten Grootendorst)", "url": "https://www.youtube.com/watch?v=uZxQz87lb84", "m": 54, "why": "Embedding choice and clustering behaviour on real text; watch for the part on picking an encoder.", "yt": {"id": "uZxQz87lb84", "ch": "Cohere"}}, {"kind": "read", "req": true, "label": "Hugging Face: MTEB leaderboard", "url": "https://huggingface.co/spaces/mteb/leaderboard", "m": 5, "why": "Filter to your task and language; check it live."}, {"kind": "read", "req": true, "label": "arXiv: FinMTEB, Finance Massive Text Embedding Benchmark", "url": "https://arxiv.org/html/2502.10990v2", "m": 20, "why": "Why general leaderboard rank fails on finance text, with FinMTEB tasks."}, {"kind": "read", "req": false, "label": "Amazon Lex: Using confidence scores", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/confidence-scores.html", "m": 6, "why": "Governance-friendly pattern: score thresholds you can audit."}]}, {"id": "classify-embed-ops", "title": "Vector search, routing, discovery and drift", "brief": "In an assistant one embedding layer does several jobs: nearest-neighbour search for retrieval, semantic routing in front of the LLM, and clustering missed turns to find new intents. The nuance: a router is still a classifier, so it needs per-route thresholds and regression tests, and changing the embedding model invalidates every stored vector and every threshold tuned on them.", "points": ["Index choice: flat (exact) to about a million vectors; HNSW, a layered proximity graph searched by greedy descent, high recall and speed at high memory (knobs M, efConstruction, efSearch); IVF, k-means cells of which nprobe are searched; PQ, short codes per sub-vector for 10 to 50 times less memory; IVF-PQ for billions", "Semantic routing: embed example utterances per route, send a query to the nearest route above a similarity threshold, otherwise to a default or a clarifier; fast, deterministic and auditable", "Router limits: negation, entity-dependent meaning, and context-dependent replies like 'yes' or 'the second one', which must be read against the last question before routing", "Intent discovery: embed logs, reduce with UMAP, cluster with HDBSCAN (no cluster count needed, and it marks noise), have an LLM name the clusters, and a person approves an intent only if one flow can serve every member", "Dedupe: near-duplicate utterances inflate head intents and leak across splits, so dedupe by embedding similarity before splitting", "Model changes and drift: vectors from different models are not comparable even at the same dimension, so re-embed into a parallel index, compare recall on a golden set, then cut over; monitor live embeddings against a reference window"], "figs": ["annIndex", "vaTurn"], "production": ["semantic-router (Aurelio Labs): routes defined by example utterances and matched by cosine similarity, skipping an LLM call for the routing decision; keep utterance sets versioned and tested against a frozen regression set, since one loose example can steal a neighbour's traffic", "Intercom's Fin team (vendor-reported): extract the key question with a small LLM, embed with all-MiniLM-L6-v2, UMAP then HDBSCAN, recursive clustering and LLM naming; new conversations below 0.5 similarity to every centroid are flagged as emerging; clustering choices mattered more than the embedding model", "Evidently compared five embedding-drift methods and recommends a classifier-based ROC AUC (train a model to tell reference from current embeddings; near 0.5 means no shift) as the default", "pgvector is fine to a few million vectors and keeps the data in your database; dedicated engines add scale and filtering; measure recall@k against exact search on your data, then pick the cheapest index that holds it"], "mcq": [{"q": "HNSW recall is too low at an acceptable latency. Which knob do you turn first?", "o": ["Raise nprobe, so more cells are searched", "Shrink the PQ code size", "Raise efSearch, widening the candidate list at query time", "Lower M, so the graph gets sparser", "Switch the metric from cosine to dot product"], "a": 2, "why": "efSearch is HNSW's query-time recall and latency knob. nprobe belongs to IVF, and a sparser graph lowers recall.", "pair": "hnsw-vs-ivf"}, {"q": "In an IVF index, what does nprobe control?", "o": ["How many graph neighbours each node keeps", "How many cells the space is split into at build time", "How many bytes each PQ code uses", "How many results are returned to the caller", "How many of the nearest k-means cells are searched per query"], "a": 4, "why": "nprobe trades recall for latency at query time. The number of cells set at build time is nlist; neighbours per node is HNSW's M.", "pair": "hnsw-vs-ivf"}, {"q": "The assistant asks 'Do you want to cancel the transfer?' and the user replies 'yes'. The semantic router sends 'yes' to greetings. What is the fix?", "o": ["Read the reply against the pending question before routing; bare confirmations should not go through the router alone", "Add 'yes' as an example utterance on the cancel-transfer route", "Lower the router threshold so 'yes' reaches more routes", "Use a bigger embedding model that understands 'yes'", "Treat 'yes' as out-of-scope and ask the user to rephrase"], "a": 0, "why": "'Yes' means nothing without the question it answers. Adding it to one route would steal every other route's confirmations."}, {"q": "You upgrade the embedding model. What must happen to the existing vectors?", "o": ["Nothing, if the new model has the same dimension", "Re-embed only new documents; old vectors stay comparable", "Rescale the old vectors to unit length to align the spaces", "Re-embed everything into a parallel index, check recall on a golden set, cut over, and re-tune thresholds", "Average old and new vectors during a transition window"], "a": 3, "why": "Each model defines its own vector space, so mixed vectors give meaningless similarities. A parallel index lets you prove recall before switching traffic."}], "open": {"q": "Design how embeddings are used across a bank's virtual assistant, and how you keep them healthy over time.", "probe": "Whether you see the router, retrieval and discovery as classifiers and as dependencies with versions.", "a": ["Router: example utterances per route, per-route thresholds, a default or clarifier below; context resolves bare replies first", "Retrieval: hybrid BM25 plus dense, flat or HNSW to start, entitlement filters, a reranker", "Discovery: cluster missed and fallback turns weekly with HDBSCAN; a person approves new intents", "Hygiene: versioned utterance sets and a frozen regression set; dedupe before splitting", "The model is a pinned dependency: parallel re-embed and a golden-set check before cutover; monitor drift and fallback rate"]}, "say": ["**I'd use one embedding layer for three jobs: routing, retrieval and finding new intents.**", "**Router:** a fast one in front of the LLM. It's still a classifier, so it gets per-route thresholds and a regression set.", "**Bare replies:** a plain 'yes' is read against the last question before it goes anywhere. That's close to the entity resolution I built at alfred_, where 'that meeting' resolves to a real record kept outside the model.", "**Discovery:** I'd cluster missed turns to find new intents.", "**Pinned model:** an upgrade means re-embedding into a parallel index and checking recall before cutting over.", "The embedding model is a dependency, so I version it like one."], "avoid": ["Saying a semantic router is not a classifier: it is nearest-neighbour classification and needs the same thresholds and tests."], "was": ["q-hnsw-ivf-and-pq-what-are-they-and-when-do-you-use-each", "e-semantic-routing", "e-intent-discovery", "e-embedding-ops"], "res": [{"kind": "video", "req": true, "label": "Vector search with LLMs", "url": "https://www.youtube.com/watch?v=YDdKiQNw80c", "m": 21, "why": "Vector search end to end, with indexing and retrieval.", "yt": {"id": "YDdKiQNw80c", "ch": "Computerphile"}}, {"kind": "video", "req": false, "label": "Vector database search: HNSW explained", "url": "https://www.youtube.com/watch?v=77QH0Y2PYKg", "m": 9, "why": "How HNSW search works and why it is approximate.", "yt": {"id": "77QH0Y2PYKg", "ch": "DataMListic"}}, {"kind": "video", "req": false, "label": "How to use UMAP and HDBSCAN to surface insights and discover issues", "url": "https://www.youtube.com/watch?v=g5DZuRDnOGY", "m": 30, "why": "The intent-discovery loop: embed logs, reduce, cluster, read the clusters.", "yt": {"id": "g5DZuRDnOGY", "ch": "Arize AI"}}, {"kind": "read", "req": false, "label": "FAISS wiki: Faiss indexes", "url": "https://github.com/facebookresearch/faiss/wiki/Faiss-indexes", "m": 15, "why": "Flat, IVF and HNSW indexes and the memory and recall trade-offs."}, {"kind": "read", "req": true, "label": "GitHub: aurelio-labs/semantic-router", "url": "https://github.com/aurelio-labs/semantic-router", "m": 10, "why": "Semantic routing in code: utterances per route, thresholds and a route layer."}, {"kind": "read", "req": false, "label": "BERTopic: The algorithm", "url": "https://bertopic.readthedocs.io/en/latest/algorithm/algorithm.html", "m": 8, "why": "Embed, reduce, cluster, label: the discovery pipeline in five steps."}]}], "day": "Day 1, Sunday 4 Oct"}, {"id": "llm", "title": "LLMs and the Transformer", "blurb": "Explain attention, the block, the three shapes, the KV cache, tokens, decoding, post-training and the prompt, RAG or tune choice exactly, at the depth a good engineer will dig to.", "sessions": ["wc27"], "topics": [{"id": "llm-attention", "title": "Attention and the square root of d_k", "brief": "Attention builds each token's new vector as a weighted mix of every token's value, with the weights coming from how well its query matches each key, for all positions in one parallel step. The nuance people miss: dividing the scores by √d_k is a variance fix. Without it, scores grow with dimension, the softmax saturates to near one-hot and the gradients vanish.", "points": ["Q, K and V: each token's vector is multiplied by three learned matrices into a query (what am I looking for), a key (what do I contain) and a value (what I hand over if chosen)", "The operation: softmax(QKᵀ / √d_k) V; one query is scored against every key by dot product, the softmax turns that row of scores into weights that sum to 1, and the output is the weighted sum of the values", "Why √d_k: if query and key entries are independent with mean 0 and variance 1, their dot product over d_k dimensions has variance d_k and standard deviation √d_k; dividing by √d_k brings the scores back to unit variance", "Saturation: large scores push the softmax to near one-hot, where its gradients are close to zero and learning stalls; dividing by d_k instead would overshoot (variance 1/d_k), leaving the weights near uniform", "Self against cross: self-attention takes Q, K and V from one sequence; cross-attention takes queries from the decoder and keys and values from the encoder output (translation, T5)", "Causal mask: scores for positions after i are set to minus infinity before the softmax, so token i sees only the past; that is what lets one training sequence act as many next-token predictions at once"], "figs": ["qkvAttention", "attention"], "production": ["The original Transformer: d_model 512 and 8 heads, so d_k = 64 and every score is divided by 8", "GPT-3 175B: 96 heads of 128 dimensions, so its scale is 1/√128, about 0.088", "Cost: the score matrix is n by n per head and per layer, which is why long context is expensive (see the KV cache topic)"], "mcq": [{"q": "Why are attention scores divided by √dₖ before the softmax?", "o": ["So that each row of attention weights sums to exactly 1", "To keep the dot products near unit variance so the softmax does not saturate", "To make attention cost grow linearly with sequence length", "To cancel the scale added by the residual connection", "To keep each value vector at unit length before the weighted sum"], "a": 1, "why": "Dot products of dₖ-dimensional unit-variance vectors have variance dₖ. Large scores push the softmax to near one-hot with tiny gradients; dividing by the standard deviation √dₖ restores unit variance. The softmax itself makes rows sum to 1."}, {"q": "A colleague divides the scores by dₖ instead of √dₖ, with dₖ = 128. What happens?", "o": ["Nothing, because the softmax is unchanged when all scores are scaled", "The softmax saturates to one-hot sooner and gradients vanish", "The causal mask stops working because masked scores are no longer minus infinity", "Scores shrink toward zero, weights go near uniform and attention loses selectivity", "Training speeds up because the gradients through the softmax get larger"], "a": 3, "why": "Dividing by dₖ leaves variance 1/dₖ, so every score is close to zero and the softmax spreads weight almost evenly. Softmax is invariant to adding a constant, not to scaling.", "pair": "softmax-shift-vs-scale"}, {"q": "Which change to every score in one row leaves the attention weights exactly unchanged?", "o": ["Adding the same constant to every score", "Multiplying every score by the same positive constant", "Dividing every score by √dₖ", "Squaring every score before the softmax", "Replacing the largest score with zero"], "a": 0, "why": "exp(s + c) factors out as exp(c), which cancels in the normalisation. Scaling changes how peaked the distribution is, which is exactly why the √dₖ factor matters.", "pair": "softmax-shift-vs-scale"}], "open": {"q": "Draw attention for me, then tell me why the scores are divided by the square root of d_k.", "probe": "Whether you know the mechanism and the reason for the scale, not only the formula.", "a": ["Project each token into a query, a key and a value with three learned matrices", "Score one query against every key by dot product, softmax the row into weights, output the weighted sum of values; every position does this in parallel", "With unit-variance entries, a dot product over d_k dimensions has variance d_k, so scores grow with dimension", "Big scores saturate the softmax into near one-hot, where gradients are tiny; dividing by √d_k, the standard deviation, restores unit variance", "Example: the original paper used d_k = 64, so every score is divided by 8"]}, "say": ["**I think of attention as a soft lookup.**", "**Query, key, value:** each token asks with its query, every token answers with its key, and the softmax decides how much of each value to take.", "**Why the square root:** dot products grow with dimension, so without dividing by √dₖ the softmax goes almost one-hot and stops learning.", "**Example:** the original paper had dₖ = 64, so every score is divided by 8.", "I built a Transformer from scratch for English to German translation at UIC, so this is the part I'm happiest to draw."], "avoid": ["Saying the scale normalises the weights to sum to one: that is the softmax's job.", "Calling attention linear in length: the score matrix is n by n."], "was": ["q-attention", "q-why-divide-the-attention-scores-by-the-square-root-of-d-k"], "res": [{"kind": "clip", "req": true, "label": "Explainer: the transformer, one block", "url": "../media/videos/transformer-one-block.mp4", "m": 4, "why": "Why attention replaced recurrence: queries, keys and values on one sentence, the scaled softmax, heads, residuals, and predicting the next token."}, {"kind": "video", "req": true, "label": "Why scaling by the square root of dimensions matters in attention", "url": "https://www.youtube.com/watch?v=5S_o0bDJdZA", "m": 21, "why": "Answers the square root of d_k part directly.", "yt": {"id": "5S_o0bDJdZA", "ch": "Learn With Jay"}}, {"kind": "video", "req": true, "label": "Attention in transformers, step-by-step", "url": "https://www.youtube.com/watch?v=eMlx5fFNoYc", "m": 27, "why": "Q, K and V and the softmax scoring step drawn out.", "yt": {"id": "eMlx5fFNoYc", "ch": "3Blue1Brown"}}, {"kind": "video", "req": false, "label": "Visual guide to transformer neural networks, episode 2: multi-head and self-attention", "url": "https://www.youtube.com/watch?v=mMa2PmYJlCo", "m": 16, "why": "Heads and the self versus cross split.", "yt": {"id": "mMa2PmYJlCo", "ch": "Hedu AI by Batool Haider"}}, {"kind": "read", "req": false, "label": "Jay Alammar: The Illustrated Transformer", "url": "https://jalammar.github.io/illustrated-transformer/", "m": 25, "why": "Self-attention step by step and the causal mask."}, {"kind": "read", "req": false, "label": "Sebastian Raschka: Understanding and coding self-attention", "url": "https://magazine.sebastianraschka.com/p/understanding-and-coding-self-attention", "m": 25, "why": "The same operation in code."}]}, {"id": "llm-block", "title": "Inside one block: heads, position, norms, feed-forward", "brief": "A Transformer is one block repeated N times: normalise, attend, add the input back; normalise, a feed-forward network on each token, add back. Several heads track several relations at the cost of one, and position has to be injected because attention ignores order. The nuance: about two thirds of a layer's parameters sit in the feed-forward network, not in attention.", "points": ["Multi-head: h attentions run in parallel on d_k = d_model / h dimensions, are concatenated and projected by W_O; about the same parameters and compute as one full-width head, with each head free to learn a different relation", "Position: attention by itself is order-blind, so position is added: sinusoids summed into the embeddings (the original), learned absolute vectors (BERT up to 512, GPT-2 up to 1,024), or RoPE", "RoPE: rotates pairs of dimensions in each query and key by an angle proportional to position, with a different frequency per pair, so their dot product depends only on relative distance; applied to Q and K (not V) in every layer; the default in Llama-style models; going past the trained length needs frequency scaling, it is not free", "Residual and norm: each sublayer adds its output back to x; the original put the norm after the add (post-LN) and needed learning-rate warmup; pre-LN normalises before the sublayer and trains stably without it (Xiong et al., 2020); many LLMs use RMSNorm, which drops the mean subtraction", "Feed-forward: per token, expand to about 4 times d_model, a nonlinearity, project back; that is 8 d² of the roughly 12 d² parameters per layer, so about two thirds; Llama-style models use a gated variant, SwiGLU", "Rough sizes: 12 × layers × d_model² ignores embeddings; GPT-3, 96 layers at 12,288, gives about 174B against the published 175B; BERT-base is 12 layers, 768 hidden, 12 heads, about 110M with its embeddings"], "figs": ["transformerBlock"], "production": ["Llama 2 7B: 32 layers, d_model 4096, 32 heads of 128, pre-norm with RMSNorm, RoPE and SwiGLU", "Long-context versions of RoPE models (position interpolation, NTK-aware scaling, YaRN) rescale the rotation frequencies and then fine-tune briefly on longer text", "Budget arithmetic: training compute is about 6 × parameters × tokens; inference is about 2 × parameters per generated token"], "mcq": [{"q": "Splitting one 512-wide attention into 8 heads of 64 mainly buys what?", "o": ["Eight times the parameters, which is where the extra quality comes from", "Linear cost in length, because each head reads one eighth of the tokens", "Several relations attended at once, at about the same parameters and compute", "No need for position information, because heads specialise by position", "A separate feed-forward network per head, which adds capacity"], "a": 2, "why": "Each head works on d_model / h dimensions, so the projections total the same size as one wide head. Every head still sees every token; the gain is that heads can learn different relations."}, {"q": "Why does RoPE make the query-key score depend on relative position?", "o": ["It adds a learned vector for each position to the embeddings at the input", "It rotates the value vectors so the output encodes distance", "It masks every token outside a fixed window around the query", "It adds sine and cosine waves to the token embeddings once, before layer 1", "Rotating q by angle mθ and k by nθ leaves their dot product a function of m minus n"], "a": 4, "why": "A rotation preserves lengths, and the dot product of two rotated vectors depends on the difference of their angles. Learned absolute vectors and sinusoids added at the input are the older schemes."}, {"q": "A decoder has d_model = 4096 and 32 layers. Roughly how many parameters are in its blocks, embeddings excluded?", "o": ["About 0.5B", "About 6.4B", "About 1.6B", "About 25.8B", "About 64B"], "a": 1, "why": "12 × 32 × 4096² is about 6.44B: 4d² per layer for the Q, K, V and output projections and 8d² for a 4x feed-forward. That is the scale of a 7B model once embeddings are added."}], "open": {"q": "Walk me through one block of a modern decoder like Llama, and tell me where the parameters live.", "probe": "Whether you know the whole layer and its modern variants, not only attention.", "a": ["RMSNorm, then causal multi-head attention with RoPE applied to queries and keys, then add the input back", "RMSNorm again, a per-token feed-forward network (SwiGLU in Llama) about 4 times wider, add back; the block repeats N times", "Residuals keep gradients flowing through deep stacks; pre-norm trains stably without the warmup post-norm needed", "Per layer, about 4 d² in attention and 8 d² in the feed-forward network, so the FFN holds about two thirds", "Check: GPT-3, 96 layers at 12,288, gives about 174B by 12 × L × d², close to the published 175B"]}, "say": ["**One block is: normalise, attend, add the input back, then normalise, a feed-forward on each token, add back, repeated N times.**", "**Heads:** they let it look for several things at once at the same cost.", "**Position:** attention doesn't know order, so it has to be put in. In Llama-style models that's RoPE, which rotates the queries and keys so the score depends on distance.", "**Where the weights are:** about two thirds sit in the feed-forward part, not in attention.", "People are often surprised by that last one."], "avoid": ["Saying RoPE extends to any length for free: past the training length it needs frequency scaling and usually some fine-tuning."], "was": ["q-why-multiple-heads-and-how-does-position-get-in", "q-walk-me-through-one-transformer-block"], "res": [{"kind": "clip", "req": true, "label": "Explainer: the transformer, one block", "url": "../media/videos/transformer-one-block.mp4", "m": 4, "why": "Why attention replaced recurrence: queries, keys and values on one sentence, the scaled softmax, heads, residuals, and predicting the next token."}, {"kind": "video", "req": true, "label": "Llama 2 architecture explained: RoPE, SwiGLU, RMSNorm and GQA", "url": "https://www.youtube.com/watch?v=LotF2PRhOY4", "m": 18, "why": "One decoder block laid out in order, with where each piece sits.", "yt": {"id": "LotF2PRhOY4", "ch": "Papers by Hand"}}, {"kind": "video", "req": true, "label": "How might LLMs store facts", "url": "https://www.youtube.com/watch?v=9-Jl0dxWQs8", "m": 23, "why": "Where the feed-forward layers sit and why most parameters live there.", "yt": {"id": "9-Jl0dxWQs8", "ch": "3Blue1Brown"}}, {"kind": "video", "req": false, "label": "LLaMA explained: KV cache, rotary embeddings, RMS norm, grouped-query attention", "url": "https://www.youtube.com/watch?v=Mn_9W1nCFLo", "m": 71, "why": "Deeper walk-through of the same block; watch the RoPE and RMSNorm segments.", "yt": {"id": "Mn_9W1nCFLo", "ch": "Umar Jamil"}}, {"kind": "read", "req": false, "label": "Su et al.: RoFormer, rotary position embedding", "url": "https://arxiv.org/abs/2104.09864", "m": 20, "why": "Sections 3.1 to 3.4: how the rotation encodes relative position."}, {"kind": "read", "req": false, "label": "Xiong et al.: On layer normalization in the Transformer architecture", "url": "https://arxiv.org/abs/2002.04745", "m": 20, "why": "Pre-norm against post-norm and why gradients behave better."}]}, {"id": "llm-shapes", "title": "Encoder, decoder, encoder-decoder", "brief": "The mask and the training objective decide the shape. BERT is an encoder that sees both sides and is trained on masked tokens, so it understands but does not generate; GPT is a causal decoder trained on the next token, so it generates; T5 and BART read with an encoder and write with a decoder. The nuance: instruction-tuned decoders now classify by prompting, but for high-volume understanding a small encoder is still far cheaper and faster.", "points": ["Masked LM (BERT): hide about 15% of tokens (of those, 80% become [MASK], 10% a random token, 10% unchanged) and predict them from both sides, which gives strong bidirectional representations", "Why BERT does not generate: it learned to fill blanks given both sides, never to predict the next token from the left alone, so it has no natural token-by-token procedure", "Causal LM (GPT, Llama): predicts the next token under a causal mask; every position is a training example, and generation is the same step repeated", "Encoder-decoder (T5, BART): the encoder reads the input bidirectionally, the decoder generates causally and cross-attends to it; T5 pretrains by replacing spans with sentinel tokens and generating the missing spans", "Uses: encoders for classification, NER, embeddings and cross-encoder reranking; decoders for generation and most general LLMs; encoder-decoders for translation and summarization", "In an assistant: a fine-tuned small encoder for intent or routing runs in milliseconds on modest hardware; a decoder LLM takes open requests, out-of-scope turns and changing labels"], "figs": ["transformerBlock", "llmLifecycle"], "production": ["DistilBERT keeps about 97% of BERT's language-understanding performance with 40% fewer parameters and about 60% faster inference", "A 2026 preprint found fine-tuned RoBERTa beat Claude Haiku on ATIS and tied on CLINC150, but the LLM caught far more out-of-scope queries, at about 981 ms against 2.4 ms p50", "A common pattern: label data with an LLM, have people review it, then distil into a small encoder for serving"], "mcq": [{"q": "You need intent classification at 2,000 requests per second, 80 stable intents, thousands of labelled examples. Which shape fits best?", "o": ["A decoder LLM prompted zero-shot on every request", "A decoder LLM with a long few-shot prompt per request", "An encoder-decoder that generates the intent name as text", "A small fine-tuned encoder such as DistilBERT with a softmax head", "Mean-pooled vanilla BERT vectors compared to the intent names"], "a": 3, "why": "Stable labels, plenty of data and tight volume and latency are exactly where a fine-tuned encoder wins on cost and speed. Vanilla mean-pooled BERT is poor for similarity, and generating labels with a decoder costs far more per call."}, {"q": "Why can't BERT generate fluent text the way GPT does?", "o": ["Its vocabulary has no end-of-sequence token", "It was trained to fill masked tokens from both sides, never to predict the next token from the left", "It has no attention layers, only feed-forward ones", "It is too small; a masked model at GPT-3 scale generates equally well", "Its position embeddings cannot be extended past 512"], "a": 1, "why": "Generation needs a left-to-right next-token model. BERT's objective and its lack of a causal mask give it no such procedure, whatever its size."}, {"q": "What does the causal mask let a decoder do during training?", "o": ["Ignore padding tokens when sequences in a batch differ in length", "Attend to the encoder's output while generating", "Hide about 15% of tokens and predict them from both sides", "Skip the softmax at masked positions to save compute", "Train on one sequence as many next-token predictions in one pass, without seeing the future"], "a": 4, "why": "Blocking attention to later positions means every position predicts its next token at once. Ignoring pad tokens is the padding mask, a different mask."}], "open": {"q": "We have a BERT-based intent classifier in production. A colleague wants to replace it with a GPT-style LLM. How do you think about it?", "probe": "Whether you can tie the architecture to cost, latency and the failure you care about.", "a": ["BERT is an encoder: bidirectional, masked-token training, strong representations; GPT is a causal decoder that generates", "The encoder wins on volume, latency, cost and determinism for a stable closed label set with data", "The LLM wins on scarce data, changing labels, out-of-scope and turns that need reasoning", "So often both: the encoder takes the confident bulk, the LLM the uncertain slice, measured on per-intent recall and out-of-scope false accepts", "The LLM can also label new data that is then distilled into the encoder"]}, "say": ["**I wouldn't swap it outright. It depends on what we need from it.**", "**BERT:** it reads both directions and was trained to fill in blanks, so it's great at understanding and it's cheap.", "**GPT:** it was trained to predict the next word, so it generates, and it copes better with new phrasing and things we don't support.", "**Both:** keep the encoder for the confident traffic and send the uncertain slice to the LLM.", "Then I'd measure both on the same held-out set."], "avoid": ["Calling encoders obsolete: they are still the cheap default for classification, embeddings and reranking."], "was": ["q-bert-versus-gpt-what-s-the-difference"], "res": [{"kind": "video", "req": true, "label": "Which transformer architecture is best? Encoder-only vs encoder-decoder vs decoder-only", "url": "https://www.youtube.com/watch?v=wOcbALDw0bU", "m": 8, "why": "Compares encoder, decoder and encoder-decoder models by task.", "yt": {"id": "wOcbALDw0bU", "ch": "Efficient NLP"}}, {"kind": "video", "req": true, "label": "Encoder-only transformers (like BERT) for RAG, clearly explained", "url": "https://www.youtube.com/watch?v=GDN649X_acE", "m": 19, "why": "Encoder-only models (BERT) for classification.", "yt": {"id": "GDN649X_acE", "ch": "StatQuest with Josh Starmer"}}, {"kind": "video", "req": false, "label": "Text classification explained: Naive Bayes, logistic regression and fine-tuning", "url": "https://www.youtube.com/watch?v=1jsTRXZTtq8", "m": 11, "why": "The classifier side of the swap-BERT-for-an-LLM question.", "yt": {"id": "1jsTRXZTtq8", "ch": "SH AI Academy"}}, {"kind": "read", "req": true, "label": "Jay Alammar: The Illustrated BERT, ELMo and co.", "url": "https://jalammar.github.io/illustrated-bert/", "m": 25, "why": "Masked language modelling and why BERT does not generate."}, {"kind": "read", "req": false, "label": "Hugging Face LLM course: How do Transformers work?", "url": "https://huggingface.co/learn/llm-course/chapter1/4", "m": 15, "why": "Encoder, decoder and encoder-decoder side by side."}]}, {"id": "llm-kv-cache", "title": "The cost of attention, the KV cache and FlashAttention", "brief": "Full attention scores every token against every other, so compute grows with the square of the length. In generation the keys and values of past tokens never change, so they are cached and each new token computes only its own; the cache then becomes the memory bottleneck. The nuance: FlashAttention makes attention exact and memory-efficient but does not remove the quadratic compute, and grouped-query attention is what shrinks the cache.", "points": ["O(n²): the score matrix is n by n per head per layer, so doubling the context roughly quadruples attention compute", "FlashAttention: computes exact attention in tiles held in fast on-chip SRAM with an online softmax, never writing the n by n matrix to GPU memory; memory becomes linear in n and it runs faster by cutting memory reads and writes, but the FLOPs stay quadratic", "KV cache: under the causal mask, earlier tokens' keys and values are fixed, so they are stored per layer; each new token computes its own Q, K and V and attends over the cache", "Size per token: 2 (K and V) × layers × KV heads × head dim × bytes; Llama 2 7B (32 layers, 32 heads of 128, fp16) is 2 × 32 × 4096 × 2 = 524,288 bytes, about 0.5 MB, so about 2 GB for 4,000 tokens of one sequence", "MQA and GQA: multi-query attention shares one K and V head across all query heads; grouped-query shares one per group; Llama 3 8B has 8 KV heads for 32 query heads, a quarter of the cache", "Prefill against decode: prefill processes the prompt in parallel and is compute-bound; decode emits one token at a time, rereading the weights and the cache, so it is memory-bandwidth-bound, which is why cache size and batching decide serving cost"], "figs": ["servingPath", "transformerBlock"], "production": ["vLLM's PagedAttention stores the KV cache in fixed-size blocks, like virtual memory pages, which cuts fragmentation so more sequences fit on one GPU", "Prefix caching reuses the cache of a shared system prompt across requests; providers price cached input tokens lower", "Quantising the cache from fp16 to 8 bits halves its memory, at a small quality cost to be measured", "Track time to first token (prefill) and per-token latency (decode) separately; they have different fixes"], "mcq": [{"q": "Llama 2 7B (32 layers, hidden 4096, fp16, no GQA) serves 8 concurrent sequences of 4,000 tokens. Roughly how much memory does the KV cache take?", "o": ["About 2 GB", "About 0.5 GB", "About 16 GB", "About 64 GB", "About 128 MB"], "a": 2, "why": "About 0.5 MB per token (2 × 32 × 4096 × 2 bytes) × 4,000 tokens × 8 sequences is about 16.8 GB. 2 GB is one sequence."}, {"q": "What does FlashAttention change?", "o": ["It approximates attention with a low-rank projection so compute becomes linear", "It shares keys and values across heads to shrink memory", "It restricts each token to a fixed window of neighbours", "It caches keys and values between decoding steps", "It computes exact attention in on-chip tiles without storing the n by n matrix, so memory traffic drops while compute stays quadratic"], "a": 4, "why": "FlashAttention is exact and IO-aware: it avoids materialising the score matrix in GPU memory. Low-rank and windowed attention are approximations; sharing K and V is GQA; caching is the KV cache.", "pair": "flash-vs-gqa"}, {"q": "A model moves from 32 KV heads to 8 (grouped-query attention). What mainly changes?", "o": ["The KV cache and decode memory traffic drop to about a quarter, with small quality loss", "Attention compute becomes linear in sequence length", "Prefill becomes memory-bound instead of compute-bound", "The number of query heads drops to 8", "Its outputs become identical to FlashAttention's"], "a": 0, "why": "Query heads stay at 32; groups of 4 share one K and V head, so the cache is a quarter of the size. The quadratic score computation is unchanged.", "pair": "flash-vs-gqa"}], "open": {"q": "Our assistant's latency and GPU bill jump when conversations get long. Explain why, from the mechanism.", "probe": "Whether you can connect attention's cost and the KV cache to a real serving symptom.", "a": ["Each new token attends over every earlier one, so per-token decode work and the KV cache grow with the conversation", "The cache is 2 × layers × KV heads × head dim × bytes per token, about 0.5 MB a token for a 7B model without GQA, so long chats limit how many sequences fit in a batch", "Decode is memory-bound, so fewer concurrent sequences means a higher cost per token", "Levers: trim or summarise history, prefix caching for the shared system prompt, GQA models, a quantised cache, paged cache management", "Measure time to first token and per-token latency separately, since prefill and decode have different fixes"]}, "say": ["**I'd explain it from the KV cache.**", "**Why it grows:** every new token looks back at all the earlier ones, so the cache grows with the conversation, about half a megabyte a token on a 7B model without grouped-query attention.", "**Why cost rises:** that eats the GPU memory you'd use for batching, and decode is limited by memory traffic, so the cost per token goes up.", "**Fixes:** trim or summarise history, cache the shared system prompt, and use models with grouped-query attention.", "I'd measure time to first token and per-token latency separately."], "avoid": ["Saying FlashAttention makes attention linear: memory becomes linear, compute stays quadratic."], "was": ["q-what-is-the-kv-cache-and-why-does-it-matter"], "res": [{"kind": "video", "req": true, "label": "The KV cache: memory usage in transformers", "url": "https://www.youtube.com/watch?v=80bIUggRJf4", "m": 9, "why": "Why keys and values are cached and how memory grows.", "yt": {"id": "80bIUggRJf4", "ch": "Efficient NLP"}}, {"kind": "video", "req": false, "label": "Flash Attention: the fastest attention mechanism?", "url": "https://www.youtube.com/watch?v=eJn6zsbrqUM", "m": 9, "why": "FlashAttention tiling and why it cuts memory traffic.", "yt": {"id": "eJn6zsbrqUM", "ch": "Tales Of Tensors"}}, {"kind": "video", "req": false, "label": "LLaMA explained: KV cache, rotary embeddings, RMS norm, grouped-query attention", "url": "https://www.youtube.com/watch?v=Mn_9W1nCFLo", "m": 71, "why": "Watch the KV-cache and grouped-query attention segments for per-token memory.", "yt": {"id": "Mn_9W1nCFLo", "ch": "Umar Jamil"}}, {"kind": "read", "req": true, "label": "Lilian Weng: Large Transformer model inference optimization", "url": "https://lilianweng.github.io/posts/2023-01-10-inference-optimization/", "m": 9, "why": "Section on KV cache and memory costs in inference."}, {"kind": "read", "req": false, "label": "Ainslie et al.: GQA, grouped-query attention", "url": "https://arxiv.org/abs/2305.13245", "m": 15, "why": "Grouped-query attention, how it shrinks the cache."}]}, {"id": "llm-tokens", "title": "Tokenization: BPE, WordPiece, SentencePiece", "brief": "Models read subword tokens from a fixed vocabulary, roughly 30k to 200k pieces, that can compose any word. BPE learns merges by frequency, WordPiece picks merges by a likelihood score, and SentencePiece is a library that trains BPE or unigram models on raw text with spaces as symbols. The nuance: tokenization explains cost, context use and odd failures on spelling, digits and IDs.", "points": ["Why subwords: a word vocabulary explodes and cannot represent unseen words; characters make sequences long, and attention cost grows with length", "BPE (Sennrich et al., 2016): start from characters or bytes, merge the most frequent adjacent pair into a new symbol, repeat until the vocabulary reaches its target size; encoding replays the learned merges in the order they were learned", "Byte-level BPE (GPT-2, RoBERTa): the 256 byte values are the base, so any string can be encoded and nothing is out of vocabulary; GPT-2's vocabulary is 50,257", "WordPiece (BERT): merges the pair with the best likelihood score (in the Hugging Face description, pair count divided by the product of the part counts), marks continuations with '##', and at inference takes the longest matching piece from the left", "SentencePiece and unigram: SentencePiece reads raw text with the space as a visible symbol (▁), so no language-specific pre-tokenizer; its unigram option starts large and prunes the pieces whose removal least hurts likelihood; T5 and Llama 1 and 2 use SentencePiece", "Consequences: cost and context are counted in tokens; other languages and digits often take more tokens; letters inside a token are invisible, so spelling backwards or counting letters is hard; account numbers split unpredictably"], "figs": ["bpeMerge"], "production": ["Pricing and context limits are in tokens, and the same text can take noticeably more tokens outside English", "Llama 3 moved to a 128K-token BPE vocabulary (built on tiktoken) from Llama 2's 32K SentencePiece one, so the same text takes fewer tokens", "In an assistant, account numbers, amounts and dates are extracted by a schema-validated tool call or code and checked in code, because the model sees them as token fragments"], "mcq": [{"q": "BPE training has counted all adjacent pairs. Which pair does it merge next?", "o": ["The pair whose merge most raises training likelihood relative to its parts", "The longest substring already present in the vocabulary", "The most frequent adjacent pair of current symbols in the corpus", "The piece whose removal least lowers likelihood", "A random pair, weighted by frequency, so tokenization varies"], "a": 2, "why": "BPE is greedy on frequency. Choosing by likelihood relative to the parts is WordPiece; pruning by likelihood is the unigram model.", "pair": "bpe-vs-wordpiece"}, {"q": "A tokenizer turns 'playing' into 'play' and '##ing'. What is it?", "o": ["Byte-level BPE, which marks spaces with a special byte symbol", "SentencePiece, which marks word starts with ▁", "A character-level tokenizer with a suffix list", "A unigram model that sampled one of several segmentations", "WordPiece, which marks word-internal pieces with '##'"], "a": 4, "why": "'##' marks a continuation piece in BERT's WordPiece. SentencePiece marks the start of a word instead, and byte-level BPE in GPT-2 folds the space into the next token.", "pair": "bpe-vs-wordpiece"}, {"q": "Why does a byte-level BPE model never produce an unknown token?", "o": ["Its base vocabulary is all 256 byte values, so any string can fall back to bytes", "Its vocabulary of over 50,000 pieces covers every word in common languages", "Unknown words are mapped to the nearest known word by embedding similarity", "It lowercases and strips accents before encoding", "It switches to characters at inference whenever a word is rare"], "a": 0, "why": "Every UTF-8 string is a sequence of bytes, and every byte is in the vocabulary. Rare words cost more tokens, but they never become [UNK]."}], "open": {"q": "Why do models use subword tokens, and what does that mean for a banking assistant in practice?", "probe": "Whether you understand BPE and can connect tokenization to cost and to failures on IDs and numbers.", "a": ["Words: the vocabulary explodes and unseen words break; characters: sequences get long; subwords: a fixed vocabulary that composes anything", "BPE merges the most frequent adjacent pair again and again, and encoding replays the merges; byte-level means no unknown tokens", "WordPiece merges by a likelihood score and uses '##'; SentencePiece handles raw text with the space as a symbol", "Practice: cost and context are tokens; account numbers and amounts split into fragments, so extract and validate them in code rather than trusting the model's reading"]}, "say": ["**Subwords sit in the middle.**", "**Why not words or characters:** whole words blow up the vocabulary and break on new words, and characters make everything too long.", "**BPE:** it starts from bytes and keeps merging the most common pair, so common words end up as one token and rare ones as a few pieces.", "**Banking angle:** an account number is a handful of odd fragments to the model.", "So I'd pull those out and check them in code."], "avoid": ["Saying WordPiece is BPE with likelihood as if they were the same: related, but with different merge rules and a different inference procedure."], "was": ["q-why-subword-tokenization-and-how-does-bpe-work"], "res": [{"kind": "video", "req": true, "label": "LLM tokenizers explained: BPE encoding, WordPiece and SentencePiece", "url": "https://www.youtube.com/watch?v=hL4ZnAWSyuU", "m": 6, "why": "BPE, WordPiece and SentencePiece compared.", "yt": {"id": "hL4ZnAWSyuU", "ch": "DataMListic"}}, {"kind": "video", "req": false, "label": "Byte pair encoding tokenization", "url": "https://www.youtube.com/watch?v=HEikzVL-lZU", "m": 6, "why": "The BPE merge loop on a small example.", "yt": {"id": "HEikzVL-lZU", "ch": "Hugging Face"}}, {"kind": "read", "req": true, "label": "Hugging Face LLM course: Byte-pair encoding tokenization", "url": "https://huggingface.co/learn/llm-course/chapter6/5", "m": 20, "why": "BPE worked step by step, with code."}, {"kind": "read", "req": false, "label": "Hugging Face: Summary of the tokenizers", "url": "https://huggingface.co/docs/transformers/tokenizer_summary", "m": 12, "why": "BPE, WordPiece, unigram and SentencePiece side by side."}, {"kind": "read", "req": false, "label": "Stanford SLP3: ch. 2 Words and Tokens", "url": "https://web.stanford.edu/~jurafsky/slp3/2.pdf", "m": 20, "why": "The BPE section only."}]}, {"id": "llm-decoding", "title": "Decoding: greedy, beam, temperature, top-k, top-p", "brief": "The model outputs a probability distribution over the next token; decoding decides which token to take. Temperature reshapes the distribution, top-k and top-p cut its tail, and greedy and beam search are deterministic searches. The nuance: for anything the assistant acts on, use temperature 0 or schema-constrained decoding, and know that even temperature 0 is not guaranteed byte-identical across runs.", "points": ["Greedy and beam: greedy takes the most likely token each step; beam search keeps the b best partial sequences; good for translation and summarization, bland and repetitive on open text (Holtzman et al., 2019)", "Temperature: divides the logits (the model's raw scores) by T before the softmax; below 1 sharpens, above 1 flattens, toward 0 it approaches greedy; it never changes the ranking of tokens", "Top-k: samples from the k most likely tokens; a fixed k is too wide when the model is confident and too narrow when it is not", "Top-p (nucleus): samples from the smallest set whose probabilities add up to at least p, so the set shrinks when the distribution is peaked and grows when it is flat", "Constrained decoding: a grammar or JSON schema masks invalid tokens at each step, so the output always parses; the values still need checking in code", "Temperature 0 is not a determinism guarantee: batching, floating-point order and provider updates can change outputs; pin model versions and log outputs"], "figs": ["schemaRepair"], "production": ["Classification, extraction and tool arguments: temperature 0 or structured outputs against a JSON schema, then validation and one retry with the error message", "Open replies: a moderate temperature with top-p is a common starting point, tuned on an evaluation set rather than by feel", "Self-consistency: sample several reasoning paths at a moderate temperature and take the majority answer, trading cost for accuracy"], "mcq": [{"q": "The next-token distribution is very peaked: one token has probability 0.97. With top-p = 0.9, what can be sampled?", "o": ["The top 90% of the vocabulary by probability", "Only that token, because it alone reaches 0.9", "Any token with probability above 0.1", "The 40 most likely tokens, rescaled", "That token and the next most likely one, for variety"], "a": 1, "why": "The nucleus is the smallest set whose probability reaches p. One token at 0.97 already exceeds 0.9, so the set has one member.", "pair": "topk-vs-topp"}, {"q": "Why does top-p adapt better than top-k?", "o": ["It always samples from more tokens, which adds variety", "It changes the ranking of tokens before sampling", "It is deterministic, so outputs repeat exactly", "Its candidate set grows or shrinks with how flat the distribution is, while k stays fixed", "It learns a temperature for each prompt"], "a": 3, "why": "A fixed k includes junk when the model is confident and cuts good options when it is unsure. Top-p sizes the set by probability mass instead.", "pair": "topk-vs-topp"}, {"q": "An assistant extracts transfer amounts from customer messages. Which decoding setup fits?", "o": ["Temperature 1 with top-p 0.95, to cover more phrasings", "A large beam, to find the best overall parse", "Temperature 0, which guarantees identical output on every call", "Top-k of 1 at temperature 1.5, for confident but varied output", "Temperature 0 or a schema-constrained output, with the amount validated in code"], "a": 4, "why": "Anything acted on should be as deterministic and well-formed as possible, and then checked in code. Temperature 0 is near-deterministic but not guaranteed identical, so it cannot replace validation."}], "open": {"q": "How would you set decoding for an intent classifier, an entity extractor and the assistant's open replies?", "probe": "Whether you match the knob to the task and know its limits.", "a": ["Classifier and extractor: temperature 0 or constrained decoding to an enum or schema; validate in code and retry once with the error", "Open replies: some temperature with top-p, tuned on an evaluation set for tone and accuracy", "Temperature reshapes the distribution; top-k and top-p truncate it, and top-p adapts to the model's confidence", "Temperature 0 is near-deterministic, not guaranteed; pin model versions and log outputs"]}, "say": ["**The decoding settings follow the task: strict where the assistant acts, looser where it talks.**", "**Where it acts:** for an intent or an amount, temperature zero or a schema constraint, then check the values in code.", "**Open replies:** a bit of temperature with top-p, tuned on an eval set.", "**No promises:** I wouldn't promise byte-identical output even at zero, because batching and model updates can still change it.", "That's pretty much why the checks live in code."], "avoid": ["Claiming lower temperature fixes hallucination: it adds no knowledge."], "was": ["q-temperature-top-k-and-top-p-what-are-they-and-when-do-you-us"], "res": [{"kind": "video", "req": true, "label": "LLM prompt engineering with random sampling: temperature, top-k, top-p", "url": "https://www.youtube.com/watch?v=-BBulGM6xF0", "m": 9, "why": "Temperature, top-k and top-p on one example.", "yt": {"id": "-BBulGM6xF0", "ch": "DataMListic"}}, {"kind": "video", "req": false, "label": "Greedy, min-p, beam search: how LLMs actually pick words", "url": "https://www.youtube.com/watch?v=o-_SZ_itxeA", "m": 12, "why": "Greedy, beam and sampling compared, including newer min-p.", "yt": {"id": "o-_SZ_itxeA", "ch": "AI Coffee Break with Letitia"}}, {"kind": "video", "req": false, "label": "The secret controls for your LLM: temperature, top-k, top-p and more", "url": "https://www.youtube.com/watch?v=MkaazQttbpc", "m": 15, "why": "Temperature explained from the softmax.", "yt": {"id": "MkaazQttbpc", "ch": "Gary Explains"}}, {"kind": "read", "req": false, "label": "Holtzman et al.: The curious case of neural text degeneration", "url": "https://arxiv.org/abs/1904.09751", "m": 25, "why": "Why beam search degenerates and how nucleus sampling fixes it."}, {"kind": "read", "req": true, "label": "Hugging Face: How to generate text", "url": "https://huggingface.co/blog/how-to-generate", "m": 15, "why": "Greedy, beam, top-k and top-p with code, plus the settings to choose."}]}, {"id": "llm-post-training", "title": "From pretrained model to assistant", "brief": "Pretraining on next-token prediction gives a model that continues text. Supervised fine-tuning on instruction and response pairs teaches format and behaviour, and preference tuning (RLHF or DPO) makes it prefer the answers people rank higher. The nuance: post-training shapes behaviour far more than knowledge, and fine-tuning on facts the model does not know can teach it to guess.", "points": ["Pretraining and scaling: next-token loss falls as a power law in parameters, data and compute (Kaplan et al., 2020); Chinchilla (2022) found compute-optimal training uses about 20 tokens per parameter, and labs now train smaller models on far more tokens because inference cost matters", "SFT: supervised fine-tuning on (instruction, response) pairs teaches format, instruction following and tone, and little new knowledge", "RLHF: people rank responses, a reward model learns the ranking, then PPO optimises the policy against it with a KL penalty that keeps it near the SFT model; InstructGPT's 1.3B RLHF model was preferred by labellers over 175B GPT-3", "DPO (Rafailov et al., 2023): no reward model and no RL loop; a classification-style loss raises the log-probability ratio of the preferred answer over the rejected one, relative to a frozen reference model, with β setting how far it may drift", "In-context learning: adapting from examples in the prompt with no weight update; sensitive to example choice, order and format; retrieved similar examples usually beat fixed ones", "The hallucination link: fine-tuning on facts the model does not already know teaches confident guessing (covered in Lilian Weng's survey), so knowledge belongs in retrieval and behaviour in tuning"], "figs": ["llmLifecycle"], "production": ["Llama 2-Chat: SFT, then RLHF with rejection-sampling fine-tuning and PPO", "DPO and its variants are widely used in open-model post-training because they are simpler and more stable than PPO", "Reasoning models add RL with verifiable rewards (checkable maths answers, passing code tests), for example GRPO in DeepSeek's work"], "mcq": [{"q": "A team fine-tunes on 5,000 Q&A pairs of internal facts the base model never saw, and hallucination goes up. Most likely why?", "o": ["The learning rate was too low for the facts to be stored", "Training it to state facts it does not know teaches it to answer confidently without knowledge", "SFT cannot change model outputs, only formatting", "5,000 pairs is too few; 50,000 would have fixed it", "The tokenizer could not represent the new terms"], "a": 1, "why": "The model learns the behaviour 'give a confident answer' without the knowledge behind it, which is guessing. Facts that change belong in retrieval."}, {"q": "What does DPO remove compared with RLHF using PPO?", "o": ["The human preference data; it learns preferences from raw text", "The reference model; it needs only the policy being trained", "The SFT stage; it starts from the pretrained model", "The separate reward model and the RL sampling loop", "Any limit on drift; the policy may move freely"], "a": 3, "why": "DPO trains directly on preferred and rejected pairs with a loss relative to a frozen reference model. It still uses preference data, usually starts from an SFT model, and β plays the role of the KL constraint.", "pair": "rlhf-vs-dpo"}, {"q": "In RLHF, what is the KL penalty for?", "o": ["Keeping the policy near the SFT model so it does not exploit the reward model with odd outputs", "Making the reward model's scores calibrated probabilities", "Smoothing PPO's gradients so it converges faster", "Forcing the policy to match the pretraining data token by token", "Penalising answers longer than the SFT model's average"], "a": 0, "why": "A reward model is an imperfect proxy. Without the penalty, the policy finds outputs that score high but read badly; the KL term keeps it close to the SFT distribution.", "pair": "rlhf-vs-dpo"}], "open": {"q": "How does a pretrained model become a helpful assistant, and where would you plug in your own changes for a bank?", "probe": "Whether you know each stage, what it changes, and which lever fits a bank's needs.", "a": ["Pretraining on next-token prediction gives a text continuer with broad knowledge", "SFT on instruction and response pairs teaches format and behaviour", "Preference tuning: RLHF (a reward model, then PPO with a KL penalty) or DPO (a direct loss on preferred against rejected pairs, relative to a frozen reference)", "Own changes: prompts and retrieval first for policy and product knowledge; tuning (often LoRA SFT, maybe DPO on reviewed pairs) for tone, format and refusals", "Never tune in facts that change: they go stale and can raise guessing"]}, "say": ["**Pretraining gives you something that continues text, and the later stages shape its behaviour.**", "**Instructions:** supervised fine-tuning on instruction and answer pairs teaches it to follow them.", "**Preferences:** RLHF, or now often DPO, teaches it which answers people prefer.", "**For a bank:** facts stay in retrieval, and tuning is only for behaviour, like format and when to refuse.", "Tuning facts in goes stale, and it can make the model guess."], "avoid": ["Saying SFT teaches the model your company's knowledge: it mostly teaches behaviour."], "was": ["q-how-does-a-pretrained-model-become-an-assistant"], "res": [{"kind": "video", "req": true, "label": "Reinforcement learning with human feedback (RLHF), clearly explained", "url": "https://www.youtube.com/watch?v=qPN_XZcJf_s", "m": 19, "why": "The RLHF pipeline stage by stage.", "yt": {"id": "qPN_XZcJf_s", "ch": "StatQuest with Josh Starmer"}}, {"kind": "video", "req": false, "label": "Direct preference optimization: your language model is secretly a reward model", "url": "https://www.youtube.com/watch?v=XZLc09hkMwA", "m": 9, "why": "DPO without a reward model.", "yt": {"id": "XZLc09hkMwA", "ch": "AI Coffee Break with Letitia"}}, {"kind": "video", "req": false, "label": "State of GPT (Karpathy)", "url": "https://www.youtube.com/watch?v=bZQun8Y4L2A", "m": 43, "why": "Pretraining, SFT, reward modelling and RL in one talk; watch the training pipeline segment.", "yt": {"id": "bZQun8Y4L2A", "ch": "Microsoft Developer"}}, {"kind": "read", "req": true, "label": "Stanford SLP3: ch. 8 Post-training", "url": "https://web.stanford.edu/~jurafsky/slp3/8.pdf", "m": 25, "why": "Instruction tuning and preference tuning, clearly."}, {"kind": "read", "req": false, "label": "Ouyang et al.: InstructGPT", "url": "https://arxiv.org/abs/2203.02155", "m": 30, "why": "InstructGPT: the SFT, reward and PPO recipe."}]}, {"id": "llm-choose", "title": "Prompt, RAG, fine-tune or LoRA", "brief": "Start with prompting; add retrieval when the gap is knowledge that is private, large or changing; fine-tune when the gap is behaviour, format, tone, or cost and latency at scale; LoRA makes that fine-tune cheap. The nuance: the levers combine, and hallucination is reduced by grounding and checks, not by a lower temperature or by tuning facts in.", "points": ["Prompting: no training and fast to change; limited by context length, consistency, and the per-call cost of long prompts", "RAG: retrieve relevant passages at query time and condition on them; updatable without retraining, citable, and the main lever against hallucination on facts; capped by retrieval quality", "Fine-tuning: changes weights for behaviour, format, tone or a narrow skill, or lets a smaller model match a larger one on one task", "LoRA (Hu et al., 2021): freeze W and learn ΔW = BA with rank r far below d; up to 10,000 times fewer trainable parameters and about 3 times less GPU memory than full GPT-3 175B fine-tuning, no added latency once BA is merged, and adapters can be swapped per task; QLoRA trains the adapters on a 4-bit quantised frozen base", "Reducing hallucination: ground in retrieved evidence with citations, constrain the answer to that context, use tools for facts and arithmetic, allow abstention, and measure faithfulness (does the answer stay within the retrieved evidence) on a regression set", "Classifier pattern: label with an LLM, have people review, distil into a small encoder"], "figs": ["lora", "ragPipeline"], "production": ["Bank knowledge (fees, policies, product terms) changes and needs citations, so it lives in retrieval over versioned documents; tone and refusal style live in prompts or a light tune", "Multi-LoRA serving: one base model with many small adapters chosen per request (vLLM and LoRAX support this)", "QLoRA fine-tuned a 65B model on a single 48 GB GPU by keeping the frozen base in 4-bit"], "mcq": [{"q": "A fee schedule changes every quarter and answers must cite the current document. What fits best?", "o": ["Fine-tune on the fee schedule each quarter so the model knows it", "Train a new LoRA adapter each quarter and swap it in at release", "Retrieval over the versioned documents, with citations in the answer", "Lower the temperature so the model states fees more precisely", "A system prompt with every fee table, so no retrieval is needed"], "a": 2, "why": "Changing knowledge that must be cited is the textbook case for retrieval: update the documents, not the weights. Tuning facts in goes stale and cannot cite."}, {"q": "Why does a merged LoRA adapter add no inference latency?", "o": ["The adapters run on a separate GPU in parallel with the base", "LoRA prunes the base weights, so the model gets smaller", "The base is stored in 4-bit during inference", "Only the attention layers run; the feed-forward layers are skipped", "BA has the same shape as W, so it is added into W once and the model runs as before"], "a": 4, "why": "W' = W + BA is an ordinary weight matrix of the original shape. Keeping the base in 4-bit is QLoRA, a training memory trick, not the reason.", "pair": "lora-vs-qlora"}, {"q": "What does QLoRA add on top of LoRA?", "o": ["The adapters are quantised to 4 bits after training to speed up inference", "The rank is chosen automatically for each layer", "The base weights are also updated, at low precision", "The frozen base is stored in 4-bit so large models fit for fine-tuning on one GPU", "Documents are stored in adapters, which replaces retrieval"], "a": 3, "why": "QLoRA quantises the frozen base to 4-bit and backpropagates through it into higher-precision adapters, which is why a 65B model fit on one 48 GB GPU.", "pair": "lora-vs-qlora"}], "open": {"q": "Our assistant should answer questions about fund fees and account rules in a consistent, careful tone. Prompt, RAG, fine-tune or LoRA?", "probe": "Whether you separate knowledge from behaviour and know what each lever costs.", "a": ["Prompt first: instructions, examples and an output schema, measured on an evaluation set", "Fees and rules are knowledge that changes and needs citations, so RAG over versioned documents, with abstention when evidence is weak", "Tone and format: prompt first; if still inconsistent at volume, a LoRA fine-tune on reviewed examples", "Do not tune facts in: they go stale and raise guessing", "Measure faithfulness and citation accuracy on a regression set before and after each change"]}, "say": ["**Knowledge goes in retrieval, behaviour goes in tuning, and I try prompting before either.**", "**Fees and rules:** they change and need a citation, so that's RAG over the current documents.", "**Tone:** if it still drifts at volume, a LoRA fine-tune, because it's cheap and you can swap adapters.", "**Ids from code:** at alfred_ we went a step further for one case, where the model only sees opaque handles for real items and code reattaches the real ids.", "So the ids it acts on come from code, not from the model."], "avoid": ["Saying lower temperature fixes hallucination: it adds no knowledge.", "Claiming the handle scheme makes hallucination impossible: it removes one kind of invented id, and checks still run."], "was": ["q-fine-tune-lora-prompt-or-rag-how-do-you-choose"], "res": [{"kind": "video", "req": true, "label": "RAG vs fine-tuning vs prompt engineering: optimizing AI models", "url": "https://www.youtube.com/watch?v=zYGDpG-pTho", "m": 14, "why": "Decision between prompt, RAG and fine-tuning.", "yt": {"id": "zYGDpG-pTho", "ch": "IBM Technology"}}, {"kind": "video", "req": false, "label": "What is low-rank adaptation (LoRA), explained by the inventor", "url": "https://www.youtube.com/watch?v=DhRoTONcyZE", "m": 8, "why": "LoRA explained from low-rank matrices.", "yt": {"id": "DhRoTONcyZE", "ch": "Edward Hu"}}, {"kind": "read", "req": false, "label": "Hu et al.: LoRA, low-rank adaptation of large language models", "url": "https://arxiv.org/abs/2106.09685", "m": 20, "why": "Sections 4 and 5: how the low-rank update works and what it costs."}, {"kind": "read", "req": true, "label": "Lilian Weng: Extrinsic hallucinations in LLMs", "url": "https://lilianweng.github.io/posts/2024-07-07-hallucination/", "m": 29, "why": "Why hallucination arises, and why grounding with retrieval helps."}, {"kind": "read", "req": false, "label": "Anthropic: Building effective agents", "url": "https://www.anthropic.com/engineering/building-effective-agents", "m": 15, "why": "Start with prompting and retrieval before adding complexity."}]}], "day": "Day 1, Sunday 4 Oct"}, {"id": "nlu", "title": "Intents, entities and dialogue state", "blurb": "Model the understanding layer in the room: taxonomy, data, entities, state, thresholds, and where LLMs and tools fit in.", "sessions": ["wc29"], "topics": [{"id": "nlu-taxonomy", "title": "The intent taxonomy", "brief": "An intent is a unit of action the business can take, not a unit of topic: actions and queries are intents, and the information needed to fulfil them is entities. Split when the next step differs (a different flow, API, authentication level or compliance treatment); merge when fulfilment is the same and let a slot carry the difference. The nuance: over-fine taxonomies fail through overlap and imbalance, not through lack of coverage.", "points": ["Action and object: cancel is one intent and the product is an entity; no 'cancel product X' intents", "Merge or split: same flow and same API call means merge and use an entity; similar words but different handling (lost card against declined card) means split", "Risk tier: informational, transactional and regulated intents get different thresholds, confirmation and off-ramps, so record the tier on each intent", "Scale: past a few hundred intents, route by domain first (accounts, cards, loans, fraud) and classify within it, or use head intents with a modifier entity", "Confusion matrix: off-diagonal mass between two intents means merge them, or split them properly with distinguishing data", "Consistency: one schema style and hierarchical names (service.category.action) keep hundreds of intents navigable"], "figs": ["intentTaxonomy", "confusionMatrix"], "production": ["Dialogflow CX trains intents only against others in the same flow, so splitting a big bot into flows reduces cross-topic confusion", "Dialogflow CX guidance: at least 20 training phrases per intent, about 50 for the main ones, and no intent with far more phrases than its neighbours", "Bank of America's Erica, as reported, grew from roughly 200 to 250 intents at launch to more than 700, each a curated answer or workflow", "Fraud and 'I want a person' get top-priority routes from the start", "With LLM routing, the descriptions of each flow or tool become what the model chooses between, so overlap moves from training phrases into prose"], "mcq": [{"q": "'Check checking balance' and 'check savings balance' go to the same flow and the same API. How should they be modelled?", "o": ["One intent with an account-type entity", "Two intents, one per account type", "One intent per phrasing seen in the logs", "A single FAQ intent answered by retrieval", "Two entities with no intent at all"], "a": 0, "why": "Same fulfilment means one intent, with the difference carried by a slot. Two intents would share almost every phrase and collide.", "pair": "merge-vs-split"}, {"q": "'My card was declined' and 'I lost my card' share most of their words. How should they be modelled?", "o": ["One card intent, with a reason entity", "Two intents, because the handling and urgency differ", "One intent, separated later by the confusion matrix", "One FAQ intent, answered from documents", "Two entities under a general help intent"], "a": 1, "why": "A lost card needs blocking now; a decline needs an explanation. Different flows mean different intents, and the training data has to carry the distinguishing words.", "pair": "merge-vs-split"}, {"q": "A bank bot has 400 flat intents and accuracy keeps falling as teams add more. What is the structural fix?", "o": ["Add more training phrases to every intent", "Raise the confidence threshold for all intents", "Replace every intent with a single LLM prompt", "Route by domain first, then classify within each domain", "Delete intents with fewer than 20 phrases"], "a": 3, "why": "Every intent adds decision boundaries, and a flat list makes every intent compete with every other. A domain router keeps each classifier's label space small."}], "open": {"q": "How would you design the intent taxonomy for a bank assistant?", "probe": "Granularity, a merge-or-split rule, risk, and how it scales", "a": ["Start from call and chat logs; rank tasks by volume and risk, not by the product catalogue", "Actions are intents, products and accounts are entities, one schema style throughout", "Merge if two intents share a flow and an API call; split if similar words need different handling", "Route by domain first (accounts, cards, loans, fraud), with top-priority routes for fraud and 'a person', and a risk tier on each intent", "Validate on labelled real utterances with a confusion matrix before building any flows"]}, "say": ["**I'd start from the logs and let volume and risk decide the intents, not the product catalogue.**", "**Actions and objects:** actions become intents, products and accounts become entities.", "**Granularity test:** if two intents get the same flow and the same API call, merge them and use an entity. If the same words need different handling, like a lost card against a declined card, split them.", "**Scale:** past a few hundred intents I'd route by domain first.", "And I'd check it on real utterances with a confusion matrix before building any flows."], "avoid": ["Organising intents by FAQ phrasing or by the product catalogue"], "was": ["q-how-would-you-design-the-intent-taxonomy-for-say-a-bank-assi", "a-intent-taxonomy"], "res": [{"kind": "clip", "req": true, "label": "Explainer: intents, entities, slots and dialogue state", "url": "../media/videos/intents-entities-slots-state.mp4", "m": 4, "why": "What each piece is and how they differ: an entity is what was said, a slot is what the task needs, and the orchestrator decides the next action in code."}, {"kind": "video", "req": true, "label": "7 best practices for Dialogflow CX", "url": "https://www.youtube.com/watch?v=OMurp_9B1Z4", "m": 6, "why": "Google's short list for structuring a bot, including keeping intents and flows manageable.", "yt": {"id": "OMurp_9B1Z4", "ch": "Google Cloud Tech"}}, {"kind": "video", "req": true, "label": "Building a better bot: best practices for intent design", "url": "https://www.youtube.com/watch?v=Z_S5hcYNzuE", "m": 5, "why": "Oracle's session on what makes a good intent set: one purpose per intent, distinct utterances, avoiding overlap.", "yt": {"id": "Z_S5hcYNzuE", "ch": "Oracle Digital Assistant"}}, {"kind": "read", "req": true, "label": "Microsoft Learn: CLU best practices", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/best-practices", "m": 12, "why": "Schema design: clear distinct intents, balanced data, entity components, and the overconfidence and out-of-scope notes."}, {"kind": "read", "req": true, "label": "Google Cloud: financial services steering prebuilt component", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/prebuilt-component/financial-services-steering", "m": 6, "why": "A worked bank intent router: topics such as balance, statement, appointment and disputes, each routed to its own flow or a human handoff."}, {"kind": "video", "req": false, "label": "Rasa Livecoding: Too many intents!", "url": "https://www.youtube.com/watch?v=U0nExRfH2Bo", "m": 62, "why": "Optional, 62 min: the Rasa team works on an assistant whose intent set has grown unwieldy; watch for how they decide what to merge or split.", "yt": {"id": "U0nExRfH2Bo", "ch": "Rasa"}}, {"kind": "read", "req": false, "label": "Google Cloud: Dialogflow CX agent design best practices", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/agent-design", "m": 8, "why": "Phrase counts, balance, hierarchical naming, flow structure."}]}, {"id": "nlu-data-oos", "title": "Training data and out-of-scope", "brief": "An intent is only as good as its training phrases: real users' words from logs, balanced across intents, varied in wording, with a held-out test set that is never trained on. Out-of-scope is two problems: politely declining what you never built, and never missing an in-scope but regulated request (a dispute, a fraud report) because it was phrased oddly. The nuance: the hard negatives are the ones that look like a supported intent, and the regulated detector is judged on recall, not overall accuracy.", "points": ["Floors, not targets: Dialogflow CX recommends 10 to 20 phrases per intent, CLU warns under 15, Kore.ai asks 8 to 10, Cognigy's analyzer flags under 5", "Quality: balance the classes (imbalance biases toward big intents), vary casing and punctuation, avoid accidental patterns like every example starting 'I want', and diversify wording instead of reordering it", "Sources: production logs over designer-written phrases; LLM-drafted phrases only for a cold start, replaced as traffic arrives and never in the test set", "Leakage: the same utterance or a near duplicate in train and test inflates the score", "Negative intent: near misses ('buy a book' in a flight bot), greetings, yes and no, bare numbers, fed from real false matches in the logs", "Regulated intents: a separate high-recall detector for disputes, fraud, complaints and hardship, tuned to over-trigger toward a human"], "figs": ["clfLadder"], "production": ["Dialogflow CX scores intents from 0.0 to 1.0, fires no-match below the threshold, and has a default negative intent; Google warns it degrades past about 10,000 phrases and should be reviewed as some negatives become in-scope", "CLU's None intent has a score threshold and replaces a top intent below it; Lex returns AMAZON.FallbackIntent when every intent scores below its threshold", "The CFPB's 2023 chatbot spotlight flags bots that recognise a dispute only when specific words appear", "Uncertainty-driven routing: a cheap classifier answers when confident and defers to an LLM only when uncertain, which improves out-of-scope detection without an LLM call on every turn"], "mcq": [{"q": "Why train the negative intent with near misses rather than random text?", "o": ["Random text would slow the model down at inference", "Near misses raise every intent's confidence score", "Random text is easy to reject; near misses teach the real boundary", "Platforms reject random text at upload time", "Near misses reduce the number of intents needed"], "a": 2, "why": "The hard out-of-scope inputs look like a supported intent, 'buy a book' in a flight bot. Only examples like those show the classifier where the edge is."}, {"q": "Your test set scores 97% but production feels far worse. Which data problem is most likely?", "o": ["Too few intents in the taxonomy", "The negative intent has too many examples", "The confidence threshold is set too low", "The test set covers every intent", "Designer-written phrases, with near duplicates in both train and test"], "a": 4, "why": "Leakage and designer phrasing both flatter the test score. Real users phrase things differently, so the test set should come from held-out production utterances."}, {"q": "A customer writes 'there's a charge on here I never made' and the bot treats it as a balance question. Why is this worse than an ordinary misclassification?", "o": ["It misses a dispute, which can start a regulated process with a legal clock", "It lowers overall accuracy more than other errors", "Balance questions cost more to serve than disputes", "It means the speech model must be retrained", "It makes the confusion matrix impossible to read"], "a": 0, "why": "Costs are asymmetric: a missed dispute is a compliance failure, not a bad experience. That is why regulated intents get their own high-recall detector and a route to a human."}], "open": {"q": "How would you make sure the assistant never misses a customer disputing a charge, however they phrase it?", "probe": "Asymmetric cost: recall on regulated intents, and a policy that sits outside the classifier", "a": ["A separate high-recall detector for disputes, fraud and complaints, tuned to over-trigger rather than miss", "Evaluate it on recall over real, oddly phrased examples, not on overall accuracy", "Route on detection to the regulated flow or a human, before the bot attempts anything else", "Feed misses back from logs and agent corrections; semantic matching helps catch paraphrases", "Keep a human off-ramp in every state, because the escalation rule is a policy, not a prediction"]}, "say": ["**I'd split out-of-scope in two.**", "**Polite decline:** for things we never support.", "**Regulated detector:** a separate high-recall detector for disputes, fraud and complaints, tuned to over-trigger toward a human rather than miss one.", "**Judge it on recall:** over real, oddly phrased examples, not on overall accuracy.", "And the training data comes from real users' words. Designers write the way designers talk."], "avoid": ["Quoting a platform's minimum phrase count as the target"], "was": ["q-how-many-training-phrases-does-an-intent-need-and-where-do-t", "a-oos-negative"], "res": [{"kind": "video", "req": true, "label": "Conversational AI with Rasa: training data and rules", "url": "https://www.youtube.com/watch?v=8gvGh6H2NO0", "m": 19, "why": "How NLU training examples are written and organised, and what makes an intent's data good or bad.", "yt": {"id": "8gvGh6H2NO0", "ch": "Rasa"}}, {"kind": "video", "req": true, "label": "Rasa Algorithm Whiteboard: fallback detection", "url": "https://www.youtube.com/watch?v=VldHznqAYlE", "m": 13, "why": "How a fallback class and a confidence threshold catch messages that match no supported intent.", "yt": {"id": "VldHznqAYlE", "ch": "Rasa"}}, {"kind": "read", "req": true, "label": "Google Cloud: Dialogflow CX intents", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/intent", "m": 5, "why": "Training phrases, how many to write, the match threshold, and the default negative intent."}, {"kind": "read", "req": true, "label": "Microsoft Learn: CLU None intent and None score threshold", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/none-intent", "m": 6, "why": "The built-in out-of-scope intent: add real near misses to it and set the None score threshold from test data."}, {"kind": "video", "req": false, "label": "Using events to handle unexpected input in Dialogflow CX", "url": "https://www.youtube.com/watch?v=tHLkWzIc2-s", "m": 8, "why": "What the platform does when nothing matches, for the polite-decline half of out-of-scope.", "yt": {"id": "tHLkWzIc2-s", "ch": "Peter Fessel"}}, {"kind": "read", "req": false, "label": "arXiv: An evaluation dataset for intent classification and out-of-scope prediction (Larson et al.)", "url": "https://arxiv.org/abs/1909.02027", "m": 6, "why": "Read the abstract and results: classifiers score well on in-scope intents yet miss out-of-scope queries, the reason a negative class and a threshold are needed."}]}, {"id": "nlu-entities", "title": "Entities: extract, resolve, validate", "brief": "Extracting a value is the easy half. The real work is resolving it to something the backend accepts (a canonical id), validating it against business rules, and deciding what to say when it fails. The nuance: each kind of value has its own right extractor, and identifiers are matched deterministically against the system of record, never guessed by a model.", "points": ["Extractor per kind: prebuilt for dates, numbers and emails; lists with synonyms for closed sets; regex plus validation for IDs; learned where context decides", "False fires: a quantity entity built only on the prebuilt number fires on '3 PM'; CLU's fix is a learned component marked required", "Roles: origin against destination needs a signal in the data, words like 'from' and 'to'", "Resolve: restrict to listed values for anything that maps to a product or account id; expand only for fuzzy fields like 'reason for call'", "Validate in code: amount within balance, date not in the past, account belongs to th
