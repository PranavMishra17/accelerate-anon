uestion node is still used for those.", "Wells Fargo's Fargo tokenizes and scrubs PII before the model sees the text, so the model extracts intent and entity type but never the raw account data."], "say": ["I treat an entity as three steps: extract, resolve to a canonical id the backend accepts, then validate against a business rule. Most production bugs I'd expect are in the second and third steps, not the extraction.", "I'd give every slot a retry budget and an exit, so a user who cannot supply a value ends up with a human or an alternative channel rather than looping."], "deep": "Resolution strategy is the quiet decision. A closed-list custom entity can either restrict to listed values (reject 'bitcoin' as an account type) or expand (accept values the model thinks are similar). In finance you almost always restrict for anything that maps to a product or account id, and use synonyms to cover how people actually say it, for example a fund's marketing name versus its official name. Free-text extraction by an LLM is fine for fuzzy fields like 'reason for call', but identifiers should be matched against the real list from an API, with a confirmation step if the match is not exact.\n\nValidation belongs in code, not in the model. Amount within balance, date not in the past, account belongs to this customer, transfer limit not exceeded: these are deterministic checks run in a code hook after each slot, with an error message specific enough that the next turn can succeed ('That is more than your available balance, what amount would you like instead?'). Generic 'sorry, I did not understand' on a validation failure is a common source of loops.\n\nReprompt design matters as much as extraction. The common pattern is a short first prompt, a more specific reprompt with an example, then a fallback (menu, DTMF, or handoff). Capping retries at around two or three, and varying the wording each time, avoids the robotic repeat. Slots that the user already supplied in the opening utterance should be skipped, which is why multi-slot extraction from the first message is worth the extra modelling.\n\nThere is a compliance side: sensitive values such as account or card numbers should not sit in logs or transcripts in clear text, and the extraction layer is where you mask or tokenize them. Fargo's design is the extreme version: the language model never receives them.", "sources": [{"label": "AWS: Amazon Lex V2 slots", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/intent-slots.html", "why": "Slot config: required, retries, code hook validation, DTMF and audio settings, optional slots."}, {"label": "Rasa: Conversation patterns and flow steps", "url": "https://rasa.com/docs/rasa-pro/concepts/conversation-repair/", "why": "Corrections and repair; collect steps with rejections are described in the flow-steps reference."}, {"label": "Microsoft Learn: Orchestrate agent behavior with generative AI", "url": "https://learn.microsoft.com/en-us/microsoft-copilot-studio/advanced-generative-actions", "why": "Documented limit on custom entities as inputs under generative orchestration."}, {"label": "VentureBeat: Wells Fargo's AI assistant crossed 245 million interactions", "url": "https://venturebeat.com/ai/wells-fargos-ai-assistant-just-crossed-245-million-interactions-with-zero-humans-in-the-loop-and-zero-pii-to-the-llm", "why": "PII tokenized before the model; LLM does intent and entity type only."}]}, {"id": "a-platform-flows", "title": "Dialogue state and flows across platforms: pages, flows, topics, CALM", "brief": "Every platform gives you the same two layers: something that decides which task the user wants, and something that walks the task to completion. What changed is who does the first part. Classic bots use intent classifiers or trigger phrases. Newer ones let an LLM pick from descriptions, while the deterministic flow still owns the steps.", "practice": ["Dialogflow CX: flows are topics, pages are states (a state machine). Routes are intent, condition or event routes, with intent routes taking priority, then conditions, then event handlers; sys.no-match and sys.no-input exist by default in every flow.", "Rasa CALM: business logic is written as flows (collect, API call, branch) and an LLM command generator picks which flow to start; intents become optional.", "Copilot Studio: classic orchestration matches trigger phrases and runs one topic; generative orchestration (the default for new agents) selects topics, tools, agents and knowledge by their descriptions and can chain several in one turn.", "Lex V2: intents with ordered slots, a dialog code hook for logic, conditional branching and confirmation; fulfilment through Lambda.", "Rasa's migration guide advises moving skills that interrupt each other together (money transfer with balance and history) into the same CALM flows, and running old NLU and CALM side by side with a router.", "Rasa claims up to 90 percent less build work for CALM since intent and entity training is not needed; treat that as vendor marketing, not a measured result."], "say": ["Whichever platform it is, I think of it as a router on top and deterministic state underneath. The interesting question is how much the router should be a model, and how little the flows should be.", "For migration I'd run old and new in parallel behind a router and move whole topic areas, not single intents, so interruptions between related skills keep working."], "deep": "The Dialogflow CX model is the cleanest mental picture: a page holds the form (required parameters, entry fulfilment, routes out). Because routing priority is intent first, a user who says something that matches a global intent can leave a half-filled form, which is how digressions are handled, and also how accidental exits happen. Flow-level scoping of intents is the CX answer to scale.\n\nRasa CALM and Copilot Studio generative orchestration both move intent matching from a trained classifier to an LLM that reads descriptions. That cuts the training-data burden, handles multi-request messages and carries context for filling slots. The costs are real: selection is less predictable when two descriptions overlap (Microsoft says the choice then becomes unpredictable), custom entity support is limited in Copilot Studio today, disambiguation prompts were not firing under generative mode per Microsoft's docs, and the planner only sees a limited slice of conversation history. Behaviour can also differ between a fresh test chat and a long live conversation.\n\nIn Rasa's design the split is explicit: the LLM interprets the user into commands (start flow, set slot, cancel), and the flow engine enforces the business logic. That is the version most financial institutions can defend, because the model never writes the steps or the money movement. Coexistence with an NLU system lets a bank keep high-volume stable intents on the cheap classifier while moving messy multi-step tasks to flows.\n\nWhat I would say about choosing: pure intent systems are cheapest, most predictable and easiest to audit; pure LLM agents are most flexible and hardest to certify; the production sweet spot is an LLM or classifier as router with approved deterministic flows for anything that moves money or changes records.", "sources": [{"label": "Google Cloud: Dialogflow CX state handlers", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/handler", "why": "Route types, priority order, built-in no-match and no-input handlers."}, {"label": "Rasa: Migrating an NLU-based assistant to CALM", "url": "https://rasa.com/docs/pro/calm-with-nlu/migrating-from-nlu/", "why": "Coexistence routers, what to move to flows, what stays intent-based."}, {"label": "Microsoft Learn: Orchestrate agent behavior with generative AI", "url": "https://learn.microsoft.com/en-us/microsoft-copilot-studio/advanced-generative-actions", "why": "Classic versus generative orchestration table and known limitations."}, {"label": "AWS: Amazon Lex V2 slots", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/intent-slots.html", "why": "Lex slot, code hook and branching model."}]}, {"id": "a-multiturn-repair", "title": "Multi-turn context, digressions, corrections and disambiguation", "brief": "Most real conversations leave the happy path. The user changes the amount, asks a side question, or switches task mid-flow. The design question is whether the system can pause, answer, and come back, and whether it can change a value it already stored, without restarting or losing state.", "practice": ["Rasa ships repair patterns as reusable flows: pattern_correction (update a stored value and confirm), pattern_continue_interrupted (digressions), pattern_cannot_handle (failed command generation), and clarification.", "In CALM, if you expect a side intent inside a flow, you handle it explicitly (for example with an NLU trigger), rather than hoping the generator copes.", "Context carry-over is a design decision: Copilot Studio's planner reuses recent history to fill inputs ('what is the weather like there'), but history is limited, so key facts sometimes have to be re-collected or restated.", "Disambiguation: when two intents score close, ask a short either-or question instead of guessing. Copilot Studio has a Multiple Topics Matched topic for this, but its docs note generative orchestration did not yet call it.", "Google's conversation repair guidance: expect variation, give reprompts that help or pivot, let the user ask for help or a replay at any point, and fail gracefully.", "For a transaction, treat a mid-flow change ('make it 500') as a slot update plus a fresh confirmation, never as a silent edit."], "say": ["I'd treat digressions and corrections as first-class paths, designed and tested, not as errors. A customer who says 'actually make it 500' should update one slot and get a fresh confirmation.", "When two intents are close I'd ask a one-line either-or question; guessing wrong in a banking flow costs more than one extra turn."], "deep": "There are four kinds of off-path behaviour worth naming. A correction changes a value already given. A digression is a side question that should be answered and then return to the paused task. A topic switch abandons the current task, which needs a stack or at least a clear 'do you want to cancel the transfer?' step when money is half-specified. A clarification is the assistant asking when it cannot tell what was meant. Platforms differ in how much of this they model. CX gives you routes and page state, CALM gives you named patterns and a stack of flows, Lex gives you code-hook control.\n\nContext carry-over has a failure mode that LLM-based planners make more visible: the same message can behave differently in a fresh session and a long one, because the planner conditions on history. In a regulated setting that is a testing problem. You need conversation-level regression tests (scripted multi-turn transcripts, as both Rasa and CX recommend) and a rule for what state is authoritative: the slot store, not the chat history.\n\nPronoun and ellipsis resolution ('that account', 'the same amount') is where a deterministic slot store plus an LLM resolver works well: the LLM proposes a referent from the stored entities, and the system confirms if the action is consequential. For money movement that confirmation is non-negotiable.\n\nSession boundaries matter too. Clear what is carried across authentication changes and across a handoff to an agent. A human who receives the chat should get the collected slots and a summary, so the customer does not repeat themselves.", "sources": [{"label": "Rasa: Conversation patterns (repair)", "url": "https://rasa.com/docs/rasa-pro/concepts/conversation-repair/", "why": "Correction, clarification and interruption patterns in CALM."}, {"label": "Rasa learning: Handling deviations from the happy path", "url": "https://learning.rasa.com/rasa-pro/deviations-from-happypath/", "why": "Practical treatment of digressions and corrections."}, {"label": "Microsoft Learn: Orchestrate agent behavior with generative AI", "url": "https://learn.microsoft.com/en-us/microsoft-copilot-studio/advanced-generative-actions", "why": "History-based context, limited history, disambiguation limitation."}, {"label": "Google: Conversation design, confirmations", "url": "https://developers.google.com/assistant/conversation-design/confirmations", "why": "Confirmation and repair principles used for corrections."}]}, {"id": "a-design-principles", "title": "Conversation design principles: confirmation, errors, handoff and persona", "brief": "Good design spends the user's attention where the risk is. Confirm implicitly when a mistake is cheap, explicitly when an action is hard to undo, and always give a way out. A bot that recognises its limits and hands off early beats one that is clever but traps people.", "practice": ["Google's rule of thumb: implicit confirmation most of the time (restate the parameter and move on), explicit yes/no only when the cost of misunderstanding is high or before an action that is difficult to undo.", "Name three error types: no-match (misheard), no-input (silent), and system error. Each gets its own escalating prompt, and after a set number the flow changes channel or hands off.", "Cooperative principle (Grice): say enough, not too much, relevant, clear. In practice, short first prompts, detail only on the reprompt.", "Turn-taking: one question per turn, closing question that tells the user what to do next; avoid stacking questions, which also confuses intent matching (Dialogflow CX guidance).", "The CFPB spotlight on doom loops and Klarna's 2025 reversal (CEO admitting lower quality and promising a human on request) are the cautionary cases; in finance customers often want a person for sensitive matters even when the bot is correct.", "Persona is a constraint set, not decoration: tone, formality, what it will not discuss, and how it refers to itself as automated. For regulated advice-adjacent topics the persona never offers personalised investment recommendations."], "say": ["I'd confirm implicitly for low-risk values and explicitly before anything hard to reverse, and I'd make sure every error state has a human off-ramp so nobody gets stuck in a loop.", "I think of persona as a set of constraints, including what the assistant must never say, more than a tone of voice."], "deep": "Confirmation design is a risk model. 'Okay, checking balance for your savings account' is an implicit confirmation: the user hears what the system understood and can correct it. A transfer needs the amount, source, destination and date read back, and a clear yes or no before execution, ideally also after execution with a reference number. The common error is asking for explicit confirmation on everything, which burns trust and time, or on nothing, which means one misheard digit moves money.\n\nError handling is a ladder. First failure: rephrase and give an example. Second: narrow the question or offer choices. Third: change mode (menu, keypad, a different channel) or hand off with context. Counting consecutive failures per conversation, not per state, avoids the pattern where a user bounces between states and never hits the limit. Many teams also add sentiment or repetition triggers (the user repeats themselves, uses an expletive, or says 'agent') that skip the ladder.\n\nHandoff is part of the design, not a fallback. A warm transfer passes the intent, slots collected and authentication status so the customer does not start over. Klarna's story is useful because the efficiency numbers were real (millions of chats, handle time cut sharply) but the CEO later said cost-driven automation lowered quality; the lesson for finance is to measure resolution and customer satisfaction on hard cases, not just containment.\n\nOn regulated content: keep investment or tax guidance to approved, reviewed content and clearly label the assistant as automated; do not let the persona drift into personalised recommendations. FINRA's notice 24-09 says its existing rules on communications, recordkeeping and supervision apply to AI-generated communications, so assume chat transcripts are records and content is supervised.", "sources": [{"label": "Google: Conversation design, confirmations", "url": "https://developers.google.com/assistant/conversation-design/confirmations", "why": "Implicit versus explicit confirmation rules of thumb."}, {"label": "CFPB: Chatbots in consumer finance", "url": "https://files.consumerfinance.gov/f/documents/cfpb_chatbot-issue-spotlight_2023-06.pdf", "why": "Regulator view on doom loops, accuracy and escalation."}, {"label": "Entrepreneur: Klarna CEO reverses course by hiring more humans", "url": "https://www.entrepreneur.com/business-news/klarna-ceo-reverses-course-by-hiring-more-humans-not-ai/491396", "why": "The most cited case of over-automating service."}, {"label": "Quadrant Regulatory: FINRA Regulatory Notice 24-09", "url": "https://www.quadrantregulatory.com/regulatory-notice-24-09-finras-guidance-on-generative-ai-and-large-language-models", "why": "Existing communications, recordkeeping and supervision rules apply to gen AI chat."}]}, {"id": "a-voice-vs-chat", "title": "Voice versus chat: ASR errors, no-input, digits and keypad fallback", "brief": "Voice is not chat with a microphone. Speech recognition errors, silence, and the inability to scan a list change how you prompt, confirm and recover. Identifiers are the worst case: language models cannot guess a random account number, so recognition errors are silent and expensive.", "practice": ["Alphanumeric strings lose the language-model prior and letters and digits sound alike (P/B, M/N, O/zero); a Speechmatics write-up notes 96.6 percent word accuracy can still mean only 77 percent exact identifier match.", "Mitigations: biased vocabulary for the active set, grammar constraints, check digits, read-back (group digits and confirm each group), and catalog-aware matching where a near-match auto-corrects only at high confidence.", "IVR prompt ladder in Lex and Connect guidance: short initial prompt, a more detailed prompt on retry, then DTMF-only fallback; Lex lets you set audio-only, DTMF-only or both per slot, with timeouts and end or delete characters.", "Dialogflow CX has sys.no-input for voice silence, separate from no-match; Lex has voice and silence timeouts and a wait-and-continue behaviour for streaming ('hold on a second') while the user finds a number.", "Vanguard's own materials mention 70 plus bots, including a voice bot for address changes, which is a good example of a narrow, transactional voice task with identity checks.", "Chat advantages to use: buttons and quick replies, rich lists, links, long reads. Voice constraints: three or four spoken options at most, no tables, answers short, barge-in handled."], "say": ["In voice I'd never trust a spoken account number without read-back in groups, and I'd offer keypad entry as soon as one retry fails.", "I'd design the same task twice, not port the chat flow: voice needs shorter prompts, fewer choices, and an explicit plan for silence."], "deep": "Voice recognition metrics mislead. A low word error rate sounds fine, but identifiers are all-or-nothing: one wrong character and the lookup fails or, worse, returns the wrong customer. So you constrain the problem. If the set of valid values is known (valid account format, checksum, a list of the caller's own accounts after authentication), use that to correct or reject. Read back in chunks ('four five two, pause, nine one') so the caller can correct a group rather than repeating the whole string.\n\nDTMF is the reliable fallback for sensitive numeric data, and has a security upside: tones are not subject to transcription errors, and the spoken digits of a card number are not spoken aloud in a room or stored in a transcript. A common pattern is to ask for the number by voice once, and on the first miss switch to keypad, with an end character so the system does not wait for the timeout.\n\nNo-input needs its own handling: a first silence usually means the user is searching for something, so a patient reprompt with a hint is right; a second means a distraction or a problem, so offer help or handoff. Barge-in (user speaks over a prompt) should be on for short prompts and off for legal disclosures that must be heard in full.\n\nChat has the opposite risk profile: users type fragments, paste text, switch topic mid-message, and there is no timeout signal. Latency expectations differ (a few seconds is tolerable in chat; in voice, dead air over about a second or two feels broken), which pushes voice designs toward small fast models, streaming and filler acknowledgements.", "sources": [{"label": "AWS ML Blog: Configure DTMF slots and ordered retry prompts with Amazon Lex", "url": "https://aws.amazon.com/blogs/machine-learning/configure-dtmf-slots-and-ordered-retry-prompts-with-amazon-lex", "why": "Short prompt, detailed retry, DTMF fallback pattern with per-slot settings."}, {"label": "Speechmatics: Alphanumeric speech recognition and why assistants mangle SKUs", "url": "https://www.speechmatics.com/company/articles-and-news/alphanumeric-speech-recognition-why-voice-assistants-mangle-skus-and-how-to-fix-it", "why": "Word accuracy versus identifier exact match, and read-back fixes."}, {"label": "AWS: Amazon Lex V2 slots", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/intent-slots.html", "why": "Audio and DTMF input types, timeouts, wait-and-continue."}, {"label": "Vanguard Workplace: Innovation in action", "url": "https://workplace.vanguard.com/insights-and-research/blog/innovation-in-action-how-vanguard-is-improving-financial-wellness-outcomes.html", "why": "Vanguard's own bots, including a voice bot for address changes."}]}, {"id": "a-hybrid-llm-era", "title": "The LLM era: routers, deterministic flows, and where intents still matter", "brief": "The shift is not intents versus LLMs. It is that the LLM took over understanding while deterministic code kept ownership of action. Intents survive wherever you need an auditable label (routing, analytics, compliance) and a cheap fast decision; they are less useful as the unit of dialogue design. Grounding differs by mechanic: an FAQ is grounded by retrieval, a balance by an API, a transfer by a confirmed flow, and compliance answers by approved content.", "practice": ["Wells Fargo's Fargo: speech to text on device, PII scrubbed and tokenized by internal systems, then Google's Flash 2.0 used only to pull intent and entities; the APIs for transfers and lookups never pass through the LLM, and the orchestration layer is model-agnostic. 245.4 million interactions in 2024.", "Bank of America's Erica: still 700 plus curated intents on NLP and ML, not an LLM; BofA's CTO says the job is to map short text to clear intents and execute, and that a 98 percent non-hallucination rate is not enough for money movement. The tech was updated about 75,000 times with human review.", "Rasa CALM: LLM turns messages into commands, flows run the steps; coexistence routers (intent-based or LLM-based) let old NLU and CALM live in one assistant.", "Cognigy markets a Hybrid AI that uses NLU for precise extraction and an LLM for fluid dialogue, with LLM as an NLU fallback; Dialogflow CX has generative fallback on no-match events, with banned phrases and a scripted answer if generation fails (and it is excluded from the CX SLA).", "Where intents still pay: deterministic transactional flows, compliance-reviewed routing, per-intent monitoring and containment analytics, cheap low-latency voice routing, and training signal for evaluation sets.", "Where they matter less: open-ended FAQ and knowledge questions, multi-request messages, long-tail phrasing, and anything where building the intent list is the bottleneck."], "say": ["My rule is that the model can decide what the customer wants, but it should never be the thing that does it. Actions go through deterministic flows with confirmation, balances come from an API, and advice-like answers come from approved content.", "I'd keep a thin intent layer even with an LLM router, because I need a stable label for routing, compliance review and reporting."], "deep": "Grounding is one word covering four different guarantees. FAQ and policy questions are grounded by retrieval with a citation, and the failure mode is a plausible answer from a stale or wrong document, so you test retrieval and keep content versioned. Account facts such as a balance are grounded by an API call, and the rule is the model never generates the number, it only calls and phrases; the failure is a model paraphrasing or rounding a figure. Transactions are grounded by a deterministic flow with explicit confirmation and server-side validation; the failure is a misheard or misresolved slot executed without a read-back. Compliance and advice-adjacent answers are grounded by an approved-content library, and the failure is a free-generated statement that counts as a communication with the public under FINRA's existing rules.\n\nThe hybrid pattern that most banks seem to converge on is: a fast classifier or small LLM does routing, an LLM does slot extraction and disambiguation, and flows own execution. Cost matters: Amazon's EMNLP 2024 industry paper found a classifier-LLM hybrid within 2 percent of LLM accuracy at half the latency, and uncertainty-based routing sends only hard cases to the big model. Fargo's model-agnostic orchestration is the production version of that idea.\n\nWhy BofA still avoids LLMs for Erica is a useful counterpoint to remember. With a closed set of actions and a huge volume, a trained classifier is cheaper, faster, testable per intent and easy to explain to a model risk team. An LLM gains most where the input space is open. The honest answer in an interview is that it depends on the share of traffic that is structured action versus open question.\n\nThe cost of LLM routing is evaluation. You replace a confusion matrix with a regression suite of conversations, and you must re-run it when the model changes, since provider updates alter behaviour. Keep a gold set of real utterances labelled with the intended flow, and measure routing accuracy and escalation recall on it before every change.", "sources": [{"label": "VentureBeat: Wells Fargo's AI assistant crossed 245 million interactions", "url": "https://venturebeat.com/ai/wells-fargos-ai-assistant-just-crossed-245-million-interactions-with-zero-humans-in-the-loop-and-zero-pii-to-the-llm", "why": "LLM limited to intent and entities, APIs outside the model, model-agnostic orchestration."}, {"label": "American Banker: How Bank of America's Erica does the work of 11,000 people", "url": "https://www.americanbanker.com/news/how-bank-of-americas-erica-does-the-work-of-11-000-people", "why": "Why a big bank keeps curated intents, and the accuracy argument."}, {"label": "Rasa: Migrating an NLU-based assistant to CALM", "url": "https://rasa.com/docs/pro/calm-with-nlu/migrating-from-nlu/", "why": "Coexistence of NLU and LLM-driven flows with routers."}, {"label": "Google Cloud: Dialogflow CX generative fallback", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/generative-fallback", "why": "Generative fallback on no-match, banned phrases, scripted fallback, SLA exclusion."}, {"label": "Cognigy: Hybrid AI for intent recognition", "url": "https://www.cognigy.com/product-updates/v4.74", "why": "Vendor view of combining NLU and LLM for intent recognition."}, {"label": "arXiv: Intent Detection in the Age of LLMs", "url": "https://arxiv.org/abs/2410.01627", "why": "Hybrid classifier plus LLM accuracy and latency numbers."}]}, {"id": "a-error-analysis", "title": "Error analysis and production improvement loops", "brief": "Accuracy on a test set is not the metric that tells you what is broken. Production improvement means mining real conversations for unrecognised topics, confusions, loops and escalations, fixing the highest-volume failure first, and guarding with regression tests so a fix does not break a neighbour.", "practice": ["Read the no-match and fallback logs weekly: Dialogflow CX can suggest new intents or extra training phrases from no-match occurrences, and Google's own advice is to add production phrases to training data.", "Topic modelling over transcripts to find call drivers you did not model: Google's Conversational Insights topic models need roughly 10,000 conversations to train well and can then label new conversations, surfacing emerging topics.", "Per-intent precision and recall plus a confusion matrix, not a single accuracy figure; look at the top confused pairs and either merge, split with data, or add a clarifying question.", "Conversation-level metrics: containment, escalation rate and reason, repeat contact within 24 to 72 hours, loop or repeated-turn rate, abandonment at each state, and customer satisfaction on automated sessions.", "Keep test cases and run them on every change: Google tells you to always define test cases to prevent regressions; Rasa recommends end-to-end tests that span old and new systems during migration.", "BofA reports the Erica technology was updated 75,000 times, with human review in the loop, which is the scale of the continuous-improvement habit."], "say": ["I'd start error analysis from the transcripts: the highest-volume failures, the confusion pairs, and the places people repeat themselves or ask for a human. Then fix one cluster, add it to the regression set, and re-measure.", "For regulated intents I'd report recall on those specifically, because a good overall accuracy can hide a missed dispute."], "deep": "A useful way to structure an error review is by layer. Was the speech or text captured correctly (ASR word and identifier errors)? Was the intent right? Were the slots extracted and resolved? Did validation or the backend fail? Was the response appropriate? Tagging each failed conversation with the first layer that went wrong gives you a Pareto chart that points at the fix. Teams that only look at intent accuracy often find the biggest losses are in slot resolution or backend errors.\n\nSilent failures are the dangerous ones: the bot confidently did the wrong thing and the user did not complain in-chat. Look for proxies: a repeat contact on the same topic, a call to the human line shortly after a bot session, a reversed transaction, or a user rephrasing the same request three times. Sampling confident-but-wrong cases for human review is more informative than reviewing low-confidence ones, which are already routed to fallback.\n\nWith LLM components, add judge-based and human-labelled evaluation on a sampled stream, but keep a frozen gold set for comparison across model versions. Log the retrieved passages, tool calls and the final answer so a failed answer can be traced to retrieval, tool, or generation. In finance, the review loop also feeds compliance: complaints and disputes seen in logs must go to the right team, and transcripts are records, so retention and access controls apply.\n\nImprovement discipline: change one thing at a time, run the regression set, ship behind a flag or to a slice of traffic, and watch the escalation and complaint rate alongside containment. A rise in containment with a rise in repeat contact usually means the bot is closing conversations it has not solved.", "sources": [{"label": "Google Cloud: Dialogflow CX intents", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/intent", "why": "Intent suggestions from no-match and negative-example review."}, {"label": "Google Cloud: Customer Experience Insights (CCAI Insights)", "url": "https://cloud.google.com/solutions/ccai-insights", "why": "Topic discovery and conversation analytics product overview."}, {"label": "Medium (Google Cloud community): Topic modeling in Conversational Insights", "url": "https://medium.com/google-cloud/how-topic-modeling-in-google-cloud-conversational-insights-discovers-call-drivers-or-topics-6cb0bf5deb2d", "why": "How topic models find call drivers in transcripts."}, {"label": "Google Cloud: Dialogflow CX general agent design best practices", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/agent-design", "why": "Test cases to prevent regressions and webhook error counting."}, {"label": "American Banker: How Bank of America's Erica does the work of 11,000 people", "url": "https://www.americanbanker.com/news/how-bank-of-americas-erica-does-the-work-of-11-000-people", "why": "Scale of continuous tuning with human review."}]}]}, {"id": "rs-errors", "title": "Error analysis and the improvement loop", "blurb": "How teams find what is failing, what each metric hides, and how a fix ships safely.", "topics": [{"id": "b-error-taxonomy", "title": "An error taxonomy that tells you who fixes what", "brief": "A taxonomy is only useful if each bucket points at a different owner and a different fix. Splitting failures into ASR error, NLU miss, wrong intent, missing intent, entity or slot failure, flow bug, backend failure, policy refusal and user abandonment keeps a conversation designer, an ML engineer and a platform team from all chasing the same transcript. Most teams lump the first five together as 'the bot did not understand', and that hides the cheap fixes.", "practice": ["Label the first point of failure in the conversation, not the last symptom. A bad ASR transcript that leads to a wrong intent that leads to a loop is an ASR error, not a flow bug.", "Amazon Lex V2 analytics already separates the layers: an utterance is Detected or Missed, an intent ends as Success, Failed, Switched or Dropped, and a slot ends as Success, Failed (retries exhausted) or Dropped. That maps cleanly to NLU miss, wrong intent, slot failure and abandonment.", "Wrong intent and missing intent need different cures. Wrong intent means two intents overlap and need cleaner training data or a clarification turn. Missing intent means the user need is not in the design at all, and no amount of retraining helps.", "Backend and API failures must be tagged separately, because they look like NLU failures in a dashboard (the bot says it could not help) but the fix lives in another team's service.", "Policy refusals and compliance escalations are expected outcomes, not errors. Copilot Studio separates escalation reasons into system intended (a business rule, for example a transfer over 25,000 dollars), system unintended (user stuck, for example three failures at one task) and user requested. Only the middle one is a bug signal.", "Airbnb's voice support work is a clean ASR example: moving to domain-tuned speech recognition with phrase lists cut word error rate from about 33% to about 10%, which then improved help-article ranking downstream."], "say": ["I'd tag each failed conversation with the first point it went wrong, ASR, NLU, flow, backend or policy, because each of those has a different owner and a different fix.", "The split I care most about is wrong intent versus missing intent. One is a training-data problem, the other is a design gap, and mixing them hides which one is growing."], "deep": "The practical difficulty is that the layers are coupled. In a voice channel a mis-transcribed account number looks like a slot failure, and a slot that failed three times looks like an abandoned session. If you only look at the outcome metrics you attribute everything to the last layer. That is why teams keep the ASR transcript, the ASR confidence, the top NLU interpretations with scores, the slots filled, and the backend call results in the same trace, and review the whole trace rather than the final text.\n\nWith LLM-based assistants the taxonomy gains new rows rather than losing old ones. You add retrieval failure (right content exists, was not retrieved), grounding failure (answer not supported by retrieved content), tool-call failure (wrong tool or wrong arguments), and instruction-following failure (policy in the prompt was ignored). DoorDash's support team, for example, scored chatbot output on retrieval correctness, response accuracy, language quality, coherence to context and relevance to the request. Capital One describes multi-agent failure modes such as losing the original intent across turns, contradicting earlier decisions, circular repeated questions, and early mistakes compounding in multi-step tasks.\n\nIn regulated finance the taxonomy needs one more axis: severity. A wrong answer about a marketing fund is a quality defect. A wrong answer about a fee, a deadline, a dispute right or a balance is a potential compliance event. The CFPB's 2023 spotlight on bank chatbots names four failure patterns it cares about: failing to recognize a dispute, giving inaccurate information, doom loops with no human off-ramp, and blocked access to a human. A good taxonomy tags those four explicitly so they can be counted and reported separately from ordinary misses.", "sources": [{"label": "Amazon Lex V2: Key definitions (analytics)", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/analytics-key-definitions.html", "why": "Exact vendor definitions of intent, slot, conversation and utterance outcomes."}, {"label": "Microsoft Learn: Monitor conversational agents (Copilot Studio)", "url": "https://learn.microsoft.com/en-us/microsoft-copilot-studio/analytics-improve-agent-effectiveness", "why": "Resolved, escalated (three reasons), abandoned and unengaged session outcomes."}, {"label": "Airbnb Tech: How ML transforms Airbnb's voice support experience", "url": "https://airbnb.tech/ai-ml/listening-learning-and-helping-at-scale-how-machine-learning-transforms-airbnbs-voice-support-experience/", "why": "ASR word error rate 33% to about 10%, intent detection under 50ms."}, {"label": "CFPB: Chatbots in consumer finance", "url": "https://www.consumerfinance.gov/data-research/research-reports/chatbots-in-consumer-finance/chatbots-in-consumer-finance/", "why": "The four regulator-named failure patterns for bank chatbots."}, {"label": "Constellation Research: How Capital One evaluates, governs its AI agents", "url": "https://www.constellationr.com/insights/news/how-capital-one-evaluates-governs-its-ai-agents", "why": "Multi-agent failure modes in a regulated bank."}]}, {"id": "b-conversation-review", "title": "How teams actually review conversations", "brief": "Nobody reads a random sample and hopes. Teams filter for the conversations most likely to contain a defect (fallbacks, low NLU confidence, escalations, thumbs down, repeated rephrasing), tag them against the taxonomy, and convert each finding into a training example, a test case or a ticket. Random sampling is kept as a separate, smaller stream so you can estimate the overall error rate without bias.", "practice": ["Two sampling streams: a targeted stream (fallback invoked, low intent confidence, user asked for a human, negative feedback, very long conversations) to find defects fast, and a random stream to measure true rates.", "Rasa's conversation-driven development loop is share, review, annotate, test, track, fix. Its review guidance says to drop very short conversations, exclude internal testing channels, and prioritise fallbacks and low-confidence NLU. Studio lets you filter by predicted intent, flow, channel, slots and tags, and mark a conversation reviewed.", "A review pass asks four things: did the assistant err and how, what was the user's tone, how did the user phrase it, could the user reach their goal. The last one is the one outcome metrics miss.", "Annotation queues: a lead annotator assigns, reviewers label intent and entity, a second person approves, and approved messages become training data. Rasa Studio documents this roles model.", "LLM-assisted review: DoorDash manually read thousands of transcripts first, then prompted an LLM judge with open-ended questions and summarised the answers into recurring issue types, then calibrated the judge against human-labelled random samples.", "Redaction comes before review in finance: transcripts carry account numbers and personal data, so reviewers see masked text and access is role-restricted and logged."], "say": ["I'd keep two streams, a targeted one for fallbacks and low-confidence turns to find defects fast, and a small random one so I can still estimate the real error rate.", "Every reviewed conversation should end in one of three things: a training example, a regression test, or a ticket for another team. If it ends in a note, the loop is not closed."], "deep": "The failure mode of review is that it becomes a reading habit with no output. The fix is to make the queue produce artifacts. A tagged conversation where the intent was wrong becomes a labelled utterance for the NLU set and a confusion-matrix entry. A conversation where the flow looped becomes a regression test that must pass before the next release. A conversation where the backend returned an error becomes a ticket with the trace attached. Tracking tags such as out-of-scope or needs-new-intent then turn into a backlog that product can prioritise by volume.\n\nTargeted sampling biases your picture, so keep the random stream. If targeted review says fallback conversations are mostly out-of-scope, but random review shows many silent wrong-intent turns where the bot answered confidently and incorrectly, you have learned that the confidence threshold is too low. Silent wrong answers never trigger a fallback, so they only show up in random or outcome-based sampling, for example conversations followed by a repeat contact.\n\nIn regulated finance the review has a second audience. Compliance or model risk will want a documented sampling plan, a record of what was reviewed and by whom, and evidence that findings were remediated. Capital One describes human subject-matter experts auditing complex financial logic and calibrating the LLM judges, which is the pattern: automation for coverage, humans for ground truth and for the high-severity categories.", "sources": [{"label": "Rasa: CDD playbook, review and annotate conversations", "url": "https://info.rasa.com/cdd-playbook-review", "why": "The share-review-annotate-test-track-fix loop and what to filter on."}, {"label": "Rasa Docs: Conversation Review", "url": "https://rasa.com/docs/studio/analyze/conversation-review", "why": "Filters, tags and reviewed status in a real review tool."}, {"label": "ZenML LLMOps database: DoorDash LLM-based Dasher support automation", "url": "https://www.zenml.io/llmops-database/llm-based-dasher-support-automation-with-rag-and-quality-controls", "why": "Transcript review into an LLM judge, calibrated against human samples (secondary summary of DoorDash's post)."}, {"label": "Constellation Research: How Capital One evaluates, governs its AI agents", "url": "https://www.constellationr.com/insights/news/how-capital-one-evaluates-governs-its-ai-agents", "why": "Human experts calibrating LLM judges in a regulated bank."}]}, {"id": "b-intent-confusion", "title": "Confusion matrices, ambiguity and which intents collide", "brief": "Intent confusion is mostly a data and design problem, not a model problem. Two intents collide because users use the same words for different needs (card lost versus card blocked, dispute versus inquiry about a charge), or because the training sets overlap. The confusion matrix tells you which pairs collide, and the top-two score gap tells you at runtime when to ask instead of guess.", "practice": ["Run a held-out labelled set through the NLU and build a confusion matrix over intents. Look at off-diagonal pairs, not overall accuracy. Cyara Botium's NLP analytics reports confusion matrices and overlap between intents.", "Amazon Lex returns the top intent plus up to four alternatives with scores. The docs give the example of 0.95 against 0.65 as clear, and 0.75 against 0.72 as ambiguous, and suggest using domain logic to confirm or elicit. Scores are comparative, not absolute, and can shift when the platform model updates.", "Below a confidence threshold the bot falls back. The threshold is set per language (nluIntentConfidenceThreshold in Lex). Too low gives silent wrong answers, too high gives fallback loops.", "Typical fixes by cause: merge intents that users cannot tell apart, split intents that hide two different backend actions, add a disambiguation turn for known pairs, or move the distinction into a slot.", "Lex's automated chatbot designer explicitly removes overlap between discovered intents so they are well separated, which is the same concern from the design side.", "Granularity matters: 'dispute a transaction' and 'ask about a transaction' share most words but one starts a regulated process, so they must be separated and the ambiguous case must default to the safer path."], "say": ["I look at the off-diagonal pairs in the confusion matrix, because overall accuracy hides that one risky pair, like dispute versus inquiry, might be failing the most.", "For close scores I'd rather ask a short clarifying question than guess, especially where one of the two intents starts a regulated process."], "deep": "Confusion is asymmetric in cost. Mistaking 'what is my balance' for 'what are my balances across accounts' is harmless. Mistaking 'I do not recognise this charge' for 'show my recent transactions' means the bot fails to recognise a dispute, which is the specific failure the CFPB called out. So the threshold and the disambiguation policy should be per intent pair, with the safer branch winning ties. Many teams add a rule that any utterance containing dispute or fraud vocabulary routes to a human or to a dedicated flow regardless of the classifier's top score.\n\nWith LLMs the same problem shows up differently. A prompt-based router can drift when the prompt changes, and a few-shot classifier may be confidently wrong where a trained classifier would have been uncertain. The fix is the same in spirit: keep a labelled set that includes the hard near-miss pairs, measure per-class precision and recall for every prompt or model change, and calibrate confidence (for example with logit-based scores, a verification pass, or agreement across samples) before using it as a gate.\n\nOne trap is training-set leakage. If you add production utterances to the training data and then evaluate on a set that includes them, accuracy rises without anything improving. Keep a frozen golden set that is never trained on, refresh it on a schedule from fresh production traffic, and report both.", "sources": [{"label": "Amazon Lex V2: Using intent confidence scores", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/using-intent-confidence-scores.html", "why": "Top-five interpretations, ambiguity example, fallback threshold behaviour."}, {"label": "Cyara: NLP analytics for conversational AI", "url": "https://cyara.com/products/botium/nlp-analytics-for-conversational-ai-in-cx/", "why": "Intent confusion matrix and overlap analysis in an enterprise testing product."}, {"label": "AWS ML Blog: Expedite conversation design with the automated chatbot designer in Amazon Lex", "url": "https://aws.amazon.com/blogs/machine-learning/expedite-conversation-design-with-the-automated-chatbot-designer-in-amazon-lex", "why": "How discovered intents are kept well separated."}, {"label": "CFPB: Chatbots in consumer finance", "url": "https://www.consumerfinance.gov/data-research/research-reports/chatbots-in-consumer-finance/chatbots-in-consumer-finance/", "why": "Why a missed dispute is a regulated-risk confusion, not a quality blip."}]}, {"id": "b-intent-discovery", "title": "Finding the intents you did not design", "brief": "The unhandled long tail is where the next intents come from. Teams cluster missed utterances and agent-handled transcripts, name the clusters, size them by volume, and then decide per cluster: new intent, FAQ content, or a human-only path. Clustering proposes, a designer disposes, and compliance gets a say on anything that touches money or advice.", "practice": ["Lex automated chatbot designer: upload agent-customer transcripts (Contact Lens schema, English US), it semantically clusters them into proposed intents, sample utterances and slot types, and links each back to the source conversations for review. AWS says about 600 lines of transcript are analysed per minute.", "Google Conversational Insights topic modeling: an LLM-based model creates a taxonomy of primary and secondary call drivers from your conversations. Google suggests at least 10,000 conversations for good accuracy and offers five granularity levels (more coarse to more fine). You can add, rename or remove topics to fine-tune, then deploy for real-time topic inference in 38 languages.", "Copilot Studio Themes cluster user questions into AI-suggested categories, and its Unanswered questions view breaks down why the agent could not answer, which feeds topic and knowledge work.", "Intercom Fin's Topics Explorer groups conversations into topics and subtopics and lets you sort by Fin's involvement rate to see where automation is weakest. Its Optimize feature reviews conversations Fin could not answer and suggests content, data and action fixes weekly.", "Kore.ai's Discourse Analyzer generates candidate conversation flows and intents from historical chat or call transcripts, and Rasa's NLU inbox surfaces low-confidence user messages for labelling.", "Decision rule per cluster: volume, value, risk and feasibility. A big, low-risk cluster with an answer in the knowledge base becomes content. A big cluster that needs account data becomes a new intent with an API. A regulated cluster stays human or gets an approved-content answer."], "say": ["I'd cluster the missed utterances and the live-agent transcripts, size the clusters by volume, and then decide per cluster whether it needs a new intent, a content fix or stays with a human.", "Clustering is a proposal. A designer still has to check whether two clusters are really one need, and whether the need is something the bot is allowed to handle at all."], "deep": "Discovery tools differ in what they discover from. Lex's designer and Kore.ai's discourse analysis mine human-to-human transcripts, so they find what customers ask live agents, which is a good prior for what the bot should cover. Insights topic modeling mines the contact-center stream and can be run on bot conversations too. Themes and Topics Explorer mine the bot's own traffic, so they find what people actually try with the bot, which includes things you may never want it to do.\n\nPitfalls: clusters follow vocabulary, not need, so 'cancel' may mix cancelling a subscription, cancelling a transfer and cancelling a card. Granularity is a knob and there is no right setting, so teams look at two levels and check examples. Topic scores are model-specific and cannot be compared across models. Clustering also over-weights verbose reasons and under-weights short, frequent ones.\n\nIn finance, the discovered long tail should be triaged against a scope policy. Some intents (account balance, branch hours, how to download a statement) are safe to automate. Others (hardship requests, disputes, complaints, anything that sounds like advice or a suitability question) route to people, and the discovery pipeline should mark them as such so a designer does not quietly build a bot flow for them because the volume looks attractive.", "sources": [{"label": "AWS Docs: Creating Lex V2 bots using the Automated Chatbot Designer", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/designing.html", "why": "Transcripts in, suggested intents and slot types out, with source conversations."}, {"label": "AWS ML Blog: Automated chatbot designer in Amazon Lex", "url": "https://aws.amazon.com/blogs/machine-learning/expedite-conversation-design-with-the-automated-chatbot-designer-in-amazon-lex", "why": "Clustering, review workflow, processing speed."}, {"label": "Google Cloud: Topic modeling basics (Conversational Insights)", "url": "https://docs.cloud.google.com/contact-center/insights/docs/topic-modeling-basics", "why": "Call driver taxonomy, fine-tuning, real-time topic inference."}, {"label": "Google Cloud blog: Get started with CCAI Insights", "url": "https://cloud.google.com/blog/topics/developers-practitioners/next-reaction-monitor-your-conversations-get-started-ccai-insights", "why": "Product overview of monitoring and insights over conversations."}, {"label": "Microsoft Learn: Monitor conversational agents (Copilot Studio)", "url": "https://learn.microsoft.com/en-us/microsoft-copilot-studio/analytics-improve-agent-effectiveness", "why": "Themes and unanswered-question analysis."}, {"label": "Intercom Help: Top ten ways to optimize Fin", "url": "https://www.intercom.com/help/en/articles/9790492-top-ten-ways-to-optimize-fin", "why": "Topics Explorer, scorecards, batch testing, monitoring loop."}]}, {"id": "b-metrics-hide", "title": "Production metrics and what each one hides", "brief": "Every headline metric has a way of looking good while the customer suffers. Containment counts abandonment as success. Deflection counts a ticket not filed, not a problem solved. A low escalation rate can mean the bot is trapping people. You need a small set read together, plus a re-contact metric that checks whether the issue really ended.", "practice": ["Containment: share of sessions that did not reach a human. Hides abandonment and false containment, where a customer gives up or calls back. Pair it with re-contact within 24 hours to 7 days and with mid-session abandonment.", "Resolution: Copilot Studio distinguishes Resolved confirmed (the user confirms) from Resolved implied (the session simply ends or times out). Intercom Fin counts a resolution when the customer confirms or leaves without asking for more help, and treats 24 hours of silence as an assumed resolution. Implied and assumed resolution are guesses, so report them separately from confirmed.", "Escalation rate and reasons: Copilot Studio splits system intended, system unintended and user requested. The rate alone is meaningless, the mix is the signal. Rising system unintended means users are stuck.", "Fallback or no-match rate: Dialogflow CX experiments track no-match occurrences, turn counts, live-agent handoff and abandonment per variant. Very high turn counts in a simple task suggest loops.", "CSAT: response rates are low and skewed to extremes, so it hides the silent majority. Use sentiment over sampled sessions as a cross-check.", "Agent assist metrics are different: average handle time, first-contact resolution, suggestion acceptance and edit distance. Uber's COTA cut handling time about 10% in A/B tests, and its deep-learning v2 cut a further 6.6%."], "say": ["I'd never report containment alone. I'd put it next to confirmed resolution, re-contact within a few days and abandonment, because containment goes up when customers give up.", "For a regulated assistant I'd also watch the mix of escalation reasons, because a low escalation rate with rising system-unintended escalations means people are getting stuck, not served."], "deep": "Vendors price and market on these metrics, which shapes their definitions. Intercom charges 0.99 dollars per resolution and counts assumed resolutions, which is a defensible default but does mean a customer who left angry within the window is counted as resolved. Salesforce reports that its Agentforce agent on the Help site resolved about 76% of 1.7 million conversations without a human and escalated about 5%. Those two numbers do not sum to 100, which tells you that outcomes include abandonment and other states. When you read a vendor figure, ask how the denominator and the resolution rule are defined.\n\nKlarna is the cautionary tale for optimising the wrong metric. Its assistant handled about two-thirds of chats within the first month, and the company later said it had focused too much on efficiency and cost, with quality suffering, and resumed hiring human agents for complex cases. Bank of America publishes volume and satisfaction-style claims for Erica (over 3 billion interactions, more than 98% of users find the information they need), but those are self-reported and say little about the hard 2% or about outcomes.\n\nIn banking the best guardrail metric is probably re-contact on the same issue across channels, because customers who fail in chat call the contact center. Join chat sessions to call records by customer and topic within a window. Add a separate regulatory view: complaints that mention the chatbot, disputes not recognised, and time to reach a human once requested. The CFPB reports that a large share of consumers who interacted with chatbots needed human help afterwards, so regulators will ask for exactly that kind of evidence.", "sources": [{"label": "Microsoft Learn: Monitor conversational agents (Copilot Studio)", "url": "https://learn.microsoft.com/en-us/microsoft-copilot-studio/analytics-improve-agent-effectiveness", "why": "Resolved confirmed versus implied, escalation reasons, abandoned after 30 minutes, CSAT mapping."}, {"label": "Intercom Help: Fin AI Agent resolutions (community mirror)", "url": "https://intercom.help/fin4all/en/articles/10772642-fin-ai-agent-resolutions", "why": "Confirmed versus assumed resolution definition and the 24-hour rule."}, {"label": "Voiceflow: What ticket deflection rate actually means", "url": "https://www.voiceflow.com/blog/what-ticket-deflection-rate-actually-means", "why": "What deflection hides (secondary source)."}, {"label": "Salesforce: Agentforce for customer support", "url": "https://www.salesforce.com/customer-stories/agentforce-for-customer-support/", "why": "1.7 million conversations, 76% resolved, 5% escalated, case summary on handoff."}, {"label": "Bank of America newsroom: Erica surpasses 3 billion interactions", "url": "https://newsroom.bankofamerica.com/content/newsroom/press-releases/2025/08/a-decade-of-ai-innovation--bofa-s-virtual-assistant-erica-surpas.html", "why": "Self-reported scale and satisfaction claims, 75,000 updates."}, {"label": "Uber Engineering: COTA v2", "url": "https://www.uber.com/us/en/blog/cota-v2/", "why": "Agent-assist metrics: top-1 accuracy and handling time deltas."}]}, {"id": "b-regression-testing", "title": "Regression testing a bot: golden sets, test cases, prompt suites", "brief": "A bot regresses silently. Retraining an intent model, editing a flow or changing a prompt can break something unrelated, and nobody sees it until customers do. The answer is a layered suite: deterministic conversation tests for flows, a frozen labelled set for NLU, and for LLM behaviour a prompt-level eval suite that blocks a release when it fails, with every production bug added as a new case.", "practice": ["Dialogflow CX test cases: save a simulator conversation as a test case. It stores expectations per turn (agent response, current flow, page, intent, tool use) and checks them on rerun. Intent and page mismatches fail the test, while a change in the agent's wording only warns. 'Save as golden' resets the baseline when a change is intended. Coverage reports exist for transitions, intents and route groups.", "Dialogflow CX continuous tests run a chosen set of test cases against an environment daily and report results, which catches drift from dependencies and settings changes. (Documented as preview at the time of the fetch.)", "NLU regression: a frozen golden utterance set per intent, with per-intent precision and recall and a diff against the last release. Botium and Cyara package this with confusion matrices, functional, regression, performance and security tests.", "DoorDash uses Promptfoo, which it likens to unit tests, to block failing prompt changes from deploying, and each newly found production issue is added to the suite. It also built a simulation and evaluation platform for support chatbots.", "Intercom lists simulations, batch tests and previews as the pre-deployment tools for Fin.", "For regulated content, add must-never tests: the bot must not state a rate, give a tax or investment recommendation, or confirm a transaction without the confirmation step."], "say": ["My rule is that every production bug becomes a test before it is fixed. Over time that turns the incident history into the regression suite.", "For an LLM assistant I'd run the eval suite on every prompt or model change and block the release on the must-never cases, with softer thresholds on quality scores."], "deep": "Deterministic tests and statistical tests need different treatment. A flow test (this input leads to this page and this API call) should pass or fail exactly. An NLU or LLM test is statistical, so you set thresholds on aggregates (per-intent recall, groundedness rate) and also hard gates on a small list of critical cases that must never fail. The CX test design reflects this: intent and page are hard checks, and wording differences are warnings, because generated or templated text varies.\n\nLLM-era suites add simulated users. DoorDash's one-click simulation and evaluation platform uses LLM-played customers to exercise the bot at scale. The risk is that the simulator shares blind spots with the bot, so keep a set of real, anonymised production conversations replayed as multi-turn tests and compare outcomes between versions.\n\nAlso test the unglamorous layers: backend timeouts and error codes, ASR noise (add noisy or accented audio for voice), channel differences, and long conversations where context is lost. In finance, keep an auditable record of which test suite version passed for each release, because model risk management will ask what was tested before a change went live.", "sources": [{"label": "Google Cloud: Dialogflow CX test cases", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/test-case", "why": "What is asserted per turn, golden baselines, coverage reports."}, {"label": "Google Cloud: Dialogflow CX continuous tests and deployment", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/continuous-tests", "why": "Daily test runs per environment."}, {"label": "Cyara: Botium conversational AI testing", "url": "https://cyara.com/products/botium/", "why": "Third-party testing platform for functional, regression, NLP and security tests."}, {"label": "ZenML LLMOps database: DoorDash Dasher support automation", "url": "https://www.zenml.io/llmops-database/llm-based-dasher-support-automation-with-rag-and-quality-controls", "why": "Promptfoo as unit tests, issues fed back into suites (secondary summary)."}, {"label": "DoorDash: one-click simulation and evaluation platform for support chatbots", "url": "https://careersatdoordash.com/blog/doordashs-one-click-simulation-and-evaluation-platform-for-support-chatbots/", "why": "Primary post on simulation-based evaluation (page returned 403 to my fetch, content known from search results only)."}]}, {"id": "b-release-practice", "title": "Releasing a bot: versions, environments, canaries and experiments", "brief": "Treat a bot like any service: immutable numbered versions, environments, a pointer you can flip back, and a gradual rollout watched against real metrics. The twist is that the metrics are noisy and delayed, so you pin sessions to one variant, run long enough to see re-contact, and have stop conditions that include a compliance gate.", "practice": ["Lex V2: a version is a numbered snapshot, and an alias points to a version. Clients call the alias, so you publish version 2 and move the alias, and move it back to roll back. That is blue and green deployment for a bot.", "Dialogflow CX: create flow versions, publish them to separate environments, then run an experiment with one control (usually production) and one to four variants with traffic allocation summing to 1.0. Metrics compared include live-agent handoff, no-match, session end, turn counts and, on telephony, contained, callback and abandon rates.", "Auto rollout in CX increases traffic to a variant in time steps until conditions are met, then promotes it to default. A stopped experiment cannot be restarted.", "One experiment per flow at a time, so design the bot as separate flows (authentication, balance, disputes) that can be tested independently.", "For LLM changes: shadow mode first (run the new version on live traffic, log, do not show), then 1 to 5% canary, then ramp, with an automatic rollback on a bad guardrail rate or escalation spike. This is standard release practice applied to bots rather than a documented vendor recipe.", "Airbnb's Automation Platform v2 gives prompt writers a playground that moves between development and production environments and adds LLM observability (latency, token usage per call)."], "say": ["I'd release a bot change the way I'd release a service: versioned, behind an alias, shadow first, then a small canary with rollback tied to guardrail metrics.", "In finance I'd add a gate before any ramp: the must-never test suite passes and a risk reviewer signs off on content changes."], "deep": "A bot experiment is harder than a web A/B test. Users are in multi-turn sessions, so assignment has to be per session. The outcomes you care about (issue really solved, no repeat call) arrive days later, so a one-day experiment mostly measures style. Traffic can be small for rare, high-value intents like disputes, so you may never reach significance on them. The practical answer is to run experiments on frequent, low-risk flows, and to use offline evals and human review for rare, high-risk ones.\n\nSeparate configuration from model. A change to a threshold, a prompt, a knowledge article, an API timeout and a model version are all releases and should be versioned together so a rollback restores a known good state. Content-only changes, such as a new FAQ article, often move resolution rate more than model changes. Intercom's own analysis stresses that knowledge-base upkeep tied to product releases separates high-resolution teams from low ones.\n\nIn regulated finance the release process often needs change records, approvals, and a way to show what content the assistant could say at a given date. Versioned, immutable approved-content libraries and conversation logs retained under the firm's records policy make that possible. Vanguard describes its governance as evaluating model performance, detecting bias and drift, and monitoring usage, which is the kind of oversight this release process feeds.", "sources": [{"label": "AWS Docs: Versioning and aliases with your Lex V2 bot", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/versions-aliases.html", "why": "Numbered versions and alias pointers for blue and green releases."}, {"label": "Google Cloud: Dialogflow CX experiments", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/experiments", "why": "Control and variant traffic split, metrics compared, auto rollout."}, {"label": "ZenML LLMOps database: Airbnb Automation Platform v2", "url": "https://www.zenml.io/llmops-database/evolving-a-conversational-ai-platform-for-production-llm-applications", "why": "Playground across environments, guardrails framework and LLM observability (secondary summary)."}, {"label": "MIT Sloan Management Review: Investing in AI payoffs at Vanguard", "url": "https://sloanreview.mit.edu/article/investing-in-ai-payoffs-at-vanguard/", "why": "How Vanguard frames monitoring, drift and governance for its AI work."}]}, {"id": "b-feedback-drift", "title": "Retraining cadence, drift and feedback from live agents", "brief": "Models decay because the world changes: new products, new fee schedules, a market event that floods the bot with one topic. The loop that works pairs a fixed retraining cadence with drift monitors, and treats live agents as the best labelling source, because what the human agent does after the bot hands off is the ground truth for what the customer needed.", "practice": ["Uber's COTA is the reference for the human feedback loop. In v1, agent resolutions were the labels (the solution the agent actually used as positive, sampled others as negative), framed as ranking over more than 1,000 candidate solutions after first picking an issue type from thousands. That gave a 25% relative accuracy gain over plain multi-class classification and handled about 90% of inbound tickets.", "COTA v2 said plainly that model performance decays over time, and built a model lifecycle pipeline that retrains and redeploys at fixed intervals. Deep learning lifted top-1 accuracy for the Contact Type model from 49% to 65% and for the Reply model from 47% to 55%.", "Handoff context is itself a feedback source: Salesforce's help agent passes a case summary to the human engineer, and the engineer's final resolution and category are a free label for the bot's failed conversation.", "Drift monitors: input drift (share of utterances below the confidence threshold, new vocabulary, rising no-match), output drift (intent distribution shift, escalation mix) and outcome drift (re-contact, thumbs down). Alert on shifts in intent mix, not only on accuracy, because accuracy needs labels.", "Content freshness is the cheapest drift fix for retrieval assistants: Intercom ties high resolution rates to ongoing knowledge work on every product release and ships weekly suggestions from conversations Fin could not answer.", "Bank of America reports more than 75,000 updates to Erica since launch (self-reported), which shows the shape: many small, continuous changes rather than big model rewrites."], "say": ["I treat the human agent's resolution as a free label. If the bot hands off and the agent files it under a certain reason, that is the label I want for the failed turn.", "I'd retrain on a schedule but alert on shifts in the intent mix, because a sudden jump in one topic or in no-match tells me something changed before accuracy numbers do."], "deep": "Agent feedback is biased. Agents pick the first reasonable option, choose different options for the same issue, and under time pressure skip the correction step. Uber's framing, using the agent's chosen resolution as positive and random non-chosen solutions as negatives, accepts that noise and relies on volume. For smaller teams, add a lightweight check: periodically have a second reviewer relabel a sample, measure agreement, and drop categories where agents themselves disagree because the taxonomy is the problem, not the model.\n\nRetraining has risks of its own. A fixed cadence can ship a worse model if nobody checks the golden set, and retraining on production utterances the bot already handled confidently reinforces its own biases (selection bias). Good practice is human-reviewed labels for the training additions, a frozen golden set for gating, per-class metrics in the release report, and a rollback plan.\n\nFor finance, drift has a calendar. Tax season, market volatility, a fee change, a fraud wave or a platform outage all change what customers ask, and the right response is often content and routing changes in hours, not a model retrain in weeks. Keep a fast path for approved content updates, with its own review, separate from the slower model path.", "sources": [{"label": "Uber Engineering: COTA, improving Uber customer care with NLP and ML", "url": "https://www.uber.com/blog/cota/", "why": "Agent resolutions as labels, ranking formulation, 25% relative accuracy gain, about 10% handle-time reduction."}, {"label": "Uber Engineering: Scaling COTA with deep learning", "url": "https://www.uber.com/us/en/blog/cota-v2/", "why": "Model decay, scheduled lifecycle pipeline, accuracy and handle-time numbers."}, {"label": "Salesforce: Agentforce for customer support", "url": "https://www.salesforce.com/customer-stories/agentforce-for-customer-support/", "why": "Case summaries on escalation, resolution and escalation percentages."}, {"label": "Intercom Help: Top ten ways to optimize Fin", "url": "https://www.intercom.com/help/en/articles/9790492-top-ten-ways-to-optimize-fin", "why": "Ongoing monitoring and content upkeep loop."}, {"label": "Bank of America newsroom: Erica surpasses 3 billion interactions", "url": "https://newsroom.bankofamerica.com/content/newsroom/press-releases/2025/08/a-decade-of-ai-innovation--bofa-s-virtual-assistant-erica-surpas.html", "why": "75,000 updates and scale, as self-reported claims."}]}, {"id": "b-llm-eval-regulated", "title": "LLM-era error analysis in a regulated bank", "brief": "With LLMs the error analysis loop is the same but the instruments change: an LLM judge scores sampled conversations, a guardrail layer checks responses before they ship, and humans calibrate the judge on the high-severity cases. In a bank you also need the paper trail, and a fast human off-ramp, because regulators judge outcomes and access, not model quality.", "practice": ["DoorDash's support bot uses a two-tier guardrail: a cheap semantic-similarity check against the knowledge-base articles first, and an LLM check only when the first tier flags something. Failed answers can be retried or routed to a human agent, and the team accepts the latency cost. It reports a 90% drop in hallucinations and a 99% drop in compliance issues (self-reported).", "DoorDash also monitors quality offline with an LLM judge over sampled conversations, scoring retrieval correctness, accuracy, language, coherence and relevance, with random human review to keep the judge calibrated.", "Capital One describes an evaluation-first architecture with an LLM judging the chain of agents, contextual-accuracy metrics to catch hallucination, moving averages for statistical depth, and human subject-matter experts calibrating the judges.", "Copilot Studio samples answered questions and rates them Good or Poor on completeness, relevance and groundedness, with a reason for each Poor answer. That is a built-in, sampled quality metric rather than a full audit.", "LinkedIn's customer service system pairs retrieval over a knowledge graph of past tickets with an LLM and reports a 28.6% drop in median resolution time over six months for agents using it.", "Vanguard's own disclosed work is internal: Crew Assist lets contact-center staff query internal content using Azure OpenAI, with governance for model performance, bias, drift and usage monitoring."], "say": ["I use an LLM judge for coverage but I never trust it unaudited. I calibrate it against human labels on a sample and keep humans on the high-severity categories.", "For a bank I'd start with agent assist, where a human reads the answer, and expand to customer-facing automation only for intents with strong grounding and a tested off-ramp."], "deep": "An LLM judge is a model with its own errors. It prefers long answers, tends to agree with plausible text, and is weak on numerical or policy details unless given the source. Calibrate it: have humans label a few hundred conversations, compare agreement per criterion, and write criteria narrow enough to be checkable, for example 'every number in the answer appears in the retrieved passage or the API result'. Re-check agreement whenever the judge model or prompt changes. Use the judge to rank and triage, and use humans for the final call on anything that touches compliance.\n\nThe regulated-finance angle is evidence and off-ramps. The CFPB's issue spotlight names inaccurate answers, failure to recognise disputes, doom loops and blocked human access, and says each of the largest banks already runs a chatbot, so scrutiny is on outcomes. That implies concrete engineering: a visible and fast path to a person, no loops (a hard cap on repeated failures, then escalate), logs that show what the customer asked and what the assistant said, and a record of how errors were found and fixed. Capital One's statement that regulation shapes its approach, and treats governance as something built into developer libraries, is the same idea expressed as platform design.\n\nA caution on numbers: many of the figures in vendor and company posts (hallucination reduction, resolution rates, satisfaction) are self-reported and use the publisher's own definitions. In an interview it is better to say what you would measure and how you would validate it than to quote a headline number as fact.", "sources": [{"label": "ZenML LLMOps database: DoorDash Dasher support automation", "url": "https://www.zenml.io/llmops-database/llm-based-dasher-support-automation-with-rag-and-quality-controls", "why": "Two-tier guardrail, LLM judge, human calibration, self-reported reductions (secondary summary)."}, {"label": "Constellation Research: How Capital One evaluates, governs its AI agents", "url": "https://www.constellationr.com/insights/news/how-capital-one-evaluates-governs-its-ai-agents", "why": "Evaluation-first architecture and human calibration in a bank."}, {"label": "VentureBeat: How Capital One built production multi-agent AI workflows", "url": "https://venturebeat.com/ai/how-capital-one-built-production-multi-agent-ai-workflows-to-power-enterprise-use-cases", "why": "Chat Concierge multi-agent design including an agent that checks the others (from search results, not fetched)."}, {"label": "CFPB: Chatbots in consumer finance", "url": "https://www.consumerfinance.gov/data-research/research-reports/chatbots-in-consumer-finance/chatbots-in-consumer-finance/", "why": "What a regulator says goes wrong and what it will look for."}, {"label": "arXiv: Retrieval-Augmented Generation with Knowledge Graphs for Customer Service Question Answering (LinkedIn)", "url": "https://arxiv.org/pdf/2404.17723", "why": "28.6% median resolution time reduction and the method behind it (figures from search results)."}, {"label": "MIT Sloan Management Review: Investing in AI payoffs at Vanguard", "url": "https://sloanreview.mit.edu/article/investing-in-ai-payoffs-at-vanguard/", "why": "Vanguard's Crew Assist and governance framing."}]}]}, {"id": "rs-grounding", "title": "Grounding, per mechanic", "blurb": "Grounding is not one thing: each kind of answer has its own source of truth and its own failure.", "topics": [{"id": "c-grounding-per-mechanic", "title": "Grounding is not one thing: one mechanic, one grounding, one failure mode", "brief": "People say 'ground the model' as if it were one fix. In a bank each thing the assistant does is grounded differently: an FAQ answer by retrieval with a citation, a balance by an API call that is rendered and never generated, a money movement by a deterministic flow with explicit confirmation, a compliance answer by an approved-content library. The failure mode differs too, so the control and the eval differ.", "practice": ["Knowledge and FAQ: retrieve from an approved corpus, answer only from the passages, cite them. Failure: a fluent claim the passages do not support. Control: groundedness check on the answer plus abstention when retrieval is weak.", "Account and personal data: a tool call to the system of record, then a template renders the number. Failure: the model writes a digit itself, or calls the tool for the wrong customer. Control: auth before any data tool, numbers injected by code, never by the model.", "Transactions: a state machine owns the steps, the LLM only fills slots and understands corrections. Failure: a half-confirmed or duplicated transfer. Control: explicit confirm turn, idempotency key, server-side validation.", "Compliance and advice: answer from pre-approved, versioned text, or refuse and hand off to a licensed person. Failure: an unapproved statement that reads as a recommendation. Control: topic rails plus a human-reviewed content library.", "Agent assist and summaries: grounded in the transcript and the knowledge base, with a human who edits before anything is filed or sent. Failure: a summary that invents a commitment. Control: human in the loop plus summary evals.", "Rasa's CALM design is a public example of the split: the LLM turns the user message into commands, and coded flows decide what happens next."], "say": ["I think of grounding pe
