intent, frustration signals", "Human-only topics in finance (disputes, fraud, hardship, complaints) route on detection, before the bot tries", "Payload: a short summary, the intent, identifiers and auth status, slots collected, what was tried; warm transfer when stakes or emotion are high", "No agents free: a callback or a ticket, never a dead end", "Measure repeat explanation, re-asked identification and resolution after handoff; read escalations weekly for fixes"]}, "say": ["**I wouldn't treat every escalation as a failure; the right case should reach a person fast.**", "**Clear triggers:** an explicit request transfers at once, and so does a second failure, a high-stakes topic or clear frustration.", "**Context travels:** a short summary, the intent, identifiers, and what was already tried.", "**Measure repeats:** I'd measure how often people have to explain again after the transfer.", "And I'd read a sample of escalations every week. They're the best data we have."], "avoid": ["Treating containment as the goal, or a handoff as a failure"], "was": ["q-when-should-the-assistant-hand-off-to-a-human-and-how", "f-handoff-agent-assist"], "res": [{"kind": "video", "req": true, "label": "Designing your AI to human handoff", "url": "https://www.youtube.com/watch?v=Nzg-8rS9jxc", "m": 3, "why": "Intercom's Fin on when a bot should hand over and what the person gets.", "yt": {"id": "Nzg-8rS9jxc", "ch": "Fin"}}, {"kind": "video", "req": true, "label": "Production voice AI workflows: consent and escalations", "url": "https://www.youtube.com/watch?v=bc9kI5TRhX4", "m": 13, "why": "How a voice agent escalates to a person in a real build, with the context passed along.", "yt": {"id": "bc9kI5TRhX4", "ch": "LiveKit and codeSTACKr"}}, {"kind": "read", "req": true, "label": "Twilio: AI-to-human handoff", "url": "https://www.twilio.com/en-us/blog/insights/ai-to-human-handoff-context", "m": 7, "why": "Warm against cold, the payload, summaries."}, {"kind": "read", "req": true, "label": "Microsoft Learn: hand off to a live agent", "url": "https://learn.microsoft.com/en-us/microsoft-copilot-studio/advanced-hand-off", "m": 6, "why": "Explicit and implicit triggers, and what travels with the handoff: history and variables."}, {"kind": "video", "req": false, "label": "Human handoff on Google Conversational Agents", "url": "https://www.youtube.com/watch?v=6HZpU3RXc4U", "m": 15, "why": "Optional, 15 min: how the live-agent handoff response is set up on a Google platform.", "yt": {"id": "6HZpU3RXc4U", "ch": "Raj Kapadia"}}, {"kind": "read", "req": false, "label": "CFPB: chatbots in consumer finance", "url": "https://files.consumerfinance.gov/f/documents/cfpb_chatbot-issue-spotlight_2023-06.pdf", "m": 15, "why": "The regulator's view on doom loops and escalation to a human."}]}, {"id": "design-voice", "title": "Voice is not chat with a microphone", "brief": "A listener cannot scan, so voice prompts are short with the question last, lists hold three options or fewer, and silence and barge-in are designed events. Recognition errors dominate voice failures, and identifiers are the worst case: there is no language prior for a random account number, so one wrong character fails the lookup. The nuance: overall word error rate can look fine while exact identifier match is poor, so measure accuracy on the words that carry meaning.", "points": ["Prompts: short, context first and the question last, three options or fewer, no tables", "Silence and barge-in: a first silence usually means the user is searching, so reprompt with a hint; barge-in (the caller talking over the prompt) on for short prompts, off for disclosures that must be heard in full", "Endpointing: deciding the caller has finished speaking, usually from a short stretch of silence; too fast cuts people off, too slow feels dead", "Word error rate (WER): the share of words the recogniser got wrong, averaged over every word, so one wrong digit in an account number hides inside a good score", "Identifiers: letters and digits sound alike (P and B, M and N, O and zero); read back in groups, and use check digits or the caller's own accounts to correct or reject", "DTMF: keypad entry as the deterministic fallback after one failed retry; tones avoid transcription errors and keep spoken digits out of the transcript", "Chained errors: ASR and NLU errors multiply, so test the NLU on real ASR output, pass the N-best list (the recogniser's ranked top few transcriptions, not only the first), and keep thresholds and test sets per channel", "Chat: buttons and longer answers, scroll-back, but fragments, typos, pasted text, and no timeout signal"], "figs": ["turnTaking", "voicePipeline"], "production": ["A Speechmatics write-up (vendor-reported) notes 96.6% word accuracy can still mean only 77% exact identifier match", "Lex lets each slot take audio, DTMF or both, with timeouts, an end character, and wait-and-continue while the caller finds a number; the AWS pattern is a short prompt, a detailed retry, then DTMF only", "Endpointing: published tuning guidance puts about 250 ms of silence for purposeful IVR callers and about 400 ms where people think aloud, with a sentence-completeness signal on top", "One published budget for a cascaded pipeline: about 80 ms endpointing, 120 ms ASR, 180 ms LLM and 70 ms TTS for under 500 ms perceived; for slow tool calls, a short real acknowledgement, never fake filler", "Vanguard's own materials mention a voice bot for address changes among 70 plus bots: a narrow transactional voice task with identity checks"], "mcq": [{"q": "Why put the question at the end of a voice prompt?", "o": ["The listener cannot scan back, so the last thing heard is what they answer", "ASR is more accurate on the last words of a prompt", "Barge-in only works after the prompt finishes", "TTS engines stress the final sentence of a prompt", "It makes the prompt quicker to synthesise"], "a": 0, "why": "Voice is linear and has no scroll-back. Context first, the question last, and the whole prompt short, so the user answers what was asked."}, {"q": "A voice bot's word accuracy is above 96%, yet account lookups often fail. What is the most likely reason?", "o": ["The TTS voice is too fast for older callers", "Identifiers are all-or-nothing, and one wrong character fails the match", "Word accuracy above 95% means the NLU must be at fault", "The endpointing is set too slow for the callers", "The bot uses implicit confirmation for names"], "a": 1, "why": "Word accuracy averages over easy words. An account number has no language prior and every character must be right, so exact-match accuracy can be far lower."}, {"q": "Why not reuse the chat channel's test utterances to test the voice channel?", "o": ["Voice needs ten times as many test cases as chat", "Chat utterances are too long for voice prompts", "Typed text lacks the recognition errors and spoken phrasing of real audio", "Voice test sets must be recorded by the design team", "Chat utterances contain emojis the ASR cannot read"], "a": 2, "why": "Real voice input is a transcript with ASR errors and different phrasing. Testing on typed text overstates voice accuracy; build the voice set from real call audio."}], "open": {"q": "We're adding a voice channel to our chat assistant. What changes?", "probe": "Channel sense: prompts, recognition errors, identifiers, fallbacks and measurement", "a": ["Prompts: short, question last, three options or fewer; silence and barge-in designed as events", "Recognition errors dominate: separate ASR errors from NLU errors, word and slot error rate on real audio", "Identifiers: vocabulary hints and constraints, check digits, read back in groups, keypad after one miss", "Latency: endpointing and streaming, with real acknowledgements for slow tool calls", "Separate thresholds and test sets from real audio; measure entity accuracy, escalation and completion per channel"]}, "say": ["**I'd design the voice task twice, not port the chat flow.**", "**Short prompts:** voice can't be scanned, so the question goes last, and silence is an event I plan for.", "**Read back identifiers:** I'd never trust a spoken account number without reading it back in groups, and after one miss I'd offer the keypad.", "**Per-channel tests:** separate thresholds and test sets for each channel, built from real audio.", "Voice utterances aren't chat test data."], "avoid": ["Quoting overall word error rate as proof the voice channel works"], "was": ["q-what-do-you-design-differently-for-voice-and-for-chat", "a-voice-vs-chat", "f-voice-pipeline"], "res": [{"kind": "video", "req": true, "label": "The current state of voice and chat barge-in, Cathy Pearl", "url": "https://www.youtube.com/watch?v=xGpInoDJAdk", "m": 13, "why": "Why barge-in and interruption are designed, not an afterthought, on a voice channel.", "yt": {"id": "xGpInoDJAdk", "ch": "Conversation Design Institute"}}, {"kind": "video", "req": true, "label": "Designing voice user interfaces to boost customer experiences", "url": "https://www.youtube.com/watch?v=PT3lFf_wi7U", "m": 11, "why": "Google's talk on voice interface design: prompts, errors and what changes from chat.", "yt": {"id": "PT3lFf_wi7U", "ch": "Google for Developers"}}, {"kind": "video", "req": true, "label": "Word error rate (WER) explained", "url": "https://www.youtube.com/watch?v=hoEWRdHi7dI", "m": 3, "why": "How WER is computed, which shows why one wrong digit hides inside a good score.", "yt": {"id": "hoEWRdHi7dI", "ch": "DataMListic"}}, {"kind": "read", "req": true, "label": "Picovoice: voice agent latency, turn-taking and barge-in", "url": "https://picovoice.ai/guide/voice-agents/voice-ux-latency-turn-taking/", "m": 10, "why": "Two-layer barge-in, endpointing signals, the human turn gap."}, {"kind": "read", "req": true, "label": "Speechmatics: alphanumeric speech recognition", "url": "https://www.speechmatics.com/company/articles-and-news/alphanumeric-speech-recognition-why-voice-assistants-mangle-skus-and-how-to-fix-it", "m": 8, "why": "Word accuracy against identifier exact match, and fixes for letters and digits."}, {"kind": "read", "req": false, "label": "Google Cloud: DTMF for telephony integrations", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/dtmf", "m": 5, "why": "Keypad digits as input beside speech, and the entity types they map to."}]}, {"id": "design-flows", "title": "Flows or a generative agent", "brief": "Every platform gives you a router on top (which task does the user want) and deterministic state underneath (walk the task to completion); what changed is that the router can now be an LLM reading descriptions. Decide per task by risk: authentication, payments and anything regulated stay in deterministic flows, open-ended help goes to a generative layer with retrieval, and the middle gets generation with approval checkpoints. The nuance: generative selection gets unpredictable when two descriptions overlap, so the taxonomy matters more, not less.", "points": ["Deterministic flows: authentication, payments, record changes; predictable and auditable, but every new capability costs authoring", "Generative layer: FAQs and open help grounded in retrieval (look up approved passages first, answer only from them; the grounding module covers it); covers the long tail with little authoring, harder to test and certify", "Middle layer: generation with approval checkpoints and an explicit confirmation turn for risky tools", "The model proposes, code authorises: server-side authorisation on every tool, so an injected instruction (text planted in a message or document that tries to give the model orders) cannot reach an action", "Widen on evidence: start deterministic on the money paths and grow the generative scope as scored real conversations (evaluation data) support it"], "figs": [], "production": ["Dialogflow CX: flows for deterministic work like authentication or payment, generative playbooks for open-ended conversation; intent routes take priority over condition routes and event handlers", "Rasa CALM: the LLM only turns the message into commands and the business logic stays in flows; Rasa's migration guide runs old NLU and CALM side by side behind a router and moves related skills together", "Copilot Studio: generative orchestration, the default for new agents, picks topics, tools and knowledge by description and can chain several in one turn; Microsoft notes selection becomes unpredictable when descriptions overlap", "Rasa claims up to 90% less build work with CALM: vendor marketing, not a measured result", "OWASP's top risks for LLM apps include prompt injection, sensitive information disclosure and excessive agency"], "mcq": [{"q": "Which job in a bank assistant should stay in a deterministic flow even if an LLM routes the conversation?", "o": ["Answering 'what is a Roth IRA'", "Explaining the fees on a fund page", "Executing a transfer between accounts", "Small talk at the start of a call", "Summarising the conversation for an agent"], "a": 2, "why": "Money movement needs fixed steps, validation and confirmation that a model cannot skip. Informational answers can be generated from approved, retrieved content."}, {"q": "In Rasa CALM, what does the LLM do?", "o": ["Writes the steps of each business flow at runtime", "Turns the user's message into commands such as start flow or set slot", "Executes the API calls inside each flow", "Replaces all the flows with a single prompt", "Retrains the intent classifier on new logs"], "a": 1, "why": "CALM splits the work: the LLM interprets the user into commands, and the flow engine enforces the business logic. That is why the model never improvises the steps of a transfer."}, {"q": "Under generative orchestration, two topics have overlapping descriptions. What is the likely effect?", "o": ["The planner always picks the first topic listed", "Both topics run in parallel on every turn", "The platform merges them into one topic", "Topic selection becomes unpredictable between them", "The planner falls back to trained intents"], "a": 3, "why": "The descriptions are what the model chooses between, so overlapping prose is the old intent-overlap problem in a new form. Microsoft's docs say the choice then becomes unpredictable."}], "open": {"q": "We have a classic bot with about 300 intents. How would you decide what moves to a generative agent and what stays in flows?", "probe": "Where you put determinism, and how you change a live system safely", "a": ["Inventory intents by volume, success rate and risk", "Keep accurate high-volume intents and every money or record-changing path in strict flows", "Move the long tail and FAQs to retrieval or LLM routing, with server-side authorisation on every tool", "Run old and new in shadow on logged traffic and compare on a golden set", "Shift traffic gradually with a rollback, moving whole topic areas so related skills that interrupt each other stay together"]}, "say": ["**I decide by risk and determinism: the money paths stay in flows, open help goes generative.**", "**Flows for risk:** authentication, payments and anything with regulatory consequences stay in flows.", "**Generative for the long tail:** open-ended help and FAQs go to a generative layer with retrieval.", "**Widen on evidence:** I'd start deterministic on the money paths and widen the generative scope only as the evaluation data supports it.", "It's the same rule I use at alfred_: the model proposes, code authorises."], "avoid": ["Quoting Rasa's '90% less build work' as a measured fact"], "was": ["q-flows-or-a-generative-agent-how-do-you-decide", "a-platform-flows"], "res": [{"kind": "video", "req": true, "label": "How CALM works", "url": "https://www.youtube.com/watch?v=Zp0tw-zdEso", "m": 8, "why": "How CALM splits the work: the model reads the user, authored flows own the task.", "yt": {"id": "Zp0tw-zdEso", "ch": "Rasa"}}, {"kind": "read", "req": true, "label": "Anthropic: building effective agents", "url": "https://www.anthropic.com/engineering/building-effective-agents", "m": 15, "why": "Workflows (fixed paths) against agents (the model decides), and when the extra freedom is worth its cost."}, {"kind": "read", "req": false, "label": "Google Cloud: Dialogflow CX playbooks", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/playbook", "m": 6, "why": "Generative playbooks beside deterministic flows."}, {"kind": "read", "req": false, "label": "Microsoft Learn: Copilot Studio generative orchestration", "url": "https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/generative-orchestration", "m": 12, "why": "An LLM planner over topics and tools, with deterministic control layers."}, {"kind": "video", "req": false, "label": "The 5 levels of AI assistants, Alan Nichol", "url": "https://www.youtube.com/watch?v=Q5X1y-uqnZ8", "m": 12, "why": "Optional, 12 min: Rasa's co-founder on how much autonomy an assistant should have, and why.", "yt": {"id": "Q5X1y-uqnZ8", "ch": "Chatbot Summit"}}, {"kind": "video", "req": false, "label": "Copilot Studio topics vs generative AI: when to use each", "url": "https://www.youtube.com/watch?v=ynW1OA0RJ7Q", "m": 5, "why": "A platform's own answer to flows or generative: authored topics where control matters, generative where it does not.", "yt": {"id": "ynW1OA0RJ7Q", "ch": "Microsoft Dynamics 365 & Power Platform"}}]}], "day": "Day 2, Monday 5 Oct"}, {"id": "voice", "title": "Voice AI, end to end", "day": "Day 2, Monday 5 Oct", "blurb": "How a voice agent works under the hood: the cascade from audio to audio, streaming speech to text, turn detection, speech to speech models behind an orchestrator, WebSocket and WebRTC streaming and why workers hold a connection per call, the latency budget, scaling and cost.", "topics": [{"id": "voice-cascade", "title": "The cascade pipeline, stage by stage", "brief": "How does a spoken sentence become a spoken reply? Audio frames pass through voice activity detection, streaming speech to text, turn detection, an orchestrator that runs the language model and its tools, and text to speech, and each stage adds latency for a different reason.", "points": ["Frames: the caller's audio arrives as 20 ms frames, 160 samples at 8 kHz on a phone line or 320 samples (640 bytes of 16-bit audio) at 16 kHz on the web; every later stage consumes this stream, never a finished file", "VAD: a small model labels each frame speech or not speech, so the pipeline only sends speech onward and knows when talking started and stopped; it costs a few milliseconds and a sliver of CPU", "Streaming STT: the frames go over one open connection and partial transcripts come back while the caller is still talking; the final transcript lands a little after the last word, which is the tail you pay on every turn", "Turn detection: a separate decision from VAD, because silence is not the same as being done; it waits for a silence threshold or a model that reads the words, and that wait is often the largest single slice of the budget", "Orchestrator: your code takes the final text, adds conversation history and tools, calls the language model with function calling, runs any tool the model asks for, and streams the reply tokens onward; this is where policy, state and logging live", "TTS: the first complete sentence or clause goes to text to speech as soon as it exists, and audio streams back before the model has finished writing; the cost to watch is time to first byte, not total synthesis time", "Where the time goes: the turn wait, the STT tail, the model's time to first token (it grows with the prompt and any tool call), TTS first byte, and the network and playout buffers back to the caller"], "production": ["Open-source frameworks such as LiveKit Agents and Pipecat are built around exactly this chain of stages, with each stage a swappable plugin behind one interface", "Teams log a timestamp at each stage boundary on every turn, so a slow call can be read as a column of numbers (turn wait, STT tail, model first token, TTS first byte) instead of a feeling", "The orchestrator is the only stage that knows about the business: authorisation, which tools exist, what may be said, and what gets written down"], "figs": [], "res": [{"kind": "clip", "req": true, "label": "Explainer: the voice agent cascade", "url": "../media/videos/voice-agent-cascade.mp4", "m": 3, "why": "Where the second goes: the naive build failing, then streaming, speaking early, co-location and the gate in front of a speech model."}, {"kind": "video", "req": true, "label": "Voice Agent Pipeline Explained: VAD, STT, LLM and TTS", "url": "https://www.youtube.com/watch?v=SPB2T-eLrOg", "m": 11, "why": "The whole chain in one pass, stage by stage.", "yt": {"id": "SPB2T-eLrOg", "ch": "LiveKit"}}, {"kind": "video", "req": false, "label": "AI Voice Agent Architecture 101: STT-LLM-TTS and Websockets?", "url": "https://www.youtube.com/watch?v=IEUKRG6RwP4", "m": 5, "why": "A short second view that also shows why the streams stay open.", "yt": {"id": "IEUKRG6RwP4", "ch": "Mitchell Alderson"}}, {"kind": "read", "req": true, "label": "Voice AI and Voice Agents: an illustrated primer", "url": "https://voiceaiandvoiceagents.com/#latency", "m": 10, "why": "Read the latency section: it names where the milliseconds go."}, {"kind": "read", "req": false, "label": "Pipecat: pipeline concepts", "url": "https://docs.pipecat.ai/pipecat/learn/pipeline", "m": 8, "why": "How a framework wires the stages as a pipeline of frame processors."}, {"kind": "read", "req": false, "label": "LiveKit Agents: models overview", "url": "https://docs.livekit.io/agents/models/", "m": 5, "why": "The STT, LLM and TTS slots and what plugs into each."}, {"kind": "keep", "src": "site", "req": false, "label": "Your Commure path: the conversation loop module", "url": "../interviews/commure.html", "m": 30, "why": "Goes deeper on audio as numbers, turn taking and the latency budget, in the same order."}, {"kind": "keep", "src": "site", "req": false, "label": "Wildcard session wc20: the conversation loop", "url": "../index.html#/w/wc20", "m": 135, "why": "A two-hour session on hearing, thinking and speaking."}], "mcq": [{"q": "A caller stops talking. Which stage is usually the largest single slice of the delay before the agent answers?", "o": ["The network trip for one audio frame", "The wait to be sure the turn has ended", "Voice activity detection on the last frame", "Opening the text to speech connection", "Encoding the reply as audio"], "a": 1, "why": "The system must wait through some silence, or ask a model, before it can act. Typically 300 to 500 ms goes there, far more than a frame trip or a VAD pass."}, {"q": "Why does the pipeline send the first sentence of the reply to text to speech before the model finishes writing?", "o": ["Text to speech cannot handle long inputs", "The model cannot be stopped once it starts", "It cuts the cost of the model tokens", "It makes the transcript more accurate", "Time to first audio drops, because synthesis overlaps generation"], "a": 4, "why": "Waiting for the full reply would add the whole generation time to every turn. Streaming overlaps the two, so the caller hears audio while the rest is still being written."}, {"q": "What is the difference between VAD and turn detection?", "o": ["VAD works on text and turn detection works on audio", "They are two names for the same model", "VAD says whether a frame holds speech; turn detection says whether the caller has finished their thought", "VAD runs after the language model and turn detection before it", "Turn detection removes background noise and VAD does not"], "a": 2, "why": "A pause inside a sentence is silence with no turn end. VAD answers the frame question; turn detection answers the thought question."}, {"q": "Where does a function call to look up an appointment run in a cascade?", "o": ["In the orchestrator, which runs the tool the model asked for and feeds the result back", "Inside the speech to text model", "Inside the text to speech model", "In the voice activity detector", "On the caller's phone"], "a": 0, "why": "The language model only names the tool and its arguments. The orchestrator checks it is allowed, runs it, and returns the result into the conversation."}, {"q": "A call feels slow. What is the most useful first step?", "o": ["Switch to a bigger language model", "Add more CPU to the worker", "Lower the audio sample rate", "Read a per-stage timing log for the turns that felt slow", "Rewrite the system prompt"], "a": 3, "why": "Each stage can be the slow one. Timestamps at every boundary tell you which stage grew before you change anything."}], "open": {"q": "Walk me through what happens between the caller finishing a sentence and hearing the agent's reply.", "probe": "Which stage is slowest, and what runs in parallel rather than in sequence?", "a": ["Audio arrives as 20 ms frames; VAD marks speech, and streaming speech to text has been sending partial transcripts the whole time", "Turn detection decides the caller is done, by waiting through a short silence or by a model that reads the words; that wait is usually the biggest slice", "The final transcript goes to the orchestrator, which calls the language model with history and tools, and runs a tool if one is requested", "Tokens stream out, the first sentence goes to text to speech at once, and audio streams back while the model is still writing", "So the stages overlap; the number to watch is time to first audio, and I would log each boundary to see which stage grew"]}, "say": ["**A voice agent is a pipeline of streaming stages, and the work is in overlapping them and knowing where the time goes.**", "**Hearing:** 20 ms frames, VAD, and streaming speech to text with partial transcripts.", "**Deciding:** turn detection is its own question, and its wait is usually the largest slice of delay.", "**Thinking:** the orchestrator calls the model with tools, and it is where policy, state and logging live.", "I would measure each stage per turn before touching anything."]}, {"id": "voice-stt", "title": "Streaming against batch speech to text", "brief": "Why did batch models like Whisper, which read a whole utterance and then give text, lose ground in live calls to streaming models that give partial transcripts as audio arrives, and what do partials, finals, endpointing and word error rate mean in practice?", "points": ["Batch: Whisper reads a fixed 30 second window of audio and decodes it as one sequence; nothing comes out until the audio is in hand, so the delay is at least the length of what was said plus decode time", "Faking streaming: running Whisper again and again on a growing buffer works, but each pass re-decodes overlapping audio and boundaries can change or hallucinate on silence; the cost grows with every pass", "Streaming models: transducer-style (RNN-T) models with chunked or cache-aware attention keep state between chunks, so each new chunk of audio costs the same small amount and tokens come out as frames arrive; NVIDIA's Nemotron speech streaming model is of this kind", "Chunk size trade-off: a larger chunk gives the model more context and lower error but delays the first words; a smaller one is faster and a bit less accurate, so it is a dial, not a fixed fact", "Partials and finals: a partial (interim) result can still change as more audio arrives; a final is committed. Deepgram marks them is_final false and true; use partials for display and early work, finals for decisions", "Endpointing: the service decides a pause means the speaker stopped and flags it (Deepgram's speech_final after a set number of milliseconds of silence); it is a turn signal built into the transcriber, with the same cut-off or sluggish trade-off", "Word error rate: WER = (S + D + I) / N, substitutions, deletions and insertions over the words in the reference; 20 reference words with 2 substituted, 1 dropped and 1 added gives 4 / 20 = 20%, and WER can exceed 100%"], "production": ["Hosted streaming APIs (Deepgram, AssemblyAI and others) take audio over a WebSocket and return partial and final transcripts as JSON events; open models such as NVIDIA's Nemotron speech streaming checkpoint can run on your own GPU", "Benchmarks like the Open ASR Leaderboard report WER on clean read speech; phone audio at 8 kHz with crosstalk and names is harder, so teams measure on their own recorded calls", "Batch models still win for recorded audio, like call transcripts after the fact, where accuracy matters and delay does not"], "figs": [], "res": [{"kind": "video", "req": true, "label": "Can Whisper be used for real-time streaming ASR?", "url": "https://www.youtube.com/watch?v=_spinzpEeFM", "m": 9, "why": "Why a 30 second window model does not stream, and what the workarounds cost.", "yt": {"id": "_spinzpEeFM", "ch": "Efficient NLP"}}, {"kind": "video", "req": true, "label": "How streaming ASR inference differs from LLM serving", "url": "https://www.youtube.com/watch?v=8HJWwD5Uacc", "m": 13, "why": "What state a streaming recogniser keeps between chunks.", "yt": {"id": "8HJWwD5Uacc", "ch": "Efficient NLP"}}, {"kind": "video", "req": false, "label": "Realtime voice models: Voxtral, ASR and TTS", "url": "https://www.youtube.com/watch?v=hyhANozV9Nw", "m": 27, "why": "Optional: a realtime transcription model in detail; watch for how it handles delay against accuracy.", "yt": {"id": "hyhANozV9Nw", "ch": "Julia Turc"}}, {"kind": "read", "req": true, "label": "Deepgram: endpointing and interim results", "url": "https://developers.deepgram.com/docs/understand-endpointing-interim-results", "m": 8, "why": "The exact meaning of is_final and speech_final and how the pause setting works."}, {"kind": "read", "req": false, "label": "AssemblyAI: Universal-Streaming", "url": "https://www.assemblyai.com/docs/universal-streaming", "m": 8, "why": "A second vendor's streaming API, to compare how partial and final results are delivered."}, {"kind": "read", "req": false, "label": "NVIDIA Nemotron speech streaming (model card)", "url": "https://huggingface.co/nvidia/nemotron-speech-streaming-en-0.6b", "m": 10, "why": "A cache-aware streaming model; see the chunk size against WER table."}, {"kind": "keep", "src": "site", "req": false, "label": "Your Commure path: audio as numbers, and what speech models read", "url": "../interviews/commure.html", "m": 20, "why": "The sample rate, spectrogram and encoder-decoder background this topic builds on."}], "mcq": [{"q": "Why can Whisper not stream partial words as the caller speaks?", "o": ["It only works on phone audio", "It cannot output punctuation", "It was trained only on silence", "It decodes a fixed window of audio as one sequence rather than keeping per-chunk state", "It needs a different language model for each word"], "a": 3, "why": "Its design reads a window then decodes. Repeating that on a growing buffer re-does work each pass, whereas streaming models carry state forward."}, {"q": "A transcript arrives with is_final false. What should an agent do with it?", "o": ["Treat it as the committed transcript and send it to the model", "Show it or prepare early work, but not act on it as settled", "Discard it permanently", "Send it to text to speech", "Use it to measure WER"], "a": 1, "why": "Partials can still change as more audio arrives. Decisions belong on finals."}, {"q": "A reference has 50 words. The transcript has 3 substitutions, 2 deletions and 1 insertion. What is the WER?", "o": ["6%", "10%", "8%", "16%", "12%"], "a": 4, "why": "(3 + 2 + 1) / 50 = 6 / 50 = 12%. Insertions count as errors too."}, {"q": "What happens if you raise the chunk size of a streaming model?", "o": ["Error rises and the first words arrive sooner", "Nothing changes, chunk size is only for storage", "Error usually falls because of more context, but the first words arrive later", "It turns the model into a batch model with no delay", "The model stops using state between chunks"], "a": 2, "why": "A bigger chunk gives more context per decision at the cost of waiting for it. The setting is a latency and accuracy dial."}, {"q": "Which job is still well suited to a batch speech model?", "o": ["Transcribing recorded calls after they end for quality review", "Deciding when a live caller has stopped talking", "Driving barge-in", "Streaming words to a live agent", "Echo cancellation"], "a": 0, "why": "When delay does not matter, the whole-utterance approach is simple and accurate. Live calls need partials."}], "open": {"q": "Why would you choose a streaming speech to text model for a voice agent instead of Whisper?", "probe": "What do you give up, and how do you know it is accurate enough?", "a": ["Whisper decodes a whole window, so text arrives after the audio does; streaming models keep state and return tokens as frames arrive", "Partial results let the agent begin early work, and endpointing gives a turn signal, so the first audio can start sooner", "The cost is some accuracy against a model with full context, and a chunk size that trades the two", "I would measure word error rate on recorded calls of our own, at the real sample rate, not rely on a leaderboard", "Whisper stays useful offline, for recorded calls"]}, "say": ["**Live calls need text while the person is still talking, and only a model that keeps state between chunks gives that.**", "**Batch:** Whisper reads a window then decodes, so delay is at least the length of the speech.", "**Streaming:** partials can change, finals are committed; decide on finals, prepare on partials.", "**The dial:** chunk size trades accuracy against how soon words appear.", "I would test on our own recorded calls."]}, {"id": "voice-turns", "title": "Turn detection and barge-in", "brief": "How does an agent know the caller has finished, and stop talking when the caller cuts in, without cutting people off at every pause or reacting to a cough?", "points": ["Silence threshold: end the turn after a fixed quiet period; simple and predictable, but 'my number is 415...' followed by a breath fires early, while a long threshold makes every reply feel slow", "Semantic end of turn: a small model reads the words so far (and sometimes the audio) and estimates whether the sentence is complete; a trailing 'and' or an unfinished address keeps the turn open longer, a complete question closes it sooner", "Combined rule: use the model's probability to scale the wait, so a clearly finished sentence uses a short wait and an unclear one uses a long one; the cost is a bit of CPU and a model that can be wrong", "Preemptive generation: start the model on the partial transcript before the turn is certain and throw the work away if the caller keeps talking; it buys time and costs tokens", "Barge-in: when the caller speaks during the agent's audio, stop playback at once, cancel the pending reply, and listen; audio already queued in buffers must be flushed or the agent keeps talking over the caller", "What was actually heard: the conversation history should record only the part of the reply that was played, so the model does not think it said something the caller never heard", "Backchannels and noise: 'mm-hm' means keep going, and a cough, a door or a TV is not speech to answer; a minimum speech duration or word count, and echo cancellation so the agent does not hear itself, filter these"], "production": ["LiveKit's turn detector is a small language model over the transcript, and its docs describe tuning the minimum and maximum waits and an adaptive interruption model for telling real barge-in from noise", "Deepgram's endpointing and AssemblyAI's turn events put a first-pass turn signal inside the transcriber, which the agent can combine with its own rule", "Teams keep a set of recorded hard cases (long pauses, numbers read slowly, speakerphone echo) and replay them whenever a threshold changes"], "figs": [], "res": [{"kind": "video", "req": true, "label": "Fix AI Voice Interruptions with Semantic Turn Detection", "url": "https://www.youtube.com/watch?v=XbrlOY4Z-Ow", "m": 6, "why": "Shows a silence rule failing and a semantic model fixing it.", "yt": {"id": "XbrlOY4Z-Ow", "ch": "LiveKit and codeSTACKr"}}, {"kind": "video", "req": true, "label": "Turn-Taking in Voice AI: How Agents Know When to Talk", "url": "https://www.youtube.com/watch?v=Difvy2uosKw", "m": 5, "why": "A compact tour of VAD, endpointing and semantic detection.", "yt": {"id": "Difvy2uosKw", "ch": "Voice AI Space"}}, {"kind": "video", "req": false, "label": "Voice Agents: Why Semantic Turn Detection Isn't Enough?", "url": "https://www.youtube.com/watch?v=BJMCBFb94So", "m": 12, "why": "Optional: cases a text-only model misses.", "yt": {"id": "BJMCBFb94So", "ch": "OffNote Labs"}}, {"kind": "read", "req": true, "label": "LiveKit: turn detection", "url": "https://docs.livekit.io/agents/logic/turns", "m": 8, "why": "The modes and what each costs."}, {"kind": "read", "req": true, "label": "LiveKit: adaptive interruption handling", "url": "https://docs.livekit.io/agents/logic/turns/adaptive-interruption-handling", "m": 6, "why": "How real interruptions are told apart from noise and backchannels."}, {"kind": "read", "req": false, "label": "LiveKit: turn detector model", "url": "https://docs.livekit.io/agents/logic/turns/turn-detector/", "m": 6, "why": "What the semantic model reads and how it sets the wait."}, {"kind": "keep", "src": "site", "req": false, "label": "Your Commure path: knowing when the caller has finished, and interruptions", "url": "../interviews/commure.html", "m": 25, "why": "The turn and interrupt topics with the silence rules that belong in code, not in the prompt."}, {"kind": "keep", "src": "site", "req": false, "label": "Guide: voice AI agent platform at scale", "url": "../SYSTEM%20DESIGN.html#/designs/voice-agent", "m": 25, "why": "The platform design's barge-in dive: what counts as an interruption, and cutting the context to what the caller heard."}], "mcq": [{"q": "A caller says 'my account number is 4 1 5' and pauses to find the rest. A 400 ms silence rule ends the turn. What went wrong?", "o": ["Silence does not mean the thought is finished, so the rule cut the caller off", "VAD failed to hear speech", "The transcriber dropped words", "The model was too slow", "The network lost frames"], "a": 0, "why": "A pause inside a sentence looks the same as an ending to a silence rule. A model that reads the words can see the number is incomplete."}, {"q": "On barge-in, why must queued audio be flushed as well as the model call cancelled?", "o": ["The model would otherwise charge more", "The transcript would lose accuracy", "The turn detector would stop working", "Buffered audio would keep playing over the caller", "The caller's microphone would turn off"], "a": 3, "why": "Audio already sent to playback buffers continues unless it is cleared. Cancelling the model alone leaves the agent talking."}, {"q": "What is a backchannel, and how should an agent treat it?", "o": ["A second phone line; it should be answered", "A short 'mm-hm' that means keep going; it should not interrupt the agent", "A background noise; it should be filtered at the network", "An echo of the agent; it should be amplified", "A DTMF key press; it should end the call"], "a": 1, "why": "Acknowledgements are not requests for the floor. A minimum speech duration or word count keeps them from stopping the agent."}, {"q": "Preemptive generation starts the model before the turn is certain. What is its cost?", "o": ["A lower sample rate", "A lost WebSocket connection", "Louder text to speech", "A longer silence threshold", "Wasted model tokens when the caller keeps talking"], "a": 4, "why": "If the guess is wrong the work is discarded, so you pay tokens to win time."}, {"q": "Why should the history record only the played part of an interrupted reply?", "o": ["To save storage", "To keep the transcript short for billing", "So the model does not assume the caller heard what was never spoken", "Because text to speech cannot be undone", "To raise the turn detection probability"], "a": 2, "why": "Otherwise the model says 'as I mentioned' about a sentence the caller never heard."}], "open": {"q": "How does a voice agent decide the caller has finished, and what happens when the caller interrupts?", "probe": "What goes wrong with a fixed silence threshold, and what is a false interruption?", "a": ["A fixed silence rule is predictable but wrong in both directions: it cuts people off at pauses and is slow after finished sentences", "A small model reads the words so far and sets the wait, short for a finished question and long for an unfinished number", "On barge-in I stop playback, flush buffers, cancel the pending reply and record only what was actually played", "A minimum speech length and echo cancellation keep coughs, backchannels and the agent's own echo from stopping it", "I would replay recorded hard cases whenever a threshold changes"]}, "say": ["**Silence is a poor signal alone, so I would combine it with a model that reads the words.**", "**Finishing:** a model scales the wait, short for a complete sentence and long for an unfinished one.", "**Interrupting:** stop playback, flush buffers, cancel the reply, and record only what was played.", "**Noise:** minimum speech length and echo cancellation separate real speech from coughs and backchannels.", "I would tune it on recorded calls."]}, {"id": "voice-realtime", "title": "Speech to speech models, and why the orchestrator stays", "brief": "A realtime model takes audio in and gives audio out, and can call functions. Why does an orchestrator still sit around it, and when is a cascade the better choice?", "points": ["What it is: one model reads the caller's audio and produces speech directly, over a streaming connection; there is no separate transcription, language and synthesis step, so there is one fewer set of hops and the voice can carry tone and timing", "Function calling: the model can emit a tool call in the middle of a response, the client runs the function and returns the result, and the model carries on speaking; the model decides which tool and with what arguments, never the code that runs it", "Why an orchestrator still gates: the model can be talked into a bad call or mishear a name, so your code owns the allowlist of tools, argument checks, authorisation and confirmations before any write", "State: the booking in progress, who the caller is verified as, and what has already been done live in your code or database, not in the model's context alone, so a dropped session can resume and a retry cannot do a thing twice", "Audit: transcripts in a realtime session come from a separate transcription step, so they may differ from what the model actually heard; for a record you can defend, log the tool calls and results, and keep audio where policy allows", "Cascade trade-off: three models in a row are easier to inspect (text at each step), let you swap or tune one part, use the cheapest model that works for the reasoning step, and run your own turn detection, at the cost of more hops and latency", "Speech to speech trade-off: lower latency and more natural speech, less visibility, fewer choices of model and voice, and pricing by audio tokens; a reasonable design keeps both behind one interface and lets measured quality and cost pick"], "production": ["OpenAI's Realtime API supports function calling in a speech to speech session over WebSocket or WebRTC, and the tool results are returned by the client, which is where checks belong", "Frameworks like LiveKit Agents and Pipecat can run either a realtime model or a cascade behind the same session object, so a team can compare them on the same scenarios", "Regulated or high-stakes calls usually keep a text step for guardrails and logging, even when a realtime model does the talking"], "figs": [], "res": [{"kind": "video", "req": true, "label": "Cascaded vs Speech-to-Speech Voice Agents, Explained", "url": "https://www.youtube.com/watch?v=gPEyGpf-0sM", "m": 4, "why": "The two designs side by side.", "yt": {"id": "gPEyGpf-0sM", "ch": "Voice AI Space"}}, {"kind": "video", "req": true, "label": "Introducing gpt-realtime in the API", "url": "https://www.youtube.com/watch?v=nfBbmtMJhX0", "m": 18, "why": "What a speech to speech model with tool calling looks like from the vendor.", "yt": {"id": "nfBbmtMJhX0", "ch": "OpenAI"}}, {"kind": "video", "req": false, "label": "Client Side Tool Calling with the OpenAI WebRTC Realtime API", "url": "https://www.youtube.com/watch?v=TcOytsfva0o", "m": 8, "why": "Optional: the tool loop in code, where your checks go.", "yt": {"id": "TcOytsfva0o", "ch": "Cloudflare Developers"}}, {"kind": "read", "req": true, "label": "OpenAI: Realtime, getting started", "url": "https://developers.openai.com/api/docs/guides/realtime", "m": 5, "why": "Session shape and transports."}, {"kind": "read", "req": false, "label": "OpenAI: Realtime conversations", "url": "https://developers.openai.com/api/docs/guides/realtime-conversations", "m": 10, "why": "How events, function calls and interruption are handled; read the function calling part."}, {"kind": "keep", "src": "site", "req": false, "label": "Your Commure path: realtime speech to speech or a cascade", "url": "../interviews/commure.html", "m": 15, "why": "The seam that keeps both behind one interface."}, {"kind": "keep", "src": "site", "req": false, "label": "Wildcard session wc20: the conversation loop", "url": "../index.html#/w/wc20", "m": 135, "why": "Includes the realtime against cascade decision."}], "mcq": [{"q": "In a realtime speech to speech session the model asks to call book_appointment. Where should the checks run?", "o": ["Inside the model, which has already decided", "In the caller's browser", "In your code, before the function executes", "In the transcription step", "Nowhere; the model is trusted"], "a": 2, "why": "The model names a tool and arguments. Allowlist, argument validation and authorisation belong in code you control."}, {"q": "Why can a realtime session's transcript differ from what the model heard?", "o": ["It comes from a separate transcription step rather than the model's own reading of the audio", "Text is always lossy", "The model never hears the audio", "Transcripts are encrypted", "The server rewrites the transcript"], "a": 0, "why": "A model that reads audio directly has no text of its own, so a separate recogniser produces the transcript, with its own errors."}, {"q": "Which is a real advantage of a cascade over speech to speech?", "o": ["It is always faster", "It needs no orchestrator", "It carries tone in the voice", "You can inspect text at every stage and swap one component", "It needs only one connection"], "a": 3, "why": "Separate stages give text to log and test, and parts to replace. That control is the trade for extra hops."}, {"q": "Where should the state of a booking in progress live?", "o": ["Only in the model's context window", "In your own database or service, so a dropped session or retry can be handled", "Only in the caller's memory", "In the audio buffer", "In the turn detector"], "a": 1, "why": "Context is lost with the session. State in your own store survives reconnects and supports safe retries."}, {"q": "What is the reasonable way to choose between the two designs?", "o": ["Always use speech to speech", "Always use a cascade", "Pick by vendor marketing", "Pick the one with the fewest connections", "Put both behind one interface and compare quality, latency and cost on the same scenarios"], "a": 4, "why": "The answer changes with each model release, so keep the choice cheap to change and let measurement decide."}], "open": {"q": "If a speech to speech model can call functions itself, why would you still build an orchestrator?", "probe": "What would you lose in a cascade, and what would you gain?", "a": ["The model names the function, but my code must decide whether it runs: allowlist, argument checks, authorisation and confirmation before any write", "State and audit belong in my own store, since session context is lost on reconnect and the realtime transcript is a separate step", "A cascade gives inspectable text at each stage, swappable parts and a cheaper reasoning model, but more hops and latency", "Speech to speech gives lower latency and more natural speech, with less visibility and pricing by audio", "I would keep both behind one interface and let measured quality and cost decide"]}, "say": ["**Even when a model can call functions, my code decides whether they run.**", "**Gate:** allowlist, argument checks, authorisation and confirmation sit outside the model.", "**State and audit:** a booking and its log live in my own store, not in session context.", "**Trade-off:** a cascade is inspectable and swappable; speech to speech is faster and more natural.", "I would compare them on the same scenarios."]}, {"id": "voice-transport", "title": "Real-time transport and the stateful worker", "brief": "What does a WebSocket do that HTTP cannot, where do WebRTC and the phone network fit, and why does a live call need a persistent connection and a stateful worker, with consequences for load balancers and deploys?", "points": ["HTTP request and response: the client sends a request and the server answers; each exchange carries headers, and the server cannot send anything unasked; polling to fake push wastes round trips and adds delay", "WebSocket: one HTTP request asks to upgrade (a 101 response), after which the same TCP connection stays open and either side sends small frames, text or binary, at any time; frame overhead is a few bytes, which suits a stream of 20 ms audio chunks and JSON events; audio flows up while transcripts and reply audio flow down at once (full duplex), which is why transcribers and realtime models are offered over WebSocket", "WebRTC for the caller leg: it runs over UDP with Opus audio, a jitter buffer, loss concealment and echo cancellation in the browser; late audio is dropped rather than resent, which TCP's retransmission would turn into a stall behind one lost packet", "Telephony: SIP sets the call up and RTP carries the audio, usually as 8 kHz G.711 over the public phone network; a media server bridges phone and web callers into the same room as the agent", "Why per-call state: a call holds an open streaming transcription session with its decoder state, audio buffers, the conversation history, an open model session and a TTS stream; none of it can be handed to a different server between requests as a stateless web request can", "Load balancers: a balancer picks a backend when the connection opens and then pins it for the life of the call; use least connections rather than round robin, expect idle timeouts (an AWS ALB defaults to 60 s) and send keepalive pings; sticky sessions matter for reconnects, but keep call state in a store the new worker can read", "Deploys: killing a worker drops its calls, so the worker stops taking new calls, finishes the live ones (draining), and only then exits; the grace period has to exceed the longest call, and old and new versions run side by side meanwhile"], "production": ["LiveKit's agent servers exchange capacity with the media server for load balancing and, on a deploy, drain active sessions before shutting down; each job runs in its own process", "On Kubernetes this means a termination grace period longer than a call, a preStop step that marks the pod as not accepting new work, and rolling updates that replace a few workers at a time", "Streaming APIs such as Deepgram's and OpenAI's realtime endpoint are WebSockets, so a worker holds several open outbound connections per call as well as the inbound caller leg"], "figs": [], "res": [{"kind": "clip", "req": true, "label": "Explainer: WebSockets and stateful call workers", "url": "../media/videos/websocket-stateful-workers.mp4", "m": 3, "why": "Why a call is one pinned connection: the upgrade, the caller leg, per-call state, least connections, sizing, and draining on deploy."}, {"kind": "video", "req": true, "label": "How Web Sockets work, System Design Interview Basics", "url": "https://www.youtube.com/watch?v=pnj3Jbho5Ck", "m": 6, "why": "The upgrade handshake and why the connection stays open.", "yt": {"id": "pnj3Jbho5Ck", "ch": "ByteMonk"}}, {"kind": "video", "req": true, "label": "WebRTC vs WebSocket! Which one rules the web?", "url": "https://www.youtube.com/watch?v=GKR0rsr05YY", "m": 7, "why": "When each transport fits.", "yt": {"id": "GKR0rsr05YY", "ch": "Jelvix"}}, {"kind": "video", "req": false, "label": "How WebRTC Works, Explained Simply", "url": "https://www.youtube.com/watch?v=ymANT2RGXeg", "m": 5, "why": "Optional: WebRTC in a voice agent setting.", "yt": {"id": "ymANT2RGXeg", "ch": "Voice AI Space"}}, {"kind": "read", "req": true, "label": "MDN: The WebSocket API", "url": "https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API", "m": 8, "why": "What the API gives you and how a connection lives."}, {"kind": "read", "req": false, "label": "MDN: Writing WebSocket servers", "url": "https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API/Writing_WebSocket_servers", "m": 10, "why": "The handshake and frame format, for the mechanism."}, {"kind": "read", "req": false, "label": "AWS: sticky sessions for your Application Load Balancer", "url": "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/sticky-sessions.html", "m": 5, "why": "What affinity does and does not guarantee."}, {"kind": "keep", "src": "site", "req": false, "label": "Your Commure path: how a call reaches the agent", "url": "../interviews/commure.html", "m": 30, "why": "SIP, RTP, WebRTC, rooms and dispatch for the caller leg."}, {"kind": "keep", "src": "site", "req": false, "label": "Wildcard session wc19: how a call reaches an agent", "url": "../index.html#/w/wc19", "m": 120, "why": "The phone and web path, step by step."}, {"kind": "keep", "src": "site", "req": false, "label": "Wildcard session wc21: the backend under a live agent", "url": "../index.html#/w/wc21", "m": 135, "why": "Workers against functions and scaling a service that holds live calls."}], "mcq": [{"q": "What makes a WebSocket different from repeated HTTP requests for streaming audio?", "o": ["It uses UDP instead of TCP", "It encrypts audio and HTTP does not", "It carries larger headers on every message", "It needs no server", "One upgraded connection stays open and both sides can send frames at any time"], "a": 4, "why": "After the upgrade the same TCP connection carries small frames both ways. HTTP needs a new request for each exchange and the server cannot push."}, {"q": "Why is WebRTC, not a WebSocket, preferred for a browser caller on a poor network?", "o": ["WebRTC uses less bandwidth than any other protocol", "WebSockets cannot carry binary data", "UDP with a jitter buffer drops late audio, while TCP retransmits and stalls everything behind a lost packet", "WebRTC needs no signalling", "WebSockets cannot be encrypted"], "a": 2, "why": "Late audio is worthless. TCP's resend makes later frames wait, which sounds like freezing; UDP-based media accepts the loss."}, {"q": "Why can a voice worker not be a stateless function called once per request?", "o": ["A call holds open sessions, buffers and history for minutes that cannot move between servers mid-call", "Functions cannot call a language model", "Functions cannot handle audio at all", "Voice needs a bigger instance than a function ever offers", "Stateless services cannot be load balanced"], "a": 0, "why": "The streaming transcription session, buffers, model session and history belong to one live process for the life of the call."}, {"q": "A worker must be replaced during a deploy. What should happen to its live calls?", "o": ["It is killed at once and calls reconnect", "Its calls are copied to another worker mid-sentence", "It is paused and resumed after the deploy", "It stops taking new calls and keeps serving existing ones until they finish, then exits", "The load balancer closes all connections"], "a": 3, "why": "Draining avoids dropping live calls. The grace period must be longer than the longest call."}, {"q": "Why is least connections a better balancing rule than round robin for long calls?", "o": ["Round robin cannot open WebSockets", "Calls last different lengths, so equal arrival counts do not mean equal load", "Least connections shortens calls", "Round robin needs sticky sessions", "Least connections skips the handshake"], "a": 1, "why": "Round robin balances arrivals, not live load. After some hours one worker can hold many long calls while others are empty."}], "open": {"q": "Why does a voice agent need a persistent connection and a stateful worker per call, and what does that mean for deploys?", "probe": "How is it different from a normal web service?", "a": ["A call is a continuous two-way stream, so the transcriber, the model and the caller leg all use long-lived connections, WebSocket or WebRTC, instead of request and response", "The worker holds streaming recogniser state, audio buffers, history and open model sessions for the whole call, so a call cannot move between servers", "So the balancer pins a call at the start and I balance on live connections, with keepalives for idle timeouts", "For deploys, a worker stops accepting new calls and drains until its live calls end, with a grace period longer than a call", "State that must survive goes in a store, so a reconnect or retry is safe"]}, "say": ["**A call is a long-lived two-way stream, so its worker holds state and must be drained, not killed.**", "**Transport:** WebSocket for server links, WebRTC over UDP for the caller, SIP and RTP for the phone.", "**State:** recogniser state, buffers, history and model sessions live in one worker for the call.", "**Operations:** balance on live connections, keep connections alive, and drain on deploy.", "Anything that must outlive a worker goes in a store."]}, {"id": "voice-latency", "title": "The latency budget and co-location", "brief": "How do you add up the delay of one turn stage by stage, what is time to first audio, and why does placing speech to text, the model and text to speech near the media server cut the total?", "points": ["Time to first audio: the gap from the caller's last word to the first sound of the reply; total reply length does not matter, because later sentences play while the rest is generated", "A worked budget (design targets, not measurements): turn wait 300 ms, STT final tail 150 ms, model time to first token 350 ms, TTS first audio byte 150 ms, network and playout 80 ms; the sum is 300 + 150 + 350 + 150 + 80 = 1,030 ms, about a second", "Where each number moves: the turn wait with the threshold or model, the STT tail with the endpointing setting, first token with prompt length and tool calls, TTS with voice and chunking, the last item with distance and the jitter buffer", "Streaming every stage: each stage starts on partial input, and a stage that waits for the previous one to finish adds its full duration instead of its first-output time", "Connection reuse: a new connection costs a TCP handshake, a TLS handshake and a WebSocket upgrade, about 2 to 3 round trips; at an 80 ms round trip that is 160 to 240 ms, so each call keeps its STT, model and TTS connections open and warm", "Co-location: if the worker, STT, model and TTS endpoints are in different regions, every hop adds a round trip; three hops at 80 ms add about 240 ms per turn, against a few milliseconds inside one region, a saving of roughly 225 ms in this example", "Keep the critical path small: slow work, like a record lookup, moves off it with a short spoken filler, an async tool, or a precomputed value; and measure on real turns, because the budget is only a plan"], "production": ["Teams commonly choose the region of the media server first and then pick STT, model and TTS endpoints in the same region, even if a provider's cheapest region is elsewhere", "A tool call is the usual way a turn blows its budget, since it adds a full network call before the model can speak; LiveKit has async function tools for this", "Latency is tracked as a distribution: the median hides the slow tail, so p95 time to first audio per call type is the number to watch"], "figs": [], "res": [{"kind": "video", "req": true, "label": "Find and Fix Latency Leaks in Real-time Voice Agents (Pipecat)", "url": "https://www.youtube.com/watch?v=GUxNi4qmsYE", "m": 9, "why": "Reading per-stage timings to find the leak.", "yt": {"id": "GUxNi4qmsYE", "ch": "OffNote Labs"}}, {"kind": "video", "req": true, "label": "Fix Voice Agent Tool Call Latency With Async Function Tools", "url": "https://www.youtube.com/watch?v=AQZOIr3511U", "m": 7, "why": "Keeping a slow tool call off the critical path.", "yt": {"id": "AQZOIr3511U", "ch": "LiveKit and codeSTACKr"}}, {"kind": "video", "req": false, "label": "Optimize LLM Latency by 10x", "url": "https://www.youtube.com/watch?v=E3j-4XH0q4g", "m": 14, "why": "Optional: model-side latency, prompt size and first token.", "yt": {"id": "E3j-4XH0q4g", "ch": "Trevor Spires"}}, {"kind": "read", "req": true, "label": "LiveKit: turn-taking tuning", "url": "https://docs.livekit.io/agents/logic/turns/tuning", "m": 10, "why": "How the wait settings change the turn slice of the budget."}, {"kind": "read", "req": true, "label": "Voice AI and Voice Agents: an illustrated primer", "url": "https://voiceaiandvoiceagents.com/#latency", "m": 10, "why": "The latency section lists where the time goes."}, {"kind": "read", "req": false, "label": "Deepgram: endpointing and interim results", "url": "https://developers.deepgram.com/docs/understand-endpointing-interim-results", "m": 8, "why": "The STT slice of the budget."}, {"kind": "keep", "src": "site", "req": false, "label": "Your Commure path: streaming every stage, and the latency budget", "url": "../interviews/commure.html", "m": 20, "why": "The same budget with the critical path discussion."}, {"kind": "keep", "src": "site", "req": false, "label": "Wildcard session wc20: the conversation loop", "url": "../index.html#/w/wc20", "m": 135, "why": "Includes per-stage timing practice."}, {"kind": "keep", "src": "site", "req": false, "label": "Guide: voice AI agent platform at scale", "url": "../SYSTEM%20DESIGN.html#/designs/voice-agent", "m": 25, "why": "The platform design's 800ms budget, stage by stage, and which overlaps get a turn under a second."}], "mcq": [{"q": "A budget is turn wait 300, STT tail 150, first token 350, TTS first byte 150 and network 80 ms. What is the time to first audio?", "o": ["980 ms", "1,030 ms", "1,130 ms", "350 ms", "1,330 ms"], "a": 1, "why": "300 + 150 + 350 + 150 + 80 = 1,030 ms. The sum is of first-output times, since the stages overlap."}, {"q": "Why does a new connection per request hurt a voice turn?", "o": ["Connections cannot carry audio", "Each connection costs a licence", "TLS needs a bigger buffer", "The model refuses new connections", "TCP, TLS and the WebSocket upgrade cost about 2 to 3 round trips before any audio moves"], "a": 4, "why": "At an 80 ms round trip that is 160 to 240 ms on a turn. Open connections kept warm for the call avoid it."}, {"q": "The worker is in one region and STT, the model and TTS are in another with an 80 ms round trip between them. Roughly what extra delay results per turn, against co-location?", "o": ["About 8 ms", "About 80 ms in total", "About 240 ms, one round trip for each of three hops", "About 1 second", "None, because streaming hides it"], "a": 2, "why": "Three hops of 80 ms each add 240 ms. Streaming does not remove the distance."}, {"q": "A turn needs a database lookup that takes 600 ms. What keeps the call responsive?", "o": ["Move it off the critical path: a short spoken filler or an async tool while the lookup runs", "Switch to a larger model", "Lower the sample rate", "Wait silently for the result", "Disable streaming"], "a": 0, "why": "The lookup cannot be made faster, but the caller can hear something meanwhile and the model can carry on."}, {"q": "Why track p95 time to first audio rather than the average?", "o": ["Averages cannot be calculated for audio", "p95 is cheaper to compute", "Averages include silence", "The slow tail is what callers remember and averages hide it", "Percentiles remove noise from audio"], "a": 3, "why": "A call that feels broken is a tail event. The mean can look fine while one turn in twenty is slow."}], "open": {"q": "Give me a latency budget for one turn and tell me how you would cut it.", "probe": "Why does co-location matter, and what do you do about a slow tool call?", "a": ["Time to first audio: turn wait 300 ms, STT tail 150, first token 350, TTS first byte 150, network 80, about a second; those are targets I would verify per stage", "Everything streams, and connections stay open for the call, so no turn pays handshakes", "I place STT, the model and TTS in the same region as the media server; three cross-region hops at 80 ms would add roughly 240 ms", "A slow tool goes off the critical path with an async tool or a short filler, and I would read p95 per stage on real calls"]}, "say": ["**I treat latency as a sum of first-output times, and I measure each stage.**", "**Budget:** about 1,030 ms in the worked example, with the turn wait and the first token biggest.", "**Streaming and warm connections:** nothing waits for a previous stage to finish or opens a connection mid-turn.", "**Co-location:** services near the media server save a round trip per hop, about 240 ms across three hops.", "I would watch p95 on real calls."]}, {"id": "voice-scaling", "title": "Scaling voice workers", "brief": "How many workers does a given call volume need, why scale on concurrent calls and not CPU, and how do cold starts, regions and draining change the plan?", "points": ["Concurrency from arrivals: Little's law says calls in progress = arrival rate x average duration; 600 calls an hour at 3 minutes each is 10 calls a minute x 3 = 30 at once, and a burst of 3x is about 90", "Calls per worker: load-test it; LiveKit suggests starting at 4 cores and 8 GB for an agent server that handles roughly 10 to 25 concurrent calls depending on the components used; at 15 calls per worker and 70% target use, 30 calls need about 3 workers and 90 about 9", "Scale on calls, not CPU: the signal that matters is how many call slots are taken against how many exist; CPU lags, is noisy, and can look low while a worker is full for another reason (a provider rate limit, memory)", "Headroom and cold starts: a new worker takes tens of seconds to start and load its models, so scale out when free slots fall below a buffer, not when the last slot goes, and keep a small warm pool", "Scaling in: remove only workers that are empty, or mark them draining so they take no new calls and exit as their calls end; killing a worker by CPU rule cuts live calls off", "Regions: route each caller to a media server and worker pool near them, since distance adds round trips on every hop; a call cannot move regions mid-call, so the routing choice is made when it starts", "Global deployment limits: each region needs its own capacity, models near the STT, LLM and TTS endpoints, and a failover plan; data residency rules may decide the region before latency does"], "production": ["LiveKit's self-hosting guide covers load balancing, autoscaling and rollout for agent servers, and says agent servers report capacity to the media server so new calls go to a worker with room", "Provider rate limits and the number of simultaneous connections allowed on an STT or realtime plan often bind before CPU does", "Autoscalers such as the Kubernetes Horizontal Pod Autoscaler can scale on a custom metric, such as active calls per pod, instead of CPU"], "figs": [], "res": [{"kind": "clip", "req": true, "label": "Explainer: WebSockets and stateful call workers", "url": "../media/videos/websocket-stateful-workers.mp4", "m": 3, "why": "Why a call is one pinned connection: the upgrade, the caller leg, per-call state, least connections, sizing, and draining on deploy."}, {"kind": "video", "req": true, "label": "Autoscaling your AI agent under load", "url": "https://www.youtube.com/watch?v=ESIL0Rzl5VQ", "m": 3, "why": "A short look at autoscaling an agent and the metrics used.", "yt": {"id": "ESIL0Rzl5VQ", "ch": "Google Cloud Tech"}}, {"kind": "video", "req": false, "label": "19. Graceful Shutdown", "url": "https://www.youtube.com/watch?v=6rfBgphiCWM", "m": 36, "why": "Optional: how a server stops accepting work and finishes in-flight requests.", "yt": {"id": "6rfBgphiCWM", "ch": "Sriniously"}}, {"kind": "read", "req": true, "label": "LiveKit: deploying agents to your own infrastructure", "url": "https://docs.livekit.io/agents/ops/deployment/custom/", "m": 10, "why": "Sizing guidance, load balancing, autoscaling and rollout; read the load test results."}, {"kind": "read", "req": true, "label": "LiveKit: agent server lifecycle", "url": "https://docs.livekit.io/agents/server/lifecycle", "m": 3, "why": "Capacity reporting and draining sessions on deploy."}, {"kind": "read", "req": false, "label": "Kubernetes: pod lifecycle, termination of pods", "url": "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/", "m": 12, "why": "SIGTERM, the grace period and what to do within it."}, {"kind": "keep", "src": "site", "req": false, "label": "Your Commure path: scaling a service that holds live calls", "url": "../interviews/commure.html", "m": 20, "why": "Little's law worked for a call workload, cold starts and what bites first."}, {"kind": "keep", "src": "site", "req": false, "label": "Wildcard session wc21: the backend under a live agent", "url": "../index.html#/w/wc21", "m": 135, "why": "The same sizing worked on a whiteboard."}, {"kind": "keep", "src": "site", "req": false, "label": "Guide: voice AI agent platform at scale", "url": "../SYSTEM%20DESIGN.html#/designs/voice-agent", "m": 25, "why": "The platform design's placement dive: workers that report capacity, prewarmed processes, autoscaling on slots and draining on deploy."}], "mcq": [{"q": "Calls arrive at 20 a minute and last 2 minutes on average. How many calls are in progress on average?", "o": ["10", "22", "20", "40", "80"], "a": 3, "why": "Little's law: 20 per minute x 2 minutes = 40 in progress. Size for the burst above that."}, {"q": "Why is CPU a weak autoscaling signal for a voice worker?", "o": ["Voice workers use no CPU", "It lags and can look low while the worker is full for another reason", "CPU cannot be measured per container", "CPU is only valid for databases", "It rises only when calls end"], "a": 1, "why": "Call slots taken against slots available is the direct signal. CPU is a delayed proxy."}, {"q": "Workers take about 40 seconds to start and load models. When should you scale out?", "o": ["Only when every slot is full", "Only at midnight", "After a caller complains", "Never; keep a fixed count", "When free slots drop below a buffer, before the last slot is taken"], "a": 4, "why": "A new call arriving at a full pool waits or fails while a worker starts. A buffer of free slots covers the start time."}, {"q": "The autoscaler wants to remove a worker with 3 live calls. What is the right action?", "o": ["Kill it and let the callers redial", "Move the calls to another worker mid-sentence", "Mark it draining and let the calls finish before it exits", "Pause the calls", "Remove it at once if CPU is low"], "a": 2, "why": "Calls cannot be moved, and killing drops them. Draining removes the worker without cutting anyone off."}, {"q": "Why is the region a call is routed to decided when it starts?", "o": ["Live state and audio cannot move regions mid-call", "Regions cannot talk to each other", "Pricing changes per minute", "The caller's phone fixes it", "WebSockets forbid region changes"], "a": 0, "why": "A call's streaming sessions and buffers sit in one pool, so the choice is made at the start."}], "open": {"q": "How would you scale a voice agent service from 30 concurrent calls to 300?", "probe": "What do you scale on, and what goes wrong first?", "a": ["I would measure calls per worker in a load test, then size to concurrent calls with headroom; at 15 per worker and 70% use, 300 calls need about 29 workers", "I would autoscale on call slots free against a buffer, not CPU, and keep a small warm pool because workers take tens of seconds to start", "Scale-in uses draining so live calls finish, and the grace period is longer than the longest call", "What goes wrong first is often a provider rate limit or connection cap, not CPU, so I would check those limits", "For several regions I would route near the caller at call start and size each pool on its own"]}, "say": ["**I would size from concurrent calls and scale on free call slots, not CPU.**", "**Sizing:** arrivals x duration gives concurrency; load-tested calls per worker gives the count.", "**Headroom:** workers take time to start, so keep a buffer of free slots and a warm pool.", "**Scale in and deploys:** drain, never kill, with a grace period longer than a call.", "I would check provider limits before adding workers."]}, {"id": "voice-cost", "title": "Cost per call minute", "brief": "What does one call minute cost across speech to text, language model tokens, text to speech, telephony and compute, and which parts dominate?", "points": ["Five line items: STT priced per minute of audio streamed, the model priced per input and output token, TTS priced per character, telephony per minute carried, and compute for the worker; each scales with a different thing", "Assumptions for the worked example (illustrative rates, check current vendor pages): STT $0.008 a minute, model $1 per million input tokens and $4 per million output tokens, TTS $0.03 per 1,000 characters, telephony $0.007 a minute, a worker at $0.20 an hour handling 15 calls", "Example call: 4 minutes, the agent speaks 40% of the time at about 150 words a minute, 16 turns, a 1,500 token prompt plus history averaging about 2,500 input tokens a turn and about 60 output tokens a turn", "STT and TTS: the whole call is streamed to STT, silence included, so 4 x $0.008 = $0.032; the agent speaks 4 x 0.4 x 150 = 240 words, about 1,300 characters at roughly 5.4 per word, so 1.3 x $0.03 = $0.039", "Model: 16 x 2,500 = 40,000 input tokens is $0.040 and 16 x 60 = 960 output tokens is about $0.004, so about $0.044; the input side grows with every turn because history is re-sent, which prompt caching and trimming reduce", "Telephony and compute: 4 x $0.007 = $0.028 for the phone leg; compute is $0.20 / 60 / 15 = $0.0002 a call minute, about $0.001 for the call, which is noise", "Total: $0.032 + $0.039 + $0.044 + $0.028 + $0.001 = about $0.144 for the call, 3.6 cents a call minute; the biggest levers are the model prompt size, the voice chosen and the phone route, and a web caller skips the telephony line"], "production": ["Published prices move often and differ by tier and volume: Deepgram's page lists streaming speech to text in fractions of a cent per minute for its Nova models, which is the right order of magnitude for the STT line", "Long calls cost more than linearly in model tokens because each turn re-sends the history; summarising old turns and caching the system prompt are the usual fixes", "Per-minute pricing by platforms bundles these lines; the margin question is what you would pay assembling the parts yourself, and at what volume that is worth the engineering"], "figs": [], "res": [{"kind": "video", "req": true, "label": "How Much Does a Voice AI Agent Cost Per Minute?", "url": "https://www.youtube.com/watch?v=mrjG8QWOQoE", "m": 5, "why": "The line items and typical ranges.", "yt": {"id": "mrjG8QWOQoE", "ch": "Voice AI Space"}}, {"kind": "video", "req": false, "label": "Voice AI Cost Estimator", "url": "https://www.youtube.com/watch?v=f3DupAjCqyE", "m": 3, "why": "Optional: a vendor's calculator, to see how its lines add.", "yt": {"id": "f3DupAjCqyE", "ch": "Telnyx"}}, {"kind": "read", "req": true, "label": "Deepgram: pricing", "url": "https://deepgram.com/pricing", "m": 3, "why": "Streaming STT per-minute rates for the STT line; check the page for current numbers."}, {"kind": "read", "req": false, "label": "LiveKit: deploying agents to your own infrastructure", "url": "https://docs.livekit.io/agents/ops/deployment/custom/", "m": 10, "why": "Calls per worker and the load test, for the compute line."}, {"kind": "keep", "src": "site", "req": false, "label": "Your Commure path: sizing, on a whiteboard", "url": "../interviews/commure.html", "m": 20, "why": "The own-system sizing topic, which uses the same call-minute arithmetic."}, {"kind": "keep", "src": "site", "req": false, "label": "Wildcard session wc21: the backend under a live agent", "url": "../index.html#/w/wc21", "m": 135, "why": "Includes scaling arithmetic on a call workload."}, {"kind": "keep", "src": "site", "req": false, "label": "Guide: voice AI agent platform at scale", "url": "../SYSTEM%20DESIGN.html#/designs/voice-agent", "m": 25, "why": "The platform design's cost per minute from published prices, and why cost is recorded by part on every call."}], "mcq": [{"q": "In the worked example, which pair of lines is the largest share of the total?", "o": ["Model tokens and TTS characters", "Compute and telephony", "Compute and STT", "Telephony and STT", "Compute and the model"], "a": 0, "why": "The model ($0.044) and TTS ($0.039) lead, then STT ($0.032) and telephony ($0.028). Compute is about $0.001."}, {"q": "A 4 minute call is streamed to STT at $0.008 a minute. Why is the cost for the whole 4 minutes, rather than only the minutes the caller spoke?", "o": ["Silence is more expensive than speech", "The caller spoke all four minutes", "STT is billed per word spoken by the agent", "The audio, silence included, is streamed and billed by duration", "The model bills it"], "a": 3, "why": "A streaming connection takes the whole call's audio. Billing is by audio duration."}, {"q": "Why do model costs grow faster than linearly with call length?", "o": ["Output tokens cost more over time", "Each turn re-sends the growing history as input", "The model slows down", "Telephony adds token fees", "TTS is billed on tokens"], "a": 1, "why": "Input tokens per turn rise with history, so total input is roughly quadratic in the number of turns without trimming or caching."}, {"q": "The agent speaks 240 words in a call. Roughly how many characters go to TTS at 5.4 per word?", "o": ["About 240", "About 13,000", "About 130", "About 2,400", "About 1,300"], "a": 4, "why": "240 x 5.4 = 1,296, about 1,300 characters."}, {"q": "Which cost line barely matters in the example, and why?", "o": ["STT, because audio is free", "The model, because tokens are cheap", "Compute, because a worker is shared by about 15 calls at pennies an hour", "TTS, because voices are free", "Telephony, because it is flat"], "a": 2, "why": "$0.20 an hour over 15 calls is about $0.0002 a call minute. The vendor lines dominate."}], "open": {"q": "What does one minute of a voice agent call cost, and what would you do to cut it?", "probe": "Which line would you attack first?", "a": ["Five lines: STT per audio minute, model tokens, TTS characters, telephony per minute, and a small share of compute", "With illustrative rates, a 4 minute call came to about $0.14, around 3.6 cents a minute, with the model, TTS, STT and phone leg all within a few cents of each other and compute negligible", "To cut it I would shrink the prompt and history sent every turn, cache the system prompt and use a smaller model where tests allow", "I would check the voice choice and the phone route, since a web caller has no telephony line", "The rates are assumptions; I would use current vendor prices and measured call data"]}, "say": ["**A call minute is five lines, and compute is the smallest.**", "**Lines:** STT per audio minute, model tokens, TTS characters, telephony, compute.", "**Example:** about $0.14 for a 4 minute call on stated
