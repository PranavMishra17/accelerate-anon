e. Macro-F1 averages per-class F1, so every class counts equally.", "Accuracy lies under imbalance. If 95% of traffic is one intent, a model that always predicts it scores 95% accuracy and near-zero macro-F1.", "For an assistant I'd report both averages plus per-intent recall, and weight by business cost where I can: missing a fraud report isn't the same as missing a greeting."], "land": "Micro pools, macro averages per class; accuracy lies under imbalance; report per-intent recall.", "probes": ["When would you prefer micro?", "Why the harmonic mean?", "What's a precision-recall trade-off in an assistant?"], "notes": ["Micro-F1 equals accuracy for single-label multi-class, which is why it hides rare classes."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/classification-metrics", "label": "Baseline: classification metrics", "why": "Macro, micro and the confusion matrix."}, {"url": "../BASELINE.html#/ml/evaluation-splits", "label": "Baseline: evaluation and splits", "why": "Precision and recall in the ML field."}, {"url": "../index.html#/w/wc25", "label": "Session wc25: The map of NLP, step 4: Evaluation: what each metric measures and hides", "why": "Where every task, representation and model era sits."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/evaluation-metrics", "label": "Microsoft CLU: evaluation metrics", "why": "Precision, recall, F1, the confusion matrix, the None threshold.", "m": 12}], "figs": [], "sdLinks": []}, "id": "q-macro-or-micro-f1-and-when-does-accuracy-lie"}, {"q": "Why does calibration matter, and how do you fix it?", "short": "Calibration", "tests": "Knowing that every routing rule depends on it.", "a": ["A model is calibrated if, when it says 80% confident, it's right about 80% of the time. Modern neural networks are overconfident; Guo and colleagues showed it in 2017. And every downstream rule, route, confirm, fall back, escalate, reads that confidence, so a miscalibrated model makes every threshold wrong.", "Measure it with a reliability diagram and expected calibration error. The cheap fix is temperature scaling: divide the logits by one scalar fitted on a validation set. It doesn't change any prediction, only the confidence.", "I'd recalibrate after every retrain. That's also why a platform's score isn't a probability: Lex says its scores are comparative, and CLU warns of wrong intents at 1.00."], "land": "Confidence must mean what it says; every threshold depends on it; temperature scaling, refitted each retrain.", "probes": ["Why are networks overconfident?", "What's ECE?", "Does temperature scaling change accuracy?"], "notes": ["ECE: bin predictions by confidence, then average the gap between confidence and accuracy in each bin, weighted by bin size."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/classification-metrics", "label": "Baseline: classification metrics", "why": "Calibration."}, {"url": "../BASELINE.html#/nlp/out-of-scope", "label": "Baseline: out-of-scope detection", "why": "Thresholds that depend on it."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 2: Imbalance, calibration and out-of-scope", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://arxiv.org/abs/1706.04599", "label": "On calibration of modern neural networks", "why": "Overconfidence, ECE, temperature scaling.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-why-does-calibration-matter-and-how-do-you-fix-it"}, {"q": "How would you reduce the latency of a BERT classifier?", "short": "BERT latency", "tests": "Practical serving, in order of effort.", "a": ["In order of effort: truncate the input to what you need, use dynamic padding and length-bucketed batching, export to ONNX or TensorRT, run in fp16 or int8, then distil into a smaller model like DistilBERT or MiniLM.", "Around that, cache frequent inputs, and use a cascade: a cheap model handles the confident cases and the big one only sees the rest.", "And measure p95 on the real hardware before and after. At UIC I deployed an audio model at 150 milliseconds p95 with INT8 quantisation, so I've done that step on real hardware."], "land": "Truncate and batch, export, quantise, distil; cache and cascade; measure p95 on real hardware.", "probes": ["What does int8 cost in accuracy?", "How does distillation work?", "Where does the time go in a BERT forward pass?"], "notes": ["Distillation trains a small student to match the big teacher's output probabilities, not only the labels."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/text-classification", "label": "Baseline: text classification", "why": "Serving."}, {"url": "../BASELINE.html#/inference/quantization", "label": "Baseline: quantisation", "why": "What int8 changes."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 1: The classification ladder, cheapest first", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://lilianweng.github.io/posts/2023-01-10-inference-optimization/", "label": "Lilian Weng: inference optimisation", "why": "KV cache cost, distillation, quantisation.", "m": 9}], "figs": [], "sdLinks": []}, "id": "q-how-would-you-reduce-the-latency-of-a-bert-classifier"}, {"q": "What is SetFit, and why does it work with so few examples?", "short": "SetFit", "tests": "A modern few-shot method, understood.", "a": ["SetFit fine-tunes a sentence transformer contrastively on pairs made from your few labelled examples, same class pulled together, different classes pushed apart, then trains a logistic head on the resulting embeddings.", "It works because a handful of examples per class makes a lot of pairs, and the encoder already starts with good semantics, so it only has to bend the space a little. No prompts, quick to train, and it's competitive with much bigger models at 8 to 64 examples per class.", "It's the classifier in the Amazon hybrid paper: SetFit handles the confident turns and the LLM the uncertain ones. For a new intent with little traffic, I think it's the first thing I'd try after a TF-IDF baseline."], "land": "Contrastive pairs on a sentence encoder, then a head; many pairs from few examples.", "probes": ["How many pairs from 8 examples per class?", "How does it compare to prompting an LLM?"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/text-classification", "label": "Baseline: text classification", "why": "Few-shot methods."}, {"url": "../BASELINE.html#/nlp/sentence-embeddings", "label": "Baseline: sentence embeddings", "why": "The contrastive training it uses."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 1: The classification ladder, cheapest first", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://huggingface.co/blog/setfit", "label": "Hugging Face: SetFit", "why": "Few-shot classification without prompts.", "m": 10}], "figs": [], "sdLinks": []}, "id": "q-what-is-setfit-and-why-does-it-work-with-so-few-examples"}, {"q": "Your model scores 92% on the test set but poorly in production. Why?", "short": "Test vs production", "tests": "Debugging the gap between offline and online.", "a": ["Most likely distribution shift: new phrasing, new users, a new product. Or the test set is flawed, with label noise or leakage from training. Or a prior shift, where the class balance in production differs from the test set.", "I'd sample production traffic, label it, and score the model on that. Compare embedding distributions between training and production to see the shift. And check preprocessing: a mismatch between how text is cleaned in training and in serving causes this more often than people admit.", "Then the fix is the loop: production samples into training, a time-based split so the test set looks like the future, and monitoring on the live mix. It's the same lesson as alfred_'s test set: cases from real production, not from what we imagined."], "land": "Shift, a flawed test set, or a prior shift; label production samples, compare distributions, check preprocessing.", "probes": ["How would you detect leakage?", "What's a time-based split?"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/text-classification", "label": "Baseline: text classification", "why": "Data, leakage and shift."}, {"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "Production samples."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 5: Experiments, drift, release and rollback", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}], "figs": [], "sdLinks": []}, "id": "q-your-model-scores-92-on-the-test-set-but-poorly-in-productio"}]}, {"group": "Embeddings", "blurb": "Why embeddings work, how sentence embeddings are trained, choosing a model, similarity, search and failure modes. Taught in wc26.", "items": [{"q": "Why do embeddings work?", "short": "Why they work", "tests": "The idea under every vector, in plain words.", "a": ["The distributional hypothesis: words used in similar contexts have similar meanings. Train a model to predict context and it's forced to put similar words near each other, so the geometry ends up encoding meaning. Nobody puts the meaning in; it falls out of the objective.", "Word2vec is the clean example. Skip-gram predicts the context words from the centre word. Instead of a softmax over the whole vocabulary, negative sampling turns it into a binary task: raise the score of the true pair, lower it for a few random words. That makes training cheap, and the learned vectors are the embeddings.", "Sentence embedding models extend the same idea with a contrastive objective: texts that should match are trained to be close."], "land": "Similar contexts, similar meanings; predicting context forces the geometry.", "probes": ["Skip-gram or CBOW?", "Why negative sampling?", "GloVe and fastText, how do they differ?"], "parts": [{"title": "Three static models", "items": ["**word2vec (2013):** skip-gram or CBOW, negative sampling, subsampling of frequent words. Typical: 300 dimensions, window about 5.", "**GloVe (2014):** factorises a global co-occurrence matrix so dot products approximate log co-occurrence counts.", "**fastText:** a word is the sum of its character n-gram vectors, so it handles rare words, typos and unseen words."]}], "figs": ["embed"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/word-embeddings", "label": "Baseline: word embeddings", "why": "word2vec, GloVe, fastText."}, {"url": "../BASELINE.html#/ml/embeddings", "label": "Baseline: embeddings (ML field)", "why": "The core topic."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 3: Word embeddings: word2vec, GloVe, fastText", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://jalammar.github.io/illustrated-word2vec/", "label": "Jay Alammar: the illustrated word2vec", "why": "Skip-gram, negative sampling, the window.", "m": 35}, {"url": "https://web.stanford.edu/~jurafsky/slp3/5.pdf", "label": "SLP3, ch. 5: Embeddings", "why": "The distributional hypothesis and word2vec.", "m": 45}], "figs": ["embed"], "sdLinks": []}, "id": "q-why-do-embeddings-work"}, {"q": "Static or contextual embeddings: what's the difference?", "short": "Static and contextual", "tests": "Why BERT changed things.", "a": ["Static embeddings give one vector per word type, so 'bank' has one vector whether it's a river or money. Contextual models, ELMo with a bidirectional LSTM and then BERT with a Transformer encoder, compute a vector per occurrence from the whole sentence, so the sense comes from context.", "Contextual vectors are better for most tasks, but they cost a model forward pass per input. Static ones are a lookup.", "For an assistant that matters for words like 'card', 'balance' or 'charge', which mean different things in different intents."], "land": "One vector per word versus one per occurrence; context resolves the sense.", "probes": ["What did ELMo add?", "When would you still use static vectors?"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/word-embeddings", "label": "Baseline: word embeddings", "why": "Static versus contextual."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 4: Contextual and sentence embeddings, and contrastive training", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://jalammar.github.io/illustrated-bert/", "label": "Jay Alammar: the illustrated BERT, ELMo and co.", "why": "From ELMo to BERT, masked LM, feature extraction.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-static-or-contextual-embeddings-what-s-the-difference"}, {"q": "Why can't you mean-pool BERT for sentence similarity?", "short": "Sentence embeddings", "tests": "How sentence embeddings are trained, at depth.", "a": ["Because BERT was trained to predict masked tokens, not to compare sentences. Its pooled vectors are anisotropic, packed into a narrow cone, so almost every cosine is high and the similarities don't line up well with meaning.", "Sentence-BERT fixed that by training a siamese BERT on sentence pairs so cosine works; it also took a search over 10,000 sentences from about 65 hours to about 5 seconds. The modern recipe is contrastive: pull a query and its positive together, push others apart, with the InfoNCE loss. In-batch negatives make every other example in the batch a free negative, so big batches help, and hard negatives, similar but wrong, help most.", "SimCSE showed even dropout noise works as the augmentation, unsupervised, and that contrastive training spreads the vectors out."], "land": "BERT wasn't trained to compare; contrastive training with in-batch and hard negatives makes cosine meaningful.", "probes": ["Write InfoNCE in words.", "What does temperature do in the loss?", "What's a hard negative for an intent classifier?"], "parts": [{"title": "InfoNCE in words", "items": ["For each query: a softmax over its similarity to one positive and many negatives, each divided by a temperature.", "The loss is minus the log of the positive's share.", "A low temperature (around 0.05 to 0.1, from memory) penalises hard negatives sharply."]}], "notes": ["Hard negatives for an assistant: utterances from the intent it's most often confused with."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/sentence-embeddings", "label": "Baseline: sentence embeddings", "why": "Contrastive training."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 4: Contextual and sentence embeddings, and contrastive training", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://arxiv.org/abs/1908.10084", "label": "Sentence-BERT", "why": "Siamese BERT so cosine means something.", "m": 25}, {"url": "https://lilianweng.github.io/posts/2021-05-31-contrastive/", "label": "Lilian Weng: contrastive representation learning", "why": "Skim InfoNCE, in-batch negatives, SBERT, SimCSE.", "m": 20}], "figs": [], "sdLinks": []}, "id": "q-why-can-t-you-mean-pool-bert-for-sentence-similarity"}, {"q": "How do you choose an embedding model?", "short": "Choosing a model", "tests": "A method, not a leaderboard rank.", "a": ["Shortlist from MTEB, filtered to the task and the language I need, retrieval or classification or clustering. Then check the practical things: maximum input length, dimension, licence, hosting, latency and price.", "Then the part that decides: build 100 to 300 real query-to-answer pairs from our own data and compare recall at k and MRR. Small gaps on a public leaderboard rarely survive on your own data.", "In MetaRAG the evaluation on our own queries is what found the win: TF-IDF weighted embeddings beat the plain baseline, 82.5% precision against 73.3%, with 0.925 Hit Rate at 10."], "land": "Shortlist from MTEB, check the practical limits, decide on your own labelled queries.", "probes": ["Which models would you shortlist today?", "What's MRR?", "What happens when you switch models?"], "notes": ["MTEB, in the original paper: 8 task types, 58 datasets, 112 languages; it has grown since. Check rankings live; don't quote them from memory.", "Families to name: OpenAI text-embedding-3, Cohere, Voyage, Google's Gemini embeddings; open ones like BGE, E5, GTE, Nomic, Qwen. From memory: say 'families like'.", "Switching models means re-embedding everything; vectors from two models aren't comparable."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/sentence-embeddings", "label": "Baseline: sentence embeddings", "why": "Choosing a model."}, {"url": "mphasis.html#/prep/q-what-are-embeddings-and-how-does-similarity-search-work", "label": "Mphasis page: embeddings and similarity search", "why": "Your general answer, already written."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 6: Choosing an embedding model, and how embeddings fail", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://arxiv.org/abs/2210.07316", "label": "MTEB", "why": "The benchmark: task types, datasets, languages.", "m": 25}, {"url": "https://huggingface.co/spaces/mteb/leaderboard", "label": "MTEB leaderboard", "why": "Check rankings live; don't quote them from memory."}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-choose-an-embedding-model"}, {"q": "Cosine, dot product or Euclidean distance?", "short": "Similarity", "tests": "Knowing they're often the same, and when they're not.", "a": ["Cosine is the dot product with the lengths divided out, so it ignores magnitude. On unit-normalised vectors, dot product equals cosine and gives the same ranking as Euclidean distance.", "So normalise once at write time and use the fastest, which is the dot product.", "The exception: if a model was trained with dot product and its vector length carries meaning, popularity for example, don't normalise blindly. Use the metric the model card says it was trained with."], "land": "Same ranking on normalised vectors; normalise once, use dot product; follow the model card.", "probes": ["Prove the L2 equivalence.", "When does magnitude matter?"], "notes": ["For unit vectors, squared distance is 2 minus 2 times the cosine, so ranking by one ranks by the other."], "figs": ["vectors"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/sentence-embeddings", "label": "Baseline: sentence embeddings", "why": "Similarity."}, {"url": "../CODING.html#embed", "label": "Coding page: embeddings and vector search", "why": "The code."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 4: Contextual and sentence embeddings, and contrastive training", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}], "figs": ["vectors"], "sdLinks": []}, "id": "q-cosine-dot-product-or-euclidean-distance"}, {"q": "HNSW, IVF and PQ: what are they, and when do you use each?", "short": "Vector search", "tests": "Approximate nearest neighbour search, practically.", "a": ["Flat search compares against every vector, fine up to roughly a million. HNSW is a layered proximity graph: you descend greedily from sparse top layers to the dense bottom one. Very good recall and speed, at high memory; the knobs are M, efConstruction and efSearch.", "IVF clusters the space with k-means and searches only the nearest few cells, which saves compute. PQ splits each vector into sub-vectors and stores a short code for each, 10 to 50 times less memory at some recall cost. IVF-PQ together is the billion-scale option.", "For an assistant's knowledge base, flat or HNSW is usually enough. I'd also use hybrid search, BM25 plus dense with rank fusion, which often beats dense alone; my Comments Probe project used a two-phase hybrid search."], "land": "Flat to a million, HNSW for recall and speed, IVF-PQ for billions; hybrid often beats dense alone.", "probes": ["What does efSearch trade?", "What are Matryoshka embeddings?", "How do filters interact with ANN?"], "swaps": [{"when": "If they ask about Matryoshka embeddings", "line": "The model is trained so the first k dimensions are a good embedding on their own, for several k. You can truncate to, say, 256 and renormalise to cut storage and search cost with a small quality drop, then rerank with the full vectors."}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/sentence-embeddings", "label": "Baseline: sentence embeddings", "why": "Search."}, {"url": "../BASELINE.html#/data/vector-db", "label": "Baseline: vector databases", "why": "The core topic."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/search/vector", "label": "Guide: vector search", "why": "As a design technique."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 5: Vector search: HNSW, IVF, PQ", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://github.com/facebookresearch/faiss/wiki/Faiss-indexes", "label": "FAISS: index types", "why": "Flat, IVF, HNSW, PQ.", "m": 15}, {"url": "https://arxiv.org/abs/2205.13147", "label": "Matryoshka representation learning", "why": "Truncatable embeddings.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-hnsw-ivf-and-pq-what-are-they-and-when-do-you-use-each"}, {"q": "Where do embeddings fail, and how do you use them in an assistant?", "short": "Failures and uses", "tests": "Knowing the limits, and the practical uses.", "a": ["They're weak on negation, numbers and identifiers: 'I can't log in' and 'I can log in' sit close together. They miss domain vocabulary a general model never saw. Short queries against long passages need models trained with query and document prefixes. Chunking and truncation silently drop content. And upgrading the model means re-embedding everything.", "I'd mitigate with hybrid BM25, a cross-encoder reranker, domain fine-tuning with hard negatives, and a retrieval evaluation set in CI.", "In an assistant they do three jobs: intent detection by nearest labelled example or class centroid, clustering misses to find new intents, and retrieval for the knowledge answers. MetaRAG is my retrieval example: TF-IDF weighted embeddings, 0.925 Hit Rate at 10."], "land": "Negation, numbers, IDs, domain words, truncation; hybrid, rerankers, fine-tuning; three uses in an assistant.", "probes": ["How would you fix negation?", "What does a reranker add?", "When would you fine-tune an embedding model?"], "notes": ["A cross-encoder reads the query and the passage together, so it's slower but far better at the details embeddings blur, like negation."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/sentence-embeddings", "label": "Baseline: sentence embeddings", "why": "Failure modes."}, {"url": "../BASELINE.html#/ai/hybrid-search-reranking", "label": "Baseline: hybrid search and reranking", "why": "The core topic."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/search/hybrid-rerank", "label": "Guide: hybrid search and reranking", "why": "As a design technique."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 6: Choosing an embedding model, and how embeddings fail", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}], "figs": [], "sdLinks": []}, "id": "q-where-do-embeddings-fail-and-how-do-you-use-them-in-an-assis"}]}, {"group": "LLM fundamentals and the Transformer", "blurb": "Attention and the block, encoders and decoders, the KV cache, tokens, decoding, post-training, and fine-tune versus RAG. Taught in wc27; lightly.", "items": [{"q": "Explain attention to me.", "id": "q-attention", "short": "Attention", "tests": "The mechanism in plain words, with the intuition.", "a": ["Each token's vector is projected three ways: a query, a key and a value. The query is compared, by dot product, with every token's key to get scores; a softmax turns the scores into weights; and the token's new vector is the weighted sum of the values.", "The intuition: the query is 'what am I looking for', the key is 'what I contain', the value is 'what I hand over if chosen'. So every token gathers what's relevant from the whole sequence in one parallel step, where an RNN had to pass information along step by step.", "I built one from scratch, a Transformer for English-German translation following the original paper, so this is the part I'd be happiest to draw on a whiteboard."], "land": "Query against every key, softmax into weights, weighted sum of values; all positions in one parallel step.", "probes": ["Why divide by the square root of d_k?", "What's multi-head for?", "Self-attention versus cross-attention?"], "parts": [{"title": "The formula, said out loud", "items": ["Attention(Q, K, V) = softmax(Q Kᵀ / √d_k) V.", "**Causal mask:** position i can't attend to j greater than i, so training is many next-token predictions at once.", "**Cross-attention:** queries from the decoder, keys and values from the encoder (translation, T5)."]}], "figs": ["qkvAttention"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/attention", "label": "Baseline: attention", "why": "The mechanism."}, {"url": "../BASELINE.html#/ml/transformers", "label": "Baseline: Transformers and attention (ML field)", "why": "The core topic."}, {"url": "../CODING.html#transformer", "label": "Coding page: attention and a Transformer block", "why": "The code."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 5: Attention, and the block around it", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://jalammar.github.io/illustrated-transformer/", "label": "Jay Alammar: the illustrated Transformer", "why": "Q, K, V, heads, positions, residuals.", "m": 25}, {"url": "https://www.3blue1brown.com/lessons/attention", "label": "3Blue1Brown: attention in Transformers, step by step", "why": "The picture behind Q, K and V."}, {"url": "https://magazine.sebastianraschka.com/p/understanding-and-coding-self-attention", "label": "Sebastian Raschka: coding self-attention", "why": "Self, multi-head, causal and cross-attention in code.", "m": 25}], "figs": ["qkvAttention"], "sdLinks": []}}, {"q": "Why divide the attention scores by the square root of d_k?", "short": "The √d_k", "tests": "A classic follow-up: do you know why, not only that?", "a": ["Because dot products grow with dimension. If the query and key entries have unit variance, their dot product over d_k dimensions has variance d_k.", "Large scores push the softmax into saturation, nearly one-hot, where the gradients are tiny and training stalls. Dividing by the square root of d_k brings the variance back to about one.", "So it's a variance fix to keep the softmax in the range where it can learn."], "land": "Dot-product variance grows with d_k; big scores saturate softmax and kill gradients; the root brings it back to one.", "probes": ["Why the square root and not d_k?", "What does a saturated softmax do to gradients?"], "notes": ["The square root because variance scales with d_k, so the standard deviation scales with its root."], "figs": ["attention"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/attention", "label": "Baseline: attention", "why": "Scaling."}, {"url": "../BASELINE.html#/ml/transformers", "label": "Baseline: Transformers and attention", "why": "The core topic."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 5: Attention, and the block around it", "why": "Attention, encoders and decoders, decoding, post-training."}], "figs": ["attention"], "sdLinks": []}, "id": "q-why-divide-the-attention-scores-by-the-square-root-of-d-k"}, {"q": "Why multiple heads, and how does position get in?", "short": "Heads and position", "tests": "Two standard follow-ups in one.", "a": ["Multiple heads run attention several times in parallel on smaller projections, d_k is d_model divided by the number of heads, then concatenate and project. Different heads can learn different relations, syntax, position, coreference, at the same total cost as one big head.", "Attention itself is order-blind, so position has to be injected. The original paper added fixed sine and cosine waves to the embeddings. BERT and GPT-2 learned a vector per position, capped at the training length. RoPE, the default in Llama-style models, rotates the query and key vectors by an angle that depends on position, so their dot product depends on relative distance, and it extends better to longer contexts."], "land": "Heads: several relations at the same cost. Position: sinusoidal, learned, or RoPE's rotation for relative distance.", "probes": ["Why does RoPE extend to longer context?", "What do heads actually learn?"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/attention", "label": "Baseline: attention", "why": "Heads and positions."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 5: Attention, and the block around it", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://jalammar.github.io/illustrated-transformer/", "label": "Jay Alammar: the illustrated Transformer", "why": "Q, K, V, heads, positions, residuals.", "m": 25}, {"url": "https://arxiv.org/abs/2104.09864", "label": "RoFormer (RoPE)", "why": "Rotary position embeddings.", "m": 20}], "figs": [], "sdLinks": []}, "id": "q-why-multiple-heads-and-how-does-position-get-in"}, {"q": "Walk me through one Transformer block.", "short": "The block", "tests": "The whole layer, lightly, and where the parameters are.", "a": ["Normalise, attend, add the input back; normalise, run a feed-forward network on each token, add back again. That block repeats N times.", "The residual connections, x plus the sublayer of x, keep gradients flowing through deep stacks. Layer norm normalises each token's activations. The original put the norm after the residual add, post-LN, which needs learning-rate warmup; modern LLMs put it before each sublayer, pre-LN, which trains stably without it, and many use RMSNorm.", "The feed-forward block expands to about four times the width, applies a nonlinearity and projects back. It holds about two-thirds of the parameters and is where a lot of factual knowledge is thought to live."], "land": "Norm, attend, add; norm, feed-forward, add; repeated; the FFN holds two-thirds of the parameters.", "probes": ["Pre-LN or post-LN, and why?", "Roughly how many parameters per layer?", "Why is attention O(n²)?"], "parts": [{"title": "Rough numbers", "items": ["About 12 × d_model² parameters per layer: 4 d² in attention, 8 d² in a 4× FFN.", "GPT-3: 96 layers, d_model 12,288, about 174B by that formula; published 175B.", "BERT-base: 12 layers, 768 hidden, 12 heads, about 110M (from memory).", "Training compute is about 6 × parameters × tokens; inference about 2 × parameters per token."]}, {"title": "Why O(n²), and what helps", "items": ["Every token is scored against every other, so time and memory grow with the square of the length.", "FlashAttention keeps it exact and cuts memory traffic by tiling.", "Sparse or windowed attention restricts the pattern; the KV cache avoids recomputation during generation."]}], "figs": ["transformerBlock"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/encoders-decoders", "label": "Baseline: encoders and decoders", "why": "The block in each family."}, {"url": "../CODING.html#transformer", "label": "Coding page: attention and a Transformer block", "why": "The code."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 5: Attention, and the block around it", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://arxiv.org/abs/2002.04745", "label": "On layer normalization in the Transformer", "why": "Pre-LN trains without warmup.", "m": 20}, {"url": "https://www.3blue1brown.com/lessons/mlp", "label": "3Blue1Brown: how might LLMs store facts", "why": "The feed-forward block."}], "figs": ["transformerBlock"], "sdLinks": []}, "id": "q-walk-me-through-one-transformer-block"}, {"q": "BERT versus GPT: what's the difference?", "short": "BERT and GPT", "tests": "Encoders, decoders, and which to use for what.", "a": ["BERT is an encoder trained on masked-token prediction: hide about 15% of the tokens and predict them from both sides. So it builds rich representations, good for classification, NER, embeddings and reranking, but it can't generate fluently.", "GPT is a decoder trained to predict the next token with a causal mask, so it only sees the left context and it generates naturally. T5 and BART are the third family, encoder-decoders, where the encoder reads the input and the decoder generates while attending to it: translation, summarisation.", "Instruction-tuned decoders now do classification too, by prompting, but for pure understanding at volume an encoder is still much cheaper and faster. That's the whole classic-versus-LLM trade-off in an assistant."], "land": "Encoder, both directions, understanding; decoder, left to right, generation; encoders still win on cost for classification.", "probes": ["Why can't BERT generate?", "Which would you use for intent classification?", "What's span corruption?"], "notes": ["T5's span corruption masks spans and generates the missing ones."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/encoders-decoders", "label": "Baseline: encoders and decoders", "why": "The three families."}, {"url": "mphasis.html#/prep/q-how-does-a-large-language-model-work", "label": "Mphasis page: how an LLM works", "why": "Your general answer, already written."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 2: From pretraining to an assistant", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://jalammar.github.io/illustrated-bert/", "label": "Jay Alammar: the illustrated BERT, ELMo and co.", "why": "From ELMo to BERT, masked LM, feature extraction.", "m": 25}, {"url": "https://huggingface.co/learn/llm-course/chapter1/4", "label": "Hugging Face LLM course: how do Transformers work?", "why": "Encoder, decoder, encoder-decoder.", "m": 15}, {"url": "https://web.stanford.edu/~jurafsky/slp3/9.pdf", "label": "SLP3, ch. 9: Masked Language Models", "why": "BERT and fine-tuning.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-bert-versus-gpt-what-s-the-difference"}, {"q": "What is the KV cache, and why does it matter?", "short": "KV cache", "tests": "Inference cost, from the mechanism.", "a": ["During generation, the keys and values of past tokens don't change, so you store them. Each new token computes only its own query, key and value and attends over the cache, instead of recomputing the whole sequence.", "The cache grows with layers, context length and batch size, and at long context it often dominates GPU memory. For a 7B Llama-style model, 32 layers and hidden size 4096 in fp16, that's two tensors times 32 layers times 4096 times 2 bytes, about half a megabyte per token, so 4,000 tokens is about 2 GB per sequence.", "That's why long context and high concurrency are expensive, and why grouped-query attention shares keys and values across heads to shrink it."], "land": "Store past keys and values; it grows with layers, context and batch; GQA shrinks it.", "probes": ["What's prefill versus decode?", "How does GQA work?", "Why is decode memory-bound?"], "notes": ["The half megabyte is arithmetic: 2 (K and V) × 32 layers × 4,096 × 2 bytes = 524,288 bytes per token, assuming no GQA."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/encoders-decoders", "label": "Baseline: encoders and decoders", "why": "Why decoders cache keys and values."}, {"url": "../BASELINE.html#/inference/kv-cache", "label": "Baseline: KV cache", "why": "The core topic."}, {"url": "../BASELINE.html#/inference/prefill-decode", "label": "Baseline: prefill and decode", "why": "Why decode is memory-bound."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 6: Three shapes, the cost of attention, and the KV cache", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://lilianweng.github.io/posts/2023-01-10-inference-optimization/", "label": "Lilian Weng: inference optimisation", "why": "KV cache cost, distillation, quantisation.", "m": 9}, {"url": "https://arxiv.org/abs/2305.13245", "label": "GQA: grouped-query attention", "why": "Sharing K and V across heads shrinks the cache.", "m": 15}], "figs": [], "sdLinks": []}, "id": "q-what-is-the-kv-cache-and-why-does-it-matter"}, {"q": "Why subword tokenization, and how does BPE work?", "short": "Tokenization", "tests": "Where cost and quirks begin.", "a": ["Word vocabularies explode and can't represent unseen words; characters make sequences very long. Subwords sit between: a fixed vocabulary, 30 thousand to a couple of hundred thousand, that composes any word from pieces.", "BPE starts from characters or bytes and repeatedly merges the most frequent adjacent pair; encoding replays those merges in the order they were learned. Byte-level BPE, in GPT-2 and RoBERTa, starts from the 256 bytes, so nothing is ever out of vocabulary. BERT's WordPiece is similar but picks merges by likelihood and marks continuations with '##'; SentencePiece treats spaces as characters, so it needs no language-specific pre-tokeniser.", "It matters in practice: token count drives cost and context, and tokenisation explains odd behaviour on spelling, arithmetic, IDs and other languages. In an assistant, account numbers split into odd pieces, which is one more reason to extract them with code."], "land": "Subwords: fixed vocabulary, any word; BPE merges frequent pairs; it drives cost and odd failures.", "probes": ["WordPiece versus BPE?", "Why do LLMs struggle to count letters?", "What's a unigram tokeniser?"], "figs": ["bpeMerge"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/tokenization", "label": "Baseline: tokenization", "why": "BPE, WordPiece, SentencePiece."}, {"url": "../CODING.html#bpe", "label": "Coding page: a tokenizer, byte-pair encoding", "why": "The code."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 1: Tokenization: BPE, WordPiece, SentencePiece", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://huggingface.co/learn/llm-course/chapter6/5", "label": "Hugging Face LLM course: byte-pair encoding", "why": "BPE step by step, with code.", "m": 20}, {"url": "https://web.stanford.edu/~jurafsky/slp3/2.pdf", "label": "SLP3, ch. 2: Words and Tokens", "why": "The BPE section only.", "m": 20}], "figs": ["bpeMerge"], "sdLinks": []}, "id": "q-why-subword-tokenization-and-how-does-bpe-work"}, {"q": "Temperature, top-k and top-p: what are they, and when do you use each?", "short": "Decoding", "tests": "Knowing which knob for which task.", "a": ["Temperature divides the logits before the softmax: below one sharpens the distribution, above one flattens it, and near zero it approaches greedy. Top-k samples from the k most likely tokens. Top-p, nucleus sampling, samples from the smallest set whose probabilities add up to p, so it adapts to how confident the model is.", "Greedy and beam search are deterministic. Beam is good for translation and summarisation but goes bland and repetitive on open-ended text; that's what the nucleus sampling paper was about.", "For classification, extraction and anything an assistant acts on, temperature zero or constrained decoding to a schema. Higher temperature with top-p only where variety is the point."], "land": "Temperature reshapes, top-k and top-p truncate; zero or constrained for anything the assistant acts on.", "probes": ["Why does top-p adapt better than top-k?", "Is temperature zero deterministic?", "What's constrained decoding?"], "notes": ["Temperature zero is close to deterministic but not guaranteed across providers and batches; don't promise byte-identical output."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/decoding", "label": "Baseline: decoding", "why": "Greedy, beam, sampling."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 3: Decoding, and prompt against RAG against fine-tuning", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://arxiv.org/abs/1904.09751", "label": "The curious case of neural text degeneration (top-p)", "why": "Why greedy and beam go bland, and nucleus sampling.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-temperature-top-k-and-top-p-what-are-they-and-when-do-you-us"}, {"q": "How does a pretrained model become an assistant?", "short": "Post-training", "tests": "Pretraining, SFT and preference tuning, in order.", "a": ["Pretraining on next-token prediction gives a model that continues text. Supervised instruction tuning on instruction and response pairs teaches it the format and to follow instructions; it gains behaviour more than knowledge.", "Then preference tuning. RLHF collects human rankings, trains a reward model, and optimises the policy with PPO plus a penalty for drifting from the tuned model; InstructGPT's 1.3B model was preferred over the 175B GPT-3. DPO skips the reward model and the RL loop and trains directly on preferred versus rejected pairs; it's simpler and more stable, and widely used.", "Scaling, in one line: loss falls as a power law in parameters, data and compute, and Chinchilla showed many early models were undertrained for their size."], "land": "Pretrain, then SFT for behaviour, then RLHF or DPO for preferences.", "probes": ["Why does SFT on unknown facts cause hallucination?", "DPO or RLHF?", "What's in-context learning?"], "notes": ["Weng's survey: fine-tuning on facts the model doesn't know teaches it to guess.", "In-context learning: the model adapts from examples in the prompt with no weight updates; choose examples by embedding similarity."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/llm-training", "label": "Baseline: LLM training", "why": "Pretraining to assistant."}, {"url": "../BASELINE.html#/ml/preference-tuning", "label": "Baseline: preference tuning", "why": "The core topic."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 2: From pretraining to an assistant", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://web.stanford.edu/~jurafsky/slp3/8.pdf", "label": "SLP3, ch. 8: Post-training", "why": "Instruction tuning and preference tuning.", "m": 25}, {"url": "https://arxiv.org/abs/2203.02155", "label": "InstructGPT", "why": "SFT, a reward model, PPO.", "m": 30}, {"url": "https://arxiv.org/abs/2305.18290", "label": "DPO", "why": "Preference tuning without a reward model.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-how-does-a-pretrained-model-become-an-assistant"}, {"q": "Fine-tune, LoRA, prompt or RAG: how do you choose?", "short": "Fine-tune or RAG", "tests": "Matching the method to the problem, for an assistant.", "a": ["Prompting first: fast, no training. RAG when the problem is knowledge that's private, large or changing, which in an assistant is policies, product details, help articles. Fine-tuning when the problem is behaviour, format, tone, a narrow skill, or latency and cost at scale.", "LoRA is how I'd fine-tune: freeze the base and train small low-rank matrices beside the weights, up to 10,000 times fewer trainable parameters than full fine-tuning in the paper, with no extra latency once merged, and adapters you can swap.", "The rule I use: knowledge goes in retrieval, behaviour goes in tuning, and try prompting before either. For an intent classifier specifically, a common pattern is to label with an LLM, then distil into a small encoder."], "land": "Knowledge in retrieval, behaviour in tuning, prompting first; LoRA for cheap fine-tunes.", "probes": ["How do you reduce hallucination in production?", "What's QLoRA?", "When would you fine-tune for an assistant?"], "swaps": [{"when": "If they ask about hallucination", "line": "Ground answers in retrieved evidence with citations, constrain the model to that context, use tools for facts and arithmetic, allow 'I don't know', and measure faithfulness on a regression set. At alfred_ we went further for one case: the model picks from real items and code attaches the ids, so it can't invent a thread at all."}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/nlu-llm-hybrid", "label": "Baseline: classic NLU and LLMs together", "why": "Where each fits."}, {"url": "mphasis.html#/prep/q-prompting-rag-or-fine-tuning-when-do-you-use-which", "label": "Mphasis page: prompting, RAG or fine-tuning", "why": "Your general answer, already written."}, {"url": "mphasis.html#/prep/q-how-do-you-reduce-hallucination", "label": "Mphasis page: reducing hallucination", "why": "Already written."}, {"url": "../CODING.html#lora", "label": "Coding page: LoRA", "why": "The code."}, {"url": "../index.html#/w/wc27", "label": "Session wc27: LLM fundamentals and the Transformer, lightly, step 3: Decoding, and prompt against RAG against fine-tuning", "why": "Attention, encoders and decoders, decoding, post-training."}, {"url": "https://arxiv.org/abs/2106.09685", "label": "LoRA", "why": "Low-rank adapters on a frozen base.", "m": 20}, {"url": "https://lilianweng.github.io/posts/2024-07-07-hallucination/", "label": "Lilian Weng: extrinsic hallucinations in LLMs", "why": "Causes, detection, mitigation.", "m": 29}], "figs": [], "sdLinks": []}, "id": "q-fine-tune-lora-prompt-or-rag-how-do-you-choose"}]}, {"group": "Your work, mapped to the role", "blurb": "What you've built that matches, and the gaps said plainly.", "items": [{"q": "How does your background fit this role?", "short": "The fit", "tests": "Is it real, and are you honest about the gaps?", "a": ["Most of it maps directly. The role is building and improving virtual assistants, conversation design, intents and entities, error analysis, production improvements, on top of strong NLP. At alfred_ every message goes through intent classification and a decision layer before any tool runs, for 5,000-plus active users, and I built the scanner and eval harness that find and fix its failures from real conversations.", "What I haven't done is ship on a classic NLU platform like Dialogflow CX or Cognigy, or run a taxonomy of hundreds of intents, and I'd rather say that plainly. The modelling and the error analysis are the same work; the platform is new."], "land": "The assistant, the NLU in front of it and the error analysis: done. The classic platforms: new, said first.", "probes": ["How quickly could you ramp up on our platform?", "What's the biggest gap?"], "parts": [{"title": "Where you've done each area", "items": ["**Intent classification and routing:** alfred_'s 'intent classification → decision layer → callable tools'.", "**Clarify and confirm by rule:** five verdicts, silent, notify, confirm, clarify, refuse, by deterministic risk scoring.", "**Error analysis:** the production failure scanner; eval cases from real failures; the multi-turn rewrite signed off on them.", "**Flows and state:** MockFlow-AI's state machine, stages moved only by a tool call.", "**Voice:** alfred_'s voice agent; MockFlow-AI under 400 ms with Deepgram Nova-2 and Silero VAD.", "**Embeddings and retrieval:** MetaRAG, TF-IDF weighted embeddings, 82.5% precision vs 73.3%, 0.925 Hit@10, 25% hallucination reduction, p99 under 300 ms at 10K queries a day.", "**Transformers:** a from-scratch Transformer for English-German translation; Advanced NLP at UIC.", "**Cost:** per-user LLM cost cut about 30% with a deterministic matcher in place of per-message model calls."]}, {"title": "Not done yet: say so", "items": ["Dialogflow CX, Lex, CLU, Rasa, Kore.ai or Cognigy in production.", "An intent taxonomy in the hundreds, with a team adding to it.", "Contact-centre analytics at enterprise volume: containment and CSAT across millions of sessions."]}], "learn": {"read": [{"url": "../BASELINE.html#/nlp", "label": "Baseline: the map of NLP and conversational AI", "why": "The whole field, by cluster."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 6: Your own work, and where you have not worked", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}], "figs": [], "sdLinks": []}, "id": "q-how-does-your-background-fit-this-role"}, {"q": "Tell me about the decision layer at alfred_.", "short": "The decision layer", "tests": "Depth on your closest work.", "a": ["Every inbound message, by text or the web, is routed through intent classification, then a decision layer, then callable tools. The decision layer is where the assistant decides what to do with each candidate action.", "It classifies every candidate action into one of five verdicts: silent, notify, confirm, clarify or refuse. And it does that by deterministic risk scoring, not by asking an LLM to judge. I think that's the right split: the model is good at understanding what someone meant; whether it's safe to send an email on their behalf should be a rule you can test.", "It's the same three-band idea the platforms use for thresholds, act, confirm, fall back, applied to actions instead of intents. And because it's deterministic, every verdict can be tested and replayed."], "land": "Intent, then five verdicts by deterministic risk scoring, then tools; the model understands, rules decide.", "probes": ["What goes into the risk score?", "Why not an LLM judge?", "How do you test it?", "What happens on clarify?"], "notes": ["From the master reference: 'every candidate action classified into five verdicts (SILENT / NOTIFY / CONFIRM / CLARIFY / REFUSE) via deterministic risk scoring, not LLM-as-judge'.", "The Coframe page says 'no risk score; a code floor confirms every send and irreversible delete'. Check which matches today's code, and what goes into the score, before Friday. If you're unsure on the call, describe the verdicts and the code floor, and leave the scoring detail out."], "never": ["Don't invent the inputs to the risk score."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/nlu-llm-hybrid", "label": "Baseline: classic NLU and LLMs together", "why": "The model proposes, code decides."}, {"url": "../index.html#/w/wc28", "label": "Session wc28: Conversation design, step 3: Confirmation: implicit, explicit, and confidence", "why": "Errors, confirmation, repair, handoff, voice and chat."}], "figs": [], "sdLinks": []}, "id": "q-tell-me-about-the-decision-layer-at-alfred"}, {"q": "Tell me about the production failure scanner.", "short": "The failure scanner", "tests": "Error analysis you've actually run.", "a": ["It scans real production conversations, classifies genuine failures versus expected behaviour, and auto-promotes the real bugs for triage. The hard part is the second step: a lot of what looks like failure is the assistant correctly declining, or the user changing their mind.", "The genuine ones become cases in our eval harness, a little over a hundred so far, each running the real agent against a frozen copy of that user's world. So every change runs against what users actually hit before it ships; that's how we signed off a full rewrite of the agent.", "It's pretty much the transcript-review loop this role describes, automated: find the failures, label the cause, turn each into a test."], "land": "Real conversations, failure versus expected behaviour, real bugs promoted, each one a test case.", "probes": ["How does it tell failure from expected behaviour?", "How often does it run?", "What did it find that you didn't expect?"], "notes": ["From the master reference: 'scans real production conversations, classifies genuine failures vs. expected behavior, auto-promotes real bugs for triage'. The Coframe page says it runs daily."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "The same loop, by hand."}, {"url": "coframe.html#/prep/say-now", "label": "Coframe page: what you're working on now", "why": "The eval harness story, already written."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 6: Your own work, and where you have not worked", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}], "figs": [], "sdLinks": []}, "id": "q-tell-me-about-the-production-failure-scanner"}, {"q": "Tell me about MetaRAG.", "short": "MetaRAG", "tests": "Your NLP research, with its numbers.", "a": ["MetaRAG was a retrieval framework for enterprise knowledge at UIC, accepted at IEEE CAI 2026. The finding I'd lead with: recursive chunking with TF-IDF weighted embeddings got 82.5% precision against a 73.3% baseline, and 0.925 Hit Rate at 10.", "It ran in a production code-translation use case at about 10K queries a day with p99 latency under 300 milliseconds, and it reduced hallucination by 25%.", "The lesson that carries over to an assistant: get retrieval right before touching the generation, and let sparse signals like TF-IDF help dense embeddings on domain vocabulary."], "land": "TF-IDF weighted embeddings and recursive chunking: 82.5% vs 73.3%, 0.925 Hit@10, 25% less hallucination.", "probes": ["How did the TF-IDF weighting work?", "What's Hit Rate at 10?", "How did you measure hallucination?"], "notes": ["Metrics verbatim from the master reference: 82.5% precision vs 73.3% baseline; 0.925 Hit Rate@10; 25% hallucination reduction; 10K queries/day; p99 under 300ms.", "Check the weighting mechanism and how hallucination was measured in the paper before Friday; don't improvise either."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/bow-tfidf", "label": "Baseline: bag of words and TF-IDF", "why": "The sparse half."}, {"url": "../BASELINE.html#/ai/rag", "label": "Baseline: RAG", "why": "The core topic."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 6: Choosing an embedding model, and how embeddings fail", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}], "figs": [], "sdLinks": []}, "id": "q-tell-me-about-metarag"}, {"q": "Tell me about a time you improved an assistant from production data.", "short": "An improvement from production", "tests": "Root cause over symptom, with a result.", "a": ["Our assistant tracks what people owe others from their inbox. The model kept inventing email threads, or getting who owes whom backwards, which is the worst thing an assistant can do to trust.", "Instead of prompting harder, I changed the design: the model only picks from a list of real items and writes the sentence, and code attaches the real ids. That made a whole class of hallucination structurally impossible, not probabilistically reduced, and tests enforce it.", "Two smaller ones from the same habit: replacing per-message model calls with a deterministic matcher for email rules cut per-user LLM cost about 30%, and triggering notifications on the event instead of a timer took them from about 90 seconds to about 3."], "land": "Make the mistake impossible by design; then cost and latency from the same habit.", "probes": ["How did you find it?", "How do you know it's fixed?", "What would you do on a classic platform?"], "swaps": [{"when": "If they ask what that means on a classic platform", "line": "The same move as validating a slot against the system of record instead of trusting the extractor: the model understands, code supplies the facts."}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "Mining misses and the failure taxonomy."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 6: Your own work, and where you have not worked", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}], "figs": [], "sdLinks": []}, "id": "q-tell-me-about-a-time-you-improved-an-assistant-from-producti"}, {"q": "You haven't used our platform. How would you get productive?", "short": "Ramping up", "tests": "Honesty plus a credible plan.", "a": ["Honestly, the platform is the part I'd learn; the work underneath it I've done. In the first week I'd read the intent taxonomy and the confusion matrix, sit with a few hundred real transcripts, and map the platform's pieces onto what I know: a page with a form is a state with required slots, a route is a transition, an event handler is the no-match ladder.", "Then I'd pick one small, measurable problem, a pair of confused intents or a page with a high no-match rate, and fix it end to end through the platform's test cases and release process. That teaches the platform on real work.", "That's how I work with any new stack: I built MockFlow-AI on LiveKit from scratch, and it runs under 400 milliseconds end to end."], "land": "Learn the platform on real work: taxonomy, transcripts, one small measurable fix end to end.", "probes": ["Which platform would be hardest for you?", "What would you need from the team?"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/intents-entities", "label": "Baseline: intents and entities", "why": "Platform terms side by side."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model, step 5: How the platforms differ", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}], "figs": [], "sdLinks": []}, "id": "q-you-haven-t-used-our-platform-how-would-you-get-productive"}]}], "ask": [], "ask3": [{"id": "client", "title": "For the client", "when": "The platform early if nobody has said; the rest at the end.", "why": "With the client and the platform unknown, the first answer reframes everything after it. The rest show you think about measurement and failure, not only building.", "how": ["Ask the platform question in the first minutes, plainly.", "At the end, one or two; listen fully, then one follow-up on what they said."], "items": [{"to": "Interviewer", "q": "Which platform is the assistant on today, and what sits around it: the LLMs, the backend, the analytics?", "loop": "Early, if it hasn't come up.", "why": "Lets you answer in their words for the rest of the call."}, {"to": "Interviewer", "q": "Which channels does it serve: voice, chat, messaging, or all of them?", "loop": "With the platform question.", "why": "Voice and chat change the design and the error profile."}, {"to": "Interviewer", "q": "Roughly how many intents are there, and who owns the taxonomy when a team wants a new one?", "loop": "At the end, first.", "why": "Scale and governance: where confused intents come from."}, {"to": "Interviewer", "q": "How do you measure success today: containment, resolution, CSAT?", "loop": "At the end.", "why": "Shows you know containment alone misleads."}, {"to": "Interviewer", "q": "What's the hardest failure the assistant has right now?", "loop": "At the end, if there's time.", "why": "You want the real problem; it's also what you'd work on first."}, {"to": "Interviewer", "q": "Who's on the team, and who would I work with day to day?", "loop": "Last.", "why": "Plain and useful: designers, NLU engineers, data people, or one person doing all of it."}]}, {"id": "recruiter", "title": "For the recruiter, afterwards", "when": "After the call, by message or phone.", "why": "Practical questions for the vendor, never the client.", "how": ["Rate and terms stay in chat; settle them with the recruiter."], "items": [{"to": "Recruiter", "q": "Who is the client, and which platform are they on?", "loop": "First, ideally before Friday.", "why": "Changes how you prepare."}, {"to": "Recruiter", "q": "How long is the engagement, and what are the next steps after this call?", "loop": "After the call.", "why": "Duration and process."}, {"to": "Recruiter", "q": "Rate and terms.", "loop": "With the recruiter only.", "why": "Your numbers are in chat."}]}], "traps": [], "tables": [], "admire": "", "kitaruLead": "", "figures": [], "mockHow": "Say 'run the Vanguard mock' in chat: Vanguard's engineers, scenario-led, 30 minutes.", "mocks": [], "planKicker": "Before Friday, 2 PM", "mechTitle": "", "designLink": null, "extra": "<b>Work in this order.<\/b> 1. Understand: the sessions in the tracker, <a href=\"../index.html#/w/wc25\" target=\"_blank\" rel=\"noopener\">starting with the map of NLP<\/a>, wc25 to wc30, then wc31 on Vanguard and financial services. 2. Design: the guide's <a href=\"../SYSTEM%20DESIGN.html#/designs/virtual-assistant\" target=\"_blank\" rel=\"noopener\">enterprise virtual assistant<\/a>, in six steps; it is set at a bank, close to Vanguard. 3. Refresh: Baseline's <a href=\"../BASELINE.html#/nlp\" target=\"_blank\" rel=\"noopener\">NLP and conversational AI<\/a> field, one topic at a time. 4. Say: the Prep tab, last, once every sentence is one you could explain. Your Mphasis technical round (28 September) is a light review: <a href=\"mphasis.html\" target=\"_blank\" rel=\"noopener\">its Prep tab<\/a> has the LLM fundamentals answers.", "emphasis": [], "own": null, "showUp": [["Lead with what you've built that matches.", "At alfred_ every inbound message goes through intent classification, then a decision layer, then callable tools, and every candidate action gets one of five verdicts. A production failure scanner reads real conversations and separates genuine failures from expected behaviour. MetaRAG used TF-IDF weighted embeddings: 82.5% precision against a 73.3% baseline."], ["Say the platforms plainly.", "You haven't shipped on Dialogflow CX, Cognigy, Lex or CLU. Say it once, then what carries over: the NLU underneath, the error analysis and the evals are the same work, and you know how each platform models intents, thresholds and fallbacks."], ["Answer a scenario with a method.", "What you'd check first, how you'd split the cause, the fix, and how you'd know it worked. 'Two intents are confused' starts at the confusion matrix and the actual utterances, not at the F1."], ["Numbers, exactly.", "5,000-plus active users at alfred_; per-user LLM cost down about 30%; notifications about 90 seconds to about 3. MetaRAG: 82.5% precision, 0.925 Hit@10, 25% hallucination reduction, p99 under 300 ms at 10K queries a day. MockFlow-AI: sub-400ms end to end."], ["Have the hybrid answer ready.", "A fast classifier for confident turns, an LLM for the uncertain ones and for out-of-scope, and deterministic code for anything that moves money or data. One Amazon paper measured that routing within 2% of the LLM's accuracy at half the latency."], ["Ask about their platform early.", "Vanguard's stack isn't confirmed. If nobody has said, ask in the first minutes: which platform the assistant runs on, and which channels. Then use their words: flows and pages for Dialogflow CX, topics for Copilot Studio, intents and slots for Lex."], ["Theory: the mechanism, then where you used it.", "Attention, embeddings, calibration: two sentences on how it works, one on where it showed up in your work. Then stop and let them go deeper."], ["Logistics: one line each.", "Rate, duration, location and start date: your answers are in chat. They are for the recruiter afterwards, not the client."]], "prepLead": "Say comes last. Each area is taught first in its session, and every question here links back to that session, its Baseline topic and the reading. Then your story out loud with the timer, and two drills: two intents confused, and attention.", "storyBlurb": "Your intro, why this role, the work closest to it, and logistics.", "sources": [{"label": "Similar posting: Conversational AI Developer, Galaxy i Technologies (Dice)", "url": "https://www.dice.com/job-detail/6d7bd820-388e-4d39-81e7-ed0e087eda91", "why": "Dialogflow CX, CCAI, BigQuery, Node.js, GCP; chatbots and voicebots, multi-turn with error handling, webhooks; creating intents and entities."}, {"label": "Similar posting: Google Cloud Conversational AI Developer, ASCII Group (Dice)", "url": "https://www.dice.com/job-detail/5e08da59-2148-4749-a3af-2f9ea6de0edd", "why": "The same Dialogflow CX and CCAI stack."}, {"label": "Similar posting: NICE CXone / Cognigy developer, United Technology (Dice)", "url": "https://www.dice.com/job-detail/e40592e9-8c84-4401-a025-29818721572b", "why": "Cognigy flows, voicebots and IVR, REST, production troubleshooting; NLU and intent recognition preferred."}, {"label": "Similar posting: Lead Conversational AI Developer, SGA (Dice)", "url": "https://www.dice.com/job-detail/73324714-ba9d-4272-8005-59ec7d82649c", "why": "Azure Bot Framework v4, C#/.NET, Azure OpenAI preferred."}, {"label": "Similar posting: Chatbot Developer, Triwave (Dice)", "url": "https://www.dice.com/job-detail/40145e8c-0dba-4647-8f94-b4d273073754", "why": "Bot Framework moving to Microsoft's agents stack; classical NLU combined with LLMs for routing."}, {"label": "Similar posting: Senior AI Engineer, Conversational and Agentic AI, Trigint (Dice)", "url": "https://www.dice.com/job-detail/e0fd510e-109e-4e54-965f-19db6101e5e3", "why": "AWS Bedrock and AgentCore, RAG, embeddings, MCP, multi-turn, Langfuse, Ragas; Lex or Connect nice to have."}, {"label": "Similar posting: Conversational AI Engineer, Eversana", "url": "https://zapply.jobs/jobs/63d1956f-79c2-48e5-ad45-9e1934e6ee9e/", "why": "Cognigy, NLU and intent modelling, production issue analysis; GenAI nice to have."}], "company": ["3 Dots IT Solutions is a small IT staffing and services vendor, founded in 2016, with an office in Durham, North Carolina. It places contract, contract-to-hire and direct-hire engineers across Java, .NET, Salesforce, DevOps, cloud and AI/ML, and lists TCS, Cognizant, IBM, Fujifilm and Panasonic among its clients and partners. It arranged this call; the interviewer works for the end client.", "The end client isn't named yet. The wording (virtual assistants, intent and entity modelling, error analysis) reads like an enterprise assistant on a classic NLU platform with LLMs added: Dialogflow CX most often in similar postings, or Cognigy, Microsoft's Bot Framework, CLU and Copilot Studio, or Amazon Lex. That is inference from similar postings, not fact. Ask the recruiter for the client and the platform before Friday."], "posting": {"lead": "Rama at Mphasis sent the two areas the interview will concentrate on (1 October), quoted: “Conversational AI: Build and enhance complex virtual assistants, including conversation design, intent/entity modeling, error analysis, and production improvements.” And “Deep NLP & LLM: Strong expertise in NLP, text classification, embeddings, LLM fundamentals, and Transformer architecture.” The lists below come from those two areas and from similar postings, not from Vanguard.", "facts": [["Client", "Vanguard: the team you would join"], ["Arranged by", "Mphasis (Rama sent the invite and the two areas)"], ["When", "Friday 2 October, 2:00 PM"], ["Platform", "Not confirmed: ask early in the call"]], "does": ["Build and extend virtual assistants for chat and voice: multi-turn flows, prompts, reprompts and error handling.", "Model intents and entities: the taxonomy, training phrases, entity types, slots and confidence thresholds.", "Write webhooks and fulfillment that connect the assistant to backend systems (from similar postings).", "Analyse production transcripts: misclassified intents, fallbacks and escalations, fixed in batches.", "Improve the assistant from analytics: containment, no-match and escalation rates, A/B tests of flows.", "Add LLMs where they help: generative fallback, retrieval for FAQs, routing for uncertain turns."], "wants": ["Strong NLP: text classification, embeddings, LLM fundamentals and the Transformer.", "Conversation design for chat and voice.", "An enterprise NLU platform: Dialogflow CX and CCAI most often in similar postings, or Cognigy, Azure Bot Framework and CLU, Amazon Lex.", "Production troubleshooting and error analysis on real conversations.", "Generative AI with guardrails: RAG, prompting, evaluation.", "APIs and integrations: REST, Node.js or Python, a cloud platform (from similar postings)."]}, "rounds": []}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; o.rev = o.rev || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }
    var sm = el("summary", "", '<span class="qt">' + inl(title) + "</span>" + (meta ? '<span class="qm">' + meta + "</span>" : ""));
    d.appendChild(sm); d.appendChild(body);
    return d;
  }
  function bulk(host) {
    var b = el("div", "bulk");
    var o = el("button", "", "Open all"), c = el("button", "", "Close all");
    o.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = true; }); });
    c.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = false; }); });
    b.appendChild(o); b.appendChild(c);
    host.appendChild(b);
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });
    (s.study || []).forEach(function (_, i) { k.push(s.id + ":s" + i); });
    return k;
  }
  function isDone(t, s) { return !!t.done[s.id]; }
  function link(tab, anchor) { return "#/" + tab + (anchor ? "/" + anchor : ""); }
  /* A drill's reference is either a route already or an anchor on the prep tab. */
  function prepRef(r) { return r.indexOf("#/") === 0 ? r : link("prep", r.replace(/^#/, "")); }

  /* ---------------------------------------------------------------- tabs */
  var TABS = [
    { id: "overview", label: "Overview", show: function () { return true; } },
    { id: "prep", label: "Prep", show: function () { return LOOP.scripts.length || LOOP.drills.length || LOOP.qa.length || LOOP.ask.length || (LOOP.ask3 || []).length; } },
    { id: "rounds", label: "Rounds", show: function () { return (LOOP.rounds || []).length; } },
    { id: "design", label: "Design", show: function () { return LOOP.tables.length || LOOP.figures.length; } },
    { id: "own", label: (LOOP.own && LOOP.own.tab) || "Yours", show: function () { return !!LOOP.own; } },
    { id: "sessions", label: "Sessions", show: function () { return LOOP.sessions.length; } },
    { id: "mocks", label: "Mocks", show: function () { return !!LOOP.mockHow; } }
  ].filter(function (t) { return t.show(); });
  var main = document.getElementById("main");
  var side = document.getElementById("side");
  var nav = [];            /* side links for the current tab: [anchor, label, sub] */

  function heading(host, id, kicker, title, sub) {
    var s = el("section", "block"); s.id = id;
    if (title) { s.appendChild(el("h2", "", esc(title))); }
    if (kicker) { s.appendChild(el("p", "hsub", esc(kicker))); }
    host.appendChild(s);
    nav.push([id, title || kicker, !!sub]);
    return s;
  }

  /* ---------------------------------------------------------------- overview
     The call, the company, the role from its posting, how to show up, how to prepare. */
  function tabOverview(host) {
    var s = el("section", "block"); s.id = "brief";
    s.appendChild(el("h1", "", esc(LOOP.title)));
    s.appendChild(el("p", "hsub", esc(LOOP.subtitle)));
    s.appendChild(el("p", "lead", esc(LOOP.format)));
    var P = LOOP.posting;
    var dl = el("dl", "facts");
    dl.innerHTML = "<dt>When</dt><dd>" + esc(LOOP.when) + "</dd><dt>Who</dt><dd>" + esc(LOOP.who) + "</dd>" +
      (P && P.url ? '<dt>Posting</dt><dd><a href="' + esc(P.url) + '" target="_blank" rel="noopener">' + esc(P.label || "The job description") + "</a></dd>" : "");
    s.appendChild(dl);
    host.appendChild(s);
    nav.push(["brief", "The call"]);

    if (LOOP.company && LOOP.company.length) {
      var c = heading(host, "company", "", "The company");
      LOOP.company.forEach(function (p) { c.appendChild(el("p", "lead", inl(p))); });
    }
    if (P) {
      var r = heading(host, "role", "", "The role");
      if (P.lead) { r.appendChild(el("p", "lead", inl(P.lead))); }
      if (P.facts && P.facts.length) {
        var fd = el("dl", "facts wide");
        P.facts.forEach(function (f) { fd.appendChild(el("dt", "", esc(f[0]))); fd.appendChild(el("dd", "", inl(f[1]))); });
        r.appendChild(fd);
      }
      var cols = el("div", "role-cols");
      [["What you would do", P.does], ["What they look for", P.wants]].forEach(function (k) {
        if (!k[1] || !k[1].length) { return; }
        var box = el("div");
        box.appendChild(el("h3", "", esc(k[0])));
        panelList(k[1]).forEach(function (u) { box.appendChild(u); });
        cols.appendChild(box);
      });
      r.appendChild(cols);
      if (P.url) { r.appendChild(el("p", "lead", '<a href="' + esc(P.url) + '" target="_blank" rel="noopener">Read the full posting</a>' + (P.checked ? ", checked " + esc(P.checked) + "." : "."))); }
    }
    if (LOOP.showUp && LOOP.showUp.length) {
      var u = heading(host, "show-up", "", "How to show up");
      var ol = el("ol", "showup");
      LOOP.showUp.forEach(function (x) { ol.appendChild(el("li", "", "<b>" + inl(x[0]) + "</b> " + inl(x[1]))); });
      u.appendChild(ol);
    }
    var p = heading(host, "plan", "", "How to prepare");
    if (LOOP.bar) { p.appendChild(el("p", "bar", "<b>The bar.</b> " + inl(LOOP.bar))); }
    if (LOOP.extra) { p.appendChild(el("div", "lead", LOOP.extra)); }
    if (LOOP.sessions.length) {
      var t = tracker(), days = {}, order = [];
      LOOP.sessions.forEach(function (x) {
        if (!days[x.day]) { days[x.day] = []; order.push(x.day); }
        days[x.day].push(x);
      });
      var wrap = el("div", "days");
      order.forEach(function (d) {
        var box = el("div", "day");
        box.appendChild(el("h3", "", esc(d)));
        days[d].forEach(function (x) {
          var a = el("a", "srow" + (isDone(t, x) ? " done" : ""));
          a.href = link("sessions", x.id);
          a.innerHTML = '<span class="dot"></span><span><span class="nm">' + esc(x.name) +
            '</span><span class="bl">' + esc(x.blurb.replace(/^(Friday|Saturday|Sunday)[^.]*\.\s*/, "")) + '</span></span><span class="hrs">' + esc(x.len) + "</span>";
          box.appendChild(a);
        });
        wrap.appendChild(box);
      });
      p.appendChild(wrap);
    }
    var go = el("div", "acts");
    TABS.filter(function (x) { return x.id !== "overview"; }).forEach(function (x) {
      var a = el("a", "btn", esc(x.label)); a.href = link(x.id); go.appendChild(a);
    });
    p.appendChild(go);
  }

  /* ---------------------------------------------------------------- prep: the question bank
     Sections in order: your intro and story, each bank of questions, logistics, practising
     aloud, and the questions you ask. A question opens in place, one at a time: how to
     understand it on the left, what to say on the dark sheet. */
  function scriptItem(x) {
    return { id: "say-" + x.id, q: x.title, short: x.short || x.title, tests: x.when, a: x.say, land: x.land, never: x.never, notes: x.notes,
      probes: x.probes, swaps: x.swaps, learn: x.figs ? { figs: x.figs } : null,
