. Ask what platform and models the team uses today.", "sources": [{"label": "Finovate: Mphasis forges strategic partnership with Kore.ai", "url": "https://finovate.com/mphasis-forges-strategic-partnership-with-conversational-ai-platform-kore-ai/", "why": "What the Mphasis and Kore.ai partnership offers and Kore.ai's claimed scale."}, {"label": "Mphasis: Contact center transformation", "url": "https://www.mphasis.com/home/mphasis-ai-partnership/contact-center-transformation.html", "why": "Appeared in search; Mphasis's own contact-centre offering page."}, {"label": "Mphasis: Optimizing conversational and generative AI for customer experience", "url": "https://www.mphasis.com/home/thought-leadership/blog/optimizing-conversational-and-generative-ai-for-seamless-customer-experience.html", "why": "Mphasis's stated techniques, metrics and guardrails (marketing, read critically)."}]}]}, {"id": "rs-handbook", "title": "From your handbook: the banking copilot design", "blurb": "Your own worked design, folded in: the boundaries, contracts and patterns to draw if they ask you to design one.", "topics": [{"id": "h-thesis", "title": "The thesis: a deterministic core with a language interface", "brief": "Use models where language ambiguity is the hard part, deterministic systems where correctness is. The LLM interprets, retrieves, summarises and proposes; it is never the source of truth for money, positions, identity, permissions, policy or execution state.", "practice": ["Three modes with three risk boundaries: insight is read-only and cites; recommendation is simulation with no action; action needs policy, auth, explicit confirmation and idempotent execution.", "Out of scope on purpose: autonomous trading, open-ended advice, KYC changes, direct database writes, an LLM deciding policy. A tight capability envelope is a safety and a scaling feature.", "The flow tagged by who decides: normalise (code), intent and entity route (model and code), retrieve (code and search), plan or answer (LLM), policy and tool call (code), execute and verify (code and API), grounded response (LLM and code)."], "say": ["The way I think about it: the model is good at language and bad at being a ledger, so I use it to understand and draft, and deterministic services to decide and act."], "deep": "The hardest invariant is that generated text never becomes financial truth: model output is a proposal until a deterministic service validates and executes it.\n\nThe hardest correctness problem is partial side effects: 'I submitted the transfer' must mean exactly one transfer, even after a timeout, a disconnect or a retry.", "sources": []}, {"id": "h-two-contracts", "title": "Two contracts and three side-effect classes", "brief": "The user talks to a conversation API; the model talks to a bounded tool API. Every tool declares its side-effect class, and the class sets the policy: read-only runs after auth, reversible may run, consequential needs explicit confirmation, a policy check, idempotency and an audit trail.", "practice": ["Conversation API: POST a message, get a run and a stream of events; long work returns 202 and continues asynchronously.", "Tool API: get_accounts, get_transactions, get_positions, search_documents, simulate_trade, create_transfer_intent, confirm_and_execute, get_action_status.", "Keeping them separate lets you change models without changing financial APIs."], "say": ["I'd make every tool declare whether it reads, changes something reversible, or moves money, and let that class decide what confirmation it needs, rather than the prompt."], "deep": "Execution nouns are new in agentic systems: Run, Step, ToolCall, Action, Trace, DialogueState. They are what make retries, observability, evaluation and partial progress reasonable to talk about.", "sources": []}, {"id": "h-durable-intent", "title": "Durable intent: write the action before the side effect", "brief": "Validate the structured request, write the action with an idempotency key and status READY, commit, then call the provider with that key, store its reference and status, and on a timeout query status before retrying. The final reply reads the stored status, not the model's claim.", "practice": ["Options compared: client idempotency only, a server-side action table plus idempotency, or a distributed transaction. Pick: the server-side action record, idempotency key, provider request id and an explicit status machine.", "Retry read-only calls freely within budget; retry side effects only through the action record.", "Compound requests ('move 500 to brokerage, then buy 200 of VTI') become two actions, the second gated on the first's observed state."], "say": ["'The request was probably sent' is not an acceptable financial state, so I'd persist the intent first and make every retry check the status before it acts."], "deep": "The trade-off is more state and recovery logic, which buys safe retries and an auditable record of every action and its policy result.", "sources": []}, {"id": "h-hybrid-retrieval", "title": "Hybrid retrieval, rerank, then access and effective date in code", "brief": "BM25 catches exact tickers, codes and policy wording; dense search catches paraphrase. Fuse both, rerank a small candidate set with a cross-encoder, then filter by access control and effective date deterministically: a perfect match to a retired policy is still wrong.", "practice": ["Query rewrite normalises products, ids and dates, and must never widen the customer's authorisation scope.", "Retrieve about 50 candidates cheaply, rerank to about 10: recall and final ranking are different objectives.", "BM25 saturates term frequency and normalises for document length, so twenty mentions are not twenty times as useful as two.", "Measure with Recall@K, MRR or nDCG, plus source validity and ACL and effective-date correctness."], "say": ["Financial text has two signals, exact terms and meaning, so I'd retrieve with both, rerank a short list, and leave access and version filtering to code."], "deep": "Why not embeddings only: dense similarity blurs identifiers, account types and regulation codes. Why not BM25 only: customers paraphrase ('my card payment bounced' and 'purchase declined').\n\nCost: another index and some latency, for robustness on mixed financial language.", "sources": []}, {"id": "h-state-routing", "title": "Routing and dialogue state: a calibrated fast path, compact state", "brief": "A cheap calibrated classifier takes the high-volume known intents and falls back to an LLM on low confidence or compound requests. Keep compact dialogue state with real ids (active account, pending action, auth state) plus a short transcript window, rather than replaying the whole conversation.", "practice": ["Monitor the router with a confusion matrix, the top-two margin and calibration error; class drift and calibration decay are its failure modes.", "References like 'that one' or 'the ETF I mentioned' resolve to ids held in state, not to model memory.", "Cache stable policy chunks, instrument metadata and prompts; never cache balances or execution status without a freshness contract."], "say": ["I'd keep the facts that must survive a retry in state with real ids, and only give the model the slice of transcript it needs."], "deep": "Two routing paths cost monitoring, and buy lower cost and predictable latency. State management becomes engineering work, and it scales better than stuffing the conversation into context.", "sources": []}, {"id": "h-representations", "title": "The representation ladder, tokenisers and fine-tuned embeddings", "brief": "Each representation earns its place: bag of words and TF-IDF are cheap and hard to beat on narrow tasks, BM25 for retrieval, static embeddings give one vector per word, contextual ones change with the sentence, sentence embeddings serve retrieval and clustering. Embeddings are indexes, not ledgers.", "practice": ["Tokenisers: BPE merges the most frequent pairs; WordPiece merges by likelihood gain; SentencePiece is a framework that trains BPE or unigram tokenisers on raw text.", "Fine-tune sentence embeddings with positive pairs and hard negatives under a contrastive or ranking loss, and deploy only if held-out retrieval improves.", "Fine-tune only with a stable task, good labels and a measured gap over the generic baseline."], "say": ["Generic embeddings know general similarity; a bank has its own idea of 'same enough', and hard negatives are how you teach it."], "deep": "'WordPiece is BPE with likelihood' is too compressed to say aloud: they are related subword methods with different training objectives, and SentencePiece is the tooling layer.", "sources": []}, {"id": "h-eval-scale", "title": "Eval per layer, and what actually scales", "brief": "Measure each layer on its own terms: routing, entities (span F1 plus resolution accuracy), retrieval, grounding, agent task success and cost, and for actions the duplicate rate and confirmation compliance. At scale the hard number is tokens times concurrent runs times tool latency, not HTTP requests per second.", "practice": ["Sample every escalation, abandonment, low-confidence route, negative feedback, failed tool call and long run, plus a random baseline; rank review by volume times cost times severity.", "Release loop: trace, label, golden set, experiment, gate on quality, cost and safety, shadow, versioned release or rollback.", "Downstream tool APIs are often the real bottleneck: timeouts, bounded parallelism, async actions, backpressure."], "say": ["I'd review whole conversations, because a routing miss, a retrieval miss and a policy block can look the same from one utterance."], "deep": "Transformer whys worth a sentence each: the square root of d_k keeps the softmax out of saturation; heads learn different subspaces; attention is quadratic in length while the KV cache grows linearly; FlashAttention cuts memory movement without changing the result; RoPE rotates Q and K to encode relative position; SFT teaches the behaviour, then preference tuning (DPO, without a separate reward model) refines it.", "sources": []}]}]}}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; o.rev = o.rev || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");
    }).join("");
  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */
  function transcript(list, who, note) {
    var box = el("div", "transcript");
    if (who) { box.appendChild(el("div", "who", esc(who))); }
    list.forEach(function (p) {
      var beat = el("div", "beat");
      var parts = p.split(/(?<=[.?!])\s+(?=[A-Z"'(\u2018\u201c*])/);
      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });
      box.appendChild(beat);
    });
    if (note) { box.appendChild(el("div", "note", note)); }
    return box;
  }
  function item(id, title, meta, body) {
    var d = el("details", "item"); if (id) { d.id = id; }
    var sm = el("summary", "", '<span class="qt">' + inl(title) + "</span>" + (meta ? '<span class="qm">' + meta + "</span>" : ""));
    d.appendChild(sm); d.appendChild(body);
    return d;
  }
  function bulk(host) {
    var b = el("div", "bulk");
    var o = el("button", "", "Open all"), c = el("button", "", "Close all");
    o.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = true; }); });
    c.addEventListener("click", function () { host.querySelectorAll("details.item").forEach(function (d) { d.open = false; }); });
    b.appendChild(o); b.appendChild(c);
    host.appendChild(b);
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });
    (s.study || []).forEach(function (_, i) { k.push(s.id + ":s" + i); });
    return k;
  }
  function isDone(t, s) { return !!t.done[s.id]; }
  function link(tab, anchor) { return "#/" + tab + (anchor ? "/" + anchor : ""); }
  /* A drill's reference is either a route already or an anchor on the prep tab. */
  function prepRef(r) { return r.indexOf("#/") === 0 ? r : link("prep", r.replace(/^#/, "")); }

  /* ---------------------------------------------------------------- tabs */
  var TABS = [
    { id: "overview", label: "Overview", show: function () { return true; } },
    { id: "prep", label: "Prep", show: function () { return LOOP.scripts.length || LOOP.drills.length || LOOP.qa.length || LOOP.ask.length || (LOOP.ask3 || []).length; } },
    { id: "rounds", label: "Rounds", show: function () { return (LOOP.rounds || []).length; } },
    { id: "research", label: "Research", show: function () { return !!LOOP.research; } },
    { id: "design", label: "Design", show: function () { return LOOP.tables.length || LOOP.figures.length; } },
    { id: "own", label: (LOOP.own && LOOP.own.tab) || "Yours", show: function () { return !!LOOP.own; } },
    { id: "sessions", label: "Sessions", show: function () { return LOOP.sessions.length; } },
    { id: "mocks", label: "Mocks", show: function () { return !!LOOP.mockHow; } }
  ].filter(function (t) { return t.show(); });
  var main = document.getElementById("main");
  var side = document.getElementById("side");
  var nav = [];            /* side links for the current tab: [anchor, label, sub] */

  function heading(host, id, kicker, title, sub) {
    var s = el("section", "block"); s.id = id;
    if (title) { s.appendChild(el("h2", "", esc(title))); }
    if (kicker) { s.appendChild(el("p", "hsub", esc(kicker))); }
    host.appendChild(s);
    nav.push([id, title || kicker, !!sub]);
    return s;
  }

  /* ---------------------------------------------------------------- overview
     The call, the company, the role from its posting, how to show up, how to prepare. */
  function tabOverview(host) {
    var s = el("section", "block"); s.id = "brief";
    s.appendChild(el("h1", "", esc(LOOP.title)));
    s.appendChild(el("p", "hsub", esc(LOOP.subtitle)));
    s.appendChild(el("p", "lead", esc(LOOP.format)));
    var P = LOOP.posting;
    var dl = el("dl", "facts");
    dl.innerHTML = "<dt>When</dt><dd>" + esc(LOOP.when) + "</dd><dt>Who</dt><dd>" + esc(LOOP.who) + "</dd>" +
      (P && P.url ? '<dt>Posting</dt><dd><a href="' + esc(P.url) + '" target="_blank" rel="noopener">' + esc(P.label || "The job description") + "</a></dd>" : "");
    s.appendChild(dl);
    host.appendChild(s);
    nav.push(["brief", "The call"]);

    if (LOOP.company && LOOP.company.length) {
      var c = heading(host, "company", "", "The company");
      LOOP.company.forEach(function (p) { c.appendChild(el("p", "lead", inl(p))); });
    }
    if (P) {
      var r = heading(host, "role", "", "The role");
      if (P.lead) { r.appendChild(el("p", "lead", inl(P.lead))); }
      if (P.facts && P.facts.length) {
        var fd = el("dl", "facts wide");
        P.facts.forEach(function (f) { fd.appendChild(el("dt", "", esc(f[0]))); fd.appendChild(el("dd", "", inl(f[1]))); });
        r.appendChild(fd);
      }
      var cols = el("div", "role-cols");
      [["What you would do", P.does], ["What they look for", P.wants]].forEach(function (k) {
        if (!k[1] || !k[1].length) { return; }
        var box = el("div");
        box.appendChild(el("h3", "", esc(k[0])));
        panelList(k[1]).forEach(function (u) { box.appendChild(u); });
        cols.appendChild(box);
      });
      r.appendChild(cols);
      if (P.url) { r.appendChild(el("p", "lead", '<a href="' + esc(P.url) + '" target="_blank" rel="noopener">Read the full posting</a>' + (P.checked ? ", checked " + esc(P.checked) + "." : "."))); }
    }
    if (LOOP.showUp && LOOP.showUp.length) {
      var u = heading(host, "show-up", "", "How to show up");
      var ol = el("ol", "showup");
      LOOP.showUp.forEach(function (x) { ol.appendChild(el("li", "", "<b>" + inl(x[0]) + "</b> " + inl(x[1]))); });
      u.appendChild(ol);
    }
    var p = heading(host, "plan", "", "How to prepare");
    if (LOOP.bar) { p.appendChild(el("p", "bar", "<b>The bar.</b> " + inl(LOOP.bar))); }
    if (LOOP.extra) { p.appendChild(el("div", "lead", LOOP.extra)); }
    if (LOOP.sessions.length) {
      var t = tracker(), days = {}, order = [];
      LOOP.sessions.forEach(function (x) {
        if (!days[x.day]) { days[x.day] = []; order.push(x.day); }
        days[x.day].push(x);
      });
      var wrap = el("div", "days");
      order.forEach(function (d) {
        var box = el("div", "day");
        box.appendChild(el("h3", "", esc(d)));
        days[d].forEach(function (x) {
          var a = el("a", "srow" + (isDone(t, x) ? " done" : ""));
          a.href = link("sessions", x.id);
          a.innerHTML = '<span class="dot"></span><span><span class="nm">' + esc(x.name) +
            '</span><span class="bl">' + esc(x.blurb.replace(/^(Friday|Saturday|Sunday)[^.]*\.\s*/, "")) + '</span></span><span class="hrs">' + esc(x.len) + "</span>";
          box.appendChild(a);
        });
        wrap.appendChild(box);
      });
      p.appendChild(wrap);
    }
    var go = el("div", "acts");
    TABS.filter(function (x) { return x.id !== "overview"; }).forEach(function (x) {
      var a = el("a", "btn", esc(x.label)); a.href = link(x.id); go.appendChild(a);
    });
    p.appendChild(go);
  }

  /* ---------------------------------------------------------------- prep: the question bank
     Sections in order: your intro and story, each bank of questions, logistics, practising
     aloud, and the questions you ask. A question opens in place, one at a time: how to
     understand it on the left, what to say on the dark sheet. */
  function scriptItem(x) {
    return { id: "say-" + x.id, q: x.title, short: x.short || x.title, tests: x.when, a: x.say, land: x.land, never: x.never, notes: x.notes,
      probes: x.probes, swaps: x.swaps, learn: x.figs ? { figs: x.figs } : null,
      meta: x.length ? x.length.charAt(0).toUpperCase() + x.length.slice(1) + "." : "",
      drill: LOOP.drills.some(function (d) { return d.id === x.id; }) ? x.id : null };
  }
  function prepBanks() {
    var banks = [], story = LOOP.scripts.filter(function (x) { return x.id !== "logistics"; });
    if (story.length) { banks.push({ id: "story", title: "Your intro and story", blurb: LOOP.storyBlurb || "", items: story.map(scriptItem) }); }
    LOOP.qa.forEach(function (g, gi) { banks.push({ id: "qa-" + gi, title: g.group, blurb: g.blurb || "", items: g.items }); });
    var lg = LOOP.scripts.filter(function (x) { return x.id === "logistics"; });
    if (lg.length) { banks.push({ id: "logistics", title: "Logistics", blurb: "Your answers stay in chat; how to handle each is here.", items: lg.map(scriptItem) }); }
    return banks;
  }
  function prepBody(x) {
    var c = el("div", "cv-cols pq-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "pq-work");
    c.appendChild(left); c.appendChild(right);
    if (x.tests) { left.appendChild(el("p", "pq-tests", "<b>They are testing:</b> " + inl(x.tests))); }
    panelSection(left, "What they may probe", panelList(x.probes));
    (x.parts || []).forEach(function (p) {
      left.appendChild(el("h4", "cv-part", inl(p.title)));
      if (p.lead) { left.appendChild(el("p", "cv-part-lead", inl(p.lead))); }
      panelList(p.items).forEach(function (u) { left.appendChild(u); });
      if (p.code) { var pre = el("pre", "cv-code"); pre.appendChild(el("code", "", esc(p.code))); left.appendChild(pre); }
      if (p.after) { panelList(p.after).forEach(function (u) { left.appendChild(u); }); }
    });
    panelSection(left, "The nuance", panelList(x.notes));
    panelSection(left, "Avoid", panelList(x.never, "mk-bad"));
    learn(left, x.learn || {});
    var acts = el("p", "ex-links");
    var rv = el("button", "linkish");
    function label() { rv.innerHTML = isRevised(x.id) ? "Revised. Undo" : "Mark as revised"; }
    label();
    rv.addEventListener("click", function () {
      setRevised(x.id, !isRevised(x.id)); label();
      var d = document.getElementById(x.id);
      if (d) { d.classList.toggle("rev", isRevised(x.id)); }
    });
    acts.appendChild(rv);
    if (x.drill) { acts.appendChild(el("span", "sep")); acts.appendChild(el("a", "", "Practise it aloud, timed")).href = link("prep", "drill-" + x.drill); }
    left.appendChild(acts);
    if (x.land) { right.appendChild(el("p", "pq-land", "<b>Land on this.</b> " + inl(x.land))); }
    if (x.a && x.a.length) { right.appendChild(transcript(x.a, "What you would say", "")); }
    if (x.swaps && x.swaps.length) {
      right.appendChild(el("div", "lab", "Lines you can swap in"));
      x.swaps.forEach(function (w) {
        right.appendChild(el("div", "swap", '<span class="sw-when">' + inl(w.when) + '</span><span class="sw-line">' + emph(inl(w.line)) + "</span>"));
      });
    }
    if (x.meta) { right.appendChild(el("p", "cv-meta", esc(x.meta))); }
    if (!right.children.length) { right.remove(); c.classList.add("one"); }
    if (left.querySelector(".cv-code")) { c.classList.add("has-code"); }
    return c;
  }
  /* After a question opens (and the one above closes), scroll to it so the reader keeps their place. */
  function glideTo(node) {
    var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    requestAnimationFrame(function () { node.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" }); });
  }
  /* Each Prep section is a card in its own colour, from the six category tokens. */
  function card(sec, i, n) {
    sec.classList.add("bank-sec");
    sec.style.setProperty("--sec", "var(--cat-" + (i % 6 + 1) + ")");
    var h = sec.querySelector("h2");
    if (h && n) { h.appendChild(el("span", "bank-n", n + (n === 1 ? " question" : " questions"))); }
    return sec;
  }
  function prepItem(x) {
    var d = el("details", "item pq" + (isRevised(x.id) ? " rev" : "")); d.id = x.id;
    d.setAttribute("name", "prep");   /* native: opening one closes the others */
    d.appendChild(el("summary", "", '<span class="qt">' + inl(x.q) + "</span>" + (x.tests || x.meta ? '<span class="qm">' + inl(x.meta || x.tests) + "</span>" : "")));
    var drawn = false;
    d.addEventListener("toggle", function () {
      if (!d.open) { return; }
      if (!drawn) { drawn = true; d.appendChild(prepBody(x)); }
      glideTo(d);
    });
    return d;
  }
  function tabPrep(host) {
    var banks = prepBanks();
    var s = heading(host, "prep", "", "Prep");
    if (LOOP.prepLead) { s.appendChild(el("p", "lead", inl(LOOP.prepLead))); }
    var f = el("input", "filter"); f.type = "search"; f.placeholder = "Search every question and answer";
    s.appendChild(f);
    var all = [];
    banks.forEach(function (b) {
      var sec = card(heading(host, b.id, b.blurb ? b.blurb.replace(/<[^>]+>/g, "") : "", b.title), banks.indexOf(b), b.items.length);
      b.items.forEach(function (x) {
        var d = prepItem(x);
        all.push({ d: d, sec: sec, text: (x.q + " " + (x.a || []).join(" ") + " " + (x.notes || []).join(" ") + " " + (x.probes || []).join(" ") + " " +
          (x.swaps || []).map(function (w) { return w.when + " " + w.line; }).join(" ") + " " +
          (x.parts || []).map(function (p) { return p.title + " " + (p.items || []).join(" "); }).join(" ")).toLowerCase() });
        sec.appendChild(d);
      });
    });
    f.addEventListener("input", function () {
      var v = f.value.trim().toLowerCase(), shown = {};
      all.forEach(function (r) { var hit = !v || r.text.indexOf(v) >= 0; r.d.hidden = !hit; if (hit) { shown[r.sec.id] = true; } });
      all.forEach(function (r) { r.sec.hidden = !shown[r.sec.id]; });
    });
    if (LOOP.drills.length) { drills(card(heading(host, "practise", LOOP.drills.length + " timed questions, out loud", "Practise aloud"), banks.length, 0)); }
    var three = LOOP.ask3 || [];
    if (three.length || LOOP.ask.length) {
      var a3 = card(heading(host, "ask", "", "Questions to ask"), banks.length + 1, 0);
      three.forEach(function (k) {
        var sec = el("div", "c3"); sec.id = "ask-" + k.id;
        sec.appendChild(el("h3", "c3-t", esc(k.title) + '<span class="c3-w">' + inl(k.when) + "</span>"));

  /* What an item rests on: its figures, what to read (with minutes), and where it sits in

  /* A step that asks you to say, explain or answer something gets a box: typed or dictated
     (Win+H), saved in the tracker's own answers so the tracker shows it too. Optional. */
  var SAYS = /out loud|say|saying|record yourself|explain|in your own words|answer the|talk through|walk through/i;
  function mineBox(key, prompt) {
    var box = el("div", "mine"), id = "mine-" + key.replace(/[^a-z0-9]/gi, "-");
    var lb = el("label", "", inl(prompt)); lb.setAttribute("for", id);
    var ta = el("textarea"); ta.id = id;
    ta.placeholder = "Your answer. Say it, then type or dictate it here (Win+H). Optional; saved as you go.";
    var t0 = tracker(), rec = (t0.answers || {})[key];
    ta.value = rec && rec.text ? rec.text : "";
    var st = el("div", "mine-st", rec && rec.at ? "Saved " + esc(rec.at) : "");
    var timer = null;
    ta.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(function () {
        var t = tracker(), v = ta.value.trim();
        t.answers = t.answers || {};
        if (v) { t.answers[key] = { text: v, at: stamp() }; st.textContent = "Saved " + t.answers[key].at; }
        else { delete t.answers[key]; st.textContent = ""; }
        writeJSON(TRACKER, t);
      }, 500);
    });
    box.appendChild(lb); box.appendChild(ta); box.appendChild(st);
    return box;

  function sayToggle(label, node) {
    var d = el("details", "say");
    d.appendChild(el("summary", "", esc(label)));

    return d;

  /* A step opens to what it is, what to read, where it sits in the system design guide
     and the figure that draws it. What you would say stays shut until you have tried. */
  /* The question the answer box answers: the step's done-when, else its title, explained. */
  function promptOf(it) {
    var p = String(it.out || "Explain in your own words. " + it.t).replace(/[.\s]+$/, "");
    return (/^[a-z]+\b/.test(p) ? p.charAt(0).toUpperCase() + p.slice(1) : p) + (/[?!]$/.test(p) ? "" : QWORD.test(p) ? "?" : ".");
  }
  var QWORD = /^(how|what|why|when|which|who|where|do|does|did|can|could|is|are|should|would|will)\b/i;
  /* Key points: the term before the first colon in bold. */
  function ptsList(pts) {
    var ul = el("ul", "pts");
    pts.forEach(function (q) {
      var m = /^([^:]{2,60}):\s+([\s\S]+)$/.exec(String(q));
      ul.appendChild(el("li", "", m ? "<b>" + inl(m[1]) + "</b> " + inl(m[2]) : inl(q)));
    });
    return ul;
  }
  function stepNode(key, it, isStudy) {
    var t = tracker();
    var row = el("details", "step");
    row.setAttribute("name", "step");
    row.addEventListener("toggle", function () { if (row.open) { glideTo(row); } });
    var sm = el("summary");
    var tick = el("button", "tick" + (t.steps[key] ? " on" : ""), t.steps[key] ? "&#10003;" : "");
    tick.setAttribute("aria-label", "Mark done: " + it.t);
    tick.addEventListener("click", function (e) {
      e.preventDefault(); e.stopPropagation();
      var tt = tracker();
      if (tt.steps[key]) { delete tt.steps[key]; delete tt.steps[key + ":at"]; }
      else { tt.steps[key] = true; tt.steps[key + ":at"] = stamp(); }
      writeJSON(TRACKER, tt);
      tick.classList.toggle("on", !!tt.steps[key]);
      tick.innerHTML = tt.steps[key] ? "&#10003;" : "";
      progress();
    });
    sm.appendChild(tick);
    sm.appendChild(el("span", "st", inl(it.t)));
    var mins = it.m || (it.do || []).reduce(function (a, d) { return a + (d.m || 0); }, 0);
    sm.appendChild(el("span", "sm", mins ? mins + " min" : ""));
    row.appendChild(sm);

    var body = el("div", "cv-cols pq-cols sbody2"), left = el("div", "cv-col cv-said"), work = el("div", "pq-work");
    body.appendChild(left); body.appendChild(work);
    if (!isStudy && it.d) { left.appendChild(el("p", "d", inl(it.d))); }
    if (it.pts && it.pts.length) { left.appendChild(ptsList(it.pts)); }
    learn(left, { figs: it.figs || [] });

    var pre = [];
    if (isStudy && it.do) {
      it.do.forEach(function (d) {
        pre.push({ url: d.url, label: d.a, m: d.m, why: d.where });
      });
    }
    if (!isStudy && (it.where || it.url)) { pre.push(it.url ? { url: it.url, label: it.where || it.url } : { book: it.where }); }
    learn(left, { figs: [], read: pre.concat(isStudy ? (it.res || []) : (it.links || []), it.read || []), sdLinks: it.sdLinks });
    var say = isStudy ? it.say : it.ans;
    if (say || it.out || SAYS.test(it.t || "")) { work.appendChild(mineBox(key, promptOf(it))); }
    if (say) { work.appendChild(sayToggle(isStudy ? "The idea, in the words you would use" : "What you would say", transcript(Array.isArray(say) ? say : [say], "", ""))); }
    if (!work.children.length) { work.remove(); body.classList.add("one"); }
    row.appendChild(body);
    return row;
  }

  function toggleSession(x) {
    var t = tracker();
    if (t.done[x.id]) {
      delete t.done[x.id];
    } else {
      stepKeys(x).forEach(function (k) { if (!t.steps[k]) { t.steps[k] = true; t.steps[k + ":at"] = stamp(); } });
      if (x.hasTrackerQuiz && !(t.quiz[x.id] && t.quiz[x.id].passed)) {
        t.quiz[x.id] = { score: 0, passed: true, at: stamp(), missed: [], via: "interview page" };
      }

  /* ---------------------------------------------------------------- mocks */
  /* A mock reads in two parts: the read (how it went, what landed, what to fix first),
     then the conversation, one exchange at a time. Each exchange shows who asked what and
     what you said, with a verdict; it opens to why, how to approach it, and the answer to
     say, behind the same toggle the Prep tab uses. */
  var VERDICT = { landed: "Landed", partly: "Partly", missed: "Missed", gap: "Gap: you did not have an answer" };
  function tabMocks(host) {
    var s = heading(host, "mock", "Run in chat", "Mock interviews");
    s.appendChild(el("p", "lead", inl(LOOP.mockHow)));
    if (!LOOP.mocks.length) {
      s.appendChild(el("p", "when", "None yet. After a mock in chat, its read and its exchanges appear here. The latest two are kept."));
    }
    LOOP.mocks.slice(-2).reverse().forEach(function (m, mi) { drawMock(host, m, mi); });
  }
  function drawMock(host, m, mi) {
    var pre = m.id || "m" + mi;
    var s = heading(host, pre, m.when, m.title);
    var ex = m.exchanges || [];
    if (!ex.length && m.critique) { s.appendChild(el("p", "", inl(m.critique))); return; }
    var tally = {};
    ex.forEach(function (x) { tally[x.verdict] = (tally[x.verdict] || 0) + 1; });
    s.appendChild(el("p", "mk-tally", ["landed", "partly", "missed", "gap"].filter(function (k) { return tally[k]; })
      .map(function (k) { return '<span class="vd vd-' + k + '"></span>' + tally[k] + " " + (k === "gap" ? "gaps" : k); }).join('<span class="sep"></span>') +
      '<span class="sep"></span>' + ex.length + " exchanges"));
    (m.read || []).forEach(function (p) { s.appendChild(el("p", "mk-read", inl(p))); });
    if (m.landed && m.landed.length) {
      s.appendChild(el("h3", "mk-h", "What landed"));
      var ul = el("ul", "mk-list");
      m.landed.forEach(function (t) { ul.appendChild(el("li", "", inl(t))); });
      s.appendChild(ul);
    }
    if (m.fix && m.fix.length) {
      s.appendChild(el("h3", "mk-h", "Fix these first"));
      var ol = el("ol", "mk-list mk-fix");
      m.fix.forEach(function (f) {
        var li = el("li", "", inl(f.t) + " ");
        var at = ex.findIndex(function (x) { return x.id === f.ref; });
        if (at >= 0) { li.appendChild(openLink("See turn " + (at + 1), m, at)); }
        ol.appendChild(li);
      });
      s.appendChild(ol);
    }
    /* The turns, one line each; the conversation itself opens in one screen. */
    var c = heading(host, pre + "-talk", "Every turn, in one screen", "The conversation");
    var go = el("button", "btn primary", "Open the conversation");
    go.addEventListener("click", function () { openConvo(m, 0); });
    c.appendChild(el("div", "acts")).appendChild(go);
    var list = el("ol", "turns");
    ex.forEach(function (x, i) {
      var li = el("li");
      var b = el("button", "turn");
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) +
        '</span><span class="tw spk-' + esc((x.who || "").toLowerCase()) + '">' + esc(x.who) + "</span>";
      b.addEventListener("click", function () { openConvo(m, i); });
      li.appendChild(b); list.appendChild(li);
    });
    c.appendChild(list);
  }
  function openLink(text, m, i) {
    var a = el("button", "linkish", esc(text));
    a.addEventListener("click", function () { openConvo(m, i); });
    return a;
  }

  /* One screen, shared by mocks and the Prep banks: a list on the left, the chosen item on
     the right. The item's header is small; under it, the light column is for understanding
     and the dark sheet is what to say, each scrolling on its own. Arrows move; Escape closes. */
  var convo = document.getElementById("convo");
  function panelSection(host, label, nodes) {
    if (!nodes.length) { return; }
    host.appendChild(el("div", "lab", label));
    nodes.forEach(function (n) { host.appendChild(n); });
  }
  function panelList(items, cls) {
    if (!items || !items.length) { return []; }
    var u = el("ul", "mk-list " + (cls || ""));
    items.forEach(function (t) { u.appendChild(el("li", "", inl(t))); });
    return [u];
  }
  /* o: { title, sub, label, count, row(i) -> html for the rail, draw(i, pane), start } */
  function openPanel(o) {
    var cur = o.start || 0;
    convo.innerHTML = "";
    convo.setAttribute("aria-label", o.label || o.title);
    var shell = el("div", "cv");
    var rail = el("nav", "cv-rail");
    rail.appendChild(el("div", "cv-title", "<b>" + esc(o.title) + "</b>" + (o.sub ? "<span>" + esc(o.sub) + "</span>" : "")));
    var rows = [];
    for (var i = 0; i < o.count; i++) {
      (function (i) {
        var b = el("button", "turn");
        b.innerHTML = o.row(i);
        b.addEventListener("click", function () { show(i); });
        rail.appendChild(b);
        rows.push(b);
      }(i));
    }
    rail.appendChild(el("div", "cv-keys", "Up and down arrows move. Escape closes."));
    var pane = el("section", "cv-pane");
    var close = el("button", "cv-close", "Close");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", function () { convo.close(); });
    shell.appendChild(rail); shell.appendChild(pane);
    convo.appendChild(close); convo.appendChild(shell);
    function show(i) {
      cur = i;
      rows.forEach(function (b, j) { b.classList.toggle("on", j === i); if (j === i) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); } });
      rows[i].scrollIntoView({ block: "nearest" });
      pane.innerHTML = "";
      o.draw(i, pane, function () { rows[i].innerHTML = o.row(i); });
      [].forEach.call(pane.querySelectorAll(".cv-col"), function (c) { c.scrollTop = 0; });
    }
    convo.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = cur + (e.key === "ArrowDown" ? 1 : -1);
        if (n >= 0 && n < o.count) { show(n); rows[n].focus(); }
      }
    };
    show(cur);
    try { convo.showModal(); } catch (err) { convo.setAttribute("open", ""); }
    rows[cur].focus();
  }
  function panelCols(pane, leftTitle, rightTitle) {
    var cols = el("div", "cv-cols");
    var left = el("div", "cv-col cv-said"), right = el("div", "cv-col cv-say");
    left.appendChild(el("h3", "cv-h", leftTitle));
    right.appendChild(el("h3", "cv-h", rightTitle));
    cols.appendChild(left); cols.appendChild(right);
    pane.appendChild(cols);
    return { left: left, right: right, cols: cols };
  }

  /* A mock: what they asked and how it landed; what you said; what to say. */
  function openConvo(m, start) {
    var ex = m.exchanges;
    openPanel({
      title: m.title, sub: m.when, label: "Mock conversation", count: ex.length, start: start,
      row: function (i) {
        var x = ex[i];
        return '<span class="n">' + (i + 1) + '</span><span class="vd vd-' + esc(x.verdict) + '"></span><span class="tl">' + esc(x.label || x.q) + "</span>";
      },
      draw: function (i, pane) {
        var x = ex[i], who = (x.who || "").toLowerCase();
        var head = el("header", "cv-head");
        head.appendChild(el("div", "ex-q spk-" + who, '<span class="ex-who">Turn ' + (i + 1) + " of " + ex.length + ", " + esc(x.who) + "</span>" + inl(x.q)));
        head.appendChild(el("p", "cv-verdict", '<span class="vd vd-' + esc(x.verdict) + '"></span><b>' + esc(VERDICT[x.verdict] || x.verdict) + ".</b> " + inl(x.why || "")));
        if (x.tests) { head.appendChild(el("p", "cv-tests", "<b>They were testing:</b> " + inl(x.tests))); }
        pane.appendChild(head);
        var c = panelCols(pane, "What you said", "What to say");
        panelSection(c.left, "In short", (x.said || []).map(function (p) { return el("p", "ex-said", inl(p)); }));
        panelSection(c.left, "What worked", panelList(x.good, "mk-good"));
        panelSection(c.left, "What did not", panelList(x.bad, "mk-bad"));
        if (x.land) { c.right.appendChild(el("p", "cv-land", "<b>Land on this.</b> " + inl(x.land))); }
        if (x.say && x.say.length) { c.right.appendChild(transcript(x.say, "You", "")); }
        panelSection(c.right, "How to approach it", panelList(x.approach));
        (x.figs || []).forEach(function (k) { var f = figNode(k, 0); if (f) { c.right.appendChild(f); } });
        var links = [];
        if (x.prepId) { links.push('<a href="' + link("prep", x.prepId) + '">Revise it on the Prep tab</a>'); }
        if (x.ref) { links.push('<a href="' + prepRef(x.ref) + '">The prepared script</a>'); }
        if (links.length) { c.right.appendChild(el("p", "ex-links", links.join('<span class="sep"></span>'))); }
      }
    });
  }

  /* A Prep question can be marked revised; the mark is kept in this page's storage. */
  function isRevised(id) { return !!own().rev[id]; }
  function setRevised(id, on) {
    var o = own();
    if (on) { o.rev[id] = stamp(); } else { delete o.rev[id]; }
    writeJSON(OWN, o);
  }
  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    return { tab: tab, anchor: p[1] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = link(t.id);
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    if (convo.open) { convo.close(); }
    try {
      main.innerHTML = ""; nav = [];
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "rounds") { tabRounds(main); }
      else if (r.tab === "research") { tabResearch(main); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "own") { tabOwn(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "mocks") { tabMocks(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    drawTabs(r.tab); drawSide(r.tab); progress();
    var key = r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var c = document.getElementById("count");
    if (!LOOP.when_iso) { c.textContent = "Date to be set"; return; }
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
</html>
