"Then route by domain first, accounts, cards, loans, fraud, so each classifier has a manageable label space, with top-priority routes for fraud and 'I want a person'. Flat taxonomies start breaking down past a few hundred intents.", "My test for granularity: if two intents get the same flow and the same API call, merge them and use an entity; if the same words need different handling, like a lost card versus a declined card, split them. And I'd validate on a labelled sample of real utterances with a confusion matrix before building any flows."], "land": "Actions as intents, things as entities, domain first; merge if same flow and call, split if handling differs.", "probes": ["How many intents is too many?", "Who owns the taxonomy?", "How do you stop it drifting as teams add intents?"], "parts": [{"title": "Merge or split", "items": ["**Merge** when two intents share a flow and a backend call: one intent plus an entity.", "**Split** when the words are similar but the handling differs.", "**Keep both and ask** when users' words genuinely can't separate them: a disambiguation question when the scores are close.", "**One schema style** across the project: don't model half as action-as-intent and half as information-as-intent."]}, {"title": "Past a few hundred intents", "items": ["Route by domain first (Dialogflow CX flows; Microsoft orchestration across CLU and question answering), then classify within it.", "Or head intents plus a modifier entity."]}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/intents-entities", "label": "Baseline: intents and entities", "why": "The modelling, with platform terms side by side."}, {"url": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant", "label": "Guide: enterprise virtual assistant", "why": "The whole assistant in six steps."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model, step 1: The taxonomy: actions as intents, objects as entities", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}, {"url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/best-practices", "label": "Microsoft CLU: best practices", "why": "Schema design, balance, entity components, overconfidence.", "m": 12}], "figs": [], "sdLinks": []}, "id": "q-how-would-you-design-the-intent-taxonomy-for-say-a-bank-assi"}, {"q": "How many training phrases does an intent need, and where do they come from?", "short": "Training data", "tests": "Data quality judgement, not a magic number.", "a": ["The platforms give minimums: Dialogflow CX recommends at least 10 to 20 per intent, CLU flags fewer than 15 and wants at least 25 for its out-of-domain setup, Kore.ai says 8 to 10 balanced across intents, and Cognigy's analyzer flags fewer than 5. I'd treat those as floors, not targets.", "Quality matters more than count. Balance the classes, because imbalance biases toward the big intents. Vary casing and punctuation. Avoid accidental patterns, like every example starting with 'I want'. Diversify the wording, don't reorder the same words. And source from production logs, not only from the design team, because designers write the way designers talk.", "Then a held-out test set that's never trained on and covers every intent. At alfred_ every test case comes from a real production failure, and that's the instinct I'd bring: real users' words are the ground truth."], "land": "Platform minimums are floors; balanced, varied, real users' words; a frozen test set.", "probes": ["How do you generate examples for a new intent with no traffic?", "Can you use an LLM to write training phrases?", "How do you keep the test set clean?"], "notes": ["An LLM can draft examples for a cold start, but they share the model's phrasing. Replace them with real utterances as traffic arrives, and never let generated text into the test set.", "Watch for leakage: the same utterance, or a near duplicate, in train and test."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/intents-entities", "label": "Baseline: intents and entities", "why": "Training phrases."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model, step 2: Training utterances and the out-of-scope intent", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}, {"url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/intent", "label": "Dialogflow CX: intents", "why": "Training phrases (10 to 20), confidence, the default negative intent.", "m": 5}, {"url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/best-practices", "label": "Microsoft CLU: best practices", "why": "Schema design, balance, entity components, overconfidence.", "m": 12}, {"url": "https://docs.cognigy.com/ai/empower/nlu/intents/intent-analyzer/", "label": "Cognigy: Intent Analyzer", "why": "Weak and overlapping intents, scored.", "m": 4}], "figs": [], "sdLinks": []}, "id": "q-how-many-training-phrases-does-an-intent-need-and-where-do-t"}, {"q": "How do you model entities and slots?", "short": "Entities and slots", "tests": "The right extractor for each kind of value.", "a": ["System entities for dates, numbers and emails. Lists with synonyms for closed vocabularies. Regex plus validation for identifiers like order numbers. Learned entities where context decides the meaning. Most platforms let you combine these.", "The trap is extractors firing everywhere. CLU's example is a ticket-quantity entity built only on the prebuilt number, which fires on '3 PM'; the fix is to add a learned component and make it required. Roles like origin versus destination need a signal in the data, words like 'from' and 'to'.", "For IDs and account numbers I'd use deterministic extraction and validate against the system of record, not ML. That's the same instinct as alfred_'s working memory: the model picks, code attaches the real ids."], "land": "System, list, regex, learned: each for its kind; required components stop false fires; IDs are deterministic.", "probes": ["How do you handle synonyms?", "How do you validate a slot?", "What about over-answering?"], "parts": [{"title": "Entity types across platforms", "items": ["**System or prebuilt:** date, number, email.", "**List with synonyms:** a reference value plus synonyms; Dialogflow CX can auto-generate up to 3 synonyms.", "**Regex:** IDs, order numbers.", "**Learned:** context decides; needs examples.", "**Lex custom slot types:** expand values by ML (the default) or restrict to listed values and synonyms; up to five resolved values come back."]}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/intents-entities", "label": "Baseline: intents and entities", "why": "Entities."}, {"url": "../BASELINE.html#/nlp/sequence-labelling", "label": "Baseline: sequence labelling", "why": "NER under the entity extractor."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model, step 3: Entities, slots and dialogue state", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}, {"url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/entity", "label": "Dialogflow CX: entities", "why": "Entity types and synonyms.", "m": 5}, {"url": "https://docs.aws.amazon.com/lexv2/latest/dg/custom-slot-types.html", "label": "Amazon Lex: custom slot types", "why": "Synonyms, value resolution.", "m": 5}, {"url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/best-practices", "label": "Microsoft CLU: best practices", "why": "Schema design, balance, entity components, overconfidence.", "m": 12}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-model-entities-and-slots"}, {"q": "What is dialogue state, and how do you track it?", "short": "Dialogue state", "tests": "The formal name for what flows and slots do.", "a": ["Dialogue state is the structured set of slot values and where the user is in the task, at each turn. Dialogue state tracking is updating it as the conversation goes, and it's measured by joint goal accuracy: the share of turns where every slot is right.", "On the platforms it's built in. A Dialogflow CX page is a state, and its form collects required parameters, prefilled from the session or the matched intent. Lex elicits slots through code hooks. Rasa's collect steps fill slots, and CALM adds corrections.", "With LLMs it's often function calling: each tool is an intent, its arguments are slots. The FnCTOD paper used that for zero-shot tracking. In MockFlow-AI the state is an explicit state machine, and the model can only move it by calling a transition tool, so it can't drift."], "land": "The slots and the position at each turn; joint goal accuracy; pages, slots or tool arguments hold it.", "probes": ["Why joint goal accuracy and not per-slot?", "Where does state live in an LLM agent?", "How do you test it?"], "notes": ["Joint goal accuracy is strict on purpose: a right intent with one wrong slot still fails the task."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/dialogue-state", "label": "Baseline: dialogue state", "why": "Tracking, and how it's measured."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model, step 3: Entities, slots and dialogue state", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}, {"url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/page", "label": "Dialogflow CX: pages", "why": "Pages as states, forms, routes.", "m": 5}, {"url": "https://arxiv.org/abs/2402.10466", "label": "FnCTOD: LLMs as zero-shot dialogue state trackers via function calling", "why": "Tools as intents, arguments as slots.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-what-is-dialogue-state-and-how-do-you-track-it"}, {"q": "How do you set confidence thresholds?", "short": "Thresholds", "tests": "Calibration and risk, not a default.", "a": ["From evaluation data, not defaults. I'd plot precision and recall, and the cost of a wrong action, against the threshold for each intent family, then pick three bands: act above the high one, confirm or disambiguate in the middle, fall back below.", "Cognigy builds exactly that: a confidence threshold, default 0.4, a reconfirmation threshold, default 0.2, and not found below. High-risk intents get a higher bar and an explicit confirmation on top.", "And scores are model-specific. Lex says its scores are comparative and may change as the model improves, and CLU needs a retrain and republish after a threshold change. So I recalibrate after every model or training change, and I treat a threshold change as a release."], "land": "Three bands from your own data, a higher bar for risky intents, recalibrated after every model change.", "probes": ["What if the model is overconfident?", "One threshold or one per intent?", "How do you choose the middle band's width?"], "notes": ["CLU warns a model can predict the wrong intent at 1.00 confidence, which makes any threshold useless. That's a calibration problem: temperature scaling, or the platform's newer training configs.", "Lex: you set nluIntentConfidenceThreshold per locale; it returns the top intent and up to four alternates."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/out-of-scope", "label": "Baseline: out-of-scope detection", "why": "Thresholds as a detector."}, {"url": "../BASELINE.html#/nlp/classification-metrics", "label": "Baseline: classification metrics", "why": "Precision and recall against a threshold."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model, step 4: Confidence thresholds and multi-intent", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}, {"url": "https://docs.cognigy.com/ai/platform-features/nlu/intents/thresholds", "label": "Cognigy: intent thresholds", "why": "Three bands: accept, reconfirm, not found.", "m": 3}, {"url": "https://docs.aws.amazon.com/lexv2/latest/dg/using-intent-confidence-scores.html", "label": "Amazon Lex: intent confidence scores", "why": "The threshold, FallbackIntent, up to four alternates.", "m": 5}, {"url": "https://arxiv.org/abs/1706.04599", "label": "On calibration of modern neural networks", "why": "Overconfidence, ECE, temperature scaling.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-set-confidence-thresholds"}, {"q": "Classic NLU or an LLM for intent classification?", "short": "Classic or LLM", "tests": "A grounded trade-off, with numbers.", "a": ["It depends on the label space and the constraints. For a stable, well-labelled, latency-critical domain, a fine-tuned encoder is faster, cheaper and often as accurate. An LLM wins when the schema changes, labels are few, or out-of-scope detection matters.", "One 2026 preprint put numbers on it: a fine-tuned RoBERTa beat Claude Haiku on ATIS, 95.9 to 84.1, and tied on CLINC150, but the LLM was far better at out-of-scope recall, 85.6 to 58.1, and could switch schemas with no retraining. The cost was latency: about 981 milliseconds at p50 against 2.4.", "So the usual production answer is hybrid. A fast classifier takes the confident turns and the uncertain ones go to an LLM; an Amazon paper measured that within 2% of the LLM's accuracy with half the latency. At alfred_ the same idea shows up as cost: replacing per-message model calls with a deterministic matcher cut per-user LLM cost about 30%."], "land": "Encoder for stable, fast, labelled; LLM for changing schemas and out-of-scope; hybrid in production.", "probes": ["How does the router decide it's uncertain?", "What about multi-intent messages?", "How do you evaluate both fairly?"], "parts": [{"title": "The numbers, and how sure they are", "items": ["**Decision framework preprint (arXiv 2608.20371, 2026, not yet peer reviewed):** ATIS 95.9 vs 84.1; CLINC150 89.1 vs 88.5; out-of-scope recall 85.6 (LLM) vs 58.1; a fixed classifier scored 0% on an unseen schema; p50 about 981 ms vs 2.4 ms; about $0.25 per 1,000 calls. One data point.", "**Amazon, EMNLP 2024 industry (arXiv 2410.01627):** route to the LLM only when a SetFit classifier is uncertain (Monte Carlo dropout); within 2% of the LLM's accuracy, 50% less latency. A large label space hurts out-of-scope; a two-step method gained over 5% on out-of-scope for Mistral-7B.", "**Its decision rule:** stable, labelled, latency-critical means an encoder; dynamic schemas or out-of-scope-critical means an LLM; noisy ASR means hybrid."]}], "notes": ["Whatever the choice, the same evaluation set and the same thresholds for both, or the comparison means nothing.", "Multi-intent ('open an account and send me the details'): classic NLU returns one intent a turn, so you split, queue the detected intents, or let an LLM planner call them in turn, as Copilot Studio's generative orchestration does."], "swaps": [{"when": "If they ask how the router knows it's uncertain", "line": "A calibrated confidence with a threshold, the margin between the top two, or, in the Amazon paper, Monte Carlo dropout: run the classifier a few times with dropout on and route when the answers disagree."}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/nlu-llm-hybrid", "label": "Baseline: classic NLU and LLMs together", "why": "Routing between them."}, {"url": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives", "label": "Guide: the virtual assistant's deep dives", "why": "Routing, thresholds and the hybrid at depth."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model, step 6: The LLM shift: hybrid routing, tools as intents, RAG, guardrails", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}, {"url": "https://arxiv.org/html/2608.20371", "label": "A decision framework for intent detection in production (2026 preprint)", "why": "Fine-tuned encoder vs LLM with numbers. One data point; a preprint.", "m": 20}, {"url": "https://arxiv.org/abs/2410.01627", "label": "Intent detection in the age of LLMs (Amazon, EMNLP 2024 industry)", "why": "Route to the LLM only when SetFit is unsure. Read the abstract.", "m": 2}, {"url": "https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/generative-orchestration", "label": "Copilot Studio: generative orchestration", "why": "An LLM planner over topics and tools, with deterministic control layers.", "m": 12}], "figs": [], "sdLinks": []}, "id": "q-classic-nlu-or-an-llm-for-intent-classification"}, {"q": "How would you add an LLM to an existing Dialogflow bot safely?", "short": "An LLM, added safely", "tests": "Incremental, measured change to a live system.", "a": ["Start where the risk is lowest: generative fallback on the no-match handlers, or a retrieval-backed answer for FAQs, and keep the flows for transactions. Ground answers in an approved knowledge base, use the banned-phrases list, and remember generative fallback sits outside the CX SLA and falls back to canned text when generation fails.", "Before any traffic, a golden test set and an LLM-judge rubric. Then shadow mode, or an experiment on a small share of traffic, watching escalation, CSAT and a reviewed sample for hallucination.", "Only then playbooks, for open-ended tasks, with authentication and payments staying in flows. It's how I'd ship anything at alfred_: real cases first, then a small rollout, then wider."], "land": "Lowest risk first, evals before traffic, shadow then experiment, flows keep the money paths.", "probes": ["What would you measure in the experiment?", "What's in the judge's rubric?", "How do you stop it answering account questions from documents?"], "notes": ["I haven't run this on Dialogflow. Say so if asked, then the method."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/nlu-llm-hybrid", "label": "Baseline: classic NLU and LLMs together", "why": "Generative fallback and playbooks."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model, step 6: The LLM shift: hybrid routing, tools as intents, RAG, guardrails", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}, {"url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/generative/generative-fallback", "label": "Dialogflow CX: generative fallback", "why": "An LLM on no-match, banned phrases, outside the SLA.", "m": 4}, {"url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/playbook", "label": "Dialogflow CX: playbooks", "why": "Generative playbooks beside deterministic flows.", "m": 6}, {"url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/experiments", "label": "Dialogflow CX: experiments", "why": "Traffic splits, up to four variants, auto rollout.", "m": 4}], "figs": [], "sdLinks": []}, "id": "q-how-would-you-add-an-llm-to-an-existing-dialogflow-bot-safel"}, {"q": "How do function calling and tools relate to intents and slots?", "short": "Tools as intents", "tests": "Do you see the old and new as one model?", "a": ["A tool is an intent with typed arguments, and the arguments are slots. The model fills them against a schema, which gives you zero-shot slot filling and new capabilities without retraining. FnCTOD showed that for dialogue state tracking: 5.6 points of joint goal accuracy for ChatGPT and 14 for GPT-4, with a fine-tuned 13B model comparable to ChatGPT.", "The cost is determinism. tau-bench found GPT-4o tool-calling agents solved under half of retail tasks, and passed all eight tries of the same task under 25% of the time. So I keep a deterministic policy layer, validate arguments server side with the same validators as before, and run each test scenario several times.", "That's alfred_'s shape: intent classification, a decision layer, then callable tools. And in MockFlow-AI the stage only moves when the model calls the transition tool."], "land": "Tools are intents, arguments are slots; flexible but less deterministic, so validate and gate in code.", "probes": ["How do you validate arguments?", "What's pass^k?", "How many tools before selection degrades?"], "notes": ["Structured output with a JSON schema for extraction; validate with regex, list lookups and database existence checks, the same as classic slots.", "Keep the tool list small with precise descriptions; Copilot Studio says names carry more weight than descriptions when its planner picks."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/nlu-llm-hybrid", "label": "Baseline: classic NLU and LLMs together", "why": "Function calling as NLU."}, {"url": "mphasis.html#/prep/q-how-does-tool-calling-actually-work", "label": "Mphasis page: how tool calling works", "why": "The mechanism, already written."}, {"url": "../CODING.html#structured", "label": "Coding page: structured output and function calling", "why": "The code."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model, step 6: The LLM shift: hybrid routing, tools as intents, RAG, guardrails", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}, {"url": "https://arxiv.org/abs/2402.10466", "label": "FnCTOD: LLMs as zero-shot dialogue state trackers via function calling", "why": "Tools as intents, arguments as slots.", "m": 25}, {"url": "https://arxiv.org/abs/2406.12045", "label": "tau-bench", "why": "Simulated users, tools and policies; pass^k.", "m": 30}], "figs": [], "sdLinks": []}, "id": "q-how-do-function-calling-and-tools-relate-to-intents-and-slot"}, {"q": "An FAQ intent and a transactional intent keep colliding, like 'my card...'. What do you do?", "short": "FAQ or transaction", "tests": "Routing between knowledge and action.", "a": ["Use a router with a clear rule: the transactional intent wins when there's an authenticated account context and an action verb; informational questions go to retrieval. When both score close, ask one line: 'Do you want to know about card fees, or do something with your card?'", "Keep the account-specific path separate from RAG, so a generic document never answers a question about one person's account. I'd keep an explicit intent for 'needs a transaction' for exactly that reason.", "Then test it on a labelled set of near-miss pairs, because those collisions are what the overall accuracy hides."], "land": "Action plus account context means transaction; questions mean retrieval; ask when close; test on near-miss pairs.", "probes": ["How would you replace dozens of FAQ intents?", "How do you keep retrieval fresh?"], "notes": ["Replacing FAQ intents with retrieval over a curated knowledge base is the usual move: Lex has KendraSearchIntent, Dialogflow data stores, Copilot Studio knowledge sources."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/nlu-llm-hybrid", "label": "Baseline: classic NLU and LLMs together", "why": "Retrieval for FAQs."}, {"url": "../BASELINE.html#/ai/rag", "label": "Baseline: RAG", "why": "Retrieval, grounding and citations."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model, step 6: The LLM shift: hybrid routing, tools as intents, RAG, guardrails", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}], "figs": [], "sdLinks": []}, "id": "q-an-faq-intent-and-a-transactional-intent-keep-colliding-like"}, {"q": "Which conversational AI platforms do you know, and how do they differ?", "short": "The platforms", "tests": "Breadth, and honesty about what you've used.", "a": ["Honestly, I haven't shipped on any of them; I've built the NLU layer myself in front of LLM agents. But I've read how each one models the same problem, and they map cleanly.", "Dialogflow CX is flows of pages, states with forms, routes and event handlers, now with playbooks and generative fallback on top. Lex is intents and slots with Lambda code hooks, a fallback intent and a test workbench. Microsoft has CLU as the classic NLU, and Copilot Studio, where an LLM planner picks topics and tools. Rasa's CALM uses the LLM only to understand and keeps the logic in flows. Kore.ai scores several engines and ranks them; Cognigy has intent thresholds and an analyzer for weak intents.", "What carries over from my work is the underneath: taxonomy, thresholds, fallbacks, state, and error analysis on real transcripts. I'd ask which one you're on and spend my first week in it."], "land": "Not shipped on one; know how each models it; the underneath is mine.", "probes": ["Which would you pick?", "What do you know about Dialogflow CX in particular?", "How quickly could you be productive?"], "parts": [{"title": "One line each", "items": ["**Dialogflow CX:** flows (topics) of pages (states), routes, route groups, event handlers; playbooks for open-ended work; test cases and experiments.", "**Amazon Lex V2:** intents, slots and slot types, Lambda code hooks, confidence threshold, FallbackIntent, KendraSearchIntent, Test Workbench.", "**Microsoft CLU and Copilot Studio:** CLU's intents, entity components and None intent; Copilot Studio's generative orchestration with deterministic, hybrid and generative layers.", "**Rasa CALM:** the LLM emits commands (start flow, set slot, correct, clarify, hand off); flows hold the logic.", "**Kore.ai XO:** several engines (fundamental meaning, ML, knowledge graph) ranked by a resolver; a validation view with confusion matrix and k-fold.", "**Cognigy:** intent thresholds in three bands; an Intent Analyzer for weak and overlapping intents.", "**IBM watsonx Assistant:** not checked; say you'd read current docs before asserting anything."]}], "never": ["Never say you've used one. 'I've read how it works' is true; 'I've used it' is not."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/intents-entities", "label": "Baseline: intents and entities", "why": "Platform terms side by side."}, {"url": "../index.html#/w/wc29", "label": "Session wc29: Intents, entities and the NLU model, step 5: How the platforms differ", "why": "Taxonomy, training data, entities, thresholds, the LLM shift."}, {"url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/flow", "label": "Dialogflow CX: flows", "why": "Flows as topics, route groups.", "m": 4}, {"url": "https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/generative-orchestration", "label": "Copilot Studio: generative orchestration", "why": "An LLM planner over topics and tools, with deterministic control layers.", "m": 12}, {"url": "https://rasa.com/docs/rasa-pro/concepts/dialogue-understanding/", "label": "Rasa: dialogue understanding", "why": "An LLM emits commands; flows keep the logic.", "m": 5}, {"url": "https://docs.kore.ai/xo/automation/natural-language/training/training-validations/", "label": "Kore.ai: training validations", "why": "Confusion matrix, k-fold, conflict warnings.", "m": 5}], "figs": [], "sdLinks": []}, "id": "q-which-conversational-ai-platforms-do-you-know-and-how-do-the"}]}, {"group": "Error analysis and production", "blurb": "Finding what's wrong in real conversations and improving the assistant safely. Taught in wc30.", "items": [{"q": "Two intents keep getting confused. What do you do?", "id": "q-two-intents", "short": "Two intents confused", "tests": "Method: evidence first, then the right fix, then a check.", "a": ["I'd look at the confusion matrix and then the actual misclassified utterances, not only the F1. The numbers tell you where; the utterances tell you why.", "Then decide which case it is. If they're really one intent with different entities, merge them. If they're distinct actions with ambiguous wording, keep both and add contrastive examples, pairs that differ in the one thing that matters. Check the training data for bias too: one intent with twice the examples, or a stray phrase pattern that's doing the classifying. And if users' words genuinely can't separate them, keep both and ask a disambiguation question when the scores are close.", "Last, rerun the frozen test set, because a fix often moves the errors to a neighbour. It's how I work on alfred_'s failures: read the real cases, decide whether it's the model, the data or the design, fix that, and check against everything else."], "land": "Confusion matrix, then the utterances; merge, split with contrastive examples, or ask; rerun the frozen set.", "probes": ["How do you know it's the data and not the model?", "What's a contrastive example?", "What if merging breaks a downstream flow?"], "parts": [{"title": "The order", "items": ["**Look:** the confusion matrix's off-diagonal cell, then every utterance in it.", "**Margin:** how close are the top two scores? A low margin is a conflict (Lex: 0.75 vs 0.72).", "**Data:** counts per intent, accidental patterns, mislabelled examples.", "**Decide:** merge, split with contrastive examples, or keep both and disambiguate.", "**Check:** rerun the frozen test set; look at the neighbours."]}], "notes": ["Platforms flag this for you: Kore.ai's validation and Cognigy's Intent Analyzer show overlapping intents; Cognigy marks weak intents below 0.6."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "Confusion and overlap."}, {"url": "../BASELINE.html#/nlp/classification-metrics", "label": "Baseline: classification metrics", "why": "The confusion matrix."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 1: Per-intent metrics and the confusion matrix", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}, {"url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/evaluation-metrics", "label": "Microsoft CLU: evaluation metrics", "why": "Precision, recall, F1, the confusion matrix, the None threshold.", "m": 12}, {"url": "https://docs.kore.ai/xo/automation/natural-language/training/training-validations/", "label": "Kore.ai: training validations", "why": "Confusion matrix, k-fold, conflict warnings.", "m": 5}, {"url": "https://docs.cognigy.com/ai/empower/nlu/intents/intent-analyzer/", "label": "Cognigy: Intent Analyzer", "why": "Weak and overlapping intents, scored.", "m": 4}], "figs": [], "sdLinks": []}}, {"q": "Containment dropped 10% after a release. Walk me through it.", "short": "Containment dropped", "tests": "Calm, ordered debugging of a live metric.", "a": ["First, is it real? I'd check the metric's definition, the data pipeline and the traffic mix, because a campaign or an outage changes which intents come in.", "Then diff by version. Break containment down by intent, channel, flow, page and the traffic's version, and find where it moved. Look at no-match rate, escalation reasons, webhook errors and timeouts, and abandonment by page. If one flow regressed, roll that version back, or cut its experiment traffic, while I read the transcripts to find the cause.", "Then make it not happen again: a regression test for the cause, and an alert on that page's no-match or escalation rate. I think the order matters more than any single step: confirm, localise, stop the bleeding, then root cause."], "land": "Confirm it's real, localise by version and page, roll back, read transcripts, add a test and an alert.", "probes": ["What if it's not the release?", "How fast would you roll back?", "What's your first query?"], "notes": ["Dialogflow CX analytics shows no-match, escalation and exit rates by page, and webhook errors and latency: the first place to look on that platform.", "Containment can also drop for a good reason: a fix that stops the bot trapping people. Check repeat contact before calling it a regression."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "Localising a regression."}, {"url": "../BASELINE.html#/nlp/assistant-metrics", "label": "Baseline: assistant metrics", "why": "What containment does and doesn't measure."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 4: KPIs that tell the truth", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}, {"url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/analytics", "label": "Dialogflow CX: analytics", "why": "No-match, escalation, webhook errors by page.", "m": 5}], "figs": [], "sdLinks": []}, "id": "q-containment-dropped-10-after-a-release-walk-me-through-it"}, {"q": "How do you find the intents you're missing?", "short": "Finding new intents", "tests": "Mining production for what the taxonomy doesn't cover.", "a": ["Collect the fallback and low-confidence utterances plus the escalated conversations. Embed them, cluster them, with HDBSCAN or k-means, and have an LLM name each cluster for a person to review. Rank by volume times business cost.", "For each cluster decide: a new intent, examples for an existing one, examples for the none class, or a content gap for retrieval. Check the proposal against the existing taxonomy first, so the new intent doesn't overlap a neighbour, then validate on a held-out sample.", "It's close to what my production failure scanner does at alfred_: read real conversations, separate genuine failures from expected behaviour, and promote the real ones, so the backlog comes from users and not from guesses."], "land": "Embed the misses, cluster, name with an LLM, rank by volume and cost, then decide intent, examples or content.", "probes": ["Why HDBSCAN over k-means?", "How big must a cluster be to become an intent?", "How do you stop overlap?"], "notes": ["HDBSCAN finds clusters of varying density and leaves noise unclustered, so you don't need to guess k; k-means is simpler when you roughly know how many topics to expect."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "Mining misses."}, {"url": "../BASELINE.html#/nlp/sentence-embeddings", "label": "Baseline: sentence embeddings", "why": "What the clustering runs on."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 2: Mining misses and reviewing transcripts", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}, {"url": "https://rasa.com/docs/rasa/conversation-driven-development/", "label": "Rasa: conversation-driven development", "why": "Review, tag and fix real conversations in batches.", "m": 4}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-find-the-intents-you-re-missing"}, {"q": "How do you evaluate an NLU model beyond accuracy?", "short": "NLU evaluation", "tests": "The full set of metrics, and why each.", "a": ["Per-intent precision, recall and F1, with macro and micro averages, so rare intents aren't hidden. A confusion matrix for which ones collide. Entities evaluated separately, span and type, because a right intent with a wrong entity still fails. And the out-of-scope false-accept rate, plus calibration of the confidence.", "Then test on production-like data: typos, casing, ASR noise. For voice, word error rate and slot error rate on real audio, not typed text. And at the conversation level, joint goal accuracy, because the task needs every slot right.", "I'd report latency too, p50 and p95, and cost per thousand requests, next to a baseline. A metric without the baseline doesn't tell you much."], "land": "Per-intent P/R/F1, macro and micro, confusion, entities, out-of-scope, calibration, on production-like data.", "probes": ["Macro or micro, and why?", "How do you evaluate entities?", "How big should the test set be?"], "notes": ["CLU's worked example has the intent right and the entity span wrong: count those separately.", "With a small test set, report confidence intervals or several seeds before claiming a gain."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/classification-metrics", "label": "Baseline: classification metrics", "why": "Macro, micro, the confusion matrix."}, {"url": "../BASELINE.html#/nlp/assistant-metrics", "label": "Baseline: assistant metrics", "why": "From turn to conversation."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 1: Per-intent metrics and the confusion matrix", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}, {"url": "../index.html#/w/wc25", "label": "Session wc25: The map of NLP, step 4: Evaluation: what each metric measures and hides", "why": "Where every task, representation and model era sits."}, {"url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/evaluation-metrics", "label": "Microsoft CLU: evaluation metrics", "why": "Precision, recall, F1, the confusion matrix, the None threshold.", "m": 12}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-evaluate-an-nlu-model-beyond-accuracy"}, {"q": "How do you structure transcript review?", "short": "Transcript review", "tests": "A repeatable labelling process, not ad-hoc reading.", "a": ["Weekly, sampled by stratum, not only at random: every escalation, abandoned sessions, low-confidence turns, negative feedback, plus a random slice. And whole conversations, because many failures are dialogue failures a per-utterance metric never shows.", "Each failed conversation gets one primary cause from a fixed taxonomy, plus the correct intent and entities. A labelling guide with rulings on edge cases, two labellers on a subset to measure agreement, and a gold set.", "Every label becomes either a test case or a training example. That's the loop at alfred_: the scanner flags real failures, they become eval cases, and every change runs against them."], "land": "Stratified weekly sample, whole conversations, one primary cause each, agreement measured, every label becomes a test.", "probes": ["What's in your failure taxonomy?", "How do you measure labeller agreement?", "How many conversations a week?"], "parts": [{"title": "One primary cause per failed conversation", "items": ["**ASR error** (voice only).", "**NLU miss:** wrong or no intent.", "**Entity or slot error.**", "**Dialogue logic or design:** wrong path, a trap, no repair.", "**Backend failure or timeout.**", "**Knowledge or content gap.**", "**Policy:** it legitimately can't do that.", "**Abandonment** with no failure signal."]}, {"title": "Why one cause", "items": ["The split tells you where to spend: training data, flows, integrations or the product.", "Report it as a share of lost containment."]}], "notes": ["Agreement: Cohen's kappa on the double-labelled subset. In MockFlow-AI the judge was calibrated against human grades at weighted kappa 0.82."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "The failure taxonomy."}, {"url": "coframe.html#/prep/say-now", "label": "Coframe page: the eval harness story", "why": "Real failures become cases: your answer, already written."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 2: Mining misses and reviewing transcripts", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}, {"url": "https://rasa.com/docs/rasa/conversation-driven-development/", "label": "Rasa: conversation-driven development", "why": "Review, tag and fix real conversations in batches.", "m": 4}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-structure-transcript-review"}, {"q": "Which KPIs do you report, and which ones mislead?", "short": "KPIs", "tests": "Knowing what a number hides.", "a": ["Containment is useful but easy to game: a wall contains. So I'd report it next to solution rate, where the customer confirms it's resolved, and repeat contact within 24 to 72 hours, because someone who calls back tomorrow wasn't contained.", "Then the working metrics: escalation rate by intent, no-match rate by page, task-completion funnels, CSAT by bucket, and handle time for escalated contacts, which should drop if the handoff carries context.", "And filter to business conversations first, no greetings, tests or spam. I'd compute resolution from outcomes, not as one minus escalation."], "land": "Containment next to solution rate and repeat contact; funnels and per-page rates to act on.", "probes": ["How do you measure containment without identity?", "What's a funnel for an intent?", "Which single number would you put on a dashboard?"], "parts": [{"title": "Words that get mixed up", "items": ["**Deflection:** conversations handled by the AI alone.", "**Containment:** the customer didn't come back through another channel for the same issue; hard without identity.", "**Automation rate:** workflows completed.", "**Solution rate:** the customer confirms it's resolved.", "(Rasa's split; a vendor blog, but the distinctions are standard.)"]}, {"title": "A per-intent funnel", "items": ["Intent recognised, required slots filled, authenticated, backend call succeeded, confirmation shown, completed.", "Dialogflow CX's page view (traffic, no-match, escalation, exit rate) is that funnel per state."]}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/assistant-metrics", "label": "Baseline: assistant metrics", "why": "Containment and what it hides."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 4: KPIs that tell the truth", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}, {"url": "https://rasa.com/blog/measure-ai-agent-performance-in-the-contact-center", "label": "Rasa: measuring agent performance (vendor blog)", "why": "Deflection, containment, automation, solution rate, CSAT.", "m": 6}, {"url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/analytics", "label": "Dialogflow CX: analytics", "why": "No-match, escalation, webhook errors by page.", "m": 5}], "figs": [], "sdLinks": []}, "id": "q-which-kpis-do-you-report-and-which-ones-mislead"}, {"q": "How would you A/B test a change to a flow?", "short": "A/B testing", "tests": "Experiment design on a live assistant.", "a": ["Version the flow and split live traffic between control and variants; Dialogflow CX experiments take up to four variants with auto-rollout steps and stop conditions. Assign by user or session, consistently, never by turn.", "Pre-register one primary metric, task completion, not turn count, and guardrails: escalation, CSAT, repeat contact. Run through full weekly cycles, because Monday traffic isn't Saturday traffic, and check significance before shipping.", "One change at a time. And I'd look past the headline: a variant with a lower handoff rate can be worse if people call back the next day."], "land": "One change, assign by user, a pre-registered primary metric and guardrails, full weeks.", "probes": ["How long would you run it?", "What if the primary and a guardrail disagree?", "How do you test a prompt change the same way?"], "notes": ["A prompt or knowledge-base change is a release too: same pipeline, same tests, same experiment."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/assistant-metrics", "label": "Baseline: assistant metrics", "why": "Experiments."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 5: Experiments, drift, release and rollback", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}, {"url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/experiments", "label": "Dialogflow CX: experiments", "why": "Traffic splits, up to four variants, auto rollout.", "m": 4}], "figs": [], "sdLinks": []}, "id": "q-how-would-you-a-b-test-a-change-to-a-flow"}, {"q": "How do you monitor a live assistant for drift?", "short": "Drift", "tests": "Knowing what to watch and what a shift means.", "a": ["Intent mix, the confidence distribution, fallback and escalation rates by intent, webhook and tool error rates, and for the LLM parts groundedness, refusal rate, cost and latency. Alert on deviation from a rolling baseline, not only on absolute thresholds.", "Annotate the dashboards with releases, campaigns and outages, because seasonal and campaign effects are the usual false alarms.", "A sudden rise in fallback is one of two things: a new topic, which needs an intent or content, or a regression, which needs a rollback. Reading twenty of the new fallbacks usually tells you which in a few minutes."], "land": "Watch the mix and the confidence, alert on a rolling baseline, annotate releases; new topic or regression.", "probes": ["What's the difference between data drift and concept drift here?", "How would you detect it with embeddings?"], "notes": ["A drop in average confidence with a stable intent mix often means new phrasing: users talk about the same things differently. Embedding the new traffic and comparing it with training data shows it."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/assistant-metrics", "label": "Baseline: assistant metrics", "why": "Monitoring."}, {"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "Fallback spikes."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 5: Experiments, drift, release and rollback", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-monitor-a-live-assistant-for-drift"}, {"q": "How do you use an LLM as a judge on conversations, and where does it fail?", "short": "LLM-as-judge", "tests": "Using it with its biases in view.", "a": ["Give it the full transcript, the tool traces and a rubric, one criterion at a time: task success, policy adherence, groundedness, tone, an unnecessary escalation. Binary or small scales. For pairwise comparisons, randomise the order.", "The MT-bench paper found strong judges agreed with humans over 80% of the time, about the human-to-human rate, but with position, verbosity and self-enhancement biases. So I calibrate against a human-labelled set and keep tracking agreement. In MockFlow-AI the judge sat at weighted kappa 0.82 against human grades.", "And I don't use a judge where the decision has to be exact. alfred_'s decision layer uses deterministic risk scoring, not LLM-as-judge, because whether to confirm a send can't be a matter of opinion. Judges are for quality; compliance checks stay in code."], "land": "Rubric per criterion, small scales, order randomised, calibrated against humans; never the only gate for compliance.", "probes": ["How do you know the judge is still right?", "Which bias bites most?", "Pass^k, what is it?"], "notes": ["Simulated users (tau-bench) give breadth, but a simulated user is more cooperative than a real one; real transcript replay stays the anchor."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "Judges on transcripts."}, {"url": "zenml-round3.html#/prep/q-how-do-you-decide-what-becomes-an-eval-case-and-is-the-judge", "label": "ZenML page: what becomes an eval case, and is the judge still right", "why": "Your fuller answer on judges, already written."}, {"url": "../BASELINE.html#/ai/llm-as-judge", "label": "Baseline: LLM-as-judge", "why": "The core topic."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 3: Testing: golden conversations, simulation, judges", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}, {"url": "https://arxiv.org/abs/2306.05685", "label": "Judging LLM-as-a-judge (MT-bench)", "why": "Over 80% agreement with humans, and the biases.", "m": 30}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-use-an-llm-as-a-judge-on-conversations-and-where-"}, {"q": "How do you test a conversational system before release?", "short": "Testing before release", "tests": "Layers of tests, and reliability over a single run.", "a": ["Four layers. An NLU test set with metrics. Scripted golden conversations with turn-level expectations; Dialogflow CX test cases check the response, intent, page and flow at each turn and report coverage of transitions and intents. Simulated users for breadth. And a human review sample.", "For the LLM parts, a rubric judge calibrated against human labels, and each scenario run several times. tau-bench's pass^k, the chance all k tries succeed, is the honest number: GPT-4o agents passed all eight tries of a retail task under 25% of the time.", "Release is gated on a 'never break' suite of high-value and high-risk scenarios, then a canary. At alfred_ the eval harness replays real failures against a frozen copy of the user's world; it's how we signed off a full rewrite of the agent."], "land": "NLU set, golden conversations, simulated users, human sample; run each scenario k times; gate on a never-break suite.", "probes": ["What goes in the never-break suite?", "How do you build golden conversations?", "How many runs per scenario?"], "notes": ["Lex's Test Workbench builds test sets from existing transcripts and shows intent and slot performance against a bot."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "Regression sets."}, {"url": "commure.html#/prep/q-how-do-you-evaluate-a-voice-agent", "label": "Commure page: how you evaluate a voice agent", "why": "Your three layers for voice, already written."}, {"url": "../BASELINE.html#/ai/evaluation", "label": "Baseline: evaluation", "why": "The core topic."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 3: Testing: golden conversations, simulation, judges", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}, {"url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/test-case", "label": "Dialogflow CX: test cases", "why": "Golden conversations with turn-level expectations and coverage.", "m": 5}, {"url": "https://arxiv.org/abs/2406.12045", "label": "tau-bench", "why": "Simulated users, tools and policies; pass^k.", "m": 30}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-test-a-conversational-system-before-release"}]}, {"group": "NLP and text classification", "blurb": "The map of the field, then classification at depth: the ladder, metrics, out-of-scope, imbalance, calibration, latency. Taught in wc25 and wc26.", "items": [{"q": "Give me the map of NLP in two minutes.", "short": "The map", "tests": "Breadth: where everything sits, and why it moved.", "a": ["I think of it in three layers. Representations: one-hot, bag of words and TF-IDF, then static embeddings like word2vec, then contextual ones from BERT, and sentence embeddings on top. Tasks: classification, sequence labelling like NER, question answering, summarisation, translation, retrieval, dialogue, information extraction. And how it's evaluated: precision and recall, BLEU and ROUGE, perplexity, and now human and LLM judges.", "The eras go rules, then statistical models on hand-built features, Naive Bayes, logistic regression, HMMs and CRFs, then neural sequence models with attention, then the Transformer in 2017. BERT made pretrain-then-fine-tune standard, and scaling decoders gave us LLMs that do most tasks from a prompt. Each step replaced feature engineering with learned representations.", "Conversational AI is a stack over that map: intent classification and NER in front, retrieval for knowledge, an LLM for generation and tool calls, plus state and evaluation. In most assistants I've seen, classification and embeddings sit in front of the LLM as routers and guards."], "land": "Representations, tasks, evaluation; rules to statistics to neural to Transformers to LLMs; assistants are a stack over it.", "probes": ["Where are rules still the right answer?", "What did attention fix in seq2seq?", "Is perplexity a quality metric?"], "parts": [{"title": "Model eras", "items": ["**Rules and regexes:** precise and brittle; still right for narrow, high-precision cases like IDs.", "**Statistical:** Naive Bayes, logistic regression, HMMs, CRFs, n-gram language models.", "**Neural:** RNN, LSTM, GRU; CNNs for text; seq2seq with attention, which removed the fixed-vector bottleneck.", "**Transformers:** encoders (BERT, RoBERTa, DeBERTa), decoders (GPT, Llama), encoder-decoders (T5, BART).", "**LLMs:** large decoders, pretrained, then instruction- and preference-tuned."]}], "notes": ["Perplexity measures a language model, not task quality.", "At UIC your coursework included Advanced NLP; you built a Transformer from scratch for English-German translation."], "learn": {"read": [{"url": "../BASELINE.html#/nlp", "label": "Baseline: NLP and conversational AI", "why": "The whole field, by cluster."}, {"url": "https://huggingface.co/learn/llm-course/chapter1/2", "label": "Hugging Face LLM course: NLP and LLMs", "why": "A short orientation.", "m": 10}, {"url": "../index.html#/w/wc25", "label": "Session wc25: The map of NLP, step 5: Draw the map cold, then say it", "why": "Where every task, representation and model era sits."}], "figs": [], "sdLinks": []}, "id": "q-give-me-the-map-of-nlp-in-two-minutes"}, {"q": "Classify 200 intents with 50 examples each. What do you do?", "short": "200 intents, 50 each", "tests": "The ladder, with judgement about where to stop.", "a": ["Baseline first: TF-IDF and logistic regression, because it tells me how hard the problem really is in a few seconds of training. Then sentence embeddings with a logistic head, then SetFit or a fine-tuned small encoder. Ten thousand examples is plenty for fine-tuning.", "With 200 intents, similar ones will collide, so the confusion matrix matters more than the overall score: merge or clarify those. If latency allows, embedding kNN gets the top ten candidate intents and a reranker or an LLM picks among them.", "Stratified held-out test set, macro-F1 and per-intent recall, and a none class from day one. I'd only move up the ladder when the next rung measurably beats the one below on that test set."], "land": "TF-IDF baseline, embeddings plus a head, then SetFit or a small encoder; watch collisions; macro-F1.", "probes": ["Why start with TF-IDF?", "Fine-tuning hyperparameters?", "Multi-label instead?"], "parts": [{"title": "The ladder, cheapest first", "items": ["**TF-IDF + logistic regression / linear SVM / Naive Bayes:** seconds, CPU, interpretable.", "**fastText:** word and subword n-grams with a linear layer; very fast.", "**Frozen sentence embeddings + logistic head or kNN:** strong with little data, cheap to retrain, easy to add a class.", "**SetFit:** contrastive fine-tuning on pairs, then a head; competitive at 8 to 64 examples per class.", "**Fine-tuned encoder (BERT, RoBERTa, DeBERTa; DistilBERT for speed):** best with hundreds to thousands per class. Typical: learning rate 2e-5 to 5e-5, batch 16 to 32, 2 to 4 epochs, warmup.", "**Zero-shot NLI:** each label as a hypothesis; no data, slow, weak on fine-grained labels.", "**LLM prompting:** zero training, changing labels, cold start; latency and cost per call.", "**LoRA-tuned LLM:** many examples, LLM quality, stable labels; often distilled later into an encoder."]}, {"title": "When to pick which", "items": ["Under 50 examples and labels change often: LLM prompting or SetFit.", "50 to 500 per class, stable, tight latency: embeddings plus a head, or SetFit.", "Thousands of examples, under about 20 ms: a fine-tuned small encoder.", "Hundreds of overlapping labels: retrieve candidate labels by embedding, then a reranker or LLM chooses."]}], "notes": ["The fine-tuning hyperparameters are typical values from memory in the research, not from a source: say 'typically'."], "swaps": [{"when": "If they ask about multi-label", "line": "Then it's a sigmoid per label with binary cross-entropy instead of one softmax, a threshold per label, and per-label F1. Subset accuracy only if the product needs every label right at once."}], "learn": {"read": [{"url": "../BASELINE.html#/nlp/text-classification", "label": "Baseline: text classification", "why": "The ladder."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 1: The classification ladder, cheapest first", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://web.stanford.edu/~jurafsky/slp3/4.pdf", "label": "SLP3, ch. 4: Logistic Regression and Text Classification", "why": "Skim: features, evaluation, regularisation.", "m": 30}, {"url": "https://huggingface.co/docs/transformers/tasks/sequence_classification", "label": "Hugging Face: text classification with the Trainer", "why": "DistilBERT fine-tuned end to end.", "m": 15}, {"url": "https://huggingface.co/blog/setfit", "label": "Hugging Face: SetFit", "why": "Few-shot classification without prompts.", "m": 10}], "figs": [], "sdLinks": []}, "id": "q-classify-200-intents-with-50-examples-each-what-do-you-do"}, {"q": "TF-IDF: what does it do, and when is it still the right tool?", "short": "TF-IDF", "tests": "The classic baseline, understood, with a real use.", "a": ["It weights a term by how often it appears in a document times the inverse of how many documents contain it, usually the log of that. So 'the' counts for almost nothing, and a word that's frequent here but rare elsewhere counts a lot.", "It's still the right tool as a cheap, interpretable baseline for classification and for sparse retrieval, when vocabulary is the signal and the data is small: product codes, error messages, domain jargon. Where it fails is synonyms and word order, which is what dense embeddings fix.", "And they combine well. In MetaRAG we used TF-IDF weighted embeddings with recursive chunking, and that got 82.5% precision against a 73.3% baseline. I think hybrid sparse plus dense beats either alone more often than people expect."], "land": "Frequency here times rarity elsewhere; still the baseline and the sparse half of hybrid search.", "probes": ["How does BM25 differ?", "Why the log?", "How exactly did MetaRAG weight the embeddings?"], "notes": ["BM25 adds term-frequency saturation and document-length normalisation to the same idea.", "Before Friday, check in the MetaRAG code or paper exactly how the TF-IDF weights enter the embedding, so you can say it in one sentence if asked. Don't guess on the call."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/bow-tfidf", "label": "Baseline: bag of words and TF-IDF", "why": "The sparse representations."}, {"url": "../SYSTEM%20DESIGN.html#/patterns/search/hybrid-rerank", "label": "Guide: hybrid search and reranking", "why": "Sparse and dense together."}, {"url": "../index.html#/w/wc25", "label": "Session wc25: The map of NLP, step 1: Foundations and representations", "why": "Where every task, representation and model era sits."}, {"url": "https://web.stanford.edu/~jurafsky/slp3/4.pdf", "label": "SLP3, ch. 4: Logistic Regression and Text Classification", "why": "Skim: features, evaluation, regularisation.", "m": 30}], "figs": [], "sdLinks": []}, "id": "q-tf-idf-what-does-it-do-and-when-is-it-still-the-right-tool"}, {"q": "How do you handle out-of-scope queries?", "short": "Out-of-scope", "tests": "Treating 'none of the above' as a first-class class.", "a": ["As a first-class case, not an afterthought. The CLINC150 paper showed classifiers do well on supported intents and poorly on out-of-scope ones, so it needs its own design.", "I'd add an explicit none class trained on real and synthetic off-topic queries, especially near misses like 'I want to buy a book' in a flight bot, plus greetings, bare yes and no, and bare numbers. Calibrate the confidence with temperature scaling and set a threshold that hits a target in-scope accuracy. Add an embedding-distance check, distance to the nearest class centroid, as a second signal, and send the borderline cases to an LLM or a person.", "And measure it properly: out-of-scope recall and the false-accept rate at a fixed in-scope accuracy, not overall accuracy, which hides it completely."], "land": "A trained none class with near misses, a calibrated threshold, a distance check, borderline to an LLM.", "probes": ["Max softmax is a weak signal: why?", "Where do you get out-of-scope examples?", "Why are LLMs better at it?"], "parts": [{"title": "Detectors, from simple up", "items": ["**Max softmax with a threshold:** the baseline; needs calibration.", "**An explicit none class:** often the most reliable.", "**Distance to class centroids or kNN in embedding space;** Mahalanobis distance on features.", "**Ensemble disagreement.**", "**An LLM judge** for the borderline band."]}], "notes": ["Platforms: CLU's None intent with a score threshold (not applied during evaluation); Dialogflow CX's default negative intent; Lex's AMAZON.FallbackIntent.", "In the 2026 preprint the LLM's out-of-scope recall was 85.6 against 58.1 for the fine-tuned encoder: the main reason to route uncertain turns to one."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/out-of-scope", "label": "Baseline: out-of-scope detection", "why": "Detectors and how to measure them."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 2: Imbalance, calibration and out-of-scope", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://arxiv.org/abs/1909.02027", "label": "CLINC150: intent classification and out-of-scope prediction", "why": "Classifiers do well in scope and poorly on out-of-scope.", "m": 15}, {"url": "https://arxiv.org/abs/1706.04599", "label": "On calibration of modern neural networks", "why": "Overconfidence, ECE, temperature scaling.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-how-do-you-handle-out-of-scope-queries"}, {"q": "Your classes are 100 to 1 imbalanced. What do you try, in order?", "short": "Imbalance", "tests": "Cheapest effective fix first, and the right metric.", "a": ["First fix the evaluation: macro-F1, per-class recall and precision-recall curves, because accuracy will look great while the rare class is ignored.", "Then class weights in the loss, the cheapest change. Then oversampling the rare class or undersampling the common one, on the training set only, never on validation or test. Then a per-class threshold tuned on validation to hit a target recall, which is often the highest-value fix of all. Focal loss if easy examples swamp training.", "And check the rare-class labels are clean, and collect more of them with active learning. Fixing a few percent of bad labels often beats a bigger model."], "land": "Fix the metric, then weights, resampling, per-class thresholds, focal loss; clean and collect the rare class.", "probes": ["Why not resample the test set?", "What does focal loss do?", "How does oversampling overfit?"], "notes": ["Oversampling duplicates can overfit to those exact examples.", "Focal loss (Lin et al., from object detection) down-weights easy examples so the rare, hard ones dominate the gradient."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/text-classification", "label": "Baseline: text classification", "why": "Imbalance."}, {"url": "../BASELINE.html#/nlp/classification-metrics", "label": "Baseline: classification metrics", "why": "Precision-recall curves."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 2: Imbalance, calibration and out-of-scope", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://arxiv.org/abs/1708.02002", "label": "Focal loss", "why": "Down-weights easy examples.", "m": 20}], "figs": [], "sdLinks": []}, "id": "q-your-classes-are-100-to-1-imbalanced-what-do-you-try-in-orde"}, {"q": "Macro or micro F1, and when does accuracy lie?", "short": "Metrics", "tests": "Choosing the metric that matches the product.", "a": ["Precision is 'of what I flagged, how much was right'; recall is 'of what was there, how much I found'; F1 is their harmonic mean. Micro-F1 pools every decision, so the big classes dominate. Macro-F1 averages per-class F1, so every class counts equally.", "Accuracy lies under imbalance. If 95% of traffic is one intent, a model that always predicts it scores 95% accuracy and near-zero macro-F1.", "For an assistant I'd report both averages plus per-intent recall, and weight by business cost where I can: missing a fraud report isn't the same as missing a greeting."], "land": "Micro pools, macro averages per class; accuracy lies under imbalance; report per-intent recall.", "probes": ["When would you prefer micro?", "Why the harmonic mean?", "What's a precision-recall trade-off in an assistant?"], "notes": ["Micro-F1 equals accuracy for single-label multi-class, which is why it hides rare classes."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/classification-metrics", "label": "Baseline: classification metrics", "why": "Macro, micro and the confusion matrix."}, {"url": "../BASELINE.html#/ml/evaluation-splits", "label": "Baseline: evaluation and splits", "why": "Precision and recall in the ML field."}, {"url": "../index.html#/w/wc25", "label": "Session wc25: The map of NLP, step 4: Evaluation: what each metric measures and hides", "why": "Where every task, representation and model era sits."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/evaluation-metrics", "label": "Microsoft CLU: evaluation metrics", "why": "Precision, recall, F1, the confusion matrix, the None threshold.", "m": 12}], "figs": [], "sdLinks": []}, "id": "q-macro-or-micro-f1-and-when-does-accuracy-lie"}, {"q": "Why does calibration matter, and how do you fix it?", "short": "Calibration", "tests": "Knowing that every routing rule depends on it.", "a": ["A model is calibrated if, when it says 80% confident, it's right about 80% of the time. Modern neural networks are overconfident; Guo and colleagues showed it in 2017. And every downstream rule, route, confirm, fall back, escalate, reads that confidence, so a miscalibrated model makes every threshold wrong.", "Measure it with a reliability diagram and expected calibration error. The cheap fix is temperature scaling: divide the logits by one scalar fitted on a validation set. It doesn't change any prediction, only the confidence.", "I'd recalibrate after every retrain. That's also why a platform's score isn't a probability: Lex says its scores are comparative, and CLU warns of wrong intents at 1.00."], "land": "Confidence must mean what it says; every threshold depends on it; temperature scaling, refitted each retrain.", "probes": ["Why are networks overconfident?", "What's ECE?", "Does temperature scaling change accuracy?"], "notes": ["ECE: bin predictions by confidence, then average the gap between confidence and accuracy in each bin, weighted by bin size."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/classification-metrics", "label": "Baseline: classification metrics", "why": "Calibration."}, {"url": "../BASELINE.html#/nlp/out-of-scope", "label": "Baseline: out-of-scope detection", "why": "Thresholds that depend on it."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 2: Imbalance, calibration and out-of-scope", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://arxiv.org/abs/1706.04599", "label": "On calibration of modern neural networks", "why": "Overconfidence, ECE, temperature scaling.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-why-does-calibration-matter-and-how-do-you-fix-it"}, {"q": "How would you reduce the latency of a BERT classifier?", "short": "BERT latency", "tests": "Practical serving, in order of effort.", "a": ["In order of effort: truncate the input to what you need, use dynamic padding and length-bucketed batching, export to ONNX or TensorRT, run in fp16 or int8, then distil into a smaller model like DistilBERT or MiniLM.", "Around that, cache frequent inputs, and use a cascade: a cheap model handles the confident cases and the big one only sees the rest.", "And measure p95 on the real hardware before and after. At UIC I deployed an audio model at 150 milliseconds p95 with INT8 quantisation, so I've done that step on real hardware."], "land": "Truncate and batch, export, quantise, distil; cache and cascade; measure p95 on real hardware.", "probes": ["What does int8 cost in accuracy?", "How does distillation work?", "Where does the time go in a BERT forward pass?"], "notes": ["Distillation trains a small student to match the big teacher's output probabilities, not only the labels."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/text-classification", "label": "Baseline: text classification", "why": "Serving."}, {"url": "../BASELINE.html#/inference/quantization", "label": "Baseline: quantisation", "why": "What int8 changes."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 1: The classification ladder, cheapest first", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://lilianweng.github.io/posts/2023-01-10-inference-optimization/", "label": "Lilian Weng: inference optimisation", "why": "KV cache cost, distillation, quantisation.", "m": 9}], "figs": [], "sdLinks": []}, "id": "q-how-would-you-reduce-the-latency-of-a-bert-classifier"}, {"q": "What is SetFit, and why does it work with so few examples?", "short": "SetFit", "tests": "A modern few-shot method, understood.", "a": ["SetFit fine-tunes a sentence transformer contrastively on pairs made from your few labelled examples, same class pulled together, different classes pushed apart, then trains a logistic head on the resulting embeddings.", "It works because a handful of examples per class makes a lot of pairs, and the encoder already starts with good semantics, so it only has to bend the space a little. No prompts, quick to train, and it's competitive with much bigger models at 8 to 64 examples per class.", "It's the classifier in the Amazon hybrid paper: SetFit handles the confident turns and the LLM the uncertain ones. For a new intent with little traffic, I think it's the first thing I'd try after a TF-IDF baseline."], "land": "Contrastive pairs on a sentence encoder, then a head; many pairs from few examples.", "probes": ["How many pairs from 8 examples per class?", "How does it compare to prompting an LLM?"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/text-classification", "label": "Baseline: text classification", "why": "Few-shot methods."}, {"url": "../BASELINE.html#/nlp/sentence-embeddings", "label": "Baseline: sentence embeddings", "why": "The contrastive training it uses."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 1: The classification ladder, cheapest first", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://huggingface.co/blog/setfit", "label": "Hugging Face: SetFit", "why": "Few-shot classification without prompts.", "m": 10}], "figs": [], "sdLinks": []}, "id": "q-what-is-setfit-and-why-does-it-work-with-so-few-examples"}, {"q": "Your model scores 92% on the test set but poorly in production. Why?", "short": "Test vs production", "tests": "Debugging the gap between offline and online.", "a": ["Most likely distribution shift: new phrasing, new users, a new product. Or the test set is flawed, with label noise or leakage from training. Or a prior shift, where the class balance in production differs from the test set.", "I'd sample production traffic, label it, and score the model on that. Compare embedding distributions between training and production to see the shift. And check preprocessing: a mismatch between how text is cleaned in training and in serving causes this more often than people admit.", "Then the fix is the loop: production samples into training, a time-based split so the test set looks like the future, and monitoring on the live mix. It's the same lesson as alfred_'s test set: cases from real production, not from what we imagined."], "land": "Shift, a flawed test set, or a prior shift; label production samples, compare distributions, check preprocessing.", "probes": ["How would you detect leakage?", "What's a time-based split?"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/text-classification", "label": "Baseline: text classification", "why": "Data, leakage and shift."}, {"url": "../BASELINE.html#/nlp/error-analysis", "label": "Baseline: error analysis", "why": "Production samples."}, {"url": "../index.html#/w/wc30", "label": "Session wc30: Error analysis and production improvements, step 5: Experiments, drift, release and rollback", "why": "Confusion, failure taxonomy, KPIs, A/B tests, drift."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}], "figs": [], "sdLinks": []}, "id": "q-your-model-scores-92-on-the-test-set-but-poorly-in-productio"}]}, {"group": "Embeddings", "blurb": "Why embeddings work, how sentence embeddings are trained, choosing a model, similarity, search and failure modes. Taught in wc26.", "items": [{"q": "Why do embeddings work?", "short": "Why they work", "tests": "The idea under every vector, in plain words.", "a": ["The distributional hypothesis: words used in similar contexts have similar meanings. Train a model to predict context and it's forced to put similar words near each other, so the geometry ends up encoding meaning. Nobody puts the meaning in; it falls out of the objective.", "Word2vec is the clean example. Skip-gram predicts the context words from the centre word. Instead of a softmax over the whole vocabulary, negative sampling turns it into a binary task: raise the score of the true pair, lower it for a few random words. That makes training cheap, and the learned vectors are the embeddings.", "Sentence embedding models extend the same idea with a contrastive objective: texts that should match are trained to be close."], "land": "Similar contexts, similar meanings; predicting context forces the geometry.", "probes": ["Skip-gram or CBOW?", "Why negative sampling?", "GloVe and fastText, how do they differ?"], "parts": [{"title": "Three static models", "items": ["**word2vec (2013):** skip-gram or CBOW, negative sampling, subsampling of frequent words. Typical: 300 dimensions, window about 5.", "**GloVe (2014):** factorises a global co-occurrence matrix so dot products approximate log co-occurrence counts.", "**fastText:** a word is the sum of its character n-gram vectors, so it handles rare words, typos and unseen words."]}], "figs": ["embed"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/word-embeddings", "label": "Baseline: word embeddings", "why": "word2vec, GloVe, fastText."}, {"url": "../BASELINE.html#/ml/embeddings", "label": "Baseline: embeddings (ML field)", "why": "The core topic."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 3: Word embeddings: word2vec, GloVe, fastText", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://jalammar.github.io/illustrated-word2vec/", "label": "Jay Alammar: the illustrated word2vec", "why": "Skip-gram, negative sampling, the window.", "m": 35}, {"url": "https://web.stanford.edu/~jurafsky/slp3/5.pdf", "label": "SLP3, ch. 5: Embeddings", "why": "The distributional hypothesis and word2vec.", "m": 45}], "figs": ["embed"], "sdLinks": []}, "id": "q-why-do-embeddings-work"}, {"q": "Static or contextual embeddings: what's the difference?", "short": "Static and contextual", "tests": "Why BERT changed things.", "a": ["Static embeddings give one vector per word type, so 'bank' has one vector whether it's a river or money. Contextual models, ELMo with a bidirectional LSTM and then BERT with a Transformer encoder, compute a vector per occurrence from the whole sentence, so the sense comes from context.", "Contextual vectors are better for most tasks, but they cost a model forward pass per input. Static ones are a lookup.", "For an assistant that matters for words like 'card', 'balance' or 'charge', which mean different things in different intents."], "land": "One vector per word versus one per occurrence; context resolves the sense.", "probes": ["What did ELMo add?", "When would you still use static vectors?"], "learn": {"read": [{"url": "../BASELINE.html#/nlp/word-embeddings", "label": "Baseline: word embeddings", "why": "Static versus contextual."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 4: Contextual and sentence embeddings, and contrastive training", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://jalammar.github.io/illustrated-bert/", "label": "Jay Alammar: the illustrated BERT, ELMo and co.", "why": "From ELMo to BERT, masked LM, feature extraction.", "m": 25}], "figs": [], "sdLinks": []}, "id": "q-static-or-contextual-embeddings-what-s-the-difference"}, {"q": "Why can't you mean-pool BERT for sentence similarity?", "short": "Sentence embeddings", "tests": "How sentence embeddings are trained, at depth.", "a": ["Because BERT was trained to predict masked tokens, not to compare sentences. Its pooled vectors are anisotropic, packed into a narrow cone, so almost every cosine is high and the similarities don't line up well with meaning.", "Sentence-BERT fixed that by training a siamese BERT on sentence pairs so cosine works; it also took a search over 10,000 sentences from about 65 hours to about 5 seconds. The modern recipe is contrastive: pull a query and its positive together, push others apart, with the InfoNCE loss. In-batch negatives make every other example in the batch a free negative, so big batches help, and hard negatives, similar but wrong, help most.", "SimCSE showed even dropout noise works as the augmentation, unsupervised, and that contrastive training spreads the vectors out."], "land": "BERT wasn't trained to compare; contrastive training with in-batch and hard negatives makes cosine meaningful.", "probes": ["Write InfoNCE in words.", "What does temperature do in the loss?", "What's a hard negative for an intent classifier?"], "parts": [{"title": "InfoNCE in words", "items": ["For each query: a softmax over its similarity to one positive and many negatives, each divided by a temperature.", "The loss is minus the log of the positive's share.", "A low temperature (around 0.05 to 0.1, from memory) penalises hard negatives sharply."]}], "notes": ["Hard negatives for an assistant: utterances from the intent it's most often confused with."], "learn": {"read": [{"url": "../BASELINE.html#/nlp/sentence-embeddings", "label": "Baseline: sentence embeddings", "why": "Contrastive training."}, {"url": "../index.html#/w/wc26", "label": "Session wc26: Text classification and embeddings, step 4: Contextual and sentence embeddings, and contrastive training", "why": "The ladder, metrics, out-of-scope, and how embeddings are trained."}, {"url": "https://arxiv.org/abs/1908.10084", "label": "Sentence-BERT", "why": "Siamese BERT so cosine means something.", "m": 25}, {"url": "https://lilianweng.github.io/posts/2021-05-31-contrastive/", "label": "Lilian Weng: contrastive representation learning", "why": "Skim InfoNCE, in-batch negatives, SBERT, SimCSE.", "m": 20}], "figs": [], "sdLinks": []}, "id": "q-why-can-t-you-mean-pool-bert-for-sentence-similarity"}, {"q": "How do you choose an embedding model?", "short": "Choosing a model", "tests": "A method, not a leaderboard rank.", "a": ["Shortlist from MTEB, filtered to the task and the language I need, retrieval or classification or clustering. Then check the practical things: maximum input length, dimension, licence, hosting, la
