@media (max-width: 640px) { .tl-list li { grid-template-columns: 1fr; gap: 0; } }
.live-phase { border-top: var(--hair); padding: var(--s2) 0; }
.live-phase > summary { cursor: pointer; font-weight: var(--w-strong); list-style: none; display: flex; gap: var(--s3); align-items: baseline; }
.live-phase > summary::-webkit-details-marker { display: none; }
.lp-n { color: var(--muted); font-size: var(--fs-sm); min-width: 1.2em; }
.lp-body { padding: var(--s2) 0 var(--s3) var(--s5); }
.lp-dec { margin: var(--s3) 0 var(--s4); }
.lp-opts { margin: var(--s1) 0 var(--s2); padding-left: var(--s5); color: var(--soft); }
.lp-prompt { white-space: pre-wrap; }
.lp-copy { margin: calc(-1 * var(--s2)) 0 var(--s3); }
.live-ask { margin: var(--s2) 0 var(--s4); padding-left: var(--s4); border-left: 2px solid var(--rule); color: var(--soft); }
.ln-task, .ln-gate { margin: var(--s4) 0; }
.ln-task .acts { align-items: center; }
.ln-spot { padding-left: var(--s5); }
.ln-spot li { margin-bottom: var(--s5); }
.ln-spot .ln-lang { font-size: var(--fs-sm); color: var(--muted); margin-top: var(--s2); }
.ln-ta { width: 100%; min-height: 120px; font: inherit; padding: var(--s2); border: var(--hair); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); margin: var(--s2) 0; }
.ln-beats { padding-left: var(--s5); } .ln-beats li { margin: 0 0 var(--s1); }
.ln-done { font-weight: var(--w-strong); }
.ln-more { font-size: var(--fs-sm); color: var(--muted); }
.ln-table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); margin: 0 0 var(--s3); }
.ln-table th, .ln-table td { text-align: left; vertical-align: top; padding: var(--s1) var(--s2); border-bottom: var(--hair); }
.ln-table th { color: var(--muted); font-weight: var(--w-strong); }
.mq { margin: 0 0 var(--s3); }
.mq-q { font-weight: var(--w-strong); }
.mq-opts { display: grid; gap: 6px; }
.mq-o { display: flex; gap: var(--s2); text-align: left; font: inherit; padding: var(--s2) var(--s3); border: var(--hair); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); cursor: pointer; }
.mq-o:hover:not(:disabled) { border-color: var(--accent); }
.mq-o:disabled { cursor: default; }
.mq-o.right { border-color: var(--ok); box-shadow: inset 3px 0 0 var(--ok); }
.mq-o.wrong { border-color: var(--warn); box-shadow: inset 3px 0 0 var(--warn); }
.mq-idk { color: var(--muted); }
.mq-k { color: var(--muted); font-weight: var(--w-strong); flex: none; }
.mq-guess { display: inline-block; margin: var(--s2) 0; font-size: var(--fs-sm); color: var(--muted); }
.mq-why { font-size: var(--fs-sm); }
dialog.ln-test { border: 0; border-radius: var(--radius-lg); padding: 0; max-width: min(720px, 94vw); width: 100%; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-float); }
dialog.ln-test::backdrop { background: rgba(0, 0, 0, .4); }
.ln-test-box { padding: var(--s4) var(--s5); max-height: 86vh; overflow: auto; }
.ln-test-head { display: flex; gap: var(--s3); align-items: baseline; margin-bottom: var(--s3); }
.ln-test-head span { color: var(--muted); font-size: var(--fs-sm); flex: 1; }
.onepage { padding-left: var(--s5); max-width: var(--measure); }
.onepage li { margin: 0 0 var(--s2); }
.op-to { font-size: var(--fs-sm); white-space: nowrap; }
@media print { body.print-one main > :not(#onepage), body.print-one header, body.print-one nav, body.print-one aside, body.print-one .op-to, body.print-one #onepage .linkish { display: none !important; } }
.rs-q { padding: var(--s2) 0; border-top: var(--hair); }
.rs-q .qt { display: block; }
.rs-to { display: flex; flex-wrap: wrap; gap: 2px var(--s2); margin-top: 4px; font-size: var(--fs-sm); }
.rs-deep { max-width: var(--measure); margin: 0 0 var(--s2); }
details.pq > summary .rs-brief { max-width: var(--measure); }
.bank-sec { border-left: 3px solid var(--sec); padding: 0 0 0 var(--s5); margin: var(--s7) 0; }
.bank-sec > h2 { display: flex; align-items: baseline; gap: var(--s2) var(--s3); flex-wrap: wrap; margin-top: 0; }
.bank-sec .bank-n { font-size: var(--fs-sm); font-weight: var(--w-regular); color: var(--muted); }
.bank-sec > .hsub { margin-bottom: var(--s3); }
.bank-sec details.pq[open] > summary .qt { color: var(--sec); }
.bank-sec details.pq > summary:hover .qt { color: var(--sec); }
.pq-land { margin: 0 0 var(--s3); color: var(--soft); }
.pq-land b { color: var(--ink); font-weight: var(--w-strong); }
.pq-work .transcript { margin: 0 0 var(--s3); max-width: none; }
.pq-work .swap { border-left-color: var(--rule); }
.pq-work .lab { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); margin: var(--s3) 0 var(--s1); }
.pq-tests { font-size: var(--fs-sm); color: var(--soft); margin: 0 0 var(--s2); }
.pq-tests b { color: var(--ink); font-weight: var(--w-strong); }
details.pq.rev > summary .qt::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: var(--s2); vertical-align: middle; }
@media (max-width: 760px) { .pq-cols, .pq-cols.has-code, .role-cols { grid-template-columns: minmax(0, 1fr); } .pq-cols .cv-col { padding: var(--s3); } }
.c3 { margin: var(--s1) 0 var(--s6); }
.c3-t { font-size: var(--fs-lg); margin: var(--s4) 0 var(--s1); }
.c3-w { display: block; font-size: var(--fs-sm); font-weight: var(--w-regular); color: var(--muted); margin-top: 2px; }
.c3-why { color: var(--soft); margin: var(--s2) 0; }
.c3-how { margin-bottom: var(--s3); }
.c3-q { padding: var(--s2) 0 var(--s2) var(--s3); border-left: 2px solid var(--rule); margin: 0 0 var(--s3); max-width: var(--measure); }
.c3-q .to { display: block; font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); }
.c3-q .q { display: block; font-weight: var(--w-strong); margin: 2px 0 var(--s1); }
.c3-q .lp, .c3-q .wy { display: block; font-size: var(--fs-sm); color: var(--soft); }
.c3-q .lp b, .c3-q .wy b { color: var(--ink); font-weight: var(--w-strong); }
.banks { border-top: var(--hair); margin-top: var(--s1); }
.bank { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--s4); width: 100%; text-align: left; background: none; border: 0;
  border-bottom: var(--hair); padding: var(--s3) 0; color: var(--ink); }
.bank .bt { font-weight: var(--w-strong); grid-column: 1; }
.bank .bb { grid-column: 1; font-size: var(--fs-sm); color: var(--muted); }
.bank .bc { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; }
.bank .bc .rv { color: var(--ok); }
.bank:hover .bt { color: var(--accent); }
.found { margin-top: var(--s1); }
.hit { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: var(--hair); padding: var(--s2) 0; color: var(--ink); }
.hit .hb { display: block; font-size: var(--fs-sm); color: var(--muted); }
.hit:hover { color: var(--accent); }

/* the turn list: one row per turn, on the page and in the panel's rail */
main .turns { list-style: none; margin: var(--s4) 0 0; padding: 0; border-top: var(--hair); max-width: none; }
.turn { display: grid; grid-template-columns: 24px 14px minmax(0, 1fr) auto; align-items: baseline; gap: var(--s1); width: 100%; text-align: left;
  background: none; border: 0; border-bottom: var(--hair); padding: var(--s2) var(--s1); color: var(--ink); }
.turn:hover .tl { color: var(--accent); }
.turn .n { color: var(--muted); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.turn .tw { font-size: var(--fs-xs); font-weight: var(--w-strong); }

/* dialogs float, so they alone carry a shadow */
dialog { width: min(640px, 94vw); border: 0; border-radius: var(--radius-lg); padding: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-float); }
dialog::backdrop { background: rgba(10, 10, 14, .55); }

/* the one-screen panel, shared by mocks and the Prep banks: the list on the left; the item's
   header; then understanding on the page and what to say on a sunken tint, each scrolling on its own */
dialog.convo { width: min(1320px, 96vw); height: min(880px, 92vh); max-width: none; max-height: none; overflow: hidden; }
.cv { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100%; }
.cv-rail { background: var(--bg); border-right: var(--hair); overflow-y: auto; padding: var(--s4) var(--s2) var(--s4) var(--s3); display: flex; flex-direction: column; }
.cv-title { padding: 0 var(--s2) var(--s3); border-bottom: var(--hair); margin-bottom: var(--s2); font-size: var(--fs-sm); line-height: var(--lh-tight); }
.cv-title b { font-weight: var(--w-strong); }
.cv-title span { display: block; color: var(--muted); font-size: var(--fs-xs); margin-top: var(--s1); }
.cv-rail .turn { grid-template-columns: 20px 14px minmax(0, 1fr); border-radius: var(--radius); border-bottom: 0; margin-top: 1px; font-size: var(--fs-sm); line-height: var(--lh-tight); padding: 6px var(--s2); }
.cv-rail .turn .tw { display: none; }
.cv-rail .turn.on { background: var(--accent-soft); }
.cv-rail .turn.on .tl { font-weight: var(--w-strong); }
.cv-keys { margin-top: auto; padding: var(--s3) var(--s2) 0; font-size: var(--fs-xs); color: var(--muted); }

.cv-pane { display: flex; flex-direction: column; min-height: 0; }
.cv-head { padding: var(--s4) 96px var(--s3) var(--s5); border-bottom: var(--hair); flex: none; }
.cv-verdict { margin: var(--s2) 0 0 var(--s4); font-size: var(--fs-sm); color: var(--soft); }
.cv-verdict b { color: var(--ink); font-weight: var(--w-strong); }
.cv-tests { margin: var(--s1) 0 0 var(--s4); font-size: var(--fs-sm); color: var(--muted); }
.cv-tests b { color: var(--soft); font-weight: var(--w-strong); }
.cv-cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--s2); flex: 1; min-height: 0; padding: 0 var(--s4) var(--s4) 0; }
.cv-cols.has-code { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.cv-col { overflow-y: auto; padding: var(--s4) var(--s5) var(--s6); scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.cv-col.cv-say { scrollbar-color: var(--muted) transparent; }
.cv-h { font-size: var(--fs-md); margin: 0 0 var(--s3); }
.cv-col .lab, .sbody .lab { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); margin: var(--s4) 0 var(--s1); }
.cv-part { font-size: var(--fs-md); margin: var(--s5) 0 var(--s1); padding-top: var(--s3); border-top: var(--hair); }
.cv-part-lead { color: var(--soft); margin: 0 0 var(--s1); }
.cv-code { margin: var(--s2) 0 var(--s3); padding: var(--s3); background: var(--code-bg); border-radius: var(--radius); overflow-x: auto;
  font-family: var(--mono); font-size: var(--fs-code); line-height: 1.6; color: var(--code-ink); white-space: pre; }
.cv-code code { background: none; padding: 0; font-size: inherit; color: inherit; }
/* what to say: the one inverse sheet on the screen (dark on the light theme), so the words to
   say never read like the notes beside them. Its labels are the sheet's own ink, dimmed. */
.cv-say { background: var(--ink); color: var(--bg); border-radius: var(--radius-lg); margin-top: var(--s4); }
.cv-say .cv-h, .cv-say .lab, .cv-say .transcript .who, .swap .sw-when, .cv-meta { color: inherit; opacity: .72; }
.cv-say a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
.cv-say .sep { background: var(--muted); }
.cv-say .mk-list li::marker { color: var(--muted); }
.cv-land { margin: 0 0 var(--s4); padding: 0 0 var(--s3); border-bottom: 1px solid var(--muted); }
.cv-land b { font-weight: var(--w-strong); }
.cv-say .transcript { background: transparent; color: inherit; border-radius: 0; margin: 0; padding: 0; max-width: none; }
.cv-say code { background: var(--code-bg); color: var(--code-ink); }
.swap { margin: 0 0 var(--s3); padding-left: var(--s3); border-left: 2px solid var(--muted); }
.swap .sw-when { display: block; font-size: var(--fs-sm); margin-bottom: 2px; }
.swap .sw-line { display: block; }
.cv-meta { margin: var(--s4) 0 0; font-size: var(--fs-xs); }
.cv-rev { font-size: var(--fs-sm); }
.cv-said .reading a { color: var(--ink); }
.cv-col figure { padding: var(--s3); margin: var(--s4) 0 0; }
.cv-col figure svg { min-width: 0; }
.cv-close { position: absolute; top: var(--s3); right: var(--s4); z-index: 2; background: var(--surface); border: var(--hair); color: var(--soft);
  border-radius: var(--radius); padding: 2px var(--s3); font-size: var(--fs-sm); }
.cv-close:hover { color: var(--ink); border-color: var(--muted); }
@media (max-width: 860px) {
  dialog.convo { width: 100vw; height: 100vh; border-radius: 0; }
  .cv { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .cv-rail { max-height: 28vh; border-right: 0; border-bottom: var(--hair); }
  .cv-title { padding-right: 72px; }
  .cv-cols { grid-template-columns: minmax(0, 1fr); overflow-y: auto; padding: 0 var(--s3) var(--s3); }
  .cv-col { overflow: visible; }
  .cv-head { padding: var(--s3) 80px var(--s3) var(--s4); }
}

/* figures are drawn for a light ground, so they sit on the light surface on every theme
   (the light tokens' values: surface, ink, muted, rule) */
figure { margin: var(--s5) 0 var(--s6); padding: var(--s4); background: #FFFDF8; color: #1D1B17; border: 1px solid #E5DDCD; border-radius: var(--radius-lg); overflow-x: auto; }
figure svg { display: block; width: 100%; height: auto; min-width: 620px; }
figcaption { font-size: var(--fs-sm); color: #736D62; margin-top: var(--s3); }
figure .fh { font-weight: var(--w-strong); font-size: var(--fs-sm); margin-bottom: var(--s2); }
/* the tracker's own figures, drawn with its classes */
figure.trk { --faint: #a2a09a; --dim: #6b6a65; --line: #c3c0b7; --ink: #1a1a19; --live: #fffdf5; }
table { width: 100%; border-collapse: collapse; margin: var(--s1) 0; font-size: var(--fs-sm); }
th, td { text-align: left; padding: var(--s2) var(--s3) var(--s2) 0; border-bottom: var(--hair); vertical-align: top; }
th { font-weight: var(--w-strong); color: var(--muted); font-size: var(--fs-xs); }
td:first-child { font-weight: var(--w-strong); }
.tnote { font-size: var(--fs-sm); color: var(--muted); margin: var(--s2) 0 var(--s6); }

/* sessions */
.session .meta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); margin-top: calc(-1 * var(--s3)); }
.chip { color: var(--muted); }
.chip.done { color: var(--ok); }
.session .intro { color: var(--soft); margin: var(--s3) 0; }
.session > h3 { margin: var(--s6) 0 var(--s2); }
.step { border-top: var(--hair); }
.step > summary { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: var(--s3); align-items: start; padding: var(--s3) var(--s6) var(--s3) 0; }
.step > summary .st { font-weight: var(--w-strong); }
.step > summary:hover .st { color: var(--accent); }
.step > summary .sm { color: var(--muted); font-size: var(--fs-sm); padding-top: 2px; white-space: nowrap; }
.tick { width: 18px; height: 18px; border-radius: var(--radius-sm); border: 1.5px solid var(--muted); background: transparent; color: var(--surface);
  display: grid; place-items: center; font-size: var(--fs-xs); margin-top: 3px; padding: 0; }
.tick.on { background: var(--ok); border-color: var(--ok); }
.sbody { padding: 0 0 var(--s5) 30px; }
.step { scroll-margin-top: calc(var(--top) + var(--s2)); }
.sbody2 { margin: 0 0 var(--s5); grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); }
.sbody2 > .cv-said { padding: 0 var(--s4) 0 30px; }
.sbody2 > .cv-said > p.d { margin: 0 0 var(--s3); }
.pts { margin: 0 0 var(--s3); padding-left: var(--s5); }
.pts li { margin: 0 0 var(--s2); padding-left: var(--s1); }
.pts li b { font-weight: var(--w-strong); color: var(--ink); }
.pq-work { align-self: start; position: sticky; top: calc(var(--top) + var(--s3)); background: var(--surface); border: var(--hair); border-radius: var(--radius-lg); padding: var(--s4); }
.pq-work .mine { margin-top: 0; }
.pq-work details.say .transcript { margin-top: var(--s3); }
@media (max-width: 760px) { .sbody2 > .cv-said { padding: 0; } .pq-work { position: static; } }
.sbody > p.d, .sbody > p.point { margin: 0 0 var(--s1); }
.reading { margin: 0; padding: 0; list-style: none; }
.reading li { margin: 0 0 var(--s2); padding-left: var(--s3); position: relative; }
.reading li::before { content: ""; position: absolute; left: 0; top: .75em; width: 5px; height: 1.5px; background: var(--muted); }
.reading a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.reading a:hover { text-decoration-color: var(--ink); }
.reading .w { color: var(--muted); font-size: var(--fs-sm); margin-left: var(--s2); white-space: nowrap; }
.reading .why { display: block; color: var(--soft); font-size: var(--fs-sm); margin-top: 2px; }
.sbody figure { margin: var(--s4) 0 var(--s2); }
details.say { margin-top: var(--s4); }
details.say > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--accent); }
details.say > summary::-webkit-details-marker { display: none; }
details.say > summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin-top: -3px; }
details.say[open] > summary::after { transform: rotate(-135deg); margin-top: 3px; }
details.say > summary:hover { text-decoration: underline; text-underline-offset: 3px; }
details.item > .sbody { padding-left: 0; }
@media (max-width: 700px) { .sbody { padding-left: 0; } }
.session-end { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-top: var(--s5); }
.pager { display: flex; justify-content: space-between; gap: var(--s4); margin-top: var(--s6); padding-top: var(--s4); border-top: var(--hair); }
.pager a { display: flex; flex-direction: column; color: var(--ink); font-weight: var(--w-strong); max-width: 48%; }
.pager a span { font-weight: var(--w-regular); font-size: var(--fs-sm); color: var(--muted); }
.pager a.next { text-align: right; margin-left: auto; }
.pager a:hover { color: var(--accent); text-decoration: none; }

/* quiz: one question at a time */
.dq { padding: var(--s5) var(--s5) var(--s4); }
.dq .dots { display: flex; gap: var(--s1); margin-bottom: var(--s4); }
.dq .dots i { width: 20px; height: 3px; border-radius: 2px; background: var(--rule); }
.dq .dots i.on { background: var(--accent); }
.dq .dots i.got { background: var(--ok); }
.dq .qq { font-size: var(--fs-lg); font-weight: var(--w-strong); line-height: var(--lh-tight); }
.dq .model { margin-top: var(--s4); padding-left: var(--s3); border-left: 2px solid var(--ok); color: var(--soft); }
.dq .model b { display: block; font-size: var(--fs-sm); color: var(--ok); font-weight: var(--w-strong); }
.dq .row { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s4); align-items: center; }
.dq .row .grow { flex: 1; }
.dq .close { background: none; border: 0; color: var(--muted); font-size: var(--fs-sm); }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 var(--s4) var(--s7); }
  nav.side { display: none; }
  main { padding-top: var(--s5); }
  .top-in { padding: 0 var(--s4); gap: var(--s2); }
  .top .loopname, .prog, .count { display: none; }
  .tabs { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs a { padding: 2px 6px 0; white-space: nowrap; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
@media (prefers-reduced-motion: reduce) { details > summary::after { transition: none; } }
</style>
</head>
<body>
<div class="sn-strip"><nav class="sn-top" data-site-nav data-base="../"></nav></div>
<header class="top"><div class="top-in">
  <span class="loopname" id="loopname"></span>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <span class="grow"></span>
  <span class="prog" id="prog"></span>
  <span class="count" id="count"></span>
</div></header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>

<script type="application/json" id="loop-data">{"id": "vanguard", "title": "Vanguard, Conversational AI", "subtitle": "Client interview with Vanguard's team, via Mphasis", "when": "Wednesday 7 October, 3:00 PM", "when_iso": "2026-10-07T15:00:00-04:00", "who": "Vanguard's team: three engineers on the invite (Sai Atukuri, Sai Krishna, Rajaratnam Rathnakumar), with Suruchi Kale optional. Mphasis organises it: Rama (Rajaratnam) sent the invite and the two areas; Mphasis colleagues are on it as optional.", "format": "A client technical interview with the team you would join, most likely scenario-led: 'a bot misclassifies an intent, how do you debug it'. Expect your story first, then questions across the two areas: conversational AI (design, intents and entities, error analysis, production) and deep NLP and LLMs (classification, embeddings, LLM fundamentals, the Transformer).", "bar": "Senior here means answering a scenario with a method: what you'd look at first, the trade-off, and a real example from your work, with the financial-services line held: no advice, authenticated before account data, a licensed person for anything that needs one. Say plainly that you haven't shipped on the classic NLU platforms, and show that the NLP and the error analysis underneath them are yours.", "sessions": [{"id": "wc25", "name": "The map of NLP", "blurb": "The field as one tree: foundations, representations, tasks, model eras and evaluation, and where conversational AI sits on it.", "intro": "Friday's second area asks for strong expertise in NLP, and the fastest way an interviewer sorts that is 'walk me through the field'. This session gives you the map, so every later answer has a place to hang. It ends with the metrics, because every error-analysis question on Friday comes back to them.", "len": "55m", "day": "1", "steps": [{"t": "Foundations and representations: text to units, units to numbers", "m": 12, "out": "Name the layers under every NLP system, and say what gap each rung of the representation ladder closes", "d": "Every NLP system first turns text into units, then units into numbers. Each rung of the representation ladder closes a gap left by the one below it.", "pts": ["Tokenization: normalization and tokenization split text into words, subwords or bytes; LLM cost and quirks with numbers, code and other languages start here", "Morphology: stemming and lemmatization reduce word forms to a base, so 'run, runs, running' share signal; subword tokenization has mostly replaced it", "POS tagging and parsing: POS tagging gives each word a grammatical role, a classic sequence-labelling task; constituency and dependency parsing recover sentence structure, rare in LLM stacks, still used in information extraction", "One-hot and bag of words: one-hot is one dimension per word, huge and sparse, every pair of words equally distant; bag of words counts words with order ignored, strong for topic-like classification", "TF-IDF and n-grams: TF-IDF weights counts by how rare a term is across documents, the default sparse baseline; n-grams count short sequences, so some local order", "Static embeddings: word2vec, GloVe and fastText learn one dense vector per word from co-occurrence, so similar words sit close, but 'bank' has one vector whatever the sentence", "Contextual embeddings: ELMo and BERT give a vector per token that depends on the whole sentence", "Sentence embeddings: one vector per text, trained so similar meanings are close; they drive semantic search, clustering and RAG"], "links": [{"label": "Baseline: the map of NLP and conversational AI", "url": "BASELINE.html#/nlp"}, {"label": "Baseline, NLP: tokenization", "url": "BASELINE.html#/nlp/tokenization"}, {"label": "Baseline, NLP: sentence embeddings", "url": "BASELINE.html#/nlp/sentence-embeddings"}, {"label": "Vanguard prep: TF-IDF, and when it is still the right tool", "url": "interviews/vanguard.html#/prep/q-tf-idf-what-does-it-do-and-when-is-it-still-the-right-tool"}, {"label": "Vanguard prep: static or contextual embeddings", "url": "interviews/vanguard.html#/prep/q-static-or-contextual-embeddings-what-s-the-difference"}], "ans": ["Foundations turn text into units: normalization, tokenization, morphology, POS tags, parsing", "Sparse representations: one-hot, bag of words, TF-IDF, n-grams", "Dense: static embeddings, then contextual (ELMo, BERT), then one vector per sentence", "Each rung closes a gap: no similarity, no synonyms, no context, no single vector per text"], "close": [{"k": "why", "q": "Why does a static embedding fail on 'bank', and what fixes it?", "a": "It gives one vector per word type, so the river sense and the money sense share it. A contextual model such as BERT computes a vector per occurrence from the whole sentence, so the sense comes from context."}], "sdLinks": [], "read": [{"label": "Hugging Face LLM course, ch. 1: NLP and large language models, the whole page", "url": "https://huggingface.co/learn/llm-course/chapter1/2", "m": 10}, {"label": "Baseline, NLP: bag of words and TF-IDF, the short explainer", "url": "BASELINE.html#/nlp/bow-tfidf", "m": 3}, {"label": "Baseline, NLP: word embeddings, the short explainer", "url": "BASELINE.html#/nlp/word-embeddings", "m": 3}], "figs": ["nlpMap", "reprLadder"]}, {"t": "Tasks and model eras", "m": 12, "out": "Walk me through the history of NLP in two minutes", "d": "The tasks are what NLP is used for; the eras are how the methods changed. The thread to say: each era replaced feature engineering with learned representations.", "pts": ["Classification and labelling: text classification (intent, sentiment, topic, spam); sequence labelling and NER give a label per token", "QA, summarization, translation: QA is an extractive span, abstractive, or open-domain with retrieval; in summarization faithfulness is the main failure; then machine translation and open generation", "Retrieval and ranking: BM25, dense embeddings and rerankers, the front half of RAG", "Dialogue and extraction: task-oriented dialogue with intents and slots, or open-domain chat; information extraction into records; coreference and entity linking", "Rules and statistical: rules and regexes are precise and brittle, still right for narrow high-precision cases; then Naive Bayes and logistic regression for classification, HMMs and CRFs for tagging, n-gram language models, all on hand-built features", "Neural: RNN, LSTM, GRU and CNNs for text, then seq2seq with attention, which removed the fixed-vector bottleneck; machine translation is the task that produced seq2seq, attention and the Transformer", "Transformers, 2017: encoder-only (BERT, RoBERTa, DeBERTa) for understanding, decoder-only (GPT, Llama) for generation, encoder-decoder (T5, BART) for input-to-output tasks; BERT (2018) made pretrain then fine-tune the standard", "LLMs: very large decoders pretrained on next-token prediction, then instruction-tuned and preference-tuned, one model doing many tasks from a prompt"], "links": [{"label": "Baseline: the map of NLP and conversational AI", "url": "BASELINE.html#/nlp"}, {"label": "Baseline, NLP: text classification", "url": "BASELINE.html#/nlp/text-classification"}, {"label": "Baseline, NLP: sequence labelling", "url": "BASELINE.html#/nlp/sequence-labelling"}, {"label": "Baseline, NLP: LLM training", "url": "BASELINE.html#/nlp/llm-training"}, {"label": "Baseline, ML: Transformers and attention", "url": "BASELINE.html#/ml/transformers"}, {"label": "Vanguard prep: the map of NLP in two minutes", "url": "interviews/vanguard.html#/prep/q-give-me-the-map-of-nlp-in-two-minutes"}], "ans": ["Rules, then statistical models on hand-built features: n-grams, Naive Bayes, HMMs, CRFs", "Word embeddings and RNN or LSTM seq2seq; attention removed the fixed-vector bottleneck", "The Transformer in 2017; BERT in 2018 made pretrain then fine-tune the standard", "GPT-style scaling gave LLMs that do many tasks from a prompt", "The thread: each step replaced feature engineering with learned representations"], "close": [{"k": "short", "q": "Why does machine translation matter so much in this history?", "a": "It is the task that produced seq2seq, attention and the Transformer. The architecture everything runs on now was built to translate."}], "sdLinks": [], "read": [{"label": "Lilian Weng, Generalized Language Models: ELMo to BERT, GPT and T5; read to the end of BERT", "url": "https://lilianweng.github.io/posts/2019-01-31-lm/", "m": 20}, {"label": "Hugging Face LLM course: How do Transformers work? The history and the three shapes", "url": "https://huggingface.co/learn/llm-course/chapter1/4", "m": 15}, {"label": "Baseline, NLP: encoders and decoders, the short explainer", "url": "BASELINE.html#/nlp/encoders-decoders", "m": 3}], "figs": ["nlpMap", "llmLifecycle"]}, {"t": "Where conversational AI sits", "m": 8, "out": "Where does conversational AI sit on the NLP map, and which tasks does one assistant turn use", "d": "Conversational AI is a stack over the NLP map, not a branch of it. One assistant turn uses several tasks at once.", "pts": ["One turn: the intent is text classification, entities and slots are sequence labelling, an FAQ answer is retrieval, the reply and any tool call are generation", "Around the tasks: dialogue state (what has been collected so far), safety and evaluation; for voice, ASR and TTS at each end", "Classic platforms: Dialogflow CX, Lex, CLU, Rasa, Kore.ai and Cognigy are classification plus labelling plus a state machine", "LLM-first stacks: one model folds understanding and generation together, but classifiers and embeddings still sit in front as routers and guards because they are fast and cheap", "Your system: alfred_'s 'Inbound message (SMS/web) routed through intent classification → decision layer → callable tools', this map in miniature"], "links": [{"label": "Baseline: the map of NLP and conversational AI", "url": "BASELINE.html#/nlp"}, {"label": "Baseline, NLP: dialogue state", "url": "BASELINE.html#/nlp/dialogue-state"}, {"label": "Baseline, NLP: conversation design", "url": "BASELINE.html#/nlp/conversation-design"}, {"label": "Baseline, audio: speech recognition", "url": "BASELINE.html#/audio/asr"}, {"label": "Vanguard prep: classic NLU or an LLM", "url": "interviews/vanguard.html#/prep/q-classic-nlu-or-an-llm-for-intent-classification"}, {"label": "Vanguard prep: how your background fits", "url": "interviews/vanguard.html#/prep/q-how-does-your-background-fit-this-role"}], "ans": ["A stack over the map, not a branch of it", "Intent is classification, entities are sequence labelling, FAQ is retrieval, the reply and tool calls are generation", "Plus dialogue state, safety and evaluation; ASR and TTS at the ends for voice", "LLM-first stacks still keep classifiers and embeddings in front as routers and guards"], "close": [{"k": "why", "q": "Why do LLM-first assistants still keep a small classifier in front of the model?", "a": "It answers in milliseconds on a CPU, against about a second for an LLM call. It routes the confident cases, guards scope, and sends only uncertain or open-ended turns to the LLM."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/hld", "label": "Enterprise virtual assistant, high-level design", "why": "Where each NLP task sits inside one assistant turn."}], "read": [{"label": "Baseline, NLP: intents and entities, the short explainer", "url": "BASELINE.html#/nlp/intents-entities", "m": 3}, {"label": "Baseline, NLP: classic NLU and LLMs together, the short explainer", "url": "BASELINE.html#/nlp/nlu-llm-hybrid", "m": 3}], "figs": ["vaTurn", "voicePipeline"]}, {"t": "Evaluation: what each metric measures and hides", "m": 13, "out": "When does accuracy lie, and what do you report instead for an intent classifier", "d": "Every error-analysis question comes back to what a metric measures and what it hides. Know when accuracy lies and what to report instead.", "pts": ["Accuracy: fine when classes are balanced; with 95% of data in one class, always predicting it scores 95% accuracy and near-zero macro-F1", "Precision and recall: precision is 'of what I flagged, how much was right'; recall is 'of what was there, how much I found'", "F1: the harmonic mean of the two, so it drops when either one is low", "Micro and macro: micro pools every decision, so big classes dominate; macro averages per-class F1, so every class counts equally; report macro for imbalanced intent sets, which they always are, with per-class recall and a confusion matrix", "Perplexity: exp of the average negative log-likelihood; how well a language model predicts text, not whether its answers are right", "BLEU, ROUGE, exact match: BLEU and ROUGE count n-gram overlap with a reference for translation and summarization, cheap and weakly tied to quality; exact match and token F1 score extractive QA", "Judges: human and LLM judges are the practical standard for open-ended output; they need rubrics, position-bias controls and calibration against humans", "MT-bench: strong LLM judges agreed with human preferences over 80% of the time, about the human-to-human rate, with position, verbosity and self-enhancement biases"], "links": [{"label": "Baseline, AI: evaluation", "url": "BASELINE.html#/ai/evaluation"}, {"label": "Baseline, AI: LLM-as-judge", "url": "BASELINE.html#/ai/llm-as-judge"}, {"label": "Coding page: evals", "url": "CODING.html#evals"}, {"label": "Vanguard prep: macro or micro F1, and when accuracy lies", "url": "interviews/vanguard.html#/prep/q-macro-or-micro-f1-and-when-does-accuracy-lie"}, {"label": "Vanguard prep: evaluating an NLU model beyond accuracy", "url": "interviews/vanguard.html#/prep/q-how-do-you-evaluate-an-nlu-model-beyond-accuracy"}], "ans": ["Accuracy lies under imbalance: 95% in one class gives 95% accuracy and near-zero macro-F1", "Precision: of what I flagged, how much was right. Recall: of what was there, how much I found", "Micro pools decisions, so big classes dominate; macro averages per class, so rare intents count", "Perplexity measures the language model; BLEU and ROUGE are cheap overlap, weakly tied to quality", "Open-ended output: rubric judges, calibrated against a human-labelled sample"], "close": [{"k": "short", "q": "150 intents, ten of which carry most of the traffic: macro or micro F1, and why?", "a": "Report both and lead with macro. Micro is dominated by the ten big intents and hides rare ones failing; macro counts each intent equally, with per-intent recall beside it."}, {"k": "why", "q": "What does perplexity tell you about a model, and what does it not?", "a": "How well a language model predicts held-out text: exp(average negative log-likelihood). It says nothing direct about whether answers are correct, grounded or useful for the task."}], "sdLinks": [], "read": [{"label": "SLP3, ch. 4 Logistic Regression and Text Classification: skim to the evaluation section, precision, recall, F1", "url": "https://web.stanford.edu/~jurafsky/slp3/4.pdf", "m": 30}, {"label": "Microsoft CLU: evaluation metrics, per-intent P/R/F1 and the confusion matrix", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/evaluation-metrics", "m": 12}, {"label": "Judging LLM-as-a-Judge (MT-bench): the abstract and the bias section", "url": "https://arxiv.org/abs/2306.05685", "m": 10}, {"label": "Baseline, NLP: classification metrics, the short explainer", "url": "BASELINE.html#/nlp/classification-metrics", "m": 3}, {"label": "Baseline: evaluation splits, precision and recall, the short explainer", "url": "BASELINE.html#/ml/evaluation-splits", "m": 3}], "figs": ["confusionMatrix", "evalHarness"]}, {"t": "Draw the map cold, then say it", "m": 10, "out": "Draw the NLP map from memory, then say it in ninety seconds with an example from your own work on each branch you can", "d": "Draw the field from memory before you check it. Then say it aloud in ninety seconds, with your own work on the branches where it sits.", "pts": ["The sheet: close everything and draw the field as a tree with five branches, foundations, representations, tasks, model eras, evaluation, with three to six leaves under each", "One turn: circle the leaves one assistant turn uses", "MetaRAG: recursive chunking with TF-IDF weighted embeddings, under representations and retrieval", "Translation project: your 'Transformer Neural Machine Translation' project, a from-scratch Transformer for English-German, under eras and tasks", "alfred_: intent classification, under classification", "Check it: open the Baseline NLP field, compare, and add what you missed in a second colour", "Say it: the map aloud in ninety seconds"], "links": [{"label": "Baseline, AI: RAG", "url": "BASELINE.html#/ai/rag"}, {"label": "Vanguard prep: the map of NLP in two minutes", "url": "interviews/vanguard.html#/prep/q-give-me-the-map-of-nlp-in-two-minutes"}, {"label": "Vanguard prep: MetaRAG", "url": "interviews/vanguard.html#/prep/q-tell-me-about-metarag"}], "ans": ["Foundations: tokenization, morphology, POS, parsing", "Representations: sparse (bag of words, TF-IDF, n-grams) to dense (static, contextual, sentence)", "Tasks: classification, labelling, QA, summarization, translation, retrieval, dialogue, extraction", "Eras: rules, statistical, neural, Transformers, LLMs. Evaluation: P/R/F1, perplexity, BLEU and ROUGE, judges", "Mine: TF-IDF weighted embeddings in MetaRAG, a from-scratch Transformer for English-German, intent classification in alfred_"], "close": [{"k": "short", "q": "Where on the map does your MetaRAG work sit, with its numbers?", "a": "Representations and retrieval: recursive chunking with TF-IDF weighted embeddings, 82.5% precision against a 73.3% baseline, and 0.925 Hit Rate@10."}], "sdLinks": [], "read": [{"label": "Baseline: the NLP field, all topics, to check your drawing against", "url": "BASELINE.html#/nlp", "m": 5}, {"label": "SLP3, the table of contents: the chapter list is itself a map of the field", "url": "https://web.stanford.edu/~jurafsky/slp3/", "m": 3}], "figs": ["nlpMap"]}], "study": [], "quiz": [{"q": "Why does a static embedding fail on 'bank', and what fixes it?", "a": "It gives one vector per word type, so the river sense and the money sense share it. A contextual model such as BERT computes a vector per occurrence from the whole sentence, so the sense comes from context."}, {"q": "Why does machine translation matter so much in this history?", "a": "It is the task that produced seq2seq, attention and the Transformer. The architecture everything runs on now was built to translate."}, {"q": "Why do LLM-first assistants still keep a small classifier in front of the model?", "a": "It answers in milliseconds on a CPU, against about a second for an LLM call. It routes the confident cases, guards scope, and sends only uncertain or open-ended turns to the LLM."}, {"q": "150 intents, ten of which carry most of the traffic: macro or micro F1, and why?", "a": "Report both and lead with macro. Micro is dominated by the ten big intents and hides rare ones failing; macro counts each intent equally, with per-intent recall beside it."}, {"q": "What does perplexity tell you about a model, and what does it not?", "a": "How well a language model predicts held-out text: exp(average negative log-likelihood). It says nothing direct about whether answers are correct, grounded or useful for the task."}, {"q": "Where on the map does your MetaRAG work sit, with its numbers?", "a": "Representations and retrieval: recursive chunking with TF-IDF weighted embeddings, 82.5% precision against a 73.3% baseline, and 0.925 Hit Rate@10."}], "hasTrackerQuiz": false, "figs": []}, {"id": "wc26", "name": "Text classification and embeddings", "blurb": "The classification ladder and how to choose on it, imbalance, calibration and out-of-scope, then embeddings from word2vec to contrastive sentence models and vector search.", "intro": "The recruiter named text classification and embeddings outright. In a virtual assistant they are the intent model and the router in front of the LLM, so expect them as scenarios: 200 intents and little data, a confident wrong answer, a new phrasing in production. This session is the ladder of methods and the numbers behind each choice.", "len": "55m", "day": "2", "steps": [{"t": "The classification ladder, cheapest first", "m": 10, "out": "Classify 200 intents with 50 examples each. What do you build, in what order, and how do you choose", "d": "Climb the ladder only as far as your data and latency need. The cheap baseline runs first, because it tells you how hard the problem is.", "pts": ["TF-IDF baseline: logistic regression, a linear SVM or Naive Bayes; trains in seconds on a CPU and is interpretable; always run it first", "fastText and frozen embeddings: fastText puts a linear layer on word and subword n-gram embeddings, very fast on large data; a frozen sentence-embedding model plus a logistic head or kNN is strong with little data and cheap to retrain or extend", "Fine-tuned encoders: BERT, RoBERTa and DeBERTa give the best supervised accuracy with hundreds to thousands of examples; DistilBERT or MiniLM when latency matters", "SetFit: fine-tunes a sentence transformer contrastively on pairs built from 8 to 64 examples per class, then fits a logistic head; competitive with much larger models", "Zero-shot NLI and LLMs: NLI poses each label as a hypothesis, no data but one forward pass per label and weak on fine-grained labels; LLM prompting needs no training and handles changing label sets, at a price per call in latency and money", "Choosing: under 50 examples and changing labels, an LLM or SetFit; 50 to 500 per class, stable, tight latency, embeddings plus a head or SetFit; thousands of examples and under 20 ms, a fine-tuned small encoder; hundreds of overlapping labels, embedding kNN to the top 10 candidates and an LLM or reranker picks", "Multi-class and multi-label: multi-class is softmax and cross-entropy; multi-label is a sigmoid per label, binary cross-entropy and a threshold per label", "One data point: a 2026 preprint found fine-tuned RoBERTa beat Claude Haiku on ATIS (95.9 against 84.1) and tied on CLINC150, but the LLM caught far more out-of-scope queries (85.6 against 58.1 recall), at about 981 ms p50 against 2.4 ms"], "links": [{"label": "Baseline: the map of NLP and conversational AI", "url": "BASELINE.html#/nlp"}, {"label": "Baseline, NLP: bag of words and TF-IDF", "url": "BASELINE.html#/nlp/bow-tfidf"}, {"label": "Baseline, NLP: sentence embeddings", "url": "BASELINE.html#/nlp/sentence-embeddings"}, {"label": "Vanguard prep: 200 intents, 50 examples each", "url": "interviews/vanguard.html#/prep/q-classify-200-intents-with-50-examples-each-what-do-you-do"}, {"label": "Vanguard prep: SetFit", "url": "interviews/vanguard.html#/prep/q-what-is-setfit-and-why-does-it-work-with-so-few-examples"}], "ans": ["Baseline first: TF-IDF plus logistic regression, to learn how hard it is", "Then sentence embeddings plus a logistic head, then SetFit or a fine-tuned small encoder", "Similar intents will collide: read the confusion matrix, merge them or add contrastive examples", "If latency allows: embedding kNN for the top candidates, and a reranker or an LLM picks", "A stratified held-out set; macro-F1 and per-intent recall"], "close": [{"k": "why", "q": "When would you pick an LLM over a fine-tuned encoder for classification?", "a": "When labelled data is scarce, labels change often, out-of-scope matters, or inputs need reasoning. The encoder wins on high volume, tight latency and cost, and a stable label set with a few thousand examples. A common pattern is to label with an LLM, then distill into an encoder."}, {"k": "short", "q": "What is SetFit, and why does it work with so few examples?", "a": "It fine-tunes a sentence transformer contrastively on pairs built from the labelled examples, same class close and different class apart, then fits a logistic head. A few examples make many pairs and the encoder starts with good semantics, so it needs no prompts and trains fast."}], "sdLinks": [], "read": [{"label": "Hugging Face: text classification with the Trainer, DistilBERT on IMDb", "url": "https://huggingface.co/docs/transformers/tasks/sequence_classification", "m": 15}, {"label": "Hugging Face blog: SetFit, few-shot classification without prompts", "url": "https://huggingface.co/blog/setfit", "m": 10}, {"label": "A Decision Framework for Intent Detection (2026 preprint): fine-tuned encoder against LLM, with numbers", "url": "https://arxiv.org/html/2608.20371", "m": 20}, {"label": "Baseline, NLP: text classification, the short explainer", "url": "BASELINE.html#/nlp/text-classification", "m": 3}], "figs": ["clfLadder"]}, {"t": "Imbalance, calibration and out-of-scope", "m": 10, "out": "How do you handle out-of-scope queries, and why does calibration matter for it", "d": "Every downstream rule (route, abstain, escalate) reads the model's confidence, so imbalance, calibration and out-of-scope are one problem. Fix the evaluation first.", "pts": ["Imbalance, metric first: macro-F1, per-class recall and PR curves before any fix", "Imbalance, the fixes: class weights in the loss, the cheapest; resampling, where oversampled duplicates can overfit and validation and test sets are never resampled; focal loss, which down-weights easy examples so rare, hard ones drive the gradient; per-class thresholds tuned on validation, often the highest-value fix", "Labels: fixing 2 to 5% bad labels often beats a bigger model", "Calibration: a model is calibrated if '80% confident' is right about 80% of the time; modern networks are overconfident (Guo et al., 2017); measure with a reliability diagram and expected calibration error", "Temperature scaling: one scalar fitted on a validation set; it changes confidence and leaves accuracy unchanged", "Why it matters: Microsoft's CLU docs note a model can predict the wrong intent at 1.00 confidence, which makes any threshold useless", "Out-of-scope: CLINC150 (Larson et al., 2019) showed classifiers do well on supported intents and struggle out of scope; options are a max-softmax threshold (needs calibration), an explicit 'none of the above' class trained on real and synthetic off-topic queries (often the most reliable), distance to class centroids or kNN in embedding space, and an LLM judge for borderline cases", "Measuring OOS: in-scope accuracy, OOS recall, and OOS false-accept rate at a fixed in-scope accuracy"], "links": [{"label": "Baseline, NLP: classification metrics", "url": "BASELINE.html#/nlp/classification-metrics"}, {"label": "Baseline, NLP: text classification", "url": "BASELINE.html#/nlp/text-classification"}, {"label": "Vanguard prep: out-of-scope queries", "url": "interviews/vanguard.html#/prep/q-how-do-you-handle-out-of-scope-queries"}, {"label": "Vanguard prep: why calibration matters", "url": "interviews/vanguard.html#/prep/q-why-does-calibration-matter-and-how-do-you-fix-it"}], "ans": ["Out-of-scope is a first-class case: a none class trained on real and synthetic off-topic queries", "Calibrate with temperature scaling, then set the threshold for a target in-scope accuracy", "A second signal: distance to class centroids in embedding space; borderline cases to an LLM or a human", "Measure OOS recall and false-accept rate, not overall accuracy", "Imbalance: fix the metric first, then class weights, per-class thresholds, focal loss"], "close": [{"k": "why", "q": "Why is temperature scaling a safe fix for overconfidence?", "a": "It divides the logits by one scalar fitted on a validation set. That changes how confident the model is, not which class wins, so accuracy is unchanged while the thresholds start to mean something."}, {"k": "short", "q": "Your classes are 100 to 1 imbalanced. What do you try, in order?", "a": "Fix the evaluation to macro-F1 and PR curves, then class weights or oversampling, then per-class threshold tuning on validation, then focal loss if easy examples swamp training. Check the rare-class labels are clean and collect more of them with active learning."}], "sdLinks": [], "read": [{"label": "On Calibration of Modern Neural Networks (Guo et al.): the abstract and temperature scaling", "url": "https://arxiv.org/abs/1706.04599", "m": 25}, {"label": "CLINC150: intent classification and out-of-scope prediction", "url": "https://arxiv.org/abs/1909.02027", "m": 15}, {"label": "Baseline, NLP: out-of-scope detection, the short explainer", "url": "BASELINE.html#/nlp/out-of-scope", "m": 3}], "figs": ["thresholdBands", "softmaxCrossEntropy"]}, {"t": "Word embeddings: word2vec, GloVe, fastText", "m": 8, "out": "Explain word2vec skip-gram with negative sampling, and what GloVe and fastText change", "d": "Words used in similar contexts have similar meanings, so training a vector to predict its context puts similar words close together. That distributional hypothesis sits under all three methods.", "pts": ["word2vec: Mikolov, 2013; skip-gram predicts the context words from the centre word, CBOW predicts the centre from its context", "Negative sampling: a softmax over the whole vocabulary is expensive, so training becomes binary classification, raising the true (word, context) pair and lowering k random pairs, k of 5 to 20 on small data and 2 to 5 on large", "Typical settings: 300 dimensions, a window of about 5, frequent words subsampled; the learned input vectors become the embeddings", "GloVe: 2014; factorizes the global co-occurrence matrix so dot products approximate log co-occurrence counts, similar quality reached another way", "fastText: builds each word from character n-gram vectors, so it handles rare words, typos and morphologically rich languages and can embed a word it never saw", "The limit: all three give one vector per word type, which the next step removes"], "links": [{"label": "Baseline, ML: embeddings", "url": "BASELINE.html#/ml/embeddings"}, {"label": "Vanguard prep: why embeddings work", "url": "interviews/vanguard.html#/prep/q-why-do-embeddings-work"}, {"label": "Vanguard prep: static or contextual embeddings", "url": "interviews/vanguard.html#/prep/q-static-or-contextual-embeddings-what-s-the-difference"}], "ans": ["Distributional hypothesis: words in similar contexts get similar vectors", "Skip-gram predicts the context from the centre word; CBOW does the reverse", "Negative sampling: raise the true pair, lower k random pairs, a binary loss instead of a vocabulary softmax", "GloVe factorizes global co-occurrence counts; fastText sums character n-grams, so it embeds unseen words and typos"], "close": [{"k": "short", "q": "Why does fastText cope with a typo that word2vec cannot?", "a": "fastText builds a word from its character n-gram vectors, so a misspelled or unseen word still shares most of its n-grams with the real one. word2vec only has vectors for words it saw in training."}], "sdLinks": [], "read": [{"label": "Jay Alammar, The Illustrated Word2vec: skip-gram, negative sampling, window size", "url": "https://jalammar.github.io/illustrated-word2vec/", "m": 35}, {"label": "SLP3, ch. 5 Embeddings: the distributional hypothesis and word2vec", "url": "https://web.stanford.edu/~jurafsky/slp3/5.pdf", "m": 45}, {"label": "Baseline, NLP: word embeddings, the short explainer", "url": "BASELINE.html#/nlp/word-embeddings", "m": 3}, {"label": "Light review: w4c, embeddings and attention at mechanism level (plan week 4)", "url": "index.html#/s/w4c", "m": 10}], "figs": ["reprLadder", "embed"]}, {"t": "Contextual and sentence embeddings, and contrastive training", "m": 10, "out": "Why can't you mean-pool BERT for sentence similarity, and how does contrastive training fix it", "d": "Contextual models give a vector per token, but a useful sentence vector has to be trained for comparison. Contrastive training is the modern recipe.", "pts": ["Contextual: ELMo (a bidirectional LSTM language model) and BERT (a Transformer encoder trained with masked language modelling) give a vector per token in context, so 'bank' by a river and 'bank' with money differ", "Mean-pooled BERT: poor for whole sentences; BERT was trained to predict masked tokens, not to compare sentences, and its vectors sit in a narrow cone (anisotropy), so every cosine is high", "Sentence-BERT: a siamese BERT trained on sentence pairs (NLI, paraphrase) so cosine similarity works; each sentence is encoded once, so the most similar pair among 10,000 sentences drops from about 65 hours to about 5 seconds", "Contrastive and InfoNCE: pull a query and its positive together, push other texts apart; the loss is the negative log of exp(sim(q, positive) / T) over the sum of exp(sim / T) across the positive and the negatives, with T around 0.05 to 0.1", "In-batch and hard negatives: every other example in the batch is a free negative, so larger batches help; hard negatives, similar but wrong, help most", "SimCSE: even dropout noise works as augmentation, and contrastive training spreads the vectors out", "Matryoshka: the first k dimensions are useful alone, so you can truncate and renormalize to cut storage", "Normalize at write time: on unit vectors cosine, dot product and L2 give the same ranking, so use the fastest, unless the model card says the norm carries meaning"], "links": [{"label": "Baseline, NLP: encoders and decoders", "url": "BASELINE.html#/nlp/encoders-decoders"}, {"label": "Coding page: embeddings and vector search", "url": "CODING.html#embed"}, {"label": "Vanguard prep: why not mean-pool BERT", "url": "interviews/vanguard.html#/prep/q-why-can-t-you-mean-pool-bert-for-sentence-similarity"}, {"label": "Vanguard prep: cosine, dot product or Euclidean", "url": "interviews/vanguard.html#/prep/q-cosine-dot-product-or-euclidean-distance"}], "ans": ["BERT was trained to predict masked tokens, not to compare sentences; pooled vectors sit in a narrow cone", "Sentence-BERT trains a siamese encoder on pairs so cosine means something; about 65 hours to 5 seconds on 10,000 sentences", "Contrastive: pull the positive close, push the negatives away; InfoNCE is a softmax over one positive and many negatives", "In-batch negatives are free, so big batches help; hard negatives help most; temperature sets how sharp", "Normalize at write time: on unit vectors, cosine, dot product and L2 rank the same"], "close": [{"k": "why", "q": "Explain InfoNCE and in-batch negatives.", "a": "For each query, a softmax over its similarity to one positive and many negatives; the loss is −log of the positive's share. In-batch negatives reuse the other examples' positives at no extra compute, so larger batches give more and harder negatives. Temperature controls how sharply hard negatives are penalized."}], "sdLinks": [], "read": [{"label": "Lilian Weng, Contrastive Representation Learning: read InfoNCE and the sentence-embedding part", "url": "https://lilianweng.github.io/posts/2021-05-31-contrastive/", "m": 20}, {"label": "Sentence-BERT paper: the abstract and the model section", "url": "https://arxiv.org/abs/1908.10084", "m": 25}, {"label": "Sentence Transformers: training overview, losses including MatryoshkaLoss", "url": "https://www.sbert.net/docs/sentence_transformer/training_overview.html", "m": 20}, {"label": "Baseline, NLP: sentence embeddings, the short explainer", "url": "BASELINE.html#/nlp/sentence-embeddings", "m": 3}, {"label": "Baseline: embeddings, the short explainer", "url": "BASELINE.html#/ml/embeddings", "m": 3}], "figs": ["contrastive"]}, {"t": "Vector search: HNSW, IVF, PQ", "m": 8, "out": "Explain HNSW, IVF and PQ, and when you use each", "d": "Exact search compares the query with every vector, which stops scaling past about a million. Approximate indexes trade some recall for speed or memory, each with its own knobs.", "pts": ["Flat: exact, compares the query with every vector, fine up to roughly a million vectors", "HNSW: a layered proximity graph searched by greedy descent from sparse top layers to the dense bottom one; very good recall and speed, high memory; knobs M, efConstruction and efSearch", "IVF: k-means partitions the space into nlist cells and search visits only the nprobe nearest; less memory and compute, recall you can tune", "PQ: splits each vector into sub-vectors and stores a short code for each, 10 to 50 times less memory at some recall cost; IVF-PQ combines them for billions of vectors", "Filters and hybrid: add filter-aware search; BM25 plus dense with rank fusion often beats dense alone, because exact terms (product codes, names) are where embeddings are weak", "In an assistant: the same index serves intent detection (nearest labelled example or class centroid), clustering of missed utterances, and RAG"], "links": [{"label": "Baseline, NLP: sentence embeddings", "url": "BASELINE.html#/nlp/sentence-embeddings"}, {"label": "Baseline, AI: RAG", "url": "BASELINE.html#/ai/rag"}, {"label": "Vanguard prep: HNSW, IVF and PQ", "url": "interviews/vanguard.html#/prep/q-hnsw-ivf-and-pq-what-are-they-and-when-do-you-use-each"}], "ans": ["Flat: exact, fine to about a million vectors", "HNSW: a layered graph and greedy descent; high recall, low latency, high memory; M and efSearch", "IVF: k-means cells, search nprobe of them; less compute, tunable recall", "PQ: short codes per sub-vector, 10 to 50 times less memory; IVF-PQ for billions", "Hybrid BM25 plus dense with rank fusion often beats dense alone"], "close": [{"k": "short", "q": "Which knob trades recall for latency in HNSW, and which in IVF?", "a": "efSearch in HNSW: a wider candidate list at query time finds more true neighbours and costs time. nprobe in IVF: searching more cells raises recall and cost."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/search/vector", "label": "Technique: Vector index", "why": "The vector index as a building block."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/search/hybrid-rerank", "label": "Technique: Hybrid retrieval and reranking", "why": "BM25 plus dense with fusion and a reranker."}], "read": [{"label": "FAISS wiki: index types, Flat, IVF, HNSW, PQ", "url": "https://github.com/facebookresearch/faiss/wiki/Faiss-indexes", "m": 15}, {"label": "Baseline: vector databases, the short explainer", "url": "BASELINE.html#/data/vector-db", "m": 3}, {"label": "Baseline: hybrid search and reranking, the short explainer", "url": "BASELINE.html#/ai/hybrid-search-reranking", "m": 3}, {"label": "Coding page: embeddings and vector search, with code", "url": "CODING.html#embed", "m": 10}, {"label": "Light review, mphasis Prep: what embeddings are and how similarity search works", "url": "interviews/mphasis.html#/prep/q-what-are-embeddings-and-how-does-similarity-search-work", "m": 3}], "figs": ["annIndex", "hybridRetrieval"]}, {"t": "Choosing an embedding model, and how embeddings fail", "m": 9, "out": "How do you choose an embedding model for a RAG product or an intent router", "d": "Shortlist from the public benchmark, then decide on your own data, because small leaderboard gaps rarely survive there. Know how embeddings fail before production shows you.", "pts": ["MTEB: Muennighoff et al., 2022, the standard benchmark; in the original paper 8 task types, 58 datasets and 112 languages, since extended, covering retrieval, classification, clustering, reranking and semantic similarity", "Families: OpenAI text-embedding-3, Cohere embed, Voyage, Google's Gemini embedding, and open models such as BGE, E5, GTE, Nomic and Qwen; check the leaderboard live and never quote ranks from memory", "Choosing: filter MTEB to your task and language; check maximum input length, dimension, license, hosting, latency and price", "Your own eval: build 100 to 300 real query-to-document pairs and compare recall@k and MRR", "Failure modes: anisotropy, domain shift (legal, medical, code), weak handling of negation, numbers and entity names, short queries against long passages (models need query and document prefixes), silent truncation in chunking", "Model drift: switching model versions forces re-embedding everything", "Mitigations: domain fine-tuning with hard negatives, hybrid search, rerankers, query rewriting", "Your number: MetaRAG reached 82.5% precision with recursive chunking and TF-IDF weighted embeddings, against a 73.3% baseline"], "links": [{"label": "Baseline, NLP: sentence embeddings", "url": "BASELINE.html#/nlp/sentence-embeddings"}, {"label": "Baseline, AI: hybrid search and reranking", "url": "BASELINE.html#/ai/hybrid-search-reranking"}, {"label": "Baseline, AI: RAG", "url": "BASELINE.html#/ai/rag"}, {"label": "Vanguard prep: choosing an embedding model", "url": "interviews/vanguard.html#/prep/q-how-do-you-choose-an-embedding-model"}, {"label": "Vanguard prep: where embeddings fail", "url": "interviews/vanguard.html#/prep/q-where-do-embeddings-fail-and-how-do-you-use-them-in-an-assis"}], "ans": ["Shortlist from MTEB for your task and language; check it live, never quote ranks from memory", "Then context length, dimension, license, hosting, latency and price", "Decide on your own 100 to 300 labelled query pairs: recall@k and MRR", "Expect failures on negation, numbers, IDs and domain terms; add BM25 and a reranker", "Mine: MetaRAG, recursive chunking with TF-IDF weighted embeddings, 82.5% precision against 73.3%"], "close": [{"k": "why", "q": "Name the failure modes of embeddings and what you do about each.", "a": "Weak negation, numbers and identifiers; domain vocabulary gaps; short query against long passage; silent truncation; drift after a model upgrade that forces re-embedding. Hybrid BM25, a reranker, query rewriting, domain fine-tuning with hard negatives, and a retrieval eval set in CI."}], "sdLinks": [], "read": [{"label": "MTEB leaderboard: filter to your task and language; check it live", "url": "https://huggingface.co/spaces/mteb/leaderboard", "m": 5}, {"label": "MTEB paper: the task types and why leaderboard gaps do not transfer", "url": "https://arxiv.org/abs/2210.07316", "m": 25}, {"label": "Baseline: chunking and embeddings, the short explainer", "url": "BASELINE.html#/ai/chunking-embeddings", "m": 3}], "figs": ["ragPipeline"]}], "study": [], "quiz": [{"q": "When would you pick an LLM over a fine-tuned encoder for classification?", "a": "When labelled data is scarce, labels change often, out-of-scope matters, or inputs need reasoning. The encoder wins on high volume, tight latency and cost, and a stable label set with a few thousand examples. A common pattern is to label with an LLM, then distill into an encoder."}, {"q": "What is SetFit, and why does it work with so few examples?", "a": "It fine-tunes a sentence transformer contrastively on pairs built from the labelled examples, same class close and different class apart, then fits a logistic head. A few examples make many pairs and the encoder starts with good semantics, so it needs no prompts and trains fast."}, {"q": "Why is temperature scaling a safe fix for overconfidence?", "a": "It divides the logits by one scalar fitted on a validation set. That changes how confident the model is, not which class wins, so accuracy is unchanged while the thresholds start to mean something."}, {"q": "Your classes are 100 to 1 imbalanced. What do you try, in order?", "a": "Fix the evaluation to macro-F1 and PR curves, then class weights or oversampling, then per-class threshold tuning on validation, then focal loss if easy examples swamp training. Check the rare-class labels are clean and collect more of them with active learning."}, {"q": "Why does fastText cope with a typo that word2vec cannot?", "a": "fastText builds a word from its character n-gram vectors, so a misspelled or unseen word still shares most of its n-grams with the real one. word2vec only has vectors for words it saw in training."}, {"q": "Explain InfoNCE and in-batch negatives.", "a": "For each query, a softmax over its similarity to one positive and many negatives; the loss is −log of the positive's share. In-batch negatives reuse the other examples' positives at no extra compute, so larger batches give more and harder negatives. Temperature controls how sharply hard negatives are penalized."}, {"q": "Which knob trades recall for latency in HNSW, and which in IVF?", "a": "efSearch in HNSW: a wider candidate list at query time finds more true neighbours and costs time. nprobe in IVF: searching more cells raises recall and cost."}, {"q": "Name the failure modes of embeddings and what you do about each.", "a": "Weak negation, numbers and identifiers; domain vocabulary gaps; short query against long passage; silent truncation; drift after a model upgrade that forces re-embedding. Hybrid BM25, a reranker, query rewriting, domain fine-tuning with hard negatives, and a retrieval eval set in CI."}], "hasTrackerQuiz": false, "figs": []}, {"id": "wc27", "name": "LLM fundamentals and the Transformer, lightly", "blurb": "Tokenization, how a pretrained model becomes an assistant, decoding, prompt against RAG against fine-tuning, hallucination; then attention and the block around it, the three shapes, and the KV cache.", "intro": "The recruiter asked for LLM fundamentals and Transformer architecture, and you want the Transformer lightly. You work with LLMs every day; this session gives you the textbook words for what you know, with the numbers an interviewer checks. Your closed session w4c has attention at mechanism level: use it as the light review.", "len": "55m", "day": "3", "steps": [{"t": "Tokenization: BPE, WordPiece, SentencePiece", "m": 8, "al": [{"p": "plan/stage-14", "why": "Tokens and embeddings: the stage that builds a tokenizer and an embedding table."}], "out": "Why do models use subword tokenization, and how does BPE build its vocabulary", "d": "Models read subword tokens, not words. A fixed vocabulary of about 30k to 200k pieces composes any word, between an exploding word vocabulary and long character sequences.", "pts": ["Why subwords: a word vocabulary explodes and cannot represent a word it has not seen; characters make sequences long", "BPE: Sennrich et al., 2016; starts from characters or bytes and repeatedly merges the most frequent adjacent pair into a new symbol until the vocabulary is the size you want", "Byte-level BPE: GPT-2 and RoBERTa start from 256 byte symbols, so nothing is ever out of vocabulary", "WordPiece: BERT's tokenizer; similar, but picks merges by likelihood and marks continuations with '##'", "SentencePiece: treats the input as a raw stream with spaces included, so it needs no language-specific pre-tokenizer; implements BPE or a unigram model", "Consequences: token count drives cost and context use; tokenization explains odd behaviour on spelling, arithmetic and rare languages; in an assistant, order numbers and spelled-out IDs split into many tokens"], "links": [{"label": "Baseline: the map of NLP and conversational AI", "url": "BASELINE.html#/nlp"}, {"label": "Vanguard prep: subword tokenization and BPE", "url": "interviews/vanguard.html#/prep/q-why-subword-tokenization-and-how-does-bpe-work"}], "ans": ["Words: the vocabulary explodes and unseen words break. Characters: sequences get long", "BPE starts from characters or bytes and merges the most frequent adjacent pair, again and again", "Byte-level BPE has 256 base symbols, so nothing is out of vocabulary; WordPiece merges by likelihood and marks '##'", "SentencePiece reads raw text with spaces, so no language-specific pre-tokenizer", "Token count is cost and context; it also explains odd spelling and arithmetic"], "close": [{"k": "short", "q": "Why does a model stumble when asked to spell a word backwards?", "a": "It never sees letters, only subword tokens, so the characters inside a token are not directly visible to it."}], "sdLinks": [], "read": [{"label": "Hugging Face LLM course, ch. 6: byte-pair encoding, worked step by step", "url": "https://huggingface.co/learn/llm-course/chapter6/5", "m": 20}, {"label": "SLP3, ch. 2 Words and Tokens: the BPE section only", "url": "https://web.stanford.edu/~jurafsky/slp3/2.pdf", "m": 20}, {"label": "Baseline, NLP: tokenization, the short explainer", "url": "BASELINE.html#/nlp/tokenization", "m": 3}, {"label": "Coding page: a tokenizer, byte-pair encoding, with code", "url": "CODING.html#bpe", "m": 10}], "figs": ["bpeMerge"]}, {"t": "From pretraining to an assistant: objectives, SFT, RLHF and DPO", "m": 10, "out": "How does a model go from pretrained to a helpful assistant", "d": "A pretrained model predicts text; post-training makes it follow instructions and prefer good answers. Know each stage and the number that shows it matters.", "pts": ["Causal LM: predicts the next token left to right (decoder-only GPT and Llama); trains on every position and generates naturally", "Masked LM: hides about 15% of tokens and predicts them from both sides (BERT); best for understanding and embeddings, awkward for generation", "Span corruption: masks spans and has the decoder generate them (T5, encoder-decoder)", "Scaling: loss falls as a power law in parameters, data and compute (Kaplan, 2020); Chinchilla (2022) showed compute-optimal training grows data with model size, roughly 20 tokens per parameter, so many early models were undertrained, and labs now train smaller models on far more tokens because inference cost matters", "SFT: fine-tuning on (instruction, response) pairs turns a next-token predictor into an assistant; it teaches format and behaviour more than new knowledge", "RLHF: human preference rankings train a reward model, then PPO with a KL penalty keeps the policy near the SFT model; InstructGPT's 1.3B RLHF model was preferred over 175B GPT-3", "DPO: Rafailov, 2023; drops the reward model and the RL loop for a classification-style loss on preferred against rejected pairs, relative to a frozen reference model; simpler, more stable, widely used", "In-context learning: adapts from examples in the prompt with no weight update; sensitive to example choice, order and format; examples picked by embedding similarity usually beat fixed ones"], "links": [{"label": "Baseline, NLP: encoders and decoders", "url": "BASELINE.html#/nlp/encoders-decoders"}, {"label": "Vanguard prep: pretrained to assistant", "url": "interviews/vanguard.html#/prep/q-how-does-a-pretrained-model-become-an-assistant"}, {"label": "Vanguard prep: BERT versus GPT", "url": "interviews/vanguard.html#/prep/q-bert-versus-gpt-what-s-the-difference"}], "ans": ["Pretraining: next token for decoders, masked tokens for BERT, span corruption for T5", "SFT on instruction and response pairs teaches format and behaviour, little new knowledge", "RLHF: a reward model from human rankings, then PPO with a KL penalty to stay near the SFT model", "DPO skips the reward model and RL: a classification-style loss on preferred against rejected pairs", "InstructGPT: a 1.3B RLHF model was preferred over 175B GPT-3"], "close": [{"k": "why", "q": "BERT against GPT: what is the difference that matters?", "a": "BERT is an encoder trained on masked tokens with both sides visible, so it gives rich representations for classification, NER and embeddings but does not generate well. GPT is a decoder trained on the next token under a causal mask, so it generates. Encoders stay cheaper and faster for pure understanding."}], "sdLinks": [], "read": [{"label": "SLP3, ch. 8 Post-training: instruction tuning and preference tuning", "url": "https://web.stanford.edu/~jurafsky/slp3/8.pdf", "m": 25}, {"label": "DPO paper: the abstract and the loss", "url": "https://arxiv.org/abs/2305.18290", "m": 25}, {"label": "Baseline, NLP: how an LLM is trained, the short explainer", "url": "BASELINE.html#/nlp/llm-training", "m": 3}, {"label": "Baseline: pretraining, the short explainer", "url": "BASELINE.html#/ml/pretraining", "m": 3}, {"label": "Baseline: preference tuning, the short explainer", "url": "BASELINE.html#/ml/preference-tuning", "m": 3}], "figs": ["llmLifecycle"]}, {"t": "Decoding, and prompt against RAG against fine-tuning", "m": 10, "out": "Prompt, RAG, fine-tune or LoRA: how do you decide, and how do you set decoding for each kind of task", "d": "Decoding settings decide how each next token is picked; prompting, retrieval and tuning decide what the model knows and how it behaves. The rule: knowledge goes in retrieval, behaviour goes in tuning, and prompting comes before either.", "pts": ["Greedy and beam: greedy takes the top token every time, deterministic and repetitive; beam search keeps the top b partial sequences, good for translation and summarization, bland on open text", "Temperature: divides the logits before the softmax; below 1 sharpens, above 1 flattens, near 0 approaches greedy", "Top-k and top-p: top-k samples from the k most likely tokens; top-p (nucleus, Holtzman 2019) samples from the smallest set whose probability reaches p, so it adapts to how peaked the distribution is", "By task: temperature 0 or constrained decoding for classification and extraction; temperature and top-p for creative output", "Prompt, RAG or fine-tune: prompting first, fast and with no training, limited by context and consistency; RAG when the gap is private, large or changing knowledge, updatable, citable, and it reduces hallucination; fine-tuning when the gap is behaviour, format, tone, or latency and cost at scale", "LoRA: freezes the base weights and trains small low-rank matrices (W + BA); up to 10,000 times fewer trainable parameters than full GPT-3 fine-tuning and no added inference latency once merged; QLoRA does it on a 4-bit base", "Function calling: the model emits a JSON call your code executes; make it reliable with a schema or grammar-constrained decoding, validation and retry, a small tool set with clear descriptions, idempotent tools, and a log of every call"], "links": [{"label": "Baseline, ML: fine-tuning and LoRA", "url": "BASELINE.html#/ml/fine-tuning-lora"}, {"label": "Baseline, AI: RAG", "url": "BASELINE.html#/ai/rag"}, {"label": "Baseline, AI: structured output", "url": "BASELINE.html#/ai/structured-output"}, {"label": "Coding page: structured output and function calling", "url": "CODING.html#structured"}, {"label": "Vanguard prep: temperature, top-k and top-p", "url": "interviews/vanguard.html#/prep/q-temperature-top-k-and-top-p-what-are-they-and-when-do-you-us"}, {"label": "Vanguard prep: fine-tune, LoRA, prompt or RAG", "url": "interviews/vanguard.html#/prep/q-fine-tune-lora-prompt-or-rag-how-do-you-choose"}], "ans": ["Prompt first: no training, fast to change", "RAG when the gap is knowledge that is private, large or changing: updatable and citable", "Fine-tune when the gap is behaviour, format, tone, or latency and cost at scale", "LoRA freezes the base and trains low-rank adapters: up to 10,000 times fewer trainable parameters, no extra latency once merged", "Decoding: temperature 0 or constrained decoding for classification and extraction; top-p for open text"], "close": [{"k": "short", "q": "Temperature, top-k, top-p: what does each do?", "a": "Temperature divides the logits: low sharpens, high flattens. Top-k samples from the k most likely tokens. Top-p samples from the smallest set whose probability reaches p, so it adapts to how confident the model is."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/structured", "label": "Technique: Structured outputs", "why": "Constrained output for classification and extraction."}], "read": [{"label": "The Curious Case of Neural Text Degeneration (nucleus sampling): the abstract and the method", "url": "https://arxiv.org/abs/1904.09751", "m": 25}, {"label": "LoRA paper: the abstract and the method section", "url": "https://arxiv.org/abs/2106.09685", "m": 20}, {"label": "Baseline, NLP: decoding, the short explainer", "url": "BASELINE.html#/nlp/decoding", "m": 3}, {"label": "Baseline: fine-tuning against prompting, the short explainer", "url": "BASELINE.html#/ai/fine-tuning-vs-prompting", "m": 3}, {"label": "Light review, mphasis Prep: prompting, RAG or fine-tuning", "url": "interviews/mphasis.html#/prep/q-prompting-rag-or-fine-tuning-when-do-you-use-which", "m": 3}], "figs": ["llmLifecycle", "lora"]}, {"t": "Hallucination and grounding", "m": 7, "out": "How do you reduce hallucinations in a production assistant", "d": "A model generates plausible text, not verified text. Grounding and checks reduce hallucination; lower temperature adds no knowledge.", "pts": ["Causes: gaps or errors in pretraining data; fine-tuning on facts the model does not know, which teaches it to guess (Lilian Weng's survey); decoding randomness", "Grounding: retrieval with citations, required quotes, the answer constrained to the provided context", "Checks: tools for facts and arithmetic, a verification or entailment pass, abstention when evidence is weak", "Measure: a faithfulness metric on a regression set", "Temperature: lower helps a little and does not fix missing knowledge", "MetaRAG: 25% hallucination reduction, measured", "alfred_: the strict-ID working-memory pipeline made 'a whole class of hallucination structurally impossible, not probabilistically reduced'"], "links": [{"label": "Baseline, AI: RAG", "url": "BASELINE.html#/ai/rag"}, {"label": "Baseline, AI: guardrails", "url": "BASELINE.html#/ai/guardrails"}, {"label": "Vanguard prep: MetaRAG", "url": "interviews/vanguard.html#/prep/q-tell-me-about-metarag"}], "ans": ["Cause: plausible text, not verified text; data gaps, fine-tuning on unknown facts, sampling", "Ground in retrieved evidence and require citations or quotes; constrain to the context", "Tools for facts and arithmetic; a verification check; allow 'I don't know'", "Measure faithfulness on a regression set; lower temperature helps a little, it adds no knowledge", "Mine: MetaRAG, 25% hallucination reduction; alfred_'s strict IDs make a whole class structurally impossible"], "close": [{"k": "why", "q": "Why can fine-tuning on new facts make hallucination worse?", "a": "Trained to state facts it does not know, the model learns to produce confident answers with no knowledge behind them, which is guessing. Knowledge belongs in r
