etrieval; tuning should shape behaviour."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/citations", "label": "Technique: Enforced citations and verification", "why": "Enforced citations and verification."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/refusal", "label": "Technique: Explicit refusal paths", "why": "Abstaining when the evidence is weak."}], "read": [{"label": "Lilian Weng, Extrinsic Hallucinations in LLMs: causes and mitigation sections", "url": "https://lilianweng.github.io/posts/2024-07-07-hallucination/", "m": 29}, {"label": "Baseline: hallucination, the short explainer", "url": "BASELINE.html#/ai/hallucination", "m": 3}, {"label": "Light review, mphasis Prep: how you reduce hallucination", "url": "interviews/mphasis.html#/prep/q-how-do-you-reduce-hallucination", "m": 3}], "figs": ["ragPipeline"]}, {"t": "Attention, and the block around it", "m": 12, "al": [{"p": "plan/stage-15", "why": "Attention and transformers: scaled dot-product attention built from the three projections."}], "out": "Explain attention, and why the scores are divided by the square root of d_k", "d": "Attention lets every token gather information from all the others in one parallel step, where an RNN passes it along step by step. The block around it, residuals, norms and a feed-forward layer, holds most of the parameters.", "pts": ["Q, K and V: each token's vector is projected into a query ('what am I looking for'), a key ('what I contain') and a value ('what I give if chosen')", "The operation: a query is compared by dot product with every key, softmax turns the scores into weights, and the output is the weighted sum of the values", "Divide by sqrt(d_k): dot products of d_k-dimensional vectors with unit-variance entries have variance d_k; large scores saturate the softmax into near one-hot, which gives tiny gradients; dividing restores unit variance", "Multi-head: h attentions in parallel on smaller projections (d_k = d_model / h), concatenated and projected, so heads learn different relations at the same total cost", "Position: attention is order-blind; sinusoidal waves added to the embeddings (the original), learned position vectors (BERT, GPT-2, capped at the training length), or RoPE, which rotates queries and keys by an angle proportional to position so their dot product depends on relative distance, the default in Llama-style models", "Residual and norm: each sub-layer is x + Sublayer(x); pre-LN normalizes before the sublayer and trains stably without warmup (Xiong et al., 2020); many models use RMSNorm", "Feed-forward: per token, expand to about 4 times the width, a nonlinearity, project back; it holds about two thirds of the parameters (about 116B of GPT-3's 175B)"], "links": [{"label": "Baseline, NLP: encoders and decoders", "url": "BASELINE.html#/nlp/encoders-decoders"}, {"label": "Vanguard prep: explain attention", "url": "interviews/vanguard.html#/prep/q-attention"}, {"label": "Vanguard prep: why divide by the square root of d_k", "url": "interviews/vanguard.html#/prep/q-why-divide-the-attention-scores-by-the-square-root-of-d-k"}], "ans": ["Each token makes a query, a key and a value", "Query against every key, softmax into weights, output is the weighted sum of values", "Divide by sqrt(d_k): dot products have variance d_k; large scores saturate the softmax and kill gradients", "Multi-head: several smaller attentions in parallel at the same cost; position by sinusoids, learned vectors or RoPE", "Around it: residual with pre-LN, then a 4x feed-forward block holding about two thirds of the parameters"], "close": [{"k": "short", "q": "Pre-LN or post-LN, and why?", "a": "Pre-LN normalizes before each sublayer, which keeps gradients well behaved at initialization and trains stably without warmup. That is why modern LLMs use it."}, {"k": "why", "q": "Why does RoPE suit long context better than learned position vectors?", "a": "It rotates queries and keys by an angle proportional to position, so their dot product depends on relative distance, and with scaling tricks it extends past the training length. Learned absolute positions stop at the length they were trained on."}], "sdLinks": [], "read": [{"label": "Jay Alammar, The Illustrated Transformer: Q, K, V, multi-head, positions, residuals", "url": "https://jalammar.github.io/illustrated-transformer/", "m": 25}, {"label": "3Blue1Brown: Attention in Transformers, step by step", "url": "https://www.3blue1brown.com/lessons/attention", "m": 25}, {"label": "Sebastian Raschka: understanding and coding self-attention, multi-head, causal and cross-attention", "url": "https://magazine.sebastianraschka.com/p/understanding-and-coding-self-attention", "m": 25}, {"label": "Baseline, NLP: attention, the short explainer", "url": "BASELINE.html#/nlp/attention", "m": 3}, {"label": "Baseline: Transformers and attention, the short explainer", "url": "BASELINE.html#/ml/transformers", "m": 3}, {"label": "Coding page: attention and a transformer block, with code", "url": "CODING.html#transformer", "m": 10}, {"label": "Light review: w4c, embeddings and attention at mechanism level (plan week 4)", "url": "index.html#/s/w4c", "m": 10}], "figs": ["qkvAttention", "attention", "transformerBlock"]}, {"t": "Three shapes, the cost of attention, and the KV cache", "m": 8, "out": "Encoder, decoder or encoder-decoder: which for what, and why is long context expensive", "d": "Masks decide which shape a Transformer is, and the shape decides what it is for. Attention cost and the KV cache explain why long context is expensive.", "pts": ["Masks: a causal mask stops position i attending to any j after it, so training on one sequence is many next-token predictions at once and the model cannot peek; a padding mask stops attention to pad tokens in a batch", "Encoder-only: the BERT family, no causal mask, bidirectional; classification, NER, embeddings and reranking", "Decoder-only: GPT and Llama, causal; generation, and now the default LLM", "Encoder-decoder: T5 and BART; the encoder reads the input and the decoder generates while cross-attending to it; translation and summarization", "Cost: every token is scored against every other, O(n^2) in time and memory; FlashAttention keeps the result exact and cuts memory traffic by tiling", "KV cache: past keys and values do not change in generation, so they are cached and each new token computes only its own Q, K and V; a 7B Llama-style model (32 layers, hidden size 4096, fp16) stores about 0.5 MB per token, so 4,000 tokens is about 2 GB per sequence; grouped-query attention shares K and V across heads to shrink it", "Rough sizes: about 12 x d_model^2 parameters per layer (4 for the attention projections, 8 for a 4x FFN); GPT-3 with 96 layers at 12,288 gives about 174B against the published 175B; BERT-base is 12 layers, 768 hidden, about 110M", "Compute: training is about 6 x parameters x tokens; inference about 2 x parameters per token"], "links": [{"label": "Baseline, ML: Transformers and attention", "url": "BASELINE.html#/ml/transformers"}, {"label": "Vanguard prep: the KV cache", "url": "interviews/vanguard.html#/prep/q-what-is-the-kv-cache-and-why-does-it-matter"}, {"label": "Vanguard prep: BERT versus GPT", "url": "interviews/vanguard.html#/prep/q-bert-versus-gpt-what-s-the-difference"}], "ans": ["Encoder-only (BERT): bidirectional; classification, NER, embeddings, reranking", "Decoder-only (GPT, Llama): causal mask; generation, now the default LLM", "Encoder-decoder (T5, BART): cross-attention; translation and summarization", "Attention is O(n^2) in length; the KV cache makes each new token cheap but grows with context and batch", "About 12 d^2 parameters a layer: GPT-3, 96 layers at 12,288, is about 174B against the published 175B"], "close": [{"k": "short", "q": "What is the KV cache, and why does it matter?", "a": "In generation the keys and values of past tokens do not change, so they are stored and each new token computes only its own. It grows with layers, context and batch, about 0.5 MB a token for a 7B Llama-style model in fp16, so it often limits long context and concurrency; grouped-query attention shrinks it."}], "sdLinks": [], "read": [{"label": "Lilian Weng, Large Transformer Model Inference Optimization: the KV cache cost", "url": "https://lilianweng.github.io/posts/2023-01-10-inference-optimization/", "m": 9}, {"label": "GQA paper: sharing keys and values across heads", "url": "https://arxiv.org/abs/2305.13245", "m": 15}, {"label": "Baseline, NLP: encoders and decoders, the short explainer", "url": "BASELINE.html#/nlp/encoders-decoders", "m": 3}, {"label": "Baseline: the KV cache, the short explainer", "url": "BASELINE.html#/inference/kv-cache", "m": 3}, {"label": "Baseline: prefill and decode, the short explainer", "url": "BASELINE.html#/inference/prefill-decode", "m": 3}], "figs": ["transformerBlock"]}], "study": [], "quiz": [{"q": "Why does a model stumble when asked to spell a word backwards?", "a": "It never sees letters, only subword tokens, so the characters inside a token are not directly visible to it."}, {"q": "BERT against GPT: what is the difference that matters?", "a": "BERT is an encoder trained on masked tokens with both sides visible, so it gives rich representations for classification, NER and embeddings but does not generate well. GPT is a decoder trained on the next token under a causal mask, so it generates. Encoders stay cheaper and faster for pure understanding."}, {"q": "Temperature, top-k, top-p: what does each do?", "a": "Temperature divides the logits: low sharpens, high flattens. Top-k samples from the k most likely tokens. Top-p samples from the smallest set whose probability reaches p, so it adapts to how confident the model is."}, {"q": "Why can fine-tuning on new facts make hallucination worse?", "a": "Trained to state facts it does not know, the model learns to produce confident answers with no knowledge behind them, which is guessing. Knowledge belongs in retrieval; tuning should shape behaviour."}, {"q": "Pre-LN or post-LN, and why?", "a": "Pre-LN normalizes before each sublayer, which keeps gradients well behaved at initialization and trains stably without warmup. That is why modern LLMs use it."}, {"q": "Why does RoPE suit long context better than learned position vectors?", "a": "It rotates queries and keys by an angle proportional to position, so their dot product depends on relative distance, and with scaling tricks it extends past the training length. Learned absolute positions stop at the length they were trained on."}, {"q": "What is the KV cache, and why does it matter?", "a": "In generation the keys and values of past tokens do not change, so they are stored and each new token computes only its own. It grows with layers, context and batch, about 0.5 MB a token for a 7B Llama-style model in fp16, so it often limits long context and concurrency; grouped-query attention shrinks it."}], "hasTrackerQuiz": false, "figs": []}, {"id": "wc28", "name": "Conversation design", "blurb": "Persona and prompts, no-match and no-input, confirmation, repair, handoff, voice against chat, and designing one task end to end.", "intro": "Conversation design is the first thing named in Friday's conversational AI area. You have built the runtime side of it in alfred_ and MockFlow-AI; this session gives you the designer's vocabulary from Google's and Alexa's guidelines, Rasa's patterns and Dialogflow CX, so you can talk about prompts, errors, confirmation, repair and handoff the way the enterprise platforms do.", "len": "55m", "day": "4", "steps": [{"t": "Persona, and prompts for voice and for chat", "m": 9, "out": "What changes when you design the same assistant for voice and for chat", "d": "The same assistant needs different prompts for voice and for chat, because a listener cannot scan and a reader can. The persona is the style guide that keeps both consistent.", "pts": ["Persona: Google's recipe is to brainstorm adjectives, narrow them to 4 to 6 traits, pick an archetype, write a one-paragraph description and give it a visual", "Not human: Google warns against pinning gender or age; the aim is not to make users think the bot is human but to use conversation, the interface people already know", "In enterprise work: the persona is mostly a style guide for the prompt and the copy deck; it also settles whether the bot says 'I' and how it answers 'are you a bot'", "Voice prompts: no scanning, so prompts are short with the question last, lists hold three options or fewer, barge-in is allowed, and silence (no-input) is a first-class event", "Voice input: ASR errors dominate the failures, sensitive digits go by DTMF, and numbers and alphanumerics need spelling styles (Lex supports spell-by-letter and spell-by-word)", "Chat: buttons and carousels; users type fragments and misspellings, scroll back, and expect asynchronous replies", "Messaging: WhatsApp and SMS add session windows, opt-in rules and no custom UI", "Accessibility: generous timeouts and repeat options in voice, screen-reader friendly structure and plain language in chat, and an easy path to a human in both"], "links": [{"label": "Baseline: the map of NLP and conversational AI", "url": "BASELINE.html#/nlp"}, {"label": "Guide: enterprise virtual assistant, the whole design", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant"}, {"label": "Baseline, audio: speech recognition", "url": "BASELINE.html#/audio/asr"}, {"label": "Vanguard prep: voice and chat", "url": "interviews/vanguard.html#/prep/q-what-do-you-design-differently-for-voice-and-for-chat"}], "ans": ["Persona is a style guide for prompts and copy: 4 to 6 traits, never pretending to be human", "Voice: short prompts, question last, three options or fewer, barge-in, silence is an event", "Voice: ASR errors dominate, so confirm low-confidence values and use DTMF for sensitive digits", "Chat: buttons and rich elements, fragments and typos, scroll-back, async replies", "Thresholds and test sets per channel; voice utterances are never reused as chat test data"], "close": [{"k": "short", "q": "Why put the question at the end of a voice prompt?", "a": "A listener cannot scan back, so the last thing heard is what they answer. Context first, the question last, and the whole prompt short."}], "sdLinks": [], "read": [{"label": "Google conversation design: create a persona", "url": "https://developers.google.com/assistant/conversation-design/create-a-persona", "m": 6}, {"label": "Alexa design guide: the principles and sections", "url": "https://developer.amazon.com/en-US/docs/alexa/alexa-design/get-started.html", "m": 5}, {"label": "Baseline, NLP: conversation design, the short explainer", "url": "BASELINE.html#/nlp/conversation-design", "m": 3}, {"label": "Baseline: turn-taking, the short explainer", "url": "BASELINE.html#/audio/turn-taking", "m": 3}, {"label": "Light review: wc20, the conversation loop: hearing, thinking, speaking", "url": "index.html#/w/wc20", "m": 10}], "figs": ["turnTaking"]}, {"t": "No-match and no-input: escalating help", "m": 9, "out": "How do you handle no-match and no-input", "d": "Errors are part of the design, not an afterthought. Help escalates with each failure, and there is always a way out.", "pts": ["Three error types: no-input (silence), no-match (heard but not understood), and system error", "Escalate by count: Google's first reprompt is a short rephrase with a brief apology, never a verbatim repeat; the second adds options or examples; after about two failed attempts, exit gracefully to another path", "No-input: do not say 'I didn't hear you'; rephrase and offer options", "Alexa's version: first repeat, then explain, then suggest leaving the task", "Tone: no blaming the user and no over-apologizing; messages specific to the state the user is in, never one global 'sorry'; always a way out, a human or a menu", "Dialogflow CX: numbered event handlers, sys.no-match-1 to 6 and sys.no-input-1 to 6, set at flow, page or parameter level, plus reprompt handlers for form filling", "Weekly review: no-match by page points straight at design or NLU gaps"], "links": [{"label": "Baseline, NLP: conversation design", "url": "BASELINE.html#/nlp/conversation-design"}, {"label": "Guide: enterprise virtual assistant, deep dives", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives"}, {"label": "Vanguard prep: no-match and no-input", "url": "interviews/vanguard.html#/prep/q-how-do-you-handle-no-match-and-no-input"}], "ans": ["Three error types: no-input, no-match, system error", "Escalate help by count: rephrase, then options or examples, then exit to another path after about two failures", "No-input: never 'I didn't hear you'; rephrase and offer choices", "Messages specific to the state; no blame, no over-apology; always a way out", "In Dialogflow CX: numbered handlers, sys.no-match-1 to 6 and sys.no-input-1 to 6, at flow, page or parameter level"], "close": [{"k": "why", "q": "Why not repeat the same prompt word for word after a no-match?", "a": "If the words failed once they will likely fail again. A rephrase, then options or an example, gives the user a new way in; a repeat only adds a turn and frustration."}], "sdLinks": [], "read": [{"label": "Google conversation design: errors, no-input, no-match and escalation", "url": "https://developers.google.com/assistant/conversation-design/errors", "m": 10}, {"label": "Alexa: handling errors gracefully, reprompt escalation", "url": "https://developer.amazon.com/en-US/alexa/alexa-haus/patterns-and-components/patterns-errors", "m": 8}, {"label": "Dialogflow CX: event handlers, the numbered no-match and no-input events", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/handler", "m": 6}], "figs": ["repairLadder"]}, {"t": "Confirmation: implicit, explicit, and confidence", "m": 9, "out": "When do you confirm explicitly and when implicitly", "d": "Confirm in proportion to the cost of being wrong times the chance of being wrong. Over-confirming is a real cost too, so measure turn count and abandonment.", "pts": ["Implicit: Google's default, 'So, a table for two', keeps the flow and lets the user correct a mistake", "Explicit: a yes-or-no check reserved for irreversible or costly actions, deleting data, completing a transaction, sending a message, names and addresses", "Confidence in Lex: it returns a transcription confidence and up to three alternative transcriptions; its docs suggest reprompting when confidence is low and checking close candidates (John against Juan) against a database", "Confidence in Cognigy: above the confidence threshold (default 0.4) the intent is accepted; between that and the reconfirmation threshold (default 0.2) the bot asks 'did you mean X?'; below it nothing is found", "alfred_ decision layer: 'every candidate action classified into five verdicts (SILENT / NOTIFY / CONFIRM / CLARIFY / REFUSE) via deterministic risk scoring, not LLM-as-judge', the same policy in code", "alfred_ voice agent: drafts, reads back, confirms and sends once"], "links": [{"label": "Baseline, NLP: conversation design", "url": "BASELINE.html#/nlp/conversation-design"}, {"label": "Guide: enterprise virtual assistant, deep dives", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives"}, {"label": "Vanguard prep: explicit or implicit confirmation", "url": "interviews/vanguard.html#/prep/q-explicit-or-implicit-confirmation-when-do-you-use-which"}, {"label": "Vanguard prep: the decision layer at alfred_", "url": "interviews/vanguard.html#/prep/q-tell-me-about-the-decision-layer-at-alfred"}], "ans": ["Implicit by default: it keeps the flow and lets the user correct", "Explicit before irreversible or costly actions: payments, deletions, names, addresses, sending messages", "Raise it when ASR or NLU confidence is low, even for ordinary slots", "Confirm in proportion to the cost of being wrong times the chance of being wrong", "alfred_ makes this call per action in code: SILENT, NOTIFY, CONFIRM, CLARIFY or REFUSE"], "close": [{"k": "short", "q": "A caller says a name and ASR returns John and Juan with close scores. What do you do?", "a": "Use the N-best list: check both against the database, and if both exist, ask a short closed question or have them spell it. Confirm the chosen value before acting on it."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-safety/hitl-undo", "label": "Technique: Human confirmation and undo windows", "why": "Confirmation before an irreversible action."}], "read": [{"label": "Google conversation design: confirmations, explicit and implicit", "url": "https://developers.google.com/assistant/conversation-design/confirmations", "m": 6}, {"label": "Lex V2: transcription confidence and N-best transcripts", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/using-transcript-confidence-scores.html", "m": 8}, {"label": "Cognigy: the three NLU thresholds and their defaults", "url": "https://docs.cognigy.com/ai/platform-features/nlu/intents/thresholds", "m": 3}], "figs": ["repairLadder", "thresholdBands"]}, {"t": "Repair: disambiguation, digressions and corrections", "m": 10, "out": "A user changes their mind mid-flow, or asks something unrelated. How does the assistant handle it", "d": "Happy-path bots fail when the user changes their mind, asks something else, or says two things at once. Repair is how the assistant handles those turns and gets back to the task.", "pts": ["Disambiguation: a short closed question ('Do you mean the card or the account?') when the top two intents are close; Lex's docs call 0.75 against 0.72 ambiguous and 0.95 against 0.65 not", "Digressions: Dialogflow CX route groups at flow or agent level let 'cancel', 'agent' or FAQ intents match anywhere, pages are states with one current page, and session parameters carry context; Rasa returns to the interrupted flow afterwards", "Corrections: detect that an earlier slot is being updated, change the state, re-run only the steps that depend on it, and reconfirm the new value implicitly", "Over-answering: a user who gives the date and the city at once should skip both questions (Dialogflow CX prefills parameters; Rasa collect steps support ask_before_filling: false)", "Rasa CALM patterns: a checklist of what any mature assistant handles, correction, clarification, cannot handle, continue interrupted, cancel flow, skip question, chitchat, human handoff, internal error, repeat bot messages, user silence, validate slot", "The design question: what must be remembered deterministically (account, order ID, authentication state) and what can the model infer"], "links": [{"label": "Baseline, NLP: dialogue state", "url": "BASELINE.html#/nlp/dialogue-state"}, {"label": "Baseline, NLP: conversation design", "url": "BASELINE.html#/nlp/conversation-design"}, {"label": "Guide: enterprise virtual assistant, deep dives", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives"}, {"label": "Vanguard prep: ambiguity, corrections and digressions", "url": "interviews/vanguard.html#/prep/q-how-do-you-handle-ambiguity-corrections-and-digressions"}], "ans": ["Correction: spot that an earlier slot is being updated, change it, re-run only what depends on it, reconfirm implicitly", "Digression: global routes for cancel, agent and FAQ match anywhere, then return to the interrupted flow", "Disambiguation: a short closed question when the top two are close, 0.75 against 0.72, not 0.95 against 0.65", "Accept over-answering: fill every slot the user gave and skip those questions", "Account, order ID and auth state live in deterministic state, not with the model"], "close": [{"k": "why", "q": "Why test corrections and digressions as their own class of scenario?", "a": "Happy-path bots fail exactly there. A correction has to change state and re-run dependent steps, a digression has to come back; neither shows up in per-utterance accuracy."}], "sdLinks": [], "read": [{"label": "Rasa: the default conversation patterns, a checklist for repair", "url": "https://rasa.com/docs/reference/primitives/patterns/", "m": 5}, {"label": "Rasa: deviations from the happy path, digressions, corrections, cancellations", "url": "https://learning.rasa.com/rasa-pro/deviations-from-happypath/", "m": 6}, {"label": "Dialogflow CX: flows and route groups", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/flow", "m": 4}], "figs": ["thresholdBands"]}, {"t": "Handoff to a human", "m": 9, "out": "When should the assistant hand off to a human, and what goes with the handoff", "d": "Escalation is cold unless someone designs it otherwise (Twilio's guidance). Decide the triggers and what travels with the customer before you build.", "pts": ["Triggers: an explicit request (transfer at once, no further attempts), a second failed attempt, a high-stakes category, frustration or a shift in sentiment, regulated topics", "Payload: history, customer profile, identifiers, order number or tier, the intent, and what was already tried", "Summary: send an AI summary, not a 40-turn transcript; keep context across channels; write the outcome back to the customer record", "Warm transfer: the agent is briefed before the customer joins; fits high emotion, urgency and regulated topics", "Agents closed: offer a callback or a ticket, never a dead end", "Measure: the repeat-explanation rate, the time to first useful response after transfer, and handle time on escalated contacts, which should fall when the handoff carries context"], "links": [{"label": "Baseline, NLP: conversation design", "url": "BASELINE.html#/nlp/conversation-design"}, {"label": "Baseline, NLP: assistant metrics", "url": "BASELINE.html#/nlp/assistant-metrics"}, {"label": "Guide: enterprise virtual assistant, the whole design", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant"}, {"label": "Vanguard prep: handoff to a human", "url": "interviews/vanguard.html#/prep/q-when-should-the-assistant-hand-off-to-a-human-and-how"}], "ans": ["Triggers: an explicit request (at once), a second failure, high-stakes or regulated topics, frustration", "Payload: a summary, the intent, identifiers, profile, what was already tried", "Warm when stakes or emotions are high; it is cold unless someone designs otherwise", "No agents available: a callback or a ticket, never a dead end", "Measure repeat-explanation rate and resolution after handoff"], "close": [{"k": "short", "q": "What is the difference between a warm and a cold transfer?", "a": "In a warm transfer the agent is briefed with the summary and context before the customer joins. In a cold transfer the customer lands in a queue and often has to explain again."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives", "label": "Enterprise virtual assistant, deep dives", "why": "The handoff deep dive."}], "read": [{"label": "Twilio: AI-to-human handoff, warm against cold, the payload, summaries", "url": "https://www.twilio.com/en-us/blog/insights/ai-to-human-handoff-context", "m": 7}], "figs": ["vaTurn"]}, {"t": "Design one task end to end, aloud", "m": 9, "out": "Design the conversation for checking an order's status by voice: happy path, failure paths, confirmation, handoff and the metric", "d": "Put the pieces together on one task: checking an order's status by voice. The states live in code and the model understands, the same split the platforms use.", "pts": ["Start: from the top tasks by volume; write the happy path as a sample dialog and say it aloud", "Failure paths: no-match, no-input, system error (the order service times out), the user changes their mind, the user wants a human", "Slot order: ask for information in the order users know it, and accept over-answering", "Order number: alphanumeric, so in voice offer spelling or DTMF and confirm it before the lookup", "Menus: 3 to 5 options at most in voice", "Confirmation and handoff: no explicit confirmation here, since a status read changes nothing (a cancellation would); decide where handoff triggers and what goes in the payload", "The metric: task completion, with escalation and repeat contact as guardrails, not turn count", "MockFlow-AI: you used 'FSM-driven stage progression' and the 'LLM must call transition_stage()'; then open the guide's enterprise virtual assistant design and check what you missed"], "links": [{"label": "Guide: enterprise virtual assistant, high-level design", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/hld"}, {"label": "Baseline, NLP: assistant metrics", "url": "BASELINE.html#/nlp/assistant-metrics"}, {"label": "Vanguard prep: designing the conversation for a new use case", "url": "interviews/vanguard.html#/prep/q-how-do-you-design-the-conversation-for-a-new-use-case"}], "ans": ["Happy path written as a sample dialog and said aloud", "Failure paths: no-match, no-input, a service timeout, a change of mind, a request for a human", "Slots in the order users know them; the order number spelled or by DTMF, and confirmed", "Explicit confirmation only before anything irreversible; handoff triggers and payload decided up front", "Success is task completion, with escalation and repeat contact as guardrails"], "close": [{"k": "why", "q": "Why is turn count a poor primary metric for a conversation design?", "a": "Fewer turns can mean the user gave up or was handed off early. Task completion is what the design is for; turn count and abandonment are guardrails around it."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/requirements", "label": "Enterprise virtual assistant, requirements", "why": "The design you check your task against."}, {"href": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/dataflow", "label": "Enterprise virtual assistant, data flow", "why": "One turn through the assistant."}], "read": [{"label": "Dialogflow CX: pages as states, forms and routes", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/page", "m": 5}, {"label": "Rasa: flows, steps, collect, link, call", "url": "https://rasa.com/docs/rasa-pro/concepts/flows/", "m": 5}, {"label": "Baseline, NLP: conversation design, the short explainer", "url": "BASELINE.html#/nlp/conversation-design", "m": 3}], "figs": ["vaTurn", "intentTaxonomy"]}], "study": [], "quiz": [{"q": "Why put the question at the end of a voice prompt?", "a": "A listener cannot scan back, so the last thing heard is what they answer. Context first, the question last, and the whole prompt short."}, {"q": "Why not repeat the same prompt word for word after a no-match?", "a": "If the words failed once they will likely fail again. A rephrase, then options or an example, gives the user a new way in; a repeat only adds a turn and frustration."}, {"q": "A caller says a name and ASR returns John and Juan with close scores. What do you do?", "a": "Use the N-best list: check both against the database, and if both exist, ask a short closed question or have them spell it. Confirm the chosen value before acting on it."}, {"q": "Why test corrections and digressions as their own class of scenario?", "a": "Happy-path bots fail exactly there. A correction has to change state and re-run dependent steps, a digression has to come back; neither shows up in per-utterance accuracy."}, {"q": "What is the difference between a warm and a cold transfer?", "a": "In a warm transfer the agent is briefed with the summary and context before the customer joins. In a cold transfer the customer lands in a queue and often has to explain again."}, {"q": "Why is turn count a poor primary metric for a conversation design?", "a": "Fewer turns can mean the user gave up or was handed off early. Task completion is what the design is for; turn count and abandonment are guardrails around it."}], "hasTrackerQuiz": false, "figs": []}, {"id": "wc29", "name": "Intents, entities and the NLU model", "blurb": "The intent taxonomy, training data and out-of-scope, entities and dialogue state, thresholds, how the platforms differ, and where LLMs now fit.", "intro": "Intent and entity modelling is named in Friday's brief, and the likely client runs an enterprise NLU platform: Dialogflow CX, Cognigy, Lex or Microsoft's stack. You have built intent routing in alfred_, not on those platforms, so this session gives you the modelling rules they share, how they differ, and where LLMs now fit, so you can speak their language and say plainly what you have and have not used.", "len": "55m", "day": "5", "steps": [{"t": "The taxonomy: actions as intents, objects as entities", "m": 9, "out": "How do you design the intent taxonomy for a bank assistant", "d": "Actions and queries are intents; the information needed to fulfil them is entities (Microsoft CLU's rule). Each intent should map to a distinct next action or backend call.", "pts": ["Action and object: cancel is one intent and the product is an entity; do not build 'Cancel Contoso' as its own intent", "One style: pick one schema style and keep it across the project", "Merge or split: if two intents get the same flow and the same API call, merge them and use an entity; if the same words need different handling (card lost against card declined), split", "Past a few hundred: flat taxonomies break down; route by domain first (Dialogflow CX flows, or Microsoft's orchestration across CLU and question answering) and classify within it, or use head intents with a modifier entity", "Confusion matrix: finds overlap; intents mistaken for each other get merged or given more distinguishing examples", "For a bank: start from call and chat logs and rank tasks by volume and risk, not by the product catalogue; domains such as accounts, cards, loans and fraud; fraud and 'I want a human' get top-priority routes"], "links": [{"label": "Baseline: the map of NLP and conversational AI", "url": "BASELINE.html#/nlp"}, {"label": "Baseline, NLP: text classification", "url": "BASELINE.html#/nlp/text-classification"}, {"label": "Guide: enterprise virtual assistant, high-level design", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/hld"}, {"label": "Vanguard prep: the intent taxonomy for a bank", "url": "interviews/vanguard.html#/prep/q-how-would-you-design-the-intent-taxonomy-for-say-a-bank-assi"}], "ans": ["Start from call and chat logs; rank tasks by volume and risk, not by the product catalogue", "Actions are intents, products and accounts are entities; one style throughout", "Merge if two intents get the same flow and API call; split if the same words need different handling", "Route by domain first (accounts, cards, loans, fraud); fraud and 'a human' get top-priority routes", "An explicit out-of-scope bucket; validate on real utterances with a confusion matrix before building flows"], "close": [{"k": "short", "q": "Why not make 'cancel my Contoso subscription' its own intent?", "a": "Cancel is the action and the product is information. One cancel intent with a product entity covers every product; one intent per product multiplies near-duplicate intents that collide."}], "sdLinks": [], "read": [{"label": "Microsoft CLU: best practices, schema design and balance", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/best-practices", "m": 12}, {"label": "Baseline, NLP: intents and entities, the short explainer", "url": "BASELINE.html#/nlp/intents-entities", "m": 3}], "figs": ["intentTaxonomy"]}, {"t": "Training utterances and the out-of-scope intent", "m": 8, "out": "What makes good training data for an intent, and how do you train the None intent", "d": "An intent is only as good as its training phrases, and the out-of-scope bucket needs training too. The hard negatives are the ones that look like a supported intent.", "pts": ["Platform floors: Dialogflow CX recommends at least 10 to 20 training phrases per intent; Kore.ai's ML engine at least 8 to 10, balanced across intents; CLU flags under 15 labelled instances per intent and recommends at least 25 for its out-of-domain configuration; Cognigy's analyzer flags under 5", "CLU's quality rules: balance the classes, since imbalance biases toward big intents; vary casing and punctuation; avoid accidental patterns such as every example in lowercase or with the same prefix; diversify the wording, do not reorder it", "Sources: utterances from production logs, not only from the design team", "Test set: held out, never trained on, covering every intent", "Built-in out-of-scope: CLU's None intent has a score threshold and replaces a top intent below it (not applied during evaluation); Dialogflow CX has a default negative intent plus no-match; Lex returns AMAZON.FallbackIntent when every intent scores below the threshold", "Training None: near-miss false positives ('I want to buy a book' in a flight bot), greetings, yes and no, and bare numbers"], "links": [{"label": "Baseline, NLP: intents and entities", "url": "BASELINE.html#/nlp/intents-entities"}, {"label": "Guide: enterprise virtual assistant, the whole design", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant"}, {"label": "Vanguard prep: training phrases", "url": "interviews/vanguard.html#/prep/q-how-many-training-phrases-does-an-intent-need-and-where-do-t"}, {"label": "Vanguard prep: out-of-scope queries", "url": "interviews/vanguard.html#/prep/q-how-do-you-handle-out-of-scope-queries"}], "ans": ["Real utterances from production logs, not only the design team's", "Balanced across intents; varied casing, punctuation and wording; no accidental patterns", "Platform floors differ: Dialogflow CX 10 to 20 phrases, CLU warns under 15", "None gets near misses, greetings, yes and no, bare numbers", "A held-out test set, never trained on, covering every intent"], "close": [{"k": "why", "q": "Why train the None intent with near misses rather than random text?", "a": "Random text is easy to reject. The hard out-of-scope inputs look like a supported intent, 'buy a book' in a flight bot, and only examples like those teach the boundary."}], "sdLinks": [], "read": [{"label": "Dialogflow CX: intents, training phrases and the default negative intent", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/intent", "m": 5}, {"label": "Microsoft CLU: evaluation metrics and the None intent threshold", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/evaluation-metrics", "m": 12}, {"label": "Baseline, NLP: out-of-scope detection, the short explainer", "url": "BASELINE.html#/nlp/out-of-scope", "m": 3}], "figs": ["intentTaxonomy", "clfLadder"]}, {"t": "Entities, slots and dialogue state", "m": 9, "out": "What is your approach to entities and slot filling, and how do you measure it", "d": "Entities carry the information an intent needs, and the slots collected so far are the dialogue state. A right intent with a wrong entity still fails the task.", "pts": ["Entity types: system or prebuilt (date, number, email); lists with synonyms (a reference value plus its synonyms); regex (IDs, order numbers); composite; and machine-learned, where context decides", "CLU components: one entity can combine prebuilt, list, regex and learned components with 'required components'; a Ticket Quantity entity built only on the prebuilt number fires on '3 PM', so add a learned component and require it", "Lex slot types: custom slot types either expand values with ML (the default) or restrict resolution to the listed values and synonyms", "IDs and account numbers: deterministic extraction plus validation, not ML", "Roles: origin against destination city relies on cues like 'from', so make sure the signal exists in the data", "Slot filling: a Dialogflow CX page is a state whose form collects the required parameters, prefilled from the session or the matched intent, prompting only for what is missing; Lex elicits slots through code hooks (ElicitSlot, ConfirmIntent); Rasa uses collect steps", "Dialogue state tracking: the structured set of slot values at each turn, measured by joint goal accuracy, the share of turns with every slot right"], "links": [{"label": "Baseline, NLP: intents and entities", "url": "BASELINE.html#/nlp/intents-entities"}, {"label": "Guide: enterprise virtual assistant, high-level design", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/hld"}, {"label": "Vanguard prep: entities and slots", "url": "interviews/vanguard.html#/prep/q-how-do-you-model-entities-and-slots"}, {"label": "Vanguard prep: dialogue state", "url": "interviews/vanguard.html#/prep/q-what-is-dialogue-state-and-how-do-you-track-it"}], "ans": ["System entities for dates and numbers; lists with synonyms for closed sets; regex plus validation for IDs; learned where context decides", "Constrain prebuilt extractors so a number entity does not fire on '3 PM'", "Slots are dialogue state: prefill from what the user already said, prompt only for what is missing", "Validate in code against the system of record", "Measure joint goal accuracy, every slot right, because a right intent with a wrong entity still fails"], "close": [{"k": "short", "q": "What is joint goal accuracy, and why is it strict?", "a": "The share of turns where every slot in the dialogue state is right. One wrong slot fails the turn, which matches the task: a booking with the wrong date is a failed booking."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/entities", "label": "Enterprise virtual assistant, core entities", "why": "The assistant's state: session, slots, turns."}], "read": [{"label": "Dialogflow CX: entity types and synonyms", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/entity", "m": 5}, {"label": "Lex V2: custom slot types, expansion and resolution", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/custom-slot-types.html", "m": 5}, {"label": "Baseline, NLP: dialogue state, the short explainer", "url": "BASELINE.html#/nlp/dialogue-state", "m": 3}, {"label": "Baseline, NLP: sequence labelling and NER, the short explainer", "url": "BASELINE.html#/nlp/sequence-labelling", "m": 3}], "figs": ["vaTurn"]}, {"t": "Confidence thresholds and multi-intent", "m": 8, "out": "How do you set confidence thresholds", "d": "A confidence threshold decides when the assistant acts, confirms or falls back. Set it from evaluation data, never from a default.", "pts": ["Lex: sets nluIntentConfidenceThreshold per locale and returns the top intent with up to four alternates; its docs say scores are comparative, not absolute, and may change as the models improve, so do not hard-code absolute cutoffs", "Cognigy: three tiers, accept above 0.4 by default, reconfirm between 0.2 and 0.4, not found below; that act, confirm, reject pattern is a good general design", "CLU: needs a retrain and a republish after a threshold change, so a threshold change is a release", "From data: plot precision, recall and the cost of a wrong action against the threshold, per intent family", "Risk: high-risk intents get a higher bar and an explicit confirmation", "Margin: watch the gap between the top two scores as well as the top one; recalibrate after every model or training change", "Multi-intent: for 'open an account and send me the details', classic NLU returns one intent per turn, so split the utterance, queue the detected intents, or use an LLM planner; Copilot Studio's generative orchestration invokes the relevant topics in turn"], "links": [{"label": "Baseline, NLP: out-of-scope detection", "url": "BASELINE.html#/nlp/out-of-scope"}, {"label": "Baseline, NLP: classification metrics", "url": "BASELINE.html#/nlp/classification-metrics"}, {"label": "Guide: enterprise virtual assistant, deep dives", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives"}, {"label": "Vanguard prep: confidence thresholds", "url": "interviews/vanguard.html#/prep/q-how-do-you-set-confidence-thresholds"}], "ans": ["From evaluation data, never defaults: precision, recall and the cost of a wrong action against the threshold", "Three bands: act above, confirm or disambiguate in the middle, fall back below", "High-risk intents get a higher bar and an explicit confirmation", "Scores are model-specific and comparative; recalibrate after every model or data change", "Watch the margin between the top two as well as the top score"], "close": [{"k": "why", "q": "Lex says its confidence scores are comparative. What does that change for you?", "a": "A cutoff tuned on one model version is not a fixed truth: the scores can shift when the model is updated. So thresholds come from evaluation data, are re-checked after every model or training change, and a threshold change ships as a release."}], "sdLinks": [], "read": [{"label": "Lex V2: intent confidence scores, the threshold and alternates", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/using-intent-confidence-scores.html", "m": 5}, {"label": "Cognigy: the three NLU thresholds and their defaults", "url": "https://docs.cognigy.com/ai/platform-features/nlu/intents/thresholds", "m": 3}, {"label": "Copilot Studio: generative orchestration, the planner and its control layers", "url": "https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/generative-orchestration", "m": 12}], "figs": ["thresholdBands"]}, {"t": "How the platforms differ", "m": 10, "out": "Compare Dialogflow CX, Lex, Microsoft CLU and Copilot Studio, Rasa CALM, Kore.ai and Cognigy in one minute", "d": "Every enterprise platform models the same pieces under different names: deterministic flows, language understanding that picks the flow and fills slots, a generative layer, and fallback. Know each one's terms so you can speak the client's language.", "pts": ["Dialogflow CX: now Conversational Agents; flows (topics) contain pages (states), with routes, event handlers and route groups; intents with training phrases; entity types; test cases and experiments", "CX generative layer: generative fallback on no-match handlers (excluded from the CX SLA, with banned-phrase lists) and LLM-driven playbooks that call tools and hand off to flows; Google's split is playbooks for open-ended conversation, flows for deterministic work such as authentication or payment", "Amazon Lex V2: intents, slots and slot types, Lambda code hooks, confidence thresholds, FallbackIntent, KendraSearchIntent for FAQ, Test Workbench", "Microsoft CLU: intents, entities with components, the None intent, orchestration with question answering", "Copilot Studio: generative orchestration, where an LLM planner picks topics, tools and knowledge by name and description (names weigh more) and prompts for missing inputs; a deterministic layer for irreversible actions, a hybrid layer with approvals, a generative layer for low-risk Q and A", "Rasa CALM: an LLM only understands, emitting commands (start flow, set slot, cancel, clarify, correct slot, chitchat, knowledge answer, human handoff); business logic stays in deterministic flows; it can run hybrid with classic NLU", "Engines and analyzers: Kore.ai XO scores several engines (Fundamental Meaning, Machine Learning, Knowledge Graph, Traits, small talk) through a Ranking and Resolver, and its training validation shows a confusion matrix and k-fold results; Cognigy has intents with rules, thresholds per flow, and an Intent Analyzer that flags weak intents (below 0.6 red, 0.6 to 0.8 yellow) and overlaps", "IBM watsonx Assistant: not verified; say you would check its current docs"], "links": [{"label": "Baseline, NLP: intents and entities", "url": "BASELINE.html#/nlp/intents-entities"}, {"label": "Baseline, NLP: classic NLU and LLMs together", "url": "BASELINE.html#/nlp/nlu-llm-hybrid"}, {"label": "Guide: enterprise virtual assistant, high-level design", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/hld"}, {"label": "Vanguard prep: the platforms", "url": "interviews/vanguard.html#/prep/q-which-conversational-ai-platforms-do-you-know-and-how-do-the"}, {"label": "Vanguard prep: ramping up on their platform", "url": "interviews/vanguard.html#/prep/q-you-haven-t-used-our-platform-how-would-you-get-productive"}], "ans": ["Dialogflow CX: flows of pages as a state machine, route groups, numbered error handlers; playbooks and generative fallback on top", "Lex V2: intents, slots, Lambda hooks, FallbackIntent, KendraSearchIntent for FAQ", "CLU: intents and component entities with a None threshold; Copilot Studio adds an LLM planner over topics and tools", "Rasa CALM: the LLM only understands, emitting commands; deterministic flows hold the business logic", "Kore.ai ranks several engines; Cognigy has three thresholds and an Intent Analyzer"], "close": [{"k": "why", "q": "What do Dialogflow CX, Copilot Studio and Rasa CALM agree on, under different names?", "a": "Deterministic flows for authentication, payments and anything irreversible; language understanding, classic or LLM, decides which flow and fills the slots; a generative layer for open-ended help and FAQ; and thresholds with fallback for what was not understood."}], "sdLinks": [], "read": [{"label": "Dialogflow CX: playbooks, generative against flows", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/playbook", "m": 6}, {"label": "Rasa CALM: the LLM understands, flows hold the logic", "url": "https://rasa.com/docs/rasa-pro/calm/", "m": 3}, {"label": "Kore.ai: the NLP engines and the Ranking and Resolver", "url": "https://docs.kore.ai/xo/automation/natural-language/nlp-introduction/", "m": 6}], "figs": ["vaTurn"]}, {"t": "The LLM shift: hybrid routing, tools as intents, RAG, guardrails", "m": 11, "out": "Classic NLU or an LLM for intent classification, and how would you add an LLM to an existing bot safely", "d": "LLMs now sit beside or in place of the classic classifier, and the safe pattern is hybrid. The rule: the LLM proposes, deterministic code authorizes.", "pts": ["Zero and few-shot: removes the training pipeline and works at parity on broad label spaces; weaker on narrow in-domain tasks, and slower", "Decision rule (2026 preprint): a stable, labelled, latency-critical domain means a fine-tuned encoder; schemas that change per deployment or a need for out-of-scope recall mean an LLM; noisy ASR means hybrid", "Hybrid routing: Amazon, EMNLP 2024 industry track; send a turn to the LLM only when a SetFit classifier is uncertain (Monte Carlo dropout), within 2% of the LLM's accuracy with 50% less latency; large label spaces hurt out-of-scope accuracy, and a two-step method gave more than 5% gain on it for Mistral-7B", "Tools as intents: each tool is an intent and its typed arguments are slots; FnCTOD reported 5.6 points of joint goal accuracy gained for ChatGPT and 14 for GPT-4 by using function calling for zero-shot state tracking; validate the arguments with the same deterministic validators as before (regex, list lookups, database existence)", "RAG for FAQ: retrieval over a curated knowledge base replaces dozens of FAQ intents, grounded and cited; keep an intent for 'needs a transaction' so retrieval never answers account-specific questions", "Guardrails: NeMo Guardrails defines input, dialog, retrieval, execution and output rails; OWASP's 2025 top 10 for LLM apps names prompt injection, sensitive information disclosure, excessive agency, system prompt leakage, misinformation and unbounded consumption", "Adding an LLM safely: to a Dialogflow bot, start with generative fallback or retrieval-backed FAQ, keep transactions in flows, build a golden test set and a judge rubric first, and run it in shadow or on a small experiment share", "Your own: alfred_ routes through intent classification, a decision layer and tools, and a deterministic three-stage matcher in front of the LLM cut per-user LLM cost ~30%"], "links": [{"label": "Baseline, AI: RAG", "url": "BASELINE.html#/ai/rag"}, {"label": "Guide: enterprise virtual assistant, deep dives", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives"}, {"label": "Vanguard prep: classic NLU or an LLM", "url": "interviews/vanguard.html#/prep/q-classic-nlu-or-an-llm-for-intent-classification"}, {"label": "Vanguard prep: adding an LLM to a Dialogflow bot safely", "url": "interviews/vanguard.html#/prep/q-how-would-you-add-an-llm-to-an-existing-dialogflow-bot-safel"}], "ans": ["Stable, labelled, latency-critical: a fine-tuned encoder. Changing schemas, few labels or OOS-critical: an LLM", "Usually hybrid: a fast classifier takes confident turns, uncertain ones go to the LLM; one study: within 2% of the LLM's accuracy at half the latency", "A tool is an intent and its typed arguments are slots; validate them with the same deterministic validators", "FAQ intents become retrieval over a curated knowledge base; transactions keep their own intent", "Start with generative fallback or FAQ, keep auth and payments in flows; the LLM proposes, code authorizes"], "close": [{"k": "short", "q": "What does function calling replace in a classic NLU design, and what does it lose?", "a": "It replaces the intent classifier and slot filler: each tool is an intent, its arguments are slots, filled zero-shot from a schema. It loses determinism: tau-bench found tool-calling agents inconsistent across repeated runs, so keep a deterministic policy layer, validate arguments server side, and run each test several times."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/llm-cost/routing", "label": "Technique: Model routing and tiering", "why": "A cheap model first, the LLM only when needed."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/agent-safety/policy-gate", "label": "Technique: Deterministic policy gate", "why": "The LLM proposes, deterministic code authorizes."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/rag", "label": "Technique: Retrieval-augmented generation", "why": "FAQ intents become retrieval."}], "read": [{"label": "Intent Detection in the Age of LLMs (Amazon): hybrid SetFit and LLM routing; the abstract", "url": "https://arxiv.org/abs/2410.01627", "m": 5}, {"label": "FnCTOD: LLMs as zero-shot dialogue state trackers through function calling", "url": "https://arxiv.org/abs/2402.10466", "m": 25}, {"label": "OWASP Top 10 for LLM applications", "url": "https://genai.owasp.org/llm-top-10/", "m": 10}, {"label": "Baseline, NLP: classic NLU and LLMs together, the short explainer", "url": "BASELINE.html#/nlp/nlu-llm-hybrid", "m": 3}, {"label": "Baseline: tool calling, the short explainer", "url": "BASELINE.html#/ai/tool-calling", "m": 3}, {"label": "Baseline: guardrails, the short explainer", "url": "BASELINE.html#/ai/guardrails", "m": 3}, {"label": "Coding page: structured output and function calling, with code", "url": "CODING.html#structured", "m": 10}, {"label": "Light review, mphasis Prep: how tool calling works", "url": "interviews/mphasis.html#/prep/q-how-does-tool-calling-actually-work", "m": 3}], "figs": ["schemaRepair", "clfLadder"]}], "study": [], "quiz": [{"q": "Why not make 'cancel my Contoso subscription' its own intent?", "a": "Cancel is the action and the product is information. One cancel intent with a product entity covers every product; one intent per product multiplies near-duplicate intents that collide."}, {"q": "Why train the None intent with near misses rather than random text?", "a": "Random text is easy to reject. The hard out-of-scope inputs look like a supported intent, 'buy a book' in a flight bot, and only examples like those teach the boundary."}, {"q": "What is joint goal accuracy, and why is it strict?", "a": "The share of turns where every slot in the dialogue state is right. One wrong slot fails the turn, which matches the task: a booking with the wrong date is a failed booking."}, {"q": "Lex says its confidence scores are comparative. What does that change for you?", "a": "A cutoff tuned on one model version is not a fixed truth: the scores can shift when the model is updated. So thresholds come from evaluation data, are re-checked after every model or training change, and a threshold change ships as a release."}, {"q": "What do Dialogflow CX, Copilot Studio and Rasa CALM agree on, under different names?", "a": "Deterministic flows for authentication, payments and anything irreversible; language understanding, classic or LLM, decides which flow and fills the slots; a generative layer for open-ended help and FAQ; and thresholds with fallback for what was not understood."}, {"q": "What does function calling replace in a classic NLU design, and what does it lose?", "a": "It replaces the intent classifier and slot filler: each tool is an intent, its arguments are slots, filled zero-shot from a schema. It loses determinism: tau-bench found tool-calling agents inconsistent across repeated runs, so keep a deterministic policy layer, validate arguments server side, and run each test several times."}], "hasTrackerQuiz": false, "figs": []}, {"id": "wc30", "name": "Error analysis and production improvements", "blurb": "Per-intent metrics and the confusion matrix, mining misses, transcript review, testing and simulation, KPIs that tell the truth, experiments and release; then your own work and where you have not worked.", "intro": "Error analysis and production improvement is where you are strongest: alfred_ runs a production-failure scanner over real conversations, and every action passes a deterministic decision layer. This session gives that work the enterprise names (confusion matrix, failure taxonomy, containment, experiments) and ends with the bridge from your system to theirs, including what you have not used.", "len": "55m", "day": "6", "steps": [{"t": "Per-intent metrics and the confusion matrix", "m": 9, "out": "Two intents keep getting confused. What do you do", "d": "Per-intent numbers and the confusion matrix show where the model fails, which an overall F1 hides. When two intents collide, read the utterances before changing anything.", "pts": ["Per-intent: precision, recall and F1, which CLU defines from true and false positives and negatives", "Micro and macro: micro, model-level F1 sums the counts across intents and entities; report macro too, so rare intents are not hidden", "Confusion matrix: shows which intents are mistaken for each other; its row and column sums give the false negatives and false positives per intent", "Entities separately: CLU's worked example has the right intent with the wrong entity span", "Voice: track word error rate and slot error rate on the real audio, not typed text", "Overlap signals: the off-diagonal cells, Kore.ai's validation, Cognigy's Intent Analyzer, and a small margin between the top two scores", "When two collide: read the misclassified utterances, not only the F1; merge if they are one intent with different entities, split with contrastive examples if they are distinct actions with similar wording; check for data bias, such as one intent with twice the examples or a stray phrase pattern", "If the words cannot separate them: keep both and ask a short question when the margin is small; then re-run the frozen test set to confirm the errors did not move to a neighbour"], "links": [{"label": "Baseline: the map of NLP and conversational AI", "url": "BASELINE.html#/nlp"}, {"label": "Baseline, audio: speech recognition", "url": "BASELINE.html#/audio/asr"}, {"label": "Guide: enterprise virtual assistant, deep dives", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives"}, {"label": "Vanguard prep: two intents keep getting confused", "url": "interviews/vanguard.html#/prep/q-two-intents"}, {"label": "Vanguard prep: evaluating an NLU model beyond accuracy", "url": "interviews/vanguard.html#/prep/q-how-do-you-evaluate-an-nlu-model-beyond-accuracy"}], "ans": ["Read the confusion matrix and the misclassified utterances themselves, not only F1", "Same action, different objects: merge and use an entity. Different actions, similar words: split with contrastive examples", "Check the data for bias: one intent with twice the examples, or a stray phrase pattern", "If the words cannot separate them, keep both and ask a short question when the margin is small", "Re-run the frozen test set so the errors have not moved to a neighbour"], "close": [{"k": "short", "q": "Why evaluate entities separately from intents?", "a": "A turn can get the intent right and the entity wrong, the wrong date or the wrong account, and the task still fails. An intent-only metric would score it a success."}], "sdLinks": [], "read": [{"label": "Microsoft CLU: evaluation metrics, the confusion matrix and its sums", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/evaluation-metrics", "m": 12}, {"label": "Kore.ai: training validations, confusion matrix, k-fold, conflict warnings", "url": "https://docs.kore.ai/xo/automation/natural-language/training/training-validations/", "m": 5}, {"label": "Cognigy: the Intent Analyzer, weak and overlapping intents", "url": "https://docs.cognigy.com/ai/empower/nlu/intents/intent-analyzer/", "m": 4}, {"label": "Baseline, NLP: error analysis, the short explainer", "url": "BASELINE.html#/nlp/error-analysis", "m": 3}, {"label": "Baseline, NLP: classification metrics, the short explainer", "url": "BASELINE.html#/nlp/classification-metrics", "m": 3}], "figs": ["confusionMatrix"]}, {"t": "Mining misses and reviewing transcripts", "m": 10, "out": "How do you find the intents you are missing, and how do you structure transcript review", "d": "The intents you are missing are in the fallback and escalation logs. Transcript review finds the failures a per-utterance metric never shows, and gives each one cause.", "pts": ["Mining misses: take fallback and low-confidence utterances plus escalated conversations, embed them, cluster them (HDBSCAN or k-means), and have an LLM name each cluster", "Rank and decide: rank clusters by volume times business cost; each becomes a new intent, more examples for an existing intent, the None bucket, or a content gap for retrieval", "Check proposals: against the existing taxonomy so you do not create overlap, and on a held-out sample", "Conversation-driven development: Rasa's frame for the same loop; review real conversations, tag them, find patterns, fix in batches", "Sampling: by stratum, not only at random; every escalation, abandoned sessions, low-confidence turns, sessions with negative feedback, and a random slice; review whole conversations, because many failures are dialog failures", "Labelling: two labellers on a subset with agreement measured, a labelling guide with edge-case rulings, a gold set", "One primary cause: ASR error (voice), NLU miss, entity or slot error, dialog logic or design, backend or API failure or timeout, knowledge or content gap, policy (it legitimately cannot do it), or abandonment with no failure signal", "Report: the split tells you whether to fix training data, flows, integrations or the product; report it as a share of lost containment"], "links": [{"label": "Baseline, NLP: sentence embeddings", "url": "BASELINE.html#/nlp/sentence-embeddings"}, {"label": "Guide: enterprise virtual assistant, deep dives", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives"}, {"label": "Vanguard prep: finding the intents you are missing", "url": "interviews/vanguard.html#/prep/q-how-do-you-find-the-intents-you-re-missing"}, {"label": "Vanguard prep: transcript review", "url": "interviews/vanguard.html#/prep/q-how-do-you-structure-transcript-review"}], "ans": ["Collect fallback, low-confidence and escalated turns; embed, cluster, have an LLM name each cluster", "Rank by volume times business cost; decide: new intent, existing intent, None, or content for retrieval", "Review whole conversations, sampled by stratum: escalated, abandoned, low confidence, negative feedback, random", "One primary cause each: ASR, NLU, entity, dialog design, backend, content, policy, abandonment", "Two labellers on a subset; every label becomes a test case or a training example"], "close": [{"k": "why", "q": "Why label one primary cause per failed conversation?", "a": "The split tells you who fixes it: training data, flow design, an integration, or the product. Reported as a share of lost containment, it ranks the work."}], "sdLinks": [], "read": [{"label": "Rasa: conversation-driven development, review, tag, fix", "url": "https://rasa.com/docs/rasa/conversation-driven-development/", "m": 4}, {"label": "Baseline, NLP: error analysis, the short explainer", "url": "BASELINE.html#/nlp/error-analysis", "m": 3}], "figs": ["errorLoop"]}, {"t": "Testing: golden conversations, simulation, judges", "m": 10, "out": "How do you test a conversational system before release", "d": "Test in three layers before release, and run each scenario more than once, because one success overstates reliability. Real transcripts stay the anchor.", "pts": ["Three layers: an NLU test set (utterance to intent and entities), scripted dialog tests for happy and failure paths, and a never-break suite of high-value or high-risk scenarios", "Dialogflow CX test cases: golden conversations with turn-level expectations (response, flow, intent, page) and conversation-level ones (tool and flow invocations), run against environments or versions with coverage of transitions, intents and route groups", "Lex Test Workbench: builds test sets from existing transcripts", "Simulation: tau-bench has an LLM play the user against domain tools and policy documents and scores the final database state", "pass^k: the chance that all k trials succeed; GPT-4o function-calling agents solved under half the retail tasks and had pass^8 under 25%", "Simulated users: more cooperative than real ones, so real transcript replay stays the anchor", "LLM-as-judge: the MT-bench study found strong judges agreed with humans over 80% of the time, about the human-to-human rate, with position, verbosity and self-enhancement biases", "Judge rubric: a rubric per criterion (task success, policy adherence, groundedness, tone, unnecessary escalation), binary or small scales, randomized order for pairwise comparisons, calibration against a human-labelled set, judge-human agreement tracked, never the only gate for compliance; judge whole conversations with their tool traces"], "links": [{"label": "Baseline, NLP: error analysis", "url": "BASELINE.html#/nlp/error-analysis"}, {"label": "Guide: enterprise virtual assistant, deep dives", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives"}, {"label": "Vanguard prep: testing before release", "url": "interviews/vanguard.html#/prep/q-how-do-you-test-a-conversational-system-before-release"}, {"label": "Vanguard prep: LLM-as-judge on conversations", "url": "interviews/vanguard.html#/prep/q-how-do-you-use-an-llm-as-a-judge-on-conversations-and-where-"}], "ans": ["An NLU test set with per-intent metrics", "Golden conversations with turn-level expectations: response, intent, page, tool calls", "Simulated users for breadth, each scenario run several times: pass^k, because one success overstates reliability", "Rubric judges calibrated against human labels; never the only gate for compliance", "A never-break suite gates the release; then a canary on live traffic"], "close": [{"k": "short", "q": "What does pass^k measure, and why does it matter for an assistant?", "a": "The chance that all k runs of the same scenario succeed. A model that passes once may fail the next run; tau-bench found pass^8 under 25% in retail for agents that solved under half the tasks once."}, {"k": "why", "q": "What are the limits of LLM-as-judge for conversations?", "a": "Strong judges agree with humans over 80% of the time, about the human-to-human rate, but show position, verbosity and self-enhancement bias. So use a rubric with small or binary scales, randomize order, calibrate against a human-labelled set, track agreement, and never make it the only gate for compliance."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Technique: Eval suites as release gates", "why": "An eval suite as the release gate."}], "read": [{"label": "Dialogflow CX: test cases, golden conversations and coverage", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/test-case", "m": 5}, {"label": "tau-bench: simulated users, tools, policies and pass^k", "url": "https://arxiv.org/abs/2406.12045", "m": 30}, {"label": "Baseline: evaluation, the short explainer", "url": "BASELINE.html#/ai/evaluation", "m": 3}, {"label": "Baseline: LLM-as-judge, the short explainer", "url": "BASELINE.html#/ai/llm-as-judge", "m": 3}, {"label": "Coding page: evals, with code", "url": "CODING.html#evals", "m": 10}, {"label": "Light review, zenml-round3 Prep: pass@k or pass^k", "url": "interviews/zenml-round3.html#/prep/q-pass-k-or-pass-k", "m": 3}, {"label": "Light review: wc13, your story: the alfred_ eval bench", "url": "index.html#/w/wc13", "m": 10}], "figs": ["passk", "evalHarness"]}, {"t": "KPIs that tell the truth", "m": 8, "out": "Which KPIs do you report for a virtual assistant, and which ones mislead", "d": "Containment, conversations that never reached a human, misleads on its own: a bot can contain by being a wall. Pair it with outcome metrics and break everything down per intent.", "pts": ["Rasa's terms: deflection (AI-only conversations), containment (the customer did not come back through another channel for the same issue, hard to measure without identity), automation rate (workflows completed), solution rate (the customer confirms it is resolved), and CSAT", "No-match rate: Dialogflow CX defines it as the share of conversations, or turns in its troubleshooting view, that hit no-match, shown per page, with escalation and exit rates per page and per intent", "Pairing: containment with task completion and repeat contact within 24 to 72 hours", "Also track: CSAT, drop-off by turn, and handle time on escalated contacts, which should fall when the handoff carries context", "Per-intent funnel: intent recognized, required slots filled, authenticated, backend call succeeded, confirmation shown, completed", "Clean first: filter to business conversations (no greetings, tests or spam) before computing any rate", "Resolution: computed from outcomes (explicit confirmation, no repeat contact), never as one minus escalation"], "links": [{"label": "Baseline, NLP: error analysis", "url": "BASELINE.html#/nlp/error-analysis"}, {"label": "Guide: enterprise virtual assistant, deep dives", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives"}, {"label": "Vanguard prep: KPIs and which mislead", "url": "interviews/vanguard.html#/prep/q-which-kpis-do-you-report-and-which-ones-mislead"}, {"label": "Vanguard prep: containment dropped 10%", "url": "interviews/vanguard.html#/prep/q-containment-dropped-10-after-a-release-walk-me-through-it"}], "ans": ["Containment misleads alone: a wall contains", "Pair it with solution rate (the customer confirms) and repeat contact within 24 to 72 hours", "No-match by page, escalation by intent, and drop-off through a per-intent funnel", "Handle time on escalated contacts should fall if the handoff carries context", "Filter out greetings, tests and spam first; resolution comes from outcomes, not one minus escalation"], "close": [{"k": "why", "q": "Containment dropped 10% after a release. What are your steps?", "a": "Confirm it is real: the metric definition, the pipeline, the traffic mix. Break it down by intent, channel, flow, page and version to find where it moved; read no-match, escalation reasons, webhook errors and abandonment by page. Roll back the regressed flow while reading transcripts for the cause, then add a regression test and an alert."}], "sdLinks": [], "read": [{"label": "Rasa blog: measuring agent performance, deflection, containment, solution rate", "url": "https://rasa.com/blog/measure-ai-agent-performance-in-the-contact-center", "m": 6}, {"label": "Dialogflow CX: analytics, outcomes, escalation, no-match, webhook errors", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/analytics", "m": 5}, {"label": "Baseline, NLP: assistant metrics, the short explainer", "url": "BASELINE.html#/nlp/assistant-metrics", "m": 3}], "figs": ["errorLoop"]}, {"t": "Experiments, drift, release and rollback", "m": 8, "out": "How do you run an A/B test on a flow, and how do you ship and roll back safely", "d": "A prompt, knowledge, threshold or flow change is a release and ships like code. Experiments show whether a change helped; drift monitoring shows when the world moved.", "pts": ["CX experiments: Dialogflow CX splits live traffic between a control flow version and up to four variants, compares live-agent handoff rate, session end rate, no-match count and average turn count, and supports auto rollout in steps with stop conditions", "Practice: one change at a time, assignment by user or session (never by turn), full weekly cycles, a pre-registered primary metric such as task completion, and guardrail metrics (escalation, CSAT, repeat contact)", "Improvement loop: log low-confidence and fallback turns, cluster, label, add to training or knowledge, retrain, check against the frozen test set, ship; prioritize by volume times business cost and watch that the test set does not drift into training", "Drift signals: intent mix (a launch or an outage changes it), confidence distribution, fallback rate, webhook errors and latency, escalation by intent; for LLM paths, groundedness, refusal rate, tool error rate, cost and latency", "Alerts: against a rolling baseline, with dashboards annotated with releases, campaigns and outages", "Release: version the agent, run regression and golden tests before deploy, promote through environments, canary to a small share, keep the previous version live for rollback", "Same pipeline: a prompt or knowledge-base change goes through it like code, and so does a threshold; CLU needs a retrain and republish after one"], "links": [{"label": "Baseline, NLP: assistant metrics", "url": "BASELINE.html#/nlp/assistant-metrics"}, {"label": "Baseline, NLP: error analysis", "url": "BASELINE.html#/nlp/error-analysis"}, {"label": "Guide: enterprise virtual assistant, deep dives", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives"}, {"label": "Vanguard prep: A/B testing a flow", "url": "interviews/vanguard.html#/prep/q-how-would-you-a-b-test-a-change-to-a-flow"}, {"label": "Vanguard prep: monitoring for drift", "url": "interviews/vanguard.html#/prep/q-how-do-you-monitor-a-live-assistant-for-drift"}], "ans": ["Split by user or session, one change at a time, through full weekly cycles", "One primary metric, task completion; guardrails: escalation, CSAT, repeat contact", "Drift: intent mix, confidence, fallback and errors against a rolling baseline, annotated with releases and campaigns", "Version everything; golden tests gate the deploy; canary, and keep the last version live", "A prompt, knowledge or threshold change is a release and goes through the same pipeline"], "close": [{"k": "short", "q": "The fallback rate jumps overnight. What are the two usual explanations?", "a": "A new topic users started asking about, which needs an intent or content, or a regression from a release, which needs a rollback. The dashboard annotations for releases, campaigns and outages tell you which to check first."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/shadow-online", "label": "Technique: Shadow mode and online signals", "why": "Shadow mode and online signals before a full rollout."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Technique: Eval suites as release gates", "why": "Golden tests gate the deploy."}], "read": [{"label": "Dialogflow CX: experiments, traffic split, metrics and auto rollout", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/experiments", "m": 4}, {"label": "Lex V2: Test Workbench, test sets from transcripts", "url": "https://docs.aws.amazon.com/lexv2/latest/dg/test-workbench.html", "m": 2}], "figs": ["evalHarness", "errorLoop"]}, {"t": "Your own work, and where you have not worked", "m": 10, "out": "Tell me about error analysis and production improvement you have done on a conversational system", "d": "Say your work in their words, then say plainly where you have not worked. Bridge once, and keep the whole answer to two minutes.", "pts": ["alfred_ pipeline: 'Inbound message (SMS/web) routed through intent classification → decision layer → callable tools', for 5,000+ active users", "Failure scanner: scans real production conversations, classifies genuine failures against expected behaviour, and auto-promotes real bugs for triage; transcript review and the failure taxonomy, automated", "Decision layer: 'every candidate action classified into five verdicts (SILENT / NOTIFY / CONFIRM / CLARIFY / REFUSE) via deterministic risk scoring, not LLM-as-judge', the confirmation policy of a virtual assistant, in code", "Three-stage matcher: deterministic, in front of the LLM, it 'cut per-user LLM cost ~30%', the hybrid routing pattern", "Voice eval harness: runs 34 scenarios and names a winning configuration only if it passes every gate (session wc23)", "MockFlow-AI: 'FSM-driven stage progression' where the 'LLM must call transition_stage()'; deterministic flow, LLM understanding, the same split as Rasa CALM", "Where you have not worked: you have not built on Dialogflow CX, Lex, CLU, Kore.ai or Cognigy, and you have no per-intent F1 figure of your own, so do not offer one", "The bridge: the loop is the same, and in the first week you would read their confusion matrix, their no-match rate by page and a stratified transcript sample"], "links": [{"label": "Baseline, NLP: error analysis", "url": "BASELINE.html#/nlp/error-analysis"}, {"label": "Baseline, NLP: classic NLU and LLMs together", "url": "BASELINE.html#/nlp/nlu-llm-hybrid"}, {"label": "Guide: enterprise virtual assistant, the whole design", "url": "SYSTEM%20DESIGN.html#/designs/virtual-assistant"}, {"label": "Vanguard prep: the production failure scanner", "url": "interviews/vanguard.html#/prep/q-tell-me-about-the-production-failure-scanner"}, {"label": "Vanguard prep: improving an assistant from production data", "url": "interviews/vanguard.html#/prep/q-tell-me-about-a-time-you-improved-an-assistant-from-producti"}], "ans": ["alfred_: 'intent classification → decision layer → callable tools', for 5,000+ active users", "A production-failure scanner reads real conversations, separates genuine failures from expected behaviour, and promotes real bugs to triage", "Every action gets one of five verdicts, SILENT, NOTIFY, CONFIRM, CLARIFY or REFUSE, by deterministic risk scoring, not LLM-as-judge", "A deterministic three-stage matcher in front of the LLM cut per-user LLM cost ~30%", "Plainly: I have not built on Dialogflow CX, Lex or Cognigy; the loop is the same, and I would start from their confusion matrix, no-match by page and a transcript sample"], "close": [{"k": "short", "q": "The interviewer asks whether you have used Dialogflow CX. What do you say?", "a": "Not on that platform. Then the bridge: I have built the same loop, intent routing, a decision layer, failure scanning on real conversations, and I know how CX models it: flows of pages, route groups, numbered no-match handlers, test cases and experiments."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/deepdives", "label": "Enterprise virtual assistant, deep dives", "why": "Where your own system maps onto the enterprise design."}], "read": [{"label": "Light review, coframe Prep: what evaluation harness you have worked on", "url": "interviews/coframe.html#/prep/q-what-evaluation-harness-have-you-worked-on", "m": 3}, {"label": "Light review: wc23, your voice agent at depth, drawn cold", "url": "index.html#/w/wc23", "m": 10}, {"label": "Light review: wc13, your story: the alfred_ eval bench", "url": "index.html#/w/wc13", "m": 10}], "figs": ["voicePipeline", "turnTaking"]}], "study": [], "quiz": [{"q": "Why evaluate e
