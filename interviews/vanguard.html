r mechanic. A FAQ is grounded by retrieval and a citation, a balance by an API call the model never rewrites, a transfer by a state machine with a confirm step, and a compliance answer by approved text.", "The way I'd do it is to ask for each intent: where does the truth live, and what is the one thing that must never be generated here? That sets the control and the eval."], "deep": "The useful mental move is to sort every intent by the cost of being wrong and by where the source of truth lives. Read-only knowledge answers can tolerate retrieval plus a check, because the worst case is a wrong sentence that a citation lets a reader catch. Personal data and money are different in kind: the truth is in a system of record, so the right design takes the model out of the value path entirely and uses it only to understand the request and phrase the frame around a value that code inserted.\n\nThe second axis is who is accountable. In regulated finance the firm owns what the assistant says. The Air Canada tribunal ruling treated the chatbot as part of the company website and held the airline liable for a wrong refund policy it stated, and FINRA's notice says its communications rules apply to AI-generated content the same way they apply to anything else. So 'the model said it' is never a defence, which pushes firms toward approved content and deterministic paths wherever a statement could be relied on.\n\nWith LLMs the classic trade-off shifts but does not vanish. Generative models make the long tail of FAQ and agent-assist work far better, which is why firms adopt them there first. They make the transactional and account paths no safer, so the mature pattern is a hybrid: an LLM front end for understanding and tone, deterministic back end for anything that moves money or states a personal fact. Each path then gets its own evaluation set, because one blended 'accuracy' number hides exactly the failure that matters (for example 97% on FAQ and one wrong balance).", "sources": [{"label": "Rasa: CALM, language models with deterministic business logic", "url": "https://rasa.com/docs/learn/concepts/calm/", "why": "Public description of the LLM-understands, flows-decide split."}, {"label": "American Bar Association: BC tribunal confirms companies remain liable for chatbot information", "url": "https://www.americanbar.org/groups/business_law/resources/business-law-today/2024-february/bc-tribunal-confirms-companies-remain-liable-information-provided-ai-chatbot/", "why": "Moffatt v. Air Canada: the firm owns what its bot says."}, {"label": "FINRA: Regulatory Notice 24-09", "url": "https://www.finra.org/rules-guidance/notices/24-09", "why": "Technology-neutral rules apply to generative AI output."}]}, {"id": "c-faq-retrieval-groundedness", "title": "Knowledge and FAQ answers: retrieval, citations, approved content and a groundedness check", "brief": "A FAQ answer is grounded when every claim traces to a passage from an approved, current corpus, and the system can show which passage. Retrieval alone is not enough: the model can still add a claim that the passage never made, so production stacks add a separate groundedness check on the draft answer and abstain when it fails.", "practice": ["Corpus: curate approved, versioned content with owner, effective date and expiry. Chunk by the document's own structure (a fee schedule row or a policy section) so a chunk carries its own heading and date, and re-index when content changes.", "Groundedness check: Google's check-grounding API takes an answer candidate (up to 4,096 tokens) and up to 200 fact chunks, returns an overall support score from 0 to 1 plus per-claim citations, and is designed to run under about 500 ms.", "Amazon Bedrock Guardrails contextual grounding scores grounding and relevance separately, each with a threshold from 0 to 0.99 (0.7 is a common starting point). Note the documented limit: it does not support conversational QA or chatbot use cases, so you pass it a single question and source.", "Azure AI Content Safety groundedness detection checks claims against provided sources, can return a reasoning explanation and a suggested correction, is English only, and was in preview with a 55,000 character source limit.", "RAGAS faithfulness is the offline version: split the answer into claims, check each against retrieved context, score supported claims over total claims.", "Grounding check and relevance check catch different errors: a true but off-topic answer is grounded and irrelevant (AWS's own banking example is a credit card late fee given in reply to a checking account fee question)."], "say": ["For FAQs I'd retrieve from approved content, answer only from the passages, cite them, and run a separate groundedness check on the draft, abstaining and handing off if it scores under the threshold.", "I'd set the threshold from a labelled set of real questions, not from a default, because the cost of a false pass is much higher here than the cost of a false block."], "deep": "Faithfulness has two halves and teams often fix only one. Retrieval quality decides whether the right passage reached the model; groundedness decides whether the answer stayed inside it. A wrong answer with the right passage is a generation fault, and a wrong answer because the passage never arrived is a retrieval fault. Error analysis should split them, because the fix is different (rerankers, chunking and query rewriting for the first, prompt, model choice and a check step for the second).\n\nFreshness is where finance gets hurt. Rates, fees, hours and eligibility change, and a stale chunk is a confident wrong answer with a real citation attached. The controls are boring and effective: effective-date and expiry metadata on every chunk, retrieval filters that drop expired content, re-index on publish rather than on a schedule, and a content owner who is paged when a source goes stale.\n\nGroundedness detectors are themselves models, so they have error rates and need calibration. The threshold trades blocks of good answers against passes of bad ones. Measure both on a few hundred labelled answers, per intent, and expect the check to be weakest on numbers, negations and conditions ('no fee unless'), which are exactly the claims that matter in finance. Streaming makes it harder: AWS notes the relevance verdict can arrive after the answer has already streamed, so regulated flows often buffer the answer, check, then release.", "sources": [{"label": "Google Cloud: Check grounding with RAG", "url": "https://docs.cloud.google.com/generative-ai-app-builder/docs/check-grounding", "why": "Inputs, per-claim citations and support score, size limits and latency target."}, {"label": "AWS: Contextual grounding check in Bedrock Guardrails", "url": "https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html", "why": "Grounding vs relevance, thresholds, limits, banking fee examples, no conversational QA support."}, {"label": "Microsoft: What is Azure AI Content Safety", "url": "https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview", "why": "Groundedness detection feature with reasoning and correction."}, {"label": "Ragas: Faithfulness", "url": "https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/faithfulness/", "why": "Claim decomposition formula and its caveats."}]}, {"id": "c-account-data-never-generated", "title": "Account and personal data: from a tool call, never generated, authenticated first", "brief": "A balance, a rate on my account or a last transaction must come from the system of record through an API call, and the number must be inserted by code into a template. The model may decide which tool to call and may phrase the sentence around it, but it never produces the digits. Authentication comes before any data tool is even offered.", "practice": ["Gate by auth level: an unauthenticated session only gets knowledge tools. Account tools are registered per session after authentication, so the model cannot call what it was never given.", "Bind identity in code: the customer or account id is taken from the session and injected server-side, never from model output, so a prompt injection cannot ask for someone else's data.", "Template rendering: the tool returns structured fields (amount, currency, as-of time), and a template formats them. The as-of timestamp is shown so a stale cached figure is visible.", "Post-check: a deterministic validator confirms every number in the final text appears in the tool result, and blocks the reply if not.", "Bank of America's Erica, a deterministic NLP assistant with over 700 intent types, is the long-running example of an account assistant that avoids free generation."], "say": ["I treat account numbers as data, not text. The tool returns them, a template renders them, and a check confirms every digit in the reply came from the tool result.", "The model should never be able to ask for a different customer's data, so identity comes from the session in code, not from anything the model writes."], "deep": "The failure modes are not only hallucination. The first is the model writing a plausible figure instead of calling the tool (fixed by making the tool call mandatory for that intent and rendering by template). The second is the right figure for the wrong person, usually a prompt injection or a context mix-up in a long session (fixed by binding identity outside the model). The third is a stale figure presented as live (fixed by as-of timestamps and cache rules). The fourth is leaking more than needed, such as a full account number in a transcript, which is where redaction and logging controls come in.\n\nLLMs still add value on this path: they handle the messy ways people ask ('how much do I have left after rent') and pick the tool and arguments. A common pattern is function calling with a strict schema, where arguments are validated like any untrusted input, and the model's text is limited to the phrasing around values it did not produce.\n\nOne honest tension is explainability: users ask 'why was I charged this', which mixes personal data and policy knowledge. That is a two-source answer, transaction record plus approved fee text, and the safest design returns each from its own grounded path and lets a template or tightly constrained generation join them.", "sources": [{"label": "CIO Dive: How Bank of America's Erica raised the stakes for virtual assistants", "url": "https://www.ciodive.com/news/bank-of-america-erica-virtual-assistants/758901/", "why": "Deterministic design, over 700 intents, transactions and routing."}, {"label": "NVIDIA: NeMo Guardrails rail types", "url": "https://docs.nvidia.com/nemo/guardrails/latest/about/rail-types.html", "why": "Execution rails validate tool calls, parameters and results."}]}, {"id": "c-transactions-state-machine", "title": "Transactional flows: a state machine, slot confirmation, explicit confirm, idempotency", "brief": "When money moves, the LLM is a parser and a speaker, not the decider. A deterministic flow owns the steps, required slots, validation and the confirm turn, and the backend call carries an idempotency key so a retry cannot pay twice. The model's job is to understand the user, including corrections and interruptions, and map them to flow commands.", "practice": ["Slots: amount, payee, source account and date are each filled, validated against the backend (does the payee exist, are funds available) and read back.", "Explicit confirm: a distinct turn that states the exact action ('send 250.00 from checking ending 1234 to X today') and requires a clear yes. A vague earlier statement never counts as confirmation.", "Idempotency: a client-generated key per intended action. Stripe's public design stores the first result for a key, returns it on retry, errors if parameters differ, and prunes keys after about 24 hours.", "Interruptions and corrections ('actually make it 200') are handled by the dialogue manager as commands on the active flow. Rasa CALM names topic changes, corrections and clarifications as built-in patterns.", "Limits and step-up: per-transaction caps, new-payee checks and step-up authentication are enforced by the backend, so even a fooled model cannot exceed them.", "Erica completes transactions such as bill payments and transfers inside a deterministic engine, not through free generation."], "say": ["I'd keep the transaction in a state machine: the LLM fills slots and handles corrections, but code validates, asks for an explicit confirm turn, and calls the backend with an idempotency key.", "The rule I'd hold is that the model can propose an action but can never be the thing that authorises it."], "deep": "Two failure modes dominate. One is the premature action: the model treats a casual 'sure, that works' as consent, or acts on a slot it inferred. The cure is structural, because the confirm step is a state in the flow and the execute call is unreachable from any other state. The other is the duplicate or lost action under retries and timeouts, where the user says 'did that go through' and the system cannot tell. Idempotency keys plus a status lookup tool (which returns the recorded outcome) fix both.\n\nFINRA's 2026 oversight report lists agent risks that map directly onto this: autonomy beyond intended scope, unclear authority, and poor auditability of multi-step reasoning. The control it points to is constraining agents and tracking their actions, which is what a flow with an audit log of every state change gives you. Each transition is a recorded event, not a paragraph of reasoning to reconstruct.\n\nWith LLM agents the temptation is to let the model plan freely over tools. In regulated flows the pattern that holds up is bounded autonomy: free conversation inside a step, strict structure between steps. Capital One's published Chat Concierge design is an example of layering checks on an agentic flow: separate agents plan, evaluate the plan for hallucinated data and incomplete parameters, and then explain and validate the plan with the user before acting.", "sources": [{"label": "Stripe: Idempotent requests", "url": "https://docs.stripe.com/api/idempotent_requests", "why": "How idempotency keys behave, including saved results and parameter mismatch."}, {"label": "Rasa: CALM", "url": "https://rasa.com/docs/learn/concepts/calm/", "why": "Flows, slot filling, corrections and confirmation handled outside the LLM."}, {"label": "VentureBeat: How Capital One built production multi-agent AI workflows", "url": "https://venturebeat.com/ai/how-capital-one-built-production-multi-agent-ai-workflows-to-power-enterprise-use-cases", "why": "Planner, evaluator and validator agents with live API checks."}, {"label": "Debevoise: FINRA 2026 oversight report on GenAI and agent risks", "url": "https://www.debevoisedatablog.com/2025/12/11/finras-2026-regulatory-oversight-report-continued-focus-on-generative-ai-and-emerging-agent-based-risks/", "why": "Agent risks: scope, authority, auditability, and the controls named."}]}, {"id": "c-agent-assist-summaries", "title": "Agent assist and summarisation: the human is the grounding of last resort", "brief": "Assisting a human agent is the safest place to start with generative AI because a person reads every output before it reaches a customer or a record. The grounding is the live transcript and the approved knowledge base. The new failure mode is automation bias, where the agent stops checking, and in summaries the model inventing a commitment or dropping a caveat.", "practice": ["Knowledge assist: the agent asks, the system answers from internal content with sources shown. Vanguard's Crew Assist is described as an Azure OpenAI tool that lets contact centre staff query internal content.", "Summaries: Google Agent Assist generates a conversation summary at wrap-up and the agent can edit it and add notes before it is saved. Custom sections let you force a fixed structure (situation, action, resolution).", "Evaluate summaries on accuracy, completeness and adherence to the requested format. Google's evaluation tooling names those three dimensions.", "Summary-specific failures: attributing a statement to the wrong speaker, turning 'I will look into it' into 'refund approved', omitting the disclosure that was or was not read.", "Keep the human edit rate as a metric. Near-zero edits can mean excellent summaries or agents who stopped reading, so sample and audit.", "Morgan Stanley's advisor tools keep advisors reviewing and adjusting AI output before anything goes to a client."], "say": ["For agent assist I'd keep the transcript and approved knowledge as the only sources, show citations to the agent, and measure summary accuracy and edit rate, because a human in the loop only helps if they actually read.", "The summaries I'd worry about are the ones that sound right, like a promise that was never made, so I'd test for attribution and commitments specifically."], "deep": "Summarisation is not free of hallucination just because the source is right in front of the model. The model compresses, and compression is where speaker attribution, negation, amounts and conditionals get damaged. For regulated work the summary can become a record, so errors propagate into complaints handling, suitability evidence and audits. That raises the bar: evaluate against labelled transcripts with specific checks (every amount and date appears in the source, every commitment is attributed correctly), not just a general quality score.\n\nThe human in the loop has a design problem of its own. If the tool is right 98 percent of the time, people stop checking, and the two percent gets filed. Mitigations are interface choices: highlight the claims that carry risk (amounts, dates, promises), show the transcript span behind each sentence, require an explicit accept action, and sample reviewed records for QA.\n\nFINRA's 2026 report asks for regular human review of outputs and prompts and for logs of prompts, outputs and model versions, which fits agent assist well: the assist output, the agent's edit and the final record are all stored, so you can later show what the model proposed and what a person approved.", "sources": [{"label": "Google Cloud: Agent Assist summarization with custom sections", "url": "https://docs.cloud.google.com/gemini-enterprise-cx/agent-assist/summarization-with-custom-sections", "why": "Custom summary sections and evaluation by accuracy, completeness, adherence."}, {"label": "MIT Sloan Management Review: Investing in AI payoffs at Vanguard", "url": "https://sloanreview.mit.edu/article/investing-in-ai-payoffs-at-vanguard/", "why": "Crew Assist on Azure OpenAI for contact centre staff, and Vanguard's governance framing."}, {"label": "Debevoise: FINRA 2026 report on GenAI", "url": "https://www.debevoisedatablog.com/2025/12/11/finras-2026-regulatory-oversight-report-continued-focus-on-generative-ai-and-emerging-agent-based-risks/", "why": "Human review and logging of prompts, outputs and model versions."}]}, {"id": "c-compliance-advice-boundary", "title": "Compliance and the advice boundary: information is fine, a recommendation is regulated", "brief": "A client-facing assistant at a firm that is FINRA-regulated can explain what an index fund is, but a personalised 'you should buy X' is investment advice or a recommendation with its own rules. FINRA's Regulatory Notice 24-09 says no new rules are created: existing rules, including supervision and communications standards, apply to generative AI the same as to any other tool. So the assistant needs a hard boundary, approved wording, and a handoff to a licensed person.", "practice": ["Topic rails detect personalised advice requests ('should I move my 401k into bonds') and route to a fixed response and a licensed representative instead of generating.", "Educational answers come from an approved-content library (compliance reviewed, versioned), with required disclosures attached by the system, not trusted to the model.", "FINRA 24-09: supervision must cover generative AI, including technology governance, model risk management, data privacy and integrity, reliability and accuracy. Content standards in rule 2210 apply to AI-generated communications with the public.", "FINRA's 2026 report names hallucinations explicitly, expects pre-deployment and ongoing testing, logs of prompts and outputs, and warns against overstating AI capabilities in marketing.", "SEC 'AI washing' cases: in March 2024 the SEC settled with Delphia ($225,000) and Global Predictions ($175,000) for misleading claims about their use of AI, so what you say about the assistant itself is also regulated.", "CFPB's 2023 chatbot spotlight warned about inaccurate information and 'doom loops' with no route to a human, so an off-ramp to a person is a requirement, not a nicety."], "say": ["I'd draw the line between information and advice in code: a classifier plus a topic rail send anything personalised to a licensed rep, and educational answers come from compliance-approved content with disclosures added by the system.", "From what's public, the regulators say existing rules apply, so I'd design for supervision from the start: log everything, test continuously, and always give a route to a human."], "deep": "The practical difficulty is that the information and advice line is fuzzy in language. 'Is a target-date fund good for someone my age' sounds educational and is in practice personal. So the boundary classifier needs examples of the borderline cases, and the safe default for an uncertain case is the conservative route. The cost of an unnecessary handoff is a few minutes of a rep's time; the cost of an unsupervised recommendation is a regulatory finding. I would not claim to know exactly how any specific firm's compliance team draws it: that is their call, and I would say so.\n\nCommunications rules matter for a second reason, which is review. Pre-approval and supervision regimes are built around content a human can review in advance. A generative answer is created at run time, so firms respond by constraining the space (approved libraries, templates with controlled variable parts, rails) and by sampling and reviewing outputs after the fact. FINRA's notices frame this as supervision that is reasonably designed for the use, with testing and monitoring, not a ban on the technology.\n\nThe agentic wave adds scope and authority. FINRA's report lists autonomy beyond intended scope, auditability and sensitive data retention as agent risks and asks for guardrails that constrain behaviour and track agent actions. In an interview, the honest stance is to describe designs that make those properties checkable (bounded tools, logged actions, human approval for consequential steps) rather than to promise a model that will not err.", "sources": [{"label": "FINRA: Regulatory Notice 24-09", "url": "https://www.finra.org/rules-guidance/notices/24-09", "why": "The primary text: existing rules apply, supervision covers gen AI."}, {"label": "FINRA: Artificial intelligence key topics page", "url": "https://www.finra.org/rules-guidance/key-topics/artificial-intelligence", "why": "FINRA's own index of GenAI guidance, agentic AI and prompt injection concerns."}, {"label": "Mayer Brown: FINRA reminds members of obligations when using generative AI", "url": "https://www.mayerbrown.com/-/media/files/perspectives-events/publications/2024/07/legal-update-finra-publishes-regulatory-notice.pdf?rev=9f0a4b4a39e1480f9678a4b5f9514566", "why": "Law firm summary of 24-09 for a reading check."}, {"label": "FINRA: 2026 Annual Regulatory Oversight Report", "url": "https://www.finra.org/sites/default/files/2025-12/2026-annual-regulatory-oversight-report.pdf", "why": "Standalone generative AI and AI agents sections."}, {"label": "WilmerHale: SEC brings two more AI washing actions", "url": "https://www.wilmerhale.com/en/insights/client-alerts/20240327-sec-brings-two-more-ai-washing-enforcement-actions-against-investment-advisers-continuing-its-pursuit-of-misstatements-related-to-ai", "why": "Delphia and Global Predictions, the penalties and the claims at issue."}, {"label": "CFPB: Chatbots in consumer finance", "url": "https://files.consumerfinance.gov/f/documents/cfpb_chatbot-issue-spotlight_2023-06.pdf", "why": "Doom loops, inaccurate information, need for a human off-ramp."}]}, {"id": "c-guardrails-stack", "title": "The guardrails stack: input, retrieval, dialog, execution and output rails", "brief": "Guardrails are layers around the model, not a single filter. Input rails catch jailbreaks, off-topic requests and PII; retrieval rails limit what documents reach the model; dialog and execution rails control flow and tool calls; output rails check the answer for safety, groundedness and leaked data. A classifier that misses a novel attack is expected, so the design assumes some attacks pass and limits what a fooled model can do.", "practice": ["NeMo Guardrails names five rail types: input, retrieval, dialog, execution and output. Input and output rails see the most use. Execution rails validate tool calls, their parameters and the results.", "Bedrock Guardrails and Azure AI Content Safety bundle managed filters: topic denial, content filters, sensitive information, plus the grounding checks.", "Llama Guard is a fine-tuned Llama 3 8B safety classifier for both prompts and responses, using the MLCommons hazard taxonomy with a category called specialized advice. Meta's Prompt Guard is a smaller classifier for injection and jailbreak.", "PII: Google Model Armor can screen prompts and responses and use Sensitive Data Protection (the DLP engine) templates to detect and redact or mask sensitive data rather than block the session.", "Reported weakness: Prompt Guard was shown to miss non-English text and simple obfuscation like leetspeak, and indirect attacks, so a detector is one layer, not the defence.", "Structural defences beat detectors: least-privilege tools, identity bound in code, no secrets in prompts, and human approval for consequential actions."], "say": ["I'd put rails at each stage: input for injection and PII, retrieval for trusted sources only, execution for tool arguments, output for groundedness and leaks. And I'd assume the classifier will sometimes miss, so tools are least-privilege.", "My view is that detectors are a speed bump and architecture is the wall: if a fooled model cannot reach another customer's data or move money without a confirm, the attack has little to land on."], "deep": "Prompt injection is the one that does not go away. Direct attacks come from the user; indirect attacks sit in content the model reads, such as a retrieved document, a web page or an email. FINRA's AI page lists prompt injection and agentic AI among its emerging concerns. Classifiers reduce noise but published bypasses exist, so the defensible position is defence in depth: treat all model-read content as untrusted, keep tool permissions narrow, validate tool arguments in code and require human approval on high-impact actions.\n\nPII handling has two moments. Before the model: redact or tokenise sensitive values so they do not go to a third-party model or into logs unless needed. After the model: scan the output for leaked identifiers. Redaction by masking keeps the conversation going where blocking would end it, but masking changes the text the model sees, so test that the flow still works (for example a masked account number cannot be used as a lookup key, so lookups should use a session-bound id).\n\nGuardrails have a cost in latency and in false positives. Each rail adds a model call or a classifier pass, and a topic rail that is too tight blocks legitimate questions about fees. Measure block rates on real traffic by intent, review a sample of blocked requests weekly and tune with data. Treat guardrails like any production model: versioned, evaluated on a regression set and monitored for drift.", "sources": [{"label": "NVIDIA: NeMo Guardrails, rail types", "url": "https://docs.nvidia.com/nemo/guardrails/latest/about/rail-types.html", "why": "Input, retrieval, dialog, execution and output rails defined."}, {"label": "Google Cloud: Model Armor", "url": "https://cloud.google.com/security/products/model-armor", "why": "Prompt and response screening with Sensitive Data Protection redaction."}, {"label": "Meta et al.: The Llama 3 Herd of Models (Llama Guard section)", "url": "https://arxiv.org/pdf/2407.21783", "why": "Source for Llama Guard as an input and output safety classifier."}, {"label": "Hugging Face: Llama Prompt Guard 2 86M", "url": "https://huggingface.co/meta-llama/Llama-Prompt-Guard-2-86M", "why": "What the injection and jailbreak classifier does and its intended scope."}, {"label": "AWS: Guardrails contextual grounding check", "url": "https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html", "why": "How a managed grounding rail sits alongside other policies."}]}, {"id": "c-abstention-citation-ux", "title": "Abstention, confidence thresholds and citation UX", "brief": "In finance the right answer is often 'I can't answer that, here is a person.' Models are poor at knowing what they don't know, so abstention is built from signals around the model: retrieval strength, a groundedness score and intent confidence, with thresholds tuned on real data. Citations then make a good answer checkable, if the interface actually lets the reader check.", "practice": ["Answer gate: combine retrieval score (is there a relevant passage), groundedness score of the draft and intent confidence. Below any threshold, respond with a fixed fallback and a handoff.", "AbstentionBench (20 datasets, 20 frontier models) found abstention is not solved by scale, and reasoning fine-tuning lowered abstention by about 24 percent on average. System prompts helped only on the surface.", "Tune thresholds on labelled traffic: plot answered share against wrong-answer rate and choose the point by the cost of a wrong answer for that intent, which is stricter for fees and eligibility than for general education.", "Citation UX: cite at claim level where possible (Google's check-grounding returns per-claim citation indices), show the source title and effective date, and link to the exact passage.", "A citation that is not checked is theatre: verify that each cited passage actually supports its sentence, which is what a groundedness check does, otherwise the model can cite a real document for an unsupported claim.", "Handoff design: pass the transcript and the failed answer to the human so the customer does not repeat themselves. CFPB flagged loops with no human exit as a harm."], "say": ["I'd make abstention a gate built from retrieval strength, a groundedness score and intent confidence, with thresholds set from labelled traffic and stricter for fees and eligibility than for general education.", "I think citations only help if they're claim-level and verified, so I'd show source and effective date and check that the passage supports the sentence, not just that it exists."], "deep": "Asking a model 'are you sure' is a weak signal. Verbalised confidence tends to be miscalibrated, and the AbstentionBench result suggests the problem is basic and not fixed by bigger or more reasoning-heavy models. So production systems lean on external signals: whether retrieval found anything above a similarity or reranker threshold, whether an entailment style check supports the answer, and whether the intent classifier is confident. None of these is perfect, which is why the threshold is set on measured data, and why it is reviewed as content and traffic change.\n\nThere are two ways to be wrong and finance weights them differently. Over-answering gives a confident wrong statement that a customer may rely on. Over-abstaining gives a worse experience, higher containment cost and the doom loop regulators dislike. The practical response is to set thresholds per intent and to make the abstention graceful: say what you can't help with, offer the nearest approved answer or a person, and keep the context.\n\nCitation design is a trust problem as much as an engineering one. Showing sources raises confidence, which is a risk if the sources do not really support the text. Good practice is to cite fewer, better sources, show dates (so a stale policy is visible), make the cited passage one click away and log which passages were shown. In regulated settings the same logs double as evidence of what the customer was told.", "sources": [{"label": "arXiv: AbstentionBench, reasoning LLMs fail on unanswerable questions", "url": "https://arxiv.org/abs/2506.09038", "why": "Evidence that abstention is unsolved and reasoning tuning hurts it."}, {"label": "Google Cloud: Check grounding with RAG", "url": "https://docs.cloud.google.com/generative-ai-app-builder/docs/check-grounding", "why": "Per-claim citations, support score and citation threshold."}, {"label": "CFPB: Chatbots in consumer finance", "url": "https://files.consumerfinance.gov/f/documents/cfpb_chatbot-issue-spotlight_2023-06.pdf", "why": "Why a human off-ramp matters."}, {"label": "AWS: Contextual grounding check", "url": "https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html", "why": "Thresholds from 0 to 0.99 and the effect of raising them."}]}, {"id": "c-finance-players-case-studies", "title": "What the big finance players actually did, including Vanguard's public AI work", "brief": "The public record shows a consistent pattern: generative AI went first to internal, human-reviewed uses (advisor assistants, contact centre tools, employee suites), while customer-facing assistants stayed deterministic or tightly bounded. Bank of America kept Erica non-generative on purpose, Morgan Stanley built an eval framework before scaling, and Vanguard's announced generative work is advisor and contact centre facing with a person in the loop.", "practice": ["Morgan Stanley: a GPT-4 based assistant for advisors over roughly 100,000 documents, built with OpenAI. Evals included summarisation, translation and Debrief-specific sets graded by advisors and prompt engineers, plus daily regression checks. Reported outcomes: 98% of advisor teams use it and document access rose from 20% to 80%.", "Bank of America Erica: over 3 billion interactions and nearly 50 million users since 2018, deterministic NLP with over 700 intent types. A BofA leader said clients expect answers to be 100% right and the bank can't afford to be 90% right. Generative AI is used behind the scenes with humans in the loop.", "JPMorgan LLM Suite: an internal front door to multiple third-party models, with data kept inside the bank's environment, reaching about 200,000 users in eight months.", "Klarna: an OpenAI-powered assistant reported to handle two thirds of chats (2.3 million) in its first month across 35 languages, with human agents available. Press later reported the company rehired humans and walked back the '700 agents' framing.", "Capital One: Chat Concierge for auto buying uses planner, evaluator and validator agents with live API checks.", "Vanguard (public): Crew Assist on Azure OpenAI for contact centre staff to query internal content; Client-Ready Article Summaries for advisors (May 2025 beta, advisors review before sharing, disclosures generated); Expert Insights, an AI portfolio analysis tool for advisors in pilot in 2026; and a stated governance framework covering performance evaluation, bias, drift and usage oversight."], "say": ["What I notice in the public cases is the pattern: generative AI goes first where a person reviews the output, like Morgan Stanley's advisor assistant or Vanguard's advisor summaries and contact centre tool, while customer-facing paths stay bounded.", "From the outside, Vanguard's approach reads as augmentation with a human in the loop and governance around evaluation and drift, and that matches how I'd build in a regulated setting. I can't speak to their internals, so I'd like to hear how they evaluate it."], "deep": "Morgan Stanley is the standard case for evaluation-led rollout. The details that matter are that the evals were task-specific (summarisation, translation, meeting debrief), graded by domain experts as well as engineers, and run as regression tests every day, which is what a production model needs because prompts, content and models change. The scope was also deliberate: an assistant for advisors over an approved research corpus, where the advisor is the accountable reader.\n\nBank of America shows the opposite choice and its reasoning is worth being able to repeat: for customer-facing answers where accuracy must be near-total, a deterministic system with a measured intent set gave control and predictability, and generative models were kept internal with human oversight. It is a choice about risk appetite, not a verdict on the technology, and BofA is also expanding internal generative use. Klarna is the cautionary example on the other side: a strong early efficiency story, later tempered by a reported return to human agents, which analysts predicted when they said four weeks is too short to judge retention.\n\nVanguard's public material is thinner on technical detail than the others. Its press releases for the article summaries and Expert Insights do not describe the model, evaluation or review process, while its corporate article says advisors review and customise summaries before sharing with clients. The MIT Sloan piece adds Crew Assist on Azure OpenAI, a $500 million value figure for data, analytics and AI together (not generative AI alone), and a governance list: model performance evaluation, bias detection, drift monitoring, usage oversight and ethical guardrails. Third-party sites claim a 2026 customer chatbot and role impacts; I could not verify those from Vanguard sources, so do not state them as fact. The safe interview move is to describe what is public, then ask how they evaluate and gate it.", "sources": [{"label": "ZenML LLMOps database: Morgan Stanley's GPT-4 implementation", "url": "https://www.zenml.io/llmops-database/enterprise-knowledge-management-with-llms-morgan-stanley-s-gpt-4-implementation", "why": "Eval types, daily regression, corpus size, human review."}, {"label": "OpenAI: Morgan Stanley uses AI evals", "url": "https://openai.com/index/morgan-stanley/", "why": "Vendor-side account of the eval framework (appeared in search results; page blocked to my fetch)."}, {"label": "CIO Dive: How Bank of America's Erica raised the stakes for virtual assistants", "url": "https://www.ciodive.com/news/bank-of-america-erica-virtual-assistants/758901/", "why": "Why Erica stays deterministic, with numbers."}, {"label": "Fortune: AI in regulated industries, BofA and S&P Global", "url": "https://fortune.com/2026/10/01/ai-regulated-industries-bank-of-america-sp-global", "why": "Human in the loop, assistive over autonomous agents, review pillars."}, {"label": "JPMorgan Chase: LLM Suite named Innovation of the Year", "url": "https://www.jpmorganchase.com/about/technology/blog/llmsuite-ab-award", "why": "The firm's own description of LLM Suite."}, {"label": "Customer Experience Dive: Klarna sees its AI assistant as a success", "url": "https://www.customerexperiencedive.com/news/klarna-generative-ai-customer-service-call-center/709072/", "why": "First-month figures and analyst caution."}, {"label": "Fast Company: Klarna says its AI assistant does the work of 700 people", "url": "https://www.fastcompany.com/91039401/klarna-ai-virtual-assistant-does-the-work-of-700-humans-after-layoffs", "why": "The original claim and the context around it."}, {"label": "Vanguard: Unveils generative AI client summaries for financial advisors (PR Newswire)", "url": "https://www.prnewswire.com/news-releases/vanguard-unveils-generative-ai-client-summaries-for-financial-advisors-302445980.html", "why": "Vanguard's first client-facing GenAI capability, May 2025."}, {"label": "Vanguard: A new GenAI capability for advisors", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/vanguards-new-genai-capability-for-advisors.html", "why": "Advisors review and customise before sharing; disclosures generated."}, {"label": "Vanguard: Launches Expert Insights (PR Newswire)", "url": "https://www.prnewswire.com/news-releases/vanguard-launches-expert-insights-equipping-advisors-with-ai-powered-portfolio-analysis-expertise-302735776.html", "why": "AI portfolio analysis for advisors, pilot in 2026."}, {"label": "MIT Sloan Management Review: Investing in AI payoffs at Vanguard", "url": "https://sloanreview.mit.edu/article/investing-in-ai-payoffs-at-vanguard/", "why": "Crew Assist, governance framework, value figure."}, {"label": "VentureBeat: How Capital One built production multi-agent AI workflows", "url": "https://venturebeat.com/ai/how-capital-one-built-production-multi-agent-ai-workflows-to-power-enterprise-use-cases", "why": "Evaluator agent and validation before acting."}]}]}, {"id": "rs-eval", "title": "Evaluation, telemetry and cost", "blurb": "The offline harness, what production measures that it cannot, what to log, where the money goes.", "topics": [{"id": "d-offline-eval-layers", "title": "Offline evaluation is layers, not one score", "brief": "A golden set per intent and one accuracy number is the beginner version. Production teams run separate layers: NLU metrics per intent, flow and slot tests, end-to-end conversation tests, and judged generative quality. Each layer catches a different kind of break, and each has its own gate in CI.", "practice": ["NLU layer: per-intent precision, recall and F1, plus the confusion matrix. Macro-F1 treats every intent equally so rare but important intents (dispute, fraud report, complaint) show up; micro-F1 is dominated by the big intents and hides them.", "Look at the confidence distribution, not just the argmax: the share of correct predictions below your fallback threshold tells you whether the threshold is set right. Top-k alternatives matter because a clarifying question picks from them.", "Flow layer: scripted conversations that assert the flow starts, slots fill, an action fires, or the flow cancels. Rasa's end-to-end tests are an example of this style, with assertions on slots, responses and custom actions, run in CI.", "Quality layer for generated text: rubric-based judges on groundedness, correctness, tone and policy. Anthropic's eval guidance says to start with 20 to 50 tasks taken from real failures and to grade what the agent produced, not the path it took.", "Two kinds of suite: capability evals (start low, show headroom) and regression evals (should sit near 100 percent and block a merge when they drop). Watch for saturation, where a suite at 100 percent no longer tells you anything.", "Every production failure becomes a test case. DoorDash describes adding issues systematically to a unit-test-like suite that runs on every prompt change."], "say": ["I don't trust a single accuracy number. I'd report per-intent F1 with a confusion matrix, gate regression on the intents that carry risk, and turn every production miss into a test case so the suite grows from real failures."], "deep": "The reason to split layers is diagnosis. If an end-to-end test fails, you need to know whether the classifier picked the wrong intent, the slot filler dropped an entity, the policy chose the wrong next step, or the generator drifted. One blended score cannot tell you that. Per-layer metrics let you fix the right component and also let you swap one component (a new embedding model, a new LLM) and see exactly where it moved.\n\nMacro versus micro is not trivia. A banking assistant may have 80 percent of traffic in balance, transactions and branch hours, and a tiny share in disputes, fraud and hardship. Micro-F1 can stay at 95 percent while recall on the fraud intent is 60 percent. So I'd set per-intent floors for the sensitive intents instead of one global threshold, and treat confusions between specific pairs (transfer money vs dispute a transfer) as first-class findings.\n\nIn regulated finance the golden set is also a governance artifact. It is versioned, has an owner, records who labelled each row and by what guideline, and is attached to a release approval. Expect a model risk or compliance reviewer to ask what the test set covers and what it does not. Golden sets also go stale: new products, new phrasing, seasonal spikes (tax season, market volatility). Keep refreshing them from sampled production traffic, with PII removed, or they drift away from what customers actually say.", "sources": [{"label": "Anthropic: Demystifying evals for AI agents", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "why": "Grader types, capability vs regression evals, start small from real failures, read transcripts."}, {"label": "Rasa: testing your assistant (end-to-end tests)", "url": "https://rasa.com/docs/rasa/testing-your-assistant/", "why": "What a flow and slot level conversation test asserts, and running it in CI."}, {"label": "Anthropic: building evaluations (develop tests)", "url": "https://platform.claude.com/docs/en/docs/test-and-evaluate/develop-tests", "why": "Task-specific evals, edge cases, and writing success criteria as measurable numbers."}, {"label": "ZenML LLMOps database: DoorDash support system with guardrails", "url": "https://www.zenml.io/llmops-database/building-a-high-quality-rag-based-support-system-with-llm-guardrails-and-quality-monitoring", "why": "Issues added to a unit-test-like suite that runs on prompt changes."}]}, {"id": "d-simulated-users", "title": "Simulated users and reliability, not just one pass", "brief": "Static test conversations only check what you scripted. A simulated user (another LLM playing a customer with a goal) lets you test multi-turn behaviour at scale, and tau-bench showed the right way to score it: compare the final database state to the goal state, and measure pass^k, the chance the agent succeeds on all k tries, not just one.", "practice": ["tau-bench (Sierra) pairs an LLM-simulated user with an agent that has domain API tools and a policy document, in retail and airline domains. It is scored by comparing the end state of the database to the annotated goal state, which makes it cheap and objective to grade.", "pass^k is the probability that all k independent trials succeed. The paper reports that strong function-calling agents of that time passed under half the tasks and had pass^8 below 25 percent in retail, which is the number that matters for a customer-facing system.", "Anthropic's eval guidance makes the same point for conversational agents: you need a second LLM simulating the user, and pass^k reflects consistency requirements better than pass@k.", "Build personas that stress the failure modes: vague users, users who change their mind mid-flow, users who push for something the policy forbids, angry users, users who speak in fragments, users who try to extract another customer's data.", "Grade state and policy, not wording: did the transfer get created only after confirmation, was identity verified before account details were shared, was a handoff triggered when it should be.", "Keep a small human-written set as the anchor. Simulated users are a cheap amplifier, but they are friendlier and more cooperative than real customers, so the simulated pass rate overestimates production."], "say": ["For multi-turn behaviour I'd use a simulated user with a hidden goal and score the final state and policy compliance, and I'd run each scenario several times and look at pass^k, because a bot that succeeds seven times out of eight is still a bad bot at scale."], "deep": "The key insight from tau-bench is that you do not have to judge the dialogue to know whether the task succeeded. If the task is to cancel an order or move a booking, the end state of the backend either matches the goal or it does not. That gives you a deterministic grader sitting under a stochastic conversation. For a finance assistant the equivalent is: was the right (and only the right) transaction staged, was a confirmation step present, were disclosures read, and did anything get written that should not have been.\n\nReliability is its own dimension. A system with a 90 percent single-run pass rate can have a much lower probability of getting five similar customers in a row right. When the cost of one wrong answer is a complaint or a regulatory finding, you care about the tail, so you run the same scenario many times, vary temperature and persona, and track the worst cases.\n\nSimulation has limits to be honest about. The simulator is itself an LLM with its own habits, it tends to be cooperative and articulate, and it does not mimic noisy ASR on a phone call. So treat simulation as a regression and stress tool and calibrate it against real conversation transcripts, instead of reading its pass rate as a forecast of production containment.", "sources": [{"label": "arXiv: tau-bench, tool-agent-user interaction", "url": "https://arxiv.org/pdf/2406.12045", "why": "Simulated user, state-based grading, and the pass^k metric."}, {"label": "Sierra: benchmarking AI agents for the real world", "url": "https://sierra.ai/blog/benchmarking-ai-agents", "why": "Plain-language account of why tau-bench was built and what it shows."}, {"label": "Anthropic: Demystifying evals for AI agents", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "why": "Simulated user for conversational agents and pass@k vs pass^k."}]}, {"id": "d-llm-judge", "title": "LLM-as-judge needs a rubric and a calibration set", "brief": "A judge model is only useful once you have measured how well it agrees with your humans. The working pattern is binary or ordinal criteria with explicit definitions, a small human-labelled set to calibrate against, known biases controlled, and a human sample reviewed forever.", "practice": ["Decompose quality into criteria with clear definitions. Instacart's LACE uses five dimensions (query understanding, answer correctness, chat efficiency, client satisfaction, compliance) made of binary true/false criteria that roll up into scores.", "DoorDash's quality judge scores five aspects: retrieval correctness, response accuracy, grammar and language, coherence to context, relevance to the request. It runs alongside human review of random transcript samples to keep it calibrated.", "Calibrate: have humans label the same conversations with the same criteria, measure agreement, and fix either the criterion wording or the judge. The MT-Bench paper found strong judges reach over 80 percent agreement with human preferences, similar to humans with each other; Langfuse's guide repeats 80 to 90 percent on many criteria.", "Control known biases: position bias (swap the order in pairwise comparison and require the same winner), verbosity bias (judges like longer answers), self-enhancement (use a different model family to judge than the one being judged).", "Pairwise comparison (is B better than A) is more stable than absolute 1 to 5 scores, and is the right tool for deciding whether to ship a prompt or model change.", "Instacart found a debate setup (a critical customer role, a defensive support role, a judge) worked best on context-dependent criteria, and kept subjective ones like conciseness as directional checks, not optimisation targets."], "say": ["I treat the judge as another model that needs its own evaluation. I'd label a couple hundred conversations by hand, measure agreement per criterion, and only automate the criteria where the judge matches us, and keep a human sample going to catch drift."], "deep": "Judges fail quietly. They reward fluent, confident, long answers, and a hallucinated answer in a polished tone can score well unless the rubric forces them to check claims against the retrieved evidence or the API result. That is why grounded criteria (is every claim supported by this context) work better than vague ones (is this a good answer), and why you give the judge the evidence, not only the response.\n\nThe cheap trick that matters: ask for the reasoning first and the verdict second, then convert to structured output as a separate step (Instacart describes decoupling the two so constrained decoding does not hurt the judgement). Use low temperature and, for high-stakes criteria, multiple votes.\n\nIn finance the judge is part of a control environment. A compliance reviewer will ask: what does the judge check, how do you know it is right, who reviews its disagreements. So record the judge prompt version, the model version, the human agreement rate by criterion, and keep a human sampling process for the highest risk categories. Never let an LLM judge be the only thing standing between a generated answer and a customer on a regulated topic; for that you want a deterministic check or a human-approved content library.", "sources": [{"label": "arXiv: Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena", "url": "https://arxiv.org/abs/2306.05685", "why": "Agreement with humans and the three named biases with mitigations."}, {"label": "Instacart: LLM-based automated evaluation of support chatbots (LACE)", "url": "https://company.instacart.com/tech-innovation/turbocharging-customer-support-chatbot-development-with-llm-based-automated-evaluation", "why": "Binary criteria, debate judging, and iterative alignment with human raters."}, {"label": "DoorDash: LLM-as-a-judge for search evaluation", "url": "https://careersatdoordash.com/blog/doordash-llm-as-a-judge-evaluating-natural-language-search/", "why": "A second DoorDash example of building and validating a judge."}, {"label": "Langfuse: LLM evaluation, offline vs online, judge calibration", "url": "https://langfuse.com/blog/2025-11-12-evals", "why": "Calibrate on a small human-labelled sample and score a sampled percentage of traffic."}]}, {"id": "d-offline-online-gap", "title": "Why offline green does not mean online good", "brief": "Golden sets are written by you, from yesterday's traffic, in clean text. Production brings distribution shift, new products, noisy speech, angry users and adversarial users. So online evaluation (shadow mode, canaries, A/B tests, sampled human review) is part of the harness, and its findings flow back into the offline set.", "practice": ["Shadow mode: the new model or prompt runs on live traffic and its output is logged but never shown. You compare its intent, confidence, answer and tool calls against the live system and review the disagreements. It costs tokens but carries no customer risk.", "Canary: ship to 1 to 5 percent of traffic or one segment, with automatic rollback on guardrail metrics (fallback rate, handoff rate, complaint flags, latency, judge scores on sampled traffic).", "A/B test on outcome metrics: containment (resolved without a human), CSAT, repeat contact within 7 days, and cost per conversation. Intercom frames automation rate as involvement rate times resolution rate, which separates how often the bot gets a chance from how well it does with it.", "Interleaving is more common in search and ranking; for assistants the analogue is offline pairwise preference on sampled shadow outputs, which needs far fewer samples than a full A/B test.", "Human review sampling: random sample for unbiased quality, plus targeted samples (low confidence, thumbs down, handoffs, long conversations, regulated topics). LinkedIn built tooling to evaluate on the order of 500 conversations a day for hallucination and responsible AI issues.", "Close the loop: each reviewed failure is labelled, becomes a golden-set row, and often a new intent, a new guardrail or a content fix. Langfuse describes this as a loop where online catches the edge cases the dataset missed."], "say": ["I'd never promote on offline numbers alone. I'd run the candidate in shadow, look at where it disagrees with production, then canary it behind guardrail metrics, and feed whatever we find back into the golden set."], "deep": "The offline set has three structural blind spots. First, selection: it contains what you thought to include, so unknown unknowns are absent. Second, time: language and products change, and a model trained or tuned on last quarter's phrasing meets this quarter's. Third, channel: text tests do not reproduce ASR errors, interruptions or silence on a call, so a voice assistant needs its own audio-level tests and its own online monitoring.\n\nOutcome metrics also need care. Containment can go up because the bot got better, or because it made it harder to reach a human, which is exactly the doom loop the CFPB warns about. So pair containment with a quality signal that cannot be gamed by trapping users: repeat contact, complaint rate, abandonment after fallback, and human-reviewed resolution. Klarna's 25 percent drop in repeat inquiries is a better signal than raw chat share, though critics note it does not say how it was measured or how case mix was controlled.\n\nIn a regulated setting, experimentation itself needs governance. You usually cannot A/B test a new compliance answer on customers the way you test a button colour, so new content for regulated topics goes through approval first and the experiment covers routing and presentation. Be ready to say which parts of the assistant you will experiment on freely and which you will only change through a controlled release.", "sources": [{"label": "Langfuse: LLM evaluation, offline vs online", "url": "https://langfuse.com/blog/2025-11-12-evals", "why": "The offline/online loop and sampling for judge cost."}, {"label": "LinkedIn Engineering: musings on building a generative AI product", "url": "https://www.linkedin.com/blog/engineering/generative-ai/musings-on-building-a-generative-ai-product", "why": "The last 20 percent problem, annotation at scale, and latency trading off against quality."}, {"label": "Intercom: Fin AI Agent reporting", "url": "https://www.intercom.com/help/en/articles/7837533-fin-ai-agent-reporting", "why": "How a vendor defines involvement, resolution and automation rate."}, {"label": "CFPB: chatbots in consumer finance", "url": "https://www.consumerfinance.gov/data-research/research-reports/chatbots-in-consumer-finance/chatbots-in-consumer-finance/", "why": "The doom loop and why containment alone is a risky target."}]}, {"id": "d-telemetry-per-turn", "title": "What to log per turn, and what you must not keep", "brief": "You cannot do error analysis on logs you did not write. The useful record is per turn and structured: the utterance, the predicted intent with confidence and top alternatives, slots, flow state, latency by stage, tokens, tool calls and results, handoff reason and an outcome label. In finance every field has a PII and retention decision attached.", "practice": ["Per-turn record: conversation id, turn index, channel, utterance (redacted), ASR confidence for voice, intent, confidence and top-k, extracted slots, flow or dialogue state, policy decision, retrieved document ids with scores, prompt and model version, tool calls with arguments and results, guardrail verdicts, per-stage latency, input and output tokens, response, handoff reason, and an outcome label at conversation end.", "Use OpenTelemetry's GenAI conventions where you can: a span per model call named by operation and model, with gen_ai.operation.name, provider, model and gen_ai.usage.input_tokens and output_tokens, plus execute_tool spans and invoke_agent spans in one trace tree. The conventions were still marked in development status, so pin a version.", "OTel keeps prompts and completions as opt-in events instead of span attributes, which is a privacy-friendly design: keep sensitive text out of indexed fields and out of default capture.", "Trace tools sit on top: Langfuse (open source, datasets, online judges on sampled traces), LangSmith, Arize Phoenix (OpenTelemetry-based). In regulated finance the deciding factor is often self-hosting or VPC deployment, not features.", "Redact before storage: detect and mask account numbers, SSNs, card numbers, names and addresses. Microsoft Presidio is an example, with redact, replace, hash and encrypt operators, and it documents that it cannot guarantee it finds all PII, so you layer controls.", "Retention is a policy decision with legal input. FINRA Regulatory Notice 24-09 says recordkeeping rules apply to AI-generated and AI-assisted records and that standard chatbot responses to specific inquiries may be retail communications, so the stored record of what the bot said is itself something compliance may need to retrieve."], "say": ["I'd log every turn as a structured trace with the intent, confidence, top alternatives, tool calls and latency per stage, redact PII at the edge before it lands in analytics, and treat the raw transcript as a regulated record with its own retention and access rules."], "deep": "Two stores usually end up existing. An observability store, with short retention, redacted text and wide access for engineers, used to debug and evaluate. And a system of record for conversations, with long retention, access controls and audit logging, used for compliance, complaints and discovery. Mixing them is the common mistake: either engineers get access to raw customer data they should not see, or the compliance record is thin because the debug store rotates.\n\nRedaction has a cost. Aggressive masking removes exactly the tokens (amounts, dates, product names) that error analysis needs, so teams replace values with typed placeholders (an account number becomes a typed token, an amount stays as a bucket) to keep structure. Test redaction on real-looking data with recall measured, because a missed SSN in a log is an incident.\n\nDo not forget decision provenance. For every answer you want to reconstruct why it was given: which prompt and model version, which content version was retrieved, which tool result was used. In a complaint or exam, the question is not just what the bot said but what source of truth it relied on at that moment. Versioning the approved-content library and logging the version id on each answer makes that answerable.", "sources": [{"label": "Dash0: OpenTelemetry GenAI semantic conventions explained", "url": "https://www.dash0.com/knowledge/opentelemetry-genai-semantic-conventions-explained", "why": "Span types, token and latency metrics, opt-in content capture, development status."}, {"label": "OpenTelemetry: gen-ai spans specification (v1.41.0)", "url": "https://github.com/open-telemetry/semantic-conventions/blob/v1.41.0/docs/gen-ai/gen-ai-spans.md", "why": "The primary spec for the attribute names."}, {"label": "Microsoft Presidio", "url": "https://microsoft.github.io/presidio/", "why": "PII detection and anonymization operators, and the no-guarantee caveat."}, {"label": "FINRA: artificial intelligence key topic (Regulatory Notice 24-09)", "url": "https://www.finra.org/rules-guidance/key-topics/artificial-intelligence", "why": "Recordkeeping, supervision and communications obligations apply to AI."}, {"label": "Langfuse documentation", "url": "https://langfuse.com/docs", "why": "Open-source tracing, datasets and online evaluation."}]}, {"id": "d-dashboards-alerts", "title": "Dashboards and alerts that find real problems", "brief": "Latency and error rate are not enough for an assistant. The signals that catch real breakage are behavioural: fallback and handoff rate by intent, confidence drift, repeat contact, and cost per conversation. Alerts should be on changes from a baseline, per intent and per release.", "practice": ["Quality signals: fallback rate, no-match rate, clarification rate, handoff rate by reason, thumbs down, abandonment right after a bot turn, and repeat contact within a window. A spike in fallback after a release usually means a regression or a new phrasing, such as a marketing campaign that changed what people ask.", "Model signals: average and distribution of top-1 confidence, share of utterances below threshold, drift in the intent mix. A shifting intent mix is often a business event (outage, fee change, market move) and a useful early warning for the business too.", "Latency by stage and by percentile: p50 hides pain, so alert on p95 and p99 for each stage (ASR, NLU or router, retrieval, LLM first token, tool calls, TTS). Time to first token is a headline metric for streaming.", "Cost signals: tokens in and out per conversation, cost per conversation and per resolved conversation, cache hit rate, share of traffic reaching the large model. OTel's token usage metrics, including cache variants, let you build this without a separate billing pipeline.", "Safety signals: guardrail trips, blocked outputs, detected PII in outputs, prompt-injection detections, and any answer on a regulated topic that did not come from the approved library.", "Judge scores on a sampled slice (5 to 10 percent is a common starting point) trended over time, with human spot checks. Alert on a drop of a set size over a window, not on single scores."], "say": ["I'd alert on behaviour per intent, not just uptime: fallback and handoff rates against a baseline, confidence drift, p95 per stage and cost per resolved conversation, and I'd slice every one of those by release so a regression points at a deploy."], "deep": "Slice before you aggregate. A global fallback rate of 8 percent can hide an intent whose fallback rate went from 2 to 40 percent while others improved. Dashboards need cuts by intent, channel (chat vs voice), customer segment, release version and prompt version, because the cause of a spike is almost always one of those.\n\nAlert fatigue is real. Use baselines that account for time of day and day of week, set thresholds on relative change with a minimum volume, and route different alerts to different owners: a latency alert to the platform team, a fallback spike to conversation designers, a safety trip to risk. Every alert should link to the traces behind it, so the first action is reading ten conversations, not guessing.\n\nIn finance add an incident path. A wrong answer about fees, rates or eligibility is a potential compliance issue, so there should be a defined process: contain (switch the topic to a fixed fallback or a human), assess how many customers saw it (this is where complete per-turn logs pay off), correct, and record. The ability to kill a single flow or topic with a feature flag, without a deploy, is worth building early.", "sources": [{"label": "Dash0: OpenTelemetry GenAI semantic conventions explained", "url": "https://www.dash0.com/knowledge/opentelemetry-genai-semantic-conventions-explained", "why": "Token usage, duration and time-to-first-token metrics for dashboards."}, {"label": "Langfuse: LLM evaluation, offline vs online", "url": "https://langfuse.com/blog/2025-11-12-evals", "why": "Sampling production traces for judge scores and trend monitoring."}, {"label": "ZenML LLMOps database: DoorDash support system", "url": "https://www.zenml.io/llmops-database/building-a-high-quality-rag-based-support-system-with-llm-guardrails-and-quality-monitoring", "why": "Online guardrail plus offline judge as two monitoring layers."}]}, {"id": "d-cost-latency-levers", "title": "Cost levers: cascade, route, cache, shorten", "brief": "Most conversational traffic is a small set of easy intents, so the large model should be the exception, not the default. The levers are a cascade (cheap classifier or embedding router first, LLM only when needed), smaller models for narrow jobs, caching, shorter prompts, and fine-tuning only when it clearly pays.", "practice": ["Cascade: an embedding or small classifier model handles high-confidence known intents, and only low-confidence or open-ended turns reach an LLM. FrugalGPT reports matching the best single model with up to 98 percent cost reduction by cascading, and notes model prices differ by up to two orders of magnitude.", "Learned routers: RouteLLM trained routers on human preference data and reported over 85 percent cost reduction on MT-Bench at 95 percent of GPT-4 quality, sending only 14 percent of queries to the strong model. The gains were smaller on other benchmarks (45 percent on MMLU), so measure on your own traffic.", "DoorDash's guardrail is a cascade too: a cheap semantic-similarity check first, and an LLM evaluator only when the first tier flags a problem.", "Prompt caching: cached input tokens cost roughly a tenth of normal input on Anthropic (writes cost a premium), and cut latency on long prompts. Put the stable part (system prompt, policy, tool definitions) first and the variable part last.", "Response and retrieval caching: cache answers to identical or near-identical FAQ questions keyed on normalised text or an embedding, with a TTL and invalidation tied to content version. Never cache anything personalised or account-specific.", "Shorten context: summarise old turns, retrieve fewer and better chunks, trim tool output before it enters the prompt. Input tokens dominate cost on long conversations, and they also inflate time to first token.", "Fine-tune when you have a narrow, stable task with lots of labelled data (intent classification, extraction, routing) or need a small model to match a large one on one job. Do not fine-tune to inject facts that change; use retrieval for those."], "say": ["I'd start the other way round from most demos: handle the common intents with a cheap classifier or embedding router, use the LLM only for what needs it, cache the stable prompt prefix, and measure quality per intent after each cost cut so a saving is not a hidden regression."], "deep": "A cascade only saves money if the router is well calibrated. If it sends too much to the cheap path you lose quality silently; too little and you save nothing. So you tune the confidence threshold on a labelled set, look at the cost and error trade-off curve, and monitor the share of traffic at each tier. The cheap path also needs its own failure handling: when the classifier is confident and wrong, nothing downstream catches it, which is why high-risk intents get a stricter threshold or a confirmation step regardless of confidence.\n\nBatching helps on the offline side (judge runs, embeddings of the corpus, nightly evaluation) where latency does not matter, and most providers discount batch work. It does not help the live path, where you want streaming and low time to first token instead.\n\nBe wary of two false savings. First, a small model that needs three retries and more guardrail calls can cost more than one call to a larger model. Second, token cost is often not the biggest line: human handoff cost, QA review, compliance review and platform fees can dominate, so optimise the whole cost per resolved conversation and not just the tokens. In finance, one more constraint: the model and any caching layer must sit inside the approved data boundary, which can rule out a cheap option on contractual grounds before you ever compare prices.", "sources": [{"label": "arXiv: FrugalGPT", "url": "https://arxiv.org/abs/2305.05176", "why": "Prompt adaptation, approximation and cascade, with the cost reduction numbers."}, {"label": "LMSYS: RouteLLM", "url": "https://www.lmsys.org/blog/2024-07-01-routellm/", "why": "Learned routing between strong and weak models with measured savings."}, {"label": "arXiv: RouteLLM, learning to route LLMs with preference data", "url": "https://arxiv.org/pdf/2406.18665", "why": "The paper behind the numbers, including how routers generalise."}, {"label": "Finout: Anthropic API pricing, caching and batch", "url": "https://www.finout.io/blog/anthropic-api-pricing", "why": "Cache write and read multipliers and batch discounts, one place."}, {"label": "Salesforce: LLM benchmark for CRM use cases", "url": "https://www.salesforce.com/blog/llm-benchmark-ai-use-case/", "why": "An example of comparing models on accuracy, cost, speed and trust together."}]}, {"id": "d-voice-latency-budget", "title": "Voice latency is a budget you spend per stage", "brief": "On a phone call people notice a pause after about a second, so the whole pipeline (endpointing, ASR, intent or LLM, tools, TTS, network) has to fit a budget. Most of the delay is turn-taking and LLM time to first token, which is why streaming and a fast routing tier matter more than a bigger model.", "practice": ["A typical budget quoted for production voice agents: endpointing 150 to 300 ms, final ASR 100 to 200 ms, LLM time to first token 300 to 600 ms, TTS time to first byte 100 to 250 ms, network and telephony 50 to 150 ms, for roughly 0.8 to 1.5 seconds total. Treat these as ranges to measure against, not guarantees.", "Stream everything: partial transcripts into the prompt builder, tokens into TTS at the first sentence boundary. If a stage waits for the previous one to finish you lose the budget.", "Measure percentiles, not averages. p50 can be fine while p95 is a long silence, and callers remember the silences.", "Use a fast path for simple intents: a classifier or embedding router answers a balance or hours question with a templated response without any LLM call, saving the largest chunk of the budget.", "Cover tool latency: an API call to a core banking system can cost more than the LLM. Use filler or acknowledgement phrases, run independent calls in parallel, and set timeouts with a graceful fallback.", "Trim context: long history inflates time to first token every turn, so summarise earlier turns and keep the stable prefix cached."], "say": ["For voice I'd write the latency budget per stage first, stream end to end, route the simple intents around the LLM, and watch p95 per stage in production, because the pauses callers hate live in the tail."], "deep": "Turn-taking is the least glamorous and most important piece. If endpointing waits too long you add dead air; if it cuts in too early the assistant talks over the customer. Both feel broken, and the right setting depends on the caller (a person reading out a long account number pauses mid-number). Teams tune endpointing per prompt type, for example longer patience when collecting digits, and support barge-in so the caller can interrupt.\n\nSpeech-to-speech models promise to remove stages and cut time to first audio sharply, but in a regulated setting they have trade-offs: less control over exactly what is said, harder transcripts for the record, and harder insertion of deterministic steps like confirmation and disclosures. A cascaded pipeline gives you a text checkpoint where you can apply guardrails, redact, log and require an approved phrasing, which is why many financial deployments stay with it.\n\nBudgets interact with accuracy. A faster, smaller ASR or LLM saves milliseconds and may add errors on account numbers or amounts, so the evaluation harness for voice should include audio test sets with noise and accents and measure error on the high-stakes tokens, not just overall word error rate.", "sources": [{"label": "AWS Builder Center: the 800ms rule, budgeting latency for a voice agent", "url": "https://builder.aws.com/content/3JDFAfXBiuwPP5MPzgf4RUWSAIp/the-800ms-rule-budgeting-latency-for-a-real-time-voice-agent-on-aws", "why": "Per-stage latency budget and the p50 vs p95 point."}, {"label": "Retell AI: how real-time voice AI works", "url": "https://www.retellai.com/blog/how-real-time-voice-ai-works-stt-llm-tts", "why": "Stage by stage account of the STT, LLM and TTS pipeline."}, {"label": "Hamming: voice AI latency, what is fast and slow", "url": "https://hamming.ai/resources/voice-ai-latency-whats-fast-whats-slow-how-to-fix-it", "why": "Where voice latency actually goes and how to reduce it."}]}, {"id": "d-cost-per-resolution", "title": "Cost per resolved conversation, not calls deflected", "brief": "Deflection counts conversations the bot did not escalate. Resolution counts conversations where the problem was actually solved. Optimising deflection can push cost down while customers give up, call back, or complain. The metric to defend is cost per resolved conversation, checked against repeat contact and complaints.", "practice": ["Intercom separates deflection (the AI answered, the customer may have left unsatisfied) from resolution (issue addressed and the customer confirmed or did not come back with the same question), and warns vendors often count non-escalated chats as resolved. Fin's automation rate is involvement rate times resolution rate.", "Klarna reported 2.3 million chats in the first month, two-thirds of chats, work equal to 700 agents, resolution in under 2 minutes against 11, a 25 percent drop in repeat inquiries and about 40 million dollars of estimated 2024 profit improvement. In 2025 it began rehiring humans for complex cases, a reminder that the numbers depend on case mix and on quality holding.", "The Pragmatic Engineer's reading of Klarna: mostly level-one questions, unclear how repeat inquiries were measured, and selection effects, since simple cases go to the bot. Quote the numbers with that caveat.", "Full cost counts platform fees, engineering, content upkeep, QA and compliance review, not just tokens. Intercom's guide on evaluating vendors asks for total cost of ownership and identical-data bake-offs.", "Content hygiene moves resolution more than model choice in many cases. A vendor-reported study says 2 to 4 weeks of knowledge base cleanup before launch gave about 12 points higher resolution; treat that as vendor data, but the direction matches what teams report.", "Regulators care about the failure side: the CFPB lists doom loops, failure to recognise a consumer invoking rights, and inaccurate information, and expects meaningful access to a human for disputes and complex problems."], "say": ["I'd report cost per resolved conversation alongside repeat contact and complaint rate, because deflection can look great while customers are just giving up. And I'd make sure the handoff to a human is easy for anything touching money or disputes."], "deep": "The number that executives want is savings, and the number that regulators and customers care about is outcome. The honest way to hold both is a funnel: conversations started, conversations where the bot was involved, conversations resolved without a human (confirmed by no repeat contact within some window), conversations handed off with context, and the cost of each bucket. Then cost per resolved conversation falls out, and you can see whether it fell because resolution rose or because the denominator got small.\n\nHandoff quality is part of cost. A handoff that passes the transcript, the detected intent, the verified identity and the attempted actions saves the human agent minutes and reduces customer repetition. A blind handoff gives you the worst of both: you paid for the bot turn and you pay again, with an annoyed customer.\n\nIn financial services the asymmetry matters. A deflected balance question that was answered correctly is cheap and fine. A deflected dispute or hardship request is a possible compliance failure, so many firms define protected intents that always route to a human or a deterministic flow with a human option, and exclude them from the containment target. Saying that out loud shows you think about the metric as something that shapes behaviour.", "sources": [{"label": "Fin (Intercom): how to evaluate AI customer service agents", "url": "https://fin.ai/learn/evaluate-enterprise-ai-customer-service-agents", "why": "Resolution vs deflection, bake-off method, total cost of ownership."}, {"label": "Intercom: Fin AI Agent reporting", "url": "https://www.intercom.com/help/en/articles/7837533-fin-ai-agent-reporting", "why": "Definition of deflection, resolution and automation rate."}, {"label": "Klarna: AI assistant handles two-thirds of chats in its first month", "url": "https://www.klarna.com/international/press/klarna-ai-assistant-handl
