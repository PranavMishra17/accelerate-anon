known topics, new phrasing and channel effects.", "Shadow it on live traffic, review where it disagrees with production, and run pairwise preference on a sample.", "Canary to a small slice with automatic rollback on fallback, handoff, complaints, latency and sampled judge scores.", "Judge outcomes over enough time: repeat contact within days, not only containment.", "Feed every failure found back into the golden set; for regulated content, approval comes before any live test."]}, "say": ["**I'd never promote on offline numbers alone.**", "**Shadow first:** run the candidate on live traffic and look at where it disagrees with production.", "**Then a canary:** behind guardrail metrics, with automatic rollback.", "**Feed it back:** whatever we find goes into the golden set, so the offline set keeps catching up with real traffic.", "For regulated answers I'd change content through approval, and experiment only on routing and presentation."], "avoid": ["Treating a rise in containment as proof the new version is better"], "was": ["d-offline-online-gap"], "res": [{"kind": "video", "req": true, "label": "Shadow deployment vs A/B testing a model", "url": "https://www.youtube.com/watch?v=lt7V89jGihM", "m": 4, "why": "Shadow and A/B answer different questions and run in sequence.", "yt": {"id": "lt7V89jGihM", "ch": "FDE Interviews"}}, {"kind": "video", "req": false, "label": "Minimizing the production impact of ML model updates with shadow testing", "url": "https://www.youtube.com/watch?v=J1p0DvC-w1Q", "m": 30, "why": "Shadow testing a candidate on live traffic and comparing outputs before cutover.", "yt": {"id": "J1p0DvC-w1Q", "ch": "AWS Events"}}, {"kind": "video", "req": true, "label": "LLM observability in production: tracing and online evals", "url": "https://www.youtube.com/watch?v=r-CYvjJ-W3k", "m": 6, "why": "Scoring sampled live traffic and feeding failures back into the offline set.", "yt": {"id": "r-CYvjJ-W3k", "ch": "Evidently AI"}}, {"kind": "read", "req": true, "label": "Langfuse: LLM evaluation, offline vs online", "url": "https://langfuse.com/blog/2025-11-12-evals", "m": 10, "why": "The offline and online loop and how findings become dataset rows."}, {"kind": "read", "req": false, "label": "LinkedIn Engineering: musings on building a generative AI product", "url": "https://www.linkedin.com/blog/engineering/generative-ai/musings-on-building-a-generative-ai-product", "m": 10, "why": "Lessons from rollout where offline quality did not match what users hit."}]}, {"id": "eval-telemetry", "title": "What to log per turn, and what not to keep", "brief": "You cannot analyse failures you did not log. The useful record is one structured trace per turn: the redacted utterance, intent with confidence and top alternatives, slots, state, retrieved ids, prompt and model versions, tool calls and results, guardrail verdicts, latency per stage, tokens, handoff reason and an outcome label. The nuance: in finance every field carries a privacy and retention decision, and an engineer's debug store is not the compliance record.", "points": ["Per turn: ids and channel, redacted utterance, ASR confidence, intent with top-k scores, slots, state, retrieved document ids with scores, prompt and model version, tool calls with arguments and results, guardrail verdicts, latency per stage, tokens, handoff reason, outcome", "One trace tree: OpenTelemetry's GenAI conventions give a span per model call with operation, provider, model and token counts, plus tool and agent spans; still marked in development, so pin a version", "Content opt-in: OTel keeps prompts and completions as opt-in events rather than span attributes, which keeps sensitive text out of indexed fields", "Redact at the edge: mask account numbers, SSNs, card numbers and names with typed placeholders, so error analysis keeps the structure; measure redaction recall", "Two stores: an observability store (short retention, redacted, wide engineer access) and a system of record (long retention, access controls, audit); mixing them is the common mistake", "Decision provenance: log the prompt, model and content version on every answer, so you can say what source the bot relied on at that moment"], "figs": ["vaTurn"], "production": ["Langfuse (open source, datasets, online judges on sampled traces), LangSmith and Arize Phoenix (OpenTelemetry-based) sit on top of traces; in regulated finance the deciding factor is often self-hosting or VPC deployment, not features.", "Microsoft Presidio detects and anonymises PII with redact, replace, hash and encrypt operators, and states it cannot guarantee finding all PII, so controls are layered.", "FINRA Regulatory Notice 24-09 says recordkeeping rules apply to AI-generated and AI-assisted records, and that chatbot responses to specific inquiries may be retail communications.", "OTel attribute names include gen_ai.operation.name and gen_ai.usage.input_tokens and output_tokens, with execute_tool and invoke_agent spans in the same trace."], "mcq": [{"q": "An answer quoted an outdated fee. Which logged field lets you show what source the bot relied on?", "o": ["The per-stage latency for that turn", "The token counts for that turn", "The intent confidence score", "The session's CSAT rating", "The content version and retrieved document ids"], "a": 4, "why": "Provenance needs the retrieved ids and the version of the content library at that moment. Without them you can say what the bot said, but not why."}, {"q": "Why does OpenTelemetry keep prompts and completions as opt-in events instead of span attributes?", "o": ["Events are cheaper to store than attributes", "To keep sensitive text out of default capture and indexes", "Because spans cannot hold any text", "So that token counts are computed correctly", "To make traces readable in any vendor tool"], "a": 1, "why": "Span attributes are indexed and captured by default. Making content opt-in keeps customer text out of places with wide access unless you choose to keep it."}, {"q": "Engineers need transcripts to debug, and compliance needs a long-term record. What is the usual design?", "o": ["One store with long retention and wide access", "Raw transcripts in the debug store, kept a week", "Two stores: redacted short-lived traces and a controlled record", "No transcripts at all, only aggregate metrics", "Only the compliance store, with full engineer access"], "a": 2, "why": "Mixing the two either exposes raw customer data to engineers or leaves the compliance record thin when the debug store rotates."}, {"q": "Redaction replaces every amount and date with '***', and now wrong-amount bugs cannot be analysed. What is the better approach?", "o": ["Typed placeholders that keep the structure", "Stop redacting amounts and dates", "Redact only in the compliance store", "Ask reviewers to guess the masked values", "Log amounts in a separate plain file"], "a": 0, "why": "A typed token (an account number token, an amount bucket) keeps what error analysis needs while removing the sensitive value."}], "open": {"q": "We're launching an assistant in our app. What would you log for each turn, and how would you handle privacy?", "probe": "A complete per-turn trace for error analysis, with redaction, retention and provenance thought through.", "a": ["One structured trace per turn: intent with confidence and top alternatives, slots, state, retrieved ids, tool calls and results, guardrail verdicts, latency per stage, tokens, handoff reason, outcome.", "Prompt, model and content versions on every answer, so any reply can be reconstructed.", "Redact at the edge before analytics, with typed placeholders, and measure redaction recall.", "Two stores: a short-lived redacted debug store for engineers and a controlled long-retention system of record.", "Follow a standard such as OpenTelemetry's GenAI conventions, pinned to a version, with content capture opt-in."]}, "say": ["**I'd log every turn as a structured trace, redacted at the edge, so any answer can be traced back.**", "**The trace:** intent, confidence and alternatives, tool calls, latency per stage and the versions in play.", "**Redact first:** before anything lands in analytics. The raw transcript is a regulated record with its own retention and access rules.", "**Part of the product:** at alfred_ the turn's tool-execution ledger is what my grounding check reads, so that log isn't only for debugging.", "Without the trace I can't explain an answer, so I log first."], "avoid": ["Putting raw customer text in indexed log fields"], "was": ["d-telemetry-per-turn"], "res": [{"kind": "video", "req": true, "label": "Intro to OpenTelemetry and LLM observability", "url": "https://www.youtube.com/watch?v=0I0ZrmyoTpM", "m": 16, "why": "A trace tree with a span per model, tool and retrieval step.", "yt": {"id": "0I0ZrmyoTpM", "ch": "Arize AI"}}, {"kind": "video", "req": false, "label": "OpenTelemetry GenAI in practice: the spec versus what you see", "url": "https://www.youtube.com/watch?v=289rsaYNLOA", "m": 24, "why": "What the GenAI semantic conventions record in real traces, and what is opt-in.", "yt": {"id": "289rsaYNLOA", "ch": "CNCF [Cloud Native Computing Foundation]"}}, {"kind": "video", "req": true, "label": "Presidio PII detection and anonymization demo", "url": "https://www.youtube.com/watch?v=RPJ3-kEUybU", "m": 4, "why": "Detect and replace names and account-like values with typed placeholders before storing.", "yt": {"id": "RPJ3-kEUybU", "ch": "omri374ms"}}, {"kind": "read", "req": true, "label": "OpenTelemetry: GenAI semantic conventions", "url": "https://opentelemetry.io/docs/specs/semconv/gen-ai/", "m": 10, "why": "The attribute list per model call, and prompt content as opt-in events."}, {"kind": "read", "req": true, "label": "Microsoft: Presidio", "url": "https://microsoft.github.io/presidio/", "m": 8, "why": "Analyzer and anonymizer, the redact-at-the-edge tool."}, {"kind": "read", "req": false, "label": "Dash0: OpenTelemetry GenAI semantic conventions explained", "url": "https://www.dash0.com/knowledge/opentelemetry-genai-semantic-conventions-explained", "m": 10, "why": "A plain walk through the span and event fields."}]}, {"id": "eval-dashboards", "title": "Dashboards and alerts that find real problems", "brief": "Uptime and error rate are not enough for an assistant. The signals that catch real breakage are behavioural: fallback and handoff rate by intent, confidence drift, repeat contact, latency per stage at p95, cost per conversation and sampled judge scores. The nuance: slice before you aggregate. A global fallback rate of 8% can hide one intent that went from 2% to 40%.", "points": ["Quality signals: fallback, no-match and clarification rates, handoff by reason, thumbs down, abandonment right after a bot turn, repeat contact", "Model signals: the top-1 confidence distribution, the share below threshold, the intent mix; a mix shift is often a business event and an early warning for the business too", "Latency: p95 and p99 per stage (ASR, router, retrieval, LLM first token, tools, TTS); p50 hides the pain", "Slices: intent, channel, segment, release and prompt version, because the cause of a spike is almost always one of these", "Alert design: baselines by time of day and weekday, relative change with a minimum volume, routed to the owner, each alert linked to its traces", "Kill switch: turn one topic to a fixed fallback or a person with a flag, without a deploy"], "figs": ["servingPath"], "production": ["Judge scores on a sampled slice (5 to 10% is a common starting point) are trended over time with human spot checks; alert on a sustained drop over a window, not on single scores.", "OTel token usage metrics, including cache variants, give cost signals without a separate billing pipeline: tokens per conversation, cost per resolved conversation, cache hit rate, share of traffic reaching the large model.", "Safety signals: guardrail trips, blocked outputs, PII found in outputs, prompt-injection detections, and any answer on a regulated topic that did not come from the approved library.", "DoorDash runs an online guardrail and an offline judge as two monitoring layers (secondary summary).", "Finance incident path: contain (switch the topic off), assess how many customers saw it from per-turn logs, correct, and record."], "mcq": [{"q": "Global fallback holds steady at 8% after a release. Why might you still have a serious regression?", "o": ["One intent can spike while others improve", "Fallback is not a useful signal for bots", "8% is above any acceptable threshold", "Fallback only moves with ASR changes", "Global rates update too slowly to show it"], "a": 0, "why": "Aggregates average away a local break. Slice by intent, channel and release before trusting a flat global number."}, {"q": "Average LLM latency is a stable 700 ms, but callers complain about long pauses. What should the dashboard show?", "o": ["Mean latency per day", "Total tokens per day", "p95 and p99 per stage", "Error rate per hour", "Number of active sessions"], "a": 2, "why": "The mean hides the tail. Per-stage high percentiles show which stage produces the long silences people remember."}, {"q": "Which alert rule gives the least noise while still catching real breaks?", "o": ["Fixed absolute thresholds on every metric", "Any single judge score below 3", "Every guardrail trip pages the on-call", "Relative change against a time-of-day baseline, with a minimum volume", "A daily email listing all metrics"], "a": 3, "why": "Time-aware baselines remove normal daily swings, relative change adapts to each intent's level, and a minimum volume stops tiny intents from paging people."}, {"q": "Within an hour the intent mix shifts sharply toward 'my transfer failed'. Who should hear first?", "o": ["Only the ML team, so they can retrain", "The platform and business owners: it may be an outage", "Nobody, until the weekly review", "Conversation designers, to add phrases", "Compliance, to file a report"], "a": 1, "why": "A sudden mix shift is usually a business event, here likely a payments problem. It is an early warning for the business, not a model issue."}], "open": {"q": "Design the monitoring for our live assistant. What's on the dashboard, and what wakes someone up?", "probe": "Behavioural signals sliced by intent and release, and alerts that are actionable.", "a": ["Quality: fallback, handoff by reason, abandonment after a bot turn, repeat contact and sampled judge scores; model: confidence distribution and intent mix.", "Latency p95 and p99 per stage, and cost per resolved conversation with the share of traffic going to the large model.", "Everything sliced by intent, channel, release and prompt version.", "Alerts on relative change against time-aware baselines with a minimum volume, routed to the owner and linked to the traces.", "Safety trips and regulated-topic answers go to risk, with a per-topic kill switch that needs no deploy."]}, "say": ["**I'd alert on behaviour per intent, not only uptime.**", "**What's on it:** fallback and handoff against a baseline, confidence drift, p95 per stage and cost per resolved conversation.", "**Slice by release:** so a regression points at a deploy, and every alert links to the conversations behind it.", "**First move:** reading ten of them, not guessing.", "Then the owner fixes it, or flips the kill switch."], "avoid": ["Alerting on averages: p50 latency and global rates hide the tail and the one broken intent"], "was": ["d-dashboards-alerts"], "res": [{"kind": "video", "req": true, "label": "Mastering latency metrics: P90, P95, P99", "url": "https://www.youtube.com/watch?v=lJ4NEMNBeS4", "m": 7, "why": "Why p50 hides the slow tail that callers feel.", "yt": {"id": "lJ4NEMNBeS4", "ch": "ByteMonk"}}, {"kind": "video", "req": true, "label": "Datadog LLM Observability", "url": "https://www.youtube.com/watch?v=uA4pBu8leyU", "m": 7, "why": "A dashboard of latency, cost, errors and quality signals per trace.", "yt": {"id": "uA4pBu8leyU", "ch": "Datadog"}}, {"kind": "video", "req": false, "label": "LLM observability: dashboards, alerts and SLOs", "url": "https://www.youtube.com/watch?v=mv_a0pPzSVI", "m": 10, "why": "Choosing alert thresholds and SLOs for an LLM app.", "yt": {"id": "mv_a0pPzSVI", "ch": "KryptoMindz Technologies"}}, {"kind": "read", "req": true, "label": "Google SRE book: monitoring distributed systems", "url": "https://sre.google/sre-book/monitoring-distributed-systems/", "m": 20, "why": "The four golden signals and alerting on symptoms, not causes."}, {"kind": "read", "req": true, "label": "Langfuse: metrics overview", "url": "https://langfuse.com/docs/metrics/overview", "m": 8, "why": "Slicing latency, cost and scores by version, user and session."}, {"kind": "read", "req": false, "label": "ZenML LLMOps database: DoorDash support system", "url": "https://www.zenml.io/llmops-database/building-a-high-quality-rag-based-support-system-with-llm-guardrails-and-quality-monitoring", "m": 8, "why": "A support bot with quality monitoring and guardrails in production."}]}, {"id": "eval-cost", "title": "Cost per resolution, and the levers that cut it", "brief": "Most conversational traffic is a few easy intents, so the large model should be the exception: a cheap router or classifier first, the LLM only when needed, the stable prompt prefix cached, context trimmed. The number to defend is cost per resolved conversation, not deflection. The nuance: a cascade saves money only if the router is calibrated, because a confident wrong answer on the cheap path has nothing downstream to catch it.", "points": ["Cascade: an embedding router or small classifier takes high-confidence known intents, and low-confidence or open-ended turns go to the LLM; tune the threshold on a labelled set and watch the share at each tier", "Risky intents: a stricter threshold or a confirmation step whatever the confidence, since the cheap path has no second check", "Caching: put the stable part (system prompt, policy, tool definitions) first and cache it; cache FAQ answers keyed on content version; never cache anything personal", "Shorter context: summarise old turns, retrieve fewer and better chunks, trim tool output; input tokens dominate long conversations and slow the first token", "Fine-tune: for a narrow, stable task with plenty of labels (routing, extraction); keep facts that change in retrieval", "Cost per resolved conversation: count platform, content, QA, review and human handoff, not only tokens; check it against repeat contact, and keep protected intents (disputes, hardship) out of the containment target"], "figs": ["clfLadder"], "production": ["FrugalGPT reports matching the best single model with up to 98% cost reduction by cascading, and notes model prices differ by up to two orders of magnitude.", "RouteLLM's learned routers reported over 85% cost reduction on MT-Bench at 95% of GPT-4 quality, sending 14% of queries to the strong model, but only 45% on MMLU: measure on your own traffic.", "On Anthropic, cached input tokens cost roughly a tenth of normal input while cache writes cost a premium; batch work is discounted, which suits offline judge runs but not the live path.", "Klarna reported (company figures) two-thirds of chats handled in the first month and a 25% drop in repeat inquiries; critics note mostly level-one questions and unclear measurement, and in 2025 it began rehiring people for complex cases.", "Intercom separates deflection (the AI answered, the customer may have left unhappy) from resolution (confirmed, or no return with the same question), and warns that vendors often count non-escalated chats as resolved."], "mcq": [{"q": "You put a cheap classifier in front of the LLM. Cost falls 60%, but complaints about wrong balance answers rise. What most likely happened?", "o": ["The LLM itself got worse after the change", "Prompt caching changed the model's answers", "The router's threshold is too loose for that intent", "The classifier is too slow under load", "Customers dislike templated replies"], "a": 2, "why": "A confident wrong answer on the cheap path has no second check. Tune the threshold on labelled data, and give risky intents a stricter threshold or a confirmation step."}, {"q": "Deflection rose from 50% to 65% and cost per conversation fell, but repeat contact rose. Which number should you defend instead?", "o": ["Deflection rate", "Cost per resolved conversation", "Cost per conversation", "Average bot handle time", "Total tokens per month"], "a": 1, "why": "Deflection counts conversations the bot kept, solved or not. Cost per resolved conversation, checked against repeat contact, falls only when problems are actually solved."}, {"q": "Where do you place the system prompt, policy and tool definitions to benefit from prompt caching?", "o": ["At the end, after the user's message", "Split across turns to spread the cost", "In a separate request that is never cached", "First, as a stable prefix, with variable content last", "Anywhere, since caching matches any substring"], "a": 3, "why": "Prompt caching matches a shared prefix. Stable content first and variable content last lets every turn reuse the cached part."}, {"q": "When is fine-tuning the right lever?", "o": ["To keep the bot current with changing fee schedules", "Whenever the prompt grows longer than a page", "To remove the need for evaluation", "To make the model cite its sources", "For a narrow, stable task like routing with plenty of labels"], "a": 4, "why": "Fine-tuning pays on a narrow job with lots of labelled data, often letting a small model match a large one. Facts that change belong in retrieval."}], "open": {"q": "Our LLM bill doubled last quarter. How would you bring it down without hurting quality?", "probe": "The levers in the right order, measured per intent, and the right unit of cost.", "a": ["Measure first: cost per resolved conversation by intent and tier, and where the tokens go (prompt prefix, history, tool output).", "Route the frequent easy intents to a cheap classifier or template, with a calibrated threshold and stricter rules on risky intents.", "Cache the stable prefix, trim history and tool output, retrieve fewer and better chunks.", "Fine-tune a small model only for a narrow stable job with labels; keep changing facts in retrieval.", "After each cut, check quality per intent and repeat contact, so a saving is not a hidden regression."]}, "say": ["**I'd start the other way round from most demos: the big model is the exception.**", "**Cheap first:** handle the common intents cheaply, cache the stable prompt prefix, and trim what goes into context.", "**At alfred_:** the lean first pass I built answers simple turns from what it can read, or escalates to a heavier agent, and code guards turn a reply that promises an action into an escalation instead of shipping it.", "**Measure each cut:** quality per intent after every change.", "The number I defend is cost per resolved conversation."], "avoid": ["Quoting a cost saving figure for alfred_: describe how the cascade works, not a number", "Treating deflection as resolution"], "was": ["d-cost-latency-levers", "d-cost-per-resolution"], "res": [{"kind": "video", "req": true, "label": "RouteLLM: 90% of GPT-4o quality, 80% cheaper", "url": "https://www.youtube.com/watch?v=GhXQKz5WKSA", "m": 9, "why": "A router sending easy queries to a cheap model and hard ones to a strong one.", "yt": {"id": "GhXQKz5WKSA", "ch": "Matthew Berman"}}, {"kind": "video", "req": true, "label": "What is prompt caching?", "url": "https://www.youtube.com/watch?v=u57EnkQaUTY", "m": 10, "why": "Why a stable prompt prefix cuts cost and first-token time.", "yt": {"id": "u57EnkQaUTY", "ch": "IBM Technology"}}, {"kind": "video", "req": false, "label": "Prompt caching explained: stop overpaying for AI agents", "url": "https://www.youtube.com/watch?v=SkM4k4SKvCM", "m": 18, "why": "Cache-friendly ordering of system prompt, tools and history in agents.", "yt": {"id": "SkM4k4SKvCM", "ch": "Hugging Face"}}, {"kind": "read", "req": true, "label": "LMSYS: RouteLLM", "url": "https://www.lmsys.org/blog/2024-07-01-routellm/", "m": 10, "why": "Router training and the cost-quality curve."}, {"kind": "read", "req": true, "label": "Anthropic: prompt caching", "url": "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "m": 10, "why": "What gets cached, the prefix rule, and the price difference."}, {"kind": "read", "req": false, "label": "arXiv: FrugalGPT", "url": "https://arxiv.org/abs/2305.05176", "m": 15, "why": "Cascade, prompt adaptation and completion cache as the three cost levers."}]}, {"id": "eval-voice", "title": "The voice latency budget", "brief": "On a call people notice a pause after about a second, so endpointing, ASR, the model, tools, TTS and the network share one budget. Most of the delay is turn-taking and LLM time to first token, which is why streaming and a fast path for simple intents matter more than a bigger model. The nuance: a faster, smaller model saves milliseconds and may add errors on account numbers and amounts, so latency and accuracy are evaluated together.", "points": ["Budget, as ranges to measure against: endpointing 150 to 300 ms, final ASR 100 to 200, LLM first token 300 to 600, TTS first byte 100 to 250, network 50 to 150; roughly 0.8 to 1.5 s in all", "Stream every stage: partial transcripts into the prompt, tokens into TTS at the first sentence boundary; a stage that waits for the previous one loses the budget", "Percentiles: p50 can be fine while p95 is a long silence, and callers remember the silences", "Fast path: a router answers a balance or hours question with a template and no LLM call", "Tools: a core banking call can cost more than the model; acknowledge, run independent calls in parallel, and time out with a graceful fallback", "Turn-taking: wait too long and you add dead air, cut in early and you talk over the caller; give more patience while collecting digits, and support barge-in"], "figs": ["voicePipeline", "turnTaking"], "production": ["The AWS Builder Center's 800 ms rule gives per-stage ranges for a real-time voice agent and stresses p95 over p50.", "A cascaded ASR, LLM and TTS pipeline keeps a text checkpoint where you can apply guardrails, redact, log and require approved phrasing, which is why many financial deployments stay with it rather than speech-to-speech models.", "Voice evals need audio test sets with noise and accents, with error measured on the high-stakes tokens (account numbers, amounts), not only overall word error rate.", "Long history inflates time to first token on every turn, so teams summarise earlier turns and keep the stable prefix cached."], "mcq": [{"q": "Mean end-to-end latency is 900 ms, but callers say the agent often goes silent. Where do you look first?", "o": ["Mean latency per stage", "Token counts per call", "The TTS voice choice", "p95 per stage, above all first token and tools", "Average call length"], "a": 3, "why": "Silences live in the tail. Per-stage p95 shows whether model first-token time or a slow backend call produces them."}, {"q": "A caller reads out a 12-digit account number with pauses, and the agent keeps cutting in. What do you change?", "o": ["Switch to a larger LLM", "Give endpointing more patience while collecting digits", "Shorten the system prompt", "Switch the TTS voice", "Lower the ASR confidence threshold"], "a": 1, "why": "The endpointer decides the caller has finished at each pause. Teams tune it per prompt type, waiting longer when digits are expected."}, {"q": "Why do many financial voice deployments keep a cascaded ASR, LLM, TTS pipeline instead of a speech-to-speech model?", "o": ["It is always faster end to end", "Speech-to-speech models cannot handle English", "Cascades need no endpointing", "Regulators ban speech-to-speech models", "It gives a text checkpoint for guardrails, logging and approved wording"], "a": 4, "why": "Speech-to-speech can be faster, but the text step in a cascade is where you redact, log for the record, run guardrails and insert fixed confirmations and disclosures."}, {"q": "Swapping to a smaller ASR model saves 80 ms. What must you check before shipping it?", "o": ["Error on account numbers and amounts in noisy audio", "Overall word error rate on clean audio", "The new model's token cost", "TTS first-byte latency", "LLM time to first token"], "a": 0, "why": "The errors that matter are on high-stakes tokens under real call conditions. A clean-audio average can stay flat while digit errors rise."}], "open": {"q": "Our voice assistant feels slow and callers complain about pauses. How would you approach it?", "probe": "A per-stage budget, percentiles, streaming, and the trade-off between latency and accuracy.", "a": ["Write the budget per stage and measure p95 per stage on real calls: endpointing, ASR, LLM first token, tools, TTS, network.", "Stream end to end: partial transcripts in, the first sentence to TTS early.", "Route simple intents around the LLM, and trim and cache context to cut first-token time.", "Cover slow tools with an acknowledgement, parallel calls and timeouts with a fallback.", "Tune endpointing per prompt type, and re-check accuracy on numbers and amounts after any faster-model swap."]}, "say": ["**For voice I'd write the latency budget per stage first, then measure p95 per stage.**", "**The tail:** the pauses callers hate live there.", "**Stream and route:** stream end to end, route the simple intents around the LLM, and cover slow tool calls with a short acknowledgement.", "**Accuracy too:** I wouldn't buy speed with accuracy on account numbers. Any faster model gets re-tested on noisy audio before it ships.", "Latency and accuracy get evaluated together."], "avoid": ["Quoting the budget ranges as guarantees: they are published targets to measure against"], "was": ["d-voice-latency-budget"], "res": [{"kind": "video", "req": true, "label": "Reduce the latency of your voice agent", "url": "https://www.youtube.com/watch?v=jnedfk5PL2A", "m": 14, "why": "Where the milliseconds go across endpointing, STT, LLM and TTS, and how to stream them.", "yt": {"id": "jnedfk5PL2A", "ch": "LiveKit"}}, {"kind": "video", "req": true, "label": "How to crack 500ms latency in AI voicebots", "url": "https://www.youtube.com/watch?v=6jjIVGQn3To", "m": 27, "why": "A practitioner's budget breakdown across the pipeline stages.", "yt": {"id": "6jjIVGQn3To", "ch": "CommCon"}}, {"kind": "video", "req": false, "label": "Fix voice agent tool call latency with async function tools", "url": "https://www.youtube.com/watch?v=AQZOIr3511U", "m": 7, "why": "Tool calls costing more than the model, and acknowledging while they run.", "yt": {"id": "AQZOIr3511U", "ch": "LiveKit and codeSTACKr"}}, {"kind": "read", "req": true, "label": "AWS Builder Center: the 800ms rule, budgeting latency for a voice agent", "url": "https://builder.aws.com/content/3JDFAfXBiuwPP5MPzgf4RUWSAIp/the-800ms-rule-budgeting-latency-for-a-real-time-voice-agent-on-aws", "m": 10, "why": "A per-stage budget table to measure against."}, {"kind": "read", "req": true, "label": "Hamming: voice AI latency, what is fast and slow", "url": "https://hamming.ai/resources/voice-ai-latency-whats-fast-whats-slow-how-to-fix-it", "m": 10, "why": "Percentile targets and fixes per stage."}, {"kind": "read", "req": false, "label": "LiveKit: turns, endpointing and interruptions", "url": "https://docs.livekit.io/agents/build/turns/", "m": 10, "why": "Endpointing delay and interruption settings, the turn-taking trade-off."}]}, {"id": "harness-what", "title": "What a harness is, and why capable models still fail without one", "brief": "Why does a strong model still fail on a real task? Usually the fault is in the loop around it (instructions, tools, state, memory, validation, observability), not in the weights. The nuance: a harness is engineering infrastructure, not a longer prompt.", "points": ["The loop: the model only predicts the next step. The harness is everything that feeds it context, runs the tools it asks for, stores what happened, checks the result and decides whether to go round again", "Six parts: instructions (what to do and what never to do), tools (what it can act on), state (where the task stands), memory (what survives between turns and sessions), validation (is the result right), observability (a record you can replay). Remove one and the same model gets worse, which is how you measure each part", "Same model, different outcome: the course reports one model costing about $9 for a 20 minute solo run against about $200 for a 6 hour run with a full harness, the second one actually working. The gap is structure, not capability", "Five failure layers: vague requirements, unwritten conventions, an incomplete environment, no way to verify, and state lost between sessions. When a capable model fails a well posed task, attribute the failure to one layer, fix that layer, run again", "One giant instruction file fails: a 600 line file costs 10K to 20K tokens of a 200K window before any work starts, rules in the middle of long text get used less than rules at the ends, and nothing says which rules are hard. Keep a short entry file with hard constraints and load detail topic by topic", "Overreach and under-finish: with several tasks open the model's attention divides across them and none finish. Work in progress of one, done only when a command proves it, is the harness fixing a model habit"], "production": ["In a bank assistant the harness is the orchestration code: system prompt and policy, tool schemas for balance and card actions, the dialogue state, the validation of what the model proposed, and the traces. The model is one replaceable call inside it", "Debugging starts with the layer, not the model: was the instruction missing, did the tool return an error the model never saw, did state get dropped? Swapping a model before checking this usually buys little", "Harnesses decay like any code: rules go stale, and a stale rule misleads more than a missing one, so each part needs an owner and a periodic review"], "figs": [], "res": [{"kind": "read", "req": true, "label": "Course, lecture 2: What a harness actually is", "url": "https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-02-what-a-harness-actually-is/", "m": 15, "why": "The five subsystems and how to measure each by removing it. Start here."}, {"kind": "read", "req": true, "label": "Course, lecture 1: Why capable agents still fail", "url": "https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-01-why-capable-agents-still-fail/", "m": 15, "why": "The five failure layers and the diagnose, fix, re-run loop."}, {"kind": "read", "req": false, "label": "Course, lecture 4: Why one giant instruction file fails", "url": "https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-04-why-one-giant-instruction-file-fails/", "m": 12, "why": "The context budget and lost in the middle arguments; lecture 7 on overreach is the next one if you have time."}, {"kind": "video", "req": true, "label": "AI Model vs Agentic Harness: What Actually Drives AI", "url": "https://www.youtube.com/watch?v=ZELPNFXJ4_o", "m": 9, "why": "A short, clear picture of model against harness. Watch first.", "yt": {"id": "ZELPNFXJ4_o", "ch": "IBM Technology"}}, {"kind": "video", "req": true, "label": "Harness Engineering Explained in 22 Minutes", "url": "https://www.youtube.com/watch?v=UmZytjgs2eo", "m": 23, "why": "The parts of a harness walked through with examples.", "yt": {"id": "UmZytjgs2eo", "ch": "Shaw Talebi"}}, {"kind": "video", "req": false, "label": "Why The Harness Matters More Than The Model | YC Paper Club", "url": "https://www.youtube.com/watch?v=n9xKblqyQ28", "m": 61, "why": "A paper discussion on why the loop dominates results; skim the first half if short of time.", "yt": {"id": "n9xKblqyQ28", "ch": "Y Combinator"}}], "mcq": [{"q": "A strong model fails a clearly specified task. What should you check first?", "o": ["Switch to the most expensive model available", "Which harness layer failed: instructions, tools, state, memory or validation", "Add more examples to the prompt until it passes", "Lower the temperature to zero", "Retrain the model on the failed cases"], "a": 1, "why": "Most failures on well posed tasks come from the loop around the model. Attributing the failure to a layer tells you what to fix, and it is cheaper than a model swap."}, {"q": "A team removes one harness part at a time with the model held fixed and measures the drop. What does this tell them?", "o": ["Which model is best", "How much each part contributes, so effort goes where it pays", "Whether the prompt is too long", "Nothing, since removing parts always lowers quality", "How many tokens the model can read"], "a": 1, "why": "Holding the model constant isolates the harness part. It is an ablation, and it also shows which parts have become unnecessary as models improve."}, {"q": "Why does a 600 line instruction file hurt an agent?", "o": ["Models cannot read more than 100 lines", "It costs context before work starts, buries rules in the middle, and hides which rules are hard", "Long files are slower to download", "It makes the model forget its training", "Markdown is not allowed in prompts"], "a": 1, "why": "The file spends part of a finite window, rules in the middle of long text are used less than those at the ends, and hard and soft rules look the same. A short entry file with topic files loaded on demand avoids all three."}, {"q": "In a bank assistant, which is part of the harness rather than the model?", "o": ["The weights of the language model", "The code that checks a proposed transfer against policy before calling the payments API", "The tokenizer's vocabulary", "The model's pretraining data", "The attention heads"], "a": 1, "why": "Validation of a proposed action, tool definitions, state and traces are harness code. You can change them without touching the model."}, {"q": "A model with several tasks open leaves all of them half done. Which harness rule addresses this?", "o": ["A bigger context window", "A higher temperature", "One task in progress at a time, closed only when a command proves it works", "Asking the model to be more careful", "Removing all tools"], "a": 2, "why": "Attention divides across open tasks, so each gets less. Limiting work in progress to one, with a machine check for done, forces completion before the next starts."}], "open": {"q": "A model that does well in a demo keeps failing in your assistant. How do you think about it?", "probe": "What do you change before you consider a different model?", "a": ["I would treat the model as one part of a loop and ask which part of the loop failed: unclear instructions, a tool that returned an error the model never saw, state that was dropped, or nothing checking the result", "I would read traces of the failed cases, put each in one of those layers, fix the layer and re-run the same cases with the same model", "The proof is an ablation: hold the model fixed, remove one part, and see what drops", "A bigger model is the last step, because a better model inside a weak loop still fails the same way less often"]}, "say": ["**A capable model fails because the loop around it is weak, so I fix the loop before I change the model.**", "**What a harness is:** instructions, tools, state, memory, validation and observability around a model that only predicts the next step.", "**How I find the fault:** read the trace, put the failure in one layer, fix it, and re-run the same cases with the model held fixed.", "**What I keep small:** a short instruction file with the hard rules, detail loaded when needed, and one task open at a time.", "Models change every few months, the loop is what I own and can improve."]}, {"id": "harness-memory", "title": "Memory and continuity in long conversations and long tasks", "brief": "How do you keep an assistant coherent when the conversation or task is longer than its context window? Decide what to keep, summarise or drop, keep session state apart from durable memory, and end every session in a state the next one can start from. The nuance: a summary is lossy, so facts that must survive belong in structured state, not in prose.", "points": ["Finite window: context is a budget, and tool output and history keep filling it. A model near the limit tends to rush and finish early, which the course calls context anxiety. Plan for the end of the window, do not hope to avoid it", "Keep, summarise, drop: keep verbatim what the next step needs (the current request, confirmed slots, constraints, open actions); summarise what only needs its gist (earlier discussion); drop what is noise (old tool output already used, repeated greetings)", "Summaries lose detail: a compacted history can silently drop an amount, a date or a refusal the user made. So never rely on a summary for facts that matter. Write them to state fields (amount, payee, confirmed yes or no) and carry those through every compaction", "Session state against durable memory: session state is the working record of this task (slots, step reached, pending confirmation) and can be discarded when it ends. Durable memory is what should outlive it (preferences, a case reference, what was agreed). Writing to durable memory is a decision, with a reason and an owner, not a dump of the transcript", "Handoff artifacts: for long tasks the course keeps a progress file (what is done, test status, blockers, next step), a decision log (what was chosen and why) and a commit per unit of work. A new session reads these first and reaches a working state in minutes instead of rebuilding it by inference", "Clean state: a session ends only when the work is verified and the record is updated: it builds, tests pass, progress is written, temporary files are removed and the normal start path works. The repository, not anyone's recollection, is the system of record, and information outside it does not exist for the agent", "Initialise once, properly: setup (start command, a passing test, a map of the project, an ordered task list) is its own phase, because mixing it with feature work lets it be skipped and costs every later session about twenty minutes of re-inference"], "production": ["A bank assistant keeps the dialogue state (intent, slots, authentication level, pending confirmation) as typed fields outside the model's prose, so a compaction cannot change the amount the user confirmed", "Durable memory in a regulated setting is narrow: what the customer chose and a case reference may be kept; account data is fetched fresh from the system of record, because a stored copy goes stale and raises retention questions", "Handoff to a human agent is the same idea at conversation scale: pass a short summary plus the structured state, so the customer does not repeat themselves"], "figs": [], "res": [{"kind": "read", "req": true, "label": "Course, lecture 5: Why long running tasks lose continuity", "url": "https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-05-why-long-running-tasks-lose-continuity/", "m": 15, "why": "Progress files, decision logs, clock in and clock out routines, and context anxiety."}, {"kind": "read", "req": true, "label": "Course, lecture 12: Why every session must leave a clean state", "url": "https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-12-why-every-session-must-leave-a-clean-state/", "m": 12, "why": "The five clean state checks and why entropy grows on its own."}, {"kind": "read", "req": true, "label": "Course, lecture 3: The repository as the system of record", "url": "https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-03-why-the-repository-must-become-the-system-of-record/", "m": 12, "why": "Why knowledge outside the visible record does not exist for the agent; lecture 6 on initialisation is the companion."}, {"kind": "video", "req": true, "label": "How we solved Context Management in Agents (Sally-Ann Delucia)", "url": "https://www.youtube.com/watch?v=esY99nYXxR4", "m": 17, "why": "A practical talk on what to keep in an agent's context and what to cut.", "yt": {"id": "esY99nYXxR4", "ch": "AI Engineer"}}, {"kind": "video", "req": true, "label": "Agent Memory EXPLAINED - Complete Architecture", "url": "https://www.youtube.com/watch?v=aYfZN8t6AQs", "m": 29, "why": "Short term against long term memory and how each is read and written.", "yt": {"id": "aYfZN8t6AQs", "ch": "Hugging Face and Alejandro AO"}}, {"kind": "video", "req": false, "label": "Build Hour: Agent Memory Patterns", "url": "https://www.youtube.com/watch?v=WsGVXiWzTpI", "m": 58, "why": "Optional depth: patterns for trimming, summarising and storing memory; the first half covers the basics.", "yt": {"id": "WsGVXiWzTpI", "ch": "OpenAI"}}], "mcq": [{"q": "A long chat is compacted into a summary. Which detail is most dangerous to leave only in the summary?", "o": ["The user's greeting", "The amount and payee the user confirmed for a transfer", "A joke the user made", "The assistant's apology", "The time the chat started"], "a": 1, "why": "A summary is lossy and can drop or blur exact values. Facts that must survive go in structured state that every compaction carries through unchanged."}, {"q": "Which is session state rather than durable memory?", "o": ["The customer's preferred language, saved with consent", "The step reached in a card replacement flow and the pending confirmation", "A case reference for a complaint", "A saved payee agreed in an earlier call", "The agreement that statements go by email"], "a": 1, "why": "Session state is the working record of one task and can be discarded when it ends. Durable memory holds what should outlive it."}, {"q": "What does the course say a progress file is for?", "o": ["Recording who wrote each line", "Letting a fresh session see what is done, what is blocked and what is next, so it starts working in minutes", "Storing the model's weights", "Replacing the tests", "Making the context window larger"], "a": 1, "why": "Models forget between sessions. Written progress, with decisions and their reasons, is the long term memory of the task."}, {"q": "A model starts finishing tasks early as its context nears full. What is the sensible response in the harness?", "o": ["Ignore it, since it is random", "Hand off through written state and start a fresh session, rather than relying on the model to pace itself", "Switch off verification to save tokens", "Double the temperature", "Remove the system prompt"], "a": 1, "why": "Near the limit, rushing and skipped checks become more likely. A handoff artifact plus a clean start gives the next session a full window and a known state."}, {"q": "Why store a customer's current balance in durable memory for next week's chat?", "o": ["You should not: fetch it fresh from the system of record, since a stored copy goes stale", "Because the model remembers numbers well", "Because it saves one API call, which always matters most", "Because regulators require it", "Because balances never change"], "a": 0, "why": "Account facts have a source of truth. A stored copy goes stale, can show the wrong number, and raises retention questions. Keep references, not copies."}], "open": {"q": "How would you manage memory for a banking assistant in a long conversation, and across conversations?", "probe": "What do you keep, what do you summarise, what do you never store?", "a": ["Inside a conversation I keep the facts the next step needs as structured state: intent, slots, authentication level, pending confirmation. Earlier chat can be summarised and old tool output dropped", "I would not trust a summary for values like amounts and dates, so those live in the state fields and survive any compaction", "Across conversations I keep very little as durable memory: preferences with consent and a case reference. Balances and transactions are fetched fresh from the system of record", "Handoff to a person passes the summary and the structured state together, and I test that by checking a new reader can continue without asking again"]}, "say": ["**I keep exact facts in structured state, and let only the gist go through summaries.**", "**Keep, summarise, drop:** the current request and confirmed slots stay verbatim, earlier talk is summarised, used tool output is dropped.", "**Session against durable:** session state ends with the task, durable memory is small, with consent and a reason, and account data is fetched fresh.", "**Leaving clean:** every session ends with its progress and decisions written down, so the next one starts from the record and not from guesswork.", "If someone new could not pick the task up from what we wrote, the memory is not good enough yet."]}, {"id": "harness-validate", "title": "Validation and evaluation inside the harness", "brief": "How does the harness know a step was right, and the whole task done? Check after every step, check the whole path end to end, record enough to replay a failure, and never let the model grade itself. The nuance: models are overconfident, so done has to be decided by evidence outside the model.", "points": ["Declaring done too early: a model reports higher confidence than its accuracy earns, and it grades its own work too kindly. So done is decided by the harness from runtime evidence, not by the model's word", "Layers of checks: first syntax and schema (is the output well formed, does the tool call match its signature), then runtime behaviour (did the call succeed, did the state change as intended), then end to end (does the full user task work through the real pipeline). Each layer must pass before the next counts", "Unit tests are not enough: interface mismatches, state passed wrongly between components, resource leaks, environment differences and error propagation only show in a full run. The course's example finds five such defects end to end that unit tests found none of. Knowing a full run will judge it also changes how the model works: it attends to the seams", "Separate the checker from the worker: a planner, generator and independent evaluator did better than one agent grading itself. The evaluator needs a rubric (correctness, policy, completeness), and a pre-agreed contract of what done means avoids vague rejections", "Errors that teach: 'test failed' invites a blind retry. 'The call returned 500, check that the email template path exists' gives the next step. A rule written as an executable check, with a fix instruction in its message, beats a rule in a document", "Observability inside the harness: the harness records every step (input, tool call, result, decision, timing) as a trace, so a failure can be replayed and not guessed at. Standard formats such as OpenTelemetry let it join the production monitoring you already have", "Closing the loop: a recurring review comment or an incident becomes a permanent test. A loop needs an objective, an independent check and a stopping condition a machine can verify, and watch its costs: skipped checks, lost understanding, and growing context"], "production": ["Guarded action: the model proposes a transfer, the harness validates payee, amount, limit and authentication level, and asks the user to confirm. The model never calls the payments API directly, and the trace shows which check allowed or blocked it", "Grounded answer: a check after generation confirms each stated fact (rate, fee, date) appears in a retrieved source, with a citation, and if not the assistant says it cannot confirm and offers a person. This is a check on the output, separate from the generator", "Regression gate: a fixed set of past conversations, including the ones that once failed, replays through the harness before a release. If a guarded action now slips through or a grounded answer loses its source, the release stops. Every production failure adds a case"], "figs": [], "res": [{"kind": "read", "req": true, "label": "Course, lecture 9: Why agents declare victory too early", "url": "https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-09-why-agents-declare-victory-too-early/", "m": 15, "why": "Overconfidence, self evaluation bias, the three validation layers and independent checkers. Start here."}, {"kind": "read", "req": true, "label": "Course, lecture 10: Why end to end testing changes results", "url": "https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-10-why-end-to-end-testing-changes-results/", "m": 12, "why": "What unit tests miss and how checks become permanent safeguards."}, {"kind": "read", "req": true, "label": "Course, lecture 11: Why observability belongs inside the harness", "url": "https://walkinglabs.github.io/learn-harness-engineering/en/lectures/lecture-11-why-observability-belongs-inside-the-harness/", "m": 12, "why": "Runtime signals, task tracing and evidence based feedback; lecture 13 on loops is the follow-on."}, {"kind": "video", "req": true, "label": "How to evaluate agents in practice", "url": "https://www.youtube.com/watch?v=vuBvf7ZRKTA", "m": 11, "why": "What to measure for an agent beyond the final answer.", "yt": {"id": "vuBvf7ZRKTA", "ch": "Google Cloud Tech"}}, {"kind": "video", "req": true, "label": "Observability and Evals for AI Agents: A Simple Breakdown", "url": "https://www.youtube.com/watch?v=FDVdLrloFOw", "m": 15, "why": "How traces feed evals and how the two work together.", "yt": {"id": "FDVdLrloFOw", "ch": "LangChain"}}, {"kind": "video", "req": false, "label": "Beginner's Guide to Agent Evaluations", "url": "https://www.youtube.com/watch?v=_QozKR9eQE8", "m": 41, "why": "Optional depth: building an eval set and running it; the first half covers the method.", "yt": {"id": "_QozKR9eQE8", "ch": "LangChain"}}], "mcq": [{"q": "A model says a task is complete. What should the harness do?", "o": ["Accept it, since the model knows best", "Check runtime evidence (tests, state, the real end to end path) before accepting", "Ask the model again and accept if it repeats itself", "Accept it if the answer is long", "Lower the confidence threshold"], "a": 1, "why": "Models are overconfident and grade their own work generously, so done is decided from evidence outside the model."}, {"q": "Unit tests pass for the transfer flow, but a full run shows the confirmation step loses the amount. Which defect type is this?", "o": ["A syntax error", "State passed wrongly between components, which only appears end to end", "A tokenizer bug", "A slow GPU", "A typo in the prompt"], "a": 1, "why": "Cross component defects such as interface mismatches and state propagation errors hide from isolated unit tests and show in a full run."}, {"q": "Which error message helps an agent most on the next attempt?", "o": ["Test failed", "Error", "Returned 500: check that the template path exists in the environment config", "Something went wrong, try again", "Invalid"], "a": 2, "why": "A message that names what failed and the likely fix lets the next attempt change something. A bare failure invites a blind retry."}, {"q": "A release gate replays a fixed set of past conversations. A guarded action now passes without confirmation. What happens?", "o": ["The release ships and the case is logged for later", "The release is blocked, and the case stays in the set permanently", "The case is removed because it is noisy", "The model is retrained overnight", "The threshold is raised for all tests"], "a": 1, "why": "That is the point of a regression gate: a behaviour that once worked and has now broken stops the release, and every failure becomes a permanent test."}, {"q": "Why separate the evaluator from the model that wrote the answer?", "o": ["To save tokens", "A model grades its own work too kindly, so an independent check with a rubric is more reliable", "Evaluators are always smaller models", "It removes the need for tests", "It makes answers shorter"], "a": 1, "why": "Self evaluation bias is the reason. An independent evaluator with a rubric and an agreed definition of done gives a more honest signal."}], "open": {"q": "How do you make sure a banking assistant's actions and answers are right, and stay right after changes?", "probe": "Where does the model's own judgment stop and the harness take over?", "a": ["For actions, the model proposes and the harness validates against policy: payee, amount, limit, authentication level. Then the customer confirms. The model never calls the payments API directly", "For answers, a check after generation confirms each stated fact appears in a retrieved source. If it cannot, the assistant says so and offers a person", "Every step is traced so I can replay a failure, not guess at it", "Before a release I replay a fixed set of past conversations, including every past failure, and block the release if a guarded action slips through or an answer loses its source"]}, "say": ["**The model proposes, and the harness decides whether it is right and whether it is done.**", "**Guarded action:** policy checks and a customer confirmation sit between the model and the payments API.", "**Grounded answer:** each stated fact has to match a retrieved source, or the assistant says it cannot confirm.", "**Regression gate:** past conversations, failures included, replay before every release, and each production failure adds one.", "I trust the evidence the harness collected, never the model's own account of how well it did."]}], "day": "Day 3, Tuesday 6 Oct"}, {"id": "sysdesign", "title": "System design: four assistants, drawn end to end", "day": "Day 3, Tuesday 6 Oct", "blurb": "Each topic opens the design itself: requirements, the high-level design built in stages, the deep dives with their sketches, and the patterns used. The bank virtual assistant in full, then three compact designs: a grounded FAQ assistant, a contact-centre voice line, and the analytics and improvement loop.", "topics": [{"id": "sd-virtual-assistant", "title": "Design the bank's virtual assistant end to end", "brief": "The full-size design: chat and phone, a classifier and code run the conversation, an LLM takes the unsure turns.", "points": ["Decide what the model may decide: a fast classifier and code run the conversation; the LLM handles unsure turns, free values and grounded FAQ answers; whether to act, what to call and when to transfer are code.", "Build it in four stages: channels in (speech to text, one message shape), understand and manage (NLU, dialogue state), answer and act (approved knowledge, identity checks, a fulfilment gateway to core banking), people and improvement (handoff with context, transcripts into error analysis).", "Confidence is the interface: every route, confirmation and fallback reads a score, so scores are calibrated and thresholds ship like a release.", "The four deep dives: the intent taxonomy and out-of-scope, confidence thresholds and calibration, classic NLU against an LLM against both, prompt injection and excessive agency.", "Never finished: the weekly loop of transcript review, labelling, clustering misses and regression tests is the product; containment without resolution is a wall."], "production": ["Thresholds are set per intent from a labelled set and re-checked whenever the model changes, because a model update silently moves the scores.", "Money actions pass a deterministic gate in code (identity verified, amount within limits, an explicit yes after a read-back) whatever the model says."], "figs": [], "res": [{"kind": "keep", "src": "site", "label": "System design guide: Enterprise virtual assistant", "url": "../SYSTEM%20DESIGN.html#/designs/virtual-assistant/requirements"}, {"kind": "video", "req": true, "label": "Conversational AI assistants with CALM: architecture of an assistant", "url": "https://www.youtube.com/watch?v=zzUY5T9I730", "m": 5, "why": "An LLM interprets the turn while flows and code own the business logic, the same split as the design.", "yt": {"id": "zzUY5T9I730", "ch": "Rasa"}}, {"kind": "video", "req": true, "label": "Building conversational bots with Amazon Connect, Lex, Lambda and Bedrock", "url": "https://www.youtube.com/watch?v=vqyjCVCuR3Q", "m": 11, "why": "Channels, intent bot, fulfilment functions and an LLM fallback wired together.", "yt": {"id": "vqyjCVCuR3Q", "ch": "WebRTC.ventures"}}, {"kind": "video", "req": false, "label": "Advanced self-service with Amazon Connect AI agents", "url": "https://www.youtube.com/watch?v=68oKjsZcGyU", "m": 6, "why": "Self-service on a phone line with a path to a human.", "yt": {"id": "68oKjsZcGyU", "ch": "Amazon Connect Enablement"}}, {"kind": "read", "req": true, "label": "Rasa: conversational AI with language models (CALM)", "url": "https://rasa.com/docs/learn/concepts/calm/", "m": 10, "why": "Why business logic stays in flows and the model only interprets."}, {"kind": "read", "req": false, "label": "Anthropic: building effective agents", "url": "https://www.anthropic.com/engineering/building-effective-agents", "m": 15, "why": "Workflows versus agents: how much the model should decide."}], "mcq": [{"q": "In this design, who decides whether to move money after the customer asks for a transfer?", "o": ["The LLM, because it understood the request best", "Deterministic code, after identity, limits and an explicit yes", "The intent classifier, if its confidence is above the threshold", "The human agent, on every transfer", "Whichever component answered last"], "a": 1, "why": "The model may understand and extract; acting is a code decision behind identity, limits and a read-back confirmation."}, {"q": "Why are confidence thresholds treated as a release rather than a config value?", "o": ["Because they are stored in a database", "Because every route, confirmation and fallback reads them, so changing one changes behaviour everywhere and must be tested", "Because customers can see them", "Because only the vendor can change them", "Because they never change"], "a": 1, "why": "Thresholds are the interface between the parts; a change is a behaviour change and goes through the same evaluation gate as a model change."}, {"q": "Containment rises from 60% to 75% but complaints go up. What is the most likely reading?", "o": ["The assistant got better", "More conversations stay in the bot without being resolved, so the wall got higher", "The phone line is down", "Customers prefer chat", "The classifier is overfitting the test set"], "a": 1, "why": "Containment counts conversations that did not reach a person, not ones that were solved; it must be read beside resolution."}], "open": {"q": "Design a virtual assistant for a large retail bank on chat and phone. Where does the model decide, and where does code?", "probe": "What happens when the classifier is unsure and the customer is asking to move money?", "a": "A classifier and dialogue code run the flow; the LLM takes unsure turns, extracts values and writes grounded FAQ answers. Acting is code: identity verified, limits checked, an explicit yes after a read-back. An unsure turn on a money intent asks a clarifying question or hands off with context; it never guesses an action."}, "say": ["**I'd split it by what the model is allowed to decide: it understands, code acts.**", "**Four stages:** channels in, then understanding and dialogue state, then grounded answers and gated actions, then handoff and the improvement loop.", "**Confidence is the interface:** every route and fallback reads a calibrated score, and I treat a threshold change like a release.", "**Money behind a gate:** identity, limits and an explicit yes after a read-back, in code, whatever the model says.", "And I'd say the weekly review loop is the product, because containment without resolution is a wall."], "design": "virtual-assistant"}, {"id": "sd-faq-assistant", "title": "Design: a grounded FAQ assistant for a fund company", "brief": "Answers only from approved, versioned content, with citations, refusal, content governance and a way to measure groundedness.", "points": ["The promise: Every answer cites an approved document, version and section. If the content does not contain the answer, not finding it is the correct outcome, and it goes to a person.", "Refuse in code: Below a relevance score, or when passages disagree on a number, refuse before the model is called. After generation, a grounding check confirms every cited id was retrieved and every claim is supported.", "Content is the product: Immutable versions with approver, role, effective date and review-by date, grouped into releases. Compliance approves, a gate runs the eval set, one pointer moves, and old releases stay for rollback.", "Retrieval: Hybrid keyword and vector search plus a reranker, because fee codes and form numbers need exact matches. About 4,800 chunks is roughly 20 MB of vectors, so one database is enough.", "Measure two things apart: Recall at 5 for retrieval, and groundedness plus refusal correctness for answers. On 300 questions, 60 of them unanswerable, the 95% interval at 95% is about plus or minus 2.5 points, so small gaps are noise.", "Every answer is replayable: The log holds the question, passages, scores, release id and prompt version, so a wrong fee report leads to stale content, a retrieval miss or a stray answer."], "production": ["A refusal spike after a release is a rollback signal or a content gap. Refusals are counted by topic and sent to the content owners as work.", "A document past its review-by date leaves retrieval until compliance re-approves it, so stale guidance is never cited quietly."], "figs": [], "res": [{"kind": "keep", "src": "site", "label": "System design guide: A grounded FAQ assistant for a fund company", "url": "../SYSTEM%20DESIGN.html#/designs/faq-assistant/requirements"}, {"kind": "video", "req": false, "label": "Scaling enterprise-grade RAG: lessons from Legal Frontier", "url": "https://www.youtube.com/watch?v=W1MiZChnkfA", "m": 17, "why": "RAG in a regulated field where wrong answers cost a lot: citations, evaluation, scale.", "yt": {"id": "W1MiZChnkfA", "ch": "AI Engineer"}}, {"kind": "video", "req": true, "label": "RAG at 10 million documents: system design", "url": "https://www.youtube.com/watch?v=NQZqET-jjws", "m": 15, "why": "Ingestion, chunking, index and serving architecture as a system design answer.", "yt": {"id": "NQZqET-jjws", "ch": "Code with Lucian"}}, {"kind": "video", "req": true, "label": "Top 3 RAG retrieval strategies: sparse, dense, hybrid", "url": "https://www.youtube.com/watch?v=r0Dciuq0knU", "m": 9, "why": "Why fee codes need keyword match alongside vectors.", "yt": {"id": "r0Dciuq0knU", "ch": "IBM Technology"}}, {"kind": "read", "req": true, "label": "Anthropic: contextual retrieval", "url": "https://www.anthropic.com/news/contextual-retrieval", "m": 10, "why": "Hybrid BM25 plus embeddings plus rerank and the measured drop in failed retrievals."}, {"kind": "read", "req": true, "label": "Microsoft Learn: RAG solution design and evaluation guide", "url": "https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/rag/rag-solution-design-and-evaluation-guide", "m": 20, "why": "Chunking, search, evaluation of retrieval and generation as separate stages."}], "mcq": [{"q": "Customers ask about a fee that no approved document covers. Where should the assistant decide to refuse?", "o": ["Only in the prompt, by telling the model to say it does not know", "In code, before generation when the best retrieved score is below a line, and again after generation in a grounding check", "Only after the customer reports a wrong answer", "By lowering the model temperature to zero", "By answering from the model's general knowledge with a disclaimer"], "a": 1, "why": "The model is least reliable when passages are weak, so code decides before and after. A prompt alone is a third layer."}, {"q": "A fee schedule changes on Monday. What makes the change safe and provable?", "o": ["Edit the indexed text in place so it is live at once", "Re-train the model on the new schedule", "A new immutable version, compliance approval with an effective date, a passing release gate, then one pointer move; the old release is kept", "Delete the old document and add the new one", "Ask the model to prefer newer text"], "a": 2, "why": "Immutable versions and releases give approval, a test, a fast switch, rollback, and a record of which text each answer used."}, {"q": "Answers are wrong on 8% of the eval set. What is the first step?", "o": ["Rewrite the prompt", "Swap in a larger model", "Add more documents", "Split failures into retrieval misses (recall at 5) and answers that strayed from retrieved passages, then fix that stage", "Raise the refusal line until the error is gone"], "a": 3, "why": "The two causes need different fixes, and only measuring the stages apart tells you which one you have. Raising the line trades errors for wrong refusals."}], "open": {"q": "Design a customer FAQ assistant for a fund company that must answer only from approved content about fees, accounts and tax forms.", "probe": "A customer reports a wrong fee in an answer from last week. What do you do?", "a": "I would answer from approved, versioned content only, with a citation on every answer, and refuse when the content does not say. The question path is input rails, hybrid retrieval over the live release, a relevance line that refuses before generation, a generator that cites chunk ids, and a grounding check that can turn an answer into a refusal. The content path is draft, compliance approval with approver, effective date and review-by date, a release gate that runs a 300-question eval set (60 of them must be refused), then one pointer move, with the old release kept for rollback. For a wrong fee report, I take the answer id from the log, see its release, passages and prompt version, and decide: stale or wrong content (fix the source, new release), a retrieval miss (chunking or search), or a stray answer (grounding check, prompt). Then I add the case to the eval set."}, "say": ["**The assistant answers only from approved content, cites it, and refuses when it is not there.**", "**Refusal in code:** a relevance line before the model and a grounding check after, so the model is never trusted to say it does not know.", "**Content as releases:** immutable versions, compliance approval with dates, an eval gate, one pointer switch, rollback kept.", "**Measure the stages apart:** recall at 5 for retrieval, groundedness and refusal correctness for answers, on 300 cases with an honest interval.", "The model writes, the content decides, and the log can replay any answer."], "design": "faq-assistant"}, {"id": "sd-voice-ivr", "title": "Design: a contact-centre voice assistant with handoff", "brief": "A caller phones a financial services line: speech, authentication, self-service, then a warm transfer with context.", "points": ["Latency is a sum: end of turn 400ms, final text 100, classifier 10, a small read 250, first audio 200 and the network 100 make 1,060ms. An LLM call adds about 981ms, so uncertain turns get an acknowledgement or a clarifying question.", "Recognition is a guess: keep the n-best list and word confidences, confirm in proportion to the cost of a wrong value, and move from an example to the keypad to a person after repeated misses.", "Barge-in: ASR keeps running while the assistant speaks, real speech cancels TTS within about 100ms, and the next turn carries how much text was heard.", "Authentication by risk tier: caller ID and voice are signals, reads need a PIN on the keypad, money needs a one-time code pushed to the registered app. Only the identity service sets the level.", "Warm handoff: the agent sees the reason, the verified customer, a short summary and what was tried before the caller is bridged; out of hours, a callback with the same package.", "Sizing: 20,000 calls a day, 160 concurrent at peak (plan 320 streams), 10 handoffs a minute, about 60 agents busy. All assumed, so say so."], "production": ["Per-stage timings on every call, with p50 and p95 alerts on the stage that moved, so a slow-line report starts from data.", "Secret digits go by keypad tones and are redacted in logs; transcripts are access-restricted with a retention limit.", "Repeat-explanation rate and handle time on transferred calls are the measures of whether the handoff works."], "figs": [], "res": [{"kind": "clip", "req": true, "label": "Explainer: the voice agent cascade", "url": "../media/videos/voice-agent-cascade.mp4", "m": 3, "why": "Where the second goes: the naive build failing, then streaming, speaking early, co-location and the gate in front of a speech model."}, {"kind": "keep", "src": "site", "label": "System design guide: Contact-centre voice assistant with handoff", "url": "../SYSTEM%20DESIGN.html#/designs/voice-ivr/requirements"}, {"kind": "video", "req": true, "label": "How voice AI pipeline works: STT, LLM and TTS", "url": "https://www.youtube.com/watch?v=h9R0Hvdnn6I", "m": 14, "why": "The stages a call passes through and where latency sits.", "yt": {"id": "h9R0Hvdnn6I", "ch": "Codiste"}}, {"kind": "video", "req": true, "label": "Build an AI phone agent with LiveKit SIP: inbound, outbound, DTMF and transfers", "url": "https://www.youtube.com/watch?v=W7U6sRMtDdE", "m": 5, "why": "DTMF keypad input and call transfer, the authentication and handoff plumbing.", "yt": {"id": "W7U6sRMtDdE", "ch": "BitDepth"}}, {"kind": "video", "req": false, "label": "Escalating voice AI calls properly: AI agent to human handover", "url": "https://www.youtube.com/watch?v=vOlxHgaFFpU", "m": 18, "why": "What context to pass and when to escalate.", "yt": {"id": "vOlxHgaFFpU", "ch": "Voice AI with Tim"}}, {"kind": "read", "req": true, "label": "LiveKit: warm transfer", "url": "https://docs.livekit.io/sip/transfer-warm/", "m": 8, "why": "A consult call with a summary before the caller is bridged."}, {"kind": "read", "req": false, "label": "LiveKit: telephony overview", "url": "https://docs.livekit.io/telephony/", "m": 8, "why": "How a phone call enters a realtime voice agent: SIP trunk, dispatch and DTMF."}], "mcq": [{"q": "A turn's budget sums to 1,060ms without an LLM. The NLU is unsure on one turn and an LLM call would take about 981ms. What is the best design?", "o": ["Call the LLM and let the caller wait about 2s", "Say a short acknowledgement or ask a clarifying question, and use the LLM only if it still fits", "Skip understanding and transfer every uncertain turn", "Raise the classifier threshold so it is never unsure", "Remove the end-of-turn wait to recover the time"], "a": 1, "why": "1,060 + 981 = 2,041ms is over the 1.5s ceiling, so silence is the failure. An acknowledgement or a closed question keeps the line alive; the other options either break the budget or hide errors."}, {"q": "The caller asks to pay a bill. Caller ID matches a customer and the voice sounds right. What must still happen before the payment is called?", "o": ["Nothing, two signals are enough", "A one-time code pushed to the registered app and keyed in, then a read-back and an explicit yes, with the gateway checking the level", "Ask the caller to say their card number aloud", "Ask a knowledge question from a data broker file", "Let the LLM decide whether the caller seems genuine"], "a": 1, "why": "Caller ID can be spoofed and a voice can be replayed or cloned, so they lower friction but do not open money. Secret digits go by keypad, never as speech, and code, not a model, checks the level."}, {"q": "A caller is transferred to a person. Which handoff makes the caller repeat the least?", "o": ["A cold transfer to the general queue", "The full 40-turn transcript sent to the agent", "A warm transfer: reason, verified customer and level, a short summary, slots and what was tried, shown before the bridge", "Only the caller's phone number", "A callback the next day, always"], "a": 2, "why": "The agent needs a small, readable package at the moment of pickup. A transcript is too long to read while someone waits, and a cold transfer carries nothing."}], "open": {"q": "Design the voice assistant for a financial services phone line, with authentication and a handoff to a human agent.", "probe": "A caller says the assistant is slow, and another says someone who sounded like them moved money. How do you investigate each?", "a": "I would keep a per-stage timing on every call: end of turn, final transcript, classifier, backend read, first audio. The budget sums to about 1,060ms, and an LLM call adds about 981ms, so slowness is usually a stage that moved or an LLM path that started firing. For the second, voice and caller ID are only signals; money needs a one-time code pushed to the registered app, a read-back and a yes, with the gateway checking the level. I would pull that call's identity and fulfilment log, check which level was set and how, and add the case to the never-break suite."}, "say": ["**A phone call is a time budget and a trust ladder, and the handoff is where it shows.**", "**Latency:** 400 + 100 + 10 + 250 + 200 + 100 is 1,060ms, so an LLM call at about 981ms only runs behind an acknowledgement.", "**Recognition:** keep the n-best and confidences; confirm amounts and names with a closed question, then an example, then the keypad, then a person.", "**Authentication:** caller ID and voice are signals; reads need a keypad PIN, money needs a code pushed to the registered app, and only the identity service sets the level.", "The agent should know the reason, the caller and what was tried before the caller is bridged."], "design": "voice-ivr"}, {"id": "sd-convo-analytics", "title": "Conversation analytics and the improvement loop", "brief": "Log redacted, find failures without labels, cluster, label, retrain, and gate the release.", "points": ["Redact first: personal data is replaced by typed placeholders in memory before anything is stored. A redactor error drops the turn and raises an alert; it never stores it raw.", "Failures without labels: combine fallback, rephrase after an answer, handoff soon after a low score, thumbs down and low confidence into one score per conversation. One signal alone misleads.", "Cluster and rank: embed the failed utterances, cluster them, name each cluster, and rank by volume times cost. With 24,000 flagged a day and 600 labels a day, ranking is the design.", "Label carefully: a guide with edge-case rulings, two labellers on a subset to measure agreement, and a frozen gold set nobody trains on.", "Release gate: score a candidate per intent on the frozen set plus a never-break suite, then shadow and roll out in stages. With 1,500 test turns a 1.5 point change is noise; for a 30-turn intent it is about 11.", "Dashboards: containment next to resolution (no repeat contact within 72 hours), fallback and handoff by intent and version, and cost per conversation."], "production": ["Measure the redactor's recall on a labelled sample every release; a miss rate is a dashboard number, and cluster examples and label tasks show redacted text only.", "Alert on loop health as well as assistant health: logging loss, queue age, clusters waiting, and days from failure to release."], "figs": [], "res": [{"kind": "clip", "req": true, "label": "Explainer: the assistant improvement loop", "url": "../media/videos/assistant-improvement-loop.mp4", "m": 4, "why": "How a live assistant gets better each week: redact, find failures without labels, cluster, label where it counts, and gate every release per intent."}, {"kind": "keep", "src": "site", "label": "System design guide: Conversation analytics and the improvement loop", "url": "../SYSTEM%20DESIGN.html#/designs/convo-analytics/requirements"}, {"kind": "video", "req": true, "label": "Error analysis: the highest ROI technique", "url": "https://www.youtube.com/watch?v=e2i6JbU2R-s", "m": 13, "why": "Read traces, name failure modes, count them and fix the largest first.", "yt": {"id": "e2i6JbU2R-s", "ch": "Hamel Husain"}}, {"kind": "video", "req": true, "
