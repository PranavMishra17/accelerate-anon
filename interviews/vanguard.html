es-two-thirds-of-customer-service-chats-in-its-first-month/", "why": "The company's own stated numbers."}, {"label": "The Pragmatic Engineer: Klarna's AI chatbot, how revolutionary is it", "url": "https://blog.pragmaticengineer.com/klarnas-ai-chatbot/", "why": "Sceptical reading of what the Klarna metrics do and do not show."}, {"label": "PromptLayer: Klarna from AI-first to human hybrid", "url": "https://blog.promptlayer.com/klarna-customer-service-from-ai-first-to-human-hybrid-balance/", "why": "The later move back toward human agents."}, {"label": "CFPB: chatbots in consumer finance", "url": "https://www.consumerfinance.gov/data-research/research-reports/chatbots-in-consumer-finance/chatbots-in-consumer-finance/", "why": "Regulator view on doom loops, rights recognition and human access."}]}]}, {"id": "rs-classify", "title": "Classification and embeddings in production", "blurb": "Which classifier when, thresholds and out-of-scope, and embeddings as infrastructure.", "topics": [{"id": "e-approach-choice", "title": "Choosing the classifier: encoder, SetFit, embeddings, or an LLM", "brief": "There is no best intent classifier, only a best fit for your label volume, label stability and latency budget. Fine-tuned encoders win on stable, high-volume, latency-bound traffic. LLMs and few-shot methods win when labels are scarce or change weekly. Most production systems end up as a cascade, not a single model.", "practice": ["Fine-tuned encoder (BERT, DistilBERT, DeBERTa, or Rasa's DIET for joint intent and entities): cheapest per call, best with hundreds of examples per intent. One small comparison found BERT-base about 20x faster than a 2B-parameter LLM (277 vs 12 samples per second).", "Embeddings plus logistic regression or kNN: the cheapest strong baseline. Casanueva et al. showed dual sentence encoders (USE, ConveRT) beat full BERT-Large fine-tuning on BANKING77 at 10 or 30 examples per intent, trained in minutes on one CPU.", "SetFit (Hugging Face, Intel Labs, UKP): contrastive fine-tune of a sentence transformer on a few pairs, then a small classification head. About 8 examples per class, roughly 30 seconds of V100 training, and it works multilingually with a multilingual backbone.", "LLM zero or few-shot: no training data, handles label churn and gives a rationale, but it is slow and costly per call. Studies agree it wins in few-shot settings and tends to lose to fine-tuned BERT-style models when you have full data.", "Cascade: a cheap model scores every request and only uncertain ones escalate to an LLM. A 2025 ACL industry paper does this for out-of-scope detection on CLINC150 and BANKING77, so the LLM sees only the ambiguous slice.", "Start order I would use: embeddings plus logistic regression as a baseline, then SetFit or an encoder when you have data, and an LLM as the escalation tier and as a labeling aid."], "say": ["I don't pick the model first. I pick by how many labeled examples per intent we have, how often the intent list changes, and the latency budget, then I start with an embedding plus logistic regression baseline so everything else has to beat something real.", "In a bank I'd lean on a cascade: a small fast classifier handles the confident bulk, and only the uncertain slice goes to an LLM, which keeps cost and latency down and keeps the LLM away from most traffic."], "deep": "The honest framing is a three-way trade: data, change rate, and cost per request. With almost no data, an LLM prompt or SetFit gets you running in days. With thousands of labeled utterances and a stable taxonomy, a fine-tuned encoder is usually more accurate on the closed set, far cheaper, and deterministic, which matters for audit. The LLM has two durable jobs even when an encoder is in front: handling the long tail of ambiguous requests, and bootstrapping labels for new intents.\n\nThe cascade only works if the first stage is well calibrated, because its confidence decides who escalates. The uncertainty-driven routing paper lists this as its main limitation: miscalibration degrades the filter and thresholds still need tuning per deployment. So the cascade and the calibration topic below are one design, not two.\n\nIn regulated finance, determinism and explainability favour the small model for anything that triggers an action, and an LLM output used to route to an action should be constrained to the closed intent list and validated. The LLM can also be a rater, not a router: use it offline to label a backlog, then train the small model on the labels after human review.", "sources": [{"label": "Hugging Face: SetFit, efficient few-shot learning without prompts", "url": "https://huggingface.co/blog/setfit", "why": "The 8-examples-per-class claim, cost and multilingual results from the source."}, {"label": "Casanueva et al.: Efficient Intent Detection with Dual Sentence Encoders", "url": "https://arxiv.org/abs/2003.04807", "why": "The paper that introduced BANKING77 and the few-shot encoder result."}, {"label": "Alex Jacobs: Beating BERT? Small LLMs vs fine-tuned encoders", "url": "https://alex-jacobs.com/posts/beatingbert/", "why": "Concrete throughput numbers and a plain when-each-wins summary."}, {"label": "ACL Industry 2025: Efficient out-of-scope detection via uncertainty-driven LLM routing", "url": "https://arxiv.org/pdf/2507.01541", "why": "The cheap-model-then-LLM cascade on CLINC150 and BANKING77."}]}, {"id": "e-calibration-thresholds", "title": "Confidence, calibration and the reject threshold", "brief": "A softmax score is not a probability that the answer is right, and modern networks are overconfident. A fixed 0.5 cut-off is arbitrary. You set the threshold per intent risk from a held-out set, and you calibrate first so the number means something.", "practice": ["Guo et al. (2017) showed modern networks are poorly calibrated; temperature scaling, one scalar fit on held-out data, fixes much of it without changing the top-1 prediction or accuracy.", "Max softmax probability is the baseline for spotting misclassified and out-of-distribution inputs (Hendrycks and Gimpel), but some OOD inputs still score high, so it is a baseline, not a guarantee.", "Vendor defaults differ and are only starting points: Dialogflow CX uses 0.3 as its ML classification threshold, Rasa's FallbackClassifier defaults to 0.7, and Microsoft CLU lets you set a None score threshold per project.", "Per-intent thresholds by risk: Microsoft's CLU guidance gives an example of about 0.40 for a greeting but 0.95 for a specific action like placing a call. In banking the same logic puts a transfer well above an FAQ.", "Rasa adds an ambiguity check: if the top two intents are within a margin, fall back even when the top score clears the threshold. Margin often catches confusions that a single score misses.", "Tune on a held-out set that includes real out-of-scope traffic, plot precision against coverage, and pick the operating point for each action class. Re-tune after any retrain."], "say": ["I treat the raw softmax as a ranking signal, not a probability. I calibrate on held-out data, usually temperature scaling, and then pick thresholds per action risk, so a funds transfer needs a much higher bar than an FAQ.", "The threshold is a business decision shown as a precision and coverage curve. I'd show the team what each operating point costs in wrong actions versus clarifying questions and let risk sign off."], "deep": "Calibration and thresholding are two different jobs. Calibration makes the score honest, so 0.9 means about 90 percent of such predictions are right. Thresholding decides what to do at each score. Temperature scaling does not change which class is top, so it cannot hurt accuracy, but it can reorder which predictions fall under a threshold. Fit it on a split that was not used for training or threshold tuning, and check expected calibration error before and after.\n\nCalibration drifts. When traffic shifts, for example during a market event or a new product launch, a threshold tuned last quarter may let through more wrong answers. So I would monitor the confidence distribution and the fallback rate as live metrics, and treat a sudden change in either as a signal to investigate, not just a number.\n\nBelow-threshold does not have to mean give up. Rasa's two-stage fallback asks the user to confirm the likely intent, then asks them to rephrase, then hands off. Showing the top two candidates as quick replies turns uncertainty into a one-tap disambiguation, which is cheaper than a wrong action and less annoying than a flat fallback. For money movement, a confirmation step is needed anyway, so a medium-confidence intent can be routed to a confirm-first path.", "sources": [{"label": "Guo et al.: On calibration of modern neural networks (2017)", "url": "https://scispace.com/papers/on-calibration-of-modern-neural-networks-5cc9ha8ohx", "why": "Reference for temperature scaling, the one-parameter fix."}, {"label": "Hendrycks and Gimpel: A baseline for detecting misclassified and out-of-distribution examples", "url": "https://arxiv.org/pdf/1610.02136", "why": "The max-softmax baseline and its limits."}, {"label": "Microsoft Learn: CLU best practices", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/best-practices", "why": "Per-intent threshold example and None-intent guidance."}, {"label": "Rasa docs: Fallback and human handoff", "url": "https://legacy-docs-oss.rasa.com/docs/rasa/fallback-handoff/", "why": "FallbackClassifier threshold, ambiguity check and two-stage fallback."}, {"label": "Google Cloud: Dialogflow CX intents", "url": "https://cloud.google.com/dialogflow/cx/docs/concept/intent?hl=en", "why": "How the ML classification threshold and no-match event work."}]}, {"id": "e-out-of-scope", "title": "Out-of-scope detection and the in-scope trade-off", "brief": "The costly failure in a bank assistant is not a missed intent, it is a confident wrong one. CLINC150 was built to expose this, and its finding is that tightening out-of-scope detection costs in-scope accuracy. You manage that trade, you do not remove it.", "practice": ["CLINC150 (Larson et al., EMNLP 2019): 150 intents across 10 domains plus out-of-scope queries, about 22,500 in-scope. It showed that models near-perfect on closed-set accuracy still misfire on queries they were never taught about.", "The paper reports the trade-off directly: raising the out-of-scope bar catches more out-of-scope queries but misroutes some legitimate ones. Its BERT results were roughly 92.6 percent in-scope accuracy against 86.2 percent out-of-scope recall.", "Two ways to handle it: a confidence threshold on the in-scope classifier, or an explicit out-of-scope or None class trained on real negative examples. Microsoft CLU recommends adding near-miss false positives (like 'I want to buy a book' for a flight bot) to the None intent.", "Mine negatives from real logs: smalltalk, competitor questions, other-product questions, and adversarial probes. Synthetic negatives alone under-represent what customers actually type.", "Evaluate with a metric that separates the two errors: in-scope accuracy, out-of-scope recall, and false-accept rate at a fixed in-scope accuracy, not one blended F1.", "BANKING77 (77 fine-grained banking intents, 13,083 queries) is the other benchmark: single domain, so the hard part is confusable neighbours like card arrival versus delivery estimate, not topic."], "say": ["For a bank I'd care more about false accepts than missed intents, because a confident wrong action is the expensive failure. So I measure out-of-scope recall at a fixed in-scope accuracy and train the None class on real near-miss queries from logs.", "Closed-set accuracy on something like BANKING77 can look great and tell you nothing about what happens on an off-topic question, which is why CLINC150's out-of-scope split matters."], "deep": "Out-of-scope is not one thing. There is out-of-domain (weather question to a banking bot), out-of-scope but in-domain (a real banking question the assistant does not support yet, like a product you do not offer), and in-scope but ambiguous. They need different responses. The first can get a polite redirect. The second should route to a human or to a documented policy answer, and the logs of the second are your product backlog. The third needs a clarifying question.\n\nThreshold-only detection is the common baseline and works reasonably with a calibrated model. Explicit None-class training helps most with the near-miss cases, because those are the ones that score high on a wrong intent. In practice use both: a None class for known confusables and a threshold as a safety net for the unknown.\n\nFor regulated use, log every rejection and review a sample on a schedule. The rejected set is where a model is quietly failing, and it is also the evidence a model-risk reviewer will ask for when you claim the assistant stays inside its approved scope.", "sources": [{"label": "Larson et al.: An evaluation dataset for intent classification and out-of-scope prediction (EMNLP 2019)", "url": "https://aclanthology.org/D19-1131.pdf", "why": "The CLINC150 paper and the in-scope versus out-of-scope trade-off."}, {"label": "Hugging Face: PolyAI/banking77 dataset", "url": "https://huggingface.co/datasets/PolyAI/banking77", "why": "Dataset card for BANKING77."}, {"label": "Microsoft Learn: CLU None intent", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/none-intent", "why": "How the None intent and score threshold interact; add false positives to None."}, {"label": "ACL Industry 2025: Efficient out-of-scope detection via uncertainty-driven LLM routing", "url": "https://aclanthology.org/2025.acl-industry.25.pdf", "why": "A recent production-minded treatment on CLINC150 and BANKING77."}]}, {"id": "e-data-quality", "title": "Label noise, imbalance, long tail and labeling budget", "brief": "In practice the classifier is rarely the bottleneck, the labels are. Even the standard banking benchmark has a lot of suspect labels, and real intent distributions are long-tailed. Fixing the taxonomy and the labels usually beats a bigger model.", "practice": ["Label Errors in BANKING77 (ACL Insights, 2022) found over 1,400 of 10,003 training utterances (about 14 percent) potentially mislabeled, using confident learning and similarity methods. Removing them raised F1 by about 4.5 percent.", "Confusable intents are often a taxonomy problem, not a model problem. Microsoft's CLU guidance says to read the confusion matrix and merge intents that are mistaken for each other, or add distinguishing examples.", "Annotation guidelines need decision rules and boundary examples per intent pair, an explicit rule for multi-intent utterances, and a measured inter-annotator agreement before you scale labeling.", "Long tail: head intents dominate traffic and tail intents have a handful of examples. Options are class reweighting, logit adjustment or balanced softmax, oversampling with paraphrase, and few-shot methods like SetFit for the tail. Track per-intent recall, not only overall accuracy.", "Active learning from logs: sample production utterances where the model is uncertain or where top-two margin is small, label those first, and add them to training. Walmart's engineering team wrote about selecting NLU training data from conversation logs this way.", "Use an LLM to pre-label and a human to review the disagreements with the current model. That spends the labeling budget where it changes the decision boundary."], "say": ["Before touching the model I'd look at the confusion matrix and a sample of the errors. Usually two intents are really one, or the labels disagree, and fixing that helps more than a model upgrade.", "For the long tail I'd report per-intent recall, and spend the labeling budget on uncertain production utterances instead of random samples."], "deep": "Label noise sets a ceiling. If 1 in 7 training labels in a well-known benchmark is questionable, then headline accuracy differences of a point or two between models are partly noise. In a company dataset labeled by a vendor team over time, expect worse. Cheap checks: train with cross-validation and list examples where the out-of-fold prediction confidently disagrees with the label, which is what confident-learning tools do, then review those by hand.\n\nImbalance has two sides. Overall accuracy rewards head intents, but a compliance-relevant intent like a complaint or a fraud report might be rare and important. Weight evaluation by risk, not frequency, and keep a hand-built golden set that covers every intent at least a minimum number of times. Microsoft's tooling flags intents with fewer than 15 labeled instances as under-trained, a useful floor to quote.\n\nActive learning works best as a loop, not a project: score new traffic weekly, pull the uncertain and the new-cluster items, label, retrain, and compare against the frozen golden set so you can see real improvement. Keep the golden set separate from anything used for sampling or threshold tuning, or the numbers will flatter you.", "sources": [{"label": "ACL Insights 2022: Label errors in BANKING77", "url": "https://aclanthology.org/2022.insights-1.19/", "why": "The 14 percent suspect-label figure and the F1 effect of cleaning."}, {"label": "Microsoft Learn: CLU model concepts and evaluation metrics", "url": "https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/concepts/evaluation-metrics", "why": "Confusion matrix guidance, merge confusable intents, minimum examples per intent."}, {"label": "Walmart Global Tech: Active learning, select training data for conversational AI NLU from logs", "url": "https://medium.com/walmartglobaltech/active-learning-select-training-data-for-conversational-ai-systems-nlu-from-logs-308c3d2e0f7a", "why": "An industry write-up of log-driven selection; the page returned an access error for me, so read it yourself before citing details."}, {"label": "Survey of deep long-tail classification advancements", "url": "https://arxiv.org/html/2404.15593v1", "why": "Reweighting, balanced softmax and logit adjustment in one place."}]}, {"id": "e-hierarchy-multilabel-multilingual", "title": "Hierarchical, multi-label and multilingual intents", "brief": "Real utterances often carry two intents, and a flat list of a few hundred intents gets unmanageable. A hierarchy keeps decisions small and auditable, multi-label handles compound requests, and multilingual needs per-language thresholds, not one shared one.", "practice": ["Hierarchy: classify a coarse domain first (cards, payments, accounts, investing), then a fine intent within it. Research on label-hierarchy-aware intent models reports gains from a coarse auxiliary task over flat classification.", "Hierarchy helps operations too: owners per domain, fallback at the coarse level when the fine level is unsure ('this looks like a card question'), and a smaller review surface for compliance.", "Multi-label: a message like 'freeze my card and tell me my balance' needs sigmoid outputs or a split step, and order matters for the dialogue plan. Plain single-label softmax silently drops one of them.", "Multi-intent is often handled by splitting the utterance into clauses first, then classifying each, which reuses a single-label model and keeps thresholds meaningful.", "Multilingual: a multilingual sentence-transformer backbone gives cross-lingual transfer (SetFit reports results in German, Japanese, Mandarin, French and Spanish), and CLU has a multilingual project flag. Still hold a per-language golden set, because thresholds calibrate differently per language.", "Dialogflow CX sets the ML classification threshold per language per flow, which reflects that one number rarely fits all."], "say": ["I'd keep the taxonomy hierarchical so a wrong fine intent can still fall back to the right domain, and so each domain has an owner and its own review.", "For multilingual I'd test per language, because a threshold tuned on English can let through far more wrong answers in another language."], "deep": "The flat-versus-hierarchical decision is mostly about operations, not accuracy. A hierarchy lets you route an uncertain fine-grained prediction to a safe coarse behavior, like opening the right menu or the right specialist queue, instead of failing outright. The cost is error propagation: a wrong coarse decision cannot be recovered at the fine level, so give the coarse classifier a conservative threshold and a general-purpose branch.\n\nMulti-label raises evaluation questions too. Exact-match accuracy is harsh; per-label precision and recall are more useful, and you need a rule for whether a compound request is worth supporting or should trigger a clarification like 'Let's do one at a time, which first?'. In a bank that is often the safer design, since each action needs its own confirmation anyway.\n\nFor multilingual, pooled training data usually helps low-resource languages, but a shared embedding space does not guarantee equal quality. Build a small evaluation set in each language, ideally written by native speakers and not machine-translated, because translated test sets are easier than real customer text.", "sources": [{"label": "IEEE: Exploring label hierarchy in dialogue intent classification", "url": "https://ieeexplore.ieee.org/document/10448380/", "why": "Evidence for a coarse auxiliary task helping fine intents."}, {"label": "ACM SIGIR: Label hierarchical structure-aware multi-label few-shot intent detection", "url": "https://dl.acm.org/doi/pdf/10.1145/3626772.3657947", "why": "Multi-label plus few-shot plus hierarchy in one paper."}, {"label": "Hugging Face: SetFit blog (multilingual section)", "url": "https://huggingface.co/blog/setfit", "why": "Cross-lingual few-shot results with multilingual backbones."}, {"label": "Google Cloud: Dialogflow CX intents", "url": "https://cloud.google.com/dialogflow/cx/docs/concept/intent?hl=en", "why": "Per-language classification threshold per flow."}]}, {"id": "e-embedding-model-choice", "title": "Choosing and adapting an embedding model", "brief": "MTEB rank is a weak guide for a finance workload. FinMTEB found general-benchmark rank had a statistically insignificant relationship to finance performance. You pick by testing on your own labeled queries, then weigh dimension, storage and hosting.", "practice": ["Build a small evaluation set from your own traffic (queries with known correct intents or documents) and compare 3 to 4 candidates on it. That beats any leaderboard.", "MTEB caveats: models can be trained near its datasets, binary relevance hides ranking quality, and some tasks are saturated. FinMTEB (64 finance datasets, English and Chinese) found general-benchmark rank is a poor predictor of finance results; finance-adapted models like Fin-E5 and voyage-3-large tied near the top.", "Dimension and cost: OpenAI text-embedding-3 and Voyage models are Matryoshka-trained, so you can truncate vectors. OpenAI reports a 256-dimension text-embedding-3-large still beats ada-002 at 1536 dimensions on MTEB. Voyage reports int8 at 1024 dimensions within 0.31 percent of float at 2048 with 8x less storage.", "Task-specific input types: Cohere Embed v3 requires an input_type (search_document, search_query, classification, clustering) and warns that classification and clustering change vector geometry, so do not mix them with retrieval vectors.", "Domain adaptation: fine-tune with contrastive pairs (query and positive passage, with in-batch negatives and mined hard negatives) using Sentence Transformers' MultipleNegativesRankingLoss, optionally with Matryoshka loss. Synthetic query generation from your own documents is the cheap way to get pairs.", "Domain-tuned commercial options exist: Voyage publishes voyage-finance-2 among others. Fine-tuning gains of 10 to 30 percent on specialized content are claimed in vendor and practitioner write-ups; treat these as hypotheses to test."], "say": ["I wouldn't pick an embedding model off the MTEB leaderboard. I'd build a small eval set from real queries and test a few candidates, because finance text has boilerplate and jargon that general benchmarks barely test.", "If retrieval is weak I'd first try a domain model or a light fine-tune on contrastive pairs from our own documents, and I'd check Matryoshka truncation or int8 to cut index cost before paying for more hardware."], "deep": "The decision has four axes: quality on your data, vector size, latency and cost, and where the data is allowed to go. Quality should be measured on recall at k for retrieval and on macro-F1 for classification using vectors, with a held-out set. Vector size drives index memory linearly, so a 3072-dimension float vector is 12 KB each; at tens of millions of vectors that is a real bill, which is why truncation and quantization matter. Always re-evaluate after truncating, since the loss is small on average but can be larger on your hard queries.\n\nFine-tuning embeddings is worth it when the domain vocabulary or the notion of similarity differs from general web text, for example when 'rollover' means one thing for a 401(k) and another for a CD. It carries a cost: you now own a model, an evaluation set, and a re-embedding job each time you retrain. Try cheaper levers first: query rewriting, a reranker, hybrid lexical plus dense search, and metadata filters.\n\nIn a regulated firm, hosted embedding APIs mean sending customer text to a third party. FINRA Regulatory Notice 24-09 says its rules apply whether you build or use a third party's model, and SR 11-7 style model risk expects vendor models to be inventoried and validated. So self-hosting an open model in your own cloud, or a private deployment from a major cloud provider with contractual no-retention terms, is often the path; also redact or tokenize account numbers and personal data before embedding.", "sources": [{"label": "FinMTEB: Finance Massive Text Embedding Benchmark", "url": "https://arxiv.org/html/2502.10990v2", "why": "Direct evidence that general MTEB rank does not predict finance performance."}, {"label": "MTEB: Massive Text Embedding Benchmark (EACL 2023)", "url": "https://arxiv.org/abs/2210.07316", "why": "The benchmark's scope and the finding that no model wins all tasks."}, {"label": "Voyage AI: voyage-3-large", "url": "https://blog.voyageai.com/2025/01/07/voyage-3-large/", "why": "Matryoshka plus int8 and binary storage numbers."}, {"label": "Weaviate: OpenAI's Matryoshka embeddings", "url": "https://weaviate.io/blog/openais-matryoshka-embeddings-in-weaviate", "why": "How dimension truncation works for text-embedding-3."}, {"label": "Cohere docs: Introduction to embeddings", "url": "https://docs.cohere.com/docs/embeddings", "why": "input_type values and compressed embedding types."}, {"label": "Hugging Face: Training and finetuning embedding models with Sentence Transformers", "url": "https://huggingface.co/blog/train-sentence-transformers", "why": "Contrastive pairs, in-batch and hard negatives, Matryoshka loss."}, {"label": "FINRA: Regulatory Notice 24-09", "url": "https://www.finra.org/rules-guidance/notices/24-09", "why": "Rules apply to third-party gen AI tools; supervision and model risk expectations."}]}, {"id": "e-semantic-routing", "title": "Semantic routing and cheap first-pass classification", "brief": "Semantic routing compares the embedding of a request to embedded example utterances per route and picks the closest. It is fast, cheap and deterministic, and it is a good guardrail layer in front of an LLM. It is also a classifier, so it needs the same thresholds and out-of-scope handling.", "practice": ["semantic-router (Aurelio Labs): you define routes with example utterances, embed them, and match a new query by cosine similarity to the nearest utterances, skipping an LLM call for the routing decision.", "Typical uses: route to a flow (balance, dispute, transfer), block off-topic or risky topics before the LLM sees them, and select a tool or a specialist agent.", "Each route needs a similarity threshold, and below it the query falls to a default route or a clarifier. Tune thresholds per route on held-out real queries, as with any classifier.", "Keep the utterance sets curated and versioned: adding a loose example to one route can steal traffic from a neighbour. Test against a frozen regression set on every change.", "Use it as stage one of a cascade: confident matches go straight to the deterministic flow, borderline queries go to an LLM or a clarifying question.", "Latency is the selling point: one embedding call plus a nearest-neighbour lookup, often tens of milliseconds, versus a full LLM generation."], "say": ["I like semantic routing as a first gate in front of the LLM: it's fast and predictable, and it makes decisions I can audit. But it's still a classifier, so I'd tune per-route thresholds and keep a regression set for the utterance lists.", "For anything sensitive, like a transfer, the route only selects the flow. The flow itself is deterministic and asks for confirmation."], "deep": "Routing by embedding similarity is nearest-neighbour classification with hand-written exemplars. That makes it easy to explain to a compliance reviewer: here are the example phrases per route, here is the threshold. It also makes failures easy to fix, because you can add or remove an utterance without retraining. The weaknesses are the usual ones: negation ('do not freeze my card'), entity-dependent meaning, and short ambiguous inputs like 'yes' or 'the second one', which depend on dialogue context and should not go through the router in isolation.\n\nPut context handling in front of it: if the assistant just asked a question, interpret the reply in that frame before routing. Otherwise the router will send a bare 'yes' somewhere random.\n\nEmbedding-based routing and fine-tuned classifiers are interchangeable at this layer. If you have enough labeled data, a trained classifier on top of the same embeddings usually beats raw nearest-utterance matching, and you can keep the router for new intents that do not have data yet.", "sources": [{"label": "GitHub: aurelio-labs/semantic-router", "url": "https://github.com/aurelio-labs/semantic-router", "why": "The library and its route and utterance model."}, {"label": "The New Stack: Semantic Router and its role in designing agentic workflows", "url": "https://thenewstack.io/semantic-router-and-its-role-in-designing-agentic-workflows/", "why": "Where it sits in an agent design."}]}, {"id": "e-intent-discovery", "title": "Intent discovery, clustering and deduplication from logs", "brief": "You find new intents by clustering real conversations, not by brainstorming in a meeting. Embeddings plus UMAP plus HDBSCAN find the groups, an LLM names them, and a human decides which become intents. HDBSCAN is chosen because it does not need a cluster count and it marks noise.", "practice": ["BERTopic pipeline: sentence embeddings, UMAP dimension reduction, HDBSCAN clustering, then keyword or LLM labels for each topic.", "Intercom's Fin team describes their version: extract the key question from each conversation with a small LLM, embed with all-MiniLM-L6-v2, UMAP, HDBSCAN into subtopics, recursive clustering into parent topics, then an LLM to name and tidy.", "Intercom assigns new conversations to the nearest cluster centroid and flags anything with similarity below 0.5 as a possible emerging topic. About 10 to 15 percent of conversations land as noise, and centroid assignment cut outliers by about half.", "They report clustering algorithm and hyperparameters mattered more than the choice of embedding model, and that cleaning boilerplate, merging fragmented turns and removing spam came first.", "Deduplication: near-duplicate utterances inflate head intents and leak between train and test splits. Dedupe by embedding similarity above a tight threshold before splitting, or your accuracy is overstated.", "Keep a human in the loop for approving a cluster as an intent; check each cluster for whether one flow can serve all its members, which is the real test of whether it is one intent."], "say": ["To find new intents I'd cluster real logs with embeddings and HDBSCAN, have an LLM propose names, and then have a person decide which clusters deserve to be intents, based on whether one flow would serve them all.", "I'd dedupe near-identical utterances before making train and test splits, otherwise the test set leaks and the accuracy looks better than it is."], "deep": "Clustering finds similar wording, not similar needs. Two clusters can need the same action, and one cluster can hide two actions. So the review question is operational: can one answer or flow handle every example, and what would the assistant do differently for each cluster? The size and growth of each cluster, and its fallback rate, tell you what to build next.\n\nThe noise group deserves attention. HDBSCAN deliberately declines to force outliers into clusters, and the outlier set is where genuinely new or unusual requests live, plus junk. A weekly pass that re-clusters the noise, or compares it to existing centroids, is a cheap emerging-topic detector.\n\nIn finance, be careful about what goes into the pipeline. Logs contain account numbers and personal data, so redact before embedding or labeling with a hosted LLM, keep retention rules, and note that analyzing logs can itself fall under data-use agreements. Research on unsupervised intent induction for customer support dialogue is a useful reference for the broader approach, though I could not read the full paper text here.", "sources": [{"label": "Intercom Fin: Unsupervised learning meets generative AI, topic modelling for real-world dialogue", "url": "https://fin.ai/research/unsupervised-learning-meets-generative-ai-topic-modelling-for-real-world-dialogue/", "why": "A named company's pipeline with thresholds and outlier numbers."}, {"label": "arXiv: Towards a fully unsupervised framework for intent induction in customer support dialogues", "url": "https://arxiv.org/pdf/2307.15410", "why": "Academic framing of intent induction from support logs (not fully read)."}, {"label": "arXiv: Improving customer service with automatic topic detection in user emails", "url": "https://arxiv.org/pdf/2502.19115", "why": "A BERTopic case in customer service."}]}, {"id": "e-embedding-ops", "title": "Embedding drift, re-embedding cost and index choices", "brief": "Embeddings are a dependency with a version. Changing the model changes the vector space, so the whole index must be rebuilt, and live traffic drifts away from your reference set over time. Plan the migration and the monitoring before you need them.", "practice": ["Vectors from different models are not comparable even when dimensions match, so you cannot mix them in one index. Safe migration: add the new vector as a second column or index, backfill while the old one serves, compare recall on a golden set, then cut over atomically.", "Cost is a line item: one source estimates re-embedding a large corpus at roughly 166 dollars with OpenAI text-embedding-3-small and about 1,079 dollars with 3-large for its example corpus, and larger corpora need hours of GPU time if self-hosted.", "Research like Drift-Adapter proposes a small learned mapping from old to new space for near zero-downtime upgrades; treat it as a research idea, not a default.", "Drift monitoring: compare reference and current embedding batches. Evidently tested five methods (Euclidean and cosine on centroids, a domain classifier, share of drifted components, MMD) and recommends the classifier-based ROC AUC score as a stable default.", "Practical signals: rolling centroid distance against a 30-day baseline, share of queries below the cluster-similarity floor, fallback rate, and the fraction of queries landing in the noise cluster.", "Index choices briefly: pgvector is fine to a few million vectors and keeps data in your database; dedicated engines (Pinecone, Qdrant, Weaviate, OpenSearch) add scale and filtering; HNSW is the usual in-memory graph index and IVF with quantization trades recall for memory."], "say": ["I treat the embedding model like a pinned dependency. If we change it, we re-embed into a parallel index, check recall on a frozen golden set, and only then cut over.", "For drift I'd watch the embedding distribution of live queries against a reference window and the fallback rate, and a jump in either triggers review of the taxonomy and the thresholds."], "deep": "Two kinds of drift get confused. Input drift is the world changing: new products, a market event, a new fee policy, so queries cluster differently. Model drift is you changing the model: an API provider deprecating a version, or your own retrain. The first shows up in the monitors above. The second is prevented by pinning versions and using deprecation notices as a calendar item. A hosted embedding model that is silently updated would invalidate the stored vectors and every threshold tuned against them, so prefer providers with versioned model names and a deprecation policy.\n\nA classifier-based drift test, training a model to tell last month's embeddings from this month's, gives an AUC that is easy to explain and alert on: near 0.5 means no meaningful shift. Centroid distance is cheaper but can hide shape changes. Whatever you choose, tie the alert to an action, like sampling and labeling the drifted slice.\n\nOn indexes, the quality knob that matters more than the engine is the evaluation set. Measure recall at k against exact search on your data, then pick the cheapest index and quantization that holds it, and pair with metadata filters for things like product line or entitlement so a user only retrieves content they are allowed to see.", "sources": [{"label": "Evidently AI: 5 methods to detect drift in ML embeddings", "url": "https://www.evidentlyai.com/blog/embedding-drift-detection", "why": "Experimental comparison; classifier-based method recommended as default."}, {"label": "Drift-Adapter: near zero-downtime embedding model upgrades", "url": "https://arxiv.org/pdf/2509.23471", "why": "Research on mapping old vectors to a new space."}, {"label": "Formation: Re-embedding migration, upgrade RAG indexes safely", "url": "https://formation.dev/blog/embedding-model-upgrade-migration", "why": "Practical parallel-column and cutover pattern."}, {"label": "Voyage AI: voyage-3-large", "url": "https://blog.voyageai.com/2025/01/07/voyage-3-large/", "why": "Quantization and storage numbers that affect index cost."}]}, {"id": "e-finance-specifics", "title": "Financial-domain specifics: FinBERT, BANKING77 and regulated data", "brief": "Finance text is full of boilerplate and jargon, so domain models help, but FinBERT is a sentiment model, not an intent classifier. The bigger constraint is governance: customer text, third-party hosted models and model-risk rules shape what you can use more than accuracy does.", "practice": ["FinBERT (Araci, Prosus) is BERT further trained on financial text and fine-tuned on Financial PhraseBank for three-way sentiment. Useful as a domain-adapted backbone idea, but not a drop-in intent model.", "FinMTEB reports FinBERT beating BERT by about 15.6 percent on finance embedding tasks, and finance-adapted embeddings like Fin-E5 doing better than their general bases, so domain adaptation pays off here.", "BANKING77 is useful for practice because intents like card payment fee charged versus transfer fee charged are close neighbours, which mirrors real banking confusions. It is a public customer-service-style dataset, not your traffic, so do not assume its accuracy transfers.", "A 2023 study on banking text classification with limited resources compared LLM prompting, retrieval-augmented prompting and fine-tuned models on banking data; I could not read the full text, so check its numbers before quoting.", "FINRA Regulatory Notice 24-09 says existing rules apply to gen AI, including when a firm uses a third party's tool, and points to model risk management, data privacy and accuracy. SR 11-7 style guidance treats vendor foundation models as third-party components to be validated.", "Data handling: redact or tokenize account numbers, SSNs and names before sending text to any hosted model; prefer private deployments with contractual no-training and no-retention; keep an inventory of every model and version used for classification."], "say": ["In finance I think the governance questions come first: where does customer text go, which vendor model version is it, and who validated it. Then I pick the simplest model that meets accuracy, and a small self-hosted classifier often fits that better than an external API.", "I'd use a benchmark like BANKING77 to practise on confusable banking intents, but I'd never trust its numbers for our own traffic."], "deep": "Domain models are one lever, but in a bank the usual wins come from process: a cleaned and agreed intent taxonomy, a golden test set covering every intent and every risk class, and per-intent thresholds that risk has approved. Those artifacts are also what a model-risk reviewer wants: documented purpose, data lineage, validation results, ongoing monitoring and a change-control record.\n\nHosted LLMs and embedding APIs are not forbidden, but they are third-party components. Under FINRA 24-09 and SR 11-7 style expectations the firm stays responsible for outputs and has to evaluate the tool before use. That is a good reason to keep the first-pass classifier small and in-house, use hosted LLMs behind redaction for the ambiguous slice, and log inputs, model versions and decisions so you can reconstruct why a request was routed the way it was.\n\nAs a caveat on my research: I could not confirm vendor-specific data residency terms here, and those change often. For an interview, say that you would check each vendor's current data-use and retention terms with the firm's security and legal teams, instead of quoting terms from memory.", "sources": [{"label": "FinMTEB: Finance Massive Text Embedding Benchmark", "url": "https://arxiv.org/html/2502.10990v2", "why": "FinBERT versus BERT and finance-adapted embedding gains."}, {"label": "Hugging Face: ProsusAI/finbert", "url": "https://huggingface.co/ProsusAI/finbert", "why": "What FinBERT actually is and was trained for."}, {"label": "FINRA: Regulatory Notice 24-09", "url": "https://www.finra.org/rules-guidance/notices/24-09", "why": "Rules apply to third-party gen AI; supervision and model risk."}, {"label": "FINRA: 2025 oversight report, third-party risk", "url": "https://www.finra.org/rules-guidance/guidance/reports/2025-finra-annual-regulatory-oversight-report/third-party-risk", "why": "Third-party vendor risk expectations."}, {"label": "arXiv: Making LLMs worth every penny, resource-limited text classification in banking", "url": "https://arxiv.org/pdf/2311.06102", "why": "Banking classification with LLMs under a budget; verify numbers before quoting."}, {"label": "Hugging Face: PolyAI/banking77", "url": "https://huggingface.co/datasets/PolyAI/banking77", "why": "The banking intent dataset."}]}]}, {"id": "rs-around", "title": "Around it: voice, handoff, auth, agents, risk, Vanguard", "blurb": "The ground next to the core topics that a senior answer touches.", "topics": [{"id": "f-voice-pipeline", "title": "Voice assistants: where the errors and the milliseconds go", "brief": "A voice assistant is a chain, and the errors multiply: a 95% accurate ASR feeding a 98% accurate NLU gives about 93% end to end. Word error rate is the wrong number to chase on its own. What matters is the error on the words that carry meaning (digits, names, tickers, dollar amounts), and how the dialogue recovers when those are wrong.", "practice": ["Treat ASR and NLU as one system: train or evaluate intent models on ASR output (real transcripts with errors), not only clean typed text. Passing the n-best list or confidence instead of only the 1-best transcript gives the NLU a way to hedge.", "Bias the recogniser toward the domain: custom vocabulary or phrase hints for fund names, tickers and product names, and grammar-style constraints for digit strings. Measure entity-level accuracy per slot, not just WER.", "Endpointing decides when the user has finished. Too eager cuts people off, too slow feels dead. Published tuning guidance puts about 250 ms of silence for purposeful IVR-style callers and about 400 ms where people think aloud, and the better systems add a linguistic signal (is the sentence complete) on top of silence.", "Barge-in has two layers: the media layer stops outbound audio on detected speech, and the logic layer cancels the pending LLM call, synthesis and tool calls. The metric is time from the interrupting syllable to agent silence. Echo cancellation matters or the bot interrupts itself.", "Latency budget for a cascaded pipeline, one published example: about 80 ms endpointing, 120 ms ASR, 180 ms LLM, 70 ms TTS for sub-500 ms perceived. Human turn gaps are around 200 ms. For slow tool calls, emit a short real acknowledgement tied to actual system state, never a fake filler.", "Read back and confirm what is costly to get wrong: digit strings in chunks, spelled names with the NATO alphabet as a fallback, amounts and dates. Offer DTMF (keypad entry) as the deterministic fallback for account numbers and PINs after one or two failed attempts."], "say": ["I think about a voice bot as a chain where each stage's errors multiply, so I would measure slot-level accuracy on the words that matter, like numbers and names, instead of staring at overall word error rate.", "The way I'd do it is confirm only what is expensive to get wrong, and give the caller a keypad fallback after a couple of misses rather than looping on recognition."], "deep": "The classic IVR to conversational IVR migration is less about the model and more about the design contract. Directed-dialogue IVRs ask one question, constrain the grammar, and are very accurate on narrow input. Conversational IVRs open the first prompt ('how can I help?') and route on natural language, which raises containment on the long tail but exposes you to ASR errors on open vocabulary. The usual production pattern is hybrid: open prompt for intent, then tightly constrained collection for the identifiers, with DTMF always available. Teams measure intent accuracy on real call audio, and compare against the old menu's misroute rate before turning anything over.\n\nWith LLMs the pieces change shape but the failure modes remain. A speech-to-text front end can still mangle a ticker or an account number, and an LLM will happily make a fluent guess out of a wrong transcript. So the confirmation step and the deterministic collection of identifiers stay outside the model. Some teams use native speech-to-speech models for natural prosody and turn-taking, but in regulated settings many keep the cascaded design because you can log and audit the transcript at each stage and gate what the TTS says.\n\nWhat I would stress in a finance interview: audio is a regulated record (calls are often recorded, and redaction of card or account numbers in transcripts is a requirement), noisy mobile calls and older callers are the segments where WER is worst, and an accent or dialect gap is a fairness issue you can measure by slicing error rate by cohort. A good answer names the metric (entity accuracy, barge-in latency, time to first audio, containment, escalation rate) and the fallback (DTMF, human).", "sources": [{"label": "Picovoice: Voice agent latency, turn-taking and barge-in", "url": "https://picovoice.ai/guide/voice-agents/voice-ux-latency-turn-taking/", "why": "The two-layer barge-in model, three-signal endpointing and the 200 ms human gap."}, {"label": "Hamming: Intent recognition for voice agents, testing at scale", "url": "https://hamming.ai/resources/intent-recognition-voice-agents-at-scale", "why": "Appeared in search; source of the compounding ASR and NLU accuracy example (not fetched in full)."}, {"label": "Amazon Science: Towards NLU model robustness to ASR errors at scale", "url": "https://assets.amazon.science/b8/47/6fda91d7433eabba9c060f03016b/towards-nlu-model-robustness-to-asr-errors-at-scale.pdf", "why": "Appeared in search; how a production NLU is made robust to recogniser errors."}, {"label": "arXiv: Spoken language intent detection using Confusion2Vec", "url": "https://arxiv.org/pdf/1904.03576", "why": "Appeared in search; embeddings that account for phonetic confusion improve intent robustness."}]}, {"id": "f-handoff-agent-assist", "title": "Human handoff and agent assist: containment is not the goal", "brief": "The mistake is optimising containment (the share of conversations the bot finishes) as if every escalation were a failure. A good handoff is a feature: the right case reaches a person fast, with the transcript, the identified customer and the intent already attached, so the customer never repeats themselves. Regulators have specifically named the bot that cannot hand off.", "practice": ["Define escalation triggers explicitly: the customer asks for a person (always honour it), two or three consecutive fallbacks or repeated rephrases, low confidence on a high-stakes intent, negative sentiment or rising frustration, a complaint or dispute, vulnerable-customer cues, and any intent the policy marks human-only.", "Warm transfer carries context: authenticated identity, intents seen, slots collected, a short summary and the last few turns. Dialogflow CX exposes a LiveAgentHandoff signal with custom metadata, and platforms such as Twilio Flex and NICE pass the transcript to the desktop.", "Agent assist is the same stack pointed at the human: knowledge suggestions, suggested replies, live summarisation, sentiment, and after-call summaries (Google's Agent Assist lists these). Many firms start here, because a human stays between the model and the customer.", "Close the loop: the human agent's corrections, dispositions and the escalated transcripts are the best labelled data you have. Mine escalations for missing intents and broken flows, and feed approved answers back into the knowledge base.", "Measure handoff quality, not only rate: repeat-contact rate within 7 days, transfer-to-resolution time, how often the agent re-asks identification, and customer satisfaction split by bot-only versus handed-off."], "say": ["I wouldn't treat every escalation as a failure. I'd track whether the handoff arrives with context, because the real damage is the customer having to repeat everything to the agent.", "The escalations are the most useful data we have, so I'd read a sample every week and turn the patterns into new intents, fixes, or knowledge articles."], "deep": "Frustration detection is easy to oversell. Sentiment models trained on general text are noisy on short utterances ('no' and 'agent' and 'representative' repeated), and in voice, anger is better caught by the behaviour (repeated reprompts, barge-in on every prompt, silence, repeated 0 key presses) than by a score. The robust production rule is a combination: a hard rule for explicit requests and repeated failure, plus a softer model signal that raises priority rather than deciding alone.\n\nWhen to escalate is also a risk decision. In finance some intents should never be fully automated: complaints, disputes, hardship, bereavement, suspected fraud, and anything that sounds like personalised advice. Those are routed on detection of the topic, not after the bot has tried. The business design question is what the bot is allowed to attempt before it gives up, and the answer should come from compliance as well as from containment targets.\n\nThe CFPB has described bots that trap customers in loops with no route to a person and has said it expects firms to ensure a path to human service. That makes the escalation path a compliance control, not a nice-to-have. Agent assist adds its own risks: the human may over-trust a suggested reply, so approved-content links and visible sources matter, and an AI-written case summary becomes a record that may need retention.", "sources": [{"label": "Google Cloud: Agent Assist basics", "url": "https://docs.cloud.google.com/gemini-enterprise-cx/agent-assist/basics", "why": "Lists knowledge assist, smart reply, summarisation, sentiment and supervisor assist."}, {"label": "Google Cloud: Dialogflow CX handoff", "url": "https://docs.cloud.google.com/agent-assist/docs/handoff-cx", "why": "How a virtual agent hands a conversation to a human, with a handoff signal and metadata."}, {"label": "Mphasis: Optimizing conversational and generative AI for customer experience", "url": "https://www.mphasis.com/home/thought-leadership/blog/optimizing-conversational-and-generative-ai-for-seamless-customer-experience.html", "why": "How the integrator frames human-in-the-loop in financial services contact centres."}, {"label": "Twilio: Dialogflow CX integration in Flex", "url": "https://www.twilio.com/docs/flex/admin-guide/integrations/google-dialogflow-cx-native-integration", "why": "Appeared in search; shows transcript and context passed to the human desktop."}]}, {"id": "f-auth-personalisation", "title": "Authentication and personalisation: what the assistant may say before and after login", "brief": "Identification (who do you claim to be) is not verification (prove it), and an assistant needs a policy for each intent on what is allowed unauthenticated, after light authentication, and only after step-up. Personalisation without authentication is a data leak waiting to happen, and voice biometrics alone is no longer treated as safe because cloned voices exist.", "practice": ["Tier the intents by data sensitivity. Unauthenticated: public FAQs, fund information, branch hours. Authenticated session: balances, positions, statements. Step-up: money movement, changing contact details or bank links, anything that is irreversible.", "In a logged-in app the session already carries authentication, so the assistant inherits it and the token scopes limit what tools can be called. On a phone line, authentication happens inside the conversation, so the flow collects an identifier, then a knowledge, possession or biometric factor, then caches the result with an expiry.", "Step-up means re-challenging for risky actions (a one-time code to a registered device, an in-app approval) even inside an authenticated session. Risk signals such as new device, odd hour, a just-changed phone number or a large amount raise the bar.", "Voice biometrics: low friction and good against a human impostor, but vulnerable to cloning from a few seconds of audio, replay and relay attacks. Industry write-ups describe banks rethinking voice as a sole factor and pairing it with liveness or deepfake detection, device signals and a risk decision.", "Keep sensitive values out of the model's reach until needed: the LLM sees only what the tool returns for that authenticated user, never a broad customer record, and logs redact account numbers. Do not let a spoken name or last four digits alone unlock anything beyond public content."], "say": ["I'd design it per intent: what is public, what needs a logged-in session, and what needs a fresh challenge, and I'd keep the model from ever seeing data the current user hasn't earned.", "I wouldn't rely on a voiceprint alone. It's a good signal in a risk decision, not a lock."], "deep": "For an LLM assistant the most important auth property is that the authorisation lives in the tool layer, not in the prompt. A prompt that says 'only show balances to verified users' is advice; a balance tool that rejects a call without a verified session scoped to that customer is a control. This also defends against prompt injection and a user asking the assistant for another person's account. Each tool call should carry the authenticated principal, and the policy check should be deterministic code.\n\nPersonalisation in finance is regulated by what it implies. Saying 'your balance is X' is retrieval. Saying 'you should move money into this fund' based on the client's holdings is personalised advice, which carries suitability and fiduciary obligations. Vanguard's own CIO has publicly said the assistant must not cross into unauthorised financial advice, which tells you where the line is drawn. A common design is to let the assistant explain, summarise and retrieve, while recommendations come from an approved advice engine or a human advisor.\n\nPrivacy details interviewers like: consent and purpose limitation for using account data in prompts, data residency and vendor retention terms for the model provider, masking in transcripts, and retention schedules for chat and voice logs. A good answer shows you would ask these on day one.", "sources": [{"label": "Entersekt: Why banks can no longer trust voice biometric authentication alone", "url": "https://www.entersekt.com/resources/why-banks-can-no-longer-trust-voice-biom", "why": "Appeared in search; the argument for layering voice with other signals."}, {"label": "ABA Banking Journal: Challenges in voice biometrics in the age of deepfakes", "url": "https://bankingjournal.aba.com/2024/02/challenges-in-voice-biometrics-vulnerabilities-in-the-age-of-deepfakes/", "why": "Appeared in search; a banking-industry view of cloned-voice risk."}, {"label": "Fortune: Vanguard's CIO on the AI digital advisor", "url": "https://fortune.com/2025/12/24/vanguards-cio-niti-tandon-ai-digital-advisor/", "why": "The CIO on keeping the assistant from giving financial advice and on hallucination risk."}]}, {"id": "f-llm-orchestration", "title": "The LLM agent era: who owns the flow, the model or the code", "brief": "Every enterprise platform now splits the work between an LLM and deterministic flows, and they draw the line in different places. The useful question is per intent: does the model decide what to do next (planner), or does it only interpret the user while a fixed flow runs the transaction (flow)? In regulated finance the answer for money and account actions is almost always the flow.", "practice": ["Rasa CALM: the LLM does dialogue understanding only, turning the user's message into commands such as start a flow or set a slot. Business logic lives in explicit flows that call APIs and branch deterministically. The model never improvises the steps of a transfer.", "Dialogflow CX: classic visual state-machine flows (predictable and easy to audit) plus generative playbooks, where you describe behaviour in natural language and Gemini plans tool calls. Teams mix them: a playbook for open conversation, a flow for the sensitive path.", "Copilot Studio: topics (authored flows) plus generative orchestration, where the model chooses among topics, tools and knowledge sources, with generative answers behind confidence checks. Rasa's own comparison argues the deterministic boundary is less explicit there than per turn in CALM (a vendor view, take it as one).", "Kore.ai XO (Mphasis's main partner): combines dialog tasks with GenAI features. I have only the vendor positioning, so describe the split as a design choice rather than claiming product specifics.", "Production patterns that hold across them: a router or orchestrator picks a lane (FAQ with retrieval, API lookup, transactional flow, human); tools have typed schemas and server-side authorisation; every tool call is logged with arguments; a hard step or turn budget stops runaway loops; sensitive actions require a confirmation step the model cannot skip."], "say": ["I'd let the model interpret and the code decide for anything that moves money or touches an account. The model proposes a command, a deterministic flow validates it and does the work.", "For open questions I'm happy to give the model more freedom, as long as it is grounded in retrieved content and every tool call is logged so we can replay a bad turn."], "deep": "The trade-off is coverage against control. A flow-first design is predictable, testable and easy for compliance to read, but every new capability costs authoring effort and the bot sounds rigid. A planner-first design covers the long tail with little authoring, but it is harder to test (non-deterministic paths), harder to explain to an auditor, and prone to wrong tool choice or skipped confirmation steps. Most banks end up with a layered system: deterministic for transactions and compliance statements, retrieval-grounded generation for FAQs, and a planner only where the action space is read-only and low risk.\n\nEvaluating an agent is different from evaluating a classifier. You test trajectories, not just answers: did it choose the right tool, with the right arguments, in the right order, and did it stop and ask when it should. Teams build scenario suites from real transcripts, replay them on every prompt or model change, and track tool-call accuracy, task success, escalation correctness and policy violations. The model version and the prompt are part of the release, so changes go through regression like code.\n\nVanguard's public job postings for AI application engineers mention agentic architectures on AWS Bedrock with LangGraph, MCP and tools for models from several providers, evaluation and monitoring for responsible AI, and a conversational AI orchestration platform. That matches the orchestrator pattern above, and it is worth asking how they split flows from agents.", "sources": [{"label": "Rasa: Dialogue management (CALM)", "url": "https://rasa.com/docs/learn/concepts/dialogue-management/", "why": "The LLM emits commands, flows run the business logic."}, {"label": "Rasa: Copilot Studio vs Dialogflow vs Rasa", "url": "https://rasa.com/compare/copilot-studio-vs-dialogflow-vs-rasa", "why": "One vendor's view of where each platform draws the deterministic boundary (biased, read as such)."}, {"label": "Built In: Vanguard AI Application Engineer posting", "url": "https://builtin.com/job/ai-application-engineer/9212349", "why": "What Vanguard lists: agentic chat on Bedrock and LangGraph, MCP tools, evaluation, Python and TypeScript."}]}, {"id": "f-model-risk", "title": "Model risk management for LLM assistants in a bank", "brief": "Banks run models under supervisory model risk guidance: inventory, independent validation, ongoing monitoring, documentation. The old US guidance, SR 11-7, applied to LLMs by principle, but reporting from April 2026 says it was replaced by a new letter, SR 26-2, which excludes generative AI from scope. Practising banks keep validating anyway, because separate GenAI guidance is expected and the risk has not gone away.", "practice": ["Treat the LLM system as one thing under validation: the foundation model version, system prompt, retrieval configuration, tools and guardrails are versioned together, with an owner and a risk tier in the model inventory.", "Validate on in-domain data: a test set built from real queries, measuring groundedness (is each claim supported by a source), hallucination rate against a threshold, refusal correctness, and robustness to adversarial prompts. Generic leaderboards are not evidence.", "Independent challenge: someone who did not build it reviews conceptual soundness, limits and test results. For third-party models, assume the provider can change behaviour without notice, so pin versions and re-run the suite on every change.", "Explainability for LLMs usually means traceability: the answer cites its sources, the tool calls and the prompt version are logged, and a reviewer can replay a decision. Do not claim the model's internal reasoning is explainable.", "Bias and fairness: slice quality and escalation rates by cohort (language, accent for voice, channel), and watch for different refusal or tone patterns. Audit logs record who asked, what the model saw, what it answered and what the human did next.", "Compensating controls that regulators and reviewers like: human in the loop on risky outputs, approved prompt libraries, content filters, and a kill switch."], "say": ["I treat the prompt, the model version, the retrieval setup and the tools as one versioned system, and I re-run the evaluation suite on any change to any of them, because a silent model update can change behaviour.", "For explainability I'd focus on traceability: every answer links to its source and every tool call is logged, so a reviewer can replay the turn."], "deep": "Generative AI breaks three assumptions in classic model validation: outputs are not deterministic, there is no fixed specification to validate against, and the core model is usually built by someone else. The practical response is to move validation from the model to the system and the process: a defined scope of use, an evaluation set with agreed pass thresholds, sampling of live conversations, and monitoring for drift in inputs, retrieval quality and refusal patterns.\n\nOn the regulatory status, be careful in an interview. A trade-press report (Risk.net) says US regulators replaced SR 11-7 with SR 26-2 on 17 April 2026 and excluded GenAI from its scope, while noting that large banks kept validating GenAI and that separate guidance is expected. I could not confirm the text of SR 26-2 myself, so say 'as I understand it' and show you know the principle either way: independent validation, monitoring and effective challenge.\n\nAround the model sit conduct rules. FINRA's Regulatory Notice 24-09 (June 2024) says existing rules apply to generative AI: supervision (including model risk and data integrity), communications rules where a chatbot reaches customers, recordkeeping of AI-generated content, and data protection. Vanguard's public statements describe monitoring for model performance, bias and drift, and compliance and legal buy-in, which is the shape an interviewer will expect.", "sources": [{"label": "Risk.net: Do banks still need to validate GenAI models?", "url": "https://www.risk.net/our-take/7963480/do-banks-still-need-to-validate-genai-models", "why": "The SR 26-2 replacement and GenAI exclusion, and why banks keep validating."}, {"label": "Seekr: Model risk management for generative AI, extending SR 11-7 to LLMs", "url": "https://www.seekr.com/resource/model-risk-management-generative-ai-sr-11-7/", "why": "Inventory, groundedness metrics, third-party model handling (vendor article)."}, {"label": "arXiv: Model risk management for generative AI in financial institutions", "url": "https://arxiv.org/pdf/2503.15668", "why": "Appeared in search; an academic treatment of the same question."}, {"label": "FINRA: Artificial intelligence key topics", "url": "https://www.finra.org/rules-guidance/key-topics/artificial-intelligence", "why": "Appeared in search; entry point to FINRA's GenAI guidance including Notice 24-09."}]}, {"id": "f-chatbot-regulation", "title": "What regulators have said about financial chatbots", "brief": "Regulators do not have a special chatbot rulebook: existing consumer protection and conduct rules apply to whatever answers the customer. The two public anchors are the CFPB's 2023 chatbot report (the doom loop, wrong answers, no route to a human) and FINRA's 2024 notice on generative AI (supervision, communications, recordkeeping).", "practice": ["CFPB issue spotlight on chatbots in consumer finance (June 2023): flags noncompliance risk, harm from wrong or inconsistent information, erosion of trust, and doom loops where the customer repeats the same exchange with no offramp to a person.", "Design response: an always-available human option, a cap on repeated fallbacks before escalation, and clear disclosure that the customer is talking to an automated assistant.", "FINRA Regulatory Notice 24-09 (27 June 2024): no new rules, but existing rules apply: a supervisory system that covers GenAI, communications rules depending on audience, retention of AI-generated records, and protection of customer data.", "In practice this means logging every conversation with the model and prompt version, retaining it on the required schedule, reviewing a sample for compliance, and keeping approved language for regulated content (performance, fees, risks).", "Hallucination in this setting is a conduct problem, not only a quality problem: a wrong fee or a wrong tax statement is a misstatement to a customer. Vanguard's own investor research found 37% of AI users received wrong or misleading information."], "say": ["I'd treat the bot's answers like any other customer communication, so they get logged, retained and sampled for review, and anything regulated comes from approved content rather than being generated.", "I'd make sure there is always a way out to a person, because a bot that can't hand off is the exact failure the CFPB called out."], "deep": "The retrieval-versus-generation split is where compliance and engineering meet. Statements about performance, fees, risk or eligibility are the ones regulators examine most closely, so a common design serves them from a compliance-approved library, with the model choosing which approved item applies rather than writing new text. Open-ended explanatory content can be generated, but only from approved sources and with a refusal when the evidence is missing.\n\nCommunications rules also raise a quiet question: is a chatbot answer an individual correspondence, retail communication or something else? FINRA's notice says it depends on the nature and number of recipients. That affects whether pre-approval or post-review applies, and a candidate who knows the question exists sounds experienced.\n\nOne caution: these are US sources and Vanguard is a US firm, but Vanguard also operates under SEC rules for investment advisers, and its Personal Advisor and Digital Advisor services are advisory products. Anything that edges toward a recommendation changes the regulatory frame, which is why public statements from its CIO stress staying clear of unauthorised advice.", "sources": [{"label": "CFPB: Chatbots in consumer finance (issue spotlight, June 2023)", "url": "https://files.consumerfinance.gov/f/documents/cfpb_chatbot-issue-spotlight_2023-06.pdf", "why": "The primary source on doom loops and chatbot risks (the PDF would not parse for me, so I relied on summaries)."}, {"label": "Consumer Finance Monitor: New CFPB report on chatbots", "url": "https://www.consumerfinancemonitor.com/2023/06/08/new-cfpb-report-highlights-concerns-with-growing-use-of-chatbots-by-financial-institutions/", "why": "Appeared in search; a law-firm summary of the CFPB report."}, {"label": "Mayer Brown: FINRA publishes Regulatory Notice 24-09", "url": "https://www.mayerbrown.com/-/media/files/perspectives-events/publications/2024/07/legal-update-finra-publishes-regulatory-notice.pdf?rev=9f0a4b4a39e1480f9678a4b5f9514566", "why": "Appeared in search; summary of the four areas in FINRA's GenAI notice."}, {"label": "InvestmentNews: AI financial advice lifts demand for human advisors, says Vanguard", "url": "https://www.investmentnews.com/fintech/ai-financial-advice-lifts-demand-for-human-advisors-says-vanguard/268433", "why": "Vanguard's own survey numbers on AI answer accuracy and trust."}]}, {"id": "f-vanguard-public", "title": "What Vanguard has said publicly about its AI and assistants", "brief": "Vanguard's public line is augment, do not replace: AI as an enabler that amplifies human expertise. The concrete items are Crew Assist for contact-centre staff on Azure OpenAI, GenAI client-ready article summaries for advisors, an internal chatbot piloted with about 2,000 employees on questions like account balance, and a CIO who has talked about a client-facing digital advisor and even a voicebot. Use this to ask informed questions, not to claim inside knowledge.", "practice": ["Crew Assist: one of the first Azure OpenAI uses, where contact-centre staff ask a question and get an answer drawn from internal content, with links to share. The aims are faster resolution, better answer quality and quicker onboarding. This is retrieval-grounded agent assist, the safest first step.", "Client-ready article summaries (announced May 2025, beta): advisors generate customised summaries of Vanguard's market perspectives by client sophistication, life stage and tone, with the required disclosures generated alongside. Reported reach is about 150,000 advisors across 50,000 advisory firms.", "Internal chatbot pilot: about 2,000 employees testing natural-language answers to client-style questions such as account balance and portfolio performance. The CIO has stressed watching hallucinations and keeping it from giving financial advice, and has talked of a digital advisor for roughly 50 million clients.", "Governance as reported by MIT Sloan Management Review: monitoring for performance, bias and drift, tracking of crew AI usage, a few dozen pilots with most unreleased, about $500 million of AI value tracked across cost avoidance, shareholder value, risk reduction and efficiency.", "Partners named publicly: WRITER as the enterprise generative AI platform and Norm AI for compliance, plus Azure OpenAI. Public job postings add AWS Bedrock, LangGraph, MCP, Python, TypeScript, Splunk and Honeycomb, with a team that owns conversational AI orchestration platforms and shared AI infrastructure.", "Vanguard's own investor research found about a third of its investors had used AI for financial guidance, 37% of those had received incorrect or misleading information, and only a few percent of investors highly trust AI guidance compared with more than half for human advisors. Expect that to shape a cautious, human-in-the-loop design."], "say": ["From what Vanguard has said publicly, the pattern is augment first, with Crew Assist for the contact centre and advisor tools, then careful client-facing steps. I'd expect grounding, monitoring and a human path to matter more than clever generation.", "I'd be curious how you split the deterministic account lookups from the generated explanations in the client assistant, since the pilot questions include balances and performance."], "deep": "What I could not find: any public detail on how Vanguard's current client virtual assistant is built (vendor, NLU stack, intent counts), its containment numbers, or its voice channel design. The interviewers may mention things I could not verify, so listen first. The sensible inference from the public record is a layered setup: retrieval-grounded content assistants for staff and advisors, an authenticated client assistant that reads from account APIs, and orchestration code on a cloud agent framework.\n\nThe job postings are the best public window into the team. The orchestration-platform role asks for experience with agent orchestration, conversational AI, agent-to-agent protocols, RAG, knowledge management and semantic search. The application engineer role asks for agentic chat on AWS Bedrock with LangGraph, system prompts, skills and tools for models from Anthropic, Google and OpenAI, evaluation and monitoring, and Python or TypeScript. For a conversational AI and NLP contractor role through Mphasis, expect work close to that stack: intent and entity design on an existing assistant, error analysis on transcripts, classification and embedding work for routing and retrieval, and LLM components under guardrails.\n\nA good move in the interview is to connect your own experience to their stated priorities: evaluation harnesses, production monitoring, grounding by source type, and safe escalation. Do not name their internal systems as if you knew them.", "sources": [{"label": "MIT Sloan Management Review: Investing in AI payoffs at Vanguard", "url": "https://sloanreview.mit.edu/article/investing-in-ai-payoffs-at-vanguard/", "why": "Crew Assist on Azure OpenAI, value tracking, bias and drift monitoring, dozens of pilots."}, {"label": "Vanguard: Client-ready article summaries press release", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/who-we-are/pressroom/press-release-vanguard-unveils-generative-ai-client-summaries-for-financial-advisors-050525.html", "why": "The first client-facing GenAI capability, with disclosures and beta status."}, {"label": "Yahoo Finance: Vanguard CIO on big tech bets and the AI digital advisor", "url": "https://finance.yahoo.com/news/investment-giant-vanguard-cio-placing-145736628.html", "why": "The 2,000-employee chatbot pilot, WRITER and Norm AI, hallucination and advice guardrails."}, {"label": "Vanguard: Delivering client-centered technology", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/why-vanguard/sets-us-apart/client-centered-technology.html", "why": "Vanguard's own wording on AI as an enabler, Digital Advisor and Personal Advisor, and responsible innovation."}, {"label": "Built In: Vanguard AI Application Engineer posting", "url": "https://builtin.com/job/ai-application-engineer/9212349", "why": "The stack and duties Vanguard lists for AI chat roles."}, {"label": "Fortune: Vanguard's CIO on the AI digital advisor", "url": "https://fortune.com/2025/12/24/vanguards-cio-niti-tandon-ai-digital-advisor/", "why": "The voicebot idea and the caution about hallucination and advice."}]}, {"id": "f-mphasis-kore", "title": "Mphasis and conversational AI: the integrator's view", "brief": "Mphasis is a systems integrator, not a model lab. Its conversational AI practice is built around a Next Gen Contact Center offering and a partnership with Kore.ai, where it describes itself as the only platinum professional services partner. As a contractor placed through them, you are expected to deliver on the client's stack, so show you adapt to platforms and care about measurable outcomes.", "practice": ["Public positioning: Mphasis.ai business unit for generative AI, Next Gen Contact Center combining conversational and generative AI, analytics and automation, aimed at banking, financial services and insurance, healthcare, retail and travel.", "Kore.ai platform (per the partnership press): a no-code and pro-code platform for virtual assistants across 40+ channels and 120+ languages, with Kore.ai claiming service to over 200 Global 2000 companies. I have only press claims here.", "Mphasis describes multi-algorithm intent engines that combine machine learning, knowledge graphs and industry ontologies, human-in-the-loop escalation (simple account questions to bots, advisory matters to specialists), and agentic AI for context-aware decisions.", "Claimed results in its own blog, all vendor numbers and unverified: 25% faster resolution, 10 to 15% better first-call resolution, 30% cost savings. Treat them as marketing, and talk about how you would measure such outcomes instead.", "Its stated guardrails: hallucination mitigation by fine-tuning and letting the model say it does not know, AES-256 encryption, compliance with SOC 2 and ISO 27001, and bias detection."], "say": ["I don't tie myself to one platform. What carries over is intent and entity design, error analysis on real transcripts, evaluation and safe escalation, and I pick up the vendor's tooling quickly.", "I'd want to know which stack the Vanguard team runs, and where my work would sit: new intents, classifier quality, retrieval, or the LLM layer."], "deep": "In an integrator arrangement the engineer's value is speed to useful work inside someone else's system. That means reading existing assistants (intent taxonomy, training data quality, fallback analysis), proposing changes that can be measured, and documenting them so the client team can own them after you leave. Interviewers from the client side will probe for judgement more than for platform trivia.\n\nThe one thing I could not find was any public statement that Mphasis builds Vanguard's virtual assistant. The only public Mphasis conversational AI partner I found is Kore.ai. Do not assume Vanguard runs Kore.ai, and do not say so
