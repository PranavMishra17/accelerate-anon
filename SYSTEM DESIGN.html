<html lang="en">

<style>
/* Every size, family, colour and radius comes from site/tokens.css (see DESIGN.md).
   The page adds only its two sticky heights. */
[hidden] { display: none !important; }   /* hidden wins over any display rule ("+0 more" showed without it) */
:root {
  --tabs-h: 48px;
  --bar-h: 42px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html {
  scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--tabs-h) + var(--bar-h) + var(--s3));
  -webkit-text-size-adjust: 100%;
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: var(--lh-body);
}
h1, h2, h3, h4, h5 { margin: 0; line-height: var(--lh-tight); font-weight: var(--w-strong); }
p { margin: 0; }
strong, b { font-weight: var(--w-strong); }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm); }
code {
  font-family: var(--mono);
  font-size: var(--fs-code);
  background: var(--sunken);
  padding: 1px 5px;
  border-radius: var(--radius-sm);
}
.wrap { max-width: 1260px; margin: 0 auto; padding: 0 var(--s5); }

/* Top bar: the title, three tabs, and the site badges (site/nav.css) */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  border-bottom: var(--hair);
}
.topbar-in { display: flex; align-items: flex-end; gap: var(--s5); min-height: var(--tabs-h); }
.brand {
  font-weight: var(--w-strong); font-size: var(--fs-md); color: var(--ink);
  text-decoration: none; padding-bottom: var(--s3); white-space: nowrap;
  display: inline-flex; align-items: center; gap: var(--s2);
}
.brand img { border-radius: var(--radius-sm); }
.tabs { display: flex; gap: var(--s1); overflow-x: auto; align-items: flex-end; scrollbar-width: thin; flex: 1; min-width: 0; }
.tab {
  appearance: none; border: 0; background: none; font: inherit;
  color: var(--muted); padding: var(--s3) var(--s3) 10px; border-bottom: 2px solid transparent;
  white-space: nowrap; cursor: pointer;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: var(--w-strong); border-bottom-color: var(--accent); }
/* A phone: the badges take their own row above the tabs, and the sticky offsets follow. */
@media (max-width: 720px) {
  :root { --tabs-h: 88px; }
  .topbar-in { flex-wrap: wrap; align-content: flex-end; row-gap: 0; }
}

/* View headers, shared by every page */
.vhead { padding: var(--s5) 0 var(--s4); }
.vhead h2 { font-size: var(--fs-2xl); }
.vlede { color: var(--soft); margin-top: var(--s2); max-width: var(--measure); }
.vmeta { color: var(--muted); font-size: var(--fs-sm); margin-top: var(--s2); max-width: var(--measure); }
.crumb { font-size: var(--fs-sm); color: var(--muted); margin-bottom: var(--s1); }
.chips { list-style: none; display: flex; flex-wrap: wrap; gap: var(--s1); padding: 0; margin: var(--s3) 0 0; }
.chips li {
  font-size: var(--fs-sm); line-height: var(--lh-tight); padding: 2px var(--s2); border: var(--hair);
  border-radius: var(--radius-sm); background: var(--bg); color: var(--muted);
}

/* Framework hero */
.framework { margin: 0; overflow-x: auto; }
.framework svg { display: block; width: 100%; min-width: 760px; max-width: 1000px; height: auto; }
.framework figcaption { color: var(--muted); font-size: var(--fs-sm); margin-top: var(--s1); }
.fw-step { cursor: pointer; }
.fw-step:focus { outline: none; }
.fw-box { fill: var(--surface); stroke: var(--soft); stroke-width: 1.25; }
.fw-box.optional { stroke-dasharray: 6 4; }
.fw-step:hover .fw-box, .fw-step:focus-visible .fw-box { fill: var(--sunken); }
.fw-step:focus-visible .fw-box { stroke: var(--accent); stroke-width: 2; }
.fw-step.active .fw-box { stroke: var(--accent); stroke-width: 2; }
.fw-name { font-family: var(--font); font-size: var(--fs-md); font-weight: var(--w-strong); fill: var(--ink); }
.fw-time { font-family: var(--font); font-size: var(--fs-xs); fill: var(--muted); }
.fw-arrow { stroke: var(--soft); stroke-width: 1.25; fill: none; }
.fw-arc { stroke: var(--muted); stroke-width: 1.25; fill: none; }
.fw-arc-label { font-family: var(--font); font-size: var(--fs-sm); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }
.fw-arrowhead { fill: var(--soft); }
.fw-arc-head { fill: var(--muted); }
.fw-num-bg { fill: var(--surface); stroke: var(--rule); stroke-width: 1.25; }
.fw-step.active .fw-num-bg { fill: var(--accent); stroke: var(--accent); }
.fw-num { font-family: var(--font); font-size: var(--fs-sm); font-weight: var(--w-strong); fill: var(--soft); }
.fw-step.active .fw-num { fill: var(--bg); }

/* Framework page */
.ov { padding-bottom: var(--s7); }
.ov section { margin-top: var(--s6); }
.ov section > h2 { font-size: var(--fs-xl); margin-bottom: var(--s1); }
.ov .sub-h { font-size: var(--fs-md); margin: var(--s5) 0 var(--s1); }
.ov .intro { max-width: var(--measure); color: var(--soft); margin-bottom: var(--s4); }
.fw-cards { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.fw-card { background: var(--surface); border: var(--hair); border-radius: var(--radius-lg); padding: var(--s4); }
.fw-card.optional { border-style: dashed; }
.fw-card-head { display: flex; align-items: center; gap: var(--s2) var(--s3); flex-wrap: wrap; }
.fw-card h3 { font-size: var(--fs-lg); }
.fw-goal { margin-top: var(--s2); }
.fw-end { margin-top: var(--s3); padding-top: var(--s2); border-top: var(--hair); color: var(--soft); font-size: var(--fs-sm); }
.fw-end strong { color: var(--ink); }
.ov-folds { display: grid; gap: var(--s2); }
.ov ol.signals { margin: 0; padding-left: var(--s5); max-width: var(--measure); }
.ov ol.signals li { margin: var(--s2) 0; }
.ov .say { max-width: var(--measure); }
@media (max-width: 1000px) { .fw-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .fw-cards { grid-template-columns: minmax(0, 1fr); } }

/* Pages with a side list: Patterns and Designs */
.split { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--s6); padding-bottom: var(--s6); }
.main { min-width: 0; }
.side {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--tabs-h)); align-self: start;
  padding: var(--s5) 0 var(--s4); max-height: calc(100vh - var(--tabs-h)); overflow-y: auto; font-size: var(--fs-sm);
}
.side a { display: block; padding: var(--s1) var(--s3); color: var(--muted); text-decoration: none; border-left: 2px solid var(--rule); }
.side a:hover { color: var(--ink); }
.side a.current { color: var(--ink); font-weight: var(--w-strong); border-left-color: var(--accent); }
.side-top { margin-bottom: var(--s1); }
.side-fam { font-size: var(--fs-xs); font-weight: var(--w-strong); color: var(--muted); margin: var(--s4) 0 var(--s1); }
.side-list { list-style: none; margin: 0; padding: 0; }
@media (max-width: 900px) {
  .split { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .split.gallery > .side { display: none; }
  .side { position: static; max-height: none; overflow: visible; padding: var(--s4) 0 var(--s2); border-bottom: var(--hair); }
  .side-list { display: flex; overflow-x: auto; scrollbar-width: thin; }
  .side a { border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; padding: var(--s1) 10px; }
  .side a.current { border-bottom-color: var(--accent); }
  .side-top { display: inline-block; margin: 0; }
  .side-fam { margin: var(--s2) 0 0; }
}

/* Cards: pattern and design galleries */
.pfam { margin: var(--s1) 0 var(--s6); }
.pfam-head h3 { font-size: var(--fs-lg); }
.pfam-head p { color: var(--muted); font-size: var(--fs-sm); margin-top: 2px; }
.pgrid, .dgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); margin-top: var(--s3); }
.pcard, .dcard {
  position: relative; background: var(--surface); border: var(--hair);
  border-radius: var(--radius-lg); padding: var(--s3) var(--s4) var(--s4);
}
.pcard:hover, .dcard:hover { border-color: var(--muted); }
.pcard:focus-within, .dcard:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.pcard-fig { height: 200px; border-bottom: var(--hair); padding-bottom: var(--s2); margin-bottom: var(--s3); }
.pcard-fig .diagram, .pcard-fig svg { height: 100%; }
.pcard h4, .dcard h3 { font-size: var(--fs-lg); }
.card-link { color: var(--ink); text-decoration: none; }
.card-link:hover { color: var(--accent); }
.card-link:focus-visible { outline: none; }
.card-link::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.pcard-def { color: var(--soft); margin-top: var(--s1); }
.dcard-prompt {
  margin-top: var(--s1); color: var(--soft); display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden;
}
@media (max-width: 760px) { .pgrid, .dgrid { grid-template-columns: minmax(0, 1fr); } }

/* Pattern page */
.pat-when { margin-top: var(--s3); max-width: var(--measure); }
.pfig { background: var(--surface); border: var(--hair); border-radius: var(--radius-lg); padding: var(--s1) var(--s4) var(--s4); }
.pat-say { margin-top: var(--s5); }
.techs, .used-in { margin-top: var(--s6); }
.techs > h3, .used-in > h3 { font-size: var(--fs-xl); margin-bottom: var(--s1); }
.tech {
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0 var(--s5);
  grid-template-areas: "fig head" "fig body"; grid-template-rows: auto 1fr; align-items: start;
  padding: var(--s5) 0; border-top: var(--hair);
}
.tech-fig { grid-area: fig; background: var(--surface); border: var(--hair); border-radius: var(--radius-lg); padding: var(--s1) var(--s2); }
.tech-head { grid-area: head; }
.tech-dl { grid-area: body; }
.tech.no-fig, .tech.wide { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "fig" "body"; grid-template-rows: auto; }
.tech.wide .tech-fig { margin-bottom: var(--s3); }
.tech.wide .tech-dl { max-width: 96ch; }
.diagram.mini svg { margin: 0 auto; }
.tech h4 { font-size: var(--fs-lg); }
.tech-short { margin: var(--s1) 0 var(--s3); color: var(--soft); }
.tech-dl { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: var(--s2) var(--s4); margin: 0; }
.tech-dl dt { font-weight: var(--w-strong); color: var(--muted); }
.tech-dl dd { margin: 0; }
.used-list { list-style: none; padding: 0; margin: 0; }
.used-list li { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--s4); padding: 10px 0; border-top: var(--hair); }
.used-name { font-weight: var(--w-strong); color: var(--ink); text-decoration: none; }
.used-name:hover { color: var(--accent); text-decoration: underline; }
.used-list li > span { color: var(--soft); }
.pat-acc { font-size: var(--fs-sm); color: var(--muted); margin: var(--s5) 0 0; }
.pager { display: flex; align-items: flex-end; gap: var(--s4); margin-top: var(--s6); padding-top: var(--s4); border-top: var(--hair); }
.pager a {
  display: flex; flex-direction: column; text-decoration: none; color: var(--ink);
  font-weight: var(--w-strong); max-width: 40%;
}
.pager a span { font-size: var(--fs-xs); font-weight: var(--w-regular); color: var(--muted); }
.pager a:hover { color: var(--accent); }
.pager .next { margin-left: auto; text-align: right; }
.pager-hint { flex: 1; text-align: center; color: var(--muted); font-size: var(--fs-xs); align-self: center; }
.step-pager { margin-top: var(--s3); padding-top: var(--s3); }
@media (max-width: 900px) {
  .tech { grid-template-columns: minmax(0, 1fr) !important; grid-template-areas: "head" "fig" "body"; }
  .tech-fig { margin-bottom: var(--s3); }
}
@media (max-width: 640px) {
  .used-list li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .tech-dl { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .tech-dl dd { margin-bottom: var(--s2); }
}

/* Design page */
.ex-head { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--s5); padding: var(--s5) 0 var(--s4); align-items: start; }
.ex-kind { color: var(--muted); font-size: var(--fs-sm); margin-bottom: var(--s1); }
.ex-head h2 { font-size: var(--fs-2xl); }
.prompt { margin: var(--s3) 0 0; padding: var(--s3) var(--s4); background: var(--sunken); border-radius: var(--radius); max-width: var(--measure); }
.ex-aside { display: grid; gap: var(--s2); }
.lens { background: var(--surface); border: var(--hair); border-radius: var(--radius-lg); }
.lens > summary { list-style: none; cursor: pointer; position: relative; padding: 10px var(--s4) 10px var(--s6); display: grid; gap: 2px; }
.lens > summary::-webkit-details-marker { display: none; }
.lens > summary::before { content: ""; position: absolute; left: var(--s4); top: 17px; border-left: 7px solid var(--muted); border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
.lens[open] > summary::before { transform: rotate(90deg); }
.lens-title { font-weight: var(--w-strong); }
.lens-sub { color: var(--muted); font-size: var(--fs-sm); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lens[open] .lens-sub { display: none; }
.lens ul { margin: 0; padding: 0 var(--s4) var(--s3) var(--s6); }
.lens li { margin: var(--s1) 0; }
.home-card { background: var(--sunken); border-radius: var(--radius-lg); padding: 10px var(--s4); font-size: var(--fs-sm); color: var(--soft); }
.home-card a { font-weight: var(--w-strong); }
.mini-num { display: inline-block; width: 20px; font-weight: var(--w-strong); color: var(--muted); }

.steps, .board, .blk, .col { min-width: 0; }
.step { padding: var(--s4) 0 var(--s2); }
.step-head { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.num {
  width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-weight: var(--w-strong); font-size: var(--fs-sm); color: var(--soft);
  border: var(--hair); background: var(--surface);
}
.step-head h3 { font-size: var(--fs-xl); }
.step-time { color: var(--muted); font-size: var(--fs-sm); }
.step-goal { color: var(--soft); max-width: var(--measure); margin: var(--s1) 0 var(--s3); }

/* Patterns this design uses */
.ugrid { columns: 2 380px; column-gap: var(--s3); }
.ucard { break-inside: avoid; margin-bottom: var(--s3); background: var(--surface); border: var(--hair); border-radius: var(--radius-lg); padding: var(--s3) var(--s4) var(--s4); }
.ucard-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ucard h4 { font-size: var(--fs-lg); }
.ucard h4 a { color: var(--ink); text-decoration: none; }
.ucard h4 a:hover { color: var(--accent); text-decoration: underline; }
.ucard-fam { font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; }
.use-why { margin: var(--s1) 0 var(--s3); color: var(--soft); }
.use-techs { margin: 0; padding-top: 10px; border-top: var(--hair); }
.use-techs dt { font-weight: var(--w-strong); }
.use-techs dt a { text-decoration: none; }
.use-techs dt a:hover { text-decoration: underline; }
.use-techs dd { margin: 2px 0 10px; color: var(--soft); }
.use-techs dd:last-child { margin-bottom: 0; }
.not-needed { margin-top: var(--s5); padding: var(--s3) var(--s4); background: var(--sunken); border-radius: var(--radius-lg); }
.not-needed h4 { font-size: var(--fs-sm); color: var(--muted); margin-bottom: var(--s1); }
.not-needed ul { list-style: none; margin: 0; padding: 0; }
.not-needed li { display: flex; flex-wrap: wrap; gap: var(--s1) 10px; align-items: baseline; margin: var(--s2) 0; max-width: 96ch; }
.nn-names { display: inline-flex; flex-wrap: wrap; gap: var(--s1); }
.nn-chip { font-size: var(--fs-sm); padding: 1px var(--s2); border: var(--hair); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); text-decoration: none; }
a.nn-chip:hover { border-color: var(--accent); color: var(--accent); }

/* Whiteboard panel */
.board {
  background: var(--surface); border: var(--hair); border-radius: var(--radius-lg);
  padding: var(--s4) var(--s5) var(--s4); margin-bottom: var(--s3);
}
.board-title { font-size: var(--fs-sm); color: var(--muted); }
.blk { margin-top: var(--s4); }
.blk h5 { font-size: var(--fs-sm); color: var(--muted); margin-bottom: var(--s1); }
.blk ul, .blk ol { margin: 0; padding-left: var(--s5); }
.blk li { margin: var(--s1) 0; max-width: 82ch; }
/* Definition rows: term and description at body size, ruled like a table. */
.blk dl { display: grid; grid-template-columns: minmax(140px, 244px) minmax(0, 1fr); gap: 0; margin: 0; }
.blk dt, .blk dd { padding: 7px 0; border-top: var(--hair); }
.blk dl > :nth-child(-n+2) { border-top: 0; padding-top: 2px; }
.blk dt { font-weight: var(--w-strong); padding-right: var(--s5); }
.blk dd { margin: 0; max-width: var(--measure); color: var(--soft); }
.blk pre {
  margin: 0; background: var(--code-bg); color: var(--code-ink); border-radius: var(--radius); padding: var(--s3) var(--s4); overflow-x: auto;
  font-family: var(--mono); font-size: var(--fs-code); line-height: var(--lh-body);
}
.blk pre code { background: none; padding: 0; font-size: inherit; }
.blk-note { background: var(--sunken); color: var(--soft); padding: 10px 14px; border-radius: var(--radius); max-width: 84ch; }
.blk-math .conclusion { margin-top: 10px; padding: 10px 14px; background: var(--sunken); border-radius: var(--radius); max-width: 84ch; }

.dive { border: var(--hair); border-radius: var(--radius-lg); padding: var(--s3) var(--s4) var(--s4); }
.dive h5 { font-size: var(--fs-md); color: var(--ink); margin: 0; }
.dive .serves { font-size: var(--fs-sm); color: var(--muted); margin: 2px 0 var(--s2); }
.dive .problem { margin-bottom: var(--s2); max-width: var(--measure); }
.dive .pick { margin-top: var(--s3); padding-top: var(--s2); border-top: var(--hair); max-width: 84ch; }

/* Diagram. Boxes by tone: a categorical colour as the stroke over a faint tint of it. */
.diagram { margin: 0; overflow-x: auto; padding: 2px 0; }
.diagram svg { display: block; width: 100%; height: auto; }
.diagram.thumb, .diagram.mini { overflow: visible; }
.dg-box { stroke-width: 1.25; }
.tone-service .dg-box { fill: var(--surface); stroke: var(--soft); }
.tone-orchestrator .dg-box { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; }
.tone-store .dg-box { fill: color-mix(in srgb, var(--cat-2) 12%, var(--surface)); stroke: var(--cat-2); }
.tone-queue .dg-box { fill: color-mix(in srgb, var(--cat-5) 12%, var(--surface)); stroke: var(--cat-5); }
.tone-model .dg-box { fill: color-mix(in srgb, var(--cat-1) 12%, var(--surface)); stroke: var(--cat-1); }
.tone-guard .dg-box { fill: color-mix(in srgb, var(--cat-3) 12%, var(--surface)); stroke: var(--cat-3); stroke-width: 2; }
.tone-human .dg-box { fill: var(--bg); stroke: var(--cat-3); stroke-width: 2; stroke-dasharray: 2 4; }
.tone-external .dg-box { fill: var(--bg); stroke: var(--muted); stroke-dasharray: 6 4; }

.legend { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); list-style: none; padding: 0; margin: 10px 0 0; font-size: var(--fs-sm); color: var(--muted); }
.legend li { display: flex; align-items: center; gap: var(--s2); margin: 0; }
.swatch { width: 18px; height: 12px; border-radius: 3px; border: 1.25px solid var(--soft); background: var(--surface); flex: none; }

.probes ul { margin: 0; padding-left: var(--s5); }
.probes li { margin: var(--s1) 0; max-width: 90ch; }
.contrast { margin-top: var(--s4); padding: 10px 14px; border-radius: var(--radius); background: var(--sunken); max-width: 90ch; }

.tbl-wrap { overflow-x: auto; }

th { background: var(--sunken); font-weight: var(--w-strong); font-size: var(--fs-sm); color: var(--muted); }
th:first-child { border-top-left-radius: var(--radius-lg); }
th:last-child { border-top-right-radius: var(--radius-lg); }
td.stepcell { white-space: nowrap; font-weight: var(--w-strong); }

details.fold { border: var(--hair); border-radius: var(--radius-lg); background: var(--surface); }
details.fold > summary {
  list-style: none; cursor: pointer; position: relative;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px var(--s3);
  padding: var(--s3) var(--s4) var(--s3) 36px;
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before {
  content: ""; position: absolute; left: var(--s4); top: 20px;
  border-left: 7px solid var(--muted); border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent;
}
details.fold[open] > summary::before { transform: rotate(90deg); }
@media (prefers-reduced-motion: no-preference) { details.fold > summary::before { transition: transform 0.15s ease; } }
details.fold > summary:hover .fold-title { color: var(--accent); }
.fold-title { font-size: var(--fs-lg); font-weight: var(--w-strong); line-height: var(--lh-tight); }
.fold-sub { color: var(--muted); font-size: var(--fs-sm); }
.fold-body { padding: 0 var(--s5) var(--s5) 36px; }

.error { border: 1px solid var(--warn); background: var(--sunken); color: var(--ink); padding: var(--s3) var(--s4); border-radius: var(--radius); margin: var(--s3) 0; }
.foot { border-top: var(--hair); padding: var(--s5) 0 var(--s6); color: var(--muted); font-size: var(--fs-sm); }

@media (max-width: 900px) {
  .ex-head { grid-template-columns: minmax(0, 1fr); }
  .talk { grid-auto-flow: row; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 var(--s4); }
  .brand { display: none; }
  .board { padding: var(--s3) var(--s3) var(--s4); }
  .blk dl { grid-template-columns: 1fr; }
  .blk dd { border-top: 0; padding-top: 0; }
  .blk dl > :nth-child(2) { padding-top: 0; }
  .fold-body { padding: 0 var(--s3) var(--s4); }
}

/* Step bar: the design's steps as tabs, sticky under the top bar. Also the pattern index. */
.stepbar {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--tabs-h)); z-index: 10;
  display: flex; align-items: center; gap: 10px; min-height: var(--bar-h);
  background: var(--bg); border-bottom: var(--hair);
}
.stepbar-list { position: relative; list-style: none; margin: 0; padding: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.stepbar-list::-webkit-scrollbar { display: none; }
.stepbar-list a {
  display: flex; align-items: center; gap: var(--s2); white-space: nowrap; text-decoration: none;
  color: var(--muted); font-size: var(--fs-sm); padding: 10px var(--s2) var(--s2); border-bottom: 2px solid transparent;
}
.stepbar-list a:hover { color: var(--ink); }
.sb-num {
  width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-weight: var(--w-strong); font-size: var(--fs-xs); border: var(--hair); color: var(--muted);

.stepbar-list a.visited .sb-num { background: var(--sunken); border-color: var(--muted); color: var(--soft); }
.stepbar-list a.current { color: var(--ink); font-weight: var(--w-strong); border-bottom-color: var(--accent); }
.stepbar-list a.current .sb-num { border-color: var(--accent); background: var(--accent); color: var(--bg); }
.stepbar-count { color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; }
.patbar { margin-bottom: var(--s4); }
.pb-arrow {
  flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%;

a.pb-arrow:hover { border-color: var(--accent); color: var(--accent); }

/* A folded board: titles and first items, in two columns; diagrams scaled to fit. */

.board.folded .blk-math li:nth-child(n+2),

.board.folded .dive .problem,
.board.folded .dive dl,
.board.folded .legend { display: none; }

.board.folded .blk-defs dd { border-top: 0; padding-top: 0; }
.board.folded .blk-code pre { max-height: calc(8 * 1.55em + 24px); overflow: hidden; }
.board.folded .dive { padding: 10px 14px 12px; }
.board.folded .dive .pick { margin-top: var(--s2); }
.board.folded .diagram svg { max-height: var(--fold-fig, 46vh); width: 100%; min-width: 0 !important; }
.board.folded .diagram.shared figcaption { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.blk-more { display: none; color: var(--muted); font-size: var(--fs-sm); margin-top: var(--s1); }
.folded .blk-more { display: block; }
.folded .tight-more { display: none; }
.board.tight .dive .pick, .board.tight .dive > .blk-more:not(.tight-more) { display: none; }
.board.tight .dive .tight-more { display: block; }
.board.tight .blk-code pre { max-height: calc(4 * 1.55em + 24px); }
.ufold.folded .use-techs, .ufold.folded .not-needed li:nth-child(n+2) { display: none; }
.ufold.folded .use-why { margin-bottom: 0; }
.board-foot { display: flex; align-items: baseline; justify-content: flex-end; gap: var(--s4); margin-top: var(--s3); }
.board-rest { color: var(--muted); font-size: var(--fs-sm); margin-right: auto; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.board-toggle, .tray-btn {
  appearance: none; font: inherit; font-size: var(--fs-sm); cursor: pointer; white-space: nowrap;
  border: var(--hair); background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: var(--s1) var(--s3);
}
.board-toggle { color: var(--accent); font-weight: var(--w-strong); border-color: var(--accent); }
.board-toggle:hover { background: var(--accent-soft); }
.tray-btn:hover { background: var(--sunken); }

/* The talk track and follow-ups: toggles, shut by default. */
.tray-bar { display: flex; flex-wrap: wrap; gap: var(--s2); margin-bottom: var(--s1); }
.tray-btn { display: inline-flex; align-items: center; gap: var(--s2); }
.tray-btn::before { content: ""; border-left: 7px solid var(--muted); border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
.tray-btn[aria-expanded="true"] { background: var(--sunken); border-color: var(--muted); }
.tray-btn[aria-expanded="true"]::before { transform: rotate(90deg); }
.tray .talk { margin-top: var(--s3); }
.tray .contrast { margin-top: var(--s3); }
.step .refs { padding: var(--s3) 0 0; }

/* Framework cards: the same step in every design */
.fw-in { margin-top: 10px; font-size: var(--fs-sm); color: var(--muted); }
.fw-in span { font-weight: var(--w-strong); }

@media (max-width: 900px) {
  .board.folded { grid-template-columns: minmax(0, 1fr); }
  .stepbar-count { display: none; }
}
@media (max-width: 640px) {
  .pager-hint { display: none; }
  .pager a { max-width: 48%; }
  .stepbar-list a:not(.current) .sb-name { display: none; }
  .board-foot { flex-wrap: wrap; }
  .tray-bar { gap: 6px; }
}
/* A phone on its side: the top bar scrolls away so the step keeps the screen. */
@media (max-height: 500px) {
  .topbar { position: static; }
  .stepbar, .side { top: env(safe-area-inset-top, 0px); }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 10px); }
}

function createLogger(prefix) {
  const emit = (method, level, message, detail) => {
    const line = `${new Date().toISOString()} ${prefix} ${level} ${message}`;
    const sink = typeof console[method] === "function" ? console[method] : console.log;
    if (detail === undefined) sink.call(console, line);
    else sink.call(console, line, detail);
  };
  return {
    debug: (message, detail) => emit("debug", "DEBUG", message, detail),
    info: (message, detail) => emit("info", "INFO", message, detail),
    warn: (message, detail) => emit("warn", "WARN", message, detail),
    error: (message, detail) => emit("error", "ERROR", message, detail)
  };
}

const log = createLogger(GUIDE.config.logPrefix);
const LABELS = GUIDE.config.labels;

function describeError(err) {
  if (err instanceof Error) return { name: err.name, message: err.message, stack: err.stack };
  return { message: String(err) };
}

function safeRun(label, fn, fallback) {
  try {
    return fn();
  } catch (err) {
    log.error(`${label} failed`, describeError(err));
    return typeof fallback === "function" ? fallback(err) : fallback;
  }
}

const Store = {
  get(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (err) {
      log.warn("Storage read unavailable; continuing without it", { key, error: describeError(err) });
      return null;
    }
  },
  set(key, value) {
    try {
      window.localStorage.setItem(key, value);
      return true;
    } catch (err) {
      log.warn("Storage write unavailable; continuing without it", { key, error: describeError(err) });
      return false;
    }
  }
};

const SVG_NS = "http://www.w3.org/2000/svg";

function setAttributes(node, attrs) {
  if (!attrs) return;
  for (const [key, value] of Object.entries(attrs)) {
    if (value === null || value === undefined || value === false) continue;
    if (key.startsWith("on") && typeof value === "function") {
      node.addEventListener(key.slice(2).toLowerCase(), value);
    } else {
      node.setAttribute(key, value === true ? "" : String(value));
    }
  }
}

function appendChildren(node, children) {
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
}

function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  setAttributes(node, attrs);
  appendChildren(node, children);
  return node;
}

function svgEl(tag, attrs, ...children) {
  const node = document.createElementNS(SVG_NS, tag);
  setAttributes(node, attrs);
  appendChildren(node, children);
  return node;
}

const INLINE_PATTERN = /(`[^`]+`|\*\*[^*]+\*\*)/g;

function inline(text) {
  const source = String(text ?? "");
  const frag = document.createDocumentFragment();
  let last = 0;
  INLINE_PATTERN.lastIndex = 0;
  let match = INLINE_PATTERN.exec(source);
  while (match !== null) {
    if (match.index > last) frag.append(source.slice(last, match.index));
    const token = match[0];
    frag.append(token.startsWith("`") ? h("code", null, token.slice(1, -1)) : h("strong", null, token.slice(2, -2)));
    last = match.index + token.length;
    match = INLINE_PATTERN.exec(source);
  }
  if (last < source.length) frag.append(source.slice(last));
  return frag;
}

function ensureArray(value, what) {
  if (Array.isArray(value)) return value;
  if (value !== undefined && value !== null) log.warn(`Expected a list for ${what}; ignoring it`, { received: typeof value });
  return [];
}

function errorPanel(message) {
  return h("div", { class: "error", role: "alert" }, message);
}

function blockTitle(title) {
  return title ? h("h5", null, title) : null;
}

function wrapText(text, maxChars, maxLines) {
  const words = String(text ?? "").split(/\s+/).filter(Boolean);
  const lines = [];
  let current = "";
  for (const word of words) {
    const candidate = current ? `${current} ${word}` : word;
    if (candidate.length <= maxChars || !current) {
      current = candidate;
    } else {
      lines.push(current);
      current = word;
    }
  }
  if (current) lines.push(current);
  if (lines.length <= maxLines) return lines;
  log.warn("Text longer than its box; joining the overflow onto the last line", { text, maxLines });
  const kept = lines.slice(0, maxLines - 1);
  kept.push(lines.slice(maxLines - 1).join(" "));
  return kept;
}

function boxExit(point, dx, dy, halfW, halfH, gap) {
  const length = Math.hypot(dx, dy);
  if (length === 0) return { x: point.x, y: point.y };
  const tx = dx === 0 ? Infinity : halfW / Math.abs(dx);
  const ty = dy === 0 ? Infinity : halfH / Math.abs(dy);
  const t = Math.min(tx, ty) + gap / length;
  return { x: point.x + dx * t, y: point.y + dy * t };
}

let diagramCounter = 0;

/* Does the segment from p along (dx, dy) pass through the box centred on c? */
function crosses(p, dx, dy, c, halfW, halfH) {
  const t = ((c.x - p.x) * dx + (c.y - p.y) * dy) / (dx * dx + dy * dy || 1);
  if (t <= 0.05 || t >= 0.95) return false;
  return Math.abs(p.x + t * dx - c.x) < halfW && Math.abs(p.y + t * dy - c.y) < halfH;
}

/* mode: "full" (title and legend), "thumb" (a pattern card), "mini" (a technique, tighter grid). */
function renderDiagram(block, opts) {
  const mode = (opts && opts.mode) || "full";
  const cfg = mode === "mini" ? Object.assign({}, GUIDE.config.diagram, GUIDE.config.diagramMini) : GUIDE.config.diagram;
  const tones = GUIDE.config.tones;
  const nodes = ensureArray(block.nodes, "diagram nodes");
  if (nodes.length === 0) throw new Error("Diagram has no nodes");

  diagramCounter += 1;
  const uid = `dg${diagramCounter}`;
  const byId = new Map();
  for (const node of nodes) {
    if (byId.has(node.id)) log.warn("Duplicate diagram node id; the later one wins", { id: node.id });
    byId.set(node.id, node);
  }

  const maxCol = Math.max(...nodes.map((n) => Number(n.col) || 0));
  const maxRow = Math.max(...nodes.map((n) => Number(n.row) || 0));
  const width = cfg.pad * 2 + maxCol * cfg.cellW + cfg.boxW;
  const height = cfg.pad * 2 + maxRow * cfg.cellH + cfg.boxH;
  const origin = (n) => ({ x: cfg.pad + (Number(n.col) || 0) * cfg.cellW, y: cfg.pad + (Number(n.row) || 0) * cfg.cellH });
  const center = (n) => {
    const o = origin(n);
    return { x: o.x + cfg.boxW / 2, y: o.y + cfg.boxH / 2 };
  };

  const defs = svgEl("defs", null,
    svgEl("marker", { id: `${uid}-arrow`, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" },
      svgEl("path", { d: "M0,0 L10,5 L0,10 z", class: "dg-arrowhead" })),
    svgEl("filter", { id: `${uid}-rough`, x: "-4%", y: "-8%", width: "108%", height: "116%" },
      svgEl("feTurbulence", { type: "fractalNoise", baseFrequency: cfg.roughFrequency, numOctaves: 2, seed: diagramCounter, result: "noise" }),
      svgEl("feDisplacementMap", { in: "SourceGraphic", in2: "noise", scale: cfg.roughScale }))
  );

  const edgeLayer = svgEl("g", { class: "dg-edges" });
  const labelLayer = svgEl("g", { class: "dg-edge-labels" });
  let hasAsync = false;
  const halfW = cfg.boxW / 2;
  const halfH = cfg.boxH / 2;

  const edges = ensureArray(block.edges, "diagram edges");
  const pairKey = (edge) => [edge.from, edge.to].sort().join("|");
  const pairCount = new Map();
  edges.forEach((edge) => pairCount.set(pairKey(edge), (pairCount.get(pairKey(edge)) || 0) + 1));
  const pairSeen = new Map();
  const arced = [];
  let minY = 0;
  let maxY = height;
  for (const edge of edges) {
    safeRun(`diagram edge ${edge.from} -> ${edge.to}`, () => {
      const a = byId.get(edge.from);
      const b = byId.get(edge.to);
      if (!a || !b) throw new Error(`Unknown node in edge ${edge.from} -> ${edge.to}`);
      const pa = center(a);
      const pb = center(b);
      const dx = pb.x - pa.x;
      const dy = pb.y - pa.y;
      const length = Math.hypot(dx, dy) || 1;
      /* Two edges between the same boxes would draw on top of each other; bow them apart. */
      const key = pairKey(edge);
      const count = pairCount.get(key);
      const slot = pairSeen.get(key) || 0;
      pairSeen.set(key, slot + 1);
      const side = edge.from === key.split("|")[0] ? 1 : -1;
      let bend = Number(edge.bend) || (count > 1 ? side * (slot - (count - 1) / 2) * cfg.pairBend : 0);
      /* A straight edge that would cross another box arcs over it, away from the middle of the drawing. */
      if (!bend && nodes.some((n) => n !== a && n !== b && crosses(pa, dx, dy, center(n), halfW, halfH))) {
        const outward = (pa.y + pb.y) / 2 < height / 2 ? -1 : 1;
        bend = outward * (dx >= 0 ? 1 : -1) * cfg.boxH * 1.4;
        arced.push(`${edge.from}->${edge.to}`);
      }
      const control = { x: (pa.x + pb.x) / 2 + (-dy / length) * bend, y: (pa.y + pb.y) / 2 + (dx / length) * bend };
      const start = boxExit(pa, control.x - pa.x, control.y - pa.y, halfW, halfH, cfg.edgeGap);
      const end = boxExit(pb, control.x - pb.x, control.y - pb.y, halfW, halfH, cfg.edgeGap + cfg.arrowGap);
      const d = bend
        ? `M${start.x.toFixed(1)},${start.y.toFixed(1)} Q${control.x.toFixed(1)},${control.y.toFixed(1)} ${end.x.toFixed(1)},${end.y.toFixed(1)}`
        : `M${start.x.toFixed(1)},${start.y.toFixed(1)} L${end.x.toFixed(1)},${end.y.toFixed(1)}`;
      if (bend) {
        const peakY = 0.25 * start.y + 0.5 * control.y + 0.25 * end.y;
        minY = Math.min(minY, peakY - 14);
        maxY = Math.max(maxY, peakY + 14);
      }
      if (edge.async) hasAsync = true;
      const eid = `${edge.from}>${edge.to}` + (slot ? `#${slot + 1}` : "");
      edgeLayer.append(svgEl("g", { "data-e": eid },
        svgEl("path", { d, class: "fv-hit" }),
        svgEl("path", { d, class: edge.async ? "dg-edge async" : "dg-edge", "marker-end": `url(#${uid}-arrow)` })));
      if (edge.label) {
        const lx = bend ? 0.25 * start.x + 0.5 * control.x + 0.25 * end.x : (start.x + end.x) / 2;
        /* A label on a level, straight edge sits just above the line rather than across it. */
        const level = !bend && Math.abs(end.y - start.y) < 2;
        const ly = bend ? 0.25 * start.y + 0.5 * control.y + 0.25 * end.y : (start.y + end.y) / 2 - (level ? 9 : 0);
        labelLayer.append(svgEl("text", { x: lx.toFixed(1), y: ly.toFixed(1), class: "dg-edge-label", "text-anchor": "middle", "dominant-baseline": "middle" }, edge.label));
      }
    });
  }

  if (arced.length) log.debug("Edges arced around a box", { diagram: block.title, edges: arced });
  const nodeLayer = svgEl("g", { class: "dg-nodes" });
  const usedTones = new Set();
  for (const node of nodes) {
    safeRun(`diagram node ${node.id}`, () => {
      let tone = node.tone;
      if (!Object.prototype.hasOwnProperty.call(tones, tone)) {
        log.warn("Unknown node tone; drawing it as a service", { id: node.id, tone });
        tone = "service";
      }
      usedTones.add(tone);
      const o = origin(node);
      const labelLines = wrapText(node.label, cfg.labelChars, 2);
      const subLines = node.sub ? wrapText(node.sub, cfg.subChars, 1) : [];
      const total = labelLines.length * cfg.labelLine + subLines.length * cfg.subLine;
      let cursor = o.y + (cfg.boxH - total) / 2;
      const cx = o.x + cfg.boxW / 2;
      const texts = [];
      for (const line of labelLines) {
        texts.push(svgEl("text", { x: cx, y: (cursor + cfg.labelLine * 0.78).toFixed(1), class: "dg-label", "text-anchor": "middle" }, line));
        cursor += cfg.labelLine;
      }
      for (const line of subLines) {
        texts.push(svgEl("text", { x: cx, y: (cursor + cfg.subLine * 0.76).toFixed(1), class: "dg-sub", "text-anchor": "middle" }, line));
        cursor += cfg.subLine;
      }
      nodeLayer.append(svgEl("g", { class: `dg-node tone-${tone}`, "data-n": node.id },
        svgEl("rect", { x: o.x, y: o.y, width: cfg.boxW, height: cfg.boxH, rx: cfg.boxRadius, class: "dg-box", filter: `url(#${uid}-rough)` }),
        texts));
    });
  }

  const svg = svgEl("svg", {
    viewBox: `0 ${minY.toFixed(1)} ${width} ${(maxY - minY).toFixed(1)}`,
    role: "img",
    "aria-label": block.title || "Architecture diagram",
    "data-width": width,
    style: mode === "full" ? `min-width:${Math.round(width * cfg.minWidthRatio)}px` : mode === "mini" ? `max-width:${width}px` : null
  }, defs, edgeLayer, nodeLayer, labelLayer);
  if (mode !== "full") return h("figure", { class: `diagram ${mode}`, "data-fig": block.figKey || null }, svg);

  const legendItems = [...usedTones].map((tone) => h("li", null, h("span", { class: `swatch tone-${tone}`, "aria-hidden": "true" }), tones[tone]));
  if (hasAsync) legendItems.push(h("li", null, h("span", { class: "swatch edge-async", "aria-hidden": "true" }), LABELS.asyncEdge));

  return h("div", { class: "blk blk-diagram" },
    blockTitle(block.title),
    h("figure", { class: "diagram", "data-fig": block.figKey || null }, svg),
    h("ul", { class: "legend", "aria-label": "Diagram legend" }, legendItems));
}

function renderDive(block) {
  return h("article", { class: "blk dive" },
    h("h5", null, block.title),
    block.nfr ? h("p", { class: "serves" }, LABELS.serves, block.nfr) : null,
    block.problem ? h("p", { class: "problem" }, inline(block.problem)) : null,
    h("dl", null, ensureArray(block.options, "dive options").map((option) => [
      h("dt", null, inline(option.name)),
      h("dd", null, inline(option.take))
    ])),

const BLOCK_RENDERERS = {
  list: (block) => h("div", { class: "blk blk-list" },
    blockTitle(block.title),
    h(block.ordered ? "ol" : "ul", null, ensureArray(block.items, "list items").map((item) => h("li", null, inline(item))))),
  defs: (block) => h("div", { class: "blk blk-defs" },
    blockTitle(block.title),
    h("dl", null, ensureArray(block.items, "definitions").map((item) => [
      h("dt", null, inline(item.term)),
      h("dd", null, inline(item.desc))
    ]))),
  code: (block) => h("div", { class: "blk blk-code" },
    blockTitle(block.title),
    h("pre", null, h("code", null, String(block.code ?? "").replace(/^\n+|\s+$/g, "")))),
  math: (block) => h("div", { class: "blk blk-math" },
    blockTitle(block.title),
    h("ul", null, ensureArray(block.lines, "math lines").map((line) => h("li", null, inline(line)))),
    block.conclusion ? h("p", { class: "conclusion" }, inline(block.conclusion)) : null),
  note: (block) => h("p", { class: "blk blk-note" }, inline(block.text)),
  diagram: renderDiagram,
  dive: renderDive,
  /* { type: "fig", key } draws FIGURES.DIA[key] from figures/figures.js, the same figure the tracker and loop pages show. */
  fig: (block) => {
    const f = window.FIGURES && window.FIGURES.DIA[block.key];
    if (!f) throw new Error(`No shared figure ${block.key}`);
    const art = h("div", { class: "fig-svg" });
    art.innerHTML = f.svg();
    const cap = h("figcaption");
    cap.innerHTML = f.cap;
    return h("div", { class: "blk blk-diagram" }, blockTitle(block.title || f.title), h("figure", { class: "diagram shared", "data-fig": block.key }, art, cap));
  }
};

function renderBlock(block, context) {
  const type = block && block.type;
  const renderer = BLOCK_RENDERERS[type];
  if (!renderer) {
    log.warn("Unknown board block type", { type, context });
    return errorPanel(LABELS.blockFailed);
  }
  return safeRun(`render ${type} block in ${context}`, () => renderer(block), () => errorPanel(LABELS.blockFailed));
}

/* ------------------------------------------------------------------ */
/* Framework hero                                                      */
/* ------------------------------------------------------------------ */

function heroGeometry() {
  const cfg = GUIDE.config.hero;
  const count = GUIDE.framework.length;
  const gap = count > 1 ? (cfg.width - cfg.marginX * 2 - cfg.boxW) / (count - 1) : 0;
  return GUIDE.framework.map((_, i) => ({ x: cfg.marginX + i * gap, y: cfg.boxY }));
}

function renderFrameworkHero() {
  const cfg = GUIDE.config.hero;
  const container = document.getElementById("framework");
  if (!container) throw new Error("Framework container #framework is missing");
  const boxes = heroGeometry();

  const defs = svgEl("defs", null,
    svgEl("marker", { id: "fw-arrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" },
      svgEl("path", { d: "M0,0 L10,5 L0,10 z", class: "fw-arrowhead" })),
    svgEl("marker", { id: "fw-arc-arrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" },
      svgEl("path", { d: "M0,0 L10,5 L0,10 z", class: "fw-arc-head" })));

  const arcs = svgEl("g", { class: "fw-arcs" });
  for (const arc of ensureArray(cfg.arcs, "hero arcs")) {
    safeRun("hero arc", () => {
      const from = boxes[arc.from];
      const to = boxes[arc.to];
      if (!from || !to) throw new Error(`Arc refers to a missing step: ${arc.from} -> ${arc.to}`);
      const sx = from.x + cfg.boxW / 2;
      const ex = to.x + cfg.boxW * arc.endRatio;
      const mx = (sx + ex) / 2;
      arcs.append(svgEl("path", { d: `M${sx},${cfg.boxY} Q${mx},${arc.controlY} ${ex},${cfg.boxY - 3}`, class: "fw-arc", "marker-end": "url(#fw-arc-arrow)" }));
      arcs.append(svgEl("text", { x: mx, y: arc.labelY, class: "fw-arc-label", "text-anchor": "middle" }, arc.label));
    });
  }

  const arrows = svgEl("g", { class: "fw-arrows" });
  for (let i = 0; i < boxes.length - 1; i += 1) {
    const y = cfg.boxY + cfg.boxH / 2;
    arrows.append(svgEl("path", { d: `M${boxes[i].x + cfg.boxW + 4},${y} L${boxes[i + 1].x - 5},${y}`, class: "fw-arrow", "marker-end": "url(#fw-arrow)" }));
  }

  const stepLayer = svgEl("g", { class: "fw-steps" });
  GUIDE.framework.forEach((step, i) => {
    safeRun(`hero step ${step.id}`, () => {
      const { x, y } = boxes[i];
      const nameLines = wrapText(step.name, cfg.nameChars, 2);
      const nameTop = y + (nameLines.length === 1 ? 38 : 28);
      const timeText = step.optional ? `${step.time}, ${LABELS.optional}` : step.time;
      const group = svgEl("g", {
        class: "fw-step",
        tabindex: 0,
        role: "link",
        "data-step": step.id,
        "aria-label": `Step ${step.n}: ${step.name}, ${timeText}`
      },
        svgEl("rect", { x, y, width: cfg.boxW, height: cfg.boxH, rx: cfg.boxRadius, class: step.optional ? "fw-box optional" : "fw-box" }),
        svgEl("circle", { cx: x + 12, cy: y + 2, r: cfg.circleR, class: "fw-num-bg" }),
        svgEl("text", { x: x + 12, y: y + 6.5, class: "fw-num", "text-anchor": "middle" }, step.n),
        nameLines.map((line, li) => svgEl("text", { x: x + cfg.boxW / 2, y: nameTop + li * cfg.nameLine, class: "fw-name", "text-anchor": "middle" }, line)),
        svgEl("text", { x: x + cfg.boxW / 2, y: y + cfg.boxH - 12, class: "fw-time", "text-anchor": "middle" }, timeText));
      const go = () => navigate("framework", step.id);
      group.addEventListener("click", go);
      group.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          go();
        }
      });
      stepLayer.append(group);
    });
  });

  const svg = svgEl("svg", { viewBox: `0 0 ${cfg.width} ${cfg.height}`, role: "group", "aria-label": "The six steps of the delivery framework" },
    defs, arcs, arrows, stepLayer);
  container.replaceChildren(svg, h("figcaption", null, LABELS.heroCaption));
  log.info("Framework hero rendered", { steps: GUIDE.framework.length });
}

function setHeroActive(stepId) {
  document.querySelectorAll(".fw-step").forEach((node) => {
    node.classList.toggle("active", node.getAttribute("data-step") === stepId);
  });
}

/* Routes and links                                                    */
/* ------------------------------------------------------------------ */

/* Three tabs. Every page is #/<tab>[/<id>][/<anchor>]:
   #/framework/<step>, #/patterns/<pattern>/<technique>, #/designs/<design>/<step>. */
const TABS = ["framework", "patterns", "designs"];

const state = { page: null, observer: null, patternIndex: null };

function hrefFor(...parts) {
  return `#/${parts.filter(Boolean).map((part) => encodeURIComponent(part)).join("/")}`;
}

function link(parts, content, attrs) {
  const href = hrefFor(...parts);
  return h("a", Object.assign({
    href,
    onclick: () => {
      if (window.location.hash === href) handleRoute();
    }
  }, attrs || {}), content);
}

function navigate(...parts) {
  const next = hrefFor(...parts);
  log.debug("Navigate", { to: next });
  if (window.location.hash === next) handleRoute();
  else window.location.hash = next;
}

function anchorId(viewId, stepId) {
  return `${viewId}--${stepId}`;
}

function designById(id) {
  return GUIDE.examples.find((ex) => ex.id === id) || null;
}

function split(side, main, isGallery) {
  return h("div", { class: isGallery ? "split gallery" : "split" }, side, h("div", { class: "main" }, main));
}

/* ------------------------------------------------------------------ */
/* Pattern library                                                     */
/* ------------------------------------------------------------------ */

function patternLabels() {
  return (GUIDE.patterns && GUIDE.patterns.labels) || {};
}

function patternGroups() {
  return ensureArray(GUIDE.patterns && GUIDE.patterns.groups, "pattern groups");
}

function patternIndex() {
  if (!state.patternIndex) {
    state.patternIndex = new Map(patternGroups().map((group) => [group.id, group]));
  }
  return state.patternIndex;
}

function fillTemplate(template, values) {
  return String(template ?? "").replace(/\{(\w+)\}/g, (match, key) => (key in values ? String(values[key]) : match));
}

function groupsByFamily() {
  const groups = patternGroups();
  return ensureArray(GUIDE.patterns && GUIDE.patterns.families, "pattern families")
    .map((family) => ({ family, groups: groups.filter((group) => group.family === family.id) }))
    .filter((entry) => entry.groups.length > 0);
}

function familyOf(group) {
  return ensureArray(GUIDE.patterns && GUIDE.patterns.families, "pattern families").find((f) => f.id === group.family) || null;
}

function patternUsageFor(exampleId) {
  return (GUIDE.patternUsage && GUIDE.patternUsage[exampleId]) || null;
}

/* Which designs use a pattern, and why: the inverse of GUIDE.patternUsage. */
function designsUsing(groupId) {
  const found = [];
  for (const example of GUIDE.examples) {
    const usage = patternUsageFor(example.id);
    const use = usage && ensureArray(usage.uses, `${example.id} pattern usage`).find((u) => u.group === groupId);
    if (use) found.push({ example, use });
  }
  return found;
}

function renderPatternDiagram(group, mode) {

function validatePatterns() {
  if (!GUIDE.patterns) {
    log.info("No pattern library defined; skipping pattern validation");
    return 0;
  }
  let issues = 0;
  const families = new Set(ensureArray(GUIDE.patterns.families, "pattern families").map((f) => f.id));
  const tones = GUIDE.config.tones;
  const seenGroups = new Set();
  for (const group of patternGroups()) {
    for (const field of ["id", "family", "name", "definition", "techniques"]) {
      if (!group[field]) {
        issues += 1;
        log.warn("Pattern group is missing a field", { group: group.id, field });
      }
    }
    if (seenGroups.has(group.id)) {
      issues += 1;
      log.warn("Duplicate pattern group id", { group: group.id });
    }
    seenGroups.add(group.id);
    if (!families.has(group.family)) {
      issues += 1;
      log.warn("Pattern group has an unknown family", { group: group.id, family: group.family });
    }
    const seenTechniques = new Set();
    for (const technique of ensureArray(group.techniques, `${group.id} techniques`)) {
      if (!technique.id || !technique.name || !technique.short) {
        issues += 1;
        log.warn("Technique is missing id, name, or short definition", { group: group.id, technique: technique.id });
      }
      if (seenTechniques.has(technique.id)) {
        issues += 1;
        log.warn("Duplicate technique id in group", { group: group.id, technique: technique.id });
      }
      seenTechniques.add(technique.id);
      const dg = technique.diagram;
      if (!dg) continue;
      const ids = new Set(ensureArray(dg.nodes, "technique diagram nodes").map((n) => n.id));
      const cells = new Set();
      for (const node of ensureArray(dg.nodes, "technique diagram nodes")) {
        const cell = `${node.col},${node.row}`;
        if (cells.has(cell) || !Object.prototype.hasOwnProperty.call(tones, node.tone)) {
          issues += 1;
          log.warn("Technique diagram node shares a cell or has an unknown tone", { group: group.id, technique: technique.id, node: node.id });
        }
        cells.add(cell);
      }
      for (const edge of ensureArray(dg.edges, "technique diagram edges")) {
        if (!ids.has(edge.from) || !ids.has(edge.to)) {
          issues += 1;
          log.warn("Technique diagram edge names an unknown node", { group: group.id, technique: technique.id, edge: `${edge.from}->${edge.to}` });
        }
      }
    }
  }
  const index = patternIndex();
  const exampleIds = new Set(GUIDE.examples.map((ex) => ex.id));
  for (const [exampleId, usage] of Object.entries(GUIDE.patternUsage || {})) {
    if (!exampleIds.has(exampleId)) {
      issues += 1;
      log.warn("Pattern usage refers to an unknown design", { example: exampleId });
    }
    for (const use of ensureArray(usage.uses, `${exampleId} pattern usage`)) {
      const group = index.get(use.group);
      if (!group) {
        issues += 1;
        log.warn("Pattern usage refers to an unknown group", { example: exampleId, group: use.group });
        continue;
      }
      const known = new Set(ensureArray(group.techniques, `${group.id} techniques`).map((t) => t.id));
      for (const entry of ensureArray(use.techniques, `${exampleId}/${use.group} techniques`)) {
        if (!known.has(entry.id)) {
          issues += 1;
          log.warn("Pattern usage refers to an unknown technique", { example: exampleId, group: use.group, technique: entry.id });
        }
      }
    }
    for (const entry of ensureArray(usage.notNeeded, `${exampleId} not-needed patterns`)) {
      for (const id of ensureArray(entry.groups, `${exampleId} not-needed groups`)) {
        if (!index.has(id)) {
          issues += 1;
          log.warn("Not-needed entry refers to an unknown group", { example: exampleId, group: id });
        }
      }
    }
  }
  for (const ex of GUIDE.examples) {
    if (!patternUsageFor(ex.id)) log.info("Design has no pattern usage section", { example: ex.id });
  }
  log.info("Pattern library validated", { groups: seenGroups.size, issues });
  return issues;
}

/* The tabs of a design: the framework's six steps, then the patterns it uses. */
function designSteps(example) {
  const L = patternLabels();
  const steps = GUIDE.framework.map((step) => ({ id: step.id, n: step.n, name: step.name, step }));
  if (GUIDE.patterns && patternUsageFor(example.id)) steps.push({ id: L.usageAnchor, n: "+", name: L.navLabel });
  return steps;
}

function readVisited() {
  const all = safeRun("read visited steps", () => JSON.parse(Store.get(GUIDE.config.visitedKey) || "{}"), {});
  return all && typeof all === "object" ? all : {};
}

function markVisited(exampleId, stepId) {
  const all = readVisited();
  const list = Array.isArray(all[exampleId]) ? all[exampleId] : [];
  if (list.includes(stepId)) return new Set(list);
  list.push(stepId);
  all[exampleId] = list;
  Store.set(GUIDE.config.visitedKey, JSON.stringify(all));
  return new Set(list);
}

/* What a folded block hides, said in a few words; null when it hides nothing. */
function foldNote(block) {
  const count = (arr) => (Array.isArray(arr) ? arr.length : 0);
  const more = (n) => (n > 0 ? fillTemplate(LABELS.more, { n }) : null);
  switch (block.type) {
    case "list": return more(count(block.items) - 1);
    case "defs": return more(count(block.items) - 1);
    case "math": return more(count(block.lines) - (block.conclusion ? 0 : 1));
    case "code": {
      const lines = String(block.code ?? "").replace(/^\n+|\s+$/g, "").split("\n").length - GUIDE.config.fold.codeLines;
      return lines > 0 ? fillTemplate(LABELS.moreLines, { n: lines }) : null;
    }
    case "dive": return fillTemplate(LABELS.moreOptions, { n: count(block.options) });
    default: return null;
  }
}

function stickyOffset() {
  const bar = document.querySelector(".topbar");
  const strip = document.querySelector("#view .stepbar");
  const barH = bar && getComputedStyle(bar).position === "sticky" ? bar.offsetHeight : 0;
  return barH + (strip ? strip.offsetHeight : 0);
}

/* Fold a board so its step fits one screen: every block shows its title and first item,
   then trailing blocks give way (named in a line) until the step fits. */
function fitBoard(section) {
  const board = section && section.querySelector(".board, .ufold");
  if (!board || board.classList.contains("open") || section.hidden) return;
  const cfg = GUIDE.config.fold;
  const items = [...board.querySelectorAll(".fold-item")];
  const rest = board.querySelector(".board-rest");
  const toggle = board.querySelector(".board-toggle");
  items.forEach((b) => { b.hidden = false; });
  rest.hidden = true;
  toggle.hidden = false;
  board.style.removeProperty("--fold-fig");
  board.classList.remove("folded");
  const natural = board.offsetHeight;
  const budget = Math.max(cfg.minBoard, window.innerHeight - stickyOffset() - cfg.margin - (section.offsetHeight - board.offsetHeight));
  const note = () => {
    const dropped = items.filter((b) => b.hidden);
    const titles = dropped.map((b) => b.querySelector("h5, h4")).filter(Boolean).map((t) => t.textContent);
    rest.textContent = titles.length ? (board.classList.contains("ufold") ? LABELS.alsoHere : LABELS.alsoOnBoard) + titles.join(", ") : fillTemplate(LABELS.more, { n: dropped.length });
    rest.hidden = dropped.length === 0;
    return dropped;
  };
  /* Later diagrams give way first (they are the tallest), then parts from the end; the first part (after any
     opening note) always stays.
     If one part is still too tall, fold tighter (a dive keeps its title) and try again. */
  const keep = Math.max(0, items.findIndex((b) => !b.classList.contains("blk-note")));
  const order = [...items.keys()].slice(keep + 1).reverse();
  const drop = order.filter((i) => items[i].querySelector(".diagram")).concat(order.filter((i) => !items[i].querySelector(".diagram")));
  /* Diagrams scale down before anything is dropped, but no smaller than floor px. */
  const scaleFigs = (floor) => {
    board.style.removeProperty("--fold-fig");
    const svgs = [...board.querySelectorAll(".fold-item:not([hidden]) .diagram svg")];
    if (!svgs.length || board.offsetHeight <= budget) return;
    const tallest = Math.max(...svgs.map((svg) => svg.getBoundingClientRect().height));
    const target = Math.floor(tallest - (board.offsetHeight - budget) / svgs.length);
    board.style.setProperty("--fold-fig", `${Math.max(floor, target)}px`);
  };
  /* Whole parts first: every list stays complete (a table of entities is the point of its step) and
     later parts give way, from the end. Only if that is not enough do lists fold to their first items. */
  for (const i of drop) {
    if (board.offsetHeight <= budget) break;
    items[i].hidden = true;
  }
  if (board.offsetHeight <= budget) {
    if (!note().length) toggle.hidden = true;
    return;
  }
  board.classList.add("folded");
  const shrink = () => {
    items.forEach((b) => { b.hidden = false; });
    note();
    scaleFigs(cfg.figFloor);
    for (const i of drop) {
      if (board.offsetHeight <= budget) break;
      items[i].hidden = true;
      note();
      scaleFigs(cfg.figFloor);
    }
  };
  board.classList.remove("tight");
  shrink();
  if (board.offsetHeight > budget) {
    board.classList.add("tight");
    shrink();
  }
  /* A narrow screen may not have room for the opening note too. */
  for (let i = 0; i < keep && board.offsetHeight > budget; i += 1) {
    items[i].hidden = true;
    note();
    scaleFigs(cfg.figFloor);
  }
  const dropped = note();
  /* Still too tall: let the diagrams go smaller, down to minFig. */
  if (board.offsetHeight > budget) scaleFigs(cfg.minFig);
  if (!dropped.length && natural - board.offsetHeight < cfg.minSaving) {
    board.classList.remove("folded", "tight");
    board.style.removeProperty("--fold-fig");
    toggle.hidden = true;
  }
}

/* The foot of a foldable part: what is left out, and the toggle that shows it all. */
function foldFoot(board) {
  const toggle = h("button", { type: "button", class: "board-toggle", "aria-expanded": "false" }, LABELS.showAll);
  const rest = h("p", { class: "board-rest", hidden: true });
  toggle.addEventListener("click", () => {
    const section = board.closest(".step");
    if (board.classList.contains("open")) {
      board.classList.remove("open");
      fitBoard(section);
      const top = board.getBoundingClientRect().top - stickyOffset();
      if (top < 0) window.scrollTo({ top: window.scrollY + top - 8, behavior: "instant" });
    } else {
      board.classList.add("open");
      board.classList.remove("folded", "tight");
      board.style.removeProperty("--fold-fig");
      board.querySelectorAll(".fold-item").forEach((b) => { b.hidden = false; });
      rest.hidden = true;
    }
    const open = board.classList.contains("open");
    toggle.textContent = open ? LABELS.showLess : LABELS.showAll;
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
  });
  return h("div", { class: "board-foot" }, rest, toggle);
}

function renderBoard(blocks, context) {
  const body = blocks.map((block) => {
    const node = renderBlock(block, context);
    node.classList.add("fold-item");
    const note = safeRun(`fold note ${context}`, () => foldNote(block), null);
    if (note && node.tagName !== "P") node.append(h("p", { class: "blk-more" }, note));
    if (block.type === "dive") node.append(h("p", { class: "blk-more tight-more" }, fillTemplate(LABELS.moreDive, { n: ensureArray(block.options, `${context} dive options`).length })));
    if (block.type === "math" && block.conclusion) node.classList.add("has-conclusion");
    return node;
  });
  const board = h("div", { class: "board" }, h("h4", { class: "board-title" }, LABELS.board), body);
  board.append(foldFoot(board));
  return board;
}

/* The talk track and the probes, each behind its own toggle, shut until you have tried. */
function renderTray(data, context, uid) {

function renderDesignPage(example) {

/* Show one step of the design on screen: the tab bar marks where you are and what you have seen. */
function showStep(example, key) {
  const article = document.querySelector("#view .example");
  if (!article) return null;
  const steps = designSteps(example);
  let at = steps.findIndex((s) => s.id === key);
  if (at < 0) {
    if (key) log.warn("Unknown step in the URL; showing the first step", { design: example.id, step: key });
    at = 0;
  }
  const current = steps[at].id;
  const visited = markVisited(example.id, current);
  Store.set(GUIDE.config.storageKey, `designs/${example.id}/${current}`);
  let section = null;
  article.querySelectorAll(".steps > .step").forEach((node) => {
    node.hidden = node.getAttribute("data-step") !== current;
    if (!node.hidden) section = node;
  });
  article.querySelectorAll(".stepbar a[data-step]").forEach((a) => {
    const id = a.getAttribute("data-step");
    a.classList.toggle("current", id === current);
    a.classList.toggle("visited", visited.has(id) && id !== current);
    if (id === current) {
      a.setAttribute("aria-current", "step");
      const list = a.closest(".stepbar-list");
      if (list && list.scrollWidth > list.clientWidth) list.scrollLeft = a.offsetLeft - (list.clientWidth - a.offsetWidth) / 2;
    } else a.removeAttribute("aria-current");
  });
  const count = article.querySelector(".stepbar-count");
  if (count) count.textContent = fillTemplate(LABELS.stepOf, { n: at + 1, total: steps.length });
  safeRun("fold board", () => fitBoard(section));
  return section;
}

/* On a pattern page, mark the technique in view in the sticky index. */
function observeTechniques(groupId) {
  if (state.observer) {
    state.observer.disconnect();
    state.observer = null;
  }
  if (!groupId || !("IntersectionObserver" in window)) return;
  const sections = [...document.querySelectorAll("#view .tech")];
  if (sections.length === 0) return;
  const links = new Map([...document.querySelectorAll("#view .patbar a[data-tech]")].map((a) => [a.getAttribute("data-tech"), a]));
  const visible = new Set();
  state.observer = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (entry.isIntersecting) visible.add(entry.target);
      else visible.delete(entry.target);
    }
    const first = sections.find((section) => visible.has(section));
    if (!first) return;
    const techId = first.id.slice("tech--".length);
    links.forEach((a, key) => {
      a.classList.toggle("current", key === techId);
      const list = a.parentElement && a.parentElement.parentElement;
      if (key === techId && list && list.scrollWidth > list.clientWidth) list.scrollLeft = a.offsetLeft - (list.clientWidth - a.offsetWidth) / 2;
    });
  }, { rootMargin: "-25% 0px -60% 0px", threshold: 0 });
  sections.forEach((section) => state.observer.observe(section));
}

/* Arrow keys and a sideways swipe follow the page's previous and next links. */
function go(dir) {
  const target = [...document.querySelectorAll(`#view [data-go="${dir}"]`)].find((a) => a.offsetParent !== null);
  if (!target) return false;
  target.click();
  return true;
}

function bindMovement() {
  document.addEventListener("keydown", (event) => {
    if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    const t = event.target;
    if (t && t.closest && t.closest("input, textarea, select, [contenteditable], #tabs")) return;
    if (go(event.key === "ArrowRight" ? "next" : "prev")) event.preventDefault();
  });
  const view = document.getElementById("view");
  let touch = null;
  view.addEventListener("touchstart", (event) => {
    const t = event.touches[0];
    const inDesign = Boolean(event.target.closest(".example .steps"));
    const scroller = event.target.closest("pre, .diagram, .tbl-wrap, .stepbar");
    touch = event.touches.length === 1 && inDesign && !scroller ? { x: t.clientX, y: t.clientY } : null;
  }, { passive: true });
  view.addEventListener("touchend", (event) => {
    if (!touch) return;
    const t = event.changedTouches[0];
    const dx = t.clientX - touch.x;
    const dy = t.clientY - touch.y;
    touch = null;
    if (Math.abs(dx) > GUIDE.config.fold.swipe && Math.abs(dx) > 2 * Math.abs(dy)) go(dx < 0 ? "next" : "prev");
  }, { passive: true });
  let timer = 0;
  const refit = () => {
    const section = document.querySelector("#view .example .steps > .step:not([hidden])");
    if (section) safeRun("refit board", () => fitBoard(section));
  };
  window.addEventListener("resize", () => {
    window.clearTimeout(timer);
    timer = window.setTimeout(refit, 150);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
}

function renderView(route) {
  const root = document.getElementById("view");
  if (!root) throw new Error("View container #view is missing");
  const content = safeRun(`render ${route.tab}`, () => {
    if (route.tab === "patterns") {
      const group = route.id ? patternIndex().get(route.id) : null;
      return split(renderPatternSide(route.id), group ? renderPatternPage(group) : renderPatternsGallery(), !group);
    }
    if (route.tab === "designs") {
      const example = route.id ? designById(route.id) : null;
      return split(renderDesignSide(route.id), example ? renderDesignPage(example) : renderDesignsGallery(), !example);
    }
    return renderFrameworkView();
  }, () => errorPanel(LABELS.viewFailed));
  root.replaceChildren(content);
  if (route.tab === "framework") {
    safeRun("render framework hero", renderFrameworkHero, () => {
      const container = document.getElementById("framework");
      if (container) container.replaceChildren(errorPanel(LABELS.blockFailed));
    });
  }
  state.page = route.page;
  Store.set(GUIDE.config.storageKey, route.page);
  safeRun("observe techniques", () => observeTechniques(route.tab === "patterns" ? route.id : null));
  log.info("View rendered", { page: route.page });
}

/* ------------------------------------------------------------------ */
/* Routing                                                             */
/* ------------------------------------------------------------------ */

function parseHash(hash) {
  return String(hash || "").replace(/^#\/?/, "").split("/").filter(Boolean)
    .map((part) => safeRun("decode hash part", () => decodeURIComponent(part), part));
}

/* Links written before the three tabs existed: #/overview, #/overview/pattern-<id>,
   #/overview/<step>, #/<design>/<step>. Accelerate and old bookmarks still use them. */
function upgradeLegacy(parts) {
  const [head, key] = parts;
  if (head === "overview") {
    if (!key) return ["framework"];
    if (key === "patterns") return ["patterns"];
    if (key.startsWith("pattern-")) return ["patterns", key.slice("pattern-".length)];
    return ["framework", key];
  }
  if (designById(head)) return ["designs", ...parts];
  return null;
}

function currentRoute() {
  let parts = parseHash(window.location.hash);
  if (parts.length === 0) parts = parseHash(Store.get(GUIDE.config.storageKey));
  if (parts.length && !TABS.includes(parts[0])) {
    const upgraded = upgradeLegacy(parts);
    if (!upgraded) log.warn("Unknown route; showing the framework", { parts });
    parts = upgraded || ["framework"];
    safeRun("rewrite legacy link", () => window.history.replaceState(null, "", hrefFor(...parts)));
  }
  const tab = parts[0] || "framework";
  let id = parts[1] || null;
  let key = parts[2] || null;
  if (tab === "framework") {
    key = id;
    id = null;
  }
  if (tab === "patterns" && id && !patternIndex().has(id)) {
    log.warn("Unknown pattern in the URL; showing all patterns", { id });
    id = null;
    key = null;
  }
  if (tab === "designs" && id && !designById(id)) {
    log.warn("Unknown design in the URL; showing all designs", { id });
    id = null;
    key = null;
  }
  return { tab, id, key, page: id ? `${tab}/${id}` : tab };
}

function openAncestors(node) {
  let current = node;
  while (current) {
    if (current.tagName === "DETAILS" && !current.open) current.open = true;
    current = current.parentElement;
  }
}

function anchorFor(route) {
  if (route.tab === "framework") return anchorId("framework", route.key);
  if (route.tab === "patterns") return `tech--${route.key}`;
  return anchorId(route.id, route.key);
}

/* A new page lands at once; a jump within the page glides. */
function scrollToAnchor(route, changed) {
  const target = document.getElementById(anchorFor(route));
  if (!target) {
    log.warn("Anchor not found on this page", { page: route.page, anchor: route.key });
    return;
  }
  openAncestors(target);
  window.requestAnimationFrame(() => target.scrollIntoView({ block: "start", behavior: changed ? "instant" : "smooth" }));
}

function handleRoute() {
  safeRun("handle route", () => {
    const route = currentRoute();
    const changed = state.page !== route.page;
    if (changed) renderView(route);
    updateTabs(route.tab);
    if (route.tab === "framework") setHeroActive(route.key);
    const example = route.tab === "designs" && route.id ? designById(route.id) : null;
    if (example) {
      /* One step at a time. A new design with a step in the URL opens at that step; moving
         between steps keeps your place unless you had scrolled past the step's top. */
      showStep(example, route.key);
      const steps = document.querySelector("#view .steps");
      const top = steps ? Math.max(0, steps.getBoundingClientRect().top + window.scrollY - stickyOffset()) : 0;
      if (changed) window.scrollTo({ top: route.key ? top : 0, behavior: "instant" });
      else if (window.scrollY > top) window.scrollTo({ top, behavior: "instant" });
      return;
    }
    if (route.key) scrollToAnchor(route, changed);
    else if (changed) window.scrollTo({ top: 0, behavior: "instant" });
  });
}

/* ------------------------------------------------------------------ */
/* Validation and boot                                                 */
/* ------------------------------------------------------------------ */

/* Every diagram gets a stable key for its notes (figures/notes-sd.js): "sd:" + the id of
   the technique or design it belongs to, plus its title when it has one. */
function assignFigKeys() {
  const seen = new Map();
  const slug = (t) => String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
  (function walk(o, owner) {
    if (Array.isArray(o)) { o.forEach((x) => walk(x, owner)); return; }
    if (!o || typeof o !== "object") return;
    if (Array.isArray(o.nodes) && Array.isArray(o.edges)) {
      let key = "sd:" + owner + (o.title ? ":" + slug(o.title) : "");
      const n = (seen.get(key) || 0) + 1;
      seen.set(key, n);
      if (n > 1) key += "-" + n;
      o.figKey = key;
      return;
    }
    const next = typeof o.id === "string" ? o.id : owner;
    for (const k of Object.keys(o)) walk(o[k], next);
  })(GUIDE, "guide");
}

function validateGuide() {
  const seen = new Set();
  let issues = 0;
  for (const example of GUIDE.examples) {
    for (const field of ["id", "title", "prompt", "steps"]) {
      if (!example[field]) {
        issues += 1;
        log.warn("Example is missing a required field", { example: example.id, field });
      }
    }
    if (seen.has(example.id)) {
      issues += 1;
      log.warn("Duplicate example id", { id: example.id });
    }
    seen.add(example.id);
    for (const step of GUIDE.framework) {
      const data = example.steps && example.steps[step.id];
      if (!data) {
        issues += 1;
        log.warn("Example has no content for a step", { example: example.id, step: step.id });
        continue;
      }
      for (const field of ["board", "reasoning", "script"]) {
        if (!Array.isArray(data[field]) || data[field].length === 0) {
          issues += 1;
          log.warn("Step is missing content", { example: example.id, step: step.id, field });
        }
      }
    }
  }
  issues += safeRun("validate patterns", validatePatterns, 0);
  log.info("Content validated", { examples: GUIDE.examples.length, issues });
}

function renderFooter() {
  const foot = document.getElementById("foot");
  if (!foot) return;
  const source = GUIDE.config.frameworkSource;
  foot.replaceChildren(h("p", null, "Framework structure and timings follow ",
    h("a", { href: source.url, target: "_blank", rel: "noopener noreferrer" }, source.label),
    ". Worked examples, numbers, and scripts are illustrative starting points for practice."));
}

window.addEventListener("error", (event) => {
  log.error("Uncaught error", { message: event.message, source: event.filename, line: event.lineno, column: event.colno });
});
window.addEventListener("unhandledrejection", (event) => {
  log.error("Unhandled promise rejection", describeError(event.reason));
});

function boot() {
  safeRun("boot", () => {
    log.info("Starting guide", { examples: GUIDE.examples.length, steps: GUIDE.framework.length });
    validateGuide();
    assignFigKeys();
    safeRun("render tabs", renderTabs);
    safeRun("render footer", renderFooter);
    window.addEventListener("hashchange", handleRoute);
    safeRun("bind movement", bindMovement);
    handleRoute();
    log.info("Guide ready", { page: state.page });
  }, () => {
    const root = document.getElementById("view");
    if (root) root.replaceChildren(errorPanel(LABELS.viewFailed));
  });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
<script src="private/sd.js"></script>
