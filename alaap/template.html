<style>
/* The diagrams (Alaap's svg primitives, below) name their own colours. They map onto the tokens
   here and nowhere else: four categorical colours, each tinted from the token itself. */
:root{
  --fg:var(--ink); --line:var(--rule); --box:var(--surface); --box2:var(--sunken); --edge:var(--muted);
  --a1:var(--cat-1); --a2:var(--cat-5); --a3:var(--cat-2); --a4:var(--cat-4);
  --a1b:color-mix(in srgb,var(--cat-1) 12%,var(--surface)); --a2b:color-mix(in srgb,var(--cat-5) 12%,var(--surface));
  --a3b:color-mix(in srgb,var(--cat-2) 12%,var(--surface)); --a4b:color-mix(in srgb,var(--cat-4) 12%,var(--surface));
  --top:48px;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--top) + var(--s4))}
body{background:var(--bg);color:var(--ink);font:var(--w-regular) var(--fs-md)/var(--lh-body) var(--font);margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--s5)}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-sm)}
h1,h2,h3,h4{font-weight:var(--w-strong);line-height:var(--lh-tight);color:var(--ink)}
h1{font-size:var(--fs-2xl);margin:var(--s6) 0 var(--s3)}
h2{font-size:var(--fs-xl);margin:var(--s6) 0 var(--s2)}
h3{font-size:var(--fs-lg);margin:var(--s5) 0 var(--s2)}
h4{font-size:var(--fs-md);margin:var(--s4) 0 var(--s1)}
p{margin:var(--s2) 0}
p,li,blockquote,figcaption,.lede{max-width:var(--measure)}
ol,ul{padding-left:var(--s5)}
li{margin:var(--s1) 0}
code,.mono{font-family:var(--mono);font-size:var(--fs-code);background:var(--code-bg);color:var(--code-ink);padding:1px var(--s1);border-radius:var(--radius-sm)}
pre{font-family:var(--mono);font-size:var(--fs-code);line-height:1.5;background:var(--code-bg);color:var(--code-ink);border-radius:var(--radius);padding:var(--s3) var(--s4);overflow-x:auto;margin:var(--s2) 0}
pre code{background:none;padding:0}
blockquote{margin:var(--s3) 0;padding:0 0 0 var(--s3);border-left:2px solid var(--rule);color:var(--soft)}
blockquote p{margin:var(--s1) 0}
table{border-collapse:collapse;width:100%;margin:var(--s4) 0;font-size:var(--fs-sm)}
th,td{border-bottom:var(--hair);padding:var(--s2) var(--s3) var(--s2) 0;text-align:left;vertical-align:top}
th{font-weight:var(--w-strong);color:var(--soft)}
hr{border:0;border-top:var(--hair);margin:var(--s6) 0}
.ok{color:var(--ok);font-weight:var(--w-strong)} .warn,.bad{color:var(--warn);font-weight:var(--w-strong)}
.repo{font-family:var(--mono);font-size:var(--fs-code);color:var(--soft);border-bottom:1px dotted var(--muted);cursor:help}
.sm,.sub,.lede{color:var(--soft)}
.sm{font-size:var(--fs-sm)}
figure{margin:var(--s4) 0 0;padding:var(--s4);background:var(--surface);border:var(--hair);border-radius:var(--radius-lg);overflow-x:auto}

.lab{font-size:var(--fs-sm);font-weight:var(--w-strong);color:var(--soft)}
/* short lists of names read as one muted line, not as pills */
.chips{list-style:none;padding:0;margin:var(--s1) 0;font-size:var(--fs-sm);color:var(--muted)}
.chips li{display:inline;margin:0}
.chips li+li::before{content:" \00b7  "}

/* top bar */
.sn-strip{max-width:1200px}
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:var(--hair)}
.topin{display:flex;align-items:stretch;gap:var(--s5);min-height:var(--top)}
.brand{font-size:var(--fs-lg);font-weight:var(--w-strong);color:var(--ink);text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:var(--s2)}
.brand img{border-radius:var(--radius-sm)}
.tabs{display:flex;gap:var(--s1);flex:1;min-width:0;overflow-x:auto}
.tabs a{display:flex;align-items:center;color:var(--soft);text-decoration:none;padding:0 var(--s3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:var(--w-strong)}

/* the plan: a stage index on the left, one stage at a time on the right */
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--s6);padding-bottom:var(--s7)}
.side{position:sticky;top:var(--top);align-self:start;max-height:calc(100vh - var(--top));overflow-y:auto;scrollbar-width:thin;padding:var(--s5) 0 var(--s4);font-size:var(--fs-sm)}
.side ol{list-style:none;margin:0;padding:0}
.side li{margin:0}
.side .msh{font-size:var(--fs-xs);color:var(--muted);margin:var(--s3) 0 2px;padding-left:var(--s3);display:flex;align-items:center;gap:var(--s2)}
.side .msh::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.side .msh.m1::before{background:var(--cat-2)} .side .msh.m2::before{background:var(--cat-1)} .side .msh.m3::before{background:var(--cat-5)}
.side .msh.m0::before{display:none}
.side a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px var(--s3);color:var(--soft);text-decoration:none;border-left:2px solid var(--rule);line-height:var(--lh-tight)}
.side a:hover{color:var(--ink)}
.side a.on{color:var(--ink);border-left-color:var(--accent);font-weight:var(--w-strong);background:var(--accent-soft)}
.side .sn{display:inline-block;width:18px;margin-right:var(--s2);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.main{min-width:0;max-width:880px}
.lead{padding-top:var(--s1)}
#tab-plan > .lead h1{margin-bottom:0}
.lead .big{margin-top:var(--s3)}
.kcards{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:var(--s1) var(--s4);margin:var(--s2) 0 var(--s3)}
.kc{display:contents}
.kc p{margin:0}
.ms{margin-top:var(--s5);padding-left:var(--s3);border-left:3px solid var(--muted)}
#ms-1{border-left-color:var(--cat-2)} #ms-2{border-left-color:var(--cat-1)} #ms-3{border-left-color:var(--cat-5)}
.ms h2{margin:0;font-size:var(--fs-lg)}
.ms p{margin:var(--s1) 0 0}
.pm{font-size:var(--fs-sm);color:var(--muted);font-weight:var(--w-regular)}
.stage{padding-top:var(--s5)}
.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 var(--s1);margin:0 0 var(--s1)}
.sh .pn{order:0;font-size:var(--fs-sm);color:var(--muted)}
.sh .pm{order:1}
.sh .pm::before{content:"\00b7\00a0"}
.sh h3{order:2;flex-basis:100%;margin:var(--s1) 0 0;font-size:var(--fs-xl)}
.srcs{margin:var(--s1) 0 var(--s3)}
.acc{font-size:var(--fs-sm);color:var(--muted);margin:var(--s2) 0}

.acc a{text-decoration:none}

/* labelled parts: a small label and a hairline, nothing boxed */
.k{margin:var(--s3) 0;padding:0 0 0 var(--s3);border-left:2px solid var(--rule)}
.k .lab{display:block;margin-bottom:2px}
.k pre{margin:var(--s2) 0 var(--s1)}
.k ol,.k ul{margin:var(--s1) 0;padding-left:var(--s5)}
.stage > .k.after,.stage > .k.why{border-left-color:var(--muted)}
.gs{font-size:var(--fs-lg);margin:var(--s6) 0 var(--s2);padding-top:var(--s4);border-top:var(--hair)}
.gs .num{font-size:var(--fs-sm);font-weight:var(--w-regular);color:var(--muted);margin-right:var(--s1)}
.gs .hrs,.gs .flag{font-size:var(--fs-sm);font-weight:var(--w-regular);color:var(--muted);margin-left:var(--s2)}
.gs .flag strong{font-weight:var(--w-regular)}
.partopen{margin-top:var(--s6);padding-top:var(--s4);border-top:var(--hair)}
.partopen > .lab{margin:0 0 var(--s2)}
.partopen > .lab .pm{margin-left:var(--s2)}
.tt{margin:var(--s6) 0 0;padding-top:var(--s4);border-top:var(--hair)}
.tt header{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 var(--s3)}
.tt h4{margin:0;font-size:var(--fs-lg)}
.ttn{font-size:var(--fs-sm);color:var(--muted);flex-basis:100%}
.tt .sub{font-size:var(--fs-sm)}
.tt .src{margin-left:auto;font-size:var(--fs-sm)}
.io,.meta{display:grid;grid-template-columns:120px minmax(0,1fr);gap:var(--s1) var(--s4);margin:var(--s3) 0}
.io dt,.meta dt{font-size:var(--fs-sm);font-weight:var(--w-strong);color:var(--soft);padding-top:2px}
.io dd,.meta dd{margin:0}
.meta{padding:var(--s3) var(--s4);background:var(--sunken);border-radius:var(--radius);font-size:var(--fs-sm)}
.meta dt{padding-top:0}
.meta .chips{margin:0;color:inherit}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--s5);margin-top:var(--s3)}
.cols .lab{margin:0}
.cols ol{margin:var(--s1) 0;padding-left:var(--s5)}
.rq{margin:var(--s3) 0}
.rq summary,.exit summary{cursor:pointer;font-size:var(--fs-sm);color:var(--accent)}
.rq ol{padding-left:var(--s5)}
.rq li{margin:var(--s2) 0}
.rq li b{font-weight:var(--w-strong)}
.archfig{margin-top:var(--s6)}
.to-arch{font-size:var(--fs-sm);font-weight:var(--w-regular);margin-left:var(--s2)}
.exit{margin-top:var(--s6);padding:var(--s3) var(--s4);background:var(--sunken);border-radius:var(--radius-lg)}
.exit p{margin:0}
.exit .lab{margin-right:var(--s2)}
.exit details p{margin:var(--s2) 0 0;color:var(--soft)}
.pager{display:flex;justify-content:space-between;gap:var(--s4);margin-top:var(--s6);padding-top:var(--s4);border-top:var(--hair);font-size:var(--fs-sm)}
.pager a{text-decoration:none;max-width:48%}
.pager a:hover{text-decoration:underline}
.pager .next{margin-left:auto;text-align:right}
/* progress, kept in this browser: a done control on each stage, a check in the index, one line on the overview */
.markbox{display:inline-flex;align-items:baseline;gap:var(--s2);font-size:var(--fs-sm)}
.sh .markbox{order:1;margin-left:auto}
.markend{margin-top:var(--s5)}
.mark{font:inherit;color:var(--accent);background:none;border:var(--hair);border-radius:var(--radius);padding:var(--s1) var(--s3);cursor:pointer}
.mark:hover{border-color:var(--accent)}
.mark.undo{border-color:transparent;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.mark.undo:hover{color:var(--ink)}
.okd{color:var(--ok);font-weight:var(--w-strong)}
.side a.done .sn{color:var(--ok)}
.track{margin:var(--s4) 0 0;padding:var(--s3) var(--s4);background:var(--sunken);border-radius:var(--radius-lg);display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s4)}
.track p{margin:0;font-size:var(--fs-sm);color:var(--soft);flex:1 1 280px}
.track .go{display:inline-block;background:var(--accent);color:var(--surface);text-decoration:none;font-weight:var(--w-strong);padding:var(--s2) var(--s4);border-radius:var(--radius)}
.track .go:hover{text-decoration:underline}

/* architecture and the two documents: the contents stay beside the text */
.arch,.doc{display:grid;grid-template-columns:260px minmax(0,1fr);column-gap:var(--s6);padding-bottom:var(--s7)}
.arch > *,.doc > *{grid-column:2;min-width:0}
.arch > h1,.doc > h1{margin-top:var(--s6) !important}
.contents{grid-column:1;grid-row:1 / span 200;position:sticky;top:var(--top);align-self:start;max-height:calc(100vh - var(--top));overflow-y:auto;padding:var(--s5) 0 var(--s4);font-size:var(--fs-sm)}
.contents b{font-size:var(--fs-xs);font-weight:var(--w-regular);color:var(--muted);padding-left:var(--s3)}
.contents ol{list-style:none;margin:var(--s1) 0 0;padding:0}
.contents li{margin:0}
.contents a{display:block;padding:3px var(--s3);color:var(--soft);text-decoration:none;border-left:2px solid var(--rule);line-height:var(--lh-tight)}
.contents a:hover{color:var(--ink)}
.contents a.on{color:var(--ink);border-left-color:var(--accent);font-weight:var(--w-strong);background:var(--accent-soft)}
.lede{margin:var(--s1) 0 var(--s3)}
.note{border-left:2px solid var(--rule);padding:0 0 0 var(--s3);margin:var(--s4) 0;color:var(--soft)}
{{ARCH_CSS}}
/* diagram text in the page's face; headings in sentence case */
.t,.tm,.hd{font-family:var(--font)}
.hd{text-transform:none;letter-spacing:0}

[hidden]{display:none !important}
@media (max-width:980px){
  .split,.arch,.doc{grid-template-columns:minmax(0,1fr);gap:0}
  .arch > *,.doc > *,.contents{grid-column:1;grid-row:auto}
  .side,.contents{position:sticky;top:var(--top);z-index:5;background:var(--bg);max-height:none;padding:var(--s2) 0;border-bottom:var(--hair);overflow:visible}
  .contents{position:static}
  .side ol,.contents ol{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:2px}
  .side ol,.contents ol,.tabs{scrollbar-width:none}
  .side .msh,.contents b{display:none}
  .side a,.contents a{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;background:none}
  .side a.on,.contents a.on{border-bottom-color:var(--accent);background:none}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .wrap{padding:0 var(--s4)}
  table{display:block;overflow-x:auto}
  .repo{overflow-wrap:anywhere}
  .brand span{display:none}
  .io,.meta,.kcards{grid-template-columns:minmax(0,1fr)}
  .kc .lab{margin-top:var(--s2)}
  .pager{flex-direction:column}
  .pager a{max-width:none}
}
</style>

{{ARCH_DEFS}}
<div class="sn-strip"><nav class="sn-top" data-site-nav data-here="alaap"></nav></div>
<header class="topbar"><div class="wrap topin">
  <a class="brand" href="#/plan"><img src="brand/alaap.svg" width="20" height="20" alt=""><span>Alaap and TrenTorch</span></a>
  <nav class="tabs" aria-label="Sections">
    <a href="#/plan" data-tab="plan">The plan</a>
    <a href="#/architecture" data-tab="architecture">Architecture</a>
    <a href="#/status" data-tab="status">Where Alaap stands</a>
    <a href="#/accent" data-tab="accent">Accent and rights</a>
  </nav>
</div></header>

<main class="wrap">
<section id="tab-plan" data-tab="plan">
{{PLAN}}
</section>
<section id="tab-architecture" data-tab="architecture" class="arch" hidden>{{ARCH}}</section>
<section id="tab-status" data-tab="status" class="doc" hidden><h1>{{STATUS_TITLE}}</h1>{{STATUS}}</section>
<section id="tab-accent" data-tab="accent" class="doc" hidden><h1>{{ACCENT_TITLE}}</h1>{{ACCENT}}</section>
</main>

<script>
"use strict";
/* Routes: #/<tab>[/<anchor>]. #/guide/... is the older name of #/plan/... and still works.
   The plan shows its overview, or one stage: #/plan/stage-7, or any anchor inside a stage
   (#/plan/s1-2, #/plan/tt-06, #/plan/ten-hours) opens that stage and scrolls to the anchor. */
(function () {
  var TABS = ["plan", "architecture", "status", "accent"];
  var plan = document.getElementById("tab-plan");
  var stages = [].slice.call(plan.querySelectorAll(".stage"));
  var overview = [].slice.call(plan.querySelectorAll(".main > .lead, .main > .ms"));
  var title = document.createElement("h1");
  title.textContent = "Alaap and TrenTorch: one study plan";
  var rail = plan.querySelector(".side ol");
  var current = null;

  function stageFor(id) {
    var el = id ? document.getElementById(id) : null;
    return el && el.closest ? el.closest("#tab-plan .stage") : null;
  }

  /* One-time set-up: the page title, an overview link, milestone colours, each stage's
     milestone in its header, and previous and next links under every stage. */
  function setup() {
    var lead = plan.querySelector(".main > .lead");
    if (lead) { lead.insertBefore(title, lead.firstChild); }
    var top = document.createElement("li");
    top.innerHTML = '<a href="#/plan"><span class="sn"></span>Overview</a>';
    rail.insertBefore(top, rail.firstChild);
    var m = 0;
    rail.querySelectorAll(".msh").forEach(function (li) { m += 1; li.classList.add(li.textContent === "Appendix" ? "m0" : "m" + m); });
    plan.querySelectorAll(".ms").forEach(function (ms) {
      var name = ms.querySelector("h2").textContent.replace(" · ", ", ");
      var el = ms.nextElementSibling;
      while (el && el.classList.contains("stage")) {
        msOf[el.id] = name;
        var pm = el.querySelector(".sh .pm");
        if (pm) { pm.textContent += " · " + name; }
        el = el.nextElementSibling;
      }
    });
    /* the two documents get the same contents list as the architecture tab, from their headings */
    document.querySelectorAll("section.doc").forEach(function (doc) {
      var tab = doc.getAttribute("data-tab");
      var items = [].map.call(doc.querySelectorAll("h2[id]"), function (h) {
        return '<li><a href="#/' + tab + "/" + h.id + '">' + h.textContent.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</a></li>";
      });
      if (!items.length) { return; }
      var nav = document.createElement("nav");
      nav.className = "contents";
      nav.setAttribute("aria-label", "Contents");
      nav.innerHTML = "<b>Contents</b><ol>" + items.join("") + "</ol>";
      doc.insertBefore(nav, doc.firstChild);
    });
    var links = [].slice.call(rail.querySelectorAll("a"));
    links.forEach(function (a, i) {
      a.title = label(a);
      var st = stageFor(a.getAttribute("href").split("/").pop());
      if (!st) { return; }
      var nav = document.createElement("nav");
      nav.className = "pager";
      nav.setAttribute("aria-label", "Previous and next stage");
      var prev = links[i - 1], next = links[i + 1];
      nav.innerHTML = (prev ? '<a class="prev" href="' + prev.getAttribute("href") + '">Previous: ' + label(prev) + "</a>" : "") +
        (next ? '<a class="next" href="' + next.getAttribute("href") + '">Next: ' + label(next) + "</a>" : "");
      st.appendChild(nav);
    });
    setupProgress(lead);
  }

  /* Progress, kept in this browser only, under its own key:
     {v: 1, done: {"<stage>": iso date}, last: {stage: n, at: iso date}}.
     Storage can be missing or blocked; the page then works for the visit and says so. */
  var KEY = "alaap.progress.v1";
  var stored = true;
  var prog = load();
  var S = [];
  var msOf = {};
  var track = null;

  function load() {
    var raw = null, o = null;
    try { raw = window.localStorage.getItem(KEY); } catch (err) { stored = false; }
    try { o = JSON.parse(raw || "null"); } catch (err) { o = null; }
    o = o && typeof o === "object" ? o : {};
    return {
      v: 1,
      done: o.done && typeof o.done === "object" ? o.done : {},
      last: o.last && typeof o.last.stage === "number" ? o.last : null
    };
  }

  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(prog)); stored = true; } catch (err) { stored = false; }
  }

  function markbox(s, long) {
    var b = document.createElement("span");
    b.className = "markbox";
    b.innerHTML = '<span class="okd" hidden></span><button type="button" class="mark"></button>';
    b.lastChild.setAttribute("data-n", s.n);
    if (long) { b.lastChild.setAttribute("data-long", "1"); }
    s.boxes.push(b);
    return b;
  }

  function setupProgress(lead) {
    stages.forEach(function (st) {
      var m = /^stage-(\d+)$/.exec(st.id);
      if (!m) { return; }
      var h = /([\d.]+) h/.exec((st.querySelector(".sh .pm") || {}).textContent || "");
      var link = rail.querySelector('a[href="#/plan/' + st.id + '"]');
      var s = { n: +m[1], el: st, title: st.querySelector(".sh h3").textContent, hours: h ? parseFloat(h[1]) : 0,
                ms: msOf[st.id] || "", link: link, sn: link ? link.querySelector(".sn") : null,
                label: link ? label(link) : "", boxes: [] };
      st.querySelector(".sh").appendChild(markbox(s, false));
      var end = document.createElement("div");
      end.className = "markend";
      end.appendChild(markbox(s, true));
      st.insertBefore(end, st.querySelector(".pager"));
      S.push(s);
    });
    track = document.createElement("div");
    track.className = "track";
    track.innerHTML = '<p></p><a class="go"></a>';
    if (lead) { lead.insertBefore(track, title.nextSibling); }
    plan.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("button.mark") : null;
      if (!b) { return; }
      var n = b.getAttribute("data-n");
      if (prog.done[n]) { delete prog.done[n]; } else { prog.done[n] = new Date().toISOString(); }
      save();
      paint();
    });
  }

  function hrs(h) { return Math.round(h * 10) / 10 + " h"; }

  function day(iso) {
    var d = new Date(iso);
    return isNaN(d.getTime()) ? "" : ", " + d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }

  /* where to pick up: the stage last opened, unless it is done; then the first stage not done */
  function nextStage() {
    var last = prog.last ? S.filter(function (s) { return s.n === prog.last.stage; })[0] : null;
    if (last && !prog.done[last.n]) { return last; }
    return S.filter(function (s) { return !prog.done[s.n]; })[0] || null;
  }

  function paint() {
    var n = 0, h = 0, total = 0;
    S.forEach(function (s) {
      var at = prog.done[s.n];
      total += s.hours;
      if (at) { n += 1; h += s.hours; }
      s.boxes.forEach(function (b) {
        var ok = b.firstChild, btn = b.lastChild;
        ok.hidden = !at;
        ok.textContent = at ? "✓ Done" + day(at) : "";
        btn.textContent = at ? "Undo" : btn.getAttribute("data-long") ? "Mark stage " + s.n + " done" : "Mark done";
        btn.className = at ? "mark undo" : "mark";
      });
      if (s.link) {
        s.link.classList.toggle("done", !!at);
        if (s.sn) { s.sn.textContent = at ? "✓" : String(s.n); }
        s.link.setAttribute("aria-label", s.label + (at ? ", done" : ""));
      }
    });
    if (!track) { return; }
    var next = nextStage();
    var line = n + " of " + S.length + " stages done · " + hrs(h) + " of " + hrs(total) + " · " +
      (next ? next.ms : S.length ? S[S.length - 1].ms : "");
    if (!stored) { line += ". Progress is not saved in this browser."; }
    track.firstChild.textContent = line;
    var go = track.lastChild;
    go.hidden = !next;
    if (next) {
      go.href = "#/plan/stage-" + next.n;
      go.textContent = (prog.last || n ? "Continue" : "Start") + ": stage " + next.n + ", " + next.title;
    }
  }

  function visited(st) {
    var s = S.filter(function (x) { return x.el === st; })[0];
    if (!s) { return; }
    prog.last = { stage: s.n, at: new Date().toISOString() };
    save();
  }

  function label(a) {
    var n = a.querySelector(".sn");
    var num = n ? n.textContent : "";
    var text = a.textContent.slice(num.length);
    return num ? "Stage " + num + ", " + text : text;
  }

  function parse() {
    var parts = (window.location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    if (parts[0] === "guide") { parts[0] = "plan"; }
    return { tab: TABS.indexOf(parts[0]) >= 0 ? parts[0] : "plan", anchor: parts[1] || null };
  }

  function show(tab) {
    document.querySelectorAll("main > section[data-tab]").forEach(function (s) {
      s.hidden = s.getAttribute("data-tab") !== tab;
    });
    document.querySelectorAll(".tabs a").forEach(function (a) {
      if (a.getAttribute("data-tab") === tab) { a.setAttribute("aria-current", "page"); } else { a.removeAttribute("aria-current"); }
    });
  }

  /* The plan tab: the overview, or the one stage that holds the anchor. */
  function showPlan(anchor) {
    var st = stageFor(anchor);
    stages.forEach(function (s) { s.hidden = s !== st; });
    overview.forEach(function (el) { el.hidden = !!st; });
    rail.querySelectorAll("a").forEach(function (a) {
      var on = st ? stageFor(a.getAttribute("href").split("/").pop()) === st : a.getAttribute("href") === "#/plan";
      a.classList.toggle("on", on);
      if (on) { a.setAttribute("aria-current", "true"); } else { a.removeAttribute("aria-current"); }
      if (on && a.scrollIntoView) { a.scrollIntoView({ block: "nearest", inline: "nearest" }); }
    });
    return st;
  }

  function markContents(tab, anchor) {
    document.querySelectorAll(".contents a").forEach(function (a) {
      a.classList.toggle("on", !!anchor && a.getAttribute("href") === "#/" + tab + "/" + anchor);
    });
  }

  function route() {
    try {
      var r = parse();
      if (r.tab !== current) { show(r.tab); current = r.tab; }
      var st = r.tab === "plan" ? showPlan(r.anchor) : null;
      if (r.tab !== "plan") { markContents(r.tab, r.anchor); }
      if (st) { visited(st); } else if (r.tab === "plan") { paint(); }
      var target = r.anchor ? document.getElementById(r.anchor) : null;
      if (target && target !== st) {
        var fold = target.closest ? target.closest("details") : null;
        if (fold) { fold.open = true; }
        target.scrollIntoView({ block: "start" });
      } else {
        window.scrollTo(0, 0);
      }
    } catch (err) {
      console.error("Could not show that part of the plan", err);
    }
  }

  if ("scrollRestoration" in window.history) { window.history.scrollRestoration = "manual"; }
  setup();
  paint();
  window.addEventListener("hashchange", route);
  route();
}());
</script>
</body>
</html>
