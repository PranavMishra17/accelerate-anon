body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }

.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); }

.loop { border: 1px solid var(--rule); border-radius: 10px; padding: 18px 22px 16px; margin: 0 0 16px; }
.loop .when { color: var(--muted); font-size: 15px; }
.loop h2 { font-size: 23px; line-height: 1.3; margin: 2px 0 6px; }
.loop h2 a { color: var(--ink); }
.loop .meta { color: var(--soft); margin: 0 0 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.loop .hrs { color: var(--muted); font-size: 15px; margin: 0; }
.loop .hrs b { color: var(--ink); font-weight: 700; }
.loop .bar { height: 6px; border-radius: 3px; background: var(--tint); margin: 8px 0 0; overflow: hidden; }
.loop .bar i { display: block; height: 100%; background: var(--muted); }
.loop.done .bar i { background: var(--ok); }
.loop .ok { color: var(--ok); font-weight: 700; }
.loop .ok svg { width: 16px; height: 16px; vertical-align: -2px; margin-right: 4px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.loop .go { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 14px 0 0; font-size: 15.5px; }
.loop .go a:first-child { font-weight: 700; }
@media (max-height: 560px) { .top { position: static; } }
@media (max-width: 720px) {

<script>
"use strict";
(function () {
  var LOOPS = JSON.parse(document.getElementById("hub-data").textContent);
  var TRACKER = "selfstudy.m1.planner";   /* the tracker's own store: read here, never written */
  var CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function done() {
    try { var t = JSON.parse(window.localStorage.getItem(TRACKER) || "{}"); return (t && t.done) || {}; }
    catch (err) { console.error("Could not read " + TRACKER, err); return {}; }
  }
  function hm(min) {
    if (!min) { return "0h"; }
    var h = Math.floor(min / 60), m = min % 60;
    return (h ? h + "h" : "") + (h && m ? " " : "") + (m || !h ? m + "m" : "");
  }

  function progress(L, d) {
    var n = L.sessions.length;
    if (!n) { return '<p class="hrs">Hours: none. No tracker sessions; the prep is on the loop page.</p>'; }
    var closed = L.sessions.filter(function (s) { return d[s.id]; });
    var banked = closed.reduce(function (a, s) { return a + s.min; }, 0);
    var all = closed.length === n;
    var line = all
      ? '<span class="ok">' + CHECK + "All " + n + " sessions closed</span>, " + hm(banked) + " banked"
      : "<b>" + closed.length + " of " + n + "</b> sessions closed, <b>" + hm(banked) + "</b> of " + hm(L.total) + " banked";
    return '<p class="hrs">' + n + " sessions, " + hm(L.total) + " in all. " + line + "</p>" +
      '<div class="bar" role="progressbar" aria-label="Hours banked" aria-valuemin="0" aria-valuemax="' + L.total + '" aria-valuenow="' + banked + '"><i style="width:' +
      (L.total ? Math.round(100 * banked / L.total) : 0) + '%"></i></div>';
  }

  function draw() {
    var d = done(), now = Date.now(), next = null;
    document.getElementById("loops").innerHTML = LOOPS.map(function (L) {
      var past = new Date(L.when_iso).getTime() <= now;
      if (!past) { next = L; }
      var all = L.sessions.length && L.sessions.every(function (s) { return d[s.id]; });
      return '<article class="loop' + (all ? " done" : "") + '">' +
        '<div class="when">' + (past ? "Happened, " + esc(L.date) : "Upcoming, " + esc(L.when)) + "</div>" +
        '<h2><a href="' + esc(L.href) + '">' + esc(L.title) + "</a></h2>" +
        '<p class="meta">' + esc(L.subtitle) + ". " + esc(L.who) + " " + esc(L.format) + "</p>" +
        progress(L, d) +
        '<div class="go"><a href="' + esc(L.href) + '">Open the loop page</a>' +
        L.links.map(function (k) { return '<a href="' + esc(k.url) + '" target="_blank" rel="noopener" title="' + esc(k.title) + '">' + esc(k.label) + "</a>"; }).join("") +
        "</div></article>";
    }).join("");
    document.getElementById("lead").innerHTML = next
      ? "Next: <b>" + esc(next.title) + "</b>, " + esc(next.when) + "."
      : "No loop scheduled. Add one: a new <code>interviews/&lt;module&gt;.py</code>.";
  }

  draw();
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { draw(); } });
}());
</script>
