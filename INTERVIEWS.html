<!-- Generated by interviews/hub.py from the loop modules and the tracker's sessions.
     Edit those and rebuild; do not edit this file by hand. -->
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--fs-md)/var(--lh-body) var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm); }
code { font-family: var(--mono); font-size: var(--fs-code); background: var(--sunken); padding: 1px var(--s1); border-radius: var(--radius-sm); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 var(--s5); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s5); padding: var(--s4) 0 var(--s3); border-bottom: var(--hair); }
h1 { font-size: var(--fs-2xl); font-weight: var(--w-strong); line-height: var(--lh-tight); margin: 0; }
.lead { color: var(--soft); margin: var(--s4) 0 var(--s5); max-width: var(--measure); }
.lead b { color: var(--ink); font-weight: var(--w-strong); }

/* The loops: a grid of cards, newest first. A card is one neutral surface with the company
   name in its brand colour (--b, and --bd on the dark surface, given per card from the
   loop's module). The card reads its colours from four local variables; hover and focus
   swap them, so the card fills with the brand colour and every line of text takes the
   surface colour. Sizes: 12 meta, 13 round, context and links, plus the wordmark. */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s4); margin: 0 0 var(--s7); padding: 0; list-style: none; }
.loop {
  --brand: var(--b, var(--ink));
  --c-bg: var(--surface); --c-name: var(--brand); --c-ink: var(--ink); --c-soft: var(--soft); --c-muted: var(--muted); --c-rule: var(--rule);
  position: relative; display: flex; flex-direction: column; min-width: 0; padding: var(--s4);
  background: var(--c-bg); color: var(--c-ink); border: 1px solid var(--c-rule); border-radius: var(--radius);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .loop { --brand: var(--bd, var(--b, var(--ink))); } }
:root[data-theme="dark"] .loop { --brand: var(--bd, var(--b, var(--ink))); }
.loop:hover, .loop:focus-within {
  --c-bg: var(--brand); --c-name: var(--surface); --c-ink: var(--surface); --c-soft: var(--surface); --c-muted: var(--surface); --c-rule: var(--brand);
}
/* Colour only, quick and ease-out; no movement. 150 ms is the ceiling in DESIGN.md rule 10. */
.loop, .loop * { transition: background-color 150ms ease-out, color 150ms ease-out, border-color 150ms ease-out; }
@media (prefers-reduced-motion: reduce) { .loop, .loop * { transition: none; } }

/* The wordmark. DESIGN.md caps text at 24px; this is the one deliberate exception: a display
   wordmark, not text. fit() in the script sets its font size per card so the name fills the
   card's width; the rows then share one baseline. Same family, bold, tight tracking. */
.wm { display: flex; align-items: flex-end; margin: 0; min-height: 1em; font-size: var(--fs-lg); }
.co { display: inline-block; white-space: nowrap; color: var(--c-name); font-weight: 700; letter-spacing: -.035em; line-height: 1; padding-bottom: .04em; }
.co:hover { text-decoration: none; }
/* The stretched link: the whole card opens the loop page. */
.co::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: var(--radius); }
.co:focus-visible { outline: none; }
.co:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 3px; }
.rd { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--c-ink); margin: var(--s3) 0 0; }
.ctx { font-size: var(--fs-sm); color: var(--c-soft); margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ft { margin-top: auto; padding-top: var(--s5); }   /* progress and the bottom row sit on one line across a row */
.hrs { font-size: var(--fs-xs); color: var(--c-muted); margin: 0; }
.hrs b { color: var(--c-ink); font-weight: var(--w-strong); }
.bar { height: 2px; background: var(--c-rule); margin: var(--s2) 0 0; overflow: hidden; }
.loop:hover .bar, .loop:focus-within .bar { background: color-mix(in srgb, var(--surface) 30%, transparent); }
.bar i { display: block; height: 100%; background: var(--c-soft); }
.end { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2) var(--s3); padding-top: var(--s3); }
.go { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); font-size: var(--fs-sm); }
.go a { position: relative; z-index: 2; color: var(--c-soft); text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
.go a:hover { text-decoration-color: currentColor; }
.loop:hover .go a, .loop:focus-within .go a { text-decoration-color: currentColor; }
.go a:focus-visible { outline-color: currentColor; }
.tag { margin-left: auto; display: inline-flex; gap: var(--s2); align-items: center; font-size: var(--fs-xs); line-height: 1; color: var(--c-muted);
  border: 1px solid var(--c-rule); border-radius: var(--radius-sm); padding: var(--s1) var(--s2); white-space: nowrap; }
.tag b { color: var(--c-ink); font-weight: var(--w-strong); }
.loop:hover .tag, .loop:focus-within .tag { border-color: currentColor; }
.empty { background: var(--sunken); border-radius: var(--radius-lg); padding: var(--s5); max-width: var(--measure); }
.empty b { display: block; font-weight: var(--w-strong); }
.empty p { color: var(--soft); margin: var(--s1) 0 0; }
@media (max-width: 720px) {
  .wrap { padding: 0 var(--s4); }
  .top { padding: var(--s3) 0; }
}
</style>

<script>
"use strict";
(function () {
  var LOOPS = JSON.parse(document.getElementById("hub-data").textContent);
  var TRACKER = "selfstudy.m1.planner";   /* the tracker's own store: read here, never written */

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function done() {
    try { var t = JSON.parse(window.localStorage.getItem(TRACKER) || "{}"); return (t && t.done) || {}; }
    catch (err) { console.error("Could not read " + TRACKER, err); return {}; }
  }
  function hm(min) {
    if (!min) { return "0h"; }
    var h = Math.floor(min / 60), m = min % 60;
    return (h ? h + "h" : "") + (h && m ? " " : "") + (m || !h ? m + "m" : "");
  }

  function progress(L, d) {
    var n = L.sessions.length;
    if (!n) { return '<p class="hrs">No tracker sessions.</p>'; }
    var closed = L.sessions.filter(function (s) { return d[s.id]; });
    var banked = closed.reduce(function (a, s) { return a + s.min; }, 0);
    var line = closed.length === n
      ? "<b>All " + n + " sessions closed</b>, " + hm(banked)
      : "<b>" + closed.length + "</b> of " + n + " sessions, <b>" + hm(banked) + "</b> of " + hm(L.total);
    return '<p class="hrs">' + line + "</p>" +
      '<div class="bar" role="progressbar" aria-label="Hours banked" aria-valuemin="0" aria-valuemax="' + L.total + '" aria-valuenow="' + banked + '"><i style="width:' +
      (L.total ? Math.round(100 * banked / L.total) : 0) + '%"></i></div>';
  }

  function draw() {
    var d = done(), now = Date.now(), next = null;
    var grid = document.getElementById("loops"), lead = document.getElementById("lead");
    if (!LOOPS.length) {
      grid.outerHTML = '<div class="empty"><b>No interview loops yet.</b><p>Add one: write <code>interviews/&lt;module&gt;.py</code> with a <code>LOOP</code> dict, ' +
        "then run <code>python interviews/hub.py</code>. It appears here as a tile.</p></div>";
      lead.hidden = true;
      return;
    }
    grid.innerHTML = LOOPS.map(function (L) {
      var past = !!L.when_iso && new Date(L.when_iso).getTime() <= now;   /* no date yet: still to come */
      if (!past && !next) { next = L; }   // the first upcoming: cards are sorted soonest first
      var ctx = L.subtitle || L.company;
      var brand = (L.brand ? "--b:" + L.brand + ";" : "") + (L.brandDark ? "--bd:" + L.brandDark + ";" : "");
      return '<li class="loop"' + (brand ? ' style="' + esc(brand) + '"' : "") + ">" +
        '<h2 class="wm"><a class="co" href="' + esc(L.href) + '" target="_blank" rel="noopener" title="' + esc(L.when) + '" aria-label="' +
        esc(L.company + (L.round ? ", " + L.round : "") + ": loop page, opens in a new tab") + '">' + esc(L.company) + "</a></h2>" +
        (L.round ? '<p class="rd">' + esc(L.round) + "</p>" : "") +
        '<p class="ctx">' + esc(ctx) + "</p>" +
        '<div class="ft">' + progress(L, d) +
        '<div class="end"><div class="go">' +
        L.links.map(function (k) { return '<a href="' + esc(k.url) + '" target="_blank" rel="noopener" title="' + esc(k.title) + '">' + esc(k.label) + "</a>"; }).join("") +
        '</div><p class="tag">' +
        (past ? "Happened<span>" + esc(L.date) + "</span>" : "<b>Upcoming</b><span>" + (L.date ? esc(L.date) : "date to be set") + "</span>") +
        "</p></div></div></li>";
    }).join("");
    fit();
    var n = LOOPS.length + (LOOPS.length === 1 ? " loop" : " loops") + ", newest first. ";
    lead.innerHTML = next
      ? esc(n) + "Next: <b>" + esc(next.title) + "</b>. " + esc(next.when.replace(/\.$/, "")) + "."
      : esc(n) + "None is scheduled. A new loop is a new <code>interviews/&lt;module&gt;.py</code>.";
  }

  /* Every wordmark is one height: the size at which "Mphasis" fills a card's width. Each name
     then fills the width by its letter-spacing, wider for short names, tighter for long ones;
     a very long name that would need more than -0.12em is set smaller instead. The trailing
     space after the last letter is cancelled so the name ends at the card's edge. Then every
     wordmark in a grid row gets the tallest one's height, so the rounds below line up. */
  function fit() {
    var marks = [].slice.call(document.querySelectorAll(".wm"));
    if (!marks.length) { return; }
    marks.forEach(function (h) {
      h.style.minHeight = "";
      var s = h.firstChild.style;
      s.fontSize = "100px"; s.letterSpacing = ""; s.marginRight = "";
    });
    var probe = marks[0].firstChild.cloneNode(false);
    probe.textContent = "Mphasis";
    probe.style.cssText = "position:absolute;visibility:hidden;font-size:100px";
    marks[0].appendChild(probe);
    var avail = marks[0].clientWidth - 1;
    var size = Math.max(17, Math.floor(1000 * avail / probe.getBoundingClientRect().width) / 10);
    probe.remove();
    marks.forEach(function (h) {
      var co = h.firstChild, n = co.textContent.length;
      co.style.fontSize = size + "px";
      co.style.letterSpacing = "0px";
      var room = h.clientWidth - 1 - co.getBoundingClientRect().width;
      var ls = n > 1 ? room / (n - 1) : 0;
      if (ls < -0.12 * size) {   /* too long to tighten: smaller, at the base tracking */
        co.style.letterSpacing = "";
        co.style.fontSize = Math.max(17, Math.floor(1000 * (h.clientWidth - 1) / co.getBoundingClientRect().width * size / 100) / 10) + "px";
        return;
      }
      ls = Math.min(ls, 0.06 * size);   /* a short name is not stretched: it ends early instead */
      co.style.letterSpacing = ls.toFixed(2) + "px";
      co.style.marginRight = (-ls).toFixed(2) + "px";
    });
    var rows = {};
    marks.forEach(function (h) { var t = h.parentNode.offsetTop; rows[t] = Math.max(rows[t] || 0, h.getBoundingClientRect().height); });
    marks.forEach(function (h) { h.style.minHeight = rows[h.parentNode.offsetTop] + "px"; });
  }

  draw();
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { draw(); } });
  var grid = document.getElementById("loops"), width = 0;
  if (grid && window.ResizeObserver) {
    new ResizeObserver(function () { if (grid.clientWidth !== width) { width = grid.clientWidth; fit(); } }).observe(grid);
  }
  if (document.fonts) { document.fonts.ready.then(fit); }
}());
</script>
