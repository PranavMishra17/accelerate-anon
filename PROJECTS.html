<style>
/* One tab per project; inside it, a rail of the overview and its topics, one page at a time. Sizes, families and
   colours come from site/tokens.css (DESIGN.md). */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--w-regular) var(--fs-md)/var(--lh-body) var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm); }
p { margin: 0 0 var(--s3); }
ul { margin: 0 0 var(--s3); padding-left: var(--s5); } li { margin: var(--s1) 0; }

.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: var(--hair); }
.top-in { max-width: 1400px; margin: 0 auto; padding: var(--s2) var(--s5); display: flex; align-items: center; gap: var(--s5); flex-wrap: wrap; }
.top h1 { margin: 0; font-size: var(--fs-2xl); line-height: var(--lh-tight); font-weight: var(--w-strong); }
nav.tabs { display: flex; gap: var(--s1); }
nav.tabs a { color: var(--soft); padding: var(--s2) var(--s3); border-bottom: 2px solid transparent; }
nav.tabs a:hover { color: var(--ink); text-decoration: none; }
nav.tabs a[aria-current] { color: var(--ink); font-weight: var(--w-strong); border-bottom-color: var(--accent); }
.top .sn-top { margin-left: auto; }

.shell { max-width: 1400px; margin: 0 auto; padding: var(--s5) var(--s5) var(--s7); display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: var(--s6); align-items: start; }
.rail { position: sticky; top: calc(var(--top, 64px) + var(--s4)); border-left: var(--hair); }
.rail .grp { padding: var(--s4) var(--s3) var(--s1); color: var(--muted); font-size: var(--fs-sm); font-weight: var(--w-strong); }
.rail .grp:first-child { padding-top: 0; }
.rail a { display: flex; align-items: baseline; gap: var(--s2); padding: var(--s1) var(--s3); margin-left: -1px; border-left: 2px solid transparent; color: var(--soft); }
.rail a:hover { color: var(--ink); background: var(--sunken); text-decoration: none; }
.rail a[aria-current] { color: var(--ink); font-weight: var(--w-strong); border-left-color: var(--accent); }
.rail .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rule); flex: none; transform: translateY(-1px); }
.rail .dot.on { background: var(--accent); }
.rail .none { padding: var(--s1) var(--s3); color: var(--muted); font-size: var(--fs-sm); }

main { min-width: 0; }
.crumb { color: var(--muted); font-size: var(--fs-sm); margin-bottom: var(--s2); }
h2 { margin: 0 0 var(--s2); font-size: var(--fs-xl); line-height: var(--lh-tight); font-weight: var(--w-strong); }
.lead { max-width: var(--measure); color: var(--soft); margin-bottom: var(--s5); }
.video { max-width: 960px; margin: 0 0 var(--s5); }
.video video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: var(--radius); }
.video .wait { border: 1px dashed var(--rule); border-radius: var(--radius); padding: var(--s4); color: var(--muted); font-size: var(--fs-sm); }
.cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--s6); max-width: 1100px; }
.lab { margin: 0 0 var(--s2); color: var(--muted); font-size: var(--fs-sm); font-weight: var(--w-strong); }
.side .lab:not(:first-child) { margin-top: var(--s5); }
.points li { margin: var(--s2) 0; }
.points b { font-weight: var(--w-strong); }
.side ul { list-style: none; padding: 0; }
.code li { font-family: var(--mono); font-size: var(--fs-code); color: var(--soft); overflow-wrap: anywhere; }
.gaps li { color: var(--soft); }
.pager { display: flex; gap: var(--s4); margin-top: var(--s6); padding-top: var(--s4); border-top: var(--hair); font-size: var(--fs-sm); max-width: 1100px; }
.pager a { color: var(--soft); max-width: 48%; }
.pager .next { margin-left: auto; text-align: right; }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; padding: var(--s4) var(--s4) var(--s6); }
  .rail { position: static; border-left: 0; border-bottom: var(--hair); padding-bottom: var(--s3); }
  .cols { grid-template-columns: 1fr; gap: var(--s4); }
}
</style>

<script>
(function () {
  var D = {"projects": [{"id": "mockflow", "title": "MockFlow-AI", "tagline": "A voice mock-interview coach: it interviews out loud, reviews the code you submit, and scores how you deliver.", "links": [["Live site", "https://mockflow.pranavmishra.dedyn.io"], ["Code", "https://github.com/PranavMishra17/MockFlow-AI"]], "stack": ["Python 3.12, Flask", "LiveKit Agents over WebRTC", "Deepgram speech to text", "OpenAI model and speech", "Postgres", "Piston code execution", "Google Cloud e2-micro, Docker Compose, Caddy"], "topics": [{"id": "system", "title": "The system", "video": "mockflow-system", "lead": "A Flask app on one small VM starts one agent process per interview. The process joins a LiveKit room in the user's own project with the user's own keys, talks through Deepgram and OpenAI, saves the transcript and exits; a separate judge call scores it.", "points": ["Pieces: Flask on gunicorn (one process, eight threads), a per-interview worker subprocess, LiveKit Cloud, Deepgram, OpenAI, Postgres, and Caddy with automatic TLS on a Google Cloud e2-micro.", "Spawn before mint: the worker is started before the browser's token is minted, so a failed spawn never hands out a room with no interviewer, and a free credit is claimed only after a successful spawn.", "Readiness: the app waits three seconds and treats the worker as ready if the process is alive at eight; it does not yet confirm the agent joined the room.", "The interview: a fixed greeting spoken by code, stages with fallback timers checked every five seconds, the transcript saved on the closing line, then the worker exits.", "The verdict: the feedback page calls a judge model at temperature zero in JSON mode and stores the scores.", "The limit: one interview at a time. The container has 768 MB with 2 GB of swap; the app idles near 263 MB and a worker is estimated at 300 to 400 MB."], "code": ["app.py (/api/token, /api/feedback/verdict)", "worker_manager.py", "agent_worker.py", "deploy/gcp/docker-compose.yml", "deploy/gcp/Caddyfile"], "plan": [["Async jobs", "SYSTEM%20DESIGN.html#/patterns/long-running/async-job"], ["Worker pools", "SYSTEM%20DESIGN.html#/patterns/long-running/worker-pool"], ["WebSockets", "SYSTEM%20DESIGN.html#/patterns/real-time/websockets"]], "gaps": ["The live worker list is an in-memory dict, so a second web process or VM would break the one-interview cap.", "The architecture doc and README still describe the earlier Render setup."]}, {"id": "voice", "title": "The voice pipeline", "video": "mockflow-voice", "lead": "How the interviewer hears, decides you have finished, thinks, speaks and captions, with the settings the code actually uses.", "points": ["Hearing: Silero VAD tuned for a small CPU (0.3 second silence, 16 kHz) and Deepgram nova-2 with interim text.", "End of turn: no turn-detector model, so a turn ends on voice activity plus at least 0.8 seconds.", "Starting early: the per-answer assessment starts on interim text while the candidate is still talking and is reused if the final text matches; it has a 2.5 second budget, and a warm-up call at start avoids a three second cold call.", "Speaking: a gpt-4o-mini reply and OpenAI speech; barge-in is allowed except for the greeting, the closing and the coding time-out line.", "Captions: text streams arrive 33 ms after the first audio frame and are routed by track; the old data packet arrived 23.7 seconds late.", "Latency, honestly: text-only replies at p50 2.5 and p95 2.8 seconds, speech adding about a second; no runtime latency metrics yet."], "code": ["agent_worker.py (STT, LLM, TTS, VAD)", "interview_runtime.py (session settings)", "static/captions.js", "templates/interview.html"], "plan": [["Streaming", "SYSTEM%20DESIGN.html#/patterns/llm-cost/streaming"], ["WebSockets", "SYSTEM%20DESIGN.html#/patterns/real-time/websockets"]], "gaps": ["The voice architecture doc recommends settings the code does not use (a turn-detector model, shorter endpointing, a newer speech model, latency logging).", "A sub-400 ms figure appears only in that research doc and was never measured."]}, {"id": "agent", "title": "The interview agent", "video": "mockflow-agent", "lead": "The agent started as a model driving seven tools. Measured on twenty simulated interviews, it went silent and lost replies, so control moved into a code-owned turn loop over a state machine, and the model now only words each reply.", "points": ["Before: tools like transition_stage and ask_question let the model drive; it chained tools to the step limit and ended turns in silence, and a queued acknowledgement replaced real replies.", "The turn loop: the assessor classifies each answer, a coverage ledger records signals (levels only rise), and code decides whether to advance and which single move comes next.", "The move note: one instruction per turn, under 45 words, one question asked word for word; it is never shown in the transcript.", "The state machine: fixed stages and time limits per track, one path for every stage change, and a fallback timer that queues the next question as the reply to the candidate's next words.", "The closing: a line built in code with a sentinel; the interview finalizes only when the sentinel is spoken.", "Measured: across the same twenty personas, silent turns 18 to 0, praise turns 92 to 0, two-question turns 29 to 3, skips 8 to 0, and p95 6.0 to 2.8 seconds."], "code": ["interview_turn.py", "interview_coverage.py", "interview_runtime.py (prepare_turn, advance_to)", "fsm.py", "prompts.py", "docs/AGENT_AUDIT_2026-09.md"], "plan": [["State machines", "SYSTEM%20DESIGN.html#/patterns/multi-step/state-machine"], ["Policy gate", "SYSTEM%20DESIGN.html#/patterns/agent-safety/policy-gate"], ["Stateless loop", "SYSTEM%20DESIGN.html#/patterns/agent-durability/stateless-loop"]], "gaps": ["The agent design doc, the README and the pitch scripts still describe the tool-driven design.", "Open from the audit: a slightly metronomic rhythm, some two-part questions, occasional mis-tags, and voice behaviour not yet checked by machine."]}, {"id": "byok", "title": "Your keys, one worker", "video": "mockflow-byok", "lead": "Each user brings their own LiveKit, OpenAI and Deepgram keys. They are encrypted at rest, decrypted only into one interview's process, and the design decides what a shared worker can and cannot do.", "points": ["Storage: five keys per user, each encrypted with Fernet from one server key; losing that key means every user re-enters theirs.", "Validation checks format only; it never calls a provider.", "Transport: decrypted keys reach the agent only through its process environment, never through room attributes.", "One process per interview: started per room, exits on its own; nothing reaps a stuck process yet.", "Free tier: the owner's keys, two calls per user and 500 a month, claimed atomically and only after a successful spawn. Off by default.", "Dispatch: a resident worker registers with one LiveKit project, so it cannot serve rooms in users' own projects; dispatch can only ever serve owner-key interviews, and it is not live."], "code": ["db.py (Fernet)", "app.py (resolve_interview_keys)", "worker_manager.py", "agent_mode.py"], "plan": [["Least privilege", "SYSTEM%20DESIGN.html#/patterns/agent-safety/least-privilege"], ["Rate limiting", "SYSTEM%20DESIGN.html#/patterns/reliability/rate-limiting"]], "gaps": ["Docs describe the free-tier cap in dollars; the code counts calls.", "Dispatch is built but has never run against a live LiveKit project."]}, {"id": "coding", "title": "The coding track", "video": "mockflow-coding", "lead": "Grading code fairly with a model as the grader: a vetted problem bank, execution in a sandbox, and test results as ground truth, plus an honest list of what is not wired yet.", "points": ["The naive version, tried first: problems invented each session and graded by reading, never run; the audit graded a wrong-shape Two Sum 'partial' and every persona 'pass'.", "The bank: six problems with tests and reference solutions, each reference tested against its own cases.", "On submit: the full code goes over the data channel, three attempts per problem, Piston runs it when enabled (12 seconds), and the model evaluator gets 'X of Y passed' as ground truth.", "Sandboxing: the local runner has no network or filesystem limits and is used only on trusted solutions; Piston does the sandboxing for candidate code.", "Feedback is spoken after each submit, and the interview moves on when the answer passes or on the third attempt."], "code": ["coding/problem_bank.py", "coding/piston_runner.py", "interview_runtime.py (_evaluate_code_async)", "templates/interview.html (editor)"], "plan": [["Structured output", "SYSTEM%20DESIGN.html#/patterns/grounding/structured"], ["Evals as a gate", "SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate"]], "gaps": ["The whole problem, including hidden tests and the reference solution, is sent to the browser.", "The editor's starter code does not name the function the tests call, so execution would likely fall back to model-only grading.", "Senior candidates get the easiest problems because there are no hard ones yet.", "The final verdict never sees the coding results.", "Code reaches the agent only on submit, though the landing page says it watches every keystroke; Piston is off in production."]}, {"id": "evaluation", "title": "Feedback you can trust", "video": "mockflow-evaluation", "lead": "Measure what can be measured, let the model judge only with evidence, compute the decision by formula, calibrate against a gold set, and test the agent itself with a harness and persona audits.", "points": ["The naive failure: pace estimated from word count made words per minute exactly 150 for every transcript.", "Measured delivery: fillers, and pace from real speaking windows; when any turn was typed, pace is reported as unknown.", "The judge: a band per signal, 'cannot determine' without evidence, and the hire recommendation computed by formula from the weighted bands, not by the model.", "Calibration: six gold interviews and weighted kappa with a target of 0.75 to 0.90; no recorded run yet.", "Testing the agent: a text harness runs the production agent with a fake transport and clock over five scenarios, and twenty LLM-played personas audit each change.", "The audit before and after the redesign: silent turns 18 to 0, praise 92 to 0, two-question turns 29 to 3, p95 6.0 to 2.8 seconds."], "code": ["speech_analytics.py", "feedback_scoring.py", "evaluator.py", "calibration.py, gold_set.json", "harness/", "tests/e2e/test_agent_audit.py"], "plan": [["Evals as a gate", "SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate"], ["Shadow and online evals", "SYSTEM%20DESIGN.html#/patterns/grounding/shadow-online"], ["Citations", "SYSTEM%20DESIGN.html#/patterns/grounding/citations"]], "gaps": ["The docs promise a verbatim quote as evidence; the code only checks that evidence is non-empty.", "After the redesign every coding persona got the same lean hire, consistent with the verdict not seeing coding results."]}]}]};
  var PUBLIC = !!window.SITE_PUBLIC;
  var tabs = document.getElementById("tabs"), rail = document.getElementById("rail"), main = document.getElementById("main");
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function head(s) { var i = s.indexOf(": "); return i > 0 && i < 40 ? "<b>" + esc(s.slice(0, i)) + ":</b> " + esc(s.slice(i + 2)) : esc(s); }

  // Videos live in gitignored media/videos, so only a local copy can play them; a file appears on the next load.
  var have = {};
  function probe(slug, cb) {
    if (PUBLIC) { cb(false); return; }
    if (slug in have) { cb(have[slug]); return; }
    fetch("media/videos/" + slug + ".mp4", { method: "HEAD", cache: "no-store" })
      .then(function (r) { have[slug] = r.ok; cb(r.ok); }, function () { have[slug] = false; cb(false); });
  }
  function pagesOf(p) {
    return [{ key: p.id, kind: "about", title: "Overview", d: p }].concat(p.topics.map(function (t) { return { key: p.id + "/" + t.id, kind: "topic", title: t.title, d: t }; }));
  }
  function about(p) {
    var h = '<div class="crumb">' + esc(p.title) + '</div><h2>' + esc(p.title) + '</h2><p class="lead">' + esc(p.tagline) + "</p>";
    h += '<div class="cols"><div><div class="lab">Topics</div>';
    h += p.topics.length ? '<ul class="points">' + p.topics.map(function (t) { return '<li><a href="#/' + p.id + "/" + t.id + '">' + esc(t.title) + "</a>: " + esc(t.lead) + "</li>"; }).join("") + "</ul>"
      : '<p class="lead">Topics arrive here as each explainer is made.</p>';
    h += '</div><div class="side"><div class="lab">Links</div><ul>' + p.links.map(function (l) { return '<li><a href="' + esc(l[1]) + '" target="_blank" rel="noopener">' + esc(l[0]) + "</a></li>"; }).join("") + "</ul>";
    h += '<div class="lab">Stack</div><ul>' + p.stack.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul></div></div>";
    return h;
  }
  function topic(p, t) {
    var h = '<div class="crumb">' + esc(p.title) + '</div><h2>' + esc(t.title) + '</h2><p class="lead">' + esc(t.lead) + "</p>";
    h += '<div class="video" id="vid"' + (PUBLIC ? " hidden" : "") + '></div><div class="cols"><div>';
    h += '<div class="lab">What happens</div><ul class="points">' + t.points.map(function (x) { return "<li>" + head(x) + "</li>"; }).join("") + "</ul></div><div class=\"side\">";
    if (t.plan && t.plan.length) { h += '<div class="lab">In the guide</div><ul>' + t.plan.map(function (l) { return '<li><a href="' + esc(l[1]) + '">' + esc(l[0]) + "</a></li>"; }).join("") + "</ul>"; }
    if (t.code && t.code.length) { h += '<div class="lab">Where to look</div><ul class="code">' + t.code.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul>"; }
    if (t.gaps && t.gaps.length) { h += '<div class="lab">Known issues</div><ul class="gaps">' + t.gaps.map(function (g) { return "<li>" + esc(g) + "</li>"; }).join("") + "</ul>"; }
    return h + "</div></div>";
  }
  function fillVideo(t) {
    var box = document.getElementById("vid");
    if (!box || PUBLIC) { return; }
    probe(t.video, function (ok) {
      if (!document.contains(box)) { return; }
      if (!ok) { box.innerHTML = '<div class="wait">The video for this topic is being made. Refresh once it is rendered.</div>'; return; }
      var v = document.createElement("video");
      v.controls = true; v.preload = "metadata"; v.playsInline = true; v.src = "media/videos/" + t.video + ".mp4";
      box.appendChild(window.Res && Res.enhanceVideo ? Res.enhanceVideo(v) : v);
    });
  }
  function draw() {
    var key = (location.hash || "").replace(/^#\/?/, "");
    var proj = D.projects.filter(function (p) { return key === p.id || key.indexOf(p.id + "/") === 0; })[0] || D.projects[0];
    var pages = pagesOf(proj);
    var i = Math.max(0, pages.map(function (p) { return p.key; }).indexOf(key));
    var cur = pages[i];
    tabs.innerHTML = D.projects.map(function (p) { return '<a href="#/' + p.id + '"' + (p === proj ? ' aria-current="page"' : "") + ">" + esc(p.title) + "</a>"; }).join("");
    var r = '<div class="grp">' + esc(proj.title) + "</div>";
    pages.forEach(function (p) {
      var dot = p.kind === "topic" ? '<span class="dot" data-v="' + esc(p.d.video) + '"></span>' : "";
      r += '<a href="#/' + p.key + '"' + (p === cur ? ' aria-current="page"' : "") + ">" + dot + "<span>" + esc(p.title) + "</span></a>";
    });
    if (!proj.topics.length) { r += '<div class="none">Topics arrive with each video.</div>'; }
    rail.innerHTML = r;
    Array.prototype.forEach.call(rail.querySelectorAll(".dot"), function (el) { probe(el.getAttribute("data-v"), function (ok) { if (ok) { el.classList.add("on"); } }); });
    var h = cur.kind === "about" ? about(proj) : topic(proj, cur.d);
    var prev = pages[i - 1], next = pages[i + 1];
    h += '<nav class="pager">' + (prev ? '<a href="#/' + prev.key + '">Previous: ' + esc(prev.title) + "</a>" : "") + (next ? '<a class="next" href="#/' + next.key + '">Next: ' + esc(next.title) + "</a>" : "") + "</nav>";
    main.innerHTML = h;
    if (cur.kind === "topic") { fillVideo(cur.d); }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", draw);
  document.documentElement.style.setProperty("--top", document.querySelector(".top").offsetHeight + "px");
  draw();
})();
</script>
