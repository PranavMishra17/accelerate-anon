/* Accelerate design tokens: the one home for type, colour, space and radius on every page.
   Read DESIGN.md before changing anything here. Pages use these variables and add no
   font sizes, families or colours of their own. */
:root {
  /* Two families. Nothing else: no handwriting, no display face. */
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, ui-monospace, monospace;

  /* Six sizes. A component uses at most three of them. */
  --fs-xs: 12px;      /* meta: dates, counts, captions */
  --fs-sm: 13px;      /* secondary: labels, hints, table notes, badges */
  --fs-md: 15px;      /* body: reading text and controls */
  --fs-lg: 17px;      /* section and item headings */
  --fs-xl: 20px;      /* page section titles */
  --fs-2xl: 24px;     /* the page title, once per page */
  --fs-code: 13px;    /* code blocks and inline code */
  --lh-body: 1.55;
  --lh-tight: 1.25;
  --measure: 72ch;    /* longest line of running text */
  --w-regular: 400;
  --w-strong: 600;

  /* Space: a 4px scale. */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;

  /* Shape: hairlines, small radii, no shadows except floating layers. */
  --radius-sm: 4px;
  --radius: 6px;
  --radius-lg: 8px;
  --hair: 1px solid var(--rule);
  --shadow-float: 0 12px 32px rgba(29, 27, 23, .18);

  /* Colour: warm neutrals, one accent for action and the current state. */
  --bg: #FBF8F1;
  --surface: #FFFDF8;
  --sunken: #F4EEE2;
  --ink: #1D1B17;
  --soft: #45413A;
  --muted: #736D62;
  --rule: #E5DDCD;
  --accent: #2447E0;
  --accent-soft: #E8EDFC;
  --ok: #3F7A55;
  --warn: #A85F3F;
  --code-bg: #F4EEE2;
  --code-ink: #2B2722;

  /* Categorical: one per interview loop or track, muted, used as a 3px rule or a dot, never as a fill. */
  --cat-1: #3F6EA8; --cat-2: #3F7A55; --cat-3: #A85F3F; --cat-4: #7A3B5C; --cat-5: #8A6F2F; --cat-6: #4F6B73;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1A1F; --surface: #222128; --sunken: #28272F; --ink: #ECEBF1; --soft: #C7C5D1; --muted: #9A98A6;
    --rule: #34333D; --accent: #8FA8FF; --accent-soft: #2A2F4A; --ok: #7FB894; --warn: #D99A7A;
    --code-bg: #F4EEE2; --code-ink: #2B2722;
    --cat-1: #8DB0DD; --cat-2: #8FC4A1; --cat-3: #DDA48A; --cat-4: #C990AE; --cat-5: #CDB47A; --cat-6: #9DB7BF;
    --shadow-float: 0 12px 32px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1A1F; --surface: #222128; --sunken: #28272F; --ink: #ECEBF1; --soft: #C7C5D1; --muted: #9A98A6;
  --rule: #34333D; --accent: #8FA8FF; --accent-soft: #2A2F4A; --ok: #7FB894; --warn: #D99A7A;
  --cat-1: #8DB0DD; --cat-2: #8FC4A1; --cat-3: #DDA48A; --cat-4: #C990AE; --cat-5: #CDB47A; --cat-6: #9DB7BF;
  color-scheme: dark;
}

/* Classes the figures in figures.js draw with. Colours come from the page's own tokens
   where it has them, and fall back to the tracker's light palette where it does not. */
.d-fill-sys { fill: var(--sys-p, #dbe4ef); } .d-str-sys { stroke: var(--sys, #3f6ea8); }
.d-fill-math { fill: var(--math-p, #dde9e1); } .d-str-math { stroke: var(--math, #3f7a55); }
.d-fill-alaap { fill: var(--alaap-p, #f0e0d8); } .d-str-alaap { stroke: var(--alaap, #a85f3f); }
.d-fill-req { fill: var(--req-p, #ece4cf); } .d-str-req { stroke: var(--req, #8a6f2f); }
.d-fill-iv { fill: var(--iv-p, #efdfe7); } .d-str-iv { stroke: var(--iv, #7a3b5c); }
.d-fill-now { fill: var(--live, #fffdf5); } .d-str-now { stroke: var(--ink, #1a1a19); }
.d-fill-flat { fill: none; } .d-str-flat { stroke: var(--line, #c3c0b7); }
.d-line { stroke: var(--dim, #6b6a65); fill: none; }
.d-t { fill: var(--ink, #1a1a19); font-family: var(--sans, "Helvetica Neue", Arial, sans-serif); font-size: 12px; }
.d-t-s { fill: var(--dim, #6b6a65); font-family: var(--sans, "Helvetica Neue", Arial, sans-serif); font-size: 11px; }
.d-t-b { fill: var(--ink, #1a1a19); font-family: var(--sans, "Helvetica Neue", Arial, sans-serif); font-size: 12px; font-weight: 700; }
.d-t-x { fill: var(--faint, #a2a09a); font-family: var(--sans, "Helvetica Neue", Arial, sans-serif); font-size: 10.5px; }
/* icons inside figures take their tone's stroke colour */
.d-ic-sys { color: var(--sys, #3f6ea8); } .d-ic-math { color: var(--math, #3f7a55); } .d-ic-alaap { color: var(--alaap, #a85f3f); }
.d-ic-req { color: var(--req, #8a6f2f); } .d-ic-iv { color: var(--iv, #7a3b5c); } .d-ic-now, .d-ic-flat { color: var(--ink, #1a1a19); }
.fv-hit { stroke: transparent; stroke-width: 12; fill: none; }

/* The coding cheat sheet, the side-by-side popup and the parts of a problem, shared by CODING.html and
   CHEATSHEET.html. Every size, colour and radius is a token from site/tokens.css, loaded first. Code sits on
   cream in light and dark alike. On a phone the sheet is one scrolling column and the popup is full screen
   with a Notes / Code switch. */

/* Code: Python colours on cream. The syntax colours are the one set of colours not in the tokens: they sit
   on --code-bg, which is cream in both schemes. */
pre { margin: var(--s3) 0; padding: var(--s3) var(--s4); background: var(--code-bg); color: var(--code-ink); border: var(--hair);
  border-radius: var(--radius); overflow-x: auto; font: var(--fs-code)/1.6 var(--mono); }
.tk { color: #A626A4; } .ts { color: #3F7A3E; } .tc { color: #7D7668; font-style: italic; } .tn { color: #A0580A; } .tf { color: #2F65D8; } .tb { color: #0E7486; }
code { font-family: var(--mono); font-size: var(--fs-code); background: var(--sunken); padding: 1px 4px; border-radius: var(--radius-sm); }
pre code { background: none; padding: 0; font-size: inherit; }
.cx { font-size: var(--fs-sm); color: var(--muted); margin: 0 0 var(--s3); }

/* A worked example on one line (the sheet's cards): input -> output */
.ex-in, .ex-out { font-family: var(--mono); }
.ex-out { font-weight: var(--w-strong); }
.ex-arrow { color: var(--muted); margin: 0 var(--s1); }

/* The parts of a problem on a label rail: a small label on the left, the part on the right, a hairline
   between parts. The examples sit on a sunken tint, their Input, Output and Why in aligned columns.
   Narrower than 480px the label goes above its part. --bleed lets the tint reach the card's edge. */
.st { container: st / inline-size; margin: 0 0 var(--s2); }
.r { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 0 var(--s4); align-items: baseline; padding: 10px 0; border-top: var(--hair); }
.r:first-child { border-top: 0; }
.rl { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--soft); line-height: var(--lh-tight); }
.rv { min-width: 0; }
.rv p { margin: 0 0 var(--s2); max-width: var(--measure); }
.rv p:last-child { margin-bottom: 0; }
.rv ul { margin: 0; padding-left: 18px; font-size: var(--fs-sm); }
.rv li { margin: 0 0 2px; }
.r-ex { background: var(--sunken); margin: 0 calc(-1 * var(--bleed, var(--s3))); padding: 10px var(--bleed, var(--s3)); }
.r-ex + .r-ex { border-top-color: var(--rule); }
.io { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px var(--s4); align-items: baseline; font-size: var(--fs-sm); }
.io .k { color: var(--muted); }
.io code { background: none; padding: 0; color: var(--ink); overflow-wrap: anywhere; }
@container st (max-width: 480px) {
  .r { grid-template-columns: minmax(0, 1fr); gap: var(--s1); }
}

/* A shared figure, always on white */
.cfig { margin: var(--s3) 0 var(--s4); }
.cfig .fig-svg { background: #fff; border: var(--hair); border-radius: var(--radius-lg); padding: var(--s3); overflow-x: auto;
  --faint: #a2a09a; --dim: #6b6a65; --line: #c3c0b7; --ink: #1a1a19; --live: #fffdf5; }
.cfig svg { display: block; min-width: 520px; max-width: 100%; height: auto; margin: 0 auto; }
.cfig figcaption { color: var(--muted); font-size: var(--fs-sm); margin-top: var(--s2); max-width: var(--measure); }
.cfig figcaption b { color: var(--soft); }

/* The sheet: one screen of cards. fit() in sheet.js steps the card type down from 13px and picks six to eight columns. */
.cheat { position: fixed; inset: 0; z-index: 50; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
  font: var(--fs-sm)/1.3 var(--font); }
.cheat[hidden] { display: none; }
.cs-top { display: flex; gap: var(--s2) var(--s3); align-items: center; padding: 6px var(--s4); border-bottom: var(--hair); font-size: var(--fs-sm); line-height: var(--lh-tight); flex-wrap: wrap; }
.cs-top b { font-size: var(--fs-md); font-weight: var(--w-strong); }
.cs-top .hint { color: var(--muted); }
.cs-top .grow { flex: 1; }
.cs-top a { color: var(--accent); text-decoration: none; }
.cs-top button, .cs-tabs button { font: inherit; padding: 3px var(--s3); border: var(--hair); border-radius: var(--radius); background: var(--surface); color: var(--ink); cursor: pointer; }
.cs-tabs { display: flex; gap: var(--s1); }
.cs-tabs button { background: none; border-color: transparent; color: var(--muted); }
.cs-tabs button.on { background: var(--accent-soft); color: var(--ink); font-weight: var(--w-strong); }
.cs-grid { flex: 1; min-height: 0; padding: 10px var(--s4) var(--s3); column-count: 6; column-gap: 10px; column-fill: auto; overflow: auto; }
.cs-card { break-inside: avoid; border: var(--hair); border-radius: var(--radius); padding: 6px 9px 5px; margin: 0 0 var(--s2); background: var(--surface); }
.cs-card h3 { margin: 0 0 4px; font-size: 1.28em; line-height: 1.2; font-weight: 700; color: var(--ink); letter-spacing: -0.005em; }
.cs-card p { margin: 0 0 3px; }
.cs-card .cs-l { color: var(--muted); margin-right: .3em; }
.cs-card ul { margin: 3px 0 0; padding-left: 16px; color: var(--soft); }
.cs-card li { margin: 1px 0; }
.cs-card li.more { display: none; }
.cs-card code { font-size: .92em; padding: 0 3px; }
.cs-click { cursor: pointer; }
.cs-click:hover, .cs-click:focus-visible { border-color: var(--muted); outline: none; }
.cs-card .cs-ex { margin: 0 0 3px; }
.cs-card .cs-ex .ex-in, .cs-card .cs-ex .ex-out { font-size: .88em; }
.cs-card pre { margin: 3px 0; padding: 4px 7px; font-size: .9em; line-height: 1.3; border-radius: var(--radius-sm); white-space: pre-wrap; overflow: visible; }

/* Side by side: notes and the list on the left, the chosen item on the right. A floating layer: the one shadow. */
.pop { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .4); display: flex; align-items: center; justify-content: center; padding: 3vh 2vw; }
.pop[hidden] { display: none; }
.pop-in { position: relative; width: min(1480px, 96vw); height: min(900px, 92vh); background: var(--bg); color: var(--ink); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-float); display: grid; grid-template-columns: minmax(320px, .8fr) minmax(0, 1.3fr); overflow: hidden; font: var(--fs-md)/var(--lh-body) var(--font); }
.pop-bar { display: none; }
.pop-l { overflow: auto; padding: var(--s5) var(--s5) var(--s5); background: var(--sunken); border-right: var(--hair); --bleed: var(--s3); }
.pop-l .r-ex { background: var(--surface); }
.pop-r { overflow: auto; padding: var(--s5) var(--s6) var(--s5); }
.pop-x { position: absolute; top: var(--s3); right: var(--s4); font: inherit; font-size: var(--fs-sm); padding: 3px var(--s3); border: var(--hair); border-radius: var(--radius); background: var(--surface); color: var(--ink); cursor: pointer; z-index: 2; }
.pop h2 { margin: 0 0 var(--s2); font-size: var(--fs-xl); line-height: var(--lh-tight); font-weight: var(--w-strong); padding-right: 70px; }
.pop .spot { color: var(--soft); margin: 0 0 var(--s3); }
.pop .spot b { color: var(--ink); }
.pop h4 { margin: var(--s5) 0 var(--s1); font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--muted); }
.pop ul.nu, .pop ol.nu { margin: 0; padding-left: 18px; }
.pop .nu li { margin: 0 0 var(--s1); }
.pop a { color: var(--accent); }
.pop details.ask { margin: var(--s1) 0; }
.pop details.ask summary { cursor: pointer; }
.pop details.ask p { margin: var(--s1) 0 var(--s2) var(--s4); color: var(--soft); }
.pi { display: block; width: 100%; text-align: left; font: inherit; background: none; border: 0; border-radius: var(--radius); padding: 5px 10px; margin: 1px 0; cursor: pointer; color: inherit; }
.pi:hover { background: var(--bg); }
.pi.on { background: var(--accent-soft); }
.pi b { display: block; font-size: var(--fs-sm); font-weight: var(--w-strong); }
.pi span { display: block; font-size: var(--fs-xs); color: var(--muted); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-foot { margin: var(--s5) 0 0; font-size: var(--fs-sm); color: var(--muted); }
.pop-r h3 { margin: 0 90px var(--s3) 0; font-size: var(--fs-lg); line-height: var(--lh-tight); font-weight: var(--w-strong); }
.pr-kind { font-size: var(--fs-sm); font-weight: var(--w-regular); color: var(--muted); margin-left: var(--s2); }
.pop-r .pr-t { margin: 0 0 var(--s3); max-width: var(--measure); }
.pop-r .cx { margin-top: calc(-1 * var(--s1)); }

@media print { body > :not(.cheat) { display: none; } .cheat { position: static; } }

/* Scroll mode (sheet.js sets .scroll on a phone upright): readable cards in a grid of 300px columns, read row
   by row, every note shown, the whole sheet scrolls */
.cheat.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.cheat.scroll .cs-top { position: sticky; top: 0; z-index: 2; background: var(--bg); }
.cheat.scroll .cs-top .hint, .cheat.scroll .cs-top .wide { display: none; }
.cheat.scroll .cs-grid { flex: none; overflow: visible; columns: auto !important; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 var(--s3); align-items: start; padding: 10px var(--s3) var(--s7); }
.cheat.scroll .cs-card { padding: 10px var(--s3) var(--s2); margin-bottom: 10px; }
.cheat.scroll .cs-card li.more { display: list-item; }
.cheat.scroll .cs-card pre { font-size: var(--fs-xs); line-height: 1.45; }

/* Compact mode (sheet.js sets .compact on a phone on its side): every card a tile, all on one screen, no scrolling */
.cheat.compact .cs-top { padding: 3px 10px; gap: var(--s1) 10px; font-size: var(--fs-xs); }
.cheat.compact .cs-top b { font-size: var(--fs-sm); }
.cheat.compact .cs-top .hint, .cheat.compact .cs-top .wide { display: none; }
.cheat.compact .cs-tabs button { padding: 2px 10px; }
.cheat.compact .cs-grid { columns: auto !important; display: grid; grid-auto-rows: minmax(0, 1fr); gap: 6px; padding: 6px var(--s2) var(--s2); overflow: hidden; }
.cheat.compact .cs-card { margin: 0; padding: var(--s1) var(--s2); min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
.cheat.compact .cs-card h3 { font-size: var(--fs-sm); line-height: 1.2; margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cheat.compact .cs-card > :not(h3):not(.cs-ex) { display: none; }
.cheat.compact .cs-card .cs-ex { margin: 0; font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cheat.compact .cs-card .cs-ex .ex-in, .cheat.compact .cs-card .cs-ex .ex-out { font-size: inherit; }

/* A phone on its side: the popup fills the screen, notes left and code right, small type, code first */
@media (max-height: 560px) and (orientation: landscape) {
  .pop { padding: 0; }
  .pop-in { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; font-size: var(--fs-sm); line-height: 1.4; grid-template-columns: minmax(200px, .75fr) minmax(0, 1.5fr); }
  .pop-l, .pop-r { padding: var(--s2) var(--s3) 20px; }
  .pop h2 { font-size: var(--fs-md); padding-right: 0; }
  .pop h4 { margin: 10px 0 3px; font-size: var(--fs-xs); }
  .pop .spot { margin: 2px 0 6px; }
  .r { padding: 6px 0; }
  .r-ex { padding: 6px var(--bleed, var(--s3)); }
  .io, .rv ul { font-size: var(--fs-xs); }
  .pi { padding: 3px 7px; margin: 1px 0; }
  .pi b { font-size: var(--fs-xs); }
  .pl-foot { font-size: var(--fs-xs); margin-top: 10px; }
  .pop-r { display: flex; flex-direction: column; }
  .pop-r > * { order: 3; flex: none; }
  .pop-r > h3 { order: 1; }
  .pop-r > pre { order: 2; }
  .pop-r h3 { font-size: var(--fs-sm); margin: 0 70px var(--s1) 0; }
  .pop-r pre { font-size: var(--fs-xs); line-height: 1.4; padding: 6px var(--s2); margin: var(--s1) 0 var(--s2); white-space: pre-wrap; }
  .pop-r .cfig svg { min-width: 0; }
  .pop-x { top: 5px; right: var(--s2); font-size: var(--fs-xs); padding: 2px 10px; }
}

/* Phone upright: the sheet scrolls as one column with every note; the popup fills the screen with a Notes / Code switch */
@media (max-width: 760px) and (orientation: portrait) {
  .cs-top { padding: var(--s2) var(--s3); }
  .cs-top .hint, .cs-top .wide { display: none; }
  .cs-tabs { order: 5; width: 100%; }
  .cs-tabs button { flex: 1; padding: 6px var(--s2); }
  .pop { padding: 0; }
  .pop-in { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .pop-bar { display: flex; gap: 6px; padding: 10px 92px 10px var(--s3); border-bottom: var(--hair); background: var(--sunken); }
  .pop-bar button { flex: 1; font: inherit; font-size: var(--fs-sm); padding: 6px 10px; border: var(--hair); border-radius: var(--radius); background: none; color: var(--muted); }
  .pop-bar button.on { background: var(--surface); color: var(--ink); font-weight: var(--w-strong); }
  .pop-l, .pop-r { padding: var(--s4) var(--s4) var(--s6); border-right: 0; }
  .pop-in .pop-r { display: none; }
  .pop-in.show-r .pop-r { display: block; }
  .pop-in.show-r .pop-l { display: none; }
  .pop-x { top: 10px; right: var(--s3); padding: 6px var(--s3); }
  .pop h2 { padding-right: 0; }
  .pop-r h3 { margin-right: 0; }
  .pop-r pre { font-size: var(--fs-xs); white-space: pre-wrap; }
}

body { margin: 0; background: var(--bg); }

<script>
/* The figures, drawn once and used everywhere: the tracker (index.html) and the interview
   loop pages (interviews/*.html) both read FIGURES.DIA by key. To improve a figure, edit it
   here; every page that shows it picks it up.

   Each entry: { title, cap (html), svg() -> svg markup }. Figures drawn with S use the
   d-* classes in figures.css; "fixed" ones carry their own colours and sit on white. */
var FIGURES = (function () {
  "use strict";

  var S = {};
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  /* Every box is a node (data-n, from its id or its label) and every arrow an edge
     (data-e, "from>to"), so figures/viewer.js can explain them. Arrows are drawn before
     all their boxes exist, so each one is matched to the nearest boxes when the figure
     is framed. */
  var drawn = [];
  function slug(t) { return String(t).toLowerCase().replace(/<[^>]+>/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40); }
  function distTo(b, x, y) {
    var dx = Math.max(b.x - x, 0, x - (b.x + b.w)), dy = Math.max(b.y - y, 0, y - (b.y + b.h));
    return Math.sqrt(dx * dx + dy * dy);
  }
  function nearest(x, y) {
    var best = null, bd = 28;
    drawn.forEach(function (b) { var d = distTo(b, x, y); if (d < bd) { bd = d; best = b; } });
    return best;
  }
  S.frame = function (w, h, body) {
    var seen = {};
    body = body.replace(/data-e="@([\d.\-]+),([\d.\-]+),([\d.\-]+),([\d.\-]+)(?:\|([^"]*))?"/g, function (m, x1, y1, x2, y2, id) {
      if (id) { return 'data-e="' + id + '"'; }
      var a = nearest(+x1, +y1), c = nearest(+x2, +y2);
      if (!a || !c || a === c) { return 'data-e-free=""'; }
      var e = a.id + ">" + c.id;
      seen[e] = (seen[e] || 0) + 1;
      return 'data-e="' + e + (seen[e] > 1 ? "#" + seen[e] : "") + '"';
    });
    drawn = [];
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" role="img">' +
      '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">' +
      '<path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>' +
      '<g color="var(--faint)">' + body + '</g></svg>';
  };
  /* a Lucide icon (figures/icons.js), size in px, coloured by tone */
  S.icon = function (name, x, y, size, tone) {
    var inner = (typeof ICONS !== "undefined" && ICONS[name]) || "";
    if (!inner) { return ""; }
    var k = (size || 18) / 24;
    return '<g class="d-ic d-ic-' + (tone || "flat") + '" transform="translate(' + x + ' ' + y + ') scale(' + k + ')" fill="none" stroke="currentColor"' +
      ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</g>';
  };
  /* wrap any markup as a node, for figures that are plots rather than boxes */
  S.node = function (id, markup) { return '<g data-n="' + id + '">' + markup + '</g>'; };
  S.box = function (o) {
    var tone = o.tone || "flat";
    var r = o.r === undefined ? 0 : o.r;
    var id = o.id || (o.label ? slug(o.label) : "");
    if (id) { drawn.push({ id: id, x: o.x, y: o.y, w: o.w, h: o.h }); }
    var s = '<rect x="' + o.x + '" y="' + o.y + '" width="' + o.w + '" height="' + o.h + '" rx="' + r +
      '" class="d-fill-' + tone + ' d-str-' + tone + '" stroke-width="1.25"' +
      (o.dash ? ' stroke-dasharray="4 3"' : '') + '/>';
    var tx = o.x + o.w / 2;
    if (o.icon) {
      var isz = Math.min(20, o.h - 14);
      s += S.icon(o.icon, o.x + 10, o.y + (o.h - isz) / 2, isz, tone);
      tx = o.x + 14 + isz + (o.w - 14 - isz) / 2;
    }
    if (o.label) {
      var cy = o.y + o.h / 2 + (o.sub ? -3 : 4);
      s += '<text x="' + tx + '" y="' + cy + '" text-anchor="middle" class="d-t-b">' + esc(o.label) + '</text>';
      if (o.sub) {
        s += '<text x="' + tx + '" y="' + (cy + 15) + '" text-anchor="middle" class="d-t-s">' + esc(o.sub) + '</text>';
      }
    }
    return id ? '<g data-n="' + id + '">' + s + '</g>' : s;
  };
  S.arrow = function (x1, y1, x2, y2, o) {
    o = o || {};
    var d = o.curve
      ? "M" + x1 + "," + y1 + " Q" + ((x1 + x2) / 2) + "," + (Math.min(y1, y2) - o.curve) + " " + x2 + "," + y2
      : "M" + x1 + "," + y1 + " L" + x2 + "," + y2;
    var s = '<path d="' + d + '" class="fv-hit"/><path d="' + d + '" class="d-line" stroke-width="1.25" marker-end="url(#ah)"' +
      (o.dash ? ' stroke-dasharray="4 3"' : '') + '/>';
    if (o.label) {
      var mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - (o.curve ? o.curve * 0.55 : 0) - 6;
      s += '<text x="' + mx + '" y="' + my + '" text-anchor="middle" class="d-t-s">' + esc(o.label) + '</text>';
    }
    return '<g data-e="@' + x1 + ',' + y1 + ',' + x2 + ',' + y2 + (o.id ? "|" + o.id : "") + '">' + s + '</g>';
  };
  S.text = function (x, y, t, cls, anchor) {
    return '<text x="' + x + '" y="' + y + '" text-anchor="' + (anchor || "start") + '" class="' +
      (cls || "d-t") + '">' + esc(t) + '</text>';
  };
  S.tag = function (x, y, t) {
    return S.text(x, y, String(t).toUpperCase(), "d-t-x");
  };
  S.bar = function (o) {
    var tone = o.tone || "flat";
    return '<rect x="' + o.x + '" y="' + o.y + '" width="' + o.w + '" height="' + o.h +
      '" rx="3" class="d-fill-' + tone + ' d-str-' + tone + '" stroke-width="1"/>';
  };
  S.dots = function (x, y, n, gap, tone) {
    var s = "", i;
    for (i = 0; i < n; i++) {
      s += '<circle cx="' + (x + i * gap) + '" cy="' + y + '" r="3.5" class="d-fill-' + tone +
        ' d-str-' + tone + '" stroke-width="1"/>';
    }
    return s;
  };
  S.path = function (d, tone, dash) {
    return '<path d="' + d + '" fill="none" class="d-str-' + (tone || "flat") + '" stroke-width="1.75"' +
      (dash ? ' stroke-dasharray="4 3"' : '') + '/>';
  };
  S.axes = function (x, y, w, h, xl, yl) {
    return '<path d="M' + x + ',' + y + ' L' + x + ',' + (y + h) + ' L' + (x + w) + ',' + (y + h) +
      '" class="d-line" stroke-width="1"/>' +
      S.text(x + w, y + h + 15, xl, "d-t-x", "end") +
      S.text(x - 4, y - 5, yl, "d-t-x", "start");
  };

  /* -------------------------------------------------------------- diagrams */

  var DIA = {};

  DIA.queue = {
    title: "A queue with no backpressure does not slow down. It dies.",
    cap: "<b>Above:</b> the unbounded queue absorbs the overload silently. Throughput on your dashboard looks unchanged, latency climbs without bound, memory climbs with it, and the process dies all at once. <b>Below:</b> a bounded queue fills, refuses work, and pushes that refusal back to the producer. Rejecting work is information. A silent five-minute queue is not.",
    svg: function () {
      var b = "";
      b += S.tag(0, 14, "No backpressure");
      b += S.box({ id: "producer", x: 0, y: 24, w: 86, h: 40, label: "Producer", tone: "flat" });
      b += S.arrow(90, 44, 128, 44, { label: "fast" });
      b += S.box({ id: "queue-unbounded", x: 132, y: 24, w: 196, h: 40, tone: "alaap", dash: true, icon: "list" });
      b += S.dots(168, 44, 11, 14, "alaap");
      b += S.text(230, 80, "unbounded, growing", "d-t-s", "middle");
      b += S.arrow(332, 44, 370, 44, { label: "slow" });
      b += S.box({ id: "worker", x: 374, y: 24, w: 86, h: 40, label: "Worker", tone: "flat" });
      b += S.text(480, 36, "Latency climbs,", "d-t-s");
      b += S.text(480, 52, "memory climbs,", "d-t-s");
      b += S.text(480, 68, "then it is gone.", "d-t-b");

      b += S.tag(0, 128, "With backpressure");
      b += S.box({ id: "producer", x: 0, y: 138, w: 86, h: 40, label: "Producer", tone: "flat" });
      b += S.arrow(90, 158, 128, 158, {});
      b += S.box({ id: "queue-bounded", x: 132, y: 138, w: 196, h: 40, tone: "sys", icon: "list" });
      b += S.dots(168, 158, 6, 17, "sys");
      b += S.text(230, 194, "bounded, capped", "d-t-s", "middle");
      b += S.arrow(332, 158, 370, 158, {});
      b += S.box({ id: "worker", x: 374, y: 138, w: 86, h: 40, label: "Worker", tone: "flat" });
      b += S.arrow(230, 134, 60, 134, { curve: 34, label: "full — stop sending", dash: true });
      b += S.text(480, 150, "Producer slows.", "d-t-s");
      b += S.text(480, 166, "The system stays up.", "d-t-b");
      return S.frame(600, 210, b);
    }
  };

  DIA.tail = {
    title: "One slow shard in a hundred makes almost every request slow",
    cap: "<b>Fan-out amplifies tails.</b> If a request waits on 100 shards and each is slow 1% of the time, the chance that none is slow is 0.99 to the power 100 — about 37%. So roughly 63% of requests are slow. The p99 of a component becomes the typical case for the system, which is why tail latency is a system property rather than a component detail. The figure draws 12 shards to stand in for the 100.",
    svg: function () {
      var b = "", i, x, barsNormal = "", barsSlow = "";
      b += S.box({ id: "request", x: 0, y: 58, w: 84, h: 38, label: "Request", tone: "now", icon: "send" });
      for (i = 0; i < 12; i++) {
        x = 150 + i * 36;
        var slow = (i === 4 || i === 9);
        b += S.arrow(86, 77, x + 12, slow ? 30 : 48, { id: slow ? "request>shards-slow" : "request>shards-normal" });
        if (slow) { barsSlow += S.bar({ x: x, y: 30, w: 24, h: 74, tone: "alaap" }); }
        else { barsNormal += S.bar({ x: x, y: 48, w: 24, h: 38, tone: "sys" }); }
      }
      b += S.node("shards-normal", barsNormal);
      b += S.node("shards-slow", barsSlow);
      b += S.text(150, 126, "100 shards, 12 drawn: 2 slow, each 1% of the time", "d-t-s");
      b += S.text(150, 148, "P(no shard is slow) = 0.99^100 ≈ 37%", "d-t");
      b += S.text(150, 168, "So ~63% of requests wait on a slow shard.", "d-t-b");
      return S.frame(600, 180, b);
    }
  };

  DIA.skew = {
    title: "Hashing spreads keys evenly. It does not spread traffic evenly.",
    cap: "<b>Skew is a key-choice problem, not bad luck.</b> Real usage is power-law: one customer, one scenario family, one hour of the day carries a disproportionate share. All of that key's events hash to one partition however good the hash is, and that partition becomes the ceiling for the whole system.",
    svg: function () {
      var b = "", i;
      var heights = [26, 22, 30, 24, 96, 20, 28, 25];
      b += S.box({ id: "requests", x: 20, y: 0, w: 140, h: 32, label: "All requests", tone: "flat", icon: "inbox" });
      b += S.arrow(164, 16, 196, 16, {});
      b += S.box({ id: "hash", x: 200, y: 0, w: 140, h: 32, label: "hash(user id)", tone: "sys", icon: "shuffle" });
      var bars = "", tags = "";
      for (i = 0; i < 8; i++) {
        var h = heights[i];
        var hot = h > 60;
        if (!hot) { bars += S.bar({ x: i * 60, y: 176 - h, w: 44, h: h, tone: "sys" }); }
        tags += S.text(i * 60 + 22, 192, "p" + i, "d-t-s", "middle");
      }
      b += S.node("partitions", bars + tags);
      b += S.box({ id: "hot-partition", x: 4 * 60, y: 176 - 96, w: 44, h: 96, tone: "alaap" });
      b += S.path("M0,80 L480,80", "flat", true);
      b += S.text(486, 84, "capacity", "d-t-x");
      b += S.arrow(220, 32, 40, 74, { id: "hash>partitions", label: "everyone else" });
      b += S.arrow(262, 32, 262, 78, { id: "hash>hot-partition", label: "one user, 4%", dash: true });
      b += S.text(0, 220, "Every other partition is idle. The system's throughput is now one partition's throughput.", "d-t-s");
      return S.frame(600, 238, b);
    }
  };

  DIA.storage = {
    title: "Two ways to write, and what each one costs you",
    cap: "<b>An LSM-tree appends.</b> Writes go to memory, then flush as sorted files, and merging is deferred to background compaction — so writes are cheap and a read may have to check several layers. <b>A B-tree updates in place.</b> Reads go straight to the right page; writes pay for random IO. Eval traces are written once, never updated, read in bulk — which is why they belong in object storage rather than in either.",
    svg: function () {
      var b = "";
      b += S.tag(0, 14, "LSM-tree — append");
      b += S.box({ x: 0, y: 24, w: 74, h: 34, label: "write", tone: "now" });
      b += S.arrow(78, 41, 108, 41, {});
      b += S.box({ x: 112, y: 24, w: 84, h: 34, label: "memtable", tone: "sys" });
      b += S.arrow(200, 41, 230, 41, { label: "flush" });
      b += S.bar({ x: 248, y: 26, w: 56, h: 30, tone: "sys" });
      b += S.bar({ x: 242, y: 23, w: 56, h: 32, tone: "sys" });
      b += S.box({ id: "sst-files", x: 230, y: 20, w: 76, h: 36, label: "SST", tone: "sys", icon: "layers" });
      b += S.text(230, 76, "sorted files, merged later", "d-t-s");
      b += S.text(430, 34, "cheap writes", "d-t-b");
      b += S.text(430, 50, "reads check layers", "d-t-s");

      b += S.tag(0, 116, "B-tree — update in place");
      b += S.box({ x: 112, y: 126, w: 84, h: 30, label: "root", tone: "math" });
      b += S.arrow(140, 158, 118, 178, {});
      b += S.arrow(168, 158, 190, 178, {});
      b += S.box({ x: 76, y: 180, w: 76, h: 30, label: "page", tone: "math" });
      b += S.box({ x: 162, y: 180, w: 76, h: 30, label: "page", tone: "math" });
      b += S.text(430, 152, "direct reads", "d-t-b");
      b += S.text(430, 168, "random-IO writes", "d-t-s");
      return S.frame(600, 222, b);
    }
  };

  DIA.retry = {
    title: "Retries arrive exactly when there is least capacity to serve them",
    cap: "<b>The retry storm.</b> A service slows, clients time out and retry, and the retries land on the thing that was already failing — so it never gets a recovery window. Backoff reduces the pressure; <b>jitter</b> is what stops every client returning in the same synchronised wave and recreating the spike.",
    svg: function () {
      var b = "", i;
      b += S.tag(0, 14, "Naive retry");
      b += S.box({ id: "clients", x: 0, y: 26, w: 90, h: 40, label: "Clients", tone: "flat", icon: "users" });
      b += S.box({ x: 250, y: 30, w: 96, h: 44, label: "Service", sub: "at capacity", tone: "alaap" });
      for (i = 0; i < 5; i++) {
        b += S.arrow(94, 30 + i * 9, 246, 46, { id: "clients>service" });
      }
      b += S.text(360, 46, "load rises as it degrades", "d-t-s");
      b += S.text(360, 64, "no recovery window", "d-t-b");

      b += S.tag(0, 132, "Backoff with jitter");
      b += S.box({ id: "clients", x: 0, y: 144, w: 90, h: 40, label: "Clients", tone: "flat", icon: "users" });
      b += S.box({ x: 250, y: 148, w: 96, h: 44, label: "Service", sub: "recovering", tone: "math" });
      var offs = [0, 26, 9, 41, 17];
      for (i = 0; i < 5; i++) {
        b += S.arrow(94, 148 + i * 9, 246, 164 + offs[i] * 0, { dash: true, id: "clients>service#2" });

      b += S.text(360, 164, "returns are spread out", "d-t-s");
      b += S.text(360, 182, "the spike never re-forms", "d-t-b");
      return S.frame(600, 206, b);
    }

  DIA.biasVarianceKnobs = {

  DIA.softmaxCrossEntropy = {
    title: "The gradient stays large for exactly as long as the prediction is wrong",
    cap: "<b>Cross-entropy does not flatten out while you are wrong.</b> Plotted against p, the softmax probability assigned to the true class, the loss −log(p) rises sharply as p falls toward zero, and the gradient magnitude (1−p) stays large right alongside it. Only once the model is both confident and correct does the gradient shrink toward zero — unlike squared error on a saturated unit, this loss keeps pushing until the answer is right.",
    svg: function () {
      var b = "", i, p, x;
      var lc = "", gc = "";
      for (i = 1; i <= 50; i++) {
        p = i / 50;
        x = 40 + p * 400;
        var loss = -Math.log(p);
        var yl = (150 - Math.min(140, loss * 40)).toFixed(1);
        var yg = (150 - (1 - p) * 130).toFixed(1);
        lc += (i === 1 ? "M" : " L") + x.toFixed(1) + "," + yl;

  DIA.lora = {
    title: "LoRA trains two small matrices instead of one big one; at inference they merge back into it for free.",

  DIA.turnTaking = {

        S.text(280, y + 34, "short, asks for nothing: not a turn", "d-t-x"));
      y = 312;
      b += S.node("interruption", S.text(0, y + 13, "Interruption", "d-t-s") +

  DIA.eventLoop = {
    title: "One event loop, many calls",
    cap: "<b>An asyncio event loop runs many calls on one thread by switching whenever a call awaits I/O.</b> Each call runs for a moment, then awaits audio frames, a model stream or a tool's HTTP reply, and the loop runs whichever call is ready. That only works while every call keeps awaiting: one call doing CPU work inline (VAD, resampling) holds the thread, and every call on the loop stalls with it. The fix moves that work off the loop, with asyncio.to_thread or run_in_executor on a thread or process pool, or into a separate worker process, so the loop stays free.",
    svg: function () {
      var b = "";
      var TONE = ["sys", "math", "iv"];
      function slices(xs, y, tone) { return xs.map(function (x) { return S.bar({ x: x, y: y, w: 16, h: 18, tone: tone }); }).join(""); }

      b += S.node("h-thread", S.text(0, 107, "Thread", "d-t-s") + H.map(function (xs, i) { return slices(xs, 94, TONE[i]); }).join(""));

      b += S.text(0, 136, "Blocking: call 1 runs VAD on the loop, and every call stalls", "d-t-b");
      b += S.node("b-cpu", S.text(0, 159, "Call 1", "d-t-s") + S.bar({ x: 110, y: 146, w: 260, h: 18, tone: "alaap" }) +

      b += S.text(0, 283, "Call 1", "d-t-s");
      b += S.box({ id: "f-call1", x: 110, y: 270, w: 16, h: 18, tone: "sys" });

      b += S.box({ id: "f-call1", x: 374, y: 270, w: 16, h: 18, tone: "sys" });

      b += S.node("f-others", S.text(0, 307, "Call 2", "d-t-s") + slices([150, 250, 330, 450, 550], 294, "math") +
        S.text(0, 331, "Call 3", "d-t-s") + slices([190, 290, 410, 510, 590], 318, "iv"));
      b += S.text(0, 355, "Pool", "d-t-s");
      b += S.box({ id: "f-pool", x: 130, y: 342, w: 240, h: 18, label: "VAD on a worker thread", tone: "math" });
      b += S.text(380, 355, "or a process pool, or a separate worker", "d-t-x");
      b += S.arrow(120, 290, 134, 340, {});
      b += S.arrow(366, 340, 380, 290, {});
      return S.frame(640, 370, b);
    }
  };

  DIA.idempotencyKey = {
    title: "A retry must not do it twice",
    cap: "<b>An idempotency key lets the server recognise a retry and answer it from the record instead of doing the work again.</b> The client sends the booking with a key. The server books the slot and stores the key with its result in the same transaction, so both happen or neither does. The response is lost, so the client retries with the same key; the server finds the key and returns the stored result, and the slot is booked once. With no key, the retry looks like a new request and books a second slot.",
    svg: function () {

      b += S.arrow(313, 131, 198, 131, { id: "server>lost", dash: true, label: "201, booking 42" });
      b += S.box({ id: "lost", x: 120, y: 118, w: 74, h: 26, label: "lost", tone: "alaap", icon: "x" });
      b += S.text(67, 162, "the client times out and cannot tell if it booked", "d-t-s");
      b += S.arrow(555, 128, 555, 202, { id: "tx>ledger" });
      b += S.text(547, 170, "writes the row", "d-t-s", "end");
      b += S.node("ledger", '<rect x="440" y="204" width="200" height="52" rx="0" class="d-fill-math d-str-math" stroke-width="1.25"/>' +
        '<path d="M440,226 L640,226" class="d-str-math" stroke-width="1"/>' +
        S.text(452, 220, "key", "d-t-x") + S.text(494, 220, "status", "d-t-x") + S.text(556, 220, "result", "d-t-x") +
        S.text(452, 245, "k7", "d-t") + S.text(494, 245, "done", "d-t") + S.text(556, 245, "booking 42", "d-t"));
      b += S.arrow(67, 196, 313, 196, { id: "client>server#2", label: "retry, same key k7" });

      b += S.text(0, 312, "Without a key", "d-t-b");
      b += S.box({ id: "nokey", x: 0, y: 322, w: 300, h: 44, label: "Retry with no key", sub: "the server cannot tell it is a repeat", tone: "alaap" });

      b += S.box({ id: "twice", x: 360, y: 322, w: 280, h: 44, label: "Two bookings at 3 pm", sub: "booking 42 and booking 43", tone: "alaap", icon: "triangle-alert" });
      return S.frame(640, 376, b);
    }
  };

  return { S: S, DIA: DIA, slug: slug };
})();

</script>
<script>

     "code": "\n@dataclass\nclass Chunk:\n    text: str\n    page: int\n    section: str\n    chunk_id: int\n\ndef chunk_blocks(blocks: list[Block], max_chars: int = 160, overlap_chars: int = 30) -> list[Chunk]:\n    chunks = []\n    cid = 0\n    for block in blocks:\n        text = block.text\n        start = 0\n        while start < len(text):\n            end = start + max_chars\n            piece = text[start:end]\n            chunks.append(Chunk(piece, block.page, block.section, cid))\n            cid += 1\n            if end >= len(text):\n                break\n            start = end - overlap_chars\n    return chunks\n"

    "Many sources: start the queue with all of them.",
    "O(V + E)."
   ]
  },
  "dfs": {
   "title": "DFS",
   "pop": "graphs",
   "at": 1,
   "ex": {
    "i": "edges 1-2, 3-4; count pieces",
    "o": "2",
    "w": ""
   },
   "spot": "Explore everything; components, paths, cycles.",
   "code": "def dfs(u):\n    seen.add(u)\n    for v in g[u]:\n        if v not in seen:\n            dfs(v)",
   "notes": [
    "Iterative: a stack instead of the call stack.",
    "Directed cycle: meeting a node still on the path.",
    "Past 1,000 deep: go iterative. O(V + E)."
   ]
  },
  "topo": {
   "title": "Topological sort",
   "pop": "order",
   "at": 1,
   "ex": {
    "i": "0 -> 1, 0 -> 2, 1 -> 3, 2 -> 3",
    "o": "[0, 1, 2, 3]",
    "w": ""
   },
   "spot": "Prerequisites; build order; can all finish.",
   "code": "q = deque(u for u in range(n) if indeg[u] == 0)\norder = []\nwhile q:\n    u = q.popleft()\n    order.append(u)\n    for v in g[u]:\n        indeg[v] -= 1\n        if indeg[v] == 0:\n            q.append(v)",
   "notes": [
    "len(order) &lt; n means a cycle.",
    "DFS version: post-order, reversed. O(V + E)."
   ]
  },
  "dijkstra": {
   "title": "Dijkstra",
   "pop": "order",
   "at": 2,
   "ex": {
    "i": "a-b 1, b-c 2, a-c 4, from a",
    "o": "c = 3",
    "w": ""
   },
   "spot": "Cheapest path; non-negative weights.",
   "code": "dist, h = {s: 0}, [(0, s)]\nwhile h:\n    d, u = heapq.heappop(h)\n    if d > dist[u]: continue   # stale\n    for v, w in g[u]:\n        if d + w < dist.get(v, inf):\n            dist[v] = d + w\n            heapq.heappush(h, (d + w, v))",
   "notes": [
    "Negative weights: Bellman-Ford, n - 1 rounds.",
    "At most k stops: Bellman-Ford, k + 1 rounds.",
    "O(E log V)."
   ]
  },
  "uf": {
   "title": "Union-find",
   "pop": "order",
   "at": 0,
   "ex": {
    "i": "union(0, 1), union(1, 2); find(0) == find(2)",
    "o": "True",
    "w": ""
   },
   "spot": "Are these connected; merge groups; redundant edge.",
   "code": "def find(x):\n    while parent[x] != x:\n        parent[x] = parent[parent[x]]\n        x = parent[x]\n    return x\n\ndef union(a, b):\n    ra, rb = find(a), find(b)\n    if ra == rb: return False   # a cycle\n    parent[ra] = rb\n    return True",
   "notes": [
    "parent = list(range(n)) to start.",
    "Components = n minus successful unions.",
    "Nearly O(1) per call."
   ]
  },
  "kadane": {
   "title": "Kadane's: max subarray",
   "pop": "dp",
   "at": 5,
   "ex": {
    "i": "[-2, 1, -3, 4, -1, 2, 1, -5, 4]",
    "o": "6",
    "w": "[4, -1, 2, 1]"
   },
   "spot": "Best contiguous sum.",
   "code": "best = cur = a[0]\nfor x in a[1:]:\n    cur = max(x, cur + x)   # extend, or restart at x\n    best = max(best, cur)",
   "notes": [
    "Max product: track the min too; a negative flips them.",
    "Circular: total minus the min subarray. O(n), O(1)."
   ]
  },
  "sorting": {
   "title": "Sorting and selection",
   "pop": "heap",
   "at": 1,
   "ex": {
    "i": "[3, 2, 1, 5, 6, 4], kth largest, k = 2",
    "o": "5",
    "w": ""
   },
   "spot": "Sort to expose order; select without a full sort.",
   "code": "def merge_sort(a):\n    if len(a) <= 1: return a\n    m = len(a) // 2\n    l, r = merge_sort(a[:m]), merge_sort(a[m:])\n    out, i, j = [], 0, 0\n    while i < len(l) and j < len(r):\n        if l[i] <= r[j]: out.append(l[i]); i += 1\n        else: out.append(r[j]); j += 1\n    return out + l[i:] + r[j:]",
   "notes": [
    "sorted() is Timsort: stable, O(n log n).",
    "Kth: quickselect, O(n) average; or a heap of k.",
    "Small values: counting sort, O(n + k)."
   ]
  }
 },
 "extra": {
  "tools": {
   "title": "Python you reach for",
   "code": "Counter(a).most_common(k)\ndefaultdict(list); deque().popleft()\nheapq.heappush / heappop / nlargest\nbisect_left(a, x)\nsorted(a, key=lambda p: (p[1], -p[0]))\n@functools.cache\nitertools.combinations / accumulate",
   "notes": [
    "float('inf'); divmod(a, b); ''.join(parts)."
   ]
  },
  "edge": {
   "title": "Edge cases to say",
   "notes": [
    "Empty input; one element; all the same.",
    "Negatives and zero; duplicates.",
    "Already sorted, or reversed.",
    "Off by one: r - l + 1, lo &le; hi.",
    "Deep recursion past 1,000: go iterative.",
    "Strings: case, spaces, unicode."
   ]
  },
  "traps": {
   "title": "Python traps",
   "notes": [
    "[[0] * m] * n shares rows: use a comprehension.",
    "def f(x=[]) shares the list across calls.",
    "list.pop(0) is O(n): use deque.",
    "s += c in a loop is O(n<sup>2</sup>): use join.",
    "-7 // 2 is -4: floor division.",
    "Don't mutate a list while looping over it."
   ]
  }
 },
 "sheets": [
  {
   "id": "algorithms",
   "title": "Algorithms",
   "order": [
    "hashing",
    "prefix",
    "pointers",
    "window",
    "stack",
    "binary",
    "linked",
    "trees",
    "heap",
    "intervals",
    "bfs",
    "dfs",
    "topo",
    "dijkstra",
    "uf",
    "dp",
    "kadane",
    "backtrack",
    "sorting",
    "tools",
    "edge",
    "traps"
   ]
  },
  {
   "id": "ai",
   "title": "AI systems",
   "order": [
    "numpy",
    "torch",
    "embed",
    "rag",
    "graphrag",
    "agent",
    "research",
    "voice",
    "transformer",
    "bpe",
    "evals",
    "structured",
    "serving",
    "lora",
    "ai"
   ]
  }
 ]
};

<script>
/* The coding cheat sheet and the side-by-side popup, shared by CODING.html and CHEATSHEET.html.
   Data is window.CODING from coding/data.js. Exposes window.CS for the pages. */
(function () {
  "use strict";
  var D = window.CODING, byId = {};
  D.patterns.forEach(function (p) { byId[p.id] = p; });

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  // Plain text with `code` spans.
  function md(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }

  // A small Python highlighter: comments, strings, numbers, keywords, names after def or class, builtins.
  var KW = /^(def|class|return|if|elif|else|for|while|in|not|and|or|is|import|from|as|with|yield|lambda|pass|break|continue|try|except|finally|raise|None|True|False|nonlocal|global|del|assert|async|await)$/;
  var BI = /^(len|range|enumerate|min|max|sorted|set|dict|list|tuple|sum|zip|print|float|int|str|abs|any|all|map|isinstance|super|self)$/;
  function hl(src) {
    var re = /(#[^\n]*)|([rbf]?"(?:[^"\\\n]|\\.)*"|[rbf]?'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
    var out = "", last = 0, prev = "", m;
    while ((m = re.exec(src))) {
      var t = m[0];
      var cls = m[1] ? "tc" : m[2] ? "ts" : m[3] ? "tn" : KW.test(t) ? "tk" : (prev === "def" || prev === "class") ? "tf" : BI.test(t) ? "tb" : "";
      out += esc(src.slice(last, m.index)) + (cls ? '<span class="' + cls + '">' + esc(t) + "</span>" : esc(t));
      last = re.lastIndex;
      if (m[4]) { prev = t; }
    }
    return out + esc(src.slice(last));
  }
  function exLine(ex, short) {
    if (!ex) { return ""; }
    return '<span class="ex-in">' + esc(ex.i) + '</span><span class="ex-arrow">&rarr;</span><span class="ex-out">' + esc(ex.o) + "</span>" +
      (ex.w && !short ? '<span class="ex-w">' + esc(ex.w) + "</span>" : "");
  }
  // A worked example as aligned rows: Input, Output and, when there is one, Why.
  function ioHtml(e) {
    var why = e.why || e.w;
    return '<div class="io"><span class="k">Input</span><code>' + esc(e.i) + '</code><span class="k">Output</span><code>' + esc(e.o) + "</code>" +
      (why ? '<span class="k">Why</span><span>' + md(why) + "</span>" : "") + "</div>";
  }
  // One part on the label rail: a small label, then the part.
  function row(label, html, cls) {
    return '<div class="r' + (cls ? " " + cls : "") + '"><div class="rl">' + label + '</div><div class="rv">' + html + "</div></div>";
  }
  // A full statement: the problem, two worked examples, constraints; then the extra parts ([label, html] pairs).
  function stHtml(st, extra) {
    var h = "";
    if (st) {
      h += row("Problem", String(st.p).split(/\n\s*\n/).map(function (x) { return "<p>" + md(x) + "</p>"; }).join(""));
      h += (st.ex || []).map(function (e, i) { return row("Example " + (i + 1), ioHtml(e), "r-ex"); }).join("");
      if (st.k && st.k.length) { h += row("Constraints", "<ul>" + st.k.map(function (k) { return li(md(k)); }).join("") + "</ul>"); }
    }
    h += (extra || []).map(function (r) { return row(r[0], r[1], r[2]); }).join("");
    return h ? '<div class="st">' + h + "</div>" : "";
  }
  // A problem or variation: its statement, or, without one, its task and its one example; then the extra parts.
  function partsHtml(q, extra) {
    var rows = q.st ? [] : [q.task && ["Problem", "<p>" + md(q.task) + "</p>"], q.ex && ["Example", ioHtml(q.ex), "r-ex"]];
    return stHtml(q.st, rows.filter(Boolean).concat(extra || []));
  }
  // A shared figure from figures/figures.js, when the page loads the registry.
  function figHtml(key) {
    var f = window.FIGURES && window.FIGURES.DIA[key];
    if (!f) { return ""; }
    return '<figure class="cfig" data-fig="' + esc(key) + '"><div class="fig-svg">' + f.svg() + "</div><figcaption>" + f.cap + "</figcaption></figure>";
  }
  function li(t) { return "<li>" + t + "</li>"; }

  // A card: patterns and AI topics open their own popup; algorithm cards open a pattern at an item.
  function cardHtml(key) {
    var p = byId[key], c = p ? p.sheet : (D.algo[key] || D.extra[key]);
    if (!c) { return ""; }
    var target = p ? key : c.pop || "x:" + key, ex = p ? p.ex : c.ex;
    var h = target ? '<div class="cs-card cs-click" data-pop="' + target + '" data-at="' + (c.at || 0) + '" tabindex="0" role="button">' : '<div class="cs-card">';
    h += "<h3>" + esc(p ? p.title : c.title) + "</h3>";
    if (ex) { h += '<p class="cs-ex">' + exLine(ex, true) + "</p>"; }
    if (c.spot) { h += '<p><span class="cs-l">Spot</span>' + c.spot + "</p>"; }
    if (c.move) { h += '<p><span class="cs-l">Move</span>' + c.move + "</p>"; }
    if (c.code) { h += "<pre>" + hl(c.code) + "</pre>"; }
    // On a wide screen a clickable card keeps its sharpest nuance; a phone shows them all.
    if (c.notes) { h += "<ul>" + c.notes.map(function (n, i) { return "<li" + (target && i ? ' class="more"' : "") + ">" + n + "</li>"; }).join("") + "</ul>"; }
    return h + "</div>";
  }

  // Mount a sheet: tabs (one per D.sheets entry) and a grid that fits one screen on a wide display.
  function mountSheet(root) {
    var tabs = root.querySelector(".cs-tabs"), grid = root.querySelector(".cs-grid"), cur = D.sheets[0].id, timer = null;
    tabs.innerHTML = D.sheets.map(function (s) { return '<button type="button" data-s="' + s.id + '">' + esc(s.title) + "</button>"; }).join("");
    function fit() {
      root.style.fontSize = "";
      grid.style.columnCount = "";
      // A phone upright scrolls one readable column; on its side the cards become tiles on one screen.
      var w = window.innerWidth, h = window.innerHeight, upright = w <= 760 && h > w, sideways = h <= 560 && w > h;
      root.classList.toggle("scroll", upright);
      root.classList.toggle("compact", sideways);
      grid.style.gridTemplateColumns = "";
      if (root.hidden || upright) { return; }
      if (sideways) {
        // A phone on its side: every card a tile, all on one screen with no scrolling; a tap opens notes and code.
        var n = grid.children.length, rows = Math.max(1, Math.floor((grid.clientHeight - 8) / 56));
        grid.style.gridTemplateColumns = "repeat(" + Math.ceil(n / Math.min(rows, n)) + ", minmax(0, 1fr))";
        return;
      }
      var f = parseFloat(getComputedStyle(root).fontSize), cols = [6, 7, 8];
      function fits() { return grid.scrollWidth <= grid.clientWidth + 1; }
      // The largest font that fits in six, seven or eight columns.
      for (; f >= 8.5; f -= 0.25) {
        root.style.fontSize = f + "px";
        for (var i = 0; i < cols.length; i++) {
          grid.style.columnCount = cols[i];
          if (fits()) { return; }
        }
      }
    }
    function show(id) {
      var s = D.sheets.filter(function (x) { return x.id === id; })[0] || D.sheets[0];
      cur = s.id;
      grid.innerHTML = s.order.map(cardHtml).join("");
      grid.scrollTop = 0;
      tabs.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-s") === cur); });
      try { localStorage.setItem("coding.sheet", cur); } catch (e) { /* storage unavailable */ }
      fit();
    }
    tabs.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { show(b.getAttribute("data-s")); } });
    window.addEventListener("resize", function () { clearTimeout(timer); timer = setTimeout(fit, 120); });
    try { document.fonts.ready.then(fit); } catch (e) { /* no font loading API */ }
    var saved = null;
    try { saved = localStorage.getItem("coding.sheet"); } catch (e) { /* storage unavailable */ }
    show(saved || cur);
    return { fit: fit, show: show };
  }

  // The popup.
  var pop = null, popIn, popL, popR, items = [], at = 0, lastFocus = null;
  function pane(which) {
    popIn.classList.toggle("show-r", which === "r");
    pop.querySelectorAll(".pop-bar button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-pane") === which); });
  }
  function ensurePop() {
    if (pop) { return; }
    pop = document.createElement("div");
    pop.className = "pop";
    pop.hidden = true;
    pop.innerHTML = '<div class="pop-in" role="dialog" aria-modal="true" aria-label="Side by side"><div class="pop-bar"><button type="button" data-pane="l" class="on">Notes</button>' +
      '<button type="button" data-pane="r">Code</button></div><div class="pop-l"></div><div class="pop-r"></div><button type="button" class="pop-x">Close</button></div>';
    document.body.appendChild(pop);
    popIn = pop.querySelector(".pop-in");
    popL = pop.querySelector(".pop-l");
    popR = pop.querySelector(".pop-r");
    popL.addEventListener("click", function (e) {
      var b = e.target.closest(".pi");
      if (b) { pick(+b.getAttribute("data-i")); pane("r"); }
      if (e.target.closest(".pl-foot a")) { closePop(); }
    });
    pop.querySelector(".pop-bar").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { pane(b.getAttribute("data-pane")); } });
    pop.addEventListener("click", function (e) { if (e.target === pop) { closePop(); } });
    pop.querySelector(".pop-x").addEventListener("click", closePop);
  }
  function openPop(key, start) {
    if (key.indexOf("x:") === 0) { openRef(D.extra[key.slice(2)]); return; }
    var p = byId[key];
    if (!p) { return; }
    ensurePop();
    lastFocus = document.activeElement;
    function btn(i) {
      var it = items[i], sub = it.ex ? it.ex.i + " → " + it.ex.o : it.t || it.chg || "";
      return '<button type="button" class="pi" data-i="' + i + '"><b>' + esc(it.n) + "</b><span>" + esc(sub) + "</span></button>";
    }
    var h = "<h2>" + esc(p.title) + '</h2><p class="spot">' + p.spot + "</p>" + (p.ex ? stHtml(null, [["Example", ioHtml(p.ex), "r-ex"]]) : "");
    if (p.parts) {
      items = [{ kind: "End to end", n: "End to end", ex: p.ex, t: p.cx, code: p.tpl, fig: (p.figs || [])[0], hld: p.hld }]
        .concat(p.parts.map(function (c) { return { kind: "Component", n: c.n, t: c.t, code: c.code }; }))
        .concat(p.vars.map(function (v) { return { kind: "Variation", n: v.n, ex: v.ex, chg: v.t, code: v.code, st: v.st }; }));
      h += '<h4>What to remember</h4><ul class="nu">' + p.remember.map(function (r) { return li(md(r)); }).join("") + "</ul>" +
        "<h4>They will ask</h4>" + p.asks.map(function (a) { return '<details class="ask"><summary>' + md(a.q) + "</summary><p>" + md(a.a) + "</p></details>"; }).join("") +
        "<h4>The whole thing</h4>" + btn(0) +
        "<h4>Components</h4>" + p.parts.map(function (c, i) { return btn(1 + i); }).join("") +
        "<h4>Variations</h4>" + p.vars.map(function (v, i) { return btn(1 + p.parts.length + i); }).join("");
    } else {
      items = [{ kind: "The template", n: "Template", ex: p.ex, t: p.sheet.move ? "<b>The move.</b> " + p.sheet.move : p.sheet.spot, th: true, code: p.tpl, c: p.cx }]
        .concat(p.probs.map(function (q) { return { kind: "Classic problem", n: q.n, ex: q.ex, task: q.task, st: q.st, hint: q.hint, code: q.sol, c: q.c }; }))
        .concat(p.vars.map(function (v) { return { kind: "Variation", n: v.n, ex: v.ex, chg: v.t, st: v.st, code: v.code }; }));
      h += '<h4>Nuances</h4><ul class="nu">' + p.sheet.notes.map(li).join("") + li(esc(p.cx)) + "</ul>" +
        "<h4>The core</h4>" + btn(0) +
        "<h4>Classic problems</h4>" + p.probs.map(function (q, i) { return btn(1 + i); }).join("") +
        "<h4>Variations</h4>" + p.vars.map(function (v, i) { return btn(1 + p.probs.length + i); }).join("");
    }
    h += '<p class="pl-foot">Up and down arrows move; Esc closes. <a href="' + CS.pageBase + "#" + p.id + '"' + (/^https?:/.test(CS.pageBase) ? ' target="_blank" rel="noopener"' : "") + ">Open on the page</a></p>";
    popL.innerHTML = h;
    pop.hidden = false;
    document.body.style.overflow = "hidden";
    popL.scrollTop = 0;
    pick(start || 0);
    pane(start ? "r" : "l");
    pop.querySelector(".pop-x").focus();
  }
  // A reference card (Python tools, edge cases, traps): its notes on the left, its code, if any, on the right.
  function openRef(c) {
    if (!c) { return; }
    ensurePop();
    lastFocus = document.activeElement;
    items = [{ kind: "Reference", n: c.title, t: "", code: c.code || "" }];
    popL.innerHTML = "<h2>" + esc(c.title) + '</h2><ul class="nu">' + (c.notes || []).map(li).join("") + "</ul>";
    pop.hidden = false;
    document.body.style.overflow = "hidden";
    pick(0);
    pane("l");
    pop.querySelector(".pop-x").focus();
  }
  function pick(i) {
    at = Math.max(0, Math.min(items.length - 1, i));
    var it = items[at], extra = [];
    if (it.hint) { extra.push(["Hint", esc(it.hint)]); }
    if (it.chg) { extra.push(["What changes", md(it.chg)]); }
    popR.innerHTML = "<h3>" + esc(it.n) + (it.kind.toLowerCase().indexOf(it.n.toLowerCase()) < 0 ?'<span class="pr-kind">' + it.kind.toLowerCase() + "</span>" : "") + "</h3>" +
      (it.t ? '<p class="pr-t">' + (it.th ? it.t : md(it.t)) + "</p>" : "") + partsHtml(it, extra) +
      (it.hld ? '<ol class="nu">' + it.hld.map(function (x) { return li(md(x)); }).join("") + "</ol>" : "") +
      (it.fig ? figHtml(it.fig) : "") + (it.code ? "<pre><code>" + hl(it.code) + "</code></pre>" : "") + (it.c ? '<p class="cx">' + esc(it.c) + "</p>" : "");
    popL.querySelectorAll(".pi").forEach(function (b) { b.classList.toggle("on", +b.getAttribute("data-i") === at); });
    var on = popL.querySelector(".pi.on");
    if (on && on.scrollIntoView) { on.scrollIntoView({ block: "nearest" }); }
    popR.scrollTop = 0;
  }
  function closePop() {
    if (!pop || pop.hidden) { return; }
    pop.hidden = true;
    document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) { /* gone */ } }
    if (CS.onPopClose) { CS.onPopClose(); }
  }
  function popOpen() { return !!pop && !pop.hidden; }

  document.addEventListener("click", function (e) {
    var t = e.target.closest && e.target.closest("[data-pop]");
    if (t && !t.closest(".pop")) { e.preventDefault(); openPop(t.getAttribute("data-pop"), +(t.getAttribute("data-at") || 0)); }
  });
  document.addEventListener("keydown", function (e) {
    if (popOpen()) {
      if (e.key === "Escape") { closePop(); e.preventDefault(); }
      else if (e.key === "ArrowDown") { pick(at + 1); e.preventDefault(); }
      else if (e.key === "ArrowUp") { pick(at - 1); e.preventDefault(); }
      return;
    }
    var t = e.target;
    if (e.key === "Enter" && t && t.getAttribute && t.getAttribute("data-pop")) { openPop(t.getAttribute("data-pop"), +(t.getAttribute("data-at") || 0)); }
  });

  function fullScreen() {
    // The whole document, so the popup stays visible over the sheet.
    try { if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); } else { document.exitFullscreen(); } } catch (e) { /* not supported */ }
  }

  var CS = window.CS = { data: D, byId: byId, esc: esc, md: md, hl: hl, exLine: exLine, ioHtml: ioHtml, stHtml: stHtml, partsHtml: partsHtml, figHtml: figHtml, cardHtml: cardHtml,
    mountSheet: mountSheet, openPop: openPop, closePop: closePop, popOpen: popOpen, fullScreen: fullScreen, pageBase: "", onPopClose: null };
